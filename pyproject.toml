[project]
name = "aeat"
version = "0.1.0"
description = "Spanish tax authority (AEAT) automation - tax information and filing tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "wgergely" },
]
keywords = ["aeat", "tax", "spain", "hacienda", "impuestos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    # LLM providers
    "anthropic>=0.74.1",
    # Google Cloud / Workspace
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.3.1",
    "gspread>=6.2.1",
    "google-cloud-storage>=3.10.1",
    "google-cloud-functions>=1.20.0",
    "google-cloud-run>=0.10.18",
    # CLI
    "typer>=0.20.0",
    "rich>=14.2.0",
    # Browser automation
    "playwright>=1.58.0",
    # Data validation & models
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",
    # HTTP client
    "httpx>=0.28.1",
    # HTML parsing (status reader, #43)
    "beautifulsoup4>=4.12",
    # IANA tz database (bundled on Linux/macOS, missing on Windows
    # CPython — required by aeat.status._parsers.expedientes to
    # localise AEAT timestamps to Europe/Madrid).
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    # PKCS#12 parsing for client-certificate auth (#8)
    "cryptography>=46.0.7",
    # Configuration
    "python-dotenv>=1.2.2",
    "vaultspec-core>=0.1.8",
    # Persistence
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # PDF parsing (#44 justificante)
    "pdfplumber>=0.11.9",
    # Financial ingest (#73)
    "ofxparse>=0.21",
    "openpyxl>=3.1.5",
]

[project.scripts]
aeat = "aeat.cli:app"

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Repository = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeat"]

# ── uv ───────────────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.1a1",
    "prek>=0.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    # Used only to generate synthetic fixture PDFs in tests (#44).
    "reportlab>=4.4.10",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]
# `password_env_var` is an env-var NAME, not a password; S106 false-positives
# on cert-auth tests. Test modules also commonly use assert and print.
"src/aeat/auth/test_*.py" = ["S101", "S105", "S106", "T20"]
# `certificate_password_secret_var_name` is the NAME of an env var, not a
# password. `_PASSWORD_COMMENT_PREFIX` is a file-format prefix, not a secret.
"src/aeat/setup/_env_writer.py" = ["S105"]
"src/aeat/setup/test_*.py" = ["S101", "S105", "S106", "T20"]
# Typer requires `typer.Argument(...)` / `typer.Option(...)` literally inside
# parameter defaults; B008 flags this idiom but it is the documented usage.
"src/aeat/cli/**/*.py" = ["B008"]
"src/aeat/models/_cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty ───────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "gspread",
    "googleapiclient",
    "google.auth",
    "google.oauth2",
    "google.cloud",
    "google_auth_oauthlib",
    "playwright",
    "typer",
    "rich",
    "playwright_stealth",
    "bs4",
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "_test_*.py"]
addopts = "-v --tb=short -m 'unit'"
markers = [
    "unit: deterministic tests with no external I/O; mocks/stubs permitted per CLAUDE.md",
    "live_read: opt-in tests that READ from a real external service (covers Google scratch round-trips; see tests/README.md)",
    "live_write: opt-in tests that WRITE to a real external service; collection-banned by default (charter #116 R1)",
    "domain_aeat_remote: exercises AEAT Sede Electronica read paths (auth, browser, casillas, inbox, justificante, portals, status, sync)",
    "domain_submission: exercises the AEAT-write-capable submission boundary (filing, submission)",
    "domain_financial_input: exercises financial ingest (financial, cli/financial)",
    "domain_local_state: exercises on-disk catalogues and local SQLite mirror (storage, models, normatives, manuals, corpus, schema, deadlines, cli/deadlines)",
    "domain_mediation: exercises workflow orchestration, LLM, i18n, testing subpackages",
    "domain_infra: exercises project plumbing (root modules, non-domain cli, setup, top-level tests/*.py)",
]
