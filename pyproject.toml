[project]
name = "aeat"
version = "0.1.0"
description = "Spanish tax authority (AEAT) automation - tax information and filing tools"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  { name = "wgergely" },
]
keywords = ["aeat", "hacienda", "impuestos", "spain", "tax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "alembic>=1.14.0",
  # LLM providers
  "anthropic>=0.74.1",
  # Argon2id KDF for the file-fallback master-key provider's
  # passphrase-to-KEK derivation (wave-12). OWASP-current top-tier
  # password-hashing primitive; ships pre-built wheels for
  # Linux/macOS/Windows.
  "argon2-cffi>=23.1.0",
  # HTML parsing (status reader, #43)
  "beautifulsoup4>=4.12",
  # PKCS#12 parsing for client-certificate auth (#8)
  "cryptography>=47.0.0",
  # Google Cloud / Workspace
  "google-api-python-client>=2.194.0",
  "google-auth>=2.49.1",
  "google-auth-httplib2>=0.3.1",
  "google-auth-oauthlib>=1.3.1",
  "google-cloud-functions>=1.20.0",
  "google-cloud-run>=0.10.18",
  "google-cloud-storage>=3.10.1",
  "gspread>=6.2.1",
  # HTTP client
  "httpx>=0.28.1",
  # OS-keychain abstraction for the master-key provider (Windows
  # Credential Manager, macOS Keychain, Linux Secret Service via
  # libsecret). Pure-Python, gracefully degrades when no usable backend
  # is detected; the substrate's file fallback covers headless / CI.
  "keyring>=25.6.0",
  # Financial ingest (#73)
  "ofxparse>=0.21",
  "openpyxl>=3.1.5",
  # PDF parsing (#44 justificante)
  "pdfplumber>=0.11.9",
  # PDF sanitiser (#239) — content-stream rewriter for PII redaction.
  "pikepdf>=10.0.0",
  # Browser automation
  "playwright>=1.58.0",
  # Data validation & models
  "pydantic>=2.12.5",
  "pydantic-settings>=2.9.1",
  # Configuration
  "python-dotenv>=1.2.2",
  "rich>=14.2.0",
  # Persistence
  "sqlalchemy>=2.0.36",
  # CLI
  "torch>=2.4",
  "typer>=0.20.0",
  # IANA tz database (bundled on Linux/macOS, missing on Windows
  # CPython — required by aeat.status._parsers.expedientes to
  # localise AEAT timestamps to Europe/Madrid).
  "tzdata>=2026.2 ; sys_platform == 'win32'",
]

[project.scripts]
aeat = "aeat.entrypoints.cli:app"

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"
Repository = "https://github.com/wgergely/aeat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeat"]
# The recovery-key BIP-39 wordlist is shipped as package data so
# `importlib.resources.files()` can locate it at runtime in installed
# wheels.
include = [
  "src/aeat/adapters/persistence/storage/master_key/_bip39_wordlist.txt",
]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
# tree-sitter-language-pack 1.6.3 (2026-04-23) shipped wheels only for cp312 and
# cp314; cp313 (our interpreter) has no wheel and no sdist. Pin below 1.6.3 until
# upstream restores cp313 support.
override-dependencies = [
  "tree-sitter-language-pack<1.6.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    {index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
[dependency-groups]
dev = [
  # Import-linter for layered-architecture boundary enforcement (#475/#476).
  # Contract definition lives in `.importlinter` at repo root; activated by
  # the Step 7 keystone PR when the hexagonal layout move lands.
  "import-linter>=2.0",
  "playwright>=1.58.0",
  "playwright-stealth>=2.0.3",
  "prek>=0.2.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.0.0",
  # Coverage measurement + fail-under gate — #15 ADR (unit only).
  "pytest-cov>=6.0.0",
  # httpx wire-shape assertions — #15 ADR (unit only; banned in live files).
  "pytest-httpx>=0.35.0",
  # Live browser harness — #15 ADR (live only).
  "pytest-playwright>=0.6.0",
  # Per-test retries for genuinely flaky live endpoints — #15 ADR (live only, opt-in per test).
  "pytest-rerunfailures>=15.0",
  # Parallel unit suite via opt-in `just test-parallel` — #15 ADR (unit only).
  "pytest-xdist>=3.6.0",
  # Used only to generate synthetic fixture PDFs in tests (#44).
  "reportlab>=4.4.10",
  "ruff>=0.15.12",
  # Snapshot diffing for registry/casilla behaviour — #15 ADR (both scopes).
  "syrupy>=4.7.0",
  # Wall-clock control for deadline/expedientes tests — #15 ADR (unit only; banned in live files).
  "time-machine>=2.16.0",
  "ty>=0.0.1a1",
  # Vault tooling — contributor-only; not imported by src/aeat/.
  "vaultspec-core>=0.1.14",
  "vaultspec-rag>=0.2.3",
  # Sphinx documentation pipeline — `just docs` builds HTML + Markdown from
  # the Google-style + Sphinx-cross-referenced docstrings under src/aeat/.
  "sphinx>=8.1",
  "sphinx-autodoc-typehints>=2.5",
  "sphinx-markdown-builder>=0.6",
  "furo>=2024.8",
  "myst-parser>=4.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "S",  # flake8-bandit (security)
  "T20",  # flake8-print
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports (enforces banned-api below) — #15 ADR
  "RUF",  # ruff-specific rules
]
ignore = [
  "S101",  # allow assert in tests
  "TID252",  # tolerate relative parent imports within subpackages; #15 + #162 require relative imports inside src/aeat/
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]
# `password_env_var` is an env-var NAME, not a password; S106 false-positives
# on cert-auth tests. Test modules also commonly use assert and print.
"src/aeat/adapters/outbound/aeat/auth/test_*.py" = [
  "S101",
  "S105",
  "S106",
  "T20"
]
# `certificate_password_secret_var_name` is the NAME of an env var, not a
# password. `_PASSWORD_COMMENT_PREFIX` is a file-format prefix, not a secret.
"src/aeat/application/setup/_env_writer.py" = ["S105"]
"src/aeat/application/setup/test_*.py" = ["S101", "S105", "S106", "T20"]
# Encrypted-column tests deliberately use literal "secret_text" / "secret_*"
# as column / attribute names; ruff's S105/S106 heuristic flags them as
# hardcoded passwords when they are in fact attribute identifiers.
"src/aeat/adapters/persistence/storage/_test_encrypted_columns.py" = [
  "S101",
  "S105",
  "S106"
]
"src/aeat/adapters/persistence/storage/master_key/_test_master_key.py" = [
  "S101",
  "S105",
  "S106"
]
# Redaction tests construct synthetic bearer-shaped strings to verify
# the rule patterns; ruff's S105 heuristic flags the synthetic literals.
"src/aeat/adapters/persistence/storage/_test_redaction.py" = [
  "S101",
  "S105",
  "S106"
]
"src/aeat/adapters/persistence/storage/_test_secret_store.py" = [
  "S101",
  "S105",
  "S106"
]
# Typer requires `typer.Argument(...)` / `typer.Option(...)` literally inside
# parameter defaults; B008 flags this idiom but it is the documented usage.
"src/aeat/entrypoints/cli/**/*.py" = ["B008"]
"src/aeat/domain/portals/_cli.py" = ["B008"]
# Curated multilingual label/help strings carry verbatim AEAT/BOE wordings
# that are routinely longer than 120 chars; line-wrapping a translation
# corrupts the text. The script's tail also prints a one-line summary
# when invoked directly.
"src/aeat/domain/casillas/_hydrate.py" = ["E501", "T201"]
# Curated multilingual help strings carry the same verbatim long-line
# constraint at the corpus-alignment-test level; the docstring also
# reuses the BOE-glossary union character ∪.
"src/aeat/domain/casillas/test_corpus_rule_alignment.py" = ["E501", "RUF002"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# #15 ADR: lock the project into pytest-only testing. See .vault/adr/2026-04-17-pytest-only-testing-adr.md.
"unittest".msg = "Project is pytest-only. Use pytest primitives — fixtures, parametrise, tmp_path. See tests/README.md."
"unittest.mock".msg = "Mocks are banned in live tests and discouraged in unit tests. Use real objects or fakes-as-classes. See tests/README.md."
"mock".msg = "Third-party 'mock' is banned for the same reason as unittest.mock. See tests/README.md."

# #162 — the relative-imports mandate is enforced by the custom
# scripts/check_relative_imports.py script, not by Ruff TID251. Ruff's
# banned-api resolves relative imports back to their absolute path
# before matching the banned prefix, which would flag every legitimate
# `from .module import X` inside src/aeat/ when `aeat` is banned.
# See .vault/adr/2026-04-17-relative-imports-adr.md.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty ───────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
allowed-unresolved-imports = [
  "gspread",
  "googleapiclient",
  "google.auth",
  "google.oauth2",
  "google.cloud",
  "google_auth_oauthlib",
  "playwright",
  "typer",
  "rich",
  "playwright_stealth",
  "bs4",
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "_test_*.py"]
addopts = "-v --tb=short -m 'unit' --strict-markers"
asyncio_mode = "strict"
markers = [
  "unit: deterministic tests with no external I/O; mocks/stubs permitted per CLAUDE.md",
  "live_read: opt-in tests that READ from a real external service (covers Google scratch round-trips; see tests/README.md)",
  "live_write: permanently forbidden external write-shaped tests; collection-dropped with no bypass",
  "domain_outbound: exercises AEAT Sede Electronica read paths (auth, browser, casillas, inbox, justificante, portals, status, sync)",
  "domain_submission: exercises local filing export, preflight, and historical submission records; no AEAT write surface",
  "domain_inbound: exercises financial ingest (financial, cli/financial)",
  "domain_persistence: exercises on-disk catalogues and local SQLite mirror (storage, models, normatives, manuals, corpus, registry, deadlines, cli/deadlines)",
  "domain_application: exercises workflow orchestration, LLM, i18n, testing subpackages",
  "domain_core: exercises project plumbing (root modules, non-domain cli, setup, top-level tests/*.py)",
  # Hexagonal layered markers — restructure ADR (#476) Test-marker realignment.
  "domain_inbound: exercises adapters.inbound.* (financial providers, borrador, declaracion, identity, sanitizer, pdf shared)",
  "domain_outbound: exercises adapters.outbound.* (aeat auth/browser/sede/export/verify, google, llm)",
  "domain_export: sub-marker on adapters.outbound.aeat.export.* (fichero-BOE serialise / verify pipelines)",
  "domain_persistence: exercises adapters.persistence.* (storage substrate)",
  "domain_model: exercises domain.* business model + computation (modelos, casillas, formulas, manuals, deadlines, profile, rental, ...)",
  "domain_application: exercises application.* use-cases / orchestration (filing, workflow, sync, setup, review, verification)",
  "domain_core: exercises core.* foundational cross-cutting (config, logging, errors, paths, observability, identity, i18n, env_io)",
  "flaky: opt-in retry via pytest-rerunfailures; live_read / live_write tests only — #15 ADR",
  "fixture_tier_l1: test uses committed or fetched public AEAT anchors (BOE / Manual práctico / Renta Web Open — EPIC #305 cluster C)",
  "fixture_tier_l2: test uses scrubbed private anchors from the user archive (contributor-local only — EPIC #305 cluster C)",
  "fixture_tier_l3: test uses synthetic generator output; no fixtures on disk (EPIC #305 cluster C)",
]

# ── Coverage (pytest-cov) — #15 ADR ──────────────────────────────────────────
[tool.coverage.run]
source = ["src/aeat"]
branch = true
omit = [
  "*/test_*.py",
  "*/_test_*.py",
  "*/tests/*",
]

[tool.coverage.report]
# Starting floor per #15 ADR. Ratchet upward in a follow-up ADR once the
# first real measurement is in. Never lower without a documented ADR update.
fail_under = 60
show_missing = true
skip_covered = false
