[project]
name = "aeat"
version = "0.1.0"
description = "Spanish tax authority (AEAT) automation - tax information and filing tools"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  { name = "wgergely" },
]
keywords = ["aeat", "hacienda", "impuestos", "spain", "tax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  # LLM providers
  "anthropic>=0.74.1",
  # Argon2id KDF for the file-fallback master-key provider's
  # passphrase-to-KEK derivation. OWASP-current top-tier
  # password-hashing primitive; ships pre-built wheels for
  # Linux/macOS/Windows.
  "argon2-cffi>=23.1.0",
  # HTML parsing for status readers.
  "beautifulsoup4>=4.12",
  # PKCS#12 parsing for client-certificate auth.
  "cryptography>=47.0.0",
  # XML parsing.
  "defusedxml>=0.7.1",
  # Google API client + OAuth flow for the Drive + Sheets integration
  # (ADR `2026-05-08-google-oauth-adr`). The Desktop OAuth client uses
  # loopback IP + PKCE via google-auth-oauthlib's InstalledAppFlow;
  # the storage provider drives Drive v3 / Sheets v4 through the
  # discovery client. google-auth-httplib2 is intentionally NOT pinned —
  # transport is satisfied by `requests` (transitive via google-auth).
  "google-auth>=2.50.0",
  "google-auth-oauthlib>=1.3.1",
  "google-api-python-client>=2.195.0",
  # In-process Excel-formula evaluator. Used by the schema-to-sheet
  # parity oracle to evaluate translated Sheets formulas locally and
  # assert exact-after-per-casilla-rounding identity against the
  # canonical Python calc engine. No network IO; runs in-process.
  "formulas>=1.2.0",
  # HTTP client
  "httpx>=0.28.1",
  # OS-keychain abstraction for the master-key provider (Windows
  # Credential Manager, macOS Keychain, Linux Secret Service via
  # libsecret). Pure-Python, gracefully degrades when no usable backend
  # is detected; the substrate's file fallback covers headless / CI.
  "keyring>=25.6.0",
  # Financial ingest.
  "ofxparse>=0.21",
  "openpyxl>=3.1.5",
  # PDF parsing for justificantes.
  "pdfplumber>=0.11.9",
  # Fast text extraction from official AEAT manual PDFs for registry
  # source-citation validation.
  "pypdfium2>=5.7.1",
  # PDF sanitiser; content-stream rewriter for PII redaction.
  "pikepdf>=10.0.0",
  # Browser automation
  "playwright>=1.58.0",
  # Data validation & models
  "pydantic>=2.12.5",
  "pydantic-settings>=2.9.1",
  # Interactive prompt backend for the wizard descriptor runtime.
  "questionary>=2.1.1",
  # Configuration
  "python-dotenv>=1.2.2",
  # CLI localization backend.
  "python-i18n>=0.3.9",
  "rich>=14.2.0",
  # Persistence
  "sqlalchemy>=2.0.36",
  # CLI
  "typer>=0.20.0",
  # IANA tz database (bundled on Linux/macOS, missing on Windows
  # CPython — required by aeat.status._parsers.expedientes to
  # localise AEAT timestamps to Europe/Madrid).
  "tzdata>=2026.2 ; sys_platform == 'win32'",
  "xlrd>=2.0.1",
]

[project.scripts]
aeat = "aeat.entrypoints.cli:main"

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"
Repository = "https://github.com/wgergely/aeat"

[project.optional-dependencies]
workbook-windows = [
  "pywin32>=311 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeat"]
# The recovery-key BIP-39 wordlist is shipped as package data so
# `importlib.resources.files()` can locate it at runtime in installed
# wheels.
include = [
  "src/aeat/adapters/persistence/storage/master_key/_bip39_wordlist.txt",
  "src/aeat/core/external_constants.toml",
]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
# tree-sitter-language-pack 1.6.3 (2026-04-23) shipped wheels only for cp312 and
# cp314; cp313 (our interpreter) has no wheel and no sdist. Pin below 1.6.3 until
# upstream restores cp313 support.
override-dependencies = [
  "tree-sitter-language-pack<1.6.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    {index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
[dependency-groups]
dev = [
  # Import-linter for layered-architecture boundary enforcement.
  # Contract definition lives in `.importlinter` at repo root; activated by
  # the architecture boundary checks.
  "import-linter>=2.0",
  "playwright>=1.58.0",
  "playwright-stealth>=2.0.3",
  "prek>=0.2.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.0.0",
  # Coverage measurement + fail-under gate for unit tests.
  "pytest-cov>=6.0.0",
  # httpx wire-shape assertions for unit tests; banned in live files.
  "pytest-httpx>=0.35.0",
  # Live browser harness.
  "pytest-playwright>=0.6.0",
  # Per-test retries for genuinely flaky live endpoints; live only, opt-in per test.
  "pytest-rerunfailures>=15.0",
  # Parallel unit suite via opt-in `just test-parallel`.
  "pytest-xdist>=3.6.0",
  # Used only to generate synthetic fixture PDFs in tests.
  "reportlab>=4.4.10",
  "ruff>=0.15.12",
  # Snapshot diffing for registry behaviour.
  "syrupy>=4.7.0",
  # Wall-clock control for deadline/expedientes tests; banned in live files.
  "time-machine>=2.16.0",
  "ty>=0.0.1a1",
  # Vault tooling — contributor-only; not imported by src/aeat/.
  "vaultspec-core>=0.1.18",
  "vaultspec-rag>=0.2.8",
  # Sphinx documentation pipeline — `just docs` builds HTML + Markdown from
  # the Google-style + Sphinx-cross-referenced docstrings under src/aeat/.
  "sphinx>=8.1",
  "sphinx-autodoc-typehints>=2.5",
  "sphinx-markdown-builder>=0.6",
  "furo>=2024.8",
  "myst-parser>=4.0",
  "types-defusedxml>=0.7.0.20260504",
  "types-openpyxl>=3.1.5.20260408",
  "types-reportlab>=4.4.10.20260408",
  "types-pyyaml>=6.0.12.20260510",
  "types-xlrd>=2.0.0.20260408",
  "types-pywin32>=311.0.0.20260508",
  "google-api-python-client-stubs>=1.36",
  "pyright>=1.1.409",
  "semgrep>=1.85.0",
  "radon>=6.0.1",
  "complexipy>=3.3.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "S",  # flake8-bandit (security)
  "T20",  # flake8-print
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports; enforces banned-api below
  "RUF",  # ruff-specific rules
]
ignore = [
  "S101",  # allow assert in tests
  "TID252",  # tolerate relative parent imports within subpackages
  "N813",  # `Translatable as tr` is the canonical i18n alias across the codebase
]

[tool.ruff.lint.per-file-ignores]
# Bundled test modules colocated under src/aeat/.
"src/aeat/**/test_*.py" = ["S101", "T20"]
"src/aeat/**/_test_*.py" = ["S101", "T20"]
"src/aeat/tests/**/*.py" = ["S101", "T20"]
# `tools/` holds contributor-only one-shot analysis scripts; print() is
# the canonical surface for these CLIs.
"tools/**/*.py" = ["T20"]
# `password_env_var` is an env-var NAME, not a password; S106 false-positives
# on cert-auth tests. Test modules also commonly use assert and print.
"src/aeat/adapters/outbound/aeat/auth/test_*.py" = [
  "S101",
  "S105",
  "S106",
  "T20"
]
# Google OAuth tests use synthetic OAuth client_secret + refresh_token
# literals as fixtures; ruff's S105/S106 heuristic flags every fake
# `GOCSPX-*` and `1//*` token even though they're documented test data.
"src/aeat/adapters/outbound/google/test_*.py" = [
  "S101",
  "S105",
  "S106",
  "T20"
]
# `_NAMESPACE_TOKEN` is a SecureObjectRepository namespace identifier,
# not a password literal; ruff's S105 misreads the constant name.
"src/aeat/adapters/outbound/google/_session_store.py" = ["S105"]
# Drive provider tests build long inline `_FakeFile(...)` fixtures with
# stable id + name + parents + payload tuples that read better on one
# line; E501 wrapping would obscure intent.
"src/aeat/adapters/outbound/storage/test_google_drive.py" = [
  "S101",
  "E501",
  "T20"
]
# Storage factory tests instantiate fake OAuthClient/OAuthToken records
# whose synthetic `client_secret` + `token_uri` + `refresh_token`
# values trip ruff's hardcoded-password heuristic.
"src/aeat/adapters/outbound/storage/test_factory.py" = [
  "S101",
  "S105",
  "S106",
  "E501",
  "T20"
]
# Google CLI tests use synthetic OAuth refresh_token + token_uri
# fixtures and emit long inline kwargs that are easier to read on one
# line than wrapped.
"src/aeat/entrypoints/cli/_config/test_google.py" = [
  "S101",
  "S105",
  "S106",
  "T20",
  "E501"
]
# `certificate_password_secret_var_name` is the NAME of an env var, not a
# password. `_PASSWORD_COMMENT_PREFIX` is a file-format prefix, not a secret.
"src/aeat/application/setup/_env_writer.py" = ["S105"]
"src/aeat/application/setup/test_*.py" = ["S101", "S105", "S106", "T20"]
# Encrypted-column tests deliberately use literal "secret_text" / "secret_*"
# as column / attribute names; ruff's S105/S106 heuristic flags them as
# hardcoded passwords when they are in fact attribute identifiers.
"src/aeat/adapters/persistence/storage/_test_encrypted_columns.py" = [
  "S101",
  "S105",
  "S106"
]
"src/aeat/adapters/persistence/storage/master_key/_test_master_key.py" = [
  "S101",
  "S105",
  "S106"
]
# Redaction tests construct synthetic bearer-shaped strings to verify
# the rule patterns; ruff's S105 heuristic flags the synthetic literals.
"src/aeat/adapters/persistence/storage/_test_redaction.py" = [
  "S101",
  "S105",
  "S106"
]
"src/aeat/adapters/persistence/storage/_test_secret_store.py" = [
  "S101",
  "S105",
  "S106"
]
# Typer requires `typer.Argument(...)` / `typer.Option(...)` literally inside
# parameter defaults; B008 flags this idiom but it is the documented usage.
"src/aeat/entrypoints/cli/**/*.py" = ["B008"]
"src/aeat/domain/portals/_cli.py" = ["B008"]

# ── Group G structural / domain-justified per-file-ignores ────────────────

# Package __init__ files defer submodule imports below module-level helpers
# to break circular imports. E402 (module-import-not-at-top) is structurally
# unavoidable here.
"src/aeat/application/auth/__init__.py" = ["E402"]
"src/aeat/core/errors/__init__.py" = ["E402"]
"src/aeat/core/errors/_registry.py" = ["E402"]
"src/aeat/entrypoints/cli/__init__.py" = ["E402"]
"src/aeat/entrypoints/cli/_config/__init__.py" = ["E402"]
# Mid-file imports in these modules sit after a forward-reference-resolving
# block; moving them to the top would re-introduce the circular import.
"src/aeat/application/workflow/_models.py" = ["E402"]
"src/aeat/domain/calculations/registry/_bindings.py" = ["E402"]
"src/aeat/domain/currency/test_service.py" = ["E402"]
"src/aeat/adapters/outbound/aeat/sede/test_groi_check.py" = ["E402"]

# AEAT corpus / form-spec strings carry mandatory Spanish typography
# (ambiguous unicode characters by RUF001/003 heuristic) and locale-aware
# label patterns. Treating these as defects would force lossy ASCII
# conversion of legal-source text.
"src/aeat/adapters/inbound/pdf/_label_regex.py" = ["RUF001", "RUF003"]
"src/aeat/adapters/outbound/google/_calc_sheets_apply.py" = ["RUF001"]
"src/aeat/application/storage/calc_sheets/_engine.py" = ["RUF001"]

# PDF scrubbing draws synthetic replacement bytes; the scrubber is local-
# only and the values never leave the operator host, so S311 (non-crypto
# random) is the correct primitive — random.Random is cheap and stable.
"src/aeat/adapters/inbound/pdf/_scrub.py" = ["S311"]

# Test fixtures construct synthetic env-var names / temp-file paths /
# subprocess invocations that ruff's S105/S106/S108/S603 heuristics
# misread as secrets or unsafe shell calls.
"src/aeat/adapters/persistence/storage/_test_path_safety.py" = ["S105"]
"src/aeat/adapters/persistence/storage/bucket/test_lockfile.py" = ["S603"]
"src/aeat/adapters/persistence/storage/test_substrate_smoke.py" = ["S603"]
"src/aeat/domain/calculations/registry/test_cross_domain_snapshot_registration.py" = ["S603"]
"src/aeat/adapters/persistence/storage/master_key/_master_key.py" = ["S105"]
"src/aeat/adapters/persistence/storage/crypto/_test_encrypted_columns.py" = ["S105", "S106"]
"src/aeat/adapters/outbound/aeat/browser/test_live_evasion.py" = ["S603"]
# `ATTRIBUTION_PASS_THROUGH` is a tax-routing verdict / enum value, not a
# password literal; ruff's S105 heuristic flags the constant name.
"src/aeat/application/overview/_applicability.py" = ["S105"]
"src/aeat/application/wizard/_models.py" = ["S105"]
"src/aeat/core/classification/__init__.py" = ["S105"]
"src/aeat/core/test_config_override.py" = ["S108"]
"src/aeat/core/file_permissions.py" = ["S603"]
"src/aeat/domain/auth/apoderamientos/_catalogue.py" = ["S105"]
"src/aeat/domain/calculations/registry/_workbook_parity.py" = ["S603"]
"src/aeat/domain/deadlines/_festivos.py" = ["S105"]
"src/aeat/domain/transactions/_llm.py" = ["S603"]
"src/aeat/entrypoints/cli/test_root_help_shape.py" = ["S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Lock the project into pytest-only testing.
"unittest".msg = "Project is pytest-only. Use pytest primitives — fixtures, parametrise, tmp_path. See src/aeat/tests/README.md."
"unittest.mock".msg = "Mocks are banned in live tests and discouraged in unit tests. Use real objects or fakes-as-classes. See src/aeat/tests/README.md."
"mock".msg = "Third-party 'mock' is banned for the same reason as unittest.mock. See src/aeat/tests/README.md."

# The relative-imports mandate is enforced by the custom
# scripts/check_relative_imports.py script, not by Ruff TID251. Ruff's
# banned-api resolves relative imports back to their absolute path
# before matching the banned prefix, which would flag every legitimate
# `from .module import X` inside src/aeat/ when `aeat` is banned.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty ───────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.13"
extra-paths = ["stubs"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
# Hand-written stubs under `stubs/` cover packages without `py.typed`
# and without `types-*` distributions on PyPI (currently `pypdfium2` and
# `playwright_stealth`). All other previously-listed unresolved imports
# (playwright, typer, rich, bs4) now ship `py.typed` themselves.
# `google-api-python-client-stubs` (installed as a dev dep) covers
# google-api-python-client / googleapiclient surface.
allowed-unresolved-imports = []

# ── mypy ─────────────────────────────────────────────────────────────────────
# The project does not run mypy in CI (ty is the canonical checker) but
# external auditors do. Mirror ty's stance so a mypy invocation against
# this project picks up the same stub set.
[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "stubs"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Only packages that still lack py.typed and have no community stubs.
# playwright, typer, rich, bs4 all ship py.typed; google-api-python-client
# is covered by google-api-python-client-stubs (installed as a dev dep).
module = ["i18n.*", "ofxparse.*"]
ignore_missing_imports = true

# ── pyrefly ──────────────────────────────────────────────────────────────────
# Same rationale as `[tool.mypy]`: declare the project's stub policy so
# external pyrefly invocations resolve `pypdfium2` and `playwright_stealth`
# against `stubs/` rather than reporting them as unresolved imports.
[tool.pyrefly]
python_version = "3.13"
search_path = ["src", "stubs"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["src/aeat"]
pythonpath = ["src"]
python_files = ["test_*.py", "_test_*.py"]
addopts = "-v --tb=short -m 'unit' --strict-markers"
asyncio_mode = "strict"
markers = [
  "unit: deterministic tests with no external I/O",
  "live_read: opt-in tests that READ from a real external service; see src/aeat/tests/README.md",
  "live_write: permanently forbidden external write-shaped tests; collection-dropped with no bypass",
  "domain_inbound: exercises adapters.inbound.* (financial providers, borrador, declaracion, identity, sanitizer, pdf shared)",
  "domain_outbound: exercises adapters.outbound.* (aeat auth/browser/sede/export/verify, llm)",
  "domain_export: sub-marker on adapters.outbound.aeat.export.* (fichero-BOE serialise / verify pipelines)",
  "domain_persistence: exercises adapters.persistence.* (storage substrate)",
  "domain_model: exercises domain.* business model + computation (modelos, registry, manuals, deadlines, profile, rental, ...)",
  "domain_application: exercises application.* use-cases / orchestration (filing, workflow, sync, setup, review, verification)",
  "domain_core: exercises core.* foundational cross-cutting (config, logging, errors, paths, observability, identity, i18n, env_io)",
  "flaky: opt-in retry via pytest-rerunfailures; live_read / live_write tests only",
  "fixture_tier_l3: test uses synthetic generator output; no fixtures on disk",
]

# ── Coverage (pytest-cov) ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/aeat"]
branch = true
omit = [
  "*/test_*.py",
  "*/_test_*.py",
  "src/aeat/tests/*",
]

[tool.coverage.report]
# Starting floor. Ratchet upward after real measurement, and never lower
# without a documented architectural update.
fail_under = 60
show_missing = true
skip_covered = false

# ── Bandit (security lint) ───────────────────────────────────────────────────
# The aeat-audit pipeline runs bandit against the full source tree. Without
# this filter every test file triggers B101 (assert_used) once per assertion
# and B311 (random) once per fixture seed, accounting for ~4500 of the
# ~5900 raw security findings. Suppress test-only false positives at the
# config layer; production code stays under the full bandit ruleset.
[tool.bandit]
# Skip the bundled test tree — every signal there is a false positive at
# the boundary (assert is the test language, fixtures use random for
# synthetic data, hardcoded credentials are obvious test stubs).
exclude_dirs = [
  "src/aeat/tests",
  ".venv",
  "stubs",
]
# B101 (assert_used) is silenced globally because pytest's contract IS
# `assert`. Production code occasionally uses `assert` for invariants;
# those should migrate to explicit `raise` where they are load-bearing.
# Every other rule stays active.
skips = ["B101"]

# Per-rule per-glob skips for colocated test files mirror the bundled
# src/aeat/tests tree's noise profile.
[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/_test_*.py", "**/conftest.py"]

# ── Interrogate (docstring coverage) ─────────────────────────────────────────
# Without configuration interrogate counts every public symbol missing a
# Google-style docstring as a finding. The audit pipeline reported ~3800
# such findings across the codebase; ~70% are private helpers, magic
# methods, nested closures, and test fixtures that don't carry docstrings
# by convention. Filter those at the config layer so the dashboard tracks
# the public surface that genuinely warrants prose documentation.
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true
ignore-property-decorators = true
ignore-module = false
fail-under = 80
exclude = [
  "stubs",
  "src/aeat/tests",
  "src/aeat/**/test_*.py",
  "src/aeat/**/_test_*.py",
]

# ── Vulture (dead-code) ──────────────────────────────────────────────────────
# Vulture defaults to confidence threshold 60 which surfaces many
# false-positive "unused" guesses (decorators, dynamic dispatch, test
# fixtures, lazily-bound CLI entrypoints). Bump to 80 and exclude tests so
# the dashboard tracks code that is plausibly dead in production paths.
[tool.vulture]
min_confidence = 80
paths = ["src/aeat"]
exclude = [
  "src/aeat/**/test_*.py",
  "src/aeat/**/_test_*.py",
  "src/aeat/tests",
  "stubs",
]
ignore_decorators = [
  "@app.command",
  "@cli.command",
  "@click.command",
  "@click.group",
  "@app.callback",
  "@app.result_callback",
  "@pytest.fixture",
  "@field_validator",
  "@model_validator",
  "@field_serializer",
  "@classmethod",
  "@staticmethod",
  "@property",
]

# ── Deptry (unused / transitive dependency lint) ─────────────────────────────
# Suppress the false positives surfaced by deptry's default heuristics.
# `pydantic_core` is re-exported by pydantic (legitimate transitive use),
# `click` ships under typer (typer's CLI surface is built on click), and
# `yaml` ships as `PyYAML`. The remaining diagnostics flag genuine drift
# and stay active.
[tool.deptry]
ignore_unused = [
  "tzdata",         # IANA db, only matters at runtime on Windows; runtime-required.
  "python-dotenv",  # loaded by core.config when AEAT_DOTENV is set; deptry can't see runtime use.
]
[tool.deptry.package_module_name_map]
"PyYAML" = ["yaml"]
"pyyaml" = ["yaml"]
[tool.deptry.per_rule_ignores]
DEP003 = ["click", "pydantic_core", "yaml"]
DEP004 = ["pytest", "reportlab"]
