[project]
name = "aeat"
version = "0.1.0"
description = "Spanish tax authority (AEAT) automation - tax information and filing tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "wgergely" },
]
keywords = ["aeat", "tax", "spain", "hacienda", "impuestos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    # Google Cloud / Workspace
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.3.1",
    "gspread>=6.2.1",
    "google-cloud-storage>=3.10.1",

    # Browser automation
    "playwright>=1.58.0",

    # Data validation & models
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",

    # HTTP client
    "httpx>=0.28.1",

    # Configuration
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Repository = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeat"]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "ruff>=0.15.9",
    "ty>=0.0.1a1",
    "prek>=0.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-playwright>=0.7.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty ───────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "gspread",
    "googleapiclient",
    "google.auth",
    "google.oauth2",
    "google.cloud",
    "google_auth_oauthlib",
    "playwright",
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
