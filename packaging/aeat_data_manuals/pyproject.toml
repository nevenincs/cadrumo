[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeat-data-manuals"
# Version-locked to the root `aeat` distribution. This is a synced literal kept
# equal to the `version` field of the repository-root pyproject.toml; the parity
# gate `dev/packaging/tests/test_aeat_data_distribution.py` fails loudly if the
# two ever drift, so the companion can only ship at the same version as the
# runtime wheel that resolves it. Bump both (and the sibling
# `aeat-data-official`) together on every release.
version = "0.1.1"
description = "AEAT/BOE práctico manuals (corpus source binaries) for the aeat distribution"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  { name = "wgergely" },
]
keywords = ["aeat", "hacienda", "impuestos", "spain", "tax", "corpus", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"
Repository = "https://github.com/wgergely/aeat"

# This companion ships a subtree of the SAME `aeat_data` PEP 420 implicit
# namespace package as the sibling `aeat-data-official`: NEITHER wheel ships
# `aeat_data/__init__.py` (a joint install would collide on that path), so
# `importlib.resources.files("aeat_data")` resolves a MultiplexedPath over both
# installed portions. There is therefore no discoverable package to select —
# every shipped file is force-included by the build hook — so selection is
# bypassed and the wheel content is the hook's force-include map alone.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# The corpus source binaries under `corpus/manuals` are force-included from the
# single source tree (`src/aeat/_data/corpus`) and remapped to
# `aeat_data/_data/corpus/manuals/...` by the build hook. A hook (not a static
# force-include) is required because only this companion's owned subtree and
# only the binary suffixes (*.pdf/*.xls/*.xlsx) move here; the derived surfaces
# and the sibling's subtree stay out.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Keep the sdist self-consistent: ship the build hook and README, plus the
# corpus binaries the hook force-includes, so a wheel built from the sdist
# carries the same payload.
include = [
  "hatch_build.py",
  "README.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
