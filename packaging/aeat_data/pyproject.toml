[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeat-data"
# Version-locked to the root `aeat` distribution. This is a synced literal kept
# equal to the `version` field of the repository-root pyproject.toml; the parity
# gate `dev/packaging/tests/test_aeat_data_distribution.py` fails loudly if the
# two ever drift, so the companion can only ship at the same version as the
# runtime wheel that resolves it. Bump both together on every release.
version = "0.1.0"
description = "Corpus source binaries (AEAT/BOE manuals and workbooks) for the aeat distribution"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  { name = "wgergely" },
]
keywords = ["aeat", "hacienda", "impuestos", "spain", "tax", "corpus", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/wgergely/aeat"
Issues = "https://github.com/wgergely/aeat/issues"
Repository = "https://github.com/wgergely/aeat"

# The importable `aeat_data` package roots the mirrored `_data/corpus` tree for
# `importlib.resources.files("aeat_data")`, which the runtime corpus-locator seam
# joins with `_data` to read a binary.
[tool.hatch.build.targets.wheel]
packages = ["aeat_data"]

# The corpus source binaries are force-included from the single source tree
# (`src/aeat/_data/corpus`) and remapped to `aeat_data/_data/corpus/...` by the
# build hook. A hook (not a static force-include) is required because only the
# binary suffixes (*.pdf/*.xls/*.xlsx) move to the companion; the derived
# surfaces stay in the `aeat` wheel.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Keep the sdist self-consistent: ship the package scaffold and the build hook,
# plus the corpus binaries the hook force-includes, so a wheel built from the
# sdist carries the same payload.
include = [
  "aeat_data",
  "hatch_build.py",
  "README.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
