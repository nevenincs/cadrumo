# Empty 0.0.0 placeholder for the `aeat-data` PyPI project.
#
# The pypi/support per-file size-limit template requires the project to EXIST
# before a limit increase can be granted, and explicitly sanctions "an empty
# 0.0.0 release ... You can delete this release immediately after uploading
# it." This project is that placeholder: name-identical to the real companion
# (packaging/aeat_data), version 0.0.0, carrying ONLY this note — no corpus
# data. The real 0.1.0 companion publishes once the granted limit covers its
# ~139 MB wheel. Never bump this version; never add data here.
[project]
name = "aeat-data"
version = "0.0.0"
description = "Placeholder release: the aeat-cli corpus-sources companion publishes at 0.1.0 once the PyPI per-file size grant lands."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  { name = "wgergely" },
]

[project.urls]
Homepage = "https://github.com/nevenincs/aeat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeat_data"]
