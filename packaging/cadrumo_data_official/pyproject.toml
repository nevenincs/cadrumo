[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadrumo-data-official"
# Version-locked to the root `cadrumo` distribution. This is a synced literal kept
# equal to the `version` field of the repository-root pyproject.toml; the parity
# gate `dev/packaging/tests/test_cadrumo_data_distribution.py` fails loudly if the
# two ever drift, so the companion can only ship at the same version as the
# runtime wheel that resolves it. Bump both (and the sibling
# `cadrumo-data-manuals`) together on every release.
version = "0.2.2" # x-release-please-version
description = "Official AEAT diseños de registro / workbooks and normative PDFs (corpus source binaries) for the Cadrumo distribution"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
# Explicit so the wheel/sdist always carry the Apache 4(d) attribution chain
# (dist-info/licenses/{LICENSE,NOTICE}); the NOTICE also scopes the licence
# to packaging/derived works, never the official AEAT/BOE documents.
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Neve Nincs", email = "hello@neve.md" },
]
keywords = ["aeat", "hacienda", "impuestos", "spain", "tax", "corpus", "data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/nevenincs/cadrumo"
Issues = "https://github.com/nevenincs/cadrumo/issues"
Repository = "https://github.com/nevenincs/cadrumo"

# This companion ships a subtree of the SAME `cadrumo_data` PEP 420 implicit
# namespace package as the sibling `cadrumo-data-manuals`: NEITHER wheel ships
# `cadrumo_data/__init__.py` (a joint install would collide on that path), so
# `importlib.resources.files("cadrumo_data")` resolves a MultiplexedPath over both
# installed portions. There is therefore no discoverable package to select —
# every shipped file is force-included by the build hook — so selection is
# bypassed and the wheel content is the hook's force-include map alone.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# The corpus source binaries under `corpus/aeat_official` and `corpus/normatives`
# are force-included from the single source tree (`src/cadrumo/_data/corpus`) and
# remapped to `cadrumo_data/_data/corpus/...` by the build hook. A hook (not a
# static force-include) is required because only this companion's owned subtrees
# and only the binary suffixes (*.pdf/*.xls/*.xlsx) move here; the derived
# surfaces and the sibling's subtree stay out.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Keep the sdist self-consistent: ship the build hook and README, plus the
# corpus binaries the hook force-includes, so a wheel built from the sdist
# carries the same payload.
include = [
  "hatch_build.py",
  "README.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
