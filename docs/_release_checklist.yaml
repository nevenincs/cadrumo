# Machine-validated release-readiness checklist for `aeat-cli`.
#
# Read and validated by `dev/release/readiness.py` (schema:
# `ReleaseChecklist` in that module) before any release proceeds past the
# `just release-apply` step. This file is data, not automation: nothing here
# triggers an outward action. A human always runs `just release-apply`,
# reviews the printed checklist, and decides whether to push and publish.
#
# See RELEASING.md for the full per-release sequence and rollback procedure.

schema_version: 1

# Non-hotfix releases soak on a pre-release channel before the human decides
# to push + publish. There is no separate PyPI "beta" project yet (aeat-cli
# is pre-1.0 and has not shipped its first PyPI release) — the soak vehicle
# today is a local, tagged pre-release build (`vX.Y.Z-rc.N`, built and smoke
# tested via `just packaging-smoke*`, installed from the built wheel into a
# scratch venv) reviewed over the soak window before the real tag lands.
# Promote this to a real `aeat-cli-beta` PyPI project once the first stable
# release has shipped and a channel is worth maintaining.
soak:
  applies_to: "non-hotfix"
  minimum_hours: 48
  maximum_hours: 72
  vehicle: "local pre-release build (vX.Y.Z-rc.N), packaging-smoke matrix, scratch-venv install"
  exit_gates:
    - "full packaging-smoke lane green (just packaging-smoke, Linux/WSL)"
    - "no priority:P0-blocker issue opened against the RC build during the soak window"
    - "changelog entry reviewed against the conventional-commit log since the last tag"

versioning:
  scheme: "SemVer"
  pre_1_0_discipline: "relaxed — a 0.x minor bump may carry breaking changes; document them in the changelog Features/Bug-Fixes section"
  post_1_0_discipline: "strict — a breaking change requires a major bump; release-please infers type from conventional-commit prefixes"

changelog:
  automation: "release-please (conventional commits) — see release-please-config.json"
  template: "docs/_release_notes_template.md"

hotfix:
  # Emergency cycle times from RC discovery/decision to published fix,
  # measured from the human's go/no-go decision, not from PR merge.
  cycle_times_hours:
    security_or_data_loss: 24
    portal_drift: 48
    other_critical: 72

rollback:
  triggers:
    - "data loss or corruption reported against the release"
    - "security vulnerability disclosed in the release"
    - "5%+ of active installs report a regression (best-effort estimate; no telemetry exists yet — inferred from issue volume/severity)"
    - "compatibility mis-computation (a supported Python/OS/dependency combination fails after the release)"
  procedure_ref: "RELEASING.md#rollback-procedure"
  mechanism: "revert the release commit + tag on main, publish a corrected patch release; PyPI yank marks the bad version so pip/uv skip it by default"

audit_state_gate:
  description: "Deterministic pre-release invariants checked by `dev/release/readiness.py` before `just release-apply` is trusted."
  checks:
    - "pyproject.toml, src/aeat/__init__.py, and .release-please-manifest.json report one identical version"
    - "CHANGELOG.md is non-empty and carries no unresolved release-please merge markers"
    - "no open GitHub issue carries the priority:P0-blocker label (advisory when gh is unavailable/unauthenticated)"
    - "the most recent packaging-smoke evidence manifest under var/packaging-smoke, if present, reports ok: true"
