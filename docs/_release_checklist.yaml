# Machine-validated release-readiness checklist for Cadrumo.
#
# Read and validated by `dev/release/readiness.py` (schema:
# `ReleaseChecklist` in that module) at bump time and again by the
# publication authority's Gate 2. This file is data, not automation: nothing
# here triggers an outward action. The `soak` and `hotfix` sections below are
# followed by an operator per RELEASING.md and echoed by the
# `just release-rollback` recipe; neither is computed or enforced by a
# workflow.
#
# See RELEASING.md for the full per-release sequence and rollback procedure.

schema_version: 1

# Non-hotfix releases hold the release pull request open, green, and
# re-checked before merging. There is no separate PyPI "beta" project yet
# (Cadrumo is pre-1.0 and has not shipped its first PyPI release) — the soak
# vehicle is the release PR itself, kept green by `packaging-smoke.yml`
# (dispatched by hand against the release PR's branch, per RELEASING.md's
# "Release-candidate evidence" section) and re-verified by the readiness
# gate immediately before merge. Promote this to a real `cadrumo-beta` PyPI
# project once the first stable release has shipped and a channel is worth
# maintaining.
soak:
  applies_to: "non-hotfix"
  minimum_hours: 48
  maximum_hours: 72
  vehicle: "the open release pull request, kept green by a by-hand packaging-smoke.yml run against its branch and re-verified by the readiness gate before merge"
  exit_gates:
    - "packaging-smoke.yml green against the release PR's branch at merge time"
    - "no priority:P0-blocker issue opened against the release PR during the soak window"
    - "the readiness gate re-verified clean against the release PR immediately before merge"

versioning:
  scheme: "SemVer"
  pre_1_0_discipline: "relaxed — a 0.x minor bump may carry breaking changes; document them in the changelog Features/Bug-Fixes section"
  post_1_0_discipline: "strict — a breaking change requires a major bump; release-please infers type from conventional-commit prefixes"

changelog:
  automation: "release-please (conventional commits) — see release-please-config.json"
  template: "docs/_release_notes_template.md"

hotfix:
  # Emergency cycle times from RC discovery/decision to published fix,
  # measured from the human's go/no-go decision, not from PR merge.
  cycle_times_hours:
    security_or_data_loss: 24
    portal_drift: 48
    other_critical: 72

rollback:
  triggers:
    - "data loss or corruption reported against the release"
    - "security vulnerability disclosed in the release"
    - "5%+ of active installs report a regression (best-effort estimate; no telemetry exists yet — inferred from issue volume/severity)"
    - "compatibility mis-computation (a supported Python/OS/dependency combination fails after the release)"
  procedure_ref: "RELEASING.md#rollback-procedure"
  mechanism: "revert the release commit + tag on main, publish a corrected patch release; PyPI yank marks the bad version so pip/uv skip it by default"

audit_state_gate:
  description: "Deterministic pre-release invariants checked by `dev/release/readiness.py`, run automatically by the bump stage and again by publication Gate 2."
  checks:
    - "pyproject.toml, src/cadrumo/__init__.py, and .release-please-manifest.json report one identical version"
    - "CHANGELOG.md is non-empty and carries no unresolved release-please merge markers"
    - "no open GitHub issue carries the priority:P0-blocker label (advisory when gh is unavailable/unauthenticated)"
    - "the most recent packaging-smoke evidence manifest under var/packaging-smoke, if present, reports ok: true"
    - "the download-channel matrix is fresh and complete: `python -m dev.docs.download_matrix --check` is clean and every cohort ArtifactKind is surfaced by a documented channel (dev/docs/tests/test_download_matrix.py)"
