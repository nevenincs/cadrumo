version: 2

updates:
  # Every action is pinned to a commit; this keeps those pins current. One
  # grouped pull request per month, because each one holds the single Linux
  # runner for a merge gate.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
