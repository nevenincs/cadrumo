version: 2

updates:
  # Every action is pinned to a commit; this keeps those pins current. One
  # grouped pull request per month, because each one holds the single Linux
  # runner for a merge gate.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # The `just` installer commit is pinned by the workflow contract in
      # `dev/ci_contract.py`; it moves there, together with every workflow.
      - dependency-name: taiki-e/install-action
    commit-message:
      prefix: ci
