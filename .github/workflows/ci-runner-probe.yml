# TEMPORARY empirical probe, round 2. Lives only on the ci-runner-probe branch.
#
# Round 1 (run 31006744709) proved the watchdog fires on the unschedulable
# Windows lane and skips schedulable-but-queued Linux lanes, but the self-cancel
# landed the RUN conclusion as `cancelled` rather than `failure`, and cancelled
# the evidence job before it could answer the runners-API question.
#
# Round 2 changes exactly two things: the cancel moves to a separate downstream
# job so the watchdog's own failure is recorded first, and the evidence job runs
# to completion before the threshold expires.

name: Cadrumo Runner Probe

on:
  push:
    branches: [ci-runner-probe]

permissions:
  contents: read

jobs:
  evidence:
    name: Cadrumo probe / API reachability evidence
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Q1 - can the workflow token list self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Q1: GET /repos/$GITHUB_REPOSITORY/actions/runners ==="
          status="$(curl -s -D /tmp/head.txt -o /tmp/runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners")"
          echo "HTTP_STATUS=$status"
          echo "--- body ---"
          cat /tmp/runners.json; echo
          echo "--- x-accepted-github-permissions (what the endpoint demands) ---"
          grep -i 'x-accepted-github-permissions' /tmp/head.txt || echo "(header absent)"

      - name: Q2 - jobs API payload for a queued job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Q2: GET /actions/runs/$GITHUB_RUN_ID/jobs ==="
          sleep 15
          echo "--- one queued job, every key ---"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.status=="queued")][0]'

  hang-windows:
    name: Cadrumo probe / unschedulable Windows lane
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Never reached
        run: echo "if this ever prints, the Windows runner came back"

  watchdog:
    name: Cadrumo probe / queue watchdog
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Watch sibling jobs for an unschedulable lane
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_SECONDS: "120"
          POLL_SECONDS: "15"
          GIVE_UP_SECONDS: "540"
        run: |
          set -euo pipefail
          started="$(date +%s)"
          self="Cadrumo probe / queue watchdog"
          while :; do
            now="$(date +%s)"
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate)"
            running="$(echo "$payload" | jq -r '[.jobs[] | select(.status=="in_progress") | (.labels|sort|join("|"))] | unique | .[]' || true)"
            stuck="$(echo "$payload" | jq -r --arg self "$self" --arg now "$now" --arg thr "$THRESHOLD_SECONDS" '
              .jobs[] | select(.status=="queued") | select(.name != $self)
              | select((($now|tonumber) - (.started_at // .created_at | fromdateiso8601)) > ($thr|tonumber))
              | "\(.name)\t\(.labels|sort|join("|"))"' || true)"
            if [ -n "$stuck" ]; then
              verdict=0
              while IFS=$'\t' read -r jobname labelset; do
                [ -z "$jobname" ] && continue
                if echo "$running" | grep -qxF "$labelset"; then
                  echo "  SKIP  $jobname [$labelset] - that label set is serving another job right now"
                else
                  echo "::error title=Unschedulable lane::Job '$jobname' has been queued past ${THRESHOLD_SECONDS}s and no runner carrying [${labelset//|/, }] is serving any job."
                  verdict=1
                fi
              done <<< "$stuck"
              if [ "$verdict" = "1" ]; then echo "WATCHDOG VERDICT: fired"; exit 1; fi
            fi
            if [ $(( now - started )) -gt "$GIVE_UP_SECONDS" ]; then
              echo "WATCHDOG VERDICT: gave up without firing"; exit 0
            fi
            sleep "$POLL_SECONDS"
          done

  # Round-2 experiment: cancel from a DOWNSTREAM job, so the watchdog's own
  # `failure` conclusion is committed before cancellation propagates. Does the
  # RUN then conclude `failure` instead of `cancelled`?
  reaper:
    name: Cadrumo probe / cancel the hung run
    needs: [watchdog]
    if: failure()
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel remaining queued jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "watchdog conclusion: ${{ needs.watchdog.result }}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true
          echo "cancel requested"
