# TEMPORARY proof harness. Branch-only. Drives the SHIPPING watchdog against all
# four live fleet conditions at once: three label sets no online runner carries
# (Windows, macOS ARM64, Linux ARM64) and one that two runners do carry, with
# enough Linux contention that schedulable jobs are demonstrably QUEUED past the
# threshold at verdict time. Firing on the first three while staying silent on
# the fourth is the whole claim.

name: Cadrumo Runner Probe Matrix

on:
  push:
    branches: [ci-runner-probe-3]

permissions:
  contents: read

jobs:
  runner-queue-watchdog:
    name: Cadrumo / runner queue watchdog
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "90"
          MAX_WATCH_SECONDS: "600"
        run: python3 -m dev.ci.runner_queue_watchdog

  offline-windows:
    name: Cadrumo probe / offline Windows lane
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - run: echo unreached

  offline-macos:
    name: Cadrumo probe / offline macOS lane
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - run: echo unreached

  offline-linux-arm:
    name: Cadrumo probe / offline Linux ARM64 lane
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - run: echo unreached

  online-a:
    name: Cadrumo probe / online Linux lane A
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 300

  online-b:
    name: Cadrumo probe / online Linux lane B
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 300

  online-c:
    name: Cadrumo probe / online Linux lane C
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 300
