# The machine that waits out the release-candidate soak.
#
# The 48-72 hour soak is a wall-clock constraint on an immutable cohort, not a
# human-review constraint: the policy asks for elapsed time against bytes that
# did not change, and never for a person. No workflow run spans that window, so
# the orchestrator seals a candidate and ENDS, and this workflow is what crosses
# the boundary afterwards.
#
# Each tick is short-lived and cheap by design. The fleet is four self-hosted
# runners shared across products; a job that held a slot for the length of a
# soak would starve it for days per release, so this reads the sealed candidates,
# decides, and exits.
#
# WHAT THIS DISPATCHES, AND WHAT IT CANNOT DO. It presses exactly the button an
# operator would: a workflow_dispatch of publish-release.yml carrying the run ids
# the candidate recorded at seal time. It adds no trust path - Gate 2 verifies
# every supplied run independently, exactly as it verifies a hand-typed one.
#
# There is deliberately NO input that can shorten a window. The hotfix carve-out
# is authorised ON THE CANDIDATE (an incident reference plus a release-owner
# approval, refused at construction without both), so an emergency is recorded
# where it can be audited rather than typed into a dispatch form where it cannot.
# A manual `promote_now`-style input would reintroduce the human act this design
# removes, and would do it on the one axis - time - that the soak exists to hold.
#
# Publishing LATE is self-reporting; publishing EARLY is silent. A missed tick
# only delays a promotion to the next one, which is why the cadence is hourly
# rather than clever.
name: Cadrumo Release Soak Promoter

on:
  # The scheduled cron tick is retired by operator ruling: the soak wait itself
  # is retired (release-orchestrator.yml now dispatches publish-release.yml
  # immediately after sealing a candidate, per this project's standing no
  # scheduled-CI policy), so nothing sealed by that path is ever left waiting
  # for this workflow to notice. workflow_dispatch survives as a manual
  # escape hatch for a candidate sealed before the change, or any future
  # reintroduction of a soak.
  workflow_dispatch:
    inputs:
      report_only:
        description: Report the promotion decision without dispatching the publication
        required: false
        default: false
        type: boolean

# Product-scoped and never cancelled. A tick that is mid-dispatch must finish:
# cancelling between the publication dispatch and the candidate's consumption
# would leave a promoted cohort still selectable, and the next tick would
# re-dispatch it.
concurrency:
  group: release-soak-promoter-cadrumo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Cadrumo / promote the first candidate whose soak has closed
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      # actions: write dispatches publish-release.yml; contents: write retags a
      # consumed candidate draft. Neither publishes anything itself - the
      # publication authority holds the OIDC and channel credentials, and it
      # alone runs inside the release environment.
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Promote the first candidate whose soak window has closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          # The decision, the readiness re-verification, and the dispatch all
          # live in dev.release.soak_promoter, so they are unit-tested against a
          # real clock rather than expressed as shell arithmetic on dates.
          # Tested for TRUTH, not for emptiness. `${VAR:+flag}` expands whenever
          # VAR is non-empty, and a boolean dispatch input renders as the
          # literal string "false" - which is non-empty. The flag was therefore
          # passed on every manual dispatch, so a manual promoter run could
          # never actually promote anything. A scheduled tick was unaffected
          # (the input is unset there), which is exactly why it went unnoticed.
          flags=()
          if [[ "${REPORT_ONLY}" == "true" ]]; then
            flags+=(--report-only)
          fi
          uv run --frozen python -m dev.release.soak_promoter \
            --repository "${GITHUB_REPOSITORY}" \
            "${flags[@]}"

      - name: Alert the operator that this release-path run failed
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CADRUMO_ALERT_WEBHOOK: ${{ vars.CADRUMO_ALERT_WEBHOOK }}
        run: |
          # A step suffices here because this workflow is ONE job: there is no
          # earlier job whose failure could skip this one. The multi-job
          # workflows use a dedicated alert job for exactly that reason.
          #
          # Never fatal: the run is already red and its FIRST error matters most.
          # The captured refusal text, so the alert body carries WHY the run
          # failed rather than the no-detail placeholder. An alert saying only
          # "something failed, here is a link" spends the operator's attention
          # on navigation, which is the cost this channel exists to avoid.
          jq_filter='[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name + ": " + .conclusion] | join("; ")'
          detail="$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq "${jq_filter}" 2>/dev/null || true)"
          uv run --frozen python -m dev.release.alerting --stage "soak-promotion" --detail "${detail:-no per-job detail available}"
