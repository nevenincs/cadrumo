# Clean Homebrew acquisition gate for every platform/architecture row emitted
# by packaging/homebrew/generate.py. Each job consumes one already-tested
# immutable Python cohort and source-builds the exact same tap snapshot.

name: Cadrumo Homebrew Acquisition

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Cadrumo Packaging Smoke run containing the tested cohort
        required: true
        type: string
      source_commit:
        description: Full commit SHA that produced the tested cohort
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # The acquisition matrix spans macOS ARM64 and Linux ARM64, both of which live
  # on the second build host and were both offline on 2026-08-05. Without this,
  # dispatching the lane queues silently. See dev/ci/runner_queue_watchdog.py.
  runner-queue-watchdog:
    name: Cadrumo / runner queue watchdog
    # Ungated, matching the off-lane jobs it watches: the acquisition matrix
    # now has no dependencies, so its job records exist from the start of the
    # run and the bounded watch window cannot open before they are created.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "300"
          MAX_WATCH_SECONDS: "900"
        run: python3 -m dev.ci.runner_queue_watchdog

  cadrumo-homebrew-acquisition:
    name: Cadrumo / ${{ matrix.label }} / Homebrew source install
    strategy:
      fail-fast: false
      # Machine-aware load (.github/ci-control-plane.md): TWO of the three legs live on
      # the one 6-core MacBook (ARM native, colima linux-arm64); unbounded, they
      # co-land and thrash the laptop. Two at a time keeps the worst
      # co-residency at two Mac legs (or one Mac + the workstation leg).
      max-parallel: 2
      matrix:
        include:
          # All three legs are self-hosted (operator ruling 2026-07-21: no
          # hosted/cloud runners, ever). per-leg make_jobs feeds
          # HOMEBREW_MAKE_JOBS: brew's build-from-source parallelism is sized
          # to the machine share, not the whole box.
          - id: macos-arm64
            label: macOS arm64
            runner: [self-hosted, macOS, ARM64]
            expected_os: Darwin
            expected_arch: arm64
            brew: /opt/homebrew/bin/brew
            row_id: homebrew-macos-arm64
            make_jobs: "2"
          - id: linux-x86_64
            label: Linux x86_64
            runner: [self-hosted, Linux, X64]
            expected_os: Linux
            expected_arch: x86_64
            brew: /home/linuxbrew/.linuxbrew/bin/brew
            row_id: homebrew-linux-x86-64
            make_jobs: "8"
          # macOS Intel dropped 2026-07-21: Intel is no longer a supported
          # platform (ARM-only macOS). The remaining MacBook avenue is the
          # macOS Linux-ARM container host (colima arm64 container on the ARM MacBook).
          - id: linux-arm64
            label: Linux arm64
            runner: [self-hosted, Linux, ARM64]
            expected_os: Linux
            expected_arch: aarch64
            brew: /home/linuxbrew/.linuxbrew/bin/brew
            row_id: homebrew-linux-arm64
            make_jobs: "2"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Initialize current-run evidence root
        id: initialize
        env:
          MATRIX_ID: ${{ matrix.id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          root="${RUNNER_TEMP}/cadrumo-homebrew-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MATRIX_ID}"
          rm -rf "$root"
          mkdir -p "$root"
          echo "CADRUMO_HOMEBREW_ROOT=$root" >> "$GITHUB_ENV"
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg matrix_id "$MATRIX_ID" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "cadrumo.packaging.homebrew-workflow.v1",
              status: "initialized",
              source_commit: $source_commit,
              source_run_id: $source_run_id,
              matrix_id: $matrix_id,
              github_run_id: $run_id,
              github_run_attempt: $run_attempt
            }' > "$root/run-context.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify declared Homebrew release row
        env:
          BREW_PATH: ${{ matrix.brew }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_OS: ${{ matrix.expected_os }}
        run: |
          test "$(uname -s)" = "$EXPECTED_OS"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -x "$BREW_PATH"
          "$BREW_PATH" --version

      - name: Verify source workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r .name <<<"$run_json")" = "Cadrumo Packaging Smoke"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/packaging-smoke.yml"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          event="$(jq -r .event <<<"$run_json")"
          if [ "$event" = "workflow_dispatch" ]; then
            # Dispatch-only full campaign (ci-speed redesign, 2026-07-20): a
            # dispatch run is trusted only when its commit is verified on main
            # history via the compare API - equal-or-stronger than the former
            # push-event pin, which trusted the push router.
            ancestry="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...$(jq -r .head_sha <<<"$run_json")" --jq .status)"
            test "$ancestry" = "identical" -o "$ancestry" = "behind"
          else
            test "$event" = "push"
          fi
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          source_commit_lower="$(printf '%s' "$SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          test "$(jq -r .head_sha <<<"$run_json")" = "$source_commit_lower"

      - name: Checkout tested source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: true

      # The acquisition lanes consume the LINUX-built python cohort (wheels are
      # py3-none-any) plus the sealed full release cohort. An artifact belongs
      # to its producing run by construction, so the "Verify source workflow
      # identity" step above — which pins workflow path, conclusion, branch,
      # event, ancestry and head SHA — is the complete binding for these bytes.
      - name: Download the tested cohorts from the verified source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          gh run download "$SOURCE_RUN_ID" --name cadrumo-python-cohort-linux \
            --dir "$CADRUMO_HOMEBREW_ROOT/download"
          gh run download "$SOURCE_RUN_ID" --name cadrumo-release-cohort \
            --dir "$CADRUMO_HOMEBREW_ROOT/download"
          mkdir -p "$CADRUMO_HOMEBREW_ROOT/cohort" "$CADRUMO_HOMEBREW_ROOT/release-cohort"
          tar -xzf "$CADRUMO_HOMEBREW_ROOT/download/cadrumo-python-cohort-linux.tar.gz" \
            -C "$CADRUMO_HOMEBREW_ROOT/cohort"
          tar -xzf "$CADRUMO_HOMEBREW_ROOT/download/cadrumo-release-cohort.tar.gz" \
            -C "$CADRUMO_HOMEBREW_ROOT/release-cohort"

      - name: Verify and generate the cohort-bound tap snapshot
        run: |
          uv run --no-project --with packaging python -m dev.packaging.python_cohort verify \
            --cohort-dir "$CADRUMO_HOMEBREW_ROOT/cohort"
          version="$(jq -r .version "$CADRUMO_HOMEBREW_ROOT/cohort/python-cohort.json")"
          uv run --no-project --with packaging python packaging/homebrew/generate.py \
            --cohort-dir "$CADRUMO_HOMEBREW_ROOT/cohort" \
            --lock uv.lock \
            --version "$version" \
            --release-base-url \
              "https://github.com/nevenincs/cadrumo/releases/download/v${version}" \
            --output-dir "$CADRUMO_HOMEBREW_ROOT/tap-snapshot"

      # --retain-install defers the smoke's uninstall/untap: the emit step
      # below hashes the INSTALLED executables (the mint-time isolation
      # proof), so the keg must still exist when the row is minted. The
      # deferred cleanup runs right after the emit, from the recorded state.
      - name: Audit install and exercise Cadrumo through Homebrew
        env:
          BREW_PATH: ${{ matrix.brew }}
          MATRIX_ID: ${{ matrix.id }}
          # brew build-from-source parallelism, sized per leg to the machine
          # share (machine-aware sizing, .github/ci-control-plane.md).
          HOMEBREW_MAKE_JOBS: ${{ matrix.make_jobs }}
        run: |
          uv run --no-project python dev/packaging/smoke_homebrew.py \
            --formula "$CADRUMO_HOMEBREW_ROOT/tap-snapshot/Formula/cadrumo.rb" \
            --cohort-dir "$CADRUMO_HOMEBREW_ROOT/cohort" \
            --evidence-dir "$CADRUMO_HOMEBREW_ROOT/evidence" \
            --tap-name "cadrumo-smoke/${MATRIX_ID}" \
            --brew "$BREW_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --retain-install

      # Mint the sanctioned homebrew-<os>-<arch> row from the real captured tax
      # oracle JSON (the CLI-only smoke wrote tax-evidence.json host-visible;
      # the formula carries no MCP leg, so the record marks it absent), bound to
      # THE immutable release cohort verified and extracted above. No re-run.
      - name: Emit the sanctioned Homebrew distribution-evidence record
        env:
          ROW_ID: ${{ matrix.row_id }}
        run: |
          tax="$(find "$CADRUMO_HOMEBREW_ROOT/evidence" -name tax-evidence.json -print -quit)"
          if [[ -z "$tax" ]]; then
            echo "homebrew tax oracle evidence JSON not found under $CADRUMO_HOMEBREW_ROOT/evidence" >&2
            exit 1
          fi
          uv run --no-project --with packaging --with pydantic \
            python -m dev.packaging.distribution_evidence_emit \
            --row-id "$ROW_ID" \
            --release-cohort-dir "$CADRUMO_HOMEBREW_ROOT/release-cohort" \
            --tax-evidence "$tax" \
            --acquisition-mechanism brew \
            --acquisition-source "nevenincs/tap" \
            --destination-kind homebrew-cellar \
            --destination-locator "${{ matrix.id }}" \
            --distribution-evidence-dir "$CADRUMO_HOMEBREW_ROOT/distribution-install-readiness"

      # Diagnostics must survive the runner workspace: on failure, keep the
      # brew-install log and the harness failure detail as debug-* artifacts.
      # debug-* names are outside the promotable row namespace: none are .json
      # row files, and the publish gates exclude debug-* from row aggregation.
      - name: Stage build-failure diagnostics
        id: diagnostics
        if: failure() && steps.initialize.outputs.ready == 'true'
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          staging="$CADRUMO_HOMEBREW_ROOT/diagnostics"
          mkdir -p "$staging"
          install_log="$(find "$CADRUMO_HOMEBREW_ROOT/evidence" -path '*/logs/brew-install.log' -print -quit 2>/dev/null || true)"
          if [ -n "$install_log" ]; then
            cp "$install_log" "$staging/debug-brew-install-${MATRIX_ID}-${GITHUB_RUN_ID}.log"
          fi
          if [ -d "$CADRUMO_HOMEBREW_ROOT/evidence" ]; then
            tar -czf "$staging/debug-homebrew-diagnostics-${MATRIX_ID}-${GITHUB_RUN_ID}.tar.gz" \
              -C "$CADRUMO_HOMEBREW_ROOT" evidence
          fi
          echo "dir=$staging" >> "$GITHUB_OUTPUT"

      - name: Upload build-failure diagnostics
        if: failure() && steps.initialize.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-homebrew-${{ matrix.id }}
          path: ${{ steps.diagnostics.outputs.dir }}
          if-no-files-found: ignore
          overwrite: true

      # Deferred cleanup from --retain-install: runs after the emit (which
      # needed the live keg) and even when earlier steps failed, so the
      # self-hosted runner never accumulates smoke formulae/taps.
      - name: Clean up the retained Homebrew install
        if: always() && steps.initialize.outputs.ready == 'true'
        run: |
          state="$(find "$CADRUMO_HOMEBREW_ROOT/evidence" -name homebrew-cleanup-state.json -print -quit 2>/dev/null || true)"
          if [[ -n "$state" ]]; then
            uv run --no-project python dev/packaging/smoke_homebrew.py --cleanup-state "$state"
          else
            echo "no retained Homebrew install to clean up"
          fi

      # Each matrix leg publishes distinctly-named artifacts, so the three legs
      # never collide on an artifact name.
      - name: Stage the Homebrew evidence bundle
        if: always() && steps.initialize.outputs.ready == 'true'
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          # The downloaded cohorts already ride the smoke run's artifacts;
          # exclude them from the per-leg bundle to avoid duplicate uploads.
          tar --exclude=./cohort --exclude=./release-cohort --exclude=./download \
            --exclude=./diagnostics \
            -czf "cadrumo-homebrew-acquisition-${MATRIX_ID}.tar.gz" -C "$CADRUMO_HOMEBREW_ROOT" .

      - name: Upload the Homebrew distribution-evidence rows
        if: always() && steps.initialize.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-evidence-homebrew-${{ matrix.id }}
          path: ${{ env.CADRUMO_HOMEBREW_ROOT }}/distribution-install-readiness/*.json
          if-no-files-found: ignore
          overwrite: true

      - name: Upload the Homebrew acquisition bundle
        if: always() && steps.initialize.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-homebrew-acquisition-${{ matrix.id }}
          path: cadrumo-homebrew-acquisition-${{ matrix.id }}.tar.gz
          if-no-files-found: ignore
          overwrite: true
