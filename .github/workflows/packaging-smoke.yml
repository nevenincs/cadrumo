# Packaging smoke workflow for Cadrumo release artifacts.
# Proves wheel installation, bundled data, optional browser provisioning, and
# clean Linux image behavior independently from the shared developer worktree.

name: Cadrumo Packaging Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cadrumo-packaging-smoke:
    name: Cadrumo / Ubuntu / Python 3.13 / wheel artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Dependency surface preflight
        run: python -m dev.packaging.dependency_surface

      - name: Shipped data source preflight
        run: python -m dev.packaging.source_preflight

      - name: Sync frozen development environment
        run: uv sync --frozen

      - name: Cadrumo packaging preflight command tests
        run: just packaging-smoke-preflight-tests

      - name: Cadrumo fresh development dependency smoke
        run: just packaging-smoke-dev

      - name: Cadrumo host Linux core packaging smoke
        run: just packaging-smoke-linux

      - name: Cadrumo split-distribution packaging smoke
        run: just packaging-smoke-split

      - name: Checkpoint host packaging evidence and release ephemeral disk
        run: uv run --no-sync python -m dev.packaging.evidence --prune-completed

      - name: Cadrumo clean Docker image packaging smoke
        run: just packaging-smoke-docker

      - name: Checkpoint Docker packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-packaging-smoke-evidence
          path: var/packaging-smoke-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
