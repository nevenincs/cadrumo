# Packaging smoke workflow for Cadrumo release artifacts.
# Proves wheel installation, bundled data, optional browser provisioning, and
# clean Linux image behavior independently from the shared developer worktree.

name: Cadrumo Packaging Smoke

# Cost discipline (operator directive 2026-07-19): the 3-OS matrix is the
# single most expensive workflow in the repo, so it runs ONLY where its result
# is consumed - a push to main whose diff can affect the shipped artifacts, or
# an explicit dispatch. There is deliberately NO pull_request trigger, and
# vault/docs/agent-config churn (the bulk of shared-worktree campaign pushes,
# none of which ships in any artifact) never starts a matrix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".vault/**"
      - ".vaultspec/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".agents/**"
      - "docs/**"
      - "**.md"

# A push to main must never cancel the running matrix: the release gates
# consume a COMPLETED successful push-to-main run, and the shared-worktree
# campaigns push to main more often than the ~35-minute matrix takes, so
# cancel-on-push livelocks the gate forever. With queueing, the running matrix
# completes and the newest push waits as the single pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cadrumo-packaging-smoke:
    name: Cadrumo / Ubuntu / Python 3.13 / wheel artifacts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Sync frozen development environment
        run: uv sync --frozen

      # The preflights import dev.packaging.smoke_core, which needs third-party
      # distributions (packaging, pydantic transitively); a bare setup-uv
      # interpreter also lets the repo's own packaging/ namespace directory
      # mask the missing PyPA library, so they must run inside the synced
      # environment after uv sync.
      - name: Dependency surface preflight
        run: uv run --no-sync python -m dev.packaging.dependency_surface

      - name: Shipped data source preflight
        run: uv run --no-sync python -m dev.packaging.source_preflight

      - name: Cadrumo packaging preflight command tests
        run: just packaging-smoke-preflight-tests

      # The hosted runner ships ~14 GB free; the multi-lane campaign plus two
      # Docker lanes starved it twice (runner lost communication mid-step).
      # Reclaim the preinstalled toolchains the job never uses, and sample
      # disk/memory every minute during the one-invocation campaign so a
      # resource death names its lane in the interleaved output. The campaign
      # stays a single `just packaging-smoke-ci` invocation so every lane
      # consumes the same cohort bytes built once.
      - name: Reclaim runner disk space
        # GitHub-hosted only: on a self-hosted runner these paths belong to the
        # operator's machine and the docker prune would wipe the shared WSL
        # engine's images.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
          free -m

      - name: Cadrumo immutable-cohort packaging campaign
        run: |
          ( while true; do echo "[resources $(date -u +%H:%M:%S)] $(df -h --output=avail / | tail -1 | tr -d ' ') free disk, $(free -m | sed -n 2p | awk '{print $7}') MiB avail mem"; sleep 60; done ) &
          sampler=$!
          just packaging-smoke-ci
          status=$?
          kill "$sampler" 2>/dev/null || true
          exit "$status"

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      - name: Upload tested Cadrumo Python cohort
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # TEST/DEBUG ARTIFACT ONLY. The per-OS smoke cohort feeds the acquisition
          # test lanes (scoop/homebrew/claude); it NEVER enters the publication
          # chain. publish-release.yml ships the SEALED cadrumo-release-cohort only.
          # Enforced by test_no_workflow_consumes_per_os_cohort_for_publication.
          name: cadrumo-python-cohort
          path: var/packaging-smoke-cohort/python/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-packaging-smoke-evidence
          path: |
            var/packaging-smoke-evidence/*.json
            var/distribution-install-readiness/installed-cohorts/**/evidence.json
          if-no-files-found: warn
          retention-days: 14

  # Windows leg: proves the python-windows-x86-64 distribution row on a native
  # windows-latest (x86-64) runner. It runs the host-portable `packaging-smoke`
  # aggregate (no Docker, no host package-manager lanes) so the cohort is built
  # once and every portable lane consumes the same bytes. The Linux-only disk
  # reclamation and the bash resource sampler are omitted; the justfile's
  # `set windows-shell := pwsh` drives each recipe, and the smoke modules already
  # branch on os.name for Scripts/.exe layouts.
  cadrumo-packaging-smoke-windows:
    name: Cadrumo / Windows / Python 3.13 / wheel artifacts
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # taiki-e/install-action shells out to bash and mangles its own action
      # path on a self-hosted Windows runner using Git Bash (strips the
      # backslashes -> "C:actions-runner_work..."), so `just` never installs.
      # Provision it natively instead: prefer the already-present binary, fall
      # back to scoop (present on the fleet's Windows runner).
      - name: Ensure just is available
        shell: powershell
        run: |
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            scoop install just
          }
          just --version

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Sync frozen development environment
        run: uv sync --frozen

      - name: Dependency surface preflight
        run: uv run --no-sync python -m dev.packaging.dependency_surface

      - name: Shipped data source preflight
        run: uv run --no-sync python -m dev.packaging.source_preflight

      - name: Cadrumo packaging preflight command tests
        run: just packaging-smoke-preflight-tests

      - name: Cadrumo host-portable packaging campaign
        run: just packaging-smoke

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      - name: Upload tested Cadrumo Python cohort
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # TEST/DEBUG ARTIFACT ONLY. The per-OS smoke cohort feeds the acquisition
          # test lanes (scoop/homebrew/claude); it NEVER enters the publication
          # chain. publish-release.yml ships the SEALED cadrumo-release-cohort only.
          # Enforced by test_no_workflow_consumes_per_os_cohort_for_publication.
          name: cadrumo-python-cohort-windows
          path: var/packaging-smoke-cohort/python/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-packaging-smoke-evidence-windows
          path: |
            var/packaging-smoke-evidence/*.json
            var/distribution-install-readiness/installed-cohorts/**/evidence.json
          if-no-files-found: warn
          retention-days: 14

  # macOS leg: proves the python-macos-arm64 distribution row on a native
  # macos-latest runner (Apple silicon / arm64). Same host-portable
  # `packaging-smoke` aggregate as the Windows leg; the Linux-only reclamation
  # and sampler are omitted, and no host package-manager (Homebrew) lane runs.
  # Operator ruling 2026-07-20: the self-hosted Mac is powered off indefinitely,
  # so the macOS legs run on hosted macos-latest (Apple silicon); Windows and
  # Linux stay on the operator's free self-hosted machines per the cost
  # directive.
  cadrumo-packaging-smoke-macos:
    name: Cadrumo / macOS / Python 3.13 / wheel artifacts
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Sync frozen development environment
        run: uv sync --frozen

      - name: Dependency surface preflight
        run: uv run --no-sync python -m dev.packaging.dependency_surface

      - name: Shipped data source preflight
        run: uv run --no-sync python -m dev.packaging.source_preflight

      - name: Cadrumo packaging preflight command tests
        run: just packaging-smoke-preflight-tests

      - name: Cadrumo host-portable packaging campaign
        run: just packaging-smoke

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      - name: Upload tested Cadrumo Python cohort
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # TEST/DEBUG ARTIFACT ONLY. The per-OS smoke cohort feeds the acquisition
          # test lanes (scoop/homebrew/claude); it NEVER enters the publication
          # chain. publish-release.yml ships the SEALED cadrumo-release-cohort only.
          # Enforced by test_no_workflow_consumes_per_os_cohort_for_publication.
          name: cadrumo-python-cohort-macos
          path: var/packaging-smoke-cohort/python/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-packaging-smoke-evidence-macos
          path: |
            var/packaging-smoke-evidence/*.json
            var/distribution-install-readiness/installed-cohorts/**/evidence.json
          if-no-files-found: warn
          retention-days: 14

  # Build the ONE immutable full cross-channel cohort (python + Claude plugin/
  # marketplace + Scoop + Homebrew + MCPB) once, from a clean HEAD clone, and
  # upload it as cadrumo-release-cohort. The per-OS oracle+emit legs below all
  # `needs:` this single job so every python-<os> row binds the identical cohort
  # id (a per-OS rebuild would diverge the id). Pure-Python generators - no node.
  # This is also the stored bytes the publish authority promotes without rebuild.
  build-release-cohort:
    name: Cadrumo / build immutable release cohort
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release-cohort manifest binds the exact v<version> tag. A
          # single-commit checkout omits tags and would mint source.tag=null,
          # which the readiness and publication gates correctly refuse.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # EXACT pin: release_cohort.py enforces _REQUIRED_PYTHON_VERSION for a
          # reproducible cohort, so this job must provision that exact CPython -
          # a bare "3.13" resolves to the latest patch (3.13.14 on a fresh runner)
          # and the builder correctly refuses it. Keep in step with that constant.
          python-version: "3.13.11"
          enable-cache: true

      - name: Sync frozen development environment
        run: uv sync --frozen

      - name: Build the immutable full release cohort
        run: uv run --no-sync python -m dev.packaging.release_cohort build --output var/release-cohort

      - name: Upload the immutable full release cohort
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-release-cohort
          path: var/release-cohort/
          if-no-files-found: error
          retention-days: 14

  # Per-OS proof that THE immutable cohort installs and performs grounded tax work
  # on each claimed platform, minting the sanctioned python-<os> row bound to the
  # one cohort. The three legs stay parallel behind the single cheap build.
  oracle-emit-linux:
    name: Cadrumo / Linux / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cadrumo-release-cohort
          path: var/release-cohort
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort \
            --release-cohort-dir var/release-cohort \
            --row-id python-linux-x86-64 \
            --work-dir var/oracle-emit-work \
            --distribution-evidence-dir var/distribution-install-readiness
      - name: Upload the distribution-evidence record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-distribution-evidence-linux
          path: var/distribution-install-readiness/*.json
          if-no-files-found: error
          retention-days: 14

  oracle-emit-windows:
    name: Cadrumo / Windows / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cadrumo-release-cohort
          path: var/release-cohort
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort `
            --release-cohort-dir var/release-cohort `
            --row-id python-windows-x86-64 `
            --work-dir var/oracle-emit-work `
            --distribution-evidence-dir var/distribution-install-readiness
      - name: Upload the distribution-evidence record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-distribution-evidence-windows
          path: var/distribution-install-readiness/*.json
          if-no-files-found: error
          retention-days: 14

  oracle-emit-macos:
    name: Cadrumo / macOS / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cadrumo-release-cohort
          path: var/release-cohort
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort \
            --release-cohort-dir var/release-cohort \
            --row-id python-macos-arm64 \
            --work-dir var/oracle-emit-work \
            --distribution-evidence-dir var/distribution-install-readiness
      - name: Upload the distribution-evidence record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cadrumo-distribution-evidence-macos
          path: var/distribution-install-readiness/*.json
          if-no-files-found: error
          retention-days: 14
