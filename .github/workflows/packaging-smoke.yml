# Packaging smoke workflow for Cadrumo release artifacts.
# Proves wheel installation, bundled data, optional browser provisioning, and
# clean Linux image behavior independently from the shared developer worktree.

name: Cadrumo Packaging Smoke

# Cost discipline (operator directives 2026-07-19 and 2026-07-20): the 3-OS
# matrix is the single most expensive workflow in the repo (a 34-minute
# Windows leg at its worst), so it is a RELEASE-CANDIDATE campaign only:
# explicit workflow_dispatch, never per-push. The per-push signal is the
# lightweight packaging-quick.yml (one cohort build + one core install probe
# per OS, no evidence minted). This workflow remains the SOLE source of
# promotable DistributionEvidence; publish-release.yml Gate 2 pins this
# workflow path. There is deliberately NO pull_request trigger.
on:
  workflow_dispatch:

# A newer dispatch must never cancel the running matrix: the release gates
# consume a COMPLETED successful run. With queueing, the running matrix
# completes and the newest dispatch waits as the single pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gated on the cohort build deliberately. Every off-lane job in this campaign
  # (both Windows legs, both macOS legs) waits on `build-release-cohort`, and
  # GitHub does not create a dependent job's record until its dependencies
  # resolve — so before that point there is nothing to watch, and starting
  # earlier would hold one of only two Linux runner slots through a long build
  # for no coverage. See dev/ci/runner_queue_watchdog.py.
  runner-queue-watchdog:
    name: Cadrumo / runner queue watchdog
    needs: build-release-cohort
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "300"
          MAX_WATCH_SECONDS: "900"
        run: python3 dev/ci/runner_queue_watchdog.py

  cadrumo-packaging-smoke:
    name: Cadrumo / Ubuntu / Python 3.13 / wheel artifacts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    # Waits on the single cohort build so every lane consumes identical bytes.
    needs: build-release-cohort

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Sync frozen development environment
        run: uv sync --frozen

      # The dependency/source/preflight-command checks run INSIDE the campaign
      # driver (dev.packaging.campaign) within the synced environment, so they
      # are not repeated as workflow steps.

      # The hosted runner ships ~14 GB free; the multi-lane campaign plus two
      # Docker lanes starved it twice (runner lost communication mid-step).
      # Reclaim the preinstalled toolchains the job never uses, and sample
      # disk/memory every minute during the one-invocation campaign so a
      # resource death names its lane in the interleaved output. The campaign
      # stays a single `just packaging-smoke-ci` invocation so every lane
      # consumes the same cohort bytes built once.
      - name: Reclaim runner disk space
        # GitHub-hosted only: on a self-hosted runner these paths belong to the
        # operator's machine and the docker prune would wipe the shared WSL
        # engine's images.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
          free -m

      - name: Cadrumo immutable-cohort packaging campaign
        # Machine-aware sizing (.github/ci-control-plane.md): the workstation's 24
        # logical CPUs are shared with co-resident runners from other
        # repositories, so the preflight pytest gets an explicit 8 workers
        # (never -n auto) and the lane pool keeps 3 (its lanes are venv/disk-bound,
        # not CPU-wide). 8 is a working pin, not a derivation.
        env:
          CADRUMO_TEST_WORKERS: "8"
          CADRUMO_PACKAGING_LANE_CONCURRENCY: "3"
        run: |
          ( while true; do echo "[resources $(date -u +%H:%M:%S)] $(df -h --output=avail / | tail -1 | tr -d ' ') free disk, $(free -m | sed -n 2p | awk '{print $7}') MiB avail mem"; sleep 60; done ) &
          sampler=$!
          status=0
          just packaging-smoke-ci || status=$?
          kill "$sampler" 2>/dev/null || true
          exit "$status"

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      # TEST/DEBUG ASSET ONLY. The per-OS smoke cohort feeds the acquisition
      # test lanes (Scoop and Homebrew); it NEVER enters the publication
      # chain. publish-release.yml ships the SEALED cadrumo-release-cohort only.
      # Enforced by test_no_workflow_consumes_per_os_cohort_for_publication.
      - name: Archive the tested Cadrumo Python cohort
        run: |
          test -n "$(ls -A var/packaging-smoke-cohort/python)"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf cadrumo-python-cohort-linux.tar.gz -C var/packaging-smoke-cohort/python .

      - name: Upload the tested Cadrumo Python cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-python-cohort-linux
          path: cadrumo-python-cohort-linux.tar.gz
          if-no-files-found: error
          overwrite: true


      - name: Stage Cadrumo packaging smoke evidence
        if: always()
        run: |
          staging=$(mktemp -d)
          cp var/packaging-smoke-evidence/*.json "$staging"/ 2>/dev/null || true
          find var/distribution-install-readiness/installed-cohorts -name evidence.json \
            -exec sh -c 'cp "$1" "$0/installed-$(echo "$1" | sha256sum | cut -c1-8).json"' "$staging" {} \; 2>/dev/null || true
          if [ -n "$(ls -A "$staging")" ]; then
            tar -czf packaging-smoke-evidence-linux.tar.gz -C "$staging" .
          fi

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-smoke-evidence-linux
          path: packaging-smoke-evidence-linux.tar.gz
          if-no-files-found: ignore
          overwrite: true

  # Windows leg: proves the python-windows-x86-64 distribution row on a native
  # windows-latest (x86-64) runner. It runs the host-portable `packaging-smoke`
  # aggregate (no Docker, no host package-manager lanes) so the cohort is built
  # once and every portable lane consumes the same bytes. The Linux-only disk
  # reclamation and the bash resource sampler are omitted; the justfile's
  # `set windows-shell := pwsh` drives each recipe, and the smoke modules already
  # branch on os.name for Scripts/.exe layouts.
  cadrumo-packaging-smoke-windows:
    name: Cadrumo / Windows / Python 3.13 / wheel artifacts
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    # Upload-only leg; the sole creator is build-release-cohort (see above).
    needs: build-release-cohort

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # taiki-e/install-action shells out to bash and mangles its own action
      # path on a self-hosted Windows runner using Git Bash (strips the
      # backslashes -> "C:actions-runner_work..."), so `just` never installs.
      # Provision it natively instead: prefer the already-present binary, fall
      # back to scoop (present on the fleet's Windows runner).
      - name: Ensure just is available
        shell: powershell
        run: |
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            scoop install just
          }
          just --version

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Sync frozen development environment
        run: uv sync --frozen

      # The dependency/source/preflight-command checks run INSIDE the campaign
      # driver (dev.packaging.campaign), so they are not repeated as workflow
      # steps — the Windows leg alone spent 3.9 measured minutes duplicating
      # them.
      - name: Cadrumo host-portable packaging campaign
        # Machine-aware sizing (.github/ci-control-plane.md): this Windows runner shares
        # the workstation's 24 logical CPUs with co-resident runners from other
        # repositories — explicit 8 pytest workers, and lane concurrency 2 (its
        # venv installs are disk-bound and the box carries co-resident jobs).
        env:
          CADRUMO_TEST_WORKERS: "8"
          CADRUMO_PACKAGING_LANE_CONCURRENCY: "2"
        run: just packaging-smoke

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      # TEST/DEBUG ASSET ONLY (see the Ubuntu leg's cohort-publish note).
      # shell pinned to pwsh 7: the self-hosted runner's rewritten PSModulePath
      # breaks Windows PowerShell 5.1 module auto-loading (Get-FileHash etc.).
      - name: Archive the tested Cadrumo Python cohort
        shell: pwsh
        run: |
          if (-not (Get-ChildItem var/packaging-smoke-cohort/python)) { throw "python cohort is empty" }
          tar -czf cadrumo-python-cohort-windows.tar.gz -C var/packaging-smoke-cohort/python .
          if ($LASTEXITCODE -ne 0) { throw "cohort archiving failed" }

      - name: Upload the tested Cadrumo Python cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-python-cohort-windows
          path: cadrumo-python-cohort-windows.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Stage Cadrumo packaging smoke evidence
        if: always()
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "cadrumo-smoke-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item var/packaging-smoke-evidence/*.json $staging -ErrorAction SilentlyContinue
          Get-ChildItem var/distribution-install-readiness/installed-cohorts -Recurse -Filter evidence.json -ErrorAction SilentlyContinue |
            ForEach-Object {
              $suffix = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.Substring(0, 8).ToLower()
              Copy-Item -LiteralPath $_.FullName (Join-Path $staging "installed-$suffix.json")
            }
          if (Get-ChildItem $staging) {
            tar -czf packaging-smoke-evidence-windows.tar.gz -C $staging .
            if ($LASTEXITCODE -ne 0) { throw "evidence archiving failed" }
          }

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-smoke-evidence-windows
          path: packaging-smoke-evidence-windows.tar.gz
          if-no-files-found: ignore
          overwrite: true

  # macOS leg: proves the python-macos-arm64 distribution row on a native
  # macos-latest runner (Apple silicon / arm64). Same host-portable
  # `packaging-smoke` aggregate as the Windows leg; the Linux-only reclamation
  # and sampler are omitted, and no host package-manager (Homebrew) lane runs.
  cadrumo-packaging-smoke-macos:
    name: Cadrumo / macOS / Python 3.13 / wheel artifacts
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    # Upload-only leg; the sole creator is build-release-cohort (see above).
    needs: build-release-cohort

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Sync frozen development environment
        run: uv sync --frozen

      # The dependency/source/preflight-command checks run INSIDE the campaign
      # driver (dev.packaging.campaign), so they are not repeated as workflow
      # steps — the Windows leg alone spent 3.9 measured minutes duplicating
      # them.
      - name: Cadrumo host-portable packaging campaign
        # Machine-aware sizing (.github/ci-control-plane.md): the 6-core MacBook hosts
        # THREE runners — 2 pytest workers and 2 concurrent lanes per leg.
        env:
          CADRUMO_TEST_WORKERS: "2"
          CADRUMO_PACKAGING_LANE_CONCURRENCY: "2"
        run: just packaging-smoke

      - name: Checkpoint packaging evidence
        if: always()
        run: uv run --no-sync python -m dev.packaging.evidence

      # TEST/DEBUG ASSET ONLY (see the Ubuntu leg's cohort-publish note).
      # macOS ships bsdtar (no GNU determinism flags); integrity rides the
      # artifact's own storage integrity, not byte-reproducible archiving.
      - name: Archive the tested Cadrumo Python cohort
        run: |
          test -n "$(ls -A var/packaging-smoke-cohort/python)"
          tar -czf cadrumo-python-cohort-macos.tar.gz -C var/packaging-smoke-cohort/python .

      - name: Upload the tested Cadrumo Python cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-python-cohort-macos
          path: cadrumo-python-cohort-macos.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Stage Cadrumo packaging smoke evidence
        if: always()
        run: |
          staging=$(mktemp -d)
          cp var/packaging-smoke-evidence/*.json "$staging"/ 2>/dev/null || true
          find var/distribution-install-readiness/installed-cohorts -name evidence.json \
            -exec sh -c 'cp "$1" "$0/installed-$(echo "$1" | shasum -a 256 | cut -c1-8).json"' "$staging" {} \; 2>/dev/null || true
          if [ -n "$(ls -A "$staging")" ]; then
            tar -czf packaging-smoke-evidence-macos.tar.gz -C "$staging" .
          fi

      - name: Upload Cadrumo packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-smoke-evidence-macos
          path: packaging-smoke-evidence-macos.tar.gz
          if-no-files-found: ignore
          overwrite: true

  # Build the ONE immutable base-product cohort (Python + Scoop + Homebrew)
  # once, from a clean HEAD clone, and
  # upload it as cadrumo-release-cohort. The per-OS oracle+emit legs below all
  # `needs:` this single job so every python-<os> row binds the identical cohort
  # id (a per-OS rebuild would diverge the id). Pure-Python generators - no node.
  # This is also the stored bytes the publish authority promotes without rebuild.
  build-release-cohort:
    name: Cadrumo / build immutable release cohort
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release-cohort manifest binds the exact v<version> tag. A
          # single-commit checkout omits tags and would mint source.tag=null,
          # which the readiness and publication gates correctly refuse.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # With no python-version override, uv reads the checkout's exact
          # .python-version pin. release_cohort.py enforces the same source.
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Sync frozen development environment
        run: uv sync --frozen

      - name: Refuse to seal a version any destination already owns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asked here as well as at publication Gate 2, because refusing at seal
          # time costs one re-run while refusing at Gate 2 is the last check
          # before an irreversible index upload. Same single authority, so the
          # two answers cannot disagree; the version comes from the declaration
          # the cohort build is about to stamp into the artifacts.
          # --scope seal, NOT the publication scope. Sealing is not shipping:
          # this lane builds and proves a cohort on every push, and between
          # releases the declared version legitimately EQUALS the manifest floor
          # because the bump has not happened yet. Enforcing the floor here
          # refused every build in exactly the interval this lane works in.
          # Everything that makes a collision impossible still applies: a
          # version some destination already owns, or one that is burned, is
          # refused when sealing too.
          version="$(uv run --no-sync python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          uv run --no-sync python -m dev.release.version_identity \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --scope seal

      - name: Build the immutable full release cohort
        run: uv run --no-sync python -m dev.packaging.release_cohort build --output var/release-cohort

      - name: Archive the immutable full release cohort
        run: |
          test -n "$(ls -A var/release-cohort)"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf cadrumo-release-cohort.tar.gz -C var/release-cohort .

      - name: Upload the immutable full release cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-release-cohort
          path: cadrumo-release-cohort.tar.gz
          if-no-files-found: error
          overwrite: true

  # Per-OS proof that THE immutable cohort installs and performs grounded tax work
  # on each claimed platform, minting the sanctioned python-<os> row bound to the
  # one cohort. The three legs stay parallel behind the single cheap build.
  oracle-emit-linux:
    name: Cadrumo / Linux / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cadrumo-release-cohort
          path: var/
      - name: Extract the immutable release cohort
        run: |
          # The cohort's own manifest/digests are the integrity check
          # (oracle_emit_cohort refuses a corrupt cohort at load); the artifact
          # itself is intrinsically bound to this run.
          mkdir -p var/release-cohort
          tar -xzf var/cadrumo-release-cohort.tar.gz -C var/release-cohort
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort \
            --release-cohort-dir var/release-cohort \
            --row-id python-linux-x86-64 \
            --work-dir var/oracle-emit-work \
            --distribution-evidence-dir var/distribution-install-readiness
      - name: Upload the distribution-evidence record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-evidence-python-linux-x86-64
          path: var/distribution-install-readiness/*.json
          if-no-files-found: error
          overwrite: true

  oracle-emit-windows:
    name: Cadrumo / Windows / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cadrumo-release-cohort
          path: var
      - name: Extract the immutable release cohort
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force var/release-cohort | Out-Null
          tar -xzf var/cadrumo-release-cohort.tar.gz -C var/release-cohort
          if ($LASTEXITCODE -ne 0) { throw "cohort extraction failed" }
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort `
            --release-cohort-dir var/release-cohort `
            --row-id python-windows-x86-64 `
            --work-dir var/oracle-emit-work `
            --distribution-evidence-dir var/distribution-install-readiness
      - name: Upload the distribution-evidence record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-evidence-python-windows-x86-64
          path: var/distribution-install-readiness/*.json
          if-no-files-found: error
          overwrite: true

  oracle-emit-macos:
    name: Cadrumo / macOS / immutable-cohort oracle + emit
    needs: build-release-cohort
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false
      - name: Sync frozen development environment
        run: uv sync --frozen
      - name: Download the immutable release cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cadrumo-release-cohort
          path: var/
      - name: Extract the immutable release cohort
        run: |
          mkdir -p var/release-cohort
          tar -xzf var/cadrumo-release-cohort.tar.gz -C var/release-cohort
      - name: Install the cohort, run installed oracles, emit the row
        run: |
          uv run --no-sync python -m dev.packaging.oracle_emit_cohort \
