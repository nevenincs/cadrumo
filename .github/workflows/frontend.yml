# Frontend verification lane for the Vite/TypeScript site under `frontend/`.
#
# Why this exists. `frontend/` is a real subproject with its own toolchain, its
# own lockfile, and its own deploy recipe (`just frontend-deploy`), and it had
# no lane of any kind. It was not unverified-and-ignored, which would at least
# be cheap — it was unverified AND expensive: neither Python lane carved it out,
# so a change under `frontend/` started the full Python static-checks job, the
# twelve-minute unit suite, and the three-OS packaging probe, none of which can
# observe a TypeScript regression. Measured: PR run 30895086190, a dependency
# bump touching only `frontend/package-lock.json`, ran Cadrumo CI and Cadrumo
# Packaging Quick and failed both.
#
# So this lane is two corrections in one. The Python lanes now carve
# `frontend/**` out, and the signal that should have been firing for it fires
# here instead: typecheck, build, and the vitest suite.
#
# Node is provisioned by action rather than assumed: the stock self-hosted
# runner image carries none, and depending on runner-local state is how a lane
# silently degrades to "tooling unavailable" instead of failing loudly.

name: Cadrumo Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  # SAME-REPO pull_request only: fork PR head code must never execute on the
  # self-hosted fleet. The job carries the same-repo guard, so fork PRs skip.
  # This trigger matters more here than elsewhere: dependency-bump PRs against
  # `frontend/` are the single most common event this lane will ever see.
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cadrumo-frontend:
    name: Cadrumo / frontend / Node 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Provision Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22, not 20. This lane first shipped pinned to 20 to match ci.yml —
          # which was the wrong reason: ci.yml provisions Node only to shell out
          # to `npx jscpd` for the duplication scan, so its pin says nothing
          # about what THIS subproject needs. Measured on the first real run
          # (2026-08-05): `npm ci` refused with `@testing-library/jest-dom@7.0.0`
          # requiring `{"node":">=22"}` against `v20.20.2`.
          #
          # Note the manifest cannot be trusted for this either: `frontend/
          # package.json` declares `engines: {"node": ">=20.19.0"}`, which
          # under-declares its own dependency tree. The lockfile's transitive
          # requirements are the real floor, and npm enforces them.
          node-version: "22"

      - name: Install locked dependencies
        # `npm ci`, never `npm install`: ci installs exactly the committed
        # lockfile and fails when package.json and the lock disagree, which is
        # the frontend analogue of `uv sync --frozen` in the Python lanes.
        run: npm ci

      - name: Typecheck and build
        # `npm run build` is `tsc --noEmit && vite build`, so this one step is
        # both the typecheck and the bundle proof.
        run: npm run build

      - name: Test
        run: npm run test
