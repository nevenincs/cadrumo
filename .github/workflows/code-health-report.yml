# Monthly code-health report (issue #416)
#
# The workflow runs `just audit-health-report`, the composed shadowing,
# duplication, import-layering, and complexity dashboard (`dev/audit/report.py`),
# each month. The text output remains in the job logs. The workflow uploads the
# JavaScript Object Notation (JSON) output as a build artifact.
#
# This workflow is deliberately non-blocking. The scheduled diagnostic dashboard
# combines import-layering, shadowing, duplication, and complexity signals.
# The main continuous integration (CI) workflow enforces every declared
# `.importlinter` contract through `just check-imports`. The monthly workflow
# records and displays a diagnostic failure without causing the scheduled job
# to fail.

name: Code health report

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  health-report:
    name: Monthly code-health report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Bootstrap
        run: |
          uv sync --frozen
          uv run vaultspec-core install --force

      - name: Run code-health report (text)
        # Informational only: a failed diagnostic verdict must not fail this job.
        # See the workflow header and `dev/audit/report.py` for the distinction
        # between the blocking import boundary and the scheduled combined report.
        run: just audit-health-report
        continue-on-error: true

      - name: Run code-health report (JSON artifact)
        run: just audit-health-report-json > code-health-report.json
        continue-on-error: true

      - name: Upload code-health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-health-report
          path: code-health-report.json
