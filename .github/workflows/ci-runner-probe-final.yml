# TEMPORARY proof harness for the SHIPPING watchdog. Branch-only; never on main.
#
# The `runner-queue-watchdog` job below is the exact stanza landed in
# packaging-quick / packaging-smoke / packaging-scoop /
# packaging-homebrew, running the same dev/ci/runner_queue_watchdog.py, with the
# threshold shortened so the proof completes in minutes. The lanes around it
# exist to drive BOTH directions in one run: one lane no runner can serve, and
# several schedulable lanes that will nonetheless sit queued behind two busy
# Linux runners and must therefore be left alone.

name: Cadrumo Runner Probe Final

on:
  push:
    branches: [ci-runner-probe-2]

permissions:
  contents: read

jobs:
  runner-queue-watchdog:
    name: Cadrumo / runner queue watchdog
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "120"
          MAX_WATCH_SECONDS: "600"
        run: python3 -m dev.ci.runner_queue_watchdog

  hang-windows:
    name: Cadrumo probe / unschedulable Windows lane
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - run: echo "if this prints, the Windows runner came back"

  control-a:
    name: Cadrumo probe / schedulable control A
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 240

  control-b:
    name: Cadrumo probe / schedulable control B
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 240

  control-c:
    name: Cadrumo probe / schedulable control C
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - run: sleep 240
