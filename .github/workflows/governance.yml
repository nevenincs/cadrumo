name: Cadrumo Governance Consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".importlinter"
      - ".vaultspec/**"
      - ".codex/rules/**"
      - ".agents/skills/**"
      - "dev/quality/**"
      - "dev/registry/**"
      - "dev/ci/**"
      - "justfile"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".importlinter"
      - ".vaultspec/**"
      - ".codex/rules/**"
      - ".agents/skills/**"
      - "dev/quality/**"
      - "dev/registry/**"
      - "dev/ci/**"
      - "justfile"
      - "pyproject.toml"

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance-consistency:
    name: "Required when applicable: Governance consistency"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Initialize and verify generated governance
        run: just setup
      - name: Workflow definitions and import authority
        run: |
          just check-workflows
          just check-import-boundaries
