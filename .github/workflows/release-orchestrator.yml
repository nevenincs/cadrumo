# The single operator-facing surface of a Cadrumo release.
#
# One dispatch carries the release decision. Nothing downstream asks a human
# anything: this workflow bumps the version, runs the packaging campaign, runs
# whichever acquisition lanes the claimed channels require, and seals a release
# candidate. The soak is then crossed by release-soak-promoter.yml, and the
# publication itself by publish-release.yml.
#
# WHY THERE IS NO CONFIRMATION INPUT. Navigating to a workflow and pressing Run
# already IS the deliberate act; a phrase to type reproduces the ceremony the
# automation removed while protecting against nothing the guard set does not.
# The dispatch is the intent signal, and it is the only human judgement left in
# the loop.
#
# WHY THIS IS NOT PUSH-TRIGGERED. A push trigger removes no human act, it
# disguises one - someone still authors the commit - while making the project's
# one irreversible act a side effect. The identity guard refuses a version some
# destination already OWNS, so it guards against repeating a release, not
# against starting the wrong one: under push-triggering the first release nobody
# meant to make passes every check in the repository.
#
# WHAT THIS WORKFLOW NEVER DOES. It does not publish, and it does not dispatch
# publish-release.yml. It ends at the sealed candidate, because no run can span
# a 48-72 hour soak and a job that tried would hold one of four shared
# self-hosted runners for days.
name: Cadrumo Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and rehearse the whole chain, advancing no version and publishing nothing
        required: false
        default: true
        type: boolean
      resume_packaging_run_id:
        description: Re-enter at an existing successful packaging-smoke run instead of bumping and rebuilding
        required: false
        default: ""
        type: string

# Product-scoped, and never cancelled. Two dispatches interleaving would race
# two versions through one manifest: the second bump would compute its version
# from a tree the first had already advanced.
concurrency:
  group: release-orchestrator-cadrumo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Cadrumo / resolve the dispatch into a plan
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      resume: ${{ steps.plan.outputs.resume }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Resolve the dispatch into a plan
        id: plan
        env:
          RESUME: ${{ inputs.resume_packaging_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Echoed rather than inferred later: every downstream stage keys on
          # these two outputs, so the decision is made once and read many times
          # instead of each job re-reading the raw inputs and drifting.
          echo "resume=${RESUME}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          if [[ -n "${RESUME}" ]]; then
            echo "Resuming from packaging-smoke run ${RESUME}; the bump and campaign stages are skipped."
          else
            echo "Full chain: bump, campaign, acquisition, seal."
          fi
          echo "rehearsal: dry_run=${DRY_RUN}"

  precondition:
    name: Cadrumo / refuse a claimed channel we cannot evidence
    needs: preflight
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Require operator-minted evidence for every claimed host-extension channel
        run: |
          # BEFORE the bump, deliberately. The four claude-* rows assert that a
          # REAL client installed real bytes; the emit honesty guard refuses
          # SDK-driven runs, and defeating it would make the evidence a lie
          # about what was installed. So they stay a human act and this stage
          # only REFUSES on their absence - it never tries to produce them.
          #
          # Placed ahead of the bump so a claimed-but-unevidenced channel stops
          # the chain while nothing is spent. Refusing after the bump would burn
          # a version to discover a precondition that was knowable at entry.
          #
          # Under today's descriptor no host-extension channel is claimed, so
          # this passes trivially. It exists so that flipping one to `available`
          # cannot silently publish it unevidenced.
          uv run --frozen python -m dev.packaging.publication_inputs \
            --check-host-extension-precondition

  bump:
    name: Cadrumo / compute and land the version bump
    needs: [preflight, precondition]
    # Skipped entirely on a resume: the version the earlier chain landed is
    # already on main, and bumping again would burn a second version to
    # recover from a failure that had nothing to do with the first.
    if: ${{ needs.preflight.outputs.resume == '' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Compute the version and land the bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
        run: |
          # The version is COMPUTED from conventional-commit history by
          # dev.release.version_bump, never supplied here: a hand-typed version
          # is the transcription error class this stage exists to remove, and
          # the module carries the identity guard that refuses an owned,
          # burned, or below-floor version BEFORE any ref leaves the runner.
          #
          # --push only outside a rehearsal. A dry_run stops after computing the
          # version, so the rehearsal proves this stage rather than skipping it.
          uv run --frozen python -m dev.release.version_bump \
            --repository "${GITHUB_REPOSITORY}" \
            $([ "${DRY_RUN}" = "true" ] && echo "--dry-run" || echo "--push")

  campaign:
    name: Cadrumo / run the packaging campaign at the bumped commit
    needs: [preflight, bump]
    # `always()` because the bump job is SKIPPED on a resume, and a skipped
    # dependency would otherwise skip this job too. The resume branch supplies
    # its own campaign run instead of building one.
    if: ${{ always() && needs.preflight.result == 'success' && needs.bump.result != 'failure' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    outputs:
      packaging_run_id: ${{ steps.campaign.outputs.packaging_run_id }}
      head_sha: ${{ steps.campaign.outputs.head_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Dispatch the packaging campaign and wait for MY run
        id: campaign
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ needs.preflight.outputs.resume }}
          BUMPED_COMMIT: ${{ needs.bump.outputs.commit }}
        run: |
          # Resolution is by IDENTITY, never by recency. packaging-smoke queues
          # rather than cancels on a newer dispatch, so the newest run of that
          # workflow can belong to a neighbouring campaign; promoting it would
          # carry a cohort this release never built. dev.release.run_resolution
          # captures the clock before dispatching and then resolves the run
          # started after that instant at this head commit.
          if [[ -n "${RESUME}" ]]; then
            # A resumed run is VERIFIED on exactly the terms Gate 2 verifies a
            # hand-supplied one, and for the same reason: this input is the only
            # place an operator still types a run id, so it is the only place a
            # wrong one can enter. Unverified, a resume could carry a foreign
            # or failed campaign's cohort straight to a sealed candidate.
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME}")"
            test "$(jq -r .conclusion <<<"$run_json")" = "success"
            test "$(jq -r .path <<<"$run_json")" = ".github/workflows/packaging-smoke.yml"
            test "$(jq -r .head_repository.full_name <<<"$run_json")" = "${GITHUB_REPOSITORY}"
            head_sha="$(jq -r .head_sha <<<"$run_json")"
            # main-ancestry, matching Gate 2's dispatch-event rule: a cohort
            # built off a branch that never landed must not reach publication.
            ancestry="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${head_sha}" --jq .status)"
            test "$ancestry" = "identical" -o "$ancestry" = "behind"
            echo "packaging_run_id=${RESUME}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            echo "Resumed from verified packaging-smoke run ${RESUME} at ${head_sha}; no campaign dispatched."
            exit 0
          fi
          head_sha="${BUMPED_COMMIT:-$(git rev-parse HEAD)}"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          uv run --frozen python -m dev.release.run_resolution \
            --workflow ".github/workflows/packaging-smoke.yml" \
            --head-sha "${head_sha}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output-name packaging_run_id

  acquire:
    name: Cadrumo / run the acquisition lanes the claimed channels require
    needs: [preflight, campaign]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    outputs:
      # One output per acquisition lane, carried to the seal stage. Without
      # these the ids were computed and DROPPED: the seal module reads three
      # acquisition environment variables, the stage declared no outputs, and
      # the seal step set none - so a sealed candidate recorded empty
      # acquisition sources and the promoter would have dispatched the
      # publication without its acquisition proofs. Vacuous only while the
      # descriptor claims python alone; it arms the moment a channel is claimed.
      scoop_run_id: ${{ steps.lanes.outputs.scoop_run_id }}
      homebrew_run_id: ${{ steps.lanes.outputs.homebrew_run_id }}
      claude_plugin_run_id: ${{ steps.lanes.outputs.claude_plugin_run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Dispatch every lane the claimed channels require
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN_ID: ${{ needs.campaign.outputs.packaging_run_id }}
          HEAD_SHA: ${{ needs.campaign.outputs.head_sha }}
        run: |
          # DERIVED, never hardcoded. The lane set comes from the same claimed-
          # channel authority the publication gate reads, so an unclaimed
          # channel is never dispatched and a claimed one cannot be skipped -
          # and flipping a channel to `available` arms its lane with no edit to
          # this workflow. Under today's python-only descriptor this loop is
          # legitimately empty.
          lanes="$(uv run --frozen python -m dev.packaging.publication_inputs --emit-lane-workflows)"
          if [[ -z "${lanes}" ]]; then
            echo "No acquisition lane is claimed by the current channel descriptor; nothing to dispatch."
            exit 0
          fi
          while IFS=$'	' read -r lane output_name; do
            [[ -z "${lane}" ]] && continue
            if [[ -z "${output_name}" ]]; then
              echo "REFUSED: acquisition lane ${lane} carries no output name; its run id would be dropped" >&2
              exit 1
            fi
            # The output name is DERIVED alongside the lane by the same module,
            # so this workflow names no lane at all. A lane whose run id had
            # nowhere to go was previously dropped at the job boundary, and the
            # publication would then run without its acquisition proof.
            echo "Dispatching acquisition lane ${lane} (-> ${output_name})"
            uv run --frozen python -m dev.release.run_resolution               --workflow "${lane}"               --head-sha "${HEAD_SHA}"               --repository "${GITHUB_REPOSITORY}"               --input "source_run_id=${PACKAGING_RUN_ID}"               --input "source_commit=${HEAD_SHA}"               --output-name "${output_name}"
          done <<< "${lanes}"

  seal:
    name: Cadrumo / seal the release candidate and stop
    needs: [preflight, campaign, acquire]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      # contents: write creates the candidate's own DRAFT release. It is not a
      # publication: the draft lives in a reserved tag namespace the evidence GC
      # cannot reach, and only the promoter ever reads it.
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Seal the candidate and end the run
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN_ID: ${{ needs.campaign.outputs.packaging_run_id }}
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          # The acquisition proofs this release produced. `seal_candidate` reads
          # these three names; leaving them unset recorded a candidate with no
          # acquisition sources at all.
          SCOOP_RUN_ID: ${{ needs.acquire.outputs.scoop_run_id }}
          HOMEBREW_RUN_ID: ${{ needs.acquire.outputs.homebrew_run_id }}
          CLAUDE_EVIDENCE_RELEASE: ${{ needs.acquire.outputs.claude_plugin_run_id }}
        run: |
          # THIS JOB IS TERMINAL, and that is the design rather than an
          # omission. The soak runs 48-72 hours; no workflow run spans that, and
          # a job that tried would hold one of four shared self-hosted runners
          # for days. So the chain records its state durably and STOPS.
          #
          # release-soak-promoter.yml resumes it once the window closes. This
          # workflow therefore never dispatches publish-release.yml: a run that
          # published would, by definition, not have waited.
          uv run --frozen python -m dev.release.seal_candidate \
            --repository "${GITHUB_REPOSITORY}" \
            --packaging-run-id "${PACKAGING_RUN_ID}" \
            --dry-run "${DRY_RUN}"

  alert:
    name: Cadrumo / alert the operator on a failed release-path run
    # A JOB, not a step. `if: failure()` inside a job only fires when a step in
    # THAT job failed - and a job whose dependency failed never runs at all, so
    # a step appended to the last job would alert on almost nothing. Needing
    # every job and running under `failure()` is what makes this cover the
    # whole chain.
    needs: [preflight, precondition, bump, campaign, acquire, seal]
    if: ${{ failure() || cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true

      - name: Alert the operator that this release-path run failed
        env:
          GH_TOKEN: ${{ github.token }}
          CADRUMO_ALERT_WEBHOOK: ${{ vars.CADRUMO_ALERT_WEBHOOK }}
        run: |
          # The approval click was the only moment a human was STRUCTURALLY
          # guaranteed to look at a release. With it gone, a silently failed run
          # is indistinguishable from a release nobody started, so this reaches
          # the operator where they already look rather than annotating a log
          # only someone already watching would read.
          #
          # Never fatal: the run is already red and its FIRST error is the one
          # that matters, so a refused alert warns and exits 0.
          # The captured refusal text, so the alert body carries WHY the run
          # failed rather than the no-detail placeholder. An alert saying only
          # "something failed, here is a link" spends the operator's attention
          # on navigation, which is the cost this channel exists to avoid.
          jq_filter='[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name + ": " + .conclusion] | join("; ")'
          detail="$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq "${jq_filter}" 2>/dev/null || true)"
          uv run --frozen python -m dev.release.alerting --stage "orchestration" --detail "${detail:-no per-job detail available}"
