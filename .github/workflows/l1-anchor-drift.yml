name: L1 anchor drift

# EPIC #305 cluster H — weekly upstream drift detection for publicly-sourced
# AEAT / BOE reference PDFs (manifest at
# tests/fixtures/pdf_corpus/l1_public_anchors/_manifest.json).
#
# When the BOE or AEAT refreshes a hash-pinned anchor, this workflow detects
# the mismatch and opens a tracking issue so the corpus is updated before
# downstream extractor tests silently drift.

on:
  schedule:
    # 05:00 UTC every Monday — run after most AEAT publication windows.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check L1 anchor drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Check L1 anchors against upstream
        id: check
        run: uv run python scripts/fetch_l1_anchors.py --check-drift
        continue-on-error: true
      - name: Open drift issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `L1 anchor drift detected on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The weekly \`l1-anchor-drift\` workflow detected a SHA-256 mismatch`,
              `between an entry in \`tests/fixtures/pdf_corpus/l1_public_anchors/_manifest.json\``,
              `and the current upstream bytes.`,
              ``,
              `Full run: ${runUrl}`,
              ``,
              `Next steps:`,
              `1. Inspect the failing entry in the run logs.`,
              `2. Verify the upstream URL still serves the same legal artifact (BOE order,`,
              `   Manual práctico chapter, etc.) rather than a superseded version.`,
              `3. If the replacement is semantically equivalent, update the manifest`,
              `   entry's \`sha256\` + \`fetched_at\` fields + re-run the test suite to`,
              `   confirm extractors still pass.`,
              `4. If the upstream is structurally different (new layout, new casillas),`,
              `   open a follow-up issue to extend the declaración extractor corpus.`,
              ``,
              `Do not silently bump the SHA without step 2 — an undetected schema drift`,
              `invalidates every downstream fixture-tier-L1 test.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["type:bug", "domain:financial-input", "priority:P1-high"],
            });
      - name: Surface drift status to the run
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::L1 anchor drift detected — see the tracking issue opened on this repo."
          exit 1
