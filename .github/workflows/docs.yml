# Documentation VERIFICATION lane, triggered by the documentation surface.
#
# Not to be confused with docs-publish.yml, which is DELIVERY: that one fires on
# `release: published` and ships the built site. This one proves the docs build
# and its conformance gates on the push that changed them, and ships nothing.
#
# Why this exists as its own lane. The T0 carve-out was keyed on file SUFFIX
# rather than on role: `**.md` held `docs/index.md` out of every lane while
# `docs/**.rst` — 1384 files, the bulk of the surface — fell through and started
# the full Python static+unit suite. So a documentation edit paid the code
# lane's twelve minutes AND received no documentation verdict, because
# `docs-check` runs only in the dispatch-only ci-full lane. Both halves of that
# were wrong in the same direction: the expensive signal fired on the wrong
# input, and the correct signal did not fire at all.
#
# The ci-speed-redesign ADR moved the docs build off the per-push path
# deliberately, and that decision stands: it is about not running the docs build
# on every CODE push. A lane triggered BY the documentation paths is the
# complement of that ruling, not a reversal of it — the build runs when its own
# inputs change and never when they do not.
#
# Trigger scope covers the three inputs the build actually reads: the docs tree
# itself, the generators and gates under dev/docs, and the terminology corpus
# the glossary and search surfaces are produced from.

name: Cadrumo Docs Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "dev/docs/**"
      - "src/cadrumo/_data/terminology/**"
      - ".github/workflows/docs.yml"
  # SAME-REPO pull_request only: these jobs run on self-hosted runners, and a
  # fork PR would execute untrusted PR-head code on the operator's machines.
  # The job below carries the same-repo guard, so a fork PR's job skips.
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "dev/docs/**"
      - "src/cadrumo/_data/terminology/**"
      - ".github/workflows/docs.yml"

# Push runs QUEUE; pull-request runs supersede — the same split ci.yml already
# carries, and for the same measured reason.
#
# THIS LANE HAD NEVER PRODUCED A SUCCESS. Measured over its last 12 runs: 10
# cancelled, 2 failed, 0 succeeded. Every push to `main` shares `github.ref`,
# so with an unconditional `cancel-in-progress` each push killed the run the
# previous push started, and at this fleet's commit rate no run outlived the
# interval to the next one. The comment this replaces called a docs run "a
# disposable signal for the newest push", which is true of the INTENT and was
# false of the effect: a signal that never arrives is not disposable, it is
# absent, and a cancelled run reports identically to a run that never started.
#
# THE CANCELLATION BOUGHT NOTHING. With `cancel-in-progress` absent only ONE
# run may be pending in a group, and a newly queued run cancels the previously
# pending one — so both settings cap this lane at one in flight and one
# waiting, differing only in whether the in-flight run is allowed to finish.
# The runners are self-hosted and consume no Actions minutes, so there is no
# billing saving either.
#
# The cost that is real: a completed verdict may name a sha a few commits old.
# That is strictly better than the no-verdict-at-all this replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cadrumo-docs:
    name: Cadrumo / docs conformance / Python 3.13
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    # The nitpicky warnings-as-errors Sphinx build is multi-minute by design;
    # this ceiling kills a wedge without flaking a cold cache.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: CI Bootstrap
        # `--frozen`, like every other lane: install from the committed lock
        # rather than re-resolving the graph against the index per run.
        run: |
          uv sync --frozen
          uv run vaultspec-core install --force

      - name: Provision Playwright Chromium
        # The docs lane genuinely needs a browser: the search-page gates
        # (palette ranking, inline ladder, query-param, full-text class ranking,
        # pagefind injection, deployment parity) drive the built page in
        # Chromium. Without this they fail on the harness, not on the content.
        run: just env-playwright

      - name: Build the documentation site
        # THE GATES READ A BUILT ARTEFACT, so the build is a precondition and not
        # a duplicate of it. Several `dev/docs/tests` gates assemble a corpus from
        # `docs/_build/html` and refuse rather than skip when it is absent — "this
        # gate reads a real artefact, so it needs a real build to read". On a
        # developer machine the directory is already there from ordinary work, so
        # this dependency is invisible locally; on a runner that has never built
        # the docs it is the whole failure. Measured: this lane's first real run
        # (2026-08-05) failed exactly here, thirteen times over, having never been
        # executed before because the workflow had not reached the remote.
        #
        # ci-full.yml carried the same gap (fixed separately in 8cbd32eea6).
        # CORRECTION to what this comment first claimed: that lane had not been
        # "passing on a stale artefact" — it has NEVER RUN. The workflow's run
        # count is zero, so it was an unrun lane carrying the same latent gap,
        # which would have failed on its first dispatch. The stale-artefact
        # hazard is real but had not yet had the chance to fire.
        run: just docs

      - name: Documentation conformance
        # The docs-marked tests (nitpicky warnings-as-errors Sphinx build,
        # module-to-stub correspondence, CLI reference drift) plus doc8 and
        # interrogate — the same recipe ci-full.yml invokes, so the two lanes
        # cannot drift. 8 workers, never auto: this machine's 24 logical CPUs
        # are shared with co-resident runners from other repositories
        # (.github/ci-control-plane.md; 8 is a working pin, not a derivation).
        run: just docs-check 8
