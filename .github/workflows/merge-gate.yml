name: Cadrumo Merge Gate

on:
  pull_request:
    branches: [feature/tui, main]
    types: [opened, reopened, synchronize]
  # A landing reaches feature/tui by a direct push, which no pull request
  # event sees; this run measures the landed head over the full population.
  # Every landed head keeps its own run: a newer landing neither cancels nor
  # replaces it.
  push:
    branches: [feature/tui]
  # The release proof calls this gate for its full, unscoped population.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # One group per pull request AND per trigger. A call from the release
  # proof is proving a branch; a later pull request event on the same branch
  # must not cancel it. Two pull request events still share a group and
  # still supersede each other.
  #
  # A push run's group also ends in its own commit, so no two landed heads
  # share one. Without that suffix a group holds one running and one pending
  # run, and a third landing replaces the pending one: trains land faster
  # than a run finishes, so heads would still go unmeasured with nothing
  # cancelled in progress.
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  # Only a pull request's newer event cancels its older run. A push run and a
  # called run are each proving one commit and run to their verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A cache a pull request writes is restored by that pull request's later
  # runs. A fork's run therefore neither restores nor saves one, so nothing a
  # fork ran outlives its job.
  CADRUMO_CI_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

# The headless lane. Every job runs on a GitHub-hosted runner: a fresh machine
# per job, no display, no native toolchain, no secret and no repository
# variable. A pull request from a fork therefore runs here like any other, once
# a maintainer approves its run, and never reaches a self-hosted machine. The
# native lane (`native.yml`) holds everything that needs one.
#
# A job whose tests start the runtime asks the setup action for worker
# containment: the runtime launches each profile worker as a transient systemd
# user unit, and a hosted job's user has no user manager until one is started.
jobs:
  plan:
    name: "Check: Change scope (Linux)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      ci-contracts: ${{ steps.plan.outputs.ci-contracts }}
      sequence-goldens: ${{ steps.plan.outputs.sequence-goldens }}
      scoped: ${{ steps.changes.outputs.path != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A promotion into main and a call from the release proof read no change
      # list, so they select the full population.
      - name: Read changed paths from the pull request
        id: changes
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mkdir -p var/ci
          # The API caps this listing at 3,000 files. Incomplete or stale
          # metadata must leave the path unset so the full population runs.
          if [ "$EXPECTED_FILES" -ge 3000 ]; then
            echo "Change listing exceeds the API limit; selecting the full gate"
            exit 0
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            > var/ci/changed-files.json
          actual_files="$(jq '[.[][]] | length' var/ci/changed-files.json)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha + ":" + .base.sha')"
          if [ "$actual_files" != "$EXPECTED_FILES" ] || [ "$current" != "${EXPECTED_HEAD}:${EXPECTED_BASE}" ]; then
            echo "Change listing is incomplete or belongs to another revision; selecting the full gate"
            exit 0
          fi
          jq -r '.[][] | .filename, (.previous_filename // empty)' var/ci/changed-files.json \
            > var/ci/changed-paths.txt
          echo "path=var/ci/changed-paths.txt" >> "$GITHUB_OUTPUT"

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          authority: "false"
          cache: ${{ env.CADRUMO_CI_CACHE }}

      - name: Plan the test shards
        id: plan
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.path }}
        run: just test-gate-plan "$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      # Every later job reads the same list this plan was made from.
      - name: Upload the changed paths
        if: steps.changes.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadrumo-changed-paths
          path: var/ci/changed-paths.txt
          if-no-files-found: error
          retention-days: 1

  lint:
    name: "Check: Lint (Linux)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every lint gate is static, so none of them loads the registry authority
      # and publishing one here only spent minutes compiling it.
      - name: Set up toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          authority: "false"
          cache: ${{ env.CADRUMO_CI_CACHE }}

      # `!cancelled()` keeps every independent gate reporting its own verdict
      # instead of stopping at the first red one. The setup guard is the other
      # half: a step whose tool the toolchain never installed exits 127 with
      # "Failed to spawn", and one dead setup was reporting as four failed
      # gates, putting the wrong subsystem at the top of the frequency table.
      - name: Style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-style

      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-format

      - name: Type checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-types

      - name: TypeScript module size
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-module-size

      - name: Year literals
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-year-literals

      - name: Workflow definitions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflows

      - name: Workflow security
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflow-security

  # Compiling the authority costs minutes and every job below reads the same
  # one, so it is compiled once here and restored everywhere else. Each
  # consumer still runs the currency check against its own checkout, which
  # republishes rather than trusting an artifact that does not match.
  authority:
    name: "Build: Registry authority (Linux)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          cache: ${{ env.CADRUMO_CI_CACHE }}

      - name: Upload the published registry authority
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadrumo-registry-authority-headless
          path: |
            .authority/authority.current.json
            .authority/authority-*.sqlite3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  checks:
    name: "Check: Security, registry and import boundaries (Linux)"
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}

      - name: Semgrep full scan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-security-full

      - name: Registry gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-registry-gate

      - name: Import boundaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-import-boundaries

  # The personas and every fixture producer check. One producer runs from the
  # frontend's installed packages, so Node and those packages come first. The
  # window projections are build output and a fresh runner holds none, so the
  # gate produces the ones a check compares before it runs the checks.
  fixtures:
    name: "Check: Fixtures and personas (Linux)"
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ env.CADRUMO_CI_CACHE == 'true' && 'npm' || '' }}
          cache-dependency-path: native/desktop/frontend/package-lock.json

      - name: Frontend packages
        shell: bash
        run: just setup-desktop-frontend

      - name: Fixture projections
        shell: bash
        run: just fixtures-gate

  # A job of its own because a selected change executes every documented CLI
  # sequence, minutes no other job's budget should absorb. The gate decides
  # from the changed paths whether anything is selected; the plan's answer only
  # spares an unselected run the toolchain. No verdict is kept between runs: a
  # record a pull request could write would let it clear its own later run.
  goldens:
    name: "Check: Committed sequence goldens (Linux)"
    needs: [plan, authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        if: needs.plan.outputs.sequence-goldens == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the changed paths
        if: needs.plan.outputs.sequence-goldens == 'true' && needs.plan.outputs.scoped == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadrumo-changed-paths
          path: var/ci

      - name: Set up toolchain
        id: setup
        if: needs.plan.outputs.sequence-goldens == 'true'
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}
          worker-containment: "true"

      - name: Committed sequence goldens
        if: needs.plan.outputs.sequence-goldens == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ needs.plan.outputs.scoped == 'true' && 'var/ci/changed-paths.txt' || '' }}
        run: |
          if [ -n "$CHANGED_FILES" ]; then
            just test-sequence-goldens-gate --changed-files "$CHANGED_FILES"
          else
            just test-sequence-goldens-gate
          fi

      # A documented sequence that fails keeps its sandbox's diagnostic log
      # under .tmp/failed-sandboxes, and the transcript names a refusal only
      # by its reason; the log names the module, function and line. The runner
      # is discarded with the job, so a failed job publishes those logs and
      # nothing else from the sandbox. They are redacted by the product's own
      # log filter and come from the committed synthetic profile on a runner
      # that holds no secret. No job reads the artifact back.
      - name: Upload the failed sandbox logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadrumo-failed-sandbox-logs-goldens
          path: .tmp/failed-sandboxes/**/logs/cadrumo.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # The scoped test population, dealt over the matrix the plan printed. Four
  # workers match the hosted runner's four cores.
  tests:
    name: "Test: Scoped tests (Linux, shard ${{ matrix.shard }})"
    needs: [plan, authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CADRUMO_PYTEST_WORKERS: "4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the changed paths
        if: needs.plan.outputs.scoped == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadrumo-changed-paths
          path: var/ci

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}
          worker-containment: "true"

      # Some tests bundle frontend sources, so the packages are installed as
      # they were in the single gate job these shards replace.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ env.CADRUMO_CI_CACHE == 'true' && 'npm' || '' }}
          cache-dependency-path: native/desktop/frontend/package-lock.json

      - name: Frontend packages
        shell: bash
        run: just setup-desktop-frontend

      - name: Scoped tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          CHANGED_FILES: ${{ needs.plan.outputs.scoped == 'true' && 'var/ci/changed-paths.txt' || '' }}
        # A runner that runs out of memory or disk is stopped, and fails no
        # test: the log ends without a reason. The sampler prints the machine's
        # memory, disk, load and largest processes into this step's log while
        # the tests run, so its last lines say what the runner had left. It is
        # stopped with the step; the tests' exit status is the step's.
        run: |
          uv run --no-sync python -m dev.ci.runner_resources --every 30 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          just test-gate-shard "$SHARD" "$CHANGED_FILES"

      # The kernel names each process it killed for memory. A runner that
      # survives a failed shard prints those records; an empty answer says so.
      - name: Report the kernel's kill records
        if: ${{ failure() }}
        shell: bash
        run: |
          sudo dmesg --ctime | grep -E -i 'out of memory|oom-kill|killed process' | tail -n 40 \
            || echo "the kernel recorded no kill"

      # As in the goldens job: the failed sandboxes' redacted logs, nothing else.
      - name: Upload the failed sandbox logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadrumo-failed-sandbox-logs-tests-${{ strategy.job-index }}
          path: .tmp/failed-sandboxes/**/logs/cadrumo.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  contracts:
    name: "Test: CI contracts (Linux)"
    needs: [plan, authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CADRUMO_PYTEST_WORKERS: "4"
    steps:
      - name: Checkout repository
        if: needs.plan.outputs.ci-contracts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        if: needs.plan.outputs.ci-contracts == 'true'
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}

      - name: CI contracts
        if: needs.plan.outputs.ci-contracts == 'true'
        shell: bash
        run: just test-ci-contracts-gate

  # The harness proofs own a worker pool of their own, so they run outside
  # every shard's pool, once per run and on every run.
  harness:
    name: "Test: Verification harness (Linux)"
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          authority-artifact: cadrumo-registry-authority-headless
          cache: ${{ env.CADRUMO_CI_CACHE }}
          worker-containment: "true"

      - name: Verification harness
        shell: bash
        run: just test-pytest-harness

      # As in the goldens job: the failed sandboxes' redacted logs, nothing else.
      - name: Upload the failed sandbox logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadrumo-failed-sandbox-logs-harness
          path: .tmp/failed-sandboxes/**/logs/cadrumo.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # The one required check. `always()` runs it after a failure, a skip or a
  # cancellation alike, so it is never the skipped check GitHub would count as
  # passing; it holds no checkout and runs no repository code.
  verdict:
    name: "Check: Merge gate (Linux)"
    needs: [plan, lint, authority, checks, fixtures, goldens, tests, contracts, harness]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            # The same verdict twice, because the audiences differ. The one
            # required check is the only thing a reviewer sees on the pull
            # request, and "the merge gate failed" does not say which stage
            # did; naming it in the step summary puts that on the checks page
            # instead of behind a log nobody opens.
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")"
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every merge gate job succeeded"
