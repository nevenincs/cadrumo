name: Cadrumo Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_call:
    inputs:
      full:
        description: Run the full semgrep scan instead of the diff scan
        required: false
        default: false
        type: boolean
  # release-please opens the release pull request with the default token, whose
  # pushes and pull requests start no workflow runs, so that pull request would
  # never report this gate. A dispatch is exempt from that rule and its check
  # run lands on the branch head the pull request is waiting on.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One group per pull request AND per trigger. A dispatched run is a
  # release proving a branch; a later pull request event on the same branch
  # must not cancel it. Two pull request events still share a group and
  # still supersede each other, so that path is unchanged.
  group: merge-gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Pull requests from forks never start a working job: every job that checks out
# code carries the same-repository condition, and the verdict, which is never
# skipped, refuses a fork outright. A skipped required check would read as green.
jobs:
  lint:
    name: "Check: Lint (Linux)"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Set up toolchain
        id: setup
        uses: ./.github/actions/setup

      # `!cancelled()` keeps every independent gate reporting its own verdict
      # instead of stopping at the first red one. The setup guard is the other
      # half: a step whose tool the toolchain never installed exits 127 with
      # "Failed to spawn", and one dead setup was reporting as four failed
      # gates, putting the wrong subsystem at the top of the frequency table.
      - name: Style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-style

      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-format

      - name: Type checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-types

      - name: Workflow definitions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflows

      - name: Workflow security
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflow-security

  gate:
    name: "Check: Scoped gate (Linux)"
    needs: lint
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.lint.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      CADRUMO_PYTEST_WORKERS: "8"
      GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Semgrep diff scan
        if: ${{ !inputs.full }}
        shell: bash
        run: just check-security-diff "$GATE_BASE"

      - name: Semgrep full scan
        if: ${{ inputs.full }}
        shell: bash
        run: just check-security-full

      - name: Set up toolchain
        id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup

      - name: Registry gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-registry-gate

      - name: Import boundaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-import-boundaries

      - name: Scoped tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just test-gate "$GATE_BASE"

  verdict:
    name: "Check: Merge gate (Linux)"
    needs: [lint, gate]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Refuse fork pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          echo "Pull requests from forks are refused; no gate job ran."
          exit 1

      - name: Require every gate job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            # The same verdict twice, because the audiences differ. The one
            # required check is the only thing a reviewer sees on the pull
            # request, and "the merge gate failed" does not say which stage
            # did; naming it in the step summary puts that on the checks page
            # instead of behind a log nobody opens.
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")"
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every merge gate job succeeded"
