name: Cadrumo Merge Gate

on:
  pull_request:
    branches: [feature/tui]
    types: [opened, reopened, synchronize]
  # A calling run that already published the registry authority names its
  # artifact here, so the scoped gate restores it instead of compiling another.
  workflow_call:
    inputs:
      authority-artifact:
        description: This run's published-authority artifact; empty publishes locally.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  # One group per pull request AND per trigger. A call from the release
  # proof is proving a branch; a later pull request event on the same branch
  # must not cancel it. Two pull request events still share a group and
  # still supersede each other.
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Every job runs on a self-hosted runner, so a pull request reaches one only
# from this repository and from an owner, a collaborator or the release App.
# Any other pull request starts no job. The withheld verdict reports under a
# different name, because GitHub treats a skipped required check as passing:
# the required check then never reports and the pull request cannot merge.
jobs:
  lint:
    name: "Check: Lint (Linux)"
    if: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]'))) }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every lint gate is static, so none of them loads the registry authority
      # and publishing one here only spent minutes compiling it.
      - name: Set up toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          authority: "false"

      # `!cancelled()` keeps every independent gate reporting its own verdict
      # instead of stopping at the first red one. The setup guard is the other
      # half: a step whose tool the toolchain never installed exits 127 with
      # "Failed to spawn", and one dead setup was reporting as four failed
      # gates, putting the wrong subsystem at the top of the frequency table.
      - name: Style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-style

      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-format

      - name: Type checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-types

      - name: TypeScript module size
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-module-size

      - name: Workflow definitions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflows

      - name: Workflow security
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-workflow-security

  gate:
    name: "Check: Scoped gate (Linux)"
    needs: lint
    if: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]'))) && needs.lint.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      CADRUMO_PYTEST_WORKERS: "8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read changed paths from the pull request
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mkdir -p var/ci
          # The API caps this listing at 3,000 files. Incomplete or stale
          # metadata must leave the path unset so both gates run in full.
          if [ "$EXPECTED_FILES" -ge 3000 ]; then
            echo "Change listing exceeds the API limit; selecting the full gate"
            exit 0
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            > var/ci/changed-files.json
          actual_files="$(jq '[.[][]] | length' var/ci/changed-files.json)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha + ":" + .base.sha')"
          if [ "$actual_files" != "$EXPECTED_FILES" ] || [ "$current" != "${EXPECTED_HEAD}:${EXPECTED_BASE}" ]; then
            echo "Change listing is incomplete or belongs to another revision; selecting the full gate"
            exit 0
          fi
          jq -r '.[][] | .filename, (.previous_filename // empty)' var/ci/changed-files.json \
            > var/ci/changed-paths.txt
          echo "path=var/ci/changed-paths.txt" >> "$GITHUB_OUTPUT"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: false
          version: "0.11.29"
          enable-cache: false

      - name: Semgrep full scan
        shell: bash
        run: just check-security-full

      - name: Set up toolchain
        id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
        with:
          authority-artifact: ${{ inputs.authority-artifact }}

      - name: Registry gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-registry-gate

      # One fixture producer runs from the frontend's installed packages, so
      # they come before the check; the check reads the sources and writes no
      # fixture. Node is provisioned here rather than taken from the runner.
      - name: Set up Node
        id: node
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Frontend packages
        id: frontend-packages
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        shell: bash
        run: just setup-desktop-frontend

      - name: Fixture projections
        if: ${{ !cancelled() && steps.frontend-packages.outcome == 'success' }}
        shell: bash
        run: just fixtures-check

      - name: Import boundaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: just check-import-boundaries

      - name: Scoped tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.path }}
        run: just test-gate "$CHANGED_FILES"

      # Its own step because a cache miss executes every documented CLI
      # sequence, minutes the scoped tests' step budget cannot absorb. The
      # checkout's `.cache` is wiped on every run, so the verdict records live in
      # the runner's tool cache instead: an input set that already passed on
      # this runner reuses its clean verdict rather than executing again.
      - name: Committed sequence goldens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          CADRUMO_DEV_CACHE_ROOT: ${{ runner.tool_cache }}/cadrumo-dev-cache
          CHANGED_FILES: ${{ steps.changes.outputs.path }}
        run: |
          if [ -n "$CHANGED_FILES" ]; then
            just test-sequence-goldens-gate --changed-files "$CHANGED_FILES"
          else
            just test-sequence-goldens-gate
          fi

  desktop:
    name: "Check: Frontend and Rust (Linux)"
    needs: lint
    if: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]'))) && needs.lint.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    # The host preset configures the desktop targets only with the payload,
    # and the payload needs the runner's cadrumo-agent checkout, exactly as the
    # release's native verification does.
    env:
      CADRUMO_PACKAGE_AGENT_SOURCE_DIR: ${{ vars.CADRUMO_PACKAGE_AGENT_SOURCE_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require the repository agent-source variable
        shell: bash
        run: |
          if [ -z "${CADRUMO_PACKAGE_AGENT_SOURCE_DIR// /}" ]; then
            echo "Repository variable CADRUMO_PACKAGE_AGENT_SOURCE_DIR must name the cadrumo-agent project directory." >&2
            exit 1
          fi

      # The recipes below seed the fixture projections themselves, and the
      # producers read the registry authority, so this job restores it. The
      # window's specs launch the frontend's own Playwright browser, provisioned
      # below, not the Python Playwright's.
      - name: Set up toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          authority-artifact: ${{ inputs.authority-artifact }}

      # Every native tool is provisioned here rather than taken from whatever
      # the runner holds; Rust and CMake follow native/toolchain.json.
      - name: Read the native toolchain pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$(jq -er .rust native/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(jq -er .cmake native/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: ${{ steps.pins.outputs.cmake }}

      - name: Set up Rust
        shell: bash
        env:
          RUST_PIN: ${{ steps.pins.outputs.rust }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_PIN" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_PIN" >> "$GITHUB_ENV"

      - name: Configure the native build with the agent checkout
        id: configure
        shell: bash
        run: just configure-native-agent "$CADRUMO_PACKAGE_AGENT_SOURCE_DIR"

      - name: Frontend packages and browser
        id: frontend-browser
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        shell: bash
        run: just setup-desktop-browser

      - name: Frontend checks and specs
        if: ${{ !cancelled() && steps.frontend-browser.outcome == 'success' }}
        shell: bash
        run: just test-frontend

      - name: Native Rust tests
        if: ${{ !cancelled() && steps.frontend-browser.outcome == 'success' }}
        shell: bash
        run: just test-native

  verdict:
    name: "${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]'))) && 'Check: Merge gate (Linux)' || 'Check: Merge gate withheld (Linux)' }}"
    # `desktop` stays out until one real runner run of it is green: its
    # configure, toolchain and browser provisioning are unproven on the runner.
    needs: [lint, gate]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]'))) }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 66
    steps:
      - name: Require every gate job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            # The same verdict twice, because the audiences differ. The one
            # required check is the only thing a reviewer sees on the pull
            # request, and "the merge gate failed" does not say which stage
            # did; naming it in the step summary puts that on the checks page
            # instead of behind a log nobody opens.
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")"
            echo "The merge gate requires every job to succeed; not successful: $(tr '\n' ' ' <<<"$failed")" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every merge gate job succeeded"
