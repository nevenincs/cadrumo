name: Cadrumo Release Please

on:
  push:
    branches:
      - main
  # Dispatchable as well as push-driven. release-please keeps its state in the
  # release PR's labels, and a release published by hand leaves that state
  # stale: the run then reports SUCCESS while aborting with "there are
  # untagged, merged release PRs outstanding", and opens no release PR. That
  # sat undetected for three days and 121 releasable commits, because the only
  # way to re-run the automation after repairing the label was to push
  # something. Recovery should not require a commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-please-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-please:
    timeout-minutes: 30
    name: "Build: Release proposal (Linux)"
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Refs, releases and pull requests created with the default token start
      # no workflow runs, so the release pull request would never report the
      # merge gate. An App token makes release-please's writes trigger CI.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv for the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Regenerate and push uv.lock onto the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push
          fi

      # The lockfile push lands after release-please makes the pull request
      # mergeable. A release merged inside that window ships the previous
      # version's lockfile, and every job installing with `--frozen` then fails
      # at dependency install. Reconcile through a pull request rather than
      # assuming the window was missed.
      - name: Check out main to verify the released lockfile
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv for the lockfile verification
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Open a reconciling pull request when the lockfile drifted
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if uv lock --locked; then
            echo "uv.lock on main matches the released version"
            exit 0
          fi
          echo "::warning::uv.lock on main did not match the released version; opening a reconciling pull request"
          uv lock
          BRANCH="chore/reconcile-uv-lock-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add uv.lock
          git commit -m "chore(deps): reconcile uv.lock with ${TAG}"
          git push --set-upstream origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "chore(deps): reconcile uv.lock with ${TAG}" \
            --body "Main carries the previous version's \`uv.lock\`. Every job installing with \`--frozen\` fails until this merges."

      - name: Dispatch release proof for the release pull request
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::could not read the proposed version from the release branch manifest"
            exit 1
          fi
          gh workflow run release.yml --ref "${HEAD_BRANCH}"             -f phase=prove -f "ref=${HEAD_BRANCH}" -f "version=${version}"
          echo "Dispatched release proof for ${version} on ${HEAD_BRANCH}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release publication
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "${TAG}" ] || [ -z "${VERSION}" ]; then
            echo "::error::release_created is true but the tag or version is empty"
            exit 1
          fi
          gh workflow run release.yml --ref "${TAG}"             -f phase=publish -f "ref=${TAG}" -f "version=${VERSION}"
          echo "Dispatched release publication for ${VERSION} at ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # A release-please run that finds a merged, untagged release PR aborts
      # and exits ZERO. That green abort is why this repository went six months
      # without completing a release: nothing was ever red, so nothing was ever
      # investigated, while the automation reported success and created
      # nothing. The abort is only visible by reading a job log on a passing
      # run, which nobody does.
      #
      # Asserted at the END of the run, which is what makes it a discriminator
      # rather than a race: by this point a healthy run has tagged the release
      # and advanced its pull request to `autorelease: tagged`, so a merged one
      # still carrying `autorelease: pending` means this run aborted. Every
      # later run will abort the same way until a human intervenes, so failing
      # here is the difference between a deadlock that surfaces in minutes and
      # one that survives for months.
      - name: Refuse a deadlocked release state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stuck="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged \
            --label 'autorelease: pending' --limit 20 --json number,title \
            --jq '.[] | "#\(.number) \(.title)"')"
          if [ -n "${stuck}" ]; then
            echo "::error::release-please left a merged release pull request untagged; every later run aborts in green until this is repaired"
            printf '%s\n' "${stuck}"
            exit 1
          fi
          echo "no merged release pull request is waiting for a tag"
