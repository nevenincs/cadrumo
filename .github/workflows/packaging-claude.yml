# Real Claude acquisition gates for the immutable Cadrumo Python cohort.
# The Claude plugin and MCPB each carry and launch the same tested Python cohort.

name: Cadrumo Claude Acquisition

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Cadrumo Packaging Smoke run containing the tested cohort
        required: true
        type: string
      source_commit:
        description: Full commit SHA that produced the tested cohort
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # This lane is Windows-only, so an offline Windows runner leaves the whole
  # dispatch queued rather than failed. See dev/ci/runner_queue_watchdog.py.
  runner-queue-watchdog:
    name: Cadrumo / runner queue watchdog
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "300"
          MAX_WATCH_SECONDS: "900"
        run: python3 dev/ci/runner_queue_watchdog.py

  cadrumo-claude-acquisition:
    name: Cadrumo / Windows / Claude plugin and MCPB
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      # shell pinned to pwsh 7 (Utility-module cmdlets): the self-hosted
      # runner's rewritten PSModulePath breaks 5.1 module auto-loading.
      - name: Initialize current-run evidence root
        id: initialize
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $root = Join-Path `
            $env:RUNNER_TEMP `
            "cadrumo-claude-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          "CADRUMO_CLAUDE_ROOT=$root" | Add-Content -LiteralPath $env:GITHUB_ENV
          [ordered]@{
            schema = "cadrumo.packaging.claude-workflow.v1"
            status = "initialized"
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            source_run_id = $env:SOURCE_RUN_ID
            source_commit = $env:SOURCE_COMMIT
            initialized_at = [DateTimeOffset]::UtcNow.ToString("O")
          } |
            ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $root "run-context.json") -Encoding UTF8
          "ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Verify source workflow identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch "^[0-9a-fA-F]{40}$") {
            throw "source_commit must be one full Git commit SHA"
          }
          if ($env:SOURCE_RUN_ID -notmatch "^[1-9][0-9]*$") {
            throw "source_run_id must be one positive workflow run id"
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $run = Invoke-RestMethod `
            -Headers $headers `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          if ($run.name -ne "Cadrumo Packaging Smoke") {
            throw "source run is not the Cadrumo Packaging Smoke workflow"
          }
          if ($run.path -ne ".github/workflows/packaging-smoke.yml") {
            throw "source run does not use the packaging-smoke workflow authority"
          }
          if ($run.conclusion -ne "success") {
            throw "source packaging run did not succeed"
          }
          if ($run.head_branch -ne "main") {
            throw "source packaging run must target main"
          }
          if ($run.event -eq "workflow_dispatch") {
            # The full campaign is dispatch-only (ci-speed redesign,
            # 2026-07-20): a dispatch run is trusted only when its commit is
            # verified on main history via the compare API - equal-or-stronger
            # than the former push-event pin, which trusted the push router.
            $ancestry = Invoke-RestMethod `
              -Headers $headers `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/compare/main...$($run.head_sha)"
            if ($ancestry.status -ne "identical" -and $ancestry.status -ne "behind") {
              throw "dispatch-event source run commit is not on main history"
            }
          }
          elseif ($run.event -ne "push") {
            throw "source packaging run must be a push or dispatch run on main"
          }
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "source packaging run does not belong to this repository"
          }
          if ($run.head_sha -ne $env:SOURCE_COMMIT.ToLowerInvariant()) {
            throw "source packaging run commit does not match source_commit"
          }

      - name: Checkout tested source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: true

      # The acquisition lanes consume the LINUX-built python cohort (wheels are
      # py3-none-any). The source run's identity is pinned by the verify step
      # above; an artifact belongs to its producing run by construction, so
      # that check is the whole binding for these bytes.
      # shell pinned to pwsh 7: the self-hosted runner's rewritten PSModulePath
      # breaks Windows PowerShell 5.1 module auto-loading.
      - name: Download the tested Cadrumo Python cohort from the verified source run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          gh run download $env:SOURCE_RUN_ID --name cadrumo-python-cohort-linux `
            --dir "$env:CADRUMO_CLAUDE_ROOT/download"
          if ($LASTEXITCODE -ne 0) { throw "python cohort download failed" }
          New-Item -ItemType Directory -Force "$env:CADRUMO_CLAUDE_ROOT/cohort" | Out-Null
          tar -xzf "$env:CADRUMO_CLAUDE_ROOT/download/cadrumo-python-cohort-linux.tar.gz" `
            -C "$env:CADRUMO_CLAUDE_ROOT/cohort"
          if ($LASTEXITCODE -ne 0) { throw "cohort extraction failed" }

      - name: Verify tested Python cohort
        shell: powershell
        run: |
          uv run --no-project --with packaging python -m dev.packaging.python_cohort verify `
            --cohort-dir "$env:CADRUMO_CLAUDE_ROOT/cohort"
          if ($LASTEXITCODE -ne 0) {
            throw "tested Python cohort verification failed"
          }

      # Runner-agnostic node: on the self-hosted Windows runner this provisions
      # a tool-cache node whose npm global prefix lives INSIDE the runner's
      # managed install, so the pinned Claude Code global install never touches
      # the operator's own node/npm on the host machine.
      - name: Provision Node.js for the pinned Claude Code client
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The pin must be REAL: resolve the npm-global installed shim by ABSOLUTE
      # path (never `Get-Command claude`, which PATH-resolved the operator's
      # native auto-updating claude.exe over the npm pin on the self-hosted
      # runner) and refuse loudly when --version drifts from the pin.
      - name: Install pinned Claude Code client
        shell: powershell
        run: |
          node --version
          npm --version
          $pin = "2.1.211"
          npm install --global "@anthropic-ai/claude-code@$pin"
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code installation failed"
          }
          $npmPrefix = (npm prefix --global | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $npmPrefix) {
            throw "npm global prefix is unresolvable"
          }
          $claude = Join-Path $npmPrefix "claude.cmd"
          if (-not (Test-Path -LiteralPath $claude -PathType Leaf)) {
            throw "pinned Claude Code shim not found at $claude"
          }
          $version = (& $claude --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code is not callable"
          }
          if ($version -notmatch [regex]::Escape($pin)) {
            throw "Claude Code version drift: expected $pin, got $version"
          }
          "CADRUMO_CLAUDE_EXECUTABLE=$claude" | Add-Content -LiteralPath $env:GITHUB_ENV

      # NO live-model session in CI: the real-client capture is doctrinally an
      # OPERATOR-LOCAL step (post-release-distribution P02.S09; the 2026-07-19
      # ADR rules real-client legs the operator tail; standing no-CI-API-key
      # ruling), and a headless subscription session is nondeterministic. The
      # smoke degrades cleanly without --run-claude-session: client_session
      # records not_requested while the deterministic protocol MCP oracle and
      # cohort byte-verification still run and gate.
      - name: Install plugin and run the deterministic protocol oracle
        shell: powershell
        run: |
          uv sync --frozen
          uv run --no-sync python `
            -m dev.packaging.smoke_plugin_install `
            --claude "$env:CADRUMO_CLAUDE_EXECUTABLE" `
            --cohort-dir "$env:CADRUMO_CLAUDE_ROOT/cohort" `
            --evidence-dir "$env:CADRUMO_CLAUDE_ROOT/plugin-evidence"
          if ($LASTEXITCODE -ne 0) {
            throw "Claude plugin protocol oracle failed"
          }

      - name: Build and perform grounded tax work through MCPB runtime
        shell: powershell
        run: |
          uv run --no-sync python -m dev.packaging.smoke_mcpb `
            --cohort-dir "$env:CADRUMO_CLAUDE_ROOT/cohort" `
            --evidence-dir "$env:CADRUMO_CLAUDE_ROOT/mcpb-evidence"
          if ($LASTEXITCODE -ne 0) {
            throw "MCPB artifact runtime oracle failed"
          }

      - name: Curate non-sensitive acquisition evidence
        if: always() && steps.initialize.outputs.ready == 'true'
        shell: pwsh
        run: |
          $curated = Join-Path $env:CADRUMO_CLAUDE_ROOT "curated-evidence"
          New-Item -ItemType Directory -Force -Path $curated | Out-Null
          Copy-Item `
            -LiteralPath (Join-Path $env:CADRUMO_CLAUDE_ROOT "run-context.json") `
            -Destination (Join-Path $curated "run-context.json")

          $pluginEvidence = @(
            Get-ChildItem `
              -LiteralPath (Join-Path $env:CADRUMO_CLAUDE_ROOT "plugin-evidence") `
              -Filter "plugin-evidence.json" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )
          if ($pluginEvidence.Count -gt 1) {
            throw "expected at most one plugin evidence record, found $($pluginEvidence.Count)"
          }
          if ($pluginEvidence.Count -eq 1) {
            Copy-Item `
              -LiteralPath $pluginEvidence[0].FullName `
              -Destination (Join-Path $curated "plugin-evidence.json")
          }

          $mcpbEvidence = @(
            Get-ChildItem `
              -LiteralPath (Join-Path $env:CADRUMO_CLAUDE_ROOT "mcpb-evidence") `
              -Filter "mcpb-assembly-runtime-evidence.json" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )
          if ($mcpbEvidence.Count -gt 1) {
            throw "expected at most one MCPB evidence record, found $($mcpbEvidence.Count)"
          }
          if ($mcpbEvidence.Count -eq 1) {
            Copy-Item `
              -LiteralPath $mcpbEvidence[0].FullName `
              -Destination (Join-Path $curated "mcpb-assembly-runtime-evidence.json")
          }

      # The curated acquisition bundle rides this run's own artifacts. The four
      # REQUIRED claude-* readiness rows remain the operator's locally-minted
      # release, unchanged.
      - name: Stage the Claude acquisition evidence bundle
        if: always() && steps.initialize.outputs.ready == 'true'
        shell: pwsh
        run: |
          $curated = Join-Path $env:CADRUMO_CLAUDE_ROOT "curated-evidence"
          if (-not (Get-ChildItem $curated -ErrorAction SilentlyContinue)) {
            throw "no curated acquisition evidence to publish"
          }
          tar -czf cadrumo-claude-acquisition-evidence.tar.gz -C $curated .
          if ($LASTEXITCODE -ne 0) { throw "curated bundle archiving failed" }

      - name: Upload the Claude acquisition evidence bundle
        if: always() && steps.initialize.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadrumo-claude-acquisition-evidence
          path: cadrumo-claude-acquisition-evidence.tar.gz
          if-no-files-found: error
          overwrite: true
