# Durable maintenance gates (cross-domain-continuity W11.P59.S335 / S336)
#
# Two standing, blocking maintenance gates that run on every commit to a
# chore/** campaign branch and on every pull request into main, so a merge
# cannot land structural or persistence-boundary drift that the fast unit
# lane in ci.yml does not already surface.
#
#   Gate one  (S335) - vault structural-drift gate
#     Runs `vaultspec-core vault check all` (the same audit the local
#     workflow uses for broken wiki-links, malformed frontmatter, ADR
#     status tokens, dangling references, and identifier gaps). A non-zero
#     exit means structural drift surfaced in `.vault/`; the job fails and
#     - once marked a required check in branch protection - blocks the
#     merge. This is the CI-equivalent of the S195 discipline that "vault
#     check all must remain green after every plan expansion and Step
#     close". See the S335 note in the report: the gate is expected to be
#     RED until the standing `.vault/adr` status-token drift is remediated
#     (governed by S195/S196), at which point it enforces green going
#     forward.
#
#   Gate two  (S336) - ledger + storage roundtrip suite gate
#     Runs the persistence-boundary roundtrip suite the S108-S109 / S254 /
#     S273 work built (ledger command + catalogue roundtrips and the
#     encrypted secure-storage roundtrips) plus the `test_roundtrip_
#     coverage.py` inventory meta-gate that asserts every declared
#     persistence boundary still has a roundtrip test on disk.
#
#     ===================================================================
#     ||  DO NOT DEPRECATE OR REMOVE THIS GATE WITHOUT AN EXPLICIT
#     ||  REPLACEMENT.  The ledger + storage roundtrip suite is the
#     ||  standing guard on the encrypted persistence boundaries
#     ||  (aeat-roundtrip-discipline). Deleting this job, or narrowing
#     ||  its selector so the ledger / storage roundtrips stop running,
#     ||  silently drops the boundary protection. If this suite is ever
#     ||  restructured, the replacement gate MUST run the same boundaries
#     ||  and land in the SAME commit that removes this one.
#     ===================================================================
#
# No secrets are required. CADRUMO_LIVE_TESTS_ENABLED is NEVER set here; only
# the `unit`-marked roundtrip tests run.

name: Durable maintenance gates

# Cost discipline (operator directive 2026-07-19): the former push trigger on
# every chore/** branch fired these gates dozens of times a day from shared-
# worktree campaign churn. The durable gates now run on a weekly beat, on PRs
# to main, or on demand - and on the free self-hosted Linux runner.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vault-drift-gate:
    name: Vault structural-drift gate (S335)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Bootstrap
        run: uv sync --frozen

      - name: Vault check all (structural drift)
        # A non-zero exit means structural drift surfaced in `.vault/`.
        # To reproduce and fix locally:
        #   uv run --no-sync vaultspec-core vault check all --fix
        run: uv run --no-sync vaultspec-core vault check all

  roundtrip-suite-gate:
    name: Ledger + storage roundtrip suite gate (S336)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Bootstrap
        run: uv sync --frozen

      - name: Ledger + storage roundtrip suite
        # The persistence-boundary roundtrip suite (aeat-roundtrip-discipline)
        # plus the roundtrip-coverage inventory meta-gate. Never narrow this
        # selector so the ledger / storage roundtrips stop running without an
        # explicit replacement gate landing in the same commit (see header).
        # CADRUMO_LIVE_TESTS_ENABLED is NOT set, so live tests are skipped.
        run: |
          uv run --no-sync pytest \
            src/cadrumo/tests/test_roundtrip_coverage.py \
            src/cadrumo/application/ledger/tests \
            src/cadrumo/adapters/persistence/storage \
            src/cadrumo/adapters/persistence/profile \
            -k roundtrip \
            --junitxml=roundtrip-junit.xml

      - name: Upload roundtrip results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roundtrip-results
          path: roundtrip-junit.xml
