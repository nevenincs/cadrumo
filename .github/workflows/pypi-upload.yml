# RETIREMENT CHARTER — this workflow exists solely to deliver Python distributions
# of already-published v* releases whose promotion predates an armed Gate 3 PyPI
# leg (concretely the owed v0.2.1 fast-follow). It adds NO new capability.
#
# Deletion trigger: upon the FIRST successful publish-release.yml Gate 3 PyPI
# publication, delete this file, its conformance test
# (dev/release/tests/test_pypi_upload_workflow.py), and the three pypi-upload
# Trusted Publishing registrations (environments: pypi, pypi-data-manuals,
# pypi-data-official). Tracked for deletion: #618
#
# Until then, the workflow remains behind CADRUMO_PUBLISH_ENABLED exactly as
# hardened. No modifications to the gate or hardening steps are permitted.

name: Cadrumo PyPI Upload

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag holding the distributions
        required: true
        default: v0.2.1
        type: string
      package:
        description: Which package to upload
        required: true
        type: choice
        options: [cadrumo, cadrumo-data-manuals, cadrumo-data-official]

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi-upload:
    name: Cadrumo / PyPI upload / ${{ inputs.package }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: ${{ inputs.package == 'cadrumo' && 'pypi' || inputs.package == 'cadrumo-data-manuals' && 'pypi-data-manuals' || 'pypi-data-official' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Gate 1 - operator opt-in. This is a second publication authority; until
      # the operator sets the repository variable CADRUMO_PUBLISH_ENABLED=true it
      # refuses with instructions and uploads nothing, mirroring the opt-in gate
      # on the sole publication authority (publish-release.yml).
      - name: Require explicit operator opt-in
        env:
          PUBLISH_ENABLED: ${{ vars.CADRUMO_PUBLISH_ENABLED }}
        run: |
          if [[ "${PUBLISH_ENABLED}" != "true" ]]; then
            cat >&2 <<'EOF'
          REFUSED: Cadrumo publication is not enabled.

          This workflow uploads the published release's Python distributions to
          PyPI via OIDC Trusted Publishing and cannot run until the operator sets
          the repository variable CADRUMO_PUBLISH_ENABLED=true to arm it.
          EOF
            exit 1
          fi
          echo "Operator opt-in present; proceeding to distribution upload."

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.11.29"
          enable-cache: false

      # A self-hosted runner reuses its workspace between runs, so a prior run's
      # dist/ can leak stale artifacts into this upload. Clean it before the
      # download so only this run's freshly downloaded bytes can be published.
      - name: Clean stale distributions from a reused workspace
        run: rm -rf dist

      - name: Download release distributions for the package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE: ${{ inputs.package }}
        run: |
          stem="${PACKAGE//-/_}"
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${stem}-*.whl" --pattern "${stem}-*.tar.gz" \
            --pattern "${PACKAGE}-*.whl" --pattern "${PACKAGE}-*.tar.gz" \
            --dir dist
          ls -la dist
          # Publish only a single, unambiguous distribution pair: exactly one
          # wheel and exactly one sdist for the requested package. Anything else
          # (missing, or multiple versions leaking through) fails closed.
          wheels=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          sdists=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$wheels" -ne 1 ] || [ "$sdists" -ne 1 ]; then
            echo "REFUSED: expected exactly one wheel and one sdist for ${PACKAGE}, found ${wheels} wheel(s) and ${sdists} sdist(s)." >&2
            exit 1
          fi

      - name: Publish to PyPI via Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
