# CI Workflow for AEAT
# This workflow runs lint, typecheck, tests, and hooks on every PR and push to main.
# It enforces cross-platform parity by running on both Ubuntu and Windows.
#
# No secrets are required for the unit suite; live tests are explicitly skipped.
# AEAT_LIVE_TESTS is NEVER set on CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache prek hooks
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml', '.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: CI Bootstrap
        run: |
          uv sync
          uv run vaultspec-core install
          just env-setup

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test (unit)
        run: uv run pytest --junitxml=junit.xml
        # AEAT_LIVE_TESTS is NOT set, so @pytest.mark.live tests are skipped.

      - name: Hooks
        run: just hooks

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: junit.xml
