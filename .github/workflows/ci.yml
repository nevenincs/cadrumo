# CI workflow for Cadrumo.
# Per-push verification split for the ten-minute wall (operator directive
# 2026-07-20: "we cannot have a test or build infrastructure that takes 50
# mins per step"): three parallel jobs — static checks, the unit suite, and
# the dedicated deterministic harness verdict — sized against the two Linux
# runners. The slow conformance surfaces
# (nitpicky docs build, CVE audit, pre-commit hook replay) moved to
# ci-full.yml (manual dispatch only — operator ruling 2026-07-21: no
# scheduled runs) and gate releases and on-demand full verification.
#
# No secrets are required for the unit suite; live tests are explicitly skipped.
# CADRUMO_LIVE_TESTS_ENABLED is NEVER set on CI.

name: Cadrumo CI

# Cost discipline (operator directive 2026-07-19): shared-worktree campaigns
# push vault/docs/agent-config churn to main many times an hour; none of it
# reaches the lint/type/test surface this workflow gates, so those paths never
# start the suite.
#
# `docs/**` is carved out because it does not reach the Python code or artifact
# surface this workflow gates, and it has its own lane (docs.yml). Before that
# split the carve-out was suffix-keyed rather than role-keyed: `**.md` held out
# `docs/index.md` while `docs/**.rst` — 1384 files, the bulk of the surface —
# started the full unit suite and still produced no documentation verdict,
# because `docs-check` runs only in the dispatch-only full lane. The carve-out
# set is byte-identical to packaging-quick.yml's and pinned equal by
# test_change_class_tiers.py.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".vault/**"
      - ".vaultspec/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".agents/**"
      - "docs/**"
      - "**.md"
  # SAME-REPO pull_request only: these jobs run on self-hosted runners, and a
  # fork PR would execute untrusted PR-head code on the operator's machines
  # (critical per GitHub's self-hosted hardening guidance). Development today
  # is direct-push-to-main; this trigger exists so a future PR flow inherits
  # the T1 discipline (static + unit) automatically. Every job carries the
  # same-repo guard below, so a fork PR's jobs skip instead of running —
  # same-repo branches already require write access to exist.
  pull_request:
    branches: [main]
    paths-ignore:
      - ".vault/**"
      - ".vaultspec/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".agents/**"
      - "docs/**"
      - "**.md"

# Push runs QUEUE; pull-request runs supersede. The two events want opposite
# semantics and previously shared one.
#
# THIS LANE HAD NOT PRODUCED A GREEN VERDICT IN EIGHTEEN DAYS. Measured: the last
# 100 ci.yml runs were 99 cancelled, 1 in flight, 0 success; the last successful
# run of any age was 2026-07-24. Every push to `main` shares `github.ref`, so with
# `cancel-in-progress: true` each push killed the run the previous push started,
# and at this repository's commit rate (development is direct-push by coordinated
# agents, fifteen commits in one session) no run ever outlived the interval to the
# next push. `main` carries no branch protection and no required checks, so
# nothing surfaced it: a cancelled run is not a red one.
#
# THE CANCELLATION BOUGHT NOTHING IT WAS PROTECTING. Verified against the Actions
# concurrency reference rather than assumed: with `cancel-in-progress` absent,
# only ONE run may be pending in a group, and a newly queued run cancels the
# previously PENDING one. So both settings cap this lane at exactly one run in
# flight and one waiting. They differ only in whether the in-flight run is killed
# or allowed to finish. There was no machine-occupancy saving to preserve, and no
# billing one either -- these are self-hosted runners, which consume no Actions
# minutes. (`queue: max` would allow up to 100 pending and cannot be combined with
# `cancel-in-progress`; it is not wanted here, because a backlog of stale verdicts
# is worse than one fresh pending run.)
#
# THE COST THAT IS REAL, stated rather than hidden: a completed verdict may name a
# sha that is already several commits old. That is a latency cost, and it is
# strictly better than the alternative this replaces, which was no verdict at all.
#
# Pull requests keep superseding, which is correct there: a PR branch's older run
# describes a revision the author has already replaced, and PR runs do not share a
# ref across authors.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cadrumo-workflow-lint:
    name: Cadrumo / workflow lint (actionlint)
    # actionlint is the only thing that reads these files before GitHub itself
    # does, and it earns a gate here for one failure class this fleet keeps
    # paying for: a `runs-on:` label that no registered runner carries. That
    # does not fail at dispatch - it QUEUES, unbounded, producing no logs and no
    # failure. Twenty workflow files had no static verification of any kind
    # before this job existed.
    #
    # The labels this repository may schedule onto live in
    # .github/actionlint.yaml, which actionlint reads automatically.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Initialize the worktree
        run: just init

      # actionlint AND the CI/justfile contract, both through the recipe. The
      # per-architecture pinned download this step used to carry now lives in
      # `dev/actionlint.py`, verbatim, with its digests - so a contributor can
      # run the gate over their own workflow edit instead of discovering the
      # finding on a push. vaultspec-dashboard carried a second copy of the
      # same 30 lines, already at a different version; both now read the same
      # deployed module.
      - name: Workflow lint and CI contract (just check-workflow)
        run: just check-workflow

  cadrumo-static:
    name: Cadrumo / static checks / Python 3.13
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    # Budget: ~6-8 min projected; the ceiling kills a wedge fast.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Pin uv to the release-cohort reproducibility version the packaging
          # jobs use; release_cohort.py requires exactly this uv, and the
          # conformance gate builds a clean cohort with it.
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Initialize the worktree
        run: just init

      - name: Lint
        # `check-format` joins the two style gates here because until now
        # NOTHING enforced formatting on a push. The recipe existed and was
        # invoked by zero automatically-triggered workflows, and the only other
        # configured format gate is the ruff-format hook in `prek.toml`, which
        # this fleet is instructed never to run because it stashes the shared
        # tree. Two configured gates covered formatting and the intersection of
        # what they enforced was empty.
        #
        # The sweep landed FIRST, in the same commit that added this line.
        # Adding the step to an unswept tree would red the lane on its first
        # run, and a permanently red lane is one everyone learns to route
        # around — the decay this repository has already documented for
        # `continue-on-error`.
        run: |
          just check-style
          just check-format

      - name: Import architecture
        run: just check-imports

      - name: Typecheck
        run: just check-types

      - name: Semgrep regression rules (linkage-design type-uniformity)
        # Semgrep requires the Unix `resource` module and does not run on
        # Windows. Rules in `.semgrep/rules/` enforce the type-uniformity
        # discipline; see `.semgrep/README.md` for the rule inventory and policy.
        run: uvx --from semgrep==1.168.0 semgrep --config .semgrep/rules/ --error src/cadrumo/

      - name: Registry verify
        run: just check-registry

      - name: Reachability and classification ratchets
        # Blocking, for the same reason the size budget above is: each of these
        # was reachable only by manual dispatch, and a gate nobody runs is a
        # gate that has stopped checking. All four are green at the time of
        # wiring and fail only on MOVEMENT, so the lane reddens for whoever
        # causes it rather than carrying standing debt.
        #
        # TWO SIBLING GATES ARE DELIBERATELY NOT WIRED HERE, and the omission is
        # recorded rather than silent. The canonical-authority fixed point is
        # red on a duplicate destination authority in the full-screen
        # navigation module, and the unused-symbol ratchet is red on three
        # orphaned-test entries its own lane has already resolved without
        # shrinking the baseline. Wiring either would fail every push in every
        # lane on a defect the wiring change cannot fix, which is the opposite
        # of what a per-push gate is for. Each becomes wirable the moment its
        # owning lane clears it: the fixed point when the duplicate authority
        # is collapsed, the unused-symbol ratchet when its stale entries are
        # removed.
        #
        # The unconsumed-export ratchet was wired here and then withdrawn
        # within the hour, which is the most useful thing this step learned.
        # It was green when measured and red when re-measured, because a
        # concurrent lane published two names nothing imports in between. A
        # gate is only wirable if it is STABLY green, not green at one instant:
        # seven worktrees are live against this repository, so a point-in-time
        # reading says nothing about the next push. It becomes wirable when the
        # full-screen lane stops carrying unconsumed exports.
        #
        # The import architecture check is already wired above and is not
        # repeated here.
        run: |
          just check-unreachable-module-coverage
          just check-docstring-references

      - name: Tooling and workflow conformance gates
        # The dev-tree unit AND integration gates (workflow structural pins,
        # evidence-transport conformance, shard-plugin partition proof). This is
        # their one per-push home.
        #
        # The paths and the marker expression live in the `test-dev-ci` recipe,
        # NOT here. Every `dev/` lane is declared in the justfile and nowhere
        # else: this step previously restated four directories inline while the
        # justfile declared eleven more, the two sets overlapped by nothing, and
        # no single place answered "what runs under dev/". Inlining paths back
        # into this step puts the answer in two places again and is what
        # `dev/tests/test_lane_reachability.py` exists to catch.
        # Routing through the recipe also makes the lane reproducible locally,
        # which it was not while it lived here.
        run: just test-dev-ci

      - name: Per-push integration conformance gates (rule-surface, status-frontend, self-referential-string, suggestion-command)
        # These four are correctly `integration`-marked -- each genuinely
        # crosses architectural layers -- but the only `integration`
        # invocation lived in the dispatch-only full lane, so none of them
        # had ever run on a push at any revision. Re-marking any of them
        # `unit` would assert something false in exchange for routing
        # convenience; giving them a lane is the fix. Routed through the
        # recipe so the path set and marker expression have one declaration
        # site, same convention as the step above.
        #
        # The action-envelope campaign is audited complete. The historical
        # first-enrolment baseline on 2026-08-12 was 6 failures among the then
        # 48 selected tests; the current authoritative same-four-module recipe
        # is 46/46 green. The recipe owns its live path and marker selection,
        # so this historical count is evidence, not a future pass criterion.
        #
        # -n 8, never the recipe's local `auto` default: this machine's 24
        # logical CPUs are shared with co-resident runners from other
        # repositories (machine-aware sizing, .github/ci-control-plane.md), and
        # the step above in this same job pins the identical count. The
        # override rides the calling line rather than the recipe so the
        # recipe keeps a workstation-friendly default, the same split the
        # unit job already uses.
        env:
          CADRUMO_PYTEST_WORKERS: "8"
        run: just test-per-push-integration-gates

  cadrumo-unit:
    name: Cadrumo / unit suite / Python 3.13
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    # Budget: the suite must fit the per-push wall; pytest-timeout's 300 s
    # per-test ceiling turns the historical multi-hour worker wedge into a
    # minutes-scale loud failure, and this job ceiling is the backstop —
    # never again a 5.5 h wedged run.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Pin uv to the release-cohort reproducibility version the packaging
          # jobs use; release_cohort.py requires exactly this uv, and the
          # conformance gate builds a clean cohort with it.
          version: "0.11.29"
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Initialize the worktree
        run: just init

      - name: Provision Node for the duplication scan
        # The duplication gate shells out to `npx jscpd`; the stock self-hosted
        # runner image carries no Node, so provision it here rather than depend
        # on runner-local state. Without it the audit degrades to "duplication
        # signal unavailable" and test_dev_audit_report reds the suite.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Provision Playwright Chromium
        run: just setup-playwright

      - name: Test (unit)
        # --durations keeps a rolling public profile of the suite's heaviest
        # tests in the job log, so the next budget pass is measured, not
        # guessed (no completed CI unit run existed to profile this redesign).
        # No junit artifact: the repo's posture is zero Actions-artifact
        # storage (quota-broken; the release-asset transport exists precisely
        # to avoid it), and the profile lives in the job log.
        # -n 8, never -n auto: this machine's 24 logical CPUs are shared with
        # co-resident runners from other repositories (machine-aware sizing,
        # .github/ci-control-plane.md; 8 is a working pin, not a derivation). Routed
        # through the recipe so the selection (marker expression, ignore) has
        # one declaration site; CADRUMO_PYTEST_WORKERS overrides the recipe's
        # local `auto` default for this machine-aware sizing.
        env:
          CADRUMO_PYTEST_WORKERS: "8"
        run: just test-unit 50
        # CADRUMO_LIVE_TESTS_ENABLED is NOT set, so live_read tests are skipped.

  cadrumo-test-harness:
    name: Cadrumo / test harness / Python 3.13
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    # The dedicated proof performs a full-corpus child collection; cap a wedge
    # independently from the routine unit and integration verdicts.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Initialize the worktree
        run: just init

      - name: Test (harness)
        # The recipe owns the explicit `-n0` outer-serial selection and its
        # non-vacuous membership contract. Its own job gives installed-hook and
        # full-corpus proofs a verdict separate from unit and integration runs.
        run: just test-harness
