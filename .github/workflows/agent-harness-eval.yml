# Standing eval gate for the operator agent-harness.
#
# The harness is its own distribution, `cadrumo-harness` under
# `src/cadrumo_harness/`: the operator rules, personas and skills, the workspace
# materialiser, and the `cadrumo-mcp` server that serves them. This workflow runs
# its whole assurance surface on every change to that tree — the
# operator-rule/persona/skill drift gate, the golden-task eval (modelo 130 and
# 303), the determinism replay, the MCP tool/HITL/faithfulness tests, and the
# workspace materialiser.
#
# It also watches the two `cadrumo` surfaces the harness is coupled to but does
# not own: the operator-surface manifest the harness documents cite verbs from,
# and the CLI schema projection those verbs' JSON envelopes are checked against.
# A change to either can break a cited verb, a trajectory, the provenance
# grounding, the HITL tiers, or the faithfulness check without touching the
# harness tree at all, which is exactly what this gate exists to catch.

name: Cadrumo Agent Harness Eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/cadrumo_harness/**"
      - "src/cadrumo/application/operator_surface/**"
      - "src/cadrumo/entrypoints/cli/_command_schema.py"
  # NO pull_request trigger: the harness eval is a merge-time gate (it runs
  # when a harness change lands on main). PR-time discipline is ci.yml's
  # same-repo-guarded T1 lane; fork PRs never reach the self-hosted fleet.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-harness-eval:
    name: Ubuntu / Python 3.13 / Cadrumo agent-harness / cadrumo-mcp
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync frozen development environment
        # No separate harness install step: `cadrumo-harness` is a member of the
        # default `dev` dependency group with a `[tool.uv.sources]` path override
        # onto `src/cadrumo_harness`, so a plain frozen sync builds and installs
        # it from the checkout alongside `cadrumo`.
        run: uv sync --frozen

      - name: Cadrumo agent-harness eval surface
        # -n 8, never -n auto: this machine's 24 logical CPUs are shared with
        # co-resident runners from other repositories (machine-aware sizing,
        # .github/ci-control-plane.md; 8 is a working pin, not a derivation).
        run: >-
          uv run --no-sync pytest -n 8
          src/cadrumo_harness
          src/cadrumo/entrypoints/cli/tests/test_operator_surface_contract_drift.py
          src/cadrumo/entrypoints/cli/tests/test_json_schema_conformance.py
          -m "integration or not integration"
          -q --no-header
