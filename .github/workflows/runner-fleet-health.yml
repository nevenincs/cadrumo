# Runner fleet health: container images and host-runner capabilities.
#
# Closes the gap that let the devcontainer rot undetected. `python:3.13-slim` is
# a MOVING tag; it rolled Debian 12 -> 13, trixie's 64-bit time_t transition
# renamed every ABI-bearing library the image installs to a `t64` suffix, and
# nothing built the image, so cache-cold builds broke while cache-warm machines
# kept passing. The unit gate
# `dev/packaging/tests/test_container_base_image_singularity.py` catches the
# base DECLARATION drifting; only an actual build catches the base CONTENTS
# moving under a pinned tag.
#
# NO SCHEDULE, deliberately. Operator ruling 2026-07-21: no schedules, no
# standing compute — no workflow in this repository carries a cron, and this one
# does not become the exception. It runs on demand, and automatically only when
# a push actually touches the container surface, which is not standing compute.
#
# The host-capability job is the cheap half and the one that earns its keep: it
# found `gh` unreachable on the macOS runner, because ~/actions-runner/.path
# omitted /opt/homebrew/bin while .env included it, and `.path` is what the
# runner applies to job steps. Four workflows invoke bare `gh` and none install
# it — packaging-campaign-trigger, packaging-homebrew, packaging-scoop and
# release-please — so that was a live break on every macOS/ARM leg that reached
# one of them.

name: Cadrumo Runner Fleet Health

on:
  workflow_dispatch:
    inputs:
      include_dev_image:
        description: "Also build and test the devcontainer image (~8.5 GB; disk-heavy)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".devcontainer/**"
      - "dev/containers/**"
      - "dev/runners/**"
      - ".github/workflows/runner-fleet-health.yml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner-queue-watchdog:
    # Mandatory for any workflow with an off-lane job: `host-capabilities`
    # targets macOS ARM64, Windows X64, and Linux ARM64, and a lane whose label
    # set no online runner carries does NOT go red — it queues silently. That is
    # the exact failure this workflow exists to surface, so it must not be able
    # to hang unobserved itself. Enforced by
    # dev/ci/tests/test_runner_queue_watchdog.py, which refused this workflow
    # until the job was added. See dev/ci/runner_queue_watchdog.py.
    name: Cadrumo / runner queue watchdog
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "300"
          MAX_WATCH_SECONDS: "900"
        run: python3 -m dev.ci.runner_queue_watchdog

  host-capabilities:
    # Every runner that is a HOST install rather than a container. These carry no
    # image and, before this job, had no capability check at all — half the fleet
    # was unmodelled. Runs first and cheaply: a missing tool here is a coin-flip
    # failure, because a job lands on whichever labelled runner is free.
    name: Capabilities / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: [self-hosted, macOS, ARM64]
          - label: Windows x64
            runner: [self-hosted, Windows, X64]
          - label: Linux arm64
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false

      - name: Verify assumed runner capabilities
        # Runs under the job's real PATH on purpose. The macOS break was
        # invisible from an interactive SSH session, where a profile puts
        # Homebrew on PATH; it only appears in the runner's own environment.
        run: uv run --no-sync python -m dev.containers.runner_capabilities

  runner-image:
    # The Linux X64 runners are containers, so their capabilities are pinned by
    # the `runner` stage rather than provisioned by hand. Building here proves
    # the stage still resolves against the live upstream base and package feeds.
    name: Runner image (build + verify)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Build and verify the runner image
        # `runner-image-test` depends on `runner-image-build`, so this covers
        # both: gh, just, a canonical-prefix brew, a Homebrew cache outside the
        # volume-shadowed /home/runner, pre-warmed portable-ruby, the entrypoint,
        # and the agent — plus a tmpfs proof that a volume mounted over
        # /home/runner cannot shadow any of it.
        run: just runner-image-test

      - name: Reclaim build space
        # Hardware space is limited on this fleet (see dev/runners/README.md), and
        # the job-completion hygiene hook prunes only DANGLING images. The tagged
        # image this job just built is not dangling, so drop it explicitly rather
        # than leaving ~2 GB per run behind. `always()` so a failed build still
        # cleans up.
        if: always()
        run: |
          docker image rm -f cadrumo-runner-linux || true
          docker builder prune -f --keep-storage 5GB || true

  dev-image:
    # Opt-in only: ~8.5 GB, of which 4.4 GB is the CUDA torch stack the dev
    # dependency group pins for vaultspec-rag. Building it on every push would
    # fight the fleet's disk hygiene for little return, since the devcontainer is
    # a contributor environment that CI never consumes.
    name: Devcontainer image (build + verify)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dev_image }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Build and verify the devcontainer image
        run: just devcontainer-test

      - name: Reclaim build space
        if: always()
        run: |
          docker image rm -f cadrumo-devcontainer || true
          docker builder prune -f --keep-storage 5GB || true
