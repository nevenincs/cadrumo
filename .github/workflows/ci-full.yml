# Full-conformance lane for Cadrumo (dispatch-only).
# The per-push ci.yml is budgeted at a ten-minute wall (operator directive
# 2026-07-20), so the slow, push-frequency-insensitive proofs live here: the
# nitpicky warnings-as-errors docs build, the locked-graph CVE audit, and the
# pre-commit hook replay, plus the same lint/type/unit surface as per-push CI
# so a red here is diagnosable without cross-referencing another workflow's
# history.
#
# NO schedule trigger (operator ruling 2026-07-21: the project is not
# developed continuously; cadence is manual, no standing compute). The
# operator or coordinator dispatches this lane before a release, before
# promoting evidence, or whenever a full-surface verdict is wanted.

name: Cadrumo CI Full

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cadrumo-full-conformance:
    name: Cadrumo / full conformance / Python 3.13
    runs-on: [self-hosted, Linux, X64]
    # Raised from 120 when the integration suite and the dev tooling gates were
    # enrolled. The integration parallel pass alone measured 23m54s (3772 tests)
    # on a loaded shared machine, and its serial pass runs after it at -n0; the
    # lane already carried the unit suite, the dev-tree gates, real sdist/wheel
    # builds, the docs build, pip-audit, and the roundtrip suite. 120 left no
    # headroom, and a ceiling that trips is indistinguishable from a wedge —
    # which is the exact confusion the ceilings exist to prevent. Still far
    # below the 6-hour default, so a genuine wedge still dies here.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Self-hosted: the runner-local uv cache (~/.cache/uv) persists between
          # jobs; the GitHub cache round-trip only adds network time here.
          enable-cache: false

      - name: Cache prek hooks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prek
            ~/AppData/Local/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: CI Bootstrap
        # `--frozen`: an unfrozen sync re-resolves the graph against the index
        # on every run; the lock is committed, so frozen is both faster and
        # attributable. Same change as ci.yml's two bootstraps.
        run: |
          uv sync --frozen
          uv run vaultspec-core install --force

      - name: Provision Playwright Chromium
        run: just env-playwright

      - name: Lint
        run: |
          just check-style
          just check-relative-imports
          # `check-format` was reachable from nowhere before this line. It exists
          # as a recipe, and `prek.toml` carries a `ruff-format --check` hook, but
          # no workflow invoked the recipe and the hook only fires for a committer
          # who runs it -- so two configured gates covered formatting and their
          # intersection was empty. Unformatted files reached HEAD unimpeded and
          # `ruff format --check .` was not green tree-wide.
          just check-format

      - name: Import architecture
        run: just check-imports

      - name: Typecheck
        run: just check-types

      - name: Semgrep regression rules (linkage-design type-uniformity)
        run: uvx --from semgrep==1.168.0 semgrep --config .semgrep/rules/ --error src/cadrumo/

      - name: Registry verify
        run: uv run --no-sync aeat app registry verify

      - name: Audit oracle bindings
        run: uv run --no-sync python -m dev.registry.parity.maintenance_cli audit-oracles

      - name: Test (unit)
        # No junit artifact (zero Actions-artifact posture); the durations
        # profile lives in the job log.
        # -n 8, never -n auto: this machine's 24 logical CPUs are shared with
        # co-resident runners from other repositories (machine-aware sizing,
        # .github/ci-control-plane.md; 8 is a working pin, not a derivation). Routed
        # through the same recipe ci.yml uses so the selection has one
        # declaration site.
        run: CADRUMO_PYTEST_WORKERS=8 just test-unit 100
        # CADRUMO_LIVE_TESTS_ENABLED is NOT set, so live_read tests are skipped.

      - name: Tooling and workflow conformance gates
        # Dev-tree ceiling raised over the 300 s ini default: real install/
        # harness tests legitimately run 300-900 s (see ci.yml).
        run: uv run --no-sync pytest -q -n 8 --timeout=900 -m "unit or (integration and not serial)" dev/ci/tests dev/packaging/tests dev/quality/tests dev/release/tests dev/tests

      - name: Test (integration)
        # NOTHING RAN THE src/ INTEGRATION SUITE. Every lane in this repository
        # selects `-m unit` over `src/cadrumo`; the only integration selections
        # were path-scoped to `dev/`. That held 370 integration-marked modules
        # out of CI entirely — the cross-layer tests (CLI conformance, educational
        # docs conformance, file-flow) that unit tests by definition do not cover.
        # `just test-integration` existed the whole time (it is the recipe the
        # justfile documents as the one to run before claiming a suite is clean)
        # and no workflow invoked it.
        #
        # Sized here rather than per-push: this is minutes of cross-layer work
        # the ten-minute wall cannot absorb. The recipe runs two passes — the
        # bulk under xdist, then the isolation-sensitive `serial` tests at -n0 —
        # so a global-state mutator cannot flake the parallel pass.
        #
        # SPLIT FROM THE SERIAL PASS DELIBERATELY, because the two passes do not
        # deserve the same verdict. This one is deterministic: every failure
        # triage could not attribute to a peer mid-edit was a real, reproducible
        # defect. It can go blocking on its own once its backlog closes. The
        # serial pass below cannot, and joining them would hold this one hostage.
        #
        # NON-BLOCKING, AND THE REASON HAS CHANGED. The backlog this step was
        # landed with — a triaged measurement of 13 real failures — CLOSED on
        # 2026-08-06. It resolved to one genuine defect, fixed in 963dd72f08:
        # a test asserting that an empty perceptor store should yield zeroed
        # casillas, where the resolver correctly refuses in order to prevent a
        # silent zero. Recorded rather than deleted, because deleting the
        # sentence silently would send the next reader to re-open a closed
        # investigation.
        #
        # WHAT HOLDS THE FLAG ON NOW IS NOT A BACKLOG. This lane transitively
        # reaches a live European Central Bank endpoint through a multi-currency
        # fixture (audited in 2e944c6dcf), so turning the flag off would wire the
        # release verdict to a third party nobody here operates: one pass failed
        # on repeated gateway timeouts while a direct probe minutes later
        # succeeded three times. The obvious alternative — pinning rates to a
        # committed fixture — is worse, because a stale fixture would ground
        # regulated calculations in silently wrong rates.
        #
        # THAT TRADE IS NOT SETTLED, AND THIS COMMENT DOES NOT SETTLE IT. Treat
        # the flag as an OPEN DECISION, not as a permanent state. It was ruled in
        # passing while closing a plan step, which is not the authority required
        # to make a campaign gate non-blocking forever; an accepted decision
        # record is owed and does not exist yet. Do not remove this flag, and do
        # not promote it to policy, without one.
        #
        # SCOPE OF THIS PARAGRAPH: it governs THIS step and the dev-tooling step
        # below (which says "flip it off with the other one"). It does NOT govern
        # the serial pass or the vault-drift step — each of those carries its own,
        # different release condition. A reader who applies this reasoning to all
        # four flags is applying it to two it never covered.
        #
        # A NOTE ON MEASURING THIS: the first count taken here (19) was
        # contaminated. Re-running it found 28, and intersecting the two runs
        # showed 12 of them were a peer's transiently broken module killing every
        # cold-subprocess test at CLI import — not rot at all. Nineteen peer
        # commits landed during one 12-minute pass. Do not triage this lane from
        # a single run; intersect two, or you will chase another campaign's
        # in-flight edit.
        #
        # FLIP `continue-on-error` OFF once the 13 close; do not let it become
        # permanent.
        run: CADRUMO_PYTEST_WORKERS=8 just test-integration-parallel
        continue-on-error: true

      - name: Test (integration, serial)
        # The isolation-sensitive pass, at -n0 because these tests mutate or read
        # process-global state. It had NEVER been run when it was enrolled; first
        # measurement was 3 failed, 49 passed, 6 errors in 14m22s.
        #
        # HELD NON-BLOCKING LONGER THAN THE PARALLEL PASS, on purpose. Two of its
        # three failures are WALL-CLOCK budgets (P95 4.098s against 3.0s; cold
        # start 2.53s against 2.0s) measured on a box CI shares with the dev
        # machine and the agent fleet — 71% CPU and ~1955 processes at the time.
        # Those flake under load regardless of code quality, so making this
        # blocking would wire the release verdict to a load average rather than
        # to the code. The repository already knows the answer to that class
        # (control-plane invariant: perf gates assert PROCESS CPU-TIME, wall
        # advisory only); these budgets need converting the same way before this
        # step can be trusted to block.
        #
        # The `perf` marker is NOT the escape hatch here: it is absent from
        # _CI_INCAPABLE_MARKERS and the perf lane is path-scoped to
        # dev/packaging, so marking them would make them CI-unreachable and red
        # dev/tests/test_lane_reachability.py instead.
        #
        # SIZING WARNING: the 6 errors were a local artefact (a stale on-disk
        # cohort directory). On CI that path is absent, so the fixture takes the
        # BUILD branch instead — expect these to build 3 wheels and 3 sdists here.
        run: CADRUMO_PYTEST_WORKERS=8 just test-integration-serial
        continue-on-error: true

      - name: Build the documentation site
        # THE GATES READ A BUILT ARTEFACT, so the build is a precondition, not a
        # duplicate of the nitpicky build the gates run themselves. Gates that
        # assemble a corpus from `docs/_build/html` refuse rather than skip when
        # it is absent — "this gate reads a real artefact, so it needs a real
        # build to read", which is the right design. The dependency is invisible
        # on a developer machine, where the directory is already there from
        # ordinary work, and total on a runner that has never built. docs.yml met
        # it as thirteen identical failures on its first real execution
        # (2026-08-05).
        #
        # TWO consumers below need it, which is why the build sits here rather
        # than immediately before the docs gates: the tooling step that follows
        # runs `dev/deploy/tests`, whose publish-preflight and delivery-content
        # gates carry the same `_BUILT_HTML` constant and the same `pytest.fail`
        # on a missing directory. That step's own comment already names them —
        # "the deploy-authority tests that gate the documentation publisher this
        # repository ships". The job is sequential, so moving the build earlier
        # cannot change the total; it only decides which consumers find an
        # artefact. The cost of the earlier position is that a failure in a later
        # hard step now happens after the build has been paid for.
        #
        # `just docs` is a FULL build despite the recipe's "changed documents"
        # docstring — it passes `docs/conf.py`, which `planned_doc_targets`
        # treats as the full-build trigger, so it does not depend on a diff and
        # is correct on a cold workspace. Verified rather than assumed, because
        # a changed-only build would no-op on a clean checkout and leave the
        # artefact absent, which is precisely the failure this step removes.
        run: just docs

      - name: Tooling gates no other lane reaches
        # The recipe's own docstring names it: "the dev/ tooling gates that no
        # other lane reaches". That was literally true of CI as well — nine
        # directories (dev/audit, dev/deploy, dev/env, dev/registry/newmodelo,
        # dev/registry/aeip, and the four dev/docs subsystems) ran in no
        # workflow at all, including the deploy-authority tests that gate the
        # documentation publisher this repository ships.
        #
        # Non-blocking on the same terms as the integration step above: these
        # directories have never run in CI either, so their first verdict is a
        # backlog measurement rather than a regression signal.
        #
        # NOT "TEMPORARY" -- A NAMED CONDITION, stated by count so it is
        # checkable rather than a judgement: this flag flips OFF when a run of
        # `just test-dev-tooling` measures ZERO failures and ZERO errors. It is
        # not there yet and it is not trending there. Measured sequentially
        # (-n0, 38m49s) on 2026-08-13: 83 failed, 1694 passed, 48 errors,
        # against 70 and then 68 failures measured on 2026-08-12 -- the backlog
        # grew.
        #
        # THE TOTAL IS A SUM OVER POPULATIONS WITH DIFFERENT OWNERS and must not
        # be handed to one party. All 48 errors share ONE cause: a Modelo 145
        # casilla label key untranslated in `es`, which is a locale/registry
        # co-commit gap fixed with `python -m dev.locales set`, not a defect in
        # any gate here. The failures concentrate in the CLI action-census
        # dispositions (10), the registry conformance CLI (7), terminology-
        # handbook curation (7), the variable-envelope generation gate (5, which
        # includes a registry loader-cache race that reports as "registry
        # directory changed during cache fingerprinting" and is a property of
        # concurrent writes rather than of the code).
        #
        # Re-measure before acting rather than trusting these figures: at least
        # one population moves under peer commits.
        run: CADRUMO_PYTEST_WORKERS=8 just test-dev-tooling
        continue-on-error: true

      - name: Channel artifact conformance (Homebrew formula and Scoop manifest)
        # These fourteen tests bind the generated formula and manifest to a real
        # built cohort, and until now NOTHING ran them: the per-push lanes scope
        # to dev/ paths AND exclude serial, the pathless invocations inherit
        # testpaths that cannot reach packaging/, and the acquisition workflows
        # invoke the generators but never their tests. Two independent breakages
        # accumulated there unobserved as a result.
        #
        # Explicit paths and -n0, never marker selection alone: a marker-filtered
        # xdist run HOLDS serial tests out while still reporting a clean pass,
        # which is the same false green that hid the breakages. Sized into this
        # lane rather than per-push because the tests build real sdists and
        # wheels, costing minutes the per-push budget cannot absorb. Routed
        # through the recipe so this path/marker selection has one declaration
        # site instead of living only in this workflow line.
        run: just test-channel-artifacts

      - name: Packaging serial contracts (distribution evidence, installed oracles)
        # The `integration and serial` half of `dev/packaging/tests`. Nothing on
        # CI reached it: the per-push lanes scope to dev/ paths AND exclude
        # `serial`, the pathless invocations inherit testpaths that cannot reach
        # packaging/, and `packaging-smoke` runs the campaign driver's smoke
        # modules rather than pytest. `packaging-smoke-serial` was therefore a
        # declared lane no workflow invoked, which
        # `dev/tests/test_lane_reachability.py` reports as CI-unreachable.
        #
        # Sized into this lane rather than per-push for the same reason the
        # channel-artifact step above is: these build a real cohort, install real
        # wheels into real virtualenvs, and cost minutes of filesystem work the
        # per-push budget cannot absorb. Routed through the recipe so the
        # path/marker selection keeps one declaration site.
        #
        # Blocking. The distribution-evidence cases now drive the cohort binding
        # end to end against a real install of the cohort's own wheel rather than
        # aborting in their fixtures, so this step is minutes of genuine work
        # rather than seconds of fast failure. A red verdict here is a real
        # binding or oracle regression.
        run: just packaging-smoke-serial

      - name: Documentation conformance
        # The docs-marked tests (nitpicky warnings-as-errors Sphinx build,
        # module-to-stub correspondence, and CLI reference drift/conformance)
        # plus doc8 and interrogate. Multi-minute by design; dispatch cadence.
        # 8 workers, never auto: the docs lane's pytest previously inherited
        # `-n auto` from the pyproject addopts, invisible to the run-line
        # gate; the explicit argument applies the same 24/3 machine-aware
        # sizing every other lane declares (.github/ci-control-plane.md).
        run: just docs-check 8

      - name: Audit dependencies for known CVEs
        # Scans the locked dependency graph against the PyPI Advisory
        # Database (PYSEC + GitHub Advisory) and fails the build on any
        # known vulnerability. To allow-list a specific advisory locally,
        # append --ignore-vuln <GHSA-/PYSEC-id>.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes > /tmp/audit-reqs.txt
          uvx pip-audit --strict -r /tmp/audit-reqs.txt

      - name: Hooks
        run: just check-pre-commit

      - name: Vault structural drift (informational)
        # The vault audit carries a standing backlog of status-token drift, so
        # a red verdict here is visibility, not a lane failure; flip this to
        # blocking once `vault check all` is green at HEAD.
        # Reproduce and fix locally:
        #   uv run --no-sync vaultspec-core vault check all --fix
        run: uv run --no-sync vaultspec-core vault check all
        continue-on-error: true

      - name: Ledger + storage roundtrip suite
        # ===================================================================
        # ||  DO NOT DEPRECATE OR REMOVE THIS STEP WITHOUT AN EXPLICIT
        # ||  REPLACEMENT. The ledger + storage roundtrip suite is the
        # ||  standing guard on the encrypted persistence boundaries
        # ||  (aeat-roundtrip-discipline). Deleting this step, or narrowing
        # ||  its selector so the ledger / storage roundtrips stop running,
        # ||  silently drops the boundary protection. If this suite is ever
        # ||  restructured, the replacement gate MUST run the same boundaries
        # ||  and land in the SAME commit that removes this one.
        # ===================================================================
        # CADRUMO_LIVE_TESTS_ENABLED is NOT set, so live tests are skipped.
        run: |
          uv run --no-sync pytest -n 8 \
            dev/tests/test_roundtrip_coverage.py \
            src/cadrumo/application/ledger/tests \
            src/cadrumo/adapters/persistence/storage \
            src/cadrumo/adapters/persistence/profile \
            -k roundtrip
