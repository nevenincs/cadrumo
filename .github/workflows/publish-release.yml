# Sole publication authority for the immutable, tested Cadrumo cohort.
#
# This workflow PROMOTES already-built, already-tested bytes; it NEVER builds,
# regenerates, or restamps an artifact (per 2026-07-15-distribution-installation
# -readiness-adr). It is inert until the operator opts in and configures the
# protected `release` environment plus the channel credentials: absent those it
# refuses instructively.
#
# A `dry_run` dispatch input runs Gate 1 (opt-in) and Gate 2 (validate) fully but
# skips Gate 3 (publish), so the pre-arming validate-everything-publish-nothing
# diagnostic lives here on the single authority — the retired publish.yml stub is
# gone (superseded, and it carried the per-OS-cohort publication defect class).
#
# Operator prerequisites (none of which an agent can create) are enumerated in
# the "operator-preflight" job below and must all be satisfied before a real
# publication can occur.
name: Publish Cadrumo release

on:
  workflow_dispatch:
    inputs:
      packaging_run_id:
        description: Successful Cadrumo Packaging Smoke run (sealed cohort + 3 python rows)
        required: true
        type: string
      # The three acquisition-evidence inputs are optional AT THE DISPATCH FORM
      # only. Whether each is actually required is DERIVED from the channels this
      # release claims (dev/packaging/publication_inputs.py, same authority the
      # readiness gate derives its blocking row set from): a claimed channel
      # whose input is empty refuses in Gate 2. Declaring them required here
      # instead deadlocked the first publication — the Scoop and Homebrew
      # acquisition runs install the manifest and formula out of the shared
      # repository, which no publication has written yet.
      scoop_run_id:
        description: Successful Cadrumo Scoop Acquisition run (required once the scoop channel is claimed)
        required: false
        default: ""
        type: string
      homebrew_run_id:
        description: Successful Cadrumo Homebrew Acquisition run (required once the homebrew channel is claimed)
        required: false
        default: ""
        type: string
      claude_evidence_release:
        description: Release tag holding the four claude-* rows (required once a host-extension channel is claimed)
        required: false
        default: ""
        type: string
      dry_run:
        description: Validate everything, publish nothing (runs Gate 1+2 fully, skips Gate 3)
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-cadrumo-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 - operator opt-in. Until the operator sets the repository variable
  # CADRUMO_PUBLISH_ENABLED=true this workflow refuses with instructions and
  # publishes nothing, preserving the diagnostic stub's refusal semantics.
  # ---------------------------------------------------------------------------
  operator-preflight:
    name: Operator opt-in and prerequisite check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Require explicit operator opt-in
        env:
          PUBLISH_ENABLED: ${{ vars.CADRUMO_PUBLISH_ENABLED }}
        run: |
          if [[ "${PUBLISH_ENABLED}" != "true" ]]; then
            cat >&2 <<'EOF'
          REFUSED: Cadrumo publication is not enabled.

          This workflow promotes the immutable tested cohort to every public
          channel and cannot run until the operator has completed ALL of the
          following (none can be done by an agent):

            1. Register PyPI Trusted Publishing for cadrumo, cadrumo-data-manuals,
               and cadrumo-data-official (publisher: this repo, workflow
               publish-release.yml, environment release) at
               https://pypi.org/manage/account/publishing/.
            2. Create the `release` GitHub Environment with required reviewers
               (the operator) - that approval click is the human release gate.
            3. Provide the two shared, PRODUCT-NEUTRAL channel targets. The
               account carries exactly ONE distribution repository, and it serves
               BOTH Homebrew and Scoop.
                 - Homebrew AND Scoop: create the PUBLIC shared account
                   repository nevenincs/homebrew-tap (the `homebrew-` prefix is
                   mandatory for the one-argument tap form; users type
                   `brew install nevenincs/tap/cadrumo`). Scoop imposes no name
                   constraint and reads a `bucket/` subdirectory, so the same
                   repository carries `bucket/` and users add it once, ever. Set
                   var HOMEBREW_TAP_REPO and secret HOMEBREW_TAP_TOKEN - ONE
                   pair serves both channel pushes.
                 - Claude plugins: use the PUBLIC nevenincs/neve-marketplace. Set
                   var CLAUDE_MARKETPLACE_REPO and secret
                   CLAUDE_MARKETPLACE_TOKEN.
               Both names are deliberately product-neutral: every product under
               the account sets the same two pairs and drops in one more formula
               file, one more bucket manifest, and one more plugin subtree, with
               no restructuring. Both targets MUST be public - both managers
               reach their repository by ordinary git clone, so a private target
               is unusable by anyone without push credentials.
            4. Ensure the source Packaging Smoke run sealed its evidence draft
               (release tag evidence-smoke-<run id> carrying
               cadrumo-release-cohort.tar.gz and evidence-manifest.json).
            5. Dispatch the Scoop and Homebrew acquisition workflows against that
               smoke run and note their run ids (they mint the scoop + homebrew
               distribution-evidence rows).
            6. Mint the four claude-* rows locally
               (`python -m dev.packaging.emit_real_client_evidence ...`) and upload
               them to a release (`gh release create <tag> --draft <row json...>`);
               note that tag.
            7. Set repository variable CADRUMO_PUBLISH_ENABLED=true to arm this
               workflow.

          Once 1-6 are done, set CADRUMO_PUBLISH_ENABLED=true and re-dispatch with
          the packaging_run_id, scoop_run_id, homebrew_run_id, and
          claude_evidence_release inputs.
          EOF
            exit 1
          fi
          echo "Operator opt-in present; proceeding to cohort validation."

      - name: Require the release environment to carry a human approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Prerequisite 2 above INSTRUCTS the operator to create the `release`
          # environment "with required reviewers - that approval click is the
          # human release gate", and the publish job's own comment repeats the
          # claim. Nothing verified it. An environment created without reviewers
          # satisfies `environment: release` perfectly well and runs the
          # promotion with no human in the loop, so the single most consequential
          # safety property of this workflow was documented and unenforced.
          #
          # Fail-closed on a real publication: an API failure means the gate
          # could not be CONFIRMED, which is not the same as confirmed present.
          # A dry_run publishes nothing, so it warns and proceeds - the
          # validate-everything-publish-nothing diagnostic stays usable before
          # the environment is fully configured.
          if ! rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" --jq '[.protection_rules[].type]|join(",")' 2>&1)"; then
            reason="the release environment could not be read: ${rules}"
          elif [[ ",${rules}," != *",required_reviewers,"* ]]; then
            reason="the release environment has no required_reviewers rule (found: ${rules:-none})"
          else
            echo "Human approval gate present on the release environment: ${rules}"
            exit 0
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "::warning::${reason}. A dry_run publishes nothing, so this is not fatal here, but a real publication will refuse until required reviewers are set."
            exit 0
          fi
          cat >&2 <<EOF
          REFUSED: ${reason}.

          This workflow's design places the human release gate on the \`release\`
          environment's required-reviewers approval. Without that rule the
          promotion would upload to PyPI and every public channel with no human
          in the loop, which is not what prerequisite 2 promises.

          Fix: Settings -> Environments -> release -> Deployment protection rules
          -> tick "Required reviewers" and add the operator. Then re-dispatch.
          EOF
          exit 1

  # ---------------------------------------------------------------------------
  # Gate 2 - validate the retained cohort WITHOUT rebuilding. Verifies the
  # source run identity, downloads the stored cohort + installed evidence, and
  # re-checks manifest/hashes and the complete blocking evidence set.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate immutable tested cohort (no rebuild)
    needs: operator-preflight
    runs-on: [self-hosted, Linux, X64]
    permissions:
      actions: read
      contents: read
      # Gate 2 runs on a networked runner, so the readiness gate's open-P0-blocker
      # check runs here (not skipped): the gh-backed issue query needs issues:read.
      issues: read
    outputs:
      source_commit: ${{ steps.source-run.outputs.source_commit }}
      version: ${{ steps.validate.outputs.version }}
    env:
      RELEASE_COHORT_DIR: var/promotion/release-cohort
      EVIDENCE_DOWNLOAD: var/promotion/evidence
      PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
      SCOOP_RUN_ID: ${{ inputs.scoop_run_id }}
      HOMEBREW_RUN_ID: ${{ inputs.homebrew_run_id }}
      CLAUDE_EVIDENCE_RELEASE: ${{ inputs.claude_evidence_release }}
    steps:
      - name: Require one successful packaging-smoke authority run
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PACKAGING_RUN_ID}")"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/packaging-smoke.yml"
          # The full campaign is dispatch-only since the ci-speed redesign
          # (2026-07-20); push is still accepted so campaign runs recorded
          # before the trigger change remain promotable. A dispatch run is
          # trusted only when its commit is verified on main history via the
          # compare API - equal-or-stronger than the former push-event pin.
          # The quick per-push workflow lives at a different path and can
          # never pass the path pin above regardless of event.
          event="$(jq -r .event <<<"$run_json")"
          if [ "$event" = "workflow_dispatch" ]; then
            ancestry="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...$(jq -r .head_sha <<<"$run_json")" --jq .status)"
            test "$ancestry" = "identical" -o "$ancestry" = "behind"
          else
            test "$event" = "push"
          fi
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          source_commit="$(jq -r .head_sha <<<"$run_json")"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.source-run.outputs.source_commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"

      - name: Require an evidence source for every channel this release claims
        run: |
          # Derived, not fixed. An acquisition input is mandatory precisely when
          # some CLAIMED channel sources its evidence from it, read off the same
          # descriptor the readiness gate below derives its blocking rows from,
          # so the two can never disagree. A claimed channel with no known source
          # refuses rather than publishing unproven.
          uv run --frozen python -m dev.packaging.publication_inputs

      - name: Verify the supplied acquisition run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each acquisition run must be a genuine dispatch of its own channel's
          # workflow in this repository (identity parity with the smoke-run gate).
          # Deep integrity - that its rows belong to THIS release - is enforced by
          # the readiness gate below, which refuses any row not bound to the sealed
          # cohort; these checks establish provenance up front.
          #
          # An empty id reaches here only for an UNCLAIMED channel: the step above
          # already refused any claimed channel dispatched without its source.
          check_run() {
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1")"
            test "$(jq -r .conclusion <<<"$run_json")" = "success"
            test "$(jq -r .path <<<"$run_json")" = "$2"
            test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
            test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          }
          if [ -n "$SCOOP_RUN_ID" ]; then
            check_run "$SCOOP_RUN_ID" ".github/workflows/packaging-scoop.yml"
          fi
          if [ -n "$HOMEBREW_RUN_ID" ]; then
            check_run "$HOMEBREW_RUN_ID" ".github/workflows/packaging-homebrew.yml"
          fi

      - name: Download and verify every evidence draft, then aggregate the rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The SEALED cohort is the single source of published bytes for EVERY
          # channel including PyPI (its python/ subdir). Evidence tags are
          # DERIVED from the run-id inputs (the run is the identity anchor);
          # verify layers run identity (Actions API), release<->run binding
          # (target_commitish + sealed manifest claims), and per-asset sha256
          # over every downloaded byte. Aggregate all eleven rows: 3 python
          # (smoke draft), 1 scoop, 3 homebrew, and the operator's 4 claude-*
          # rows from the pre-uploaded evidence release (no backing run).
          mkdir -p "$EVIDENCE_DOWNLOAD/rows" "$EVIDENCE_DOWNLOAD/rows-raw"
          verify() {  # tag, run-id, workflow-path, dest
            uv run --frozen python -m dev.packaging.evidence_release verify \
              --tag "$1" --expect-run-id "$2" --expect-workflow "$3" \
              --download-dir "$4"
          }
          verify "evidence-smoke-$PACKAGING_RUN_ID"    "$PACKAGING_RUN_ID" \
            ".github/workflows/packaging-smoke.yml"    "$EVIDENCE_DOWNLOAD/rows-raw/packaging"
          # Each optional source is aggregated when supplied. Skipping an absent
          # one cannot smuggle a channel past the gate: the readiness gate below
          # derives its required rows from the claimed channels, so an unclaimed
          # channel demands no row and a claimed one was already refused above.
          if [ -n "$SCOOP_RUN_ID" ]; then
            verify "evidence-scoop-$SCOOP_RUN_ID"      "$SCOOP_RUN_ID" \
              ".github/workflows/packaging-scoop.yml"  "$EVIDENCE_DOWNLOAD/rows-raw/scoop"
          fi
          if [ -n "$HOMEBREW_RUN_ID" ]; then
            verify "evidence-homebrew-$HOMEBREW_RUN_ID"  "$HOMEBREW_RUN_ID" \
              ".github/workflows/packaging-homebrew.yml" "$EVIDENCE_DOWNLOAD/rows-raw/homebrew"
          fi
          if [ -n "$CLAUDE_EVIDENCE_RELEASE" ]; then
            gh release download "$CLAUDE_EVIDENCE_RELEASE" --pattern 'claude-*.json' \
              --dir "$EVIDENCE_DOWNLOAD/rows-raw/claude"
          fi
          mkdir -p "$RELEASE_COHORT_DIR"
          tar -xzf "$EVIDENCE_DOWNLOAD/rows-raw/packaging/cadrumo-release-cohort.tar.gz" \
            -C "$RELEASE_COHORT_DIR"
          # debug-* assets are failure diagnostics, never rows; a promoted run
          # is green, but a re-run attempt's draft may retain attempt-1 debris.
          find "$EVIDENCE_DOWNLOAD/rows-raw" -name '*.json' ! -name 'evidence-manifest.json' \
            ! -name 'debug-*' -exec cp {} "$EVIDENCE_DOWNLOAD/rows/" \;

      - name: Guard the PyPI destination against overwrite and emit the version
        id: validate
        run: |
          # Re-point the promotion guard at the SEALED cohort's python bytes (the
          # exact wheels/sdists PyPI will ship): confirm no PyPI project already
          # owns this version, and emit the version for the publish job. The
          # sealed cohort's installed-behavior binding is enforced below by the
          # readiness gate over the DistributionEvidence rows, not by the per-OS
          # smoke-build evidence (which describes different bytes).
          uv run --frozen python -m dev.release.promote_python_cohort \
            --cohort-dir "$RELEASE_COHORT_DIR/python" \
            --check-pypi-only \
            --github-output "$GITHUB_OUTPUT"

      - name: Require the complete blocking distribution evidence set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Point the readiness gate at the DOWNLOADED promotion cohort and the
          # aggregated distribution-evidence rows, not the working-tree defaults
          # that do not exist on the CI checkout. This runner has network and a
          # token, so --skip-network is dropped: the gh-backed open-P0-blocker
          # check runs here and blocks the promotion on any open release blocker.
          uv run --frozen python -m dev.release.readiness --json \
            --cohort-dir "$RELEASE_COHORT_DIR" \
            --evidence-dir "$EVIDENCE_DOWNLOAD/rows"

  # ---------------------------------------------------------------------------
  # Gate 3 - promote the exact bytes. Protected by the `release` environment
  # (operator required-reviewers = the human approval gate). Uploads only; it
  # never builds. Each external push is guarded on its operator-provided
  # credential and refuses instructively when absent.
  # ---------------------------------------------------------------------------
  publish:
    name: Promote immutable cohort to public channels
    needs: validate
    # A dry_run dispatch validates everything (Gate 1+2) and skips this publish
    # job, so the pre-arming diagnostic value survives on the single authority.
    if: ${{ inputs.dry_run != true }}
    runs-on: [self-hosted, Linux, X64]
    environment: release
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_COHORT_DIR: var/promotion/release-cohort
      EVIDENCE_FINAL_DIR: var/promotion/evidence-final
      DOWNLOAD_LATEST_DIR: var/promotion/download-latest
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
      SCOOP_RUN_ID: ${{ inputs.scoop_run_id }}
      HOMEBREW_RUN_ID: ${{ inputs.homebrew_run_id }}
      CLAUDE_EVIDENCE_RELEASE: ${{ inputs.claude_evidence_release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"
          python-version: "3.13"

      - name: Re-download and verify the sealed cohort (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python -m dev.packaging.evidence_release verify \
            --tag "evidence-smoke-$PACKAGING_RUN_ID" \
            --expect-run-id "$PACKAGING_RUN_ID" \
            --expect-workflow ".github/workflows/packaging-smoke.yml" \
            --pattern "cadrumo-release-cohort.tar.gz" \
            --download-dir var/promotion/download
          mkdir -p "$RELEASE_COHORT_DIR"
          tar -xzf var/promotion/download/cadrumo-release-cohort.tar.gz -C "$RELEASE_COHORT_DIR"

      # D8: the published release is self-evidencing — it also carries the
      # eleven verified rows and the three sealed evidence manifests, so draft
      # GC can never orphan a shipped version's audit trail. Rows re-download
      # through the same verify (hash-checked); manifests are renamed per lane
      # to keep the duplicate-basename guard honest.
      - name: Re-download and verify the evidence rows for the self-evidencing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$EVIDENCE_FINAL_DIR/attach"
          verify_rows() {  # tag, run-id, workflow-path, lane
            uv run --frozen python -m dev.packaging.evidence_release verify \
              --tag "$1" --expect-run-id "$2" --expect-workflow "$3" \
              --pattern '*.json' \
              --download-dir "$EVIDENCE_FINAL_DIR/$4"
            find "$EVIDENCE_FINAL_DIR/$4" -name '*.json' ! -name 'evidence-manifest.json' \
              ! -name 'debug-*' -exec cp {} "$EVIDENCE_FINAL_DIR/attach/" \;
            cp "$EVIDENCE_FINAL_DIR/$4/evidence-manifest.json" \
              "$EVIDENCE_FINAL_DIR/attach/evidence-manifest-$4.json"
          }
          verify_rows "evidence-smoke-$PACKAGING_RUN_ID"   "$PACKAGING_RUN_ID" \
            ".github/workflows/packaging-smoke.yml"    packaging
          # Optional sources: supplied for every channel this release claims
          # (Gate 2 refused otherwise), absent only for channels it does not.
          if [ -n "$SCOOP_RUN_ID" ]; then
            verify_rows "evidence-scoop-$SCOOP_RUN_ID"     "$SCOOP_RUN_ID" \
              ".github/workflows/packaging-scoop.yml"  scoop
          fi
          if [ -n "$HOMEBREW_RUN_ID" ]; then
            verify_rows "evidence-homebrew-$HOMEBREW_RUN_ID" "$HOMEBREW_RUN_ID" \
              ".github/workflows/packaging-homebrew.yml" homebrew
          fi
          if [ -n "$CLAUDE_EVIDENCE_RELEASE" ]; then
            gh release download "$CLAUDE_EVIDENCE_RELEASE" --pattern 'claude-*.json' \
              --dir "$EVIDENCE_FINAL_DIR/attach"
          fi

      # Fail-closed publication tripwire (reconciled D9): rows are scrubbed at
      # mint time, so this SWEEPS and never rewrites — any residual runner
      # metadata in ANY asset about to be attached hard-fails the promotion
      # naming the asset and pattern. The sweep covers the UNION of both
      # attach roots: the evidence rows/manifests AND the cohort files
      # (a cohort artifact embedding a build path trips the wire too; JSON is
      # walked structurally, everything else is scanned as text). Gate 3
      # attaches nothing that has not passed this sweep.
      - name: Leak-sweep every asset before it can be attached
        run: |
          # Coverage note: these are THIS (promotion) runner's own identity
          # tokens, so the token-based part of the sweep catches only residue
          # this runner would leave. Residue minted on a DIFFERENT runner is
          # caught only by the token-INDEPENDENT patterns (home-dir and UNC
          # paths), which run regardless of --token; another runner's
          # hostname/username is NOT covered here — the minting-lane runner
          # names are not enumerable in this workflow, so we do not claim to
          # catch them. Only non-empty tokens are passed — an empty --token
          # would match every byte.
          sweep_tokens=()
          for tok in "$RUNNER_NAME" "$(hostname 2>/dev/null)" "$(whoami 2>/dev/null)"; do
            [[ -n "$tok" ]] && sweep_tokens+=(--token "$tok")
          done
          uv run --frozen python -m dev.packaging.evidence_release leak-sweep \
            --directory "$EVIDENCE_FINAL_DIR/attach" \
            --directory "$RELEASE_COHORT_DIR" \
            "${sweep_tokens[@]}"

      - name: Publish the three distributions to PyPI via Trusted Publishing (OIDC)
        run: |
          # uv exchanges the id-token for a short-lived PyPI token (Trusted
          # Publishing); it uploads the SEALED cohort's stored wheels/sdists (the
          # exact bytes every other channel ships and the oracle-emit legs proved)
          # from cadrumo-release-cohort/python and never builds.
          uv publish --trusted-publishing always \
            "$RELEASE_COHORT_DIR"/python/cadrumo-"$VERSION"-py3-none-any.whl \
            "$RELEASE_COHORT_DIR"/python/cadrumo-"$VERSION".tar.gz \
            "$RELEASE_COHORT_DIR"/python/cadrumo_data_manuals-"$VERSION"-py3-none-any.whl \
            "$RELEASE_COHORT_DIR"/python/cadrumo_data_manuals-"$VERSION".tar.gz \
            "$RELEASE_COHORT_DIR"/python/cadrumo_data_official-"$VERSION"-py3-none-any.whl \
            "$RELEASE_COHORT_DIR"/python/cadrumo_data_official-"$VERSION".tar.gz

      - name: Create the GitHub release with every cohort asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' f; do assets+=("$f"); done \
            < <(find "$RELEASE_COHORT_DIR" "$EVIDENCE_FINAL_DIR/attach" -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release cohort assets found to attach" >&2
            exit 1
          fi
          # gh release create flattens every asset to its basename, so two cohort
          # files that share a basename across subdirs would silently clobber each
          # other on the release. Refuse hard before uploading rather than ship a
          # release missing a distribution file.
          duplicate_basenames="$(
            for f in "${assets[@]}"; do basename "$f"; done | sort | uniq -d
          )"
          if [[ -n "$duplicate_basenames" ]]; then
            echo "release cohort has colliding asset basenames (gh flattens to basename):" >&2
            echo "$duplicate_basenames" >&2
            exit 1
          fi
          gh release create "v$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "Cadrumo v$VERSION" \
            --notes "Immutable tested cohort v$VERSION promoted without rebuild from packaging-smoke run $PACKAGING_RUN_ID."

      # Runtime progressive-enhancement payload for the docs download page
      # (initDownloadCards in docs/_static/cadrumo-docs.js). This is a read-only
      # PROJECTION of the SEALED cohort manifest (version, filenames, sha256,
      # cohort id) plus the just-created release's direct asset URLs — it builds
      # or regenerates NOTHING. It is emitted into its own directory, run through
      # the same fail-closed leak-sweep backstop that guards every attached asset,
      # then attached to the release. The docs deploy (dev/deploy/docs_static_site.py)
      # pulls it from releases/latest/download/ into docs/_static at its next
      # publish; the Tier-1 offline channel table is the floor when it is absent.
      - name: Emit and attach the download-latest.json docs payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DOWNLOAD_LATEST_DIR"
          uv run --frozen python -m dev.docs.download_matrix emit-latest \
            --cohort-manifest "$RELEASE_COHORT_DIR/release-cohort.json" \
            --release-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v$VERSION" \
            --output "$DOWNLOAD_LATEST_DIR/download-latest.json"
          # Same fail-closed backstop as the pre-attach sweep. Coverage is
          # token-scoped to THIS runner's identity; home-dir/UNC residue is
          # caught token-independently, but a different minting runner's
          # hostname/username is not covered (those names are not enumerable
          # here). Only non-empty tokens are passed — an empty --token matches
          # every byte.
          sweep_tokens=()
          for tok in "$RUNNER_NAME" "$(hostname 2>/dev/null)" "$(whoami 2>/dev/null)"; do
            [[ -n "$tok" ]] && sweep_tokens+=(--token "$tok")
          done
          uv run --frozen python -m dev.packaging.evidence_release leak-sweep \
            --directory "$DOWNLOAD_LATEST_DIR" \
            "${sweep_tokens[@]}"
          gh release upload "v$VERSION" "$DOWNLOAD_LATEST_DIR/download-latest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # ONE shared account distribution repository serves BOTH ecosystems.
      # Homebrew's mandatory `homebrew-` repo-name prefix forces that repository
      # to exist for the one-argument tap form; Scoop imposes no name constraint
      # and resolves manifests from a `bucket/` subdirectory, so the same
      # repository carries `bucket/` at no extra cost. A new product therefore
      # adds one manifest file and one formula file and CREATES NOTHING — the
      # account's distribution repository count is one at one product and one at
      # a hundred.
      #
      # Both pushes below share three properties that make a shared repository
      # safe, and all three are pinned by the conformance gate in
      # dev/release/tests/test_publish_release_workflow.py:
      #   * each stages exactly its own product-scoped path, never `add -A`,
      #     never `add .`, and never a wholesale delete of the checkout;
      #   * each refuses a BACKWARD version bump before committing, because
      #     ordinary merge semantics can otherwise un-publish a newer version
      #     with no workflow failing;
      #   * each retries a lost push race, because several products can release
      #     into one shared repository concurrently and GitHub concurrency groups
      #     are per-repository, so they cannot serialise across product repos.
      - name: Push the Scoop manifest into the shared account bucket
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          if [[ -z "$TAP_TOKEN" || -z "$TAP_REPO" ]]; then
            echo "REFUSED: shared distribution repository not configured. Set the" >&2
            echo "HOMEBREW_TAP_REPO variable and the HOMEBREW_TAP_TOKEN secret to" >&2
            echo "publish the Scoop manifest into the shared account bucket." >&2
            exit 1
          fi
          # Token rides an -c http.extraheader (never the clone URL) so it is not
          # persisted into the runner's .git/config remote.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          published=""
          for attempt in 1 2 3; do
            work="$(mktemp -d)"
            git -c http.extraheader="$auth" clone "https://github.com/${TAP_REPO}.git" "$work"
            # Backward-bump guard: the committed manifest is a release POINTER,
            # so a merge that resurrects an older manifest would silently
            # un-publish the current version. Refuse rather than regress.
            uv run --frozen python -m dev.packaging.release_pointer_guard \
              --existing "$work/bucket/cadrumo.json" \
              --version "$VERSION" \
              --format scoop
            mkdir -p "$work/bucket"
            cp "$RELEASE_COHORT_DIR/scoop/cadrumo.json" "$work/bucket/cadrumo.json"
            # Stage exactly this product's manifest. A sibling product's manifest
            # in the same bucket is never touched, which is what lets one shared
            # repository serve many products without a per-product repository.
            git -C "$work" add -- bucket/cadrumo.json
            if git -C "$work" diff --cached --quiet; then
              echo "bucket already at cadrumo $VERSION; nothing to push"
              published="yes"
            else
              git -C "$work" -c user.name="cadrumo-release" -c user.email="release@cadrumo.invalid" \
                commit -m "cadrumo $VERSION scoop manifest"
              if git -C "$work" -c http.extraheader="$auth" push; then
                published="yes"
              else
                echo "bucket push rejected on attempt ${attempt}; a sibling product likely pushed first" >&2
              fi
            fi
            rm -rf "$work"
            [[ -n "$published" ]] && break
          done
          if [[ -z "$published" ]]; then
            echo "REFUSED: bucket push lost three consecutive races; re-run this publication." >&2
            exit 1
          fi

      - name: Push the Homebrew formula into the shared account tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          if [[ -z "$TAP_TOKEN" || -z "$TAP_REPO" ]]; then
            echo "REFUSED: Homebrew tap not configured. Set the HOMEBREW_TAP_REPO variable" >&2
            echo "and the HOMEBREW_TAP_TOKEN secret to publish the Homebrew formula." >&2
            exit 1
          fi
          # Token rides an -c http.extraheader (never the clone URL) so it is not
          # persisted into the runner's .git/config remote.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          published=""
          for attempt in 1 2 3; do
            work="$(mktemp -d)"
            git -c http.extraheader="$auth" clone "https://github.com/${TAP_REPO}.git" "$work"
            # Backward-bump guard: same reasoning as the bucket manifest above —
            # the committed formula pins a version and a digest a user acts on.
            uv run --frozen python -m dev.packaging.release_pointer_guard \
              --existing "$work/Formula/cadrumo.rb" \
              --version "$VERSION" \
              --format homebrew
            mkdir -p "$work/Formula"
            cp "$RELEASE_COHORT_DIR/homebrew/Formula/cadrumo.rb" "$work/Formula/cadrumo.rb"
            git -C "$work" add -- Formula/cadrumo.rb
            if git -C "$work" diff --cached --quiet; then
              echo "tap already at cadrumo $VERSION; nothing to push"
              published="yes"
            else
              git -C "$work" -c user.name="cadrumo-release" -c user.email="release@cadrumo.invalid" \
                commit -m "cadrumo $VERSION"
              if git -C "$work" -c http.extraheader="$auth" push; then
                published="yes"
              else
                echo "tap push rejected on attempt ${attempt}; a sibling product likely pushed first" >&2
              fi
            fi
            rm -rf "$work"
            [[ -n "$published" ]] && break
          done
          if [[ -z "$published" ]]; then
            echo "REFUSED: tap push lost three consecutive races; re-run this publication." >&2
            exit 1
          fi

      # The Claude plugin marketplace is a supported avenue (readiness row set,
      # docs download page), so a release MUST populate it - not only attach the
      # zip to the GitHub release. Publish the in-cohort marketplace tree (which
      # embeds the exact digest-pinned cohort) to the public marketplace repo,
      # refusing instructively when it is not yet configured, mirroring the Scoop
      # and Homebrew steps.
      - name: Push the Claude plugin marketplace to the public marketplace repo
        env:
          MARKETPLACE_TOKEN: ${{ secrets.CLAUDE_MARKETPLACE_TOKEN }}
          MARKETPLACE_REPO: ${{ vars.CLAUDE_MARKETPLACE_REPO }}
        run: |
          if [[ -z "$MARKETPLACE_TOKEN" || -z "$MARKETPLACE_REPO" ]]; then
            echo "REFUSED: Claude marketplace not configured. Set the CLAUDE_MARKETPLACE_REPO variable" >&2
            echo "and the CLAUDE_MARKETPLACE_TOKEN secret to publish the plugin marketplace." >&2
            exit 1
          fi
          bundle="$(find "$RELEASE_COHORT_DIR/claude" -name 'cadrumo-marketplace-*.zip' -print -quit)"
          if [[ -z "$bundle" ]]; then
            echo "no marketplace bundle found in the release cohort" >&2
            exit 1
          fi
          # Token rides an -c http.extraheader (never the clone URL) so it is not
          # persisted into the runner's .git/config remote.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MARKETPLACE_TOKEN" | base64 | tr -d '\n')"
          staged="$(mktemp -d)"
          unzip -q "$bundle" -d "$staged"
          # The marketplace is account-scoped and serves sibling products, so two
          # products can release into it concurrently: a sibling push landing
          # between this job's clone and its push makes this push a
          # non-fast-forward. GitHub concurrency groups are per-repository and so
          # cannot serialise across product repos, hence a re-clone-and-reapply
          # retry. This is safe to repeat because the publish step is a pure
          # function of the marketplace tree and the cohort.
          published=""
          for attempt in 1 2 3; do
            work="$(mktemp -d)"
            git -c http.extraheader="$auth" clone "https://github.com/${MARKETPLACE_REPO}.git" "$work"
            # Replaces ONLY the plugin subtrees this cohort declares and merges
            # its entries by plugin name, refusing a name a sibling published.
            # The earlier wholesale tree replacement deleted every sibling.
            uv run --frozen python -m dev.packaging.marketplace_publish \
              --marketplace "$work" --cohort "$staged"
            git -C "$work" add -A
            if git -C "$work" diff --cached --quiet; then
              echo "marketplace already at cadrumo $VERSION; nothing to push"
              published="yes"
            else
              git -C "$work" -c user.name="cadrumo-release" -c user.email="release@cadrumo.invalid" \
                commit -m "cadrumo $VERSION"
              if git -C "$work" -c http.extraheader="$auth" push; then
                published="yes"
              else
                echo "marketplace push rejected on attempt ${attempt}; a sibling product likely pushed first" >&2
              fi
            fi
            rm -rf "$work"
            [[ -n "$published" ]] && break
          done
          rm -rf "$staged"
          if [[ -z "$published" ]]; then
            echo "REFUSED: marketplace push lost three consecutive races; re-run this publication." >&2
            exit 1
          fi
