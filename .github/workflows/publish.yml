name: Cadrumo Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        type: string
      packaging_run_id:
        description: "Successful Cadrumo Packaging Smoke run"
        required: true
        type: string
      homebrew_run_id:
        description: "Successful Cadrumo Homebrew Acquisition run"
        required: true
        type: string
      scoop_run_id:
        description: "Successful Cadrumo Scoop Acquisition run"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # KEYED BY VERSION, not by ref. An unkeyed or ref-keyed release group means
  # GitHub holds one running and one pending run, so a third release silently
  # CANCELS the queued one - and a cancelled run reports `cancelled`, not
  # `failed`, so a release that never happened raises no alarm.
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-evidence:
    name: "Check: Release channel evidence (Linux)"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Require successful validation and acquisition runs for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
          HOMEBREW_RUN_ID: ${{ inputs.homebrew_run_id }}
          SCOOP_RUN_ID: ${{ inputs.scoop_run_id }}
        run: |
          set -euo pipefail
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          if [ "$tag_type" = tag ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq .object.sha)"
          fi
          verify_run() {
            local run_id="$1" expected_name="$2"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid run id for ${expected_name}"; exit 1; }
            local payload conclusion name head_sha
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(jq -r .conclusion <<<"$payload")"
            name="$(jq -r .name <<<"$payload")"
            head_sha="$(jq -r .head_sha <<<"$payload")"
            test "$conclusion" = success || { echo "::error::${expected_name} run ${run_id} did not succeed"; exit 1; }
            test "$name" = "$expected_name" || { echo "::error::run ${run_id} is ${name}, expected ${expected_name}"; exit 1; }
            test "$head_sha" = "$tag_sha" || { echo "::error::${expected_name} run ${run_id} did not validate ${TAG}"; exit 1; }
          }
          verify_run "$PACKAGING_RUN_ID" "Cadrumo Packaging Smoke"
          verify_run "$HOMEBREW_RUN_ID" "Cadrumo Homebrew Acquisition"
          verify_run "$SCOOP_RUN_ID" "Cadrumo Scoop Acquisition"

  runner-queue-watchdog:
    # Mandatory now that the release path runs on the fleet: `smoke-test`
    # targets macOS ARM64 and Windows X64, and a lane whose label set no online
    # runner carries does NOT go red -- it queues silently until GitHub gives
    # up. On this fleet that is the normal state rather than an outage, because
    # the only macOS runner is a laptop whose battery and sleep gating is
    # deliberate policy. A publish that never happened must fail loudly, not
    # hang. Enforced by dev/ci/tests/test_runner_queue_watchdog.py, which
    # refused this workflow until the job was added.
    name: "Check: Runner queue (Linux)"
    # Shares the smoke lane's dependencies deliberately. GitHub does not
    # create a dependent job's record until its dependencies resolve, so an
    # ungated watchdog would open and close its bounded window before
    # `smoke-test` exists -- present, and watching nothing.
    needs: [build, runtime-inventory, release-evidence]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fail fast on a lane no online runner can serve
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_JOB_NAME: Cadrumo / runner queue watchdog
          THRESHOLD_SECONDS: "300"
          MAX_WATCH_SECONDS: "480"
        run: python3 -m dev.ci.runner_queue_watchdog

  runtime-inventory:
    timeout-minutes: 20
    name: "Check: Runtime inventory (Linux)"
    needs: release-evidence
    runs-on: [self-hosted, Linux, X64]
    outputs:
      matrix: ${{ steps.emit-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Python
        run: uv python install

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just setup

      # The stable rows are the complete support matrix, including runtimes
      # whose classifier promotion is still waiting on binary/artifact proof.
      # The separate `next` row is deliberately excluded from this publish
      # smoke gate while it remains prerelease.
      - name: Emit stable runtime smoke matrix
        id: emit-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(uv run --no-sync python -c 'import json; from dev.ci.python_runtime_matrix import load_runtime_inventory; inventory=load_runtime_inventory(); print(json.dumps({"include":[{"os":os,"runtime-id":row.identifier,"python-version":row.selector,"python-minor":row.minor,"phase":row.phase.value,"blocking":row.blocking,"check-name":f"Test: Release artifacts {row.minor} {row.phase.value} ({os[1]})"} for row in inventory.stable for os in (["self-hosted","Linux","X64"],["self-hosted","macOS","ARM64"],["self-hosted","Windows","X64"])]}, separators=(",",":")))')"
          # `-n` passes on `{"include":[]}`, which expands to zero smoke jobs.
          # A matrix job with no combinations does not fail, so publication
          # would proceed having proved nothing on any platform. Count the
          # entries rather than measuring the string.
          entries="$(printf '%s' "$matrix" | uv run --no-sync python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')"
          if [ "$entries" -eq 0 ]; then
            echo "::error::the stable runtime inventory yielded no smoke targets; refusing to publish unproven"
            exit 1
          fi
          echo "stable runtime smoke targets: $entries"
          {
            echo 'matrix<<STABLE_RUNTIME_MATRIX'
            echo "$matrix"
            echo 'STABLE_RUNTIME_MATRIX'
          } >> "$GITHUB_OUTPUT"

  build:
    timeout-minutes: 120
    name: "Acquire: Validated release artifacts (Linux)"
    needs: runtime-inventory
    # Hosted. The three distributions are py3-none-any, so the build host
    # cannot affect the artifact, and this repository is public. A release
    # must not depend on a self-hosted runner being free or a laptop being
    # on AC power.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Python
        run: uv python install

      # Promote the immutable cohort that Packaging Smoke built and every
      # platform/channel lane validated. Rebuilding here would publish bytes
      # that none of those required runs actually exercised.
      - name: Download the validated immutable release cohort
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
        run: |
          set -euo pipefail
          mkdir -p var/cohort-download var/release-cohort
          gh run download "$PACKAGING_RUN_ID" --name cadrumo-release-cohort \
            --dir var/cohort-download
          tar -xzf var/cohort-download/cadrumo-release-cohort.tar.gz \
            -C var/release-cohort

      - name: Verify and select the validated distribution bytes
        run: |
          set -euo pipefail
          uv run --no-sync python -m dev.packaging.release_cohort verify \
            --cohort-dir var/release-cohort
          mkdir -p dist
          cp var/release-cohort/python/*.whl dist/
          cp var/release-cohort/python/*.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 6
          ls -l dist

      # PyPI rejects any file at or over its per-file cap. The corpus split
      # exists to stay under it; check here rather than discovering it at
      # upload, after the reversible destinations have already been written.
      # The limit itself is declared once, in `dev/packaging/_distribution_limits`,
      # so this step names no number of its own.
      - name: Refuse a distribution over the index file cap
        run: python -m dev.packaging.distribution_cap --directory dist

      # Seal the promoted subset for the downstream smoke and publication jobs.
      # The cohort verifier above first checks these bytes against the immutable
      # manifest produced by Packaging Smoke.
      - name: Seal and verify distribution bytes
        run: |
          sha256sum dist/*.whl dist/*.tar.gz | sort > dist/manifest.sha256
          sha256sum --check dist/manifest.sha256

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: "${{ matrix.check-name }}"
    needs: [build, runtime-inventory]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-inventory.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify sealed distribution bytes
        shell: bash
        run: sha256sum --check dist/manifest.sha256

      # `--find-links dist` resolves cadrumo and both corpora from the built
      # files while everything else comes from the index, so the exact `==`
      # pins are satisfied without the corpora being published first.
      # `--isolated --no-project` means the only project content present is
      # the artifact under test.
      - name: Smoke test the built wheels
        shell: bash
        run: |
          VERSION="${TAG#v}"
          uv run --isolated --no-project --python "${{ matrix.python-version }}" --find-links dist \
            --with "cadrumo==${VERSION}" \
            dev/smoke/smoke_check.py
        env:
          TAG: ${{ inputs.tag }}

  publish-pypi:
    timeout-minutes: 30
    name: "Build: Package publication (Linux)"
    needs: smoke-test
    runs-on: [self-hosted, Linux, X64]
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Checked out so the toolchain resolves against the repository's own
      # `.python-version` rather than whatever the image happens to carry.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # The last check before the upload below, which cannot be undone. Every
      # earlier step in this workflow is reversible; from the next step onward
      # nothing is, so the question "does some destination already own this
      # version" is asked here and not before.
      #
      # The tag and the release for this version already exist: the release cut
      # them and dispatched this run. They are exempted by commit identity, not
      # by being skipped - the tag this job checked out and the release that
      # targets the same commit are its own, while a tag or release carrying
      # this version on ANY other commit is a genuine collision and still
      # refuses.
      - name: Refuse a version any destination already owns
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          uv run --frozen python -m dev.release.version_identity \
            --version "${TAG#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --own-source-commit "$(git rev-parse HEAD)" \
            --scope publish

      # Distributions only, by explicit suffix. The directory also carries the
      # checksum manifest sealed above and the marker `uv build` leaves behind,
      # and neither is an uploadable file: a bare `dist/*` offers them to the
      # index and fails the step part-way through an upload that is not atomic.
      #
      # `--check-url` lets a retry converge after such a partial upload: six
      # files go up and the operation is not atomic.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
