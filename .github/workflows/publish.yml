# Publication remains intentionally absent until the complete cross-channel
# cohort and its blocking evidence are implemented. This manual workflow is a
# retained-byte readiness diagnostic only; it has no upload authority.
name: Validate retained release candidate

on:
  workflow_dispatch:
    inputs:
      packaging_run_id:
        description: "Successful Cadrumo Packaging Smoke run containing the tested cohort"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  COHORT_DIR: var/promotion/cohort
  EVIDENCE_DOWNLOAD: var/promotion/evidence
  PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}

jobs:
  validate:
    name: Validate immutable tested Python candidate
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Require one successful packaging-smoke authority run
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PACKAGING_RUN_ID}")"
          conclusion="$(jq -r .conclusion <<<"$run_json")"
          workflow_path="$(jq -r .path <<<"$run_json")"
          event="$(jq -r .event <<<"$run_json")"
          head_branch="$(jq -r .head_branch <<<"$run_json")"
          head_repository="$(jq -r .head_repository.full_name <<<"$run_json")"
          source_commit="$(jq -r .head_sha <<<"$run_json")"
          if [[ "$conclusion" != "success" ]]; then
            echo "packaging run did not succeed: $conclusion" >&2
            exit 1
          fi
          if [[ "$workflow_path" != ".github/workflows/packaging-smoke.yml" ]]; then
            echo "run is not the packaging-smoke authority: $workflow_path" >&2
            exit 1
          fi
          # Defence-in-depth (mirrors publish-release.yml): only a trusted push to
          # main in this repository is a candidate, so a collaborator cannot validate
          # a fork or non-main-branch run. This diagnostic has no upload capability.
          if [[ "$event" != "push" ]]; then
            echo "source packaging run must be one push event: $event" >&2
            exit 1
          fi
          if [[ "$head_branch" != "main" ]]; then
            echo "source packaging run must be on main: $head_branch" >&2
            exit 1
          fi
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "source packaging run does not belong to this repository: $head_repository" >&2
            exit 1
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source-run.outputs.source_commit }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"

      - name: Download tested cohort and installed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$PACKAGING_RUN_ID" --name cadrumo-python-cohort --dir "$COHORT_DIR"
          gh run download "$PACKAGING_RUN_ID" --name cadrumo-packaging-smoke-evidence --dir "$EVIDENCE_DOWNLOAD"

      - name: Validate exact hashes and both installed public transports
        id: validate
        env:
          EXPECTED_SOURCE_COMMIT: ${{ steps.source-run.outputs.source_commit }}
        run: |
          evidence_file="$(find "$EVIDENCE_DOWNLOAD" -path "*/${EXPECTED_SOURCE_COMMIT}/evidence.json" -print -quit)"
          if [[ -z "$evidence_file" ]]; then
            echo "installed cohort evidence is absent for $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi
          uv run --frozen python -m dev.release.promote_python_cohort \
            --cohort-dir "$COHORT_DIR" \
            --evidence-file "$evidence_file" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT" \
            --check-pypi \
            --github-output "$GITHUB_OUTPUT"

      - name: Keep publication blocked
        run: |
          echo "The retained Python candidate is valid."
          echo "Publication remains blocked until the full plugin, MCPB, Scoop, Homebrew,"
          echo "GitHub release, Python, platform, client, and reacquisition evidence set exists."
