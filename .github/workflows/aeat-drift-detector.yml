# AEAT live-parity drift detector
#
# Runs the GROI Spanish-ROI live-read tests against AEAT under a
# stored cl@ve-movil session, on dispatch. Failure means
# AEAT changed the form shape, response shape, or selectors used by
# the GROI driver — the project oracle's selectors must be updated.
#
# Required secrets (GitHub repo settings -> Secrets and variables ->
# Actions):
#   AEAT_CLAVE_MOVIL_DNI_NIE          User identity for cl@ve-movil
#   AEAT_CLAVE_MOVIL_DNI_FECHA        Identity verification date
#   AEAT_CLAVE_MOVIL_NIE_SOPORTE      Identity card support number
#   AEAT_CLAVE_MOVIL_FULL_LIVE_AUTH   Set to "1" to enable headless
#                                     authentication
#   AEAT_CLAVE_PREFER_NON_QR          Set to "true" to skip QR flow
#
# Use a dedicated cl@ve-movil identity for this workflow — never the
# project owner's personal credentials. Identity rotation should be
# handled out-of-band.
#
# When this workflow fails, an issue is automatically opened with
# the `aeat-drift` label so the failure is tracked to remediation.

name: Cadrumo AEAT Drift Detector

# Dispatch-only (operator ruling 2026-07-21: no schedules, no standing
# compute). Run before relying on the GROI oracle: ahead of a release, after
# a long idle stretch, or when AEAT-side drift is suspected.
on:
  workflow_dispatch:

# A live cl@ve-movil auth session must never be interrupted mid-flight, and
# two concurrent sessions against the same stored identity would race; one
# run at a time, newest queued.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # just

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Self-hosted: the runner-local uv cache persists between jobs; the
          # GitHub cloud-cache round-trip only adds transfer time.
          enable-cache: false

      - name: Bootstrap
        run: |
          uv sync --frozen
          uv run vaultspec-core install --force

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run GROI live drift tests
        env:
          CADRUMO_LIVE_TESTS_ENABLED: '1'
          AEAT_AUTH_PROVIDER: clave-movil
          AEAT_CLAVE_MOVIL_FULL_LIVE_AUTH: ${{ secrets.AEAT_CLAVE_MOVIL_FULL_LIVE_AUTH }}
          AEAT_CLAVE_PREFER_NON_QR: ${{ secrets.AEAT_CLAVE_PREFER_NON_QR }}
          AEAT_CLAVE_MOVIL_DNI_NIE: ${{ secrets.AEAT_CLAVE_MOVIL_DNI_NIE }}
          AEAT_CLAVE_MOVIL_DNI_FECHA: ${{ secrets.AEAT_CLAVE_MOVIL_DNI_FECHA }}
          AEAT_CLAVE_MOVIL_NIE_SOPORTE: ${{ secrets.AEAT_CLAVE_MOVIL_NIE_SOPORTE }}
        # No junit artifact (zero Actions-artifact posture); the verbose
        # per-test verdicts live in the job log.
        run: |
          # -n0, never the addopts -n auto: one live-browser test file gains
          # nothing from 24 workers on a machine that carries co-resident jobs
          # from several repositories (.github/ci-control-plane.md).
          uv run --no-sync pytest -n0 \
            src/cadrumo/adapters/outbound/aeat/sede/tests/test_groi_check_live.py \
            -v

      - name: Open drift issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'AEAT drift detector: GROI live tests failed';
            const body = [
              'The AEAT drift detector found the GROI live tests',
              'failing. AEAT likely changed the form shape, response',
              'shape, or selectors used by the GROI oracle.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Remediation: re-capture the AEAT form HTML, update the',
              'driver selectors in `src/cadrumo/adapters/outbound/aeat/sede/_groi_check.py`,',
              'and re-run the tests locally with `CADRUMO_LIVE_TESTS_ENABLED=1`.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['aeat-drift'],
            });
