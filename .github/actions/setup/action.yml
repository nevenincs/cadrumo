name: Setup
description: Provision uv, just, and the repository worktree; optionally provision the registry authority and the browser toolchain.

inputs:
  python-version:
    description: >-
      Interpreter a compatibility job targets. Empty defers to the checked-in
      `.python-version` pin, which every job that is not a runtime
      compatibility row must use.
    required: false
    default: ""
  authority:
    description: >-
      When true, the job reads the checkout's published registry authority, so
      it is republished when stale. False for jobs that never load it.
    required: false
    default: "true"
  authority-artifact:
    description: >-
      Name of this run's published-authority artifact to restore before the
      currency check. Empty publishes locally.
    required: false
    default: ""
  browser:
    description: When true, also provision the Playwright browser channels.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Restored before `just setup`: the editable build compiles the authority
    # as a side effect unless a current one is already published, so a restore
    # after it would arrive too late to save that compilation.
    - name: Restore the published registry authority
      if: inputs.authority == 'true' && inputs.authority-artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.authority-artifact }}
        path: .authority

    - name: Set up just
      uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
      with:
        tool: just@1.38.0

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.29"
        enable-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Initialize the worktree
      shell: bash
      # Self-hosted runner services can carry a workstation authority override,
      # and `dev/env/_install.py` only drops the variable when it already
      # resolves to this checkout, so a foreign absolute path survives that
      # check. The unset is what removes it.
      # It does NOT leave the variable unset: `dev/_paths.py` re-seeds it to
      # this checkout's `.authority` at import time, before any `python -m dev.*`
      # tool runs. CI therefore exercises the CHECKOUT posture, never the
      # packaged default.
      #
      # `just setup` ends with an advisory `aeat config check`, whose output is
      # localized product text. A job log is read by whoever is debugging, not
      # by an operator who chose a language, so a runner resolving a non-English
      # locale reports its diagnostics in one the reader may not have -- a
      # Spanish authority-descriptor refusal in run 35521505145 was misread as
      # evidence of a configured override and cost a debugging cycle. Pinning
      # the language changes only what is PRINTED: transport tokens,
      # identifiers and stored data are untranslated either way. Same posture
      # as `dev/packaging/installed_tax_oracle.py:186`, which pins it because
      # the packaging oracles read product output as data.
      #
      # A job that asked for no authority tells the editable build not to
      # resolve one; otherwise that build compiles the whole registry (about
      # four minutes) for a lint job that never reads it.
      env:
        CADRUMO_OUTPUT_LANGUAGE: en
        CADRUMO_EDITABLE_AUTHORITY: ${{ inputs.authority == 'true' && 'resolve' || 'skip' }}
      run: |
        unset CADRUMO_AUTHORITY_ROOT
        just setup

    # A first `uv sync` publishes the authority only as a side effect of the
    # editable build, and a runner whose uv cache is shared across checkouts
    # reuses that build instead of running it, so a fresh checkout reaches the
    # registry gate with no descriptor. Publishing explicitly, and only when
    # stale, makes the gate test the tree rather than the cache's history. A
    # restored artifact is not trusted either: this currency check reads it
    # against the checked-out sources and republishes when it does not match.
    - name: Publish the registry authority
      if: inputs.authority == 'true'
      shell: bash
      run: just registry-publish-authority-if-authority-stale

    - name: Provision Playwright Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: just setup-browser
