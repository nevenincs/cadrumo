name: Setup
description: Provision uv, just, and the repository worktree; optionally provision the browser toolchain.

inputs:
  python-version:
    description: Python version to provision via astral-sh/setup-uv.
    required: false
    default: "3.13"
  browser:
    description: When true, also provision the Playwright browser channels.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up just
      uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
      with:
        tool: just@1.38.0

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.11.29"
        enable-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Initialize the worktree
      shell: bash
      # Self-hosted runner services can carry a workstation authority override,
      # and the editable build inside `uv sync` honours a foreign
      # `CADRUMO_AUTHORITY_ROOT` as named. The unset keeps setup on this
      # checkout's own `.authority`. `dev/_paths.py` re-seeds the variable to
      # that directory for every later `python -m dev.*` tool, so CI exercises
      # the CHECKOUT posture, never the packaged default.
      run: |
        unset CADRUMO_AUTHORITY_ROOT
        just setup

    # A first `uv sync` publishes the authority only as a side effect of the
    # editable build, and a runner whose uv cache is shared across checkouts
    # reuses that build instead of running it, so a fresh checkout reaches the
    # registry gate with no descriptor. Publishing explicitly, and only when
    # stale, makes the gate test the tree rather than the cache's history.
    - name: Publish the registry authority
      shell: bash
      run: just registry-publish-authority-if-authority-stale

    - name: Provision Playwright Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: just setup-browser
