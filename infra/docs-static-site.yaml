AWSTemplateFormatVersion: '2010-09-09'
Description: Private Cadrumo documentation delivery.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: Use 3-63 lowercase letters, numbers, or hyphens.
  CertificateArn:
    Type: String
    Description: Validated us-east-1 ACM certificate ARN for SiteDomainName.
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: Use a validated us-east-1 ACM certificate ARN.
  SiteDomainName:
    Type: String
    Default: cadrumo.neve.md
    Description: CloudFront alternate domain name.
    AllowedPattern: '^[a-z0-9.-]+$'
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DocsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Read the private Cadrumo docs bucket.
        Name: !Sub '${AWS::StackName}-docs-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DocsRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionConfig:
        Comment: Route Cadrumo documentation paths.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } }
          };
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri === '/docs') {
            return redirect('/docs/');
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }

          return request;
        }
      Name: !Sub '${AWS::StackName}-docs-router'

  DocsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref SiteDomainName
        Comment: !Sub 'Cadrumo docs for ${SiteDomainName}'
        CustomErrorResponses:
          - ErrorCachingMinTTL: 10
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCachingMinTTL: 10
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DocsRouterFunction.FunctionMetadata.FunctionARN
          TargetOriginId: docs-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt DocsBucket.RegionalDomainName
            Id: docs-bucket
            OriginAccessControlId: !GetAtt DocsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: !Ref PriceClass
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DocsBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub '${DocsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DocsBucketName:
    Description: Private docs bucket name.
    Value: !Ref DocsBucket
  DocsDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref DocsDistribution
  DocsDistributionDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt DocsDistribution.DomainName
  DocsCanonicalUrl:
    Description: Canonical docs URL.
    Value: !Sub 'https://${SiteDomainName}/docs/'
