<!--
SYNTHETIC - hand-built, not captured from AEAT. See the provenance sidecar
(declaraciones-modelo-303-no-results-synthetic.json).

What this fixture models: the register grid AEAT renders for a (modelo,
ejercicio) pair the taxpayer never filed. The grid comes back fully formed -
header row, column set, empty-body section - and carries ZERO z-listitem rows.
The no-results sentence lives in the ZK "emptybody" tbody, which is NOT a
z-listitem, so the row loop finds nothing to iterate rather than finding one
sentinel row. There is no pager, so the grid declares no record total and
nothing can fall short of one.

That distinction is the whole point of the fixture. An empty answer here is a
complete answer - the taxpayer filed nothing - and it must stay separable from
the two shapes that ARE failures: a grid whose pager declares more records than
it rendered, and markup with no grid at all. The inline no-results shape already
covered elsewhere in this tree puts the sentence inside a single-cell
z-listitem, which exercises a different branch than the markup AEAT actually
serves.

Class names and column order mirror the real sanitised capture
(declaraciones-modelo-100-2022.html). The empty-body cell is rendered visible
here, which is what a genuinely empty grid does.
-->
