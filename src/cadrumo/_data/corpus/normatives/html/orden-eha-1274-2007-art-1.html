      <h1>Orden EHA/1274/2007 - Articulo 1</h1>
      <p>Articulo 1. Aprobacion del modelo 036 de declaracion censal.</p>
      <p>Se aprueba el modelo 036, de declaracion censal de alta, modificacion y baja en el Censo de empresarios, profesionales y retenedores.</p>
      <p>El modelo 036 figura en el anexo I de esta orden.</p>
