# The following fields widen the socio row to carry the (member, clave,
# subclave) repetition axis the Modelo 184 socio record's own diseño
# declares -- "se consignará un registro por cada clave o subclave de
# rendimientos, deducciones o retenciones atribuibles para los que se haya
# consignado un importe y país" -- and the clave/subclave-conditional facts
# the diseño attaches to that row. Grounded field-by-field against the
# SOCIO record's own field text (diseño positions 76-229), never the
# entidad record's lookalike clave-A subclave table at a different byte
# range. Deliberately excluded: the clave-A reducción (positions 109-119
# when clave=A, subclave=02 -- its governing article is unresolved),
# provisiones deducibles y gastos de difícil justificación (positions
# 160-171 -- a computed formula reading the entity's own tipo-2 régimen
# fact, not an operator-declared value), and the clave-E eligibility test
# (a member's own IS/IRNR-con-establecimiento classification, which this
# tree does not represent).
[[sections.fields]]
key = "clave"
type = "enum"
required = true
sensitivity = "identity"
effective_dated = true
description = "Clave alfabética del registro de socio, heredero, comunero o partícipe del Modelo 184 (posición 93): A capital mobiliario, C capital inmobiliario, D actividades económicas, E rentas de IIC, F ganancias/pérdidas no derivadas de transmisión, G ganancias/pérdidas derivadas de transmisión, I deducciones Ley IRPF, J deducciones Ley Impuesto Sociedades, K retenciones e ingresos a cuenta. El registro se repite por cada clave o subclave con importe declarado."
enum_values = ["A", "C", "D", "E", "F", "G", "I", "J", "K"]
model_selectors = ["attribution_entity_socios.clave"]
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-87", "orden-hap-2250-2015:art-3"]

[[sections.fields]]
key = "subclave"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Subclave numérica del registro de socio (posiciones 94-95), aplicable únicamente a las claves A, D, F, G, I, J y K; las claves C y E no llevan subclave y este campo va en blanco para ellas. El significado de cada valor depende de la clave declarada en el mismo registro: p. ej. bajo clave D, subclave 01 es estimación directa normal, 02 estimación directa simplificada, 03 estimación objetiva (excepto agrícolas/ganaderas/forestales) y 04 estimación objetiva agrícola/ganadera/forestal."
enum_values = ["01", "02", "03", "04", "05", "06"]
model_selectors = ["attribution_entity_socios.subclave"]
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-87", "orden-hap-2250-2015:art-3"]

