# One shared REDUCCIÓN field on the diseño (positions 109-119), whose
# meaning depends on which clave the row declares: clave C applies LIRPF
# art. 23 (arrendamiento-vivienda 90/70/60/50% tiers and the >2-year or
# notoriamente-irregular 30% reduction), clave D applies LIRPF art. 32.1
# (the same >2-year/irregular 30% reduction, capped at EUR 300,000/year,
# for actividades económicas net yields). The clave-A branch of this same
# physical field is deliberately NOT modelled here: its governing article
# is unresolved.
[[sections.fields]]
key = "reduccion"
type = "money"
required = false
