[[sections.fields]]
key = "worker_class"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Clasificación como trabajador del mar. Puede dar acceso a la exención por trabajos en el extranjero del art. 7.p LIRPF, a la exención REBECA del 50 % o, cuando llegue a estar vigente, a la prevista en la disposición adicional 41. Si no se indica, se aplica el tratamiento ordinario del trabajo."
enum_values = ["trabajador_del_mar"]
schedule_predicates = ["maritime_worker.worker_class"]
legal_refs = [
  "ley-35-2006:art-7",
  "ley-19-1994:art-75",
  "ley-35-2006:da-41",
  "ley-35-2006:art-96",
]

[[sections.fields]]
key = "vessel_flag"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Flag state of the vessel. ES (Spanish flag) or foreign. Art. 7.p) eligibility requires work performed outside Spanish territory; foreign-flagged vessels in international waters satisfy this when the employer is a non-resident entity or has a permanent establishment abroad (AEAT accepted practice confirmed by TEAR Galicia December 2024)."
enum_values = ["ES", "foreign"]
legal_refs = ["ley-35-2006:art-7"]

[[sections.fields]]
key = "waters_type"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Waters classification for the vessel's operating area. international waters qualify as effectively performing work outside Spain under Art. 7.p) LIRPF in AEAT accepted practice."
enum_values = ["national", "international"]
legal_refs = ["ley-35-2006:art-7"]

[[sections.fields]]
key = "vessel_registry"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Vessel registry classification. REBECA is the Registro Especial de Buques y Empresas Navieras de Canarias (Ley 19/1994). rebeca_eu_eea covers the 2021 extension to vessels of REBECA-registered companies enrolled in another EU/EEA member state registry. scheduled_canary_route covers vessels on Canary Islands to mainland Spain scheduled routes. Absent this field no REBECA exemption is evaluated."
enum_values = ["REBECA", "rebeca_eu_eea", "scheduled_canary_route", "other"]
legal_refs = [
  "ley-19-1994:art-75",
]

[[sections.fields]]
key = "retmar_registered"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer is registered in RETMAR/RETM (Regimen Especial de la Seguridad Social de los Trabajadores del Mar). Since 2023 workers registered in this maritime special Social Security regime must file an IRPF declaration regardless of income level under LIRPF art. 96. This field drives a mandatory-filing profile completeness warning; it does not alter casilla values or formula paths."
schedule_predicates = ["maritime_worker.retmar_registered"]
legal_refs = ["ley-35-2006:art-96"]

[[sections.fields]]
key = "tuna_fleet"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Indica si el buque pertenece a una flota de pesca de túnidos. Junto con el estado de autorización europea determina si la exención de la disposición adicional 41 LIRPF puede aplicarse; mientras falte autorización, no se aplica."
model_selectors = ["maritime_worker.tuna_fleet"]
schedule_predicates = ["maritime_worker.tuna_fleet"]
legal_refs = [
  "ley-35-2006:da-41",
]

[[sections.fields]]
key = "pending_eu_clearance"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Indica si la exención para flotas atuneras de la disposición adicional 41 LIRPF sigue pendiente de autorización de ayudas de Estado por la Comisión Europea. Manténgalo activo hasta que la autorización sea efectiva; mientras tanto la exención no se aplica."
model_selectors = ["maritime_worker.pending_eu_clearance"]
schedule_predicates = ["maritime_worker.pending_eu_clearance"]
legal_refs = [
  "ley-35-2006:da-41",
]

