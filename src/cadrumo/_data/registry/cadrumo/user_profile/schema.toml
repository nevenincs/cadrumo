[schema]
id = "cadrumo.user_profile"
version = 6
title = "Cadrumo user profile schema"
snapshot_policy = "immutable_secure_snapshot_hash"
remove_policy = "live_profile_tombstone_retain_snapshots"

# Namespaces of profile paths the calculation engine OWNS and computes.
#
# These are not taxpayer data. Each value is derived at calculate time from the
# source facts named in `derived_from`, so the namespace is declared once as a
# year-parameterised pattern instead of one field per filing year. Registry
# binding selectors targeting these paths resolve against these patterns.
#
# `{filing_year}` compiles to exactly four digits with a terminal anchor, so
# `descendientes_minimos_aggregate_{filing_year}` cannot swallow the longer
# `descendientes_minimos_aggregate_autonomico_{filing_year}` paths.
#
# `cotizaciones_ss_madre_2024` and `renta_rental.reduccion_art_23_2_tier_2024`
# are deliberately absent: they are genuine operator input, not derived.

[[derived_selectors]]
pattern = "renta_family.descendientes_minimos_aggregate_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Parte estatal del minimo por descendientes, calculada de los descendientes declarados."
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61"]

[[derived_selectors]]
pattern = "renta_family.descendientes_minimos_aggregate_autonomico_{filing_year}"
derived_from = ["renta_family.descendiente", "tax_residence.ccaa"]
entry_surface = "aeat config profile descendiente"
description = "Parte autonomica del minimo por descendientes, resuelta contra la CCAA de residencia."
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61"]

[[derived_selectors]]
pattern = "renta_family.anualidades_sin_minimo_descendientes_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Elegibilidad de la escala separada por anualidades por alimentos a favor de los hijos."
legal_refs = ["ley-35-2006:art-64", "ley-35-2006:art-75"]

[[derived_selectors]]
pattern = "renta_family.descendientes_guarderia_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Numero de descendientes menores de tres anos, contado de los descendientes declarados."
legal_refs = ["ley-35-2006:art-58"]

[[derived_selectors]]
pattern = "renta_family.gastos_guarderia_reales_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Gastos de custodia en guarderia agregados de los descendientes declarados."
legal_refs = ["ley-35-2006:art-81"]

[[derived_selectors]]
pattern = "renta_family.incremento_guarderia_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Incremento por gastos de custodia, prorrateado por meses y limitado por descendiente."
legal_refs = ["ley-35-2006:art-81", "ley-35-2006:art-81-2", "ley-35-2006:art-81-3"]

[[derived_selectors]]
pattern = "renta_family.deduccion_maternidad_{filing_year}"
derived_from = ["renta_family.descendiente"]
entry_surface = "aeat config profile descendiente"
description = "Deduccion por maternidad, calculada por descendiente desde los meses declarados y su elegibilidad."
legal_refs = ["ley-35-2006:art-81"]

[[derived_selectors]]
pattern = "tax_residence.state_attribution_ratio"
derived_from = ["tax_residence.jurisdiction_scope"]
entry_surface = "aeat config profile set tax_residence.jurisdiction_scope"
description = "Porcentaje atribuible al Estado derivado exclusivamente del regimen territorial declarado."
legal_refs = ["ley-12-2002:art-29"]

[[sections]]
key = "identity"
title = "Identity"
sensitivity = "identity"
effective_dated = false

[[sections.fields]]
key = "tax_id"
type = "string"
required = true
sensitivity = "identity"
description = "NIF/NIE/CIF used as filing identity."
model_selectors = ["tax.id", "modelo_100"]
legal_refs = ["orden-hac-242-2025:art-3", "orden-hac-277-2026:art-3"]

[[sections.fields]]
key = "name"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant given name or display name."
model_selectors = ["name", "modelo_100"]
legal_refs = ["orden-hac-242-2025:art-3", "orden-hac-277-2026:art-3"]

[[sections.fields]]
key = "surnames"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant surnames for person filings."
model_selectors = ["surnames", "modelo_100"]
legal_refs = ["orden-hac-242-2025:art-3", "orden-hac-277-2026:art-3"]

[[sections.fields]]
key = "legal_name"
type = "string"
required = false
sensitivity = "identity"
description = "Legal or company name for entity-style export headers."

[[sections.fields]]
key = "email"
type = "email"
required = false
sensitivity = "identity"
description = "Operator contact email used by configuration surfaces."

[[sections.fields]]
key = "notes"
type = "string"
required = false
sensitivity = "identity"
description = "Operator free-form notes attached to the profile."

[[sections]]
key = "preferences"
title = "Operator preferences"
sensitivity = "operational"
effective_dated = false

[[sections.fields]]
key = "output_language"
type = "enum"
required = false
sensitivity = "operational"
description = "Output language used by CLI rendering and notification copy."
enum_values = ["es", "en", "ca", "hu"]

[[sections]]
key = "capabilities"
title = "Service capabilities"
sensitivity = "operational"
effective_dated = false

[[sections.fields]]
key = "llm_vision"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile may read scanned or image evidence on-host with the local vision model, so no byte leaves the machine. Default on; opting out disables the on-host vision read."

[[sections.fields]]
key = "google_export"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile may export modelo workbooks to Google Sheets or Drive. Default on; opting out keeps exports offline-only."

[[sections.fields]]
key = "cloud_evidence_upload"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile is eligible to be asked for permission to read an evidence document at a hosted model, which removes that document from this machine. Default off, and refused outright in gestor mode. While off, the permission is never requested and no document is ever sent."

[[sections]]
key = "auth"
title = "AEAT authentication"
sensitivity = "identity"
effective_dated = false

[[sections.fields]]
key = "provider"
type = "enum"
required = false
sensitivity = "identity"
description = "How this taxpayer identifies to AEAT. Cl@ve Movil and Cl@ve Permanente authenticate the person directly and need their DNI/NIE; the certificate provider authenticates with an installed electronic certificate instead. The choice decides which of the fields below are required."
enum_values = ["certificate", "clave_movil", "clave_permanente"]

[[sections.fields]]
key = "clave_movil_route"
type = "enum"
required = false
sensitivity = "identity"
description = "How Cl@ve Movil should ask for confirmation: show a QR code in a visible browser, or identify with DNI/NIE plus contraste and send a request to the Cl@ve app."
enum_values = ["qr", "app_request"]

# THE THREE FIELDS BELOW SPLIT ACROSS TWO SENSITIVITY CLASSES, and the split is
# the point rather than an oversight. dni_nie NAMES the taxpayer; the contraste
# pair PROVES possession of their physical document. Only the second is
# authentication material, so only the second is secret.
#
# dni_nie carries the same identifier as identity.tax_id, which renders in the
# clear one section above, so masking this copy concealed nothing an operator
# reading that screen could not already see. It confers no capability on its
# own either: reaching a session also needs the contraste plus a Cl@ve PIN or
# app that is never stored here. The classes themselves say so - SECRET is
# declared for long-lived authentication material while IDENTITY names the NIF
# explicitly - and classing this field secret dropped nif-hash, the one
# redaction rule that hashes a NIF, from the policy resolved for it.
#
# The agreement between dni_nie and identity.tax_id is enforced ONCE, at the
# entry to a live session. No validator refuses the divergent write, so a
# profile holding two different identifiers can be created and read back; it
# simply cannot authenticate. Anything upstream of a session reads whichever
# field it names and will not notice the disagreement.
#
# Rationale belongs in comments like this one rather than in a description.
# No surface renders a description as a row label any more -- the status page
# and the manager both read the locale catalogue -- but a description is still
# the string the masking heuristic scans for an unclassified field, and it is
# what a field renders when no catalogue carries its label yet.
[[sections.fields]]
key = "dni_nie"
type = "string"
required = false
sensitivity = "identity"
description = "DNI or NIE presented to Cl@ve. Holds the same identifier as identity.tax_id; live authentication refuses when the two diverge."

[[sections.fields]]
key = "numero_soporte"
type = "string"
required = false
sensitivity = "secret"
description = "Numero de soporte printed on a NIE document. Cl@ve asks a NIE holder for this and a DNI holder for fecha_validez, reading exactly one of the two, and only on the non-QR route."

[[sections.fields]]
key = "fecha_validez"
type = "date"
required = false
sensitivity = "secret"
description = "Validity date printed on a DNI document. Cl@ve asks a DNI holder for this and a NIE holder for numero_soporte, reading exactly one of the two, and only on the non-QR route."

[[sections]]
key = "contact"
title = "Contact and fiscal address"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "fiscal_address"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal address declared for taxpayer/censo purposes."

[[sections.fields]]
key = "postcode"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal-address postcode."
model_selectors = ["address.postcode"]

[[sections.fields]]
key = "fiscal_address_cadastral_reference"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Catastral reference of the operator's fiscal address. Carried by the 036 censo so AEAT can locate the address in the Catastro."
model_selectors = ["address.cadastral_reference"]
legal_refs = ["rdleg-1-2004:art-6.3"]

[[sections.fields]]
key = "fiscal_address_is_habitual_vivienda"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the fiscal address is also the operator's habitual residence. Gates the home-office afectacion-parcial regime per LIRPF Art. 30.2 rule 5."
model_selectors = ["address.is_habitual_vivienda"]
legal_refs = ["ley-35-2006:da-23", "ley-35-2006:art-30"]

[[sections.fields]]
key = "contact_person_phone"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Telefono de la persona con quien relacionarse, declared in the declarante header of every AEAT informativa. AEAT reserves nine numeric positions for it (Modelo 180/190/270/349 positions 59-67) and names the field 'PERSONA CON QUIEN RELACIONARSE'. This is the contact for the declaration, not necessarily the taxpayer."
model_selectors = ["contact.contact_person_phone"]

[[sections.fields]]
key = "contact_person_name"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Apellidos y nombre de la persona con quien relacionarse, the second subcampo of the informativa declarante header (Modelo 180/190/270/349 positions 68-107, forty alphanumeric positions). AEAT asks for 'el primer apellido, un espacio, el segundo apellido, un espacio y el nombre completo, necesariamente en este orden'."
model_selectors = ["contact.contact_person_name"]

[[sections]]
key = "tax_residence"
title = "Tax residence and jurisdiction"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "ccaa"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Comunidad autónoma de residencia fiscal en territorio común para el Modelo 100."
enum_values = [
  "andalucia",
  "aragon",
  "asturias",
  "baleares",
  "canarias",
  "cantabria",
  "castilla_la_mancha",
  "castilla_y_leon",
  "cataluna",
  "comunidad_valenciana",
  "extremadura",
  "galicia",
  "la_rioja",
  "madrid",
  "murcia",
]
model_selectors = ["TaxResidenceProfile.ccaa"]

[[sections.fields]]
key = "jurisdiction_scope"
type = "enum"
required = true
sensitivity = "identity"
effective_dated = true
description = "Régimen territorial aplicable declarado explícitamente: territorio común o territorio foral aún no soportado."
enum_values = ["common_regime", "foral_unsupported"]

[[sections]]
key = "censo"
title = "Censo and enrollment"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "status"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Modelo 036 censo state."
enum_values = ["alta", "modificacion", "baja"]
model_selectors = ["modelo_036"]
legal_refs = ["orden-eha-1274-2007:art-1", "orden-eha-1274-2007:art-2", "rd-1065-2007:art-10", "rd-1065-2007:art-11", "rd-1065-2007:art-9"]

[[sections.fields]]
key = "large_company"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Large-company condition used by filing cadence. Applies when operation volume, calculated under LIVA Art. 121, exceeded 6.010.121,04 EUR during the immediately prior calendar year; RIVA Art. 71 then switches IVA liquidation to monthly."
model_selectors = ["enrollment.large_company"]
schedule_predicates = ["enrollment.large_company"]
legal_refs = ["ley-37-1992:art-121", "rd-1624-1992:art-71"]

[[sections.fields]]
key = "public_administration_budget_gt_6000000"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Public-administration budget threshold used by Modelo 111 filing cadence. Applies when the last approved annual public-administration budget before the start of the tax year exceeds 6 million EUR; the Modelo 111 official instructions then route the withholding self-assessment to monthly."
model_selectors = ["enrollment.public_administration_budget_gt_6000000"]
schedule_predicates = ["enrollment.public_administration_budget_gt_6000000"]
legal_refs = ["orden-eha-586-2011:art-1", "rd-439-2007:art-108"]

[[sections.fields]]
key = "activity_start_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT censo alta date for the economic activity. Drives obligation start year and pago-fraccionado eligibility."
model_selectors = ["censo.activity_start_date"]
legal_refs = ["rd-1065-2007:art-9"]

[[sections.fields]]
key = "activity_end_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT censo baja date for the economic activity. Caps obligation calendar after baja."
model_selectors = ["censo.activity_end_date"]
legal_refs = ["rd-1065-2007:art-11"]

[[sections.fields]]
key = "establecimiento_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Form of business establishment declared on the 036 censo. Gates deductibility treatment of rent / amortizacion / suministros under LIRPF estimacion directa."
enum_values = ["propio", "arrendado", "cedido_gratuitamente"]
model_selectors = ["censo.establecimiento_type"]
legal_refs = ["ley-35-2006:art-28", "ley-35-2006:art-29", "ley-35-2006:art-30"]

[[sections.fields]]
key = "elected_withholding_pct"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Elected IRPF withholding rate on professional invoices, declared on the 036 censo. 15 percent is the standard; 7 percent is the nuevos-profesionales rate (year of alta plus the two following calendar years); 1 percent is the modulos transport carve-out per the annual Orden de Modulos."
enum_values = ["15", "7", "1"]
model_selectors = ["censo.elected_withholding_pct"]
legal_refs = ["ley-35-2006:art-101", "rd-439-2007:art-95", "orden-hac-1425-2025:art-4"]

[[sections.fields]]
key = "divergencia"
type = "object"
required = false
sensitivity = "identity"
effective_dated = true
description = "Cotejo censal divergence rows: one indexed instance per axis the operator deferred at the setup flow's compare-select reconciliation of the Certificado de Situación Censal (G313). Each instance carries axis (the diverging fact's schema path), artefact_value (the certificate's unadopted value), and source (the non-official artefact provenance token). Workflow evidence of unadopted certificate values, surfaced as a read advisory; not a regulatory value and drives no calculation."

[[sections]]
key = "taxpayer_type"
title = "Taxpayer entity type and income categories"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "entity_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer entity type. natural_person is an IRPF contribuyente; legal_entity is an Impuesto sobre Sociedades contribuyente; attribution_entity is an entity without legal personality under the regimen de atribucion de rentas. The entity type selects the tax and therefore the modelos, calendar, and rate schedule."
enum_values = ["natural_person", "legal_entity", "attribution_entity"]
model_selectors = ["taxpayer.entity_type"]
schedule_predicates = ["taxpayer.entity_type"]
legal_refs = ["ley-35-2006:art-8", "ley-27-2014:art-7", "ley-35-2006:art-86", "ley-35-2006:art-87"]

[[sections.fields]]
key = "legal_entity_form"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Recognised legal form when entity_type is legal_entity. Drives the Impuesto sobre Sociedades rate schedule per LIS Art. 29."
enum_values = ["sl", "sa", "sal", "sll", "cooperativa", "sociedad_civil_mercantil", "sin_fines_lucrativos", "other"]
model_selectors = ["taxpayer.legal_entity_form"]
legal_refs = ["ley-27-2014:art-29", "ley-44-2015:art-1"]

[[sections.fields]]
key = "incn_prior_12_months"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Importe neto de la cifra de negocios (INCN) de los 12 meses anteriores. Determina la modalidad del pago fraccionado del Modelo 202 en el umbral de 6.000.000 EUR (art. 40.3 LIS): por encima es obligatorio el art. 40.3 y por debajo pueden resultar aplicables los arts. 40.2 o 40.3. Si no se declara, Cadrumo solicita completar la información en lugar de elegir una modalidad."
model_selectors = ["taxpayer.incn_prior_12_months"]
legal_refs = ["ley-27-2014:art-40-3"]

[[sections.fields]]
key = "new_entity_first_two_profit_periods"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether a newly-created legal entity is in one of its first two profit-making tax periods. Opts the entity into the LIS Art. 29 15 percent micro-empresa-style rate override. The override is opt-in: an undeclared value leaves the entity on the otherwise-applicable sub-form rate."
model_selectors = ["taxpayer.new_entity_first_two_profit_periods"]
legal_refs = ["ley-27-2014:art-29"]

[[sections.fields]]
key = "ley_49_2002_special_regime_option_declared"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether Modelo 036 casilla 651 declares exercise of the Title II Ley 49/2002 special fiscal regime option. Captures the declaration fact; art. 14 still conditions application on requirements and no renunciation."
model_selectors = ["taxpayer.ley_49_2002_special_regime_option_declared"]
legal_refs = ["ley-49-2002:art-14"]

[[sections.fields]]
key = "ley_49_2002_special_regime_option_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "Date declared in Modelo 036 casilla 653 for exercising the Title II Ley 49/2002 special-regime option."
model_selectors = ["taxpayer.ley_49_2002_special_regime_option_date"]
legal_refs = ["ley-49-2002:art-14"]

[[sections.fields]]
key = "ley_49_2002_special_regime_renunciation_declared"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether Modelo 036 casilla 652 declares renunciation of a previously exercised Title II Ley 49/2002 special-regime option."
model_selectors = ["taxpayer.ley_49_2002_special_regime_renunciation_declared"]
legal_refs = ["ley-49-2002:art-14"]

[[sections.fields]]
key = "ley_49_2002_special_regime_renunciation_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "Date declared in Modelo 036 casilla 654 for the renunciation of the Title II Ley 49/2002 special-regime option."
model_selectors = ["taxpayer.ley_49_2002_special_regime_renunciation_date"]
legal_refs = ["ley-49-2002:art-14"]

[[sections.fields]]
key = "tributacion_estado_porcentaje"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Porcentaje de tributación al Estado para la casilla DP200026:00625 del Modelo 200. Es 100 % para entidades de régimen común; las entidades forales declaran el porcentaje parcial correspondiente. Si no se indica, se aplica 100 %."
model_selectors = ["taxpayer.tributacion_estado_porcentaje"]
legal_refs = ["ley-12-2002:art-15", "ley-28-1990:art-19"]

[[sections.fields]]
key = "sal_socios_trabajadores_count"
type = "integer"
required = false
sensitivity = "identity"
effective_dated = true
description = "Number of worker-shareholders (socios trabajadores) in a Sociedad Laboral (SAL/SLL). Must constitute a majority of the share capital under Ley 44/2015 Art. 1. Used together with sal_reserva_especial_dotada and sal_capital_social to gate the reserva especial dotacion."
model_selectors = ["taxpayer.sal_socios_trabajadores_count"]
legal_refs = ["ley-44-2015:art-1", "ley-44-2015:art-2"]

[[sections.fields]]
key = "sal_reserva_especial_dotada"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Accumulated reserva especial balance already dotada in prior periods (Ley 44/2015 Art. 14). Used to test the strict twice-capital threshold: dotacion = 0 once reserva_dotada reaches at least 2 * capital_social + 0.01."
model_selectors = ["taxpayer.sal_reserva_especial_dotada"]
legal_refs = ["ley-44-2015:art-14"]

[[sections.fields]]
key = "sal_capital_social"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Capital social of the Sociedad Laboral. Basis for the strict twice-capital reserve threshold under Ley 44/2015 Art. 14. Dotacion is capped once accumulated reserva reaches the first euro cent above twice capital social."
model_selectors = ["taxpayer.sal_capital_social"]
legal_refs = ["ley-44-2015:art-14"]

[[sections.fields]]
key = "irpf_income_categories"
type = "string"
required = false
sensitivity = "financial"
effective_dated = true
description = "Categorías de renta IRPF declaradas por la persona: actividad económica, trabajo, capital inmobiliario, capital mobiliario, ganancias patrimoniales o pensión. Solo la actividad económica puede originar pagos fraccionados en los Modelos 130 o 131."
model_selectors = ["taxpayer.irpf_income_categories", "modelo_100"]
schedule_predicates = ["taxpayer.irpf_income_categories"]
legal_refs = ["ley-35-2006:art-17", "ley-35-2006:art-22", "ley-35-2006:art-25", "ley-35-2006:art-27", "ley-35-2006:art-33"]

[[sections.fields]]
key = "declaration_roles"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Papeles institucionales del declarante a efectos del Modelo 347 (claves C, D y E): cobro de honorarios por cuenta de terceros, comunidad de propietarios, entidad de carácter social, entidad sometida al deber general de informar, o entidad integrada en una Administración pública. Eje independiente del tipo de entidad a efectos fiscales."
model_selectors = ["taxpayer.declaration_roles", "modelo_347"]
legal_refs = ["rd-1065-2007:art-31", "ley-58-2003:art-93", "ley-58-2003:art-94"]

[[sections.fields]]
key = "fiscal_residency"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the taxpayer has habitual residence in Spain (resident_irpf, subject to IRPF) or not (non_resident_irnr, subject to IRNR under TRLIRNR). Drives which tax and therefore which calendar/modelos apply."
enum_values = ["resident_irpf", "non_resident_irnr"]
model_selectors = ["taxpayer.fiscal_residency"]
schedule_predicates = ["taxpayer.fiscal_residency"]
legal_refs = ["ley-35-2006:art-9", "trlirnr-rdleg-5-2004:art-2"]

[[sections.fields]]
key = "country_of_fiscal_residence"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
