# THE TWELVE objective_estimation_* FIELDS BELOW MIX TWO SCOPES WHILE LOOKING
# UNIFORM. Do not reshape them as one group.
#
# The four prior_year_* fields are per-TAXPAYER: they carry the exclusion
# limits, which the law computes over the conjunto de actividades, so a single
# flat value is correct for them.
#
# The eight modulos_* fields are per-ACTIVITY. Orden HFP/1359/2023
# (Instrucciones, Rendimiento anual) defines the figure as the sum of the
# rendimientos of each activity, each obtained by running the Fases procedure
# for that activity, and the M036 diseño records several activities with their
# own epígrafes. One flat set can therefore hold one activity's módulos, and a
# taxpayer with two módulos activities cannot be represented here.
#
# That is a modelling gap rather than a live defect today, on this evidence: no
# registry file references these paths or their model selectors, the M131
# módulos casillas carry no binding and are operator input, and the only
# production readers are the setup wizard. That was established by literal
# search, which would not see a consumer that reaches profile facts generically
# without naming a path — so read it as "no declared consumer found", not as a
# proof that none exists. The precondition that keeps it harmless is recorded at
# the M131 divergence-advisory predicate, which is where a change would make it
# matter.

