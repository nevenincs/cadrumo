# ── The sentinel, which codifies no treatment ────────────────────────────────

[[place_of_supply_rules]]
rule_id = "R99_fallthrough"
legal_basis_exempt = true
notes = "Estado de la aplicación «no se pudo clasificar», no un tratamiento tributario. No localiza ninguna operación ni fija naturaleza alguna, de modo que no hay artículo que codificar: exigirle una cita solo fabricaría la apariencia de un fundamento legal. La exención es estrecha y no ampara una regla que sí necesita fundamento y aún no lo tiene."
