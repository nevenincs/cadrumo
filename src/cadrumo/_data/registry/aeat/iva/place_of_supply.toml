# Where an operation is located, and which provision decides it.
#
# One row per classification rule. The rule's PREDICATE stays in Python, because
# a predicate is logic; what lives here is the regulatory content the predicate
# has no business owning: which LIVA provision establishes the placement, and
# whether that provision fixes the nature of the supply.
#
# The goods/services fork is the whole reason this table is separate from the
# per-category regulations beside it. LIVA art. 68 locates ENTREGAS DE BIENES and
# arts. 69 and 70 locate PRESTACIONES DE SERVICIOS, so on a cross-border branch
# the two natures are placed by different articles and can land in different
# treatments. Several rules share one category while resting on different
# provisions, which a per-category table cannot express.
#
# `supply_nature` is omitted, never guessed, on any rule whose provisions do not
# fix it. An omitted value means "this rule's articles are silent on the nature",
# which is a finding about the statute; it does not mean nobody has filled it in.
# Domestic rules omit it because their treatment is settled by the rate tier, and
# demanding the distinction there would refuse invoices for a fact their own
# treatment ignores.

# ── Domestic: located in the TAI, and indifferent to the nature ───────────────
#
# THE FILE CARRIES NO YEAR. Every rule here rests on LIVA articles and nothing
# else; the only year token in the retired year-named file was 1992, the law's
# own identifier. Each grounded rule now declares the closed span it is asserted
# over, bounded by the intersection of its cited provisions' effective spans in
# the registry legal catalogue and checked there. A legal-basis-exempt rule
# declares no window, because a row that grounds nothing is asserted over
# nothing.

[[place_of_supply_rules]]
rule_id = "R01_construction_reverse_charge"
valid_from = 2022-01-01
valid_to = 2026-12-31
legal_references = ["ley-37-1992:art-84"]
establishing_reference = "ley-37-1992:art-84"
notes = "Inversión del sujeto pasivo en ejecuciones de obra. Art. 84 designa al sujeto pasivo; no localiza la operación ni fija la naturaleza de la entrega o prestación."

[[place_of_supply_rules]]
