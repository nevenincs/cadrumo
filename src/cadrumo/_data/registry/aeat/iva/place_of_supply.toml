establishing_reference = "ley-37-1992:art-84"
notes = "Inversión del sujeto pasivo en entregas de desechos y materiales de recuperación. Art. 84 designa al sujeto pasivo y alcanza tanto entregas de bienes como prestaciones de servicios."

[[place_of_supply_rules]]
