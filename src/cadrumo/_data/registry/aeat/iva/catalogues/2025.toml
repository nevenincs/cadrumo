(sujeto-pasivo declaration/registration duties), which says nothing about an unknown or \
unclassified state and only manufactured the appearance of grounding. Whether `unknown` \
belongs in IvaCategory at all is a separate, open, closed-taxonomy design question with \
consumers; this exemption does not resolve it."""
