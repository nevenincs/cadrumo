# Printed country NAMES mapped to the ISO 3166-1 alpha-2 code they name.
#
# WHY THIS TABLE EXISTS. A party's country is one of the two country signals a
# read document carries, and it is the one that prints as a NAME in whatever
# language the issuer writes in: "Alemania", "Deutschland", "Germany". Asking a
# reading model for "DE" is a translation, and translation is inference -- the
# reading contract forbids both in the same breath. Transcribing the printed
# name verbatim and matching it here is a deterministic lookup instead, the same
# shape as matching a transcribed regime mencion against the closed statutory
# vocabulary. The code this yields is then handed to the country resolver, which
# stays the single authority on what scope a code establishes; nothing here
# decides a territorial scope.
#
# ABSENCE NEVER DEFAULTS. A printed name this table does not carry yields
# NOTHING -- never a country, and above all never Spain. The peninsula is the
# majority population, so a domestic default is invisible in testing while
# silently placing foreign parties inside the territorio de aplicacion del
# impuesto. An unmatched name is handed back to the evidence ladder, which
# exhausts to UNKNOWN and asks the operator.
#
# MATCHING IS EXACT, NOT CONTAINMENT. The regime-legend vocabulary matches by
# containment because a mencion is a phrase inside a line of prose. A country is
# a field value, and containment over country names is actively wrong: "Niger"
# is contained in "Nigeria" and "Guinea" in "Papua New Guinea", so a containment
# match would place a party in the wrong tax territory on a correctly printed
# name. Case, surrounding and repeated whitespace, and combining accents are
# normalised away; nothing else is. A near miss is not a match.
#
# WHY ACCENTS ARE FOLDED, AND WHAT MAKES THAT SAFE. Invoicing systems routinely
# print ASCII-only, so "Mexico", "Peru" and "Turkiye" appear beside "México",
# "Perú" and "Türkiye" with their diacritics intact. Folding covers both
# spellings from one entry. The folding is only safe while no two DIFFERENT
# countries fold together, so that is not assumed: the loader refuses this table
# outright if any normalised name appears under two DIFFERENT codes, and a gate
# proves the refusal.
#
# EACH NAME IS SPELLED ONCE, PROPERLY, and the ASCII twin is NOT listed beside
# it. This is not tidiness. A table carrying both "Mexico" and "México" resolves
# both even with the folding removed, so the folding stops being load-bearing
# and a gate over it passes on the data rather than on the behaviour -- which is
# exactly what the first draft of this table did, and what a mutation run
# caught. A gate now refuses any name that another name in the same record folds
# onto, so the redundancy cannot come back and quietly disarm the check.
#
# FOLDING IS NARROW, NOT ASCII-FORCING -- and it is not nothing, either.
# Neither stage is a pure accent strip. `str.casefold` applies Unicode FULL case
# folding, which rewrites the eszett to "ss", the Latin ligatures to their
# letters, and the dotted capital I; and the NFKD decomposition behind the
# accent fold rewrites compatibility forms, turning a roman numeral into plain
# letters and a vulgar fraction into digits.
#
# THE TWO PASSES OVERLAP BUT ARE NOT THE SAME PASS, and one example each way is
# what shows it: the eszett is rewritten by casefold alone, and NFKD leaves it
# untouched; the roman numeral is rewritten by NFKD alone, and casefold only
# lowercases it. A ligature is caught by both, which is why it illustrates
# nothing about the difference. What NEITHER pass does is force ASCII: "ø", "Æ"
# and "ł" pass through whole, and that is the property this vocabulary relies
# on.
#
# The tell is still Austria. Stripping the diaeresis from "Österreich" is what
# the fold does; the convention a German keyboard actually uses is
# "Oesterreich", which no fold produces. Any such convention has to be listed as
# data, which is the second reason the folding is kept narrow rather than being
# taught more tricks.
#
# THE ONE MAPPING THIS TABLE ACTUALLY DEPENDS ON IS GREEK, and it is not an
# expansion at all -- it is the place where casefold and `str.lower` diverge.
# Casefold maps a FINAL sigma to a medial one; lower leaves it as it found it.
# That is load-bearing because the final sigma is in the STORED name: "Κύπρος"
# ends in one, while any capitalised or uppercased spelling an issuer prints
# ends in the medial form. Without the fold the stored key never matches them.
#
# WHICH LANGUAGES, DELIBERATELY THREE.
#   * Spanish, because the reading population is a Spanish taxpayer's documents
#     and a domestic or Hispanophone issuer prints the Spanish name.
#   * The country's own name (every official one, where a country has several),
#     because a German supplier prints "Deutschland" on their own invoice.
#   * English, because it is the working language of cross-border B2B invoicing
#     in the EU: a Dutch or Polish supplier billing a Spanish customer very
#     commonly prints the whole document in English. A vocabulary that silently
#     failed there would fail on a large and entirely ordinary population.
# Nothing further -- and "three" understates what that already covers, which is
# the thing a reader re-opening this question gets wrong first. The endonym axis
# is every official language of every country listed, so French, German and
# Italian are in this table TODAY: "Belgique", "Schweiz", "Svizzera" and
# "Letzebuerg" all resolve. A supplier printing their OWN country in their OWN
# language is already matched, whatever that language is.
#
# WHAT A FOURTH LANGUAGE WOULD ACTUALLY BUY. Only the cross-exonym is left
# uncovered -- "Germania", "Allemagne", "Alemanha" -- and reaching it needs a
# document that names a THIRD country, because the country in an address block
# is a party's own. An Italian invoice naming Germany is a shipping line or a
# place-of-supply note, not the party block this vocabulary is read for.
#
# And the most frequent uncovered name buys nothing at all. "Espagne",
# "Spanien" and "Spagna" would resolve to ES, and the country resolver returns
# NOTHING for ES by design: the code names the State while the IVA territory
# inside it stays undetermined. Coverage and absence give the identical answer
# there. ("Espanha" is listed while those three are not; that asymmetry is an
# oddity of this table rather than a rule, and closing it changes no outcome.)
#
# The cost is not symmetric with that. Exonyms in several more languages would
# more than double this vocabulary and multiply both failure modes it is built
# against -- two names folding together, and one name sitting inside another --
# while the loader refuses the WHOLE table on a single collision. The scarce
# resource here is a reviewer's attention, and that is where it would be spent.
#
# HOW THE THIRD-COUNTRY SIDE WAS BOUNDED, AND WHY IT GREW ONCE. The criteria
# below were declared before this table gated the code axis, and the data never
# matched them: "Latin America" carried eight of nineteen states and "European
# non-EU neighbours" nine of twenty. That is an incompleteness against the
# table's OWN boundary, not a case for moving it -- which is why those two blocs
# were completed and nothing else was. The Maghreb went the same way: Morocco
# was carried on a proximity argument that says nothing about Morocco in
# particular, so carrying one neighbour of three was drafting rather than a
# decision.
#
# WHAT WAS DELIBERATELY NOT DONE IS THE COMPLETE ISO REGISTER. It is tempting
# now, because the code axis costs less per entry than the name axis -- a code
# needs no folding, collides with nothing, and is a lookup rather than a
# judgement. But this is ONE table: every record admitted for its code also
# carries names, and pays the full name-axis cost in reviewer attention and in
# the two collision modes the loader refuses the whole table over. The lower
# per-entry cost is a property of a code-only register that does not exist yet.
# Until it does, the reviewability constraint binds here exactly as it binds the
# exonym axis, and a bulk import would also admit the territory and non-country
# codes enumerated in the exclusions above.
#
# WHICH COUNTRIES. Every EU Member State, because the Member State catalogue is
# what the intra-community branch turns on and a missing State there is a real
# gap. Plus the third countries that realistically appear on a Spanish
# taxpayer's invoices: the European non-EU neighbours, the large trading
# partners, and Latin America. DELIBERATELY EXCLUDED, with the reason:
#   * The remaining sovereign states. This is a reviewable tax-facing
#     vocabulary, not a general i18n country database. An unreviewable table is
#     exactly what putting it in data was meant to avoid, and a country absent
#     here degrades to "not established" -- which is now a visible catalogue-gap
#     report to the operator rather than a silent blank, and still never a wrong
#     answer. Named exclusions, so the boundary is a decision rather than a
#     backlog: Thailand, Vietnam, Malaysia, Indonesia and Taiwan, which are real
#     manufacturing counterparties sitting one tier below the Asian partners
#     already carried; the Gulf states beyond the Emirates; Egypt and Nigeria;
#     and the Vatican, whose sovereignty is not in question and whose invoicing
#     population is. Any of these is a defensible addition the day somebody
#     measures the traffic rather than the plausibility -- which is the standard
#     the entries below were held to and the one this list fails.
#
#   * ANY JURISDICTION WHOSE IVA TREATMENT IS NOT ORDINARY THIRD-COUNTRY
#     TREATMENT, and this is the load-bearing exclusion rather than a footnote.
#     Membership of this table is what makes the country rung FIRE, and the rung
#     has exactly three outcomes: Spain, EU member, third country. There is no
#     fourth, so listing a jurisdiction here ASSERTS that ordinary third-country
#     handling is right for it. Three cases fail that test and are therefore
#     absent by decision, not by oversight:
#       - MONACO. Treated as FRANCE for VAT (Directive 2006/112/EC art. 7.1), so
#         a Monegasque counterparty is an EU-member operation. Listed here it
#         would resolve to a third country, and on the issued side that is
#         export treatment -- exempt, on a supply that is not. It is the same
#         silent under-declaration the country rung was narrowed to close,
#         re-entered through the data instead of the code.
#       - GIBRALTAR. Outside the EU VAT territory, so the third-country answer
#         is arguably right, but it is a territory rather than a state and it
#         levies no VAT at all; it belongs with the territory codes below rather
#         than with the states here.
#       - KOSOVO. Its code is in the ISO user-assigned range, which the resolver
#         treats as denoting no country by construction. Listing it would make
#         one code both catalogued and reserved, and the honest fix is to teach
#         the status axis about codes that are reserved yet real -- not to
#         special-case one row.
#     A gate carries these, plus the territory codes below, as a tripwire: it is
#     trivially green while they are absent and reds the moment a widening
#     admits any of them as a third country.
#
#   * TERRITORY CODES A GENERAL REGISTER CARRIES AND A BULK IMPORT WOULD ADMIT.
#     "IC" and "EA" are exceptionally reserved for the Canary Islands and for
#     Ceuta y Melilla; both are SPANISH, and this axis never returns a Spanish
#     scope from a country code because a code cannot tell the three Spanish
#     territories apart. "EU", "EZ" and "UN" name a union, a currency area and
#     an organisation, and none of them is anywhere a party is established.
#   * SUB-NATIONAL names -- "England", "Scotland", "Northern Ireland",
#     "Catalunya", "Bayern". A sub-national name is not a country name, and
#     Northern Ireland is the case that proves the point: it is a distinct VAT
#     jurisdiction whose goods movements carry the XI prefix, and a Belfast
#     address prints "United Kingdom" regardless. An address name cannot settle
#     that, so no name here maps to XI -- XI is established by a printed
#     NIF-IVA prefix or not at all.
#   * Bare alpha-2 codes. A printed "DE" is the tax-id/prefix evidence and is
#     the country resolver's input already; accepting it here too would put two
#     authorities on the same string.
#
# WHAT THIS TABLE NOW ALSO DOES, AND WHY THAT RAISES THE STAKES ON THE LIST
# ABOVE. This file began as a printed-NAME vocabulary, and the paragraph above
# argues its boundaries on that basis: a country absent from it simply did not
# match a printed name, and the country a document stated as a CODE resolved
# regardless, because the country resolver checked the code's SHAPE. That is no
# longer true. The resolver was narrowed to match the closed vocabulary instead,
# because a shape check resolved any well-formed pair to a third country -- so
# "XX", "ZZ" and "QQ", which ISO reserves to name no country at all, settled a
# party outside the EU and, on the issued side, zero-rated the operation
# silently.
#
# The alpha-2 column of this table is therefore now part of the vocabulary the
# COUNTRY RESOLVER matches against, not only the target of a name lookup. The
# consequence is direct and it is a cost: a real jurisdiction absent from this
# table no longer resolves to a third country from its printed or stated code
# either. It still degrades to "not established" rather than to a wrong answer,
# which is the safe direction and was the point -- but the population paying
# that cost grew from "documents printing an unlisted NAME" to "documents naming
# an unlisted country at all", and this table's own inclusion argument was
# written before that was so.
#
# WHICH AXIS SHOULD ACTUALLY BOUND WHICH. The two questions have different
# authorities and different costs, and the right resolution is to stop answering
# them from one list:
#   * WHICH PRINTED NAMES RESOLVE is a judgement about issuer typography. Every
#     entry costs reviewer attention and carries two real failure modes -- two
#     names folding together, and one name sitting inside another -- and the
#     loader refuses the whole table on a single collision. Curated and narrow is
#     correct here, and the argument above stands unchanged.
#   * WHICH CODES DENOTE A COUNTRY is not a judgement at all. ISO 3166-1 is a
#     closed external register, so membership is a lookup, and an entry costs
#     nothing but the row: no folding, no containment, no collision the code
#     itself does not already resolve. Curating this axis buys no safety and
#     refuses real jurisdictions.
# So the code axis wants a complete assigned-code register of its own -- alpha-2
# beside alpha-3, no names -- with this table left to answer the name question it
# was built for. Both columns must move together whenever that lands: a widened
# alpha-2 axis without the matching alpha-3 correspondence would let a document
# stating "TH" establish what one stating "THA" does not, which is exactly the
# leg asymmetry the narrowing closed. Until it lands, this list bounds both, and
# a country missing from it is a catalogue gap the reader is told about by name
# rather than a silent blank.
#
# GROUNDING NOTE, HONEST. The code axis is ISO 3166-1 alpha-2, and the English
# and endonym names follow its short-name register; the Spanish names follow the
# same register's Spanish forms and ordinary Spanish usage. None of this is tax
# law and no legal_refs are claimed for it -- the tax questions ("is this an EU
# Member State", "what scope does this code establish") are answered elsewhere,
# by the Member State catalogue and the country resolver respectively. This
# table answers only "which country did the issuer print", and it is recorded
# here rather than inlined in code so that it is reviewable in one place.
#
# WHAT IS GROUNDED IN A BUNDLED SOURCE, AND WHAT IS NOT. The alpha-2 code and
# the Spanish name of every entry added when the third-country side was
# completed were checked one by one against AEAT's own "Código ISO / Países y
# Territorios" register, which ships in this repository inside the bundled
# Manual práctico de Sociedades. That is the right authority for a tax-facing
# table: it is what AEAT itself keys country declarations on.
#
# THE ALPHA-2 COLUMN IS NOW CHECKED, NOT ONLY ATTESTED. The hand-check above
# holds until the next author adds a row without repeating it, and nothing would
# notice. So the codes are also verified against a SECOND bundled AEAT
# authority that is machine-readable: the CountryType2 enumeration in AEAT's SII
# record schema, which is the closed set of country codes AEAT accepts on a
# submitted libro de registro. A gate asserts every code here is one that
# enumeration carries. It cannot prove a code names the country written beside
# it -- PY and PE are both accepted, and swapping them would pass -- which is
# exactly what the printed register grounds, so the two checks are complementary
# rather than redundant.
#
# THE ALPHA-3 COLUMN IS GROUNDED IN THE SCHEMA THAT MADE IT NECESSARY. It exists
# for one reason -- a Facturae invoice states the country as a three-letter code
# -- so the authority for it is the Facturae CountryType enumeration, which is
# not merely AN authority for the column but the definition of the question it
# answers. A general ISO register would have answered a broader question the
# column does not ask. The enumeration is extracted from the published Facturae
# 3.2.2 schema and bundled under corpus/facturae/ with a provenance stamp naming
# the source URL, the schema version, the retrieval date and the SHA-256 of the
# payload it came from; a gate asserts every alpha-3 here is a value that
# enumeration carries. What is bundled is the ENUMERATION and not the schema:
# the schema is a 190 KB authored artefact stating no redistribution terms,
# while a list of ISO codes is fact rather than expression.
#
# WHAT THAT PROVES, AND THE RESIDUAL IT LEAVES. It proves every alpha-3 here is
# a code a Facturae document can legitimately state, so a fabricated or mistyped
# value reds. It does NOT prove the code names the country written beside it:
# the enumeration is bare values with no annotations, so PRY and PER are both
# members and swapping them would pass. The correspondence is grounded instead by
# the hand-check against AEAT's printed register, and the two are complementary.
# The residual is therefore precise: a CONSISTENT swap of two real codes between
# two real countries survives every check this repository can make. Closing it
# needs an authority mapping alpha-3 to a country name, which nothing bundled
# here provides -- and saying so is more useful than implying otherwise.
#
# AND THE BUNDLED REGISTER IS NOT INFALLIBLE EITHER. It still spells North
# Macedonia under its pre-2019 name. The current name is carried first and the
# historical one kept beside it, because documents print both -- the corpus was
# read and then judged rather than copied.
#
# THE ALPHA-3 COLUMN, AND WHY IT SITS HERE RATHER THAN IN CODE. A printed
# document states a country as a name; a STRUCTURED one states it as a code, and
# the two syntaxes this reader accepts do not agree on which code system. UBL
# states the alpha-2 form (EN16931 BT-40 / BT-55), and Facturae states the
# alpha-3 form inside its AddressInSpain block -- "ESP" where every country
# surface in this codebase is keyed "ES". Nothing downstream reads alpha-3, so
# an alpha-3 code handed to the country resolver fails its length check and
# yields nothing: the evidence is present, parsed, and silently establishes no
# country. The correspondence closing that is recorded as a COLUMN here, beside
# the alpha-2 code it names, so both code systems and the printed names all
# resolve onto one code in one reviewable place. Written as a literal in the
# feature module that needed it, it would be a third country authority.
#
# EVERY RECORD CARRIES ONE, AND THE LOADER REFUSES A TABLE THAT BREAKS THAT.
# The column is required rather than optional, because an omission is
# indistinguishable at the call site from a country that genuinely has no
# alpha-3 form -- it degrades to "this document states no country", which is the
# exact silent failure the column exists to close. The loader also refuses two
# records claiming one alpha-3 code, and one alpha-2 claiming two alpha-3s, for
# the same reason it refuses a name two countries claim: a code that cannot name
# one country cannot establish one.
#
# NORTHERN IRELAND IS ABSENT HERE TOO, and consistently so. XI is a VAT
# jurisdiction code rather than an ISO country, it has no alpha-3 form to state,
# and no name in this table maps to it -- it is established by a printed NIF-IVA
# prefix or not at all.

# ---------------------------------------------------------------------------
# EU Member States.
# ---------------------------------------------------------------------------

