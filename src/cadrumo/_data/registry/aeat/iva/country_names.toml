# Printed country NAMES mapped to the ISO 3166-1 alpha-2 code they name.
#
# WHY THIS TABLE EXISTS. A party's country is one of the two country signals a
# read document carries, and it is the one that prints as a NAME in whatever
# language the issuer writes in: "Alemania", "Deutschland", "Germany". Asking a
# reading model for "DE" is a translation, and translation is inference -- the
# reading contract forbids both in the same breath. Transcribing the printed
# name verbatim and matching it here is a deterministic lookup instead, the same
# shape as matching a transcribed regime mencion against the closed statutory
# vocabulary. The code this yields is then handed to the country resolver, which
# stays the single authority on what scope a code establishes; nothing here
# decides a territorial scope.
#
# ABSENCE NEVER DEFAULTS. A printed name this table does not carry yields
# NOTHING -- never a country, and above all never Spain. The peninsula is the
# majority population, so a domestic default is invisible in testing while
# silently placing foreign parties inside the territorio de aplicacion del
# impuesto. An unmatched name is handed back to the evidence ladder, which
# exhausts to UNKNOWN and asks the operator.
#
# MATCHING IS EXACT, NOT CONTAINMENT. The regime-legend vocabulary matches by
# containment because a mencion is a phrase inside a line of prose. A country is
# a field value, and containment over country names is actively wrong: "Niger"
# is contained in "Nigeria" and "Guinea" in "Papua New Guinea", so a containment
# match would place a party in the wrong tax territory on a correctly printed
# name. Case, surrounding and repeated whitespace, and combining accents are
# normalised away; nothing else is. A near miss is not a match.
#
# WHY ACCENTS ARE FOLDED, AND WHAT MAKES THAT SAFE. Invoicing systems routinely
# print ASCII-only, so "Mexico", "Peru" and "Turkiye" appear beside "México",
# "Perú" and "Türkiye" with their diacritics intact. Folding covers both
# spellings from one entry. The folding is only safe while no two DIFFERENT
# countries fold together, so that is not assumed: the loader refuses this table
# outright if any normalised name appears under two DIFFERENT codes, and a gate
# proves the refusal.
#
# EACH NAME IS SPELLED ONCE, PROPERLY, and the ASCII twin is NOT listed beside
# it. This is not tidiness. A table carrying both "Mexico" and "México" resolves
# both even with the folding removed, so the folding stops being load-bearing
# and a gate over it passes on the data rather than on the behaviour -- which is
# exactly what the first draft of this table did, and what a mutation run
# caught. A gate now refuses any name that another name in the same record folds
# onto, so the redundancy cannot come back and quietly disarm the check.
#
# FOLDING IS NOT TRANSLITERATION, and the tell is Austria. Stripping the
# diaeresis from "Osterreich" is what the fold does; the convention a German
# keyboard actually uses is "Oesterreich", which no accent rule produces. Any
# such convention has to be listed as data, which is the second reason the
# folding is kept narrow rather than being taught more tricks.
#
# WHICH LANGUAGES, DELIBERATELY THREE.
#   * Spanish, because the reading population is a Spanish taxpayer's documents
#     and a domestic or Hispanophone issuer prints the Spanish name.
#   * The country's own name (every official one, where a country has several),
#     because a German supplier prints "Deutschland" on their own invoice.
#   * English, because it is the working language of cross-border B2B invoicing
#     in the EU: a Dutch or Polish supplier billing a Spanish customer very
#     commonly prints the whole document in English. A vocabulary that silently
#     failed there would fail on a large and entirely ordinary population.
# Nothing further. Adding French, German or Italian exonyms for third countries
# would multiply the table past the point a reviewer can check it, for a
# population that barely exists: an issuer writing in French prints their own
# country's endonym and, for anywhere else, usually English.
#
# WHICH COUNTRIES. Every EU Member State, because the Member State catalogue is
# what the intra-community branch turns on and a missing State there is a real
# gap. Plus the third countries that realistically appear on a Spanish
# taxpayer's invoices: the European non-EU neighbours, the large trading
# partners, and Latin America. DELIBERATELY EXCLUDED, with the reason:
#   * The remaining ~140 sovereign states. This is a reviewable tax-facing
#     vocabulary, not a general i18n country database. An unreviewable table is
#     exactly what putting it in data was meant to avoid, and a country absent
#     here degrades safely to "not established" rather than to a wrong answer.
#   * SUB-NATIONAL names -- "England", "Scotland", "Northern Ireland",
#     "Catalunya", "Bayern". A sub-national name is not a country name, and
#     Northern Ireland is the case that proves the point: it is a distinct VAT
#     jurisdiction whose goods movements carry the XI prefix, and a Belfast
#     address prints "United Kingdom" regardless. An address name cannot settle
#     that, so no name here maps to XI -- XI is established by a printed
#     NIF-IVA prefix or not at all.
#   * Bare alpha-2 codes. A printed "DE" is the tax-id/prefix evidence and is
#     the country resolver's input already; accepting it here too would put two
#     authorities on the same string.
#
# GROUNDING NOTE, HONEST. The code axis is ISO 3166-1 alpha-2, and the English
# and endonym names follow its short-name register; the Spanish names follow the
# same register's Spanish forms and ordinary Spanish usage. None of this is tax
# law and no legal_refs are claimed for it -- the tax questions ("is this an EU
# Member State", "what scope does this code establish") are answered elsewhere,
# by the Member State catalogue and the country resolver respectively. This
# table answers only "which country did the issuer print", and it is recorded
# here rather than inlined in code so that it is reviewable in one place.

# ---------------------------------------------------------------------------
# EU Member States.
# ---------------------------------------------------------------------------

[[country]]
code = "AT"
names = ["Österreich", "Oesterreich", "Austria"]
notes = "The German ASCII convention is 'Oesterreich', which accent folding does not produce, so it is listed as data. The Spanish and English names coincide."

[[country]]
code = "BE"
names = ["België", "Belgique", "Belgien", "Bélgica", "Belgium"]
notes = "Three official languages, all three endonyms printed in practice."

