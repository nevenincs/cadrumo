# Territories whose canonical IVA treatment does not follow from the country code alone.
#
# WHY THIS TABLE EXISTS. The country resolver answers one question -- Spain, EU
# member, or third country -- by asking whether a code names a Member State. That
# works because for almost every country the two coincide. For a short, named
# list it does not: LIVA art. 3 carves territories OUT of the interior del pais
# while they sit inside a Member State, and brings three territories IN while
# they sit outside every Member State. A resolver reading only the Member State
# catalogue gets each of those wrong, and it gets them wrong in the direction
# that costs money.
#
# THE CASE THAT FORCED IT. Monaco lies outside the Union and every general
# country register carries it, so widening the vocabulary from such a register
# would admit MC as an ordinary country -- and, not being a Member State, it
# would resolve to a third country. Art. 3.Tres says operations with Monaco have
# the same consideration as operations with France. On the issued side, third
# country is export treatment: the widening would have exempted a supply that is
# not exempt, silently, which is precisely the failure the country rung was
# narrowed to close. The narrowing fixed the code; without this table the
# obvious fix to the narrowing would have reintroduced it through the data.
#
# THE THREE DISPOSITIONS, AND WHY ASSIMILATION IS A POINTER.
#   * assimilated_to -- the territory is treated as another country is, so the
#     row records WHICH country and never a scope. Art. 3.Tres fixes what each
#     territory is assimilated TO, and says nothing about what that parent
#     establishes. The Isle of Man followed the United Kingdom into and then out
#     of the Community without the article changing a word. A row freezing a
#     scope here would have been right in 2015, wrong from 2021, and would have
#     read as grounded throughout.
#   * scope -- the territory is excluded from the interior del pais by art.
#     3.Dos.1.o, and art. 3.Dos.3.o then defines "territorio tercero" as any
#     territory that is not interior del pais. So the exclusion and the
#     third-territory answer are the same provision read twice, not an inference.
#   * establishes_nothing -- the territory is RECOGNISED and its scope is
#     deliberately not settled from a country code. This is the Spanish case and
#     it is the one place this table refuses to answer on purpose; see below.
#
# WHY CANARIAS AND CEUTA Y MELILLA ESTABLISH NOTHING HERE. Both are excluded by
# art. 3.Dos.1.o and are therefore third territories in the same sense as Aland
# or Livigno, so "third country" would not be a wrong TAX answer. It would be a
# wrong MODEL answer: this codebase carries es_canarias and es_ceuta_melilla as
# their own scopes precisely so a Canarian party is not flattened into the same
# value as a Japanese one, and the sub-national evidence that settles which
# Spanish territory a party is in is the postal code, which the territory table
# already owns. So the rows exist to say the codes are KNOWN, and the scope
# still comes from the postal rung.
#
# That is not a null change. Before these rows, "IC" and "EA" were reported to
# the operator as codes this system does not carry -- a catalogue gap somebody
# should close. They are not a gap; they are a decision. Recording them converts
# a misreport into the honest answer.
#
# WHAT IS DELIBERATELY ABSENT, AND WHY IT IS A REPORT RATHER THAN A ROW.
# Art. 3.Dos.1.o also excludes Helgoland and Busingen, Livigno, Campione
# d'Italia and the Italian waters of Lake Lugano, and Monte Athos; art. 3.Tres
# also assimilates the sovereign base areas of Akrotiri and Dhekelia. None of
# them has an ISO 3166-1 alpha-2 code of its own, so none can be keyed by the
# evidence this table is read with, and inventing a key for them would be
# inventing evidence. They are sub-national territories reachable only by
# sub-national evidence -- the same shape the Spanish postal table solves for
# Canarias and Ceuta -- and closing them needs that evidence for Germany, Italy
# and Greece, not another row here.
#
# GROUNDING NOTE, HONEST. Every row cites the apartado that establishes it and
# both citations resolve to the bundled consolidated Ley 37/1992 at the #a3
# anchor, whose required_text is checked inside that unit rather than anywhere
# in the law. The correspondence from a territory to its alpha-2 code is ISO
# rather than tax law and is not claimed as grounded; what is grounded is the
# treatment, which is the part a filing turns on.
#
# THE CHANNEL ISLANDS AND THE ISLE OF MAN READ ODDLY, AND THE TEXT IS RIGHT.
# The consolidated article still says "en el Reino Unido, las Islas del Canal"
# and still assimilates the Isle of Man to the United Kingdom, because its last
# redaction predates the end of the transition period. Neither is stale in
# effect: the United Kingdom is no longer a Member State, so both now reach the
# third-country answer through their parent rather than through the exclusion,
# which is exactly why assimilation is modelled as a pointer.

[[carve_out]]
code = "MC"
name = "Mónaco"
assimilated_to = "FR"
legal_refs = ["ley-37-1992:art-3.tres"]
notes = "The row this table was built for. Follows France, so it resolves to the EU-member scope for as long as France is a Member State and never because a row said so."

[[carve_out]]
code = "IM"
name = "Isla de Man"
assimilated_to = "GB"
legal_refs = ["ley-37-1992:art-3.tres"]
notes = "Follows the United Kingdom. Inside the Community until 2020 and outside it since, with this row unchanged -- the pointer absorbed Brexit because it never named a scope."

[[carve_out]]
code = "AX"
name = "Islas Aland"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]
notes = "Excluded from turnover-tax harmonisation while Finnish. The one excluded territory outside Spain that carries its own alpha-2 code and can therefore be answered here."

[[carve_out]]
code = "GP"
name = "Guadalupe"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]

[[carve_out]]
code = "MQ"
name = "Martinica"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]

[[carve_out]]
code = "GF"
name = "Guayana Francesa"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]

[[carve_out]]
code = "RE"
name = "Reunión"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]

[[carve_out]]
code = "YT"
name = "Mayotte"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]
notes = "The five French territories above are the ones art. 3.Dos.1.o reaches through TFEU arts. 349 and 355.1; each carries its own alpha-2 code, which is why they are answerable here while Livigno and Busingen are not."

[[carve_out]]
code = "JE"
name = "Jersey"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]

[[carve_out]]
code = "GG"
name = "Guernsey"
scope = "third_country"
legal_refs = ["ley-37-1992:art-3.dos"]
notes = "The Islas del Canal of art. 3.Dos.1.o b). Excluded while the United Kingdom was a Member State and third territories independently of that now, so the answer is the same from either route."

[[carve_out]]
code = "IC"
name = "Canarias"
establishes_nothing = true
legal_refs = ["ley-37-1992:art-3.dos"]
notes = "Recognised, and deliberately unresolved from a country code: the scope is es_canarias and it is settled by the postal rung, which owns the sub-national evidence. Answering third_country here would be defensible as tax and wrong as model."

[[carve_out]]
code = "EA"
name = "Ceuta y Melilla"
establishes_nothing = true
legal_refs = ["ley-37-1992:art-3.dos"]
notes = "One code for the two cities, which is how ISO reserves it and how LIVA treats them; the territory table keeps them as separate postal records because a reader pointing an operator at one must not name the other."
