# NO HAY registro de tipo 0 general desde 2025-01-01, y su ausencia es una
# decision fundamentada, no un olvido. Desde el 1 de enero de 2025 la lista de
# alimentos vuelve al 4 % super-reducido (RDL 4/2024 art. 2, que modifica el
# art. 91.Dos.1.1 LIVA, con la reforma posterior de la Ley 7/2024 DF 1.2), de
# modo que un 0 % general vigente en 2025 no tiene amparo legal.
#
# El unico 0 % domestico indefinido que si existe es el del art. 91.Cuatro LIVA
# (entregas de donativos a entidades de la Ley 49/2002, incorporado por la Ley
# 7/2022 DF 3.2). NO se declara aqui porque el eje plano `kind = "zero"` no puede
# expresar un tipo acotado a donativos: un registro abierto lo aplicaria a
# cualquier entrega domestica. Ademas el dominio de IVA no modela hoy el concepto
# de donativo -- `donativo` no aparece en la ruta de clasificacion -- asi que ese
# supuesto no es alcanzable y no se pierde ningun caso legitimo.
#
# Sin registro, una clasificacion domestic_zero en 2025 NO se rechaza: resuelve
# 0 %, por la misma exencion de RATE_0 descrita arriba. Es la decision correcta
# para el art. 91.Cuatro, que sigue vigente y que esta tabla no puede expresar,
# pero conviene leerla como lo que es -- este fichero no acota el tipo cero por
# fecha, y ninguna comprobacion aguas abajo lo hace en su lugar.

