# El tipo general es del 21 % de forma CONTINUA desde el 1 de septiembre de 2012,
# fecha y cifra que fija RDL 20/2012 art. 23 apartado Dos al dar nueva redaccion
# al art. 90 Uno LIVA. El art. 90 es el articulo marco que aloja el valor; la
# norma modificativa es la que lo establece, y por eso se citan las dos.
#
# EL effective_from ANTERIOR ERA 2024-01-01, Y ESO ERA UNA FRONTERA DE REFRESCO
# LEIDA COMO EFECTO LEGAL. El campo esta definido como "First date the rate
# applies" y todos los consumidores lo comprueban por ventana, de modo que la
# tabla afirmaba que el 21 % empezo en 2024 -- por lo que ninguna linea de 2022
# ni 2023 podia valorarse, pese a que ambos ejercicios estan dentro del plazo de
# prescripcion y el registro declara revisiones anteriores a 2024 en mas de
# treinta modelos. El corte 2024/2025 se conserva: ambos tramos son ciertos y
# contiguos, y borrar una fila no aporta nada.
[[rates]]
member_state = "es"
kind = "general"
pct = "21"
effective_from = 2012-09-01
effective_until = 2024-12-31
legal_refs = ["ley-37-1992:art-90", "real-decreto-ley-20-2012:art-23-dos"]

# El tipo reducido es del 10 % de forma continua desde el 1 de septiembre de 2012,
# que fija RDL 20/2012 art. 23 apartado TRES al dar nueva redaccion al art. 91.
#
# APARTADO TRES, NO DOS. El mismo articulo fija los dos tipos en apartados
# distintos: Dos el general y Tres el reducido. La nota de modificacion del art.
# 90 consolidado cita "art. 23.2", que es correcta para el 21 % y erronea en un
# apartado para este. Citar 23.2 aqui seria fundamentar el valor en la provision
# del tipo de al lado.
#
# LAS FILAS TRANSITORIAS NO CHOCAN con esta ventana ampliada: 5 % y 7,5 % llevan
# supersedes_tier_default, y _assert_no_overlap excluye esas filas justamente
# porque existen para solaparse -- una norma aplico un tipo a parte de los bienes
# del escalon mientras el resto seguia en el ordinario, y ambas son ciertas a la
# vez. Comprobado antes de ampliar, no supuesto.
[[rates]]
member_state = "es"
kind = "reduced"
pct = "10"
effective_from = 2012-09-01
effective_until = 2024-12-31
legal_refs = ["ley-37-1992:art-91", "real-decreto-ley-20-2012:art-23-tres"]

# El tipo super-reducido es del 4 % de forma CONTINUA desde el 1 de enero de 1995,
# fecha y cifra que fija Ley 41/1994 art. 78 apartado Segundo al dar nueva
# redaccion al art. 91 LIVA. El art. 91 es el articulo marco que aloja el valor.
#
# ES ANTERIOR A RDL 20/2012 Y NO PODIA HEREDARLO POR PROXIMIDAD. Las dos entradas
# de 2012 lo dicen en sus propias notas: aquella norma fija el general (Dos) y el
# reducido (Tres), y deja el super-reducido intacto. Por eso esta fila necesitaba
# su propia provision, y hasta ahora no la tenia.
#
# EL effective_from ANTERIOR ERA 2024-01-01, el mismo defecto que ya se corrigio
# en general y reducido: una frontera de refresco leida como efecto legal. Con el
# campo definido como "First date the rate applies" y todos los consumidores
# comprobando por ventana, una linea al 4 % de 2022 o 2023 no se podia valorar
# mientras las de 21 % y 10 % si -- de modo que una factura de tipos mixtos se
# resolvia a medias. Ambos ejercicios estan dentro del plazo de prescripcion.
#
# LA FECHA ES LA DEL TEXTO, NO LA DEL ATRIBUTO. El encabezado del articulo dice
# "Con efectos a partir del dia 1 de enero de 1995"; el atributo fecha_vigencia
# del endpoint consolidado marca 19950120, diecinueve dias mas tarde. Tomar el
# atributo habria fechado mal la ventana.
#
# El corte 2024/2025 se conserva, igual que en general y reducido: ambos tramos
# son ciertos y contiguos, y la fila de 2025 sigue citando solo el articulo marco.
[[rates]]
member_state = "es"
kind = "super_reduced"
pct = "4"
effective_from = 1995-01-01
effective_until = 2024-12-31
legal_refs = ["ley-37-1992:art-91", "ley-41-1994:art-78-segundo"]

# Tipo del 0 % sobre alimentos de primera necesidad, RDL 4/2024 art. 1.Dos.1.
# Es un TIPO IMPOSITIVO, no una exencion: la rubrica del articulo dice "Tipo
# impositivo aplicable temporalmente" y la clausula operativa "se aplicara el
# tipo del 0 por ciento". Una entrega a tipo 0 es sujeta y NO exenta, y deduce
# como una operacion gravada ordinaria (art. 94.Uno.1), que es lo que la separa
# de las exenciones de los arts. 20 y 21-25.
#
# VENTANA. Del 1 de julio al 30 de septiembre de 2024. Desde el 1 de octubre de
# 2024 la lista pasa al 2 % (RDL 4/2024 art. 1.Dos.2), de modo que un 0 % que
# resolviera en el cuarto trimestre seria incorrecto.
#
# ENERO-JUNIO DE 2024 NO ESTA CUBIERTO AQUI, y es deliberado. Esas ventanas las
# fijan RDL 20/2022, RDL 18/2022 y RDL 5/2023, ninguno de los cuales esta en el
# corpus empaquetado -- lo declara la propia entrada legal de RDL 4/2024. Un
# valor cuya provision habilitante no esta en el esquema no puede publicarse, y
# el preambulo del real decreto-ley no sirve de fundamento. Cerrar el hueco es
# trabajo de corpus, no de este fichero.
#
# LA AUSENCIA DE REGISTRO NO PROVOCA RECHAZO PARA EL TIPO CERO. `iva_rate_percentage`
# exime RATE_0 de la comprobacion de vigencia y resuelve 0 en cualquier fecha,
# porque Espana grava al cero por motivos permanentes que este eje plano no puede
# expresar: el silencio de la tabla es cobertura incompleta, no una afirmacion de
# que el tipo cero fuera ilegal ese dia. El mecanismo si sabe rechazar -- RATE_2
# fuera de su ventana lanza IvaRateNotFoundError -- de modo que la exencion es
# especifica del cero y no una comprobacion ausente.
# Ventana anterior de la misma medida sobre alimentos, RDL 20/2022 art. 72, con
# efectos desde el 1 de enero de 2023 y hasta el 30 de junio de 2024. Esa fecha
# de fin es ya la CONSOLIDADA: la vigencia original se prorrogo en tres pasos
# (RDL 1/2023 DA 16, RDL 5/2023 art. 171, RDL 8/2023 art. 20) y el texto
# consolidado recoge el resultado. Abuta con la ventana de RDL 4/2024 que sigue,
# sin solape: 2024-06-30 / 2024-07-01.
[[rates]]
