# AEAT apoderamientos scope catalogue (W75A apoderado-scope-vocabulary).
#
# --scope SCOPE accepts uppercase AEAT apoderamiento
# codes from this shipped catalogue; ALL expands at command time into
# the union of every listed code. Comma-separated values are rejected
# at the parser boundary; --scope must be passed repeatedly.
#
# The catalogue is intentionally bootstrap-scoped. Additional codes
# land per AEAT publication and require a catalogue version bump.

catalogue_version = "2026.05.bootstrap"

