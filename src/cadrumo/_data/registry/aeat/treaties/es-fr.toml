# Convenio doble imposición España — Francia (CDI 1995, en vigor 1997).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Both overrides are typed as ceilings: the
# treaty phrases source-state taxation as a cap ("no podrá exceder del 15 por
# 100" for dividendos, "no puede exceder del 10 por 100" for intereses), so the
# op applies min(domestic, treaty) — the "más favorable" outcome is computed
# rather than assumed. Grounded against the BOE consolidated text BOE-A-1997-12729
# (Convenio firmado en Madrid el 10 de octubre de 1995).

[treaty]
country_code = "FR"
document_id = "BOE-A-1997-12729"
notes = "Convenio España-Francia. Art 10.2.a dividendos: el impuesto en el Estado de la fuente no podrá exceder del 15 por 100 del importe bruto de los dividendos (tipo general; la exención por participación cualificada del art 10.2.b no se modela). Art 11.2 intereses: el impuesto en la fuente no puede exceder del 10 por 100 del importe bruto de los intereses. Art 12.2.a cánones: el impuesto en la fuente no puede exceder del 5 por 100 del importe bruto de los cánones."

[[treaty.overrides]]
tipo_renta = "dividend"
kind = "ceiling"
rate = "0.15"
legal_ref_anchor = "convenio-es-fr-1995:art-10"
legal_refs = ["convenio-es-fr-1995:art-10"]
notes = "Art 10.2.a: el impuesto exigido en el Estado de la fuente no podrá exceder del 15 por 100 del importe bruto de los dividendos. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.15) = 0.15."
valid_from = 2025-01-01

[[treaty.overrides]]
tipo_renta = "interest"
kind = "ceiling"
rate = "0.10"
legal_ref_anchor = "convenio-es-fr-1995:art-11"
legal_refs = ["convenio-es-fr-1995:art-11"]
notes = "Art 11.2: el impuesto exigido en el Estado de la fuente no puede exceder del 10 por 100 del importe bruto de los intereses. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.10) = 0.10."
valid_from = 2025-01-01

[[treaty.overrides]]
tipo_renta = "canones"
kind = "ceiling"
rate = "0.05"
legal_ref_anchor = "convenio-es-fr-1995:art-12"
legal_refs = ["convenio-es-fr-1995:art-12"]
notes = "Art 12.2.a: el impuesto exigido en el Estado de la fuente no puede exceder del 5 por 100 del importe bruto de los cánones. Ceiling frente al 24% doméstico general (TRLIRNR art 25.1.a; cánones sin letra específica); min(0.24, 0.05) = 0.05. La exención de residencia del art 12.2.b para cánones por derechos de autor sobre obra literaria/artística no se modela."
valid_from = 2025-01-01
