# Convenio doble imposición España — Portugal (CDI 1993, en vigor 1995).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Subsequent convenio tranche. Grounded against the BOE consolidated text
# BOE-A-1995-24001 (Convenio firmado en Madrid el 26 de octubre de 1993, en vigor
# 28-06-1995). Both overrides are ceilings: min(domestic, treaty).

[treaty]
country_code = "PT"
document_id = "BOE-A-1995-24001"
notes = "Convenio España-Portugal. Art 10.2.b dividendos: el impuesto en fuente no podrá exceder del 15 por 100 en los demás casos (el 10 por 100 del art 10.2.a por participación >= 25% no se modela). Art 11.2 intereses: el impuesto en fuente no podrá exceder del 15 por 100 del importe bruto de los intereses. Art 12.2 cánones: el impuesto en fuente no podrá exceder del 5 por 100 del importe bruto de los cánones."

[[treaty.overrides]]
tipo_renta = "dividend"
kind = "ceiling"
rate = "0.15"
legal_ref_anchor = "convenio-es-pt-1993:art-10"
legal_refs = ["convenio-es-pt-1993:art-10"]
notes = "Art 10.2.b: el impuesto exigido en el Estado de la fuente no podrá exceder del 15 por 100 del importe bruto de los dividendos en los demás casos. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.15) = 0.15. El 10 por 100 del art 10.2.a (participación >= 25%) no se modela."
valid_from = 1995-06-28

[[treaty.overrides]]
tipo_renta = "interest"
kind = "ceiling"
rate = "0.15"
legal_ref_anchor = "convenio-es-pt-1993:art-11"
legal_refs = ["convenio-es-pt-1993:art-11"]
notes = "Art 11.2: el impuesto exigido en el Estado de la fuente no podrá exceder del 15 por 100 del importe bruto de los intereses. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.15) = 0.15."
valid_from = 1995-06-28

[[treaty.overrides]]
tipo_renta = "canones"
kind = "ceiling"
rate = "0.05"
legal_ref_anchor = "convenio-es-pt-1993:art-12"
legal_refs = ["convenio-es-pt-1993:art-12"]
notes = "Art 12.2: el impuesto exigido en el Estado de la fuente no podrá exceder del 5 por 100 del importe bruto de los cánones. Ceiling frente al 24% doméstico general (TRLIRNR art 25.1.a; cánones sin letra específica); min(0.24, 0.05) = 0.05."
valid_from = 2025-01-01
