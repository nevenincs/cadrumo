# Convenio doble imposición España — Países Bajos (CDI 1971, en vigor 1972).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Subsequent convenio tranche. Grounded against the BOE consolidated text
# BOE-A-1972-1469 (Convenio hecho en Madrid el 16 de junio de 1971, en vigor
# 20-09-1972). Both overrides are ceilings: min(domestic, treaty).

[treaty]
country_code = "NL"
document_id = "BOE-A-1972-1469"
notes = "Convenio España-Países Bajos. Art 10.2 dividendos: fuente máx 15% (tipos reducidos del art 10.3 no modelados). Art 11.2 intereses: fuente máx 10%. Art 12.2 cánones: fuente máx 6% (tipo permanente; el 5% de la cláusula XIV del Protocolo fue transitorio 1972-1977 y ha expirado)."

[[treaty.overrides]]
tipo_renta = "dividend"
kind = "ceiling"
rate = "0.15"
legal_ref_anchor = "convenio-es-nl-1971:art-10"
legal_refs = ["convenio-es-nl-1971:art-10"]
notes = "Art 10.2: el impuesto exigido en el Estado de la fuente no puede exceder del 15 por 100 del importe bruto de los dividendos. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.15) = 0.15. Los tipos reducidos del art 10.3 (participación cualificada) no se modelan."
valid_from = 1972-09-20

[[treaty.overrides]]
tipo_renta = "interest"
kind = "ceiling"
rate = "0.10"
legal_ref_anchor = "convenio-es-nl-1971:art-11"
legal_refs = ["convenio-es-nl-1971:art-11"]
notes = "Art 11.2: el impuesto exigido en el Estado de la fuente no puede exceder del 10 por 100 del importe de los intereses. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.10) = 0.10."
valid_from = 1972-09-20

[[treaty.overrides]]
tipo_renta = "canones"
kind = "ceiling"
rate = "0.06"
legal_ref_anchor = "convenio-es-nl-1971:art-12"
legal_refs = ["convenio-es-nl-1971:art-12"]
notes = "Art 12.2: el impuesto exigido en el Estado de la fuente no puede exceder del 6 por 100 del importe bruto de los cánones (tipo permanente). Ceiling frente al 24% doméstico general (TRLIRNR art 25.1.a; cánones sin letra específica); min(0.24, 0.06) = 0.06. El 5 por 100 de la cláusula XIV del Protocolo fue una regla transitoria (1972-1977), ya expirada; no se modela."
valid_from = 2025-01-01
