# Convenio doble imposición España — Marruecos (CDI 1978).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Migrated from m210-convenio-rates (MA/interest) and typed as a ceiling: the
# treaty phrases source-state taxation as a cap ("no puede exceder del 10 por
# 100"), so the op applies min(domestic, treaty) — the "más favorable" outcome is
# computed rather than assumed. The result is identical today (10% < 19%).

[treaty]
country_code = "MA"
document_id = "BOE-A-1985-9280"
notes = "Convenio España-Marruecos. Art 11 intereses: el impuesto en el Estado de la fuente no puede exceder del 10% del importe bruto."

[[treaty.overrides]]
tipo_renta = "interest"
kind = "ceiling"
rate = "0.10"
legal_ref_anchor = "convenio-es-ma-1978:art-11"
legal_refs = ["convenio-es-ma-1978:art-11"]
notes = "Art 11: el impuesto exigido en el Estado de la fuente no puede exceder del 10 por 100 del importe bruto de los intereses. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f)."
valid_from = 2025-01-01
