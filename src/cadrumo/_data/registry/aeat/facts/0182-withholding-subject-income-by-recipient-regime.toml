# Whether a payment of one income kind bears a retención, by the income tax its
# recipient answers to. Each subject row names its provisions in the cite row of
# the same key.
#
# An IRPF recipient's work income, activity income, urban rent and movable
# capital income bear retención when a retenedor pays them: LIRPF art. 99 obliges
# the payer and art. 101 sets the amount, RIRPF art. 75 lists the income subject
# to it and art. 76 names who must withhold.
#
# An IS recipient's income bears retención only where RIS art. 60.1 lists it:
# movable capital income (letter a), urban rent (letter e) and transmissions of
# collective investment holdings (letter f), with the obligation arising at
# exigibility or earlier payment (art. 65). An activity's professional fee is
# not in that list, and an entity earns no rendimientos del trabajo, so a
# retención stated on either is not one the payer owes or may declare.
[fact]
fact_id = "withholding-subject-income-by-recipient-regime"
family = "mapping"

