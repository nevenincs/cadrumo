[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "attribution_pass_through.reason", value = "Una entidad en régimen de atribución de rentas (comunidad de bienes, sociedad civil sin objeto mercantil) no presenta autoliquidación de cuota propia: no tributa por el Impuesto sobre Sociedades ni por el IRPF. La renta se atribuye a cada socio, comunero o partícipe y tributa en la declaración de cada miembro. La obligación propia de la entidad es informativa (Modelo 184)." },
  { key = "impatriado_m720_exempt.reason", value = "Modelo 720 no aplica: el contribuyente tiene activado el régimen especial para trabajadores desplazados a territorio español (LIRPF Art. 93). En este régimen el contribuyente tributa conforme al IRNR y no tiene la consideración de contribuyente residente del IRPF a efectos de la obligación de declarar bienes y derechos en el extranjero. La obligación del Modelo 720 corresponde exclusivamente a los residentes fiscales contribuyentes del IRPF (DA 18ª Ley 58/2003 LGT introducida por la Ley 7/2012 DA 1ª)." },
]
