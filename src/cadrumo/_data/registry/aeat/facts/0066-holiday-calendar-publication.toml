# Annual publication of the días inhábiles calendar that fixes filing-deadline
# extensions (Ley 39/2015 art. 30.5 and 30.6). Each year cites the Secretaría de
# Estado de Función Pública resolution for the Administración General del Estado,
# the calendar that governs AEAT procedures.
#
# verified_territories lists every calendar territory whose complete list of
# territory-wide non-working weekdays for the year is authored in fact
# deadlines.public-holiday from the same resolution. Days the resolution lists
# for a territory but that its own notes make non-uniform inside it are left out
# of that territory; the reasons are recorded in 0067-public-holiday.toml.

