[fact]
fact_id = "form-row-codes"
family = "mapping"

[[fact.variants]]
variant_id = "form-row-codes:design"
date_axis = "filing_period"
legal_refs = ["ley-37-1992:art-164"]
source_refs = ["aeat-dr-100-2025-xsd", "boe-modelo-037-historical-suppression", "aeat-dr-720", "aeat-dr-130-2019-v12", "aeat-dr-200-2025", "aeat-dr-232-2018", "enrolled-modelo-156-layout", "aeat-dr-347-2025", "boe-orden-hfp-1335-2021-iva-authority", "aeat-dr-303-2026", "aeat-dr-222-2025", "aeat-dr-353-2026", "aeat-dr-296-2024", "aeat-dr-360-2010", "aeat-dr-280-2022", "aeat-dr-165-2016-2022", "aeat-dr-190-2020"]
review_status = "agent_reviewed"
ownership = "authored"

# "En el caso de no residentes sin establecimiento permanente se consignara 99."
[[fact.variants.source_citations]]
source_ref = "aeat-dr-347-2025"
required_text = ["no residentes sin establecimiento permanente"]

# The two activities the Orden's special corrector indices name, and the Lorca reduction:
# "podran reducir en un 20 por ciento el importe de las cuotas devengadas".
[[fact.variants.source_citations]]
source_ref = "boe-orden-hfp-1335-2021-iva-authority"
required_text = ["Transporte por autotaxis", "Transporte de mercancías por carretera", "20 por ciento", "siempre que el total no exceda de 180"]

# The Aux/Idioma pattern every Modelo 100 schema gives the declaration's language.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-100-2025-xsd"
required_text = ["(E|G|C|V){1}", "E5AI8"]

# The surnames-and-name type of a Modelo 100 child or ascendant row (Hijo/APENOMDLG,
# Ascendiente/APENOMDLG_ASC): "tipo_ApeNom", a string of at most 80 characters.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-100-2025-xsd"
required_text = ['<xs:element name="APENOMDLG" type="tipo_ApeNom" minOccurs="1" maxOccurs="1"/>', '<xs:simpleType name="tipo_ApeNom">', '<xs:maxLength value="80"/>']

# The Modelo 720 position-102 clave and the five letters its row lists.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-720"
required_text = ["CLAVE TIPO DE BIEN O DERECHO", "“C”: Cuentas", "“V”: Valores", "“I”: Acciones", "“S”: Seguros", "“B”: Titularidad", "clave “ZXX”"]

# The census form the Orden suppressed; no filing can belong to it, so it is not a role of a current form.
[[fact.variants.source_citations]]
source_ref = "boe-modelo-037-historical-suppression"
required_text = ["037"]

# Tipo de declaración: the union of the codes the designs of Modelos 303, 130 and 200 print.
# These two designs are binary workbooks, read as bytes, so a citation stops before an accent.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-130-2019-v12"
required_text = ["U (domiciliaci", "N (negativa) y B (resultado al deducir)"]

[[fact.variants.source_citations]]
source_ref = "aeat-dr-200-2025"
required_text = ["R (Renuncia a la devoluci", "X (Devoluci", "transferencia al extranjero"]

# Page 2 occurrences and pages, the Mesas rows, and the five prorrata rows. The row counts of
# the three repeating 303 blocks are also pinned to each edition's own declarations by a test.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-303-2026"
required_text = ["Tipo de prorrata [503]", "\"G\", \"E\" o blanco", "C (solicitud de compensación) D (devolución)", "El número máximo de ocurrencias de la página 2 del modelo es 6", "el número máximo de páginas 2 será 3", "Módulo Mesas", "Prorratas - 5 - Código CNAE", "Versión del Programa (Nota 1)", "NIF Empresa Desarrollo (Nota 1)"]

# Tablas A, B and C of the Modelo 232 record design, its declaration's amendment marker
# and its complementary page's indicator.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-232-2018"
required_text = ["S, C o blanco", "Indicador de página complementaria", "C o blanco", "TABLA DE TIPOS DE VINCULACIÓN", "TABLA DE METODOS DE VALORACIÓN", "Clave 11: Otras operaciones"]

# The affiliate record's name (positions 36-75) and membership number (positions 76-87).
[[fact.variants.source_citations]]
source_ref = "enrolled-modelo-156-layout"
required_text = ["APELLIDOS Y NOMBRE DEL AFILIADO O MUTUALISTA", "NÚMERO DE AFILIACIÓN"]

# The Modelo 222 group number (positions 92-98) and the dominant entity's country (136-137).
[[fact.variants.source_citations]]
source_ref = "aeat-dr-222-2025"
required_text = ["Número de grupo", "Pais / territorio foral de la Entidad Dominante"]

# The Modelo 353 group number (positions 109-118).
[[fact.variants.source_citations]]
source_ref = "aeat-dr-353-2026"
required_text = ["Identificación. Nº Grupo"]

# The Modelo 296 declarant record: telefono at positions 59-67, total perceptores at 136-144.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-296-2024"
required_text = ["59-67 TELÉFONO", "136-144 Numérico NÚMERO TOTAL DE PERCEPTORES"]

# Modelo 360 pagina 1, each field's start and length in the design's own table.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-360-2010"
required_text = ["10 27 16 An", "13 69 125 An", "14 194 100 An", "15 294 15 An", "16 309 5 An", "17 314 50 An", "18 364 3 An", "19 367 5 Num", "26 390 40 An", "27 430 30 An", "28 460 5 Num", "30 495 2 An", "31 497 148 An", "32 645 30 An", "33 675 10 An", "34 685 30 An", "36 717 10 Num"]

# The Modelo 347 premises record: referencia catastral at positions 116-140.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-347-2025"
required_text = ["116-140 Alfanumérico REFERENCIA CATASTRAL"]

# The Modelo 303 envelope closer: 18 bytes "</T3030AAAAPP0000>", whose PP is the period's two characters.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-303-2026"
required_text = ["Constante. </T+ modelo+discriminante+Ejercicio+periodo+Tipo+>", "</T3030AAAAPP0000>"]

# Signed amounts split across adjacent fields: Modelo 280 sign at 176 and integer part at 177-184,
# Modelo 165 sign at 168 before a 13-digit integer part, Modelo 190 sign before 13 positions.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-280-2022"
required_text = ["176. SIGNO", "177-184 Numérico ENTERO"]

[[fact.variants.source_citations]]
source_ref = "aeat-dr-165-2016-2022"
required_text = ["168 SIGNO"]

[[fact.variants.source_citations]]
source_ref = "aeat-dr-190-2020"
required_text = ["Campo numérico de 13 posiciones"]

