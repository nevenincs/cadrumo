# The manual affirmatively sets the correction procedure and its first monthly
# and quarterly periods; the record designs below corroborate its fields.
[[fact.variants.source_citations]]
source_ref = "aeat-manual-iva-2025"
required_text = [
  "introduce la autoliquidación rectificativa como la vía general para rectificar, completar o modificar la autoliquidación presentada con anterioridad",
  "autoliquidaciones de septiembre de 2024 y siguientes",
  "autoliquidaciones del tercer trimestre de 2024 y siguientes",
]

[[fact.variants.source_citations]]
source_ref = "aeat-dr-303-2024-late"
required_text = [
  "Motivo de la rectificación: Rectificaciones",
  "Motivo de la rectificación: Discrepancia criterio administrativo",
]

# The 303 designs establish motive fields, not the legal procedure boundary.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-303-2025"
required_text = [
  "Motivo de la rectificación: Rectificaciones",
  "Motivo de la rectificación: Discrepancia criterio administrativo",
]

# carries the same two motive flags as 2025, confirming the post-boundary regime persists; not evidence for any boundary DATE.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-303-2026"
required_text = [
  "Motivo de la rectificación: Rectificaciones",
  "Motivo de la rectificación: Discrepancia criterio administrativo",
]

# The 2025 manual expressly applies the general rectificativa procedure to
# tax periods 2024 onward; earlier periods retain the previous system.
[[fact.variants.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = [
  "la autoliquidación rectificativa",
  "declaración complementaria, o rectificativa, según corresponda",
  "la aplicación efectiva de la autoliquidación rectificativa como sistema único para la corrección de autoliquidaciones",
  "procedimiento general de modificación de declaraciones de IRPF correspondientes a los períodos impositivos 2024 y siguientes",
]

# ASCII-only span: this .xls source loses every accented character to replacement chars, so an accented quote cannot match. Grounds that 2024's 200 design carries rectificativa casillas; nothing about complementaria/sustitutiva ordering.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-200-2024"
required_text = [
  "rectificativa que no deban incluirse en otras casillas - total [00031]",
]

# The Sociedades manual grounds the procedure, independently of layout fields,
# for tax periods beginning on or after 2024-01-01.
[[fact.variants.source_citations]]
source_ref = "aeat-modelo-200-manual-2024"
required_text = [
  "la aplicación efectiva de la autoliquidación rectificativa como mecanismo de corrección de autoliquidaciones en sustitución del actual sistema de autoliquidación complementaria y solicitud de rectificación",
  "Con efectos para los períodos impositivos que se inicien a partir de 1 de enero de 2024",
  "mediante la presentación de una autoliquidación rectificativa, con independencia del resultado de la misma",
]

# Orden HAC/610/2021 art. 7.5: a filed Modelo 369 is never amended; its adjustment belongs to a later period's return.
[[fact.variants.source_citations]]
source_ref = "boe-modelo-369-2021-form"
required_text = [
  "la misma no podrá modificarse",
]

# Instructions (7): increases use complementaria; other corrections require a
# separate solicitud de rectificacion. The designs close the filing marker to
# blank (original) or X (complementaria), from the 2019 editions onward.
[[fact.variants.source_citations]]
source_ref = "aeat-modelo-130-instructions"
required_text = [
  "de la autoliquidación complementaria deberá resultar un importe a ingresar superior al de la autoliquidación anterior",
  "La rectificación por cualquier otra causa de autoliquidaciones presentadas anteriormente no dará lugar a la presentación de autoliquidaciones complementarias",
]

[[fact.variants.source_citations]]
source_ref = "aeat-modelo-131-instructions"
required_text = [
  "de la autoliquidación complementaria deberá resultar un importe a ingresar superior al de la autoliquidación anterior",
  "La rectificación por cualquier otra causa de autoliquidaciones presentadas anteriormente no dará lugar a la presentación de autoliquidaciones complementarias",
]

