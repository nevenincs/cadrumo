[[fact.variants.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = [
  "la autoliquidación rectificativa",
  "declaración complementaria, o rectificativa, según corresponda",
]

# ASCII-only span: this .xls source loses every accented character to replacement chars, so an accented quote cannot match. Grounds that 2024's 200 design carries rectificativa casillas; nothing about complementaria/sustitutiva ordering.
[[fact.variants.source_citations]]
source_ref = "aeat-dr-200-2024"
required_text = [
  "rectificativa que no deban incluirse en otras casillas - total [00031]",
]

# the one source that grounds regime.pre_order -> regime.post_order as a SUBSTITUTION, and ties it to periods from 2024-01-01 via Orden HAC/657/2025.
[[fact.variants.source_citations]]
source_ref = "aeat-modelo-200-manual-2024"
required_text = [
  "la aplicación efectiva de la autoliquidación rectificativa como mecanismo de corrección de autoliquidaciones en sustitución del actual sistema de autoliquidación complementaria y solicitud de rectificación",
]

