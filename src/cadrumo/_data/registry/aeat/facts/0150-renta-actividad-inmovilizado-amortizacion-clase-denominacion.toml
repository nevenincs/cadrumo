# Official names of the amortization table classes of the activity-asset register,
# keyed "<regime>.<class key>" with the class keys of the coefficient and period
# parameters of the same regime. The "normal" names are the rows of the table of
# LIS art. 12.1.a, which RIRPF art. 28 applies to the normal modality; the
# "simplificada" names are the group descriptions of the simplified table that
# the Orden de 27 de marzo de 1998 approves under RIRPF art. 30.1.a, which the
# AEAT Renta manual reproduces. A name is the text of its row without a closing
# full stop, so it is an official legal name and is not translated.
