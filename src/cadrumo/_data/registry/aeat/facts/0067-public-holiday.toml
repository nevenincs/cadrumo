# Días inhábiles for filing-deadline purposes, one event per date and scope.
#
# Dates come from the ANEXO of each year's Secretaría de Estado de Función Pública
# resolution (BOE-A-2023-23637 for 2024, BOE-A-2024-26935 for 2025,
# BOE-A-2025-23702 for 2026); each variant quotes the anexo line for its date.
# Names come from the Dirección General de Trabajo relación de fiestas laborales
# for the same year (BOE-A-2023-22014, BOE-A-2024-21316, BOE-A-2025-21667),
# because the días inhábiles anexo lists dates only.
#
# National: every weekday the anexo declares inhábil in todo el territorio
# nacional, plus each national fiesta laboral that falls on a weekend, so a
# shift reason still names it.
#
# Regional: for each of the nineteen calendar territories, only the days that are
# non-working throughout the territory. Sub-territorial days are never authored
# as regional days:
# - Canarias: the island fiestas quoted in note 1 of every anexo (El Hierro,
#   Fuerteventura, Gran Canaria, La Gomera, La Palma, Lanzarote y La Graciosa,
#   Tenerife) apply to one island each, not to ES-CN.
# - Cataluña: note 2 of every anexo substitutes 26 December (San Esteban) with
#   17 June (Fiesta de Arán) in the territorio de Arán. 26 December is therefore
#   not non-working throughout ES-CT and is left out of ES-CT in 2024 and 2025,
#   where the anexo lists it; the Arán day is left out too. In 2026 it falls on a
#   Saturday and the anexo does not list it.
# The recuperable character of one Catalan fiesta (note 2) and of 24 June in the
# Comunitat Valenciana (note 3) changes how the working time is recovered, not
# whether the day is inhábil, so those days remain authored.

[fact]
fact_id = "deadlines.public-holiday"
family = "event"

[[fact.variants]]
