  { key = "row.intra_community_acquisition_reverse_charge|received", value = "{\"label\":\"intra_community_acquisition_reverse_charge / received\",\"category\":\"intra_community_acquisition_reverse_charge\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"inversion_sujeto_pasivo\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"optional\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-13\",\"ley-37-1992:art-15\",\"ley-37-1992:art-84\",\"ley-37-1992:art-158\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.import_third_country|issued", value = "{\"label\":\"import_third_country / issued\",\"category\":\"import_third_country\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 17 defines an importación — goods entering the Community, which the taxpayer RECEIVES. The issued-side counterparts are 'export_third_country_zero_rated' and 'export_assimilated_zero_rated', which carry their own rows.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.import_third_country|received", value = "{\"label\":\"import_third_country / received\",\"category\":\"import_third_country\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"aduana\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"optional\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-17\",\"ley-37-1992:art-158\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.recargo_equivalencia|issued", value = "{\"label\":\"recargo_equivalencia / issued\",\"category\":\"recargo_equivalencia\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 154 applies the régimen del recargo de equivalencia to entregas made TO a comerciante minorista, so this category describes what the taxpayer receives. Supplier-side recargo charged on a taxable output sale is recorded through the invoice's recargo amount, not by tagging the sale with this category.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.recargo_equivalencia|received", value = "{\"label\":\"recargo_equivalencia / received\",\"category\":\"recargo_equivalencia\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"repercutida\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"required\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"reasoned\",\"retencion_note\":\"Reasoned, not measured: the régimen del recargo de equivalencia applies to entregas de bienes to comerciantes minoristas (LIVA art. 154), while RIRPF art. 95.1 scopes retención to the contraprestación of an actividad profesional. The inference that a goods purchase under this regime bears no retención follows from those two scopes; no bundled provision states it directly.\",\"legal_refs\":[\"ley-37-1992:art-154\",\"ley-37-1992:art-158\",\"ley-37-1992:art-161\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.regimen_simplificado|issued", value = "{\"label\":\"regimen_simplificado / issued\",\"category\":\"regimen_simplificado\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_credit\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"regimen_especial\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and the gap is in the SCOPE rather than in the rate. RIRPF art. 95.6.1.º sets the retención on a rendimiento whose actividad económica determines its rendimiento neto by estimación objetiva at 1 % of the ingresos íntegros satisfechos, and the bundled excerpt carries it. What the excerpt truncates is art. 95.6.2.º, the list of activities the apartado reaches, so whether a given taxpayer's activity is one of them cannot be settled from the bundled text. Two further reasons keep this POSSIBLE rather than expected: the IVA régimen simplificado and the IRPF estimación objetiva are regimes of different taxes whose populations merely tend to coincide, so this category does not establish the IRPF method at all; and an agrícola, ganadera or forestal activity is reached by apartados 4 and 5 at their own rates instead.\",\"legal_refs\":[\"ley-37-1992:art-122\",\"ley-37-1992:art-123\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.regimen_simplificado|received", value = "{\"label\":\"regimen_simplificado / received\",\"category\":\"regimen_simplificado\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"regimen_especial\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Whether a RECEIVED invoice legitimately carries this category is itself unsettled -- the régimen simplificado (LIVA arts. 122/123) describes the taxpayer's own OUTPUT regime -- and the pair is declared to arise because refusing a real operation is worse than carrying an unused row. That uncertainty is about the row, not about the retención: where one arises the taxpayer is the retenedor, and it is grounded exactly as on the issued side. Possible rather than expected, and the gap is in the SCOPE rather than in the rate. RIRPF art. 95.6.1.º sets the retención on a rendimiento whose actividad económica determines its rendimiento neto by estimación objetiva at 1 % of the ingresos íntegros satisfechos, and the bundled excerpt carries it. What the excerpt truncates is art. 95.6.2.º, the list of activities the apartado reaches, so whether a given taxpayer's activity is one of them cannot be settled from the bundled text. Two further reasons keep this POSSIBLE rather than expected: the IVA régimen simplificado and the IRPF estimación objetiva are regimes of different taxes whose populations merely tend to coincide, so this category does not establish the IRPF method at all; and an agrícola, ganadera or forestal activity is reached by apartados 4 and 5 at their own rates instead.\",\"legal_refs\":[\"ley-37-1992:art-122\",\"ley-37-1992:art-123\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.reagp_compensation|issued", value = "{\"label\":\"reagp_compensation / issued\",\"category\":\"reagp_compensation\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_credit\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and grounded on both sides. RIRPF art. 95.4 sets the retención on the contraprestación of an actividad agrícola o ganadera at 1 % for engorde de porcino y avicultura and 2 % otherwise, over the ingresos íntegros satisfechos, and scopes itself to activities obtaining productos naturales directly from the explotación without transformation -- the same population LIVA art. 130.Tres describes. It stays POSSIBLE because the payer must also be an obliged retenedor (LIRPF art. 99), which the IVA category does not carry, and because a REAGP operation may instead be a servicio accesorio the apartado does not reach.\",\"legal_refs\":[\"ley-37-1992:art-130\",\"ley-37-1992:art-131\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.reagp_compensation|received", value = "{\"label\":\"reagp_compensation / received\",\"category\":\"reagp_compensation\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and grounded on both sides. RIRPF art. 95.4 sets the retención on the contraprestación of an actividad agrícola o ganadera at 1 % for engorde de porcino y avicultura and 2 % otherwise, over the ingresos íntegros satisfechos, and scopes itself to activities obtaining productos naturales directly from the explotación without transformation -- the same population LIVA art. 130.Tres describes. It stays POSSIBLE because the payer must also be an obliged retenedor (LIRPF art. 99), which the IVA category does not carry, and because a REAGP operation may instead be a servicio accesorio the apartado does not reach.\",\"legal_refs\":[\"ley-37-1992:art-130\",\"ley-37-1992:art-131\",\"ley-37-1992:art-134\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.erroneous_invoice|issued", value = "{\"label\":\"erroneous_invoice / issued\",\"category\":\"erroneous_invoice\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: the operator has flagged the invoice as erroneous, so no component expectation can be asserted. Declared unknown rather than guessed.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.erroneous_invoice|received", value = "{\"label\":\"erroneous_invoice / received\",\"category\":\"erroneous_invoice\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: the operator has flagged the invoice as erroneous, so no component expectation can be asserted. Declared unknown rather than guessed.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.unknown|issued", value = "{\"label\":\"unknown / issued\",\"category\":\"unknown\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: no IVA treatment declared, so untagged and exempt are indistinguishable from the amounts alone. This is exactly the ambiguity that makes a row ungrounded rather than exempt.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.unknown|received", value = "{\"label\":\"unknown / received\",\"category\":\"unknown\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: no IVA treatment declared, so untagged and exempt are indistinguishable from the amounts alone. This is exactly the ambiguity that makes a row ungrounded rather than exempt.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
