  { key = "row.operacion_no_sujeta|received", value = "{\"label\":\"operacion_no_sujeta / received\",\"category\":\"operacion_no_sujeta\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected because whether a retención arises depends on facts the IVA category does not carry: the rendimiento must be the contraprestación of an actividad profesional (RIRPF art. 95.1) and the payer must be an obliged retenedor (LIRPF art. 99).\",\"legal_refs\":[\"ley-37-1992:art-7\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_supply|issued", value = "{\"label\":\"intra_community_supply / issued\",\"category\":\"intra_community_supply\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"The payer is non-resident by construction for this category, and RIRPF art. 76.1 places a non-resident payer without a Spanish permanent establishment outside the withholding obligation except for rendimientos del trabajo and rendimientos that are a deducible gasto for IRNR art. 24.2 rentas (art. 76.1.d). A payer WITH a Spanish permanent establishment IS obliged (art. 76.1.c), so this expectation is a default and not a prohibition: a counterparty falling in either carve-out bears a real retención and the row is wrong for that counterparty.\",\"legal_refs\":[\"ley-37-1992:art-25\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_supply|received", value = "{\"label\":\"intra_community_supply / received\",\"category\":\"intra_community_supply\",\"kind\":\"received\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 25 exempts an entrega intracomunitaria — a supply the taxpayer makes. The received-side counterpart of an intra-community movement is 'intra_community_acquisition_reverse_charge', which carries its own row.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.export_third_country_zero_rated|issued", value = "{\"label\":\"export_third_country_zero_rated / issued\",\"category\":\"export_third_country_zero_rated\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"The payer is non-resident by construction for this category, and RIRPF art. 76.1 places a non-resident payer without a Spanish permanent establishment outside the withholding obligation except for rendimientos del trabajo and rendimientos that are a deducible gasto for IRNR art. 24.2 rentas (art. 76.1.d). A payer WITH a Spanish permanent establishment IS obliged (art. 76.1.c), so this expectation is a default and not a prohibition: a counterparty falling in either carve-out bears a real retención and the row is wrong for that counterparty.\",\"legal_refs\":[\"ley-37-1992:art-21\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.export_third_country_zero_rated|received", value = "{\"label\":\"export_third_country_zero_rated / received\",\"category\":\"export_third_country_zero_rated\",\"kind\":\"received\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 21 exempts an exportación — goods the taxpayer sends out of the Community. The received-side counterpart is 'import_third_country', which carries its own row.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.export_assimilated_zero_rated|issued", value = "{\"label\":\"export_assimilated_zero_rated / issued\",\"category\":\"export_assimilated_zero_rated\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"The payer is non-resident by construction for this category, and RIRPF art. 76.1 places a non-resident payer without a Spanish permanent establishment outside the withholding obligation except for rendimientos del trabajo and rendimientos that are a deducible gasto for IRNR art. 24.2 rentas (art. 76.1.d). A payer WITH a Spanish permanent establishment IS obliged (art. 76.1.c), so this expectation is a default and not a prohibition: a counterparty falling in either carve-out bears a real retención and the row is wrong for that counterparty.\",\"legal_refs\":[\"ley-37-1992:art-22\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.export_assimilated_zero_rated|received", value = "{\"label\":\"export_assimilated_zero_rated / received\",\"category\":\"export_assimilated_zero_rated\",\"kind\":\"received\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 22 exempts operaciones asimiladas a las exportaciones — supplies the taxpayer makes. The received-side counterpart is 'import_third_country'.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_triangulation|issued", value = "{\"label\":\"intra_community_triangulation / issued\",\"category\":\"intra_community_triangulation\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"The payer is non-resident by construction for this category, and RIRPF art. 76.1 places a non-resident payer without a Spanish permanent establishment outside the withholding obligation except for rendimientos del trabajo and rendimientos that are a deducible gasto for IRNR art. 24.2 rentas (art. 76.1.d). A payer WITH a Spanish permanent establishment IS obliged (art. 76.1.c), so this expectation is a default and not a prohibition: a counterparty falling in either carve-out bears a real retención and the row is wrong for that counterparty.\",\"legal_refs\":[\"ley-37-1992:art-26\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_triangulation|received", value = "{\"label\":\"intra_community_triangulation / received\",\"category\":\"intra_community_triangulation\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-26\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.domestic_reverse_charge|received", value = "{\"label\":\"domestic_reverse_charge / received\",\"category\":\"domestic_reverse_charge\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"inversion_sujeto_pasivo\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"optional\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected because whether a retención arises depends on facts the IVA category does not carry: the rendimiento must be the contraprestación of an actividad profesional (RIRPF art. 95.1) and the payer must be an obliged retenedor (LIRPF art. 99).\",\"legal_refs\":[\"ley-37-1992:art-84\",\"ley-37-1992:art-158\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.domestic_reverse_charge|issued", value = "{\"label\":\"domestic_reverse_charge / issued\",\"category\":\"domestic_reverse_charge\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_credit\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected because whether a retención arises depends on facts the IVA category does not carry: the rendimiento must be the contraprestación of an actividad profesional (RIRPF art. 95.1) and the payer must be an obliged retenedor (LIRPF art. 99).\",\"legal_refs\":[\"ley-37-1992:art-84\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_service_supply|issued", value = "{\"label\":\"intra_community_service_supply / issued\",\"category\":\"intra_community_service_supply\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"The payer is non-resident by construction for this category, and RIRPF art. 76.1 places a non-resident payer without a Spanish permanent establishment outside the withholding obligation except for rendimientos del trabajo and rendimientos that are a deducible gasto for IRNR art. 24.2 rentas (art. 76.1.d). A payer WITH a Spanish permanent establishment IS obliged (art. 76.1.c), so this expectation is a default and not a prohibition: a counterparty falling in either carve-out bears a real retención and the row is wrong for that counterparty.\",\"legal_refs\":[\"ley-37-1992:art-69\",\"ley-37-1992:art-70\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_service_supply|received", value = "{\"label\":\"intra_community_service_supply / received\",\"category\":\"intra_community_service_supply\",\"kind\":\"received\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 69.Uno.1.o locates a B2B service where the RECIPIENT is established, so this category describes a service the taxpayer SUPPLIES to a business in another Member State. The received-side counterpart is 'intra_community_service_acquisition_reverse_charge', which carries its own row.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_service_acquisition_reverse_charge|received", value = "{\"label\":\"intra_community_service_acquisition_reverse_charge / received\",\"category\":\"intra_community_service_acquisition_reverse_charge\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"inversion_sujeto_pasivo\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-69\",\"ley-37-1992:art-70\",\"ley-37-1992:art-84\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_service_acquisition_reverse_charge|issued", value = "{\"label\":\"intra_community_service_acquisition_reverse_charge / issued\",\"category\":\"intra_community_service_acquisition_reverse_charge\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"This category describes a service the taxpayer RECEIVES from a supplier in another Member State, self-assessing the cuota under LIVA art. 84.Uno.2.o. The issued-side counterpart is 'intra_community_service_supply', which carries its own row.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_acquisition_reverse_charge|issued", value = "{\"label\":\"intra_community_acquisition_reverse_charge / issued\",\"category\":\"intra_community_acquisition_reverse_charge\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA arts. 13/15 define an adquisición intracomunitaria — something the taxpayer RECEIVES. The issued-side counterpart of an intra-community movement is 'intra_community_supply', which carries its own row.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.intra_community_acquisition_reverse_charge|received", value = "{\"label\":\"intra_community_acquisition_reverse_charge / received\",\"category\":\"intra_community_acquisition_reverse_charge\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"inversion_sujeto_pasivo\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"optional\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-13\",\"ley-37-1992:art-15\",\"ley-37-1992:art-84\",\"ley-37-1992:art-158\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.import_third_country|issued", value = "{\"label\":\"import_third_country / issued\",\"category\":\"import_third_country\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 17 defines an importación — goods entering the Community, which the taxpayer RECEIVES. The issued-side counterparts are 'export_third_country_zero_rated' and 'export_assimilated_zero_rated', which carry their own rows.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.import_third_country|received", value = "{\"label\":\"import_third_country / received\",\"category\":\"import_third_country\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"aduana\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"optional\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"This is an acquisition category, so the counterparty is a non-resident supplier whose income is not an IRPF rendimiento; no IRPF retención arises for the Spanish acquirer, and RIRPF art. 76.1 names no obligation running the other way. Any IRNR withholding obligation is a separate tax and is out of this table's scope.\",\"legal_refs\":[\"ley-37-1992:art-17\",\"ley-37-1992:art-158\",\"ley-35-2006:art-99\",\"rd-439-2007:art-76\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.recargo_equivalencia|issued", value = "{\"label\":\"recargo_equivalencia / issued\",\"category\":\"recargo_equivalencia\",\"kind\":\"issued\",\"applicability\":\"does_not_arise\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"LIVA art. 154 applies the régimen del recargo de equivalencia to entregas made TO a comerciante minorista, so this category describes what the taxpayer receives. Supplier-side recargo charged on a taxable output sale is recorded through the invoice's recargo amount, not by tagging the sale with this category.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.recargo_equivalencia|received", value = "{\"label\":\"recargo_equivalencia / received\",\"category\":\"recargo_equivalencia\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"none\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"repercutida\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"required\",\"recargo_grounding\":\"bundled_corpus\",\"retencion\":\"not_expected\",\"retencion_grounding\":\"reasoned\",\"retencion_note\":\"Reasoned, not measured: the régimen del recargo de equivalencia applies to entregas de bienes to comerciantes minoristas (LIVA art. 154), while RIRPF art. 95.1 scopes retención to the contraprestación of an actividad profesional. The inference that a goods purchase under this regime bears no retención follows from those two scopes; no bundled provision states it directly.\",\"legal_refs\":[\"ley-37-1992:art-154\",\"ley-37-1992:art-158\",\"ley-37-1992:art-161\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.regimen_simplificado|issued", value = "{\"label\":\"regimen_simplificado / issued\",\"category\":\"regimen_simplificado\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_credit\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"regimen_especial\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and the gap is in the SCOPE rather than in the rate. RIRPF art. 95.6.1.º sets the retención on a rendimiento whose actividad económica determines its rendimiento neto by estimación objetiva at 1 % of the ingresos íntegros satisfechos, and the bundled excerpt carries it. What the excerpt truncates is art. 95.6.2.º, the list of activities the apartado reaches, so whether a given taxpayer's activity is one of them cannot be settled from the bundled text. Two further reasons keep this POSSIBLE rather than expected: the IVA régimen simplificado and the IRPF estimación objetiva are regimes of different taxes whose populations merely tend to coincide, so this category does not establish the IRPF method at all; and an agrícola, ganadera or forestal activity is reached by apartados 4 and 5 at their own rates instead.\",\"legal_refs\":[\"ley-37-1992:art-122\",\"ley-37-1992:art-123\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.regimen_simplificado|received", value = "{\"label\":\"regimen_simplificado / received\",\"category\":\"regimen_simplificado\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"required\",\"cuota_settlement\":\"regimen_especial\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Whether a RECEIVED invoice legitimately carries this category is itself unsettled -- the régimen simplificado (LIVA arts. 122/123) describes the taxpayer's own OUTPUT regime -- and the pair is declared to arise because refusing a real operation is worse than carrying an unused row. That uncertainty is about the row, not about the retención: where one arises the taxpayer is the retenedor, and it is grounded exactly as on the issued side. Possible rather than expected, and the gap is in the SCOPE rather than in the rate. RIRPF art. 95.6.1.º sets the retención on a rendimiento whose actividad económica determines its rendimiento neto by estimación objetiva at 1 % of the ingresos íntegros satisfechos, and the bundled excerpt carries it. What the excerpt truncates is art. 95.6.2.º, the list of activities the apartado reaches, so whether a given taxpayer's activity is one of them cannot be settled from the bundled text. Two further reasons keep this POSSIBLE rather than expected: the IVA régimen simplificado and the IRPF estimación objetiva are regimes of different taxes whose populations merely tend to coincide, so this category does not establish the IRPF method at all; and an agrícola, ganadera or forestal activity is reached by apartados 4 and 5 at their own rates instead.\",\"legal_refs\":[\"ley-37-1992:art-122\",\"ley-37-1992:art-123\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.reagp_compensation|issued", value = "{\"label\":\"reagp_compensation / issued\",\"category\":\"reagp_compensation\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_credit\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and grounded on both sides. RIRPF art. 95.4 sets the retención on the contraprestación of an actividad agrícola o ganadera at 1 % for engorde de porcino y avicultura and 2 % otherwise, over the ingresos íntegros satisfechos, and scopes itself to activities obtaining productos naturales directly from the explotación without transformation -- the same population LIVA art. 130.Tres describes. It stays POSSIBLE because the payer must also be an obliged retenedor (LIRPF art. 99), which the IVA category does not carry, and because a REAGP operation may instead be a servicio accesorio the apartado does not reach.\",\"legal_refs\":[\"ley-37-1992:art-130\",\"ley-37-1992:art-131\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.reagp_compensation|received", value = "{\"label\":\"reagp_compensation / received\",\"category\":\"reagp_compensation\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"taxpayer_liability\",\"base\":\"required\",\"cuota\":\"zero_by_law\",\"cuota_settlement\":\"none\",\"cuota_grounding\":\"bundled_corpus\",\"recargo\":\"zero_by_law\",\"recargo_grounding\":\"reasoned\",\"retencion\":\"possible\",\"retencion_grounding\":\"bundled_corpus\",\"retencion_note\":\"Possible rather than expected, and grounded on both sides. RIRPF art. 95.4 sets the retención on the contraprestación of an actividad agrícola o ganadera at 1 % for engorde de porcino y avicultura and 2 % otherwise, over the ingresos íntegros satisfechos, and scopes itself to activities obtaining productos naturales directly from the explotación without transformation -- the same population LIVA art. 130.Tres describes. It stays POSSIBLE because the payer must also be an obliged retenedor (LIRPF art. 99), which the IVA category does not carry, and because a REAGP operation may instead be a servicio accesorio the apartado does not reach.\",\"legal_refs\":[\"ley-37-1992:art-130\",\"ley-37-1992:art-131\",\"ley-37-1992:art-134\",\"ley-35-2006:art-99\",\"rd-439-2007:art-95\"],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.erroneous_invoice|issued", value = "{\"label\":\"erroneous_invoice / issued\",\"category\":\"erroneous_invoice\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: the operator has flagged the invoice as erroneous, so no component expectation can be asserted. Declared unknown rather than guessed.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.erroneous_invoice|received", value = "{\"label\":\"erroneous_invoice / received\",\"category\":\"erroneous_invoice\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: the operator has flagged the invoice as erroneous, so no component expectation can be asserted. Declared unknown rather than guessed.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.unknown|issued", value = "{\"label\":\"unknown / issued\",\"category\":\"unknown\",\"kind\":\"issued\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: no IVA treatment declared, so untagged and exempt are indistinguishable from the amounts alone. This is exactly the ambiguity that makes a row ungrounded rather than exempt.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
  { key = "row.unknown|received", value = "{\"label\":\"unknown / received\",\"category\":\"unknown\",\"kind\":\"received\",\"applicability\":\"arises\",\"retencion_role\":\"unknown\",\"base\":\"unknown\",\"cuota\":\"unknown\",\"cuota_settlement\":\"unknown\",\"cuota_grounding\":\"ungrounded\",\"recargo\":\"unknown\",\"recargo_grounding\":\"ungrounded\",\"retencion\":\"unknown\",\"retencion_grounding\":\"ungrounded\",\"retencion_note\":\"Sentinel category: no IVA treatment declared, so untagged and exempt are indistinguishable from the amounts alone. This is exactly the ambiguity that makes a row ungrounded rather than exempt.\",\"legal_refs\":[],\"pending_legal_refs\":[],\"fact_ids\":[]}" },
