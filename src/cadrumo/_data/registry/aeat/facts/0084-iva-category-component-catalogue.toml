  { key = "category_reason.reagp_compensation", value = "régimen especial de la agricultura, ganadería y pesca: no IVA rate is derivable here because none is charged — LIVA art. 130.Cinco sets a compensación a tanto alzado of 12 % of the sale price for explotaciones agrícolas o forestales and 10,5 % for ganaderas o pesqueras, which is not an IVA tipo; supply the compensación from the self-issued document LIVA art. 134.Tres requires" },
  { key = "category_reason.domestic_reverse_charge", value = "potential domestic reverse charge (inversión del sujeto pasivo): no rate is derivable here; verify the operation evidence and supply the self-assessed base and cuota explicitly" },
  { key = "category_reason.intra_community_supply", value = "potential intra-community supply: no Spanish rate is derivable here; verify the customer IVA ID, cross-border transport, and reporting evidence before treating it as exempt" },
  { key = "category_reason.intra_community_acquisition_reverse_charge", value = "potential intra-community acquisition under reverse charge: no rate is derivable here; verify the acquisition evidence and supply the self-assessed base and cuota explicitly" },
  { key = "category_reason.intra_community_service_supply", value = "potential intra-community service supply: no Spanish rate is derivable here because art. 69.Uno.1.o locates the service where the recipient is established; verify the customer IVA ID and that no art. 70 regla especial brings the service back into the TAI" },
  { key = "category_reason.intra_community_service_acquisition_reverse_charge", value = "potential intra-community service acquisition under reverse charge: no rate is derivable here; verify the acquisition evidence and supply the self-assessed base and cuota explicitly" },
  { key = "category_reason.intra_community_triangulation", value = "potential intra-community triangulation: no Spanish rate is derivable here; verify the triangulation conditions and reporting evidence" },
  { key = "category_reason.export_third_country_zero_rated", value = "potential export to a third country: no domestic rate is derivable here; verify the export evidence before treating it as zero-rated" },
  { key = "category_reason.export_assimilated_zero_rated", value = "potential operation assimilated to an export: no domestic rate is derivable here; verify the qualifying ship, aircraft, provisioning, or related service facts before treating it as exempt" },
  { key = "category_reason.import_third_country", value = "import from a third country: IVA is assessed at customs against the import base — derivation is left to the operator" },
  { key = "category_reason.recargo_equivalencia", value = "recargo de equivalencia: a surcharge on top of the IVA rate that varies by product tier — derivation is left to the operator" },
