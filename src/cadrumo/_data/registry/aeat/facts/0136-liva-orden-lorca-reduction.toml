required_text = [
  "Disposición adicional cuarta. Reducción en 2022 del rendimiento neto calculado por el método de estimación objetiva del Impuesto sobre la Renta de las Personas Físicas y de la cuota devengada por operaciones corrientes del régimen especial simplificado del Impuesto sobre el Valor Añadido para actividades económicas desarrolladas en el término municipal de Lorca.",
  "2. Los sujetos pasivos del Impuesto sobre el Valor Añadido que desarrollen actividades empresariales o profesionales incluidas en el anexo II de esta Orden en el término municipal de Lorca y estén acogidos al régimen especial simplificado, podrán reducir en un 20 por ciento el importe de las cuotas devengadas por operaciones corrientes correspondiente a tales actividades en el año 2022.",
  "Esta reducción se tendrá en cuenta para el cálculo tanto de la cuota trimestral como de la cuota anual del régimen especial simplificado correspondiente al año 2022.",
]

