# Withdrawn 2026-09-13: this variant declared "boe-rirpf-category-profile-authority"
# (RD 439/2007, the IRPF reglamento) as documentary authority for an IVA vocabulary, and
# could not cite it because the document does not carry the claim. Measured over its
# 482,043 extracted characters (0 U+FFFD): "no deducible" 0, "deducibilidad" 0,
# "cuotas soportadas" 0. All 16 occurrences of "Impuesto sobre el Valor Añadido" are
# régimen-especial-simplificado / estimación-objetiva coordination, cross-references to
# the Reglamento del IVA (RD 1624/1992, a different decree), or the exclusion of IVA from
# a rental withholding base -- none is about input-IVA deductibility.
#
# No replacement source is declared, because the payload is not a legal claim: it is a
# local ordering of three presentation tokens whose own semantics entry states it is
# "kept decoupled from the IVA taxonomy branch". 26 of the 566 variants in this corpus
# likewise declare no source_refs. Citing a document that does not state the claim would
# have satisfied the coverage gate while making the corpus assert something false.
#
# Replaced by the law that does govern these tokens. Ley 37/1992 art. 94 ("Operaciones
# cuya realización origina el derecho a la deducción") distinguishes entregas "sujetas y
# no exentas" from exempt operations, which is the general / exempt_or_non_subject split;
# art. 95 ("Limitaciones del derecho a deducir") states that cuotas soportadas on goods
# "que no se afecten, directa y exclusivamente, a su actividad" are not deductible, which
# is non_deductible_input. Both are legal_refs rather than source_refs, the same shape the
# iva-rate variants use, so the ordering is grounded in LIVA instead of the IRPF reglamento.
legal_refs = ["ley-37-1992:art-94", "ley-37-1992:art-95"]
