# RIRPF art 22.3 is what the proportionality kinds rest on: partial affectation is
# limited to the part actually used in the activity, only separately-exploitable parts
# count, and indivisible elements admit no partial affectation at all -- which is the
# full_deductible / fixed_percentage / usage_ratio_* distinction this vocabulary names.
# The RATIO VALUES themselves are not grounded here and are not claimed: the 30%
# suministros rule lives in LIRPF art 30.2.5.b, not in the reglamento.
[[fact.variants.source_citations]]
source_ref = "boe-rirpf-category-profile-authority"
required_text = [
    "la afectación se entenderá limitada a aquella parte de los mismos que realmente se utilice en la actividad",
    "sólo se considerarán afectadas aquellas partes de los elementos patrimoniales que sean susceptibles de un aprovechamiento separado e independiente del resto",
    "En ningún caso serán susceptibles de afectación parcial elementos patrimoniales indivisibles",
]

