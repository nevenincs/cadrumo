# The general procedure of Orden EHA/1658/2009 art. 3.2 that turns an Anexo II
# day into the last day a domiciliación can be ordered. It applies to every
# modelo, so it carries no modelo selector. The coordinate is the nominal Anexo II
# day: the civil day the domiciliación period would end before any adjustment.
#
# Entries:
# - filing_extension: "same_days", art. 3.2.b: when the last day of the filing
#   period is inhábil, the domiciliación period is extended by the same days.
# - margin_rule: "none"; "business_days", a minimum of margin_min_business_days
#   días hábiles; or "business_or_calendar_days", the minimum the Orden requires
#   since Orden HAC/241/2025 between the end of the domiciliación period and the
#   end of the voluntary period, met by either margin_min_business_days días
#   hábiles or margin_min_calendar_days días naturales. Business days are counted
#   after the domiciliación end up to and including the voluntary close, natural
#   days strictly between the two ends, as AEAT's calendars apply the margin.
# - business_day_territory: the calendar territory whose holidays make a day
#   inhábil for the margin. The Orden names the municipality of AEAT's
#   Departamento de Informática, in the Comunidad de Madrid; municipal holidays
#   have no registry source, so derivations report that layer as unverified.
# - inhabil_base: "keep" leaves an Anexo II day that falls on an inhábil day where
#   it is, subject to the margin; "weekend_to_latest_margin_compliant_business_day"
#   replaces a Saturday or Sunday with the latest business day that still meets
#   the margin and keeps a holiday, subject to the margin;
#   "latest_margin_compliant_business_day" replaces any inhábil day so.
# - inhabil_base_authority: what grounds inhabil_base. "orden_text" is the Orden
#   itself; "aeat_administrative_practice" is AEAT's published domiciliación
#   calendar, because the Orden contains no rule that moves an inhábil Anexo II
#   day.

[fact]
fact_id = "deadlines.domiciliation-procedure"
family = "mapping"

# Art. 3.2 as worded by Orden HAC/350/2019: the Anexo II period and its
# extension, with no minimum margin before the voluntary close. The calendars
# through 2023 publish an Anexo II day on a weekend as it stands (Modelo 111,
# septiembre 2023: domiciliación to Sunday 15 October, no exception listed).
[[fact.variants]]
variant_id = "domiciliation-procedure:orden-text-pre-margin"
date_axis = "submission_date"
valid_to = 2023-12-31
legal_refs = ["orden-eha-1658-2009:art-3"]
source_refs = ["boe-orden-eha-1658-2009-consolidada"]
review_status = "agent_reviewed"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-eha-1658-2009-consolidada"
required_text = [
  "se ampliará el mismo número de días que resulte ampliado el plazo de presentación de la autoliquidación correspondiente.",
  "Se modifica el apartado 2 por el art. único.4 de la Orden HAC/350/2019, de 5 de marzo.",
  "Se modifican los apartados 2 y 6 por el art. 2.2 y 4 de la Orden HAC/241/2025, de 10 de marzo.",
]
[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "filing_extension", value = "same_days" },
  { key = "margin_rule", value = "none" },
  { key = "inhabil_base", value = "keep" },
  { key = "inhabil_base_authority", value = "orden_text" },
]

# AEAT administrative practice, not the Orden, from the 2024 calendar until Orden
# HAC/241/2025: three business days before the voluntary close, and an Anexo II
# day on a weekend replaced by the latest business day meeting them. Mayo 2024,
# Saturday 15 June before Thursday 20 June, is published as Monday 17; agosto
# 2024, Sunday 15 September before Friday 20, as Tuesday 17; Modelo 303 febrero
# 2024, 27 March after the extension, before Monday 1 April with Jueves and
# Viernes Santo between, as Monday 25 March. A holiday Anexo II day stands:
# julio 2024 keeps Thursday 15 August.
[[fact.variants]]
variant_id = "domiciliation-procedure:aeat-practice-2024"
date_axis = "submission_date"
valid_from = 2024-01-01
valid_to = 2025-03-14
legal_refs = ["orden-eha-1658-2009:art-3"]
source_refs = ["boe-orden-eha-1658-2009-consolidada", "aeat-calendario-contribuyente-2024", "aeat-calendario-contribuyente-2025"]
review_status = "pending_review"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-eha-1658-2009-consolidada"
required_text = [
  "se ampliará el mismo número de días que resulte ampliado el plazo de presentación de la autoliquidación correspondiente.",
]
[[fact.variants.source_citations]]
source_ref = "aeat-calendario-contribuyente-2024"
required_text = [
  "mayo: 1 al 17 de junio",
  "agosto: 1 al 17 de septiembre",
  "noviembre: 1 al 17 de diciembre",
  "febrero: 1 al 25 de marzo",
]
[[fact.variants.source_citations]]
source_ref = "aeat-calendario-contribuyente-2025"
required_text = ["enero 25: 1 al 17 de febrero"]
[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "filing_extension", value = "same_days" },
  { key = "margin_rule", value = "business_days" },
  { key = "margin_min_business_days", value = 3 },
  { key = "business_day_territory", value = "ES-MD" },
  { key = "inhabil_base", value = "weekend_to_latest_margin_compliant_business_day" },
  { key = "inhabil_base_authority", value = "aeat_administrative_practice" },
]

# Art. 3.2 as rewritten by Orden HAC/241/2025, art. segundo.Dos, in force from
# 15 March 2025 with no transitional regime, with AEAT's practice of replacing a
# weekend Anexo II day continued by the 2025 calendar (febrero 25, Saturday 15
# March, published as Monday 17). A holiday still stands (julio 25 keeps Friday
# 15 August; Modelo 303 noviembre 25 keeps Thursday 25 December). The natural-day
# count is strictly between the two ends: 1T 25, Wednesday 16 April before
# Monday 21 April, leaves four and is published as Tuesday 15 April.
[[fact.variants]]
variant_id = "domiciliation-procedure:hac-241-2025"
date_axis = "submission_date"
