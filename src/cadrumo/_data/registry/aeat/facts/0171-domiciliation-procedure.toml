# The general procedure of Orden EHA/1658/2009 art. 3.2 that turns an Anexo II
# day into the last day a domiciliación can be ordered. It applies to every
# modelo, so it carries no modelo selector. The coordinate is the nominal Anexo II
# day: the civil day the domiciliación period would end before any adjustment.
#
# Entries:
# - filing_extension: "same_days", art. 3.2.b: when the last day of the filing
#   period is inhábil, the domiciliación period is extended by the same days.
# - margin_rule: "none", or "business_or_calendar_days", the minimum the Orden
#   requires between the end of the domiciliación period and the end of the
#   voluntary period, met by either margin_min_business_days días hábiles or
#   margin_min_calendar_days días naturales.
# - business_day_territory: the calendar territory whose holidays make a day
#   inhábil for the margin. The Orden names the municipality of AEAT's
#   Departamento de Informática, in the Comunidad de Madrid; municipal holidays
#   have no registry source, so derivations report that layer as unverified.
# - inhabil_base: "keep" leaves an Anexo II day that falls on an inhábil day where
#   it is; "latest_margin_compliant_business_day" replaces it with the latest
#   business day that still meets the margin.
# - inhabil_base_authority: what grounds inhabil_base. "orden_text" is the Orden
#   itself; "aeat_administrative_practice" is AEAT's published domiciliación
#   calendar, because the Orden contains no rule that moves an inhábil Anexo II
#   day.

[fact]
fact_id = "deadlines.domiciliation-procedure"
family = "mapping"

# Art. 3.2 as worded by Orden HAC/350/2019 and until Orden HAC/241/2025: the Anexo
# II period and its extension, with no minimum margin before the voluntary close.
[[fact.variants]]
variant_id = "domiciliation-procedure:orden-text-pre-margin"
date_axis = "submission_date"
valid_to = 2025-03-14
legal_refs = ["orden-eha-1658-2009:art-3"]
source_refs = ["boe-orden-eha-1658-2009-consolidada"]
review_status = "agent_reviewed"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-eha-1658-2009-consolidada"
required_text = [
  "se ampliará el mismo número de días que resulte ampliado el plazo de presentación de la autoliquidación correspondiente.",
  "Se modifica el apartado 2 por el art. único.4 de la Orden HAC/350/2019, de 5 de marzo.",
  "Se modifican los apartados 2 y 6 por el art. 2.2 y 4 de la Orden HAC/241/2025, de 10 de marzo.",
]
[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "filing_extension", value = "same_days" },
  { key = "margin_rule", value = "none" },
  { key = "inhabil_base", value = "keep" },
  { key = "inhabil_base_authority", value = "orden_text" },
]

# Art. 3.2 as rewritten by Orden HAC/241/2025, art. segundo.Dos, in force from
# 15 March 2025 with no transitional regime.
[[fact.variants]]
variant_id = "domiciliation-procedure:hac-241-2025"
date_axis = "submission_date"
valid_from = 2025-03-15
valid_to = 2025-12-31
legal_refs = ["orden-eha-1658-2009:art-3", "orden-hac-241-2025:art-2"]
source_refs = ["boe-orden-hac-241-2025"]
review_status = "agent_reviewed"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-hac-241-2025"
required_text = [
  "deberá existir un mínimo de tres días hábiles o cinco naturales.",
  "las festividades autonómicas o locales que afecten al municipio en el que radique el Departamento de Informática de la Agencia Tributaria.",
]
[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "filing_extension", value = "same_days" },
  { key = "margin_rule", value = "business_or_calendar_days" },
  { key = "margin_min_business_days", value = 3 },
  { key = "margin_min_calendar_days", value = 5 },
  { key = "business_day_territory", value = "ES-MD" },
  { key = "inhabil_base", value = "keep" },
  { key = "inhabil_base_authority", value = "orden_text" },
]

# AEAT administrative practice, not the Orden: the 2026 domiciliación calendar
# replaces every Anexo II day that falls on an inhábil day with the latest business
# day that still meets the margin (3M 26, 25 April, a Saturday, published as 27
# April; 11M 26, 25 December, published as 24 December; 12M 25 and 4T 25,
# 25 January 2026, a Sunday, published as 27 January). The 2025 calendar did not
# do so (11M 25 was published as 25 December), so the practice starts with the
# calendar that shows it.
[[fact.variants]]
variant_id = "domiciliation-procedure:aeat-practice-2026"
date_axis = "submission_date"
valid_from = 2026-01-01
legal_refs = ["orden-eha-1658-2009:art-3", "orden-hac-241-2025:art-2"]
source_refs = ["boe-orden-hac-241-2025", "aeat-calendario-contribuyente-2026-domiciliacion"]
review_status = "pending_review"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-hac-241-2025"
required_text = ["deberá existir un mínimo de tres días hábiles o cinco naturales."]
