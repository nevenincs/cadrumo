# AEAT administrative practice, not the Orden: the 2026 domiciliación calendar
# replaces every Anexo II day that falls on an inhábil day, holidays included,
# with the latest business day that still meets the margin (3M 26, 25 April, a
# Saturday, published as 27 April; 11M 26, 25 December, published as 24
# December; 12M 25 and 4T 25, 25 January 2026, a Sunday, published as 27
# January). The 2024 and 2025 calendars kept a holiday Anexo II day (11M 25 was
# published as 25 December), so the holiday part starts with the calendar that
# shows it.
