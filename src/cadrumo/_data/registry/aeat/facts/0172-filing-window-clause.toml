# The rule that fixes, per modelo and period, when a filing window opens and the
# nominal day it closes, before any extension for an inhábil last day.
#
# Entries:
# - opens: "day_after_period_end", the window opens the day after the period ends.
# - deadline_month_offset: months after the last month of the period in which
#   the nominal close falls.
# - filing_last_day: nominal last day of the window in that month; "month_end"
#   is the last day of the month.
#
# A window exists only where the law-selected revision's filing schedule declares
# the period; this fact supplies dates, never the obligation. A window authored on
# a revision always wins over the rule, and administrative extensions the rule
# cannot derive (RD 1624/1992 art. 71.4, last paragraph) are authored windows.
# The extension of an inhábil nominal close is the separate procedure fact
# deadlines.filing-close-inhabil-shift.
#
# This fact is the single home of the nominal close: the domiciliación cutoff
# clause reads it from here.
#
# Modelo 303: Orden EHA/3786/2008 art. 7, last amended by Orden HFP/417/2017
# (in force 1 July 2017), and RD 1624/1992 art. 71.4. Monthly filers are the
# art. 71.3 population, SII-obliged under art. 62.6, so the monthly clause is the
# thirty-day SII plazo; the twenty-day non-SII monthly plazo of art. 7 is not
# declared. Modelo 390: Orden EHA/3111/2009 art. 8. Modelos 111, 115, 117,
# 123, 126, 128, 130 and 131 follow below. Every variant reaches the support
# floor and stays open until a later change is authored as a dated variant.

[fact]
fact_id = "deadlines.filing-window-clause"
family = "mapping"

