[fact]
fact_id = "capital-mobiliario-concept-vocabulary"
family = "mapping"

# Which Modelo 100 detail record a capital-mobiliario ledger row feeds, by the
# concept token the operator classifies it with. The casilla target is named by
# the registry semantic role, so the record's casilla number stays owned by the
# casilla declarations. `requires_position_kind` is empty when any position may
# carry the concept.
[[fact.variants]]
variant_id = "capital-mobiliario-concept-vocabulary:detail-records"
date_axis = "filing_period"
legal_refs = ["ley-35-2006:art-25", "ley-35-2006:art-26"]
source_refs = ["aeat-dr-100-2022-input-dictionary", "aeat-dr-100-2025-input-dictionary"]
review_status = "agent_reviewed"
ownership = "authored"

[[fact.variants.source_citations]]
source_ref = "aeat-dr-100-2022-input-dictionary"
required_text = ["RegistroB11/IMP1DB11", "RegistroB13/IMP1DB13", "RegistroB13/IMP3DB13"]

[[fact.variants.source_citations]]
source_ref = "aeat-dr-100-2025-input-dictionary"
required_text = ["RegistroB11/IMP1DB11", "RegistroB13/IMP1DB13", "RegistroB13/IMP3DB13"]

