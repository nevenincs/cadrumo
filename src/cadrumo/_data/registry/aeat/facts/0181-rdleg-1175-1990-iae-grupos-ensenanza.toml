# The IAE groups that classify a teaching activity. RDLeg 1175/1990 (tarifas del IAE),
# Seccion Primera, Agrupacion 93 "Educacion e investigacion", holds six groups; the four
# declared here are exactly the ones whose own rubrica names ensenanza: 931 "Ensenanza
# reglada", 932 "Ensenanza no reglada de formacion y perfeccionamiento profesional y
# educacion superior", 933 "Otras actividades de ensenanza" and 934 "Ensenanza fuera de
# establecimiento permanente". Groups 935 (colegios mayores y residencias de estudiantes)
# and 936 (investigacion cientifica y tecnica) are in the same agrupacion and are not
# teaching, so they are out. The set is the tariff's own grouping, not a judgement about
# which teaching is concertado: a concierto educativo covers ensenanza reglada, so a
# narrower set would read a centre classified under a neighbouring ensenanza rubrica as
# proof that it teaches nothing. Entities are three-digit groups; an activity's epigraph
# digit is read past, never matched.
[fact]
fact_id = "rdleg-1175-1990:iae-grupos-ensenanza"
family = "entity_set"

