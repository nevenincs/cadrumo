[fact.standing_rate]

# RIRPF art. 90.1 applies the rate to the base of retention that art. 93.1 fixes
# as the full consideration. LIRPF art. 101.4 states the same 19 per cent. The
# bundled consolidated texts record no amendment of either apartado after 2019, so
# one floor-reaching variant covers every supported year.
