[fact]
fact_id = "renta-rental-reduccion-art-23-2-regime"
family = "mapping"

# The two dates that decide which wording of art. 23.2 LIRPF reduces the
# positive net income of a dwelling lease. Ley 12/2023 (BOE of 25 May 2023, in
# force the next day) replaced the single 60 per cent reduction with the 90, 70,
# 60 and 50 per cent tiers, with effect for devengo from the regime start, and
# DT 38 keeps the wording in force on 31 December 2021 for a contract concluded
# before the cut-off. A devengo before the regime start, or a contract before the
# cut-off, takes that legacy reduction; any other contract takes the tiers. The
# variant opens at the support floor so every supported year reads one answer.
[[fact.variants]]
variant_id = "renta-rental-reduccion-art-23-2-regime:ley-12-2023"
date_axis = "filing_period"
legal_refs = ["ley-35-2006:art-23", "ley-35-2006:art-23-2021", "ley-35-2006:dt-38"]
source_refs = ["aeat-renta-2024-manual-parte1", "lirpf-cuota-chain-authority"]
review_status = "agent_reviewed"
ownership = "authored"

[[fact.variants.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = [
  "con efectos desde 1 de enero de 2024, a los contratos suscritos",
  "desde el 26 de mayo de 2023 les resultan de aplicación los nuevos porcentajes de reducción",
]

[[fact.variants.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = [
  "celebrado con anterioridad a la entrada en vigor de la",
  "en su redacción vigente a 31 de diciembre de 2021",
  "Esta modificación entra en vigor el 1 de enero de 2024",
]

