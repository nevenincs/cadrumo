# Record-design scope of the Modelo 190 perceptor casillas: each entry names the
# claves (and, as CLAVE.SUBCLAVE, the subclaves) whose perceptor records carry
# the casilla. The design states each scope as "Solo para percepciones
# correspondientes a las claves ..." beside the casilla's positions; a record
# outside the scope leaves the casilla blank or zero-filled, so the casilla is
# not a required input for that record.
[fact]
fact_id = "m190-perceptor-casilla-clave-scope"
family = "mapping"

