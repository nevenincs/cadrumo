family = "mapping"

# Which form and repeating group of its layout own the repeat limit of each stored
# household row object. The record design bounds the occurrences of one row element, and
# the layout's repeating group over the bindings reading the object carries that bound.
# The registry build checks that the named group reads the object and declares the limit.
