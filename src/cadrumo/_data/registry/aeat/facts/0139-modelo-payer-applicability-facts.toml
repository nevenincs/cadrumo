# meets_modelo_232_related_party_grounds is decided from the Modelo 232 operations the taxpayer
# states for the ejercicio, never from the ledger: being related (LIS art. 18.2) is a relationship
# no ledger records. Orden HFP/816/2017 art. 2 names who files, and each ground is quoted here.
# The amounts and the turnover share are NOT restated: they are the dated parameters
