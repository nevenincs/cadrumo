# premio_loteria_gravamen_especial_sin_retencion is grounded in Orden HAP/70/2013 art. 6,
# which names the obligados to file modelo 136 "cuando tales premios no hubieran sido
# objeto de la retención o ingreso a cuenta", and in LIRPF DA 33, which obliges the
# contribuyente to self-assess the gravamen especial.
# It cites no procedure page: the modelo 136 page on file applies only from 2026.
# period_set_key names the companion quarter set, grounded in art. 7: each filing covers
# "los premios cobrados en el trimestre natural inmediato anterior". A yes counts only
# with at least one quarter; a yes without quarters, like an unanswered question, leaves
# modelo 136 undetermined rather than excluded. What is NOT claimed: the prize amount
# against the exempt portion, or that a declared quarter is correct -- the profile states
# both facts, this catalogue only says which answers the obligation depends on.

# iva_books_kept_through_sii is the derived fact RGAT art. 32.e reads: "No estaran obligados
# a presentar la declaracion anual: ... e) Los obligados tributarios a que se refiere el
# articulo 62.6 del Reglamento del Impuesto sobre el Valor Anadido". RIVA art. 62.6 makes the
# SII mandatory for those "que tengan un periodo de liquidacion que coincida con el mes natural
# de acuerdo con lo dispuesto en el articulo 71.3" and lets the rest "optar por llevar los
# libros registro ... a traves de la Sede electronica". The fact holds when any of its keys is
# declared yes: iva.sii_enrolled and iva.voluntary_sii_enrolled state the enrolment itself;
# the other keys are the art. 71.3 monthly-period triggers the profile can state -- volumen de
# operaciones above 6.010.121,04 euros (1.o, enrollment.large_company), the monthly refund
# register of art. 30 (3.o, iva.redeme_enrolled) and the grupo de entidades (4.o,
# iva.group_member_enrolled, iva.group_dominant_entity_enrolled). The fact is unanswered while
# the profile carries no IVA block, and a declared no needs that block with every key no.
# enrollment.large_company is three-state as well, so the annual declaration is unanswered
# while the volumen de operaciones condition is unstated, which is the same silence that
# leaves the Modelo 303 cadence unselected.
# What is NOT claimed: the art. 71.3 2.o and 5.o triggers (patrimony acquisition, hydrocarbon
# tax deposits), which the profile does not state, and the year the enrolment covers -- the
# profile states it undated, so an enrolment for part of a year is the taxpayer's to qualify.
# Art. 62.6 applies from 2017-01-01 (RD 596/2016); this fact is authored on this variant only.

# exceeds_third_party_threshold declares a ledger source. RGAT art. 33.1 relates every person
# or entity with whom the operations "en su conjunto para cada una de dichas personas o
# entidades hayan superado la cifra de 3.005,06 euros durante el año natural correspondiente",
# computing "de forma separada las entregas y las adquisiciones de bienes y servicios". The
# Modelo 347 type 1 count binding counts the declarado records the invoice resolver builds with
# that floor applied per counterparty and per threshold bucket (clave C at its own 300,51 floor,
# arts. 32.c and 33.4), so a count above zero for a filing year is this fact for that year. The
# same source is declared on every variant because the article has carried the floor since
# 2008. What is NOT claimed: that a zero count proves the fact false -- operations the ledger
# does not hold can still exceed the floor, so the consumer treats an empty or incomplete
# ledger as unknown and a complete zero only as corroborating a declared no.
