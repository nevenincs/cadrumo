# premio_loteria_gravamen_especial_sin_retencion is grounded in Orden HAP/70/2013 art. 6,
# which names the obligados to file modelo 136 "cuando tales premios no hubieran sido
# objeto de la retención o ingreso a cuenta". LIRPF DA 33 is not cited in this span: its
# consolidated text on file applies from 2020, after this variant opens.
# It cites no procedure page: the modelo 136 page on file applies only from 2026.
# period_set_key names the companion quarter set, grounded in art. 7: each filing covers
# "los premios cobrados en el trimestre natural inmediato anterior". A yes counts only
# with at least one quarter; a yes without quarters, like an unanswered question, leaves
# modelo 136 undetermined rather than excluded. What is NOT claimed: the prize amount
# against the exempt portion, or that a declared quarter is correct -- the profile states
# both facts, this catalogue only says which answers the obligation depends on.

