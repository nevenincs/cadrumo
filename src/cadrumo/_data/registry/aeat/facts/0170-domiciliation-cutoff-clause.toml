# The Anexo II clause of Orden EHA/1658/2009 that fixes, per modelo and period, the
# last day a domiciliación can be ordered with the filing.
#
# Entries:
# - domiciliation_last_day: the Anexo II day, in the month the filing window
#   nominally closes.
# - leap_year_domiciliation_last_day: the Anexo II day when that month falls in a
#   leap year, where the clause names one.
#
# The month and the nominal close of the filing period, which art. 3.2.b
# measures its extension from, have one home: the filing-window clause
# (deadlines.filing-window-clause). A modelo declared here without a covering
# filing-window clause has no derived cutoff.
#
# Declared for Modelos 303, 111, 115, 117, 123, 126, 128, 130 and 131. Anexo II
# also lists other modelos whose payment can be domiciliated; one is declared only
# once a filing-window clause gives it a nominal close.
#
# The 303 entry of Anexo II was last changed by Orden HFP/417/2017 (d.f. cuarta,
# effective 1 July 2017), before the registry's support floor, so every variant
# reaches the floor and stays open until a later change is authored as a dated
# variant.

[fact]
fact_id = "deadlines.domiciliation-cutoff-clause"
family = "mapping"

[[fact.variants]]
variant_id = "domiciliation-cutoff-clause:303:quarterly:1t-3t"
selectors = [{ name = "modelo", value = "303" }]
date_axis = "filing_period"
period_selector = { year_from = 2018, periods = ["1T", "2T", "3T"] }
legal_refs = ["orden-eha-1658-2009:anexo-ii", "rd-1624-1992:art-71"]
source_refs = ["boe-orden-eha-1658-2009-consolidada", "aeat-calendario-contribuyente-2026-domiciliacion"]
review_status = "agent_reviewed"
ownership = "authored"
[[fact.variants.source_citations]]
source_ref = "boe-orden-eha-1658-2009-consolidada"
required_text = ["Desde el día 1 hasta el 15 de los meses de abril, julio y octubre, y desde el día 1 hasta el 25 del mes de enero."]
[[fact.variants.source_citations]]
source_ref = "aeat-calendario-contribuyente-2026-domiciliacion"
required_text = ["presentación del 1 al 30 de enero y del 1 al 20 de abril, julio y octubre"]
[fact.variants.payload]
kind = "mapping"
entries = [
  { key = "domiciliation_last_day", value = 15 },
]

