# The AEAT procedure page grounds WHAT this taxonomy is about -- its own title names the
# declaration of bienes y derechos situados en el extranjero -- and nothing more. The THREE-GROUP
# decomposition is NOT grounded here and is not claimed: cuentas, valores/derechos/seguros and
# inmuebles rest on RGAT arts 42 bis, 42 ter and 54 bis, which each group already names in its
# own establishing_legal_ref. The page's other mentions of cuentas and inmuebles are entries in
# the site's navigation list of other modelos, not statements about this one.
[[fact.variants.source_citations]]
source_ref = "aeat-modelo-720-procedure"
required_text = [
    "Declaración sobre bienes y derechos situados en el extranjero",
]

