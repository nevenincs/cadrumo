required_text = ["CLAVE TIPO DE PARTÍCIPE", "No residente sin establecimiento permanente", "NATURALEZA DEL INMUEBLE", "CLAVE DE DECLARADO", "Nudo propietario", "artículo 24.2 de la Ley IRPF", "26.2 de la Ley del IRPF"]

