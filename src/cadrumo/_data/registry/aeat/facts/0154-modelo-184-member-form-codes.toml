# The socio record's REDUCCION field (109-119) names "A" with subclave "02" and cites
# "articulo 24.2 de la Ley IRPF"; "C" and "D" any subclave; "En los demas casos este campo no
# tendra contenido". Art. 24 of Ley 35/2006 has no apartado 2 and governs parentesco. The citation
# is a stale number: art. 24.2 of the earlier refundido, RDLeg 3/2004, held this reduction for
# the same income under the heading "Gastos deducibles y reducciones". Under Ley 35/2006 the rule
# is art. 26.2, which reduces "los rendimientos netos previstos en el apartado 4 del articulo 25",
# subclave "02" of this record, and which the entity record of this same design names for clave A.
legal_refs = ["ley-35-2006:art-26"]
source_refs = ["aeat-dr-184-2025", "boe-a-2004-4347-rdleg-3-2004"]
review_status = "agent_reviewed"
ownership = "authored"

