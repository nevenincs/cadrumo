[fact]
fact_id = "ine-provincia-catalogue"
family = "mapping"

# The two-digit codes of Spain's provinces and autonomous cities with their names exactly as
# the INE relación de provincias prints them, co-official forms included. The names are proper
# names, so every language shows them as given. Both Modelo 347 record designs fill the
# declarado's CÓDIGO PROVINCIA (pos. 77-78) from its domicilio fiscal with these codes, "los dos
# dígitos que corresponden a la provincia o ciudad autónoma"; the 99 a non-resident without
# establecimiento permanente takes is the design's own, in form-row-codes, not a province.
[[fact.variants]]
variant_id = "ine-provincia-catalogue:design"
date_axis = "filing_period"
