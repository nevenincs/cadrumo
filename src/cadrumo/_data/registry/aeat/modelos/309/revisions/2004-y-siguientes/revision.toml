[revisions."2004-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2004-y-siguientes' of modelo 309 has no strictly-earlier sibling revision of this modelo (valid_from 2003-12-31 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-hac-3625-2003:apartado-1",
    "orden-hac-3625-2003:apartado-3",
]
