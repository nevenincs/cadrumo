predecessor = { none = { cause = "official_structure_differs", reason = "aeat-dr-309-2018 reorders the aeat-dr-309-2016 record: its field order differs from index 28 ('decl.transmitente-nif-iva' -> 'decl.rg-base-01') and 4 fields are new, so supersede-in-place would not reproduce it and no predecessor is declared. The payload is stored against the 2016-2017 edition through casilla_storage_baseline and family_storage_baseline: what both designs share is inherited, this edition's differences are overrides, positions restate this design's field order, its export layout stays stated per edition, and its parity anchor, verification expectation and completeness manifest are the baseline's, adopted through scoped_families. Storage reuse makes no continuity claim.", legal_refs = ["orden-hac-3625-2003:apartado-1"], source_refs = ["aeat-dr-309-2018"] } }
# Storage reuse only, not legal continuity: casillas and keyed families are
# stored as differences from the 2016-2017 edition's effective members.
