[revisions."2018-2022".family_dispositions.applicability]
reason = "Modelo 309 is filed AD-HOC, one declaracion no periodica per settlement event as the non-EU operations occur: the filing condition is the operation itself, modeled by the filing_schedules AD-HOC entry, not a periodic taxpayer-condition profile state."
legal_refs = ["ley-37-1992:art-161", "orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
source_refs = ["aeat-dr-309-2018", "aeat-modelo-309-procedure"]

[revisions."2018-2022".family_dispositions.deadline_windows]
reason = "Modelo 309's AD-HOC filing models its obligation through filing_schedules; the deadline_windows family holds per-period presentation calendars for periodic modelos, and an AD-HOC declaration's presentation window is the settlement event itself, which the schedule already carries."
legal_refs = ["ley-37-1992:art-161", "orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
source_refs = ["aeat-dr-309-2018", "aeat-modelo-309-procedure"]

[revisions."2018-2022".family_dispositions.dependency_classifications]
reason = "Modelo 309 consumes no other modelo's filed output and no modelo consumes its output through the dependency engine. The family is empty because no dependency exists to classify."
legal_refs = ["ley-37-1992:art-161", "orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
source_refs = ["aeat-dr-309-2018", "aeat-modelo-309-procedure"]

[revisions."2018-2022".family_dispositions.extraction_profiles]
reason = "The application's pull surface for modelo 309 is the operator-entered AD-HOC declaration, not a periodic declaracion PDF replay, and no inbound parser for a 309 artefact exists to name. Empty by the application's surface rather than omitted."
legal_refs = ["ley-37-1992:art-161", "orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
source_refs = ["aeat-dr-309-2018", "aeat-modelo-309-procedure"]

[revisions."2018-2022".family_dispositions.parameters]
reason = "A parameter holds a regulatory value a formula of this revision applies. Modelo 309's two formulas apply no rate, threshold or coefficient -- they are the design's own add over the eight cuota casillas and its subtract of the a-deducir casilla -- and the tipos are the operator's recorded values. Empty by the shape of the modelo's calculation."
legal_refs = ["ley-37-1992:art-161", "orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
source_refs = ["aeat-dr-309-2018", "aeat-modelo-309-procedure"]
[revisions."2018-2022".family_dispositions.projection_endpoints]
reason = "Modelo 309's record design declares two fixed pages with no repeated projection record and no field of kind 'projection'. The family has no repeated endpoint to admit; authoring a projection row into the layout is what would make it apply."
legal_refs = ["orden-hac-3625-2003:apartado-1", "orden-hac-3625-2003:apartado-3"]
