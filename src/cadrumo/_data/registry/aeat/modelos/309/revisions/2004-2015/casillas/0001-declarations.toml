# Exact operator-entered positions of the one-record 2004–15 Diseño de Registro.
# This applicability-grade revision preserves geometry and does not expose a filing-capable writer.
# The official 2004 design has one 40-character campo 9 at position 34,
# labelled "Apellidos y nombre ó razón social". It is a combined identity
# surface, not the surname/company member of the split 2016 design; keep its
# historical wire concept distinct so the old surface can be retired without
# fabricating a one-to-one chain.
# The 2004 source gives this as a fourteen-character country description.
# Later designs carry a two-character country code, so it is not the same
# typed semantic role despite the shared display label.
# The 2004 taxpayer-status flags are six independent X-or-blank fields. The
# 2016 design replaces this block with one coded field, so each historical
# surface is retired rather than linked to the aggregate category selector.
# The 2004 taxable-event flags are six independent X-or-blank fields. The
# 2016 design replaces this block with one coded field, so each historical
# surface is retired rather than linked to the aggregate event selector.
# Exact numeric [01]–[24] slots in the 1,300-position 2004–15 record.

