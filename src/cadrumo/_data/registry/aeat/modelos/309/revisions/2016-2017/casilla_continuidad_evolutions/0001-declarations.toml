# The declaration tax-year role is unchanged; modern header declarations
# cite the filing regulation in addition to the approval order, while the
# historical field cites the older general return references.
# The complete 2004 design defines Letras etiqueta (persona fisica) and free
# Observaciones. Neither field survives in the 2016 M30900/M30901 design.
# The AUX software-version and developer-NIF fields are different concepts,
# not replacement carriers for either of these historical presentation values.
# The official designs prove two historical wire surfaces were replaced, not
# that either one is a one-to-one continuation. The 2004 PDF campo 9 at
# position 34 is one 40-character An field, "Apellidos y nombre ó razón
# social"; the 2016 M30901 design splits it into campo 13 position 118 length
# 60, "Apellidos o Denominación Social", and campo 14 position 178 length 20,
# "Nombre". The 2004 PDF campo 10 at position 74 is a 14-character A country
# description; the 2016 design's campo 15 at position 198 is a 2-character An
# country code. The successor name and country-code rows therefore remain
# separate modern roots while both old wire surfaces are explicitly retired.
# The official designs prove a representation replacement, not six one-to-one
# continuations: the 2004 PDF prints six distinct one-character A/X-or-blank
# taxpayer-status fields at campos 11-16 (positions 88-93), while the 2016
# M30901 design prints one one-character Num selector at campo 16 (position
# 200) whose values 1-6 enumerate exactly those six categories. The aggregate
# 2016 `situacion-tributaria` surface therefore remains a separate modern
# category selector; each historical flag below is explicitly retired.
# The official designs prove a representation replacement, not six one-to-one
# continuations: the 2004 PDF prints six distinct one-character A/X-or-blank
# taxable-event fields at campos 17-22 (positions 94-99), while the 2016
# M30901 design prints one one-character Num selector at campo 17 (position
# 201) whose values 1-6 enumerate exactly those six events. The aggregate 2016
# `hecho-imponible` surface therefore remains a separate modern selector; each
# historical flag below is explicitly retired.

