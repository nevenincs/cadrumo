continuidad_evidence = "NOT A PRINTED BOX. This row carries a slug number equal to its own id and no position: it is a bound cuota leaf in the inversion_sujeto_pasivo section, input_kind bound to a ledger binding rather than to a record byte. the 2016-2017 record design (aeat-dr-309-2016, corpus/.../modelo_309/files/03-309-...-2016-y-2017.xls.extracted.md, sha256 1bb317f154d6) lists 61 positional campos and prints no field of this name; the 2004-2015 record design (aeat-dr-309-2004, corpus/.../modelo_309/files/02-309-orden-eha-3212-2004-ejercicios-hasta-2015.pdf, sha256 7a855ce41e9b) lists 64 positional campos and prints none either. The only printed liquidacion fields either design carries are the numbered boxes [01]-[24], which this modelo declares as separate rows. The row is absent from the predecessor edition because it is not on the form at all."
