# Revision-owned Modelo 296 projection endpoint authority for the 2024 diseno.
# One endpoint per field of the repeating records. There is no slot axis: each
# RECORD repeats (repeat = "projection_rows"), so the payee is identified by the
# render occurrence and the number of perceptores is the number of payees rather than
# a ceiling declared here.
#
# Stated here are only the endpoints aeat-dr-296-2024 publishes first: the five
# perceptor fields at positions 85-90 and 402-432, which aeat-dr-296-2023 leaves
# blank, and the fields of the two "Anexo - Valores Negociables" records. The
# endpoints both designs share are stored against the 2023 edition (see
# revision.toml), each overridden to cite this edition's design.

