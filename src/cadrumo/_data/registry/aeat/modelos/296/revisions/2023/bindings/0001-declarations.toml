# Materialisation slots for the two annual_summary relations this revision
# declares. A binding that exists only as a relation's target_binding MUST carry
# source = "relation_prefill" -- it is filled by relation resolution, never by a
# direct selector -- which is the shape modelo 390 uses for its own carries from
# modelo 303.
#
# This family was briefly dispositioned empty. That disposition reasoned about
# the two shapes it knew, a casilla resolver and a layout descriptor, and named a
# revisit condition for layout binding_rows. It did not anticipate the third
# shape, and is withdrawn rather than amended.

