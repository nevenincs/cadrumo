# Revision-owned Modelo 296 projection endpoint authority for the 2023 diseno.
# One endpoint per field of the two repeating records aeat-dr-296-2023 declares:
# the perceptor row and the "Anexo de desglose de retenciones e ingresos a cuenta"
# (tipo de hoja "F"). There is no slot axis: each RECORD repeats
# (repeat = "projection_rows"), so the payee is identified by the render occurrence
# and the number of perceptores is the number of payees rather than a ceiling
# declared here.
#
# SCOPE IS THE 2023 DESIGN, NOT ITS SUCCESSOR. This family previously carried 100
# endpoints, 53 of which name fields aeat-dr-296-2023 does not declare while citing
# it as their source: the 48 fields of the two "Anexo - Valores Negociables" records,
# which that design does not carry at all, and five perceptor fields first published
# for ejercicio 2024 -- codigo_bic_del_perceptor_mediador, nif_del_pagador_anterior,
# procedimiento_especial_de_retenciones, clave_de_mercado and
# codigo_lei_del_perceptor. In the 2023 design those five positions are declared
# BLANCOS: 85-90 and 402-432. They are removed here rather than left pointing at a
# design that does not contain them; the 2024-y-siguientes edition declares them
# against aeat-dr-296-2024, which does.

