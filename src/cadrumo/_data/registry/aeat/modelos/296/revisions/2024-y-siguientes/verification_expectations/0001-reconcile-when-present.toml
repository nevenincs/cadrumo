# export layout's own declarante header field rather than a casilla, so the three
# monetary boxes are the casilla set. All three are operator input -- none is
# engine-computed -- so each is reconciled against the filing WHEN the filing
# prints it, and all are EXCLUDED from the coverage denominator
# (min_coverage = 0).
