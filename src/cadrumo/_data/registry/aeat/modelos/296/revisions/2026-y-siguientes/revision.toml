[revisions."2026-y-siguientes"]
casilla_source_refs = ["boe-modelo-296-form-text", "boe-modelo-296-form-layout"]
# Applicability-grade edition from ejercicio 2026, stored as the differences from
# the 2024-2025 edition (storage baselines select payload only).
#
# WHAT CHANGED. Orden HAC/623/2026 art. 2 rewrites three fields of the tipo-2
# perceptor record -- CODIGO (135), CODIGO EMISOR (136-147) and CLAVE DE MERCADO
# (412, whose values become A to E) -- and adds CLAVE DE PERSONALIDAD DEL TITULAR
# REGISTRAL at position 310 of the anexo "Valores negociables. Relacion de
# certificados de pago". Its disposicion final unica applies the change first to
# the declaracion of ejercicio 2026, filed in 2027. The complete layout is
# boe-modelo-296-2026-layout, BOE's consolidated Anexo III redaction of 24 June
# 2026.
#
# WHY APPLICABILITY. AEAT has not published the ejercicio-2026 diseno de registro
# (its 200-299 index, updated 14/07/2026, lists 2024 only), so no export layout
# is generated. Serving the 2024-2025 layout at filing grade would render the
# replaced fields; it is not adopted, and filing grade returns only when AEAT's
# 2026 design is captured and a layout generated from it.
authority_grade = "applicability"
valid_from = 2026-01-01
period_selector = { year_from = 2026, periods = ["0A"] }
orden_aplicabilidad = ["orden-eha-3290-2008:art-6"]
legal_refs = ["orden-eha-3290-2008:art-6", "orden-hac-623-2026:art-segundo", "orden-hac-623-2026:disposicion-final-unica", "trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout", "boe-modelo-296-2026-layout"]
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-09-30
casilla_storage_baseline = "2024-2025"
family_storage_baseline = "2024-2025"
scoped_families = ["workbook_parity_refs", "verification_expectations", "completeness_manifest"]

