[revisions."2024-2025"]
# Explicit root rather than an omitted key, so a 2023 edition can sit ahead of
# it. The 2024 design is not a revision of the 2023 one: aeat-dr-296-2023
# carries THREE record types and aeat-dr-296-2024 carries FIVE, the two extra
# being the Anexos al registro tipo 2 ("Valores negociables") that AEAT
# introduced for ejercicio 2024. No merge from the earlier edition reproduces
# this one, so it declares no predecessor; what both designs share is stored
# against 2023 through the storage baselines below.
predecessor = { none = { cause = "official_structure_differs", reason = "aeat-dr-296-2023 carries three record types (declarante, perceptor, anexo de desglose de retenciones) and aeat-dr-296-2024 carries five, adding the two Anexos al registro tipo 2 for valores negociables -- relacion de pago a contribuyentes and relacion de certificados de pago -- first published for ejercicio 2024, and fills perceptor positions 85-90 and 402-432 that the 2023 design leaves blank. The record set differs, so no merge from the 2023 edition produces this one and no predecessor is declared. The payload is stored against the 2023 edition through casilla_storage_baseline and family_storage_baseline: what both designs share is inherited, with overrides for this edition's design citations and lineage evidence, while the export layout and the projection endpoints of the fields and records new in 2024 are stated here. Storage reuse makes no continuity claim.", legal_refs = ["orden-eha-3290-2008:art-6"], source_refs = ["aeat-dr-296-2024"] } }
binding_source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout"]
casilla_source_refs = ["boe-modelo-296-form-text", "boe-modelo-296-form-layout"]
application_link_source_refs = ["aeat-modelo-296-procedure"]
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
valid_from = 2024-01-01
valid_to = 2025-12-31
period_selector = { year_from = 2024, year_to = 2025, periods = ["0A"] }
orden_aplicabilidad = ["orden-eha-3290-2008:art-6"]
legal_refs = ["orden-eha-3290-2008:art-6", "trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout", "aeat-dr-296-2024"]
# Storage reuse only, not legal continuity: casillas and keyed families are
# stored as differences from the 2023 edition's effective members.
casilla_storage_baseline = "2023"
family_storage_baseline = "2023"
scoped_families = ["workbook_parity_refs", "verification_expectations", "completeness_manifest"]

family_disposition_removals = ["bindings", "dependency_classifications"]

[revisions."2024-2025".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo is a withholding agent's return: its withholding boxes state what the declarant practised on others and paid in, never a credit of the declarant's own, so there is no credit casilla for an entry to name. The perceptor credits that withholding on the perceptor's own return."""
legal_refs = ["orden-eha-3290-2008:art-6", "trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout", "aeat-dr-296-2024"]


[revisions."2024-2025".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["orden-eha-3290-2008:art-6", "trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout", "aeat-dr-296-2024"]

[revisions."2024-2025".family_dispositions.extraction_profiles]
reason = """
An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against the registry's own casilla labels. Modelo 296's corpus carries its diseno de registro (aeat-dr-296-2024), which is a wire-record description printing no form labels, and no label-printing specimen. Authoring patterns without such a document would invent them. Modelo 100's 2020 revision disposes this family on \
exactly this ground while its 2021-2024 siblings populate theirs, so the family is evidence-scoped by revision rather than absent by nature: acquire a label-printing artefact and it becomes applicable, at which point this disposition must be revisited rather than inherited."""
legal_refs = ["trlirnr-rdleg-5-2004:art-24", "orden-eha-3290-2008:art-6"]
source_refs = ["aeat-modelo-296-procedure", "boe-modelo-296-form-layout"]

[revisions."2024-2025".family_dispositions.formulas]
reason = """
The hoja-resumen approved as ANEXO II of Orden EHA/3290/2008 prints four boxes and computes none of them. Box 01 is the perceptor count, 02 the suma algebraica of the perceptor bases, 03 the suma of the retenciones, and 04 the suma of the retenciones INGRESADAS -- each one an aggregation the declarante performs over its own tipo-2 perceptor records, which this registry does not hold, and none an arithmetic relation between the boxes themselves. Box 04 in particular is NOT derivable from 03: it \
counts only perceptores whose CLAVE is 3 to 25, or whose CLAVE is 1 or 2 with PAGO = 1, so any formula relating the two would assert an identity the diseno explicitly denies. The family is inapplicable by the shape of this form rather than absent by omission."""
legal_refs = [
    "trlirnr-rdleg-5-2004:art-24",
    "orden-eha-3290-2008:art-6",
]
source_refs = [
    "boe-modelo-296-form-text",
    "boe-modelo-296-form-layout",
    "aeat-dr-296-2024",
]

