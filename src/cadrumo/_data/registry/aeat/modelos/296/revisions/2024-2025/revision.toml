# which only aeat-dr-216-2024 prints. The 2023 edition leaves both as operator
# input because the 216 design for ejercicios 2020-2023 prints unnumbered
# partidas instead, so the relations start with this edition.
[[revisions."2024-2025".casilla_overrides]]
selector = { revision = "2023", id = "02" }
fields = { input_kind = "bound", binding = "modelo-296-prev-216-base-retenciones", continuidad_evidence = "aeat-dr-296-2023 y aeat-dr-296-2024, registro tipo 1, posiciones 145-159: BASE RETENCIONES E INGRESOS A CUENTA. Ambos disenos exigen la suma algebraica de las bases de los registros de perceptor, con el mismo signo y desglose decimal; continua el mismo total, no una identidad inferida de su posicion.", continuidad_origin = "grounded" }
