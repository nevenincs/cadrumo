# The monthly cadence of RIRPF art. 108.1, paragraph two: the gran-empresa
# retenedor declares "en los veinte primeros dias naturales de cada mes, en
# relacion con las cantidades retenidas y los ingresos a cuenta que correspondan
# por el mes inmediato anterior". Each close below is READ from the bundled
# Calendario del Contribuyente of the year it falls in, never derived from that
# rule: the published day moves for weekends and holidays. The calendar names
# this modelo in the monthly population every month -- "<mes> <ejercicio>.
# grandes empresas: 111, 115, 117, 123, 124, 126, 128, 216, 230" -- under its own
# "Hasta el <dia> de <mes>" heading, which is the close taken here.
#
