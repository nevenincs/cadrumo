# These records state only label and legal-reference evolution. They do not
# classify renumbering or movement into a totals column as a different concept.
# The combined withholding base continues in the total column after the dividend/rest breakdown.
# The combined withholding and payments-on-account amount continues in the total column.
# The prior-year income amount retains its periodification role.
# The regularization amount retains its periodification role.
# The total remains withholding and payments on account plus regularization.
# The deduction remains prior paid results for the same concept, year and period, only for a complementary return.
# The payable result remains the withholding-plus-regularization total less prior paid results.
# The 2007 annex counts recipients. The replacement annex introduced by
# Orden HAC/56/2024 art. 1 counts income payments, separately for dividends and
# other income and in total. None of those three counts continues the old
# recipient-count measure; the reused printed number 01 is not identity.

