# Under-declaration advisory (no-silent-under-declaration). casilla 03 is the
# numero_rentas_total and casilla 06 the base_rentas_total. Neither is
# derived from the other -- they are separate declarations about the same
# period -- so a positive count against a zero base is a real observation
# about the filing rather than an arithmetic identity.
#
# The count-to-base pairing is used deliberately in preference to
# base-to-retencion, which would be the obvious choice and is unsafe here for
# the reason modelo 115's own predicate records: where a revision computes the
# retencion from the base, the implication holds by the arithmetic. It does not
# hold by arithmetic here, but the same reasoning selects the pair furthest
# from the engine's own additions.
#
# ADVISORY, not BLOCKING. implies_nonzero holds trivially when the antecedent
# is at or below zero, so a retenedor with no rentas in the period never fires
# it -- modelo 123 is filed quarterly even for a quarter with no activity.
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-123-2024-y-siguientes-base-declarada-cuando-rentas-positivas"
expression = 'implies_nonzero(["03", "06"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-90", "ley-35-2006:art-101"]

# The OTHER direction, and the one the predicate above deliberately did not take.
# Its note records base-to-retencion as "the obvious choice", passed over to stay
# furthest from the engine's own additions -- while stating in the same breath
# that the arithmetic-identity objection "does not hold by arithmetic here".
#
# It does not, and that is what makes this safe to declare: casilla 06 is
# add([04], [05]) and casilla 09 is add([07], [08]), two independent sums over
# separately manual leaves. Nothing derives 09 from 06, so a positive base total
# against a zero retenciones total is a real observation about the filing rather
# than something the engine could not have produced.
#
# Without it that direction is unguarded: a filer declaring a positive base and
# no withholding at all clears the count-to-base predicate, because its
# antecedent (the rentas count) and its consequent (the base) are both positive.
# RD 439/2007 art. 75 identifies the capital-mobiliario rents subject to
# withholding and its type-based exceptions, and art. 90 sets the positive rate
# for the base, so the pairing has no legitimate cause under either.
#
# ADVISORY, never BLOCKING: a category whose payer applied no withholding in one
# leaf while the other leaf covers it is legitimate, and must not refuse a draft.
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-123-2024-y-siguientes-base-total-implica-retenciones-total"
expression = 'implies_nonzero(["06", "09"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-75", "rd-439-2007:art-90", "ley-35-2006:art-101"]
