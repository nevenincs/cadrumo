# Modelo 123 -- IRPF/IS/IRNR retenciones sobre rendimientos del capital mobiliario
# -- fichero BOE, ejercicios 2019 a 2023.
#
# Transcribed position by position from the bundled AEAT Diseno de Registros
# cited in source_refs. Every offset and length below is read from that file;
# none is derived, inferred or rounded. This revision's design differs from its
# sibling's and is transcribed against its own.
#
# Two positions of the file envelope are deliberately left unwritten: AEAT's
# 'Version del Programa' and 'NIF Empresa Desarrollo' are its Nota 1 slots, to
# be filled by the entidad desarrolladora del software. No such identity is
# declared anywhere in this project, so writing either one would be inventing
# it. Modelo 131 leaves the same two slots unwritten.

