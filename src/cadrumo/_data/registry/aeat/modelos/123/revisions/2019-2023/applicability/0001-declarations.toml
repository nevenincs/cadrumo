[[revisions."2019-2023".applicability]]
id = "m123-seed"
applicable_entity_types = ["attribution_entity", "legal_entity", "natural_person"]
required_payer_fact = "pays_capital_income_with_retencion"
applicable_reason = "Modelo 123 (retenciones sobre determinados rendimientos del capital mobiliario): el contribuyente satisface rendimientos del capital mobiliario o determinadas rentas sujetas a retencion y autoliquida las retenciones practicadas."
not_applicable_reason = "Modelo 123 no aplica: solo corresponde a quien satisface determinados rendimientos o rentas del capital mobiliario sujetos a retencion."
legal_refs = ["ley-35-2006:art-25", "ley-35-2006:art-99", "orden-eha-3435-2007:anexo-ii", "orden-hac-56-2024:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101"]

# RIRPF art. 76.1: "Con carácter general, estarán obligados a retener o ingresar a cuenta, en
# cuanto satisfagan rentas sometidas a esta obligación: ... b) Los contribuyentes que ejerzan
# actividades económicas, cuando satisfagan rentas en el ejercicio de sus actividades." A natural
# person is a retenedor only through letter b); one that declares no actividad económica income is
# not, whatever it pays.
[[revisions."2019-2023".applicability.exclusions]]
id = "m123-sin-actividad"
entity_types = ["natural_person"]
lacking_income_categories = ["actividad_economica"]
reason = "Modelo 123 no aplica: la persona física solo está obligada a retener o ingresar a cuenta cuando ejerce actividades económicas y satisface rentas en el ejercicio de sus actividades (artículo 76.1.b del Reglamento del IRPF), y el perfil no declara una actividad económica, de modo que no actúa como retenedor de los rendimientos del capital mobiliario que satisface."
legal_refs = ["rd-439-2007:art-76"]
