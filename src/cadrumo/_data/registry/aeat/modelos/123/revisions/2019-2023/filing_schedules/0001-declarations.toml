# Both cadences of RIRPF art. 108.1 are declared, and the retenedor's own
# large-company condition selects between them. Paragraph one puts the ordinary
# retenedor on "los primeros veinte dias naturales de los meses de abril, julio,
# octubre y enero"; paragraph two moves the declaration to "los veinte primeros
# dias naturales de cada mes, en relacion con las cantidades retenidas y los
# ingresos a cuenta que correspondan por el mes inmediato anterior, cuando se
# trate de retenedores u obligados en los que concurran las circunstancias a que
# se refieren los numeros 1 y 2 del apartado 3 del articulo 71 del Reglamento
# del Impuesto sobre el Valor Anadido". Those two RIVA numbers are the
# volume-of-operations conditions over 6.010.121,04 EUR, which is the fact
# enrollment.large_company carries. AEAT's own Calendario del Contribuyente
# names the monthly population beside the quarterly one every month:
# "<mes> <ejercicio>. grandes empresas: 111, 115, 117, 123, 124, 126, 128, 216,
# 230".
#
# The public-administration axis Modelo 111 also declares is deliberately absent
# here. The art. 108.1 extension to "Administraciones publicas, incluida la
# Seguridad Social, cuyo ultimo Presupuesto anual aprobado ... supere la
# cantidad de 6 millones de euros" reaches only "las rentas a que se refieren
# los parrafos a) y c) del apartado 1 y el parrafo c) del apartado 2 del
# articulo 75", that is rendimientos del trabajo, rendimientos de actividades
# economicas and premios. Rendimientos del capital mobiliario are art. 75.1.b)
# and outside that list, so a public administration does not move this modelo to
# monthly on that ground.
#
# Neither schedule authors a window. The dates come from the governed
# deadlines.filing-window-clause fact, which declares both the quarterly and the
# monthly clause of this modelo, and the inhabil-day shift extends a close that
# falls on a non-working day. A schedule decides only that the obligation exists
# for the period. The 2024-y-siguientes edition inherits both schedules: the
# cadence is a RIRPF plazo, and the 2024 form redesign did not touch it.
[[revisions."2019-2023".filing_schedules]]
id = "modelo-123-trimestral"
period_kind = "quarterly"
periods = ["1T", "2T", "3T", "4T"]
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-108", "orden-eha-3435-2007:anexo-ii"]
source_refs = ["aeat-modelo-123-procedure"]

[[revisions."2019-2023".filing_schedules.profile_conditions]]
field = "enrollment.large_company"
op = "equals"
value = false
explanation = "Modelo 123 trimestral para el retenedor no sujeto a autoliquidacion mensual por gran empresa."
legal_refs = ["rd-439-2007:art-108"]
source_refs = ["aeat-modelo-123-procedure"]

[[revisions."2019-2023".filing_schedules]]
id = "modelo-123-mensual"
period_kind = "monthly"
periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-108", "orden-eha-3435-2007:anexo-ii"]
source_refs = ["aeat-calendario-contribuyente-2022", "aeat-calendario-contribuyente-2023"]

[[revisions."2019-2023".filing_schedules.profile_conditions]]
field = "enrollment.large_company"
op = "equals"
value = true
explanation = "Modelo 123 mensual para grandes empresas: el retenedor en las circunstancias de los numeros 1 y 2 del articulo 71.3 del Reglamento del IVA declara por el mes inmediato anterior."
legal_refs = ["rd-439-2007:art-108"]
source_refs = ["aeat-calendario-contribuyente-2022", "aeat-calendario-contribuyente-2023"]
