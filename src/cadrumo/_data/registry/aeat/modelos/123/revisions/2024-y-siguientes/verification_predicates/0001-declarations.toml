# Under-declaration advisory (no-silent-under-declaration). casilla 03 is the
# numero_rentas_total and casilla 06 the base_rentas_total. Neither is
# derived from the other -- they are separate declarations about the same
# period -- so a positive count against a zero base is a real observation
# about the filing rather than an arithmetic identity.
#
# The count-to-base pairing is used deliberately in preference to
# base-to-retencion, which would be the obvious choice and is unsafe here for
# the reason modelo 115's own predicate records: where a revision computes the
# retencion from the base, the implication holds by the arithmetic. It does not
# hold by arithmetic here, but the same reasoning selects the pair furthest
# from the engine's own additions.
#
# ADVISORY, not BLOCKING. implies_nonzero holds trivially when the antecedent
# is at or below zero, so a retenedor with no rentas in the period never fires
# it -- modelo 123 is filed quarterly even for a quarter with no activity.
[[revisions."2024-y-siguientes".verification_predicates]]
id = "implies-nonzero:base-total-implica-retenciones-total"
predicate_id = "modelo-123-2024-y-siguientes-base-total-implica-retenciones-total"
expression = 'implies_nonzero(["06", "09"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-75", "rd-439-2007:art-90", "ley-35-2006:art-101"]
