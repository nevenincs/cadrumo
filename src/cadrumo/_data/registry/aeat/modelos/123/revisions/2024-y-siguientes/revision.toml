# 2019-2023 edition grounds modelo-123-mensual on the Calendario del
# Contribuyente of its own two years, and neither reaches this edition: a
# calendar that stopped applying on 2022-12-31 cannot defend a 2024 filing, and
# the snapshot source-window check refuses the revision for citing it. The three
# calendars named here are the ones this revision's own source_refs already
# carry, and each names this modelo in the monthly population of its year --
# "<mes> <ejercicio>. grandes empresas: 111, 115, 117, 123, 124, 126, 128, 216,
# 230". The quarterly schedule needs no override because it cites
# aeat-modelo-123-procedure, which applies from 2020 with no end.
