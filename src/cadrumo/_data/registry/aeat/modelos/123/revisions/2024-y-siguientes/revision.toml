[revisions."2024-y-siguientes".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo is a withholding agent's return: its withholding boxes state what the declarant practised on others and paid in, never a credit of the declarant's own, so there is no credit casilla for an entry to name. The perceptor credits that withholding on the perceptor's own return."""
legal_refs = ["ley-35-2006:art-25", "ley-35-2006:art-99", "orden-eha-3435-2007:anexo-ii", "orden-hac-56-2024:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101"]
source_refs = ["aeat-calendario-contribuyente-2024", "aeat-calendario-contribuyente-2025", "aeat-calendario-contribuyente-2026", "aeat-dr-123-2024-v20", "aeat-dr-123-2024-v20-form-text", "aeat-modelo-123-procedure", "boe-modelo-123-2024-form", "boe-modelo-123-2024-form-text"]

[revisions."2024-y-siguientes".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-123-2024-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through \
the same revision."""
legal_refs = [
    "ley-35-2006:art-25",
