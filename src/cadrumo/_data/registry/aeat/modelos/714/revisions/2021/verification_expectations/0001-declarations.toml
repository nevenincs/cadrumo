# Calculation verification for Modelo 714 (Impuesto sobre el Patrimonio,
# Ley 19/1991). Enrolls the always-present computed final: cuota integra
# (`patrimonio.cuota-integra`, casilla 29, art. 30), present in every filed
# declaration, so min_coverage = 1 holds without breaking a legitimate filing.
# The other computed casilla, `patrimonio.reduccion-limite-80` (casilla 39,
# art. 31.1.b limite conjunto), is a situational reduction that is not
# guaranteed present in every extraction, so it is deliberately NOT enrolled at
# min_coverage = 1 (per the calibrated-enrollment discipline). Grounded in the
# modelo's own AEAT procedure and BOE layout source_refs.
# Exhaustive reconcile-when-present verification for Modelo 714
# revision 2021-y-siguientes: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-714-calculation-verification).

[[revisions.2021.verification_expectations]]
id = "modelo-714-calculation-verification"
tolerance = "0.01"
rounding = "money-2"
min_coverage = "1"
computed_casilla_ids = ["patrimonio.cuota-integra"]
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-19-1991:art-30"]
source_refs = ["aeat-modelo-714-procedure", "boe-modelo-714-layout"]

[[revisions.2021.verification_expectations]]
id = "modelo-714-y-siguientes-reconcile-when-present"
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = ["patrimonio.irpf-bases-imponibles", "patrimonio.limite-conjunto", "patrimonio.irpf-cuotas-integras", "patrimonio.suma-cuotas-limite", "patrimonio.exceso-limite-conjunto", "patrimonio.reduccion-limite-80", "patrimonio.total-cuota-integra"]
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-19-1991:art-30", "ley-19-1991:art-31"]
source_refs = ["aeat-modelo-714-procedure", "boe-modelo-714-layout"]
