# Identidad revisada contra las ayudas oficiales AEAT de ambos ejercicios,
# apartados 4.1.1 (sujeto pasivo), 4.1.4 (complementaria) y 4.1.5 (residencia).
# La ayuda 2021 corrige la referencia 2020 que conserva el diseno de ese ejercicio.
# En 2025, la expresion o anterior explicita la continuidad de la opcion personal;
# no cambia su ejercicio inicial ni crea otra modalidad de tributacion.

