legal_refs = ["ley-19-1991:art-28", "ley-19-1991:art-30", "ley-19-1991:art-31", "ley-35-2006:art-48", "ley-35-2006:art-49", "ley-35-2006:art-63", "ley-35-2006:art-74", "orden-hac-265-2024:art-4"]
