    "ley-19-1991:art-28",
    "ley-19-1991:art-30",
    "ley-19-1991:art-31",
    "ley-19-1991:art-4-9",
    "orden-hac-265-2024:art-2",
    "orden-hac-265-2024:art-4",
]
