# Modelo 714 cuota íntegra (casilla 29) = escala estatal aplicada a la base
# liquidable (Ley 19/1991 art. 30). Mirrors the IRPF escala pattern: the
# `lookup_bracket` op applies the progressive bracket_table parameter to the
# base-liquidable casilla, yielding fixed_addition + (base - lower_bound) *
# marginal_rate for the matched bracket. The escala is the STATE default
# (subsidiaria a la escala autonómica); Phase-B implements the state baseline.

[[revisions."2021".formulas]]
id = "patrimonio-cuota-integra-escala-estatal"
target_casilla_id = "patrimonio.cuota-integra"
expression = { op = "lookup_bracket", args = [
    { casilla_id = "patrimonio.base-liquidable" },
    { parameter = "patrimonio-escala-estatal" },
] }
rounding = "money-2"
legal_refs = ["ley-19-1991:art-30"]
additional_source_refs = ["aeat-manual-patrimonio-2021"]

[[revisions."2021".formulas.source_citations]]
source_ref = "aeat-manual-patrimonio-2021"
required_text = ["patrimonio neto"]
# Modelo 714 casilla 39 = 80 % de la cuota íntegra del Impuesto sobre el
# Patrimonio (suelo de la reducción por el límite conjunto IP+IRPF, Ley 19/1991
# art. 31). The límite conjunto (art. 31) caps the combined IP+IRPF cuota at 60 %
# of the computable IRPF bases imponibles, after the article's exclusions, but
# the IP-cuota reduction may not exceed 80 % of the IP cuota íntegra (so the IP
# cuota cannot fall below 20 % of its íntegra).
# Casilla 39 is that 80 %-reference value, computed unconditionally from the
# cuota íntegra (casilla 29). The "80 por 100" figure is carried as the
# art.31 parameter `patrimonio-reduccion-maxima-limite-conjunto-porcentaje`
# and verified against the bundled authoritative corpus
# `ley-19-1991-art-31.html`.

[[revisions."2021".formulas]]
id = "patrimonio-reduccion-limite-80-suelo"
target_casilla_id = "patrimonio.reduccion-limite-80"
expression = { op = "percent", args = [
    { casilla_id = "patrimonio.cuota-integra" },
    { parameter = "patrimonio-reduccion-maxima-limite-conjunto-porcentaje" },
] }
rounding = "money-2"
legal_refs = ["ley-19-1991:art-31"]
additional_source_refs = ["aeat-manual-patrimonio-2021"]

[[revisions."2021".formulas.source_citations]]
source_ref = "aeat-manual-patrimonio-2021"
required_text = ["patrimonio neto"]
# `aeat-modelo-100-procedure` is deliberately absent from the source_refs below.
# It is AEAT's live Renta procedure landing page, retrieved 2026-05-05 and
# applying from 2025-01-01, so it cannot evidence a filing for this ejercicio.
#
# The per-year revision split did not create that mismatch, it EXPOSED it. Under
# the previous open-ended "2021-y-siguientes" revision the citation was valid only
# by accident: the revision's window happened to stretch far enough to contain
# 2025. A 2025-onward procedure page never evidenced a 2021 filing. The grounding
# here is the standing legal articles, which are year-appropriate on their own.
# Modelo 714 Ley 19/1991 art. 31 same-year joint limit.
#
# M100 supplies the broad same-year IRPF bases and cuotas. The exclusion slices
# that art.31 requires but M100 does not expose at filing-grade granularity are
# explicit M714 inputs: casillas 31, 32, 35 and 36. This avoids deriving the
# limite conjunto from broad M100 totals alone.

[[revisions."2021".formulas]]
id = "patrimonio-irpf-bases-imponibles-m100"
target_casilla_id = "patrimonio.irpf-bases-imponibles"
expression = { op = "add", args = [
    { binding = "m714-m100-base-imponible-general" },
    { binding = "m714-m100-base-imponible-ahorro" },
] }
rounding = "money-2"
legal_refs = ["ley-19-1991:art-31", "ley-35-2006:art-48", "ley-35-2006:art-49"]

[[revisions."2021".formulas.source_citations]]
