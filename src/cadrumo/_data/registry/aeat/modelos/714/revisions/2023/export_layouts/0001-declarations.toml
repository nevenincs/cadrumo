# Positions 93-96 (Version del Programa) and 101-109 (NIF Empresa Desarrollo)
# carry the design's "(**) A cumplimentar por las entidades desarrolladoras
# (EEDD)" marking. No such developer identity is declared anywhere in this
# project, so they are deliberately left unwritten rather than guessed, exactly
# as Modelo 131 records for the same pair of slots.
# The indicador de pagina complementaria was a FILLER, which writes blanks
# unconditionally. AEAT declares this position as the operator's own
# complementaria mark, so a filler silently blanks a real flag and a
# declarant filing a complementaria could never set it. Carried by a text
# manual_input binding instead: it renders the operator's value verbatim.
