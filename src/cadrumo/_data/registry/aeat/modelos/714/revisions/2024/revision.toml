    "ley-19-1991:art-28",
    "ley-19-1991:art-30",
    "ley-19-1991:art-31",
    "ley-19-1991:art-4-9",
    "orden-hac-242-2025:art-2",
    "orden-hac-242-2025:art-4",
]
