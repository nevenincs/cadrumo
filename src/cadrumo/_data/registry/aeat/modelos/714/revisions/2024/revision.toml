[revisions."2024".family_dispositions.verification_predicates]
reason = "A verification predicate asserts an implication between two figures. Modelo 714 offers none that holds, and the MINIMO EXENTO is why. Its base liquidable (casilla 27) is the base imponible less the exempt minimum of Ley 19/1991 art. 28, so a taxpayer with substantial declared patrimonio and a ZERO base liquidable and zero cuota is the ordinary lawful case, not a defect -- exactly the false-firing shape this campaign refused when choosing modelo 111 antecedent away from its threshold-scaled trabajo block. The pairing that would not false-fire, base liquidable to cuota integra, is tautological instead: casilla 29 is COMPUTED from 27 by the art. 30 scale, so the implication holds by the arithmetic. Every candidate pair is therefore either unlawfully strict or vacuous, and the family has nothing to say on this revision."
legal_refs = ["ley-19-1991:art-28", "ley-19-1991:art-30", "ley-19-1991:art-31"]
source_refs = ["aeat-modelo-714-procedure", "boe-modelo-714-layout"]

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = "Every casilla id this revision declares is declared with the same id in the immediately prior revision (the two id sets were compared mechanically and found identical), so no from_revision != to_revision transition exists to declare; the family is empty by fact, not by omission."
