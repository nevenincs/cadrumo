# `aeat-modelo-100-procedure` is deliberately absent from the source_refs below.
# It is AEAT's live Renta procedure landing page, retrieved 2026-05-05 and
# applying from 2025-01-01, so it cannot evidence a filing for this ejercicio.
#
# The per-year revision split did not create that mismatch, it EXPOSED it. Under
# the previous open-ended "2021-y-siguientes" revision the citation was valid only
# by accident: the revision's window happened to stretch far enough to contain
# 2025. A 2025-onward procedure page never evidenced a 2021 filing. The grounding
# here is the standing legal articles, which are year-appropriate on their own.
# Modelo 714 (patrimonio) construct.
#
# Phase-A landed the manual-casilla surface and official source grounding.
# Phase-B computes the cuota íntegra (casilla 29) from the Ley 19/1991 art. 30
# escala estatal and the art. 31 same-year IRPF joint-limit chain through
# casilla 40. M100 broad bases/quotas enter through same-year relations; art.31
# exclusion slices that M100 does not expose stay explicit M714 manual inputs.
# The remaining deduction/bonification result chain (45/55) stays manual pending
# its own official formula evidence.

# The ejercicio's own orden art. 4 and its bundled Diseno de Registros join the
# construct's refs because its member casillas now carry them: the box numbering
# and segmento each member declares are read from that design, and the orden is
# what approves the form those boxes are printed on.
