[[revisions."2021".applicability]]
# Ley 19/1991 art. 37 obliges a filing only when the cuota, after deductions and
# bonificaciones, is payable or, failing that, the assets and rights exceed 2.000.000 euros.
# Being a natural person is not enough, so the declared answer decides.
id = "m714-seed"
applicable_entity_types = ["natural_person"]
required_payer_fact = "patrimonio_declaration_threshold_met"
applicable_reason = "Modelo 714 (Impuesto sobre el Patrimonio): la persona fisica cuya cuota tributaria resulte a ingresar conforme al articulo 37 de la Ley 19/1991, o cuyo valor de bienes y derechos supere los 2.000.000 de euros aun resultando cuota negativa, queda obligada a declarar."
not_applicable_reason = "Modelo 714 no aplica: el Impuesto sobre el Patrimonio solo alcanza a la persona fisica, y solo cuando resulte cuota a ingresar o el valor de sus bienes y derechos supere el umbral de declaracion."
cuota_bearing = true
legal_refs = ["ley-19-1991:art-37", "ley-19-1991:art-28", "ley-19-1991:art-30", "ley-19-1991:art-31"]
