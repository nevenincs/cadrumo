# Ejercicio 2022. The art. 30 escala estatal, the art. 28 minimo exento
# framework and the art. 31 percentages are the same as 2021's because the LAW
# is the same, not because 2021 was copied. Read from the BOE consolidated text
# of Ley 19/1991 (BOE-A-1991-14392) on 2026-08-15, per each article's own
# amendment notes: art. 30 was last amended by art. 66 of Ley 11/2020
# (BOE-A-2020-17339), effective 1 January 2021, and not since; art. 28 was last
# amended by Real Decreto-ley 13/2011 (BOE-A-2011-14809); art. 31's current text
# takes effect 1 January 2021 and has not been amended since. Ley 38/2022, which
# created the Impuesto Temporal de Solidaridad de las Grandes Fortunas, amends
# this ley at ARTICLE 5.Uno only (BOE-A-2022-22684) and leaves arts 28, 30 and 31
# untouched.
# Modelo 714 (Impuesto sobre el Patrimonio) escala estatal por defecto.
#
# Ley 19/1991 art. 30 cuota íntegra: la base liquidable se grava a la escala
# aprobada por la Comunidad Autónoma; en su defecto, a esta escala estatal
# subsidiaria. Authored verbatim from the BUNDLED authoritative corpus
# `corpus/normatives/html/ley-19-1991-art-30.html` (BOE-A-1991-14392 texto
# consolidado) — the eight-bracket 0,2-3,5 % progressive tarifa. Each bracket's
# `fixed_addition` is the published cumulative "Cuota" at the bracket's lower
# bound, and `upper_bound` is the next lower bound (the published "Resto base
# liquidable hasta" widths sum to these boundaries). This is the STATE default;
# a CCAA that approves its own escala overrides it (out of scope for Phase-B's
# state-baseline calc).

