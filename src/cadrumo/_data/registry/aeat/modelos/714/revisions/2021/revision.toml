[revisions."2021"]
authority_grade = "filing"
# One of five ejercicio-scoped revisions replacing the prior single open-ended
# "2021-y-siguientes" revision, which cited a stub (orden-hac-1023-2021:modelo-714)
# whose document_id resolved to an unrelated municipal resolution. The real
# governing instrument is a joint IRPF+Patrimonio orden published each March,
# already bundled in this corpus for Modelo 100's half and never previously cited
# for Modelo 714's half. Article numbering confirmed stable across all five years
# (art 2 = Patrimonio obligation, art 4 = Patrimonio model approval, art 8 = joint
# deadline) by reading each file's own id="a2"/id="a4" body content directly.
valid_from = 2021-01-01
valid_to = 2021-12-31
period_selector = { years = [2021], periods = ["0A"] }
legal_refs = [
    "ley-19-1991:art-28",
    "ley-19-1991:art-30",
    "ley-19-1991:art-31",
    "ley-19-1991:art-4-9",
    "orden-hfp-207-2022:art-2",
    "orden-hfp-207-2022:art-4",
]
orden_aplicabilidad = [
    "orden-hfp-207-2022:art-4",
]
source_refs = [
    "aeat-modelo-714-procedure",
    "boe-modelo-714-layout",
    # The ejercicio-2021 record design. Already registered, and already cited
    # by this revision's own export layout, but missing from the revision's
    # declared evidence -- the only one of the five ejercicio revisions
    # without it, while 2022-2025 each cite their matching edition.
    "aeat-dr-714-2021",
]


[revisions."2021".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2021' of modelo 714 has no strictly-earlier sibling revision of this modelo (valid_from 2021-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "ley-19-1991:art-28",
    "ley-19-1991:art-30",
    "ley-19-1991:art-31",
    "ley-19-1991:art-4-9",
    "orden-hfp-207-2022:art-2",
    "orden-hfp-207-2022:art-4",
]
source_refs = [
    "aeat-modelo-714-procedure",
    "boe-modelo-714-layout",
]

[revisions."2021".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-714-fichero-aeat) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "ley-19-1991:art-28",
    "ley-19-1991:art-30",
    "ley-19-1991:art-31",
    "ley-19-1991:art-4-9",
    "orden-hfp-207-2022:art-2",
    "orden-hfp-207-2022:art-4",
]
source_refs = [
