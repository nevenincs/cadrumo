
# Modelo 714 casillas for ejercicio 2024, derived row by row from the
# bundled Diseno de Registros (03-714-ejercicio-2024.xls). The `number` is the box number
# the design prints in square brackets; `segmento` is the record page on which
# the box is defined. Boxes reprinted on the resumen or ingreso pages are the
# same box carried forward, not a second casilla.
#
# Two independent box-number series share this form: the identification page's
# domicilio and modalidad boxes, and the declaration's [01]-[63]. They collide
# on 15-28 and 35-42, which is why every casilla here declares a segmento.

