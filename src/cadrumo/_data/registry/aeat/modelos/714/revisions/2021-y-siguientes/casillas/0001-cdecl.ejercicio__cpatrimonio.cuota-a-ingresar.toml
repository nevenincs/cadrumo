# Modelo 714 (Impuesto sobre el Patrimonio) — casilla schema.
#
# Authored from the AEAT diseño de registro DR714_2025.xls (Orden HAC/1023/2021,
# corpus/aeat_official/disenos_registro/modelo_714/), sheet "714-10 Patrimonio"
# (liquidación). The registry computes the art. 30 cuota íntegra scale
# (casilla 29) and the art. 31 same-year IRPF joint-limit chain through casilla
# 40. M100 supplies only the broad IRPF base/quota outputs; the art.31 exclusion
# slices that M100 does not expose stay explicit M714 manual inputs (31, 32, 35,
# 36) instead of being guessed. The later deduction/bonification result chain
# (45/55) remains manual. The vivienda habitual exemption remains grounded in
# art. 4.Nueve on the base-imponible input.

