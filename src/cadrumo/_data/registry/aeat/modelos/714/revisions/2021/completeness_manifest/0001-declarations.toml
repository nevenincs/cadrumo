# Modelo 714 calculation-completeness manifest.
#
# Enumerates the casillas in this revision's calculation closure. Phase-B
# implements the cuota íntegra (casilla 29) and the Ley 19/1991 art.31
# same-year joint-limit chain through casilla 40. The closure includes M100-fed
# computed casillas 30/34, explicit manual exclusion inputs 31/32/35/36, and
# computed casillas 33/37/38/39/40. The remaining deduction/bonification result
# chain (45/55) stays a manual foundation until its own formula evidence lands.
#
# The manifest's per-casilla metadata is the box number and record segment the
# ejercicio's own Diseno de Registros prints. Before the per-year split two of
# these rows carried no box number at all -- base-imponible and base-liquidable
# repeated their own id in the number field -- and none carried a segmento,
# because nothing had been read off the design yet. They now name boxes 25 and
# 27 on record page 714-09, which is where the form prints them.

[revisions."2021".completeness_manifest]
source_ref = "aeat-modelo-714-procedure"
legal_refs = ["ley-19-1991:art-28", "ley-19-1991:art-30", "ley-19-1991:art-31", "ley-35-2006:art-48", "ley-35-2006:art-49", "ley-35-2006:art-63", "ley-35-2006:art-74", "orden-hfp-207-2022:art-4"]
