[revisions."2025-y-siguientes".family_dispositions.projection_endpoints]
reason = """
A projection endpoint's projection_ref accepts only FilingProjectionRef, which is a CLOSED discriminated union in cadrumo.core whose every member is an m303_ engine-computed IVA fact. No declaration naming this modelo's own rows can validate against it, so the family is empty by construction rather than by omission -- the same structural reading modelo 131 already records for its own repeating rows. This modelo's repetition is served by the other mechanism: its repeated detail rows materialise \
from BINDING values, which is what an authored ExportRecordDefinition expresses with repeat == \"binding_rows\". Modelo 184 declares exactly that family of row bindings -- modelo-184-member-row-nif, -name, -share and -base-assigned -- one per socio, heredero o participe of the entidad en regimen de atribucion de rentas, so the rows come from binding values and never from a projection endpoint."""
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-89", "orden-hap-2250-2015:art-1"]
source_refs = ["aeat-dr-184-2025", "aeat-modelo-184-procedure"]

[revisions."2025-y-siguientes".family_dispositions.formulas]
reason = """
Modelo 184 is a pure declaracion INFORMATIVA. Under the regimen de atribucion de rentas (Ley 35/2006 arts. 86 to 89) the entidad is not itself a taxpayer: the renta is attributed to each socio, heredero or participe and taxed in THEIR hands, on their own IRPF, IS or IRNR return. Article 93 of the LGT is what obliges the entidad to REPORT that attribution. This modelo therefore determines no base and no cuota of its own. Measured on the revision itself: six casillas, none declaring a formula_id, \
zero formulas, and no cuota-bearing casilla. There is nothing for a formula to compute -- every casilla carries a value the entidad reports, never one this registry derives."""
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-88", "ley-35-2006:art-89", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-184-2025", "aeat-modelo-184-procedure"]

[revisions."2025-y-siguientes".family_dispositions.parameters]
reason = """
Modelo 184 is a pure declaracion INFORMATIVA. Under the regimen de atribucion de rentas (Ley 35/2006 arts. 86 to 89) the entidad is not itself a taxpayer: the renta is attributed to each socio, heredero or participe and taxed in THEIR hands, on their own IRPF, IS or IRNR return. Article 93 of the LGT is what obliges the entidad to REPORT that attribution. This modelo therefore determines no base and no cuota of its own. Measured on the revision itself: six casillas, none declaring a formula_id, \
zero formulas, and no cuota-bearing casilla. A parameter carries a rate, bracket, threshold or coefficient a calculation applies. This modelo applies none: the tipo and the reductions belong to each member's own return, under their own regime, and encoding them here would place one taxpayer's rate schedule on another's informative report."""
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-88", "ley-35-2006:art-89", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-184-2025", "aeat-modelo-184-procedure"]
[revisions."2025-y-siguientes".family_dispositions.dependency_classifications]
reason = """
Modelo 184 is a pure declaracion INFORMATIVA. Under the regimen de atribucion de rentas (Ley 35/2006 arts. 86 to 89) the entidad is not itself a taxpayer: the renta is attributed to each socio, heredero or participe and taxed in THEIR hands, on their own IRPF, IS or IRNR return. Article 93 of the LGT is what obliges the entidad to REPORT that attribution. This modelo therefore determines no base and no cuota of its own. Measured on the revision itself: six casillas, none declaring a formula_id, \
zero formulas, and no cuota-bearing casilla. A dependency classification declares a source modelo this one's calculation depends on in an earlier or enclosing period. Having no calculation, this modelo has no such dependency; its content is the attribution the entidad reports for the ejercicio being declared."""
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-88", "ley-35-2006:art-89", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-184-2025", "aeat-modelo-184-procedure"]

[revisions."2025-y-siguientes".family_dispositions.verification_predicates]
reason = """
Modelo 184 is a pure declaracion INFORMATIVA. Under the regimen de atribucion de rentas (Ley 35/2006 arts. 86 to 89) the entidad is not itself a taxpayer: the renta is attributed to each socio, heredero or participe and taxed in THEIR hands, on their own IRPF, IS or IRNR return. Article 93 of the LGT is what obliges the entidad to REPORT that attribution. This modelo therefore determines no base and no cuota of its own. Measured on the revision itself: six casillas, none declaring a formula_id, \
zero formulas, and no cuota-bearing casilla. A verification predicate guards a calculated result -- characteristically that a positive economic input did not produce a zero base or cuota. With no base and no cuota computed here, there is no such implication to assert. The under-declaration risk this family exists to catch lives on each member's own return, where the attributed renta is actually taxed."""
legal_refs = ["ley-35-2006:art-86", "ley-35-2006:art-88", "ley-35-2006:art-89", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-184-2025", "aeat-modelo-184-procedure"]

