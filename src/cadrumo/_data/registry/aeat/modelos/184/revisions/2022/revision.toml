# This epoch's own BOE document is the anexo of a multi-modelo amending orden,
# which republishes just the blocks it changes, so no complete map is
# reconstructable by parsing it alone. The complete ejercicio 2022 map is
# nevertheless fixed by the official record: the consolidated AEAT design for
# ejercicio 2023 differs from it only by the two socio campos Orden
# HFP/1284/2023 art. 14 adds (orden-hfp-1284-2023.html.extracted.md:1350-1389),
# and AEAT lists no other orden in between (modelo-184-procedure.html:40). The
# record-design casillas, member-row bindings, applicability, filing schedule,
# live cross-references, portal and extractor links, extraction profile and
# informative construct are therefore stated here and inherited forward. The
# export layout, completeness manifest, verification expectation and
# record-design workbook pin stay on 2023-2024: they are per-edition claims
# over a generated layout that exists only from the AEAT 2023 design on.
# The grade stays 'applicability'; nothing here promotes it.
valid_from = 2022-01-01
valid_to = 2022-12-31
period_selector = { year_from = 2022, year_to = 2022, periods = ["0A"] }
orden_aplicabilidad = ["orden-hap-2250-2015:art-1"]
legal_refs = ["orden-hap-2250-2015:art-1", "orden-hap-2250-2015:art-4", "ley-58-2003:art-93"]
source_refs = ["boe-dr-184-2022", "boe-modelo-184-2015-form", "aeat-modelo-184-procedure"]
family_storage_baseline = "2019-2021"
scoped_families = ["workbook_parity_refs"]
review_status = "agent_reviewed"
reviewed_by = """\
agent: re-review on 2026-09-30 of the ejercicio 2022 edition against the members stated on \
it since the 2026-09-19 review. SCOPE -- an applicability-grade delta over 2019-2021; this \
review covers what it states and hydrates. VERIFIED -- CASILLAS: 84 hydrate, the two \
headers and 82 positional spans (declarante 15, entidad 45, socio 22), and every span is \
printed at its own record in the consolidated AEAT design \
02-184-orden-hap-2250-2015-actualizado-por-orden-hfp-1284-2023 (records from lines 51, 291 \
and 1784 of its extraction). That design differs from the ejercicio 2022 layout only by \
the socio campos 203-215 and 216-229 that Orden HFP/1284/2023 art. 14 adds \
(orden-hfp-1284-2023.html.extracted.md:1350-1389); Orden HFP/1192/2022 art. quinto ends \
the 2022 socio content at position 202 (orden-hfp-1192-2022.html.extracted.md:244-259), \
and no casilla here passes 202. VERIFIED -- BINDINGS: 17 member-row bindings hydrate, \
including modelo-184-member-row-reduccion, now stated here. Its campo REDUCCION, socio \
positions 109-119, is laid out by the Orden HAP/2250/2015 anexo \
(orden-hap-2250-2015.html.extracted.md:764-773) and untouched by Orden HAC/1276/2019 art. \
sexto, which changes entidad positions 266-500 only \
(orden-hac-1276-2019.html.extracted.md:370-545), and by Orden HFP/1192/2022 art. quinto. \
It cites ley-35-2006:art-23-2021 and ley-35-2006:art-32-2015, both in force at the \
2022-12-31 devengo; 2023-2024 keys art-23 and art-32. VERIFIED -- every legal and source \
reference the hydrated edition cites has a window reaching ejercicio 2022. NOT CLAIMED -- \
BOE-A-2022-20274 (Orden HFP/1192/2022) is a multi-modelo amending orden whose anexo \
republishes only the blocks it changes, so no complete ejercicio 2022 map is parsed from \
it; the map rests on the consolidated 2023 design and the amending ordenes named above. \
NOT CLAIMED -- no export layout, completeness manifest, verification expectation or \
workbook pin is carried here; the grade stays applicability. NOT CLAIMED -- no independent \
AEAT oracle checked any value. No human operator has countersigned this."""
reviewed_at = 2026-09-30
reviewed_against = "2019-2021"

