reviewed_by = "agent: applicability-only historical epoch. BOE-A-2022-20274 is not a modelo 184 diseno de registro: it is Orden HFP/1192/2022, a multi-modelo amending orden covering modelos 181, 184, 196, 198, 280 and 289, so its anexo republishes only the blocks that orden changed. Strict parsing reads the record from position 103 and reports positions 1-102, 111-113, 166-171 and 173-199 of the declared 500 as never printed in this document. That is a property of the source, not a parser gap, so the criterion previously recorded here -- a complete strict parse from position 1 -- is unreachable and must not be waited on. AEAT's own diseno index for modelo 184 publishes consolidated workbooks only for the 2023-2024 and 2025 epochs and links the raw ordenes for every earlier one, so no AEAT workbook for this epoch is pending publication. No casillas, bindings, export layout, or continuity claim is declared. Promotion requires reconstructing this epoch's layout as a delta over the 2019-2021 baseline from the blocks this orden republishes, independently compared against BOE-A-2022-20274."
