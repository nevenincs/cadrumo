# Ranges EXCLUDE the leading sign position where the design declares one, which
# is the convention the revision's pre-existing casillas already follow:
# `tipo2.renta-atribuible-importe` is numbered 178-190 against an anchor at
# 177+14, the extra byte being the sign.

