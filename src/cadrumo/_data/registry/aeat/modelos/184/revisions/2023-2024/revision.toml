reason = """
Modelo 184 is a pure declaracion INFORMATIVA. Under the regimen de atribucion de rentas (Ley 35/2006 arts. 86 to 89) the entidad is not itself a taxpayer: the renta is attributed to each socio, heredero or participe and taxed in THEIR hands, on their own IRPF, IS or IRNR return. Article 93 of the LGT is what obliges the entidad to REPORT that attribution. This modelo therefore determines no base and no cuota of its own. Measured on the revision itself: six casillas, none declaring a formula_id, \
zero formulas, and no cuota-bearing casilla. A dependency classification declares a source modelo this one's calculation depends on in an earlier or enclosing period. Having no calculation, this modelo has no such dependency; its content is the attribution the entidad reports for the ejercicio being declared."""
