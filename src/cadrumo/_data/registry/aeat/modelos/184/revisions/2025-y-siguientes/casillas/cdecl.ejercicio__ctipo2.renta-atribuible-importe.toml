# The abstract declaration type has no box of its own on this design. AEAT
# prints only the two flags that qualify it -- complementaria and sustitutiva,
# at positions 121-122, carried by 'decl.complementaria-sustitutiva' -- and an
# ordinaria declaration is the unmarked case, expressed by leaving both blank.
