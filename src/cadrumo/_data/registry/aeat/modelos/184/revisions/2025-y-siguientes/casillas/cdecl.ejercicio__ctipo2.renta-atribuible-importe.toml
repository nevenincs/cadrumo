# 'tipo2.miembro-nif' at 9-17 was removed: no such field exists at those
# positions in any record of either bundled design epoch. Both the 2023 and the
# 2025 diseño print "9-17 Alfanumerico NIF DEL DECLARANTE" in every record, and
# record 2's own 18-26 is "N.I.F. ENTIDAD -- Consignar lo contenido en el campo
# 'N.I.F. del Declarante', posiciones 9-17 del registro de tipo 1", a copy of
# the declarante rather than a member. The member's NIF is record 3's 18-26 and
# is already modelled correctly as 'tipo3.miembro-nif'. Left in place it bound a
# casilla named for the member to the bytes carrying the DECLARANTE's NIF.
export_refs = ["m184-2025.entidad.f010"]
[[revisions."2025-y-siguientes".casillas]]
id = "tipo2.renta-atribuible-importe"
# AEAT prints this row as "177-190 Alfanumerico RENTA ATRIBUIBLE / RENDIMIENTO
# NETO ATRIBUIBLE...", a 14-position field, and its sibling amount at 151-164
# spans its full declared width the same way. The previous "178-190" was one
# byte short at the start, which would have left position 177 unwritten.
number = "177-190"
segmento = "184-2-entidad"
section = ["declarado", "renta"]
data_type = "money"
semantic_role = "renta_atribuible_importe"
