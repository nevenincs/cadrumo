# AEAT's diseño de registro declares this date as THREE independently
# numbered rows -- dr-12 Día, dr-13 Mes, dr-14 Año, each its own Num
# field with no "se subdivide" parent language -- unlike a genuine
# parent-with-subparts field (e.g. Modelo 180's % RETENCIÓN), so this is
# a real concatenation and is modelled as three casillas, one per
# AEAT-declared row, rather than one combined text slot.
