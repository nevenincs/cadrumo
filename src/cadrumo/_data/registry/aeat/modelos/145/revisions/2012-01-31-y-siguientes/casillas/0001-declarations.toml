# Modelo 145 payer-communication fields, grounded in the current AEAT form and
# the DR145 v2.0 record design (articulo 88 del Reglamento del IRPF). The
# `number` values are DR145 row ordinals, NOT AEAT filing casilla boxes; Modelo
# 145 is a local payer communication, not an AEAT filing. The companion export
# layout renders DR145 byte positions without adding an AEAT filing surface.
# --- Apartado 1: datos del perceptor ---
# AEAT's diseño de registro declares this date as THREE independently
# numbered rows -- dr-12 Día, dr-13 Mes, dr-14 Año, each its own Num
# field with no "se subdivide" parent language -- unlike a genuine
# parent-with-subparts field (e.g. Modelo 180's % RETENCIÓN), so this is
# a real concatenation and is modelled as three casillas, one per
# AEAT-declared row, rather than one combined text slot.
# --- Apartado 2: hijos y otros descendientes menores de 25 anios (cuatro slots) ---
# --- Apartado 3: ascendientes mayores de 65 anios (dos slots) ---
# --- Apartado 4: pensiones ---
# --- Apartado 5: vivienda habitual ---
# --- Apartado 6: fecha y firma de la comunicacion ---
# Same shape as the perceptor movilidad-geografica date above: AEAT
# declares dr-48 Dia, dr-49 Mes, dr-50 Año as three independently
# numbered Num rows, so this is a concatenation, modelled as three
# casillas.
# --- Apartado 7: acuse de recibo del pagador ---
# Same shape again: AEAT declares dr-54 Día, dr-55 Mes, dr-56 Año as
# three independently numbered Num rows, so this is a concatenation,
# modelled as three casillas.

