[revisions."2012-01-31-y-siguientes".family_dispositions.parameters]
reason = "A parameter holds a regulatory value a formula of this revision applies. Modelo 145 declares NO formulas -- all 56 of its casillas are input_kind manual -- so there is no expression that could reference one. It communicates the perceptor's personal and family circumstances; the retention rate those circumstances feed is computed by the PAGADOR under RD 439/2007 arts. 80 to 87, on the payer's own side, and never appears on this form. Empty by the shape of this modelo rather than by omission."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.bindings]
reason = "A binding resolves a casilla's value from a declared source, and only a BOUND casilla requires one. Every one of this revision's 56 casillas is input_kind = manual, so none demands a binding and none could sensibly have one: the values are the perceptor's own civil status, disability, dependants, mortgage and residence circumstances, known to that person and entered by them, not aggregated from this application's ledger the way a retenciones or IVA figure is. The family is empty by the nature of what this form carries."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.dependency_classifications]
reason = "A dependency classification declares which OTHER modelo's filing a value here derives from, and modelo 145 derives from none. It is the INPUT to a withholding calculation rather than a summary of one: the perceptor states their circumstances, the pagador uses them to set the tipo de retencion, and the resulting retenciones surface later on the payer's modelo 111 and annual modelo 190. The dependency runs downstream and belongs to those modelos. Nothing upstream exists to classify."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.verification_expectations]
reason = "A verification expectation reconciles a FILED return against this application's engine. There is nothing to reconcile against. Modelo 145 is not filed with AEAT at all. RD 439/2007 art. 88.1 states where it goes: 'Los contribuyentes deberan comunicar al pagador la situacion personal y familiar ... quedando obligado asimismo el pagador a conservar la comunicacion debidamente firmada.' The perceptor hands it to whoever pays them and the payer keeps it; AEAT receives nothing. With no AEAT-filed document there is no filed-versus-engine comparison for this family to describe, which is a different ground from the zero-formula informativas (modelos 182, 184, 232, 347, 720) that DO carry expectations: those are filed with AEAT and their figures can be checked against a justificante."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.verification_predicates]
reason = "A verification predicate guards a CALCULATED result -- characteristically that a positive economic input did not resolve to a zero base or cuota. Modelo 145 calculates nothing: zero formulas, no computed casilla, no base and no cuota, and cuota_bearing is false on its own applicability. It is a declaration of personal circumstances, not of amounts. The under-declaration risk these guard is real but lives on the PAGADOR's side, where those circumstances become a tipo de retencion and then appear on modelos 111 and 190."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.constructs]
reason = "A construct groups member casillas under a total the revision computes. Modelo 145 computes no totals: it declares zero formulas and no computed casilla, and its 56 casillas are independent statements of circumstance -- civil status, dependants, disability, mortgage -- that the pagador reads individually to set a retention rate. There is no aggregate for a construct to name, so the family is empty by construction rather than unbuilt."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]

[revisions."2012-01-31-y-siguientes".family_dispositions.live_cross_references]
reason = "A live cross-reference declares a guarded AEAT surface this revision reads. Modelo 145 has none, because it never reaches AEAT. Modelo 145 is not filed with AEAT at all. RD 439/2007 art. 88.1 states where it goes: 'Los contribuyentes deberan comunicar al pagador la situacion personal y familiar ... quedando obligado asimismo el pagador a conservar la comunicacion debidamente firmada.' The perceptor hands it to whoever pays them and the payer keeps it; AEAT receives nothing. There is consequently no filed-declarations surface to read back and no static AEAT publication for the form itself beyond the procedure page already carried in source_refs. The family is empty by where this document lives, not by omission."
legal_refs = ["rd-439-2007:art-88", "resolucion-dgt-2011-01-03-modelo-145:aprobacion"]
source_refs = ["aeat-modelo-145-procedure"]
