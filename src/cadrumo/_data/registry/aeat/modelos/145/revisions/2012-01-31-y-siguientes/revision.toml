[revisions."2012-01-31-y-siguientes".family_dispositions.relations]
reason = "Modelo 145 declares calculation_class = \"informative\". validate_informative_class_invariant hard-refuses any revision of an informative-class modelo that declares a non-empty relations family -- cross-model relations feed a filing-grade calculation this modelo does not perform. The relations family cannot be populated for this modelo by registry construction."
legal_refs = [
    "rd-439-2007:art-88",
    "resolucion-dgt-2011-01-03-modelo-145:aprobacion",
    "resolucion-dgt-2013-12-17-modelo-145:amendment",
