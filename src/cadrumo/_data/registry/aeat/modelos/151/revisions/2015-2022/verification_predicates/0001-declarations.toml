# Soundness gate: the régimen impatriados base liquidable general must be
# determined when it resolves to a positive amount. The cuota íntegra general
# (`impatriado.cuota-integra-general`) is formula-derived from the base
# liquidable general via `lookup_bracket` against the art. 93.2.e.1º escala
# (24% hasta 600.000 €, the year's top rate on the excess), so a positive base with a zero
# cuota would only be reachable through a registry regression in the formula
# chain or lookup table, not a legitimate operator omission -- but the verify
# gate must still surface it rather than silently grant VERIFICADO_COMPLETO
# (no-silent-under-declaration). ADVISORY (non-blocking): mirrors the M131
# 01->02 and M200 00501->DP200014:00552 worked-pattern guards.
[[revisions."2015-2022".verification_predicates]]
id = "implies-nonzero:base-liquidable-implica-cuota-integra"
predicate_id = "modelo-151-base-liquidable-implica-cuota-integra"
expression = 'implies_nonzero(["impatriado.base-liquidable-general", "impatriado.cuota-integra-general"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-93"]

# Soundness gate for the AHORRO branch, the sibling of the general-branch
# predicate above. Art. 93.2.e) splits the impatriado cuota integra in two: the
# general part (1.o) and the part corresponding to the rentas del art. 25.1.f)
# TRLIRNR (2.o). Both are formula-derived from their own base by lookup_bracket,
# and the export writes them into boxes [19] and [20] of pagina 08, so a
# positive ahorro base with a zero cuota is only reachable through a registry
# regression -- the verify gate must still surface it. ADVISORY (non-blocking);
# implies_nonzero holds trivially when the antecedent is at or below zero, so a
# filer with no rentas del ahorro never fires.
[[revisions."2015-2022".verification_predicates]]
id = "implies-nonzero:base-ahorro-implica-cuota-ahorro"
predicate_id = "modelo-151-base-ahorro-implica-cuota-ahorro"
expression = 'implies_nonzero(["impatriado.base-liquidable-ahorro", "impatriado.cuota-integra-ahorro"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-93"]
