# Both declaration-control indicators retain their official roles and text.
# The form-approval citation changes from Orden HAP/2783/2015 to its replacement.
# M151DID00 keeps the same 34-byte IBAN value but broadens the successor
# label from the return account to the ingreso/domiciliacion/devolucion account.
# The official M15101000 successor changes both municipality fields from a
# municipality code to a municipality name. Keep each predecessor lineage
# distinct and retire them; the successor fields are independent new roots.
# The predecessor M15101000 record keeps Representante. Apellidos and
# Representante. Nombre as separate fields. The successor replaces that pair
# with one 80-byte [19] field that also admits razón social/denominación. Keep
# both predecessor concepts distinct and retire them; the successor is a new
# representation with no many-to-one continuity claim.
# The predecessor M15102000 record keeps Pagador. Apellidos o Razón social
# and Pagador. Nombre as separate concepts. The successor replaces that pair
# with one 80-byte [52] field. Retire the two old concepts independently and
# keep the combined successor without either old continuidad_id.
# The predecessor M15103000 record keeps Pagador. Apellidos o Razón social
# and Pagador. Nombre as separate concepts. The successor replaces that pair
# with one 80-byte [52] field. Retire the two old concepts independently and
# keep the combined successor without either old continuidad_id.
# The B-activity totals remain the same aggregates across the replacement
# design. The positive-net total is made explicit and both fields move from
# M15105000 to M15106000 with zero-padded printed numbers.
# The first B-activity type and ordinary retention fields remain in the
# replacement M15105000 record. Their printed numbers are zero-padded and the
# retention field moves after the explicitly signed negative-net field. The
# old negative-subsection retention slot is distinct and is retired rather than
# falsely linked to the generalized successor field.
# The 2023-and-later design moves the C/IIC block from M15105000 to
# M15107000 and zero-pads its printed field numbers. The eight type selectors,
# eight retention amounts, and the C/IIC retention total retain their roles.
# The 2015 design has a separate retention slot under the negative-results
# subsection. The 2023-and-later M15105000 design has one general activity
# retention field [06] and no separate negative-subsection slot. Since the
# general field is already the ordinary-retention lineage, the old negative
# slot is explicitly retired rather than conflated with it.
# M15105000 makes the sign of the net-result components explicit in the
# 2023-and-later design. The positive component keeps its span; the negative
# component moves before withholding. These are representation/label changes,
# not new concepts inferred from the printed box numbers.
# M15106000 carries surname/razón-social and given-name as separate concepts.
# M15108000 replaces each pair with one 80-byte [61] field. Keep the old
# concepts distinct and retire them; the combined fields are new in
# representation and are intentionally not assigned either old lineage.
# The tax-calculation fields [18], [20], and [43] retain their printed
# concepts, byte spans, lengths, and AEAT field types across the revision.
# The enclosing record changes from M15108000 (p08) to M15100000 (p10), so
# these are explicit record-layout evolutions rather than label-only guesses.
# AEAT's 2015 M15101000 design allocates fax slots to the taxpayer's
# domestic and foreign addresses and the representative. In the replacement
# design their captions have no field number, position or length. The allocated
# fields are contiguous across each former slot: 393/394, 685/686 and 982/983.
# These are withdrawn fax data fields, not continuations of telephone numbers.

