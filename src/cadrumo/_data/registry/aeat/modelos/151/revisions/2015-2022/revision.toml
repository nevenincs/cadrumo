[revisions."2015-2022"]
authority_grade = "filing"
# valid_to/year_to corrected from 2024 to 2022. The prior boundary was wrong on
# two independent grounds: Orden HFP/1338/2023's own Disposicion Final Segunda(a)
# states the successor model applies first for ejercicio 2023, and AEAT's own
# bundled record-design file is named "01-151-ejercicio-2023-y-siguientes.xls" --
# the design corpus and the legal text agree at 2023, and nothing supports 2024.
# The prior citation (orden-eha-2887-2008:modelo-151) was a stub whose document_id
# never resolved to real text; the real governing instrument for this span is
# Orden HAP/2783/2015, fetched and bundled. Its own text states it is superseded
# in part (arts 6-10) by Orden HFP/1338/2023 from ejercicio 2023 onward.
valid_from = 2015-01-01
valid_to = 2022-12-31
period_selector = { year_from = 2015, year_to = 2022, periods = ["0A"] }
legal_refs = [
    "ley-35-2006:art-93",
    "rd-439-2007:art-113",
    "orden-hap-2783-2015:art-1",
]
orden_aplicabilidad = [
    "orden-hap-2783-2015:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
    # The edition that actually governs this window: declared
    # 2015-01-01..2022-12-31, matching the revision exactly. AEAT titles it
    # "151 - Orden HAP/2783/2015 (Ejercicios 2015-2022)". Without it this
    # revision cited only the 2023-and-later edition, so every year it
    # claims read as uncovered. The 2023 citation is left in place: judging
    # whether it is now redundant here is a separate call.
    "aeat-dr-151-2015",
]


[revisions."2015-2022".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2015-2022' of modelo 151 has no strictly-earlier sibling revision of this modelo (valid_from 2015-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "ley-35-2006:art-93",
    "rd-439-2007:art-113",
    "orden-hap-2783-2015:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
]

[revisions."2015-2022".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-151-2015-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "ley-35-2006:art-93",
    "rd-439-2007:art-113",
    "orden-hap-2783-2015:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
    "aeat-dr-151-2015",
]

[revisions."2015-2022".family_dispositions.relations]
reason = "A relation is declared on the TARGET revision and names a target_binding in that same revision; a binding existing only as a relation's materialisation slot declares source = 'relation_prefill'. This revision declares 1 binding(s) and none of that source, so no fold-in from another modelo has a slot to land in and an entry here could name no target. Empty by construction rather than unbuilt: authoring a relation_prefill binding is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "ley-35-2006:art-93",
    "rd-439-2007:art-113",
    "orden-hap-2783-2015:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
    "aeat-dr-151-2015",
]
