# Modelo 151 (régimen impatriados) — cuota chain formulas.

# Cuota íntegra general: aplica la escala plana del art. 93.2.e.1º (24% hasta
# 600.000 €; sobre el exceso, 47% en 2015, 45% de 2016 a 2020 y 47% desde 2021)
# a la base liquidable general, vía lookup_bracket sobre la tabla
# modelo-151.escala-cuota-integra-general.
[[revisions."2015-2022".formulas]]
id = "modelo-151-cuota-integra-general"
target_casilla_id = "impatriado.cuota-integra-general"
expression = { op = "lookup_bracket", args = [
    { casilla_id = "impatriado.base-liquidable-general" },
    { parameter = "modelo-151.escala-cuota-integra-general" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-93"]

[[revisions."2015-2022".formulas.source_citations]]
source_ref = "aeat-modelo-151-procedure"
required_text = ["Modelo 151"]

# Cuota íntegra del ahorro: aplica la escala del ahorro del art. 93.2.e).2.º a la
# base liquidable del ahorro (parte de las rentas del art. 25.1.f TRLIRNR), vía
# lookup_bracket sobre modelo-151.escala-cuota-integra-ahorro.
[[revisions."2015-2022".formulas]]
id = "modelo-151-cuota-integra-ahorro"
target_casilla_id = "impatriado.cuota-integra-ahorro"
expression = { op = "lookup_bracket", args = [
    { casilla_id = "impatriado.base-liquidable-ahorro" },
    { parameter = "modelo-151.escala-cuota-integra-ahorro" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-93"]

[[revisions."2015-2022".formulas.source_citations]]
source_ref = "aeat-modelo-151-procedure"
required_text = ["Modelo 151"]

# Cuota diferencial: suma de la cuota íntegra general (e.1.º) y la del ahorro
# (e.2.º) menos las retenciones e ingresos a cuenta (los pagos a cuenta de la
# letra f), que son distintos de la cuota).
[[revisions."2015-2022".formulas]]
id = "modelo-151-cuota-diferencial"
target_casilla_id = "impatriado.cuota-diferencial"
expression = { op = "subtract", args = [
    { op = "add", args = [{ casilla_id = "impatriado.cuota-integra-general" }, { casilla_id = "impatriado.cuota-integra-ahorro" }] },
    { casilla_id = "impatriado.retenciones" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-93"]

[[revisions."2015-2022".formulas.source_citations]]
source_ref = "aeat-modelo-151-procedure"
required_text = ["Modelo 151"]
