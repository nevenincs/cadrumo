# Modelo 151 (régimen impatriados) — cuota chain formulas.
# Cuota íntegra general: aplica la escala plana del art. 93.2.e.1º (24% hasta
# 600.000 €, 47% sobre el exceso) a la base liquidable general, vía lookup_bracket
# sobre la tabla modelo-151.escala-cuota-integra-general.
# Cuota diferencial: cuota íntegra general menos retenciones e ingresos a cuenta
# (los pagos a cuenta de la letra f), que son distintos de la cuota).

[[revisions.2015-2022.formulas]]
id = "modelo-151-cuota-integra-general"
target_casilla_id = "impatriado.cuota-integra-general"
rounding = "money-2"
legal_refs = ["ley-35-2006:art-93"]

[[revisions.2015-2022.formulas.source_citations]]
source_ref = "aeat-modelo-151-procedure"
required_text = ["Modelo 151"]

[revisions.2015-2022.formulas.expression]
op = "lookup_bracket"

[[revisions.2015-2022.formulas.expression.args]]
casilla_id = "impatriado.base-liquidable-general"

[[revisions.2015-2022.formulas.expression.args]]
