# Modelo 151 (régimen impatriados) — cuota chain formulas, ejercicios 2025 y
# siguientes.
# Cuota íntegra del ahorro: aplica la escala progresiva del ahorro del art.
# 93.2.e.2º (19/21/23/27/30, redacción vigente Ley 7/2024) a la base liquidable
# del ahorro (parte de las rentas del art. 25.1.f TRLIRNR), vía lookup_bracket
# sobre modelo-151.escala-cuota-integra-ahorro.
# Cuota diferencial: suma de la cuota íntegra general (e.1º) y la cuota íntegra
# del ahorro (e.2º) menos las retenciones e ingresos a cuenta (pagos a cuenta de
# la letra f), que son distintos de la cuota).

