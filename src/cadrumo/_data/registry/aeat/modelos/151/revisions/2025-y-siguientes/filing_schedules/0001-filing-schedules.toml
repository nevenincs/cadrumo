legal_refs = ["ley-35-2006:art-93", "rd-439-2007:art-113", "orden-hfp-1338-2023:art-2", "orden-hfp-1338-2023:art-3"]
source_refs = ["aeat-modelo-151-procedure", "boe-modelo-151-layout"]

[[revisions."2025-y-siguientes".filing_schedules.profile_conditions]]
