# Modelo 151 filing schedule, ejercicios 2023 y siguientes.
#
# Orden HFP/1338/2023 art. 2 obliges every IRPF contribuyente under the régimen
# especial to present it, and art. 3.1 sets its plazo BY REMISSION to the general
# IRPF plazo approved each ejercicio -- the same construction its predecessor
# used. The remission fixes the SHAPE here and the dates in deadline_windows.

