continuidad_evidence = "The official M15102000 successor design introduces one 80-byte An field, Pagador. Apellidos y nombre o razón social [52], at byte position 111-190. The predecessor M15102000 design has no single [52] field: it declares two distinct An concepts, Pagador. Apellidos o Razón social at 111-170 (60 bytes) and Pagador. Nombre at 171-190 (20 bytes). The combined successor is a new representation, not a many-to-one continuity claim. Sources: corpus/aeat_official/disenos_registro/modelo_151/files/02-151-ejercicio-2015-2022.xls.extracted.md (sha256 997dc9cf5230) and corpus/aeat_official/disenos_registro/modelo_151/files/01-151-ejercicio-2023-y-siguientes.xls.extracted.md (sha256 7680e5a21935)."
