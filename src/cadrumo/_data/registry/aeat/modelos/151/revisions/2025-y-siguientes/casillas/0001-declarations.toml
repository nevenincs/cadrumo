# Modelo 151 (régimen especial de impatriados, Ley Beckham) — casilla schema,
# ejercicios 2025 y siguientes.
#
# Two cuota-íntegra tracks, per art. 93.2.e LIRPF:
#   1.º (e.1º) la base liquidable general (excluida la parte del ahorro) tributa
#       por la escala plana 24/47 -> impatriado.cuota-integra-general.
#   2.º (e.2º) la parte de la base liquidable correspondiente a las rentas del
#       art. 25.1.f) TRLIRNR (base liquidable del ahorro) tributa por la escala
#       progresiva del ahorro (19/21/23/27/30, redacción vigente Ley 7/2024)
#       -> impatriado.cuota-integra-ahorro.
# La cuota diferencial resta las retenciones (pagos a cuenta, letra f) de la
# suma de ambas cuotas íntegras.

[[revisions."2025-y-siguientes".casillas]]
id = "impatriado.base-liquidable-ahorro"
number = "impatriado.base-liquidable-ahorro"
section = ["liquidacion", "base"]
semantic_role = "impatriado_base_liquidable_ahorro"
continuidad_id = "impatriado-base-liquidable-ahorro"
continuidad_origin = "predecessor_edition_silent"
continuidad_evidence = "This internal calculation slot has no exported record span of its own, and the 2015-2022 calculation registry declares no separate savings-base domain casilla. The official M15108000 predecessor design nevertheless prints Base liquidable del ahorro [18] at byte position 808-824 (17 bytes, Num), and the successor M15100000 design retains the identical field at byte position 808-824. This is predecessor_edition_silent rather than new_on_form; the separate exported p08/p10 form rows retain their own continuity chain. Sources: corpus/aeat_official/disenos_registro/modelo_151/files/02-151-ejercicio-2015-2022.xls.extracted.md (sha256 997dc9cf5230) and corpus/aeat_official/disenos_registro/modelo_151/files/01-151-ejercicio-2023-y-siguientes.xls.extracted.md (sha256 7680e5a21935)."
legal_refs = ["ley-35-2006:art-93"]
source_refs = ["aeat-modelo-151-procedure", "boe-modelo-151-layout"]

