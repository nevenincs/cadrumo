[revisions."2015-y-siguientes"]
authority_grade = "filing"
# valid_to/year_to corrected from 2024 to 2022. The prior boundary was wrong on
# two independent grounds: Orden HFP/1338/2023's own Disposicion Final Segunda(a)
# states the successor model applies first for ejercicio 2023, and AEAT's own
# bundled record-design file is named "01-151-ejercicio-2023-y-siguientes.xls" --
# the design corpus and the legal text agree at 2023, and nothing supports 2024.
# The prior citation (orden-eha-2887-2008:modelo-151) was a stub whose document_id
# never resolved to real text; the real governing instrument for this span is
# Orden HAP/2783/2015, fetched and bundled. Its own text states it is superseded
# in part (arts 6-10) by Orden HFP/1338/2023 from ejercicio 2023 onward.
valid_from = 2015-01-01
valid_to = 2022-12-31
period_selector = { year_from = 2015, year_to = 2022, periods = ["0A"] }
legal_refs = [
    "ley-35-2006:art-93",
    "rd-439-2007:art-113",
    "orden-hap-2783-2015:art-1",
]
orden_aplicabilidad = [
    "orden-hap-2783-2015:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
]
