# Modelo 151 (régimen especial de impatriados, Ley Beckham) — casilla schema.
#
# Phase: the load-bearing cuota-íntegra escala (art. 93.2.e.1º, 24/47) IS
# computed via lookup_bracket; retenciones and cuota a ingresar are derived.
# The savings escala (art. 93.2.e.2º → IRPF art. 66) is intentionally out of
# scope here (its current bracket set is not yet corpus-grounded — see the
# art-93 corpus note); only the flat general escala is modelled.

