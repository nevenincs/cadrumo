# Cuota integra general menos retenciones. AEAT's Diseno de Registros has no
# position for this figure: pagina 8 goes from cuota liquida and 'Retencion e
# ingresos a cuenta [33]' straight to 'Resultado de la declaracion [43]', and
# box 43 is a LATER figure that also nets the results of previous declarations
# [41] and refunds already agreed by the Administracion [42]. So this is the
# intermediate between them, materialised as a casilla because the revision's
# verification expectation reconciles against it. It files no slot because the
# design prints none, not because one was overlooked.
[[revisions."2015-2022".casillas]]
