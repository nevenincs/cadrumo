[revisions."2025-y-siguientes"]
authority_grade = "filing"
# valid_from corrected from 2025 to 2023. The prior boundary was wrong on two
# independent grounds: Orden HFP/1338/2023's own Disposicion Final Segunda(a)
# states this model applies first for ejercicio 2023 (filed 2024), and AEAT's
# own bundled record-design file is named "01-151-ejercicio-2023-y-siguientes.xls"
# -- the design corpus and the legal text agree at 2023. This revision's own
# id (still literally "2025-y-siguientes") is now doubly stale against its
# corrected data -- a rename is deferred per the standing ruling on locale-key
# blast radius, matching the M151/M303 precedent from earlier this session.
valid_from = 2023-01-01
period_selector = { year_from = 2023, periods = ["0A"] }
legal_refs = [
    "ley-35-2006:art-93",
    "ley-35-2006:art-93-ahorro",
    "ley-35-2006:art-93-ahorro-2023",
    "rd-439-2007:art-113",
    "orden-hfp-1338-2023:art-1",
]
orden_aplicabilidad = [
    "orden-hfp-1338-2023:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    # Already-registered record design, declared 2023-01-01 open-ended, which
    # matches this revision's own valid_from exactly. AEAT titles it
    # "151 - Orden HAP/2783/2015 (Ejercicios 2023 y siguientes)".
    "aeat-dr-151-2023",
]

[revisions."2025-y-siguientes".family_dispositions.relations]
reason = "A relation is declared on the TARGET revision and names a target_binding in that same revision; a binding existing only as a relation's materialisation slot declares source = 'relation_prefill'. This revision declares 1 binding(s) and none of that source, so no fold-in from another modelo has a slot to land in and an entry here could name no target. Empty by construction rather than unbuilt: authoring a relation_prefill binding is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "ley-35-2006:art-93",
    "ley-35-2006:art-93-ahorro",
    "ley-35-2006:art-93-ahorro-2023",
    "rd-439-2007:art-113",
    "orden-hfp-1338-2023:art-1",
]
source_refs = [
    "aeat-modelo-151-procedure",
    "boe-modelo-151-layout",
    "aeat-dr-151-2023",
]

[revisions."2025-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "This revision DOES have a strictly-earlier sibling (2015-2022), so unlike that sibling it is a possible landing point for a continuity transition. It declares none because none is derivable without a per-box tax review. Orden HFP/1338/2023 did not amend the 2015 model in place: it approved a new one, adding two whole records, changing how many times several blocks repeat, and renumbering the printed box references throughout -- and in the Representante block it transposes the municipio and provincia labels against their own widths. A description match between the two editions was measured before this was written and reaches 76%, which is high enough to look authoritative and far too low to be a continuity claim. Reviewing each box against both ordenes and declaring the transitions that survive is what would populate this family."
legal_refs = ["ley-35-2006:art-93", "orden-hap-2783-2015:art-1", "orden-hfp-1338-2023:art-1"]
source_refs = ["aeat-dr-151-2015", "aeat-dr-151-2023"]

[revisions."2025-y-siguientes".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (generated-modelo-151-2025-y-siguientes-fichero) declares no record with repeat = 'projection_rows' and no field of kind 'projection': the design repeats its income blocks by printing each occurrence as its own positions within a fixed-width record, not by repeating a record, so there is no repeated endpoint for the family to admit and nothing an entry here could name. Authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = ["ley-35-2006:art-93", "rd-439-2007:art-113", "orden-hfp-1338-2023:art-1"]
source_refs = ["aeat-modelo-151-procedure", "aeat-dr-151-2023"]

[revisions."2025-y-siguientes".family_dispositions.dependency_classifications]
reason = "A dependency classification names another modelo whose filed value is FOLDED IN here, and it does that by pointing at the relations and target constructs that carry the fold-in. This revision declares no relations -- see the relations disposition on this same revision -- so there is no fold-in to classify and an entry here could reference nothing. The retenciones and ingresos a cuenta an impatriado suffers are real and do reduce the resultado de la declaracion, but they reach this modelo as its own declared casilla inputs rather than as a cross-modelo carry from the retenedor's return. Declaring a relation from the retenedor's modelo is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = ["ley-35-2006:art-93", "rd-439-2007:art-113", "orden-hfp-1338-2023:art-2"]
source_refs = ["aeat-modelo-151-procedure", "aeat-dr-151-2023"]

[revisions."2025-y-siguientes".family_dispositions.extraction_profiles]
reason = "An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against this registry's own casilla labels, which would be self-reference. The bundled 151 artefacts are the diseno de registro, which describes the WIRE record and prints no form labels, and the orden, which approves the model in an anexo this repository does not carry as a rendered form. Authoring patterns anyway would mean inventing the labels a real 151 declaracion prints. Bundling a filed or AEAT-published 151 specimen is the change that makes this family authorable."
legal_refs = ["ley-35-2006:art-93", "orden-hfp-1338-2023:art-1"]
source_refs = ["aeat-modelo-151-procedure", "aeat-dr-151-2023"]

[revisions."2025-y-siguientes".family_dispositions.live_cross_references]
reason = "A live cross-reference declares an AEAT surface this application READS at runtime, together with the guard policy, allowed hosts and methods, and forbidden actions that keep the read read-only. It is a statement about what Cadrumo operates, not about what the law requires. Cadrumo operates no live surface for Modelo 151: no adapter under adapters/outbound/aeat references this modelo, and the application never performs live AEAT submission in any case, so there is no host to allow, no method to bound and no guard policy to declare. Should a Modelo 151 consulta reader ever be built, this disposition is what it replaces."
legal_refs = ["ley-35-2006:art-93", "orden-hfp-1338-2023:art-1"]
source_refs = ["aeat-modelo-151-procedure"]
