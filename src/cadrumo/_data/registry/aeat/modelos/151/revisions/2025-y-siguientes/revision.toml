family = "casillas"
continuidad_id = "did-numero-de-cuenta-iban"
from_revision = "2015-2022"
to_revision = "2025-y-siguientes"
origin = "grounded"
evidence = "Official M151DID00 designs retain the same 34-byte An IBAN account field across revisions: predecessor campo 6, Número de Cuenta (IBAN), at positions 13-46; successor campo 8, Ingreso/Domiciliación/Devolución - IBAN, at positions 15-48. The two-byte shift is caused by the two devolución flags moving before the account field. The successor label broadens the declared use of the same IBAN value, which is recorded as a label evolution rather than a new or many-to-one concept. Sources: corpus/aeat_official/disenos_registro/modelo_151/files/02-151-ejercicio-2015-2022.xls.extracted.md (sha256 997dc9cf5230) and corpus/aeat_official/disenos_registro/modelo_151/files/01-151-ejercicio-2023-y-siguientes.xls.extracted.md (sha256 7680e5a21935)."
legal_refs = ["ley-35-2006:art-93", "rd-439-2007:art-113", "orden-hfp-1338-2023:art-1"]
source_refs = ["aeat-dr-151-2023", "aeat-modelo-151-procedure"]

