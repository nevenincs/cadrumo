# Calculation verification for Modelo 151 (IRPF regimen especial impatriados,
# Ley 35/2006 art. 93). Enrolls the always-present result casillas as the
# reconciliation contract: cuota integra general and cuota diferencial are the
# formula-derived finals of the impatriado calculation and are present in every
# filed declaration, so min_coverage = 1 holds without breaking a legitimate
# filing. Grounded in the modelo's own AEAT procedure and BOE layout source_refs.
[[revisions."2015-2022".verification_expectations]]
id = "modelo-151-calculation-verification"
computed_casilla_ids = [
    "impatriado.cuota-integra-general",
    "impatriado.cuota-diferencial",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "1"
discrepancy_causes = [
    "extraction_unreliable",
    "unmodelled_rule",
    "rounding",
    "correctness_divergence",
]
legal_refs = ["ley-35-2006:art-93"]
source_refs = ["aeat-modelo-151-procedure", "boe-modelo-151-layout"]
