# Modelo 151 anexo casillas for the "transmisión de participaciones en
# instituciones de inversión colectiva" detail block, derived row by row from
# the bundled Diseño de Registros page M15107000 (aeat-dr-151-2023). `number`
# is the box number the design prints in square brackets; `segmento` is the
# record page on which the box is defined. The page repeats each box up to
# nine times (one column set per declared transaction); every repeat is the
# same box carried forward, not a second casilla.
#
# PROTOTYPE SLICE (one page of ten boxed pages on this design; the other nine
# are unregistered). `tipo-renta` is a coded field whose valid AEAT code set
# is not yet grounded here -- data_type stays "text" pending that lookup
# rather than inventing an enum.

[[revisions."2015-2022".casillas]]
id = "impatriado.anexo-transmision-iic.tipo-renta"
number = "01"
segmento = "151-07"
section = ["anexo", "transmision-iic"]
data_type = "text"
required = false
input_kind = "manual"
legal_refs = ["ley-35-2006:art-93"]
source_refs = ["aeat-dr-151-2023"]
# repeated up to nine times on this page, once per declared transaction

