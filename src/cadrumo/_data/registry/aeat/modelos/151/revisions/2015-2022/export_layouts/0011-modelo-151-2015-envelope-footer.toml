# Modelo 151 (2015-2022) — envelope footer, and the layout's own grounding.
#
# TRANSCRIBED from the bundled AEAT Diseño de Registro aeat-dr-151-2015
# (corpus/aeat_official/disenos_registro/modelo_151/files/02-151-ejercicio-2015-2022.xls,
# sha256 997dc9cf5230a374716d04a5ae9aed0e9c659ee9352451843dbc5232d3f2137a,
# 1206784 bytes; AEAT titles it "151 - Orden HAP/2783/2015 (Ejercicios
# 2015-2022)", matching this revision's window exactly).
#
# Every offset, length, label and alignment rule is read out of that design.
# Alignment follows AEAT's own Tipo column: "An" campos are left-aligned and
# blank-filled, "Num" campos right-aligned and zero-filled, per the design's
# Nota 2. `number` carries the campo's own inclusive position range.

#
# Design sheet M15100 declares fifteen rows. Thirteen carry numeric
# coordinates and span 1-328; row 14 is the variable-length "Contenido
# del fichero" slot the page records occupy, and row 15 is an 18-byte
# closing constant at position "***" spelled
# "</T151020150A0000>" — </T + modelo + discriminante + ejercicio +
# periodo + 0000>. Neither carries a fixed coordinate, so the design
# reader emits neither; the closing tag is declared here as its own
# record, exactly as Modelo 390 and Modelo 122 declare the same <AUX>
# wrapper's footer. It interpolates the ejercicio, so it is `computed`.
#
# KNOWN LIMITATION -- this layout writes ONE instance of each page.
#
# AEAT packs N renta slots INLINE at fixed offsets inside each of pages
# 02-08 (page 04 carries nine, page 02 four, page 07 eight), and handles a
# taxpayer with more rentas than a page holds by emitting the whole page
# record again. Every slot this layout declares is at the design's own
# offset, so a filing that fits within one instance of each page is written
# correctly and completely; a filing that overflows a page is NOT, because
# nothing here emits the second instance.
#
# No `repeat` mode is declared, and that is deliberate. `binding_rows` and
# `projection_rows` both render one logical row per record occurrence,
# which would emit different bytes than AEAT specifies for a page that
# packs N rows into ONE occurrence. Declaring either would trade a missing
# capability for wrong output.
#
# Modelo 151 is the hardest of the three known cases. Modelo 714 repeats a
# page behind an "Indicador de página complementaria" at position 12, and
# Modelo 390 pages 5 and 7 carry a settable Blanco/"C"; both at least put a
# discriminator in the bytes. Pages 02-08 here carry neither -- the only
# Declaracion Complementaria bytes in the whole design are on page 01
# (@926+1 and @927+1) and they mark the DECLARATION, not a page instance.
# So a second instance of page 02 is byte-indistinguishable from the first,
# and any future page-packed repeat mechanism would have to carry the
# occurrence index outside the record.

