# Deadline windows for the supported filing years this edition left undeclared.
#
# The edition's period_selector is open-ended from 2019 with four quarters, but
# only 2025 carried windows. Inside the supported filing span (floor 2022,
# horizon 2026) that leaves 2022, 2023, 2024 and 2026 with no window on this
# edition and none to inherit, since this modelo has a single revision and no
# predecessor to resolve through.
#
# GROUNDING. The approving anexo is cited because it is what enrols this modelo,
# but it states no plazo: its required_text is the bare heading. The filing
# period comes from RIRPF art 108.1, whose corpus text reads "en los primeros
# veinte dias naturales de los meses de abril, julio, octubre y enero,
# declaracion de las cantidades retenidas y de los ingresos a cuenta que
# correspondan por el trimestre natural inmediato anterior". That article is
# already declared in this revision's own legal_refs and is already the cited
# plazo authority for the sibling retencion modelos 111, 115 and 123, so this
# follows the established pattern rather than introducing a new one.
#
# Dates are NOMINAL. Movement for weekends and festivos happens at read time.
#
# source_refs carries only the modelo procedure page, which is open-ended from
# 2019. The per-year calendario del contribuyente is deliberately NOT cited: it
# is bounded to its own calendar year, and a 4T window opens and closes in the
# following January, so the citation would not overlap the window it grounds.

[[revisions."2019-y-siguientes".deadline_windows]]
