[revisions."2019-y-siguientes".family_dispositions.verification_expectations]
reason = "A verification expectation reconciles a FILED return against this application's engine. Modelo 308's AD-HOC filings carry only the operator's own entered values with no engine-computed figures to reconcile, and the application holds no justificante reconciliation surface for the recapitulativa. The family is empty until such a surface is authored, not by omission."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.verification_predicates]
reason = "A verification predicate guards a CALCULATED result -- characteristically that a positive economic input did not resolve to a zero base or cuota. Modelo 308 calculates nothing: zero formulas, no computed casilla, and every liquidation figure is the operator's recorded value. The under-declaration risk these guard does not arise from an engine computation."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
