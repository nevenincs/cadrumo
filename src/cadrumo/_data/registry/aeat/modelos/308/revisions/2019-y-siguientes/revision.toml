[revisions."2019-y-siguientes".family_dispositions.applicability]
reason = "Modelo 308 is filed AD-HOC, one declaration per settlement period as the intra-community operations occur: the filing condition is the operation itself, modeled by the filing_schedules AD-HOC entry, not a periodic taxpayer-condition profile state. The applicability family has no periodic condition to declare."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.bindings]
reason = "Modelo 308's casillas are the operator's own per-operation values (the MTN and REQ liquidation figures, the acquirer identification); Cadrumo holds no store that projects them, so no binding source applies and the binding family is empty by the application's data shape rather than omitted."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.deadline_windows]
reason = "Modelo 308's AD-HOC filing models its obligation through filing_schedules; the deadline_windows family holds per-period presentation calendars for periodic modelos, and an AD-HOC declaration's presentation window is the settlement event itself, which the schedule already carries. Empty by the period shape, not by omission."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.dependency_classifications]
reason = "Modelo 308 consumes no other modelo's filed output and no modelo consumes its output through the dependency engine: the recapitulativa stands alone per settlement period. The family is empty because no dependency exists to classify."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.extraction_profiles]
reason = "An extraction profile names an AEAT artefact this application ingests and the parser that reads it. The application's pull surface for modelo 308 is the operator-entered AD-HOC declaration, not a periodic declaracion PDF replay, and no inbound parser for a 308 artefact exists to name. Empty by the application's surface rather than omitted."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.formulas]
reason = "Modelo 308 computes nothing: every casilla is an operator-entered per-operation value (informational or manual), and no casilla declares a formula or a computed input kind. The formula family is empty by the modelo's calculation shape rather than omitted."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.parameters]
reason = "A parameter holds a regulatory value a formula of this revision applies. Modelo 308 applies none: it declares zero formulas, and the liquidation figures are the operator's recorded values, not computed applications of a rate or threshold. Empty by the shape of the modelo's calculation."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. Modelo 308's record design declares two fixed pages with no repeated projection record and no field of kind 'projection'. The family has no repeated endpoint to admit; authoring a projection row into the layout is what would make it apply."
legal_refs = ["ley-37-1992:art-21", "rd-1624-1992:art-30-bis", "orden-eha-3786-2008:art-2", "orden-eha-3786-2008:art-11", "ley-37-1992:art-161"]
source_refs = ["aeat-dr-308-2019", "aeat-modelo-308-procedure"]

[revisions."2019-y-siguientes".family_dispositions.relations]
reason = "A relation declares a cross-modelo fold-in. Modelo 308 folds nothing in: its values are the operator's per-operation entries, and no other modelo's annual summary or quarterly output feeds it. The relation family is empty because no cross-modelo fold exists."
