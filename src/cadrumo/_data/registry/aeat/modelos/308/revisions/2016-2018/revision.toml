[revisions.2016-2018.casilla_overrides.selector]
revision = "2011-julio-2015"
id = "decl.ejercicio"

[revisions.2016-2018.casilla_overrides.fields]
continuidad_evidence = "AEAT aeat-dr-308-2011-july names the declaration-header Ejercicio; aeat-dr-308-2016 names Ejercicio devengo (AAAA) in M30800 and Devengo - Ejercicio in M30801. These identify the same refund declaration's tax year under Orden EHA/3786/2008 art. 2, despite the new record envelope."
continuidad_origin = "grounded"

[[revisions.2016-2018.casilla_overrides]]
removed_fields = ["legal_refs"]
restate_provenance = true

[revisions.2016-2018.casilla_overrides.selector]
revision = "2011-julio-2015"
id = "decl.periodo"

[revisions.2016-2018.casilla_overrides.fields]
continuidad_evidence = "AEAT aeat-dr-308-2011-july labels the declaration-header field Periodo at positions 23-24; aeat-dr-308-2016 carries the same settlement-period concept as Periodo (PP) in M30800 position 5 and Devengo - Periodo in M30801 position 107. Both identify the filing period of the Modelo 308 refund declaration under Orden EHA/3786/2008 art. 2; the 2016 envelope is representational, not a new concept. The accepted code domain narrows between designs, which each revision declares rather than treating as a repurpose."
continuidad_origin = "grounded"

