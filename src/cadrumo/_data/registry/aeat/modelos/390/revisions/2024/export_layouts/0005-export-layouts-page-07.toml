# Indicador de pagina complementaria at offset 12, length 1: carried by a
# manual_input binding, listed with the prorrata slots in the sibling
# bindings fragment. AEAT declares its contenido as
# 'Blanco (No complementaria) o "C" (Complementaria)'. This position was
# once left unwritten on the finding that no carrier could emit that
# alphabet -- data_type "boolean" renders the canonical "X" and blank only
# (_fixed_width_codec._render_boolean), a literal would force "C" onto every
# filing, and a filler would silently blank a real flag. That enumeration
# omitted the carrier that fits: a text-typed manual_input binding renders
# the operator's own value, so "C" and blank are exactly the two bytes it
# can emit. Paginas 5 and 7 are the only two pages carrying this flag;
# every other page declares the position 'En blanco'.

