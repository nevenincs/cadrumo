# Pagina 2 blocks of the annual resumen that the fichero-BOE layout could not
# write. Every box number, offset and length below is transcribed verbatim from
# this revision's own bundled Diseno de Registros (source aeat-dr-390-2022,
# sha256 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe),
# apartado 5 "Operaciones Reg. Gral. - Base Imponible y cuota".
#
# The blocks are: operaciones intragrupo (REGE), regimen especial del criterio
# de caja, regimen especial de bienes usados, regimen especial de agencias de
# viajes, modificacion de bases y cuotas (incl. intragrupo and concurso de
# acreedores), the total bases imponibles box, the recargo de equivalencia
# BASE rungs whose cuota siblings were already modelled, the recargo tipo
# 1,75 % rung (LIVA art. 161.3, labores del tabaco) which was absent in BOTH
# base and cuota, and the modificacion del recargo boxes.
#
# All are optional operator inputs: a filer without operations in a block
# leaves it blank, and a blank slot is a valid zero.

