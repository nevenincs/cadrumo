# Modelo 390 revision 2025, pagina 4: the Real Decreto-ley 4/2024
# temporary 2 % and 7,5 % rungs of the apartado 5 IVA deducible block for
# adquisiciones intracomunitarias (bienes de inversion and servicios).
#
# These rungs do not exist on the 2022 design, so they are genuinely new
# boxes rather than a cross-year reuse. Naming, section, cardinality and LIVA
# grounding follow the sibling rate rungs of this same block already
# registered in revision 2025. They are NOT grounded on
# real-decreto-ley-4-2024:art-1, the instrument that established the two
# rates: it lapsed on 2024-12-31, so it cannot ground a 2025 devengo, and this
# revision's own casilla_continuidad_evolutions records the drop. The rungs
# remain as the design carries them, grounded on the standing LIVA articles
# alone -- no provision fixes a 2 % or 7,5 % rate for 2025.
#
# Offsets, lengths and box numbers transcribed from aeat-dr-390-2025
# (sha256 6d33d8a4245976e55dc31ff85065b420f76d1588110dc1eb541a8039c5e3f252), pagina 4.

