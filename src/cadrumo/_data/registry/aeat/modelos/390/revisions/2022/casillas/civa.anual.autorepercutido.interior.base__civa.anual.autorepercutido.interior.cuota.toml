# Domestic reverse-charge (inversion del sujeto pasivo, LIVA art. 84.Uno.2)
# box-layer casillas -- page 02 offsets 1475 ("Base imponible [27]") and 1492
# ("Cuota [28]"). Confirmed epoch-invariant: box numbers, label text and byte
# offsets are identical across all nine bundled designs (2016-2025), and the
# design carries no rate breakdown for this line at any point -- matching
# Modelo 303's own domestic_reverse_charge binding, which sums
# general/reduced/super_reduced together rather than splitting by rate.
#
# M390 previously had NO domestic-reverse-charge modelling at all: box [28]
# was instead fed by the AIC-aggregating casilla (see the sibling AIC
# box-layer file in this directory), and box [27] had no export field.
# LIVA art. 84.Uno.2 is a materially different hecho imponible from AIC
# (art. 13/85) -- entregas y prestaciones interiores where the recipient
# self-assesses, not a cross-border acquisition -- so the two must not share
# one box, per the ADR this module implements.

# Box [27] - "IVA deveng. invers. sujeto pasivo - Base imponible". Design-year validity: 2016-2025 (epoch-invariant).
[[revisions."2022".casillas]]
id = "iva.anual.autorepercutido.interior.base"
number = "27"
section = ["iva", "anual", "inversion_sujeto_pasivo"]
data_type = "money"
semantic_role = "iva_isp_interior_base"
continuidad_id = "iva-isp-interior-base"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "One official AEAT box for the domestic reverse-charge devengada base; the design carries no rate breakdown for this line."
required = false
input_kind = "bound"
binding = "modelo-390-iva-autorepercutido-interior-base"
legal_refs = ["ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2022", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]
