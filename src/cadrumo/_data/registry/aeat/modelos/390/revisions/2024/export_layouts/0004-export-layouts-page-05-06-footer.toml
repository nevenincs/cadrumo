# Pag. 5: regimen simplificado. Box [79] total cuota resultante del
# regimen simplificado (annual carry from the 4T Modelo 303) sits at
# offset 1118 on this page, not on Pag. 6. The remaining modulo and
# deduction slots of the page are not modelled; the record still closes at
# its official length through the end-of-record identifier at 1508.

# Pagina 5, apartado 6 (Operaciones en regimen simplificado). Its two
# actividad blocks are repeating operator-supplied modulo rows -- epigrafe
# IAE, unidades and importe per modulo, indice corrector, cuota minima and
# the derived cuota -- carried by per-slot manual_input bindings in the
# sibling bindings fragment, the same shape Modelo 131 files. A binding is
# addressed by POSITION and carries no box number, so the repeated rows need
# neither one casilla smeared across both actividades nor invented box
# numbers. Scale is read from the design's own Contenido column: a modulo
# unit count is "8 enteros 2 decimales", not an integer.
