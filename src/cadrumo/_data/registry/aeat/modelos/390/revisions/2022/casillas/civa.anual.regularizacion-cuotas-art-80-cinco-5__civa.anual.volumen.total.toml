# Pagina 6 apartados 7 (resultado de la liquidacion anual), 9 (resultado de las
# liquidaciones) and 10 (volumen de operaciones). Every box number, offset and
# length is transcribed verbatim from this revision's own bundled Diseno de
# Registros (source aeat-dr-390-2022, sha256
# 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe).
#
# Apartado 8 (tributacion por razon de territorio, boxes 87-94) is NOT authored
# here. Those boxes attribute the annual result between the territorio comun and
# the foral administrations, and that attribution is established by the
# Concierto Economico con el Pais Vasco and the Convenio Economico de Navarra,
# neither of which is defined in the legal catalogue; grounding them on a LIVA
# framework article alone would assert a provenance they do not have. Box [659]
# (IVA a la importacion con opcion de diferimiento) is deferred for the same
# reason -- its establishing provision is not in the catalogue either.
#
# All are optional operator inputs; a blank slot is a valid zero.

