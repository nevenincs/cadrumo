# The annual devengada must carry the SAME intracomunitaria cuota the four
# M303 quarters carry, or the M390<->M303 reconciliation diverges. Both the
# goods leg (LIVA arts. 13/15) and the services leg (art. 69.Uno.1, read
# subject to art. 70) self-assess under art. 84.Uno.2.a), and the quarterly
# line combines them because the official M303 boxes 10/11 and 36/37 are
# titled "de bienes y servicios"; the annual aggregate therefore selects both
# categories too.
[[revisions."2024".bindings]]
id = "modelo-390-iva-autorepercutido-intracomunitaria-cuota"
source = "ledger_iva_aggregation"
selector = { categories = ["intra_community_acquisition_reverse_charge", "intra_community_service_acquisition_reverse_charge"], rate_kinds = ["general", "reduced", "super_reduced"], flow_direction = "inversion_sujeto_pasivo", fact = "iva_amount_sum", observation_roles = ["settlement"], cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"] }
aggregation = { op = "sum" }
legal_refs = ["ley-37-1992:art-69", "ley-37-1992:art-70", "ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2024", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]

[[revisions."2024".bindings.source_citations]]
source_ref = "aeat-modelo-390-procedure"
required_text = ["modelo 390"]

# Recargo de equivalencia cuota devengada — annual, mirrors the M303
# casillas 21/24/158 (LIVA art. 161) so the ledger-derived annual devengada
# total includes the recargo cuota a supplier charges a recargo-de-equivalencia
# retailer. Without these, iva.anual.cuota-devengada-total silently excludes
# recargo (grounded against the AEAT Manual practico IVA 2024 Cap. 9 annual
# worked example — see the formula's comment for the cross-quarter figures).
# The super-reduced 1.0pct tier (M303 casilla 18) has no ledger binding on
# M303 either (manual input there); it stays out of scope of this fix. The
# super-reducido 0.5pct recargo tier (M303 casilla 158, domestic_super_reduced
# / rate_kind "super_reduced") mirrors the general/reducido tiers above and
# closes the residual gap left after the general/reducido wiring: without it,
# any recargo-de-equivalencia filer whose supplier charges the 4pct
# super-reducido rate (and therefore the 0.5pct recargo, LIVA art. 161) had
# that tier's annual cuota silently excluded from
# iva.anual.cuota-devengada-total, symmetrically breaking the
# modelo-390-cuota-devengada-total-equals-reconciliacion-303 BLOCKING_RULE for
# that filer (the reconciled-against figure sums the four filed Modelo 303
# quarters' casilla 27, which includes recargo casilla 158 per the M303
# 2023-y-siguientes and 2009-y-siguientes fixes).
[[revisions."2024".bindings]]
id = "modelo-390-iva-recargo-equivalencia-general-cuota"
source = "ledger_iva_aggregation"
selector = { categories = ["domestic_general"], rate_kinds = ["general"], flow_direction = "repercutido", fact = "recargo_amount_sum", observation_roles = ["settlement"], cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"] }
aggregation = { op = "sum" }
legal_refs = ["ley-37-1992:art-161", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2024", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]

[[revisions."2024".bindings.source_citations]]
