# Indicador de pagina complementaria, offset 12, length 1.
#
# On the paginas below AEAT declares the whole contenido as 'En blanco':
# there is no datum at this position and the filer writes a blank. These are
# fillers because the DESIGN says blank, not because no carrier was handy.
#
# Paginas 5 and 7 declare the SAME offset as 'Blanco (No complementaria) o
# "C" (Complementaria)' -- a real operator datum -- and are deliberately NOT
# authored here: no carrier in this registry emits "C" (data_type "boolean"
# renders the canonical "X" and blank only), so writing them any way
# available would put wrong bytes on the wire.
#
