# Rate-specific box-layer bindings for the Reg. ordinario block of the annual
# resumen. Each admits exactly ONE applied_rate, so it draws only from rows whose
# rate the ledger actually recorded, and a row whose rate is unknown reaches none
# of them. That is the deliberate behaviour documented on the applied_rates
# selector: an unmeasured line must not land in a box asserting a specific rate.
#
# These COMPLEMENT the rate-blind tier bindings rather than replacing them. The
# tier bindings keep feeding the annual devengada total and therefore keep every
# row, including rate-unrecorded ones; these feed the per-rate boxes. Narrowing
# a tier binding instead of adding these would delete the rate-unrecorded rows
# from the total outright.
#
# All seven rates resolve inside an annual (0A) aggregation for 2024, though
# three of them only inside part of the year: 5 % applies 1 Jul - 30 Sep and
# 7,5 % and 2 % from 1 Oct (RDL 4/2024 art. 1), each coexisting with its tier's
# ordinary rate. An annual return spans all of those windows, which is why a
# per-rate box is needed at all -- the tier alone cannot separate them.

[[revisions."2010-y-siguientes".bindings]]
id = "modelo-390-iva-repercutido-tipo-21-base"
source = "ledger_iva_aggregation"
selector = { categories = ["domestic_general"], rate_kinds = ["general"], applied_rates = ["0.21"], flow_direction = "repercutido", fact = "base_amount_sum", observation_roles = ["settlement"], cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"] }
aggregation = { op = "sum" }
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
