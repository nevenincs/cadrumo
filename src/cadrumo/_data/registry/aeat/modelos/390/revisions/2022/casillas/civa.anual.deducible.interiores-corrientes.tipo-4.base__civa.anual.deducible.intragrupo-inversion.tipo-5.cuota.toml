
# Apartado 5 "IVA deducible" boxes of paginas 3 and 4 that the fichero-BOE
# layout could not write. Every box number, offset and length is transcribed
# verbatim from this revision's own bundled Diseno de Registros (source
# aeat-dr-390-2022, sha256
# 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe).
#
# Pagina 3 carries the deducible rungs by origin -- operaciones interiores
# corrientes, operaciones intragrupo corrientes, bienes de inversion
# (interiores and intragrupo), importaciones (corrientes and de inversion) and
# adquisiciones intracomunitarias (bienes corrientes, bienes de inversion and
# servicios) -- each split base/cuota per rate plus its own printed total.
# Pagina 4 carries the compensaciones del REAGP, the cuotas deducibles por
# resolucion administrativa o sentencia firmes con tipos no vigentes, and the
# rectificacion de deducciones (ordinary and intragrupo).
#
# "Oper. intra. bienes de inversion" is the intragrupo rung, not an
# intracomunitaria one: the design pairs it with "Total oper. intragrupo
# corrientes" and spells every intracomunitaria rung "Adqui. intra.".
#
# All are optional operator inputs: a filer without operations of a given
# origin leaves the rung blank, and a blank slot is a valid zero.

