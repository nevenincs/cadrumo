# Apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota - Reg. ordin.":
# fourteen consecutive money fields, one per official box, ordered 0 %, 2 %, 4 %,
# 5 %, 7,5 %, 10 %, 21 % with base preceding cuota within each rate. Offsets and
# box numbers read off the bundled 2024 Diseno de Registro, page 2, campos 6-19.
#
# Each field names a rate-SPECIFIC casilla. The rate-blind tier casillas that
# previously wrote 98/200/234 no longer export: a tier is not a rate, so on 2024
# dates the reducido tier legitimately carried 10 %, 7,5 % and 5 % at once and one
# tier figure in box [04] declared all three as 10 %. Those casillas remain the
# rate-blind TOTAL layer, still feeding the annual devengada total and still
# catching rows whose rate the ledger never recorded.
#
# The whole run is declared, not only the three boxes previously written. Writing
# 4 % without 2 %, or 10 % without 7,5 % and 5 %, would drop the temporary-rate
# money from the record entirely rather than merely mis-allocate it.

