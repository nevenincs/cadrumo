# Régimen simplificado cuota devengada fold-in: the annual resumen (M390 box
# 79 "IVA devengado - Total cuota resultante" of the régimen simplificado
# apartado) carries the cuota devengada the operator settled in the fourth-quarter
# Modelo 303 (casilla 54 "RS - Total cuota resultante"). Régimen simplificado is
# determined annually and declared in the 4T autoliquidación only (1T-3T are
# ingresos a cuenta), so the source is the single 4T quarter, carried (copy) onto
# the 0A annual target — not summed across quarters like the régimen general totals.
