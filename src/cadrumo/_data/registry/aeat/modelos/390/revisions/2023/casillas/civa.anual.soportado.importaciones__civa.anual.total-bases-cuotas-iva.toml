# Rate-blind AIC TOTAL layer, feeding the annual devengada total formula
# (modelo-390-iva-anual-cuota-devengada-total) so an AIC row whose rate was
# never recorded is still counted. NO LONGER EXPORTED: it previously carried
# export_refs pointing at the ISP (inversion del sujeto pasivo) box [28],
# which was the defect -- AIC and domestic ISP are different LIVA hechos
# imponibles (art. 13/85 vs art. 84) and the design gives them different
# boxes. The rate-specific box layer for this quantity lives in
# civa.anual.aic.bienes.tipo-0.base__civa.anual.aic.servicios.tipo-21.cuota.toml,
# and the domestic ISP boxes [27]/[28] now have their own casillas in
