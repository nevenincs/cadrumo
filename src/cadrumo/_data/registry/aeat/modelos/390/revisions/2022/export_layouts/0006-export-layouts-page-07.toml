# NOT AUTHORED, deliberately: indicador de pagina complementaria at
# offset 12, length 1. AEAT declares its contenido as
# 'Blanco (No complementaria) o "C" (Complementaria)' -- a real
# operator datum whose wire alphabet is blank or "C". No carrier in this
# registry can emit it: data_type "boolean" renders the canonical "X" and
# blank only (_fixed_width_codec._render_boolean), a literal would force "C"
# onto every filing, and a filler would silently blank a real flag. Authoring
# it any of those ways would write wrong bytes, so the position is left
# unwritten and reported instead. Paginas 5 and 7 are the only two pages
# carrying this flag; every other page declares the position 'En blanco'.

