# Pagina 7: apartado 11 (operaciones especificas) and apartado 12
# (prorratas). This design record had no authored record at all; the
# coverage gate joined its sheet to the envelope header on the shared
# "<T"/"390" constants alone. The "07000" page discriminant below makes the
# join unique and per-record.
#
# The apartado 12 prorrata block (30 positions: five activity rows of
# [114]-[118] plus five free-text activity names) is NOT written here. See
# the sibling casilla fragment for why.
#
# Offsets and lengths are transcribed verbatim from aeat-dr-390-2022 (sha256 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe).
#
# End-of-record constant: this design publishes "</T3900700>", eleven
# characters in a field it declares twelve bytes wide (cell H53 of the
# bundled workbook, read raw). The 2024 and 2025 designs publish
# "</T39007000>" in the SAME cell of the same sheet at the identical offset
# and length, and every other page of every year follows "</T390NN000>".
# The eleven-character spelling is an AEAT publication typo; writing it
# verbatim would emit a record one byte short and shift every following byte
# of the file. The corrected constant is read from AEAT's own later
# publication of this same record, not invented.
#
# KNOWN CONSEQUENCE, deliberate: the export-layout coverage gate joins a
# design sheet to an authored record by comparing declared constants, and
# disqualifies any record that CONTRADICTS the sheet at a shared coordinate.
# Writing the correct twelve-character tag therefore contradicts the typo at
# (765, 12), so for the 2022 and 2023 revisions this sheet falls back to the
# envelope header and the positions authored below are not credited to it.
# That is the gate meeting a defective source, not a defect in this record.
# Do NOT 'fix' it by writing the eleven-character tag: that trades a correct
# filing for a green measurement.

