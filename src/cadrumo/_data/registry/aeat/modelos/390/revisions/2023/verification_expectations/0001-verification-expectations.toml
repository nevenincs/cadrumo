[[revisions."2023".verification_expectations]]
id = "modelo-390-iva-annual-chain-verification"
computed_casilla_ids = ["iva.anual.cuota-devengada-total", "iva.anual.cuota-deducible-total", "iva.anual.resultado-regimen-general"]
tolerance = "0.00"
rounding = "money-2"
min_coverage = "1"
discrepancy_causes = [
    "extraction_unreliable",
    "unmodelled_rule",
    "rounding",
    "correctness_divergence",
]
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2023", "aeat-modelo-390-procedure"]
# Grounded against the AEAT Manual practico IVA 2024, Cap. 9 "La declaracion-
# resumen anual. Modelo 390" (pag. 293-302) worked example, which threads a
# single "senor 'X'" scenario through all four Modelo 303 quarterly
# liquidaciones of ejercicio 2024. The annual devengada/deducible/resultado
# totals are the sum of the manual's own four printed quarterly "TOTAL CUOTA
# DEVENGADA" / "TOTAL A DEDUCIR" solucion lines (88.416 / 68.202 / 20.214
# anual). See test_m390_2024_annual_manual_worked_example.py and
# corpus/manual_oracles/modelo-390-2024-resumen-anual-cuatro-trimestres.json.
externally_grounded_casilla_ids = ["iva.anual.cuota-devengada-total", "iva.anual.cuota-deducible-total", "iva.anual.resultado-regimen-general"]

