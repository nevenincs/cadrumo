# Pagina 1 identity facts whose existing producer key renders exactly the
# alphabet AEAT declares. The three flags below are '"0" - blanco, "1" -
# Si, "2" .- No' and `yes_no` renders "1"/"2", so they agree.
#
# @109, @110, @118, @119, @133 and @134 are NOT wired: AEAT declares them
# '"0" o "1"', a BINARY alphabet, while the only available carriers render
# "1"/"2". Writing m303.redeme_enrolled into @109 would emit "2" where the
# design defines only "0" or "1", so they are left unwritten instead.
#
