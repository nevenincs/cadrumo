id = "modelo-390-2022-fichero-boe"

# Envelope footer. Relocated out of 0002 so that it is DECLARED after every page
# record: the export parity check requires the declared record sequence to equal
# the sequence sorted by `order`, and pagina 8 (order 8) is authored in a later
# fragment than 0002. The footer therefore takes order 9 and declares last.
#
# It joins no design sheet: it declares no literal constant of its own (its only
# field is the computed closing tag), so the coverage gate's constant-based join
# has nothing to match it on. That is correct -- Pag. 0 of the Diseno de
# Registros describes the <AUX> wrapper, not a separate footer record.

[[revisions."2022".export_layouts.records]]
id = "modelo-390-envelope-footer"
record_type = "envelope_footer"
order = 9
encoding = "iso-8859-1"
line_ending = "none"

