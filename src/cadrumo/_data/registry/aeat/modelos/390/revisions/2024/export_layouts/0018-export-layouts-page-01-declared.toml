# Pagina 1's operator-declared positions: the sujeto-pasivo regime flags,
# the sustitutiva markers, the datos estadisticos activity rows and the
# representante blocks. All are values the declarant states ON the form,
# so they are manual_input bindings pinned to hand-authored binding
# fields.
#
# Hand-authored rather than derived through binding_record, deliberately:
# this record carries no casilla and no binding field of its own, and it
# is required, so arming the binding_record suppression would refuse the
# whole export for any declarant leaving these optional boxes empty.
#
# The sibling identity fragment declined @109/@110/@118/@119/@133/@134
# because AEAT declares them '"0" o "1"' while the producer keys that
# could feed them render "1"/"2". That enumerated producer keys only: a
# text manual_input binding renders the operator's own value, so "0" and
# "1" are exactly the bytes it emits.
#
# Offsets and lengths transcribed from aeat-dr-390-2024.

