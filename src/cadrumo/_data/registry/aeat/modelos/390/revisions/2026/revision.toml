# Edition for ejercicio 2026, authored from the form Orden HAC/27/2026
# approves and from AEAT's own diseno de registro for it. Its articulo tercero
# replaces anexo I of Orden EHA/3111/2009 with its own anexo IV, and its
# disposicion final unica, punto 2, applies that form for the first time to the
# declaracion-resumen anual of ejercicio 2026. The form is bundled as the whole
# BOE disposicion (boe-modelo-390-2026-form, BOE-A-2026-1761, anexo IV at pages
# 18-26); the design is AEAT's "390 - Ejercicio 2026 y siguientes" workbook
# (aeat-dr-390-2026), which the 300-399 record-design index lists as the only
# current Modelo 390 design, having moved "Ejercicio 2025" to its historical page.
#
# WHAT THE FORM CHANGES, measured against the 2025 edition's box inventory: every
# numbered box of the 2025 diseno is still printed, and one box is new -- [112],
# "Pago a cuenta atribuible a la Administracion del Estado deducido en el
# ejercicio por entregas de gasolinas, gasoleos y biocarburantes", printed in
# apartado 7 and again in apartado 8. The form's own captions carry it into the
# results: "Resultado de la liquidacion (84 + 659 - 85 - 112)" and "(92 + 659 -
# 93 - 112)". The preamble states the purpose: the declaracion-resumen must be
# presentable when the pago a cuenta of Orden HAC/1495/2025 (modelo 319) was
# deducted during the year. Page 1 also gains a SI/NO mark for that right.
#
# WHAT THE DESIGN CHANGES, measured against aeat-dr-390-2025 through the
# project's record-design parser: page 1 gains that mark as a one-character
# field at position 133 ("1" Si, "2" No), so every later page-1 position moves
# by one and the record grows by one byte; page 6 gains box [112] at position 81
# in apartado 7 and again at position 225 in apartado 8, so the rest of the page
# moves by seventeen and then thirty-four; page 7 widens each of the five
# prorrata "Codigo CNAE [114]" fields from three to four characters (still
# CNAE-2025), moving every later page-7 position. The other pages are unchanged.
# The page bindings below move with those positions; the export layout is
# generated from the design.
#
# WHY CALCULATION AND NOT FILING. The edition was held at applicability while
# no 2026 design existed to generate a layout from; the design is now captured
# and the layout generated from it, and the formulas carry box [112] into the
# results, so the edition computes its amounts. Filing grade asserts every
# family is resolved, and extraction_profiles is not: the filed-declaracion
# profile anchors on a filed 2025 PDF, no 2026 declaracion has been filed yet to
# ground new anchors (see cleared_families), so filing waits for one.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-11-11
authority_grade = "calculation"
valid_from = 2026-01-01
valid_to = 2026-12-31
period_selector = { years = [2026], periods = ["0A"] }
legal_refs = [
    "rd-1624-1992:art-71",
    "orden-eha-3111-2009:art-1",
    "orden-eha-3111-2009:art-8",
    "orden-hac-27-2026:art-tercero",
    "orden-hac-27-2026:disposicion-final-unica",
]
orden_aplicabilidad = [
    "orden-eha-3111-2009:art-1",
    "orden-hac-27-2026:art-tercero",
]
source_refs = [
    "boe-modelo-390-2026-form",
    "aeat-dr-390-2026",
    "aeat-modelo-390-procedure",
    "boe-modelo-390-2009-form",
]
family_storage_baseline = "2025"
