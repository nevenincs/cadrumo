# Modelo 390 revision 2025: the Real Decreto-ley 4/2024 temporary 2 % and
# 7,5 % rate rungs of apartado 5 (paginas 2 and 3).
#
# These rates do not exist on the 2022 design, so each rung is a genuinely
# new box rather than a cross-year reuse. Every one derives its section,
# cardinality and LIVA grounding from the EXISTING sibling rung of the same
# family in this same revision. real-decreto-ley-4-2024:art-1, which
# established the two rates, is deliberately NOT cited here: it lapsed on
# 2024-12-31 and cannot ground a 2025 devengo. This revision's own
# casilla_continuidad_evolutions records that drop, leaving the rungs on the
# standing LIVA articles alone.
#
# The family, rate and base/cuota split are read from the design's own
# description. The base/cuota split is taken from the TRAILING segment:
# pagina 2's apartado is itself titled "Base imponible y cuota", so a
# whole-string test marks every row on that page a base and would write each
# cuota figure into its sibling base box.
#
# Offsets, lengths and box numbers transcribed from aeat-dr-390-2025
# (sha256 6d33d8a4245976e55dc31ff85065b420f76d1588110dc1eb541a8039c5e3f252).

