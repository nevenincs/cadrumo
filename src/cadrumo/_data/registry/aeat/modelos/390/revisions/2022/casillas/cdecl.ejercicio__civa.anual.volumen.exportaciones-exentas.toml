# Rate-specific box-layer casillas for the Recargo de equivalencia block. Each
# carries the official AEAT box number read off the bundled 2024 Diseno de
# Registros, apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota -
# Recargo de equivalencia" rows, stated explicitly rather than left implied by an
# export position. Every position in that apartado appears twice, once under Reg.
# ordinario and once under Recargo de equivalencia, so a number matched on offset
# alone would be ambiguous; these are segment-resolved.
#
# The casilla is named for its RECARGO rate, matching the official box label,
# while its binding narrows on the IVA rate that statute pairs with it. The three
# rate-blind recargo tier casillas remain the TOTAL layer: they keep their
# bindings, keep feeding the annual devengada total, and keep every row including
# one whose IVA rate was never recorded. That layer therefore sums to MORE than
# this one by exactly the rate-unrecorded amount.
#
# These carry no export_refs yet. The record decomposition for this block is
# being established separately, and writing a rate box into the record before the
# shortfall refusal covers it would render an unpopulated money field as 0,00 --
# turning a silence into a false nil.

