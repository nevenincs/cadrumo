# Modelo 390 apartado 11, "Operaciones especificas" (pagina 7 of the
# Diseno de Registros). Eleven boxes, each occupying exactly one position.
#
# Apartado 12 ("Prorratas", boxes [114]-[118]) is NOT registered here, and
# correctly so: on this page each of those box numbers occupies FIVE
# distinct positions, one per declared activity. One casilla carried forward
# would render a single activity's value into all five rows; five casillas
# would invent box numbers AEAT does not print. Neither is the answer -- the
# rows are operator-supplied per-slot data, carried by position-addressed
# manual_input bindings that hold no box number at all, the same way Modelo
# 131 files its repeating Actividad 1..N slots. See the page 7 export-layout
# and bindings fragments.
#
# Every box number, offset and length is transcribed verbatim from this
# revision's own bundled Diseno de Registros (source aeat-dr-390-2022,
# sha256 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe), pagina 7.

