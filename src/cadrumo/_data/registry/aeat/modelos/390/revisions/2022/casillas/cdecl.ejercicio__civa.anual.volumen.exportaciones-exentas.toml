# Modelo 390 pagina 6: apartado 7 box [659] and the apartado 8 block,
# "Tributacion por razon de territorio" (Administraciones).
#
# Apartado 8 RESTATES three apartado-7 boxes with byte-identical labels --
# [658], [84] and [659]. Those are the same box written twice, so each is one
# casilla carrying two export_refs, never a second casilla. [658] and [84]
# already exist on this revision and simply gain their second export_ref;
# [659] is new and is declared here with both of its positions. Only
# [87]-[91] (the administration percentages) and [92]-[94] (the
# territorio-comun results) are genuinely new boxes.
#
# GROUNDING GAP, stated rather than papered over: the territorial split is
# governed by the Concierto Economico con el Pais Vasco (Ley 12/2002 art. 27)
# and the Convenio Economico con Navarra (Ley 28/1990). Neither is in the
# legal catalogue -- ley-12-2002 is present only at art. 15, which grounds
# Impuesto sobre Sociedades and NOT IVA, so citing it here would be a false
# citation. These casillas therefore carry the same LIVA framework refs as
# the apartado-7 result boxes already registered beside them on this page.
#
# Offsets, lengths and box numbers transcribed from aeat-dr-390-2022
# (sha256 7c6554f3182df51daaec37284dd891eb925e1f92df7e69bc01b8ccfb8e4f26fe), pagina 6.

