# Exhaustive reconcile-when-present verification for Modelo 390 revision
# 2024: every computed casilla not enrolled in the coverage-gated
# contract is value-reconciled against the engine WHEN the filing prints it,
# but is EXCLUDED from the coverage denominator, so enrolling a situational
# casilla never lowers coverage or flips a legitimate filing's verdict
# (min_coverage = 0). Mirrors the Modelo 303 contract of the same name.
#
# iva.anual.total-bases-cuotas-iva is situational for a DIFFERENT reason than
# its Modelo 303 counterparts, and the distinction is worth keeping. The M303
# situational boxes carry export required=true, so the fichero always writes a
# zero for them and only the PRINTED form leaves them blank. This one carries
# export required=FALSE: the record slot ITSELF is optional, so its absence is
# legitimate at the record level and not merely at the print level.
#
# Both shapes take this class, because the enrolment gate's criterion is
# "coverage-gated if it is an always-present final, reconcile-when-present
# otherwise" and neither is always-present. The reasons differ; the answer does
# not.
#
# HONEST NOW, NOT COMPLETE. Reconcile-when-present never surfaces
# MISSING_IN_FILED. Today that costs nothing, because no extraction profile
# targets this id, so neither side ever carries it and nothing is checked
# either way. IF A PROFILE LATER TARGETS IT, an omission of a value the filer
# owed will read as legitimately absent rather than under-declared. That is the
# silent direction, and whoever adds the extraction coverage owns the question.
#
# Grounded on the revision's own AEAT DR and framework-law refs, reused from
# modelo-390-iva-annual-chain-verification. No externally_grounded_casilla_ids:
# no bundled oracle prints this total as its own figure, and declaring one
# without evidence is the claim this corpus refuses.
[[revisions."2024".verification_expectations]]
id = "modelo-390-2024-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "iva.anual.total-bases-cuotas-iva",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2024", "aeat-modelo-390-procedure"]
