# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # 1,4 %, 1 % and 0,62 % recargo rates, so all three merged into box [600] and
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # [694] and [666] stayed empty. Each binding here admits exactly one IVA rate and
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # therefore exactly one recargo rate, so each official box draws only its own.
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # These COMPLEMENT the rate-blind tier bindings rather than replacing them. The
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # tier bindings keep feeding modelo-390-iva-anual-cuota-devengada-total and
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # therefore keep every row, including one whose IVA rate the ledger never
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # recorded; these feed the per-rate boxes and admit no such row. Narrowing a tier
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # binding instead of adding these would delete the rate-unrecorded recargo from
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # the declared annual total outright.
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # The recargo rate is not chosen here -- it follows the IVA rate by statute:
