# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #   IVA 21 %  -> recargo 5,2 %   LIVA art. 161.1
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #   IVA 10 %  -> recargo 1,4 %   LIVA art. 161.2 (via art. 91.uno)
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #   IVA  4 %  -> recargo 0,5 %   LIVA art. 161.3 (via art. 91.dos)
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #   IVA 7,5 % -> recargo 1 %     RDL 4/2024 art. 1.Dos, 1 Oct - 31 Dec 2024
