# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #   IVA  2 %  -> recargo 0,26 %  RDL 4/2024 art. 1.Dos, 1 Oct - 31 Dec 2024
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # The tabaco rung (recargo 1,75 %, LIVA art. 161.4, boxes [41]/[42]) is absent
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # because the IVA category it depends on is not modelled at all; that is a
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # separate omission from this merge and is not repaired by adding a rung here.
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: #
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # The 0 % rung (boxes [663]/[664]) is likewise absent, and for a different
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # reason: the recargo block has no rate-blind ZERO tier binding, so adding a
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # rate-specific 0 % recargo box would create the one shape that loses money
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # silently -- a rate-specific rung with no total layer behind it. Giving it one
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # means adding a term to the annual devengada total formula, which is a change
# Original bindings modelo-390-iva-recargo-equivalencia-tipo-1-4-cuota commentary: # to a money-bearing total and a decision of its own.
