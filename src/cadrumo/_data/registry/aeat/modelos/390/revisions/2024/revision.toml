[revisions."2024".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo has no box crediting IRPF withholding suffered, so there is no credit casilla for an entry to name."""
legal_refs = ["rd-1624-1992:art-71", "orden-eha-3111-2009:art-1", "orden-eha-3111-2009:art-8"]
source_refs = ["aeat-dr-390-2024", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]

[revisions."2024".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["rd-1624-1992:art-71", "orden-eha-3111-2009:art-1", "orden-eha-3111-2009:art-8"]
source_refs = ["aeat-dr-390-2024", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]

[revisions."2024".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-390-2024-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through \
the same revision."""
legal_refs = [
    "rd-1624-1992:art-71",
    "orden-eha-3111-2009:art-1",
    "orden-eha-3111-2009:art-8",
]
source_refs = [
    "aeat-dr-390-2024",
    "aeat-modelo-390-procedure",
    "boe-modelo-390-2009-form",
]

