# Per-tier rate-BLIND base-imponible casillas for the AIC block, one per
# (category, rate_kind) combination the box layer above splits. Mirrors the
# domestic Reg. ordinario pattern exactly (iva.anual.repercutido.general.base
# etc.): each catches a row whose TIER is known but whose specific rate is
# not, so an unrated AIC row still lands somewhere instead of falling out of
# every box. Internal only (no export_refs), matching that same precedent --
# AEAT's design has no box for a rate-unrecorded AIC amount.

