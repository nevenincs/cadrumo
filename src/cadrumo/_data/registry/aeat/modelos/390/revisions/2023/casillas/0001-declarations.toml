# Rate-specific box-layer casillas for the Reg. ordinario block. Each carries the
# official AEAT box number read off the bundled 2024 Diseno de Registros
# (apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota - Reg. ordin."),
# stated explicitly rather than left implied by an export position, so the
# casilla-to-box correspondence is readable without re-deriving it from offsets
# and disambiguating the regimen segment.
#
# Each casilla owns its official box in the record: the fourteen consecutive
# money fields at offsets 13-250 of page 2, base preceding cuota within each
# rate. The rate-blind tier casillas that previously wrote 98/200/234 no longer
# export, so no casilla both totals and asserts a rate.
#
# The tier casillas remain the TOTAL layer: rate-blind, feeding the annual
# devengada total, keeping every row including those whose rate is unrecorded.
# That layer sums to MORE than this one by exactly the rate-unrecorded amount,
# which is why the export refuses on the difference rather than hiding it.

