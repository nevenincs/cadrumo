# Modelo 390 pagina 6 for revision 2023: apartados 7, 8, 9 and 10.
#
# Each box below was proved to be the SAME official box as revision
# 2022's: the 2023 design row and the 2022 design row share
# offset, length and a byte-identical description, and 2022 writes that
# coordinate from a casilla-kind export field. Where that proof failed the row
# was left unwritten rather than assumed -- see the notes at the end.
#
# Boxes [658], [84] and [659] appear TWICE on this page: once in apartado 7
# and once restated verbatim in apartado 8 (tributacion por razon de
# territorio). Each is one casilla carrying two export_refs, never two
# casillas.
#
# GROUNDING GAP: the apartado-8 territorial split is governed by the Concierto
# Economico con el Pais Vasco (Ley 12/2002 art. 27) and the Convenio Economico
# con Navarra (Ley 28/1990). Neither is in the legal catalogue -- ley-12-2002
# is present only at art. 15, which grounds Impuesto sobre Sociedades and NOT
# IVA -- so those casillas carry the LIVA framework refs of the apartado-7
# result boxes beside them rather than a citation that would be false.
