# Base imponible casillas of the annual régimen-general block. Each is the
# sibling of an already-declared cuota casilla and carries the official AEAT box
# number read off the bundled 2024 Diseño de Registros (apartado 5, "Operaciones
# Reg. Gral. - Base Imponible y cuota - Reg. ordin."): the design pairs a base
# box with every cuota box, so these amounts are asked for by the form.
#
# Unlike most casillas on this revision, these carry REAL official box numbers
# rather than a repeated semantic id, because the record design states them
# unambiguously. They declare no export_refs: the M390 export layout is the
# fixed-width fichero-BOE, and adding positional fields to it is a separate
# change with its own parity gate. A bound casilla with no export_ref is a valid
# internal aggregation surface — it is drawn, persisted and shown, but not yet
# written into the fichero.
#
# None of these participates in a formula. The annual devengada and deducible
# totals sum CUOTAS; the base boxes sit beside them on the form and are declared
# in their own right, so adding these cannot alter
# iva.anual.resultado-regimen-general.

[[revisions."2023".casillas]]
