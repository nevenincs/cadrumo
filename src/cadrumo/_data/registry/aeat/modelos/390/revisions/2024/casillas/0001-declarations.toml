# Rate-specific box-layer casillas for the Recargo de equivalencia block. Each
# carries the official AEAT box number read off the bundled 2024 Diseno de
# Registros, apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota -
# Recargo de equivalencia" rows, stated explicitly rather than left implied by an
# export position. Every position in that apartado appears twice, once under Reg.
# ordinario and once under Recargo de equivalencia, so a number matched on offset
# alone would be ambiguous; these are segment-resolved.
#
# The casilla is named for its RECARGO rate, matching the official box label,
# while its binding narrows on the IVA rate that statute pairs with it. The three
# rate-blind recargo tier casillas remain the TOTAL layer: they keep their
# bindings, keep feeding the annual devengada total, and keep every row including
# one whose IVA rate was never recorded. That layer therefore sums to MORE than
# this one by exactly the rate-unrecorded amount.
#
# These carry no export_refs yet. The record decomposition for this block is
# being established separately, and writing a rate box into the record before the
# shortfall refusal covers it would render an unpopulated money field as 0,00 --
# turning a silence into a false nil.
# Box [694] - "Recargo de equivalencia - Tipo 1% - Cuota". RDL 4/2024 art. 1.Dos
# pairs it with the temporary 7,5 % rate. Vigencia: 1 oct - 31 dic 2024.
# Box [666] - "Recargo de equivalencia - Tipo 0,62% - Cuota". RDL 4/2024 art.
# 1.Uno pairs it with the temporary 5 % rate. Vigencia: 1 jul - 30 sep 2024.
# Box [692] - "Recargo de equivalencia - Tipo 0,26% - Cuota". RDL 4/2024 art.
# 1.Dos pairs it with the temporary 2 % rate. Vigencia: 1 oct - 31 dic 2024.
# Rate-specific box-layer casillas for the Reg. ordinario block. Each carries the
# official AEAT box number read off the bundled 2024 Diseno de Registros
# (apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota - Reg. ordin."),
# stated explicitly rather than left implied by an export position, so the
# casilla-to-box correspondence is readable without re-deriving it from offsets
# and disambiguating the regimen segment.
#
# Each casilla owns its official box in the record: the fourteen consecutive
# money fields at offsets 13-250 of page 2, base preceding cuota within each
# rate. The rate-blind tier casillas that previously wrote 98/200/234 no longer
# export, so no casilla both totals and asserts a rate.
#
# The tier casillas remain the TOTAL layer: rate-blind, feeding the annual
# devengada total, keeping every row including those whose rate is unrecorded.
# That layer sums to MORE than this one by exactly the rate-unrecorded amount,
# which is why the export refuses on the difference rather than hiding it.
# Box [669] - "Tipo 7,5 % - Base imponible". Vigencia: desde el 1 de octubre de 2024 (RDL 4/2024 art. 1).
# Box [670] - "Tipo 7,5 % - Cuota". Vigencia: desde el 1 de octubre de 2024 (RDL 4/2024 art. 1).
# Box [702] - "Tipo 5 % - Base imponible". Vigencia: del 1 de julio al 30 de septiembre de 2024 (RDL 4/2024 art. 1).
# Box [703] - "Tipo 5 % - Cuota". Vigencia: del 1 de julio al 30 de septiembre de 2024 (RDL 4/2024 art. 1).
# Box [667] - "Tipo 2 % - Base imponible". Vigencia: desde el 1 de octubre de 2024 (RDL 4/2024 art. 1).
# Box [668] - "Tipo 2 % - Cuota". Vigencia: desde el 1 de octubre de 2024 (RDL 4/2024 art. 1).

