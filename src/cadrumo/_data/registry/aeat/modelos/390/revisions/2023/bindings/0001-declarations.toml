# Annual IVA soportado deducible en importaciones — mirrors the M303
# import-deducible cuota onto the annual resumen so the deducible total includes
# imports. Selects import_third_country soportado lines across the rate tiers.
# The annual devengada must carry the SAME intracomunitaria cuota the four
# M303 quarters carry, or the M390<->M303 reconciliation diverges. Both the
# goods leg (LIVA arts. 13/15) and the services leg (art. 69.Uno.1, read
# subject to art. 70) self-assess under art. 84.Uno.2.a), and the quarterly
# line combines them because the official M303 boxes 10/11 and 36/37 are
# titled "de bienes y servicios"; the annual aggregate therefore selects both
# categories too.
# Recargo de equivalencia cuota devengada — annual, mirrors the M303
# casillas 21/24/158 (LIVA art. 161) so the ledger-derived annual devengada
# total includes the recargo cuota a supplier charges a recargo-de-equivalencia
# retailer. Without these, iva.anual.cuota-devengada-total silently excludes
# recargo (grounded against the AEAT Manual practico IVA 2024 Cap. 9 annual
# worked example — see the formula's comment for the cross-quarter figures).
# The super-reduced 1.0pct tier (M303 casilla 18) has no ledger binding on
# M303 either (manual input there); it stays out of scope of this fix. The
# super-reducido 0.5pct recargo tier (M303 casilla 158, domestic_super_reduced
# / rate_kind "super_reduced") mirrors the general/reducido tiers above and
# closes the residual gap left after the general/reducido wiring: without it,
# any recargo-de-equivalencia filer whose supplier charges the 4pct
# super-reducido rate (and therefore the 0.5pct recargo, LIVA art. 161) had
# that tier's annual cuota silently excluded from
# iva.anual.cuota-devengada-total, symmetrically breaking the
# modelo-390-cuota-devengada-total-equals-reconciliacion-303 BLOCKING_RULE for
# that filer (the reconciled-against figure sums the four filed Modelo 303
# quarters' casilla 27, which includes recargo casilla 158 per the M303
# 2023-y-siguientes and 2009-y-siguientes fixes).
# -----------------------------------------------------------------------------
# Cross-modelo previous_filing bindings — aggregate the four 303 quarterly
# autoliquidaciones into the annual resumen totals. Implements the canonical
# 390 <- 303 dependency where the resumen anual reconciles against the four
# trimestrales filed during the ejercicio.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Bound casillas surfacing the 5 ledger_iva_aggregation bindings + the 3
# previous_filing bindings as casilla values. Annual resumen mirrors the 303
# result-casilla shape (devengada / deducible / resultado) plus reconciliation
# casillas pulling each total from the four 303 quarters.
# -----------------------------------------------------------------------------
# Annual régimen-general base-imponible aggregation bindings. The resumen anual
# already aggregated the CUOTA of these rows (the sibling *-cuota bindings,
# fact = iva_amount_sum) but drew no base imponible at all: every IVA observation
# carries a base_amount that reached no binding on the annual return, while the
# quarterly Modelo 303 draws its base through the matching
# modelo-303-iva-*-base bindings. The AEAT Diseño de Registros pairs a "Base
# imponible" box with every "Cuota" box of the Reg. ordinario block (2024 design,
# apartado 5: 21% base [05] / cuota [06], 10% base [03] / cuota [04], 4% base
# [01] / cuota [02]) and pairs the deducible total likewise ("Total oper. inter.
# corrientes bienes y servic." base [48] / cuota [49]), so the annual form does
# ask for these amounts — the omission was ours, not the form's.
#
# Each selector mirrors its sibling cuota binding EXACTLY (same categories, same
# rate_kinds, same flow_direction) and differs only in fact = base_amount_sum, so
# the base and the cuota of one tier are drawn from the same observation set and
# cannot select divergent rows.
#
# These bindings feed casillas that participate in NO formula: the annual
# devengada/deducible totals sum cuotas, never bases. Adding them therefore
# cannot move iva.anual.resultado-regimen-general — the base boxes are declared
# alongside the cuota boxes on the official form, not summed into it.
#
# legal_refs are kept a subset of each target casilla's sibling cuota refs (and
# therefore of the enclosing construct's refs) so the bound-casilla coverage
# check holds without authoring a new legal-catalogue entry; LIVA art. 78 (base
# imponible, regla general) is not currently in the bundled catalogue and
# fabricating an entry for it would breach the bundled-corpus grounding rule.
# The rate-blind total for the zero tier. Its three sibling tiers each carry
# one, so a row whose applied_rate was never recorded still reaches that tier's
# total and only the RATE box goes unclaimed. The zero tier had no blind layer
# at all: its only two bindings both pin applied_rates = 0.00, so a zero-rated
# row with no recorded rate reached NOTHING and its base imponible left the
# return silently. No cuota is lost -- a zero-rated supply's cuota is zero --
# but the base is a declared figure AEAT reconciles.
#
# Declares no export_refs, exactly like its three siblings: this is the internal
# total layer, and box [700] is the rate layer that writes to the record. That
# split is what lets the rate-box coverage gate read a shortfall here, which is
# the whole point of adding it.
# Rate-specific box-layer bindings for the Reg. ordinario block of the annual
# resumen. Each admits exactly ONE applied_rate, so it draws only from rows whose
# rate the ledger actually recorded, and a row whose rate is unknown reaches none
# of them. That is the deliberate behaviour documented on the applied_rates
# selector: an unmeasured line must not land in a box asserting a specific rate.
#
# These COMPLEMENT the rate-blind tier bindings rather than replacing them. The
# tier bindings keep feeding the annual devengada total and therefore keep every
# row, including rate-unrecorded ones; these feed the per-rate boxes. Narrowing
# a tier binding instead of adding these would delete the rate-unrecorded rows
# from the total outright.
#
# All seven rates resolve inside an annual (0A) aggregation for 2024, though
# three of them only inside part of the year: 5 % applies 1 Jul - 30 Sep and
# 7,5 % and 2 % from 1 Oct (RDL 4/2024 art. 1), each coexisting with its tier's
# ordinary rate. An annual return spans all of those windows, which is why a
# per-rate box is needed at all -- the tier alone cannot separate them.
# Rate-specific box-layer bindings for the Recargo de equivalencia block of the
# annual resumen, the recargo counterpart of the Reg. ordinario layer beside it.
#
# The three rate-blind recargo bindings in 0001 select recargo_amount_sum routed
# by the line's IVA rate TIER, and the official design keys its recargo boxes by
# the recargo RATE. Those are not the same axis: one reducido tier carries the
# 1,4 %, 1 % and 0,62 % recargo rates, so all three merged into box [600] and
# [694] and [666] stayed empty. Each binding here admits exactly one IVA rate and
# therefore exactly one recargo rate, so each official box draws only its own.
#
# These COMPLEMENT the rate-blind tier bindings rather than replacing them. The
# tier bindings keep feeding modelo-390-iva-anual-cuota-devengada-total and
# therefore keep every row, including one whose IVA rate the ledger never
# recorded; these feed the per-rate boxes and admit no such row. Narrowing a tier
# binding instead of adding these would delete the rate-unrecorded recargo from
# the declared annual total outright.
#
# The recargo rate is not chosen here -- it follows the IVA rate by statute:
#
#   IVA 21 %  -> recargo 5,2 %   LIVA art. 161.1
#   IVA 10 %  -> recargo 1,4 %   LIVA art. 161.2 (via art. 91.uno)
#   IVA  4 %  -> recargo 0,5 %   LIVA art. 161.3 (via art. 91.dos)
#   IVA 7,5 % -> recargo 1 %     RDL 4/2024 art. 1.Dos, 1 Oct - 31 Dec 2024
#   IVA  5 %  -> recargo 0,62 %  RDL 4/2024 art. 1.Uno, 1 Jul - 30 Sep 2024
#   IVA  2 %  -> recargo 0,26 %  RDL 4/2024 art. 1.Dos, 1 Oct - 31 Dec 2024
#
# The tabaco rung (recargo 1,75 %, LIVA art. 161.4, boxes [41]/[42]) is absent
# because the IVA category it depends on is not modelled at all; that is a
# separate omission from this merge and is not repaired by adding a rung here.
#
# The 0 % rung (boxes [663]/[664]) is likewise absent, and for a different
# reason: the recargo block has no rate-blind ZERO tier binding, so adding a
# rate-specific 0 % recargo box would create the one shape that loses money
# silently -- a rate-specific rung with no total layer behind it. Giving it one
# means adding a term to the annual devengada total formula, which is a change
# to a money-bearing total and a decision of its own.
# Volumen de operaciones (LIVA art. 121) ledger draws for apartado 10 boxes
# [103] and [104]. Both are base-only, zero-cuota disclosure aggregations: the
# ledger_iva_aggregation resolver sums the base_amount of the matching exempt
# repercutido observations. They mirror the M303 casilla-59 and casilla-60
# selectors exactly, which is what lets the annual return and the summed
# quarters state the same population.
#
# Box [103] admits ONLY intra_community_supply, and the official box title is
# NOT authority to widen it. The ejercicio-2021 design widened the printed
# label to "Entregas intracomunitarias de bienes y servicios", which reads as
# an invitation to add a services category; it is not one. A plain B2B service
# supplied to an EU-established taxable person is located outside the TAI by
# LIVA art. 69.Uno.1, so it is not subject in Spain and belongs in the
# no-sujetas box, never here. Only a supply with a Spanish fiscal adjustment
# point under art. 25 belongs in [103], and the operator declares that by
# tagging intra_community_supply explicitly. This is the same ruling the M303
# casilla-59 binding records, applied to the same population on the annual
# return; widening one side alone would also break their agreement.
#
# Box [104] is "Exportaciones y otras operaciones exentas con derecho a
# deduccion", so its selector accepts both zero-rated export members: art. 21
# grounds the exportaciones de bienes leg and art. 22 the operations assimilated
# to exports.
#
# The flow direction is repercutido on both, which is the whole reason these
# two boxes are modellable and the sibling inversion-del-sujeto-pasivo volumen
# box is not: art. 121 counts only supplies "efectuadas por el sujeto pasivo",
# and a reverse-charge category collapses the supplier and recipient sides onto
# one flow, so no selector can restrict it to the taxpayer's own supplies.
# Rate-specific bindings for the adquisiciones intracomunitarias (AIC) box
# layer. See the sibling casillas file
# (civa.anual.aic.bienes.tipo-0.base__civa.anual.aic.servicios.tipo-21.cuota.toml)
# for the full account of the defect this closes and the epoch scoping.
# Selector rate_kind convention matches the M390 recargo rate-box layer and
# the M303 transitional-rate rungs already in this tree: 21% -> general;
# 5%/7,5%/10% -> reduced; 2%/4% -> super_reduced; 0% -> zero.
# Domestic reverse-charge (inversion del sujeto pasivo, LIVA art. 84.Uno.2)
# bindings feeding boxes [27]/[28]. Rate-blind by design -- see the casillas
# file header -- mirroring Modelo 303's own domestic_reverse_charge binding,
# which likewise sums general/reduced/super_reduced together.
# Per-tier rate-blind AIC bindings backing the casillas above. Fact scoped to
# base_amount_sum only, matching the established precedent
# (test_every_rate_split_base_tier_carries_exactly_one_rate_blind_binding);
# the cuota counterpart is a separate, deliberately deferred decision (see
# that domestic gate's own zero-tier docstring).
# Modelo 390 2022, página 1, casillas 74--83.  One source family consumes the
# immutable filed/current Modelo 303 4T calculation revision; endpoint bindings
# merely name arrival slots and never replay a scalar relation or observation.

