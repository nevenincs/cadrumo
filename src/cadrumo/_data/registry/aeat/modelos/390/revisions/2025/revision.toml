# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # Rate-specific box-layer casillas for the Recargo de equivalencia block. Each
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # carries the official AEAT box number read off the bundled 2024 Diseno de
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # Registros, apartado 5, "Operaciones Reg. Gral. - Base Imponible y cuota -
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # Recargo de equivalencia" rows, stated explicitly rather than left implied by an
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # export position. Every position in that apartado appears twice, once under Reg.
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # ordinario and once under Recargo de equivalencia, so a number matched on offset
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # alone would be ambiguous; these are segment-resolved.
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: #
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # The casilla is named for its RECARGO rate, matching the official box label,
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # while its binding narrows on the IVA rate that statute pairs with it. The three
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # rate-blind recargo tier casillas remain the TOTAL layer: they keep their
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # bindings, keep feeding the annual devengada total, and keep every row including
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # one whose IVA rate was never recorded. That layer therefore sums to MORE than
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # this one by exactly the rate-unrecorded amount.
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: #
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # These carry no export_refs yet. The record decomposition for this block is
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # being established separately, and writing a rate box into the record before the
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # shortfall refusal covers it would render an unpopulated money field as 0,00 --
# Original casillas iva-anual-repercutido-recargo-tipo-1-base commentary: # turning a silence into a false nil.

