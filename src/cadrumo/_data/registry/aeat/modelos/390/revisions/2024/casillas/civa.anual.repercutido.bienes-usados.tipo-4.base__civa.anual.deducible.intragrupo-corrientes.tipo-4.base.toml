
# Modelo 390 revision 2024: casillas keyed by OFFICIAL BOX NUMBER.
#
# Identity proof, per row: the box number appears on BOTH this revision's
# design and revision 2022's with a byte-identical label, and
# 2022's casilla for that number is a plain manual input already
# written by a casilla-kind export field.
#
# The number is the key, NOT the offset. This design inserts rate rungs that
# shift every later position: offset 13 of pagina 3 is the 2 % base here and
# the 4 % base in 2022. Matching on offset would write one rate's
# figure into another rate's box. Offsets, lengths and labels below all come
# from THIS revision's own design.
#
# Transcribed from aeat-dr-390-2024 (sha256 8be79bacc86034c3c7951d2ea671c030800ed9a4cc3f52b9e5d407bc19bc03f0).

