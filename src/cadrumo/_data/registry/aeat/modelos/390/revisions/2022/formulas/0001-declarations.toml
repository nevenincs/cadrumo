[[revisions."2022".formulas]]
id = "modelo-390-iva-anual-cuota-devengada-total"
target_casilla_id = "iva.anual.cuota-devengada-total"
expression = { op = "add", args = [
    { casilla_id = "iva.anual.repercutido.general" },
    { casilla_id = "iva.anual.repercutido.reducido" },
    { casilla_id = "iva.anual.repercutido.super-reducido" },
    { casilla_id = "iva.anual.autorepercutido.intracomunitaria" },
    { casilla_id = "iva.anual.autorepercutido.interior.cuota" },
    { casilla_id = "iva.anual.repercutido.recargo.general" },
    { casilla_id = "iva.anual.repercutido.recargo.reducido" },
    { casilla_id = "iva.anual.repercutido.recargo.super-reducido" },
] }
rounding = "money-2"
# The recargo de equivalencia cuota tiers (LIVA art. 161) were omitted from
# this aggregate, mirroring the M303 casilla-27 defect (see the comment on
# modelo-303-iva-cuota-devengada-total in the M303 2023-y-siguientes
# revision.toml): a supplier that charges recargo to a recargo-de-equivalencia
# customer had its recargo cuota silently excluded from the annual "Total
# cuota devengada", and therefore from iva.anual.resultado-regimen-general and
# from the modelo-390-cuota-devengada-total-equals-reconciliacion-303
# BLOCKING_RULE (which compares this total against the sum of the four filed
# Modelo 303 quarters' casilla 27, which DOES include recargo per the M303
# fix — a mismatch would have blocked every recargo-de-equivalencia filer's
# resumen anual). Grounded and cross-validated against the AEAT Manual
# practico IVA 2024 Cap. 9 "La declaracion-resumen anual. Modelo 390" worked
# example (pag. 293-302), summing its own four printed quarterly "TOTAL CUOTA
# DEVENGADA" solucion lines (1T: 23.088, 2T: 21.624, 3T: 22.290, 4T: 21.414 =
# 88.416 anual), each of which itself sums its own printed "Recargo de
# equivalencia" line (1T: 1.248, 2T: 624, 3T: 1.248, 4T: 624 = 3.744 anual) —
# see test_m390_2024_annual_manual_worked_example.py. The general/reducido
# tiers fixed the manual worked example (which charges no super-reducido
# recargo); the super-reducido 0.5pct tier (M303 casilla 158,
# iva.anual.repercutido.recargo.super-reducido) closes the residual gap the
# manual example could not surface, structurally proven by
# test_m390_super_reducido_recargo_delta.
#
# Box [28], the domestic inversion del sujeto pasivo devengada (LIVA art.
# 84.Uno.2), is added as Modelo 303 adds its box [13] to [27]. Its deducible half
# is in [49]/[51] exactly as it is in 303 [29]/[31], so leaving [28] out would
# lower the annual result below the sum of the year's 303 results by that cuota.
legal_refs = ["ley-37-1992:art-84", "ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-161", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]

[[revisions."2022".formulas.source_citations]]
source_ref = "aeat-modelo-390-procedure"
required_text = ["modelo 390"]

# Box [34] "Total bases y cuotas IVA - Cuota" (page 02, Reg. Gral. section) is a
# distinct printed total from box [47] "Total cuotas IVA y recargo de
# equivalencia" (page 02 bis): [34] sums the Reg. ordinario IVA rungs only, and
# the recargo de equivalencia block sits in a separate section that [34] never
# reaches. modelo-390-iva-anual-cuota-devengada-total feeds [47] (see its
# form_number) and correctly includes recargo; that value must never be
# written to [34], which this formula alone feeds. This total covers the five
# devengada rungs this revision currently models (general/reducido/
# super-reducido repercutido, autorepercutido intracomunitaria, and the domestic
# inversion del sujeto pasivo of box [28], which the design lists inside the
# block [34] totals); the intragrupo, criterio de caja, bienes usados and
# agencias de viajes rungs box [34] also sums on the official design are
# separate, already-tracked modelling gaps, not reopened here.
[[revisions."2022".formulas]]
id = "modelo-390-iva-anual-total-bases-cuotas-iva"
target_casilla_id = "iva.anual.total-bases-cuotas-iva"
expression = { op = "add", args = [
    { casilla_id = "iva.anual.repercutido.general" },
    { casilla_id = "iva.anual.repercutido.reducido" },
    { casilla_id = "iva.anual.repercutido.super-reducido" },
    { casilla_id = "iva.anual.autorepercutido.intracomunitaria" },
    { casilla_id = "iva.anual.autorepercutido.interior.cuota" },
] }
rounding = "money-2"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-69", "ley-37-1992:art-70", "ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]

[[revisions."2022".formulas.source_citations]]
source_ref = "aeat-modelo-390-procedure"
required_text = ["modelo 390"]

