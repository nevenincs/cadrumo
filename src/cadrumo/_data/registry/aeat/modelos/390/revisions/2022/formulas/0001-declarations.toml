# [64] Suma de deducciones adds the annual counterpart of every term of Modelo
# 303 box [45] = [29] + [31] + [33] + [35] + [37] + [39] + [41] + [42] + [43] +
# [44]: [49], [51], [53], [55], [57] + [598] (the 390 splits [37] into bienes
# and servicios), [59], [62], [61], [63] and [522]. Each annual box selects the
# rows its quarterly box selects, so [64] equals the sum of the year's [45] and
# the blocking reconciliation against the filed 303s holds box by box.
legal_refs = ["ley-37-1992:art-80", "ley-37-1992:art-84", "ley-37-1992:art-92", "ley-37-1992:art-94", "ley-37-1992:art-95", "ley-37-1992:art-104", "ley-37-1992:art-105", "ley-37-1992:art-107", "ley-37-1992:art-108", "ley-37-1992:art-109", "ley-37-1992:art-110", "ley-37-1992:art-130", "rd-1624-1992:art-71", "orden-eha-3111-2009:art-1"]

