# Apartado 7, "Resultado de la liquidacion anual". The Manual practico de IVA,
# capitulo 9, states the two boxes the same way in its 2022 (pag. 237), 2023,
# 2024 and 2025 editions: "Casilla 84: ... el sumatorio de las liquidaciones
# efectuadas en el regimen general (casilla 65) y en el regimen simplificado
# (casilla 83) al que se anadira el importe de la casilla 658" and "Casilla 86:
# ... el importe resultante de restar a la suma de las casillas (84) y (659) el
# importe de la casilla (85)". The diseno de registro of every supported year
# keeps [658], [84], [659], [85] and [86] in apartado 7 with those numbers, so
# no year diverges.
[[revisions."2022".formulas]]
