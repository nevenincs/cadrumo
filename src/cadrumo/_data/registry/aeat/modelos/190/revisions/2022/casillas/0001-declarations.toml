# Modelo 190 Tipo 1 (registro de declarante) header casillas.
#
# These are the operator-supplied slots of the declarante record: the contact
# person, the declaration's own identifying numbers, and the complementaria /
# sustitutiva flags. Each was previously written as a `filler`, which emits the
# design's blanks or ceros and gives the operator NO channel to supply the datum
# at all; the design expects a real value in every one of them.
#
# Shapes follow modelo 270's declarante header, which AEAT lays out at the same
# positions with the same meanings (108-120, 121, 122, 123-135), and modelo 189
# for the same header block. `required = false` throughout except the numero
# identificativo, matching those precedents: AEAT admits blancos or ceros in each
# when the filer has no value, so an unfilled slot stays a valid record.
#
# The SELLO ELECTRONICO at 488-500 is deliberately NOT among them. AEAT reserves
# it for its own programs ("sera cumplimentado exclusivamente por los programas
# de la AEAT. En cualquier otro caso, se rellenara a blancos"), so leaving it
# unwritten is the correct authoring, not a gap.
# Printed box number. `number` above is the fichero-BOE positional range, which is
# what that field means; the resumen page prints "Numero total de percepciones
# relacionadas en la declaracion (1) ... 01 1".
# Printed box number; the resumen page prints "Importe total de las percepciones
# relacionadas ... 02 1.000,00".
# Printed box number; the resumen page prints "Importe total de las retenciones e
# ingresos a cuenta relacionados ... 03 1.000,00".
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the design's
# family-composition count positions (223-254). Every sub-count is its own
# template slot because the Detalle sheet needs one operator-editable cell per
# count; the design's own no-content for every count is zeros, and the
# prestamos-vivienda clave is always recorded for the claves the design names.
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the
# incapacidad-laboral blocks (256-321) and the IMV complemento clave (322),
# which is where this epoch's perceptor record ends: its diseño states
# "323-500 - BLANCOS.", so the clave-E foral retention split that the 2023 and
# later editions carry has no position here. Same contract as the sibling
# casilla fragments; the design's own no-content for every amount is zeros.
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the
# design's identificacion and clave-coded positions: representative NIF, the
# non-incapacidad especie block's repercutidos amount, ejercicio de devengo,
# the spouse/unit-titular NIF, and the four clave-restricted one-digit claves.
# Same template-slot contract as the sibling casilla fragments.
# Design clave 0-3, always recorded for claves A, B (01, 03, 04, 99) and C;
# clave 0 is the recorded "no disability" fact, never a default.
# Design clave 1-4, always recorded for clave A; different contract types on
# one perceptor must split into separate records per the design.
# Design clave 1-2, always recorded for clave L.29; clave 2 obligates the
# titular's NIF in perc.nif-conyuge-titular-unidad.
# Design clave 0-1 (art. 19.2.f) mobility deduction), always recorded for
# clave A; clave 0 is the recorded "not entitled" fact, never a default.
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas.
#
# One row of the repeating perceptor record. `number` carries the AEAT
# record-design position range each slot occupies, transcribed from
# "B. TIPO DE REGISTRO 2: REGISTRO DE PERCEPTOR" of the diseño governing this
# exercise. This revision declares no export layout, so the casillas record
# the design's coordinates without claiming a fichero-BOE producer.
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the
# remaining obligatorio positions of the bundled diseño: domicilio provincia,
# the Ceuta/Melilla retention determination, birth year and family situation.
# Same contract as cperc.nif__cperc.ingresos-a-cuenta.toml: `number` carries
# the AEAT record-design position range, and this revision declares no export
# layout.
# The payer's retention-rate determination, never derived from the province.
# This epoch's diseño admits exactly two claves here: 1 where the art. 68.4
# Ceuta/Melilla deduction applied, 0 otherwise. The La Palma clave 2 does NOT
# exist in this design -- it first appears in the 2023 edition -- so no La
# Palma authority is cited.
# Declared by the design only for claves A, B (subclaves 01, 03, 04, 99) and C;
# the resolver writes the design's own no-content for every other row.
# Design claves 1-3, declared only for the same claves as the birth year;
# same resolver rule writes the design's own no-content elsewhere.
# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the
# design's four deduction-side money campos (171-222): reductions the payer
# considered, deductible expenses, compensatory pension and food annuities.
# Same template-slot contract as the sibling casilla fragments; the design's
# own no-content for every one of these is zeros.
# LIRPF art. 32 is NOT cited here, unlike the 2023 and later revisions: the
# catalogue entry for it carries effective_from 2023-01-01, so it does not
# reach this exercise. Art. 18, which governs the irregular-income reduction
# this campo carries, is in force throughout.

