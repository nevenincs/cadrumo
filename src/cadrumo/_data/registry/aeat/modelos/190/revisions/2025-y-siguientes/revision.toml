[revisions."2025-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "The 2024 and 2025 Diseño de Registros editions split the perceptor record only at its tail (the 2025 edition carves positions 389-394 out of the 2024 edition's blancos run), and every casilla shared across the split keeps its id, its number and its grounding unchanged -- so no continuity transition carries anything to declare, and the casilla_continuidad_evolutions family is empty by construction rather than unbuilt. A transition becomes necessary only when an edition renumbers or re-grounds a box."
