# the Ceuta/Melilla-La Palma retention determination, birth year and family
# situation. Same template-slot contract as
# cperc.nif__cperc.ingresos-a-cuenta.toml: each casilla is the slot a
# `row_field_casilla_ids` entry names on the `modelo-190-perceptor` export
# record, and `number` carries the AEAT record-design position range.

