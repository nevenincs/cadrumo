# Declarante resumen formulas for the modelo 190 ejercicio-2023 fichero BOE.
#
# Both totals are the sums the aeat-dr-190-2023 design states in its own
# Contenido text for positions 145-160 and 161-175, taken over the type-2
# records this declaration emits. They are assembled from the per-position row
# sums rather than from another modelo's declarations, so the whole calculation
# stays inside this exercise's own authority.

[[revisions."2023".formulas]]
id = "modelo-190-percepciones-total"
target_casilla_id = "decl.percepciones-total"
expression.op = "add"
expression.args = [
    { binding = "modelo-190-perceptor-rows-percepcion-dineraria-total" },
    { binding = "modelo-190-perceptor-rows-percepcion-especie-total" },
    { binding = "modelo-190-perceptor-rows-incapacidad-dineraria-total" },
    { binding = "modelo-190-perceptor-rows-incapacidad-especie-total" },
]
rounding = "money-2"
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]

[[revisions."2023".formulas.source_citations]]
source_ref = "aeat-modelo-190-procedure"
required_text = ["modelo 190"]

