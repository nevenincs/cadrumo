# Modelo 190 Tipo 1 (registro de declarante) header casillas.
#
# These are the operator-supplied slots of the declarante record: the contact
# person, the declaration's own identifying numbers, and the complementaria /
# sustitutiva flags. Each was previously written as a `filler`, which emits the
# design's blanks or ceros and gives the operator NO channel to supply the datum
# at all; the design expects a real value in every one of them.
#
# Shapes follow modelo 270's declarante header, which AEAT lays out at the same
# positions with the same meanings (108-120, 121, 122, 123-135), and modelo 189
# for the same header block. `required = false` throughout except the numero
# identificativo, matching those precedents: AEAT admits blancos or ceros in each
# when the filer has no value, so an unfilled slot stays a valid record.
#
# The SELLO ELECTRONICO at 488-500 is deliberately NOT among them. AEAT reserves
# it for its own programs ("sera cumplimentado exclusivamente por los programas
# de la AEAT. En cualquier otro caso, se rellenara a blancos"), so leaving it
# unwritten is the correct authoring, not a gap.

[[revisions."2024".casillas]]
