# Modelo 190 fichero BOE, ejercicio 2022, transcribed from the bundled
# hash-pinned aeat-dr-190-2020 record design (Orden EHA/3127/2009 as updated by
# Orden HAC/1285/2020), whose own applicability window closes 2022-12-31.
#
# Tipo 1 (registro de declarante) carries the design's 16 rows at positions
# 1-500 unchanged; that sheet is byte-identical in the 2020, 2023 and 2024
# editions, so the declarante fields here repeat the geometry the filing-grade
# 2024 sibling already emits.
#
# Tipo 2 (registro de perceptor) ENDS at position 322 in this edition. The
# design states "323-500 - BLANCOS.", so the clave-E foral retention split
# (323-387) and the empresas-emergentes clave (388) that the 2023 and 2024
# editions add are absent here rather than omitted, and the closing filler
# spans the blancos the design itself declares.
