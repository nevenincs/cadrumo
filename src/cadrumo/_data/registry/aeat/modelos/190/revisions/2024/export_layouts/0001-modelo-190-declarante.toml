# Design campo 9 subdivision 121 DECLARACION COMPLEMENTARIA: a "C" when
# this presentation adds percepciones wholly omitted from an earlier
# declaration of the same ejercicio. Authored as its own one-character
# casilla rather than half a two-byte filler, because AEAT declares 121
# and 122 as two independent fields and admits a different letter in each;
# modelo 270 splits the same pair the same way. The amendment_evidence
# producers cannot serve here -- is_complementaria is a boolean and a
# boolean export field renders "X", not the "C" this design admits -- so
# the filer supplies it.
