# Modelo 190 Tipo 2 (registro de perceptor) detail-row casillas for the
# remaining obligatorio positions of the bundled diseño: domicilio provincia,
# the Ceuta/Melilla retention determination, birth year and family situation.
# Same contract as cperc.nif__cperc.ingresos-a-cuenta.toml: `number` carries
# the AEAT record-design position range, and this revision declares no export
# layout.

[[revisions."2022".casillas]]
id = "perc.provincia"
continuidad_id = "payee-province"
number = "76-77"
section = ["perceptor", "identificacion"]
data_type = "province_code"
semantic_role = "payee_province"
required = true
input_kind = "manual"
legal_refs = ["orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "ley-35-2006:art-99", "ley-58-2003:art-93"]

[[revisions."2022".casillas]]
id = "perc.ceuta-melilla"
continuidad_id = "payee-ceuta-melilla-clave"
number = "152"
section = ["perceptor", "percepcion"]
data_type = "text"
semantic_role = "payee_ceuta_melilla_clave"
# The payer's retention-rate determination, never derived from the province.
# This epoch's diseño admits exactly two claves here: 1 where the art. 68.4
# Ceuta/Melilla deduction applied, 0 otherwise. The La Palma clave 2 does NOT
# exist in this design -- it first appears in the 2023 edition -- so no La
# Palma authority is cited.
required = true
input_kind = "manual"
legal_refs = ["orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "ley-35-2006:art-99", "ley-58-2003:art-93", "ley-35-2006:art-68.4"]

[[revisions."2022".casillas]]
id = "perc.ano-nacimiento"
continuidad_id = "payee-birth-year"
number = "153-156"
section = ["perceptor", "identificacion"]
data_type = "year"
semantic_role = "payee_birth_year"
# Declared by the design only for claves A, B (subclaves 01, 03, 04, 99) and C;
# the resolver writes the design's own no-content for every other row.
required = true
input_kind = "manual"
legal_refs = ["orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "ley-35-2006:art-99", "ley-58-2003:art-93"]

[[revisions."2022".casillas]]
id = "perc.situacion-familiar"
continuidad_id = "payee-family-situation"
number = "157"
section = ["perceptor", "identificacion"]
data_type = "text"
semantic_role = "payee_family_situation"
# Design claves 1-3, declared only for the same claves as the birth year;
# same resolver rule writes the design's own no-content elsewhere.
required = true
input_kind = "manual"
legal_refs = ["orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "ley-35-2006:art-99", "ley-58-2003:art-93"]
