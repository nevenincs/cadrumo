[[revisions."2022".applicability]]
id = "m190-seed"
applicable_entity_types = ["attribution_entity", "legal_entity", "natural_person"]
required_payer_fact = "pays_withheld_income"
applicable_reason = "Modelo 190 (resumen anual de retenciones del IRPF): el contribuyente que paga rendimientos del trabajo o de actividades profesionales sujetos a retención presenta el resumen anual de las retenciones declaradas en el Modelo 111."
not_applicable_reason = "Modelo 190 no aplica: el resumen anual de retenciones del IRPF solo corresponde a quien paga rendimientos sujetos a retención."
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-108"]

# RIRPF art. 76.1: "Con carácter general, estarán obligados a retener o ingresar a cuenta, en
# cuanto satisfagan rentas sometidas a esta obligación: ... b) Los contribuyentes que ejerzan
# actividades económicas, cuando satisfagan rentas en el ejercicio de sus actividades." A natural
# person is a retenedor only through letter b); one that declares no actividad económica income is
# not, whatever it pays.
[[revisions."2022".applicability.exclusions]]
id = "m190-sin-actividad"
entity_types = ["natural_person"]
lacking_income_categories = ["actividad_economica"]
reason = "Modelo 190 no aplica: la persona física solo está obligada a retener o ingresar a cuenta cuando ejerce actividades económicas y satisface rentas en el ejercicio de sus actividades (artículo 76.1.b del Reglamento del IRPF), y el perfil no declara una actividad económica, de modo que no actúa como retenedor de los rendimientos del trabajo o de actividades profesionales que satisface."
legal_refs = ["rd-439-2007:art-76"]
