# Perceptor row bindings for the modelo 190 ejercicio-2023 fichero BOE.
#
# One binding per type-2 row field the export layout emits, grounded on the
# bundled aeat-dr-190-2023 record design for the position and on the AEAT
# modelo 190 procedure for the filing route. Over the 2022 edition this adds
# the five clave-E foral retention rows at 323-387. The modelo 111 relation
# prefills and the declarante-total formulas the 2024 edition carries are
# deliberately NOT here: their corpus grounding opens in 2025 and cannot be
# cited by this exercise.
[[revisions."2023".bindings]]
id = "modelo-190-perceptor-row-retenciones-forales-estatal"
provider = { kind = "withholding", fact = "row_field", row_field = "foral_retention_estatal", grouping = "per_perceptor_clave", record = "perceptor", data_type = "money" }
value = { data_type = "money", channel = "row_set", row_grouping = "withholding" }
aggregation = { op = "rows" }
legal_refs = ["orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "ley-35-2006:art-99", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]

[[revisions."2023".bindings.source_citations]]
source_ref = "aeat-modelo-190-procedure"
required_text = ["modelo 190"]

