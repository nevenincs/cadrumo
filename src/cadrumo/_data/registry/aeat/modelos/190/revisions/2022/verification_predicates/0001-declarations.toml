# Under-declaration advisory. 'decl.total-percepciones' (136-144) is the COUNT
# of percepciones, bound from this application's own withholding store, while
# 'decl.percepciones-total' (145-160) is the MONEY total this revision's formula
# sums from the same type-2 records. The two reach the resumen by different
# routes, so a positive count against a zero total is a real disagreement.
#
# ADVISORY, not BLOCKING: implies_nonzero holds trivially when the antecedent is
# at or below zero, so a retenedor with no perceptores never fires it.

[[revisions."2022".verification_predicates]]
id = "implies-nonzero:percepciones-anuales-cuando-perceptores-declarados"
predicate_id = "modelo-190-percepciones-anuales-cuando-perceptores-declarados"
expression = 'implies_nonzero(["decl.total-percepciones", "decl.percepciones-total"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-108", "ley-35-2006:art-101"]
