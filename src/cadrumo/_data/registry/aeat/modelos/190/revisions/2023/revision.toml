[revisions."2023".family_dispositions.dependency_classifications]
reason = """
A dependency classification records how another modelo's declarations reach this one. This edition's declarante resumen takes none: its three totals are the sums the record design itself states over this declaration's own type-2 perceptor records, so the whole calculation closes inside the edition. The 2025 edition classifies a modelo 111 dependency because it routes the same totals through annual relation prefills grounded on the 2025 instrucciones, and those open after this exercise ends. Empty because no cross-modelo edge exists here, not because one is unbuilt."""
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]

[revisions."2023".family_dispositions.extraction_profiles]
reason = """
An extraction profile reads values back out of a filed declaration PDF, and its label patterns must be authored against a specimen of the printed layout for the edition they claim. The corpus holds no modelo 190 justificante for this exercise: the only fixture in the tree reproduces the current printed resumen. Authoring patterns for this edition from that fixture would claim a reading capability against a layout nobody checked, so the family is declared empty rather than filled with unevidenced patterns."""
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]

[revisions."2023".family_dispositions.parameters]
reason = """
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. This edition applies none: both of its formulas are op = 'add', totalling the per-position row sums the record design names, and an addition applies nothing to what it adds. The retention rates that produced those amounts were set by the retenedor at payment time under RD 439/2007 and are already recorded on each perceptor record. Empty by the shape of this modelo's calculation rather than by omission."""
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]

[revisions."2023".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-190-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."""
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
