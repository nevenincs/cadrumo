# Filing-grade historical epoch for modelo 190, filing year 2023.
#
# The gap this closes was authoring debt, not a legal absence: modelo 190 was
# approved by Orden EHA/3127/2009 and filed for 2023, and the record design
# governing that exercise -- Orden EHA/3127/2009 as updated by Orden
# HFP/1286/2023 -- is bundled and hash-pinned as aeat-dr-190-2023, whose own
# applicability window is exactly this exercise.
#
# What this revision establishes, by measurement against that bundled design:
#   - the complete Tipo 1 and Tipo 2 casilla set with the design's own
#     positions, transcribed field by field;
#   - that this design ADDS the clave-E foral retention split at 323-387,
#     absent from the 2020 edition that governs 2022;
#   - that this epoch's perceptor record ENDS at position 387. The design
#     states "388-500 - BLANCOS.", so the empresas-emergentes clave (388) the
#     2024 edition carries is absent here rather than omitted;
#   - and that every legal_ref it cites is in force across the whole exercise.
#
# WHAT THE FILING GRADE CLAIMS HERE, and what it does not. The grade asserts
# that this revision can back a filing draft and its export for ejercicio 2023:
# the fichero BOE layout is transcribed position by position from
# aeat-dr-190-2023, and the type-2 row bindings that fill it are grounded on
# that design for geometry and on aeat-modelo-190-procedure for the filing
# route. Both sources are in force across the whole exercise.
#
# It does NOT claim the 2025-grounded calculation surface. The modelo 111
# relation prefills the 2025 edition routes its totals through are grounded in
# the corpus only by aeat-modelo-190-instructions-2025 and
# boe-modelo-190-2025-form, which open on 2025-01-01 and cannot be cited by a
# 2023 revision. This edition instead totals its own type-2 records, which is
# what the record design's own Contenido text states for positions 145-160 and
# 161-175, so the whole calculation closes inside this exercise's authority.
review_status = "agent_reviewed"
reviewed_by = "agent: authored from the bundled hash-pinned aeat-dr-190-2023 record design. Casilla positions were verified row by row against the design's own position table and against the 2024 revision, and the additive delta separating the epochs was confirmed in the design text. The export layout was derived from the same design, record by record, and its perceptor extent was checked against the design's own blancos boundary at 388. No human operator has countersigned it."
reviewed_at = 2026-09-25
authority_grade = "filing"
id = "2023"
valid_from = 2023-01-01
valid_to = 2023-12-31
