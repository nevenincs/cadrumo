    "rd-439-2007:art-80",
    "ley-35-2006:art-101",
    "rd-439-2007:art-86",
    "ley-58-2003:art-93",
]
orden_aplicabilidad = ["orden-eha-3127-2009:art-1"]
source_refs = ["aeat-dr-190-2023", "aeat-modelo-190-procedure"]
family_storage_baseline = "2022"
