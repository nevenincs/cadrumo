A dependency classification records how another modelo's declarations reach this one. This edition's declarante resumen takes none: its three totals are the sums the record design itself states over this declaration's own type-2 perceptor records, so the whole calculation closes inside the edition. The 2024 sibling classifies a modelo 111 dependency because it routes the same totals through annual relation prefills grounded on the 2025 instrucciones, and those open after this exercise ends. Empty because no cross-modelo edge exists here, not because one is unbuilt."""
legal_refs = ["ley-35-2006:art-99", "orden-eha-3127-2009:art-1", "rd-439-2007:art-108", "rd-439-2007:art-80", "ley-35-2006:art-101", "rd-439-2007:art-86", "ley-58-2003:art-93"]
