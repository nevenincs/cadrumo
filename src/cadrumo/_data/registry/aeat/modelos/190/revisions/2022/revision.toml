# Applicability-grade historical epoch for modelo 190, filing year 2022.
#
# The gap this closes was authoring debt, not a legal absence: modelo 190 was
# approved by Orden EHA/3127/2009 and filed for 2022, and the record design
# governing that exercise -- Orden EHA/3127/2009 as updated by Orden
# HAC/1285/2020 -- is bundled and hash-pinned as aeat-dr-190-2020, whose own
# applicability window closes 2022-12-31.
#
# What this revision establishes, by measurement against that bundled design:
#   - the complete Tipo 1 and Tipo 2 casilla set with the design's own
#     positions, transcribed field by field;
#   - that this epoch's perceptor record ENDS at position 322. The design
#     states "323-500 - BLANCOS.", so the clave-E foral retention split
#     (323-387) and the empresas-emergentes clave (388) that later editions
#     carry are absent here rather than omitted;
#   - that position 152 admits only claves 1 and 0, the La Palma clave 2 being
#     an addition of the 2023 design;
#   - and that every legal_ref it cites is in force across the whole exercise.
#
# Why the grade is 'applicability' and NOT 'filing': the calculation surface of
# this modelo -- the modelo 111 relation prefills, the two declarante-total
# formulas, and the verification expectations built on them -- is grounded in
# the corpus ONLY by aeat-modelo-190-instructions-2025 and
# boe-modelo-190-2025-form, both of which open on 2025-01-01 and so cannot be
# cited by a 2022 revision. The bundled aeat-modelo-190-procedure carries none
# of the required_text those citations depend on. Rather than cite a source
# outside its own window or mint an id for evidence the corpus does not hold,
# this revision declares no bindings, formulas, export layout or completeness
# manifest, and its three declarante totals are operator-supplied.
#
# Promoting this to filing grade needs ONE acquisition: the AEAT modelo 190
# instrucciones for ejercicio 2022, registered as its own source. The record
# geometry is already here and would not change.
review_status = "agent_reviewed"
reviewed_by = "agent: authored from the bundled hash-pinned aeat-dr-190-2020 record design. Casilla positions were verified row by row against the design's own position table and against the 2024 revision, and the three additive deltas separating the epochs were confirmed in the design text. No human operator has countersigned it."
reviewed_at = 2026-09-12
authority_grade = "applicability"
