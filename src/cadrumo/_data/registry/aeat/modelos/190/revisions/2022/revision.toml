# Filing-grade historical epoch for modelo 190, filing year 2022.
#
# The gap this closes was authoring debt, not a legal absence: modelo 190 was
# approved by Orden EHA/3127/2009 and filed for 2022, and the record design
# governing that exercise -- Orden EHA/3127/2009 as updated by Orden
# HAC/1285/2020 -- is bundled and hash-pinned as aeat-dr-190-2020, whose own
# applicability window closes 2022-12-31.
#
# What this revision establishes, by measurement against that bundled design:
#   - the complete Tipo 1 and Tipo 2 casilla set with the design's own
#     positions, transcribed field by field;
#   - that this epoch's perceptor record ENDS at position 322. The design
#     states "323-500 - BLANCOS.", so the clave-E foral retention split
#     (323-387) and the empresas-emergentes clave (388) that later editions
#     carry are absent here rather than omitted;
#   - that position 152 admits only claves 1 and 0, the La Palma clave 2 being
#     an addition of the 2023 design;
#   - and that every legal_ref it cites is in force across the whole exercise.
#
# WHAT THE FILING GRADE CLAIMS HERE, and what it does not. The grade asserts
# that this revision can back a filing draft and its export for ejercicio 2022:
# the fichero BOE layout is transcribed position by position from
# aeat-dr-190-2020, and the type-2 row bindings that fill it are grounded on
# that design for geometry and on aeat-modelo-190-procedure for the filing
# route. Both sources are in force across the whole exercise.
#
# It does NOT claim the 2025-grounded calculation surface. The modelo 111
# relation prefills, the two declarante-total formulas and the verification
# expectations built on them are grounded in the corpus only by
# aeat-modelo-190-instructions-2025 and boe-modelo-190-2025-form, which open on
# 2025-01-01 and cannot be cited by a 2022 revision. Rather than cite a source
# outside its own window, this revision declares none of them and its three
# declarante totals stay operator-supplied. Acquiring the AEAT modelo 190
# instrucciones for ejercicio 2022 is what would add that surface; it would not
# change the record geometry below.
