# Mirrors this modelo's own esquema-union profile, which targets the same two
# header fields with the same labels. Ejercicio and Periodo are the declaration
# header AEAT prints identically across all three OSS/IOSS schemes -- the scheme
# is selected on the form, not by printing a different header -- so the labels
# transfer where a scheme-specific figure would not, and only those two are
# targeted here.
#
# Declared provisional and review_required, unlike the union profile which is
# corpus_round_trip_verified: the bundled justificante fixtures carry one 369
# render (2024-1T) and no exterior or importacion specimen exists to round-trip
# these against. A specimen is what would earn strict confidence.
[[revisions."esquema-exterior".extraction_profiles]]
id = "modelo-369-exterior-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.ejercicio", match_strategy = "named_label", value_kind = "text", label_pattern = 'Ejercicio:'},
    {casilla_id = "decl.periodo", match_strategy = "named_label", value_kind = "text", label_pattern = 'Per[ií]odo:'},
]
confidence = "review_required"
provisional_pending_specimen = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["orden-hac-610-2021:art-1", "orden-hac-610-2021:art-2"]
source_refs = ["aeat-dr-369-2021", "aeat-modelo-369-procedure"]
