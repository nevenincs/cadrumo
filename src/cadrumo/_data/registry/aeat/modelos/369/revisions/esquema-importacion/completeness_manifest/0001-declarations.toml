# Modelo 369 calculation-completeness manifest.
#
# Enumerates the casillas in this revision's calculation closure --
# the casilla set the cross-connecting calculation engine traverses:
# every formula target, every casilla referenced inside a formula
# expression, every formula/binding endpoint casilla, and every
# verification-expectation operand. Cross-modelo binding source
# casillas belong to foreign modelos and are excluded.
#
# Derived off-load-path from the modelo's calculation surface, keyed
# on each closure casilla's canonical casilla_id plus reviewed segment/number metadata.
# A casilla the revision declares but the manifest does not list (a
# pure data-entry field that feeds no calculation) is not a gate
# failure. The off-load-path drift re-verification test re-derives
# this set from the registry calculation surface.

