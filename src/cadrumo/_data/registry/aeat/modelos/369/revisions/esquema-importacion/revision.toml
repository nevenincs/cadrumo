[revisions."esquema-importacion".predecessor.none]
reason = """
Revision 'esquema-importacion' is one of three parallel scheme variants of modelo 369, not a step in a \
sequence. Orden HAC/610/2021 art 1 approves the single modelo 369 for the special OSS/IOSS regimes, and art 2 \
imposes three concurrent filing obligations: letter (c) is the regimen de importacion, filed per mes natural, \
alongside letters (a) exterior and (b) Union. All three editions take effect together on 2021-07-01. This \
manifest's casilla_continuidad_evolutions disposition records the same fact: the revision has no \
strictly-earlier sibling revision of this modelo, so no earlier edition exists for it to be authored relative \
to."""
legal_refs = ["orden-hac-610-2021:art-1", "orden-hac-610-2021:art-2", "ley-37-1992:art-163-quinvicies"]
source_refs = ["boe-modelo-369-2021-form", "aeat-modelo-369-procedure"]

[revisions."esquema-importacion".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-369-importacion-fichero) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration \
through the same revision."""
