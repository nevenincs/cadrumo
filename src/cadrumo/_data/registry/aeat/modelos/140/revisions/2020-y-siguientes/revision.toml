[revisions."2020-y-siguientes"]
authority_grade = "applicability"
# Modelo 140 solicitud de abono anticipado de la deducción por maternidad,
# approved by orden-hac-177-2020 art 1 with its plazo grounded verbatim in
# orden-hac-177-2020 art 5. Scheduling/applicability-grade: declaration-header
# casillas only; no bundled diseño de registro, so no numbered form casilla is
# fabricated.
# Deadline-shape note: art 5 sets an ON-DEMAND plazo — "a partir del momento en
# que el contribuyente opte por la modalidad de abono anticipado" — not a fixed
# calendar window. This revision therefore carries NO calendar deadline_windows
# and no deadline application link; a fixed date is not fabricated. The approval
# and plazo articles are grounded verbatim.
valid_from = 2020-01-01
period_selector = { year_from = 2020, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-177-2020:art-1"]
legal_refs = [
    "orden-hac-177-2020:art-1",
    "orden-hac-177-2020:art-5",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-140-procedure",
    "enrolled-modelo-140-layout",
]


[revisions."2020-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2020-y-siguientes' of modelo 140 has no strictly-earlier sibling revision of this modelo (valid_from 2020-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-hac-177-2020:art-1",
    "orden-hac-177-2020:art-5",
    "ley-58-2003:art-93",
]
