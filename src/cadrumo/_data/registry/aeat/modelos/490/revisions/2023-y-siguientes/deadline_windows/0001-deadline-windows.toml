# Modelo 490 trimestral deadline windows, grounded in orden-hac-590-2021 art 3:
# "el modelo 490 deberá presentarse e ingresarse durante el mes siguiente al
# correspondiente periodo trimestral natural". Each window opens the 1st and
# closes the last natural day of the month following the reference quarter (1T
# closes 30 Apr, 2T 31 Jul, 3T 31 Oct, 4T 31 Jan del año siguiente).

