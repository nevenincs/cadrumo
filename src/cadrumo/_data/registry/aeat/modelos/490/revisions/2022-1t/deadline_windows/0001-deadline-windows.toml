# Modelo 490 trimestral deadline windows for this era, grounded in
# orden-hac-590-2021 art 3, the same provision this revision already cites in
# prose: the modelo is presented and paid during the month following the natural
# quarter. Each window opens the 1st and closes the last natural day of that
# month.
#
# Added 2026-09-12. This edition had no deadline_windows family at all, so every
# quarter it serves stood inside the supported filing span with no plazo.
#
# Dates are NOMINAL; shift_deadline applies weekend and holiday movement at read
# time.

