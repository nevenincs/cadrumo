[revisions."2021-y-siguientes"]
authority_grade = "applicability"
# Modelo 490 autoliquidación del Impuesto sobre Determinados Servicios Digitales,
# approved by orden-hac-590-2021 art 1 with its plazo grounded verbatim in
# orden-hac-590-2021 art 3: se presenta durante el mes siguiente al correspondiente
# periodo trimestral natural. Scheduling/applicability-grade: declaration-header
# casillas only. The authoritative Modelo 490 diseño de registro IS bundled
# (aeat-dr-490-2023) but no casilla-to-position mapping has been authored
# from it yet, so no numbered form casilla is fabricated here (the
# base/cuota money-closure casillas still await that mapping).
valid_from = 2021-01-01
period_selector = { year_from = 2021, periods = ["1T", "2T", "3T", "4T"] }
orden_aplicabilidad = ["orden-hac-590-2021:art-1"]
legal_refs = [
    "orden-hac-590-2021:art-1",
    "orden-hac-590-2021:art-3",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-490-procedure",
    "enrolled-modelo-490-layout",
    "aeat-dr-490-2023",
]


[revisions."2021-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2021-y-siguientes' of modelo 490 has no strictly-earlier sibling revision of this modelo (valid_from 2021-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-hac-590-2021:art-1",
    "orden-hac-590-2021:art-3",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-490-procedure",
