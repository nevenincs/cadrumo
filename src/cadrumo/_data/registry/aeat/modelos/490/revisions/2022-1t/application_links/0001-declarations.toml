# Deadline surface for this era. The 2023-y-siguientes sibling declares the same
# link on the same article; these two editions carried filing and export but not
# deadline, so the surface the deadlines domain consumes was undeclared for the
# whole of 2022 while its plazo article applied throughout.
#
# orden-hac-590-2021 art 3 states the plazo -- presentation and payment during
# the month following the natural quarter -- and took effect 2021-06-09, before
# either of these spans opens. NO source_refs, exactly as the 2023 sibling
# declares it: the legal article is the grounding and no separate AEAT guidance
# document is asserted for this surface.

[[revisions."2022-1t".application_links]]
id = "modelo-490-deadline"
surface = "deadline"
consumer = "cadrumo.domain.deadlines"
requires_snapshot = true
legal_refs = ["orden-hac-590-2021:art-3", "ley-58-2003:art-93"]
# source_refs names the document that CONTAINS the cited article. It is the
# honest citation for this surface even where its tier is layout_authority:
# the field is required, and naming a document that does state the plazo is
# better than naming a guidance page that does not.
source_refs = ["enrolled-modelo-490-procedure"]
