# Modelo 490 fichero BOE fixed-width layout for the 2023 era, transcribed
# position-by-position from aeat-dr-490-2023 (01-490-ejercicio-2023-y-siguientes.xlsx,
# sha256 f55ecbfff8fb552de76f4e788ff7663269c96b6255b209b5289bf0869de89cb8).
#
# Four records, each tiling its declared extent exactly once with no gap and no
# overlap, checked against each sheet's own declared TOTAL row:
#   DR49000 envelope 1..328 (variable, no declared total)
#   DR49001 1..1100   DR49002 1..2000   DR49003 1..2000
#
# Casilla identity is AEAT's own bracketed box number, which this design keeps
# unique within every sheet AND across them (27 + 168 + 170 boxed rows, zero
# duplicates). Rows AEAT leaves unnumbered carry the record type and the design's
# own offset instead: the complementary-page indicator repeats at @12 on all
# three page records, and the regularisation ejercicio repeats at @13 and @909
# within one record, so neither is identifiable by concept alone.
#
# @93+4 (Version del Programa) and @101+9 (NIF Empresa Desarrollo) on the
# envelope are LEFT UNWRITTEN. AEAT marks both "(Nota 1)" -- to be completed by
# the entidad desarrolladora, i.e. the software house, which is neither the
# presenter nor the taxpayer. Modelo 390 writes presenter.tax_id at @101+9; that
# is a known defect and is not copied here. No producer key carries a developer
# identity, so the coverage gate counts two genuine shortfalls rather than
# reporting full marks over a wrong NIF.
