# Modelo 490 fichero BOE fixed-width layout for the 2021 era, transcribed
# position-by-position from aeat-dr-490-2021 (02-490-orden-hac-590-2021-ejercicio-2021-y-2022-hasta-periodo-1t.xlsx,
# sha256 d8115bd4f4d18745c6a20b9b8c184582c3ddc5ba24a6c955ba51dd92f1534fa7).
#
# Each record tiles its declared extent exactly once with no gap and no overlap,
# checked against the sheet's own declared TOTAL row.
#
# Casilla identity is AEAT's own bracketed box number where the design supplies
# one; rows AEAT leaves unnumbered carry the record type and the design's own
# offset, because the complementary-page indicator and the regularisation
# ejercicio each repeat within or across records and are not identifiable by
# concept alone.
#
# @93+4 (Version del Programa) and @101+9 (NIF Empresa Desarrollo) on the
# envelope are LEFT UNWRITTEN. AEAT marks both "(Nota 1)" -- to be completed by
# the entidad desarrolladora, i.e. the software house, which is neither the
# presenter nor the taxpayer. Modelo 390 writes presenter.tax_id at @101+9; that
# is a known defect and is not copied here.
