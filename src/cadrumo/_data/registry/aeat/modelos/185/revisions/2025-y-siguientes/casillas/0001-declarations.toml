# Modelo 185 declaration-header casillas, grounded in orden-hac-1197-2025 art 1.
# Both carry a symbolic `number` rather than an offset span, matching the modelo
# 184 precedent for exactly these two header concepts; the record-detail casillas
# authored from the diseño use offset spans and live in the sibling fragment.
#
# The bundled official diseño de registro `aeat-dr-185-2026` IS this revision's
# source_ref and does carry the full record detail (2 records, 36 fields). An
# earlier note here said no diseño was bundled and used that as the reason to
# author no numbered casilla; that premise was false and the detail is now
# authored from the design itself.
# Modelo 185 record-detail casillas, authored from the bundled official diseno
# de registro `aeat-dr-185-2026` -- 2 records, 36 fields, both exactly 500 bytes.
# Every casilla names ONE design field by its offset span, and the design is the
# sole source of its number, width and label; nothing here is inferred from a
# sibling modelo. Grounded in orden-hac-1197-2025 art 1, which approves the
# modelo and its anexo record designs, and art 4, which fixes the monthly plazo.
#
# The three month columns (mes, mes-1, mes-2) share one semantic_role per
# concept: the role names WHAT the value is, and the month is a coordinate the
# casilla id carries.

