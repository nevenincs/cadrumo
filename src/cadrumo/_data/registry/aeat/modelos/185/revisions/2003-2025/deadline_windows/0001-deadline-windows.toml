# MOVED from the old (wrong) 2025-y-siguientes revision -- these 12 windows all
# carry filing_year=2025, which orden-hac-1197-2025 does not govern (it enters
# into force 2026-01-01, first applying to January 2026 declarations). The real
# governing instrument for 2025 and earlier is orden-hac-96-2003, confirmed by BOE
# search, by this order's own derogatoria clause, and by AEAT's bundled M185 design
# corpus carrying no file at all for 2003-2025 (matching zero amendment intervals).

# Modelo 185 monthly deadline windows, grounded in orden-hac-1197-2025 art 4: la presentación tiene carácter mensual y se realiza en
# el plazo de los diez días naturales siguientes a la finalización del mes al
# que se refiere la declaración. Each window opens the 1st and closes the
# 10th of the month following the reference month.

[[revisions."2003-2025".deadline_windows]]
id = "modelo-185-2025-01"
filing_year = 2025
period = "2025 01"
period_kind = "monthly"
opens_on = 2025-02-01
closes_on = 2025-02-10
legal_refs = ["orden-hac-96-2003:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-185-procedure-2003"]

