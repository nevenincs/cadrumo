# MOVED from the old (wrong) 2025-y-siguientes revision -- these 12 windows all
# carry filing_year=2025, which orden-hac-1197-2025 does not govern (it enters
# into force 2026-01-01, first applying to January 2026 declarations). The real
# governing instrument for 2025 and earlier is orden-hac-96-2003, confirmed by BOE
# search, by this order's own derogatoria clause, and by AEAT's bundled M185 design
# corpus carrying no file at all for 2003-2025 (matching zero amendment intervals).
# Modelo 185 monthly deadline windows, grounded in orden-hac-96-2003 disposición
# Tercero -- the provision that ESTABLISHES this plazo for the years this
# revision governs: "la información mensual, modelo 185 ... se presentará ...
# en el plazo de los diez días naturales siguientes a la finalización del mes a
# que se refiera la información". Each window opens the 1st and closes the 10th
# of the month following the reference month.
#
# Previously this block cited orden-hac-1197-2025 art 4, which the note above
# had already established does NOT govern filing_year 2025; and the windows
# themselves cited disposición Primero, which approves the diseños físicos y
# lógicos and states no timing at all.
# THE 2022, 2023 AND 2024 WINDOWS WERE ADDED 2026-09-12, and they are not a new
# rule. This revision's selector admits every month of 2003-2025, the supported
# filing span opens at 2022, and only 2025 carried windows -- so thirty-six
# coordinates inside the span this corpus promises had no plazo at all.
#
# They are authored from the SAME provision already quoted above, orden-hac-96-2003
# disposicion Tercero, whose plazo is unconditional and names no year: the
# informacion mensual is presented within the ten natural days following the end of
# the month it refers to. The note at the head of this file establishes that this
# orden governs 2025 and earlier, so it governs these three years directly. Each
# window opens the 1st and closes the 10th of the month after its reference month,
# December rolling into January, which is the pattern the twelve 2025 windows
# already follow row for row. Nothing here is inferred from a neighbouring year;
# the clause is arithmetic once its own text is read.
#
# Dates are NOMINAL per the storage rule; shift_deadline applies weekend and
# holiday movement at read time.

