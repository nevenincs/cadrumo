# Modelo 185 monthly deadline windows for ejercicio 2026 onward, grounded in the
# real full orden-hac-1197-2025.html (43910 bytes) art 4: la presentación tiene
# carácter mensual y se realiza en el plazo de los diez días naturales
# siguientes a la finalización del mes al que se refiere la declaración. Each
# window opens the 1st and closes the 10th of the month following the
# reference month. Replaces the 12 filing_year=2025 windows that moved to the
# 2003-2025 predecessor revision (those windows genuinely belong to the era
# orden-hac-96-2003 governs, not this orden, which enters force 2026-01-01).

[[revisions."2025-y-siguientes".deadline_windows]]
