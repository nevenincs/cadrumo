# Modelo 185 monthly deadline windows, grounded in orden-hac-1197-2025 art 4: la presentación tiene carácter mensual y se realiza en
# el plazo de los diez días naturales siguientes a la finalización del mes al
# que se refiere la declaración. Each window opens the 1st and closes the
# 10th of the month following the reference month.

