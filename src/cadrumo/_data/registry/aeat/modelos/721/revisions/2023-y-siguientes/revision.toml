[revisions."2023-y-siguientes".family_dispositions.live_cross_references]
reason = """
A live cross-reference declares an AEAT surface this application READS at runtime, together with the guard policy, allowed hosts and methods, and forbidden actions that keep the read read-only. It is a statement about what Cadrumo operates, not about what the law requires. Cadrumo operates no live surface for modelo 721: no adapter under adapters/outbound/aeat references it -- the only textual hits are byte-offset tuples in a sede test, not modelo references -- and the application never performs \
live AEAT submission in any case, per the standing prohibition on live filing. There is consequently no host to allow, no method to bound and no guard policy to name. Sibling modelo 210 disposes the family on exactly this ground. Should an adapter ever read this modelo, the family becomes applicable and this disposition must be revisited rather than inherited."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]

[revisions."2023-y-siguientes".family_dispositions.extraction_profiles]
reason = """
An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against the registry's own casilla labels. Modelo 721's bundled layout authority is a BOE anexo the shipped parser refuses -- no field rows in the base document, a first field at position 58 in the amendment -- and no label-printing specimen is bundled. Authoring patterns without such a document would invent them. Modelo \
100's 2020 revision disposes this family on exactly this ground while its 2021-2024 siblings populate theirs, so the family is evidence-scoped by revision rather than absent by nature: acquire a label-printing artefact and it becomes applicable, at which point this disposition must be revisited rather than inherited."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]

[revisions."2023-y-siguientes".family_dispositions.bindings]
reason = """
A binding serves two shapes and neither is available here. As a CASILLA resolver it reads a value from a declared source: no casilla of this revision does, its seven being two informational and five manual, and the revision declares no formulas at all. As a LAYOUT descriptor it names a record field -- the shape modelo 720 uses for all fifty-two of its bindings, none of which any casilla references -- and this modelo's layout authority is a BOE anexo the shipped parser refuses, so there is no \
readable record field to name. That second shape is not mandatory in any case: 24 of the 78 revisions carrying an export layout declare no bindings at all, so an absent bindings family is a normal end state rather than an unfinished one. If this revision's layout ever lands and materialises repeating rows through binding_rows, the family becomes applicable and this disposition must be revisited rather than inherited."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]

[revisions."2023-y-siguientes".family_dispositions.export_layouts]
reason = """
AEAT publishes no positional record design for modelo 721. Measured on the source catalogue: no source cited by this modelo or any revision carries kind = 'record_design'. Both layout sources, 'boe-modelo-721-2023-layout' and 'boe-modelo-721-2024-layout', are kind = 'form_spec' -- the approving orden's anexo, a printable form rather than a positional design a fixed-width writer could be authored from. Its sibling modelo 720, the equivalent declaration for bienes y derechos abroad, sits in the \
same shape. Authoring a layout here would require inventing byte offsets AEAT has not published, which is fabricating wire facts. The runtime filing check still refuses a filing-grade snapshot from a revision carrying no layout, so this disposition records why one cannot exist and grants nothing."""
