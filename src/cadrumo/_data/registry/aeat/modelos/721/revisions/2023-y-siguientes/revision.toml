[revisions."2023-y-siguientes".family_dispositions.formulas]
reason = """
A formula computes a casilla of this revision from others, and this revision computes nothing. Measured on the revision itself: it declares SEVEN casillas and ZERO formulas, and not one casilla is input_kind computed -- ejercicio and tipo-declaracion are informational, and custodio.nombre-razon-social, custodio.codigo-pais, moneda.clave-token, moneda.saldo-31-diciembre and moneda.saldo-inicio are all manual. The declaration reports the existence and the year-end and year-start balances of \
monedas virtuales held abroad through a custodio, under RD 1065/2007 art. 42 quater; it settles no tax and derives no figure from another figure, so there is nothing for a formula to express. The family is inapplicable by this modelo's nature rather than merely unbuilt."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]

[revisions."2023-y-siguientes".family_dispositions.relations]
reason = """
A relation folds a value from ANOTHER modelo's revision into this one's calculation, and this revision has no calculation to fold into. Measured on it: SEVEN casillas, ZERO formulas, and no casilla with input_kind = computed. The declaration reports the custodio, the clave of each moneda virtual, and its balances at 31 December and at the start of the year, all entered by the contribuyente from the custodio's own records; nothing here is derived from a figure another modelo filed. Its sibling \
modelo 720, the equivalent declaration for bienes y derechos situados en el extranjero, disposes the same family for the same shape. The family is inapplicable by this modelo's nature rather than merely unpopulated."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]


[revisions."2023-y-siguientes".family_dispositions.verification_predicates]
reason = """
A verification predicate guards a CALCULATED result -- characteristically that a positive economic input did not resolve to a zero base or cuota. This revision calculates nothing to guard: it declares ZERO formulas, no casilla is input_kind = computed, and it has neither a base nor a cuota casilla, its formulas family being dispositioned inapplicable on that same measurement. The declaration reports the existence and valuation of monedas virtuales held abroad under RD 1065/2007 art. 42 quater; \
it settles no tax, so there is no computed result for an implication to constrain. The under-declaration risk this family exists to catch is real but lives elsewhere: an unreported holding surfaces on the contribuyente's OWN IRPF or IS return, which is where a predicate can bind a base to a cuota."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure"]


[revisions."2023-y-siguientes".family_dispositions.projection_endpoints]
reason = """
FilingProjectionRef (cadrumo.core) is a CLOSED discriminated union, and every member is scoped to the modelo whose repeated rows it describes; ProjectionEndpointDeclaration.projection_ref accepts only that union, so no declaration naming this modelo's own casillas can validate while the union carries no modelo-721 member. It carries none. The union is not single-modelo -- it holds m303_ and m200_ members -- so this is stated as a scoping rule rather than as a member count or a prefix, both of \
which go stale the moment another modelo is added. Sibling modelo 720 disposes the family on the same rule."""
