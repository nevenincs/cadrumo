reviewed_by = """\
agent: finite BOE-package review. VERIFIED -- the bundled HAC/1504/2024 PDF is the immutable official \
amendment package (827110 bytes; SHA-256 27995a7285f61a3a3ff2ddd259d9b252143d2ef6fc5d999936738bbd8b116a31), \
and its final provision declares the substituted annex "aplicable, POR PRIMERA VEZ, a las declaraciones informativas correspondientes al ejercicio 2024, que se presentaran en el ejercicio 2025". This applicability-grade \
era is therefore OPEN-ENDED: por primera vez opens a CONTINUING window at its first ejercicio rather than confining the annex to it. No bundled normative amends modelo 721 after HAC/1504/2024, and none of the seven bundled 2025 ordenes names this modelo, so closing the era at 2024 would refuse ejercicio 2025 under an annex no orden has withdrawn. NOT CLAIMED -- the separately published AEAT SOAP/XML \
material is not pair-complete here: the historical 2023 description endpoint no longer supplies its bytes, so \
no 2023/2024 AEAT service-package inventory, service serializer, validation matrix, record design, or \
filing-grade authority is asserted. The BOE amendment is kind form_spec, not record_design; export layouts \
remain empty. NOT CLAIMED -- no independent figure oracle exists and the informational casillas remain manual \
or informational facts.
"""
reviewed_at = 2026-08-30
family_storage_baseline = "2023"
scoped_families = ["workbook_parity_refs", "verification_expectations", "completeness_manifest"]

[revisions."2024".family_dispositions.export_layouts]
reason = """
AEAT publishes no positional record design for modelo 721. Measured on the source catalogue: no source cited by this modelo or any revision carries kind = 'record_design'. The cited 2024 layout source is kind = 'form_spec' -- the substituted orden anexo, a printable form rather than a positional design a fixed-width writer could be authored from. Its sibling modelo 720, the equivalent declaration for bienes y derechos abroad, sits in the \
same shape. Authoring a layout here would require inventing byte offsets AEAT has not published, which is fabricating wire facts. The runtime filing check still refuses a filing-grade snapshot from a revision carrying no layout, so this disposition records why one cannot exist and grants nothing."""
legal_refs = ["ley-58-2003:da-18", "rd-1065-2007:art-42-quater", "orden-hfp-886-2023:art-1"]
source_refs = ["aeat-modelo-721-procedure", "boe-modelo-721-2024-layout"]

