# Supported filing years this edition left without a deadline window.
#
# GROUNDING. Orden HAP/1608/2014 articulo 4 states the plazo verbatim: "El plazo de
# presentacion del modelo 187 sera el comprendido entre el 1 y el 31 de enero de cada
# ano, en relacion con las operaciones que correspondan al ano natural inmediato
# anterior." Articulo 1, which this edition's 2025 row cited alone, approves the modelo
# and states no timing; it is kept as the enrolling authority and art-4 added as the
# timing one. The 2025 row is strengthened the same way so the edition is grounded
# uniformly rather than half-grounded.
#
# NOT rd-439-2007:art-108 and NOT the 1999 ordenes: both say TWENTY days, which
# contradicts the 1-31 January window this modelo actually files on.
#
# Dates are NOMINAL; weekend and festivo movement happens at read time.

