# Reconcile-when-present for Modelo 187 revision 2022-y-siguientes. The hoja
# resumen prints four boxes and every one of them is operator input, so none is
# engine-computed: the expectation reconciles a filed value against the stored
# one WHEN the filing prints it, and is EXCLUDED from the coverage denominator
# (min_coverage = 0), so enrollment can never lower coverage or flip a
# legitimate filing's verdict. Grounded in the casillas' own declared
# legal_refs/source_refs, which name the annex the boxes are printed in.
[[revisions."2022-y-siguientes".verification_expectations]]
id = "modelo-187-2022-y-siguientes-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "01",
    "02",
    "03",
    "04",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-35-2006:art-99", "orden-hap-1608-2014:art-1"]
source_refs = ["aeat-modelo-187-procedure", "boe-modelo-187-form-text", "boe-modelo-187-form-layout"]
