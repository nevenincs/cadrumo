# The fichero AEAT for modelo 187, whose two records Orden HAP/1608/2014 approves.
# Both records tile 1..500 in the bundled diseno, so neither needs a declared
# reserved tail: every position is carried by a binding.
[[revisions."2019-y-siguientes".export_layouts]]
id = "modelo-187-fichero-aeat"
format = "fixed_width"
legal_refs = ["ley-35-2006:art-99", "orden-hap-1608-2014:art-1"]
source_refs = ["aeat-dr-187-2022", "boe-modelo-187-form-layout"]

[[revisions."2019-y-siguientes".export_layouts.records]]
id = "modelo-187-declarante"
record_type = "declarante"
order = 0
encoding = "iso-8859-1"
line_ending = "crlf"
binding_record = "declarante"

[[revisions."2019-y-siguientes".export_layouts.records]]
id = "modelo-187-operacion"
record_type = "operacion"
order = 1
encoding = "iso-8859-1"
line_ending = "crlf"
repeat = "binding_rows"
binding_record = "operacion"
