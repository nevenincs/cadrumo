[revisions."2008-2024".family_dispositions.dependency_classifications]
reason = "A dependency classification declares which OTHER modelo's filing a value here derives from, and modelo 347 derives from none. It reports the declarant's own operations with third parties above the article 33 threshold, read from the declarant's books rather than folded in from another return -- unlike modelo 180, whose declarante totals classify a dependency on the modelo 115 retenciones it summarises. The family is inapplicable by this modelo's nature, not merely unpopulated."
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "rd-1065-2007:art-31",
]
source_refs = [
    "aeat-dr-347-2011",
    "aeat-modelo-347-procedure",
]

[revisions."2008-2024".family_dispositions.verification_predicates]
reason = """
A verification predicate guards a CALCULATED result -- characteristically that a positive economic input did not resolve to a zero base or cuota. Modelo 347 calculates nothing: it declares calculation_class = \"informative\", its formulas family is already dispositioned inapplicable on the same ground, and measured on the revision itself its 43 casillas declare zero formula_ids and carry no base and no cuota casilla. The declarante totals are counts and sums of the detail rows the declarant \
reports, not a liability derived from them. With no computed result to constrain, there is no implication to assert. The under-declaration risk this family exists to catch does not vanish -- it lives on the counterparty's own IVA and renta returns, where the operations reported here are actually taxed, and on the article 33 threshold that decides whether a counterparty must be listed at all."""
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "rd-1065-2007:art-31",
    "ley-58-2003:art-93",
]
source_refs = [
    "aeat-dr-347-2011",
    "aeat-modelo-347-procedure",
]

[revisions."2008-2024".family_dispositions.projection_endpoints]
reason = """
A projection endpoint's projection_ref accepts only FilingProjectionRef, a CLOSED discriminated union in cadrumo.core whose seven members are every one an m303_ engine-computed IVA fact, so no declaration naming this modelo's own rows can validate against it and the family is empty by construction rather than by omission. One member invites a specific misreading and does not apply: M303Exonerado390OperacionesTercerosProjectionRef names operaciones con terceros, which is this modelo's own \
subject, but it is a fact projected onto the modelo 303 of a filer exonerated from the modelo 390 -- an m303 casilla, not a modelo 347 row. This modelo's repetition is served by the other mechanism: its declarado and inmueble detail rows materialise from BINDING values, one row per counterparty and per arrendamiento, which is what an authored ExportRecordDefinition expresses with repeat == \"binding_rows\"."""
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "orden-eha-3012-2008:art-10",
    "rd-1065-2007:art-31",
]
source_refs = [
    "aeat-dr-347-2011",
    "aeat-modelo-347-procedure",
]
