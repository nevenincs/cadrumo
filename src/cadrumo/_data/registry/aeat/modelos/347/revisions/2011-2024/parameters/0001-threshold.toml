# Per-third-party annual-operations threshold. RGAT art. 33 fixes the
# 3.005,06 EUR per-counterparty annual figure; Orden EHA/3012/2008 art. 1
# approves the form that collects it. Encoded as a static parameter so any
# future detail-record validation (T4.1/T4.2) can consult the legally-cited
# amount instead of hard-coding it inline. No formula consumes this parameter
# today; the threshold lives here as discoverable legal grounding ahead of
# the row-set support that will enforce it on per-tercero records.
[[revisions."2011-2024".parameters]]
id = "modelo-347-tercero-anual-threshold-eur"
data_type = "money"
unit = "EUR"
legal_refs = ["rd-1065-2007:art-33", "orden-eha-3012-2008:art-1"]
source_refs = ["aeat-modelo-347-procedure"]

[[revisions."2011-2024".parameters.source_citations]]
