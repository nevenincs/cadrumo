continuidad_evidence = "EVIDENCE IS REGIME-LEVEL, NOT FIELD-LEVEL, and is stated as such. No distinct positional line for a criterio-de-caja importe was located in corpus/aeat_official/disenos_registro/modelo_347/files/01-347-ejercicio-2025-y-siguientes-modificados-por-orden-hac-1431-2025-de-3-de-diciembre-332-kb.pdf.extracted.md; the general importe field at 284-299 is not it. The claim rests on the predecessor design corpus/aeat_official/disenos_registro/modelo_347/files/04-347-orden-eha-3378-2011-de-1-de-diciembre-579-kb-pdf.pdf.extracted.md containing 0 occurrences of 'CRITERIO DE CAJA' against 19 in the 2025 design: an importe OF criterio de caja operations cannot exist on a form that never mentions the regime. If a later reader locates the field's own line, this evidence should be replaced with it."
