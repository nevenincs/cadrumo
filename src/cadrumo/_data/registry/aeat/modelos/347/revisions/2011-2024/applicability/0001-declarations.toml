[[revisions."2011-2024".applicability]]
id = "m347-seed"
applicable_entity_types = ["attribution_entity", "legal_entity", "natural_person"]
required_payer_fact = "exceeds_third_party_threshold"
applicable_reason = "Modelo 347 (declaración anual de operaciones con terceras personas): las operaciones del contribuyente con un tercero superan el umbral de declaración y debe presentar la declaración informativa anual."
not_applicable_reason = "Modelo 347 no aplica: la declaración de operaciones con terceros solo corresponde a quien supera el umbral de operaciones declarable."
legal_refs = ["rd-1065-2007:art-31", "orden-eha-3012-2008:art-1", "orden-eha-3012-2008:art-10", "ley-58-2003:art-93"]

# RGAT art. 32.e: "No estarán obligados a presentar la declaración anual: ... e) Los obligados
# tributarios a que se refiere el artículo 62.6 del Reglamento del Impuesto sobre el Valor
# Añadido" -- those who keep the IVA books through the SII, mandatorily or by option. The
# derived payer fact names the profile facts that establish it.
[[revisions."2011-2024".applicability.exclusions]]
id = "m347-sii"
payer_fact = "iva_books_kept_through_sii"
reason = "Modelo 347 no aplica: quien lleva los libros registro del IVA a través del Suministro Inmediato de Información (SII), por obligación o por opción, no está obligado a presentar la declaración anual de operaciones con terceras personas. Si tu inscripción en el SII no abarcó todo el año natural, esta exclusión no decide las operaciones del periodo sin SII: revísalas tú."
legal_refs = ["rd-1065-2007:art-32", "rd-1624-1992:art-62", "rd-1624-1992:art-71"]

# RGAT art. 31.1 binds those "que desarrollen actividades empresariales o profesionales", as
# defined by LIVA art. 5. A natural person with no actividad económica income and no IVA regime
# declares neither; a landlord whose lease is subject to IVA declares a regime and stays in scope.
[[revisions."2011-2024".applicability.exclusions]]
id = "m347-sin-actividad"
entity_types = ["natural_person"]
iva_regimes = ["NO_APLICA"]
lacking_income_categories = ["actividad_economica"]
reason = "Modelo 347 no aplica: la declaración anual de operaciones con terceras personas corresponde a quien desarrolla actividades empresariales o profesionales, y el perfil no declara una actividad económica ni un régimen de IVA."
legal_refs = ["rd-1065-2007:art-31"]

# RGAT art. 32.c excludes those whose operations with a person or entity did not exceed
# "3.005,06 euros durante el año natural correspondiente o de 300,51 euros durante el mismo
# periodo, cuando, en este último supuesto, realicen la función de cobro por cuenta de terceros".
# The profile asks only about the general threshold, so a collector's "no" settles nothing.
[[revisions."2011-2024".applicability.exclusions]]
id = "m347-cobro-por-cuenta-de-terceros"
outcome = "incomplete"
declaration_role_selection = "C"
payer_fact = "exceeds_third_party_threshold"
payer_fact_declared = false
reason = "No se puede determinar si debes presentar el Modelo 347: cobras honorarios o derechos por cuenta de terceros, y para esos cobros el umbral es de 300,51 euros por persona o entidad y año natural, no de 3.005,06 euros. Responder que no superas el umbral general no excluye la obligación; comprueba si los cobros por cuenta de algún tercero superaron 300,51 euros."
legal_refs = ["rd-1065-2007:art-32", "rd-1065-2007:art-31"]
