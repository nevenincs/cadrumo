# decl.ejercicio label_pattern grounded against AEAT-published Diseño de Registro
# for Modelo 347 (Orden HAC/1431/2025), record-type-1 field at positions 5-8:
#   "EJERCICIO — Las cuatro cifras del ejercicio fiscal al que corresponde la
#   declaración."
# Source: src/cadrumo/_data/corpus/aeat_official/disenos_registro/modelo_347/files/
#   01-347-ejercicio-2025-y-siguientes-modificados-por-orden-hac-1431-2025-de-3-de-diciembre-332-kb.pdf
#   page 1, TIPO DE REGISTRO 1, positions 5-8.
# The AEAT M347 justificante/declaracion prints the short label "Ejercicio:"
# (consistent with M349, M180, M369 justificante conventions observed in corpus).
# Pattern 'Ejercicio:' matches this short-form label on the printed justificante.
#
# decl.tipo-declaracion REMOVED from target_casillas:
# M347 positions 121-122 are two separate single-character flag fields
# (pos 121 = "C" if complementaria; pos 122 = "S" if sustitutiva) — NOT a single
# label+value pair. This is the same structure as M720 positions 121-122. The
# flags cannot be extracted via the named_label strategy from a printed-form PDF.
# Synthetic round-trip fixture at src/cadrumo/tests/fixtures/justificantes/347/2024-0A.pdf
# reproduces the AEAT-grounded "Ejercicio:" label so the named_label parser can
# locate and extract the year value.
[[revisions."2025-y-siguientes".extraction_profiles]]
id = "modelo-347-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.ejercicio", match_strategy = "named_label", value_kind = "text", label_pattern = 'Ejercicio:'},
]
# Pattern grounded against AEAT-published Diseño de Registro (Orden HAC/1431/2025)
# field EJERCICIO at positions 5-8. Synthetic round-trip fixture at
# src/cadrumo/tests/fixtures/justificantes/347/2024-0A.pdf verified corpus_round_trip.
# decl.tipo-declaracion removed: M347 positions 121-122 are two separate flags,
# not a label+value pair (same as M720; non-extractable via named_label).
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["orden-eha-3012-2008:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-347-2025", "aeat-modelo-347-procedure"]

