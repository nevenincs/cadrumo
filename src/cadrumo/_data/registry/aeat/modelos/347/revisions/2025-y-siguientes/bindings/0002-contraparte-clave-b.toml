# Type 2 declarado (contraparte) rows for CLAVE B (entregas de bienes y
# prestaciones de servicios superiores a 3.005,06 EUR), sourced from
# collectible (issued/sales) invoices only.
#
# Scoped to clave B alone. Clave A (adquisiciones, payable_invoice) needs
# the same collectible+payable row-index union the declarante summary
# bindings already apply at the scalar level (see 0001-counterpart-summary.toml),
# which resolve_invoice_binding_row_values's cohort_by_source=True core does
# not yet support for row-producer bindings -- each source cohorts its own
# row-index sequence independently, so a second source's rows would collide
# with these at row 1 rather than interleaving. Adding clave A, and claves
# C-G (each keying on a fact this binding family does not classify yet --
# see the tui-architecture modelo 347 contraparte binding inventory
# reference), is deferred pending that resolver-level extension.

[[revisions."2025-y-siguientes".bindings]]
id = "modelo-347-contraparte-row-nif-b"
source = "collectible_invoice"
selector = { fact = "row_field", row_field = "party_tax_id", grouping = "contraparte_clave", claves = ["B"], rectification_scope = "any" }
aggregation = { op = "rows" }
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "orden-hac-1431-2025:art-1",
    "rd-1065-2007:art-33",
    "rd-1065-2007:art-34",
    "ley-58-2003:art-93",
]
source_refs = ["aeat-dr-347-2025", "aeat-modelo-347-procedure"]

[[revisions."2025-y-siguientes".bindings.source_citations]]
source_ref = "aeat-modelo-347-procedure"
required_text = ["operaciones con terceras personas"]

