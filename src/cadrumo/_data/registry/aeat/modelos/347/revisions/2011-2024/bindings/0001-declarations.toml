# Type 1 declarante summary fed by the enrolled invoice source resolver.
# The design defines both totals over the emitted type 2 declarado records
# (positions 136-144: their number, a declarado counted once per record it
# appears in; positions 145-160: the signed sum of their annual amounts), so
# the resolver builds those records exactly as the contraparte_clave row
# family does, RD 1065/2007 art. 33 threshold included (judged per
# counterparty and per threshold bucket, entregas and adquisiciones computed
# separately), and reads the totals off them.

[[revisions."2011-2024".bindings]]
id = "modelo-347-declarante-numero-personas-entidades"
provider = { kind = "m347_third_party_operation", fact = "operator_count", record = "m347_declarante_summary", rectification_scope = "any" }
value = { data_type = "integer", channel = "integer" }
aggregation = { op = "count_distinct" }
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "rd-1065-2007:art-31",
    "rd-1065-2007:art-33",
    "ley-58-2003:art-93",
]
additional_source_refs = ["boe-modelo-347-2008-form"]

[[revisions."2011-2024".bindings.source_citations]]
source_ref = "aeat-modelo-347-procedure"
required_text = ["operaciones con terceras personas"]

