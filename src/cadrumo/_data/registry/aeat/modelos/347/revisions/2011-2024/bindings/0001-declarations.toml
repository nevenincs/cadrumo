# Type 2 inmueble records (both designs): the landlord relates each leased local
# de negocio with its tenant, "las referencias catastrales y los datos necesarios
# para la localización de los inmuebles arrendados" (RD 1065/2007 art. 34.1.d),
# one record per (tenant, premises) carrying "el importe total, del arrendamiento
# del local de negocios correspondiente al año natural ..., cualquiera que sea la
