# Type 1 declarante summary fed by the enrolled invoice source resolver.
# The resolver applies the RD 1065/2007 art. 31 declaration threshold before
# these bindings count or sum declared counterpart records.
# The M347 summary record unions collectible and payable invoice observations
# in the resolver because the public declarante count must deduplicate a NIF
# across deliveries and acquisitions.
# Type 2 declarado (contraparte) rows for the 2011-2024 revision, mirroring
# 2025-y-siguientes's per-row binding family exactly: same fields, same
# `contraparte_clave` grouping, same combined-direction source
# `m347_third_party_operation` (RD 1065/2007 art. 33.1 already treats a
# purchase and a sale as one "operaciones" concept -- see the enum member's
# docstring in core/aggregation.py), unioning collectible (entregas, clave B)
# and payable (adquisiciones, clave A) invoice observations into ONE shared
# row sequence -- the diseño de registro's Tipo-2 declarado record is a
# single physical stream for every clave.
#
# `claves = []` (no filter) lets every classifiable clave through: A/B from
# invoice direction, F/G from the invoice's own RD 1619/2012 disposición
# adicional cuarta travel-agency mediation fact. Claves C-E each need a fact
# this binding family does not read yet (a professional-fees-collection
# classification for C, the FILER's own entity type for D/E), so
# observations for those operations simply carry operation_clave = None and
# are skipped by _build_contraparte_clave_rows, not silently mis-declared.
#
# This revision omits the 2025-y-siguientes-only `orden-hac-1431-2025:art-1`
# grounding: RD 1065/2007 arts. 33/34 (the content and IMPORTE ANUAL rules)
# and orden-eha-3012-2008 predate and govern this era unchanged, but the 2025
# orden that modified the diseño de registro for ejercicio 2025 y siguientes
# does not apply here (mirrors 0001-counterpart-summary.toml's own era split
# and the test_the_later_half_grounds_the_same_bindings_in_the_2025_orden
# precedent).
#
# The four `importe-q{n}` bindings carry the diseño's mandatory, unconditional
# quarterly desagregación (RD 1065/2007 art. 33.1: "se suministrará
# desglosada trimestralmente"), distinct from the conditional
# transmisiones-inmuebles pair (real-estate operations only) and from
# importe-metalico/operacion-seguro/arrendamiento-local-negocio (each gated
# by its own "Sólo..." exception in the diseño text) -- those stay
# unbound/scalar by design, not by omission.

