# Type 2 declarado NIF OPERADOR COMUNITARIO (positions 264-280), new in the
# 2025 design: the Member State prefix and NIF-IVA of a counterparty
# established in another Member State, "incompatible (excluyente)" with the
# Spanish NIF slot (RD 1065/2007 art. 34.1.b: "el numero de identificacion
# fiscal a efectos del Impuesto sobre el Valor Añadido atribuido al empresario
# o profesional ... por el Estado miembro de establecimiento"). It is one more
# column of the shared contraparte_clave row family, so it rides the same row
# indexes as the declarado NIF, name, clave and amounts.

