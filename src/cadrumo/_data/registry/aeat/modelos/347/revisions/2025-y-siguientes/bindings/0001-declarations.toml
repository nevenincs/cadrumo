# Type 1 declarante summary fed by the enrolled invoice source resolver.
# The resolver applies the RD 1065/2007 art. 31 declaration threshold before
# these bindings count or sum declared counterpart records.
# The M347 summary record unions collectible and payable invoice observations
# in the resolver because the public declarante count must deduplicate a NIF
# across deliveries and acquisitions.

[[revisions."2025-y-siguientes".bindings]]
id = "modelo-347-declarante-numero-personas-entidades"
provider = { kind = "m347_third_party_operation", fact = "operator_count", record = "m347_declarante_summary", rectification_scope = "any" }
value = { data_type = "integer", channel = "integer" }
aggregation = { op = "count_distinct" }
legal_refs = [
    "orden-eha-3012-2008:art-1",
    "orden-hac-1431-2025:art-1",
    "rd-1065-2007:art-31",
    "ley-58-2003:art-93",
]
additional_source_refs = ["aeat-dr-347-2011", "aeat-modelo-347-procedure", "boe-modelo-347-2008-form"]

