# Modelo 189 fichero -- transcribed from the bundled AEAT Diseno de Registro
# (source aeat-dr-189-2023, corpus/aeat_official/disenos_registro/modelo_189/
# files/01-189-diseno-de-registro-actualizado-en-2023.pdf, sha256
# c493f8d9d927f28211336324cbe17ab7bae7b256d3c563273e01a76834757d6a).
#
# The design declares exactly two records of 500 bytes each: registro de tipo 1
# (declarante) with 13 top-level positions, and registro de tipo 2 (declarado)
# with 21. Every position of both records is declared below; each record's
# declared field lengths sum to exactly 500, contiguously from position 1.
# Registro de tipo 1: registro de declarante. 500 bytes, 13 official positions.
# 1 + 3 + 4 + 9 + 40 + 1 + 49 + 13 + 2 + 13 + 9 + 23 + 333 = 500.
# Posicion 1. TIPO DE REGISTRO. Constante numero '1'.
# Posiciones 2-4. MODELO DECLARACION. Constante '189'.
# Posiciones 5-8. EJERCICIO. Las cuatro cifras del ejercicio fiscal.
# Posiciones 9-17. N.I.F. DEL DECLARANTE.
# A NIF exactly fills its 9-byte slot; left-zero padding would strip real
# leading digits from a low-numbered DNI on the parse side.
# Posiciones 18-57. RAZON SOCIAL DEL DECLARANTE. Alfanumerico.
# Posicion 58. TIPO DE SOPORTE. Alfabetico: 'C' CD-R, 'T' transmision telematica.
# Posiciones 59-107. PERSONA CON QUIEN RELACIONARSE. Alfanumerico. The design
# subdivides the slot (59-67 telefono, 68-107 apellidos y nombre) but declares
# ONE top-level position of 49 bytes, which is the extent authored here.
# Posiciones 108-120. NUMERO DE JUSTIFICANTE DE LA DECLARACION. Numerico de 13
# posiciones, ajustado a la derecha y relleno de ceros por la izquierda.
# Posiciones 121-122. DECLARACION COMPLEMENTARIA O SUSTITUTIVA. Alfabetico:
# 121 'C' complementaria, 122 'S' sustitutiva. One top-level position of 2.
# Posiciones 123-135. NUMERO IDENTIFICATIVO DE LA DECLARACION ANTERIOR.
# Numerico; en cualquier otro caso debera rellenarse a CEROS.
# Posiciones 136-144. NUMERO TOTAL DE DECLARADOS. Numerico.
# Posiciones 145-167. VALORACION. Campo alfanumerico de 23 posiciones:
# 145 SIGNO ('N' si la suma es menor que cero, en otro caso un espacio),
# 146-165 parte entera, 166-167 parte decimal. The sign byte is reserved, so
# the magnitude owns 146-167 and a non-negative sum writes a space at 145.
# Posiciones 168-500. BLANCOS.
# Registro de tipo 2: registro de declarado. 500 bytes, 21 official positions.
# 1+3+4+9+9+9+40+2+2+1+1+1+12+1+12+16+5+1+17+18+336 = 500.
# Posicion 1. TIPO DE REGISTRO. Constante '2'.
# Posiciones 2-4. MODELO DECLARACION. Constante '189'.
# Posiciones 5-8. EJERCICIO. Consignar lo contenido en el registro de tipo 1.
# Posiciones 9-17. N.I.F. DEL DECLARANTE. Consignar lo contenido en el tipo 1.
# Posiciones 18-26. N.I.F. DEL DECLARADO.
# Posiciones 27-35. N.I.F. DEL REPRESENTANTE LEGAL. Solo para menores de 14
# anos; en cualquier otro caso el campo se rellenara a espacios.
# Posiciones 36-75. APELLIDOS Y NOMBRE, RAZON SOCIAL O DENOMINACION DEL DECLARADO.
# Posiciones 76-77. CODIGO PROVINCIA. Numerico de dos digitos (01-52; 99 para
# no residentes sin establecimiento permanente).
# Posiciones 78-79. CODIGO PAIS. Alfabetico, Orden EHA/3496/2011 Anexo II.
# Posicion 80. CLAVE DE MERCADO. Alfabetico: A, B, C, D o E.
# Posicion 81. CLAVE DE VALOR. Claves A a F (alfabeticas).
# Posicion 82. CLAVE DE IDENTIFICACION. Numerico: 1 ISIN, 2 valores extranjeros
# sin ISIN, 3 NIF. Solo se informa cuando la clave de valor es A, B o C.
# Posiciones 83-94. IDENTIFICACION DE LOS VALORES. Codigo ISIN de 12 posiciones,
# clave ZXX, o NIF. Solo se informa cuando la clave de valor es A, B o C.
# Posicion 95. CLAVE DE REPRESENTACION. Alfabetico: A anotaciones en cuenta,
# B no representados mediante anotaciones en cuenta.
# Posiciones 96-107. BLANCOS.
# Posiciones 108-123. VALORACION. 108 SIGNO ('N' si es menor que cero, en otro
# caso espacio), 109-121 parte entera, 122-123 parte decimal. The sign byte is
# reserved, so the magnitude owns 109-123.
# Posiciones 124-128. PORCENTAJE DE PARTICIPACION. 124-126 parte entera,
# 127-128 parte decimal.
# Posicion 129. CLAVE DE TITULARIDAD. T titular pleno propietario, N nudo propietario.
# Posiciones 130-146. NUMERO DE VALORES. 130-140 parte entera, 141-146 parte
# decimal. Solo se informa cuando la clave de valor es A, B o C.
# Posiciones 147-164. NOMINAL UNITARIO DE LOS VALORES. 147-160 parte entera,
# 161-164 parte decimal. Se consigna con la clave de valor "A".
# Posiciones 165-500. BLANCOS.

