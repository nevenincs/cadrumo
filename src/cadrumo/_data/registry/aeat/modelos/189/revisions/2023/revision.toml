[revisions."2023"]
id = "2023"
authority_grade = "filing"
casilla_source_refs = ["boe-modelo-189-base-order"]
# Applicability-grade historical epoch for modelo 189, ejercicio 2023, presented
# in marzo 2024.
#
# The gap this closes was authoring debt, not a legal absence: modelo 189 was
# approved by Orden EHA/3481/2008 art. 1 with no ejercicio bound, art. 5 sets a
# recurring plazo "entre el día 1 y el 31 del mes de marzo de cada año", and the
# diseños físicos y lógicos live in that orden's anexo II, bundled and
# hash-pinned as boe-modelo-189-base-order.
#
# WHY EJERCICIO 2023 IS THE FIRST YEAR OF THIS EPOCH, quoted from the two
# amending ordenes' own disposiciones finales. Orden HFP/1180/2023: "será
# aplicable, por primera vez, a las declaraciones informativas correspondientes
# al ejercicio 2023 que se presentarán a partir de 1 de enero de 2024". Orden
# HFP/1284/2023: "será aplicable, por primera vez, a las declaraciones
# informativas correspondientes al ejercicio 2023, que se presentarán en el
# ejercicio 2024". Both therefore reach this edition and neither reaches
# ejercicio 2022, which is a different epoch and is NOT authored.
#
# GEOMETRY, established by measurement rather than assumed. The bundled AEAT
# Diseño de Registro aeat-dr-189-2023 (sha256
# c493f8d9d927f28211336324cbe17ab7bae7b256d3c563273e01a76834757d6a, catalogue
# window applies_from 2023-01-01) already carries the post-amendment layout, and
# its position lines agree field for field with the anexo II of the consolidated
# base orden: registro de tipo 1 closes "168-500 ------------ BLANCOS" and
# registro de tipo 2 closes "165-500 ------------ BLANCOS", both records 500
# bytes. The three fields the 2023 ordenes touched sit where this edition
# declares them: CÓDIGO PAÍS tipo 2 78-79 (HFP/1284/2023 "Se modifica el campo
# «CÓDIGO PAÍS», que ocupa las posiciones 78-79" -- a redescription, not a move),
# NÚMERO DE VALORES tipo 2 130-146 ("que pasará a ocupar las posiciones 130-146"
# -- a real move, from 130-145) and NOMINAL UNITARIO DE LOS VALORES tipo 2
# 147-164 ("se actualizan en consecuencia las posiciones"). CLAVE DE VALOR tipo 2
# 81 and VALORACIÓN tipo 2 108-123 were rewritten in place by HFP/1180/2023.
# This edition's 25 casillas are therefore the same boxes at the same positions
# its 2025 sibling models.
#
# WINDOW DISCIPLINE. orden-hac-132-2026 art. único and the source
# boe-modelo-189-2025-values are DELIBERATELY absent: that orden approves the
# relaciones de valores negociados del cuarto trimestre de 2025 and was published
# 2026-02-27, so it grounds ejercicio 2025 and cannot be cited here. The source
# aeat-modelo-189-procedure is likewise absent because its catalogue window opens
# 2025-01-01.
#
# WHY THE GRADE IS NOW 'filing'. This edition declares an export layout
# transcribed from aeat-dr-189-2023, the design already cited above, and the
# official_source_guidance evidence the filing rung requires is
# aeat-modelo-189-procedure, which applies_from 2020-01-01 with no close and so
# reaches this ejercicio.
#
# THE EARLIER NOTE HERE WAS STALE AND IS CORRECTED. It read that no procedure
# source in the catalogue opens before 2025-01-01. That was true when this
# edition was authored on 2026-09-12 and is not true now: the catalogue entry
# for aeat-modelo-189-procedure carries an explicit correction moving
# applies_from to 2020-01-01, on the bundled page's own link title "Modelo 189.
# Ejercicio 2020 y siguientes. Consultas y bajas de declaraciones." -- the same
# string, in the same position, that the modelo 190 correction was made on. The
# source was corrected; this paragraph was not, and the ACQUIRABLE DEBT it
# implied does not exist.
#
# WHAT IS STILL NOT CLAIMED. 189 is a declaracion informativa reporting
# third-party holdings of valores. The application holds no source for the
# declarado rows, so this edition declares no binding and no formula and its
# casillas stay input_kind 'manual': the filer supplies the declarado data and
# the two declarante totals. That absence is declared family by family below
# rather than resolved to a silent zero.
#
valid_from = 2023-01-01
valid_to = 2023-12-31
period_selector = { year_from = 2023, year_to = 2023, periods = ["0A"] }
orden_aplicabilidad = [
    "orden-eha-3481-2008:art-1",
    "orden-hfp-1180-2023:art-primero",
    "orden-hfp-1284-2023:art-11",
]
legal_refs = [
    "orden-eha-3481-2008:art-1",
    "orden-eha-3481-2008:art-5",
    "orden-hfp-1180-2023:art-primero",
    "orden-hfp-1284-2023:art-11",
]
source_refs = [
    "boe-modelo-189-base-order",
    "boe-modelo-189-2023-amendment-hfp-1180",
    "boe-modelo-189-2023-amendment-hfp-1284",
    "aeat-dr-189-2023",
    "aeat-modelo-189-procedure",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: authored from the bundled anexo II of Orden EHA/3481/2008 and the hash-pinned AEAT Diseño \
de Registro aeat-dr-189-2023. VERIFIED -- the position lines of the bundled design agree field for \
field with the consolidated anexo II, both records close at 500 bytes, and the three fields Orden \
HFP/1284/2023 art. 11 touched are quoted above verbatim with the move it made explicit. VERIFIED \
-- both 2023 ordenes state in their own disposición final única that they apply por primera vez to \
ejercicio 2023, which is what makes this the epoch's first year. VERIFIED -- every legal_ref and \
source_ref cited here has a catalogue window overlapping ejercicio 2023; orden-hac-132-2026 and \
boe-modelo-189-2025-values remain deliberately absent as ejercicio 2025 authority. CORRECTED -- \
aeat-modelo-189-procedure is now cited rather than excluded: its catalogue window was corrected to \
applies_from 2020-01-01 and it reaches this ejercicio, which is the official_source_guidance \
evidence the filing rung requires. VERIFIED -- the export layout is transcribed from \
aeat-dr-189-2023 and its field table is identical position for position to the one the 2025 edition \
emits from that same design; both records sum to exactly 500 bytes contiguously from position 1 and \
close on the design's own BLANCOS runs. FILING GRADE IS CLAIMED under the operator's standing \
authorisation to claim filing authority wherever the official record design is bundled, which here \
it is and is hash-pinned. NOT CLAIMED -- no independent AEAT oracle checked any emitted byte \
against a real presentacion, and no binding or formula is declared. No human operator has \
countersigned this."""
reviewed_at = 2026-09-12

[revisions."2023".family_dispositions.live_cross_references]
reason = """
A live cross-reference records an AEAT surface this application reads at runtime, and the registry
requires a portal application link beside it. aeat-modelo-189-procedure does describe a consultas y
bajas service for ejercicio 2020 onward, so the evidence for such a surface exists, but this edition
declares no portal link and no guarded adapter for it. Declaring the surface here would assert a
runtime read capability the application has not built and would oblige a portal link on every edition
of this chain. Empty because the adapter does not exist, not because the evidence is missing."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11"]
source_refs = ["aeat-modelo-189-procedure"]

[revisions."2023".family_dispositions.applicability]
reason = """
Modelo 189's registered scope is established by Orden EHA/3481/2008 art. 1 and is consumed through this revision's temporal selector. Its declarante is the entidad that issues, manages or holds the valores, not the taxpayer whose profile this application models, so there is no taxpayer-profile predicate and no alternative applicability branch to encode. No payer fact in this application describes that declarante, and authoring one would assert an obligation test the product cannot evaluate. Empty because the predicate does not exist here, not because it is unbuilt."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11"]
source_refs = ["boe-modelo-189-base-order", "boe-modelo-189-2023-amendment-hfp-1180", "boe-modelo-189-2023-amendment-hfp-1284", "aeat-dr-189-2023", "aeat-modelo-189-procedure"]

[revisions."2023".family_dispositions.bindings]
reason = """
The design supplies fixed wire positions, while this informative declaration's values are supplied by its declarante. The declarado records report third-party holdings of valores at 31 December, which no ledger, profile, relation or calculated source of this application holds, so no binding source or selector exists to author. The casillas are input_kind 'manual' for that reason and leave no binding reference dangling."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11"]
source_refs = ["boe-modelo-189-base-order", "boe-modelo-189-2023-amendment-hfp-1180", "boe-modelo-189-2023-amendment-hfp-1284", "aeat-dr-189-2023", "aeat-modelo-189-procedure"]

[revisions."2023".family_dispositions.dependency_classifications]
