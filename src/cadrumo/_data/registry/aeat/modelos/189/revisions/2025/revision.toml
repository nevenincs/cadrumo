[revisions."2025"]
casilla_storage_baseline = "2024"
casilla_source_refs = ["boe-modelo-189-base-order"]
authority_grade = "filing"
# valid_to is open, and the selector is now open with it. The approving Orden
# EHA/3481/2008 art. 1 ("Se aprueba el modelo 189") carries no ejercicio bound,
# its art. 5 sets a recurring plazo "entre el dia 1 y el 31 del mes de marzo de
# cada ano", and BOE's consolidated text of BOE-A-2008-19523 (read 2026-09-12)
# records no amendment later than Orden HFP/1284/2023 of 28 November 2023. AEAT's
# current disenos-de-registro page for modelos 100-199, read the same day, lists
# "189 - Orden EHA/3481/2008 (actualizado por Orden HFP/1284/2023 de 28 de
# noviembre)" and publishes no ejercicio 2026 design. A years = [2025] selector
# therefore refused ejercicio 2026 under a design no orden has withdrawn.
#
# WHY THE GRADE IS NOW 'filing'. This edition shares its design epoch with its
# 2023 and 2024 predecessors: aeat-dr-189-2023 still governs ejercicio 2025,
# no later orden has amended the diseño, and casilla_storage_baseline plus
# scoped_families reuse the 2024 casilla payload and export layout unchanged
# rather than restating an identical field table as redundant payload. The
# official_source_guidance evidence the filing rung requires is
# aeat-modelo-189-procedure, applies_from 2020-01-01 with no close, so it
# reaches this ejercicio exactly as it reaches 2023 and 2024. Every schema
# family this edition does not populate is now resolved not-applicable below,
# for the same reasons the 2024 edition recorded: this application holds no
# source for the declarado rows, so the two declarante totals stay manual
# casillas and no binding, dependency classification, extraction profile,
# parameter, projection endpoint or verification is authored against an
# absent source.
valid_from = 2025-01-01
period_selector = { year_from = 2025, periods = ["0A"] }
# Only form authorities belong here. Orden HAC/132/2026 art. unico approves the
# relaciones de valores negociados del cuarto trimestre de 2025 -- a per-ejercicio
# valuation input, not an approval or amendment of the modelo 189 form -- so it
# cannot ground an open-ended applicability window and would over-claim every year
# after 2025 if left. It stays in legal_refs below, where it grounds ejercicio 2025.
orden_aplicabilidad = [
    "orden-eha-3481-2008:art-1",
    "orden-hfp-1180-2023:art-primero",
    "orden-hfp-1284-2023:art-11",
]
legal_refs = [
    "orden-eha-3481-2008:art-1",
    "orden-eha-3481-2008:art-5",
    "orden-hfp-1180-2023:art-primero",
    "orden-hfp-1284-2023:art-11",
    "orden-hac-132-2026:art-unico",
]
source_refs = [
    "aeat-modelo-189-procedure",
    "boe-modelo-189-base-order",
    "boe-modelo-189-2023-amendment-hfp-1180",
    "boe-modelo-189-2023-amendment-hfp-1284",
    "boe-modelo-189-2025-values",
    "aeat-dr-189-2023",
]
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-09-12
family_storage_baseline = "2024"
scoped_families = ["export_layouts", "workbook_parity_refs"]

[revisions."2025".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo has no box crediting IRPF withholding suffered, so there is no credit casilla for an entry to name."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-eha-3481-2008:art-5", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11", "orden-hac-132-2026:art-unico"]
source_refs = ["aeat-modelo-189-procedure", "boe-modelo-189-base-order", "boe-modelo-189-2023-amendment-hfp-1180", "boe-modelo-189-2023-amendment-hfp-1284", "boe-modelo-189-2025-values", "aeat-dr-189-2023"]

[revisions."2025".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-eha-3481-2008:art-5", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11", "orden-hac-132-2026:art-unico"]
source_refs = ["aeat-modelo-189-procedure", "boe-modelo-189-base-order", "boe-modelo-189-2023-amendment-hfp-1180", "boe-modelo-189-2023-amendment-hfp-1284", "boe-modelo-189-2025-values", "aeat-dr-189-2023"]

[revisions."2025".family_dispositions.formulas]
reason = """
The design does state two computations on the declarante record -- NUMERO TOTAL DE DECLARADOS (136-144) is the count of type-2 records and VALORACION (145-167) is their signed sum over VALORACION A 31 DE DICIEMBRE -- so this family is NOT inapplicable by the modelo's nature. It is empty for a narrower and checkable reason: a formula must sum a declared binding, this edition declares none because the application holds no source for the declarado rows, and a formula over absent rows would report a total of zero where the true figure is unknown. The filer supplies both totals as manual casillas, which keeps the absence visible instead of resolving it to a silent zero."""
legal_refs = [
    "orden-eha-3481-2008:art-1",
    "orden-hfp-1180-2023:art-primero",
    "orden-hfp-1284-2023:art-11",
]
source_refs = [
    "boe-modelo-189-base-order",
    "boe-modelo-189-2023-amendment-hfp-1180",
    "boe-modelo-189-2023-amendment-hfp-1284",
    "aeat-dr-189-2023",
    "aeat-modelo-189-procedure",
]

[revisions."2025".family_dispositions.bindings]
reason = """
The design supplies fixed wire positions, while this informational declaration reports third-party data supplied by its declarante. The declarado records report third parties' holdings of valores at 31 December, which no ledger, profile, relation or calculated source of this application holds, so no binding source or selector exists to author. The casillas are input_kind 'manual' for that reason and leave no binding reference dangling."""
legal_refs = ["orden-eha-3481-2008:art-1", "orden-hfp-1180-2023:art-primero", "orden-hfp-1284-2023:art-11"]
source_refs = ["boe-modelo-189-base-order", "boe-modelo-189-2023-amendment-hfp-1180", "boe-modelo-189-2023-amendment-hfp-1284", "aeat-dr-189-2023", "aeat-modelo-189-procedure"]

