source_ref cited here has a catalogue window overlapping ejercicio 2024; orden-hac-132-2026 and \
boe-modelo-189-2025-values and aeat-modelo-189-procedure are deliberately absent as out of window. \
NOT CLAIMED -- no independent AEAT oracle checked any value here. NOT CLAIMED -- no bindings, \
formulas, export layout or completeness manifest are declared, so calculation refuses this edition \
