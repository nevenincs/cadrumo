# Modelo 189 tipo-1 (declarante) header, transcribed from the bundled official
# Diseño de Registro (source "aeat-dr-189-2023",
# corpus/aeat_official/disenos_registro/modelo_189/files/01-189-diseno-de-registro-actualizado-en-2023.pdf).
# "REGISTRO DE TIPO 1: REGISTRO DEL DECLARANTE" position table: 1 TIPO DE
# REGISTRO (constante '1'); 2-4 MODELO DECLARACIÓN (constante '189'); 5-8
# EJERCICIO; 9-17 N.I.F. DEL DECLARANTE. Only these envelope-identity
# positions are transcribed here.
#
# The registro de tipo 2 (declarado) position table was also read from the
# same design (declarado-nif 18-26, declarado-nombre 36-75, codigo-pais 78-79,
# clave-valor 81, valoracion 109-123, numero-valores 130-146,
# nominal-unitario-valores 147-164 -- matching this revision's casilla
# `number` hints) but is NOT wired here: mapping those tipo-2 casillas to
# CASILLA-kind fields requires each casilla to declare a matching
# `export_refs` entry, which is a casilla-fragment change beyond this pass's
# minimal scope and is not required by the registry-build gate (this revision
# carries no completeness_manifest). Left as a documented follow-up rather
# than wired speculatively.

