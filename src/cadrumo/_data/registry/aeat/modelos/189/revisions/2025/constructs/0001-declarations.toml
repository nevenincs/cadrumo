# The modelo 189 ejercicio-2025 informative declaration: the casillas its two
# records carry, the surfaces the application consumes, and the design its
# layout was transcribed from.
#
# Declared per edition because 'constructs' is not a scoped family: an enclosing
# construct names its own edition's deadline window and parity anchor, so it
# cannot be inherited from a neighbouring ejercicio unchanged.
#
# The ref lists are the union of the refs of every member named below, which is
# what the construct-closure rule requires of an enclosing construct.
#
# This edition is not one of the promoted ones. It declares a construct only
# because its predecessor now does, and an inherited construct would name the
# 2023 parity anchor and deadline window in a year neither applies to.

