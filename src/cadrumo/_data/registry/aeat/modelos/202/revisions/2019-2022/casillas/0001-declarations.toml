# Modelo 202 Informacion adicional casillas.
#
# AEAT prints these eleven 17-position amount slots with NO bracketed box
# number, unlike every liquidacion slot on the same record. They carry declared
# amounts and the design gives each its own slot, so they are casillas; their
# ids are slugs taken from AEAT's own label rather than invented numbers, which
# would assert an official identity the design does not print.
#
# semantic_role restates continuidad_id here, which is modelo 202's own
# convention (126 of its 129 roled rows do exactly this; the three that do
# not belong to casilla 25, whose continuidad_id is a bare number). The
# lineage check documents a matching role as the weaker proof of the same
# link, so these eleven close the linkage requirement without adding any
# identity the continuidad_id did not already carry.

