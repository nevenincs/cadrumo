# M202 declaracion_pdf extraction profile.
#
# Bounded to the four casillas that anchor both modality lanes' base
# inputs and both lanes' final results, per the AEAT-published printed-form
# box numbering confirmed in the bundled Diseno de Registro:
#   src/cadrumo/_data/corpus/aeat_official/disenos_registro/modelo_202/files/
#     01-202-ejercicio-2025-y-siguientes-actualizado-17-03-26-132-kb-xlsx.xlsx.extracted.md
#   ("... Base del pago fraccionado [01]", "... A Ingresar [03]",
#    "Resultado contable despues del IS e IC [04]",
#    "Cantidad a ingresar (mayor de claves [32] y [33]) [34]")
# and the AEAT-published instructions HTML:
#   src/cadrumo/_data/corpus/aeat_official/instructions/modelo_202/files/
#     modelo-202-instrucciones-2023-2024.html
#   ("... base del pago fraccionado (clave 01, clave 16 o clave 19) ...
#     la cantidad a ingresar (clave 03 o clave 34)").
#
# No real M202 declaracion-copy PDF specimen is bundled (Tier-R real-corpus
# acquisition for this modelo family is tracked separately).
# The DR confirms the box numbers ("[NN]") are printed inline in the form,
# but not their exact on-page label wording or column position, so this
# profile uses bbox_anchored (anchor on the printed box number, read the
# value immediately to its right) rather than named_label or numeric_casilla
# -- the same discipline the M131 2026 profile applies when the printed
# layout cannot be confirmed against a real specimen.
# provisional_pending_specimen=true records that a real M202 declaracion
# copy would let this profile widen to the full liquidacion casilla set
# and confirm (or correct) the anchor strategy.

[[revisions."2025-y-siguientes".extraction_profiles]]
id = "modelo-202-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parse_declaracion"
provisional_pending_specimen = true
target_casillas = [
    {casilla_id = "01", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^01$", value_offset = "right_of_number"}},
    {casilla_id = "03", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^03$", value_offset = "right_of_number"}},
    {casilla_id = "04", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^04$", value_offset = "right_of_number"}},
    {casilla_id = "34", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^34$", value_offset = "right_of_number"}},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["ley-27-2014:art-40", "ley-27-2014:art-29", "ley-27-2014:art-30", "ley-27-2014:art-105"]
source_refs = ["aeat-dr-202-2025", "aeat-modelo-202-instructions"]
