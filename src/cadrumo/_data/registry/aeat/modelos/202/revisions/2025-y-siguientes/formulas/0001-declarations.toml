# AEAT instructions: "Clave [32] = ( [clave [18] (o clave [26]) - clave [27]
# - clave [28] ] x clave [29]/100 ) - clave [30] - clave [31]". Casillas 18
# (B1 caso general, unico tipo) and 26 (B2 casos especificos, varios tipos)
# are alternative, mutually exclusive computations of the same "resultado
# previo": a filer completes exactly one lane's manual inputs (16/17/47/48/
# 40/49 for B1, or 19-25/42/50-52/61-66 for B2) and leaves the other lane's
# inputs empty, so the unused casilla resolves to zero. Adding both
# reproduces the "18 (o 26)" selection without inventing a lane-discriminator
# binding the registry does not model.

