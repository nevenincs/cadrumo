# Soundness gate (modalidad 40.3 base chain): the base imponible previa (clave
# 13) is fully formula-derived from the resultado contable después del Impuesto
# sobre Sociedades (clave 04, manual, required=false) plus the correcciones al
# resultado (clave 38 / clave 39): clave 13 = clave 04 + clave 38 - clave 39. A
# positive accounting result with a zero base imponible previa would be a
# silent under-declaration of the IS pago fraccionado base
# (no-silent-under-declaration); today the formula derivation makes the
# implication mechanically near-certain (it would only fail if clave 38/39
# exactly offset clave 04), but the predicate declares the invariant explicitly
# as defence-in-depth and an operator-facing legal-grounding statement, mirroring
# the Modelo 131 01->02 precedent: a future registry edit that decoupled clave 13
# from clave 04 would otherwise silently re-open this gap with no test failing
# it. ADVISORY (non-blocking): a legitimately zero or negative base previa
# (losses, large negative correcciones) must not refuse the draft.
[[revisions.2025-y-siguientes.verification_predicates]]
predicate_id = "modelo-202-base-imponible-previa-determinada-cuando-resultado-positivo"
expression = 'implies_nonzero(["04", "13"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-40-3", "ley-27-2014:art-40"]

# Modalidad 40.3 resultado-previo lane exclusivity: the clave 32 instructions
# read "clave [18] (o clave [26])", so B1 (clave 18) and B2 (clave 26) are
# alternatives. The formula adds both zero-default lanes to preserve B2-only
# filings, but verification must refuse the overstatement case where both
# alternative lanes are positive.
[[revisions.2025-y-siguientes.verification_predicates]]
predicate_id = "modelo-202-b1-b2-resultado-previo-at-most-one-positive"
expression = 'at_most_one_positive(["18", "26"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["ley-27-2014:art-40-3", "ley-27-2014:art-40"]

# Soundness gate (modalidad 40.3 B2 casos especificos, tipo 3 tramo, 2025-only):
# clave 63 (importe pago fraccionado tipo 3) is fully formula-derived from clave
# 61 (base a tipo 3, manual) times clave 62 (porcentaje 3, manual) via the
# percent operator (formulas/0011-modelo-202-importe-pago-fraccionado-b2-tipo-3.toml).
# A positive declared base with a zero computed importe would be a silent
# under-declaration of this tramo's contribution to the pago fraccionado
# (no-silent-under-declaration); the only way this fires without an operator
# omission is a genuinely-zero clave 62, which no LIS art. 29 tipo de gravamen
# reduces to for an entity that files this tramo at all. ADVISORY (non-blocking),
# mirroring the clave-04-to-clave-13 precedent above: declared as
# defence-in-depth and an operator-facing legal-grounding statement. See the
# modelo-verify-nonzero-guards m202-deferred-items audit (2026-07-01) for the
# full B2-lane investigation, including the separate, more severe finding that
# clave 26 (B2 resultado previo) is not wired into clave 32 at all -- NOT
# addressed by this predicate, which only guards the intra-tramo base-to-importe
# relationship.
[[revisions.2025-y-siguientes.verification_predicates]]
predicate_id = "modelo-202-2025-b2-base-tipo-3-implica-importe-pago-fraccionado-tipo-3"
expression = 'implies_nonzero(["61", "63"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-40-3", "ley-27-2014:art-29"]

