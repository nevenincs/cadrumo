# Modelo 202 at the authenticated declaraciones-presentadas register.
#
# AEAT's register offers modelo 202 in its own modelo combobox, read from the
# register's controls rather than inferred: an authenticated read-only
# discovery run on 2026-08-13 returned 202 for ejercicios 2014 through 2026.
# Until then this modelo declared no read surface, and the capture path
# correctly refused to claim anything about AEAT's coverage from that silence.
#
# READ-ONLY BY CONSTRUCTION. The guard policy is built from this decision, so
# the method and action lists below are the whole authorisation: GET/HEAD/
# OPTIONS against the sede host the register serves, and every state-changing
# verb forbidden. Nothing here permits a presentation, a signature or a payment.

[[revisions."2023-2024".live_cross_references]]
id = "modelo-202-filed-declarations-read"
evidence_tier = "official_source_guidance"
surface = "authenticated_read_surface"
guard_policy_id = "modelo-202-filed-declarations-read-only"
allowed_hosts = ["www6.agenciatributaria.gob.es"]
allowed_methods = ["GET", "HEAD", "OPTIONS"]
forbidden_actions = [
    "server-side-save",
    "signing",
    "presentation",
    "payment",
    "amendment",
    "cancellation",
    "document-submission",
    "declaration-submission",
]
synthetic_data_allowed = false
requires_authentication = true
requires_aeat_authorization = true
legal_refs = ["ley-27-2014:art-40", "ley-27-2014:art-105"]
source_refs = ["aeat-modelo-202-instructions-2023-2024"]
