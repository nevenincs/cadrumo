# Calculation-only Decimal binding: carries the importe neto de la
# cifra de negocios (INCN) of the prior 12 months. This is the sole
# input to the LIS Art. 40.3 modality split at the 6.000.000 EUR
# threshold: when INCN > 6.000.000 EUR the Art. 40.3 lane is mandatory
# and the Art. 40.2 lane (clave 03) is not offered; when INCN ≤
# 6.000.000 EUR both modalities are reachable and Art. 40.2 is the
# default. An undeclared INCN prevents modality determination and the
# engine returns INCOMPLETE rather than guessing — a wrong pago
# fraccionado modality is a regulatory error, not a minor rounding.
#
# Sourced from the Decimal profile fact `incn_prior_12_months` under
# the `taxpayer_type` profile section. An undeclared value raises
# `binding has no supplied value` in the formula executor so the
# Art. 40.2 formula (clave 03) is refused when INCN is unknown.
# Modelo 202 modalidad art. 40.2 LIS — base del pago fraccionado from the
# prior period's cuota líquida.
#
# Under LIS art. 40.2 the instalment base (casilla 01) is the cuota
# íntegra/líquida of the last período impositivo whose declaration deadline
# had elapsed on the first day of the instalment's payment month, minored by
# the deductions and withholdings of that same período. This binding copies
# the prior Modelo 200 cuota líquida (DP200014B:00592, semantic_role
# is_cuota_liquida) into casilla 01.
#
# The temporal member declares all three target periods: 1P reaches two filing
# years back, 2P and 3P one year back, because the prior-year Modelo 200 July
# deadline falls between the April instalment and the October/December ones.
# The declaration is therefore complete for every target period the
# applicability names.
#
# What is incomplete is SOURCE COVERAGE, not the declaration: the registry
# carries no Modelo 200 revision before 2024, so the 1P anchor lands on a
# filing year that has no source to read. That is an absence surfaced at
# resolution time -- the anchor resolves to no value and the casilla stays
# unresolved with its diagnostic -- rather than a period this binding declines
# to declare. It becomes resolvable with no change here once the earlier
# Modelo 200 revisions are authored.
#
# The binding inherits the existing INCN modality gate
# (derive_modelo_202_modality, driven by
# modelo-202-2025-y-siguientes-incn-prior-12-months): for an INCN > EUR 6M
# entity, modalidad 40.2 is not offered (only 40.3 clave 32), so casilla 01 is
# not populated for a 40.3-mandatory filer.

