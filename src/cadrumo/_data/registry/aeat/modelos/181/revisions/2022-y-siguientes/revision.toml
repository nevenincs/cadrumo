# Modelo 181 declaración informativa, approved by orden-eha-3514-2009 art 1
# with its plazo grounded verbatim in orden-eha-3514-2009 art 6.
# Scheduling/applicability-grade: declaration-header casillas only. The
# authoritative Modelo 181 diseño de registro IS bundled (aeat-dr-181-2022)
# but no casilla-to-position mapping has been authored from it yet, so no
# numbered form casilla is fabricated here.
# Narrowed from an unbounded 2009 claim to the ejercicio its own layout covers.
# The revision declares exactly one export layout, `modelo-181-fichero-2022`,
# citing `aeat-dr-181-2022` (applies 2022 onward), and its deadline windows begin
# at filing year 2024. Claiming 2009-2021 asserted that those filings are written
# at a layout AEAT did not publish for them. The three earlier bundled designs
# (2009, 2016, 2017) remain registered; giving each its own era needs a rendered
# layout per era, which is export-generation work, not a span edit.
