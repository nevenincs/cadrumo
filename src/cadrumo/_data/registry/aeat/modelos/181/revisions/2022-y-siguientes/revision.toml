shift_reason 'sabado', so the published operational date is now derived with its reason \
rather than stored without one. VERIFIED -- WHEN DUE: orden-eha-3514-2009 art. 6 reads \
verbatim in the bundled corpus \"La presentacion de la declaracion informativa de \
prestamos y creditos, y operaciones financieras relacionadas con bienes inmuebles, modelo \
181, se realizara en el plazo comprendido entre el dia 1 y el 31 del mes de enero de cada \
ano\", and all three windows now open 1 January and close 31 January nominally (2025-01-31 \
Friday, 2026-01-31 Saturday, 2027-01-31 Sunday) -- two of the three fall on a weekend and \
are stored unshifted. VERIFIED -- TO WHOM: art. 1 is the dedicated approving clause, \"Se \
aprueba el modelo 181 «Declaracion informativa de prestamos y creditos, y operaciones \
financieras relacionadas con bienes inmuebles»\", carrying no year bound, so the \
open-ended 2022-y-siguientes claim does not outrun its orden. VERIFIED -- EXPORT LAYOUT: \
modelo-181-fichero-2022, format fixed_width, two records. modelo-181-declarante carries 16 \
offset-bearing fields and modelo-181-declarado carries 34, and each tiles positions 1..500 \
exactly once with NO gap and NO overlap. The registry loader rejects overlapping ranges \
but does NOT check full tiling, so the gap half was measured here rather than inherited \
from validation. SCOPE FLIP ACKNOWLEDGED -- this revision declares an export layout, so \
agent review moves its derived authority scope from inspection_only to filing, and the \
