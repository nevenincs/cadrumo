reviewed_by = """\
agent: review of the prestamos y creditos y operaciones financieras relacionadas con \
bienes inmuebles informativa. DISCLOSURE -- this review follows a correction made in the \
SAME action by the same agent: the filing-year-2025 window stored closes_on 2026-02-02, \
the OPERATIONAL date for a 31 January falling on a Saturday, which the nominal-store rule \
