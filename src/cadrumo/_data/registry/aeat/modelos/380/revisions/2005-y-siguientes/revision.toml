[revisions."2005-y-siguientes"]
authority_grade = "applicability"
# Modelo 380 autoliquidación/solicitud del IVA, approved by orden-eha-1308-2005 art
# 1 with its plazo grounded verbatim in orden-eha-1308-2005 art 4.
# Scheduling/applicability-grade: declaration-header casillas only; no bundled
# Modelo 380 diseño de registro, so no numbered money-closure casilla is
# fabricated.
# Deadline-shape note: the plazo is delegated to the ordinary IVA declaration
# plazo (art 4), whose specific dates depend on the taxpayer's IVA regime and
# are not stated in this orden, so NO calendar deadline_windows and no deadline
# application link are authored — a fixed date is not fabricated.
valid_from = 2005-01-01
period_selector = { year_from = 2005, periods = ["0A"] }
orden_aplicabilidad = ["orden-eha-1308-2005:art-1"]
legal_refs = [
    "orden-eha-1308-2005:art-1",
    "orden-eha-1308-2005:art-4",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-380-procedure",
    "enrolled-modelo-380-layout",
]
