[[revisions."2021-2025".verification_expectations]]
id = "modelo-353-iva-chain-verification"
computed_casilla_ids = ["iva.cuota-devengada-total", "iva.cuota-deducible-total", "iva.resultado-regimen-general"]
tolerance = "0.00"
rounding = "money-2"
min_coverage = "1"
discrepancy_causes = [
    "extraction_unreliable",
    "unmodelled_rule",
    "rounding",
    "correctness_divergence",
]
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "orden-eha-3434-2007:art-2", "rd-1624-1992:art-71"]
source_refs = ["aeat-dr-353-2021-2025", "aeat-modelo-353-procedure"]
# Grounded against the AEAT Manual practico IVA 2024, Cap. 6 "Los regimenes
# especiales en el IVA", "Regimen especial del grupo de entidades" worked
# example (pag. 199-200): OMEGA, S.A. (dominante) files Modelo 322 with
# resultado 4.000 and DELTA, S.A. (dependiente) files Modelo 322 with
# resultado -1.000; the dominant entity's Modelo 353 integrates both,
# and the manual states its own aggregate: "Resultado autoliquidacion: 3.000"
# (pag. 200). Grounded here via the group's combined devengada (6.000+1.000=
# 7.000) and deducible (2.000+2.000=4.000) cuotas - simple arithmetic over the
# manual's own printed per-member totals, never a hand-run of the registry
# formula under test. See
# test_m353_2024_grupo_entidades_manual_worked_example.py and
# corpus/manual_oracles/modelo-353-2024-grupo-entidades-agregado.json.
externally_grounded_casilla_ids = ["iva.cuota-devengada-total", "iva.cuota-deducible-total", "iva.resultado-regimen-general"]

