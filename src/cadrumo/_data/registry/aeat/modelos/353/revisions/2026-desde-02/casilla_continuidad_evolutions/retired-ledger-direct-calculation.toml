# concepts remain on each member's Modelo 322. Both official 353 designs make
# [01] the sum of member results (2021-2025 extract line 195; 2026 line 196),
# followed by [03] = [01] - [08] and [05] = [03] - [04]. The successor already
# carries that member-result path and does not inherit an own-ledger liquidation.

