[revisions."2008-2025"]
# Prepared and reviewed by an agent against the bundled diseño de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement:
#   - every casilla legal_ref and source_ref resolves to the legal catalogue, and
#     every cited source's corpus file is present on disk;
#   - every formula targets a casilla of this revision;
#   - every enrolled schema family resolves;
#   - every cited source's applicability window overlaps this revision's own life;
#   - and all 1 fixed-width record(s) of the DERIVED layout were paired to
#     their design sheet and cover it: no design DATA position is left
#     unaddressed, and none reaches past its declared record length.
#
# The coverage figure is measured on the layout AFTER binding derivation, which
# is what the renderer and the completeness gate consume; the raw export_layouts
# collection holds only inline fields and reading it understates coverage badly.
#
# This stamp claims no fresh-render reproduction evidence: that belongs to the
# revisions enrolled in the generated-tree drift gate, and this one is not.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
# Closed at 2025 when this revision was split from the former single
# "2008-y-siguientes". AEAT's ejercicio-2026 diseno de registro changes this
# modelo's shape structurally -- page 1 grows 1500 -> 1700 bytes and a THIRD
# record (35302, 400 bytes, carrying IBAN and SWIFT-BIC) appears that does not
# exist before 2026 -- so 2026 onward cannot share a fixed-width layout with the
# years before it and now lives in its own sibling revision.
#
# The ledger-direct IVA cuota chain stays HERE deliberately. It is grounded
# against the AEAT Manual practico IVA 2024 worked example (pag. 199-200), whose
# oracle is filing_year 2024 and therefore resolves to this revision. Retiring
# that chain is scoped to the 2026 sibling, where the numbered boxes replace it,
# so no external grounding is stranded by the split.
valid_from = 2008-01-01
valid_to = 2025-12-31
period_selector = { year_from = 2008, year_to = 2025, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
legal_refs = [
    "orden-eha-3434-2007:art-2",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
orden_aplicabilidad = [
    "orden-eha-3434-2007:art-2",
]
source_refs = [
    "aeat-dr-353-2021-2025",
    "aeat-modelo-353-procedure",
    "boe-modelo-353-2007-form",
]


[revisions."2008-2025".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2008-2025' of modelo 353 has no strictly-earlier sibling revision of this modelo (valid_from 2008-01-01 precedes every other declared revision of this modelo; its sibling 2026-y-siguientes starts strictly later), so it \
cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
legal_refs = [
