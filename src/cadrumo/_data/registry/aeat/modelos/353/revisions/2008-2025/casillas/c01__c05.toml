# Modelo 353 numbered liquidacion casillas for the 2008-2025 revision.
#
# Mirrored from the 2026-y-siguientes sibling, whose boxes this revision's own
# design (aeat-dr-353-2021-2025, record 35301) prints identically: [01] at 1108,
# [02] at 1125, [03] at 1142, [04] at 1159, [05] at 1176, [08] at 1254 and [09]
# at 1271. Only the offsets moved between editions; the boxes and their
# arithmetic did not.
#
# [10] is absent here on purpose. The pago a cuenta for gasolinas, gasoleos and
# biocarburantes leaving the deposito distinto del aduanero is a 2026 addition,
# and this design carries no slot for it, so mirroring it would declare a box
# AEAT never printed on these years.
#
# The ledger-direct iva.* chain this revision already carries is untouched: it
# is what the AEAT Manual practico IVA 2024 worked example grounds, and the two
# coexist exactly as they do on the 2026 sibling.

