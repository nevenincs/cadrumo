# Modelo 353 numbered liquidacion casillas, transcribed from the bundled Diseno de
# Registro aeat-dr-353-2026, sha256
# cb1374a79a87b7c8282ff3c964d78b250bedfa11750decfa0e5e7f90e8f97380, record 35301.
#
# These are the boxes Modelo 353 ACTUALLY has. Until now this revision declared
# none of them: it carried only a ledger-direct IVA cuota breakdown
# (repercutido/soportado/autorepercutido and their totals) copied from the Modelo
# 303/322 vocabulary, for which this design has no slot at all -- a search of both
# bundled 353 designs for devengad|repercut|recargo|deducib|soportad|equivalencia
# returns zero hits. Modelo 353 is the GROUP AGGREGATE return: its result is the
# sum of the members' Modelo 322 resultados, not a cuota liquidation of its own.
#
# [01] is therefore bound to the existing per_grupo_member fan-in over each
# member's Modelo 322 resultado -- which is exactly what AEAT's own label says,
# "sumatorio del resultado de entidades" -- rather than recomputed from the
# filer's ledger. The arithmetic on [09], [03] and [05] is AEAT's own, printed in
# the design's field descriptions; nothing is inferred. Note [05] is
# ([03] - [04]) as the design states: it does NOT subtract [10], and no such
# subtraction is invented here.

