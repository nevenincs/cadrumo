[revisions."2026-y-siguientes".family_dispositions.parameters]
reason = """
A parameter is a regulatory value the engine applies -- a rate, a bracket tranche, a threshold, a reduction coefficient. 353 applies none. It is an AGGREGATION return: every cuota it reports was already determined, at its own rate, on the member entity's own Modelo 322, and 353 only sums those results and nets them against the group's pending compensaciones and prior payments. Every formula on this revision is addition and subtraction over casillas whose values arrive from the members; not one \
multiplies by a rate. The regime of LIVA art. 163 sexies fixes WHO aggregates, not at what rate, so there is no versioned regulatory number for this revision to carry. A future edition that introduced one -- a group-level limit, say -- would author it here, and this declaration is what that change would replace."""
legal_refs = [
    "ley-37-1992:art-163-sexies",
    "orden-eha-3434-2007:art-2",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-353-2026",
    "aeat-modelo-353-procedure",
    "boe-modelo-353-2007-form",
]

