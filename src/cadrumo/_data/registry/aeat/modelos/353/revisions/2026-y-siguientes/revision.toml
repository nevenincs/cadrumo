[revisions."2026-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). This revision DOES have a strictly-earlier sibling (2008-2025), so it could in principle be the landing point of a within-modelo continuity transition. It declares none because the numbered casillas it introduces are NEW identities rather than renumberings: the 2008-2025 sibling declares no numbered casilla at all, so there is no prior identity for [01], [02], [03], [04], [05], [08], [09] or [10] to have evolved from."
