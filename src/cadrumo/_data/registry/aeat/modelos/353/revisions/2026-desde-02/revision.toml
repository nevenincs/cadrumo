# Prepared and reviewed by an agent against the bundled diseno de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement rather than assertion: every
# casilla legal_ref and source_ref resolves to the legal catalogue; every cited
# source's corpus file is present; every formula targets a casilla of this
# revision; every enrolled schema family resolves; and the committed export tree
# reproduces byte-for-byte from a fresh render off the hash-verified official
# design, then validates through the real registry authority. 
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
# Split from the former single "2008-y-siguientes" revision so the ejercicio-2026
# diseno de registro can be modelled as AEAT publishes it: page 1 grows 1500 ->
# 1700 bytes and a third record (35302, 400 bytes, IBAN + SWIFT-BIC) appears.
# The boundary is grounded in reviewed source metadata the registry already
# carried: aeat-dr-353-2021-2025 closes 2025-12-31, and aeat-dr-353-2026 carries
# applies_from = 2026-02-01 under Orden HAC/27/2026's final provision, which
# makes this design first applicable to February 2026.
valid_from = 2026-02-01
# The reviewed BOE transition applies this design first to February.  This is
# intentionally bounded to the evidence-backed filing year: no 2027 writer is
# inferred merely from a source filename saying "y siguientes".
valid_to = 2026-12-31
period_selector = { years = [2026], periods = ["02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
