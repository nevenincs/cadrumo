# AEAT's ejercicio-2026 diseno de registro changes this modelo's shape
# structurally -- page 1 grows 1500 -> 1700 bytes and a THIRD record (35302,
# 400 bytes, carrying IBAN and SWIFT-BIC) appears -- so the autoliquidaciones
# filed on that design cannot share this fixed-width layout and live in the
# sibling revision 2026-desde-02.
#
# The boundary is February 2026, not the turn of the year. Orden HAC/27/2026's
# disposicion final unica applies the new modelo 353 for the first time to the
# autoliquidaciones "correspondientes ... al mes de febrero de 2026", so the
# January 2026 autoliquidacion is still filed on this design. The selector
# therefore serves filing year 2026 for period 01 only (period_overrides), and
# valid_to closes at the end of that month.
#
# The ledger-direct IVA cuota chain stays HERE deliberately. It is grounded
# against the AEAT Manual practico IVA 2024 worked example (pag. 199-200), whose
# oracle is filing_year 2024 and therefore resolves to this revision. Retiring
# that chain is scoped to the 2026 sibling, where the numbered boxes replace it,
# so no external grounding is stranded.
valid_from = 2021-01-01
valid_to = 2026-01-31
period_selector = { year_from = 2021, year_to = 2026, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"], period_overrides = [{ year = 2026, periods = ["01"] }] }
