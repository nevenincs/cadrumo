# Modelo 353 numbered-liquidacion formulas for the 2021-2025 revision.
#
# The same arithmetic AEAT prints in its own field descriptions on
# aeat-dr-353-2021-2025, record 35301: [09] is ([02]-[08]), [03] is
# ([01] - [08]) and [05] is ([03] - [04]). Nothing is inferred and nothing is
# widened; these are the expressions the design states.

