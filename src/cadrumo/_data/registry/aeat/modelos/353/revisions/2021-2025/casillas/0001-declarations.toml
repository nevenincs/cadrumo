# The ledger-direct IVA cuota vocabulary below files no slot on this modelo's
# own record. AEAT's diseño for 353 carries no devengado, repercutido,
# soportado, deducible or recargo field anywhere -- a search of the design for
# any of those stems returns nothing -- because 353 is the GROUP AGGREGATE
# return: the members liquidate their own cuotas on Modelo 322 and 353 files
# only the sum of their results, through [01]. These casillas therefore carry
# not_in_record_design: they are calculation support that reconciles against
# the members, never boxes the operator files.
# Modelo 353 (agregado del grupo) — reconciliation casillas surfacing the
# cross-member previous_filing sums. Each is a bound casilla pulling
# the per_grupo_member aggregate of the corresponding 322 result casilla, so the
# 353 aggregate appears in engine_result.values with full provenance.

