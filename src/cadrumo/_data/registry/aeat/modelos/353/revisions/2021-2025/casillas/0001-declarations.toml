continuidad_id = "m353-resultado-total-entidades"
number = "01"
section = ["iva", "grupo_entidades", "liquidacion"]
semantic_role = "m353_resultado_total_entidades"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "The design declares one aggregate-of-members slot, [01] at position 1109, and Modelo 353 has exactly one group whose member results it sums. Singleton by the design's construction, not by a missing sibling."
input_kind = "bound"
binding = "modelo-353-prev-322-resultado-regimen-general"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-92", "orden-eha-3434-2007:art-2", "rd-1624-1992:art-71"]

