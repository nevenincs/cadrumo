# Modelo 222's 2023-2024 instructions make these results automatic, but B.1 and
# B.2 are alternative calculation lanes. Reconcile each result when a returned
# declaration prints it; do not add alternative-lane outputs to the coverage
# denominator.
#
# The list is exactly this edition's computed casillas. It differs from the
# 2025 edition's in both directions: [23] is computed here and filer input
# there, because this era's instructions state "La clave [23] sera = clave [19]
# - clave [20]", while [63] and [66] are absent here, being importes of the
# third and fourth B.2 rate tiers the 2023 design does not print.

