# Applicability-grade historical edition for modelo 222, filing year 2024.
#
# SAME DESIGN, DIFFERENT YEAR. This edition and its predecessor 2023 are
# governed by ONE artefact: aeat-dr-222-2023-2024 declares applies_from
# 2023-01-01 and applies_to 2024-12-31, so a single diseño de registro covers
# both filing years. The two editions exist because the filing year is the
# datum -- each carries its own three trimestral plazos -- not because the
# geometry changed. It did not: the 56 boxes, their order, their record
# assignment and both 900-position envelopes are the same file read twice.
#
# The predecessor is declared, and this edition nonetheless states its own
# complete casilla set rather than relying on inheritance, which is how the
# back-year editions of modelos 190 and 193 are authored. The grade is equal to
# its predecessor's, so the predecessor does not outrank it.
#
# WHAT THIS EDITION ESTABLISHES, measured against that bundled design:
#   - 56 own-box declarations, zero duplicates: 24 on DR22201, 32 on DR22202,
#     matching the count the 2025-y-siguientes edition's own review reports for
#     this file ("56 in the 2024 one").
#   - Both records are 900 positions with "Indicador de fin de registro" at
#     position 889, length 12, constants "</T22201000>" and "</T22202000>".
#   - The delta to 2025 is purely additive -- [67] on DR22201 and [61]-[66] on
#     DR22202 -- and shifts the rest of the record, so no position was copied
#     across the epoch boundary. The eleven unnumbered 'Información adicional'
#     slots, whose casilla `number` IS a position range, are declared at
#     555-741 here against 633-819 in 2025.
#   - This epoch prints TWO rate tiers in B.2, not four.
#   - Every legal_ref cited is in force across the whole filing year:
#     orden-hfp-227-2017:art-2 and art-5 from 2017-03-16, ley-27-2014:art-40
#     from 2015-01-01, all open-ended.
#
# Why the grade is 'applicability': as for 2023, every instrucciones source in
# the catalogue (aeat-modelo-222-instructions, aeat-modelo-202-instructions)
# declares applies_from 2025-01-01, so the fifteen boxes the 2025 edition
# computes are input_kind = "manual" here with their formula references
# dropped, and no formula, parameter, export layout or completeness manifest is
# declared. Promoting this edition needs ONE acquisition: the AEAT modelo 222
# instrucciones as they stood for ejercicio 2024. The record geometry is
