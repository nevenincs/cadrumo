# Modelo 222 casillas new on the bundled official diseno `aeat-dr-222-2025`:
# box [67] on DR22201 and the tier 3 and 4 boxes [61]-[66] on DR22202, id and
# number both the bare box as modelo 202 does -- 222 is 202's consolidacion twin.
# The design declares 63 boxes; the 56 it shares with `aeat-dr-222-2023-2024`,
# with the declarant fields and the Informacion adicional slots, are stored as
# overrides of the 2024 edition, the casilla storage baseline.
#
# A field's OWN box is the LAST bracket in its design description; earlier
# brackets are that field's formula inputs. That rule is what resolves the
# 'boxes 16, 22 and 32 appear twice' hazard -- see the correction above the
# revision's valid_from. Measured: 63 own-box declarations, zero duplicates.
#
# A box is computed exactly when this revision declares a formula targeting it,
# per the official 222 instructions (`aeat-modelo-222-instructions`); every other
# box is filer input.

