# The single regulatory value modelo 222's formulas apply in this epoch.
#
# Grounded in aeat-modelo-222-instructions-2023-2024, which states it for this
# era in its own words: "CLAVE [03]. A INGRESAR Sera el resultado de aplicar el
# porcentaje del 18% a la cantidad calculada como base del pago fraccionado
# (clave [01])". The value is carried as a parameter rather than a literal
# because it is a rate the Orden can move, and the 2025 edition declares the
# same parameter id for the same reason.

