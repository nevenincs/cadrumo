# Modelo 222 trimestral deadline windows, grounded in Orden HFP/227/2017 art 5.2:
# "La presentación de la autoliquidación modelo 222, pago fraccionado a cuenta
# del Impuesto sobre Sociedades para los grupos fiscales, se efectuará, durante
# los primeros veinte días naturales de los meses de abril, octubre y diciembre
# de cada año natural." Each window opens on the first of the month and closes on
# the 20th natural day, derived strictly from the statutory plazo (first 20
# natural days), not copied from any engine output. The foral (Navarra/País
# Vasco) modalities of art 5.3 are out of this revision's scope.

