# Modelo 222 envelope header, transcribed from the bundled official Diseño de
# Registro (source "aeat-dr-222-2025",
# corpus/aeat_official/disenos_registro/modelo_222/files/01-222-ejercicio-2025-y-siguientes.xlsx,
# sheet "DR22200"). Same generic AEAT "<T...><AUX>...</AUX>" declaration
# envelope as modelos 122/220. Position table (Posic./Lon): 1(2) constante
# "<T"; 3(3) modelo constante "222"; 6(1) discriminante constante "0"; 7(4)
# ejercicio devengo; 11(2) periodo -- NOT a constant here ("1P","2P","3P" o
# "0A", disposition-dependent across this revision's own three pagos
# fraccionados periods, so not declared as a literal); 13(5) constante
# "0000>"; 18(5) constante "<AUX>"; ...; 323(6) constante "</AUX>"; 329+
# contenido variable. Only the fixed, unambiguous envelope coordinates are
# transcribed; the disposition-dependent periodo, the reserved/version/NIF-
# desarrollador positions and the closing tag at the variable offset after
# content are left undeclared rather than fabricated. The revision's own
# comment already records that the money-closure casillas remain deferred
# until the box-number mapping is authored -- this layout does not change
# that; it only stops the revision from declaring no export layout at all.

