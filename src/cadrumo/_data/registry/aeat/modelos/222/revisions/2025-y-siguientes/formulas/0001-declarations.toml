# The diseno de registro labels this box "([16] x [17]) - [49] - [50] - [51] + [52] - [53]"; the instructions
# for the same period add [49] and [50] and also subtract [58]. The instructions carry the computation and
# state that [49] works with either sign, which the diseno's signed N typing for [49] and [50] agrees with,
# so the instructions' formula is authored.
# [18] (B.1, single rate) and [26] (B.2, several rates) are mutually exclusive computations of the same
# resultado previo: a group completes one lane's inputs and leaves the other lane's empty, so the unused
# box resolves to zero and adding both reproduces "clave [18] o clave [26]".

