# periodos impositivos iniciados en 2023 y 2024", which states each computed
# clave verbatim. Every required_text below is quoted from that page.
#
# WHAT THIS EPOCH COMPUTES THAT 2025 DOES NOT, and the reverse. The 2025 diseno
# prints four B.2 rate tiers; this one prints two, so claves [61] to [66] and
# their two importe formulas are ABSENT here rather than omitted, and [26] sums
# only the two tiers this design carries. Clave [67], "Correccion por Impuesto
# Complementario (IC)", is likewise absent, so [38] is clave [05] + clave [07]
# exactly as this era's instructions state it.
#
# Conversely this era's instructions state two claves the 2025 edition leaves as
# filer input: [19], whose text repeats the [16] chain ("La clave [19] sera =
# clave [13] + clave [44] + clave [45] - clave [46] - clave [14] - clave [15] +
# clave [47] - clave [48], sin poder ser negativa"), and [23] ("La clave [23]
# sera = clave [19] - clave [20]"). They are authored because the source states
# them, not inferred from the sibling.

