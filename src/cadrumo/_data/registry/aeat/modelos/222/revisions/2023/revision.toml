# Calculation-grade edition for modelo 222, filing year 2023, stored as its
# differences from the 2022 edition (see the storage note below).
#
# WHICH DESIGN AND WHICH INSTRUCTIONS. aeat-dr-222-2023-2024 declares
# applies_from 2023-01-01 and applies_to 2024-12-31, so it is the design in
# force for this filing year; aeat-modelo-222-instructions-2023-2024 is AEAT's
# page "Instrucciones para periodos impositivos iniciados en 2023 y 2024", from
# which every formula citation below is quoted. aeat-dr-222-2025 opens
# 2025-01-01 and is not cited here.
#
# WHAT THIS EDITION CHANGES AGAINST 2022, measured against that design:
#   - boxes [59] and [60], "Ajustes para la determinacion de la base imponible
#     del grupo (DA 19a LIS)", are new on this design and are added into [10],
#     which becomes clave [04] + clave [38] - clave [39] + clave [59] - clave [60];
#   - page 1 gains the flag at position 226, which lives in this edition's
#     generated export layout;
#   - every formula, the 18% modalidad 40.2 rate, the reconciled claves and the
#     review, approval and reconciliation links cite this era's instructions,
#     and the calculation and export links, the completeness manifest and the
#     workbook pin cite this era's design.
#
# Every legal_ref cited is in force across the whole filing year:
# orden-hfp-227-2017:art-2 and art-5 from 2017-03-16, ley-27-2014:art-40 from
# 2015-01-01, all open-ended.
authority_grade = "calculation"
id = "2023"
valid_from = 2023-01-01
valid_to = 2023-12-31
period_selector = { year_from = 2023, year_to = 2023, periods = ["1P", "2P", "3P"] }
orden_aplicabilidad = ["orden-hfp-227-2017:art-2"]
legal_refs = [
    "orden-hfp-227-2017:art-2",
    "orden-hfp-227-2017:art-5",
    "ley-27-2014:art-40",
]
source_refs = ["aeat-dr-222-2023-2024", "boe-modelo-202-base-order"]
review_status = "agent_reviewed"
reviewed_by = """\
agent: authored from the bundled hash-pinned aeat-dr-222-2023-2024 diseño de registro, \
whose declared window (2023-01-01..2024-12-31) covers this filing year exactly. VERIFIED -- \
EVERY CITED REF COVERS THE YEAR: orden-hfp-227-2017 art-2 and art-5 effective_from \
2017-03-16 open-ended, ley-27-2014:art-40 effective_from 2015-01-01 open-ended, \
boe-modelo-202-base-order applies_from 2017-03-16 open-ended, aeat-dr-222-2023-2024 \
2023-01-01..2024-12-31. NOT ONE ref or source cited here opens after 2023-01-01 or closes \
before 2023-12-31. VERIFIED -- 56 OWN-BOX DECLARATIONS, ZERO DUPLICATES, counted with the \
rule the 2025 edition establishes (a field's own box is the LAST bracket in its \
description; earlier brackets are formula inputs). 24 on DR22201, 32 on DR22202. The 2025 \
edition's own review independently reports 56 for this file, which is why the count is an \
external check rather than a self-report. VERIFIED -- THE EPOCH DELTA IS ADDITIVE ONLY: \
2025 adds [67] on DR22201 and [61]-[66] on DR22202 and withdraws nothing; all 56 boxes here \
survive into 2025. VERIFIED -- POSITIONS WERE NOT COPIED ACROSS EPOCHS. 39 of the shared \
boxes sit at different offsets in the two designs, so every position-bearing value in this \
edition was read off THIS design: the eleven unnumbered Información adicional slots are \
declared at 555-571 through 725-741, against 633-649 through 803-819 in 2025, a uniform +78 \
that matches the space the six added B.2 boxes take. Copying the 2025 ranges would have put \
all eleven fields 78 bytes into the wrong slot. VERIFIED -- BOTH RECORDS END IDENTICALLY TO \
2025: 900 positions, fin de registro at 889 length 12. NOT CLAIMED -- calculation or filing \
grade: no instrucciones source in the catalogue opens before 2025-01-01, so all 56 boxes are \
input_kind = "manual" and no formula, parameter, export layout or completeness manifest is \
declared. NOT CLAIMED -- locale labels. The es/en/ca/hu schema catalogues carry a casilla \
block for 2025-y-siguientes only; this edition adds none, which is the same state the \
back-year editions of modelos 190 and 193 are in. NOT CLAIMED -- independent_check_coverage \
is n/a: NO CLAIM, not zero. No human operator has countersigned this edition."""
