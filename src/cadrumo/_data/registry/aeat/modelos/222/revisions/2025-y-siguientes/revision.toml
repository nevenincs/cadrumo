# Modelo 222 pago fraccionado del Impuesto sobre Sociedades en régimen de
# consolidación fiscal. The model is approved by Orden HFP/227/2017 art 2
# (BOE-A-2017-2778) — the same orden that approves Modelo 202 — and its binding
# trimestral plazo persists from art 5.2 of that orden (primeros veinte días
# naturales de los meses de abril, octubre y diciembre). It began as a
# scheduling/applicability-grade revision grounding the approval and the
# filing plazo against the bundled BOE corpus. Its 63 liquidacion casillas come
# from the bundled diseño de registro (`aeat-dr-222-2025`), and the computed ones
# carry the formulas the AEAT instructions for 2025 and later print
# (`aeat-modelo-222-instructions`), which is what backs the calculation grade.
# The grade stops short of filing: filing needs every relationship family
# resolved, and the group-level inputs a filing would draw from Modelo 220 have
# no binding (that source is deferred). The corpus also carries
# a second Modelo 222 design (02-222-ejercicios-2023-y-2024.xlsx, not declared
# here) whose attributed years fall entirely outside this revision's own
# span (`year_from = 2025`) — it belongs to a different revision or acquisition
# question, not to this one.
# HAZARD CORRECTION (measured against both bundled disenos). The review below
# records that the 2024 diseno "prints boxes 16, 22 and 32 TWICE each within a
# single sheet, over different figures", and warns that authoring them as bare
# numbers would collapse six figures into three. That is a false positive: it
# counts bracket OCCURRENCES rather than box DECLARATIONS. In both the 2024 and
# the 2025 diseno each of those boxes is declared exactly once, and its second
# mention is a later field's formula citing it as an input --
#   [16] declared "Base del pago fraccionado [16]", cited by
#        "Resultado previo (clave ([16] x [17]) - [49]..."
#   [22] declared "Importe del pago fraccionado [22]", cited by
#        "Resultado previo (claves [22]+[25]+[54]+..."
#   [32] declared "Resultado [32]", cited by
#        "Cantidad a ingresar (mayor de claves [32]..."
# Measured across both files: 63 own-box declarations in the 2025 diseno and 56
# in the 2024 one, with ZERO duplicated declarations in either. The rule that
# resolves it is that a field's own box is the LAST bracket in its description
# and any earlier bracket is a formula input. Authoring the casillas as bare box
# numbers is therefore correct; inventing distinct numbers to "separate" 16, 22
# and 32 would be the actual defect.
valid_from = 2025-01-01
period_selector = { year_from = 2025, periods = ["1P", "2P", "3P"] }
orden_aplicabilidad = ["orden-hfp-227-2017:art-2"]
legal_refs = [
    "orden-hfp-227-2017:art-2",
    "orden-hfp-227-2017:art-5",
    "ley-27-2014:art-40",
]
