# Application links for the 2024 epoch. Every source_ref is checked against its
# own declared window: boe-modelo-202-base-order applies_from 2017-03-16
# open-ended, aeat-dr-222-2023-2024 applies_from 2023-01-01 applies_to
# 2024-12-31. aeat-modelo-202-instructions and aeat-modelo-222-instructions are
