# Modelo 222 liquidacion casillas for the 2023 epoch: the 56 box numbers the
# bundled official diseno `aeat-dr-222-2023-2024` declares, one casilla per box,
# id and number both the bare box as the 2025-y-siguientes edition does.
#
# A field's OWN box is the LAST bracket in its design description; earlier
# brackets are that field's formula inputs. Measured against this design: 56
# own-box declarations, zero duplicates -- 24 on record DR22201 and 32 on
# DR22202, which is exactly the count the 2025 edition's own review reports for
# this file ("56 in the 2024 one").
#
# WHAT THIS EPOCH DOES NOT CARRY. The 2025 design declares 63 boxes; the seven
# it adds are [67] "Correccion por Impuesto Complementario (IC) - Aumentos" on
# DR22201, and [61] [62] [63] [64] [65] [66], the third and fourth rate tiers of
# B.2 Casos especificos, on DR22202. They are ABSENT here rather than omitted:
# this design prints two rate tiers, not four.
#
# EVERY box is filer input in this epoch. No formula is declared, because the
# only Modelo 222 instrucciones source in the catalogue,
# `aeat-modelo-222-instructions`, declares applies_from 2025-01-01 and covers
# the 2025-y-siguientes page only. Rather than carry a formula reference this
# edition cannot ground, the fifteen boxes the 2025 edition computes are
# declared input_kind = "manual" here and their formula and
# additional_source_refs are DROPPED, not left dangling.


