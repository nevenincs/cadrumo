# Modelo 222 'Informacion adicional (6)' casillas for the 2023 epoch: the eleven
# 17-wide amounts the bundled official diseno `aeat-dr-222-2023-2024` declares
# WITHOUT a box number on record DR22202. The block's twelfth slot, Resultado
# consolidado del periodo, does carry box [35] and is authored with the box
# casillas instead.
#
# THE NUMBER FIELD IS THIS EPOCH'S OWN POSITION RANGE, not the 2025 edition's.
# These eleven slots sit at 555-741 in this design and at 633-819 in the 2025
# one -- a uniform shift of +78 positions, which is the space the 2025 design
# takes for the six boxes [61]-[66] it adds earlier in the same record. The
# ranges below are read off this design's own Posic./Lon columns: the eleven
# slots start at 555, 572, 589, 606, 623, 640, 657, 674, 691, 708 and 725, each
# 17 positions wide, so each range ends 16 positions after it starts.
# Copying the 2025 ranges here would place every one of these fields 78 bytes
# into the wrong slot.
#
# These are operator-entered figures, so they are casillas with slug ids rather
# than producer keys. Each names a provision the legal catalogue does not hold
# (art. 17.2, 33 and 34 LIS, and art. 26 of Ley 19/1994), so each carries the
# revision's base grounding only; citing an unresolvable ref would fail the
# legal-ref gate.

