# Why 2023 and 2024 ground on one design:
# aeat-dr-222-2023-2024 declares applies_from 2023-01-01 applies_to 2024-12-31,
# so a single diseño de registro is in force for BOTH of those filing years --
# not a stale substitute, and not acquirable debt. It declares 56 boxes against
# the 2025 design's 63; the difference is additive ([67] on DR22201 and
# [61]-[66] on DR22202) and shifts the rest of both records, so no position
# crosses the epoch boundary.
#
# FILING YEAR 2022 is authored from its own design, aeat-dr-222-2019-2022 --
# AEAT's "Orden HAC/941/2018 (Ejercicios 2019 a 2022)" -- captured 2026-09-30
# after the corpus had filed it as a historical exclusion, with the era's own
# instructions, aeat-modelo-222-instructions-2019-2022. Against the 2023-2024
# design it lacks the page-1 flag at position 226 and boxes [59] and [60]; see
# revisions/2022/revision.toml.
#
# ACQUIRABLE DEBT -- promotion of the 2023 and 2024 editions from applicability
# to calculation grade. The record geometry is already grounded verbatim and
# would not change; what is missing is the calculation layer, because every
# instrucciones source in the catalogue (aeat-modelo-222-instructions,
# aeat-modelo-202-instructions) opens 2025-01-01. Needed, one per edition:
#   - AEAT modelo 222 instrucciones as they stood for ejercicio 2023
#   - AEAT modelo 222 instrucciones as they stood for ejercicio 2024
# Until then the fifteen boxes the 2025 edition computes stay
# input_kind = "manual" with their formula references dropped rather than left
# dangling, and the modalidad 40.2 percentage parameter is not declared.
[modelo.inception.unauthored]
earliest_authored = 2022
reason = "Approved without year bound by Orden HFP/227/2017, so years before 2022 existed in law; they are below the supported floor and are not authored. 2022 is authored from aeat-dr-222-2019-2022, 2023 and 2024 from aeat-dr-222-2023-2024, and 2025 onward from aeat-dr-222-2025."
legal_refs = ["orden-hfp-227-2017:art-2"]
source_refs = ["aeat-dr-222-2019-2022"]
