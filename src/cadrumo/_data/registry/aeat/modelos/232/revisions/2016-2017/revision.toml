[revisions."2016-2017".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo has no box crediting IRPF withholding suffered, so there is no credit casilla for an entry to name."""
legal_refs = ["ley-27-2014:art-18", "rd-634-2015:art-13", "orden-hfp-816-2017:art-1", "orden-hfp-816-2017:art-2", "orden-hfp-816-2017:art-3", "ley-27-2014:art-19", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-232-2016", "aeat-modelo-232-procedure", "boe-modelo-232-2017-form"]

[revisions."2016-2017".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["ley-27-2014:art-18", "rd-634-2015:art-13", "orden-hfp-816-2017:art-1", "orden-hfp-816-2017:art-2", "orden-hfp-816-2017:art-3", "ley-27-2014:art-19", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-232-2016", "aeat-modelo-232-procedure", "boe-modelo-232-2017-form"]

[revisions."2016-2017".family_dispositions.formulas]
reason = "The declarant reports its OWN operaciones with related parties and with paraisos fiscales; the valuation of those operations is settled in the Impuesto sobre Sociedades self-assessment, not here. This form carries information about the declarant's own transactions and computes no liability, so the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
    "orden-hfp-816-2017:art-1",
]
source_refs = [
    "aeat-dr-232-2016",
    "aeat-modelo-232-procedure",
    "boe-modelo-232-2017-form",
]
[revisions."2016-2017".family_dispositions.verification_predicates]
reason = """
A verification predicate guards a CALCULATED result -- characteristically that a positive economic input did not resolve to a zero base or cuota. Modelo 232 calculates nothing: it declares calculation_class = 'informative', its formulas family is already dispositioned inapplicable on this revision, and none of its 53 casillas is computed or carries a base or cuota. It reports the existence and amount of operations with vinculadas and with paraisos fiscales so AEAT can select for transfer-pricing \
review; the tax consequence is settled on the declarant's own modelo 200. There is no computed result here for an implication to constrain."""
legal_refs = ["ley-27-2014:art-18", "rd-634-2015:art-13", "orden-hfp-816-2017:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-232-2016", "aeat-modelo-232-procedure", "boe-modelo-232-2017-form"]

[revisions."2016-2017".family_dispositions.dependency_classifications]
reason = """
A dependency classification declares which OTHER modelo's filing a value here derives from, and modelo 232 derives from none. It reports the declarant's own operaciones vinculadas and paraiso-fiscal operations, read from its own accounts rather than folded in from another return. The relationship with modelo 200 runs the other way and is not a fold-in either: 200 settles the Impuesto sobre Sociedades in which those operations are valued, while 232 reports their existence separately for selection \
purposes, and neither takes its figures from the other. Inapplicable by this modelo's position rather than merely unpopulated."""
legal_refs = ["ley-27-2014:art-18", "rd-634-2015:art-13", "orden-hfp-816-2017:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-232-2016", "aeat-modelo-232-procedure", "boe-modelo-232-2017-form"]

[revisions."2016-2017".family_dispositions.projection_endpoints]
reason = """
A projection endpoint's projection_ref accepts only FilingProjectionRef, a CLOSED discriminated union in cadrumo.core whose seven members are every one an m303_ engine-computed IVA fact, so no declaration naming this modelo's rows can validate against it and the family is empty by construction. Modelo 232 is an Impuesto sobre Sociedades informative return and shares no surface with the m303 IVA projections at all. Its repetition -- one row per vinculada operation and per paraiso operation -- is \
served by the other mechanism: those detail rows materialise from BINDING values, which is what an authored ExportRecordDefinition expresses with repeat == 'binding_rows'."""
legal_refs = ["ley-27-2014:art-18", "rd-634-2015:art-13", "orden-hfp-816-2017:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-232-2016", "aeat-modelo-232-procedure", "boe-modelo-232-2017-form"]
