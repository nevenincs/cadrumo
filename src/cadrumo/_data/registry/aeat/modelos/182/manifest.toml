reason = "Approved by Orden EHA/3021/2007 art. 1, which carries no year bound; filing years below 2024 existed in law and are not yet authored. Edition 2024 was authored 2026-09-12 at applicability grade on aeat-dr-182-2024, whose declared window is exactly that ejercicio. 2022 and 2023 are ACQUIRABLE, not merely ungraded: no registered layout authority covers them, since the only source spanning those years is the procedure excerpt of the orden, which carries arts. 1 and 5 and no anexo."
