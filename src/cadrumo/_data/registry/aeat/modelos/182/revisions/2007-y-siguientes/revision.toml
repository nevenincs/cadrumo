[revisions."2007-y-siguientes"]
# Applicability grade: the donativos declaration is filed by the entity RECEIVING the
# donation, not by the donor claiming the deduction, so this application's taxpayer is
# the subject of the declaration rather than its filer.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-eha-3021-2007:art-1's legal.effective_from.
valid_from = 2007-01-01
period_selector = { year_from = 2007, periods = ["0A"] }
legal_refs = [
    "orden-eha-3021-2007:art-1",
    "orden-eha-3021-2007:art-5",
    "ley-35-2006:art-68.3",
    "ley-58-2003:art-93",
]
orden_aplicabilidad = [
    "orden-eha-3021-2007:art-1",
]
source_refs = [
    "enrolled-modelo-182-procedure",
    "enrolled-modelo-182-layout",
    "aeat-dr-182-2024",
    "aeat-dr-182-2025",
]
