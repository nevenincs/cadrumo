[revisions."2025"]
binding_source_refs = ["enrolled-modelo-182-procedure"]
casilla_source_refs = ["enrolled-modelo-182-procedure"]
authority_grade = "applicability"
# valid_to is open. Orden HAC/1430/2025 disposicion final unica reads, verbatim
# in the bundled corpus, "sera aplicable, POR PRIMERA VEZ, a las declaraciones
# informativas correspondientes al ejercicio 2025 para los modelos 199, 182,
# 193, 184, 282, 289 y 345 [...] que se deban presentar a partir del 1 de enero
# de 2026" -- "por primera vez" opens a window that runs until an orden amends
# it, not one that shuts at the ejercicio it names. The approving Orden
# EHA/3021/2007 art. 1 carries no ejercicio bound, and its art. 5 sets the plazo
# "en el mes de enero de cada ano". AEAT's current disenos-de-registro page for
# modelos 100-199 (read 2026-09-12) still lists "182 - Orden EHA/3021/2007
# (actualizado por Orden HAC/1430/2025, de 3 de diciembre)" and publishes NO
# ejercicio 2026 design. A closed 2025-12-31 with no successor therefore refused
# ejercicio 2026 under an authority no orden has withdrawn; that was an
# authoring defect, not a scope declaration.
valid_from = 2025-01-01
period_selector = { year_from = 2025, periods = ["0A"] }
legal_refs = [
    "orden-eha-3021-2007:art-1",
    "orden-eha-3021-2007:art-5",
    "ley-35-2006:art-68.3",
    "ley-58-2003:art-93",
    "orden-hac-1430-2025:art-2",
    "orden-hac-1430-2025:df-unica",
]
# The open-ended claim rests on both: art. 1 approves modelo 182 with no
# ejercicio bound, and the HAC/1430/2025 disposicion final unica is the
# "por primera vez" provision that starts this era at ejercicio 2025.
orden_aplicabilidad = [
    "orden-eha-3021-2007:art-1",
    "orden-hac-1430-2025:df-unica",
]
source_refs = [
    "enrolled-modelo-182-procedure",
    "enrolled-modelo-182-layout",
    "aeat-dr-182-2025",
]
review_status = "agent_reviewed"
