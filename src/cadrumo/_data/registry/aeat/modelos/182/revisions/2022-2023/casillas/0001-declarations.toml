# Casillas read from the ejercicio 2021 design as amended by Orden HFP/1351/2021,
# source aeat-dr-182-2021-2023. The printed sheets carry no box numbers, so
# `number` is a stable slug, as in the 2024 and 2025 editions. The record
# positions each slug stands for: EJERCICIO tipo 1 5-8; N.I.F. DEL DECLARADO
# tipo 2 18-26; APELLIDOS Y NOMBRE O RAZON SOCIAL DEL DECLARADO tipo 2 36-75;
# % DE DEDUCCION tipo 2 79-83; IMPORTE tipo 2 84-96; RECURRENCIA DONATIVOS
# tipo 2 132.

