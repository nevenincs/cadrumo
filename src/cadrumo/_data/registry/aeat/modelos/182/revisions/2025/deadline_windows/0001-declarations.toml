# Filing year 2026, the second year this open-ended era answers for. Both dates
# are the NOMINAL statutory ones from orden-eha-3021-2007 art. 5, "se realizara
# en el mes de enero de cada ano" -- a recurring plazo that needs no fresh orden
# per ejercicio. 2027-01-31 is a Sunday and is stored UNSHIFTED: shift_deadline
# derives the operational date with its reason, and pre-shifting here would
# destroy the statutory date and report no shift occurred.
