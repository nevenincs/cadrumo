# tipo2.donante-nombre ("Apellidos y nombre, o razón social, del donante") is a
# required=false free-text informative field (data_type = name). It is NOT part
# of the calculation closure: the modelo-182-informative-summary-verification
# extraction-fidelity expectation reconciles only the six required coded/numeric
# donor casillas (nif, importe, porcentaje, recurrencia + the two declarante
# fields) and deliberately omits the optional free-text name. The completeness
# manifest must equal the calculation closure (Case A stale-manifest, mirroring
# the M100 2021 previsión-social drop in a971f497dd), so the name field is not
# enumerated here. It remains a declared, filed casilla — just not a closure
# member.

