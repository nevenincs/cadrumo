# Applicability-grade historical epoch for modelo 182, ejercicio 2024, presented
# in enero 2025.
#
# The gap this closes was authoring debt, not a legal absence: modelo 182 was
# approved by Orden EHA/3021/2007 art. 1 with no ejercicio bound, art. 5 sets a
# recurring plazo "en el mes de enero de cada año", and AEAT publishes a diseño
# de registro per ejercicio. The design governing ejercicio 2024 is bundled and
# hash-pinned as aeat-dr-182-2024 (sha256
# 6ed486256193f31e81d19b3f464ee15fbdeaa9251ec825349b3263ced5ff381f), whose own
# catalogue window is applies_from 2024-01-01, applies_to 2024-12-31 -- exactly
# this edition's life.
#
# GEOMETRY, established by measurement rather than assumed. Every position line
# of the bundled ejercicio 2024 design was compared against the bundled
# ejercicio 2025 design (aeat-dr-182-2025) and the two sets are IDENTICAL: same
# fields, same positions, same widths, same record ends. Registro de tipo 1
# closes "161-237 ------------ BLANCOS" then "238-250 Alfanumérico SELLO
# ELECTRONICO."; registro de tipo 2 closes "182-250 -------- BLANCOS." Both
# records are 250 bytes in both epochs. The 7 casillas this edition models are
# therefore the same boxes at the same positions its 2025 sibling models, and
# none of them moved.
#
# WHAT DID CHANGE between the two epochs is the MEANING of one field, not its
# place. RECURRENCIA DONATIVOS at position 132 of the tipo 2 record is the field
# Orden HAC/1430/2025 art. 2 amended. The ejercicio 2024 design states the
# clave "1" test as donations "en favor de dicha entidad por importe igual o
# superior, en cada uno de ellos, al del ejercicio anterior"; the ejercicio 2025
# design restates it as "en favor de una misma entidad, por un importe en este
# ejercicio y el del periodo impositivo anterior, igual o superior, en cada uno
# de ellos, al del ejercicio inmediato anterior". Same box, same width, changed
# legal test. This edition carries the 2024 test and does NOT cite
# orden-hac-1430-2025, whose disposición final única applies its modelo 182
# amendment "por primera vez" to ejercicio 2025 and therefore does not reach
# this year.
#
# Why the grade is 'applicability' and NOT 'filing': the calculation surface of
# this modelo -- the five donativo_donor row bindings and the construct that
# gathers them -- is grounded in the corpus only by enrolled-modelo-182-procedure,
# a 1355-byte excerpt of Orden EHA/3021/2007 carrying arts. 1 and 5 and no anexo
# at all. That excerpt names the modelo; it does not instruct a filing.
#
# The casillas, bindings, construct and filing schedule are stated once on the
# 2022-2023 edition, whose design (aeat-dr-182-2021-2023) prints every one of
# these fields at the same position, and this edition stores its payload against
# it. Their grounding does not change between the ejercicios: the bindings cite
# the same Orden EHA/3021/2007 excerpt, whose window opens in 2007 and never
# closes, and every record field they carry sits at the same position in the
# 2021, 2024 and 2025 designs (tipo 2 18-26 N.I.F. DEL DECLARADO, 36-75
# APELLIDOS Y NOMBRE, 79-83 % DE DEDUCCION, 84-96 IMPORTE, 132 RECURRENCIA
# DONATIVOS). The recurrencia binding carries the donor row's own flag and cites
# no year-specific test, so the amended clave test is keyed on the casilla, not
# on the binding. What this edition keys is its own design and deadline window;
# what stays on 2025 is what 2025 alone claims: its verification expectation,
# its workbook pin and its completeness manifest. No formulas, export layout,
# completeness manifest or verification expectations are declared here, and the
# 7 casillas are input_kind 'manual' or 'informational' with no binding
# reference left dangling.
#
# ACQUIRABLE DEBT -- promoting this edition to filing grade needs ONE
# acquisition: AEAT's modelo 182 instrucciones or procedure page as it stood for
# ejercicio 2024, registered as its own source with a window covering 2024. The
# record geometry above is already grounded verbatim and would not change.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
legal_refs = [
    "orden-eha-3021-2007:art-1",
    "orden-eha-3021-2007:art-5",
    "ley-35-2006:art-68.3",
    "ley-58-2003:art-93",
]
orden_aplicabilidad = ["orden-eha-3021-2007:art-1"]
source_refs = [
    "aeat-dr-182-2024",
    "enrolled-modelo-182-procedure",
    "enrolled-modelo-182-layout",
]
family_storage_baseline = "2022-2023"
review_status = "agent_reviewed"
reviewed_by = """\
agent: re-review on 2026-10-01 of the ejercicio 2024 edition after its payload moved to \
the 2022-2023 edition it now stores against. SCOPE -- this pass checks what that move \
changed; the 2026-09-30 review's design comparison against aeat-dr-182-2025 is not \
repeated. VERIFIED -- STORAGE: the converter's equivalence check passed on the move, so \
the 7 casillas, the five donativo_donor row bindings, the informative construct and the \
filing schedule hydrate here as they did when stated on this edition; what this edition \
keys is its own design aeat-dr-182-2024, its deadline window modelo-182-2024-0a (enero \
2025, Orden EHA/3021/2007 art. 5) and the construct's design and window. VERIFIED -- \
DESIGN: the tipo 2 fields the bindings carry, 18-26, 36-75, 79-83, 84-96 and 132, are \
printed at lines 208, 271, 371, 408 and 548 of both \
03-182-orden-eha-3021-2007-actualizado-por-orden-hfp-1351-2021-de-1-de-diciembre.pdf.extracted.md \
and 02-182-ejercicio-2024.pdf.extracted.md; aeat-dr-182-2021-2023 is cited by the \
2022-2023 edition only, not here. VERIFIED -- every legal and source reference the \
hydrated edition cites has a window covering ejercicio 2024, and its declared-grade \
snapshot validates. NOT CLAIMED -- the recurrencia binding carries the donor row's own \
flag and no year-specific clave test. NOT CLAIMED -- no formulas, export layout, \
completeness manifest or verification expectation are declared, and the grade stays \
applicability. NOT CLAIMED -- no independent AEAT oracle checked any value. No human \
operator has countersigned this."""
