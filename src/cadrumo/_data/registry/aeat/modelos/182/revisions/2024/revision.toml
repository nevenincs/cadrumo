# Applicability-grade historical epoch for modelo 182, ejercicio 2024, presented
# in enero 2025.
#
# The gap this closes was authoring debt, not a legal absence: modelo 182 was
# approved by Orden EHA/3021/2007 art. 1 with no ejercicio bound, art. 5 sets a
# recurring plazo "en el mes de enero de cada año", and AEAT publishes a diseño
# de registro per ejercicio. The design governing ejercicio 2024 is bundled and
# hash-pinned as aeat-dr-182-2024 (sha256
# 6ed486256193f31e81d19b3f464ee15fbdeaa9251ec825349b3263ced5ff381f), whose own
# catalogue window is applies_from 2024-01-01, applies_to 2024-12-31 -- exactly
# this edition's life.
#
# GEOMETRY, established by measurement rather than assumed. Every position line
# of the bundled ejercicio 2024 design was compared against the bundled
# ejercicio 2025 design (aeat-dr-182-2025) and the two sets are IDENTICAL: same
# fields, same positions, same widths, same record ends. Registro de tipo 1
# closes "161-237 ------------ BLANCOS" then "238-250 Alfanumérico SELLO
# ELECTRONICO."; registro de tipo 2 closes "182-250 -------- BLANCOS." Both
# records are 250 bytes in both epochs. The 7 casillas this edition models are
# therefore the same boxes at the same positions its 2025 sibling models, and
# none of them moved.
#
# WHAT DID CHANGE between the two epochs is the MEANING of one field, not its
# place. RECURRENCIA DONATIVOS at position 132 of the tipo 2 record is the field
# Orden HAC/1430/2025 art. 2 amended. The ejercicio 2024 design states the
# clave "1" test as donations "en favor de dicha entidad por importe igual o
# superior, en cada uno de ellos, al del ejercicio anterior"; the ejercicio 2025
# design restates it as "en favor de una misma entidad, por un importe en este
# ejercicio y el del periodo impositivo anterior, igual o superior, en cada uno
# de ellos, al del ejercicio inmediato anterior". Same box, same width, changed
# legal test. This edition carries the 2024 test and does NOT cite
# orden-hac-1430-2025, whose disposición final única applies its modelo 182
# amendment "por primera vez" to ejercicio 2025 and therefore does not reach
# this year.
#
# Why the grade is 'applicability' and NOT 'filing': the calculation surface of
# this modelo -- the five donativo_donor row bindings and the construct that
# gathers them -- is grounded in the corpus only by enrolled-modelo-182-procedure,
# a 1355-byte excerpt of Orden EHA/3021/2007 carrying arts. 1 and 5 and no anexo
# at all. That excerpt names the modelo; it does not instruct a filing.
#
# The bindings and the construct are nevertheless stated HERE, once, and the
# 2025 edition inherits them. Their grounding does not change between the two
# ejercicios: the bindings cite the same Orden EHA/3021/2007 excerpt, whose
# window opens in 2007 and never closes, and every record field they carry sits
# at the same position in both designs (tipo 2 18-26 N.I.F. DEL DECLARADO, 36-75
# APELLIDOS Y NOMBRE, 79-83 % DE DEDUCCION, 84-96 IMPORTE, 132 RECURRENCIA
# DONATIVOS; lines 208, 271, 371, 408 and 548 of both extracted designs).
# Stating them on 2025 alone left ejercicio 2024 without a surface the law and
# the design already gave it. The recurrencia binding carries the donor row's
# own flag and cites no year-specific test, so the amended clave test is keyed
# on the casilla, not on the binding. What stays on 2025 is what 2025 alone
# claims: its verification expectation, its workbook pin and its completeness
# manifest. This edition declares no formulas, export layout, completeness
# manifest or verification expectations, and its 7 casillas are input_kind
# 'manual' or 'informational' with no binding reference left dangling.
#
# ACQUIRABLE DEBT -- promoting this edition to filing grade needs ONE
# acquisition: AEAT's modelo 182 instrucciones or procedure page as it stood for
# ejercicio 2024, registered as its own source with a window covering 2024. The
# record geometry above is already grounded verbatim and would not change.
