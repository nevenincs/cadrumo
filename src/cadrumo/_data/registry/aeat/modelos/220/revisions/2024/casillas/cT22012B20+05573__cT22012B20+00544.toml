# Modelo 220 RECORD T22012B20 -- deducciones por doble imposicion: interna bajo el
# RDLEG 4/2004, interna bajo la DT 23a LIS, internacional bajo el RDLEG 4/2004,
# internacional bajo la LIS.
#
# 185 casillas, EVERY ONE carrying a real AEAT box number. The record is a numbered
# grid: each money cell is a 17-position amount at the intersection of a deduction
# family, a generation scope and a settlement column, and AEAT numbers every cell
# separately. There is no repetition to collapse and no field without a number.
#
# AEAT REUSES BOX NUMBERS ACROSS RECORDS, so this modelo is MULTI-SEGMENT. Number 00285
# is a different declared cell in T22012B20 than it is in T22012000, T22012B00, T22012B10, T22012A01, T22012A11, and the two records
# share many such numbers. Every casilla here therefore declares `segmento` and takes the
# `<SEGMENTO>:<number>` id shape, which is the convention modelo 200 -- the other
# multi-record Sociedades declaration -- already established. Both halves of the id are
# TRANSCRIBED from AEAT: its record name and its box number. Nothing is derived.
#
# THAT SHAPE REPLACED A DERIVED ONE, and the reason is worth keeping. The first version
# of these fragments minted ids from a four-axis decomposition of the field descriptions
# (family, group, scope, column). It survived three checks -- nothing unresolved, no
# duplicate key within a record, no duplicate key across records once a record segment
# was added -- and each check caught a real defect: a missing group axis collided
# nineteen numbers, a missing "Total periodos anteriores" scope collided four more and
# mislabelled five. But the loader then refused the result, because the modelo needs
# `segmento` regardless, and an established convention already existed for exactly this.
# A derived id that passes every check you thought of is still worse than a transcribed
# one, and re-implementing a convention the registry already has is a defect in itself.
#
# THE DECOMPOSITION SURVIVES WHERE IT IS ACTUALLY NEEDED: the casilla LABELS. Those must
# say what a cell means in four languages, and are composed from the four checked axes
# rather than from free text, so a label can only be wrong if one of four small
# vocabularies is wrong.
#
# WHAT THE SEGMENTO DOES *NOT* ASSERT: the design gives NO textual distinction between
# these grids beyond the record each sits in. Nothing in the field descriptions says what
# "B00" scopes differently from "000", so the segmento records AEAT's own record
# identifier and claims nothing more.
#
# AEAT MISSPELLS ITS OWN SECTION HEADING FOUR WAYS across these records -- "RDLEG
# 4/2004", "RDLEG4/2004", "RDL 4/2004", "RDLRG 4/2004" -- and truncates column labels
# ("licado en esta liquidacion"). All are matched deliberately so the decomposition
# reflects what the design says; the casilla labels use the corrected form, because a
# label is read by an operator while the match is read against AEAT.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22012B20 tiles
# 1..3204 exactly once with NO gap and NO PARTIAL OVERLAP, both checked, and every
# number, offset, length and type below was read from its own field description.
#
# NOT MODELLED, deliberately: the modelo and pagina identifier envelope, the
# pagina-complementaria mechanics, the "RESERVADO PARA LA ADMINISTRACION" run and the
# end-of-record marker. None is filer-supplied.
#
# NOT CLAIMED: these casillas DECLARE the deduction grid; none of them computes it. No
# formula, construct or binding is attached, so nothing reconciles a carried-forward
# deduction against the amount applied. The revision carries no export layout.

