# Modelo 220 RECORD T22005A01 -- ESTADO DE INGRESOS Y GASTOS RECONOCIDOS CONSOLIDADO EN
# EL EJERCICIO, the entidades de credito variant: the resultado consolidado, the otro
# resultado global split into elements that will not be reclassified and elements that may
# be, and the resultado global total attributed to minority interests and to the owners of
# the dominante.
#
# 43 casillas describe all 53 design fields -- 43 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position. Every box carries AEAT's own five-digit
# number, so not one number here is minted.
#
# 19 OF THESE 43 BOXES SHARE THEIR PRINTED TEXT WITH A SIBLING, and NO
# HIERARCHY IS INVENTED TO SEPARATE THEM:
#   x6  Otras reclasificaciones
#        boxes 00284, 00288, 00293, 00655, 00659, 00301
#   x6  Transferido a resultados
#        boxes 00283, 00287, 00291, 00654, 00658, 00300
#   x5  Ganancias o (-) pérdidas de valor contabilizadas en el patrimonio neto
#        boxes 00282, 00290, 00653, 00657, 00299
#   x2  Activos no corrientes y grupos enajenables de elementos mantenidos para la venta
#        boxes 00276, 00298
# On the printed modelo these are indented under different parents. THE DISENO DE REGISTRO
# DOES NOT CARRY THAT INDENTATION -- no level column, no validation, no components, only
# flat description text, checked on the extracted fields themselves.
#
# AN ADJACENCY RULE WAS TRIED AND REFUSED. Taking the parent to be the nearest preceding
# non-repeated line looks right and is wrong in at least four places, each verified against
# this design:
#   [00276] would take [00275] as parent; it is a SIBLING of [00275] under [00274].
#   [00287] and [00288] would take [00286] as parent; [00286] is itself a child of [00285].
#   [00292] would be read as a parent of [00293]; both are siblings under [00289].
#   [00298] to [00301] would all hang off [00656]; [00298] is itself a parent of the rest.
# The rule was discarded on that evidence rather than shipped because it mostly agreed.
#
# SHARING A LABEL IS ESTABLISHED PRACTICE IN THIS REGISTRY, not a defect introduced here:
# modelo 200 carries 96 label texts used by more than one casilla (one of them 20 times)
# and modelo 100 carries 198. The box number is the disambiguator this data supports, and
# it is what an operator sees beside the label.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22005A01 tiles
# 1..908 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT PRINTS 'calorados a valor razonable'; the label reads 'valorados a valor razonable'. Corrected by name, never by a general rule.
#

# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @747+150 RESERVADO PARA LA ADMINISTRACION; and
# @897+12 Fin de registro.
#
# NOT CLAIMED: [00273] otro resultado global, [00274] and [00280] its two halves, and
# [00303] the resultado global total are AGGREGATES of the lines around them, and NO
# formula, construct or binding expresses that. Every box is a manual input.

