# Modelo 220 RECORD T22003C02 -- BALANCE CONSOLIDADO, PASIVO, in the shape used by entidades aseguradoras:
# debitos y partidas a pagar with its long breakdown, the provisiones
# tecnicas and no tecnicas, pasivos fiscales, resto de pasivos, and the
# closing TOTAL PASIVO.
#
# 48 casillas describe all 58 design fields -- 48 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 48 of this record's numbers carry AEAT's own printed box number (48 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# THE NESTING REACHES THREE LEVELS AND AEAT PRINTS EVERY LEVEL INLINE:
# "Debitos y partidas a pagar. Otras deudas. Entidades asociadas" [00703], and
# "Provisiones tecnicas. Provision de seguros de vida. Provision matematica"
# [00188]. The label composition takes the LONGEST attested prefix as the
# parent, which resolves the depth without a rule about how deep the tree goes.
#
# TWO SUFFIXES APPEAR UNDER TWO DIFFERENT PARENTS IN THIS ONE RECORD:
# "Provision para primas no consumidas" at [00183] under provisiones tecnicas
# and at [00186] under provision de seguros de vida, and "Provision para riesgos
# en curso" at [00184] and [00187] the same way. They are DIFFERENT boxes and
# the composed labels separate them; translating the suffix once is what keeps
# the two readings identical where AEAT prints them identically.
#
# THE SECTOR ATTRIBUTION IN THE SECTION SLUG IS INFERRED, as on T22003A02: AEAT
# heads this record "PASIVO" and names no sector. The operator label carries
# AEAT's own page identifier instead, which is data.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 1
# rejoin(s) applied to this record, 1 distinct:
#   'benefi cios' -> 'beneficios', attested 292 time(s) elsewhere in the design
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22003C02 tiles
# 1..993 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 03, letra C, hoja 02. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @832+150 RESERVADO PARA LA ADMINISTRACION; and
# @982+12 Fin de registro.
#
# NOT CLAIMED: THIS BALANCE SHEET DOES NOT BALANCE HERE. Every subtotal and the TOTAL are
# DECLARED, not computed: no formula, construct or binding sums a group into its head or
# the heads into the total, and nothing checks activo against patrimonio neto plus pasivo.
# Every box is a manual input.

