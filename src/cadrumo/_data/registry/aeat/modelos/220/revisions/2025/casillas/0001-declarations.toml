continuidad_evidence = "aeat-dr-220-2024, T22007000, termina el segundo tramo en 829 y reserva 830-979 para la Administracion. aeat-dr-220-2025 introduce el campo 59 (regimen de entidades navieras en funcion del tonelaje, base) dentro de la ampliacion 832-900, bajo las notas 2 (tonelaje, no cooperativas) y 3 (resultados extracooperativos de grupos cooperativos). El anterior diseno no declara estos campos separados: se sustituye reserva, no se hereda un concepto por posicion."
