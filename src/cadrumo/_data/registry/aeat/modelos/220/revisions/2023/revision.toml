# Modelo 220, declaracion del Impuesto sobre Sociedades de los grupos fiscales en
# regimen de consolidacion fiscal, for periodos impositivos iniciados en 2023.
#
# APPROVAL. Orden HAC/495/2024 (BOE-A-2024-10574, BOE de 27 de mayo de 2024) art. 1.1.a).2.o approves
# "Modelo 220: Declaracion del Impuesto sobre Sociedades-Regimen de consolidacion
# fiscal correspondiente a los grupos fiscales, que figura en el anexo II" for the
# periodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2023;
# art. 1.3 applies it to the grupos fiscales of capitulo VI del titulo VII LIS. Art.
# 6.3 sets its plazo, the representante's individual plazo under LIS art. 75.2, and
# art. 3.2 the domiciliacion window.
#
# DESIGN. aeat-dr-220-2023 is AEAT's own diseno de registro for ejercicio 2023. It
# differs from the 2024 design, so this edition is authored from it rather than
# projected from the later one: 1761 casillas are declared where this design
# prints them and 258 rows of the 2024 edition are left undeclared as debt
# (see casillas/0001-declarations.toml).
#
# Grade: applicability, the 2024 edition's. No formula, construct relation or
# binding computes or checks these casillas and there is no export layout, so
# the modelo is not filed for this year.
