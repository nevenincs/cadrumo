# Modelo 220 RECORD T22004B02 -- CUENTA TECNICA DEL SEGURO NO VIDA, gastos del
# inmovilizado material y de las inversiones, in the shape used by
# entidades aseguradoras: gastos
# de gestion de las inversiones, correcciones de valor, perdidas
# procedentes del inmovilizado, the consolidation lines, and the
# closing subtotal (resultado de la cuenta tecnica del seguro no vida).
#
# 16 casillas describe all 26 design fields -- 16 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 16 of this record's numbers carry AEAT's own printed box number (16 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# THE SECTOR ATTRIBUTION IN THE SECTION SLUG IS THE DESIGN'S OWN, not an inference.
# Unlike the balance-sheet pages of this modelo -- where AEAT heads both the general and
# the aseguradoras record "ACTIVO" and the sector had to be read off the line
# vocabulary -- every numbered line here is headed "CUENTA TECNICA SEGURO NO VIDA" by
# AEAT itself. The heading is derived from that text, as everywhere else.
#
# FOUR OF THE SIXTEEN BOXES ARE GROUP HEADS THAT ALSO CARRY A VALUE: [00277] gastos del
# inmovilizado, [00278] gastos de gestion de las inversiones, [00281] correcciones de
# valor and [00285] perdidas procedentes. Each is an attested standalone line of this
# record AND the prefix of the lines under it, which is exactly the condition the
# parent-child separator repair requires. Nothing here decides whether a head is the sum
# of its children or an independent figure -- the design does not say, and no formula
# assumes either way.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 1 parent-child separator
# repair(s) applied to this record:
#   after 'Gastos del inmovilizado material y de las inversiones'
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 2
# rejoin(s) applied to this record, 1 distinct:
#   'fi nancieras' -> 'financieras', attested 22 time(s) elsewhere in the design
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22004B02 tiles
# 1..449 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 04, letra B, hoja 02. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @288+150 RESERVADO PARA LA ADMINISTRACION; and
# @438+12 Fin de registro.
#
# NOT CLAIMED: THIS SUBTOTAL IS NOT COMPUTED. [00288] closes the cuenta tecnica del
# seguro no vida, and the four group heads above it close their own groups; NO formula,
# construct or binding sums a group into its head or the heads into the subtotal, and
# nothing carries this subtotal into the cuenta no tecnica or the consolidated result.
# Every box is a manual input.

