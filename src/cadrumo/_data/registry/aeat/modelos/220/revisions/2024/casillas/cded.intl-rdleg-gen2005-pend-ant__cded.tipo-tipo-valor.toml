# Modelo 220 RECORD T22012000, continued -- deducciones por doble imposicion
# INTERNACIONAL: bajo el RDLEG 4/2004 y bajo la LIS, y el tipo de gravamen del
# ejercicio.
#
# Second half of the record, split from the first only to stay within the registry
# reviewability line budget. The two files share one design, one grounding and one set
# of caveats, recorded in full in the sibling fragment whose stem begins
# "cded.int-rdleg-gen2008-pend-ant".
#
# THE CAVEATS THAT BEAR ON THIS HALF, restated rather than cross-referenced because
# they govern casillas declared here:
#
#   * EVERY casilla carries a real AEAT box number. The record is a numbered grid and
#     no cell is unnumbered, so there are no slugs anywhere in either file.
#   * THE IDS ARE DERIVED FROM A CHECKED DECOMPOSITION, not a guess: family, group,
#     scope and column, all closed vocabularies, with nothing unresolved across the
#     180 descriptions and NO duplicate key. The group axis exists because a
#     three-axis attempt collided on nineteen numbers, and every collision was in
#     THIS half -- the "DI internacional periodos anteriores", "DI juridica (art. 31
#     LIS)", "DI economica (art. 32 LIS)" and "Total 2024" groups all print otherwise
#     identical column labels.
#   * AEAT truncates a column label twice in this half, printing "licado en esta
#     liquidacion" for "Aplicado en esta liquidacion". The truncation is matched
#     deliberately so the decomposition reflects the design; the casilla label uses
#     the corrected form.
#
# The tipo de gravamen at @3059+6 is the record's only non-money cell and is typed
# `ratio`.
#
# Grounded in aeat-dr-220-2024. T22012000 tiles 1..3226 exactly once with no gap and
# no partial overlap, and every number, offset, length and type was read from its own
# field description.
#
# NOT MODELLED here: the "RESERVADO PARA LA ADMINISTRACION" run at @3065+150 and the
# end-of-record marker at @3215+12.

