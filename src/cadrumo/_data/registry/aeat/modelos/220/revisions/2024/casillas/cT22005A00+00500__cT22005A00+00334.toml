# Modelo 220 RECORD T22005A00 -- ESTADO DE INGRESOS Y GASTOS CONSOLIDADOS RECONOCIDOS:
# the resultado consolidado del ejercicio, the ingresos y gastos imputados directamente en
# el patrimonio neto consolidado, the transferencias a la cuenta de perdidas y ganancias
# consolidada, and the three closing totals.
#
# 21 casillas describe all 31 design fields -- 21 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position. Every box carries AEAT's own five-digit
# number, so not one number here is minted. This is a FLAT record: no repeating block.
#
# THE SECTION IS DERIVED FROM THE ALL-CAPS HEADING AEAT PRINTS ON EACH LINE, and the
# headings found are asserted to be exactly the 4 this fragment knows. The
# resultado consolidado line carries no heading at all and is filed under its own section
# rather than inheriting a neighbour's.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY. AEAT emits U+FB01 307
# times and U+FB02 twice across this design, and 29 of those are followed by a SPACE that
# splits the word. THIS RECORD CARRIES ALL THREE FORMS OF ONE WORD: "instrumentos
# U+FB01 nancieros" at @33, "instrumentos U+FB01nancieros" at @50, and plain "Activos
# financieros" in the same line at @50. Expanding the codepoint alone would leave
# "fi nancieros" in an operator label. A split is therefore rejoined ONLY when the joined
# token already appears as a whole word elsewhere in this design -- evidence from AEAT's
# own text, not a guess about where a word breaks. 3 rejoin(s) applied here:
#   'fi nancieros' -> 'financieros', attested 615 time(s) elsewhere in the design
#   'fl ujos' -> 'flujos', attested 7 time(s) elsewhere in the design
#
# NUMBERS 00343 AND 00352 ARE ABSENT from this record's otherwise consecutive runs
# (00336..00345 skips 00343, 00346..00354 skips 00352). Recorded because a reader checking
# for a contiguous range would conclude two boxes were dropped in transcription. They are
# not in this sheet at all.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22005A00 tiles
# 1..534 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @373+150 RESERVADO PARA LA ADMINISTRACION; and
# @523+12 Fin de registro.
#
# NOT CLAIMED: the three totals are DECLARED, not computed. AEAT's own structure says
# [00345] sums its section, [00354] sums its section, and [00355] is the consolidated
# total split between the sociedad dominante and the socios externos -- and NO formula,
# construct or binding expresses any of that here.

