# Modelo 220 RECORD T22007000 -- BASE IMPONIBLE Y CUOTA INTEGRA DEL GRUPO: the suma de bases imponibles
# individuales, the corrections for diferimiento de resultados internos and
# the otras correcciones that pages 7C to 7H detail, then the base imponible
# del grupo, the reservas de capitalizacion y nivelacion, the compensacion de
# bases imponibles negativas, and the cooperativas track down to the cuota
# integra del grupo.
#
# 50 casillas describe all 60 design fields -- 50 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# 46 of this record's 50 numbers carry AEAT's own printed box number (46 are 5-digit).
# The remaining 4 name a field AEAT numbers NOWHERE and take modelo 181's
# sheet-qualified byte span, which is not minted either: the span names a field the
# design declares at exactly that offset and length.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# FOUR FIELDS HERE CARRY NO NUMBER AT ALL and are authored anyway: @786 and @808
# "Tramo base imponible" 1 and 2, @803 and @825 "Tramo de tipo de gravamen" 1
# and 2. They are taxpayer values, not envelope mechanics, so treating
# "unnumbered" as "excludable" would have dropped four real filing fields. They
# take modelo 181's sheet-qualified byte span, which names a field the design
# declares at exactly that offset and length and mints nothing.
#
# THIS RECORD IS THE HEAD THAT THE 7C TO 7H DETAIL PAGES FEED. Its own text says
# so -- "(Pag. 7D)", "(Pag. 7E)", "(Pag. 7G)", "(Pag. 7H)" -- and four of those
# detail records are already authored in this revision as T22007D00, E00, G00 and
# H00. THE REFERENCES ARE PROSE IN A LABEL: nothing carries a value from a detail
# total into the box that cites it, and no construct relates them.
#
# [00562] CUOTA INTEGRA DEL GRUPO IS DECLARED HERE FOR THE THIRD TIME in this
# revision, after T22009000 and T220DID00. One AEAT box, three records, three
# casillas under the segmento convention. A layout MUST bind them to the same
# value rather than collect them three times, and nothing enforces that.
#
# TWO LINES OPEN WITH A STRAY ":-" -- [00553] and [00554] read ":- Grupos de
# Cooperativas: ...". Transcribed as printed.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 1
# rejoin(s) applied to this record, 1 distinct:
#   'fi scal' -> 'fiscal', attested 657 time(s) elsewhere in the design
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22007000 tiles
# 1..991 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 07, letra 0, hoja 00. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @830+150 RESERVADO PARA LA ADMINISTRACION; and
# @980+12 Fin de registro.
#
# NOT CLAIMED: THIS SETTLEMENT CHAIN IS NOT COMPUTED. It runs from the suma de bases
# imponibles individuales through the correcciones, the reservas and the compensacion de
# bases negativas to the cuota integra del grupo, and EVERY STEP IS A MANUAL INPUT: no
# formula, construct or binding relates any box here to the one before it, nor to the
# detail records on pages 7C to 7H whose totals its own labels cite.

