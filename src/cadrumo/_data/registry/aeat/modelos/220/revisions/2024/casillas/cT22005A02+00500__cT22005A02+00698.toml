# Modelo 220 RECORD T22005A02 -- ESTADO DE INGRESOS Y GASTOS RECONOCIDOS CONSOLIDADO EN
# EL EJERCICIO: the resultado consolidado, the otros ingresos y gastos reconocidos broken
# down by concept with the valuation, transfer and reclassification lines of each, the
# impuesto sobre beneficios, and the total attributed to the entidad dominante and to
# socios externos.
#
# THE SECTOR ATTRIBUTION IS INFERRED AND IS MARKED AS SUCH. AEAT PRINTS THE SAME HEADING
# ON THIS RECORD AND ON T22005A01 and names no sector on either. The section slug here
# says "aseguradoras" and its sibling's says "credito" because this record's vocabulary is
# that of the insurance accounting plan ("correccion de asimetrias contables") and the
# sibling's is that of the credit-institution one ("instrumentos de deuda a valor
# razonable con cambios en otro resultado global", "riesgo de credito"). That reading is
# NOT stated by the design. The operator-facing labels therefore keep AEAT's heading
# unchanged and claim no sector at all.
#
# 37 casillas describe all 47 design fields -- 37 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position. Every box carries AEAT's own five-digit
# number, so not one number here is minted.
#
# THIS RECORD PRINTS ITS OWN HIERARCHY AND ITS SIBLING DOES NOT. Every child line here
# carries its parent's name inline, so all 37 labels are distinct on AEAT's own text
# and nothing is inferred from position. Its sibling T22005A01 was
# authored FLAT for exactly the opposite reason: there nineteen boxes share their printed
# text and the design carries no indentation, so a positional derivation was tried and
# refused. The difference between the two records is in the data, not in the treatment.
#
# AEAT IS INCONSISTENT ABOUT THE PARENT-CHILD SEPARATOR, in three ways inside one group:
# a period and a space in most lines, a BARE SPACE at @84 and @101, and NOTHING AT ALL at
# @67 -- "Activos financieros disponibles para la ventaGanancias y perdidas por valoracion".
# A separator is inserted ONLY where the prefix is an ATTESTED standalone line of this same
# record -- [00384] prints "Activos financieros disponibles para la venta" on its own -- so
# the split point is evidence from the record, not a judgement about where the phrase ends.
# 3 repair(s) applied:
#   after 'Activos financieros disponibles para la venta', at box 00385
#   after 'Activos financieros disponibles para la venta', at box 00386
#   after 'Activos financieros disponibles para la venta', at box 00387
#
# THE SPLIT LIGATURE APPEARS TWICE HERE, "Otras reclasifi caciones" at @186 and @390, and
# is rejoined only because "reclasificaciones" is attested as a whole word elsewhere in the
# design. 2 rejoin(s) applied:
#   'reclasifi caciones' -> 'reclasificaciones', attested 11 time(s) elsewhere in the design
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22005A02 tiles
# 1..806 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @645+150 RESERVADO PARA LA ADMINISTRACION; and
# @795+12 Fin de registro.
#
# NOT CLAIMED: [00383] otros ingresos y gastos reconocidos, each concept head, and [00412]
# the total are AGGREGATES of the lines beneath them, and NO formula, construct or binding
# expresses that. Every box is a manual input.

