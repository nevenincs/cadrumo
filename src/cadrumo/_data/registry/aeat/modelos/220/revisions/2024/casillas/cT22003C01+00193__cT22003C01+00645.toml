# Modelo 220 RECORD T22003C01 -- BALANCE CONSOLIDADO, PATRIMONIO NETO, in the shape used by entidades de
# credito: fondos propios, otro resultado global acumulado split into
# elements that will and will not be reclassified, intereses minoritarios,
# the two closing totals, and the pro memoria exposiciones fuera de balance.
#
# 47 casillas describe all 57 design fields -- 47 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 47 of this record's numbers carry AEAT's own printed box number (5 are 4-digit, 42 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# FIVE BOXES HERE CARRY A FOUR-DIGIT NUMBER: [0638] to [0642]. They are the first
# non-five-digit boxes this generator has had to author, and it could not have:
# its number pattern was "\\[(\\d{5})\\]", so all five would have been read as
# UNNUMBERED fields and then refused as unexplained exclusions. The previous
# iteration found that AEAT's numbers are not all five digits and corrected the
# coverage measurement and the corpus verifier -- and NOT this generator. A
# correction to how a corpus is read has to reach every place that reads it, and
# this record is what forced the third one.
#
# SQUARE BRACKETS IN THIS RECORD ARE NOT ALL BOX NUMBERS: "[parte eficaz]",
# "[elemento cubierto]", "[instrumento de cobertura]", "[elementos no
# designados]" and "[participaciones no dominantes]" are AEAT's own qualifiers
# and stay in the labels verbatim. Only a bracket whose content is entirely
# digits is read as a number.
#
# IT CLOSES THE CREDITO BALANCE SHEET. [00229] TOTAL PATRIMONIO NETO Y PASIVO is
# the counterpart of [00152] TOTAL ACTIVO on page 3A hoja 11. With both terms
# declared the accounting identity is now EXPRESSIBLE for this sector too, and it
# is still not EXPRESSED -- no formula, construct or binding relates them, here or
# on the aseguradoras pages where the same became true three iterations ago.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 0
# rejoin(s) applied to this record, 0 distinct: none.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22003C01 tiles
# 1..976 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 03, letra C, hoja 01. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @815+150 RESERVADO PARA LA ADMINISTRACION; and
# @965+12 Fin de registro.
#
# NOT CLAIMED: THIS BALANCE SHEET DOES NOT BALANCE HERE. Every subtotal and the TOTAL are
# DECLARED, not computed: no formula, construct or binding sums a group into its head or
# the heads into the total, and nothing checks activo against patrimonio neto plus pasivo.
# Every box is a manual input.

