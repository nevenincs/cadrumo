# Modelo 220 ejercicio 2023 casillas, each declared where the 2023 record design
# aeat-dr-220-2023 (03-220-ejercicio-2023.xlsm) prints it, on the record sheets the
# 2024 edition models. 1761 rows: 88 declaration-header rows and the rest on 38
# record sheets. A row is stated when the 2023 design prints the same field -- the same box
# number on the same sheet, or for an unnumbered field the same caption -- with a caption
# equal to the 2024 one, equal once the period year it names is read as 2023, or
# differing only in wording the comment above the row records. A field the 2023 design
# places at other byte positions keeps its caption and takes the 2023 positions in its
# number (and, for a positional id, in its id).
#
# NOT DECLARED HERE, recorded as debt rather than guessed: 258 rows of the 2024 edition --
# 148 on sheets the 2023 design does not print (T22007A01, T22012A01, T22012A11),
# 69 whose box or caption the 2023 sheet does not print, 38 whose 2023 caption
# states a different text that no adjudication here reconciles, and 3 the 2023 sheet
# prints more than once without saying which occurrence is meant. Boxes the 2023 design
# prints that the 2024 edition does not declare, and the record sheets it leaves
# unmodelled, are not declared either.
#
# These rows state no legal_refs: each takes the edition's orden_aplicabilidad,
# orden-hac-495-2024:art-1, which approves the Modelo 220 of anexo II for the periods
# this edition covers. Labels live in the locale catalogue under this edition's keys.


