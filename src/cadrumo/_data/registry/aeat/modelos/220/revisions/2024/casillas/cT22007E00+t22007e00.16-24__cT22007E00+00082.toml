# Modelo 220 RECORD T22007E00 -- one of FOUR sibling per-operation detail records under
# "OTRAS CORRECCIONES A LA SUMA DE BASES IMPONIBLES". This one carries:
#   Incorporación de deterioros de valor de participaciones en fondos propios de entidades del grupo fiscal, eliminados en períodos anteriores
#
# 5 casillas describe all 211 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE: the 50 detail blocks carry NO box number and differ
# only by a printed row index, so ONE row is declared and a layout repeat writes the rest.
# Declaring every block would mint 200 casillas for 4 declared values.
#
# THE ROW INDEX IS PRINTED IN TWO DIFFERENT FORMS ACROSS THESE FOUR SIBLINGS -- a
# parenthesised ordinal after the concept in T22007D00 and T22007H00, a TRAILING DIGIT in
# T22007E00 and T22007F00. This record uses the trailing form. The form is detected per
# record rather than assumed, and the ordinals found are asserted to be exactly 1..50
# with each appearing once per block field -- which is what rules out a description that
# merely ends in a number.
#
# THE STRIDE IS PROVEN: the run starts at @16, the stride is 39, and
# 16 + 39 x 50 lands exactly on @1966 where the total begins.
# Every block was compared field-for-field against the first, on letters and digits only:
# 1 distinct shape.
#
# THE DETAIL LINES AND THE TOTAL CARRY DIFFERENT HEADINGS, both derived as the common
# prefix of their own group rather than read off one line:
#   detail heading  (none common)
#   total heading   OTRAS CORRECCIONES A LA SUMA DE BASES IMPONIBLES: Incorporación de deterioros de valor de participaciones en fondos propios de entidades del grupo fi 
#
# COMPLETENESS COMPLEMENT, asserted in the generator: every one of the 211 fields is
# authored, covered by the repeat, or named below as excluded, and the difference of those
# sets against the design is empty. The type table is asserted to cover exactly the
# authored offsets.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22007E00 tiles
# 1..2144 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT PRINTS 'Deteriorio'; the label reads 'Deterioro', the comment below keeps it as printed.
#
# AEAT PRINTS 'grupo fi scal'; the label reads 'grupo fiscal', the comment below keeps it as printed.
#

# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @1983+150 RESERVADO PARA LA ADMINISTRACION; and
# @2133+12 Fin de registro.
#
# NOT CLAIMED: the total is DECLARED, not computed. It is the sum of the correccion column
# down the 50 detail rows, and NO formula, construct or binding expresses that. Nor
# does anything express that these four corrections feed the suma de bases imponibles they
# are named for.

