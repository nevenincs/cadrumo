# Modelo 220 RECORD T22007A01 -- BASES IMPONIBLES NEGATIVAS INDIVIDUALES no integradas under DA 19a
# LIS: a matrix of TWO regimes (general, and the regimen especial de
# buques y empresas navieras de Canarias) by FOUR generation periods
# (2023, 2024(*), 2024, Total) by FOUR amounts (importe original,
# pendiente de integracion at the start, integrado in the period, and
# pendiente at the end).
#
# 32 casillas describe all 42 design fields -- 32 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 32 of this record's numbers carry AEAT's own printed box number (32 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# AEAT LEAVES A PARENTHESIS OPEN IN THE RECORD HEADING and never closes it: every one
# of the 32 lines reads "...del grupo fiscal (DA 19a LIS." with no closing bracket
# anywhere in the field. It is kept EXACTLY as printed. Closing it would be an edit to
# a filing-grade label on a guess about what AEAT meant to enclose, and the design gives
# no evidence for that guess.
#
# THE SAME PROVISION IS SPELLED TWO WAYS IN ONE LINE: the heading writes "DA 19a LIS"
# with the ordinal indicator and the amount name writes "DA 19 LIS (**)" without it.
# Both are kept as printed; nothing here decides which is canonical.
#
# TWO GENERATION PERIODS ARE BOTH CALLED 2024, distinguished ONLY by an asterisk --
# "Periodo de generacion 2024(*)" and "Periodo de generacion 2024". The design does
# not say what the asterisk marks. The labels preserve the distinction verbatim rather
# than resolving it, because collapsing them would merge two boxes AEAT numbers
# separately and dropping the marker would make them indistinguishable to an operator.
#
# THE NUMBERING JUMPS AT THE VERY END: the general block runs 01007..01022 and the
# Canarias block continues 01023..01036 unbroken, then its LAST TWO boxes are [01935]
# and [01936] rather than 01037 and 01038. Recorded because a reader checking the range
# would take it for a transcription error; it is AEAT's own. The exact runs were read
# off the design rather than inferred from the shape -- a first draft of this note said
# 01023..01035 with 01036 used earlier, and the design refuted it.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 0
# rejoin(s) applied to this record, 0 distinct: none.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22007A01 tiles
# 1..721 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 07, letra A, hoja 01. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @560+150 RESERVADO PARA LA ADMINISTRACION; and
# @710+12 Fin de registro.
#
# NOT CLAIMED: THIS CARRY-FORWARD TABLE DOES NOT RECONCILE ITSELF. Within each regimen
# and each generation period the four columns are a chain -- original, pendiente at the
# start, integrado in the period, pendiente at the end -- and the Total row is the sum
# down its column. NEITHER relation is expressed: no formula, construct or binding
# subtracts the integrado from the opening pendiente, sums a column into its Total, or
# carries an end-of-period pendiente into the next filing year. Every box is a manual
# input, and this is the one record in the revision where an unexpressed carry crosses
# FILING YEARS rather than staying inside one.

