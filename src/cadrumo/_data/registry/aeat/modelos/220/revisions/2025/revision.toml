predecessor = { none = { reason = "Stated in full: this edition authors its casillas from its own hash-pinned 2025 record design and inherits nothing from 2024. Its 328 casillas -- two declaration headers and 326 money-closure slots read from aeat-dr-220-2025 -- are declared with no continuity chain, because the 2024 rows carry no grounded continuity_id to chain to. Naming 2024 as predecessor would switch this edition into delta-authoring and inherit 1,985 rows, among them four T22007000 tramo ids whose id IS a position range that the 2025 layout moves. The 2025 official form and AEAT record-design evidence identify this edition's own scope, while Orden HAC/529/2026 art. 6.3 authorises the Modelo 220 declaration for periods begun in 2025.", cause = "predecessor_row_without_lineage", legal_refs = ["orden-hac-529-2026:art-6-3"], source_refs = ["boe-modelo-220-2025-form", "aeat-dr-220-2025"] } }
