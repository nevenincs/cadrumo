# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. Orden HAC/529/2026
# (BOE-A-2026-11583) approves its 2025 declaration and grounds its deadline
# through LIS art. 75.2. This is an applicability-grade revision carrying the
# declaration headers and the money-closure casillas of the group declaration,
# generated from the bundled 2025 record design; no casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (137 / 16,079) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# The former open-ended revision spanned the 2024/2025 re-layout. The two
# calendar years are now separate revisions: the 2024/2025 boundary moves 4,524
# of 7,466 shared boxes, adds 216, removes 130, and changes the record set from
# 137 to 141. The 2025 revision must not also claim a 2026 successor without
# that successor's own exact design and approving authority.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# No 2026 successor is declared. The 2025 AEAT design and Orden HAC/529/2026
# both apply only to calendar-2025 periods. A later revision requires its own
# hash-pinned record design and approving legal authority; copying this
# revision's selection or layout evidence would fabricate continuity.
