# Modelo 220 RECORD T22009000 -- liquidacion: de la cuota integra a traves de las
# bonificaciones, las deducciones por doble imposicion y las otras deducciones hasta la
# cuota liquida, la cuota diferencial, el resultado de la autoliquidacion y el liquido a
# ingresar o devolver.
#
# 63 casillas, every one carrying a real AEAT box number and a `segmento`.
#
# CONCEPT AND JURISDICTION ARE DERIVED, NOT MATCHED. Most lines carry an Estado or a
# D. Forales/Navarra suffix, and the concept is whatever remains once that suffix is
# removed. Deriving the remainder cannot mis-match; hand-written fragments taken from
# truncated output have twice produced silent key collisions on this modelo.
#
# ITS SIBLING RECORD T22009001 IS NOT SHIPPED YET, and the reason is recorded here
# because it is a finding rather than a scheduling note. That record contains casillas
# 02796 and 02797, whose descriptions are BYTE-IDENTICAL -- both ending "Estado." -- at
# adjacent offsets. The pair immediately above them, 02794 and 02795, is the same concept
# split "Estado" and "D. Forales / Navarra (totales)", so the pattern says one of
# 02796/02797 should be the foral column and AEAT has repeated the wrong suffix. Which
# one is not something the design states, and guessing would put a jurisdiction on a
# filed box on the strength of a neighbouring row's shape. That record waits for a
# resolution rather than shipping a guess.
#
# AEAT ALSO BREAKS THE "fi" LIGATURE ACROSS A SPACE in several places on this family --
# "Bonifi caciones", "Transparencia fi scal", "especifi cas". Transcribed as printed in
# the fragment comments and corrected in the operator-facing labels, the same treatment
# given to "insufi ciencia" on family 16.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22009000 tiles
# 1..1248 exactly once with NO gap and NO PARTIAL OVERLAP, both checked, and every
# number, offset, length and type below was read from its own field description.
#
# NOT MODELLED, deliberately: the modelo and pagina identifier envelope, the
# pagina-complementaria mechanics, the reservado run and the end-of-record marker.
#
# NOT CLAIMED: these casillas DECLARE the liquidacion; none of them computes it. The
# record is a settlement chain -- cuota integra less bonificaciones and deducciones gives
# cuota liquida, less retenciones gives cuota diferencial, and so on -- and NOT ONE of
# those relations is modelled here. No formula, construct or binding is attached.

