# Modelo 220 RECORD T22003B00 -- BALANCE CONSOLIDADO, PATRIMONIO NETO Y PASIVO, in the general Plan General
# de Contabilidad shape: fondos propios, ajustes por cambios de valor and
# socios externos, then pasivo no corriente and pasivo corriente down to
# TOTAL PATRIMONIO NETO Y PASIVO.
#
# 51 casillas describe all 61 design fields -- 51 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position. Every box carries AEAT's own five-digit
# number, so not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# THIS RECORD HAS NO HEADING AT ALL. Its sibling T22003A00 prefixes every line
# with "ACTIVO"; here the lines begin directly with "PATRIMONIO NETO",
# "Fondos propios", "Capital". The heading is derived as the common prefix of
# the numbered lines and comes out EMPTY, which is carried as a valid answer
# rather than forced -- an empty common prefix is what a record without a
# heading looks like, and inventing one would put a word on 51 filing-grade
# labels that AEAT does not print.
#
# FIVE BOXES SIT UNDER "Reservas" ON THE PRINTED MODELO AND CARRY NO PREFIX:
# [00003] reserva legal y estatutaria, [00752] reserva de capitalizacion,
# [00753] reserva de nivelacion, [00764] fondo de reserva obligatorio de
# cooperativas, and [00702] is prefixed while [00003] is not. Left flat, like
# [00701] and [00761] on the activo side: nested only where the line says so.
#
# [00003] IS FAR OUTSIDE THIS RECORD'S NUMBER RANGE, which otherwise runs
# 00185..00252 with a handful of 007xx additions. Recorded because a reader
# checking the range would take it for a transcription error; it is AEAT's.
#
# TWO LABELS ARE PARENTHESISED IN THE DESIGN -- "(Acciones y participaciones de
# la sociedad dominante)" and "(Dividendo a cuenta)". The parentheses are
# AEAT's mark for a line that SUBTRACTS, so they are kept verbatim in every
# catalogue; stripping them would silently drop the sign convention. NOTHING
# here acts on that convention -- it is punctuation in a label, not arithmetic.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER THE HEADING: "ACTIVO. Inmovilizado
# intangible" with a space, "ACTIVO.Activos por impuesto diferido" without. The heading is
# derived as the common prefix of every numbered line and the remainder is stripped, so
# both spellings land on the same heading. 0 parent-child separator repair(s)
# applied: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 0
# rejoin(s) applied: none.
#
# 6 of this record's 51 numbered lines carry the real ligature CODEPOINT, unsplit,
# expanded in the labels and kept as emitted in the verbatim comments. The design carries
# 309 such codepoints in all, so a plain-text search of this workbook for a Spanish
# word silently misses them.

# AEAT PRINTS 'Procisiones'; the label reads 'Provisiones'. Corrected by name, never by a general rule.
#
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22003B00 tiles
# 1..1044 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @883+150 RESERVADO PARA LA ADMINISTRACION; and
# @1033+12 Fin de registro.
#
# NOT CLAIMED: THIS BALANCE SHEET DOES NOT BALANCE HERE. Every subtotal and the TOTAL are
# DECLARED, not computed: no formula, construct or binding sums a group into its head or
# the heads into the total, and nothing checks activo against patrimonio neto plus pasivo.
# Every box is a manual input.

