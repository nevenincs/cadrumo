# Modelo 220 RECORD T22008A00 -- consolidacion de resultados contables y de bases
# imponibles: the lettered lines A to G2 that reconcile the group's consolidated
# accounting result against the sum of its members' individual results, and the
# corresponding reconciliation of bases imponibles.
#
# 21 casillas, every one carrying a real AEAT box number and a `segmento`.
#
# THIS RECORD IS NOT A GRID and is deliberately not treated as one. Its twenty-one
# lines are each a distinct lettered concept -- A, B, C = A - B, D, E, F = D - E, G,
# then the G1 and G2 subtotals -- so there is no group-by-column axis to decompose and
# each label is taken from the design's own line. Forcing a decomposition here would
# invent an axis the design does not have.
#
# THE ARITHMETIC IS PRINTED IN THE DESIGN AND IS NOT MODELLED. AEAT states "C. Diferencia
# por consolidacion de resultados (= A - B)" and "F. Diferencia por consolidacion de
# bases imponibles ( = D - E)", and line E even carries a formula over other casillas.
# Those relations are recorded in the labels as AEAT prints them, but NOTHING in this
# registry computes or checks them: no formula is attached to any casilla here.
#
# Grounded in aeat-dr-220-2024. The record tiles 1..534 exactly once with NO gap
# and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: the identifier envelope, the pagina-complementaria
# mechanics, the reservado run and the end-of-record marker.

