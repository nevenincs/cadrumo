# Modelo 220 RECORD T22001000 -- the grupo fiscal declarante record: identificacion
# of the representante or dominante entity, periodo impositivo, the dominante, the
# group's CNAE activities, its tipo-de-grupo characters, the INCN tranche, the legal
# representatives and the incidents contact.
#
# THIS IS THE FIRST CASILLA-TO-POSITION MAPPING AUTHORED FOR MODELO 220. Until now
# the revision declared only two applicability-grade header casillas and its sibling
# fragment recorded that no position mapping had been authored, so a number was not
# invented. That is what this fragment supplies, for ONE of the design's 137 records.
#
# Grounded in aeat-dr-220-2024, the era-matching bundled Diseno de Registro, whose
# applies_from/applies_to are 2024-01-01 and 2024-12-31 -- exactly the single
# ejercicio this revision claims, so no casilla here carries a byte span the design
# does not evidence for the year it is filed under.
#
# VERIFIED BEFORE ANY OFFSET WAS TRUSTED: T22001000 tiles 1..1684 exactly once with
# NO gap and NO PARTIAL OVERLAP. Both were checked; a gap-only check is insufficient
# because partial overlap leaves no holes, and the filing-capability worklist names
# that check by name as the precondition for authoring against this design.
#
# NUMBERING. Twelve fields carry a REAL AEAT BRACKET NUMBER -- [007], [012], [016],
# [020], [006], [065], [066], [067], [068], [069], [070], [083] -- and those casillas
# carry AEAT's own number. The remaining sixty-five carry none, and take the
# sheet-qualified byte span already established by modelo 181 ("t22001000.17-25" for
# a field at offset 17 length 9, a bare offset for a single byte). No number is
# minted that AEAT prints elsewhere.
#
# THE CNAE RUN IS GENERATED FROM A PROVEN STRIDE, not assumed. The design declares
# fourteen epigrafe/descripcion pairs of 5 and 60 positions; the run starts at 258
# and steps 65, and 1108+60 lands exactly on 1168 where the caracteres flags begin.
# The same holds for the three representante legal blocks: 36+9+8+12 = 65 positions,
# starting at 1196, and 1326+65 = 1391 lands exactly on the contacto block. Each
# generated offset was cross-checked against the design row it claims.
#
# NOT MODELLED, deliberately, and each for a stated reason:
#   @1+2, @3+3, @6+2, @8+1, @9+2, @11+1 -- the modelo/pagina identifier envelope.
#   @12+1, @13+3 -- indicador and numero de orden de pagina complementaria. These
#     are fichero page-repetition mechanics, not taxpayer facts. Borderline, and
#     recorded as such rather than silently dropped.
#   @16+1 -- "Tipo de declaracion. RESERVADO PARA LA ADMINISTRACION".
#   @106+4 -- "Ejercicio. Campana del registro". This is the SAME fact as the
#     revision's existing `decl.ejercicio` casilla, which a layout will bind to this
#     position. A second casilla here would double-declare one value.
#   @1509+1 -- "Inoperatividad de la ayuda al calculo", a filing-program flag.
#   @1510+150, @1660+13, @1673+12 -- reservado, sello electronico, fin de registro.
#
# NOT CLAIMED: 136 of the design's 137 records remain unauthored. This record alone
# does not make the modelo fileable, and the revision still carries no export layout.

