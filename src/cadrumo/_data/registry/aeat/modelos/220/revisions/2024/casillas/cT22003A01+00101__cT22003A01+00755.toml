# Modelo 220 RECORD T22003A01 -- BALANCE CONSOLIDADO, ACTIVO, in the shape used by entidades de credito: the
# financial-asset portfolios by measurement category, derivados de
# cobertura, inversiones en negocios conjuntos y asociadas, and activos
# tangibles.
#
# 54 casillas describe all 64 design fields -- 54 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 54 of this record's numbers carry AEAT's own printed box number (54 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# THIRTY-THREE OF THESE FIFTY-FOUR BOXES SHARE A LABEL WITH A SIBLING, and that
# is the honest cost of not inventing a hierarchy. This record is a PORTFOLIO x
# INSTRUMENT matrix: AEAT prints the portfolio head on its own row -- [00102]
# mantenidos para negociar, [00615] no destinados a negociacion, [00110]
# designados a valor razonable, [00623] con cambios en otro resultado global,
# [00631] a coste amortizado -- and then prints the instrument rows beneath it
# WITHOUT the portfolio name. Five boxes read "Valores representativos de
# deuda", five read "Prestamos y anticipos" and five read the same Pro memoria
# line, each belonging to a different portfolio.
#
# THE PORTFOLIO IS NOT DERIVED FROM POSITION. On T22005A01 the obvious adjacency
# rule -- parent is the nearest preceding unrepeated line -- was tried and proved
# WRONG IN FOUR PLACES. Here a numbering-block rule would be PARTIAL: the 00615,
# 00623 and 00631 runs are contiguous, while the 00102 and 00110 runs have gaps
# and their Pro memoria lines carry out-of-run numbers [00750] and [00751]. A
# rule that works for three blocks and not two is the "right most of the time"
# case this campaign has already refused once.
#
# CONSEQUENCE, STATED PLAINLY: the box number is the only disambiguator this
# data supports, and an operator surface that shows labels without numbers will
# present five identical rows on this page. That is a real cost, recorded rather
# than traded for an unverifiable tree.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 0
# rejoin(s) applied to this record, 0 distinct: none.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22003A01 tiles
# 1..1095 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 03, letra A, hoja 01. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @934+150 RESERVADO PARA LA ADMINISTRACION; and
# @1084+12 Fin de registro.
#
# NOT CLAIMED: THIS BALANCE SHEET DOES NOT BALANCE HERE. Every subtotal and the TOTAL are
# DECLARED, not computed: no formula, construct or binding sums a group into its head or
# the heads into the total, and nothing checks activo against patrimonio neto plus pasivo.
# Every box is a manual input.

