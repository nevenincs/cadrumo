# Modelo 220 RECORD T22003D02 -- BALANCE CONSOLIDADO, PATRIMONIO NETO, in the shape used by entidades
# aseguradoras: fondos propios with capital, reservas and results, ajustes
# por cambios de valor, subvenciones, socios externos, and the two closing
# totals TOTAL PATRIMONIO NETO and TOTAL PASIVO Y PATRIMONIO NETO.
#
# 36 casillas describe all 46 design fields -- 36 authored and
# 10 excluded, each excluded field asserted to be envelope, reservado or fin de
# registro BY ITS OWN TEXT rather than by position.
#
# All 36 of this record's numbers carry AEAT's own printed box number (36 are 5-digit).
# Not one number here is minted.
#
# CHILDREN CARRY THEIR PARENT'S NAME INLINE, so every label is distinct on AEAT's own text
# and no nesting is inferred from position. Where a design does NOT do this the record is
# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# AEAT ABBREVIATES A PARENT NAME ON ONE CHILD AND NOT ITS SIBLING. [00219]
# reads "Resultados de ejercicios anteriores atribuidos a la sociedad dominante.
# Remanente" while [00220] reads "Resultados de ejercicios anteriores.
# (Resultados negativos ... dominante)" -- the same parent, written short. The
# two therefore do NOT share a prefix. The short form is NOT a standalone box of
# this record, so it stays INSIDE the leaf label rather than being promoted to a
# heading it never was; expanding it to match its sibling would be a guess that
# two lines AEAT wrote differently mean the same thing.
#
# FIVE LABELS ARE PARENTHESISED because AEAT marks a SUBTRACTING line that way:
# [00211] (Capital no exigido), [00217] (Acciones propias y de la sociedad
# dominante), [00220] (Resultados negativos ...), [00693] (Perdidas y ganancias
# socios externos) and [00223] (Dividendo a cuenta y reserva de estabilizacion a
# cuenta). Kept verbatim in every catalogue. NOTHING here acts on the
# convention: a consumer treating these as additive will be wrong.
#
# THIS RECORD CLOSES THE ASEGURADORAS BALANCE SHEET. [00233] TOTAL PASIVO Y
# PATRIMONIO NETO is the counterpart of [00162] TOTAL ACTIVO on page 3B. With
# both sides declared the accounting identity is now EXPRESSIBLE, and it is
# still not EXPRESSED -- no formula, construct or binding relates them.
#
# AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER A HEADING, writing the same one
# both with and without the space that should follow its period. The heading is derived as
# the common prefix of every numbered line and the remainder is stripped, so both
# spellings land on the same heading. 0 parent-child separator
# repair(s) applied to this record: none needed.
#
# THE LIGATURE REPAIR IS GROUNDED IN THE WORKBOOK'S OWN VOCABULARY, and the vocabulary is
# counted twice so the damage cannot attest itself: once over every token, and once over
# only those tokens seen where they CANNOT be the left half of a split. 0
# rejoin(s) applied to this record, 0 distinct: none.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22003D02 tiles
# 1..789 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT DECLARES THIS RECORD'S IDENTITY IN ITS ENVELOPE, as literal constants:
# pagina 03, letra D, hoja 02. Sibling sector pages in this modelo
# can share every heading AEAT prints in the BODY -- on the balance-sheet pages two
# records both head their lines "ACTIVO" and both declare a "Total activo" -- so the
# envelope is the ONLY non-inferential way to tell such records apart. The operator label
# carries it for exactly that reason; it claims no sector, which the design does not state.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @628+150 RESERVADO PARA LA ADMINISTRACION; and
# @778+12 the record terminator, which this design words 'Fin de registro'.
#
# NOT CLAIMED: THIS BALANCE SHEET DOES NOT BALANCE HERE. Every subtotal and the TOTAL are
# DECLARED, not computed: no formula, construct or binding sums a group into its head or
# the heads into the total, and nothing checks activo against patrimonio neto plus pasivo.
# Every box is a manual input.

