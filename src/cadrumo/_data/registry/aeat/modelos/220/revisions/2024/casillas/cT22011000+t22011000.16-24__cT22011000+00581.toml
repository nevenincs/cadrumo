# Modelo 220 RECORD T22011000 -- a PER-ENTITY DETAIL record: bonificaciones
# declared entity by entity, each row a NIF plus 8 amount columns, followed by one
# TOTAL per column carrying AEAT's own box number.
#
# 17 casillas describe all 234 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE. The 24 detail blocks carry NO number and differ only
# by a printed row index, so ONE row is declared and a layout repeat writes the rest --
# the mechanism modelo 720's binding_record already uses. Declaring every block instead
# would mint 216 casillas for 9 declared values.
#
# THE STRIDE IS PROVEN, NOT ASSUMED. The detail run starts at @16, the second block
# starts at @161 so the stride is 145, and 16 + 145 x 24
# lands exactly on @3496 where the first total begins. Every block was compared
# field-for-field against the first with its row index removed: 1 distinct shape.
#
# COMPLETENESS COMPLEMENT, asserted in the generator rather than claimed here: every one
# of the 234 fields is authored, covered by the repeat, or named below as excluded,
# and the difference of those sets against the design is empty.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22011000 tiles
# 1..3793 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# AEAT'S OWN TEXT DIFFERS BETWEEN A DETAIL ROW AND ITS TOTAL in some columns, and both are
# transcribed as printed rather than quietly reconciled:
#   detail  Bonificaciones entidades dedicadas al arrendamiento de viviendas (Cap. III Tít. VII LIS)
#   total   Bonificaciones entidades dedicadas al arrendamiento de viviendas (Cap. III Tit. VII LIS)
#
# THE FAMILY WORDING "detalle por entidad" IS DESCRIPTIVE AND MINE. The design gives this
# sheet no heading of its own -- only a column of NIFs beside the amounts -- so the
# per-entity reading is taken from that shape and is not an AEAT phrase.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @3632+150 RESERVADO PARA LA ADMINISTRACION; and
# @3782+12 Fin de registro.
#
# NOT CLAIMED: the totals are DECLARED, not computed. Each is the sum of its own column
# down the 24 detail rows, and NO formula, construct or binding expresses that
# here. A reader should not mistake a declared total for a computed one.

