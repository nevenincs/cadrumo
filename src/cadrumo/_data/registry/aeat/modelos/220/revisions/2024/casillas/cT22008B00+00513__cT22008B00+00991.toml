# Modelo 220 RECORD T22008B00 -- consolidacion de bases imponibles: el saldo de
# ingresos y gastos del ejercicio, el Impuesto sobre Sociedades, las diferencias
# permanentes y temporarias de las sociedades individuales y de los ajustes por
# consolidacion, la compensacion de bases imponibles negativas y la base imponible.
#
# 55 casillas, every one carrying a real AEAT box number and a `segmento`.
#
# THE RECORD IS A GROUP x COLUMN GRID and the decomposition was checked before any
# label was composed: eight concept groups against seven settlement columns (cuenta de
# perdidas y ganancias in its aumentos and disminuciones variants, ingresos y gastos
# imputados al patrimonio neto likewise, reservas likewise, and a total), plus two
# standalone lines. The arithmetic closes exactly: the SALDO group carries only four
# columns rather than seven, so 4 + 7x7 + 2 = 55, the numbered-field count.
#
# COLUMN MATCHING IS ORDER-DEPENDENT and the table says so: "Cuenta de Perdidas y
# Ganancias" is a PREFIX of "Cuenta de Perdidas y Ganancias. Aumentos (A)", so the
# variants must be tested first or every aumentos cell reads as the bare column. The
# same shape caused a real defect on this modelo's family 12, where a lowercase
# fragment shadowed its own superstring and would have mislabelled every 2024 cell.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. The record tiles
# 1..1112 exactly once with NO gap and NO PARTIAL OVERLAP, both checked, and every
# number, offset, length and type was read from its own field description.
#
# NOT MODELLED, deliberately: the modelo and pagina identifier envelope, the
# pagina-complementaria mechanics, the reservado run and the end-of-record marker.
#
# NOT CLAIMED: these casillas DECLARE the consolidation; none of them computes it.
# Nothing here checks that a Total column equals the sum of its aumentos and
# disminuciones, and no formula, construct or binding is attached.

