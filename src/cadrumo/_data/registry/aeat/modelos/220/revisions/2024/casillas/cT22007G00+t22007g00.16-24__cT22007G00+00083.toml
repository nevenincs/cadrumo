# Modelo 220 RECORD T22007G00 -- GRUPOS DE COOPERATIVAS, the eliminations a
# cooperative group makes under R.D. 1345/1992: retornos intragrupo, ayudas economicas
# intragrupo and resultados distribuidos por la entidad cabeza del grupo.
#
# 10 casillas describe all 314 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE: the 50 detail blocks carry NO box number and differ
# only by a printed row index, so ONE row is declared and a layout repeat writes the rest.
# Declaring every block would mint 300 casillas for 6 declared values.
#
# THIS RECORD IS THE FIRST OF ITS FAMILY TO CARRY MORE THAN ONE TOTAL. The four siblings
# D00, E00, F00 and H00 each close on a single numbered box; here FOUR totals close the
# record, one per eliminated concept plus the sum. The generator asserts the count it
# finds rather than the count it expected, and requires the totals to be contiguous at the
# tail -- otherwise "everything before the first numbered box" would not be the run.
#
# THE ROW INDEX IS THE PARENTHESISED FORM, detected rather than assumed: both the
# parenthesised and the trailing-digit forms are tried and exactly one must explain every
# line of the run. The ordinals found are asserted to be exactly 1..50 with each
# appearing once per block field, which is what rules out a description that merely ends
# in a number.
#
# THE STRIDE IS PROVEN: the run starts at @16, the stride is 86, and
# 16 + 86 x 50 lands exactly on @4316 where the first total
# begins. Every block was compared field-for-field against the first, on letters and
# digits only: 1 distinct shape.
#
# THE DETAIL LINES AND THE TOTALS CARRY DIFFERENT HEADINGS, both derived as the common
# prefix of their own group rather than read off one line:
#   detail heading  Eliminación.
#   totals heading  GRUPOS DE COOPERATIVAS: Eliminación de "retornos intragrupo", "Ayudas económicas intragrupo" y "resultados distribuidos por la entidad cabeza del grupo" (R:D. 1345/1992).
#
# COMPLETENESS COMPLEMENT, asserted in the generator: every one of the 314 fields is
# authored, covered by the repeat, or named below as excluded, and the difference of those
# sets against the design is empty. Every excluded offset is required to say so in its own
# text. The type table is asserted to cover exactly the authored offsets.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22007G00 tiles
# 1..4545 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @4384+150 RESERVADO PARA LA ADMINISTRACION; and
# @4534+12 Fin de registro.
#
# NOT CLAIMED: TWO DIFFERENT SUMS ARE DECLARED AND NEITHER IS COMPUTED. The block's own
# "Total eliminaciones" is the row sum of the three concept columns beside it; the closing
# [00083] is the column sum of that same field down the 50 rows. NO formula,
# construct or binding expresses either, nor that these eliminations reach the suma de
# bases imponibles del grupo that T22007000 declares.
#
# NOT CLAIMED: the design prints "cabeza del grupo" on the detail line and "cabeza de
# grupo" on the total. Both are kept as printed; nothing here decides which AEAT meant.

