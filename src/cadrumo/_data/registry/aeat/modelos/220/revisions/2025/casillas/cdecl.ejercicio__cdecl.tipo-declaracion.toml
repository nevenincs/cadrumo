# Modelo 220 declaration-header casillas: the ejercicio and the tipo de
# declaración, grounded in Orden HAC/529/2026 art. 6.3 and the art. 124 LIS
# declaration framework. These two are keyed on words rather than offsets, so
# they carry no segmento and no position.
#
# THE MONEY-CLOSURE CASILLAS NOW EXIST, in sibling fragments of this directory,
# generated from aeat-dr-220-2025 -- 326 slots over the six settlement records
# T22007000, T22009000, T22009001, T22016000, T22016001 and T220DID00. The
# comment formerly here said no casilla-to-position mapping had been authored
# from the bundled designs; that stopped being true when those fragments landed.
# The revision stays applicability-grade: declaring where a number sits is not
# claiming to compute it.
#
# source_refs corrected 2026-08-15: boe-modelo-200-2025-form (a 2308-byte orden
# excerpt) was found to carry no layout content and retiered to
# official_source_guidance -- it remains a genuine citation (the orden covering
# Modelo 220), but these two casillas cited it alone, so aeat-dr-220-2025 (the
# real, era-matching bundled Diseño de Registro) is added rather than swapped.

[[revisions."2025".casillas]]
id = "decl.ejercicio"
continuidad_id = "filing-year"
continuidad_origin = "seeded"
number = "ejercicio"
section = ["declarante"]
data_type = "year"
semantic_role = "filing_year"
required = true
input_kind = "informational"
legal_refs = ["orden-hac-529-2026:art-6-3", "ley-27-2014:art-124"]

