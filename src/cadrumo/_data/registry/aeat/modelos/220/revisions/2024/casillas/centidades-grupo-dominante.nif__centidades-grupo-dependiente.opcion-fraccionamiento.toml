# Modelo 220 RECORD T22002000 -- entidades del grupo en regimen de consolidacion
# fiscal: the entidad dominante, and the entidades dependientes o cooperativas
# integrantes del grupo.
#
# THIS FRAGMENT DECLARES THE DOMINANTE BLOCK AND ONE DEPENDIENTE ROW -- sixteen
# casillas -- NOT the record's twenty dependiente blocks. That is the design decision
# worth reading before changing it.
#
# The record carries the dominante block at @16..@127, then TWENTY dependiente blocks
# of nine fields each from @128, at a stride of 122 positions, ending exactly at @2568
# where the reservado run begins. The block count is arithmetic, not an estimate:
# (2568 - 128) / 122 = 20 exactly.
#
# THE RECORD PRINTS NO BOX NUMBERS AT ALL. Every field is unnumbered, so each casilla
# takes the sheet-qualified byte span modelo 181 established. The twenty blocks are
# distinguished in the design only by an ordinal appended to each description --
# "NIF. 1", "NIF. 2" -- never by a box number.
#
# That is why one row is declared rather than twenty. The byte-span number is OUR
# convention, not AEAT's; minting twenty sets of it would assert 180 distinct declared
# boxes where the design declares one repeating row of nine fields. A casilla is
# offset-free -- it carries a number, never a position -- so one row is the complete
# description of what a member entity declares, and the twenty repetitions are a
# LAYOUT concern for the repeat mechanism, as modelo 720's binding_record does.
#
# CONTRAST modelo 036 Pagina 10, which IS authored block by block: its six blocks each
# print DISTINCT AEAT numbers (1000-1003, 1004-1007 and so on), so collapsing them
# would have lost eighteen real numbers. The rule established across both modelos is
# the same one: the NUMBER SET decides, not the repetition. Where AEAT numbers the
# rows apart, author them apart; where it does not, author the row.
#
# A LAYOUT AUTHOR MUST NOT MISS THIS: mapping these nine dependiente casillas once, at
# @128..@249, leaves nineteen blocks unfilled. The repeat is required, stride 122,
# count 20, starting at @128.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22002000 tiles
# 1..2729 exactly once with NO gap and NO PARTIAL OVERLAP, both checked, and every
# offset, length and type below was read from its own field description.
#
# NOT MODELLED, deliberately: the modelo and pagina identifier envelope at @1..@11,
# the pagina-complementaria mechanics at @12+1 and @13+3, the "RESERVADO PARA LA
# ADMINISTRACION" run at @2568+150, and the end-of-record marker at @2718+12. None is
# filer-supplied.
#
# NOT CLAIMED: this is the second of the design's 137 records to be authored. The
# revision still carries no export layout and cannot be filed.

