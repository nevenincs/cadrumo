# Modelo 220 RECORD T22016000 -- reparto entre Administraciones forales: calculo de
# porcentajes de tributacion y determinacion del liquido a ingresar o devolver en cada
# una de las Administraciones forales.
#
# 110 casillas, every one carrying a real AEAT box number and a `segmento`, following
# the modelo 200 convention this modelo already uses.
#
# THE RECORD IS A PERFECTLY REGULAR GRID: 28 concepts x 5 territories across the two
# family-16 records, verified rather than assumed -- every concept occurs exactly five
# times, once per territory, and 28 x 5 = 140 equals the numbered-field count exactly.
#
# THE CONCEPT AXIS IS DERIVED, NOT MATCHED, and that choice was forced by a real defect.
# A first attempt hand-wrote matcher fragments taken from a survey that had TRUNCATED the
# descriptions at 104 characters, so fragments like "Abono de de" and "Complementa"
# collapsed several distinct concepts into one and produced 24 key collisions. Deriving
# the concept as the REMAINDER -- what is left once the family heading, the territory
# name and the row index are removed -- cannot mis-match, because nothing is being
# guessed at. Never build a matcher from truncated output.
#
# AEAT USES BOTH THE BASQUE AND THE SPANISH TERRITORY NAMES in the same design: Araba
# and Alava, Gipuzkoa and Guipuzcoa, Bizkaia and Vizcaya. Both spellings are matched;
# the casilla labels use the Basque form, which is the one the design uses in the
# majority of its rows.
#
# AEAT ALSO BREAKS A WORD ACROSS A SPACE -- "insufi ciencia de cuota" for
# "insuficiencia de cuota". Transcribed as printed in the comment and corrected in the
# label, the same treatment given to its other typos on this modelo.
#
