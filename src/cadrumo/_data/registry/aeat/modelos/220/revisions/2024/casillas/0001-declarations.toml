# Modelo 220 RECORD T22015B00 -- a PER-ENTITY DETAIL record for la deduccion por inversion de beneficios, each row a
# block of 7 fields, followed by 3 TOTAL columns carrying AEAT's own box
# numbers.
#
# 10 casillas describe all 244 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE: the 33 detail blocks carry NO box number and differ
# only by a parenthesised row ordinal, so ONE row is declared and a layout repeat writes
# the rest. Declaring every block would mint 231 casillas for 7 declared
# values.
#
# THE ROW ORDINAL IS PARENTHESISED HERE, unlike T22010000 and T22011000 where it is a
# trailing digit, and it sits in a DIFFERENT PLACE in each of the two records -- after the
# concept in T22015A00, at the end of the line in T22015B00. It is matched as a one-or-two digit
# parenthesised group, the ordinals seen are asserted to be exactly 1..33, and no
# field may carry two of them. The bracketed law references in these headings
# ("(Art. 37 TRLIS)", "(AAAAMMDD)") carry no bare digits and cannot be mistaken for it.
#
# THE STRIDE IS PROVEN: the run starts at @16, the stride is 81, and
# 16 + 81 x 33 lands exactly on @2689 where the first total
# begins. Every block was compared field-for-field against the first.
#

# COMPLETENESS COMPLEMENT, asserted in the generator: every one of the 244 fields
# is authored, covered by the repeat, or named below as excluded, and the difference of
# those sets against the design is empty. The type table is asserted to cover exactly the
# authored offsets, so a field added or removed cannot pass untyped.
#
# THE DETAIL LINES AND THE TOTAL LINES CARRY DIFFERENT HEADINGS, both derived from the
# design as the common prefix of their own group rather than retyped. The detail heading
# is stripped from the detail labels; the totals keep their printed text whole, because
# what they share may be nothing at all:
#   detail heading  DEDUCCIÓN POR INVERSIÓN DE BENEFICIOS (DT 24.5 LIS y Art. 37 TRLIS).
#   total heading  DEDUCCIÓN POR INVERSIÓN DE BENEFICIOS (Art. 37 LIS).
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22015B00 tiles
# 1..2901 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @2740+150 RESERVADO PARA LA ADMINISTRACION; and
# @2890+12 Fin de registro.
#
# NOT CLAIMED: the totals are DECLARED, not computed. Each is the sum of its own column
# down the 33 detail rows, and NO formula, construct or binding expresses that
# here. Nor does anything here express that a deduccion pendiente al inicio less the
# deduccion aplicada gives the deduccion pendiente de aplicacion, which is what the three
# money columns mean.

