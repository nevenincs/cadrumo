# Modelo 220 RECORD T22015A00 -- a PER-ENTITY DETAIL record for deducciones por reinversion, each row a
# block of 8 fields, followed by 3 TOTAL columns carrying AEAT's own box
# numbers.
#
# 11 casillas describe all 277 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE: the 33 detail blocks carry NO box number and differ
# only by a parenthesised row ordinal, so ONE row is declared and a layout repeat writes
# the rest. Declaring every block would mint 264 casillas for 8 declared
# values.
#
# THE ROW ORDINAL IS PARENTHESISED HERE, unlike T22010000 and T22011000 where it is a
# trailing digit, and it sits in a DIFFERENT PLACE in each of the two records -- after the
# concept in T22015A00, at the end of the line in T22015B00. It is matched as a one-or-two digit
# parenthesised group, the ordinals seen are asserted to be exactly 1..33, and no
# field may carry two of them. The bracketed law references in these headings
# ("(Art. 37 TRLIS)", "(AAAAMMDD)") carry no bare digits and cannot be mistaken for it.
#
# THE STRIDE IS PROVEN: the run starts at @16, the stride is 89, and
# 16 + 89 x 33 lands exactly on @2953 where the first total
# begins. Every block was compared field-for-field against the first.
#
#
# AEAT REPEATS A PHRASE INSIDE ONE DESCRIPTION and it is collapsed in the label,
# kept doubled in the verbatim comment:
#   Deducciones por reinversión. NIF de la entidad que obtiene el resultado por transmisión del activo por transmisión del activo
# COMPLETENESS COMPLEMENT, asserted in the generator: every one of the 277 fields
# is authored, covered by the repeat, or named below as excluded, and the difference of
# those sets against the design is empty. The type table is asserted to cover exactly the
# authored offsets, so a field added or removed cannot pass untyped.
#
# THE DETAIL LINES AND THE TOTAL LINES CARRY DIFFERENT HEADINGS, both derived from the
# design as the common prefix of their own group rather than retyped. The detail heading
# is stripped from the detail labels; the totals keep their printed text whole, because
# what they share may be nothing at all:
#   detail heading  Deducciones por reinversión.
#   total heading  (none common)
#
