# authored flat instead -- T22005A01 is the worked example, and the difference between the
# two treatments is in the data, never in the preference.
#
# THIRTY-THREE OF THESE FIFTY-FOUR BOXES SHARE A LABEL WITH A SIBLING, and that
# is the honest cost of not inventing a hierarchy. This record is a PORTFOLIO x
# INSTRUMENT matrix: AEAT prints the portfolio head on its own row -- [00102]
# mantenidos para negociar, [00615] no destinados a negociacion, [00110]
# designados a valor razonable, [00623] con cambios en otro resultado global,
# [00631] a coste amortizado -- and then prints the instrument rows beneath it
# WITHOUT the portfolio name. Five boxes read "Valores representativos de
# deuda", five read "Prestamos y anticipos" and five read the same Pro memoria
# line, each belonging to a different portfolio.
#
# THE PORTFOLIO IS NOT DERIVED FROM POSITION. On T22005A01 the obvious adjacency
# rule -- parent is the nearest preceding unrepeated line -- was tried and proved
# WRONG IN FOUR PLACES. Here a numbering-block rule would be PARTIAL: the 00615,
# 00623 and 00631 runs are contiguous, while the 00102 and 00110 runs have gaps
# and their Pro memoria lines carry out-of-run numbers [00750] and [00751]. A
# rule that works for three blocks and not two is the "right most of the time"
# case this campaign has already refused once.
#
# CONSEQUENCE, STATED PLAINLY: the box number is the only disambiguator this
# data supports, and an operator surface that shows labels without numbers will
# present five identical rows on this page. That is a real cost, recorded rather
# than traded for an unverifiable tree.
