# Modelo 220 RECORD T22010000 -- a PER-ENTITY DETAIL record: transparencia fiscal internacional y doble imposicion interna
# declared entity by entity, each row a NIF plus 2 amount columns, followed by one
# TOTAL per column carrying AEAT's own box number.
#
# 5 casillas describe all 144 design fields. THE NUMBER SET DECIDES THE
# CASILLA SET, NOT THE SHAPE. The 44 detail blocks carry NO number and differ only
# by a printed row index, so ONE row is declared and a layout repeat writes the rest --
# the mechanism modelo 720's binding_record already uses. Declaring every block instead
# would mint 132 casillas for 3 declared values.
#
# THE STRIDE IS PROVEN, NOT ASSUMED. The detail run starts at @16, the second block
# starts at @59 so the stride is 43, and 16 + 43 x 44
# lands exactly on @1908 where the first total begins. Every block was compared
# field-for-field against the first with its row index removed: 1 distinct shape.
#
# COMPLETENESS COMPLEMENT, asserted in the generator rather than claimed here: every one
# of the 144 fields is authored, covered by the repeat, or named below as excluded,
