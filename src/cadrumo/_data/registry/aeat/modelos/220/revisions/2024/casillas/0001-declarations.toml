# Modelo 220 RECORD T220DID00 -- the DOCUMENTO DE INGRESO O DEVOLUCION: the payment
# slip of the consolidated declaration. Devengo and identificacion of the grupo, the three
# liquidacion figures it carries forward, the devolucion block with its account details,
# the ingreso block, the abono/compensacion of activos por impuesto diferido (art. 130
# LIS), and the cuota cero mark.
#
# 31 casillas describe all 41 design fields: 31 authored and
# 10 excluded, and the difference of those sets against the design is empty --
# asserted in the generator, not claimed here.
#
# THE APARTADO IS DERIVED FROM ITS NAME, NOT ITS NUMBER. AEAT numbers the apartados (1)
# to (7) inside the field descriptions, and the numbering DISAGREES with itself:
#   apartado name Devolucion appears as 4, 5
#   apartado number 5 appears as Devolucion, Ingreso
# Routing on the digit would have filed a devolucion field under ingreso. The generator
# asserts name-to-number consistency and reports every disagreement rather than picking
# one silently.
#
# FOUR BOXES CARRY A LETTER, NOT A FIVE-DIGIT NUMBER -- [D] importe a devolver, [I]
# importe a ingresar, [A] abono and [C] compensacion por conversion de activos por
# impuesto diferido. Each of the four appears EXACTLY ONCE across all 137 sheets of the
# design, in this record only, which is the shape of a per-record box identifier rather
# than a column marker. They are taken as AEAT's own number, the way modelo 604's
# alphabetic casillas already are. That is a judgement and it is recorded as one.
#
# THIS RECORD ECHOES BOXES DECLARED ELSEWHERE. Box 00562 (cuota integra del grupo) is
# already declared as T22009000:00562, and the design prints it in SEVEN records in all;
# 00621, 02800, 02806, 02809 and 02812 belong to T22009001, which is not yet authored.
# The (segmento, number) convention gives each record its own casilla, so ONE AEAT box
# becomes several casillas across the modelo. A layout must bind these to the SAME value
# rather than collect them twice, and nothing here enforces that yet.
#
# THE {DID_...} TOKENS IN THE DESCRIPTIONS ARE THE DESIGN'S OWN VARIABLE NAMES, not part
# of any label; they are kept in the verbatim comments below and stripped from the labels.
#
# AEAT PRINTS "Estado. Estado" on box 02800 -- the same jurisdiction twice in one
# description. Collapsed to one in the label, kept doubled in the comment. This is NOT the
# ambiguity that holds back T22009001: there two DIFFERENT boxes carry the identical
# description, so which is the foral column cannot be told; here one box says one thing
# twice.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T220DID00 tiles
# 1..720 exactly once with NO gap and NO PARTIAL OVERLAP, both checked.
#
# NOT MODELLED, deliberately: @1..@15, the modelo/pagina identifier envelope and the
# pagina-complementaria mechanics; @559+150 RESERVADO PARA LA ADMINISTRACION; @709+12
# Fin de Registro.
#
# NOT CLAIMED: no semantic_role is set on any casilla here, consistent with every other
# modelo 220 casilla. The registry already carries a role vocabulary these bank fields
# belong to -- devolucion_iban and devolucion_bic, used by modelo 308 -- and applying it
# should be one modelo-wide pass, not a role invented for one record.
#
# NOT CLAIMED: the liquidacion figures are DECLARED here, not carried. Nothing computes
# the devolucion or ingreso amount from them, and no formula, construct or binding is
# attached to any casilla in this record.
# @16+1 An. Cuenta corriente tributaria
# @17+4 Num. Devengo(2) - Ejercicio.{DID_ejer}
# @21+1 Num. Devengo (2). Tipo de ejercicio. {DID_tipo_ejer}
# @22+2 An. Devengo(2). Período Impositivo {DID_periodo}
# @24+8 Num. Devengo (2).Período Impositivo fecha de inicio {DID_fi_periodo} (AAAAMMDD)
# @32+8 Num. Devengo (2). Período Impositivo fecha fin {DID_ff_periodo} (AAAAMMDD)
# @40+9 An. Identificación (1) - NIF. {DID_id_NIF}
# @49+60 An. Identificación (1) - Apellidos o Razón Social. {DID_id_apellidos}
# @109+20 An. Identificación (1) - Nombre {DID_id_nombre}
# @129+17 Num. Liquidación (3) - Cuota íntegra del grupo [00562]. {DID_liq_CI}
# @146+17 N. Liquidación (3)- Resultado: Estado [00621]
# @163+17 N. Liquidación (3)- Opción de fraccionamiento art. 19.1 LIS. Líquido a ingresar incluido el 1er fraccionamiento del art. 19.1 LIS: Estado. Estado [02800]
# @180+1 An. Devolución (4) - Modalidad de devolución {DID_modalidad_devolucion}
# @181+17 Num. Devolución (4) - Importe a devolver. {DID_dev_importe} [D]
# @198+1 Num. Devolución(4) - Marca SEPA
# @199+34 An. Devolución (4) - Código IBAN - Bloque. {DID_dev_iban}
# @233+11 An. Devolución (4) - Código SWIFT-BIC. {DID_dev_swift_bic} (sólo Resto de paises/no SEPA)
# @244+70 An. Devolución (4) - Resto países- Banco/Name of the bank
# @314+35 An. Devolución (4) - Resto países - Dirección del banco/Address of the bank
# @349+30 An. Devolución (4) - Resto países - Ciudad/City
# @379+40 An. Devolución (4) - Resto países - País/Country
# @419+2 An. Devolución (5) - Resto países - Código País/Country Code
# @421+1 An. Ingreso (5) - Modalidad de ingreso. {DID_modalidad_ingreso}
# @422+17 Num. Ingreso (5) - Importe a ingresar. {DID_ing_efectivo} [I]
# @439+34 An. Ingreso (5) - Código IBAN - Bloque. {DID_ing_iban}
# @473+17 N. Abono/Compensación(6). Abono por conversión de activos por impuesto diferido (Art. 130 L.I.S.) [A]
# @490+17 N. Abono/Compensación(6). Compensación por conversión de activos por impuesto diferido (Art. 130 L.I.S.) [C]
# @507+17 N. Abono/Compensación(6). Resultado de conversión de AID tras regularización: Abono [02806]
# @524+17 N. Abono/Compensación(6). Resultado de conversión de AID tras regularización: Compensación [02809]
