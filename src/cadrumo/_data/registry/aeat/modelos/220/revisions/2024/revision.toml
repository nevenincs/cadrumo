[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22004D02 IS AUTHORED, 21 casillas describing all 31 \
design fields: the CUENTA TECNICA DEL SEGURO DE VIDA, otros gastos tecnicos and gastos del \
inmovilizado material y de las inversiones in the shape used by entidades aseguradoras, \
down to the closing subtotal [00350]. Revision total 1918 casillas over THIRTY-EIGHT of \
the design's 137 record sheets; 1757 numeric slots modelled. Suite, RUN SEQUENTIALLY: 8 \
failed, 5418 passed. Against the previous trustworthy run TWO FAILURES CLEARED and ONE \
ARRIVED, and the arrival is NOT this work: a modelo 100 renta scenario supplying a casilla \
the registry now declares bound to an INVENTORY binding, from a peer's feature landing \
during this iteration. The two that cleared were also that peer's, both reported here in \
earlier stamps. VERIFIED -- A 558-FAILURE RUN WAS INVALID AND WAS NOT REPORTED AS A \
RESULT. An earlier sequential run of the same suite returned 558 failed, and took 1 HOUR \
50 MINUTES against a normal 20 to 28. It was NOT believed: the three largest failing \
modules were re-run individually against the same tree and returned 48, 44 and 22 PASSES, \
and the whole suite re-run returned 8 failed. The cause is this worktree's backing share \
degrading under concurrent I/O while peers ran their own work, compounded by peer commits \
landing INSIDE the run, one of them into a test fixtures package. A slow run is evidence \
about the run, not about the code, and a failure list from a run whose wall time \
quadrupled is not a baseline. VERIFIED -- THE TWO SIBLING SEGURO RECORDS DO NOT NEST THE \
SAME CONCEPT THE SAME WAY, and neither was harmonised. \"Participacion en perdidas de \
entidades puestas en equivalencia\" hangs off \"Gastos del inmovilizado\" on the no-vida \
page T22004B02 ([00710]) and off \"Gastos de entidades incluidas en la consolidacion\" \
here ([00716]); AEAT also drops the article, printing \"Perdidas por enajenacion\" here \
against \"Perdidas por la enajenacion\" there. Each record's labels follow ITS OWN printed \
text. Harmonising them would assert that two lines AEAT wrote differently mean the same \
thing, which the design does not state. VERIFIED -- THIRTEEN OF THE TWENTY-ONE PARTS ARE \
PRINTED WORD FOR WORD ON THE SIBLING RECORD, and this record's locale manifest IMPORTS \
their translations from that record's table rather than retyping them. Two records \
printing the same Spanish must not drift into two different Catalans, and a single source \
is the only thing that guarantees it; retyping is how a truncation-derived key entered \
this campaign three times. VERIFIED -- THE HELP STRINGS FOLLOW THE REVISION'S OWN \
CONVENTION, INFERRED AND THEN CHECKED. A peer authored `help` across this modelo while \
this iteration ran; the locale CLI scaffolded TERSE placeholders for the new record, which \
would have left one record of thirty-eight spelling its help differently from the other \
thirty-seven. The convention was derived from the peer's entries and required to reproduce \
them EXACTLY: it reproduced 1260 committed strings across four locales before any of the \
84 new ones were written. An inference about another hand's convention is worth nothing \
until it is tested against their output. RECORDED -- A PEER'S UNCOMMITTED WORK WAS \
COMMITTED UNDER THIS AGENT'S MESSAGE. The commit carrying this record's labels also \
carried 315 `help` strings per locale that a peer had authored and not yet committed: a \
pathspec commit consumes the NAMED WORKING-TREE FILES, not only one's own edits. Nothing \
was lost and nothing reverted, but the attribution is wrong and the commit message \
describes half of what it contains. Recorded here because the message cannot be corrected \
without a history rewrite. RECORDED -- A STALE LOADER CACHE PRODUCED A CONFIDENT WRONG \
DIAGNOSIS mid-iteration: the authority reported all 21 of this record's labels in a \
different convention, and the conclusion drawn was that a peer had overwritten them. The \
file on disk was correct the whole time and git diff showed it. That is the second wrong \
conclusion of this campaign drawn from an instrument rather than the data, after grepping \
a line-wrapped YAML. When the finding is \"someone else changed my work\", the bytes must \
be checked before acting; the cost of being wrong there is an edit war. VERIFIED -- THE \
WHOLE CORPUS WAS RE-DERIVED FROM THE DESIGN: 1918 casillas across 45 fragments and 38 \
sheets, every segmento a real sheet, 1745 numeric box numbers PRINTED BY AEAT and none \
minted, 4 letter numbers, 74 byte spans resolving to a design field at exactly that offset \
and length, 38 sheets tiling once with no gap and no partial overlap, no repeated id and \
no repeated (segmento, number). ZERO PROBLEMS. VERIFIED -- EVERY MODELO 220 LOCALE KEY IS \
NOW PRESENT IN ALL FOUR CATALOGUES, label AND help, with zero missing reported by the \
scaffold check. NOTED -- FOUR LABELS CARRY AEAT'S SIGN MARKER \"(+ o -)\" with the \
accented o AEAT uses for \"or\". Kept verbatim; NOTHING here acts on the convention, and a \
consumer treating these as unsigned will be wrong. NOT CLAIMED -- 9846 OF THE 11603 \
(record, number) SLOTS REMAIN UNMODELLED; 1757 are modelled, zero orphaned. NOT CLAIMED -- \
NOTHING COMPUTES ANY OF IT. [00350] closes the cuenta tecnica and is DECLARED, not \
computed; nothing carries it into the cuenta no tecnica or the consolidated result, and no \
formula, construct or binding exists anywhere in this revision. NOT CLAIMED -- NO EXPORT \
LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. \
model_law_authority_scope remains inspection_only, so this stamp is made under the LOWER \
inspection bar and MUST be re-made if a layout lands. NOT CLAIMED -- T22009001, T22012A00 \
and T22012A10 remain deliberately held back on unresolved ambiguities. NOT CLAIMED -- \
LOCALES COMPLETE BUT UNAUDITED BY ANY SECOND PARTY: written and repaired throughout by the \
same agent. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
