[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22005A01 IS AUTHORED, 43 casillas, the ESTADO DE \
INGRESOS Y GASTOS RECONOCIDOS CONSOLIDADO EN EL EJERCICIO in its entidades de credito \
variant: the resultado consolidado, the otro resultado global split into elements that \
will not be reclassified and elements that may be, and the resultado global total \
attributed to minority interests and to the owners of the dominante. Revision total 1390 \
casillas over TWENTY-FIVE of the design's 137 records. Every box carries AEAT's own \
five-digit number, so not one number here is minted. I NEARLY INVENTED A HIERARCHY INTO A \
FILING-GRADE RECORD, AND THAT IS THE SUBSTANCE OF THIS REVIEW. NINETEEN of the 43 boxes \
share their printed text with a sibling: six read \"Transferido a resultados\", six \
\"Otras reclasificaciones\", five \"Ganancias o (-) perdidas de valor contabilizadas en el \
patrimonio neto\", two \"Activos no corrientes y grupos enajenables de elementos \
mantenidos para la venta\". On the printed modelo they are indented under different \
parents. THE DISENO DE REGISTRO DOES NOT CARRY THAT INDENTATION -- no level column, no \
validation, no components, only flat description text -- and the generator now ASSERTS \
that emptiness on the extracted fields, so a future workbook that does carry structure \
cannot be read blind under this fragment's claim. AN ADJACENCY RULE WAS TRIED AND REFUSED \
ON EVIDENCE. Taking the parent to be the nearest preceding non-repeated line is the \
obvious derivation and it LOOKS right; checking it against its own output showed it wrong \
in FOUR places: [00276] would take [00275] as parent when it is a SIBLING of it under \
[00274]; [00287] and [00288] would hang off [00286], which is itself a child of [00285]; \
[00292] would be read as a parent of [00293] when both are siblings under [00289]; and \
[00298] to [00301] would all hang off [00656] when [00298] is itself the parent of the \
other three. The rule was discarded rather than shipped because it agreed in most places. \
A derivation that is right most of the time is a worse outcome than no derivation, because \
the wrong attributions are invisible. VERIFIED -- SHARING A LABEL IS ESTABLISHED PRACTICE \
IN THIS REGISTRY AND NOT A DEFECT INTRODUCED HERE. Measured: modelo 200 carries 96 label \
texts used by more than one casilla, one of them 20 times, and modelo 100 carries 198, one \
of them 19 times. This corrects an assumption every previous stamp in this campaign \
carried: the revision-wide \"duplicate Spanish labels ZERO\" figure was a PROPERTY OF THE \
RECORDS AUTHORED SO FAR, never a required invariant, and reporting it as though it were \
would have pushed a false distinction into these labels. The revision now reports FOUR \
duplicated label texts covering NINETEEN casillas, which is exactly what the design \
duplicates and nothing else. VERIFIED -- THE CATALOGUE ASSERTS THE DUPLICATED SET EQUALS \
THE DESIGN'S, so a NEW collision still fails -- and it DID fire: a Hungarian translation \
collapsed [00277] and [00306], which AEAT separates by a definite article alone (\"de \
inversiones\" against \"de las inversiones\"). Hungarian marks that contrast on the noun \
phrase, so the leading article is dropped on one and kept on the other. Without that \
assertion the two would have become indistinguishable in one catalogue only. VERIFIED -- \
AEAT MISSPELLS \"valorados\" AS \"calorados\" on [00647]; corrected in the operator label \
by name, never by a general rule, and kept as printed in the fragment comment. VERIFIED -- \
COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all 53 design fields are 43 authored \
plus 10 excluded, and every excluded field is asserted to be envelope, reservado or fin de \
registro BY ITS OWN TEXT rather than by position. T22005A01 tiles 1..908 exactly once with \
NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 applies exactly the single \
ejercicio this revision claims. NOT CLAIMED -- 10346 OF THE 11570 (record, number) SLOTS \
REMAIN UNMODELLED across 108 of the 133 records that carry numbers; 1224 slots are \
modelled, zero orphaned. A coverage figure is only true against the extractor of the day \
it was measured. NOT CLAIMED -- THE AGGREGATES ARE DECLARED, NOT COMPUTED. [00273] otro \
resultado global, [00274] and [00280] its two halves, and [00303] the resultado global \
total are sums of the lines around them, and NO formula, construct or binding expresses \
that. Every box is a manual input. NOT CLAIMED -- THE NESTING IS NOT MODELLED AT ALL. \
Because the design does not state it and it was not invented, this record's casillas are a \
FLAT list. An operator distinguishes two boxes reading \"Transferido a resultados\" by \
their number, which is the only disambiguator this data supports. If a layout or a UI ever \
needs the tree, it must come from a source that actually carries it, not from this record. \
NOT CLAIMED -- THE STANDING CROSS-RECORD HAZARD IS UNCHANGED. Box 00562 is declared twice, \
as T22009000:00562 and T220DID00:00562, and the design prints some numbers in as many as \
seven records. A layout must bind such casillas to the SAME value rather than collect them \
twice, and NOTHING ENFORCES THAT TODAY. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands. NOT CLAIMED -- T22009001, T22012A00 and T22012A10 remain deliberately \
held back, the first for two byte-identical descriptions whose jurisdiction the design \
does not state, the others for colliding label keys. NOT CLAIMED -- LOCALES COMPLETE BUT \
UNAUDITED: the 43 labels were translated by the same agent that authored the casillas and \
reviewed by nobody else; the catalogues are unaccented ASCII, asserted. All 1390 casillas \
resolve a non-null label in es, en, ca and hu, counted by VALUE rather than by key. NOT \
CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
