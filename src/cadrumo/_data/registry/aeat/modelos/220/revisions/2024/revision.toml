RECORD LANDED: 1897 casillas across 44 fragments and 37 sheets, every segmento a real \
sheet, 1724 numeric box numbers PRINTED BY AEAT and none minted, 4 letter numbers, 74 byte \
spans each resolving to a design field at exactly that offset and length, 37 sheets tiling \
once with no gap and no partial overlap, no repeated id and no repeated (segmento, \
number). ZERO PROBLEMS. VERIFIED -- TWO SPLIT LIGATURES REPAIRED HERE, \"cuentas fi \
nancieras\" and \"inversiones fi nancieras\", rejoined only on 22 attestations of \
\"financieras\" elsewhere in the design, and one missing parent-child separator repaired \
