[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22007M00 IS AUTHORED, 27 casillas, the LIMITACION EN \
LA DEDUCIBILIDAD DE GASTOS FINANCIEROS of the grupo fiscal: the first limit of art. 16.5, \
67 b) and 83 LIS for gastos financieros derived from debt taken on to acquire \
participaciones, then the general 30 per cent del beneficio operativo limit of art. 16.1 \
and 16.2, lettered a) to r) with j1) to j6) and a closing total. Revision total 1326 \
casillas over TWENTY-THREE of the design's 137 records. This is a FLAT record: no \
repeating block, no stride, and EVERY ONE of its 27 boxes carries AEAT's own five-digit \
number, so not one number here is minted. VERIFIED -- THE SECTION IS DERIVED FROM THE \
HEADING AEAT PRINTS ON EACH LINE, cut at its first \"LIS.\", and the two headings found \
are asserted to be exactly two and to partition the record CONTIGUOUSLY at @118 -- an \
interleaved heading refuses rather than being filed under whichever came first. AEAT \
writes the first heading as \"art.16.5\" with no space and the second as \"art. 16.1\" \
with one; both are transcribed as printed. NOTHING IS NORMALISED FOR OUTPUT IN THIS \
RECORD, and that is the correction to the defect the previous two stamps recorded. In each \
of those a punctuation rule written to make two strings compare equal reached a third \
string that was already correct -- \"DT 24.5 LIS\" became \"DT 24. 5 LIS\", then \
\"N.I.F.\" became \"N. I. F.\". The cause is normalising for OUTPUT what only needed \
normalising for COMPARISON. This record needs no comparison at all, so the label is the \
design's own text with only the box number and the heading removed, and no spacing rule \
runs over it. VERIFIED -- AEAT EMITS THE REAL U+FB01 LIGATURE CHARACTER in 21 of these 27 \
descriptions -- not the broken \"fi \" spacing already transcribed on families 07, 09 and \
16, but the single codepoint -- and is INCONSISTENT about it WITHIN THIS ONE RECORD: \
\"gastos U+FB01nancieros\" on some lines and plain \"gastos financieros\" on others. \
Expanded to \"fi\" in the operator labels, kept as emitted in the verbatim comments, and \
the count is reported on the fragment's own face. A search for \"financieros\" over the \
raw design would have missed 21 of these lines. NOTED -- THE DESCRIPTIONS CARRY AEAT'S OWN \
ARITHMETIC IN SQUARE BRACKETS THAT ARE NOT BOX NUMBERS: \"(= [c1+f])\", \"(<= [b], \
[a=c1+c2], >= 0)\", \"(= 30%* [j1-j2-j3-j4+j5-j6]\". Those letters name OTHER LINES OF \
THIS RECORD, and the extractor takes only the five-digit bracket. The annotations are kept \
in all four catalogues rather than translated away, because they are the record's own \
cross-reference notation. THEY ARE ALSO NOT WELL FORMED: line d) closes a parenthesis with \
a square bracket, \"([b>=c1+d+e], >= 0]\", and line j) never closes its parenthesis at \
all. ANY FUTURE ATTEMPT TO COMPILE THESE INTO FORMULAS MUST TREAT THEM AS PROSE REQUIRING \
HUMAN ADJUDICATION, not as a parseable grammar. NOTED -- TWO OF THE 27 NUMBERS FALL \
OUTSIDE THE RECORD'S OWN RUN. Twenty-five are 03196 to 03220 consecutively; j6) is 02219 \
and m) is 02220, from a different block entirely. Recorded because a reader scanning for a \
contiguous range would conclude two boxes were missing. VERIFIED -- COMPLETENESS \
COMPLEMENT ASSERTED IN THE GENERATOR: all 37 design fields are 27 authored plus 10 \
excluded, and every excluded field is asserted to be envelope, reservado or fin de \
registro BY ITS OWN TEXT rather than by position. T22007M00 tiles 1..636 exactly once with \
NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 applies exactly the single \
ejercicio this revision claims. NOT CLAIMED -- 10410 OF THE 11570 (record, number) SLOTS \
REMAIN UNMODELLED across 110 of the 133 records that carry numbers; 1160 slots are \
modelled, zero orphaned. A coverage figure is only true against the extractor of the day \
it was measured. NOT CLAIMED -- NOTHING HERE COMPUTES ANY OF IT. This record is a chain of \
derived quantities that AEAT itself annotates as arithmetic -- g = c1+f, i = g-h, j = 30% \
of a six-term expression, the total = c2+n2 -- and NOT ONE of those relations is expressed \
as a formula, construct or binding. Every box is a manual input. A reader should not \
mistake a complete limitation record for a working limitation. NOT CLAIMED -- THE STANDING \
CROSS-RECORD HAZARD IS UNCHANGED. Box 00562 is declared twice, as T22009000:00562 and \
T220DID00:00562, and the design prints some numbers in as many as seven records. A layout \
must bind such casillas to the SAME value rather than collect them twice, and NOTHING \
ENFORCES THAT TODAY. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. \
The modelo cannot be filed. model_law_authority_scope remains inspection_only, so this \
stamp is made under the LOWER inspection bar and MUST be re-made if a layout lands. NOT \
CLAIMED -- T22009001, T22012A00 and T22012A10 remain deliberately held back, the first for \
two byte-identical descriptions whose jurisdiction the design does not state, the others \
for colliding label keys. NOT CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: the 27 labels \
were translated by the same agent that authored the casillas and reviewed by nobody else. \
These are the longest and most technical labels yet written for this modelo and they were \
not read back by anyone. The catalogues are unaccented ASCII, asserted, which caught 21 \
accented Hungarian strings in this batch. All 1326 casillas resolve a non-null label in \
es, en, ca and hu, counted by VALUE rather than by key, and duplicate Spanish labels \
across the revision are ZERO. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, \
not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
