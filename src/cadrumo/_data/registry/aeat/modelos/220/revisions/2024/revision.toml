[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T220DID00 IS AUTHORED, 31 casillas, the DOCUMENTO DE \
INGRESO O DEVOLUCION: the payment slip of the consolidated declaration, carrying devengo \
and identificacion of the grupo, three liquidacion figures, the devolucion block with its \
account details, the ingreso block, the abono and compensacion por conversion de activos \
por impuesto diferido (art. 130 LIS), and the cuota cero mark. Revision total 1258 \
casillas over SIXTEEN of the design's 137 records. THE APARTADO IS DERIVED FROM ITS NAME, \
NOT ITS NUMBER, and that mattered. AEAT numbers the apartados (1) to (7) inside the field \
descriptions and the numbering DISAGREES WITH ITSELF: the field at @419, the bank country \
code, is printed as \"Devolucion (5)\" although the devolucion block is (4) and (5) is \
Ingreso. Routing on the digit would have filed a devolucion field under ingreso. The \
generator asserts name-to-number consistency in BOTH directions and reports every \
disagreement rather than resolving one silently; it also refuses to run if the \
disagreement ever vanishes, so a corrected workbook cannot leave a stale claim standing. \
VERIFIED -- FOUR BOXES CARRY A LETTER, NOT A FIVE-DIGIT NUMBER: [D] importe a devolver, \
[I] importe a ingresar, [A] abono and [C] compensacion por conversion de AID. Each of the \
four was counted across ALL 137 sheets of the design and appears EXACTLY ONCE, in this \
record only, which is the shape of a per-record box identifier and not a column marker. \
They are taken as AEAT's own number, the way modelo 604's alphabetic casillas already are. \
That is a judgement and the fragment records it as one. CORRECTED BEFORE SHIPPING -- THE \
BRACKET IS NOT ALWAYS LAST. Box 00562 prints as \"Cuota integra del grupo [00562]. \
{DID_liq_CI}\", with the design's own variable name after the bracket, and an end-anchored \
search silently minted a byte-span number for a box AEAT numbers. Found by reading the \
generated output against the design, NOT by an assertion; an assertion now refuses any \
description with an unread bracket. This is the third defect class in a row that only \
surfaced because the output was read back, and the durable form of the fix is the same \
each time: turn the reading into a check. VERIFIED -- THE LABELS CARRY THEIR APARTADO \
because two fields read exactly \"Codigo IBAN - Bloque\", one under devolucion and one \
under ingreso; without the apartado an operator cannot tell which account a value belongs \
to. The within-record duplicate-label assertion is what surfaced that pair, and it stays. \
VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all 41 design fields are 31 \
authored plus 10 excluded, and the difference against the design is empty. The type table \
is asserted to cover exactly the authored offsets, so a field added or removed cannot pass \
untyped. T220DID00 tiles 1..720 exactly once with NO gap and NO PARTIAL OVERLAP. \
Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. \
NOTED -- THIS RECORD ECHOES BOXES DECLARED ELSEWHERE, and that is a limitation of the \
convention rather than a defect in the record. Box 00562 is now declared TWICE in this \
revision, as T22009000:00562 and T220DID00:00562, and the design prints it in SEVEN \
records in all; 00621, 02800, 02806, 02809 and 02812 also belong to T22009001, which is \
not yet authored. The (segmento, number) convention -- modelo 200's, adopted here -- gives \
each record its own casilla, so ONE AEAT box becomes several casillas across the modelo. A \
layout MUST bind these to the same value rather than collect them twice, and NOTHING \
ENFORCES THAT TODAY. NOT CLAIMED -- 10447 OF THE 11570 (record, number) SLOTS REMAIN \
UNMODELLED across 117 of the 133 records that carry numbers; 1123 slots are modelled. Zero \
authored slots are orphaned: every one is still evidenced by the current extraction. As \
the previous stamp recorded, a coverage figure is only true against the extractor of the \
day it was measured. NOT CLAIMED -- THE LIQUIDACION FIGURES ARE DECLARED HERE, NOT \
CARRIED. Nothing computes the devolucion or the ingreso amount from them, and no formula, \
construct or binding is attached to any casilla in this record. A payment slip whose \
amounts are all manual inputs is not a payment slip the application can produce. NOT \
CLAIMED -- NO semantic_role IS SET, consistent with every other modelo 220 casilla. The \
registry already carries a role vocabulary these bank fields belong to -- devolucion_iban \
and devolucion_bic, used by modelo 308 -- and applying it should be one modelo-wide pass, \
not a role invented for one record. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands. NOT CLAIMED -- T22009001, T22012A00 and T22012A10 remain deliberately \
held back, the first for two byte-identical descriptions whose jurisdiction the design \
does not state, the others for colliding label keys. NOT CLAIMED -- LOCALES COMPLETE BUT \
UNAUDITED: the 31 labels were translated by the same agent that authored the casillas and \
reviewed by nobody else; the catalogues are unaccented ASCII, now asserted rather than \
merely intended after one accented Hungarian string slipped past. All 1258 casillas \
resolve a non-null label in es, en, ca and hu, counted by VALUE rather than by key, and \
duplicate Spanish labels across the revision are ZERO. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
