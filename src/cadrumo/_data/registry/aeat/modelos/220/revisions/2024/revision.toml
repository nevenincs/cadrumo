[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the labels \
being repaired. THIS ITERATION AUTHORED NO NEW RECORD. It continued paying off the \
diacritic defect this campaign introduced, moving from Spanish to Catalan. Revision \
unchanged at 1897 casillas over thirty-seven of the design's 137 record sheets. Suite, RUN \
SEQUENTIALLY because a parallel run raced the loader cache and reported three failures \
that all pass in isolation: 9 failed, 5397 passed. The one arriving failure is NOT this \
work -- test_binding_source_kind_taxonomy reports BindingSourceKind.INVENTORY declared by \
no registry binding and absent from the deferred carve-outs, from a peer's \
inventory-resolver commit landing during this iteration. Reported, not fixed: it is \
another hand's work still in flight. CORRECTED -- 1790 OF THE 1879 CATALAN LABELS NOW \
CARRY THEIR DIACRITICS, from 1879 unaccented down to 87. Spanish was repairable from the \
design's own vocabulary because the design IS Spanish and the source of truth was still in \
the repository. CATALAN HAS NO SUCH DONOR, so every accent here is a HAND DECISION over \
the token inventory: 859 distinct ASCII tokens were enumerated and 146 of them decided, \
covering 5436 occurrences. Two properties keep that honest. First, THE SAME INVARIANT AS \
THE SPANISH PASS is asserted for every label AND for every table entry before anything is \
rewritten -- deaccenting the result must reproduce the input EXACTLY -- so a table entry \
can only add a diacritic and can never respell a word. Second, EVERY TABLE ENTRY MUST \
FIRE: an entry that is never reached is removed, because a decision that is never checked \
is the defect this campaign has now found three times, in header prose, in a hand-decision \
table, and here. VERIFIED -- THE 87 LABELS LEFT WITHOUT A DIACRITIC CONTAIN NO \
ACCENT-BEARING CATALAN WORD. Their 137 distinct tokens were read individually and every \
one is correct Catalan as written. This is the end state, not a residue, and an unchanged \
label had to be SHOWN correct rather than assumed correct, because \"the table skipped \
it\" and \"it was already right\" are indistinguishable from outside. VERIFIED -- NO \
CATALAN LABEL IS IDENTICAL TO ITS SPANISH, checked by value across all 1897. CORRECTED -- \
\"hoja\" IS SPANISH AND HAD NEVER BEEN TRANSLATED, on 473 Catalan labels. It sat inside \
the composed record prefix, which is the largest single untranslated fragment in the \
catalogue and exactly what a parity gate counting KEYS cannot see: every key was present, \
every value non-null, and 473 of them carried a Spanish word. This was found by \
enumerating the token inventory, not by any gate. CORRECTED -- THE PUNT VOLAT WAS LOST \
TWICE, to a doubled L in \"Installacions\" and to a HYPHEN in \"intel-lectual\". Neither \
is a diacritic, so neither could be repaired by the accent pass and both are declared \
substitutions. The Catalan ordinals were written \"1o/2o/3o\" from the Spanish; Catalan \
takes \"1r/2n/3r\", which is NOT the masculine ordinal indicator the Spanish repair used, \
so the same cause needed a different fix in each language. CORRECTED -- \"Es entitat\" \
needed the accent that separates the verb from the reflexive pronoun, and \"netes mes \
l'addicio\" needed the one that separates \"more\" from \"month\". Both tokens are ABSENT \
from the accent table on purpose, because both senses occur in these labels and a table \
cannot tell them apart; only the specific occurrences were changed. VERIFIED -- A DECLARED \
FIRING COUNT CAUGHT A REAL SEQUENCING BUG in this very iteration: one substitution \
targeted text the accent pass had already rewritten, fired ZERO times against a declared \
one, and refused. Written without the count it would have silently done nothing and the \
defect would have shipped looking repaired. NOT CLAIMED, AND STILL OWED -- HUNGARIAN \
CARRIES THE SAME DEFECT AND IS NOT REPAIRED HERE. 1848 of 1897 Hungarian labels carry no \
non-ASCII character and Hungarian requires diacritics throughout, including the long-vowel \
pairs o-vs-o-double-acute and u-vs-u-double-acute that carry meaning. There is no donor \
for it either, its token inventory is 1031 distinct ASCII tokens, and it is owed hand \
work. Recorded as known-wrong, not acceptable. NOT CLAIMED -- THE .help KEYS REMAIN \
UNAUTHORED across this entire revision in all four locales. NOT CLAIMED -- 9873 OF THE \
11603 (record, number) SLOTS REMAIN UNMODELLED across 95 of the 134 records that carry \
numbers; 1730 slots are modelled, zero orphaned, unchanged by this iteration. NOT CLAIMED \
-- NOTHING COMPUTES ANY OF IT. No formula, construct or binding exists anywhere in this \
revision; two complete balance sheets sit in it and neither balances. NOT CLAIMED -- NO \
EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. \
model_law_authority_scope remains inspection_only, so this stamp is made under the LOWER \
inspection bar and MUST be re-made if a layout lands. NOT CLAIMED -- T22009001, T22012A00 \
and T22012A10 remain deliberately held back on unresolved ambiguities. NOT CLAIMED -- \
LOCALES STILL UNAUDITED BY ANY SECOND PARTY: every label in all four catalogues was \
written and now repaired by the same agent, reviewed by nobody else. All 1897 casillas \
resolve a non-null label in es, en, ca and hu, counted by VALUE rather than by key -- and \
this iteration is the demonstration that a non-null value can still be the wrong language. \
NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
