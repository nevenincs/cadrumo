[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22012000 IS AUTHORED, 180 casillas, EVERY ONE carrying \
a real AEAT box number. Revision total 275 casillas. The record holds the deducciones por \
doble imposicion: interna bajo el RDLEG 4/2004, interna bajo la DT 23a LIS, internacional \
bajo el RDLEG 4/2004, internacional bajo la LIS, and the tipo de gravamen del ejercicio. \
This is the THIRD of the design's 137 records to be authored, and the FIRST on this modelo \
in which every casilla is numbered -- T22001000 numbered twelve of seventy-seven, and \
T22002000 numbered none at all because it prints none. The record is a numbered grid of \
179 money cells of seventeen positions plus the tipo de gravamen, with a distinct AEAT \
number on every cell, so there is no repetition to collapse and no slug anywhere in it. \
VERIFIED -- THE IDS ARE DERIVED FROM A CHECKED DECOMPOSITION, NOT A GUESS, and the \
checking is the substance of this review. The 180 field descriptions were decomposed into \
four closed axes -- family with 5 values, group with 6, scope with 22 and column with 6 -- \
and the decomposition was verified two ways BEFORE any id was minted: every one of the 180 \
resolves into known vocabulary with NOTHING unresolved, and the resulting four-part keys \
are UNIQUE across all 180 with no collision. THE COLLISION CHECK EARNED ITS KEEP \
IMMEDIATELY. A first attempt used only three axes and produced SEVEN COLLIDING KEYS \
covering NINETEEN numbers -- ids that would have merged distinct cells and silently \
mis-declared them. The missing axis was the group qualifier AEAT prints before a colon, \
\"DI interna ejerc. anteriores:\", \"DI juridica: Imp. soportado por el contribuyente \
(art. 31 LIS)\", \"DI economica: Dividendos y part. en beneficios (art. 32 LIS)\" and \
\"Total 2024\". Without that check the nineteen would have shipped as wrong ids that \
nothing downstream would have flagged. VERIFIED -- A THIRD, INDEPENDENT CONFIRMATION: the \
180 Spanish labels are composed from the same four axes and are ALL DISTINCT, zero \
duplicates. Two casillas describing the same thing would have surfaced there, and none \
did. VERIFIED -- AEAT MISSPELLS ITS OWN SECTION HEADING FOUR WAYS IN THIS RECORD: \"RDLEG \
4/2004\", \"RDLEG4/2004\", \"RDL 4/2004\" and \"RDLRG 4/2004\"; and it twice truncates a \
column label, printing \"licado en esta liquidacion\" for \"Aplicado en esta \
liquidacion\". All four spellings and both truncations are MATCHED DELIBERATELY rather \
than corrected, so the decomposition reflects what the design actually says. The casilla \
labels use the corrected form, because a label is read by an operator while the match is \
read against AEAT. This is a transcription judgement and is flagged as one. VERIFIED -- \
180 design numbers, 180 authored, ZERO missing and ZERO invented; every one of the \
record's 190 fields is either authored or explicitly excluded with a stated reason, so \
nothing is unaccounted for. T22012000 tiles 1..3226 exactly once with NO gap and NO \
PARTIAL OVERLAP, both checked. VERIFIED -- YEAR-CLEAN: aeat-dr-220-2024 applies from \
2024-01-01 to 2024-12-31, exactly the single ejercicio this revision claims. VERIFIED -- \
TYPES: every cell is money except the tipo de gravamen at @3059+6, which is a rate and is \
typed ratio. NOT CLAIMED -- THESE CASILLAS DECLARE THE DEDUCTION GRID; NONE OF THEM \
COMPUTES IT. No formula, no construct and no binding is attached to any of the 180, so \
nothing here reconciles a carried-forward deduction against the amount applied, and \
nothing validates that the pendiente-futuro column equals pendiente minus aplicado. A \
reader should not mistake a complete set of declared cells for a modelled calculation. NOT \
CLAIMED -- 134 OF THE DESIGN'S 137 RECORDS REMAIN UNAUTHORED, and 7412 of its 7604 AEAT \
box numbers remain unmodelled. The 192 modelled are the twelve caracteres flags on \
T22001000 and the 180 here. Progress on this modelo should not be read from the casilla \
count: 275 casillas describe three records out of 137. NOT CLAIMED -- NO EXPORT LAYOUT AND \
NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope \
remains inspection_only, so this stamp is made under the LOWER inspection bar and MUST be \
re-made if a layout lands and lifts the derived scope to filing. NOT CLAIMED -- LOCALES \
COMPLETE BUT UNAUDITED: 720 strings across es/en/ca/hu, composed from the four checked \
axes rather than from free text, so a label can only be wrong if one of four small \
vocabularies is wrong; all 275 label keys verified non-null by counting VALUES rather than \
keys. The translations were not reviewed by a second party, and the Spanish is unaccented \
ASCII, a known presentation limitation. NOT CLAIMED -- independent_check_coverage is n/a: \
NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
