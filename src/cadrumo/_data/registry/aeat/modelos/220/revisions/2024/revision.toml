[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22005A02 IS AUTHORED, 37 casillas, the second ESTADO \
DE INGRESOS Y GASTOS RECONOCIDOS CONSOLIDADO EN EL EJERCICIO: the resultado consolidado, \
the otros ingresos y gastos reconocidos broken down by concept with the valuation, \
transfer and reclassification lines of each, the impuesto sobre beneficios, and the total \
attributed to the entidad dominante and to socios externos. Revision total 1427 casillas \
over TWENTY-SIX of the design's 137 records. Every box carries AEAT's own five-digit \
number, so not one number here is minted. VERIFIED -- THIS RECORD PRINTS ITS OWN HIERARCHY \
AND ITS SIBLING DOES NOT, and the two were treated differently BECAUSE OF THE DATA and not \
by preference. Every child line here carries its parent's name inline, so all 37 labels \
are distinct on AEAT's own text. T22005A01 was authored FLAT last iteration for exactly \
the opposite reason: nineteen of its boxes share their printed text, the design carries no \
indentation, and a positional derivation was tried and refused after it proved wrong in \
four places. Reading these two stamps together is the point: the same campaign produced a \
nested record and a flat one from one family, and the difference is evidenced in each \
design rather than chosen. VERIFIED -- AEAT IS INCONSISTENT ABOUT THE PARENT-CHILD \
SEPARATOR IN THREE WAYS INSIDE ONE GROUP: a period and a space in most lines, a BARE SPACE \
at @84 and @101, and NOTHING AT ALL at @67, where the text reads \"Activos financieros \
disponibles para la ventaGanancias y perdidas por valoracion\". A separator is inserted \
ONLY where the prefix is an ATTESTED STANDALONE LINE OF THIS SAME RECORD -- box 00384 \
prints \"Activos financieros disponibles para la venta\" on its own -- so the split point \
is evidence from the record and not a judgement about where the phrase ends. Three repairs \
applied, each reported on the fragment's face. CORRECTED BEFORE SHIPPING -- AN ATTESTATION \
VOCABULARY DRAWN FROM THE CORPUS BEING REPAIRED WILL ATTEST THE DAMAGE. Last iteration's \
ligature repair rejoins a split only when the joined token is attested elsewhere in the \
design. Here AEAT breaks \"reclasificaciones\" as \"reclasifi caciones\" in several \
sheets, so a naive word count records \"reclasifi\" as a word eleven times over, the \
left-side guard concluded it was already a word, and the repair silently did nothing. TWO \
counts are now kept: every token, and only those tokens seen in a position that CANNOT be \
the left half of a split. The rejoin also had to stop anchoring on a token boundary: \
T22005A00's split was \"instrumentos fi nancieros\", where the fragment BEGINS at the \
ligature, while this record's sits MID-WORD, and a boundary-anchored rule finds the first \
and silently misses the second. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE \
GENERATOR: all 47 design fields are 37 authored plus 10 excluded, and every excluded field \
is asserted to be envelope, reservado or fin de registro BY ITS OWN TEXT rather than by \
position. T22005A02 tiles 1..806 exactly once with NO gap and NO PARTIAL OVERLAP. \
Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. \
NOTED -- THE SECTOR ATTRIBUTION IS INFERRED AND IS MARKED AS SUCH ON THE FRAGMENT. AEAT \
prints the SAME heading on this record and on T22005A01 and names no sector on either. The \
section slugs read \"aseguradoras\" and \"credito\" because this record's vocabulary is \
that of the insurance accounting plan and the sibling's that of the credit-institution \
one. THAT READING IS NOT STATED BY THE DESIGN, so the operator-facing labels keep AEAT's \
heading unchanged and claim no sector at all. NOTED -- THE CROSS-RECORD HAZARD HAS NOW \
SURFACED IN THE LABELS THEMSELVES. Box 00500 is declared in both this record and \
T22005A01, and because AEAT gives both records the same heading the two casillas carry an \
IDENTICAL operator label. That is correct -- it is one declared value on two alternative \
pages -- and it is the clearest demonstration yet of the standing hazard every stamp in \
this campaign has recorded: a layout MUST bind such casillas to the SAME value rather than \
collect them twice, and NOTHING ENFORCES THAT TODAY. NOT CLAIMED -- 10309 OF THE 11570 \
(record, number) SLOTS REMAIN UNMODELLED across 107 of the 133 records that carry numbers; \
1261 slots are modelled, zero orphaned. A coverage figure is only true against the \
extractor of the day it was measured. NOT CLAIMED -- THE AGGREGATES ARE DECLARED, NOT \
COMPUTED. [00383], each concept head and [00412] are sums of the lines beneath them, and \
NO formula, construct or binding expresses that. Every box is a manual input. NOT CLAIMED \
-- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. \
model_law_authority_scope remains inspection_only, so this stamp is made under the LOWER \
inspection bar and MUST be re-made if a layout lands. NOT CLAIMED -- T22009001, T22012A00 \
and T22012A10 remain deliberately held back, the first for two byte-identical descriptions \
whose jurisdiction the design does not state, the others for colliding label keys. NOT \
CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: the 37 labels were composed from 13 parent \
concepts and 6 child suffixes translated once each, by the same agent that authored the \
casillas and reviewed by nobody else; the catalogues are unaccented ASCII, asserted. All \
1427 casillas resolve a non-null label in es, en, ca and hu, counted by VALUE rather than \
by key. The revision now carries FIVE duplicated label texts covering TWENTY-ONE casillas: \
four are AEAT's own repeats inside T22005A01 and the fifth is box 00500 declared in two \
records. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
