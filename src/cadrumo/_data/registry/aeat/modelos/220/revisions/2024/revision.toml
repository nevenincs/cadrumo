[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22002000 IS AUTHORED, 16 casillas: the entidad \
dominante block and ONE entidad dependiente row. Revision total 95 casillas. This is the \
SECOND of the design's 137 records to carry a casilla-to-position mapping. VERIFIED -- THE \
RECORD CARRIES TWENTY DEPENDIENTE BLOCKS AND THIS FRAGMENT DECLARES ONE ROW, which is the \
decision worth reading before anyone changes it. The block count is arithmetic rather than \
an estimate: blocks of nine fields begin at @128 with a stride of 122 and end exactly at \
@2568 where the reservado run starts, so (2568 minus 128) divided by 122 is 20 exactly. \
VERIFIED -- THE RECORD PRINTS NO BOX NUMBERS AT ALL. Every one of its 197 fields is \
unnumbered, so each casilla takes the sheet-qualified byte span modelo 181 established, \
and the twenty blocks are distinguished in AEAT's design only by an ordinal appended to \
each description -- \"NIF. 1\", \"NIF. 2\" -- never by a box number. THAT IS PRECISELY WHY \
ONE ROW IS DECLARED. The byte-span number is OUR convention, not AEAT's. Minting twenty \
sets of it would assert 180 distinct declared boxes where the design declares one \
repeating row of nine fields, and would put our own invention on the same footing as \
AEAT's numbering everywhere else in this registry. A casilla is offset-free, carrying a \
number and never a position, so one row is the complete description of what a member \
entity declares; the twenty repetitions are a LAYOUT concern for the repeat mechanism, as \
modelo 720's binding_record does. THE RULE NOW HOLDS ACROSS TWO MODELOS AND FOUR RECORDS: \
THE NUMBER SET DECIDES, NOT THE REPETITION. Modelo 036 Pag. 9 and Pag. 10 were authored \
block by block because each of their blocks prints DISTINCT AEAT numbers, so collapsing \
them would have lost real numbers; modelo 036 Pag. 8 and this record were authored as one \
row because their blocks do not. Where AEAT numbers the rows apart, author them apart; \
where it does not, author the row. NOT CLAIMED, AND RECORDED IN THE FRAGMENT AS A WARNING \
TO A LAYOUT AUTHOR: a layout that maps these nine dependiente casillas once, at @128 to \
@249, leaves NINETEEN blocks unfilled. The repeat is required, stride 122, count 20, \
starting at @128. VERIFIED -- COMPLETENESS. Every one of the record's 197 fields is either \
authored (16), covered by the nineteen repeat blocks (171), or explicitly excluded with a \
stated reason (10) -- the modelo and pagina identifier envelope, the pagina-complementaria \
mechanics, the administration reservado run and the end-of-record marker. Nothing is \
unaccounted for. Zero length mismatches against the design. T22002000 tiles 1..2729 \
exactly once with NO gap and NO PARTIAL OVERLAP, both checked. VERIFIED -- YEAR-CLEAN. \
aeat-dr-220-2024 applies from 2024-01-01 to 2024-12-31, exactly the single ejercicio this \
revision claims, so no casilla carries a byte span for a year the design does not \
evidence. NOT CLAIMED -- 135 OF THE DESIGN'S 137 RECORDS REMAIN UNAUTHORED, and 7592 of \
its 7604 distinct AEAT box numbers remain unmodelled. The twelve modelled numbers are the \
tipo-de-grupo caracteres flags on T22001000; THIS RECORD ADDS NO AEAT NUMBER AT ALL, \
because it prints none. Progress on this modelo should not be read from the casilla count: \
95 casillas describe two records out of 137. NOT CLAIMED -- NO EXPORT LAYOUT AND NO \
CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands and lifts the derived scope to filing. NOT CLAIMED -- NO MONEY-CLOSURE \
CASILLA IS DECLARED anywhere in this revision. The liquidacion records of the group \
declaration are untouched, so nothing here supports a computed result. NOT CLAIMED -- \
LOCALES COMPLETE BUT UNAUDITED: 64 strings across es/en/ca/hu, all 95 label keys verified \
non-null by counting VALUES rather than keys, but the translations were not reviewed by a \
second party. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
