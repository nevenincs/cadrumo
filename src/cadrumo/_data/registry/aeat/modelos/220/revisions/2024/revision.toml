[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22004B00 IS AUTHORED, 35 casillas describing all 45 \
design fields: the financial half of OPERACIONES CONTINUADAS in the cuenta de perdidas y \
ganancias consolidada -- ingresos and gastos financieros, variacion de valor razonable, \
diferencias de cambio, deterioro y resultado por enajenaciones de instrumentos financieros \
-- down through RESULTADO FINANCIERO and RESULTADO ANTES DE IMPUESTOS to the RESULTADO \
CONSOLIDADO DEL EJERCICIO and its attribution. Revision total 1985 casillas over FORTY of \
the design's 137 record sheets; 1812 numeric slots modelled. NOT REPAIRED, RECORDED -- ONE \
BOX NUMBER IS PRINTED WITH AN EXTRA LEADING ZERO. [000304] is six digits where every other \
box on this record is five, and it sits between [00301] and [00305]. IT IS TRANSCRIBED \
EXACTLY AS PRINTED. The evidence that AEAT meant 00304 is strong -- the immediate \
neighbours, and 00304 being a real box number elsewhere in this modelo -- but a casilla \
number is an IDENTIFIER, the campaign's invariant is that it is transcribed and never \
minted or corrected, and the corpus verifier checks precisely that every number is one \
AEAT printed. Writing 00304 would be this agent deciding what AEAT meant on a filing-grade \
identifier, which is the fabrication this campaign refuses. VERIFIED -- THE SAME DEFECT \
AFFECTS EIGHT BOXES ACROSS FOUR RECORDS, not one: [000304], [000507], [000742], [006308], \
[006309], [006310], [007504] and [007656] in T22004B00, T22012B20, T22014004 and \
T22014B20. In five of the eight the immediate neighbours prove the intended five-digit \
reading -- [007504] sits between [07503] and [07505] -- and this was established by \
enumerating every six-digit bracket in the design rather than by generalising from the one \
in hand. The other three records are named in the fragment so whoever authors them meets \
the decision already framed. CORRECTED -- THE GENERATOR MATCHED THE RECORD TERMINATOR BY \
AEAT'S PROSE AND THIS RECORD BROKE IT. 132 designs end \"Fin de registro\", two end \"Fin \
de Registro\", and TWO -- this record and T22005C00 -- end \"Fin de ejercicio\", which is \
simply wrong: the field closes a RECORD, not an ejercicio. Keying on the words crashed \
here and would have tempted a silent widening of the word list. The terminator is now \
matched by its CLOSING TAG, which is what actually identifies the field and is identical \
in all 137, and the fragment comment REPORTS the wording each design uses instead of \
asserting one. All 13 previously authored flat records regenerate with that single comment \
line changed and NOTHING ELSE, verified by counting non-comment changed lines. NOTED -- \
AEAT MOVES A PARENT MID-GROUP: [00319] carries the outer name \"Deterioro y resultado por \
enajenaciones de instrumentos financieros\" while [00320] to [00323], its breakdown on the \
printed modelo, drop it and head straight with \"Resultados por enajenaciones y otras\". \
Each label follows its own printed text; the nesting is not repaired, because the design \
states two placements and nothing here knows which AEAT means. VERIFIED -- FOUR MISSING \
PARENT-CHILD SEPARATORS WERE REPAIRED, each only after an ATTESTED standalone line of this \
record, and each listed in the fragment. Twenty of the 35 numbered lines carry the real \
ligature CODEPOINT unsplit, expanded in the labels and kept as emitted in the verbatim \
comments. VERIFIED -- THE LOCALE CHAINS ARE DERIVED, NOT RETYPED. This record's numbered \
lines share no common prefix, so the generator correctly derived an EMPTY heading and kept \
each line's full text; the chain for every label is therefore its own Spanish split on the \
