consolidated declaration. DISCLOSURE -- self-review: the same agent authored the labels \
being repaired. THIS ITERATION AUTHORED NO NEW RECORD. It closed the diacritic defect this \
campaign introduced, across the last two catalogues, and CORRECTED A FALSE CLAIM MADE BY \
AN EARLIER STAMP. Revision unchanged at 1897 casillas over thirty-seven of the design's \
137 record sheets. CORRECTED, AND THE PREVIOUS STAMP WAS WRONG -- it said English and \
Hungarian \"compose no page reference for that record at all\". THEY DO: 473 labels each, \
and 50 of those named page \"70\", the page that does not exist. That conclusion was \
reached by GREPPING THE LOCALE YAML, whose long values are LINE-WRAPPED, so the pattern \
never matched across the fold. The loaded authority was available and answers correctly. \
Measuring a catalogue by grepping its serialised form is the error; every count in this \
iteration is taken from the loaded labels. CORRECTED -- THE UNTRANSLATED RECORD PREFIX WAS \
NOT A CATALAN SLIP BUT A SYSTEMATIC ONE. English and Hungarian carried BOTH Spanish words, \
\"pag.\" and \"hoja\", on 473 labels each. An English label read \"Consolidated balance \
sheet. Assets (pag. 3A hoja 00). Non-current assets\" -- English, English, Spanish, \
Spanish, English. English now reads \"(page 3A sheet 00)\" and Hungarian \"(3A. oldal, 00. \
lap)\", with the page token corrected in the same pass. NO SPANISH PAGE VOCABULARY REMAINS \
IN ANY NON-SPANISH CATALOGUE, asserted. CORRECTED -- HUNGARIAN DIACRITICS ARE COMPLETE: \
1848 labels without a diacritic down to ZERO, over 1879 labels rewritten, from a hand \
table of 730 entries covering 18716 occurrences of an enumerated 1031-token inventory. \
Hungarian is the least forgiving of the three languages: o against o-umlaut against \
o-double-acute, and u against u-umlaut against u-double-acute, are three distinct letters \
each and the long forms are not decorative. The same two properties as the Catalan pass \
hold: the accent-only invariant is asserted for EVERY TABLE ENTRY BEFORE ANY LABEL IS \
TOUCHED and again for every rewritten label, so an entry can add a diacritic and can never \
respell a word; and every entry must FIRE or it is removed. Genuine ambiguity is refused \
-- \"meg\"/\"meg-with-accent\" and \"fel\"/\"fel-with-accent\" are different words and \
neither is in the table. VERIFIED -- THE ACCENT-ONLY INVARIANT CAUGHT THREE REAL \
MISSPELLINGS AND ONE ERROR IN THE REPAIR ITSELF, before a single label was written. It \
refused a table entry where the agent had mistyped the Hungarian, and it refused three \
entries whose SOURCE token was misspelled rather than merely unaccented: \"eloelegek\" and \
\"eloezetes\" carry a stray letter, and \"rafordituskimutatasa\" carries a wrong stem \
vowel while the CORRECTLY spelled form sits in the same catalogue. An invariant written to \
constrain a repair identified a different defect class the repair was not looking for. All \
three were then fixed as declared substitutions with their firing counts, 57 labels, and \
the survivors are gated on the PROPERTY -- no misspelling in any casing -- rather than on \
a second tally. VERIFIED -- ALL 1897 CASILLAS RESOLVE A NON-NULL LABEL IN es, en, ca AND \
hu, counted by VALUE rather than by key, and NO label in any locale is identical to its \
Spanish. NOT CLAIMED -- 142 Spanish and 87 Catalan labels still carry no diacritic; both \
sets were read token by token in earlier iterations and contain no accent-bearing word. \
English correctly carries none. NOT CLAIMED -- THE LOCALES ARE COMPLETE BUT STILL \
UNAUDITED BY ANY SECOND PARTY. Every label in all four catalogues was written, and has now \
been repaired, by the same agent. Three separate defect classes have been found in them by \
enumeration -- lost diacritics, untranslated Spanish, and outright misspellings -- and \
every parity and coverage gate in the tree was green throughout all three. A NON-NULL \
VALUE UNDER THE RIGHT KEY IS NOT EVIDENCE OF THE RIGHT LANGUAGE, and nothing in this \
