The header also closed every record with \"THIS BALANCE SHEET DOES NOT BALANCE HERE\", \
which T22007000 is not -- it is a settlement chain. A CLAIM WRITTEN AS A CONSTANT IS A \
CLAIM THAT STOPPED BEING CHECKED: the number sentence is now DERIVED from the emitted \
