[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22003A00 IS AUTHORED, 37 casillas, the BALANCE \
CONSOLIDADO, ACTIVO, in the general Plan General de Contabilidad shape: activo no \
corriente from inmovilizado intangible through the long-term investments to activos por \
impuesto diferido, then activo corriente from existencias through the short-term \
investments to efectivo, closing on TOTAL ACTIVO. Revision total 1464 casillas over \
TWENTY-SEVEN of the design's 137 records. Every box carries AEAT's own five-digit number, \
so not one number here is minted. VERIFIED -- CHILDREN CARRY THEIR PARENT'S NAME INLINE, \
so all 37 labels are distinct on AEAT's own text and no nesting is inferred from position. \
TWO BOXES ARE THE EXCEPTION AND ARE LEFT FLAT: [00701] \"Derechos de emision de gases de \
efecto invernadero\" and [00761] \"Otros\" carry NO parent name, though they sit between \
[00138] Existencias and [00149] Deudores comerciales and read on the printed modelo as \
breakdowns of Existencias. The design does not say so, so nothing here says so either -- \
the same refusal that kept T22005A01 flat, applied to two boxes rather than nineteen. \
VERIFIED -- THE GENERATOR IS NOW GENERALISED RATHER THAN COPIED A THIRD TIME. Heading \
derived as the common prefix of every numbered line; ligature repair grounded in the \
workbook's vocabulary and counted twice so the damage cannot attest itself; parent-child \
separator inserted only after an attested standalone line of the same record; completeness \
complement asserted against the design; type coverage asserted. Three records have now \
been authored through it and the shared machinery is what makes their claims comparable. \
VERIFIED -- AEAT IS INCONSISTENT ABOUT THE SEPARATOR AFTER ITS OWN HEADING, writing \
\"ACTIVO. Inmovilizado intangible\" with a space and \"ACTIVO.Activos por impuesto \
diferido\" without. Deriving the heading as a common prefix and stripping the remainder \
lands both spellings on the same heading, so no rule about AEAT's punctuation was needed. \
VERIFIED -- SEVEN OF THIS RECORD'S 37 LINES CARRY THE REAL U+FB01 CODEPOINT, unsplit, in \
\"Inversiones financieras\" and \"Periodificaciones\". Expanded in the labels, kept as \
emitted in the verbatim comments. The design carries 309 such codepoints in all, so a \
plain-text search of this workbook for a Spanish word silently misses them -- the \
measurement that first surfaced on T22007M00 and has now been rechecked on a third family. \
VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all 47 design fields are 37 \
authored plus 10 excluded, and every excluded field is asserted to be envelope, reservado \
or fin de registro BY ITS OWN TEXT rather than by position. T22003A00 tiles 1..806 exactly \
once with NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 applies exactly the \
single ejercicio this revision claims. NOT CLAIMED -- THIS BALANCE SHEET DOES NOT BALANCE \
HERE. Every subtotal and the TOTAL ACTIVO are DECLARED, not computed: NO formula, \
construct or binding sums a group into its head, sums the heads into [00180], or checks \
activo against patrimonio neto plus pasivo. Every box is a manual input. A reader should \
not mistake a complete balance-sheet record for a balance sheet the application can check. \
NOT CLAIMED -- THE SIBLING BALANCE RECORDS ARE NOT AUTHORED. T22003A01, A02, A11, B00, \
B01, B02, C01, C02 and D02 remain unmodelled, and the family's sheet suffix is NOT a \
reliable guide to which side of the balance a record covers: T22003B02 opens \"ACTIVO. \
Inmovilizado intangible\" despite the B, so it continues an ACTIVO page rather than \
starting a PASIVO one. Anyone continuing this family must read the descriptions, not the \
sheet names. NOT CLAIMED -- 10272 OF THE 11570 (record, number) SLOTS REMAIN UNMODELLED \
across 106 of the 133 records that carry numbers; 1298 slots are modelled, zero orphaned. \
A coverage figure is only true against the extractor of the day it was measured. NOT \
CLAIMED -- THE STANDING CROSS-RECORD HAZARD IS UNCHANGED. Box 00500 is declared in two \
records and carries an identical operator label in both; the design prints some numbers in \
