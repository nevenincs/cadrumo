[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORDS T22015A00 AND T22015B00 ARE AUTHORED, 21 casillas, the \
two deduccion detail records: T22015A00 the deducciones por reinversion, entity by entity \
with the transmitting NIF, the reinvesting NIF, both dates, the ejercicio of generation \
and the three deduccion columns; T22015B00 the deduccion por inversion de beneficios with \
the investing NIF, the NIF of the entity that funds the reserva, the date, the ejercicio \
and the same three columns. Revision total 1279 casillas over EIGHTEEN of the design's 137 \
records. THE NUMBER SET DECIDED THE CASILLA SET, NOT THE SHAPE: 33 detail blocks in each \
record carry NO box number and differ only by a parenthesised row ordinal, so ONE row is \
declared per record and a layout repeat writes the rest. Declaring every block would have \
minted 264 and 231 casillas for 8 and 7 declared values. THE STRIDE IS PROVEN: 16 + 89x33 \
and 16 + 81x33 land exactly on @2953 and @2689 where the first total begins, the ordinals \
seen are asserted to be exactly 1..33, and no description may carry two of them. VERIFIED \
-- BOTH HEADINGS ARE DERIVED AS THE COMMON PREFIX OF THEIR OWN GROUP, not retyped, and \
that is what surfaced the finding of this iteration. THE DETAIL LINES AND THE TOTAL LINES \
CARRY DIFFERENT HEADINGS. T22015B00 prints \"DEDUCCION POR INVERSION DE BENEFICIOS (DT \
24.5 LIS y Art. 37 TRLIS)\" on every one of its 231 detail lines and \"DEDUCCION POR \
INVERSION DE BENEFICIOS (Art. 37 LIS)\" on every one of its three totals -- a DIFFERENT \
legal citation for the same deduccion, transitional-provision plus the repealed TRLIS \
article against the current LIS article. T22015A00 has NO common total heading at all, \
because AEAT prefixes only its FIRST total with \"Resultado de la autoliquidacion.\". \
Neither would have been noticed had the heading been typed in from one line and applied to \
the rest, which is what the previous three iterations did in other forms. The totals \
therefore keep their printed text whole and only the detail labels have a heading \
stripped. CORRECTED BEFORE SHIPPING -- A BLANKET PUNCTUATION RULE CORRUPTED A LEGAL \
REFERENCE. Regularising the space after a period, added so that \"reinversion \
(2).Deduccion\" and \"reinversion (4). Deduccion\" would compare equal, rewrote \"DT 24.5 \
LIS\" as \"DT 24. 5 LIS\". It is now scoped to a period that separates WORDS and cannot \
reach inside a number AEAT printed. The block-shape comparison itself was moved onto \
letters and digits only, so punctuation spacing cannot make one printed shape look like \
two. VERIFIED -- AEAT REPEATS A PHRASE INSIDE ONE DESCRIPTION: block 1 of T22015A00 reads \
\"NIF de la entidad que obtiene el resultado por transmision del activo por transmision \
del activo\" where the other 32 blocks print the tail once. Collapsed in the label and \
kept doubled in the verbatim comment, the same call made on T220DID00's doubled \"Estado. \
Estado\". The collapse was DETECTED by the block-shape check refusing to see one shape, \
not decided in advance, and every collapse applied is reported in the fragment. VERIFIED \
-- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all 277 and 244 design fields are \
authored, covered by the repeat, or named as excluded, with an empty difference; the type \
table is asserted to cover exactly the authored offsets. Both records tile 1..3165 and \
1..2901 exactly once with NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 \
applies exactly the single ejercicio this revision claims. NOT CLAIMED -- 10441 OF THE \
11570 (record, number) SLOTS REMAIN UNMODELLED across 115 of the 133 records that carry \
numbers; 1129 slots are modelled, zero orphaned. As two stamps ago recorded, a coverage \
figure is only true against the extractor of the day it was measured. NOT CLAIMED -- THE \
TOTALS ARE DECLARED, NOT COMPUTED, and neither is the arithmetic the three money columns \
mean: a deduccion pendiente al inicio less the deduccion aplicada gives the deduccion \
pendiente de aplicacion, and NO formula, construct or binding expresses that or the column \
sums. NOT CLAIMED -- THE STANDING CROSS-RECORD HAZARD IS UNCHANGED. Box 00562 is declared \
twice, as T22009000:00562 and T220DID00:00562, and the design prints some numbers in as \
many as seven records. A layout must bind such casillas to the SAME value rather than \
collect them twice, and NOTHING ENFORCES THAT TODAY. NOT CLAIMED -- NO EXPORT LAYOUT AND \
NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope \
remains inspection_only, so this stamp is made under the LOWER inspection bar and MUST be \
re-made if a layout lands. NOT CLAIMED -- T22009001, T22012A00 and T22012A10 remain \
deliberately held back, the first for two byte-identical descriptions whose jurisdiction \
the design does not state, the others for colliding label keys. NOT CLAIMED -- LOCALES \
COMPLETE BUT UNAUDITED: the 21 labels were translated by the same agent that authored the \
casillas and reviewed by nobody else; the catalogues are unaccented ASCII, asserted. All \
1279 casillas resolve a non-null label in es, en, ca and hu, counted by VALUE rather than \
by key, and duplicate Spanish labels across the revision are ZERO -- which matters here \
because the two records share several detail concepts word for word and only the record \
heading tells them apart. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not \
zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
