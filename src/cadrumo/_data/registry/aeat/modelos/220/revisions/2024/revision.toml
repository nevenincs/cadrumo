[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22003B02 IS AUTHORED, 20 casillas, closing the \
aseguradoras BALANCE CONSOLIDADO ACTIVO: inmovilizado intangible, participaciones en \
entidades del grupo y asociadas, activos fiscales, otros activos, activos y grupos de \
activos en venta, and [00162] TOTAL ACTIVO. Revision total 1582 casillas over THIRTY of \
the design's 137 records. Every box carries AEAT's own five-digit number. THE FINDING OF \
THIS ITERATION IS THAT AEAT DECLARES EACH RECORD'S IDENTITY IN ITS ENVELOPE AND THIS \
CAMPAIGN HAD BEEN THROWING IT AWAY. The design carries literal constants at @6, @8 and @9 \
-- pagina, letra, hoja -- and every fragment since the first has excluded those eight \
envelope fields as \"identifier envelope mechanics\". Sibling sector pages share EVERY \
heading AEAT prints in the BODY: three ACTIVO records all head their lines \"ACTIVO\", and \
two of them declare a box called \"Total activo\". Four operator labels had collided \
across them, including two DIFFERENT boxes both reading \"Balance consolidado. Activo. \
Total activo\". The envelope is the ONLY NON-INFERENTIAL way to tell such records apart, \
and it was sitting in data already read and already discarded. CORRECTED IN THIS \
ITERATION, ACROSS FIVE RECORDS: the record label now carries AEAT's page identifier -- \
\"(pag. 3A hoja 00)\", \"(pag. 3A hoja 02)\", \"(pag. 3B hoja 02)\", \"(pag. 5A hoja \
01)\", \"(pag. 5A hoja 02)\" -- swept through T22003A00, T22003A02, T22003B02, T22005A01 \
and T22005A02, 184 labels in all four catalogues. It claims NO SECTOR, which the design \
does not state, and it is DATA rather than an inference. Revision duplicates fall from \
NINE texts over TWENTY-NINE casillas to FOUR over NINETEEN, and every one that remains is \
AEAT's own repeat inside T22005A01, where the design prints no hierarchy to separate them. \
The previous stamp recorded the collision as a cost of refusing to infer a sector; that \
framing was incomplete -- there was a third option, in the data, and it took a fourth \
collision to go looking for it. VERIFIED -- THE SHEET SUFFIX SAYS B AND THIS RECORD IS AN \
ACTIVO PAGE. T22003B02 continues T22003A02 and closes it on TOTAL ACTIVO. The suffix \
letters in this family do NOT track the side of the balance; read the descriptions, never \
the sheet names. VERIFIED -- FOUR BOXES READ AS SIBLINGS AND ARE LEFT THAT WAY: [00150], \
[00151] and [00152] carry no prefix naming [00149] participaciones en entidades del grupo \
y asociadas, though on the printed modelo they break it down. Nested only where the line \
says so. VERIFIED -- AEAT CAPITALISES \"Empresas\" ON [00150] AND NOT ON [00151], inside \
one group of three otherwise parallel lines. Transcribed as printed; a rule that \
regularised the casing would be a rule about AEAT's typography, and this campaign has paid \
three times for rules like that. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE \
GENERATOR: all 30 design fields are 20 authored plus 10 excluded, each excluded field \
asserted to be envelope, reservado or fin de registro BY ITS OWN TEXT. T22003B02 tiles \
1..517 exactly once with NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 \
applies exactly the single ejercicio this revision claims. NOTED -- THE SUITE MEASURED A \
MOVING TREE AGAIN. The FAILED list gained four entries against the previous run; \
re-running each individually showed THREE already passing and the fourth failing on \
\"registrar command is absent for 'modelo work calculate'\" -- a peer's CLI command-spec \
sweep landing mid-run. NONE reads registry TOML or locale YAML. Zero regressions from this \
work; the diff-against-baseline discipline is what separated the four external entries \
from a real one. NOT CLAIMED -- THE ASEGURADORAS ACTIVO NOW HAS A TOTAL AND NOTHING \
COMPUTES IT. [00162] TOTAL ACTIVO is DECLARED. No formula, construct or binding sums the \
portfolios into it, and nothing relates it to a patrimonio neto y pasivo total, which for \
this sector is not authored at all. NOT CLAIMED -- 10154 OF THE 11570 (record, number) \
SLOTS REMAIN UNMODELLED across 103 of the 133 records that carry numbers; 1416 slots are \
modelled, zero orphaned. A coverage figure is only true against the extractor of the day \
it was measured. NOT CLAIMED -- T22003A01, A11, B01, C01, C02 and D02 remain unmodelled. \
NOT CLAIMED -- THE CROSS-RECORD HAZARD IS UNCHANGED IN SUBSTANCE though it no longer shows \
as a shared label: the design prints some box numbers in as many as seven records, and a \
layout MUST bind those casillas to the SAME value rather than collect them twice. NOTHING \
ENFORCES THAT TODAY. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. \
The modelo cannot be filed. model_law_authority_scope remains inspection_only, so this \
stamp is made under the LOWER inspection bar and MUST be re-made if a layout lands. NOT \
CLAIMED -- T22009001, T22012A00 and T22012A10 remain deliberately held back. NOT CLAIMED \
-- LOCALES COMPLETE BUT UNAUDITED: the 20 new labels were composed from 9 parent concepts \
and 11 child suffixes, and 184 existing labels were re-prefixed, all by the same agent \
that authored the casillas and reviewed by nobody else; the catalogues are unaccented \
ASCII, asserted. All 1582 casillas resolve a non-null label in es, en, ca and hu, counted \
by VALUE rather than by key. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, \
not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
