agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22004B02 IS AUTHORED, 16 casillas describing all 26 \
design fields: the CUENTA TECNICA DEL SEGURO NO VIDA, gastos del inmovilizado material y \
de las inversiones, in the shape used by entidades aseguradoras, down to the closing \
