[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. READ THE NEXT CLAIM FIRST: THIS STAMP IS MADE WITHOUT A USABLE SUITE RUN. \
The registry suite was executed and returned 604 failures and 96 errors against a clean \
baseline of 9, because a peer's in-flight modelo 200 work leaves the whole authority \
failing validation -- 3596 validation failures, ZERO of them naming modelo 220, stable \
across three consecutive load attempts. Every test that loads the authority therefore \
fails regardless of this work. THE FAILED LIST COULD NOT BE DIFFED, which is the one gate \
this campaign relies on most, and no claim below rests on it. The record-level checks \
below DID run, before the breakage and against a loaded authority. VERIFIED -- RECORDS \
T22003A01 AND T22003A11 ARE AUTHORED, 66 casillas, the BALANCE CONSOLIDADO ACTIVO in the \
shape used by entidades de credito: the financial-asset portfolios by measurement \
category, derivados de cobertura, inversiones en negocios conjuntos y asociadas and \
activos tangibles on page 3A hoja 01, then activos intangibles, activos por impuestos, \
otros activos and the closing [00152] TOTAL ACTIVO on page 3A hoja 11. Revision total 1732 \
casillas over THIRTY-FOUR of the design's 137 records. Every box carries AEAT's own \
five-digit number. VERIFIED -- THIRTY-THREE OF T22003A01'S FIFTY-FOUR BOXES SHARE A LABEL \
WITH A SIBLING, and that is the honest cost of not inventing a hierarchy. The record is a \
PORTFOLIO x INSTRUMENT matrix: AEAT prints the portfolio head on its own row -- [00102] \
mantenidos para negociar, [00615] no destinados a negociacion, [00110] designados a valor \
razonable, [00623] con cambios en otro resultado global, [00631] a coste amortizado -- and \
then prints the instrument rows beneath it WITHOUT the portfolio name. Five boxes read \
\"Valores representativos de deuda\", five read \"Prestamos y anticipos\", five read the \
same Pro memoria line. THE PORTFOLIO IS NOT DERIVED FROM POSITION: on T22005A01 the \
obvious adjacency rule was tried and proved WRONG IN FOUR PLACES, and here a \
numbering-block rule would be PARTIAL -- the 00615, 00623 and 00631 runs are contiguous \
while the 00102 and 00110 runs have gaps and their Pro memoria lines carry out-of-run \
numbers [00750] and [00751]. A rule right for three blocks and not two is the \"right most \
of the time\" case already refused once. CONSEQUENCE, STATED PLAINLY: the box number is \
the only disambiguator this data supports, and an operator surface showing labels without \
numbers will present five identical rows on this page. That is a real cost, recorded \
rather than traded for an unverifiable tree. VERIFIED -- THE DUPLICATE-LABEL ASSERTION WAS \
CHANGED FROM \"NO DUPLICATES\" TO \"THE DUPLICATED SET EQUALS THE DESIGN'S\", in the \
generator and in the catalogue. The old form would have refused this record outright and \
forced a distinction AEAT does not make; the new form still fails on a collision \
introduced by this code or by a translation. The revision now carries 14 duplicated label \
texts over 52 casillas: 4 texts over 19 are AEAT's own repeats inside T22005A01 and 10 \
over 33 are AEAT's own repeats inside T22003A01. VERIFIED -- T22003A11 SPELLS ITS OWN \
HEADING TWO WAYS, \"ACTIVO (cont.).\" and \"ACTIVO (cont).\". A common-prefix derivation \
stops mid-word at \"ACTIVO (cont\" and finds NO heading at all, which would have left the \
prefix on all twelve labels. The sheet therefore declares a heading PATTERN; every \
numbered line is asserted to match it and the spellings actually found are reported on the \
fragment face. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR for both: all \
64 and 22 design fields are 54 and 12 authored plus 10 excluded each, every excluded field \
asserted to be envelope, reservado or fin de registro BY ITS OWN TEXT. Both tile 1..1095 \
and 1..381 exactly once with NO gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 \
applies exactly the single ejercicio this revision claims. VERIFIED BEFORE THE BREAKAGE -- \
all 1732 casillas resolved a non-null label in es, en, ca and hu, counted by VALUE rather \
than by key, and the locale catalogues carry no drift attributable to this work: 66 keys, \
zero reported extra and zero missing by scaffold --check. NOT CLAIMED -- THE SUITE STATE \
OF THIS REVISION IS UNKNOWN AS OF THIS STAMP. It was green at the previous stamp and \
nothing here touches production code, but that is an argument, not a measurement. The next \
iteration MUST re-run the suite once the modelo 200 breakage clears and absorb anything \
attributable to these two records. NOT CLAIMED -- 10004 OF THE 11570 (record, number) \
SLOTS REMAIN UNMODELLED across 99 of the 133 records that carry numbers; 1566 slots are \
modelled, zero orphaned. This measurement was taken by reading the committed TOML \
fragments directly, because the authority could not be loaded. NOT CLAIMED -- THE CREDITO \
ACTIVO IS COMPLETE AND ITS PASIVO IS NOT: T22003B01 and C01 remain unmodelled, so no total \
on this sector's other side exists and the accounting identity is not even expressible \
here yet. NOT CLAIMED -- NOTHING COMPUTES ANY OF IT. Each portfolio head is the sum of its \
instrument rows and [00152] is the sum of the heads, and NO formula, construct or binding \
expresses that. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The \
modelo cannot be filed. model_law_authority_scope remains inspection_only, so this stamp \
is made under the LOWER inspection bar and MUST be re-made if a layout lands. NOT CLAIMED \
-- T22009001, T22012A00 and T22012A10 remain deliberately held back. NOT CLAIMED -- \
LOCALES COMPLETE BUT UNAUDITED: the 66 labels were translated by the same agent that \
authored the casillas and reviewed by nobody else; the catalogues are unaccented ASCII, \
asserted. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
