[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22012B00 IS AUTHORED and RECORD T22012000 IS \
RE-AUTHORED: 344 casillas across the two deduction-grid records, every one carrying a real \
AEAT box number. Revision total 439 casillas, four of the design's 137 records. THE \
SUBSTANCE OF THIS REVIEW IS A CORRECTION TO THE PREVIOUS ONE. AEAT REUSES BOX NUMBERS \
ACROSS RECORDS: number 00285 is a different declared cell in T22012000 than in T22012B00, \
and the two records share many such numbers. The modelo is therefore MULTI-SEGMENT, and \
the registry loader refuses bare casilla ids for it. Every casilla in both records now \
declares `segmento` set to the record name and takes the `<SEGMENTO>:<number>` id shape -- \
the convention MODELO 200, the other multi-record Sociedades declaration, already \
established. Both halves of the id are TRANSCRIBED from AEAT: its record name and its box \
number. Nothing is derived. THAT SHAPE REPLACED A DERIVED ONE, AND BOTH LESSONS WERE PAID \
FOR. The previous stamp described ids minted from a four-axis decomposition of the field \
descriptions, and described the checking that made them trustworthy: nothing unresolved, \
no duplicate key within a record, and -- added this iteration -- no duplicate key across \
records. Each check caught a real defect: a missing group axis collided nineteen numbers, \
and a missing \"Total periodos anteriores\" scope collided four more AND silently \
mislabelled five casillas that had already been committed under the previous stamp. Those \
five are corrected here. But the scheme was wrong anyway. The loader refused it because \
the modelo needs `segmento` regardless, and an established convention already existed for \
exactly this shape. FIRST LESSON: a derived id that passes every check you thought of is \
still worse than a transcribed one. SECOND LESSON: re-implementing a convention the \
registry already has is a defect in itself, however carefully the re-implementation is \
verified -- and the cost was two full authoring passes over 180 casillas. A THIRD \
CONVENTION WAS ALSO REACHED FOR BY GUESS AND CORRECTED BY A GATE: a segment-qualified \
fragment filename joins the id's colon as \"+\", not \"-\". test_casilla_fragment_naming \
named the expected stem exactly; the four files were renamed and it is green. All three \
conventions were cheaper to read than to invent. VERIFIED -- THE DECOMPOSITION SURVIVES \
WHERE IT IS ACTUALLY NEEDED: the casilla LABELS, which must say what a cell means in four \
languages and are composed from the four checked axes rather than from free text, so a \
label can only be wrong if one of four small vocabularies is wrong. VERIFIED -- THE TWO \
GRIDS SHARE 113 CELL MEANINGS and the design gives NO wording to tell them apart; nothing \
in any field description says what \"B00\" scopes differently from \"000\". Each label \
therefore carries AEAT's own record identifier. That is opaque but truthful and \
distinguishing: 113 identical labels would leave an operator unable to tell which cell \
they were filling. Duplicate Spanish labels across the revision: ZERO. The segmento \
likewise records AEAT's record identifier and asserts no semantics beyond it. VERIFIED -- \
180 and 164 design numbers respectively, ALL authored, zero missing and zero invented; \
every field of both records is either authored or explicitly excluded with a stated \
reason. Both tile exactly once with NO gap and NO PARTIAL OVERLAP, both checked. \
Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. \
THE DENOMINATOR FOR THIS MODELO IS RESTATED, because the segmento discovery changes it. \
Counting DISTINCT box numbers gives 7604, which UNDERCOUNTS the declarable cells, since a \
number reused across records is several cells. Counting (record, number) SLOTS gives \
11605. Modelled: 356 slots. NOT CLAIMED -- 11249 SLOTS REMAIN UNMODELLED across 133 of the \
design's 137 records. 439 casillas describe four records. Progress on this modelo must not \
be read from the casilla count. NOT CLAIMED -- THESE CASILLAS DECLARE THE DEDUCTION GRIDS; \
NONE OF THEM COMPUTES ONE. No formula, construct or binding is attached to any of the 344, \
so nothing reconciles a carried-forward deduction against the amount applied and nothing \
checks that pendiente-futuro equals pendiente minus aplicado. A complete set of declared \
cells is not a modelled calculation. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands and lifts the derived scope to filing. NOT CLAIMED -- the two earlier \
records, T22001000 and T22002000, do NOT carry `segmento`: their fields are largely or \
wholly unnumbered, so the convention has nothing to key on there and no collision has \
arisen. That divergence is deliberate and is recorded so a later reader does not read it \
as an oversight. NOT CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: all 439 label keys \
verified non-null across es/en/ca/hu by counting VALUES rather than keys; the translations \
were not reviewed by a second party and the Spanish is unaccented ASCII. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
