[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22003B00 IS AUTHORED, 51 casillas, the BALANCE \
CONSOLIDADO, PATRIMONIO NETO Y PASIVO in the general Plan General de Contabilidad shape: \
fondos propios from capital through the reservas and the resultado del ejercicio, then \
ajustes por cambios de valor, subvenciones and socios externos, then pasivo no corriente \
and pasivo corriente, closing on TOTAL PATRIMONIO NETO Y PASIVO. It completes the pair \
with T22003A00 authored last iteration. Revision total 1515 casillas over TWENTY-EIGHT of \
the design's 137 records. Every box carries AEAT's own five-digit number, so not one \
number here is minted. VERIFIED -- AN EMPTY COMMON PREFIX IS A VALID ANSWER, NOT A FAILURE \
TO FIND ONE. The generator derives a record's heading as the common prefix of its numbered \
lines. T22003A00 prefixes every line with \"ACTIVO\"; THIS RECORD PREFIXES NOTHING AT ALL \
-- its lines begin directly with \"PATRIMONIO NETO\", \"Fondos propios\", \"Capital\". The \
generator previously ASSERTED a non-empty heading, which would have failed here; the \
assertion was wrong, not the record. Forcing a heading would have put a word AEAT does not \
print onto 51 filing-grade labels. VERIFIED -- FIVE BOXES SIT UNDER \"Reservas\" ON THE \
PRINTED MODELO AND CARRY NO PREFIX: [00003] reserva legal y estatutaria, [00752] reserva \
de capitalizacion, [00753] reserva de nivelacion and [00764] fondo de reserva obligatorio \
de cooperativas, while [00750] and [00702] ARE prefixed \"Reservas.\" in the same run. \
AEAT is inconsistent within one group. All are left FLAT -- nested only where the line \
itself says so, the same treatment given to [00701] and [00761] on the activo side and to \
the nineteen shared lines of T22005A01. NOTED -- [00003] IS FAR OUTSIDE THIS RECORD'S \
NUMBER RANGE, which otherwise runs 00185 to 00252 with a handful of 007xx additions. It is \
AEAT's numbering, not a transcription slip, and is recorded because a reader checking the \
range would conclude otherwise. VERIFIED -- TWO LABELS ARE PARENTHESISED IN THE DESIGN: \
\"(Acciones y participaciones de la sociedad dominante)\" and \"(Dividendo a cuenta)\". \
The parentheses are AEAT's mark for a line that SUBTRACTS, so they are kept verbatim in \
all four catalogues; stripping them would silently drop a sign convention. NOTHING HERE \
ACTS ON THAT CONVENTION -- it is punctuation in a label, not arithmetic, and a consumer \
that treats these as additive will be wrong. VERIFIED -- AEAT MISSPELLS \"Provisiones\" AS \
\"Procisiones\" on [00735]; corrected in the operator label by name, never by a general \
rule, and kept as printed in the fragment comment. Six of this record's 51 lines carry the \
real U+FB01 ligature codepoint, unsplit, expanded in the labels and kept as emitted in the \
comments. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all 61 design \
fields are 51 authored plus 10 excluded, and every excluded field is asserted to be \
envelope, reservado or fin de registro BY ITS OWN TEXT rather than by position. T22003B00 \
tiles 1..1044 exactly once with NO gap and NO PARTIAL OVERLAP. Year-clean: \
aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. NOTED -- THE \
PREVIOUS ITERATION WAS BLOCKED AND WROTE NOTHING. The registry failed validation with 189 \
failures, every one in modelo 322 revision 2008-2022 while a peer's era split was in \
flight; the failure count moved between consecutive load attempts, which is what \
distinguishes an active worktree from a stable break. No record was authored and no stamp \
was written then. That split has since landed and the registry loads clean. NOT CLAIMED -- \
THIS BALANCE SHEET DOES NOT BALANCE. Both sides are now declared -- TOTAL ACTIVO as \
[00180] and TOTAL PATRIMONIO NETO Y PASIVO as [00252] -- and NOTHING CHECKS THAT THEY ARE \
EQUAL. No formula, construct or binding sums a group into its head, sums the heads into \
either total, or relates the two totals to each other. Authoring both sides makes the \
check possible; it does not make it exist. NOT CLAIMED -- 10221 OF THE 11570 (record, \
number) SLOTS REMAIN UNMODELLED across 105 of the 133 records that carry numbers; 1349 \
slots are modelled, zero orphaned. A coverage figure is only true against the extractor of \
the day it was measured. NOT CLAIMED -- THE SIBLING BALANCE RECORDS ARE NOT AUTHORED: \
T22003A01, A02, A11, B01, B02, C01, C02 and D02 remain unmodelled, and the family's sheet \
suffix is NOT a reliable guide to which side a record covers -- T22003B02 opens \"ACTIVO. \
Inmovilizado intangible\" despite the B. Read the descriptions, not the sheet names. NOT \
CLAIMED -- THE STANDING CROSS-RECORD HAZARD IS UNCHANGED. Box 00500 is declared in two \
records and carries an identical operator label in both; the design prints some numbers in \
as many as seven records. A layout MUST bind such casillas to the SAME value rather than \
collect them twice, and NOTHING ENFORCES THAT TODAY. NOT CLAIMED -- NO EXPORT LAYOUT AND \
NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope \
remains inspection_only, so this stamp is made under the LOWER inspection bar and MUST be \
re-made if a layout lands. NOT CLAIMED -- T22009001, T22012A00 and T22012A10 remain \
deliberately held back. NOT CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: the 51 labels were \
composed from 36 parent concepts and 11 child suffixes translated once each, by the same \
agent that authored the casillas and reviewed by nobody else; the catalogues are \
unaccented ASCII, asserted. All 1515 casillas resolve a non-null label in es, en, ca and \
hu, counted by VALUE rather than by key. The revision carries FIVE duplicated label texts \
over TWENTY-ONE casillas, unchanged by this record. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
