cover the derived set exactly -- no more, no less. VERIFIED -- THE WHOLE CORPUS WAS \
RE-DERIVED FROM THE DESIGN: 1985 casillas across 47 fragments and 40 sheets, every \
segmento a real sheet, 1812 numeric box numbers PRINTED BY AEAT and none minted, 4 letter \
numbers, 74 byte spans resolving to a design field at exactly that offset and length, 40 \
sheets tiling once with no gap and no partial overlap, no repeated id and no repeated \
(segmento, number). ZERO PROBLEMS. VERIFIED -- EVERY MODELO 220 LOCALE KEY IS PRESENT IN \
ALL FOUR CATALOGUES, label AND help, zero missing, and no label in any locale is identical \
to its Spanish. Help follows the revision's own convention, re-derived and required to \
reproduce 1472 existing strings exactly before the 140 new ones were written. NOT CLAIMED \
-- 9791 OF THE 11603 (record, number) SLOTS REMAIN UNMODELLED; 1812 are modelled, zero \
orphaned. NOT CLAIMED -- THIS PROFIT AND LOSS ACCOUNT DOES NOT ADD UP. RESULTADO \
FINANCIERO, RESULTADO ANTES DE IMPUESTOS, RESULTADO DEL EJERCICIO PROCEDENTE DE \
OPERACIONES CONTINUADAS and RESULTADO CONSOLIDADO DEL EJERCICIO are each DECLARED, not \
computed, and the split of the consolidated result between the sociedad dominante and \
