[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORDS T22010000 AND T22011000 ARE AUTHORED, 22 casillas, the \
two PER-ENTITY DETAIL records: T22010000 lists transparencia fiscal internacional (art. \
100.10 LIS) and doble imposicion interna intersocietaria al 5/10% entity by entity, \
T22011000 lists the eight bonificaciones -- Ceuta y Melilla, prestacion de servicios, \
bienes corporales en Canarias y en Illes Balears, sociedades cooperativas, arrendamiento \
de viviendas, otras, y empresas navieras en Canarias. Revision total 1227 casillas over \
FIFTEEN of the design's 137 records. THE NUMBER SET DECIDED THE CASILLA SET, NOT THE \
SHAPE. Both records repeat a detail block that carries NO box number and differs only by a \
printed row index -- 44 blocks of 3 fields in T22010000, 24 blocks of 9 in T22011000 -- so \
ONE row is declared per record and a layout repeat writes the rest, the mechanism modelo \
720's binding_record already uses. Declaring every block would have minted 132 and 216 \
casillas for 3 and 9 declared values. THE STRIDE IS PROVEN, NOT ASSUMED: the run starts at \
@16 in both, the stride is 43 and 145, and 16 + 43x44 and 16 + 145x24 land exactly on \
@1908 and @3496 where the first total begins. Every block was compared field-for-field \
against the first with its row index removed, and each record yields exactly ONE distinct \
shape. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR, not claimed in \
prose: every one of the 144 and 234 design fields is authored, covered by the repeat, or \
named as excluded, and the difference of those sets against the design is empty. Both \
records tile 1..2103 and 1..3793 exactly once with NO gap and NO PARTIAL OVERLAP. \
Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. \
VERIFIED -- THE TRANSLATION TABLE IS KEYED BY CASILLA ID, NOT BY DESCRIPTION TEXT, and \
this is the correction to the defect the previous three stamps recorded. A table keyed on \
transcribed prose carried a silently mistyped key three iterations running -- once from a \
truncated survey, once from a truncated slug, once from a truncated listing -- and each \
time only an assertion in the code caught it. An id is generated rather than retyped, and \
the table now asserts bidirectionally that its id set equals the authored id set, so the \
whole class of defect is closed rather than watched for. VERIFIED -- AEAT'S OWN TEXT \
DIFFERS BETWEEN A DETAIL ROW AND ITS TOTAL in one column of each record, and both are \
transcribed as printed in the fragments rather than quietly reconciled: the detail reads \
\"D.I. Interna intersocietaria al 5/10% (cooperativas)\" where the total reads \"D.I. \
Interna societaria\", and the detail reads \"Cap. III Tit. VII LIS\" accented where the \
total is unaccented. The drift was detected by comparing the two column lists in code, not \
by eye. NOTED -- THE COVERAGE DENOMINATOR MOVED UNDER THIS CAMPAIGN. The previous stamp \
recorded 11605 numbered (record, number) slots with 1122 modelled; today the same \
measurement over the same workbook reports 11570 slots with 1117 modelled, because a peer \
changed the record-design extractor between the two runs. ZERO authored slots are orphaned \
-- every one is still evidenced by the current extraction -- so nothing was lost, but a \
coverage figure is only true against the extractor of the day it was measured, and a stamp \
that states one should say so. NOT CLAIMED -- 10453 OF THE 11570 (record, number) SLOTS \
REMAIN UNMODELLED across 118 of the 133 records that carry numbers; 1117 slots are \
modelled. NOT CLAIMED -- THE TOTALS ARE DECLARED, NOT COMPUTED. Each of the ten total \
casillas is by construction the sum of its own column down the 44 or 24 detail rows, and \
NO formula, construct or binding expresses that here. A reader should not mistake a \
declared total for a computed one, and the fragments say so on their own faces. NOT \
CLAIMED -- THE FAMILY WORDING \"detalle por entidad\" IS DESCRIPTIVE AND MINE. The design \
gives these two sheets no heading of their own, only a column of NIFs beside the amounts, \
so the per-entity reading is taken from that shape and is NOT an AEAT phrase. The \
operator-facing labels also normalise AEAT's own spacing and casing (\"Ley.20/1990\" to \
\"Ley. 20/1990\", \"Otras Bonificaciones\" to \"Otras bonificaciones\"); the verbatim form \
is kept in the fragment comments. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands. NOT CLAIMED -- T22009001, T22012A00 and T22012A10 remain deliberately \
held back, the first for two byte-identical descriptions whose jurisdiction the design \
does not state, the others for colliding label keys. NOT CLAIMED -- LOCALES COMPLETE BUT \
UNAUDITED: the 22 labels were translated by the same agent that authored the casillas and \
reviewed by nobody else; the Spanish is unaccented ASCII. All 1227 casillas resolve a \
non-null label in es, en, ca and hu, counted by VALUE rather than by key, and duplicate \
Spanish labels across the revision are ZERO. NOT CLAIMED -- independent_check_coverage is \
n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
