[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORDS T22012B10 AND T22012B20 ARE AUTHORED, completing the \
design's four deduccion-por-doble-imposicion grids: 715 casillas across T22012000, \
T22012B00, T22012B10 and T22012B20, every one carrying a real AEAT box number. Revision \
total 810 casillas, six of the design's 137 records. The two previously-authored grids are \
regenerated with ids and numbers unchanged. VERIFIED -- AEAT REUSES A BOX NUMBER WITHIN A \
SINGLE RECORD, which `segmento` cannot disambiguate, and the reading is SEMANTIC rather \
than a transcription error. THIRTY-THREE numbers appear at TWO offsets inside one record. \
Every one is a \"Tipo gravamen periodo generacion\" cell, and the tipo de gravamen of a \
generation year is a property of the PERIOD, not of the deduction family, so AEAT prints \
the same value in both the interna and the internacional grid. One number is one declared \
value, so each becomes ONE casilla and the fragment records both offsets; a layout writes \
the value to both positions. THE READING IS ASSERTED, NOT ASSUMED: the generator refuses \
unless every reused number is a tipo-gravamen cell of identical width. If AEAT ever reuses \
a number for two genuinely different values, that assertion fires rather than silently \
merging them. VERIFIED -- THOSE CELLS ARE RATES, NOT AMOUNTS. 42 casillas are typed \
`ratio`; typing a percentage as money would misdeclare it. The rate column sits \
INTERLEAVED between money columns rather than at the edge of the grid, which is why it was \
easy to miss and why it is called out here. VERIFIED -- THE DECOMPOSITION VOCABULARY HAS \
CONVERGED across all four grids: nothing unresolved, no duplicate key within any record, \
and no duplicate id across records. THE COLLISION CHECK DROVE EVERY STEP OF THAT \
CONVERGENCE and caught, in order: a missing group axis (nineteen numbers), a missing \
\"Total periodos anteriores\" scope (four more, plus five casillas silently mislabelled \
under an earlier stamp), and -- this iteration -- AN ORDERING BUG I INTRODUCED, where \
adding a lowercase \"deduccion pendiente\" fragment made it shadow \"2024: deduccion \
pendiente\" and read every 2024 cell as a prior-period one. Matching by substring makes \
superstring-first ordering part of the contract, and nothing but the collision check would \
have surfaced it. NEW VOCABULARY THIS ITERATION, all read from the design and none \
inferred: an art. 71 family for individual deductions carried into the group; a \"DI \
interna\" sub-family that AEAT nests UNDER its own \"Deducciones doble imposicion \
internacional LIS\" banner -- both are kept, because reclassifying the family to interna \
would override AEAT's own heading with an inference; the tipo-gravamen rate column; and \
four spelling variants, among them a fully uppercase DT 23 heading and a phrase AEAT \
splits with a stray dot (\"periodos. futuros\"). VERIFIED -- 180, 164, 186 and 185 \
distinct numbers respectively, ALL authored, ZERO missing and ZERO invented; every field \
of all four records is either authored, covered by a reused-number casilla, or explicitly \
excluded. All four tile exactly once with NO gap and NO PARTIAL OVERLAP. Ids are unique \
across records and duplicate Spanish labels across the revision number ZERO. VERIFIED -- \
YEAR-CLEAN: aeat-dr-220-2024 applies exactly the single ejercicio this revision claims. \
NOT CLAIMED -- 10878 OF THE 11605 (record, number) SLOTS REMAIN UNMODELLED across 131 of \
the design's 137 records. 727 slots are modelled. 810 casillas describe six records. \
Progress on this modelo must not be read from the casilla count. NOT CLAIMED -- THESE \
CASILLAS DECLARE THE DEDUCTION GRIDS; NONE OF THEM COMPUTES ONE. No formula, construct or \
binding is attached to any of the 715, so nothing reconciles a carried-forward deduction \
against the amount applied, nothing checks that pendiente-futuro equals pendiente minus \
aplicado, and nothing applies the tipo de gravamen to anything. A complete set of declared \
cells is not a modelled calculation. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. The modelo cannot be filed. model_law_authority_scope remains \
inspection_only, so this stamp is made under the LOWER inspection bar and MUST be re-made \
if a layout lands and lifts the derived scope to filing. NOT CLAIMED -- the two earlier \
records T22001000 and T22002000 do NOT carry `segmento`, because their fields are largely \
or wholly unnumbered and the convention has nothing to key on there. That divergence is \
deliberate and recorded so it is not read as an oversight. NOT CLAIMED -- LOCALES COMPLETE \
BUT UNAUDITED: all 810 label keys verified non-null across es/en/ca/hu by counting VALUES \
rather than keys; labels are composed from the checked axes rather than free text, so a \
label can only be wrong if one of the small vocabularies is wrong, but the translations \
were not reviewed by a second party and the Spanish is unaccented ASCII. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
