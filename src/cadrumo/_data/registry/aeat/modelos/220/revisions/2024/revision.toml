[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORDS T22012A01 AND T22012A11 ARE AUTHORED, bringing family \
12 to six of its eight records and 831 casillas, every one carrying a real AEAT box number \
and a `segmento`. Revision total 926 casillas, EIGHT of the design's 137 records. TWO \
RECORDS ARE DELIBERATELY NOT SHIPPED, AND THAT IS THE SUBSTANCE OF THIS REVIEW. T22012A00 \
and T22012A10 now resolve COMPLETELY -- zero unresolved fields -- but their four-axis \
decomposition keys still COLLIDE: twelve pairs in A00 and one in A10. Because casilla ids \
are transcribed as SEGMENTO:number, a key collision no longer threatens the ids at all; it \
threatens the LABELS, which are composed from those axes. Shipping those two records would \
hand an operator two IDENTICAL labels inside one record with no way to tell which cell \
they were filling. They are held back until a further distinguishing axis is found, rather \
than shipped with knowingly ambiguous labels. A record that loads cleanly and passes every \
gate can still be unfit to ship, and this is that case. VERIFIED -- THIS ITERATION WAS \
MOSTLY VOCABULARY DISCOVERY, which is worth stating plainly rather than presenting the \
outcome as though it were direct. FIVE rounds of extension were needed to reach \
zero-unresolved across family 12, each round surfacing further variants of AEAT's own \
headings: \"INTERNACIONALRDLEG\" with the space dropped, a title-case \"Deducciones por \
doble imposicion internacional RDLEG\" beside the uppercase form, \"Ded. pendiente\" and \
\"Ded. Pendiente\" beside \"Deduccion pendiente\", a phrase split by a stray dot, and a \
heading naming no law at all. VERIFIED -- TWO HEADINGS RECEIVED THEIR OWN FAMILY KEYS \
RATHER THAN AN ASSUMED HOME. \"DEDUCCIONES POR DOBLE IMPOSICION INTERNA .\" names NO law \
and is ambiguous between the RDLEG and the DT 23 families; picking either would be an \
inference the design does not support. \"Deducciones doble imposicion internacional 2024\" \
names the YEAR where its sibling heading names the law. Both are recorded as what they say \
and nothing more. The no-law matcher is tested LAST, because every other interna heading \
contains it as a prefix -- an ordering constraint of the same kind that caused a real \
defect in the previous iteration. NOT CLAIMED -- FAMILY 14 WAS ASSESSED AND REJECTED as \
this iteration's target, and the reason is recorded so the next iteration does not \
re-derive it: 33 records, 3959 numbered fields, and a concept axis running to hundreds of \
distinct incentive types, each needing a correct label in four languages. That is not a \
one-iteration unit, and guessing at it would produce user-facing labels that could not be \
stood behind. The remaining families by vocabulary footprint, measured: T22004 has 8 \
records and 315 numbers over only 8 distinct headings; T22016 has 2 records and 140 \
numbers over 3 headings; T22013 has 18 records and 1644 numbers over 12 headings. Those \
are the tractable next targets. VERIFIED for all six shipped records: every design number \
authored, ZERO missing, ZERO invented, every field either authored, covered by a \
reused-number casilla or explicitly excluded; all tile exactly once with no gap and no \
partial overlap; ids unique across records; duplicate Spanish labels across the whole \
revision ZERO. Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio claimed. \
NOT CLAIMED -- 10762 OF THE 11605 (record, number) SLOTS REMAIN UNMODELLED across 129 of \
the design's 137 records; 843 slots are modelled. 926 casillas describe eight records. \
Progress on this modelo must not be read from the casilla count. NOT CLAIMED -- THESE \
CASILLAS DECLARE THE DEDUCTION GRIDS; NONE OF THEM COMPUTES ONE. No formula, construct or \
binding is attached, so nothing reconciles a carried-forward deduction against the amount \
applied and nothing applies a tipo de gravamen to anything. NOT CLAIMED -- NO EXPORT \
LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be filed. \
model_law_authority_scope remains inspection_only, so this stamp is made under the LOWER \
inspection bar and MUST be re-made if a layout lands and lifts the derived scope to \
filing. NOT CLAIMED -- T22001000 and T22002000 still do not carry `segmento`, because \
their fields are largely or wholly unnumbered; deliberate, and recorded so it is not read \
as an oversight. NOT CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: all 926 label keys \
verified non-null across es/en/ca/hu by counting VALUES rather than keys; labels are \
composed from the checked axes rather than free text, but the translations were not \
reviewed by a second party and the Spanish is unaccented ASCII. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
