character and NFC normalisation, which is what a mojibake guard should have checked. NOT \
CLAIMED, AND THE LARGEST KNOWN DEFECT IN THIS REVISION: 1739 OF THE 1897 SPANISH LABELS \
REMAIN UNACCENTED across 33 records. They are wrong in the mandatory source locale and are \
NOT fixed by this iteration. The fix is mechanical for the twelve records authored through \
the flat generator, whose accented design text is already carried in each fragment's \
verbatim comment; the hand-typed record families need re-accenting by hand. This is \
recorded as owed work, not as an acceptable state. CORRECTED -- TWO FRAGMENTS SHIPPED \
FALSE CLAIMS ABOUT THEMSELVES, BOTH FROM FIXED PROSE IN A SHARED HEADER. The header \
asserted \"every box carries AEAT's own five-digit number, so not one number here is \
minted\": true of the records it was written for, FALSE for T22003C01, which carries five \
