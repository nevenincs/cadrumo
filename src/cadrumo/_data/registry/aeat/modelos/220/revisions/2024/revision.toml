[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORDS T22007D00, T22007E00, T22007F00 AND T22007H00 ARE \
AUTHORED, 20 casillas, the four sibling per-operation detail records under OTRAS \
CORRECCIONES A LA SUMA DE BASES IMPONIBLES: eliminacion de dividendos internos no exentos \
del grupo fiscal; incorporacion de deterioros de valor de participaciones en fondos \
propios de entidades del grupo fiscal eliminados en periodos anteriores; those same \
deterioros pendientes de incorporar al termino del periodo; and otras correcciones no \
comprendidas en los apartados anteriores. Revision total 1299 casillas over TWENTY-TWO of \
the design's 137 records. THE NUMBER SET DECIDED THE CASILLA SET, NOT THE SHAPE: each \
record is 50 detail blocks carrying NO box number plus ONE numbered total, so ONE row is \
declared per record and a layout repeat writes the rest. Declaring every block would have \
minted 200 casillas per record for 4 declared values. THE STRIDE IS PROVEN in each: 16 + \
39x50 lands exactly on @1966 in three of them and 16 + 95x50 on @4766 in T22007H00, where \
the total begins. VERIFIED -- THE ROW INDEX IS PRINTED IN TWO DIFFERENT FORMS ACROSS FOUR \
SIBLING RECORDS OF ONE FAMILY, and that is the finding of this iteration. T22007D00 and \
T22007H00 print a parenthesised ordinal after the concept; T22007E00 and T22007F00 print a \
TRAILING DIGIT. Four records, one family, one purpose, two notations. The generator \
therefore TRIES BOTH FORMS on every record and requires exactly one to explain every line \
of the run -- an ambiguous or unexplained record refuses rather than being read under the \
form its neighbour used. The ordinals found are then asserted to be exactly 1..50 with \
each appearing once per block field, which is what rules out a description that merely \
ends in a number. CORRECTED BEFORE SHIPPING -- THE PERIOD-SPACING RULE REWROTE \"N.I.F.\" \
AS \"N. I. F.\" on eight labels. It is the SAME defect as last iteration's, where the same \
rule rewrote the legal reference \"DT 24.5 LIS\" as \"DT 24. 5 LIS\": a normalisation \
written to make two strings compare equal reaching a third string that was already \
correct. It now requires two letters before the period, so it cannot enter an \
abbreviation. The previous iteration's records were re-generated under the sharper rule \
and are BYTE-IDENTICAL, so nothing already shipped carried the defect. VERIFIED -- AEAT \
MISSPELLS \"Deterioro\" AS \"Deteriorio\" on every detail line of T22007E00, and breaks \
the \"fi\" ligature in \"grupo fi scal\" in its total -- the same ligature defect already \
transcribed on families 09 and 16. Corrected in the operator labels, kept as printed in \
the fragment comments, and every correction applied is listed on the fragment's own face. \
VERIFIED -- THE RECORD SUBJECT IS DERIVED FROM THE TOTAL'S OWN TEXT, not retyped: \
T22007E00 and T22007F00 share two detail lines WORD FOR WORD, and only the subject tells \
them apart. Both the detail heading and the total heading are derived as the common prefix \
of their own group. VERIFIED -- COMPLETENESS COMPLEMENT ASSERTED IN THE GENERATOR: all \
211, 211, 211 and 211 design fields are authored, covered by the repeat, or named as \
excluded, with an empty difference; the type table is asserted to cover exactly the \
authored offsets. All four tile 1..2144, 1..2144, 1..2144 and 1..4944 exactly once with NO \
gap and NO PARTIAL OVERLAP. Year-clean: aeat-dr-220-2024 applies exactly the single \
ejercicio this revision claims. NOT CLAIMED -- 10437 OF THE 11570 (record, number) SLOTS \
REMAIN UNMODELLED across 111 of the 133 records that carry numbers; 1133 slots are \
modelled, zero orphaned. A coverage figure is only true against the extractor of the day \
it was measured. NOT CLAIMED -- THE TOTALS ARE DECLARED, NOT COMPUTED, and nothing \
expresses that these four corrections FEED the suma de bases imponibles they are named \
for. Each total is the sum of its own correccion column down 50 detail rows and NO \
formula, construct or binding says so. NOT CLAIMED -- THE STANDING CROSS-RECORD HAZARD IS \
UNCHANGED. Box 00562 is declared twice, as T22009000:00562 and T220DID00:00562, and the \
design prints some numbers in as many as seven records. A layout must bind such casillas \
to the SAME value rather than collect them twice, and NOTHING ENFORCES THAT TODAY. NOT \
CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. The modelo cannot be \
filed. model_law_authority_scope remains inspection_only, so this stamp is made under the \
LOWER inspection bar and MUST be re-made if a layout lands. NOT CLAIMED -- T22009001, \
T22012A00 and T22012A10 remain deliberately held back, the first for two byte-identical \
descriptions whose jurisdiction the design does not state, the others for colliding label \
keys. NOT CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: the 20 labels were translated by the \
same agent that authored the casillas and reviewed by nobody else; the catalogues are \
unaccented ASCII, asserted, which caught one accented Catalan string in this batch. All \
1299 casillas resolve a non-null label in es, en, ca and hu, counted by VALUE rather than \
by key, and duplicate Spanish labels across the revision are ZERO. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
