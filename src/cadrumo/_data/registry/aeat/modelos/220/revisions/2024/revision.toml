VERIFIED -- TWO OF THE 140 ROWS NAME NO TERRITORY. They sit fifth in a run of five. \
Measuring the other runs showed FIFTEEN end in \"Total territorios forales\" against only \
TWO in \"Territorio comun\", so the majority pattern points at the former. That is an \
