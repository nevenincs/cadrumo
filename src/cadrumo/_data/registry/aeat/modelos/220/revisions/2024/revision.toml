[revisions."2024"]
authority_grade = "applicability"
# Modelo 220 declaración anual del Impuesto sobre Sociedades del grupo fiscal en
# régimen de consolidación fiscal. The IS declaration models for períodos
# impositivos iniciados en 2024 are approved by Orden HAC/657/2025
# (BOE-A-2025-12818); the bundled excerpt's art 3 names "Modelos 200 y 220"
# verbatim, evidencing that Modelo 220 is one of the approved models. The filing
# plazo is the general IS declaration plazo of art. 124.1 LIS (25 días naturales
# tras los 6 meses posteriores a la conclusión del período impositivo). This is a
# scheduling/applicability-grade revision carrying declaration-header casillas
# only; the money-closure casillas of the group declaration are deferred, and no
# casilla number is fabricated.
#
# CORRECTED REASON. This previously read "deferred until an authoritative Modelo
# 220 diseño de registro is bundled". FOUR are bundled and all four load through
# the real record-design IR -- aeat-dr-220-2022 (124 sheets / 14,851 fields),
# -2023 (127 / 15,648), -2024 (136 / 16,066) and -2025 (140 / 16,707) -- and the
# 2024 and 2025 ones are named in this revision's own source_refs above. Design
# availability is not what blocks the casillas.
#
# What blocks them is that this single open-ended revision SPANS A RE-LAYOUT.
# test_revision_span_matches_published_designs measures the 2024/2025 boundary as
# 4,524 of 7,466 shared boxes moved, 216 boxes added and 130 removed, and the
# record set changing 137 -> 141; it reports "needs 2 revisions" and its stated
# fix is to split at that boundary. Authoring one layout across the span would be
# wrong for whichever year it did not follow.
#
# AMENDING ORDEN ACQUIRED AND CITED (2026-08-22). The gate's instruction was
# explicit -- acquire and cite the BOE orden that authorises the later layout,
# and do NOT satisfy it with design evidence alone. Orden HAC/529/2026
# (BOE-A-2026-11583) is that orden: it approves the IS declaration models for
# períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de
# 2025, the successor to orden-hac-657-2025's 2024 models. Its art 6.3 is the
# Modelo 220-specific plazo, grounding the group declaration in LIS art 75.2 --
# the plazo of the representante's individual declaration -- rather than the
# general art 124.1 plazo, and it names «el Modelo 220 de declaración aprobado
# en el artículo 1 de la presente orden», which is itself operative evidence
# that art 1 approves this modelo. That is firmer grounding than the 2024-era
# citation, whose only bundled provision naming 220 is art 3's domiciliación
# heading. Its disposición final segunda fixes the 2025 temporal boundary.
#
# NOT SPLIT YET. The split gate (test_no_revision_spans_a_design_relayout) does
# not flag this revision: it carries no export layout, so there are no byte
# offsets for a re-layout to write wrongly, and the harm the split prevents does
# not yet exist here. The split becomes required the moment an export layout is
# authored, and the 4,524-of-7,466 moved boxes at the 2024/2025 boundary say
# which side any such layout would have to pick.
valid_from = 2024-01-01
valid_to = 2024-12-31
period_selector = { year_from = 2024, year_to = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-657-2025:art-3"]
legal_refs = [
    "orden-hac-657-2025:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "aeat-dr-220-2024",
    "aeat-modelo-200-manual-2024",
    "boe-modelo-200-2025-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the Impuesto sobre Sociedades grupo-fiscal \
consolidated declaration. DISCLOSURE -- self-review: the same agent authored the casillas \
being reviewed. VERIFIED -- RECORD T22009000 IS AUTHORED, 63 casillas, the liquidacion del \
grupo: from the cuota integra through the bonificaciones, the deducciones por doble \
imposicion and the otras deducciones to the cuota liquida, the cuota diferencial, the \
resultado de la autoliquidacion and the liquido a ingresar. Revision total 1205 casillas, \
THIRTEEN of the design's 137 records. Every casilla carries a real AEAT box number and a \
`segmento`. I MADE THE TRUNCATION MISTAKE A THIRD TIME, AND THAT IS THE SUBSTANCE OF THIS \
REVIEW. The previous stamp recorded, having made the error twice in one pass, that a \
matcher must never be built from truncated output. In this iteration I built the label \
table's KEYS by transcribing them from a 150-character-truncated listing, and SIX were \
subtly wrong: \"Cap III Tit VII\" transcribed as \"Cap III Tit VI\", \"art 30 RDLEG \
4/2004\" as \"art 30 LIS RDLeg 4/2004\", \"arts 31 y 32 RDLEG 4/2004\" as \"arts 31 y 32 \
LIS\", and three more of the same kind. WHAT CAUGHT IT WAS NOT THE WRITTEN LESSON BUT AN \
ASSERTION IN THE CODE. The label table refuses to fall back to Spanish and reports every \
unmapped tail, so six casillas could not be labelled and the generator stopped. The fix \
was to DUMP THE EXACT STRINGS FROM THE DATA rather than retype them from a display. The \
durable finding is that writing a lesson down did not prevent me repeating it three \
iterations running; only a mechanical check did. Put the check in the code, not in the \
notes. AND THE CORRECTION INTRODUCED A SECOND, QUIETER DEFECT, which is recorded because \
nothing automated caught it. Renaming those six table keys left THREE translations \
attached to their old law references: one key read \"arts 31 y 32 LIS\" while its English \
still said \"art. 100.11 LIS\", and another read \"art 30 RDLEG 4/2004\" while its \
translations still said \"art. 30 LIS\". These were found by reading the diff, not by any \
gate, and realigned. A key rename moves the key and not the value under it, and a \
translation table has no way to notice that its value no longer matches its key. VERIFIED \
-- CONCEPT AND JURISDICTION ARE DERIVED, NOT MATCHED. Most lines carry an Estado or a D. \
Forales/Navarra suffix and the concept is whatever remains once it is removed, so the \
decomposition cannot mis-match. Zero key collisions across the record. VERIFIED -- AEAT \
BREAKS THE \"fi\" LIGATURE ACROSS A SPACE in several places on this family -- \"Bonifi \
caciones\", \"Transparencia fi scal\", \"especifi cas\" -- transcribed as printed in the \
fragment comments and corrected in the operator-facing labels, the same treatment given to \
\"insufi ciencia\" on family 16. NOT SHIPPED, DELIBERATELY -- SIBLING RECORD T22009001. It \
contains casillas 02796 and 02797 whose descriptions are BYTE-IDENTICAL, both ending \
\"Estado.\", at adjacent offsets @220 and @237. The pair immediately above them, 02794 and \
02795, is the same concept split \"Estado\" and \"D. Forales / Navarra (totales)\", so \
AEAT has repeated the wrong suffix. Which of the two is the foral column is NOT something \
the design states, and guessing would put a jurisdiction on a filed box on the strength of \
a neighbouring row's shape. The record is fully extracted, tiles clean and decomposes with \
a single collision at exactly that pair; it waits for a resolution rather than shipping a \
guess. VERIFIED -- 63 design numbers, ALL authored, ZERO missing and ZERO invented; every \
field of the record is either authored or explicitly excluded; the record tiles 1..1248 \
exactly once with NO gap and NO PARTIAL OVERLAP; all 1205 label keys non-null across \
es/en/ca/hu verified by counting VALUES; duplicate Spanish labels across the revision \
ZERO. Year-clean: aeat-dr-220-2024 applies exactly the single ejercicio this revision \
claims. NOTED -- the suite shows one new entry, test_loader_cache_isolation's \
shared-disk-cache test, which is the known parallel-run flake: all eleven tests in that \
module pass single-process. A peer's modelo 210 continuidad failure cleared in the same \
window. NOT CLAIMED -- 10483 OF THE 11605 (record, number) SLOTS REMAIN UNMODELLED across \
124 of the design's 137 records; 1122 slots are modelled. 1205 casillas describe thirteen \
records. NOT CLAIMED -- THIS RECORD IS A SETTLEMENT CHAIN AND NOT ONE OF ITS RELATIONS IS \
MODELLED. Cuota integra less bonificaciones and deducciones gives cuota liquida; less \
retenciones gives cuota diferencial; and so on to the liquido a ingresar. Every one of \
those steps is DECLARED as a box and NONE is computed: no formula, construct or binding is \
attached to any casilla here. A reader should not mistake a complete settlement record for \
a working settlement. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT MEMBERSHIP CHANGE. \
The modelo cannot be filed. model_law_authority_scope remains inspection_only, so this \
stamp is made under the LOWER inspection bar and MUST be re-made if a layout lands. NOT \
CLAIMED -- T22012A00 and T22012A10 also remain held back, for colliding label keys. NOT \
CLAIMED -- LOCALES COMPLETE BUT UNAUDITED: the 56 line concepts were translated by the \
same agent that authored the casillas and reviewed by nobody else, and three of them were \
briefly wrong in exactly the way described above; the Spanish is unaccented ASCII. NOT \
CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-23

[revisions."2024".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition \
between two revisions of the same modelo, and every evolution already declared anywhere in this registry is \
authored on the revision it lands on (its to_revision). Revision '2024' of modelo 220 has no strictly-earlier \
sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot \
be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is \
empty by construction, not by omission.
"""
