# Modelo 220 RECORD T22012000 -- deducciones por doble imposicion: interna bajo el
# RDLEG 4/2004, interna bajo la DT 23a LIS, internacional bajo el RDLEG 4/2004,
# internacional bajo la LIS, y el tipo de gravamen del ejercicio.
#
# 180 casillas, EVERY ONE carrying a real AEAT box number. This is the first record
# authored for this modelo in which that is true of every casilla: T22001000 numbered
# twelve of seventy-seven, and T22002000 numbered none at all because it prints none.
#
# THE RECORD IS A NUMBERED GRID. Each of its 179 money cells is a 17-position amount at
# the intersection of a deduction family, a generation scope and a settlement column,
# and AEAT numbers every cell separately. There is no repetition to collapse and no
# field without a number: one casilla per cell, one number per casilla.
#
# HOW THE IDS WERE DERIVED, and why it is not a guess. The 180 descriptions were
# decomposed into four closed axes -- family (5 values), group (6), scope (22) and
# column (6) -- and the decomposition was checked two ways before any id was minted:
# every one of the 180 resolves into known vocabulary with NOTHING unresolved, and the
# resulting (family, group, scope, column) keys are UNIQUE across all 180 with no
# collision. A first attempt using only three axes produced seven colliding keys
# covering nineteen numbers; the missing axis was the group qualifier AEAT prints
# before a colon ("DI interna ejerc. anteriores:", "DI juridica ... art. 31 LIS"). The
# collision check is what caught it, and it is the reason the ids can be trusted to
# name distinct cells rather than accidentally merging two.
#
# AEAT MISSPELLS ITS OWN SECTION HEADING FOUR WAYS in this record -- "RDLEG 4/2004",
# "RDLEG4/2004", "RDL 4/2004" and "RDLRG 4/2004" -- and twice truncates a column label
# ("licado en esta liquidacion" for "Aplicado en esta liquidacion"). All four spellings
# and both truncations are matched deliberately rather than corrected, so the
# decomposition reflects what the design says. The casilla labels use the corrected
# form, because a label is read by an operator while the match is read against AEAT.
#
# TYPES: every cell is `money` except the tipo de gravamen at @3059+6, which is a rate
# and is typed `ratio`.
#
# Grounded in aeat-dr-220-2024, whose applies_from and applies_to are 2024-01-01 and
# 2024-12-31 -- exactly the single ejercicio this revision claims. T22012000 tiles
# 1..3226 exactly once with NO gap and NO PARTIAL OVERLAP, both checked, and every
# number, offset, length and type below was read from its own field description.
#
# NOT MODELLED, deliberately: the modelo and pagina identifier envelope at @1..@11, the
# pagina-complementaria mechanics at @12+1 and @13+3, the "RESERVADO PARA LA
# ADMINISTRACION" run at @3065+150, and the end-of-record marker at @3215+12. None is
# filer-supplied.
#
# NOT CLAIMED: these casillas DECLARE the deduction grid; none of them computes it.
# No formula, construct or binding is attached, and the revision still carries no
# export layout, so the modelo cannot be filed. This is the third of the design's 137
# records to be authored.

