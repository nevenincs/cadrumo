# Modelo 220 declaration-header casillas: the two applicability-grade facts
# (ejercicio, tipo de declaración) grounded in the Orden HAC/657/2025 art 3
# coverage of Modelo 220 and the art. 124 LIS declaration framework. Both keep a
# slug number rather than a byte span, because they name a fact rather than a
# position; a layout will bind decl.ejercicio to T22001000 @106+4.
#
# The comment here formerly said no casilla-to-position mapping had been authored
# from the bundled designs. That is no longer true: the sibling fragment
# cidentificacion.nif__ccontacto.email.toml maps record T22001000 from
# aeat-dr-220-2024. It remains true for the OTHER 136 records of that design, and
# the numbered money-closure casillas of the group declaration are still not
# declared anywhere in this revision.
#
# source_refs corrected 2026-08-15: boe-modelo-200-2025-form (a 2308-byte orden
# excerpt) was found to carry no layout content and retiered to
# official_source_guidance -- it remains a genuine citation (the orden covering
# Modelo 220), but these two casillas cited it alone, so aeat-dr-220-2024 (the
# real, era-matching bundled Diseño de Registro) is added rather than swapped.

[[revisions."2024".casillas]]
id = "decl.ejercicio"
number = "ejercicio"
section = ["declarante"]
data_type = "year"
semantic_role = "filing_year"
required = true
input_kind = "informational"
legal_refs = ["orden-hac-657-2025:art-3", "ley-27-2014:art-124"]
source_refs = ["boe-modelo-200-2025-form", "aeat-dr-220-2024"]

[[revisions."2024".casillas]]
