# Modelo 220, declaracion del Impuesto sobre Sociedades de los grupos fiscales en
# regimen de consolidacion fiscal, for periodos impositivos iniciados en 2022.
#
# APPROVAL. Orden HFP/523/2023 (BOE-A-2023-12416, BOE de 29 de mayo de 2023) art. 1.1.a).2.o approves
# "Modelo 220: Declaracion del Impuesto sobre Sociedades-Regimen de consolidacion
# fiscal correspondiente a los grupos fiscales, que figura en el anexo II" for the
# periodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2022;
# art. 1.3 applies it to the grupos fiscales of capitulo VI del titulo VII LIS. Art.
# 6.3 sets its plazo, the representante's individual plazo under LIS art. 75.2, and
# art. 3.2 the domiciliacion window.
#
# DESIGN. aeat-dr-220-2022 is AEAT's own diseno de registro for ejercicio 2022. It
# differs from the 2023 design, so this edition is authored from it rather than
# projected from the later one: 1691 casillas are declared where this design
# prints them and 328 rows of the 2024 edition are left undeclared as debt
# (see casillas/0001-declarations.toml).
#
# Grade: applicability, the 2024 edition's. No formula, construct relation or
# binding computes or checks these casillas and there is no export layout, so
# the modelo is not filed for this year.
valid_from = 2022-01-01
valid_to = 2022-12-31
period_selector = { year_from = 2022, year_to = 2022, periods = ["0A"] }
orden_aplicabilidad = ["orden-hfp-523-2023:art-1"]
legal_refs = [
    "orden-hfp-523-2023:art-1",
    "orden-hfp-523-2023:art-6-3",
    "ley-27-2014:art-124",
    "ley-27-2014:art-75-2",
]
source_refs = [
    "boe-modelo-220-2022-form",
    "aeat-dr-220-2022",
    "aeat-modelo-200-manual-2022",
]
review_status = "pending_review"
