# -----------------------------------------------------------------------------
# Mínimo del contribuyente (LIRPF arts. 56 + 57 + 73).
# The statutory baseline is 5,550 EUR per LIRPF art. 57. Autonomous
# communities may modify the autonómica portion per LIRPF art. 73.
# CCAA-specific 2025 uplifts (Madrid / Canarias / Galicia were
# observed but not verifiable against the AEAT
# part2-deducciones-autonomicas PDF — the corpus stores only the
# binary, no plaintext for `required_text` corpus-checks). Until
# those uplifts are extracted from the manual and properly grounded,
# the dispatch table routes every CCAA to the statutory baseline.
# Operators in CCAAs that legislate an uplift can override casilla
# 0512 manually for now.
# -----------------------------------------------------------------------------
