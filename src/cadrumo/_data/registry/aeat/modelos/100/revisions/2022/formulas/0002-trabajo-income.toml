# Casilla 0023, the art. 20 LIRPF reduction. It measures the rendimiento neto del trabajo before the
# art. 19.2.f expenses, which is the box 0018, and is lost when the other rentas exceed the limit.
# The second term of the minimum keeps the balance after the reduction from going negative.
[[revisions."2022".formulas]]
id = "renta-trabajo-reduccion-gastos-generales"
target_casilla_id = "0023"
expression = { op = "if_then_else", args = [
    { op = "less_equal", args = [{ casilla_id = "0018" }, { literal = "0" }] },
    { literal = "0" },
    { op = "if_then_else", args = [
        { op = "greater_than", args = [
            { casilla_id = "rentas-distintas-del-trabajo" },
            { parameter = "renta-trabajo-reduccion-otras-rentas-limite" },
        ] },
        { literal = "0" },
        { op = "min", args = [
            { op = "lookup_bracket", args = [
                { casilla_id = "0018" },
                { parameter = "renta-trabajo-reduccion-art-20" },
            ] },
            { op = "max", args = [{ literal = "0" }, { casilla_id = "0022" }] },
        ] },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-20"]
source_refs = ["lirpf-cuota-chain-authority"]

