continuidad_evidence = "Official AEAT Renta manuals ground the same autonomous regularization bucket in both exercises: Manual práctico de Renta 2024, Parte 1, chapter 18, section 'Incremento de las cuotas líquidas, estatal y autonómica, por pérdida del derecho a deducciones de ejercicios anteriores' (p. 1465), states that improper autonomous deductions and their delay interest increase the autonomous liquid quota; the 2025 Parte 1 manual, same chapter and section (p. 1354), applies the same treatment for deductions lost in 2025. AEAT dictionaries aeat-dr-100-2024-dictionary:916 and aeat-dr-100-2025-dictionary:942 map DED97A at /DatosEconomicos/Resultados/CalculoImpuestoRes/GravamenesRes/DED97A [P102] to box 0577 in both revisions as the autonomous part. The exercise year is the only label change; section, semantic_role, legal_refs, box number, and representation remain stable, with the 2025 legal reference addition recorded as an evolution. Continuity is grounded in the official field and manual context, not the number alone."
