# Modelo 2023 LIRPF art. 58 / 61 QUALIFYING CONDITIONS for the minimo familiar.
#
# The minimo AMOUNTS of art. 58 are already registry parameters in this revision.
# The conditions that SELECT which amount applies -- the ordinary age ceiling, the
# menor-de-tres supplement ceiling, and the art. 61.4a shared-custody prorrata --
# existed only as Python literals, so a consumer could resolve the money but not
# the rule that awards it. The sibling age-band parameters carry their band in the
# FILENAME rather than in a field, which is the same gap from the other side.

