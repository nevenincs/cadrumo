# LIRPF art. 75 (autonómica): under the anualidades por alimentos separate-escala
# régimen the total cuota autonómica is minorada by the escala del art. 74
# applied to the mínimo personal y familiar INCREMENTADO EN 1.980 euros anuales.
# The regime gate is identical to casilla 0529; nested so the flag is only read
# when both casilla conditions hold. The else-branch escala_ccaa(0521) is
# byte-identical to the ordinary chain.
[[revisions."2022".formulas]]
