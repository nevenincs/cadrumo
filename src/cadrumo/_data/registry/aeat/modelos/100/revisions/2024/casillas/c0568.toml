continuidad_evidence = "Official AEAT dictionaries establish the same state incentive-loss field in both exercises: aeat-dr-100-2024-dictionary:909 and aeat-dr-100-2025-dictionary:935 map DED33E at /DatosEconomicos/Resultados/CalculoImpuestoRes/GravamenesRes/DED33E [P102] to box 0568, with the same description for loss of the incentive regulated by article 33.3(c) of the Income Tax Law. The 2024 and 2025 Renta Parte 1 manuals discuss the article 33.3 incentive and the Chapter 18 rule that amounts improperly deducted after loss of entitlement are added to the liquid quota. The state section, semantic_role, legal_refs, box number, and representation are stable; there is no renumbering or repurpose. Continuity is grounded in the official field path, legal concept, and cross-year design, not the number alone."
