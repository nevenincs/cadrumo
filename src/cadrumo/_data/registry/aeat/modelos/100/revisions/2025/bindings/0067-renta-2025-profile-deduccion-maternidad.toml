# Modelo 100 casilla 0611: Art. 81.1 LIRPF deducción por maternidad.
#
# Art. 81.1 applies a different cap to each qualifying child, so the fold over
# descendant records happens in the canonical profile resolver and the registry
# consumes the one derived scalar. This binding is the revision-scoped
# enrolment point: the derived-fact injector is gated on a declared consuming
# selector, so declaring it here extends coverage to 2025 with no code change.

[[revisions."2025".bindings]]
id = "renta-2025-profile-deduccion-maternidad"
source = "profile"
selector = { profile_key = "renta_family.deduccion_maternidad_2025" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-81"]
source_refs = ["aeat-renta-2025-manual-parte1", "aeat-dr-100-2025-dictionary"]

[[revisions."2025".bindings.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = [
    "Deducción por maternidad",
    "Por tanto, 100 euros por cada mes.",
    "El importe de la deducción por maternidad por cada hijo que otorgue derecho a la misma no podrá superar 1.200 euros anuales",
]
