#     every cited source's corpus file is present on disk;
#   - every formula targets a casilla of this revision;
#   - every enrolled schema family resolves;
#   - every cited source's applicability window overlaps this revision's own life;
#   - and the registry declares every casilla the bundled dictionary for this
#     filing year NUMBERS: the dictionary-side population comparison reports no
#     numbered box the registry lacks.
#
# This revision's export layout is an xml_dictionary carrying no fixed-width
# records, so no record-to-design-sheet pairing exists to measure and none is
# claimed. The opposite direction of the comparison -- registry casillas the
# dictionary does not number -- is deliberately not a completeness signal: it
# counts app-level inputs AEAT has no box for.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
