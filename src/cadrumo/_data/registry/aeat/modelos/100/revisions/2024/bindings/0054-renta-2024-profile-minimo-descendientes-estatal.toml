# Art. 58 LIRPF mínimo por descendientes aggregate, parte estatal. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) ranks
# every Art. 58.1-eligible descendant by birth_date, sums the birth-order
# tranche (Art. 58.1: 2.400 / 2.700 / 4.000 / 4.500 €) plus the Art. 58.2
# menor-3 supplement (2.800 €), and applies the Art. 61.1ª custodia-compartida
# prorrata (0.5) per descendant, projecting the result onto the Decimal fact
# `renta_family.descendientes_minimos_aggregate_2024` (the user-profile schema
# field named as a dangling selector, its former binding deleted in commit
# bc3b89594 -- retired here).
# Feeds casilla 0513 (estatal) only — casilla 0514 (autonómico) is fed by the
# sibling binding `renta-2024-profile-minimo-descendientes-autonomico`, which
# resolves each tranche against the filer's declared tax-residence CCAA (some
# comunidades, e.g. Madrid, publish their own divergent figures; Ley 22/2009
# art. 46.1.a), matching the 0511/0512 mínimo-del-contribuyente precedent
# (`renta-2024-minimo-contribuyente-autonomico`).
[[revisions."2024".bindings]]
id = "renta-2024-profile-minimo-descendientes-estatal"
source = "profile"
selector = { profile_key = "renta_family.descendientes_minimos_aggregate_2024" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61"]
source_refs = ["aeat-dr-100-2024-dictionary", "aeat-renta-2024-manual-parte1"]

[[revisions."2024".bindings.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = ["Mínimo por descendientes"]
