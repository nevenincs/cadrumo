# Modelo 100 Art. 81.1 LIRPF deduccion por maternidad figures.
#
# Authored because these existed ONLY as Python literals in
# core.external_constants, while the Art. 81.2 guarderia cap of the SAME article
# already had a resolvable parameter. One article was carried two ways in one
# product: the money in the registry for apartado 2, and in code for apartado 1.
#
# The ordinary monthly accrual and the annual cap per hijo are the two figures
# the ordinary formula needs; the post-birth alta increment is a third, distinct
# figure that only ADDS to a hijo's total and raises that hijo's cap. The raised
# cap is deliberately NOT authored as a fourth parameter: it is the sum of the
# cap and the increment, and storing a derived total as an independent value is
# how the two inputs drift apart from it.

# LIS DA 18, as redacted by RDL 4/2024 art. 4.Uno, grants free depreciation of
# electric vehicles and charging points only for tax periods that began on or
# after 2024-01-01 and had not concluded when that real decreto-ley entered into
# force on 2024-06-28; LIRPF DA 59 extends it to IRPF activity income. An IRPF
# period ends before 31 December only on the taxpayer's death (LIRPF art. 13),
# and the 2024 Renta manual keeps the accelerated regime for a taxpayer who died
# before 2024-06-28. These rows cannot express that condition, and the product
# cannot represent such a period today: the declarant's death date is carried
# only as the identification datum DECFAL, every calculation fixes the IRPF
# devengo at 31 December of the filing year, and the activity-asset schedule
# prorates over the whole calendar year. A 2024 period that ended before
# 2024-06-28 is therefore outside what these rows ground.

