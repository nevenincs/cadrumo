# Modelo 100 Art. 81.1 LIRPF deduccion por maternidad figures.
#
# Authored because these existed ONLY as Python literals in
# core.external_constants, while the Art. 81.2 guarderia cap of the SAME article
# already had a resolvable parameter. One article was carried two ways in one
# product: the money in the registry for apartado 2, and in code for apartado 1.
#
# The ordinary monthly accrual and the annual cap per hijo are the two figures
# the ordinary formula needs; the post-birth alta increment is a third, distinct
# figure that only ADDS to a hijo's total and raises that hijo's cap. The raised
# cap is deliberately NOT authored as a fourth parameter: it is the sum of the
# cap and the increment, and storing a derived total as an independent value is
# how the two inputs drift apart from it.

