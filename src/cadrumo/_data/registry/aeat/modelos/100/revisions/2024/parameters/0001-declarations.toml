valid_to = 2024-12-31
# Modelo 100 Art. 61 norma 4a LIRPF death-in-period flat minimo por descendientes.
# A descendant who dies during the periodo impositivo and generates the minimo
# takes THIS flat figure instead of the Art. 58.1 birth-order tranche that would
# otherwise correspond to their rank.
#
# This figure COINCIDES with the Art. 58.1 first-child tranche
# (renta-2024-minimo-descendientes-primer-hijo-2024) in every revision served
# today, and is deliberately NOT bound to it. They are legally distinct: the
# tranche is fixed by Art. 58.1 and moves with birth order, this one is fixed by
# Art. 61 norma 4a and applies at ANY birth order. Binding them would silently
# move the death amount if a future reform moved the first-child tranche, so the
# coincidence of values must never become a shared authority.
#
# The second required_text below pins the ordering limb rather than this
# parameter's value. It is carried here on purpose: Art. 61 norma 4a's statutory
# text fixes only the amount, while the AEAT manual's "Cuantias aplicables"
# section adds that the deceased is dropped from the age ordering that ranks the
# survivors. That limb has no other registry home, and omitting it over-grants
# every younger sibling by leaving them at a rank the deceased should have
# vacated. Citing it here makes the whole rule fail loudly if the manual passage
# this reading depends on ever moves.

[[revisions."2024".parameters]]
id = "renta-minimo-descendientes-fallecimiento"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-61", "ley-35-2006:art-61-norma-4"]

[[revisions."2024".parameters.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = [
    "En caso de fallecimiento de un descendiente que genere derecho al mínimo por este concepto, la cuantía aplicable es de 2.400 euros",
    "sin computar a estos efectos aquellos descendientes que, en su caso, hubieran fallecido en el ejercicio con anterioridad a la fecha de devengo del impuesto",
]

[[revisions."2024".parameters.values]]
value = "2400"
date_axis = "filing_period"
valid_from = 2024-01-01
valid_to = 2024-12-31
# Modelo 100 Art. 81.2 LIRPF annual cap on the guarderia increment (casilla 0613).
#
# The maximum the deduccion por maternidad may be increased for one child's
# gastos de custodia in a full period: "se podra incrementar hasta en 1.000
# euros adicionales". It is an ANNUAL ceiling, not a flat entitlement -- art.
# 81.3 prorates it by the months the apartado 1 and apartado 2 requirements
# hold simultaneously, and bounds the result at that child's own non-subsidised
# spend. The registry formula must therefore never apply this figure directly
# per child; it is the numerator of a proration.
#
# Authored as its own parameter because the figure previously existed ONLY as an
# inline literal inside the 0613 formula expression. That is legitimate registry
# data but is unreadable from the application layer, and the per-child proration
# is computed there -- so the figure had no home the calculation could resolve.
#
# Declared for the 2024 revision alone, deliberately. It is the only revision
# that declares casilla 0613, and the only one where the casilla is computed
# rather than a manual form-native entry. Authoring it for revisions that
# declare no consumer would add orphan parameters carrying a regulatory value
# nothing resolves.

[[revisions."2024".parameters]]
id = "renta-guarderia-incremento-cap-anual"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-81", "ley-35-2006:art-81-2", "ley-35-2006:art-81-3"]
additional_source_refs = ["aeat-dr-100-2024-dictionary"]

[[revisions."2024".parameters.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = [
    "puede alcanzar hasta 1.000 euros anuales y se calculará proporcionalmente al número de meses",
    "1.000 euros ÷ 12 meses x 2 meses) = 166,67",
]

[[revisions."2024".parameters.values]]
value = "1000"
date_axis = "filing_period"
valid_from = 2024-01-01
valid_to = 2024-12-31
# Modelo 100 Art. 81.1 LIRPF deduccion por maternidad figures.
#
# Authored because these existed ONLY as Python literals in
# core.external_constants, while the Art. 81.2 guarderia cap of the SAME article
# already had a resolvable parameter. One article was carried two ways in one
# product: the money in the registry for apartado 2, and in code for apartado 1.
#
# The ordinary monthly accrual and the annual cap per hijo are the two figures
# the ordinary formula needs; the post-birth alta increment is a third, distinct
# figure that only ADDS to a hijo's total and raises that hijo's cap. The raised
# cap is deliberately NOT authored as a fourth parameter: it is the sum of the
# cap and the increment, and storing a derived total as an independent value is
# how the two inputs drift apart from it.

[[revisions."2024".parameters]]
