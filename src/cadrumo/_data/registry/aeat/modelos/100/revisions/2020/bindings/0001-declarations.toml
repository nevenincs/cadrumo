# Eligibility flag for the LIRPF art. 64/75 anualidades por alimentos separate-
# escala régimen. Art. 64 grants the separate escala only to a payer who
# satisfies judicial anualidades "sin derecho a la aplicación por estos últimos
# del mínimo por descendientes previsto en el artículo 58". The flag is a
# derived profile fact (renta_family.anualidades_sin_minimo_descendientes_2020):
# true (eligible — the non-custodial payer without the mínimo) by default, false
# when custody is shared (custodia compartida splits the mínimo por descendientes, so
# the payer retains it and the régimen does not apply). Consumed by the cuota
# escala formulas (0528/0530/0529/0531) inside the régimen predicate.
# Art. 58 LIRPF mínimo por descendientes aggregate, parte estatal. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) ranks
# every Art. 58.1-eligible descendant by birth_date, sums the birth-order
# tranche (Art. 58.1: 2.400 / 2.700 / 4.000 / 4.500 €) plus the Art. 58.2
# menor-3 supplement (2.800 €), and applies the Art. 61.1ª custodia-compartida
# prorrata (0.5) per descendant, projecting the result onto the Decimal fact
# `renta_family.descendientes_minimos_aggregate_2020`. Feeds casilla 0513
# (estatal) only — casilla 0514 (autonómico) is fed by the sibling binding
# `renta-2020-profile-minimo-descendientes-autonomico`, which resolves each
# tranche against the filer's declared tax-residence CCAA (some comunidades,
# e.g. Madrid, publish their own divergent figures; Ley 22/2009 art. 46.1.a).
# Art. 58/61 LIRPF mínimo por descendientes aggregate, parte autonómica. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) computes
# this aggregate using the SAME Art. 58.1/58.2 birth-order-tranche method as
# the estatal half, but resolves each tranche amount against the filer's
# declared tax-residence CCAA first (Ley 22/2009 art. 46.1.a cedes normative
# competence over this figure to each comunidad). Comunidad de Madrid publishes
# its own tercer/cuarto-y-siguientes tranche amounts for 2020 (Decreto
# Legislativo 1/2010, art. 2: 4.400 € / 4.950 € vs the general LIRPF Art. 58
# 4.000 € / 4.500 €; the primer/segundo/menor-3 figures coincide with Art. 58
# for this filing year); every other CCAA mirrors the estatal aggregate
# exactly. Feeds casilla 0514 (autonómico).

