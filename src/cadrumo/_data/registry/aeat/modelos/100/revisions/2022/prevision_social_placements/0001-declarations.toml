# The Modelo 100 casilla each Modelo 345 clave and subclave reaches, for the
# reduction for contributions to social-welfare systems (LIRPF arts. 51 and 52).
#
# No official text maps a Modelo 345 clave to a Modelo 100 casilla. A row places
# a casilla only where the subclave wording of the Modelo 345 design for the
# ejercicio (Orden HFP/823/2022, anexo, which is the ejercicio-2022 design) and
# the casilla wording of the Modelo 100 dictionary name the same instrument and
# payer; both texts are quoted. A pair that fits a casilla only by analogy is
# declared indirect_match, and a pair no text places is declared unplaced_clave:
# both reach no casilla and the operator enters the box. Line locators are to
# orden-hfp-823-2022.html.extracted.md (design) and to the 2022 dictionary
# 06-100-diccionario-declaracion-individual-ejercicio-2022 (casillas).
#
# Clave J subclave 01 reaches 0426 when the employer contributed to the same
# plan de prevision social empresarial (0426 names that plan and that condition)
# and 0465 otherwise, so it takes one row per answer.

# Design :365; dictionary :738 (0465 RGAP).
