# No bundled payer design states the four amounts below, so the taxpayer states them. They are income, and
# leaving one out could lower the tax: each is a typed figure or a statement that there is none.

# Contribuciones empresariales a planes de pensiones y mutualidades de prevision social.
[[revisions."2022".bindings]]
