# The work-income casillas read the figures of the trabajo payer records. The payer's certificate is the
# evidence (RIRPF art. 108.3) and the record is its typed copy, so each figure has one source: the sum of the
# quantity over every trabajo record of the ejercicio. The casillas are bound, carry no aeat_prefilled marker
# and take no alternate binding, so the borrador never supplies or overrides them.

# Importe integro dinerario.
[[revisions."2022".bindings]]
id = "renta-retencion-soportada-trabajo-importe-integro-dinerario"
provider = { kind = "retencion_soportada", income_class = "trabajo", quantity = "importe_integro_dinerario" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["ley-35-2006:art-17", "rd-439-2007:art-108"]
source_refs = ["boe-rirpf-art-108-3-certificado-retenciones"]

[[revisions."2022".bindings.source_citations]]
source_ref = "boe-rirpf-art-108-3-certificado-retenciones"
required_text = ["deberá expedir en favor del contribuyente certificación acreditativa de las retenciones practicadas o de los ingresos a cuenta efectuados"]

