continuidad_evidence = "Official AEAT Renta manuals ground the same Chapter 18 regularization concept in both exercises: Manual práctico de Renta 2024, Parte 1, chapter 18, section 'Incremento de las cuotas líquidas, estatal y autonómica, por pérdida del derecho a deducciones de ejercicios anteriores' (p. 1465), explains that wrongly deducted amounts and the corresponding interest are added when entitlement is lost; the 2025 Parte 1 manual, same chapter and section (p. 1354), applies the same rule for deductions lost in 2025. AEAT dictionaries aeat-dr-100-2024-dictionary:913 and aeat-dr-100-2025-dictionary:939 map DED96 at /DatosEconomicos/Resultados/CalculoImpuestoRes/GravamenesRes/DED96 [P102] to box 0572 in both revisions as the state amount. The exercise year is the only label change; section, semantic_role, legal_refs, box number, and representation remain stable, with no renumbering or repurpose. Continuity is grounded in the official field and manual context, not the number alone."
