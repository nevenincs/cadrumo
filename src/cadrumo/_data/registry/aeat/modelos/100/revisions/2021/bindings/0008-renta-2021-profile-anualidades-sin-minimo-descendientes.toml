# Eligibility flag for the LIRPF art. 64/75 anualidades por alimentos separate-
# escala régimen. Art. 64 grants the separate escala only to a payer who
# satisfies judicial anualidades "sin derecho a la aplicación por estos últimos
# del mínimo por descendientes previsto en el artículo 58". The flag is a
# derived profile fact (renta_family.anualidades_sin_minimo_descendientes_2021):
# 1 (eligible — the non-custodial payer without the mínimo) by default, 0 when
# custody is shared (custodia compartida splits the mínimo por descendientes, so
# the payer retains it and the régimen does not apply). Consumed by the cuota
# escala formulas (0528/0530/0529/0531) inside the régimen predicate.
[[revisions."2021".bindings]]
id = "renta-2021-profile-anualidades-sin-minimo-descendientes"
source = "profile"
selector = { profile_key = "renta_family.anualidades_sin_minimo_descendientes_2021" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-64"]
source_refs = ["lirpf-cuota-chain-authority"]

[[revisions."2021".bindings.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["mínimo por descendientes", "sin derecho a la aplicación"]
