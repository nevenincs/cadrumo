[[revisions."2022".formulas]]
id = "renta-2022-cuota-base-liquidable-general-autonomica"
target_casilla_id = "0533"
# Floored at 0 per LIRPF art. 75 (mirror of art. 64): "sin que pueda resultar
# negativa como consecuencia de tal minoración". Harmless for the ordinary
# chain, where escala on the base (0529) dominates escala on the mínimo (0531).
expression = { op = "max", args = [
    { literal = "0" },
    { op = "subtract", args = [{ casilla_id = "0529" }, { casilla_id = "0531" }] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-73", "ley-35-2006:art-74", "ley-35-2006:art-75-2015"]
source_refs = ["lirpf-cuota-chain-authority"]

