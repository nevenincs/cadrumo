# Escala autonómica de la Región de Murcia para 2022, deflactada un 4,1 % por el
# Decreto-ley 4/2022, de 22 de septiembre (BORM 29-09-2022, art. único, que
# modifica la DA quinta.4 del Decreto Legislativo 1/2010). LIRPF art. 74 es el
# artículo que APLICA la escala autonómica; la norma que la ESTABLECE es
# autonómica y no está empaquetada — el corpus no incluye texto normativo de
# ninguna comunidad autónoma. Por eso la evidencia se ancla en el Manual
# práctico de Renta 2022 de la AEAT (pág. 979), que reproduce la escala y su
# frase de cierre literalmente.
#
# El último tramo declara 8.716,67 € de cuota íntegra a 60.000,00 €, mientras
# que los tramos inferiores acumulan 8.625,84 €. La discontinuidad está en la
# norma, no en esta tabla: Murcia deflactó límites y tipos y arrastró la cuota
# acumulada sin deflactar a la frase final. Sólo 8.716,67 está promulgado y es
# lo que aplica la AEAT. NO corregir hacia la aritmética. Ver la entrada
# FAITHFUL TO SOURCE en test_bracket_accumulated_cuota_continuity.py y las dos
# pruebas que fijan el valor contra el manual empaquetado.
# LIRPF art. 23.2.c counts 'los dos anos anteriores a la fecha de la
# celebracion del contrato' DE FECHA A FECHA, not in days. This parameter
# declared 730 days, which is one day short whenever the two-year span
# contains a 29 de febrero, and denied tier c) to a rehabilitation finished
# exactly two calendar years before the contract. The figure was never the
# defect; the unit was.
# Modelo 100 Art. 58.1 LIRPF rentas ceiling conditioning the mínimo por
# descendientes. A descendant holding rentas anuales (excluidas las exentas)
# above this figure generates no mínimo, so the ceiling is an eligibility
# threshold rather than an amount paid.
# Modelo 100 Art. 61 norma 2ª LIRPF own-return exclusion. When the descendant
# who generates the entitlement files their own declaración for this Impuesto
# with rentas above this figure, the mínimo por descendientes does not apply at
# all. Distinct from the Art. 58.1 rentas ceiling: this one tests the
# descendant's OWN filing, not their income alone.
# Modelo 100 Art. 61 norma 4a LIRPF death-in-period flat minimo por descendientes.
# A descendant who dies during the periodo impositivo and generates the minimo
# takes THIS flat figure instead of the Art. 58.1 birth-order tranche that would
# otherwise correspond to their rank.
#
# This figure COINCIDES with the Art. 58.1 first-child tranche
# (renta-2022-minimo-descendientes-primer-hijo-2022) in every revision served
# today, and is deliberately NOT bound to it. They are legally distinct: the
# tranche is fixed by Art. 58.1 and moves with birth order, this one is fixed by
# Art. 61 norma 4a and applies at ANY birth order. Binding them would silently
# move the death amount if a future reform moved the first-child tranche, so the
# coincidence of values must never become a shared authority.
#
# The second required_text below pins the ordering limb rather than this
# parameter's value. It is carried here on purpose: Art. 61 norma 4a's statutory
# text fixes only the amount, while the AEAT manual's "Cuantias aplicables"
# section adds that the deceased is dropped from the age ordering that ranks the
# survivors. That limb has no other registry home, and omitting it over-grants
# every younger sibling by leaving them at a rank the deceased should have
# vacated. Citing it here makes the whole rule fail loudly if the manual passage
# this reading depends on ever moves.
# Modelo 2022 Art. 81.1 LIRPF deduccion por maternidad figures.
#
# Authored because these existed ONLY as Python literals in
# core.external_constants, while the Art. 81.2 guarderia cap of the SAME article
# already had a resolvable parameter. One article was carried two ways in one
# product: the money in the registry for apartado 2, and in code for apartado 1.
#
# The post-birth alta increment is declared ONLY from the filing year the route
# reaches; earlier revisions grant no increment and take the ordinary cap alone.
# The raised cap (ordinary cap plus increment) is deliberately NOT authored: it
# is a DERIVED total, and storing it independently is how it drifts from the two
# inputs that compose it.
# Modelo 2022 LIRPF art. 58 / 61 QUALIFYING CONDITIONS for the minimo familiar.
#
# The minimo AMOUNTS of art. 58 are already registry parameters in this revision.
# The conditions that SELECT which amount applies -- the ordinary age ceiling, the
# menor-de-tres supplement ceiling, and the art. 61.4a shared-custody prorrata --
# existed only as Python literals, so a consumer could resolve the money but not
# the rule that awards it. The sibling age-band parameters carry their band in the
# FILENAME rather than in a field, which is the same gap from the other side.
# Modelo 2022 LIRPF art. 23.1.a) carry-forward window for gastos de reparacion y
# conservacion.
#
# Existed only as a Python literal. It keys on the FILING PERIOD and modelo 100
# declares a revision for every supported year, so it is authorable here without
# the acquisition-year trap that blocks the LIVA bienes-de-inversion figures.
#
# The RIRPF grado-de-discapacidad threshold was authored alongside this and then
# WITHDRAWN: it cites RIRPF art. 72, which is not present in the legal catalogue,
# and the registry correctly refused it as an unknown legal id. Citing a
# catalogued-but-wrong article to make it pass would be worse than leaving the
# figure in Python, so it stays a Python constant until its provision is
# catalogued.

