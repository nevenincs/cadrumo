# Modelo 100 Art. 81.2 LIRPF annual cap on the guarderia increment (casilla 0613).
#
# The maximum the deduccion por maternidad may be increased for one child's
# gastos de custodia in a full period: "se podra incrementar hasta en 1.000
# euros adicionales". It is an ANNUAL ceiling, not a flat entitlement -- art.
# 81.3 prorates it by the months the apartado 1 and apartado 2 requirements
# hold simultaneously, and bounds the result at that child's own non-subsidised
# spend. The registry formula must therefore never apply this figure directly
# per child; it is the numerator of a proration.
#
# Authored as its own parameter because the figure previously existed ONLY as an
# inline literal inside the 0613 formula expression. That is legitimate registry
# data but is unreadable from the application layer, and the per-child proration
# is computed there -- so the figure had no home the calculation could resolve.
#
# Declared for the 2024 revision alone, deliberately. It is the only revision
# that declares casilla 0613, and the only one where the casilla is computed
# rather than a manual form-native entry. Authoring it for revisions that
# declare no consumer would add orphan parameters carrying a regulatory value
# nothing resolves.

[[revisions."2024".parameters]]
id = "renta-2024-guarderia-incremento-cap-anual"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-81", "ley-35-2006:art-81-2", "ley-35-2006:art-81-3"]
source_refs = ["aeat-renta-2024-manual-parte1", "aeat-dr-100-2024-dictionary"]

[[revisions."2024".parameters.source_citations]]
