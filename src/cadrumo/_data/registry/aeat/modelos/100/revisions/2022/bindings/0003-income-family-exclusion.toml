# Whether the profile's stated income categories positively exclude a family of rentas other than work
# income. The list the profile states is the taxpayer's complete statement for the period, so a family
# absent from a stated list is a proven zero for the LIRPF art. 20 limit; an unstated list excludes nothing.

[[revisions."2022".bindings]]
id = "renta-profile-income-family-excluded-capital-mobiliario"
provider = { kind = "profile", profile_key = "taxpayer_type.irpf_income_categories" }
value = { data_type = "boolean", channel = "boolean" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-20"]
source_refs = ["aeat-renta-2022-manual-parte1"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-renta-2022-manual-parte1"
required_text = ["El concepto de rentas, excluidas las exentas, distintas de las del trabajo incluye la suma"]

