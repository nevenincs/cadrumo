                    { key = "baleares", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "canarias", parameter = "renta-minimo-contribuyente-edad-65-74-canarias" },
                    { key = "cantabria", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "castilla_la_mancha", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "castilla_y_leon", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "cataluna", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "comunidad_valenciana", parameter = "renta-minimo-contribuyente-edad-65-74-valenciana" },
                    { key = "extremadura", parameter = "renta-minimo-contribuyente-edad-65-74" },
                    { key = "galicia", parameter = "renta-minimo-contribuyente-edad-65-74-galicia" },
