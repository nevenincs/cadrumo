[[revisions."2025".formulas]]
id = "renta-deduccion-madrid-nacimiento-adopcion"
target_casilla_id = "1039"
# Comunidad de Madrid, "Por nacimiento o adopción de hijos" (DL 1/2010 arts. 4 y 18.1).
# 1039 = eligible_count × 721,70 € when BOTH income limits are satisfied, else 0.
#   - Contribuyente double-limit: (0435 + 0460) ≤ 30.930 (individual) / 37.322,20 (conjunta).
#   - Unidad-familiar límite: (0435 + 0460 + otros miembros) ≤ 61.860.
# eligible_count is the prorrateo-weighted count of in-window cohabiting
# descendants, Madrid-scoped and supplied by the profile-derived-fact injector
# only for the determinable single/individual filer; absent (→ 0) for conjunta
# or married filers, where the operator-facing advisory surfaces the entitlement
# instead (deducción over-claim guard).
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [
        { op = "sum", args = [{ casilla_id = "0435" }, { casilla_id = "0460" }] },
        { op = "if_then_else", args = [
            { op = "equal", args = [
                { binding = "renta-profile-declaration-type" },
                { literal = "2" },
            ] },
            { parameter = "renta-deduccion-madrid-nacimiento-adopcion-limite-contribuyente-conjunta" },
            { parameter = "renta-deduccion-madrid-nacimiento-adopcion-limite-contribuyente-individual" },
        ] },
    ] },
    { literal = "0" },
    { op = "if_then_else", args = [
        { op = "greater_than", args = [
            { op = "sum", args = [
                { casilla_id = "0435" },
                { casilla_id = "0460" },
                { binding = "renta-profile-unidad-familiar-otros-miembros-base" },
            ] },
            { parameter = "renta-deduccion-madrid-nacimiento-adopcion-limite-unidad-familiar" },
        ] },
        { literal = "0" },
        { op = "multiply", args = [
            { binding = "renta-profile-madrid-nacimiento-adopcion-eligible-count" },
            { parameter = "renta-deduccion-madrid-nacimiento-adopcion-cuantia" },
        ] },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-77", "madrid-dl-1-2010:art-4", "madrid-dl-1-2010:art-18"]
source_refs = ["aeat-renta-2025-manual-deducciones-autonomicas", "boe-modelo-100-2025-form", "aeat-dr-100-2025-dictionary"]

