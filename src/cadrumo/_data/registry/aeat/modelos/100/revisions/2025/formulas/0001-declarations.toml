# -----------------------------------------------------------------------------
# Minimo del contribuyente formulas (LIRPF arts. 56 + 57 + 73).
# Casilla 0511 (estatal) is the statutory 5,550 EUR per art. 57. Casilla 0512
# (autonomica) is CCAA-dispatched per art. 73 — Madrid / Canarias / Galicia
# apply documented uplifts; other CCAAs default to the estatal baseline.
# -----------------------------------------------------------------------------
# Art. 57.1.b LIRPF: mínimo del contribuyente = base + incremento por edad al final
# del período impositivo (31 de diciembre del ejercicio).
# Edad 65–74: +1.150 €  (Art. 57.1.b primer tramo)
# Edad ≥ 75:  +1.150 € + 1.400 €  (Art. 57.1.b segundo tramo)
# Mínimo del contribuyente aplicable al GRAVAMEN AUTONÓMICO. Ley 22/2009
# art. 46.1.a cede a cada comunidad autónoma la fijación de su propio mínimo
# personal y familiar, y para 2025 el Manual práctico de Renta 2025 (parte 1,
# capítulo 14) recoge que lo ejercieron Andalucía, Principado de Asturias,
# Illes Balears, Canarias, Galicia, Madrid, La Rioja y Comunitat Valenciana.
#
# Cada clave despacha al importe GENERAL de su comunidad, es decir el aplicable
# al contribuyente menor de 65 años. Las comunidades que no ejercieron la
# competencia -- y La Rioja, que sólo la ejerció para descendientes y
# discapacidad -- usan el importe estatal del art. 57 LIRPF, tal y como el
# manual precisa en su ejemplo de Cantabria.
#
# PENDIENTE: los incrementos autonómicos por edad (mayor de 65 y mayor de 75)
# no se modelan todavía en esta casilla, mientras que el gravamen estatal
# (casilla 0511) sí los aplica. Illes Balears además eleva a 6.105 € el importe
# general del contribuyente mayor de 65 años, por lo que su clave apunta hoy al
# importe estatal, correcto sólo para menores de 65 años.
# LIRPF art. 64 (estatal) anualidades por alimentos a favor de los hijos —
# régimen de escala separada (see the 2024 revision for the full derivation).
# escala(0527) + escala(0505 - 0527) when the régimen gate holds; the ordinary
# escala(0505) branch is byte-identical for every non-anualidades filer.
# LIRPF art. 64 (estatal): under the anualidades separate-escala régimen the
# total cuota is minorada by escala(mínimo personal y familiar + 1.980). The
# else-branch escala(0521) is byte-identical to the ordinary chain.
# LIRPF art. 75 (autonómica) anualidades por alimentos — régimen de escala
# separada, mirror of the 2025 estatal casilla 0528 with the art. 74 escala.
# escala(0527) + escala(0505 - 0527) when the régimen gate holds; else-branch
# escala_ccaa(0505) byte-identical to the ordinary chain.
# LIRPF art. 75 (autonómica): under the anualidades separate-escala régimen the
# total cuota autonómica is minorada by escala(mínimo + 1.980). Else-branch
# escala_ccaa(0521) byte-identical to the ordinary chain.
# Floored at 0 per LIRPF art. 64: "sin que pueda resultar negativa como
# consecuencia de tal minoración". Harmless for the ordinary chain.
# Floored at 0 per LIRPF art. 75 (mirror of art. 64): "sin que pueda resultar
# negativa como consecuencia de tal minoración". Harmless for the ordinary chain.
# Base imponible general (casilla 0435) = saldo neto de rendimientos e
# imputaciones (0432) − saldo neto negativo G/P a integrar, límite 25%
# (0433). This is the distinct Art. 48 base-imponible mechanism. The
# Art. 50.3 base-liquidable carry is applied later through casilla 0501;
# it must not be subtracted from this base-imponible calculation.
# Art. 84 LIRPF: reducción por tributación conjunta.
# Tipo 1 (matrimonio, Art. 82.1.1°): declaration_type = 2 AND minor_children_in_unit = 0 → €3.400
# Tipo 2 (monoparental, Art. 82.1.2°): declaration_type = 2 AND minor_children_in_unit = 1 → €2.150
# Individual (declaration_type = 1): → €0
# Casilla 0245: Si el matrimonio ha estado vigente durante todo el año 2025.
# 1 when marriage_date predates 2025 (marriage_full_year = 1); 0 otherwise.
# When no marriage_date is recorded the binding is absent and the engine
# emits 0 via the default-missing path.
# Casilla 0246: Primer mes en que estuvo vigente el matrimonio en 2025.
# Resolves to the month integer (1-12) when marriage_date is in 2025,
# or 1 when the marriage predates 2025.  The binding is absent when no
# marriage_date is recorded and the engine emits 0 via the default-missing path.
# Casilla 0247: Último mes completo de 2025 en que estuvo vigente el matrimonio.
# Always 12 when a marriage_date is present (the marriage remains in force
# through year-end by assumption; dissolution is not modelled here).
# The binding is absent when no marriage_date is recorded and the engine
# emits 0 via the default-missing path.
# Art. 52.1 LIRPF tiered joint limit. Two independent pools, each bounded by
# 30% of net yields (0432) as the overall global cap:
#   - aportaciones/contribuciones pool (0463+0465 individual, plus
#     0426+0427+0438 employer-linked, plus 0499 autónomo/empresario-individual):
#     capped at the general EUR 1.500 sub-limit (art. 52.1.b) PLUS an EUR 8.500
#     increment split into two art. 52.1 sub-tiers that are NOT
#     interchangeable — 1.º grants up to EUR 8.500 but only "siempre que tal
#     incremento provenga de contribuciones empresariales, o de aportaciones
#     del trabajador al mismo instrumento de previsión social" (0426+0427+0438);
#     2.º grants up to EUR 4.250 for "aportaciones... realizadas por
#     trabajadores por cuenta propia o autónomos" / "empresario individual...
#     partícipe" (0499). Both sub-tiers are additive but jointly re-capped at
#     EUR 8.500 ("en todo caso, la cuantía máxima de reducción por aplicación
#     de los incrementos previstos en los números 1.º y 2.º anteriores será de
#     8.500 euros anuales"), so a purely-0499 filer is correctly bound at
#     EUR 4.250 (not the full EUR 8.500 a uniform employer-linked pool would
#     silently grant), and a purely-individual filer (no 0426/0427/0438/0499)
#     stays bound at EUR 1.500.
#   - dependencia pool (0464+0466): a separate EUR 5.000 ceiling (art. 52.1,
#     final paragraph), additive to the first pool per the AEAT Renta manual
#     worked example ("10.000 euros por aportaciones y contribuciones +
#     5.000 euros por seguros colectivos de dependencia").
# M100 Art. 85 cadastral-value imputed real-estate income.
# Comunidad de Madrid, "Por nacimiento o adopción de hijos" (DL 1/2010 arts. 4 y 18.1).
# 1039 = eligible_count × 721,70 € when BOTH income limits are satisfied, else 0.
#   - Contribuyente double-limit: (0435 + 0460) ≤ 30.930 (individual) / 37.322,20 (conjunta).
#   - Unidad-familiar límite: (0435 + 0460 + otros miembros) ≤ 61.860.
# eligible_count is the prorrateo-weighted count of in-window cohabiting
# descendants, Madrid-scoped and supplied by the profile-derived-fact injector
# only for the determinable single/individual filer; absent (→ 0) for conjunta
# or married filers, where the operator-facing advisory surfaces the entitlement
# instead (deducción over-claim guard).
# Ley 35/2006 art. 50.3 — ejercicio-2024-origin negative base liquidable
# general compensation, this period.
#
# Cap (internal ceiling): the maximum compensable this period =
#   min(1388 opening pending, max(0, 0435 − 0461 − 0468)).
# Art. 50.3 compensates the negative base liquidable general against positive
# base liquidable general; Art. 48's 25% base-imponible mechanism is distinct.
# Casilla 0501 is the base-liquidable compensation used by the main
# liquidable-base formula. The Anexo C applied amount (1389) is its source;
# the carry never alters the separate Art. 48 base-imponible calculation.
# Remainder rolled forward (casilla 1390) = opening pending (1388) minus the
# amount applied this period (1389). Clamped non-negative: the declared
# applied amount cannot exceed the stock (BLOCKING predicate), so the
# subtraction is non-negative, and the clamp is defence-in-depth.
# Art. 58 LIRPF mínimo por descendientes, parte estatal. The per-descendant
# birth-order tranche, menor-3 supplement, and Art. 61.1a custodia-compartida
# prorrata are computed by the profile-binding aggregate (see the binding
# source citation); this formula simply projects that aggregate onto the
# casilla.
# Art. 58/73 LIRPF mínimo por descendientes, parte autonómica. Feeds from the
# profile-derived autonómico aggregate, which resolves each birth-order tranche
# against the filer's declared tax-residence CCAA (Ley 22/2009 art. 46.1.a);
# Comunidad de Madrid publishes its own full mínimo por descendientes table for
# 2025 (Decreto Legislativo 1/2010 art. 2, as modified by Ley 13/2023), every
# other CCAA mirrors the estatal aggregate exactly.
# Modelo 100 2025 estimacion objetiva agraria (Anexo I, Orden HAC/1347/2024)
# Fase 1a: rendimiento neto previo por producto.
#
# AEAT's own Diseño de Registros (aeat-dr-100-2025-dictionary) captures one
# "Ingresos íntegros" / "Índice" / "Rendimiento base producto" triplet per
# producto código of the Anexo I table (Manual práctico de Renta 2025,
# Parte 1, Capítulo 9). Every triplet shares the identical Fase 1a mechanism
# (instrucción 2.1 of the same Anexo I): rendimiento base producto = ingresos
# íntegros x índice de rendimiento neto. The índice itself stays an
# operator-declared decimal (the taxpayer/preparer reads it off the Anexo I
# código table for the declared activity — this engine does not transcribe a
# per-código coefficient table, unlike the M131 no-agrícola módulos engine,
# because the índice is a single per-activity scalar the AEAT form itself
# asks the filer to enter, not a units x coefficient product needing a
# keyed-bracket lookup).
#
# Grounded in ley-35-2006:art-31 (estimación objetiva) and
# orden-hac-1347-2024:anexo-i-instruccion-2-1 (Fase 1: Rendimiento neto
# previo), cross-checked against the AEAT Manual práctico de Renta 2025,
# Parte 1, Capítulo 9 worked example: Doña M.J.I., ingresos 18.030,00 euros x
# índice 0,37 (código 12, raíces/tubérculos/frutos no cítricos) = rendimiento
# neto previo 6.671,10 euros. See
# test_modelo_100_eo_agraria_rendimiento_base.py.
#
# Rendimiento neto previo (casilla 1537) sums every producto's rendimiento
# base — the Fase 1a aggregate across the codigo-producto catalogue.
#
# Fase 2a: rendimiento neto minorado (casilla 1539, instrucción 2.2 of the
# same Anexo I). The instrucción deducts, elemento por elemento, the
# amortización del inmovilizado material e intangible afecto a la actividad
# (excluidas las actividades forestales) per the Anexo I amortization table
# (coeficiente lineal máximo / período máximo per grupo patrimonial). This
# engine does not model a per-element libro registro de bienes de inversión
# (acquisition value, coefficient, elapsed period per asset) — the same
# honest-scalar approach the M131 estimación-objetiva módulos engine uses for
# its own minoración por incentivos a la inversión
# (orden-hac-1347-2024:instruccion-2-2-b, modelo 131 Fase 2ª,
# test_modelo_131_modulos_engine.py). Casilla 1538 ("Amortización del
# inmovilizado material e intangible") is the operator-declared euro amount
# already published by AEAT's own Diseño de Registros; a blank amortización
# never over-states the reduction (it simply omits a legitimate additional
# reduction the operator may or may not be claiming), and it never fabricates
# a per-asset depreciation figure the engine has no register to derive.
#
# Fase 3a: índices correctores y rendimiento neto de módulos (casilla 1548,
# instrucción 2.3 of the same Anexo I). Each índice casilla (1540-1547, one
# per letra a) to h) of the instrucción) is an operator/preparer-declared
# rate (AEAT Diseño de Registros field type P012, fields E5AI1-E5AI8) — the
# taxpayer reads the applicable índice off the Anexo I table and enters it
# directly, exactly like the Fase 1a per-producto índice de rendimiento neto
# above. The instrucción states each índice applies "sobre el rendimiento
# neto minorado o, en su caso, sobre el rectificado por aplicación de los
# [índices] anteriores" — a sequential cascade in the Anexo's own letra
# order, not a single-índice pick nor a simultaneous product. A blank índice
# casilla is never fabricated into a reduction (the cascade step is skipped);
# a non-positive rendimiento neto minorado never receives índices correctores
# (the general estimación objetiva principle). Índice 9 (mejillón en batea,
# letra i) is out of scope for this dispatcher — it applies to the separate
# mejillón producto (casilla 0160), not to this 1539→1548 cascade. See
# _evaluate_m100_resolve_eo_agraria_indices_correctores and
# orden-hac-1347-2024:anexo-i-instruccion-2-3.
#
# Fase 4a (reduccion general 5% + reduccion agricultores jovenes 25%,
# casillas 1549/1551, plus the rendimiento neto reducido total in casilla
# 1555) is computed by renta-2025-eo-agraria-reduccion-general,
# renta-2025-eo-agraria-reduccion-jovenes, and
# renta-2025-eo-agraria-rendimiento-neto-reducido-por-actividad in
# 0294-renta-2025-eo-agraria-reducciones-fase-4a.toml. Fase 4a apartado 3
# (gastos extraordinarios, casilla 1552) and Fase 5a (art. 32 irregularidad,
# casilla 1554) remain the manual operator-entered casillas already declared
# on this revision — bounded by the incremental engine-authoring
# discipline this table follows.
# Grounded directly in the manual's own worked example (código 12: raíces,
# tubérculos, forrajes, algodón, frutos no cítricos...): ingresos 18.030,00
# euros x índice 0,37 = rendimiento neto previo 6.671,10 euros. See
# test_modelo_100_eo_agraria_rendimiento_base.py.
# Fase 1a aggregate: rendimiento neto previo (casilla 1537) sums every
# producto's rendimiento base producto across the codigo-producto catalogue.
# Each producto slot is independent: a taxpayer with a mixed
# agrícola-ganadera explotación may legitimately populate several products
# simultaneously. The AEAT Manual práctico de Renta 2025, Parte 1,
# Capítulo 9 full worked example (Don L.H.I.) itself declares ingresos
# computables for three simultaneous productos — maíz, corderos (ganado
# ovino de carne), and productos hortícolas — within the single actividad
# he files (see test_modelo_100_eo_agraria_reducciones_fase_4a.py). An
# unselected product's ingresos/índice simply stay blank (zero), so the sum
# never fabricates a rendimiento for a product the taxpayer did not declare.
# Fase 2a: rendimiento neto minorado (casilla 1539) = rendimiento neto previo
# (casilla 1537) minus the operator-declared amortización del inmovilizado
# material e intangible (casilla 1538, instrucción 2.2 of the same Anexo I).
# A blank amortización subtracts zero, never fabricating a depreciation
# figure the engine has no per-element asset register to derive.
# Fase 3a: rendimiento neto de módulos (casilla 1548) = rendimiento neto
# minorado (casilla 1539) with the índices correctores 1540-1547 (letras a a
# h of instrucción 2.3, in that exact order) applied in sequence, per the
# AEAT's own field order (E5AI1-E5AI8). See
# _evaluate_m100_resolve_eo_agraria_indices_correctores.
# Cross-checked against the AEAT Manual práctico de Renta 2025, Parte 1,
# Capítulo 9 full worked example (Don L.H.I.): rendimiento neto minorado
# 14.704,42 euros x índice corrector por personal asalariado 0,90 (único
# índice aplicable en ese ejemplo) = rendimiento neto de módulos 13.233,98
# euros. See test_modelo_100_eo_agraria_indices_correctores.py.
# Modelo 100 2025 estimacion objetiva agraria (Anexo I, Orden HAC/1347/2024)
# Fase 4a: determinacion del rendimiento neto de la actividad.
#
# The manual (Manual practico de Renta 2025, Parte 1, Capitulo 9) states the
# sequence explicitly: "para determinar el rendimiento neto de la actividad
# podran practicarse las siguientes reducciones: 1. Reduccion general: 5 por
# 100 ... 2. Reduccion agricultores jovenes: 25 por 100 ... 3. Gastos
# extraordinarios por circunstancias excepcionales". Cross-checked against the
# manual's own full worked example (Don L.H.I.): rendimiento neto de modulos
# 13.233,98 euros; "Reduccion de caracter general: 5% s/13.233,98 = 661,70
# euros"; "Al no existir gastos extraordinarios ... ni derecho a la reduccion
# por agricultores jovenes, el rendimiento neto de la actividad es el
# siguiente: 13.233,98 - 661,70 = 12.572,28 euros". See
# test_modelo_100_eo_agraria_reducciones_fase_4a.py.
#
# Casilla 1549 (reduccion de caracter general) applies universally to every
# EO-agraria filer at the fixed 2025 rate (Orden HAC/1347/2024, DA-1: "podran
# reducir el rendimiento neto de modulos obtenido en 2025 en un 5 por
# ciento"), gated only on the label's own "solo si el importe de la casilla
# [1548] es > 0" condition. Casilla 1550 already computes the difference
# (1548 - 1549), landed prior to this Fase 4a slice.
#
# Casilla 1551 (reduccion agricultores jovenes) is conditional on taxpayer
# eligibility (agricultor joven de 18 a 40 anos, o asalariado agrario,
# durante los cinco anos siguientes a su primera instalacion como titular de
# una explotacion prioritaria con plan de mejora acreditado — LIRPF DA-6,
# instruccion 3 del Anexo I) — a fact not derivable from any other casilla.
# The AEAT Diseno de Registros declares this eligibility as its own toma-de-
# datos field ("AJ", campo S_N, sin numero de casilla impreso — ver la casilla
# AJ *98 de este mismo Modelo 100). AJ en blanco/No nunca fabrica una
# reduccion; solo cuando AJ = Si se aplica el 25 por 100 sobre el resultado ya
# reducido por la reduccion general (casilla 1550), tal como exige el texto:
# "podran reducir el rendimiento neto de modulos, que resulte despues de
# aplicar la reduccion de caracter general, en un 25 por 100".
#
# Neither reduccion is fabricated when the underlying rendimiento neto de
# modulos (casilla 1548) is non-positive: the general reduccion's own
# if_then_else gate on 1548 > 0 already covers this, and the jovenes
# reduccion (applied to 1550, itself never larger than 1548) inherits the
# same non-fabrication guarantee.
# Rendimiento neto reducido (casilla 1555): rendimiento neto de modulos
# (1548) menos la reduccion de caracter general (1549, ya restada en la
# casilla 1550), menos la reduccion agricultores jovenes (1551), menos
# gastos extraordinarios (1552, Fase 4a apartado 3, permanece manual — un
# importe declarado por el operador cuando concurren circunstancias
# excepcionales comunicadas a la AEAT), menos la reduccion por irregularidad
# del articulo 32.1 (1554, Fase 5a — ver
# 0295-renta-2025-eo-agraria-reduccion-irregularidad.toml, computada a
# partir de la base declarada por el operador
# [eo-agraria-reduccion-irregularidad-base]). Sigue el mismo patron de
# resta anidada sin suelo en cero que el resto de la cadena de estimacion
# objetiva (ver renta-2025-estimacion-directa-rendimiento-neto-reducido-total
# y renta-2025-estimacion-objetiva-no-agricola-rendimiento-neto-reducido-total).
# Modelo 100 2025 estimacion objetiva agraria (Anexo I, Orden HAC/1347/2024)
# Fase 5a: reduccion por irregularidad (art. 32.1 LIRPF).
#
# LIRPF art. 32.1: "Los rendimientos netos con un periodo de generacion
# superior a dos anos, asi como aquellos que se califiquen reglamentariamente
# como obtenidos de forma notoriamente irregular en el tiempo, se reduciran
# en un 30 por ciento... La cuantia del rendimiento neto a que se refiere
# este apartado sobre la que se aplicara la citada reduccion no podra
# superar el importe de 300.000 euros anuales." AEAT's own Diseno de
# Registros declares casilla 1554 (IMPE5AL) as a single "Importe de la
# deduccion" amount field with no separate base sub-field (see
# 2238-eo-agraria-reduccion-irregularidad-base.toml); which portion of the
# rendimiento neto is genuinely irregular/multi-year is a taxpayer/preparer
# fact this app cannot derive from any other casilla, so the base is
# operator-declared and the 30 por 100 x min(base, 300.000) computation
# is mechanical from there. A blank/zero declared base yields a zero
# reduccion (never fabricated), matching the manual's own worked example
# ("Al no computarse ningun tipo de rendimiento con periodo de generacion
# superior a dos anos... no procede aplicar reduccion alguna por este
# concepto").

