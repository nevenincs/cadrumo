    { op = "lookup_parameter_by_entity_type", args = [
        { literal = "0" },
        { binding = "renta-profile-tax-residence-ccaa" },
        { dispatch_table_entries = [
            { key = "andalucia", parameter = "renta-minimo-contribuyente-base-andalucia" },
            { key = "aragon", parameter = "renta-minimo-contribuyente-base" },
            { key = "asturias", parameter = "renta-minimo-contribuyente-base-asturias" },
            { key = "baleares", parameter = "renta-minimo-contribuyente-base" },
            { key = "canarias", parameter = "renta-minimo-contribuyente-base-canarias" },
            { key = "cantabria", parameter = "renta-minimo-contribuyente-base" },
            { key = "castilla_la_mancha", parameter = "renta-minimo-contribuyente-base" },
            { key = "castilla_y_leon", parameter = "renta-minimo-contribuyente-base" },
            { key = "cataluna", parameter = "renta-minimo-contribuyente-base" },
            { key = "comunidad_valenciana", parameter = "renta-minimo-contribuyente-base-valenciana" },
            { key = "extremadura", parameter = "renta-minimo-contribuyente-base" },
            { key = "galicia", parameter = "renta-minimo-contribuyente-base-galicia" },
            { key = "la_rioja", parameter = "renta-minimo-contribuyente-base" },
            { key = "madrid", parameter = "renta-minimo-contribuyente-base-madrid" },
            { key = "murcia", parameter = "renta-minimo-contribuyente-base" },
        ] },
    ] },
    { op = "if_then_else", args = [
        { op = "greater_equal", args = [{ op = "age_at_year_end", args = [{ date_binding = "renta-profile-taxpayer-birth-date" }] }, { literal = "65" }] },
        { op = "sum", args = [
            { op = "lookup_parameter_by_entity_type", args = [
                { literal = "0" },
                { binding = "renta-profile-tax-residence-ccaa" },
                { dispatch_table_entries = [
                    { key = "andalucia", parameter = "renta-minimo-contribuyente-edad-65-74-andalucia" },
