target_casilla_id = "0512"
# Minimo del contribuyente for the gravamen autonomico (LIRPF arts. 56.3 and 57; Ley 22/2009
# art. 46.1.a): the general amount and age increments the taxpayer's comunidad approved, or the
# state amounts of art. 57 where it approved none, with age taken at the end of the tax period
# as casilla 0511 takes it.
