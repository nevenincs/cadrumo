# Ley 35/2006 art. 50.3 — base liquidable general negativa compensation,
# ejercicio-2024 origin. "Si la base liquidable general resultase negativa, su
# importe podrá ser compensado con los de las bases liquidables generales
# positivas que se obtengan en los cuatro años siguientes. La compensación
# deberá efectuarse en la cuantía máxima que permita cada uno de los ejercicios
# siguientes." The amount applied (casilla 1389, which casilla 0501 carries) is
# therefore fixed by law, not elected: these gates refuse any other amount.

# Stock BLOCKING gate (art. 50.3): a positive applied compensation (1389) needs a
# present pending stock (casilla 1388, bound from the prior filing's 1391) and
# cannot exceed it. A stated zero stock admits no compensation; an unknown stock
# is not read as zero.
[[revisions."2025".verification_predicates]]
id = "positive-application-le-present-stock:compensacion-base-neg-general-no-excede-stock"
predicate_id = "modelo-100-2025-compensacion-base-neg-general-no-excede-stock"
expression = 'positive_application_le_present_stock(["1389", "1388"])'
legal_refs = ["ley-35-2006:art-50"]

# Cuantía-máxima BLOCKING gate (art. 50.3): the applied compensation (1389) must
# equal the computed maximum (casilla base-liq-neg-general-2024-aplicada-maxima
# = min(1388 stock, max(0, 0435 − 0461 − 0468)), the positive base liquidable
# general before compensation). Applying less or more refuses, and so does a
# maximum the calculation could not resolve, because the required amount is
# then unknown.
[[revisions."2025".verification_predicates]]
id = "application-equals-present-maximum:compensacion-base-neg-general-cuantia-maxima"
predicate_id = "modelo-100-2025-compensacion-base-neg-general-cuantia-maxima"
expression = 'application_equals_present_maximum(["1389", "base-liq-neg-general-2024-aplicada-maxima"])'
legal_refs = ["ley-35-2006:art-50"]

# Settlement-completeness soundness gate (no-silent-under-declaration). The IRPF
# liability must be determined when the taxpayer reports a positive general
# taxable base. casilla 0595 (cuota resultante de la autoliquidacion) is the
# tax liability BEFORE pagos a cuenta (retenciones / pagos fraccionados); it is
# the box that feeds the cuota diferencial (0610 = 0595 - 0609). When base
# liquidable general (0500) is strictly positive but 0595 resolves to zero, the
# return computes no tax on positive taxable activity -- a silent
# under-declaration the verify gate would otherwise grant with zero findings.
#
# ADVISORY (non-blocking WARNING), not BLOCKING: a positive base liquidable
# general with a legitimately zero cuota is possible (general base at or below
# the minimo personal y familiar, or fully offset by deducciones), so this
# surfaces an operator-facing advisory rather than refusing the draft. The
# consequent is 0595 (the liability), NOT the cuota diferencial (0610) or the
# resultado (0670): those legitimately resolve to zero or negative for a filer
# whose retenciones / pagos a cuenta cover the liability (the dominant employee
# case), so guarding them would false-fire on the majority of returns and train
# operators to ignore the alert. implies_nonzero holds trivially when the
# antecedent <= 0, so loss / zero-general-base / savings-only filers never fire.
# Mirrors the M200 base-determination and M131 pago-fraccionado advisories.

# Suffered-retencion completeness advisory (no-silent-under-declaration, in the
# OVER-declaration direction this apparatus otherwise does not watch). casilla
# 0596 is the retencion the taxpayer SUFFERED on rendimientos del trabajo, which
# the payer declares on Modelo 111 and the taxpayer credits against the cuota. It
# is a BOUND casilla, so when no observation resolves it the engine threads an
# absent slot as a zero and emits nothing: an uncredited retencion is tax the
# taxpayer already paid and pays again, arriving as a clean number.
#
# The antecedent is 0012 (total ingresos integros computables del trabajo), the
# GROSS total, because retencion is computed on gross. The neto reducido total was
# rejected as the antecedent: it is post-deducciones and can be zero for a filer
# who did suffer withholding, which would suppress the advisory in exactly the
# cases it exists for. Both ids were resolved from this revision's OWN casilla set
# through semantic_role (irpf_rendimiento_trabajo_total_ingresos_integros and
# irpf_retencion_trabajo) rather than copied from another revision, because ids
# renumber across filing years.
#
# ADVISORY, not BLOCKING, and this is what distinguishes it from a signal keyed on
# the declared income CATEGORY, which was measured and refused: withholding on
# rendimientos del trabajo is scaled to the payer's projected annual rate and is
# lawfully ZERO below the withholding thresholds, so a low-income employee or
# pensioner declares trabajo income and correctly reports no retencion. A
# category-keyed rule would fire on precisely those filers. implies_nonzero holds
# trivially when the antecedent <= 0, so a filer with no trabajo income never fires.
#
# The remedy is the payer's withholding certificate, keyed as the casilla value.
# Modelo 111 is the payer's return, not this taxpayer's, so there is no filing of
# theirs to capture. AEAT's datos fiscales report what payers declared, but only
# as information, and Cadrumo does not read them yet.
