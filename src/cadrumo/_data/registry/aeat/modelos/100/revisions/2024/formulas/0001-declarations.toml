            { key = "baleares", parameter = "renta-minimo-contribuyente-base" },
            { key = "canarias", parameter = "renta-minimo-contribuyente-base-canarias" },
            { key = "cantabria", parameter = "renta-minimo-contribuyente-base" },
            { key = "castilla_la_mancha", parameter = "renta-minimo-contribuyente-base" },
            { key = "castilla_y_leon", parameter = "renta-minimo-contribuyente-base" },
            { key = "cataluna", parameter = "renta-minimo-contribuyente-base" },
            { key = "comunidad_valenciana", parameter = "renta-minimo-contribuyente-base-valenciana" },
            { key = "extremadura", parameter = "renta-minimo-contribuyente-base" },
            { key = "galicia", parameter = "renta-minimo-contribuyente-base-galicia" },
