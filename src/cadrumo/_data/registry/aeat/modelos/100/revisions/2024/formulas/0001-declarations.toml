            { key = "madrid", parameter = "renta-minimo-contribuyente-base-madrid" },
            { key = "murcia", parameter = "renta-minimo-contribuyente-base" },
        ] },
    ] },
    { op = "if_then_else", args = [
        { op = "greater_equal", args = [{ op = "age_at_year_end", args = [{ date_binding = "renta-profile-taxpayer-birth-date" }] }, { literal = "65" }] },
        { op = "sum", args = [
            { op = "lookup_parameter_by_entity_type", args = [
                { literal = "0" },
                { binding = "renta-profile-tax-residence-ccaa" },
