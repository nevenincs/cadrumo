                        { key = "aragon", parameter = "renta-minimo-contribuyente-edad-75" },
                        { key = "asturias", parameter = "renta-minimo-contribuyente-edad-75" },
                        { key = "baleares", parameter = "renta-minimo-contribuyente-edad-75" },
