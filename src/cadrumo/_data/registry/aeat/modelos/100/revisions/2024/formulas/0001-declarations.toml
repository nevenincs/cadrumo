[[revisions."2024".formulas]]
id = "renta-resultado-ingresar-o-devolver"
target_casilla_id = "0700"
# RESINGDEV (0700) is "Resultado a ingresar o a devolver (casilla [0670] o casilla [0695])".
# It is the result of the return (0670) unless the spouse compensation of art. 97.6 LIRPF
# suspends part of an amount payable (0693), in which case it is the remainder payable (0695).
# The dictionary also gives 0695 a negative remainder when a refund is waived (0694), which
# the registry has no formula for, so a declared waiver leaves only this box without a value
# instead of guessing an amount or refusing the rest of the return.
expression = { op = "if_then_else", args = [
    { op = "equal", args = [{ casilla_id = "0694" }, { literal = "0" }] },
    { op = "if_then_else", args = [
        { op = "greater_than", args = [{ casilla_id = "0693" }, { literal = "0" }] },
        { casilla_id = "0695" },
        { casilla_id = "0670" },
    ] },
    { op = "unresolved_outcome", args = [{ text_literal = "waived-refund-result-unsupported" }] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-97"]
source_refs = ["aeat-dr-100-2024-dictionary", "aeat-renta-2024-manual-parte1"]

