# LIRPF art. 64 (estatal) anualidades por alimentos a favor de los hijos —
# régimen de escala separada. When the taxpayer satisfies judicial anualidades
# (0527 > 0) that are lower than the base liquidable general (0527 < 0505) and
# has NO right to the mínimo por descendientes for those children (the profile
# eligibility flag), the escala del art. 63 applies SEPARATELY to the anualidades
# and to the rest of the base liquidable general:
#   escala(0527) + escala(0505 - 0527).
# The predicate is nested so the eligibility binding is only evaluated when the
# two casilla conditions already hold (short-circuit), leaving the ordinary
# escala(0505) branch byte-identical for every non-anualidades filer. The
# shared-custody negation rides on the derived profile flag (default eligible;
# false when custody is shared and the payer retains the mínimo por descendientes).
# LIRPF art. 64 (estatal): under the anualidades por alimentos separate-escala
# régimen the total cuota is minorada by the escala del art. 63 applied to the
# mínimo personal y familiar INCREMENTADO EN 1.980 euros anuales. The regime
# gate is identical to casilla 0528 (anualidades > 0, anualidades < base
# liquidable general, and the profile eligibility flag); nested so the flag is
# only read when both casilla conditions hold. The else-branch escala(0521) is
# byte-identical to the ordinary chain.
# LIRPF art. 75 (autonómica) anualidades por alimentos a favor de los hijos —
# régimen de escala separada, mirror of casilla 0528 with the art. 74 escala
# autonómica. When the eligibility gate holds (anualidades > 0, anualidades <
# base liquidable general, and the profile eligibility flag) the escala
# autonómica applies SEPARATELY: escala(0527) + escala(0505 - 0527). Nested so
# the flag is only read when both casilla conditions hold; the else-branch
# escala_ccaa(0505) is byte-identical to the ordinary chain.
# LIRPF art. 75 (autonómica): under the anualidades por alimentos separate-escala
# régimen the total cuota autonómica is minorada by the escala del art. 74
# applied to the mínimo personal y familiar INCREMENTADO EN 1.980 euros anuales.
# The regime gate is identical to casilla 0529; nested so the flag is only read
# when both casilla conditions hold. The else-branch escala_ccaa(0521) is
# byte-identical to the ordinary chain.
# Floored at 0 per LIRPF art. 64: "sin que pueda resultar negativa como
# consecuencia de tal minoración". Harmless for the ordinary chain, where the
# escala on the base (0528) always dominates the escala on the mínimo (0530).
# Floored at 0 per LIRPF art. 75 (mirror of art. 64): "sin que pueda resultar
# negativa como consecuencia de tal minoración". Harmless for the ordinary
# chain, where escala on the base (0529) dominates escala on the mínimo (0531).
# Art. 57.1.b LIRPF: mínimo del contribuyente = base + incremento por edad al final
# del período impositivo (31 de diciembre del ejercicio).
# Edad 65–74: +1.150 €  (Art. 57.1.b primer tramo)
# Edad ≥ 75:  +1.150 € + 1.400 €  (Art. 57.1.b segundo tramo)
# Casilla 0414 (deduccion por obtencion de rendimientos del trabajo) does not
# exist in the 2024 revision (introduced in 2025); omitted from this expression.
# 2024 label confirms: 0587 - 0588 - 0589 - 0590 - 0591.
# Art. 84 LIRPF: reducción por tributación conjunta.
# Tipo 1 (matrimonio, Art. 82.1.1°): declaration_type = 2 AND minor_children_in_unit = 0 → €3.400
# Tipo 2 (monoparental, Art. 82.1.2°): declaration_type = 2 AND minor_children_in_unit = 1 → €2.150
# Individual (declaration_type = 1): → €0
# Casilla 0245: Si el matrimonio ha estado vigente durante todo el año 2024.
# 1 when marriage_date predates 2024 (marriage_full_year = 1); 0 otherwise.
# When no marriage_date is recorded the binding is absent and the engine
# emits 0 via the default-missing path.
# Casilla 0246: Primer mes en que estuvo vigente el matrimonio en 2024.
# Resolves to the month integer (1-12) when marriage_date is in 2024,
# or 1 when the marriage predates 2024.  The binding is absent when no
# marriage_date is recorded and the engine emits 0 via the default-missing path.
# Casilla 0247: Último mes completo de 2024 en que estuvo vigente el matrimonio.
# Always 12 when a marriage_date is present (the marriage remains in force
# through year-end by assumption; dissolution is not modelled here).
# The binding is absent when no marriage_date is recorded and the engine
# emits 0 via the default-missing path.
# Art. 81.2 LIRPF: incremento deducción maternidad por gastos de guardería.
#
# Cap = min(incremento_prorrateado_por_hijo, cotizaciones_SS_madre_2024).
#
# The first term replaces what used to be two: the household spend total and a
# flat "hijos × 1.000". That pair carried no month rule at all, so a child in
# the guardería for two months earned the same ceiling as one there all year —
# a measured 833,33 € over-grant on the manual's own worked case, whose stated
# answer is 166,67.
#
# Art. 81.3 third paragraph prorates the increase "proporcionalmente al número
# de meses en que se cumplan de forma simultánea los requisitos exigidos en el
# artículo 81.1 y 2" and caps it at the spend incurred "en relación con ese
# hijo" — per child, by its own words. Neither the proration nor the per-child
# bound is expressible here: this schema has no per-descendant fold, and an
# aggregate min over the household also lets one child's unused ceiling absorb
# another child's excess spend. So the fold happens where the descendant
# records live and the registry consumes one resolved value, exactly as the
# mínimo por descendientes aggregate does.
#
# The cotizaciones term stays a term. It is a separate ceiling of the same
# article and is under its own review; folding it into the resolved value would
# decide that question here by accident.
# The proration this formula now defers to, pinned so a source that stopped
# stating it reds the load rather than leaving the claim unbacked.
# Art. 52.1 LIRPF tiered joint limit. Two independent pools, each bounded by
# 30% of net yields (0432) as the overall global cap:
#   - aportaciones/contribuciones pool (0463+0465 individual, plus
#     0426+0427+0438 employer-linked, plus 0499 autónomo/empresario-individual):
#     capped at the general EUR 1.500 sub-limit (art. 52.1.b) PLUS an EUR 8.500
#     increment split into two art. 52.1 sub-tiers that are NOT
#     interchangeable — 1.º grants up to EUR 8.500 but only "siempre que tal
#     incremento provenga de contribuciones empresariales, o de aportaciones
#     del trabajador al mismo instrumento de previsión social" (0426+0427+0438);
#     2.º grants up to EUR 4.250 for "aportaciones... realizadas por
#     trabajadores por cuenta propia o autónomos" / "empresario individual...
#     partícipe" (0499). Both sub-tiers are additive but jointly re-capped at
#     EUR 8.500 ("en todo caso, la cuantía máxima de reducción por aplicación
#     de los incrementos previstos en los números 1.º y 2.º anteriores será de
#     8.500 euros anuales"), so a purely-0499 filer is correctly bound at
#     EUR 4.250 (not the full EUR 8.500 a uniform employer-linked pool would
#     silently grant), and a purely-individual filer (no 0426/0427/0438/0499)
#     stays bound at EUR 1.500.
#   - dependencia pool (0464+0466): a separate EUR 5.000 ceiling (art. 52.1,
#     final paragraph), additive to the first pool per the AEAT Renta manual
#     worked example ("10.000 euros por aportaciones y contribuciones +
#     5.000 euros por seguros colectivos de dependencia").
# M100 Art. 85 cadastral-value imputed real-estate income.
# Art. 58 LIRPF mínimo por descendientes, parte estatal. The per-descendant
# birth-order tranche, menor-3 supplement, and Art. 61.1a custodia-compartida
# prorrata are computed by the profile-binding aggregate (see the binding
# source citation); this formula simply projects that aggregate onto the
# casilla.
# Art. 58/73 LIRPF mínimo por descendientes, parte autonómica. Feeds from the
# profile-derived autonómico aggregate, which resolves each birth-order tranche
# against the filer's declared tax-residence CCAA (Ley 22/2009 art. 46.1.a);
# Comunidad de Madrid publishes its own full mínimo por descendientes table for
# 2024 (Decreto Legislativo 1/2010 art. 2, as modified by Ley 13/2023), every
# other CCAA mirrors the estatal aggregate exactly, matching the
# mínimo-del-contribuyente 0511/0512 precedent
# (`renta-2024-minimo-contribuyente-autonomico`).
# Art. 81.1 LIRPF: per-child qualifying months, including the distinct 1.350
# EUR alta-posterior cap, are folded at the profile boundary where the
# descendant records live.  This registry leaf only carries that one derived
# legal result into the official casilla; it must not recreate or accept an
# operator-supplied 0611 total.

