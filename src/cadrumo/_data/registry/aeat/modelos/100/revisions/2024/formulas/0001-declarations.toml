        { literal = "0" },
        { binding = "renta-profile-tax-residence-ccaa" },
        { dispatch_table_entries = [
            { key = "andalucia", parameter = "renta-minimo-contribuyente-base-andalucia" },
            { key = "aragon", parameter = "renta-minimo-contribuyente-base" },
