[revisions."2020".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. Before the 2022 baseline the Modelo 100 credit casillas are keyed by the operator: no binding supplies them and no payer-record or ledger family is declared, so there is no value source for an entry to name and nothing to cross-check it against. The credit reconciliation begins with the 2022 revision."""
legal_refs = ["ley-35-2006:art-17", "ley-35-2006:art-18", "ley-35-2006:art-19", "ley-35-2006:art-20", "ley-35-2006:art-22", "ley-35-2006:art-23", "ley-35-2006:art-24", "ley-35-2006:art-25", "ley-35-2006:art-26", "ley-35-2006:art-27", "ley-35-2006:art-28", "ley-35-2006:art-30", "ley-35-2006:art-31", "ley-35-2006:art-32", "orden-hac-248-2021:art-3"]
source_refs = ["aeat-dr-100-2020-dictionary", "aeat-dr-100-2020-input-dictionary", "aeat-dr-100-2020-xsd", "aeat-renta-2020-manual-parte1", "boe-modelo-100-2020-form"]

[revisions."2020".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). A row is admitted only where the Modelo 345 design for the same ejercicio and this edition's casilla text name the same instrument and payer. Cadrumo bundles no Modelo 345 design for this ejercicio, and a later design is never read back into an earlier year, so every clave is refused here and the operator enters the contribution boxes. The placements begin with the 2022 revision, whose design is the anexo of Orden HFP/823/2022."""
legal_refs = ["ley-35-2006:art-51", "ley-35-2006:art-52-2015"]
source_refs = ["aeat-dr-100-2020-dictionary", "aeat-dr-100-2020-input-dictionary", "aeat-dr-100-2020-xsd", "aeat-renta-2020-manual-parte1", "boe-modelo-100-2020-form"]

[revisions."2020".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-100-2020-xml-dictionary) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration \
through the same revision."""
