[revisions."2020".family_dispositions.extraction_profiles]
reason = """
An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against the registry's own casilla labels. No such document is bundled for modelo 100: its corpus carries the disenos de registro (wire-record descriptions that print no form labels) and no label-printing form specimen. Authoring patterns anyway would mean inventing the labels a real modelo 100 declaracion prints, which \
the grounding rule forbids. Bundling a filed or AEAT-published modelo 100 specimen is the change that makes this family authorable."""
