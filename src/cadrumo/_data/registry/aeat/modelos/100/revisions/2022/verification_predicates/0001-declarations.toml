# Ley 35/2006 art. 50.3 - compensation of pending negative bases liquidables
# generales, one pair of BLOCKING gates per Anexo C origin row. "Si la base
# liquidable general resultase negativa, su importe podrá ser compensado con
# los de las bases liquidables generales positivas que se obtengan en los
# cuatro años siguientes. La compensación deberá efectuarse en la cuantía
# máxima que permita cada uno de los ejercicios siguientes." The applied amount
# of each row (which casilla 0501 sums) is therefore fixed by law, not elected.
