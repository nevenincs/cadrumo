# Modelo 2020 Art. 81.1 LIRPF deduccion por maternidad figures.
#
# Authored because these existed ONLY as Python literals in
# core.external_constants, while the Art. 81.2 guarderia cap of the SAME article
# already had a resolvable parameter. One article was carried two ways in one
# product: the money in the registry for apartado 2, and in code for apartado 1.
#
# The post-birth alta increment is declared ONLY from the filing year the route
# reaches; earlier revisions grant no increment and take the ordinary cap alone.
# The raised cap (ordinary cap plus increment) is deliberately NOT authored: it
# is a DERIVED total, and storing it independently is how it drifts from the two
# inputs that compose it.

[[revisions."2020".parameters]]
id = "renta-2020-maternidad-mensual"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-81"]
source_refs = ["aeat-renta-2020-manual-parte1"]

[[revisions."2020".parameters.source_citations]]
source_ref = "aeat-renta-2020-manual-parte1"
required_text = ["la misma es de 100 euros por cada mes del período impositivo en que concurran de forma"]

[[revisions."2020".parameters.values]]
value = "100"
date_axis = "filing_period"
valid_from = 2020-01-01
valid_to = 2020-12-31

[[revisions."2020".parameters]]
id = "renta-2020-maternidad-cap-anual"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-81"]
source_refs = ["aeat-renta-2020-manual-parte1"]

[[revisions."2020".parameters.source_citations]]
source_ref = "aeat-renta-2020-manual-parte1"
required_text = ["Hasta 1.200 euros anuales."]

[[revisions."2020".parameters.values]]
value = "1200"
date_axis = "filing_period"
valid_from = 2020-01-01
valid_to = 2020-12-31
