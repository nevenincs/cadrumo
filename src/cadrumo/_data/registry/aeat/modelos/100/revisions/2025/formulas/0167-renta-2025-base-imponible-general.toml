# Base imponible general (casilla 0435) = saldo neto de rendimientos e
# imputaciones (0432) − saldo neto negativo G/P a integrar, límite 25%
# (0433). This is the distinct Art. 48 base-imponible mechanism. The
# Art. 50.3 base-liquidable carry is applied later through casilla 0501;
# it must not be subtracted from this base-imponible calculation.
[[revisions."2025".formulas]]
id = "renta-2025-base-imponible-general"
target_casilla_id = "0435"
expression = { op = "max", args = [
    { literal = "0" },
    { op = "subtract", args = [
        { casilla_id = "0432" },
        { casilla_id = "0433" },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-48", "orden-hac-277-2026:art-3"]
source_refs = ["aeat-renta-2025-manual-parte1", "boe-modelo-100-2025-form"]

[[revisions."2025".formulas.source_citations]]
