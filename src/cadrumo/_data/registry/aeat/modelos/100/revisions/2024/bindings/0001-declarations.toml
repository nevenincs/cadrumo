# 0202. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0202-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0206. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0206-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0208. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0208-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0217. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0217-deductible.
# Art. 58/61 LIRPF mínimo por descendientes aggregate, parte autonómica. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) computes
# this aggregate using the SAME Art. 58.1/58.2 birth-order-tranche method as
# the estatal half, but resolves each tranche amount against the filer's
# declared tax-residence CCAA first (Ley 22/2009 art. 46.1.a cedes normative
# competence over this figure to each comunidad). Comunidad de Madrid publishes
# its own full mínimo por descendientes table for 2024 (Decreto Legislativo
# 1/2010 art. 2, as modified by Ley 13/2023: 2.575,85 € / 2.897,83 € / 4.400 €
# / 4.950 € + 3.005,16 € menor-3, vs the general LIRPF Art. 58 2.400 € /
# 2.700 € / 4.000 € / 4.500 € + 2.800 €); every other CCAA mirrors the
# estatal aggregate exactly. Feeds casilla 0514 (autonómico).
# Modelo 100 casilla 0613: the Art. 81.2 guarderia increment, already prorated
# and capped per child by the application layer.
#
# One resolved value rather than the terms of a calculation. The increment is
# prorated per descendant by the months the art. 81.1 and 81.2 requirements hold
# simultaneously and bounded by that child's own non-subsidised spend -- art.
# 81.3 third paragraph caps it at the spend "en relacion con ese hijo", per
# child by its own words. The registry schema has no per-child fold, so the
# fold happens where the descendant records live and the registry consumes the
# result, exactly as the minimo por descendientes aggregates do.
#
# This binding's presence is what ACTIVATES the injector: the derived-fact path
# is gated on a declared consuming selector, so coverage extends to another
# revision by declaring this binding there rather than by editing code.
#
# Declaring the binding does not by itself change any computed figure. The 0613
# formula still reads the count-times-cap terms until it is rewritten to consume
# this value, which is a separate change that moves a live number and carries
# its own end-to-end proof.
# Modelo 100 casilla 0611: Art. 81.1 LIRPF deducción por maternidad.
#
# Art. 81.1 applies a different cap to each qualifying child (1.200 EUR, or
# 1.350 EUR in the post-birth-alta month).  The registry formula language has
# no descendant fold, so the canonical profile resolver computes that fold from
# the declared descendant records once and exposes this derived scalar.  This
# binding is the revision-scoped enrolment point; adding a future revision needs
# an explicit binding and its own proof, not a cross-year Python fallback.

