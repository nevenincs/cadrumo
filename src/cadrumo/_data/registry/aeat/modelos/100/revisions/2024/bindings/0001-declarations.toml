# Ley 35/2006 art. 50.3 — base liquidable general negativa carry-forward.
# The prior year's end-of-year generated saldo (casilla 1391, semantic_role
# irpf_anexo_c_base_liq_neg_generado) becomes, in the following year's
# declaration, the opening pending balance for the immediately-prior
# origin ejercicio (casilla 1388, "Ejercicio 2023: Pendiente de
# aplicacion al principio del periodo" in the 2024 revision). This
# previous_filing copy auto-resolves casilla 1388 from the prior filing
# so the operator does not re-key the carried saldo. Origin-year-matched:
# the 2024-revision's 1388 (ejercicio 2023) sources the 2023 filing's
# 1391, exactly as the 2025-revision's 1388 (ejercicio 2024) sources the
# 2024 filing's 1391. Art. 48's 25%-limited base-imponible mechanism is
# distinct and does not ground this base-liquidable carry.
# Modelo 100 (2024) casilla 0171 "Ingresos de explotacion" (estimacion directa)
# is the annual counterpart of the M130 income aggregation: it sums
# actividad-economica income from the bucket ledger over the full ejercicio.
# IVA repercutido is collected on behalf of Hacienda and is not computable
# income, so the ingresos_integros_sum fact contributes each transaction's
# IVA-exclusive base imponible (taxable_base) when tagged, falling back to the
# gross amount. The annual income aggregator (modelo == "100" path,
# aggregate_renta_m100_income_ledger) feeds this binding; the same source kind
# serves the M130 cumulative-quarter income. This brings the 2024 revision to
# parity with the 2025 renta-2025-ledger-income-0171 binding, closing the gap
# where the annual M100 silently declared zero actividad-economica income.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0186. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0186-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0192. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0192-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0199. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0199-deductible.
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0203. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
# fact to its first-slice casilla via FIRST_SLICE_EXPENSE_CASILLAS over the full
# ejercicio (period 0A). Parity with renta-2025-ledger-expense-0203-deductible.
# Eligibility flag for the LIRPF art. 64/75 anualidades por alimentos separate-
# escala régimen. Art. 64 grants the separate escala only to a payer who
# satisfies judicial anualidades "sin derecho a la aplicación por estos últimos
# del mínimo por descendientes previsto en el artículo 58". The flag is a
# derived profile fact (renta_family.anualidades_sin_minimo_descendientes_2024):
# true (eligible — the non-custodial payer without the mínimo) by default, false
# when custody is shared (custodia compartida splits the mínimo por descendientes, so
# the payer retains it and the régimen does not apply). Consumed by the cuota
# escala formulas (0528/0530/0529/0531) inside the régimen predicate.
# Art. 58 LIRPF mínimo por descendientes aggregate, parte estatal. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) ranks
# every Art. 58.1-eligible descendant by birth_date, sums the birth-order
# tranche (Art. 58.1: 2.400 / 2.700 / 4.000 / 4.500 €) plus the Art. 58.2
# menor-3 supplement (2.800 €), and applies the Art. 61.1ª custodia-compartida
# prorrata (0.5) per descendant, projecting the result onto the Decimal fact
# `renta_family.descendientes_minimos_aggregate_2024` (the user-profile schema
# field named as a dangling selector, its former binding deleted in commit
# bc3b89594 -- retired here).
# Feeds casilla 0513 (estatal) only — casilla 0514 (autonómico) is fed by the
# sibling binding `renta-2024-profile-minimo-descendientes-autonomico`, which
# resolves each tranche against the filer's declared tax-residence CCAA (some
# comunidades, e.g. Madrid, publish their own divergent figures; Ley 22/2009
# art. 46.1.a), matching the 0511/0512 mínimo-del-contribuyente precedent
# (`renta-2024-minimo-contribuyente-autonomico`).
# Modelo 100 (2024) first-slice deductible-expense aggregation into casilla
# 0183. The ledger_renta_gastos_estimacion_directa_aggregation source routes each deductible ledger
