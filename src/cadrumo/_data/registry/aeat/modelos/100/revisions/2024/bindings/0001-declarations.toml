# Ley 35/2006 art. 50.3 — base liquidable general negativa carry-forward.
# The prior year's end-of-year generated saldo (casilla 1391, semantic_role
# irpf_anexo_c_base_liq_neg_generado) becomes, in the following year's
# declaration, the opening pending balance for the immediately-prior
# origin ejercicio (casilla 1388, "Ejercicio 2023: Pendiente de
# aplicacion al principio del periodo" in the 2024 revision). This
# previous_filing copy auto-resolves casilla 1388 from the prior filing
# so the operator does not re-key the carried saldo. Origin-year-matched:
# the 2024-revision's 1388 (ejercicio 2023) sources the 2023 filing's
# 1391, exactly as the 2025-revision's 1388 (ejercicio 2024) sources the
# 2024 filing's 1391. Art. 48's 25%-limited base-imponible mechanism is
# distinct and does not ground this base-liquidable carry.
[[revisions."2024".bindings]]
