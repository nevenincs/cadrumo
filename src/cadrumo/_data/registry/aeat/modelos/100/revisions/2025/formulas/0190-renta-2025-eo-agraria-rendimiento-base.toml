# Modelo 100 2025 estimacion objetiva agraria (Anexo I, Orden HAC/1347/2024)
# Fase 1a: rendimiento neto previo por producto.
#
# AEAT's own Diseño de Registros (aeat-dr-100-2025-dictionary) captures one
# "Ingresos íntegros" / "Índice" / "Rendimiento base producto" triplet per
# producto código of the Anexo I table (Manual práctico de Renta 2025,
# Parte 1, Capítulo 9). Every triplet shares the identical Fase 1a mechanism
# (instrucción 2.1 of the same Anexo I): rendimiento base producto = ingresos
# íntegros x índice de rendimiento neto. The índice itself stays an
# operator-declared decimal (the taxpayer/preparer reads it off the Anexo I
# código table for the declared activity — this engine does not transcribe a
# per-código coefficient table, unlike the M131 no-agrícola módulos engine,
# because the índice is a single per-activity scalar the AEAT form itself
# asks the filer to enter, not a units x coefficient product needing a
# keyed-bracket lookup).
#
# Grounded in ley-35-2006:art-31 (estimación objetiva) and
# orden-hac-1347-2024:anexo-i-instruccion-2-1 (Fase 1: Rendimiento neto
# previo), cross-checked against the AEAT Manual práctico de Renta 2025,
# Parte 1, Capítulo 9 worked example: Doña M.J.I., ingresos 18.030,00 euros x
# índice 0,37 (código 12, raíces/tubérculos/frutos no cítricos) = rendimiento
# neto previo 6.671,10 euros. See
# test_modelo_100_eo_agraria_rendimiento_base.py.
#
# Rendimiento neto previo (casilla 1537) sums every producto's rendimiento
# base — the Fase 1a aggregate across the codigo-producto catalogue.
#
# Fase 2a: rendimiento neto minorado (casilla 1539, instrucción 2.2 of the
# same Anexo I). The instrucción deducts, elemento por elemento, the
# amortización del inmovilizado material e intangible afecto a la actividad
# (excluidas las actividades forestales) per the Anexo I amortization table
# (coeficiente lineal máximo / período máximo per grupo patrimonial). This
# engine does not model a per-element libro registro de bienes de inversión
# (acquisition value, coefficient, elapsed period per asset) — the same
# honest-scalar approach the M131 estimación-objetiva módulos engine uses for
# its own minoración por incentivos a la inversión
# (orden-hac-1347-2024:instruccion-2-2-b, modelo 131 Fase 2ª,
# test_modelo_131_modulos_engine.py). Casilla 1538 ("Amortización del
# inmovilizado material e intangible") is the operator-declared euro amount
# already published by AEAT's own Diseño de Registros; a blank amortización
# never over-states the reduction (it simply omits a legitimate additional
# reduction the operator may or may not be claiming), and it never fabricates
# a per-asset depreciation figure the engine has no register to derive.
#
# Fase 3a: índices correctores y rendimiento neto de módulos (casilla 1548,
# instrucción 2.3 of the same Anexo I). Each índice casilla (1540-1547, one
# per letra a) to h) of the instrucción) is an operator/preparer-declared
# rate (AEAT Diseño de Registros field type P012, fields E5AI1-E5AI8) — the
# taxpayer reads the applicable índice off the Anexo I table and enters it
# directly, exactly like the Fase 1a per-producto índice de rendimiento neto
# above. The instrucción states each índice applies "sobre el rendimiento
# neto minorado o, en su caso, sobre el rectificado por aplicación de los
# [índices] anteriores" — a sequential cascade in the Anexo's own letra
# order, not a single-índice pick nor a simultaneous product. A blank índice
# casilla is never fabricated into a reduction (the cascade step is skipped);
# a non-positive rendimiento neto minorado never receives índices correctores
# (the general estimación objetiva principle). Índice 9 (mejillón en batea,
# letra i) is out of scope for this dispatcher — it applies to the separate
# mejillón producto (casilla 0160), not to this 1539→1548 cascade. See
# _evaluate_m100_resolve_eo_agraria_indices_correctores and
# orden-hac-1347-2024:anexo-i-instruccion-2-3.
#
# Fase 4a (reduccion general 5% + reduccion agricultores jovenes 25%,
# casillas 1549/1551, plus the rendimiento neto reducido total in casilla
# 1555) is computed by renta-2025-eo-agraria-reduccion-general,
# renta-2025-eo-agraria-reduccion-jovenes, and
# renta-2025-eo-agraria-rendimiento-neto-reducido-por-actividad in
# 0294-renta-2025-eo-agraria-reducciones-fase-4a.toml. Fase 4a apartado 3
# (gastos extraordinarios, casilla 1552) and Fase 5a (art. 32 irregularidad,
# casilla 1554) remain the manual operator-entered casillas already declared
# on this revision — bounded by the incremental engine-authoring
# discipline this table follows.

[[revisions."2025".formulas]]
