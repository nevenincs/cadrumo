# Fase 1a aggregate: rendimiento neto previo (casilla 1537) sums every
# producto's rendimiento base producto across the codigo-producto catalogue.
# Each producto slot is independent: a taxpayer with a mixed
# agrícola-ganadera explotación may legitimately populate several products
# simultaneously. The AEAT Manual práctico de Renta 2025, Parte 1,
# Capítulo 9 full worked example (Don L.H.I.) itself declares ingresos
# computables for three simultaneous productos — maíz, corderos (ganado
# ovino de carne), and productos hortícolas — within the single actividad
# he files (see test_modelo_100_eo_agraria_reducciones_fase_4a.py). An
# unselected product's ingresos/índice simply stay blank (zero), so the sum
# never fabricates a rendimiento for a product the taxpayer did not declare.
[[revisions."2025".formulas]]
id = "renta-2025-eo-agraria-rendimiento-neto-previo"
target_casilla_id = "1537"
expression = { op = "sum", args = [
    { casilla_id = "0159" },
    { casilla_id = "1490" },
    { casilla_id = "1493" },
    { casilla_id = "1496" },
    { casilla_id = "1499" },
    { casilla_id = "1502" },
    { casilla_id = "1505" },
    { casilla_id = "1508" },
    { casilla_id = "1511" },
    { casilla_id = "1514" },
    { casilla_id = "1517" },
    { casilla_id = "1520" },
    { casilla_id = "1523" },
    { casilla_id = "1526" },
    { casilla_id = "1529" },
    { casilla_id = "1532" },
    { casilla_id = "1535" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:anexo-i-instruccion-2-1"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["El rendimiento neto es el resultante de la suma de los rendimientos netos que correspondan"]

# Fase 2a: rendimiento neto minorado (casilla 1539) = rendimiento neto previo
# (casilla 1537) minus the operator-declared amortización del inmovilizado
# material e intangible (casilla 1538, instrucción 2.2 of the same Anexo I).
# A blank amortización subtracts zero, never fabricating a depreciation
# figure the engine has no per-element asset register to derive.
[[revisions."2025".formulas]]
id = "renta-2025-eo-agraria-rendimiento-neto-minorado"
target_casilla_id = "1539"
expression = { op = "subtract", args = [
    { casilla_id = "1537" },
    { casilla_id = "1538" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:anexo-i-instruccion-2-2"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["Fase 2ª: Determinación del rendimiento neto minorado"]

# Fase 3a: rendimiento neto de módulos (casilla 1548) = rendimiento neto
# minorado (casilla 1539) with the índices correctores 1540-1547 (letras a a
# h of instrucción 2.3, in that exact order) applied in sequence, per the
# AEAT's own field order (E5AI1-E5AI8). See
# _evaluate_m100_resolve_eo_agraria_indices_correctores.
# Cross-checked against the AEAT Manual práctico de Renta 2025, Parte 1,
# Capítulo 9 full worked example (Don L.H.I.): rendimiento neto minorado
# 14.704,42 euros x índice corrector por personal asalariado 0,90 (único
# índice aplicable en ese ejemplo) = rendimiento neto de módulos 13.233,98
# euros. See test_modelo_100_eo_agraria_indices_correctores.py.
[[revisions."2025".formulas]]
id = "renta-2025-eo-agraria-rendimiento-neto-modulos"
target_casilla_id = "1548"
expression = { op = "m100_resolve_eo_agraria_indices_correctores", args = [
    { casilla_id = "1539" },
    { casilla_id = "1540" },
    { casilla_id = "1541" },
    { casilla_id = "1542" },
    { casilla_id = "1543" },
    { casilla_id = "1544" },
    { casilla_id = "1545" },
    { casilla_id = "1546" },
    { casilla_id = "1547" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:anexo-i-instruccion-2-3"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["3ª Fase: Índices correctores y determinación del rendimiento neto de módulos"]
