# Exhaustive reconcile-when-present verification for Modelo 100
# revision 2024: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-100-2024-cuota-chain-verification).
[[revisions."2024".verification_expectations]]
id = "modelo-100-2024-reconcile-when-present"
computed_casilla_ids = []
# Casillas whose engine value is independently checked against an
# AEAT-authoritative oracle, not only the app's own engine: 0226
# ("Rendimiento neto reducido") reproduces 58.100,00, the figure the AEAT
# Manual practico de Renta 2024 (Parte 1, Cap. 7) states three times over in
# its own caso practico table for a medico radiologo actividad profesional in
# estimacion directa simplificada (see
# corpus/manual_oracles/modelo-100-2024-estimacion-directa-simplificada.json
# and test_m100_2024_estimacion_directa_manual_worked_example.py). 0180
# ("Total ingresos computables") reproduces 138.400,00 from that same caso
# practico, the "Total ingresos" row of its own valores-fiscales column; it is
# the first published total downstream of casilla 0171 ("Ingresos de
# explotacion"), which is bound to the ledger-income aggregation, so grounding
# it makes the aggregation and its binding resolver independently checked
# rather than only the formula chain above them (see
# test_ledger_income_chain_aeat_exempt_worked_example.py). 0012
# ("Total ingresos integros computables"), 0017 ("Rendimiento neto previo"),
# 0022 ("Rendimiento neto") and 0025 ("Rendimiento neto reducido") of the
# rendimientos-del-trabajo chain reproduce 17.240,00 / 13.640,00 / 8.140,00 /
# 838,00 respectively, the four subtotals the same manual (Parte 1, Cap. 3)
# states verbatim in its own caso practico solution for a despido
# improcedente of a trabajador con discapacidad (see
# corpus/manual_oracles/modelo-100-2024-rendimientos-trabajo-despido-improcedente.json
# and test_m100_2024_rendimientos_trabajo_despido_manual_worked_example.py).
# 0149 ("Rendimiento neto"), 0150 ("Reduccion por arrendamiento de vivienda,
# art. 23.2") and 0154 ("Rendimiento neto reducido del capital inmobiliario")
# reproduce 3.287,09 / 2.958,38 / 328,71 respectively, the three subtotals the
# same manual (Parte 1, Cap. 4) states verbatim in its own caso practico
# solution for a vivienda arrendada en zona de mercado residencial tensionado
# (see
# corpus/manual_oracles/modelo-100-2024-capital-inmobiliario-arrendamiento-vivienda-tensionada.json
# and test_m100_2024_capital_inmobiliario_arrendamiento_vivienda_manual_worked_example.py).
# 1826 ("Valor de transmision"), 1830 ("Valor de adquisicion"), 1836
