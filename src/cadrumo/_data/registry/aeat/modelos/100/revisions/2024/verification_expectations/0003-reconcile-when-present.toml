# 2.621,89 / 2.140,50 / 2.094,64 / 2.406,50 / 2.360,64 respectively, the
# subtotals the same manual (Parte 1, Cap. 15) states verbatim in its own
# "Ejemplo practico: calculo de las cuotas integras estatal y autonomica" for
# don A.B.C. residente en Aragon (see
# corpus/manual_oracles/modelo-100-2024-cuotas-integras-escala-aragon.json and
