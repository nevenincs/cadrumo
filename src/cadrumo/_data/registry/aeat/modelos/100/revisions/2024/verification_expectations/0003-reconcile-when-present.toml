# reproduce 148.100 / 96.380 / 51.720 / 49.562,95 respectively, the four
# subtotals the same manual (Parte 1, Cap. 11) states verbatim in its own caso
# practico solution for don J.P.C.'s transmision de un piso with DT 9.a
# coeficientes de abatimiento (see
# corpus/manual_oracles/modelo-100-2024-ganancias-patrimoniales-transmision-inmueble.json
# and test_m100_2024_ganancias_patrimoniales_transmision_inmueble_manual_worked_example.py).
# 0519/0520 ("Minimo personal y familiar" estatal/autonomica), 0528/0529
