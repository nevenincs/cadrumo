# Mínimo por ascendientes for the gravamen autonómico (LIRPF art. 56.3; Ley 22/2009
# art. 46.1.a), keyed by the comunidad of residence. Each row is the art. 59.1 cuantía
# (mayor-65) or the art. 59.2 increment (mayor-75) one comunidad approved, dated from
# the day its law gives the figure effect. A comunidad without a row approved no
# ascendant amount of its own, and art. 56.3 leaves it the state figures of
# renta-minimo-ascendientes-mayor-65 and -mayor-75: the manual names the comunidades
# that approved their own mínimos and states that the rest apply those of the LIRPF.
# The Renta 2020 and 2021 manuals list no comunidad with its own ascendant amount, so
# the table starts with this edition.
#
# For 2022 (Manual práctico de Renta 2022, parte 1, cap. 14, pp. 937-944): Andalucía
# (Ley 5/2021 art. 23 bis, effect from 1 January 2022), Galicia (DL 1/2011 art. 4 bis,
# effect from 1 January 2022), Madrid (DL 1/2010 in the redaction of Ley 8/2022, effect
# from 1 January 2022) and the Comunitat Valenciana (Ley 13/1997 art. 2 bis, in force
# from 28 October 2022, so it governs the devengo of 31 December 2022).
#
# The art. 61 norma 4ª cuantía for an ascendant who dies in the period stays the state
# figure: each comunidad law amends the art. 59 amounts, not art. 61.
