# Modelo 100 Art. 81.2 LIRPF annual cap on the guarderia increment (casilla 0613).
#
# The maximum the deduccion por maternidad may be increased for one child's
# gastos de custodia in a full period. It is an ANNUAL ceiling, not a flat
# entitlement -- art. 81.3 prorates it by the months the apartado 1 and
# apartado 2 requirements hold simultaneously, and bounds the result at that
# child's own non-subsidised spend. The registry formula must therefore never
# apply this figure directly per child; it is the numerator of a proration.
#
# Read by the application layer, which computes that per-child proration, so it
# must be a resolvable parameter rather than a literal inside the 0613
# expression.

[[revisions."2025".parameters]]
id = "renta-2025-guarderia-incremento-cap-anual"
data_type = "money"
unit = "EUR"
