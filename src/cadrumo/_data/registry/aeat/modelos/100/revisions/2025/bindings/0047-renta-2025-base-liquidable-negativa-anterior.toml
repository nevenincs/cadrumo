# Ley 35/2006 art. 50.3 — base liquidable general negativa carry-forward.
# The prior year's end-of-year pending balance (the generated saldo casilla
# 1391, semantic_role irpf_anexo_c_base_liq_neg_generado) becomes the
# current year's opening pending balance for that origin ejercicio
# (casilla 1388, "Ejercicio 2024: Pendiente de aplicacion al principio
# del periodo"). This previous_filing copy auto-resolves casilla 1388
# from the prior filing so the operator does not re-key the carried saldo.
# Art. 48's 25%-limited integration of negative base imponible general is
# a distinct mechanism and does not ground this base-liquidable carry.
[[revisions."2025".bindings]]
id = "renta-base-liquidable-negativa-general-anterior"
provider = { kind = "previous_filing", source_modelo = "100", source_casilla_id = "1391", temporal = { kind = "filing_year_offset", years = -1, source_periods = ["0A"] } }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-50", "orden-hac-277-2026:art-3"]
source_refs = ["aeat-renta-2025-manual-parte1", "boe-modelo-100-2025-form", "aeat-dr-100-2025-dictionary"]

[[revisions."2025".bindings.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
