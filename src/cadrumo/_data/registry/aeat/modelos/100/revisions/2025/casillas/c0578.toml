continuidad_evidence = "Official AEAT Renta manuals ground the same autonomous delay-interest bucket in both exercises: Manual práctico de Renta 2024, Parte 1, chapter 18, section 'Incremento de las cuotas líquidas, estatal y autonómica, por pérdida del derecho a deducciones de ejercicios anteriores' (p. 1465), requires the corresponding delay interest and assigns the autonomous component to the autonomous liquid quota; the 2025 Parte 1 manual, same chapter and section (p. 1354), applies the same rule for 2025 regularizations. AEAT dictionaries aeat-dr-100-2024-dictionary:917 and aeat-dr-100-2025-dictionary:943 map INT97A at /DatosEconomicos/Resultados/CalculoImpuestoRes/GravamenesRes/INT97A [P102] to box 0578 in both revisions. The label, section, semantic_role, legal_refs, box number, and representation remain stable, with the 2025 legal reference addition recorded as an evolution. This INT97A field is kept distinct from INT98A/box 0581, which belongs to the separate autonomous-deduction bucket."
