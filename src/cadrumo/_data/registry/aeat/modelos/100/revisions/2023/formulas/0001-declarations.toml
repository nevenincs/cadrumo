[[revisions."2023".formulas]]
id = "renta-minimo-descendientes-estatal"
target_casilla_id = "0513"
# Art. 58 LIRPF mínimo por descendientes, parte estatal. The per-descendant
# birth-order tranche, menor-3 supplement, and Art. 61.1a custodia-compartida
# prorrata are computed by the profile-binding aggregate (see the binding
# source citation); this formula simply projects that aggregate onto the
# casilla.
expression = { op = "copy", args = [
    { binding = "renta-profile-minimo-descendientes-estatal" }
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61"]
source_refs = ["aeat-dr-100-2023-dictionary", "aeat-renta-2023-manual-parte1"]

[[revisions."2023".formulas.source_citations]]
source_ref = "aeat-renta-2023-manual-parte1"
required_text = ["Mínimo por descendientes"]
[[revisions."2023".formulas]]
id = "renta-minimo-descendientes-autonomico"
target_casilla_id = "0514"
# Art. 58/73 LIRPF mínimo por descendientes, parte autonómica. Feeds from the
# profile-derived autonómico aggregate, which resolves each birth-order tranche
# against the filer's declared tax-residence CCAA (Ley 22/2009 art. 46.1.a);
# Comunidad de Madrid publishes its own full mínimo por descendientes table for
# 2023 (Ley 13/2023, efectos 1-1-2023, modifying Decreto Legislativo 1/2010
# art. 2), every other CCAA mirrors the estatal aggregate exactly.
expression = { op = "copy", args = [
    { binding = "renta-profile-minimo-descendientes-autonomico" }
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61", "ley-35-2006:art-73", "madrid-dl-1-2010:art-2"]
source_refs = ["aeat-dr-100-2023-dictionary", "aeat-renta-2023-manual-parte1"]

