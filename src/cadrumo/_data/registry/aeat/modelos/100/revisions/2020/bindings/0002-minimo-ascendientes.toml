# Art. 59/61 LIRPF mínimo por ascendientes, parte estatal. The derived-fact injector
# folds every stored ascendant row (renta_family.ascendiente.{n}) into one aggregate:
# the art. 59.1 cuantía from the minimum age or a disability, the art. 59.2 increment
# from the increment age, the art. 61 norma 4ª flat cuantía for a death in the period,
# divided by the descendants the ascendant lives with (art. 61 normas 1ª and 5ª). A row
# that leaves a deciding fact unstated withholds the aggregate. The selector carries no
# year: every edition inherits this one declaration.
[[revisions."2020".bindings]]
id = "renta-profile-minimo-ascendientes-estatal"
provider = { kind = "profile", profile_key = "renta_family.ascendientes_minimos_aggregate" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-59", "ley-35-2006:art-61"]
source_refs = ["lirpf-cuota-chain-authority"]

[[revisions."2020".bindings.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["El mínimo por ascendientes será de 1.150 euros anuales"]

# Art. 56.3/59/61 LIRPF mínimo por ascendientes, parte autonómica. The same injector
# folds the same rows with the same eligibility and sharing, taking the art. 59.1
# cuantía and the art. 59.2 increment the filer's comunidad of residence approved
# under Ley 22/2009 art. 46.1.a), read from the keyed tables
# renta-minimo-ascendientes-mayor-65-autonomico and -mayor-75-autonomico. A comunidad
# the edition's table does not list approved no amount of its own, so art. 56.3 leaves
# the state figures. The selector carries no year: every edition inherits it.
[[revisions."2020".bindings]]
id = "renta-profile-minimo-ascendientes-autonomico"
provider = { kind = "profile", profile_key = "renta_family.ascendientes_minimos_aggregate_autonomico" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-56", "ley-35-2006:art-59", "ley-35-2006:art-61"]
source_refs = ["lirpf-cuota-chain-authority"]

[[revisions."2020".bindings.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["incrementados o disminuidos a efectos de cálculo del gravamen autonómico"]
