# LIRPF art. 64 (estatal) anualidades por alimentos a favor de los hijos —
# régimen de escala separada. When the taxpayer satisfies judicial anualidades
# (0527 > 0) that are lower than the base liquidable general (0527 < 0505) and
# has NO right to the mínimo por descendientes for those children (the profile
# eligibility flag), the escala del art. 63 applies SEPARATELY to the anualidades
# and to the rest of the base liquidable general:
#   escala(0527) + escala(0505 - 0527).
# The predicate is nested so the eligibility binding is only evaluated when the
# two casilla conditions already hold (short-circuit), leaving the ordinary
# escala(0505) branch byte-identical for every non-anualidades filer. The
# shared-custody negation rides on the derived profile flag (default eligible;
# 0 when custody is shared and the payer retains the mínimo por descendientes).
[[revisions."2020".formulas]]
id = "renta-2020-cuota-escala-estatal-sobre-base-liquidable-general"
target_casilla_id = "0528"
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [{ casilla_id = "0527" }, { literal = "0" }] },
    { op = "if_then_else", args = [
        { op = "less_than", args = [{ casilla_id = "0527" }, { casilla_id = "0505" }] },
        { op = "if_then_else", args = [
            { binding = "renta-2020-profile-anualidades-sin-minimo-descendientes" },
            { op = "add", args = [
                { op = "lookup_bracket", args = [
                    { casilla_id = "0527" },
                    { parameter = "renta-2020-escala-estatal-base-general" },
                ] },
                { op = "lookup_bracket", args = [
                    { op = "subtract", args = [{ casilla_id = "0505" }, { casilla_id = "0527" }] },
                    { parameter = "renta-2020-escala-estatal-base-general" },
                ] },
            ] },
            { op = "lookup_bracket", args = [
                { casilla_id = "0505" },
                { parameter = "renta-2020-escala-estatal-base-general" },
            ] },
        ] },
        { op = "lookup_bracket", args = [
            { casilla_id = "0505" },
            { parameter = "renta-2020-escala-estatal-base-general" },
        ] },
    ] },
    { op = "lookup_bracket", args = [
        { casilla_id = "0505" },
        { parameter = "renta-2020-escala-estatal-base-general" },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-62", "ley-35-2006:art-63-2015", "ley-35-2006:art-64"]
source_refs = ["lirpf-cuota-chain-authority"]

