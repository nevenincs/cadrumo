[[revisions."2022".formulas]]
id = "renta-deduccion-maternidad-0611-cotizaciones"
target_casilla_id = "0611"
# Art. 81.1 LIRPF in force until 2022: 100 euros per month in which the mother
# carries on an activity and is registered with Social Security or a mutualidad,
# at most 1.200 euros a year and, for each child, at most the cotizaciones y
# cuotas devengadas after that child's birth. There is no 150 euro increment in
# this redaction. The per-child fold happens where the descendant records live;
# this leaf carries the one resolved value into the casilla. A child with months
# and no stated cotizaciones figure leaves the value unresolved, so the box is
# never computed from an assumed zero or an unlimited amount. The 2023 edition,
# after the Ley 31/2022 reform, replaces this formula with the unlimited rule.
expression = { binding = "renta-profile-deduccion-maternidad-cotizaciones" }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-81", "ley-35-2006:art-81-redaccion-2018"]
source_refs = ["aeat-dr-100-2022-dictionary", "aeat-renta-2022-manual-parte1"]

[[revisions."2022".formulas.source_citations]]
source_ref = "aeat-renta-2022-manual-parte1"
required_text = [
    "100 euros por cada mes del período impositivo en que concurran de forma",
    "no podrá superar ninguna de las dos cantidades",
    "Hasta 1.200 euros anuales.",
    "cotizaciones y cuotas totales a la Seguridad Social y Mutualidades",
]
[[revisions."2022".formulas]]
id = "renta-incremento-guarderia-0613"
target_casilla_id = "0613"
# Art. 81.2 LIRPF in force until 2022: incremento de la deducción por maternidad
# por gastos de custodia en guardería o centro de educación infantil autorizado.
#
# The manual states that the increment may not exceed, for each child, either
# 1.000 euros a year or the lesser of (a) the cotizaciones y cuotas totales a la
# Seguridad Social y Mutualidades devengadas in the period after the birth and
# (b) the unsubsidised spend paid for that child. Every one of those bounds,
# with the month proration, is per child, and this schema has no per-descendant
# fold, so the fold happens where the descendant records live and the registry
# consumes one resolved value. Each child's cotizaciones are stated on its own row.
# This edition binds the fold that limits each child by them; the 2023 edition,
# after the Ley 31/2022 reform, binds the fold that does not. A child with an
# increment but no stated figure leaves the value unresolved, so the box is
# never computed from an assumed zero.
expression = { binding = "renta-profile-incremento-guarderia" }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-81"]
source_refs = ["aeat-dr-100-2022-dictionary", "aeat-renta-2022-manual-parte1"]

[[revisions."2022".formulas.source_citations]]
source_ref = "aeat-renta-2022-manual-parte1"
required_text = [
    "incremento",
    "guarder",
    "cotizaciones",
    "gasto efectivo no subvencionado",
    "se calculará proporcionalmente al número de meses",
]
# The reduction's regime and tier are derived from the lease facts and the dated
# regime fact, never entered: the legacy 60 per cent for a devengo before the
# regime start or a contract before the cut-off, otherwise the 90, 70, 60 or 50
# per cent tier. A lease the reduction does not reach (not a dwelling, or in
# breach of art. 17.6 LAU) is derived as not applicable and reduces nothing.
[[revisions."2022".formulas]]
id = "renta-capital-inmobiliario-reduccion-arrendamiento-vivienda-art-23-2"
target_casilla_id = "0150"
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [
        { op = "multiply", args = [{ casilla_id = "0100" }, { casilla_id = "0149" }] },
        { literal = "0" },
    ] },
    { op = "if_then_else", args = [
        { binding = "renta-rental-reduccion-art-23-2-aplicable" },
        { op = "multiply", args = [
            { casilla_id = "0149" },
            { op = "lookup_parameter_by_entity_type", args = [
                { literal = "0" },
                { binding = "renta-rental-reduccion-art-23-2-tier" },
                { dispatch_table_entries = [
                    { key = "legacy-60", parameter = "renta-rental-reduccion-rate-legacy" },
                    { key = "tier-50", parameter = "renta-rental-reduccion-rate-tier-50" },
                    { key = "tier-60", parameter = "renta-rental-reduccion-rate-tier-60" },
                    { key = "tier-70", parameter = "renta-rental-reduccion-rate-tier-70" },
                    { key = "tier-90", parameter = "renta-rental-reduccion-rate-tier-90" },
                ] },
            ] },
        ] },
        { literal = "0" },
    ] },
    { literal = "0" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-23-2021"]
source_refs = ["aeat-renta-2022-manual-parte1"]

