# Art. 84.2.3º and 4º LIRPF: the joint reduction (0461) is applied first to the
# base imponible general (0435), which it cannot make negative; the remainder
# reduces the base imponible del ahorro (0460), which cannot go negative either.
# The record design names this box JREDU21, "Remanente de la casilla [0461] que
# se aplica". It starts here with the computed 0461 and the general base that
# 0500 keeps from going negative; both are this edition's.
#   0506 = max(0, min(0460, 0461 - max(0, 0435)))
expression = { op = "max", args = [
    { literal = "0" },
    { op = "min", args = [
        { casilla_id = "0460" },
        { op = "subtract", args = [
            { casilla_id = "0461" },
            { op = "max", args = [{ literal = "0" }, { casilla_id = "0435" }] },
        ] },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-84", "ley-35-2006:art-50"]
source_refs = ["lirpf-cuota-chain-authority"]

