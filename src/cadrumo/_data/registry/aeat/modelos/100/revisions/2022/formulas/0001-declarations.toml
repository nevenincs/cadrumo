id = "renta-reduccion-art-84-conjunta"
target_casilla_id = "0461"
# Art. 84 LIRPF: reducción por tributación conjunta.
# Tipo 1 (matrimonio, Art. 82.1.1°): declaration_type = 2 AND minor_children_in_unit = 0 → €3.400
# Tipo 2 (monoparental, Art. 82.1.2°): declaration_type = 2 AND minor_children_in_unit = 1 → €2.150
# Individual (declaration_type = 1): → €0
expression = { op = "if_then_else", args = [
    { op = "equal", args = [
        { binding = "renta-profile-declaration-type" },
        { literal = "2" },
    ] },
    { op = "if_then_else", args = [
        { op = "equal", args = [
            { binding = "renta-profile-family-minor-children-in-unit" },
            { literal = "0" },
        ] },
        { literal = "3400" },
        { literal = "2150" },
    ] },
    { literal = "0" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-82", "ley-35-2006:art-83", "ley-35-2006:art-84"]
source_refs = ["aeat-dr-100-2022-dictionary", "boe-modelo-100-2022-form", "aeat-renta-2022-manual-parte1"]

