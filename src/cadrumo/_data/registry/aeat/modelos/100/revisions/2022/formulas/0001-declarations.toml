# Estimacion objetiva agraria (Anexo I of each year's modulos orden: Orden
# HFP/1335/2021 for 2022, HFP/1172/2022 for 2023, HFP/1359/2023 for 2024 and
# HAC/1347/2024 for 2025). The engine is stated here once; later editions key
# only their own orden and manual citations and the genuine yearly changes.
#
# Fase 1a (instruccion 2.1): each producto slot's rendimiento base is its
# ingresos integros times its indice de rendimiento neto, and the rendimiento
# neto previo (1537) sums every slot. A blank slot contributes zero.
# Fase 2a (instruccion 2.2): the rendimiento neto minorado (1539) deducts the
# declared amortizacion (1538) and, for 2022 to 2024, the gasoleo agricola
# (0158, 35 por 100) and fertilizantes (0159, 15 por 100) reductions those
# years' ordenes allow on the rendimiento neto previo (Orden HFP/1172/2022 DA
# 7a for 2022 and DA 3a for 2023, Orden HFP/1359/2023 DA 3a for 2024). The
# boxes carry the declared reduction amounts; 2025 has neither box.
# Fase 3a (instruccion 2.3): indices correctores 1540 to 1547 applied in the
# Anexo's letter order (m100_resolve_eo_agraria_indices_correctores).
# Fase 4a: the reduccion general (1549) at the year's rate for Anexo I
# activities -- 25 por 100 in 2022 (Orden HFP/405/2023 art. 2), 15 in 2023
# (Orden HAC/348/2024 art. 2), 5 in 2024 and 2025 -- only when 1548 is
# positive. The jovenes reduction (1551, instruccion 3) applies 25 por 100 to
# the modulos net of the general reduction, as each orden's DA 1a.2 fixes;
# the La Palma and DANA reductions the form subtracts in 1550 are declared
# amounts outside that base.
# Fase 5a (LIRPF art. 32.1): 30 por 100 of the operator-declared irregular
# base, capped at 300.000 euros; 1555 is 1550 less 1551, 1552 and 1554.
# Cross-checked against each year's manual worked example (Don L.H.I.).
