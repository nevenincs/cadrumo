id = "renta-reduccion-art-84-conjunta"
target_casilla_id = "0461"
# Art. 84.2 LIRPF: reducción por tributación conjunta.
# 3.º First modality (Art. 82.1.1ª, spouses not legally separated, with or
#     without children): family situation casado → €3.400.
# 4.º Second modality (Art. 82.1.2ª, single parent with the children) → €2.150,
#     except when the taxpayer lives with the father or mother of any child in
#     the unit → €0. The cohabitation fact is read only on this branch and stays
#     unresolved until the profile states it.
# Individual (declaration_type = 1): → €0
expression = { op = "if_then_else", args = [
    { op = "equal", args = [
        { binding = "renta-profile-declaration-type" },
        { literal = "2" },
    ] },
    { op = "if_then_else", args = [
        { op = "text_equal", args = [
            { binding = "renta-profile-family-situacion-familiar" },
            { text_literal = "casado" },
        ] },
        { literal = "3400" },
        { op = "if_then_else", args = [
            { binding = "renta-profile-family-convive-otro-progenitor" },
            { literal = "0" },
            { literal = "2150" },
        ] },
    ] },
    { literal = "0" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-82", "ley-35-2006:art-83", "ley-35-2006:art-84"]
source_refs = ["aeat-dr-100-2022-dictionary", "boe-modelo-100-2022-form", "aeat-renta-2022-manual-parte1"]

