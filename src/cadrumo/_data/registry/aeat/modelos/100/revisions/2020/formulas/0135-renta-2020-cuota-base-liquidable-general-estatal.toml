[[revisions."2020".formulas]]
id = "renta-2020-cuota-base-liquidable-general-estatal"
target_casilla_id = "0532"
# Floored at 0 per LIRPF art. 64: "sin que pueda resultar negativa como
# consecuencia de tal minoración". Harmless for the ordinary chain, where the
# escala on the base (0528) always dominates the escala on the mínimo (0530).
expression = { op = "max", args = [
    { literal = "0" },
    { op = "subtract", args = [{ casilla_id = "0528" }, { casilla_id = "0530" }] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-62", "ley-35-2006:art-63-2015", "ley-35-2006:art-64"]
source_refs = ["lirpf-cuota-chain-authority"]

