# Eligibility flag for the LIRPF art. 64/75 anualidades por alimentos separate-
# escala régimen. Art. 64 grants the separate escala only to a payer who
# satisfies judicial anualidades "sin derecho a la aplicación por estos últimos
# del mínimo por descendientes previsto en el artículo 58". The flag is a
# derived profile fact (renta_family.anualidades_sin_minimo_descendientes_2024):
# true (eligible — the non-custodial payer without the mínimo) by default, false
# when custody is shared (custodia compartida splits the mínimo por descendientes, so
# the payer retains it and the régimen does not apply). Consumed by the cuota
# escala formulas (0528/0530/0529/0531) inside the régimen predicate.
[[revisions."2022".bindings]]
id = "renta-ledger-expense-0183-deductible"
provider = { kind = "ledger_renta_gastos_estimacion_directa_aggregation", modelo = "100", period = "0A", target_casilla_id = "0183", fact = "deductible_amount_sum" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["ley-35-2006:art-28", "ley-35-2006:art-30"]
source_refs = ["aeat-renta-2022-manual-parte1", "lirpf-cuota-chain-authority"]

