# Ley 35/2006 art. 50.3 — base liquidable general negativa carry-forward.
# The prior year's end-of-year generated saldo (casilla 1391, semantic_role
# irpf_anexo_c_base_liq_neg_generado) becomes, in the following year's
# declaration, the opening pending balance for the immediately-prior
# origin ejercicio (casilla 1388, "Ejercicio 2023: Pendiente de
# aplicacion al principio del periodo" in the 2024 revision). This
# previous_filing copy auto-resolves casilla 1388 from the prior filing
# so the operator does not re-key the carried saldo. Origin-year-matched:
# the 2024-revision's 1388 (ejercicio 2023) sources the 2023 filing's
# 1391, exactly as the 2025-revision's 1388 (ejercicio 2024) sources the
# 2024 filing's 1391. Art. 48's 25%-limited base-imponible mechanism is
# distinct and does not ground this base-liquidable carry.
[[revisions."2022".bindings]]
id = "renta-base-liquidable-negativa-general-anterior"
provider = { kind = "previous_filing", source_modelo = "100", source_casilla_id = "1391", temporal = { kind = "filing_year_offset", years = -1, source_periods = ["0A"] } }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-50"]
source_refs = ["aeat-dr-100-2022-dictionary", "aeat-renta-2022-manual-parte1", "boe-modelo-100-2022-form"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-renta-2022-manual-parte1"
required_text = ["Modelo 100", "ejercicio 2022"]
# Modelo 100 (2024) casilla 0171 "Ingresos de explotacion" (estimacion directa)
# is the annual counterpart of the M130 income aggregation: it sums
# actividad-economica income from the bucket ledger over the full ejercicio.
# IVA repercutido is collected on behalf of Hacienda and is not computable
# income, so the ingresos_integros_sum fact contributes each transaction's
# IVA-exclusive base imponible (taxable_base) when tagged, falling back to the
# gross amount. The annual income aggregator (modelo == "100" path,
# aggregate_renta_m100_income_ledger) feeds this binding; the same source kind
# serves the M130 cumulative-quarter income. This brings the 2024 revision to
# parity with the 2025 renta-2025-ledger-income-0171 binding, closing the gap
# where the annual M100 silently declared zero actividad-economica income.
[[revisions."2022".bindings]]
id = "renta-ledger-income-0171"
provider = { kind = "ledger_renta_income_aggregation", modelo = "100", target_casilla_id = "0171", fact = "ingresos_integros_sum" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["ley-35-2006:art-27", "ley-35-2006:art-28"]
source_refs = ["lirpf-cuota-chain-authority"]

[[revisions."2022".bindings.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["estimación directa", "rendimiento neto"]
