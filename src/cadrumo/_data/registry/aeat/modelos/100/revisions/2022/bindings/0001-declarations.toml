# The type of the element on a row of other elements, for every element of the register is
# affected to an activity. What supports the digit differs by edition, and no bundled source
# states the digit itself:
#   2024 and 2025: the input dictionaries word OT5 as "Elementos patrimoniales (bienes o
#     derechos) afectos a actividades economicas", and the fifth option reads as clave 5. The
#     AEAT Renta 2024 help confirmed that digit when it was consulted; it is not bundled, and no
#     2025 edition of it was found.
#   2022 and 2023: an inference only. The XSD declares the same OT1 to OT5 options as 2024 and
#     2025, but these input dictionaries leave OT5 an unresolved label placeholder, so nothing
#     bundled for these two editions words the option. The cited dictionary and manual establish
#     the box and the apartado, not the digit.
# 2020 and 2021 numbered that option 7 and have no binding here.
[[revisions."2022".bindings]]
id = "renta-activity-asset-disposal-element-type-1626"
provider = { kind = "activity_asset_disposal", modelo = "100", period = "0A", route = "transmission_element_type", target_casilla_id = "1626", fact = "element_type_clave", clave = "5" }
value = { data_type = "text", channel = "text" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-28", "ley-35-2006:art-33"]
source_refs = ["aeat-dr-100-2022-dictionary", "aeat-renta-2022-manual-parte1"]

