# Casilla 0599, the retenciones and ingresos a cuenta borne on actividades
# economicas (LIRPF art. 99; RIRPF art. 95). The perceptor's own issued invoice
# states the retencion the client practised, so the ledger supplies it. The
# declared_withheld_amount_sum fact totals only the rows whose linked sales
# invoice declares the figure. A figure reconstructed from invoice gross minus
# cash received is reported with its count and amount and never added, and a
# row whose retencion the substrate cannot determine is reported as unknown,
# never as zero.
#
# target_casilla_id is the observation-match key, not the output box: every
# Modelo 100 renta-income observation is built against the income casilla 0171,
# and casilla 0599 names this binding directly.
#
# Filing grade. Each row's retencion follows the income it was practised on into
# the ejercicio the declared RIRPF art. 7 criterion imputes that income to,
# whenever it was paid (LIRPF art. 14.1.b; RIRPF art. 79), and an unknown
# criterion or accrual date leaves the value unresolved. Only withholding on a
# linked, wholly paid invoice is credited, and a rental activity's withholding is
# left to the rental credit 0598. The credit reconciliation compares the value
# with the payer records by the payer's payment year (DGT V4965-16), with the
# borrador, and with casilla 06 of the filed fourth-quarter Modelo 130 on that
# return's own basis; only a difference the itemised timing cannot explain blocks.
#
# The operator ruled this promotion on 2026-11-02, once the resolver and the
# reconciliation held those properties.
#
# The borrador may hold this casilla, but only as a cross-check: the credit is the
# withholding the taxpayer's own invoices declare, never the informative prefill.
[[revisions."2022".bindings]]
id = "renta-ledger-actividad-retenciones-0599"
provider = { kind = "ledger_renta_income_aggregation", modelo = "100", target_casilla_id = "0171", fact = "declared_withheld_amount_sum" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-95", "ley-35-2006:art-14", "rd-439-2007:art-7", "rd-439-2007:art-79"]
source_refs = ["lirpf-cuota-chain-authority"]
aeat_prefilled = true
borrador_participation = "cross_check_only"

