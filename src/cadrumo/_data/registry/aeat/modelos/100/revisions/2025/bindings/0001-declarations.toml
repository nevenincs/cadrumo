# Art. 58/61 LIRPF mínimo por descendientes aggregate, parte autonómica. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) computes
# this aggregate using the SAME Art. 58.1/58.2 birth-order-tranche method as
# the estatal half, but resolves each tranche amount against the filer's
# declared tax-residence CCAA first (Ley 22/2009 art. 46.1.a cedes normative
# competence over this figure to each comunidad). Comunidad de Madrid publishes
# its own full mínimo por descendientes table for 2025 (Decreto Legislativo
# 1/2010 art. 2, as modified by Ley 13/2023: 2.575,85 € / 2.897,83 € / 4.400 €
# / 4.950 € + 3.005,16 € menor-3, vs the general LIRPF Art. 58 2.400 € /
# 2.700 € / 4.000 € / 4.500 € + 2.800 €).
#
# KNOWN GAP -- this modelling is incomplete and the figure it produces is wrong
# for several comunidades. Madrid is NOT the only CCAA that publishes its own
# mínimo por descendientes for 2025. The AEAT Manual práctico de Renta 2025,
# parte 1, capítulo 14 ("Importes del mínimo personal y familiar aprobados por
# las comunidades autónomas para el cálculo del gravamen autonómico", pages
# 1087-1096) also publishes distinct tables for at least Andalucía
# (2.510/2.820/4.170/4.700 + 2.920 menor-3), Asturias
# (2.640/2.970/4.400/4.950 + 3.080), Canarias (2.424/2.727/.../4.545 + 2.828),
# Galicia (2.503/2.816/4.172/4.694 + 2.920), Illes Balears and Comunitat
# Valenciana. Only Castilla y León, Cataluña and La Rioja are recorded there as
# "igual que los mínimos estatales". Until those tables are encoded, casilla
# 0514 under-declares the autonómico mínimo for residents of the affected
# comunidades. Feeds casilla 0514 (autonómico).
[[revisions."2025".bindings]]
id = "renta-profile-minimo-descendientes-autonomico"
provider = { kind = "profile", profile_key = "renta_family.descendientes_minimos_aggregate_autonomico_2025" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61", "madrid-dl-1-2010:art-2"]
source_refs = ["aeat-dr-100-2025-dictionary", "aeat-renta-2025-manual-parte1"]

