# Art. 58 LIRPF mínimo por descendientes aggregate, parte estatal. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) ranks
# every Art. 58.1-eligible descendant by birth_date, sums the birth-order
# tranche (Art. 58.1: 2.400 / 2.700 / 4.000 / 4.500 €) plus the Art. 58.2
# menor-3 supplement (2.800 €), and applies the Art. 61.1ª custodia-compartida
# prorrata (0.5) per descendant, projecting the result onto the Decimal fact
# `renta_family.descendientes_minimos_aggregate_2025`. Feeds casilla 0513
# (estatal) only — casilla 0514 (autonómico) is fed by the sibling binding
# `renta-2025-profile-minimo-descendientes-autonomico`, which resolves each
# tranche against the filer's declared tax-residence CCAA (some comunidades,
# e.g. Madrid, publish their own divergent figures; Ley 22/2009 art. 46.1.a).
[[revisions."2025".bindings]]
id = "renta-profile-minimo-descendientes-estatal"
