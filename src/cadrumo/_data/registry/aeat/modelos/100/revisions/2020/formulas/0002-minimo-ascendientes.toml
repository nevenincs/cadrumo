[[revisions."2020".formulas]]
id = "renta-minimo-ascendientes-estatal"
target_casilla_id = "0515"
# Art. 59 LIRPF mínimo por ascendientes, parte estatal. The per-ascendant cuantía and
# its sharing are computed by the profile-binding aggregate; this formula projects that
# aggregate onto the casilla.
expression = { op = "copy", args = [
    { binding = "renta-profile-minimo-ascendientes-estatal" }
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-59", "ley-35-2006:art-61"]
source_refs = ["lirpf-cuota-chain-authority"]

[[revisions."2020".formulas.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["El mínimo por ascendientes será de 1.150 euros anuales"]
