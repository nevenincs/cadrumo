# Modelo 100 Art. 58.1 LIRPF rentas ceiling conditioning the mínimo por
# descendientes. A descendant holding rentas anuales (excluidas las exentas)
# above this figure generates no mínimo, so the ceiling is an eligibility
# threshold rather than an amount paid.
# Modelo 2025 LIRPF art. 23.1.a) carry-forward window for gastos de reparacion y
# conservacion.
#
# Existed only as a Python literal. It keys on the FILING PERIOD and modelo 100
# declares a revision for every supported year, so it is authorable here without
# the acquisition-year trap that blocks the LIVA bienes-de-inversion figures.
#
# The RIRPF grado-de-discapacidad threshold was authored alongside this and then
# WITHDRAWN: it cites RIRPF art. 72, which is not present in the legal catalogue,
# and the registry correctly refused it as an unknown legal id. Citing a
# catalogued-but-wrong article to make it pass would be worse than leaving the
# figure in Python, so it stays a Python constant until its provision is
# catalogued.

