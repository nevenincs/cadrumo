# Modelo 100 Art. 61 norma 4a LIRPF death-in-period flat minimo por descendientes.
# A descendant who dies during the periodo impositivo and generates the minimo
# takes THIS flat figure instead of the Art. 58.1 birth-order tranche that would
# otherwise correspond to their rank.
#
# This figure COINCIDES with the Art. 58.1 first-child tranche
# (renta-2022-minimo-descendientes-primer-hijo-2022) in every revision served
# today, and is deliberately NOT bound to it. They are legally distinct: the
# tranche is fixed by Art. 58.1 and moves with birth order, this one is fixed by
# Art. 61 norma 4a and applies at ANY birth order. Binding them would silently
# move the death amount if a future reform moved the first-child tranche, so the
# coincidence of values must never become a shared authority.
#
# The second required_text below pins the ordering limb rather than this
# parameter's value. It is carried here on purpose: Art. 61 norma 4a's statutory
# text fixes only the amount, while the AEAT manual's "Cuantias aplicables"
# section adds that the deceased is dropped from the age ordering that ranks the
# survivors. That limb has no other registry home, and omitting it over-grants
# every younger sibling by leaving them at a rank the deceased should have
# vacated. Citing it here makes the whole rule fail loudly if the manual passage
# this reading depends on ever moves.

[[revisions."2022".parameters]]
id = "renta-2022-minimo-descendientes-fallecimiento-2022"
data_type = "money"
unit = "EUR"
legal_refs = ["ley-35-2006:art-61", "ley-35-2006:art-61-norma-4"]
source_refs = ["aeat-renta-2022-manual-parte1"]

[[revisions."2022".parameters.source_citations]]
source_ref = "aeat-renta-2022-manual-parte1"
required_text = [
    "En caso de fallecimiento de un descendiente que genere derecho al mínimo por este concepto, la cuantía aplicable es de 2.400 euros",
    "sin computar a estos efectos aquellos descendientes que, en su caso, hubieran fallecido en el ejercicio con anterioridad a la fecha de devengo del impuesto",
]

[[revisions."2022".parameters.values]]
value = "2400"
date_axis = "filing_period"
valid_from = 2022-01-01
valid_to = 2022-12-31
