# Modelo 122 fichero BOE — envelope footer, and the layout's own grounding.
#
# Sheet "Pag. 0" row 15 declares an 18-position closing constant at position
# "***": "Constante. </T+ modelo+discriminante+Ejercicio+periodo+Tipo+>" with
# Contenido "</T1220EEEE0A0000>". Its position is not fixed -- it follows the
# variable-length file content -- so the design reader emits no coordinate for
# it and it is declared here as its own record, exactly as Modelo 390 declares
# the same <AUX> wrapper's footer. The tag interpolates the ejercicio, so it is
# `computed` rather than a literal.
#
# Like Modelo 390's footer, this record joins no design sheet: it declares no
# constant of its own for the coverage gate's constant-based join to match, and
# that is correct -- Pag. 0 describes the wrapper, not a separate footer record.

