# # Positions 93-96 ("Versión del Programa") and 101-109 ("NIF Empresa
# # Desarrollo") are DELIBERATELY NOT DECLARED, and this record therefore has a
# # hole at each. Both carry the design's Nota 1, "A cumplimentar por las
# # entidades desarrolladoras (EEDD)": they identify the software house that
# # produced the file and the version of its product. This project holds no EEDD
# # registration and no such identity exists to write, so any value would be
# # invented and a blank would assert an EEDD identity that is empty rather than
# # absent. Leaving them undeclared states honestly that this application cannot
# # write them, and the coverage gate correctly reports 41 of 43 rather than
# # reporting a completeness that does not exist. Modelo 131 sits permanently at
# # 143/145 on exactly these two campos, for exactly this reason.
