# Modelo 122 fichero BOE — envelope header (design sheet "Pag. 0"), 328 positions.
#
# Transcribed from the bundled AEAT Diseño de Registro aeat-dr-122-2016
# (corpus/aeat_official/disenos_registro/modelo_122/files/
# 01-122-ejercicio-2016-y-siguientes.xlsx, sha256
# 2b7c2bb3472cde1faba997f777aa88290e707a3773a3dc88348f74caeee0a4c7).
#
# Sheet "Pag. 0" declares 15 rows, of which 13 carry numeric coordinates and
# span positions 1-328 (2+3+1+4+2+5+5+70+4+4+9+213+6 = 328). All 13 are
# declared here. Row 14 is the variable-length "Contenido del fichero" slot the
# page records below occupy, and row 15 is the 18-byte closing constant
# "</T1220EEEE0A0000>" at position "***"; neither carries a fixed coordinate,
# so the design reader emits neither, and the closing tag is declared as this
# layout's envelope_footer record instead. Same <AUX> wrapper grammar as
# Modelo 390's envelope.

