# Modelo 122 Pág. 1 casillas.
#
# Transcribed position-by-position from the bundled AEAT Diseño de Registro
# aeat-dr-122-2016 (corpus/aeat_official/disenos_registro/modelo_122/files/
# 01-122-ejercicio-2016-y-siguientes.xlsx, sha256
# 2b7c2bb3472cde1faba997f777aa88290e707a3773a3dc88348f74caeee0a4c7), sheet
# "Pag. 1", whose declared TOTAL is 1000 posiciones.
#
# `form_number` carries the AEAT box number the design prints in brackets for
# that campo ([574], [548], …); `number` carries the campo's own inclusive
# position range, which is how the fichero addresses it.
#
# Substantive grounding is LIRPF art 81 bis, which establishes all five
# deducciones this modelo regularises: descendiente con discapacidad,
# ascendiente con discapacidad, familia numerosa, ascendiente separado
# legalmente con dos hijos, and cónyuge con discapacidad.
#
# Every casilla is input_kind = "manual". The abono anticipado figures come
# from AEAT's own advance-payment record and the deducción figures from the
# taxpayer's entitlement; this application holds neither, so no binding or
# formula can honestly populate them. See the note on resultado.a-ingresar
# below for why that box is manual too.

