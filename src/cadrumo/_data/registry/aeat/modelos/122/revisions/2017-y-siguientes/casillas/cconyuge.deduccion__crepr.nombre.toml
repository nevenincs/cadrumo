# input_kind is "manual" and NOT computed, deliberately. The design prints its
# own arithmetic for this box -- "(558-557+573-572+589-588+591-590)" -- and that
# expression omits the cónyuge pair [574]/[575] that the SAME design declares at
# positions 238 and 255. Transcribing it verbatim would ship a formula that
# silently under-declares for a cónyuge-con-discapacidad regularización;
# "correcting" it to add 575-574 would be fabricating regulatory arithmetic that
# no AEAT text states. Neither is authorable, so the box takes the operator's
# own figure and the discrepancy is recorded here rather than resolved.
[[revisions."2017-y-siguientes".casillas]]
id = "resultado.a-ingresar"
number = "616-632"
form_number = "595"
section = ["resultado"]
data_type = "money"
semantic_role = "m122_resultado_regularizacion_a_ingresar"
required = true
input_kind = "manual"
export_refs = ["modelo-122-p1-resultado-a-ingresar"]
legal_refs = ["ley-35-2006:art-81-bis", "orden-hfp-105-2017:art-5", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-122-2016", "enrolled-modelo-122-procedure"]
constraints = { sign = "non_negative", legal_refs = ["ley-35-2006:art-81-bis", "orden-hfp-105-2017:art-5", "ley-58-2003:art-93"], source_refs = ["aeat-dr-122-2016", "enrolled-modelo-122-procedure"] }

