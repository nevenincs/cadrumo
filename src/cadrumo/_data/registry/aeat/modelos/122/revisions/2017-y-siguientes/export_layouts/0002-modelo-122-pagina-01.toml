kind = "casilla"
casilla_id = "decl.pagina-complementaria"
# Design campo 5, "Indicador de página complementaria", admitting "C o blanco".
# Deliberately NOT the amendment_evidence.is_complementaria producer: that is a
# boolean and renders the canonical "X", which this slot does not admit. It is
# an operator-supplied clave with AEAT's own stated domain, so it is a casilla.
# The separate "Autoliquidación complementaria" flag at position 667 DOES admit
# "X" and is wired to that producer.
data_type = "text"
required = false
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hfp-105-2017:art-5", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-122-2016"]

[[revisions."2017-y-siguientes".export_layouts.records.fields]]
id = "modelo-122-p1-tipo-declaracion"
offset = 13
length = 1
kind = "literal"
# The sheet's Nota 1 states the whole admitted domain in one line: "El tipo de
# declaración para la presentación puede ser: I (ingreso)". Modelo 122 only
# ever repays advance payments unduly received, so "I" is the single value the
# design admits and the only one this producer can correctly write.
literal = "I"
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hfp-105-2017:art-5", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-122-2016"]

