length = 9
kind = "header"
# Section 1 of the design is the contribuyente no obligado a presentar
# declaración -- the taxpayer this filing is for, distinct from the
# representante in section 6. A NIF exactly fills its 9-byte slot, so left_zero
# would strip real leading digits from a low-numbered DNI on parse.
producer_key = "taxpayer.tax_id"
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hfp-105-2017:art-5", "ley-58-2003:art-93"]
