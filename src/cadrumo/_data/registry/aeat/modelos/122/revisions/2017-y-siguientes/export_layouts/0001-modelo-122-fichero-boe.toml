# Modelo 122 envelope header, transcribed from the bundled official Diseño de
# Registro (source "aeat-dr-122-2016",
# corpus/aeat_official/disenos_registro/modelo_122/files/01-122-ejercicio-2016-y-siguientes.xlsx,
# sheet "Pag. 0"). This modelo uses the generic AEAT "<T...><AUX>...</AUX>"
# declaration envelope (same shape as modelos 220/222), not the 100-199
# family's plain fixed-width declarante record. Position table (Posic./Lon):
# 1(2) constante "<T"; 3(3) modelo constante "122"; 6(1) discriminante
# constante "0"; 7(4) ejercicio de devengo; 11(2) periodo constante "0A" (this
# revision's period_selector carries only "0A"); 13(5) constante "0000>";
# 18(5) constante "<AUX>"; ...; 323(6) constante "</AUX>"; 329+ contenido
# variable de las páginas. Only the fixed, unambiguous envelope coordinates
# before the variable content are transcribed; the reserved/version/NIF-
# desarrollador positions (23-322) and the closing tag at the variable offset
# after content are not addressed by any casilla or producer fact this
# revision carries, and are left undeclared rather than fabricated.

