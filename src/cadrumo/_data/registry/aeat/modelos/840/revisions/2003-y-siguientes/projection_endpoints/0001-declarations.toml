# Revision-owned Modelo 840 projection endpoint authority for the DR840 Anexo.
# The Anexo ("Relación de locales") prints nine premises slots per sheet, each with
# the fourteen Apartado II fields, and closes each sheet with three partial sums. The
# record repeats once per sheet (repeat = "projection_rows"), so a premises row is
# addressed by its slot and the sheet by its render occurrence. Source: aeat-dr-840,
# Anexo campos 3-158.

