# Modelo 840 Apartado V -- local afecto indirectamente a la actividad, boxes [68]
# to [83]. Transcribed position-by-position from the bundled aeat-dr-840 design
# (Pag. 1, re-verified to tile 1..1132 exactly once with no gap and no overlap).
#
# Non-monotonic numbering again, and in a new place: [72] Provincia sits at @1018,
# [70] Municipio at @1020, then [71] C. Mun. at @1055 and [73] C. Prov. at @1061.
# Sorting by number would mis-assign four of these sixteen.
#
# RESERVADO BOXES ARE DECLARED, as in Apartado III: [71], [73] and [76] are filled
# by the administration rather than the filer, but AEAT numbers them and the
# coverage report derives them, so they are casillas with `required = false`. The
# UNNUMBERED Municipio description run at @1025+30 is a table expansion, carries no
# box number, is not derived, and is correctly not a casilla.
#
# [79] IS "Pto." AND ITS LABEL KEEPS THAT ABBREVIATION. The diseno never expands
# it, and it sits three boxes away from [82] "Pta." -- Puerta. In AEAT address
# blocks Pto. is ordinarily Portal, but "ordinarily" is not the standard for a
# filing-grade label, and guessing between Portal and Puerto would put an invented
# word in four locales. The label carries AEAT's own abbreviation until the
# expansion is confirmed from an official source.
#
# Every field is text: each is a fixed-width code or free text where a leading zero
# is significant. The whole apartado is optional -- a declaration with no
# indirectly-affected local leaves all sixteen blank.

