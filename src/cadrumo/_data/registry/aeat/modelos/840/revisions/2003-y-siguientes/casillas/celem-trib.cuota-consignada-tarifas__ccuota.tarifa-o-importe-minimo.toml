# Modelo 840 Pag. 2 -- Apartado VI (elementos tributarios) and Apartado VII (cuota),
# boxes [84] to [108]. Transcribed from the bundled aeat-dr-840 design; Pag. 2 tiles
# 1..1165 exactly once with no gap and no overlap.
#
# data_type COMES FROM THE DESIGN type_code, never from reading the label. Every
# Reservado box here is An (alfanumerico) and every taxpayer-supplied figure is Num;
# the Num ones carry no ent+dec hint in their descriptions, unlike the repeating A)
# rows which say 7ent + 2dec explicitly, so they are integer counts and surfaces
# rather than money. Calling [84] money because it is named Cuota would contradict
# the design, which types it An.
#
# ONLY 24 OF THE 110 FIELDS ON THIS RECORD ARE CASILLAS, and that is the shape of the
# record rather than an omission. The A) and B) blocks of Apartado VI are REPEATING
# GROUPS -- the same four fields (2Cod+30Descrip, Numero 7ent+2dec, Importe unitario,
# Cuota) restated for A) 1., A) 2., A) 3. and so on -- and AEAT prints no box number
# on any of them. They are repeating detail rows, the shape modelo 720 models with
# binding_record / repeat = binding_rows, not 86 flat casillas. Minting a byte-span
# number for each would model a repeating structure as fixed positions and invent a
# distinct concept per repetition.
#
# TWO NUMBERED BOXES ARE DELIBERATELY EXCLUDED, for the reason Apartado IV of Pag. 1
# is also unauthored: [86] labels TWO unrelated concepts -- B) Suma of maquinas
# recreativas at @672 and Cuota maquinas recreativas o autoventa at @1044 -- and
# [109] labels FIVE positions of one notification block (Lugar, Dia, Mes, Ano and the
# titular or representante capacity). Each collapses to ONE derived casilla, so
# declaring one casilla per number would make the coverage report read covered while
# five real positions stay unmodelled. They need the distinguishing convention that
# Apartado IV is waiting on.

