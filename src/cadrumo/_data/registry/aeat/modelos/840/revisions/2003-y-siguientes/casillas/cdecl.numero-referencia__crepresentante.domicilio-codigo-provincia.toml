# Modelo 840 Apartado II [16] and Apartado III -- representante, boxes [17] to [32].
# Transcribed position-by-position from the bundled aeat-dr-840 design (Pag. 1,
# which tiles 1..1132 exactly once with no gap and no overlap).
#
# As in Apartado I, AEAT numbers by the PRINTED FORM rather than byte order: [31]
# Provincia sits at @485 while [29] Municipio sits at @487, and [30] C. Mun. sits
# at @522 after both. The offsets below are therefore not monotonic in number.
#
# Every field here is `text`, including the postal, municipio and provincia codes
# and the telephone: each is a fixed-width code where a leading zero is
# significant, and an integer round-trip would silently drop it.
#
# RESERVADO BOXES ARE DECLARED, not skipped. [16] Numero de referencia, [21] C.
# Via, [30] C. Mun. and [32] C. Prov. are marked "Reservado" in the diseno -- the
# administration fills them, not the taxpayer -- but AEAT still assigns each a box
# number and the coverage report derives all four. Declaring them keeps the derived
# set honest; `required = false` records that the filer supplies nothing. This is
# the opposite treatment from the UNNUMBERED reserved run at @250+6 in Apartado I,
# which carries no box number and is correctly not a casilla.
#
# The whole apartado is optional: a declaration filed without a representante
# leaves every one of these blank, so none is `required`.

# @275+13. Numero de referencia. [16].  Reservado: cumplimentado por la Administracion.
[[revisions."2003-y-siguientes".casillas]]
id = "decl.numero-referencia"
number = "16"
section = ["declarante"]
data_type = "text"
semantic_role = "declaracion_numero_referencia"
required = false
input_kind = "informational"
legal_refs = ["orden-hac-2572-2003:apartado-1"]
source_refs = ["aeat-dr-840"]

