# Modelo 840 Apartado I -- datos identificativos del sujeto pasivo, transcribed
# position-by-position from the bundled aeat-dr-840 record design (Pag. 1, which
# tiles 1..1132 exactly once with no gap and no overlap).
#
# `number` carries AEAT's OWN bracket number as printed in the diseno ([1] .. [13]),
# not a minted byte span. AEAT numbers these by the printed form rather than by byte
# order -- [11] Provincia sits at @213 while [10] Municipio sits at @215 -- so the
# offsets below are deliberately not monotonic in number, and each number appears
# exactly once in this apartado.
#
# Codigo postal, numero, kilometro and the provincia/municipio codes are `text`,
# not integer: every one is a fixed-width code where a leading zero is significant,
# and an integer round-trip would silently drop it.
#
# NOT MODELLED HERE, and deliberately: the unnumbered "Municipio" description run at
# @220+30 and the "Reservado ... Cod. Mun." run at @250+6 are a table-expansion text
# and an administration-reserved slot, neither of which is a taxpayer-supplied box.
# Apartados II-V (declaracion, representante, datos de la actividad, local afecto)
# remain unauthored; this fragment covers Apartado I only.

