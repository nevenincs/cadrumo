id = "sujeto.nif"
number = "1"
section = ["declarante"]
data_type = "nif"
semantic_role = "sujeto_pasivo_nif"
required = true
input_kind = "informational"
legal_refs = ["orden-hac-2572-2003:apartado-1"]
source_refs = ["aeat-dr-840"]

