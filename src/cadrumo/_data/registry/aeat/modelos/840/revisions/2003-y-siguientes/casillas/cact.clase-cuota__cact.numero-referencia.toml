# Modelo 840 Pag. 1, Apartado IV -- datos de la actividad, boxes [33] to [67].
# Transcribed from the bundled aeat-dr-840 design; Pag. 1 tiles 1..1132 exactly
# once with no gap and no overlap.
#
# COLLAPSED BOX NUMBERS are modelled on the modelo 604 precedent: where several
# physical positions share one printed number, ONE casilla carries AEAT's number
# and each remaining position becomes its own casilla with a descriptive slug,
# because (segmento, number) is uniqueness-enforced. A slug-numbered casilla does
# not count toward diseno coverage, which is correct -- coverage measures AEAT's
# printed boxes, not casilla count.
#
# The shape differs per case and the treatment follows the shape:
#   [53], [54], [55] each head a TRIPLET of independently-set S-or-blank flags
#     (Agrupacion / Grupo / Epigrafe, 1a 2a 3a). Three casillas each. Collapsing
#     them to one would lose two independent facts per triplet.
#   [62] is ONE date split across three component fields, @810+2 dia, @812+2 mes
#     and @814+4 ano. One date casilla, not three integers: a composite component
#     is not a casilla of its own. Splitting it would invent three facts.
#   [63] labels TWO different causes -- Causa de la baja at @818 and Causa de la
#     variacion at @844. Two casillas.
#
# [56] DOES NOT EXIST in this diseno. The printed sequence runs [55], then two
# UNNUMBERED flags at @698 and @699 (campamento turistico, recepcion de loterias),
# then [57]. Those two are real taxpayer-supplied facts and are declared with
# slugs; a [56] is NOT invented for them even though the gap is exactly where one
# would fall.
#
# data_type COMES FROM THE DESIGN type_code (An / Num) with ONE refinement: a Num
# field whose value is a fixed-width CODE rather than a quantity stays `text`,
# because a leading zero is significant and an integer round-trip drops it. That
# covers the codigo postal [44], codigo de municipio [39], numero [46], telefono
# [52] and the 13-digit N. Ref [67]. The only true quantity here is [65], the ano
# de inicio, which is a `year`.
#
# NOT MODELLED, deliberately: the UNNUMBERED reserved C. Prov. at @533+2 and the
# Municipio description expansion at @588+30. Neither carries a box number, neither
# is derived, and both match the non-casilla classes already applied in Apartados
# I, III and V -- an administration-reserved slot and a table expansion.
#
# [48] IS "Pto." AND ITS LABEL KEEPS THAT ABBREVIATION, as [79] does in Apartado V.
# The diseno never expands it and it sits three boxes from [51] "Pta." (Puerta).

