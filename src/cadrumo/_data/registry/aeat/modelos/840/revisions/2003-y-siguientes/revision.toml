[revisions."2003-y-siguientes"]
# Applicability grade: the IAE alta, baja and variacion communication is administered
# municipally and is not a return this application emits; its sibling Modelo 848 already
# sits at this rung.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-hac-85-2003:art-1's legal.effective_from.
valid_from = 2003-01-01
period_selector = { year_from = 2003, periods = ["0A"] }
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-82",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
    "orden-hac-2572-2003:apartado-6",
]
orden_aplicabilidad = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]



[revisions."2003-y-siguientes".family_dispositions.formulas]
reason = "This is an informational declaration reporting third-party data to AEAT; it computes no taxpayer liability of its own, so the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
