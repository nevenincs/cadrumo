[revisions."2003-y-siguientes"]
# Applicability grade: the IAE alta, baja and variacion communication is administered
# municipally and is not a return this application emits; its sibling Modelo 848 already
# sits at this rung.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-hac-85-2003:art-1's legal.effective_from.
valid_from = 2003-01-01
period_selector = { year_from = 2003, periods = ["0A"] }
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-82",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
    "orden-hac-2572-2003:apartado-6",
]
orden_aplicabilidad = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the IAE alta/variacion/baja declaration, re-stamped \
after authoring Apartados I, II(16), III and V of Pag. 1 and boxes 84-108 of Pag. 2. \
DISCLOSURE -- self-review: the same agent authored all 70 new casillas, re-grounded the \
two pre-existing ones onto AEAT bracket numbers, and swept construct membership. VERIFIED \
-- COVERAGE 0 -> 72 of 108 derived casillas. The two original casillas had carried SLUG \
numbers, which match no design box and were the sole reason the report read zero; they now \
carry AEAT 14 (Ejercicio @270+4) and 15 (Declaracion de: @274+1). VERIFIED -- TILING \
re-checked before every transcription: Pag. 1 tiles 1..1132 and Pag. 2 tiles 1..1165, each \
exactly once, no gap, no overlap. VERIFIED -- CONSTRUCT MEMBERSHIP exact, 72 of 72 both \
directions. VERIFIED -- DATA TYPES COME FROM THE DESIGN type_code (An / Num), not from the \
label. Box 84 is named Cuota and reads like money; the design types it An because it is a \
Reservado box the administration fills as text. Across Pag. 2 the split is exact, and \
reading labels instead would have mis-typed nine of twenty-four. VERIFIED -- NON-MONOTONIC \
NUMBERING: AEAT numbers by printed form, not byte order. Nine fields are out of sequence \
(11@213 before 10@215; 31@485, 29@487, 30@522; 72@1018, 70@1020, 71@1055, 73@1061). \
Pairing numbers to offsets by sorting would mis-assign every one while the offsets still \
tiled. VERIFIED -- RESERVADO BOXES DECLARED where AEAT numbers them, required = false; the \
UNNUMBERED reserved runs at @250+6 and @1025+30 are not derived and are correctly not \
casillas. The discriminator is the bracket number, not the word Reservado. NOT CLAIMED -- \
36 OF 108 DERIVED CASILLAS REMAIN UNCOVERED, and they are NOT 36 units of transcription. \
They are: Apartado IV of Pag. 1; boxes 86 and 109 of Pag. 2; and the Anexo. NOT CLAIMED -- \
APARTADO IV, 86 AND 109 ARE BLOCKED ON A FALSE-GREEN RISK, not on effort. Five Apartado IV \
numbers label MULTIPLE physical positions (53, 54 and 55 each head a triplet of Agrupacion \
/ Grupo / Epigrafe 1o, 2o, 3o; 62 is a date split into dia/mes/ano; 63 labels both Causa \
de la baja and Causa de la variacion), 86 labels two unrelated concepts at @672 and @1044, \
and 109 labels five positions of one notification block. Each collapses to ONE derived \
casilla, so declaring one casilla per number would make the coverage report read covered \
while sixteen real positions stay unmodelled. That is worse than the gap because it is \
invisible. It needs a distinguishing convention chosen deliberately -- modelo 604 used \
slugs for its eight signo casillas, modelo 181 used byte spans. NOT CLAIMED -- THE ANEXO \
IS A REPEATING GROUP, not a flat casilla set: 165 fields carrying only 4 distinct box \
numbers, almost entirely one relacion-de-locales block restated with no number on any \
repetition. The same is true of most of Pag. 2, where only 24 of 110 fields are casillas. \
Those repetitions are the shape modelo 720 models with binding_record, and minting a \
byte-span number per repetition would model a repeating structure as fixed positions. NOT \
CLAIMED -- BOX 79 IS \"Pto.\" AND ITS LABEL KEEPS THAT ABBREVIATION; the diseno never \
expands it and it sits three boxes from 82 \"Pta.\" (Puerta). Expanding it needs an \
official source. NOT CLAIMED -- NO EXPORT LAYOUT: the application still cannot file this \
modelo, it stays on the filing-capability worklist, and model_law_authority_scope remains \
inspection_only. NOT CLAIMED -- the earlier review reasoning that this modelo is not a \
return this application emits is NOT relied on; the worklist gate docstring treats an \
individually-defensible withdrawal record as the historical defect. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- locales complete for \
all 72 labels across es/en/ca/hu, not audited for accuracy."""
reviewed_at = 2026-08-22

[revisions."2003-y-siguientes".family_dispositions.formulas]
reason = "The declarant reports its OWN actividad economica, declaring alta, variacion or baja in the matricula del IAE. The cuota is not self-assessed here: TRLRHL art. 90 puts the gestion tributaria of the impuesto with the matricula and the liquidation with the administration, so this form computes no liability and the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.deadline_windows]
reason = """\
Orden HAC/2572/2003 apartado sexto delegates the plazo in full: la presentacion de la \
declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, \
segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los \
articulos 5, 6 y 7 del Real Decreto 243/1995. Every plazo is therefore anchored to an \
EVENT -- the start, the variacion or the cese of the actividad -- rather than to the \
calendar, so no recurring calendar window exists to declare and none is fabricated. Real \
Decreto 243/1995 is not bundled in this corpus, so the concrete event-relative periods are \
cited by delegation through the bundled apartado rather than reproduced here; declaring \
windows would require inventing dates this registry cannot evidence."""
legal_refs = [
    "orden-hac-2572-2003:apartado-6",
]
source_refs = [
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2003-y-siguientes' of modelo 840 has no strictly-earlier sibling revision of this modelo (valid_from 2003-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity \
transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
