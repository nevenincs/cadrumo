[revisions."2003-y-siguientes"]
# Applicability grade: the IAE alta, baja and variacion communication is administered
# municipally and is not a return this application emits; its sibling Modelo 848 already
# sits at this rung.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-hac-85-2003:art-1's legal.effective_from.
valid_from = 2003-01-01
period_selector = { year_from = 2003, periods = ["0A"] }
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-82",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
    "orden-hac-2572-2003:apartado-6",
]
orden_aplicabilidad = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the IAE alta/variacion/baja declaration, re-stamped \
after authoring Apartados I, II[16] and III. DISCLOSURE -- self-review: the same agent \
authored all 30 new casillas, re-grounded the two pre-existing ones onto AEAT's bracket \
numbers, and swept construct membership. VERIFIED -- COVERAGE 0 -> 32 of 108 derived \
casillas. The two original casillas had carried SLUG numbers, which match no design box \
and were the sole reason the report read zero; they now carry AEAT's [14] Ejercicio @270+4 \
and [15] Declaracion de: @274+1, the same fix already applied to modelo 604. VERIFIED -- \
TILING re-checked before every transcription: Pag. 1 of aeat-dr-840 tiles 1..1132 exactly \
once, no gap, no overlap, 106 fields. VERIFIED -- CONSTRUCT MEMBERSHIP exact, 32 of 32 \
both directions. VERIFIED -- RESERVADO BOXES ARE DECLARED where AEAT numbers them ([16], \
[21], [30], [32]), required = false recording that the administration and not the filer \
supplies them; the UNNUMBERED reserved run at @250+6 is correctly NOT a casilla. The \
discriminator is the bracket number, not the word Reservado, settled by enumerating the \
derived set rather than reading labels. VERIFIED -- NON-MONOTONIC NUMBERING handled \
explicitly: AEAT numbers by printed form, so [11]@213 precedes [10]@215, and [31]@485, \
[29]@487, [30]@522 run out of order; sorting by number would have mis-assigned five \
fields. All code-like fields (postal, municipio, provincia, telefono, numero, kilometro) \
are text, never integer, because a leading zero is significant. NOT CLAIMED -- 76 OF 108 \
DERIVED CASILLAS REMAIN UNCOVERED: Apartados IV and V are unauthored, as are the Pag. 2 \
and Anexo records entirely. NOT CLAIMED -- A KNOWN BLIND SPOT GATES APARTADO IV: the \
derived set holds 108 DISTINCT numbers, but five of its numbers label MULTIPLE physical \
positions -- [53], [54] and [55] each head a triplet (Agrupacion / Grupo / Epigrafe 1o, \
2o, 3o), [62] is a date split into dia/mes/ano components, and [63] labels both Causa de \
la baja and Causa de la variacion. They collapse to one derived casilla each, so declaring \
one casilla per number would read as FULLY COVERED while eleven real positions stay \
unmodelled -- a false green, not a gap. Apartado IV must not be authored until that is \
resolved. NOT CLAIMED -- NO EXPORT LAYOUT: this application still cannot file the modelo, \
it stays on the filing-capability worklist, and model_law_authority_scope remains \
inspection_only. NOT CLAIMED -- the earlier review's reasoning that this modelo 'is not a \
return this application emits' is NOT relied on; the worklist gate's docstring treats an \
individually-defensible withdrawal record as the historical defect, not a justification. \
NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- \
locales complete for all 32 labels across es/en/ca/hu, not audited for accuracy."""
reviewed_at = 2026-08-22

[revisions."2003-y-siguientes".family_dispositions.formulas]
reason = "The declarant reports its OWN actividad economica, declaring alta, variacion or baja in the matricula del IAE. The cuota is not self-assessed here: TRLRHL art. 90 puts the gestion tributaria of the impuesto with the matricula and the liquidation with the administration, so this form computes no liability and the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.deadline_windows]
reason = """\
Orden HAC/2572/2003 apartado sexto delegates the plazo in full: la presentacion de la \
declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, \
segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los \
articulos 5, 6 y 7 del Real Decreto 243/1995. Every plazo is therefore anchored to an \
EVENT -- the start, the variacion or the cese of the actividad -- rather than to the \
calendar, so no recurring calendar window exists to declare and none is fabricated. Real \
Decreto 243/1995 is not bundled in this corpus, so the concrete event-relative periods are \
cited by delegation through the bundled apartado rather than reproduced here; declaring \
windows would require inventing dates this registry cannot evidence."""
legal_refs = [
    "orden-hac-2572-2003:apartado-6",
]
source_refs = [
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2003-y-siguientes' of modelo 840 has no strictly-earlier sibling revision of this modelo (valid_from 2003-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity \
transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
