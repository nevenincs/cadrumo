[revisions."2003-y-siguientes"]
# Applicability grade: the IAE alta, baja and variacion communication is administered
# municipally and is not a return this application emits; its sibling Modelo 848 already
# sits at this rung.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-hac-85-2003:art-1's legal.effective_from.
valid_from = 2003-01-01
period_selector = { year_from = 2003, periods = ["0A"] }
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-82",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
    "orden-hac-2572-2003:apartado-6",
]
orden_aplicabilidad = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the IAE alta/variacion/baja declaration, re-stamped \
after authoring Apartado I. DISCLOSURE -- self-review: the same agent authored the 13 \
Apartado I casillas, re-grounded the two pre-existing ones and swept the construct \
membership in the immediately preceding commits. VERIFIED -- COVERAGE MOVED 0 -> 15 of \
108. The two pre-existing casillas carried SLUG numbers, and a slug matches no design box, \
which is the whole reason the coverage report read zero; AEAT prints them as [14] at \
@270+4 (Ejercicio) and [15] at @274+1 (Declaracion de:), and they now carry those numbers. \
This is the same defect and the same fix already applied to modelo 604. VERIFIED -- TILING \
before any offset was trusted: Pag. 1 of aeat-dr-840 tiles 1..1132 exactly once, no gap \
and no overlap, 106 fields. Apartado I is transcribed position-by-position as boxes [1] to \
[13]. VERIFIED -- TWO AUTHORING HAZARDS, both recorded in the fragment: AEAT numbers by \
the PRINTED FORM not by byte order, so [11] Provincia sits at @213 while [10] Municipio \
sits at @215 and the offsets are deliberately non-monotonic in number -- sorting by number \
would have mis-assigned them; and codigo postal, numero, kilometro and the \
provincia/municipio codes are text rather than integer, because each is a fixed-width code \
where a leading zero is significant and an integer round-trip drops it silently. NOT \
CLAIMED -- 93 OF 108 DERIVED CASILLAS REMAIN UNCOVERED. Apartados II (declaracion), III \
(representante), IV (datos de la actividad) and V (local afecto indirectamente) are \
unauthored. Apartado IV additionally needs a distinguishing convention before it can be \
touched: five of its box numbers repeat across sibling positions -- [53], [54] and [55] \
each label a triplet (Agrupacion/Grupo/Epigrafe 1o, 2o, 3o), [62] is a date split into \
dia/mes/ano components, and [63] labels both Causa de la baja and Causa de la variacion -- \
and (segmento, number) is uniqueness-enforced, so they cannot each carry the printed \
number. NOT CLAIMED -- DELIBERATELY UNMODELLED: the unnumbered Municipio description run \
at @220+30 and the administration-reserved Cod. Mun. at @250+6 are a table expansion and a \
reserved slot, not taxpayer-supplied boxes. NOT CLAIMED -- NO EXPORT LAYOUT, so this \
application still cannot file the modelo and it stays on the filing-capability worklist; \
model_law_authority_scope remains inspection_only. A layout needs the remaining apartados \
first. NOT CLAIMED -- the earlier review's reasoning that this modelo 'is not a return \
this application emits' is NOT relied on here: the worklist gate's own docstring says an \
individually-defensible withdrawal record is the historical defect, not a justification. \
NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- the \
audited locales are complete for all 15 labels across es/en/ca/hu, but the strings were \
not audited for accuracy."""
reviewed_at = 2026-08-22

[revisions."2003-y-siguientes".family_dispositions.formulas]
reason = "The declarant reports its OWN actividad economica, declaring alta, variacion or baja in the matricula del IAE. The cuota is not self-assessed here: TRLRHL art. 90 puts the gestion tributaria of the impuesto with the matricula and the liquidation with the administration, so this form computes no liability and the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.deadline_windows]
reason = """\
Orden HAC/2572/2003 apartado sexto delegates the plazo in full: la presentacion de la \
declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, \
segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los \
articulos 5, 6 y 7 del Real Decreto 243/1995. Every plazo is therefore anchored to an \
EVENT -- the start, the variacion or the cese of the actividad -- rather than to the \
calendar, so no recurring calendar window exists to declare and none is fabricated. Real \
Decreto 243/1995 is not bundled in this corpus, so the concrete event-relative periods are \
cited by delegation through the bundled apartado rather than reproduced here; declaring \
windows would require inventing dates this registry cannot evidence."""
legal_refs = [
    "orden-hac-2572-2003:apartado-6",
]
source_refs = [
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2003-y-siguientes' of modelo 840 has no strictly-earlier sibling revision of this modelo (valid_from 2003-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity \
transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
