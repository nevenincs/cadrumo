[revisions."2003-y-siguientes".family_dispositions.verification_predicates]
reason = """\
A verification predicate guards a CALCULATED result, and this revision calculates none. \
family_dispositions.formulas records why: TRLRHL art. 90 leaves the liquidacion of the IAE with \
the administration working from the matricula, so this form carries census facts rather than an \
amount the engine derives. With no derived value there is no result for a predicate to guard, \
and a predicate over the declared census facts would assert a relationship the modelo does not \
establish."""
legal_refs = [
    "rdl-2-2004:art-78",
