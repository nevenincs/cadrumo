]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]
review_status = "agent_reviewed"
reviewed_by = "agent: applicability-grade review of the IAE alta/variacion/baja declaration. DISCLOSURE -- this review follows a change made in the SAME action: the revision carried no deadline_windows and no reasoned absence, which failed the \"when due\" half of the rung it declares, so family_dispositions.deadline_windows was authored here before reviewing. The reviewer and that author are the same agent; nothing else in the revision was altered. VERIFIED -- WHEN DUE: orden-hac-2572-2003 apartado sexto reads verbatim in the bundled corpus \"La presentacion de la declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los articulos 5, 6 y 7 del Real Decreto 243/1995\". Every plazo is anchored to an EVENT -- the start, variacion or cese of the actividad -- not to the calendar, so no recurring window exists to declare and none was fabricated; this matches the shape modelo 145 already uses for its own event-relative plazo. VERIFIED -- TO WHOM: apartado primero is the dedicated approving clause, \"Se aprueba el modelo 840, «Impuesto sobre Actividades Economicas», que figura en el anexo I de la presente Orden\", carrying NO year bound, so the open-ended 2003-y-siguientes claim does not outrun its orden. NOT CLAIMED -- Real Decreto 243/1995 is NOT bundled in this corpus. The concrete event-relative periods of its articles 5, 6 and 7 are cited by delegation through the bundled apartado and are NOT corpus-proven here; a reviewer wanting the actual periods must acquire the RD. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- no export layout is declared and the 108 fields the bundled diseno derives are not modelled; this revision carries 2 casillas and reaches scheduling and applicability only, which is what the applicability rung asserts. ADVISORY, not a defect: the classification audit raises informative_axis_divergence for calculation_class = informative against tax_domain = iae, and its own detail states the taxonomy label is a free choice carrying no invariant -- an informative declaration inside the IAE domain is a legitimate combination. KNOWN LIMIT NOT FIXED HERE -- the family_dispositions.formulas reason on this revision describes it as \"an informational declaration reporting third-party data to AEAT\", which contradicts this file's own header (\"administered municipally and is not a return this application emits\") and misstates the modelo: the IAE declaration reports the taxpayer's OWN actividad. The conclusion that no formula family applies is correct; the stated reason is not, and the same sentence sits verbatim on eight other revisions. NOT CLAIMED -- all 3 locales are complete for the 2 labels, but the strings were not audited for accuracy."
reviewed_at = 2026-08-21

