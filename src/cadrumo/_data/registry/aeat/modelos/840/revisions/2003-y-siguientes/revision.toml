[revisions."2003-y-siguientes".family_dispositions.parameters]
reason = """\
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, \
a coefficient. This revision applies none, because it declares no formula at all: its \
family_dispositions.formulas records that the IAE cuota is not self-assessed here, TRLRHL art. \
90 placing the gestion with the matricula and the liquidacion with the administration. The \
tarifas and cuotas of the impuesto are real regulatory values, but they are applied by the \
administration liquidating from the matricula, never by a formula of this revision, so there is \
nothing here for a parameter to feed."""
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
]

[revisions."2003-y-siguientes".family_dispositions.dependency_classifications]
reason = """\
A dependency classification declares which OTHER modelo's filing a value here derives from, and \
modelo 840 derives from none. It declares the taxpayer's own alta, variacion or baja in the \
matricula del IAE -- facts about the declarant's actividad economica, held by the declarant and \
reported directly. No value on this form is folded in from another return, and its plazos are \
anchored to the event rather than to a prior period's filing (Orden HAC/2572/2003 apartado \
sexto, by remission to RD 243/1995 arts. 5, 6 and 7), so there is no cross-period source for the \
family to classify."""
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
]

[revisions."2003-y-siguientes".family_dispositions.verification_expectations]
reason = """\
A verification expectation reconciles a FILED return against this application's engine, and \
neither side of that reconciliation exists here. This application does not emit the modelo -- \
the revision header records that the IAE alta, baja and variacion communication is administered \
municipally -- and the engine computes no value for it, since family_dispositions.formulas \
already establishes that no formula applies. An expectation authored here would compare nothing \
against nothing."""
legal_refs = [
