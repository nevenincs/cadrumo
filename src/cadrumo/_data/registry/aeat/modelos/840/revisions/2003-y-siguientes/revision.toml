[revisions."2003-y-siguientes"]
# Applicability grade: the IAE alta, baja and variacion communication is administered
# municipally and is not a return this application emits; its sibling Modelo 848 already
# sits at this rung.
authority_grade = "applicability"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from), not the orden's own effective date -- that fact
# already has its home on orden-hac-85-2003:art-1's legal.effective_from.
valid_from = 2003-01-01
period_selector = { year_from = 2003, periods = ["0A"] }
legal_refs = [
    "rdl-2-2004:art-78",
    "rdl-2-2004:art-82",
    "rdl-2-2004:art-90",
    "orden-hac-2572-2003:apartado-1",
    "orden-hac-2572-2003:apartado-6",
]
orden_aplicabilidad = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the IAE alta/variacion/baja declaration. DISCLOSURE \
-- this review follows a change made in the SAME action: the revision carried no \
deadline_windows and no reasoned absence, which failed the "when due" half of the rung it \
declares, so family_dispositions.deadline_windows was authored here before reviewing. The \
reviewer and that author are the same agent; nothing else in the revision was altered. \
VERIFIED -- WHEN DUE: orden-hac-2572-2003 apartado sexto reads verbatim in the bundled \
corpus "La presentacion de la declaracion del Impuesto sobre Actividades Economicas, \
modelo 840, debera realizarse, segun se trate de declaraciones de alta, variacion o baja, \
en los plazos regulados en los articulos 5, 6 y 7 del Real Decreto 243/1995". Every plazo \
is anchored to an EVENT -- the start, variacion or cese of the actividad -- not to the \
calendar, so no recurring window exists to declare and none was fabricated; this matches \
the shape modelo 145 already uses for its own event-relative plazo. VERIFIED -- TO WHOM: \
apartado primero is the dedicated approving clause, "Se aprueba el modelo 840, «Impuesto \
sobre Actividades Economicas», que figura en el anexo I de la presente Orden", carrying NO \
year bound, so the open-ended 2003-y-siguientes claim does not outrun its orden. NOT \
CLAIMED -- Real Decreto 243/1995 is NOT bundled in this corpus. The concrete \
event-relative periods of its articles 5, 6 and 7 are cited by delegation through the \
bundled apartado and are NOT corpus-proven here; a reviewer wanting the actual periods \
must acquire the RD. NOT CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero. \
NOT CLAIMED -- no export layout is declared and the 108 fields the bundled diseno derives \
are not modelled; this revision carries 2 casillas and reaches scheduling and \
applicability only, which is what the applicability rung asserts. ADVISORY, not a defect: \
the classification audit raises informative_axis_divergence for calculation_class = \
informative against tax_domain = iae, and its own detail states the taxonomy label is a \
free choice carrying no invariant -- an informative declaration inside the IAE domain is a \
legitimate combination. CORRECTED SINCE -- the family_dispositions.formulas \
reason on this revision described it as "an informational declaration reporting \
third-party data to AEAT", which contradicts this file's own header ("administered \
municipally and is not a return this application emits") and misstates the modelo: the IAE \
declaration reports the taxpayer's OWN actividad. The conclusion that no formula family \
applies was correct and is unchanged; the reason now cites TRLRHL art. 90, which puts the \
liquidation with the administration. The same sentence sat verbatim on nine other revisions and was checked against each modelo's official name: it stays on 189, 280, 345 and 347, where the declarant reports OTHER people's data, and was corrected on 145, 232 and 720, which like this one report the declarant's own facts. NOT CLAIMED -- all 3 locales are complete for the 2 labels, but the \
strings were not audited for accuracy."""
reviewed_at = 2026-08-21

[revisions."2003-y-siguientes".family_dispositions.formulas]
reason = "The declarant reports its OWN actividad economica, declaring alta, variacion or baja in the matricula del IAE. The cuota is not self-assessed here: TRLRHL art. 90 puts the gestion tributaria of the impuesto with the matricula and the liquidation with the administration, so this form computes no liability and the formula family is inapplicable by this modelo's nature rather than merely absent."
legal_refs = [
    "orden-hac-2572-2003:apartado-1",
]
source_refs = [
    "aeat-dr-840",
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

[revisions."2003-y-siguientes".family_dispositions.deadline_windows]
reason = """\
Orden HAC/2572/2003 apartado sexto delegates the plazo in full: la presentacion de la \
declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, \
segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los \
articulos 5, 6 y 7 del Real Decreto 243/1995. Every plazo is therefore anchored to an \
EVENT -- the start, the variacion or the cese of the actividad -- rather than to the \
calendar, so no recurring calendar window exists to declare and none is fabricated. Real \
Decreto 243/1995 is not bundled in this corpus, so the concrete event-relative periods are \
cited by delegation through the bundled apartado rather than reproduced here; declaring \
windows would require inventing dates this registry cannot evidence."""
legal_refs = [
    "orden-hac-2572-2003:apartado-6",
]
source_refs = [
    "aeat-modelo-840-procedure",
    "boe-modelo-840-2003-form",
]

