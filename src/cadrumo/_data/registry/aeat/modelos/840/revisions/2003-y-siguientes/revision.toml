[revisions."2003-y-siguientes".family_dispositions.deadline_windows]
reason = "Orden HAC/2572/2003 apartado sexto delegates the plazo in full: la presentacion de la declaracion del Impuesto sobre Actividades Economicas, modelo 840, debera realizarse, segun se trate de declaraciones de alta, variacion o baja, en los plazos regulados en los articulos 5, 6 y 7 del Real Decreto 243/1995. Every plazo is therefore anchored to an EVENT -- the start, the variacion or the cese of the actividad -- rather than to the calendar, so no recurring calendar window exists to declare and none is fabricated. Real Decreto 243/1995 is not bundled in this corpus, so the concrete event-relative periods are cited by delegation through the bundled apartado rather than reproduced here; declaring windows would require inventing dates this registry cannot evidence."
