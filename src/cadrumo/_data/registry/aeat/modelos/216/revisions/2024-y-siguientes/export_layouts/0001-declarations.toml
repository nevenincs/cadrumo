# Design row 15 of Pág. 0: the constant that closes the <T…> file envelope,
# 18 positions, "</T2160AAAAPP0000>" — modelo, discriminante, ejercicio de
# devengo, periodo and tipo, in that order. Its position is given as "***"
# because it follows the variable-length file content, so it is authored as its
# own terminator record rather than at a fixed offset inside Pág. 0.
#
# It is `computed` rather than `literal` because two of its eighteen bytes are
# the ejercicio and two more the periodo: the renderer's envelope_closing_tag
# builds exactly "</T{modelo}0{year}{period}0000>" from the draft, which is the
# same 18-byte grammar this design states.

