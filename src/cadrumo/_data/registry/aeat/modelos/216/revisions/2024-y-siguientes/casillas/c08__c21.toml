# Modelo 216 record design — money closure grounded in the AEAT instructions
# (aeat-modelo-216-procedure) and the Orden HAC/56/2024 form layout
# (boe-modelo-216-form-layout). Block I, rentas SOMETIDAS a retención o ingreso
# a cuenta: base (08/09) and retenciones (11/12) each broken down into
# dividendos y otras rentas de participación en fondos propios de entidades and
# resto de rentas, their totals (10/13), prior-declaration results (20), and the
# resultado a ingresar (21).
#
# The breakdown axis is dividendos-vs-resto, NOT dinerarias-vs-especie. Orden
# HAC/56/2024 replaced the Orden EHA/3290/2008 breakdown: "En el modelo 216
# [...] también se realiza un desglose del importe total de retenciones e
# ingresos a cuenta en el correspondiente a dividendos y otras rentas de
# participación en fondos propios de entidades y el correspondiente a otras
# rentas." The bundled diseño `aeat-dr-216-2024` names each box the same way,
# and the word "dinerarias" does not occur anywhere in the establishing orden.

