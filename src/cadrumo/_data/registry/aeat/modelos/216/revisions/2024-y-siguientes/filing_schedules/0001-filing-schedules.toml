# This revision's period_selector declares ONLY the four quarterly periods, so
# the quarterly schedule is the whole of what it can express. The AEAT
# instructions bundled for this revision do describe a monthly regime for grandes
# empresas ("Si se trata de declaracion mensual (grandes empresas): 01: enero
# ..."), and it is deliberately NOT declared here: authoring a monthly schedule
# against a selector that admits no monthly period would assert a filing this
# revision cannot resolve. Modelling that regime is a revision-scope change, not
# a schedule fragment.
[[revisions."2024-y-siguientes".filing_schedules]]
id = "modelo-216-trimestral"
period_kind = "quarterly"
periods = ["1T", "2T", "3T", "4T"]
profile_condition_mode = "all"
legal_refs = ["orden-eha-3290-2008:art-4", "orden-hac-56-2024:art-1", "trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-216-procedure", "boe-modelo-216-form-layout"]

[[revisions."2024-y-siguientes".filing_schedules.profile_conditions]]
field = "enrollment.large_company"
op = "equals"
value = false
explanation = "Modelo 216 trimestral para retenedores no sujetos a autoliquidacion mensual por gran empresa; el plazo es de los veinte primeros dias naturales de abril, julio, octubre y enero."
legal_refs = ["orden-eha-3290-2008:art-4"]
source_refs = ["aeat-modelo-216-procedure"]
