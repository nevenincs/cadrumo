# Modelo 216 trimestral deadline windows, grounded in Orden EHA/3290/2008 art 4:
# "la presentación del modelo 216 ... se efectuará en los veinte primeros días
# naturales de los meses de abril, julio, octubre y enero" por el trimestre
# natural inmediato anterior. Closes on the 20th natural day of the month
# following each natural quarter. The monthly grandes-empresas modality of
# art 4 is out of this revision's scope.

