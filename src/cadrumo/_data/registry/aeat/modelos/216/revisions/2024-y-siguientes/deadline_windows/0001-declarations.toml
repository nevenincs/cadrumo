# The monthly gran-empresa cadence of Orden EHA/3290/2008 art. 4, paragraph
# two, which the 2024 form redesign did not touch: the gran-empresa retenedor
# declares "en los veinte primeros dias naturales de cada mes, en relacion con
# las cantidades retenidas y los ingresos a cuenta efectuados que correspondan
# por el mes inmediato anterior". The condition it turns on is the volumen de
# operaciones of RIVA art. 71.3 numbers 1 and 2 that
# enrollment.large_company carries.
#
# Each close and domiciliacion cutoff is READ from the bundled Calendario del
# Contribuyente of the year it falls in, never derived from the twenty-day
# rule, and was cross-checked against Modelo 111's own authored window for the
# same published monthly entry, which names both modelos. The 2020-2023 edition
# of these windows carries the full grounding note, including the art. 4 July
# exception the bundled calendars do not reproduce.
#
# The December period of the horizon year closes in a January no bundled
# calendar covers. That one close is the statutory twentieth day, authored only
# because it is already a working day and needs no calendar to shift it, and it
# authors no cutoff -- the same choice the 2026 fourth-quarter window makes.
