# The monthly gran-empresa cadence of Orden EHA/3290/2008 art. 4, paragraph
# two: "No obstante, la declaracion e ingreso a que se refiere el parrafo
# anterior se efectuara en los veinte primeros dias naturales de cada mes, en
# relacion con las cantidades retenidas y los ingresos a cuenta efectuados que
# correspondan por el mes inmediato anterior, cuando se trate de retenedores u
# obligados que tengan la consideracion de grandes empresas por concurrir
# alguna de las circunstancias a que se refieren los numeros 1 y 2 del apartado
# 3 del articulo 71 del Reglamento del Impuesto sobre el Valor Anadido" -- the
# volumen de operaciones that enrollment.large_company carries. The article
# grounds this cadence on RIRNR art. 15.1.
#
# Each close and domiciliacion cutoff below is READ from the bundled Calendario
# del Contribuyente of the year it falls in, never derived from the twenty-day
# rule: the published day moves for weekends and holidays, and a filing
# deadline written from the rule rather than the calendar is a filing-grade
# harm. The calendar names this modelo in the monthly population every month --
# "<mes> <ejercicio>. Grandes empresas: 111, 115, 117, 123, 124, 126, 128, 216,
# 230" -- under its own "Hasta el <dia> de <mes>" heading, which is the close
# taken here. Because that one published entry covers Modelo 111 too, every
# close and cutoff was cross-checked against 111's own authored window for the
# same entry; all fifty-nine calendar-grounded windows of both editions agree
# with no mismatch.
#
# The July period closes in August, as the calendar publishes it for this whole
# population. The bundled art. 4 excerpt is the 2008 published text and carries
# a further exception moving the July declaration to "el mes de agosto y los
# veinte primeros dias naturales del mes de septiembre"; no bundled calendar
# from 2022 to 2026 reproduces that extension for this population, so the
# calendar is followed and the divergence is left to re-grounding rather than
# settled here.
[[revisions."2020-2023".deadline_windows]]
id = "modelo-216-2022-01"
filing_year = 2022
period = "2022 01"
period_kind = "monthly"
opens_on = 2022-02-01
closes_on = 2022-02-21
payment_cutoff_on = 2022-02-16
legal_refs = ["orden-eha-3290-2008:art-4"]
source_refs = ["aeat-calendario-contribuyente-2022"]

