# prints the liquidacion as seven partidas without box numbers; the 2024
# redesign that 2024-y-siguientes renders refuses a devengo year before 2024,
# so it cannot answer these years. This edition states only what the design
# prints. On 2026-10-05 the original BOE-A-2008-18497 PDF was acquired:
# annex I, PDF page 11, grounds the authored liquidation grid and printed
# numbers 01-07. The review below records the earlier evidence state.
# On 2026-10-05 the historical export was generated and validated, and exact
# identity, period, payment and amendment fields were added to the form.
# Annex I explicitly supplies 07 = 03 - 06. Calculation support is limited to
# that equation over supplied amounts, with no upstream withholding-rate or
# ledger binding claim. The historical review below is retained as recorded.
