# The three "Totales" rows the bundled diseño `aeat-dr-216-2024` adds beside
# the already-declared base and retenciones totals. Each is the sum of the two
# rows AEAT prints directly above it in the same block, exactly as
# `modelo-216-base-total` ([10] = [08] + [09]) and
# `modelo-216-retenciones-total` ([13] = [11] + [12]) already model that shape:
#
#   [07] = [05] + [06]   número de rentas, block I (sometidas)
#   [16] = [14] + [15]   número de rentas, block II (no sometidas)
#   [19] = [17] + [18]   base, block II (no sometidas)

[[revisions."2024-y-siguientes".formulas]]
