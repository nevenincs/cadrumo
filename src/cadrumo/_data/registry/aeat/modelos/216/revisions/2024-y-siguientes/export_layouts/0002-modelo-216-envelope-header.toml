# EEDD slots, deliberately UNWRITTEN: @93+4 "Version del Programa (**)" and
# @101+9 "NIF Empresa Desarrollo (**)". AEAT's note (**) on this design reads
# "A cumplimentar por las entidades desarrolladoras (EEDD)". Both carry the
# software house's own identity -- the version of the SW and the NIF of the ED --
# not the filer's and not the presenter's, and this project declares no
# entidad-desarrolladora identity anywhere.
#
# These two were previously authored as fillers with that reasoning already
# correct, including an explicit refusal to map @101+9 to presenter.tax_id. Only
# the SHAPE changes here: the record renderer pre-fills every record with spaces
# before writing fields, so a right_space filler and an omitted span emit
# byte-identical output -- the blank rendering the earlier note intended is
# preserved exactly. What the filler additionally did was make the coverage gate
# count both positions as WRITTEN, which is coverage no datum earned. Leaving
# them unwritten reports the gap instead, and matches Modelos 111/115/117/122/
# 123/126/128/130/131/341/714 and now 390.

[[revisions."2024-y-siguientes".export_layouts.records.fields]]
id = "modelo-216-envelope-reserved-2"
offset = 97
length = 4
