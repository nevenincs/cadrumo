id = "modelo-216-envelope-program-version"
offset = 93
length = 4
kind = "filler"
# AEAT note (**): "A cumplimentar por las entidades desarrolladoras
# (EEDD)". This slot carries the identifier of the SOFTWARE version, supplied
# by the software house, not by the filer, and the application declares no
# developer identity anywhere. It renders blank, exactly as it does on a filing
# produced by software whose developer is unregistered.
