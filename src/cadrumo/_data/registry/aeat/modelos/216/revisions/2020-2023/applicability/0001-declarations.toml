[[revisions."2020-2023".applicability]]
# TRLIRNR art. 31 binds the payer of income subject to IRNR to withhold, and its apartado 5
# to declare and pay what was withheld. That is payment to NON-residents: an employer or a
# payer of professional fees to residents withholds IRPF (Modelo 111), not IRNR, so the
# resident withholding facts cannot open this modelo.
id = "m216-seed"
applicable_entity_types = ["attribution_entity", "legal_entity", "natural_person"]
required_payer_fact = "pays_non_resident_income_with_retencion"
applicable_reason = "Modelo 216 (IRNR, retenciones e ingresos a cuenta): el declarante satisface rentas sujetas al Impuesto sobre la Renta de no Residentes obtenidas sin establecimiento permanente y autoliquida las retenciones e ingresos a cuenta practicados sobre ellas."
not_applicable_reason = "Modelo 216 no aplica: la autoliquidacion de retenciones del IRNR solo corresponde a quien satisface rentas a contribuyentes sin establecimiento permanente sujetas a retencion o ingreso a cuenta."
cuota_bearing = true
legal_refs = ["trlirnr-rdleg-5-2004:art-31", "trlirnr-rdleg-5-2004:art-24", "orden-eha-3290-2008:art-1"]
