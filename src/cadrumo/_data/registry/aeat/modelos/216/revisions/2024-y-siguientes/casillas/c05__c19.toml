# Modelo 216 record-design closure, transcribed from the bundled diseño de
# registro `aeat-dr-216-2024` (Pág. 1). Orden HAC/56/2024 restructured this
# modelo's liquidación into two blocks, each broken down by dividendos vs
# resto de rentas, and each carrying a rentas count beside its base:
#
#   I  Rentas SOMETIDAS a retención o ingreso a cuenta
#        número de rentas [05][06][07], base [08][09][10], retenciones [11][12][13]
#   II Rentas NO SOMETIDAS a retención o ingreso a cuenta
#        número de rentas [14][15][16], base [17][18][19]
#
# The bases and retenciones of block I ([08]-[13]) and the resultado rows
# ([20][21]) were already declared; this fragment adds the nine boxes the
# official record requires and the prior declaration did not carry — the six
# rentas counts and block II's three bases.
#
# The desglose is the orden's own: "En el modelo 216 [...] también se realiza
# un desglose del importe total de retenciones e ingresos a cuenta en el
# correspondiente a dividendos y otras rentas de participación en fondos
# propios de entidades y el correspondiente a otras rentas."

