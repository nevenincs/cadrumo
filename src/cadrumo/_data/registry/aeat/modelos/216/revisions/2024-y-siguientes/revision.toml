[revisions."2024-y-siguientes"]
# This edition declares an explicit root rather than omitting the predecessor
# key, so that an edition for the 2020-2023 era can be authored ahead of it
# without two editions of modelo 216 omitting the key at once, which the
# predecessor-forest rule refuses. The declaration is inert while this is the
# only edition and load-bearing the moment an earlier one lands.
predecessor = { none = { cause = "official_structure_differs", reason = "The 2024 form is a redesign, not a revision of the 2020-2023 form: aeat-dr-216-2020-2023 prints seven unnumbered partidas over a flat liquidacion with no section structure, while aeat-dr-216-2024 prints numbered boxes [01] to [21] in two sections (I rentas sometidas a retencion, II rentas no sometidas), each split dividendos / resto de rentas / totales. This edition's seventeen casillas are ids '05' to '21', which are 2024 box numbers and do not exist on the earlier form. The 2024 design refuses the earlier years in its own validation: its devengo-ejercicio field [01] is declared obligatorio with >= 2024. No merge from the earlier edition produces this one, so no predecessor is declared. The payload is stored against the 2020-2023 edition through family_storage_baseline: the shared applicability seed, filing schedule and filing and deadline links are inherited with overrides for their differences. No casilla is shared, so no casilla baseline is declared. Storage reuse makes no continuity claim.", legal_refs = ["orden-eha-3290-2008:art-1"], source_refs = ["aeat-dr-216-2024"] } }
# Storage reuse only, not legal continuity: keyed families are stored as
# differences from the 2020-2023 edition's effective members.
family_storage_baseline = "2020-2023"
formula_source_refs = ["aeat-modelo-216-procedure", "boe-modelo-216-form-layout"]
casilla_source_refs = ["boe-modelo-216-form-layout"]
application_link_source_refs = ["aeat-modelo-216-procedure"]
# Prepared and reviewed by an agent against the bundled diseño de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement:
#   - every casilla legal_ref and source_ref resolves to the legal catalogue, and
#     every cited source's corpus file is present on disk;
#   - every formula targets a casilla of this revision;
#   - every enrolled schema family resolves;
#   - every cited source's applicability window overlaps this revision's own life;
#   - and all 1 fixed-width record(s) of the DERIVED layout were paired to
#     their design sheet and cover it: no design DATA position is left
#     unaddressed, and none reaches past its declared record length.
#
# The coverage figure is measured on the layout AFTER binding derivation, which
# is what the renderer and the completeness gate consume; the raw export_layouts
# collection holds only inline fields and reading it understates coverage badly.
#
# This stamp claims no fresh-render reproduction evidence: that belongs to the
# revisions enrolled in the generated-tree drift gate, and this one is not.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
authority_grade = "filing"
# Modelo 216 IRNR retención autoliquidación. The current form layout is approved
# by Orden HAC/56/2024 (BOE-A-2024-1772); the binding filing plazo persists from
# Orden EHA/3290/2008 art 4 (trimestral: first 20 natural days of April, July,
# October, January). valid_to is open: the withholding surface has no annual
# coefficient table, so a new revision is authored only on a statutory or
# form-structure change.
