[revisions."2024-y-siguientes"]
authority_grade = "filing"
# Modelo 216 IRNR retención autoliquidación. The current form layout is approved
# by Orden HAC/56/2024 (BOE-A-2024-1772); the binding filing plazo persists from
# Orden EHA/3290/2008 art 4 (trimestral: first 20 natural days of April, July,
# October, January). valid_to is open: the withholding surface has no annual
# coefficient table, so a new revision is authored only on a statutory or
# form-structure change.
valid_from = 2024-01-01
period_selector = { year_from = 2024, periods = ["1T", "2T", "3T", "4T"] }
orden_aplicabilidad = ["orden-hac-56-2024:art-1"]
legal_refs = [
    "orden-hac-56-2024:art-1",
    "orden-eha-3290-2008:art-1",
    "orden-eha-3290-2008:art-4",
    "trlirnr-rdleg-5-2004:art-24",
]
source_refs = ["aeat-modelo-216-procedure", "boe-modelo-216-form-layout", "aeat-dr-216-2024"]


[revisions."2024-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2024-y-siguientes' of modelo 216 has no strictly-earlier sibling revision of this modelo (valid_from 2024-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-hac-56-2024:art-1",
    "orden-eha-3290-2008:art-1",
    "orden-eha-3290-2008:art-4",
    "trlirnr-rdleg-5-2004:art-24",
]
source_refs = [
    "aeat-modelo-216-procedure",
    "boe-modelo-216-form-layout",
    "aeat-dr-216-2024",
]

[revisions."2024-y-siguientes".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-216-2024-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "orden-hac-56-2024:art-1",
    "orden-eha-3290-2008:art-1",
    "orden-eha-3290-2008:art-4",
    "trlirnr-rdleg-5-2004:art-24",
]
source_refs = [
    "aeat-modelo-216-procedure",
    "boe-modelo-216-form-layout",
    "aeat-dr-216-2024",
]
