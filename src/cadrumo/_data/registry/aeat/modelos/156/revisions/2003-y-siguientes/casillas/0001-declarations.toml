# Modelo 156 -- the official record-design positions. Transcribed from the
# bundled ANEXO II of Orden HAC/3580/2003 (source enrolled-modelo-156-layout,
# corpus/aeat_official/disenos_registro/modelo_156/files/
# 01-156-diseno-de-registro-vigente.pdf, sha256
# d387cfeb7254e49d539d5c3a731c0bd6bf275c8c1fdae80e6faa5a1006d5d068).
#
# Every casilla carries its canonical m156_<id> semantic_role, including the
# twelve monthly cotizacion roles, which the typo-twin gate's calendar-month
# axis recognises as deliberate siblings rather than misspellings.

# Campo 5. Positions 18-57, alfanumerico. "Se consignara la razon social
# completa, sin anagrama."
[[revisions."2003-y-siguientes".casillas]]
id = "declarante-razon-social"
number = "tipo1.18-57"
section = ["declarante"]
data_type = "name"
semantic_role = "m156_declarante_razon_social"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 7. Positions 59-107, alfanumerico de 49 posiciones. The design
# subdivides the slot (59-67 TELEFONO, 68-107 APELLIDOS Y NOMBRE) but declares
# ONE top-level campo of 49 bytes, which is the extent declared here.
[[revisions."2003-y-siguientes".casillas]]
id = "persona-relacion"
number = "tipo1.59-107"
section = ["declarante"]
data_type = "text"
semantic_role = "m156_persona_relacion"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 8. Positions 108-120, numerico de 13 posiciones. "El numero de
# justificante correspondiente a la declaracion."
[[revisions."2003-y-siguientes".casillas]]
id = "numero-justificante"
number = "tipo1.108-120"
section = ["declarante"]
data_type = "integer"
semantic_role = "m156_numero_justificante"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 9. Positions 121-122, alfabetico: 121 declaracion complementaria ("C"),
# 122 declaracion sustitutiva ("S").
[[revisions."2003-y-siguientes".casillas]]
id = "declaracion-complementaria-sustitutiva"
number = "tipo1.121-122"
section = ["declarante"]
data_type = "text"
semantic_role = "m156_declaracion_complementaria_sustitutiva"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "One combined 'Declaracion complementaria / sustitutiva' box on this informativa; the role is modelo-scoped, so no sibling casilla can carry it. Modelo 190 records the same decision for its own complementaria and sustitutiva boxes."
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 10. Positions 123-135, numerico de 13 posiciones. Carries content only
# when campo 9 declares "C" or "S"; "en cualquier otro caso debera rellenarse a
# CEROS".
constraints = { enum = ["C ", " S", "  "], legal_refs = ["orden-hac-3580-2003:art-1"], source_refs = ["enrolled-modelo-156-layout", "boe-modelo-156-form-layout"] }

[[revisions."2003-y-siguientes".casillas]]
id = "numero-identificativo-anterior"
number = "tipo1.123-135"
section = ["declarante"]
data_type = "integer"
semantic_role = "m156_numero_identificativo_anterior"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 11. Positions 136-144, numerico de 9 posiciones. "El numero total de
# afiliados o mutualistas declarados ... (Numero de registros de tipo 2)."
constraints = { sign = "non_negative", max_value = "9999999999999", legal_refs = ["orden-hac-3580-2003:art-1"], source_refs = ["enrolled-modelo-156-layout"] }

