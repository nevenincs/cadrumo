data_type = "nif"
semantic_role = "m156_afiliado_nif"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]

# Campo 7. Positions 36-75. "Por ser personas fisicas se consignara el primer
# apellido, un espacio, el segundo apellido, un espacio y el nombre completo."
# (AEAT prints this row's naturaleza as "Afabetico" -- its own typo for
# "Alfabetico" -- which is why the PDF reader mis-reads the row; see the layout
# file's header.)
