# Modelo 156 declaration-header casillas, grounded in orden-hac-3580-2003 art 1.
# These two carry the declaration header (ejercicio, tipo de declaración) as
# informational facts; they are not positions of the diseño de registro and are
# not exported. The record's numbered positions are declared beside this file in
# cdeclarante-razon-social__ccotizacion-diciembre.toml, transcribed from the
# bundled ANEXO II of the same orden.

[[revisions."2003-y-siguientes".casillas]]
id = "decl.ejercicio"
number = "ejercicio"
section = ["declarante"]
data_type = "year"
semantic_role = "filing_year"
required = true
input_kind = "informational"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-156-procedure"]

[[revisions."2003-y-siguientes".casillas]]
id = "decl.tipo-declaracion"
number = "tipo-declaracion"
section = ["declarante"]
data_type = "text"
semantic_role = "tipo_declaracion"
required = true
input_kind = "informational"
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-156-procedure"]
