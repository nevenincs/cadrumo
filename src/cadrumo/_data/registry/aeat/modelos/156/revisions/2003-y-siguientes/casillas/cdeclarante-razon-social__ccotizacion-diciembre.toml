section = ["declarante"]
data_type = "name"
required = false
input_kind = "manual"
export_refs = ["modelo-156-t1-razon-social"]
legal_refs = ["orden-hac-3580-2003:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-156-layout"]

