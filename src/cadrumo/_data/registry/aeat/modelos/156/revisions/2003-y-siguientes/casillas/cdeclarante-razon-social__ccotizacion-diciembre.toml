# Modelo 156 -- the official record-design positions. Transcribed from the
# bundled ANEXO II of Orden HAC/3580/2003 (source enrolled-modelo-156-layout,
# corpus/aeat_official/disenos_registro/modelo_156/files/
# 01-156-diseno-de-registro-vigente.pdf, sha256
# d387cfeb7254e49d539d5c3a731c0bd6bf275c8c1fdae80e6faa5a1006d5d068).
#
# Thirteen of these casillas carry no semantic_role. The twelve monthly
# cotizacion roles are near-duplicates of each other under the typo-twin gate
# (m156_cotizacion_julio vs _junio differ by one character), and
# m156_declarante_razon_social is a near-duplicate of Modelo 189's and Modelo
# 345's role for the same concept. Each campo is fully identified by its id and
# number; the role is an optional cross-revision index.

# Campo 5. Positions 18-57, alfanumerico. "Se consignara la razon social
# completa, sin anagrama."
