# Positions 88-96, alfanumerico de 9 posiciones: ENERO. The design
# subdivides the slot into 88 SITUACION MENSUAL DE LAS COTIZACIONES (alfabetico
# de 1 posicion, "una S o una N, segun se haya cotizado o no, al menos un dia en
# el mes correspondiente") and 89-96 IMPORTE CUOTA DE COTIZACION
# DEVENGADA (numerico de 8 posiciones, itself 89-94 parte entera and
# 95-96 parte decimal). AEAT declares ONE top-level campo of 9 bytes
# mixing an alphabetic flag with a numeric amount, so no single typed codec
# renders it: it is declared as the design's own alfanumerico span.
[[revisions."2003-y-siguientes".casillas]]
