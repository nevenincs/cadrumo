[revisions."2020-y-siguientes".family_dispositions.formulas]
reason = """
Modelo 349 is a declaracion RECAPITULATIVA: it lists the intracomunitario operations of the period so AEAT can cross-check them against the VIES declarations filed in other member states. It settles no tax, determines no base and no cuota, and computes no taxpayer liability of its own. Measured on the revision itself, none of its 18 casillas declares a formula_id and none is input_kind computed. Its four declarante totals are not an exception: decl.numero-operadores, decl.importe-operaciones, \
decl.numero-rectificaciones and decl.importe-rectificaciones are all input_kind = 'bound', arriving through this revision's binding layer rather than through a registry formula, so the aggregation they represent has a home and it is not this family. Empty by this modelo's nature and by where its aggregation lives, not by omission."""
legal_refs = ["orden-eha-769-2010:art-1", "orden-hac-174-2020:art-1", "rd-1624-1992:art-81"]
source_refs = ["aeat-dr-349-2020-current", "aeat-modelo-349-instructions"]

[revisions."2020-y-siguientes".family_dispositions.parameters]
reason = """
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. Modelo 349 declares no formulas at all (see the formulas disposition on this same revision), so there is no expression that could reference one. It is a recapitulative listing of intracomunitario operations and their amounts as invoiced; no rate, tranche or coefficient is applied to any figure it carries. The family is empty by the shape of this modelo's calculation rather than by omission."""
legal_refs = ["orden-eha-769-2010:art-1", "rd-1624-1992:art-81"]
source_refs = ["aeat-dr-349-2020-current", "aeat-modelo-349-instructions"]

[revisions."2020-y-siguientes".family_dispositions.dependency_classifications]
reason = """
A dependency classification declares which OTHER modelo's filing a value here derives from, and modelo 349 derives from none. It recapitulates the declarant's own intracomunitario deliveries and acquisitions of the period, read from its own invoicing records. The cross-check this declaration exists for runs OUTWARD and across borders -- AEAT reconciles it against the VIES declarations the counterparties file in their own member states -- not inward from another Spanish modelo. Its IVA siblings \
are not upstream of it either: modelo 303 declares the same operations as part of a periodic liquidacion, but neither derives its figures from the other and both read the same underlying invoices. Inapplicable by this modelo's position rather than merely unpopulated."""
legal_refs = ["orden-eha-769-2010:art-1", "rd-1624-1992:art-81", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-349-2020-current", "aeat-modelo-349-procedure"]
