[revisions."2020-y-siguientes".family_dispositions.projection_endpoints]
reason = """
FilingProjectionRef (cadrumo.core) is a closed discriminated union of exactly seven projection_kind members, all prefixed m303_ and used exclusively by modelo 303's engine-computed IVA facts; ProjectionEndpointDeclaration.projection_ref accepts only that union, so no declaration naming modelo 349's own casillas can validate. Modelo 349 is not modelo 303, so the projection_endpoints family cannot be populated by construction. This revision's own export_layouts already demonstrate the mechanism \
that serves its repeating rows: at least one authored ExportRecordDefinition declares repeat == \"binding_rows\", materializing repeating rows from binding values rather than from a projection_endpoints declaration."""
legal_refs = [
    "orden-eha-769-2010:art-1",
    "orden-hac-174-2020:art-1",
    "ley-58-2003:art-93",
    "rd-1624-1992:art-81",
]
