# --- Declarant header summary fields (Tipo 1, positions 138-185) ---


[revisions."2020-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2020-y-siguientes' of modelo 349 has no strictly-earlier sibling revision of this modelo (valid_from 2020-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-eha-769-2010:art-1",
    "orden-hac-174-2020:art-1",
    "ley-58-2003:art-93",
    "rd-1624-1992:art-81",
]
