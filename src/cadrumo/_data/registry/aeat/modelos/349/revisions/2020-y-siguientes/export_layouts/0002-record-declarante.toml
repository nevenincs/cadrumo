# Design campo 8, "DECLARACION COMPLEMENTARIA O SUSTITUTIVA", one alfabetico
# campo of 2 posiciones subdivided into 121 COMPLEMENTARIA ("C") and 122
# SUSTITUTIVA ("S"). Neither byte can be produced correctly today: the
# amendment_evidence.is_complementaria producer is a boolean and a boolean
# export field renders the canonical "X", not the "C" this design admits, and
# there is no sustitutiva producer at all. A first presentation leaves both
# blank, which is the design's own default ("en el caso excepcional de segunda
# o posterior presentacion"). Declared on the design's own campo boundary; the
# wire bytes are unchanged, 2 blanks either way.
