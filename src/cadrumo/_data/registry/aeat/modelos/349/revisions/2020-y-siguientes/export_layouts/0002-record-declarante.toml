[[revisions."2020-y-siguientes".export_layouts.records.fields]]
id = "modelo-349-decl-nif"
offset = 9
length = 9
kind = "header"
producer_key = "taxpayer.tax_id"
# A NIF is a fixed-width alphanumeric identifier that always exactly
# fills its 9-byte slot, not a zero-filled numeric quantity -- LEFT_ZERO
# never actually pads a present value here, but its parse-side _unpad
# strips leading "0" characters from a low-numbered individual DNI
# (e.g. "00012345Z" -> "12345Z"), corrupting a real identifier. padding
# none + justification none renders identically for every full-width
# value (proven by direct render comparison) and its parse side only
# strips trailing spaces, never real digits.
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-eha-769-2010:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-349-2020-current"]

[[revisions."2020-y-siguientes".export_layouts.records.fields]]
id = "modelo-349-decl-apellidos-razon-social"
offset = 18
length = 40
kind = "header"
# Design campo 5, "APELLIDOS Y NOMBRE O RAZON SOCIAL DEL DECLARANTE". One slot
# carries "apellidos y nombre" for a persona fisica and "razon social" for a
# persona juridica, so it must read the fact populated for BOTH: full_name.
# surnames/given_name are blank for an entity and legal_name is blank for a
# natural person, so either would blank the slot for half the declarant
# population. The design's "primer apellido, un espacio, el segundo apellido,
# un espacio y el nombre completo, necesariamente en este orden" is exactly the
# surnames-first join compose_legal_full_name already performs. Identical slot
# and identical treatment to modelo 180's declarante campo 5.
producer_key = "taxpayer.full_name"
data_type = "text"
required = true
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-eha-769-2010:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-349-2020-current"]

