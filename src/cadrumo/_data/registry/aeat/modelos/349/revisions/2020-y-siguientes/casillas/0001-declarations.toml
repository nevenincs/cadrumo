# --- Per-operator detail fields (Tipo 2 operador intracomunitario) ---
# --- Rectification detail fields (Tipo 2 rectificaciones) ---
# --- Live cross-reference policy ---
# The sujeto pasivo SUSTITUTO identity, printed at the tail of both tipo-2
# records. The design names them "NIF EMPRESARIO O PROFESIONAL DESTINATARIO
# FINAL" and "APELLIDOS Y NOMBRE O RAZON SOCIAL DEL SUJETO", and each field's own
# content cell continues the name and states the condition: "... PASIVO
# SUSTITUTO (Solo se cumplimentara en caso de clave ...)".
#
# They are declared as data casillas rather than left as export fillers because
# they carry a real taxpayer identity whenever that clave applies. A filler emits
# blanks unconditionally, so modelling them that way writes an empty NIF over a
# position AEAT expects filled -- the silent under-declaration the coverage gate
# exists to refuse. required = false records that the condition, not the datum,
# is optional.

