[[revisions."2013-y-siguientes".extraction_profiles]]
id = "modelo-720-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parser.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.ejercicio", match_strategy = "named_label", value_kind = "text", label_pattern = 'Ejercicio\s+al\s+que\s+se\s+refiere\s+la\s+informaci[oó]n'},
]
# decl.ejercicio label_pattern grounded against:
# (1) AEAT-published diseño de registro (modelo_720.pdf), downloaded 2026-05-27 from
#     https://sede.agenciatributaria.gob.es/static_files/Sede/Disenyo_registro/
#       DR_Resto_Mod/archivos/modelo_720.pdf
#     saved at src/cadrumo/_data/corpus/aeat_official/instructions/modelo_720/files/
#       modelo-720-aeat-dr.pdf
#     Record-type-1 positions 5-8: EJERCICIO.
# (2) Orden HAP/72/2013 Art. 7: "al que se refiera la información a suministrar" —
#     M720 is a declaración informativa and consistently uses "información", not
#     "declaración", throughout its regulatory framework.
# (3) aeat-dr-720 casilla label: "Ejercicio al que se refiere la informacion".
#
# decl.tipo-declaracion REMOVED: the field (positions 121-122 of record type 1)
# is "DECLARACIÓN COMPLEMENTARIA O SUSTITUTIVA" — two separate single-character
# flag positions (C=complementaria, S=sustitutiva).  It is not a printed label+value
# pair and cannot be extracted via named_label.  No AEAT-published source uses
# "Tipo de declaración" as a labeled field for M720.
#
# Synthetic round-trip fixture at src/cadrumo/tests/fixtures/justificantes/720/2024-0A.pdf
# reproduces the AEAT ejercicio label so the named_label parser can locate and
# extract the value.
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["orden-hap-72-2013:art-1", "orden-hap-72-2013:art-7", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-720", "aeat-modelo-720-procedure"]
