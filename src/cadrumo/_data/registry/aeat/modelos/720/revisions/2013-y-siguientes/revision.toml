[revisions."2013-y-siguientes".family_dispositions.relations]
reason = "Modelo 720 declares calculation_class = \"informative\". validate_informative_class_invariant hard-refuses any revision of an informative-class modelo that declares a non-empty relations family -- cross-model relations feed a filing-grade calculation this modelo does not perform. The relations family cannot be populated for this modelo by registry construction."
