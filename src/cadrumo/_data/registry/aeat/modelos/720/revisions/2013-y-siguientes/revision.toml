[revisions."2013-y-siguientes"]
# Prepared and reviewed by an agent against the bundled diseño de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement: every casilla legal_ref and
# source_ref resolves to the legal catalogue; every cited source's corpus file is
# present; every enrolled schema family resolves; and both records of the layout
# now cover all 500 positions their diseño declares, with NO design data position
# left unaddressed -- the tails that were previously unwritten are the BLANCOS
# runs the design states, now emitted as filler so the record goes out at the
# length AEAT reads.
#
# This revision's layout is BINDING-DERIVED rather than generated, so it carries
# no fresh-render reproduction evidence and this stamp claims none. Its formulas
# family is dispositioned inapplicable: the declaration reports holdings and
# settles no tax, so there is no computed figure to check.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
# valid_from is canonicalised to the ejercicio-start convention (January 1 of
# period_selector.year_from = 2012, not the revision id's 2013, and not the
# orden's own effective date -- that fact already has its home on
# orden-hap-72-2013:art-1's legal.effective_from).
valid_from = 2012-01-01
period_selector = { year_from = 2012, periods = ["0A"] }
