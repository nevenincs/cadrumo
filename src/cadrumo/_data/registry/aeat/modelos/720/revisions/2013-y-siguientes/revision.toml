[revisions."2013-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2013-y-siguientes' of modelo 720 has no strictly-earlier sibling revision of this modelo (valid_from 2012-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "ley-58-2003:da-18",
    "rd-1065-2007:art-42-bis",
    "rd-1065-2007:art-42-ter",
