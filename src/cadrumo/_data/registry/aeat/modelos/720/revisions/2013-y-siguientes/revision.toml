[revisions."2013-y-siguientes".family_dispositions.projection_endpoints]
reason = """
FilingProjectionRef (cadrumo.core) is a CLOSED discriminated union, and every member is scoped to the modelo whose repeated rows it describes; ProjectionEndpointDeclaration.projection_ref accepts only that union, so no declaration naming modelo 720's own casillas can validate while the union carries no modelo-720 member. The union is no longer m303-only -- it has since gained modelo-200 members for that design's repeated detail rows -- which is why this reason is stated as a scoping rule rather \
than as a count of members or a single-modelo prefix, both of which go stale the moment another modelo is added. Modelo 720 is not modelo 303, so the projection_endpoints family cannot be populated by construction. This revision's own export_layouts already demonstrate the mechanism that serves its repeating rows: at least one authored ExportRecordDefinition declares repeat == \"binding_rows\", materializing repeating rows from binding values rather than from a projection_endpoints declaration."""
