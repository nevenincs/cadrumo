[revisions."2013-y-siguientes".family_dispositions.projection_endpoints]
reason = "FilingProjectionRef (cadrumo.core) is a closed discriminated union of exactly seven projection_kind members, all prefixed m303_ and used exclusively by modelo 303's engine-computed IVA facts; ProjectionEndpointDeclaration.projection_ref accepts only that union, so no declaration naming modelo 720's own casillas can validate. Modelo 720 is not modelo 303, so the projection_endpoints family cannot be populated by construction. This revision's own export_layouts already demonstrate the mechanism that serves its repeating rows: at least one authored ExportRecordDefinition declares repeat == \"binding_rows\", materializing repeating rows from binding values rather than from a projection_endpoints declaration."
legal_refs = [
    "ley-58-2003:da-18",
    "rd-1065-2007:art-42-bis",
    "rd-1065-2007:art-42-ter",
    "rd-1065-2007:art-54-bis",
    "orden-hap-72-2013:art-1",
    "orden-hap-72-2013:art-2",
