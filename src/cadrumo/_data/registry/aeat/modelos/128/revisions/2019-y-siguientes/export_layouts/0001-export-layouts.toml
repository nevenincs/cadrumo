# Modelo 128 -- IRPF/IS/IRNR retenciones sobre rentas de capitalizacion y contratos de
# seguro de vida o invalidez -- fichero BOE.
#
# Transcribed position by position from the bundled AEAT Diseno de Registros
# cited in source_refs. Every offset and length below is read from that file;
# none is derived, inferred or rounded.
#
# NOTE ON ERA COVERAGE: this revision claims filing years from 2019, but the only
# record design AEAT publishes for this modelo -- and the only one this revision
# cites -- applies from 2020 ('ejercicio 2020 y siguientes'). Filing year 2019 is
# therefore not backed by a bundled design. That gap predates this layout and is
# not resolved by it; it is recorded here rather than papered over.
#
# Two positions of the file envelope are deliberately left unwritten: AEAT's
# 'Version del Programa' and 'NIF Empresa Desarrollo' are its entidad-
# desarrolladora slots, to be filled by the developer of the filing software.
# No such identity is declared anywhere in this project, so writing either one
# would be inventing it. Modelo 131 leaves the same two slots unwritten.

