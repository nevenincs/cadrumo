[revisions."2024"]
predecessor = "2023"
casilla_source_refs = ["boe-modelo-194-form-text", "boe-modelo-194-form-layout"]
# application_link_source_refs: carried from predecessor edition "2019"; not re-grounded on this edition's own design
application_link_source_refs = ["aeat-modelo-194-procedure"]
reviewed_against = "2023"
# Applicability-grade Modelo 194 record-design era. Summary, contact and
# declaration-identification fields are enrolled. Recipient detail and the
# generated filing export remain unfinished. Historical review below predates
# the additional fields; current lineage evidence is stored with declarations.
authority_grade = "applicability"
valid_from = 2024-01-01
period_selector = { year_from = 2024, periods = ["0A"] }
orden_aplicabilidad = ["orden-1999-11-18:apartado-cuarto"]
legal_refs = [
    "orden-1999-11-18:apartado-cuarto",
    "ley-35-2006:art-99",
    "rd-439-2007:art-108",
    "orden-hac-1504-2024:art-primero",
    "orden-hac-1504-2024:df-unica",
]
source_refs = [
    "aeat-modelo-194-procedure",
    "boe-modelo-194-form-layout",
    "aeat-dr-194-2024",
]
review_status = "agent_reviewed"
reviewed_by = """\
agent: inspected the official AEAT hash-pinned Modelo 194 design and the cited full BOE amendment. \
The era is OPEN-ENDED because Orden HAC/1504/2024 disposicion final unica declares the amended \
design "aplicable, POR PRIMERA VEZ, a las declaraciones informativas correspondientes al ejercicio \
2024, que se presentaran en el ejercicio 2025" -- por primera vez opens a continuing window that \
runs until an orden amends it, and BOE's consolidated Referencias posteriores for BOE-A-1999-22309 \
(read 2026-08-30) records NO amendment to anexo X after it. Corroborated against the AEAT \
diseno-de-registro pages captured 2026-08-15: "194 - Diseno de registro actualizado en 2024" is the \
artefact on the CURRENT modelos-100-199 page, while the 2023 and 1999/2019 designs sit on the \
ejercicios-anteriores page. Closing this era at 2024 would refuse ejercicio 2025 under an authority \
that no orden has withdrawn. The five hoja-resumen casillas remain manual input, no export layout is \
declared, and no authority grade is promoted."""
reviewed_at = 2026-08-30
family_storage_baseline = "2023"
# Each edition owns its export claim; the older record design is not adopted.
scoped_families = ["workbook_parity_refs", "verification_expectations", "completeness_manifest"]

