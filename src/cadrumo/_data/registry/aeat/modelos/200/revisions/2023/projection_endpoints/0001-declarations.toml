# Revision-owned Modelo 200 projection endpoint authority for ejercicio 2023.
# One endpoint per (kind, slot, field) of the repeated-row blocks the 2023 record
# design aeat-dr-200-2023 prints. Each block was compared field by field with the
# 2024 design through the exact printed captions of both workbooks: every endpoint
# below stands on a 2023 field with the same caption, width and type as the 2024
# field the same endpoint fills, except the B.1 participaciones directas
# correcciones valorativas, whose 2023 letters b) to f) are the 2024 letters c) to g)
# with the same captions. The 2023 design does not print the 2024 b) Reversion de
# perdidas por deterioro de valores (DT 16 LIS), so its three slots are not declared
# here; the 2024 edition adds them.

# Endpoints the 2023 design adds; every other endpoint is inherited from 2022.

