# Modelo 200, declaracion del Impuesto sobre Sociedades y del IRNR (establecimientos
# permanentes y entidades en regimen de atribucion de rentas constituidas en el
# extranjero con presencia en territorio espanol), for periodos impositivos
# iniciados en 2022.
#
# APPROVAL. Orden HFP/523/2023 (BOE-A-2023-12416, BOE de 29 de mayo de 2023) art. 1.1.a).1.o
# approves "Modelo 200: Declaracion del Impuesto sobre Sociedades y del Impuesto
# sobre la Renta de no Residentes (...), que figura en el anexo I" for the periodos
# impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2022; art. 1.2
# applies it with caracter general to every IS contribuyente. Art. 6.1 sets its
# plazo under LIS art. 124.1 and art. 3.2 the domiciliacion window.
#
# DESIGN. aeat-dr-200-2022 is AEAT's own diseno de registro for ejercicio 2022. Its sheets,
# boxes and captions differ from the 2024 design the edition after it carries, so
# this edition is authored from it rather than projected from 2024. The casillas
# are declared where this design prints them; the 2024 rows it does not print, or
# prints with another caption, stay undeclared and are recorded as debt in
# casillas/0001-declarations.toml.
#
# Grade: calculation. The Modelo 200 cuota chain (base imponible previa [00550], base
# imponible [00552], base tras reserva de nivelacion [01330], tipo [00558], cuota
# integra [00562], cuota integra ajustada positiva [00582], cuota liquida [00592],
# cuota del ejercicio [00599], cuota diferencial [00611]) is authored at this edition
# from aeat-dr-200-2022 and the Manual practico de Sociedades 2022, which states the
# same operations as the 2023 manual. The 2022 design prints the base imponible block
# on DP200013 ("Liquidacion II") and the otras deducciones block with the cuota
# liquida on DP200014 ("Liquidacion III"), one record earlier than the 2023 design, so
# the formulas that read those boxes name the 2022 records and the 2023 edition states
# its own; the members whose boxes both designs print alike (bindings, the cuota
# diferencial, two verification predicates, dependency classifications, the rates)
# are declared here once and inherited. The rates are those the manual's "Tipos de
# gravamen vigentes" table prints for 2022: no rate depends on the INCN, which Ley
# 31/2022 art. 39 introduces only for periods initiated from 2023. This edition
# carries no export layout for the 2022 design, so it calculates but does not file:
# filing grade needs this year's own layout proven by round trip and an independent
# oracle for the cuota chain.
