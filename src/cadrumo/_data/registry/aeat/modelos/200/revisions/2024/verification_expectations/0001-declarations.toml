# Calculation verification for Modelo 200 (Impuesto sobre Sociedades,
# Ley 27/2014). Enrolls the always-present liquidation-chain finals as the
# reconciliation contract: cuota integra (DP200014:00562, art. 29/30), cuota
# liquida (DP200014B:00592, art. 41), and cuota diferencial (DP200014B:00611,
# art. 124) are the formula-derived money finals reported in every filed
# declaration, so min_coverage = 1 holds without flipping a legitimate filing to
# NEEDS_REVIEW. Situational computed casillas (BIN compensation
# `bin-aplicada-maxima`, doble-imposicion `00582`) and the rate `00558` are
# deliberately NOT enrolled. Complements the existing base-determination
# soundness predicate (00501 -> 00552). Grounded in the modelo's own AEAT DR /
# manual source_refs.
# Grounded against the AEAT Manual practico de Sociedades 2024, Cap. 6
# "Cuota liquida minima (casilla 00619)", "Ejemplo 1" (paginas 392-396): a
# large-company (INCN > 20M) worked example printing BOTH a "sin tributacion
# minima" liquidacion ("Cuota integra [00562] 500.000", "Cuota liquida
# [00592] 270.000") and the final "con tributacion minima" liquidacion once
# LIS art. 30 bis is applied ("Cuota liquida minima [00619] 300.000", "Cuota
# liquida [00592] 300.000"); no Modelo 202 pagos fraccionados are mentioned,
# so cuota diferencial [00611] equals cuota liquida in both scenarios. See
# test_modelo_200_2024_ejemplo1_tributacion_minima_manual_worked_example.py
# and
# corpus/manual_oracles/modelo-200-2024-ejemplo1-tributacion-minima-empresa-grande.json.
# The CI honesty gate (test_external_oracle_grounding_enrolled.py) cross-checks
# this declaration symmetrically against the bundled corpus.
# Exhaustive reconcile-when-present verification for Modelo 200
# revision 2024: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-200-cuota-chain-verification).

[[revisions.2024.verification_expectations]]
id = "modelo-200-cuota-chain-verification"
tolerance = "0.01"
rounding = "money-2"
min_coverage = "1"
computed_casilla_ids = ["DP200014:00562", "DP200014B:00592", "DP200014B:00599", "DP200014B:00611"]
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-27-2014:art-29", "ley-27-2014:art-30", "ley-27-2014:art-41", "ley-27-2014:art-124"]
source_refs = ["aeat-dr-200-2025", "aeat-modelo-200-manual-2024"]
externally_grounded_casilla_ids = ["DP200014:00562", "DP200014B:00592", "DP200014B:00611"]

[[revisions.2024.verification_expectations]]
id = "modelo-200-reconcile-when-present"
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = ["DP200014:00550", "DP200014:00552", "DP200014:00558", "DP200014:00582", "DP200014:01330", "DP200014:bin-aplicada-maxima"]
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-27-2014:art-40", "ley-27-2014:art-41", "ley-27-2014:art-29", "ley-27-2014:art-30", "ley-27-2014:art-39", "ley-27-2014:art-19", "ley-27-2014:art-36", "ley-27-2014:art-100", "rd-634-2015:art-3", "ley-27-2014:art-12", "ley-27-2014:art-15", "ley-27-2014:art-21", "ley-27-2014:art-22", "ley-27-2014:art-31", "ley-27-2014:art-32", "ley-27-2014:art-13", "ley-27-2014:art-16", "ley-27-2014:art-25", "ley-27-2014:art-26"]
