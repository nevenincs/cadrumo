
# Revision-owned Modelo 200 projection endpoint authority.
# One endpoint per (kind, slot, field) of the thirteen repeated-row blocks the
# 2024 record design prints. Slot bounds come from the core models, which were
# transcribed from AEAT's own printed numbering.
#
# These endpoints were first authored against the ejercicio-2025 design and
# re-grounded on this revision's own ejercicio-2024 authority. Every repeated
# block was compared field-for-field across both designs and each carries the
# same fields on the same sheets. The 2025 design's divergences -- the CNAE-2025
# recoding, the DP200016 length changes, the two added sheets, and the new
# DP200020B single-character indicator -- all fall outside these blocks.

