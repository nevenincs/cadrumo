# The 2022 design prints the cooperativa base-imponible lines as letter tokens [C1] to [E11]
# (aeat-dr-200-2022 lines 3652 to 3672); the 2023 design prints the same lines as boxes [02827] to
# [02849]. No field is discontinued in substance: each 2022 lineage ends because one casilla lineage
# cannot span two identifier grammars, and no value carries between the two editions.

# DP200022:C1 is not discontinued in substance. aeat-dr-200-2022 line 3652 (DP200022 field 46): 'Rég. cooperativas - Determ. base imponible - Ingresos computables - Resultados cooperativos [C1]'; aeat-dr-200-2023 line 3786 (DP200022 field 50): 'Rég. cooperativas - Determ. base imponible - 1, Ingresos computables - Resultados cooperativos [02827]'. The successor is 02827. The lineage
# restarts only because the identifier changes grammar from the printed letter token [C1] to the
# printed number [02827]; no value carries between the two.
[[revisions.2023.casilla_continuidad_evolutions]]
id = "m200-dp200022-c1-2022-2023-retired"
continuidad_id = "is-m200-dp200022-c1"
from_revision = "2022"
