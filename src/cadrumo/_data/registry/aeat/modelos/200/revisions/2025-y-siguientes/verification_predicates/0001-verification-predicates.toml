# Soundness gate: the IS base imponible must be determined when the entity
# reports a positive accounting result. Without a derivation from resultado
# contable, casilla DP200014:00552 (base imponible) can be left silently zero
# while casilla 00501 (resultado de la cuenta de perdidas y ganancias antes de
# IS) is positive, yielding cuota integra cero -- a silent under-declaration the
# verify gate would otherwise grant. ADVISORY (non-blocking): a positive result
# with a legitimately zero base (BIN compensation, correcciones) is possible, so
# this surfaces an operator-facing advisory rather than refusing the draft, until
# the base imponible is derived directly from resultado contable.
[[revisions."2025-y-siguientes".verification_predicates]]
predicate_id = "modelo-200-base-imponible-determinada-cuando-resultado-positivo"
expression = 'implies_nonzero(["00501", "DP200014:00552"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-30"]

# Soundness gate (accounting-result stage): the pre-IS-tax accounting result must
# be determined when the entity reports a positive after-tax accounting result.
# casilla 00500 (RESULTADO DE LA CUENTA DE PÉRDIDAS Y GANANCIAS, after-tax) and
# casilla 00501 (resultado contable ANTES de Impuesto Sociedades — the fiscal-base
# starting point) are both operator-entered manual inputs; 00501 = 00500 + the IS
# tax expense booked, so a positive 00500 implies a positive 00501. Without this
# guard an operator can enter a positive accounting profit (00500) yet leave the
