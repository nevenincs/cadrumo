# Art. 13 dotaciones-deterioro carry-integration advisory. The dotaciones por
# deterioro de créditos pending at the start of the period that HAVE met their
# deducibility conditions (casilla 01495, carried from the prior ejercicio's
# saldo final cumplido 01499 by the cross-year carry binding) are deductible
# THIS period — they integrate into the base imponible. When that cumplido stock
# is positive but the amount integrated this period (casilla 01496) is zero, the
# operator is carrying a now-deductible dotación without integrating it: a likely
# silent under-integration. ADVISORY (non-blocking): integrating is the
