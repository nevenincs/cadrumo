# Base imponible previa (casilla 00550, "B.I. antes de la compensación de bases
# imponibles negativas") = resultado contable (00501) + total correcciones de
# aumento (DP200013:00417) − total correcciones de disminución (DP200013:00418).
# The aumentos/disminuciones operands are the STORED column subtotals, not the
# per-row correccion leaves — summing the leaves here would double-count them
# against their own totals. This derivation is the durable fix for the silent
# zero-base under-declaration: a positive resultado contable now COMPUTES a
# non-zero base previa even with zero correcciones, so the verify gate can no
# longer grant verified_complete with finding_count = 0 on positive activity.
#
# Grounded against LIS Art. 10 (base = renta del período, corrected from the
# accounting result), LIS Art. 11 (devengo / imputación temporal), AEAT Manual
# práctico de Sociedades 2024 Cap. 5 (Liquidación I → III), and the diseño de
# registro 2024 (DP200012 pos 81, DP200013 pos 1560/1577, DP200014 pos 13).
# Base imponible (casilla 00552) = base imponible previa (00550) − reserva de
# capitalización (01032, LIS Art. 25) − compensación de bases imponibles
# negativas aplicada (00547, LIS Art. 26), with a non-negative clamp: «si el
# resultado es cero, consignar cero». The reserva and the BIN compensación
# cannot drive the base below zero. The applied-BIN amount (00547) and the
# reserva (01032) stay operator-input; their stateful multi-period caps (the
# 70% / EUR 1M BIN floor; the Art. 25 reserva uplift) are separate follow-on
# sub-engines. Grounded against AEAT Manual de Sociedades 2024 Cap. 5 and LIS
# Arts. 25, 26; diseño de registro 2024 DP200014 pos 13/64/115/166.
# Entity-type rate dispatch: the LIS art. 29 tipo de gravamen (casilla
# 00558) is selected through a three-lane priority hierarchy:
#
#   1. New-entity override (LIS Art. 29 par. 4, Ley 27/2014): if the
#      period state flag `new_entity_first_two_profit_periods` is set,
#      casilla 00558 = 15 % regardless of sub-form.
#   2. Micro-empresa lane: if prior-period INCN is below 1.000.000 EUR,
#      general-rate forms resolve through the dated first-tranche display
#      scalar that mirrors the bracket schedule used by cuota íntegra.
#      Cooperativas and entidades sin fines lucrativos retain their special
#      rates (20 % and 10 %) even when the INCN threshold is met.
#   3. ERD art.101 lane: if prior-period INCN is below 10.000.000 EUR,
#      general-rate forms resolve through the DT 44ª art.101 schedule
#      (2025-2028) and the final art.29 ERD rate from 2029.
#   4. General sub-form lane: sl/sa/sal/sll/scm/other → 25 %;
#      cooperativas fiscalmente protegidas → 20 %; entidades sin fines
#      lucrativos → 10 %.
#
# Casilla 00558 is the scalar rate echo used on the export layout; the
# cuota íntegra 00562 is derived independently by
# `modelo-200-cuota-integra` via bracket application.
# Cuota integra (casilla 00562) via layered LIS Art. 29 dispatch.
# Three lanes coexist; the formula composition selects exactly one:
#
#   1. New-entity override (LIS Art. 29 par. 4): if the period state
#      flag `new_entity_first_two_profit_periods` is set, the cuota
#      applies the 15 % rate regardless of sub-form. The override
#      layers ON TOP of the sub-form dispatch via the outer
#      `if_then_else` predicate over
#      `modelo-200-2024-profile-new-entity-flag`.
#   2. Micro-empresa lane: if prior-period INCN is below 1.000.000 EUR,
#      general-rate forms (sl / sa / sal / sll /
#      sociedad_civil_mercantil / other) resolve against the
#      micro-empresa bracket table `is.modelo-200.tipo-gravamen-pyme`.
#      The same parameter carries the 2024 flat 23 % row and the LIS
#      DT 44ª two-tranche transition (21/22 in 2025, 19/21 in 2026).
#      Cooperativas fiscalmente protegidas and entidades sin fines
#      lucrativos retain their own special-rate brackets even when INCN
#      < 1M.
#   3. ERD art.101 lane: if INCN is below 10.000.000 EUR, general-rate
#      forms resolve through `is.modelo-200.cuota-integra-bracket-erd-art101`
#      for the DT 44ª 2025-2028 transition and the final art.29 rate from 2029.
#   4. Sub-form lane (LIS Art. 29.1-3): otherwise the base resolves
#      against the sub-form's single-row bracket — general 25 %,
#      cooperativa fiscalmente protegida 20 %, entidad sin fines
#      lucrativos 10 %.
#
# A profile that would otherwise micro-empresa-qualify but supplies no
# INCN raises `binding has no supplied value` and yields INCOMPLETE
# rather than a defaulted answer; an unrecognised sub-form raises
# `dispatch_table is missing key`. The casilla 00558 scalar-rate
# dispatch (`modelo-200-tipo-gravamen-por-forma-juridica`) is
# preserved for the export-layout rate echo, but the cuota integra
# is no longer derived from 00558.
# Binding reference for DP200026:00625: the casilla stays manual (export
# layout writes it) but the formula consumes the profile-sourced binding
# directly so common-regime SLs (where tributacion_estado_porcentaje = 100
# in the profile) do not produce a silent zero from an unsupplied casilla.
# Pagos fraccionados credited = M202 instalments under EITHER modality: casilla 34
# (modalidad base imponible, art. 40.3) PLUS casilla 03 (modalidad cuota, art. 40.2).
# The two are mutually exclusive per filing (the non-elected one is 0), so summing
# both relations credits a 40.2 filer's instalments that the 40.3-only fold-in drops.
# BIN compensation MÁXIMA (LIS art. 26.1): the maximum BIN compensable this
# period = min(BIN stock held at period start, max(EUR 1.000.000, 70% of base
# imponible previa)). The 70% / EUR 1M límite is on the base imponible previa a
# la reserva de capitalización y a su compensación — casilla 00550, BEFORE the
# reserva de capitalización (01032) and the applied compensación (00547). This
# internal ceiling bounds the operator-elective applied amount 00547 via a
# BLOCKING cap_le_when_positive predicate; it never forces 00547 to the cap.

