# The "60 aniversario del Festival Porta Ferrada (PF)" deduction row as the 2024 record design
# prints it. The 2023 design prints the same row on sheet DP200018B; the 2024 design moves the
# whole deducciones block onto the preceding sheet DP200018, as it does for every event row. Each
# of these three boxes is page-qualified because the identification sheet DP200001 prints the same
# number as an unrelated flag, so the id names the sheet whose design prints it: the 2023 rows are
# DP200018B:<n> and these are DP200018:<n>.
#
# The concept continues: each row keeps the continuidad_id the 2023 row carries, the 2023 member is
# removed by this edition's casilla_removals, and the move is recorded as a section_evolved
# evolution at the 2023 to 2024 boundary. This is a sheet move, not a retirement.
#
# The caption's leading year is the edition's own filing year, so the label stays year-free. Each
# box is an input: it carries a value only when the declarant states one. The comment above each
# row cites its line in 16-200-ejercicio-2024-actualizado-13-10-2025-10-7-mb-xls.xls.extracted.md.

