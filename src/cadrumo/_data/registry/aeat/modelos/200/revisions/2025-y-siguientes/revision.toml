[revisions."2025-y-siguientes"]
# Prepared and reviewed by an agent against the bundled diseno de registros
# (aeat-dr-200-2025) and the ordenes it cites; NO human operator has
# countersigned it, and 'agent_reviewed' plus this reviewer token record that
# state honestly rather than claiming the operator's own sign-off.
#
# What the review covered: every one of the 6,800 design fields was classified
# and its kind justified -- casilla from the field's own printed token, literal
# from its Constante cell, projection slot and member from the printed slot
# token, filler where the design reserves the run -- and the thirteen repeated
# blocks were each checked for exact geometry agreement against the projection
# models. That check found and corrected a real modelling error, section G
# conflating the secretario del consejo with the representantes legales.
#
# An operator re-stamping this to 'operator_reviewed' is what promotes the
# revision to a countersigned filing grade.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
# valid_from is 2025-01-01 because this revision IS the 2025 revision. That was
# established by measurement rather than by reading the label: of its 3,427
# numbered casillas, 246 are boxes only the 2025 diseno carries and ZERO are
# boxes only the 2024 diseno carries, and its export layout cites
# aeat-dr-200-2025 alone. It never described ejercicio 2024.
#
# THE HAZARD THIS BLOCK USED TO CALL LATENT HAD ALREADY BITTEN. The earlier note
# recorded that the revision spanned two designs but declared no export layout,
# so no wrong-era bytes could be produced, and warned that authoring a layout is
# what makes it bite. A layout WAS since authored, on the 2025 design, while the
# revision still claimed 2024 -- so ejercicio 2024 would have been written at
# 2025 offsets, with 1,140 of the 3,194 shared boxes at different positions, 246
# boxes declared that did not yet exist, and the 142 that did omitted entirely.
#
# Narrowing removes that. Ejercicio 2024 is now UNSERVED rather than served
# wrongly, and aeat-dr-200-2024 is no longer cited here. Authoring a real 2024
# revision is a separate job: a (length, description) derivation carries 93.6% of
# its fields and box number resolves 197 more, but 142 fields are 2024-only boxes
# needing their own casillas and 87 are ambiguous, so it is per-box work, not a
# derivation.
valid_from = 2025-01-01
period_selector = { year_from = 2025, periods = ["0A"] }
