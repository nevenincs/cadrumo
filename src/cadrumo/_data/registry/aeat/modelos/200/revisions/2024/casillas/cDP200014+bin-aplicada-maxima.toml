# Internal computed ceiling: the MAXIMUM bases imponibles negativas that may
# be compensated this period under LIS art. 26.1 — min(BIN stock held,
# max(EUR 1.000.000, 70% of base imponible previa)). This is NOT an AEAT form
# box (no export_refs): it is an app-internal derived ceiling consumed by the
# BLOCKING verification predicate that bounds the operator-elective applied
# amount (DP200014:00547). Compensation is a RIGHT bounded by this ceiling, not
# a mandate — 00547 stays operator-elective and the gate only refuses
# OVER-application (00547 > this máxima), never forcing 00547 to the ceiling
# (art. 26.1: las BIN "PODRÁN ser compensadas ... CON EL LÍMITE del 70 % ...
# En todo caso ... hasta el importe de 1 millón de euros").
