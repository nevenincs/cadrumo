# Entity-type-dispatched tipo gravamen parameters per LIS art. 29.
# Each special-regime rate is a discoverable parameter cited to LIS
# art. 29. The `lookup_parameter_by_entity_type` op routes the scalar
# rates (general, new-entity, cooperative-protected, non-profit) via
# the `modelo-200-tipo-gravamen-por-forma-juridica` formula, keyed on
# the `modelo-200-2024-profile-legal-entity-form` profile binding.
#
# The micro-empresa rate is a TWO-BRACKET scale, not a flat scalar.
# For periods initiated in 2025, LIS DT 44ª sets the transitional
# 21 % / 22 % scale; for periods initiated in 2026, it sets 19 % / 21 %.
# The final LIS art. 29.1 17 % / 20 % scale is not the 2025 window.
# This is encoded as a `bracket_table` parameter so a base amount
# resolves to its cuota directly. `lookup_parameter_by_entity_type`
# requires a scalar parameter and so cannot dispatch the micro-empresa
# bracket table; the cuota formula uses `lookup_bracket_by_entity_type`.

[[revisions."2024".parameters]]
id = "is.modelo-200.tipo-gravamen-pyme"
data_type = "bracket_table"
unit = "EUR"
bracket_axis = "filing_period"
legal_refs = ["ley-27-2014:art-29"]
source_refs = ["aeat-modelo-200-manual-2024"]

[[revisions."2024".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2024"
required_text = ["tipo de gravamen"]

# Periods initiated in 2024: 23 % flat rate (LIS Art. 29 pre-2025 pyme
# regime; Ley 31/2022 Art. 39 reduced rate for INCN < 1M, in force for
# ejercicios iniciados en 2024). The two-tranche micro-empresa scale was
# introduced for periods initiated in 2025 by Ley 7/2024 (LIS art. 29.1)
# with the transitional schedule of LIS DT 44ª (21 %/22 % in 2025,
# 19 %/21 % in 2026).
[[revisions."2024".parameters.brackets]]
lower_bound = "0"
fixed_addition = "0"
marginal_rate = "0.23"
valid_from = 2024-01-01
valid_to = 2024-12-31

# Periods initiated in 2025: 21 % on 0-50.000 EUR, 22 % on the rest
