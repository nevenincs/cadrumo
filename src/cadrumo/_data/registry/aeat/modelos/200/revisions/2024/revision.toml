selector = {revision = "2023", id = "modelo-200-bin-aplicada-maxima"}
sequence_additions = {source_citations = [{source_ref = "aeat-modelo-200-manual-2024", required_text = ["bases imponibles negativas"]}], source_refs = ["aeat-dr-200-2024", "aeat-modelo-200-manual-2024"]}
