# Tipo de gravamen (casilla 00558): "se hará constar el tipo de gravamen que
# corresponda de acuerdo con el régimen de tributación aplicable a la entidad
# declarante" (manuals/sociedades/2024 L14663-14665), read from the rate table
# of the 2024 exercise (L14666-14755) and the caracteres the declaration marks
# on its first page (manual cap. 2).
#
# Refused with a typed outcome (no value, never zero) when the declaration marks
# a régimen whose rate or cuota this registry does not author: entidad de
# crédito 00024 (L14686), hidrocarburos 00034 (L14687-14695), nueva creación of
# DT 22ª 00063 (15 / 20 scale, L14676-14681), empresa emergente 00083
# (L14684-14685), ZEC 00015 / 00079, the 1 per cent instituciones 00003 / 00004 /
# 00008, SOCIMI 00012 and fondos de pensiones 00048 (L14732-14751), entidades
# parcialmente exentas 00002 (Capítulo XIV Título VII LIS, L2411-2414) and
# uniones de cooperativas 00080.
#
#   1. Ley 49/2002 (casilla 00001 marked): 10 (L14724). A sin fines lucrativos
#      legal form that does not mark 00001 states no régimen, so it is refused,
#      as is a legal form outside the vocabulary's other forms.
#   2. Cooperativas (legal form cooperativa or casillas 00017 / 00018 / 00019):
#      a fiscalmente protegida (00017 / 00018) states the 20 of its resultados
#      cooperativos "a los únicos efectos de cumplimentar la casilla [00558]"
#      (L14704-14712, nota (1) L14752-14755); a no protegida (00019) takes the
#      rates of any other entity (L14713-14716); a cooperativa marking neither
#      is refused.
#   3. Entidad patrimonial (casilla 00066): the general 25, being excluded from
#      the 15 of nueva creación and the 23 of INCN < 1 millón (L14671-14675,
#      L14682-14683).
#   4. Nueva creación (LIS art. 29.1): 15 (L14671-14675).
#   5. INCN < 1 millón: the 23 of the 2024 table (L14682-14683). The profile
#      fact read here is the INCN of the 12 months before the period, while the
#      table speaks of the período impositivo inmediato anterior (L14682,
#      casilla 00088 L3169-3175); the two coincide for a twelve-month prior
#      period.
#   6. Below the art. 101 threshold: the dated ERD rate, which equals the
#      general 25 for the 2024 exercise.
#   7. Otherwise the general 25 (L14670).
[[revisions."2024".family_overrides]]
family = "formulas"
