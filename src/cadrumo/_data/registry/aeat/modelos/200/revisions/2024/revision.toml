# BIN compensation MÁXIMA (LIS art. 26.1): the most of the pending stock (00670)
# the period may compensate. The límite is a percentage of the base imponible
# previa a la reserva de capitalización y a su compensación (casilla 00550):
# 70, replaced by the DA 15ª.1 LIS percentage of the INCN tramo (50 from the
# tramo medio, 25 from the tramo alto, parameters bin-limite-da15-*) when the
# INCN of the 12 months before the period starts reaches the tramo (manuals/
# sociedades/2024 L14289-14300; the 2023 edition omits them because the Tribunal
# Constitucional annulled DA 15ª, L575-592 of that manual); "en todo caso" up to
# 1 millón (L14305-14306; the parameter holds that same 1.000.000 EUR figure).
# The rentas of casillas 00545 and 01509 (declared from the 2022 edition) and of
# casilla 00925 are taken off 00547 before the límite is applied (L14428-14485),
# so they raise the ceiling one for one; 00925 enters this edition because the
# 2022 and 2023 manuals do not state it. A nueva creación that marks casilla
# 00070 does not apply the límite (art. 26.3 LIS, L3183-3192), so its ceiling is
# the stock. An entity that marks casilla 00072 (extinción) does not apply it
# either, unless the extinción comes from a reestructuración (L3330-3337,
# L14319-14326); the ceiling of such an entity is left without a value for the
# operator to enter. The ceiling bounds the operator-elective applied amount
# 00547 through a BLOCKING cap_le_when_positive predicate; it never forces 00547
# to the cap. A period shorter than a year prorates the 1 millón (L14307-14311);
# this registry calculates the twelve-month period only. A stock within the
# 1 millón plus those rentas is within the ceiling whatever the turnover, so the
# INCN is read only above it.
