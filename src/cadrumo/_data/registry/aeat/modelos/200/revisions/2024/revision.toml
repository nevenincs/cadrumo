# BIN compensation MÁXIMA (LIS art. 26.1): the most of the pending stock (00670)
# the period may compensate. The límite is a percentage of the base imponible
# previa a la reserva de capitalización y a su compensación (casilla 00550):
# 70, replaced by 50 when the INCN of the 12 months before the period starts is
# at least 20 millones and by 25 when it is at least 60 millones (DA 15ª.1 LIS,
# manuals/sociedades/2024 L14281-14300); "en todo caso" up to 1 millón
# (L14305-14306; the parameter holds that same 1.000.000 EUR figure). The rentas
# of casillas 00545, 00925 and 01509 are taken off 00547 before the límite is
# applied (L14428-14485), so they raise the ceiling one for one. A nueva
# creación that marks casilla 00070 does not apply the límite (art. 26.3 LIS,
# L3183-3192), so its ceiling is the stock. The ceiling bounds the
# operator-elective applied amount 00547 through a BLOCKING cap_le_when_positive
# predicate; it never forces 00547 to the cap. A period shorter than a year
# prorates the 1 millón (L14307-14311); this registry calculates the
# twelve-month period only. A stock within the 1 millón plus those rentas is
# within the ceiling whatever the turnover, so the INCN is read only above it.
[[revisions."2024".family_overrides]]
