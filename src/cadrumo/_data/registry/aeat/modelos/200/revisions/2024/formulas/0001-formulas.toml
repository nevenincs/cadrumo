# Cuota integra (casilla 00562) via layered LIS Art. 29 dispatch.
# Three lanes coexist; the formula composition selects exactly one:
#
#   1. New-entity override (LIS Art. 29 par. 4): if the period state
#      flag `new_entity_first_two_profit_periods` is set, the cuota
#      applies the 15 % rate regardless of sub-form. The override
#      layers ON TOP of the sub-form dispatch via the outer
#      `if_then_else` predicate over
#      `modelo-200-2024-profile-new-entity-flag`.
#   2. Micro-empresa lane: if prior-period INCN is below 1.000.000 EUR,
#      general-rate forms (sl / sa / sal / sll /
#      sociedad_civil_mercantil / other) resolve against the
#      micro-empresa bracket table `is.modelo-200.tipo-gravamen-pyme`.
#      The same parameter carries the 2024 flat 23 % row and the LIS
#      DT 44ª two-tranche transition (21/22 in 2025, 19/21 in 2026).
#      Cooperativas fiscalmente protegidas and entidades sin fines
#      lucrativos retain their own special-rate brackets even when INCN
#      < 1M.
#   3. ERD art.101 lane: if INCN is below 10.000.000 EUR, general-rate
#      forms resolve through `is.modelo-200.cuota-integra-bracket-erd-art101`
#      for the DT 44ª 2025-2028 transition and the final art.29 rate from 2029.
#   4. Sub-form lane (LIS Art. 29.1-3): otherwise the base resolves
#      against the sub-form's single-row bracket — general 25 %,
#      cooperativa fiscalmente protegida 20 %, entidad sin fines
#      lucrativos 10 %.
#
# A profile that would otherwise micro-empresa-qualify but supplies no
# INCN raises `binding has no supplied value` and yields INCOMPLETE
# rather than a defaulted answer; an unrecognised sub-form raises
# `dispatch_table is missing key`. The casilla 00558 scalar-rate
# dispatch (`modelo-200-tipo-gravamen-por-forma-juridica`) is
# preserved for the export-layout rate echo, but the cuota integra
# is no longer derived from 00558.
