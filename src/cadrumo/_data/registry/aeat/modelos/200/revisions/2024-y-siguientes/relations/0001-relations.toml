# Cross-year BIN STOCK carry (self-source): prior ejercicio's casilla 00671
# (BIN pendiente futuros) feeds this ejercicio's opening pending balance
# (00670) via the bin-pendiente binding. filing_year_delta = -1. LIS art. 26.
# The strictly-negative delta marks a prior-year historical-filing carry, so
# the previous_filing observation-coverage rule applies (no modelled 2023
# revision required; present-or-zero at resolution).
