# Cross-year art.13 dotaciones-deterioro stock carry — one relation per
# condition-state. The prior ejercicio's saldo final pendiente de integración en
# períodos futuros (01498 NO han cumplido condiciones / 01499 SÍ han cumplido)
# is this ejercicio's saldo inicial a principio del período (01494 / 01495),
# carried SEPARATELY because only the cumplido stock may be integrated. These
# relations register the previous_filing target bindings so the prefill resolves
# the prior-year saldo final from the observation store (LIS art. 13).
