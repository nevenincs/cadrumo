# (aeat-dr-200-2022 lines 3652 to 3672); the 2023 design prints the same lines as boxes [02827] to
# [02849]. No field is discontinued in substance: each 2022 lineage ends because one casilla lineage
# cannot span two identifier grammars, and no value carries between the two editions.

