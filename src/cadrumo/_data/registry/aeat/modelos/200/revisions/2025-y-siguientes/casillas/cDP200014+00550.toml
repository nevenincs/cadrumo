# Segment-qualified Liquidación III base imponible previa (DP200014 segment,
# diseño 2024 pos 13: "B.I. antes de la compensación de bases imponibles
# negativas"). This is the COMPUTED base imponible previa: resultado contable
# (00501) plus total correcciones de aumento (DP200013:00417) minus total
# correcciones de disminución (DP200013:00418). It is the durable fix for the
# silent zero-base under-declaration: a positive resultado contable with zero
# correcciones now COMPUTES a non-zero base previa instead of an omitted zero.
#
# The bare number 00550 also occurs on an unrelated Estado de Cambios en el
# Patrimonio Neto record (prima de emisión); the cuota chain MUST use this
# segment-qualified id, never the bare number.
