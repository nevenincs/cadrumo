# the minimum from a turnover of at least 20 millones de euros. The requirement formula
# modelo-200-cuota-liquida-minima-exigida cannot see an undeclared turnover: the calculation
# leaves its target out without a reason, and the calculation note on the unresolved binding
# only asks for a check, because the binding fills no printed box. Without this gate an
# undeclared turnover would let the minimum vanish silently. The profile names a legal form
# for every Impuesto sobre Sociedades declarant.
