# Modelo 200 verification predicates for the 2022 edition. The two that read only boxes
# aeat-dr-200-2022 prints where the 2023 design prints them ([00500], [00501] on
# DP200012; [01495], [01496]) are authored here and inherited by 2023. The four that
# read the base imponible block name its 2022 record, DP200013 (fields 92-103); the
# 2023 edition states its own over DP200014.

# Soundness gate: the IS base imponible must be determined when the entity
# reports a positive accounting result. Without a derivation from resultado
# contable, casilla DP200013:00552 (base imponible) can be left silently zero
# while casilla 00501 (resultado de la cuenta de perdidas y ganancias antes de
# IS) is positive, yielding cuota integra cero -- a silent under-declaration the
# verify gate would otherwise grant. ADVISORY (non-blocking): a positive result
# with a legitimately zero base (BIN compensation, correcciones) is possible, so
# this surfaces an operator-facing advisory rather than refusing the draft, until
# the base imponible is derived directly from resultado contable.
[[revisions."2022".verification_predicates]]
id = "implies-nonzero:base-imponible-determinada-cuando-resultado-positivo"
predicate_id = "modelo-200-base-imponible-determinada-cuando-resultado-positivo"
expression = 'implies_nonzero(["DP200012:00501", "DP200013:00552"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-30"]

# Soundness gate (accounting-result stage): the pre-IS-tax accounting result must
# be determined when the entity reports a positive after-tax accounting result.
# casilla 00500 (RESULTADO DE LA CUENTA DE PÉRDIDAS Y GANANCIAS, after-tax) and
# casilla 00501 (resultado contable ANTES de Impuesto Sociedades — the fiscal-base
# starting point) are both operator-entered manual inputs; 00501 = 00500 + the IS
# tax expense booked, so a positive 00500 implies a positive 00501. Without this
# guard an operator can enter a positive accounting profit (00500) yet leave the
# fiscal base starting point 00501 at zero, which cascades to base imponible cero
# and cuota cero — a silent under-declaration the verify gate would otherwise
# grant, and one the existing 00501→00552 advisory cannot catch because 00501 is
# its antecedent. ADVISORY (non-blocking) and the earliest link in the IS-result
# chain (00500→00501→00552→00562→00592); mirrors the no-silent-under-declaration
# stance and the 00501→00552 base-determination advisory above.
[[revisions."2022".verification_predicates]]
id = "implies-nonzero:resultado-antes-impuesto-determinado-cuando-resultado-contable-positivo"
predicate_id = "modelo-200-resultado-antes-impuesto-determinado-cuando-resultado-contable-positivo"
expression = 'implies_nonzero(["DP200012:00500", "DP200012:00501"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-10", "ley-27-2014:art-30"]

# Elective-cap BLOCKING gate (LIS art. 26.1): the operator-elective applied BIN
# compensation (DP200013:00547) must NOT exceed the computed art.26.1 ceiling
# (DP200013:bin-aplicada-maxima = min(stock, max(1M, 70%·base previa))). When the
# ceiling is positive, an applied amount above it is an over-compensation the
# verify gate refuses; electing LESS than the ceiling is permitted (compensation
# is a right, not a mandate). cap_le_when_positive holds when the ceiling <= 0.
[[revisions."2022".verification_predicates]]
id = "cap-le-when-positive:compensacion-bin-no-excede-limite-art-26"
predicate_id = "modelo-200-compensacion-bin-no-excede-limite-art-26"
expression = 'cap_le_when_positive(["DP200013:00547", "DP200013:bin-aplicada-maxima"])'
legal_refs = ["ley-27-2014:art-26"]

# Stock BLOCKING gate (LIS art. 26): 00547 remains elective. This predicate
# does not require stock when the application is omitted or non-positive. A
# positive 00547 requires an actually present opening stock value in 00670
# and must not exceed it; a missing value is not treated as zero. The existing
# cross-period clean-source checks remain responsible for source provenance.
[[revisions."2022".verification_predicates]]
id = "positive-application-le-present-stock:compensacion-bin-no-excede-stock-disponible"
predicate_id = "modelo-200-compensacion-bin-no-excede-stock-disponible"
expression = 'positive_application_le_present_stock(["DP200013:00547", "00670"])'
legal_refs = ["ley-27-2014:art-26"]

# Art. 13 dotaciones-deterioro carry-integration advisory. The dotaciones por
# deterioro de créditos pending at the start of the period that HAVE met their
# deducibility conditions (casilla 01495, carried from the prior ejercicio's
# saldo final cumplido 01499 by the cross-year carry binding) are deductible
# THIS period — they integrate into the base imponible. When that cumplido stock
# is positive but the amount integrated this period (casilla 01496) is zero, the
# operator is carrying a now-deductible dotación without integrating it: a likely
# silent under-integration. ADVISORY (non-blocking): integrating is the
# operator's right, not a mandate — a taxpayer may legitimately defer (the stock
# carries forward via 01499→next-year 01495) — but the silent case is surfaced so
# the operator confirms rather than overlooks the deductible carry. Mirrors the
# no-silent-under-declaration advisory stance (positive input, zero dependent).
[[revisions."2022".verification_predicates]]
id = "implies-nonzero:dotaciones-deterioro-cumplido-disponible-integrar"
predicate_id = "modelo-200-dotaciones-deterioro-cumplido-disponible-integrar"
expression = 'implies_nonzero(["01495", "01496"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-13"]

# BIN closing-stock roll-forward continuity ADVISORY (LIS art. 26). casilla 00671
# (Detalle compensación BIN — TOTAL — pendiente de aplicación en periodos futuros)
# is the closing stock of negative tax bases carried to future years, entered as a
# manual TOTAL of the operator's per-year detail rows (00646…03404). The BIN area
# already BLOCKS over-application (00547 ≤ art-26 límite, 00547 ≤ opening stock
# 00670) but NOTHING reconciles the CLOSING balance, so a wrong 00671 silently
# mis-states future-year BIN stock — the cross-period-carry class, compounding
# across years. Reconcile (do NOT recompute — the per-year límite-column split a
# single total cannot capture stays operator-owned) to the AEAT roll-forward:
# closing total = opening total (00670, bound) − applied this period
# (DP200013:00547) + BIN generated this period (max(0, −DP200013:00552), the base
# imponible being negative when a new BIN is generated). ADVISORY: a
# legitimately-zero closing (all applied, none generated) stays permissible — the
# guard fires only on a genuine discontinuity, mirroring the M200 base/dotaciones
# advisories and no-silent-under-declaration.
[[revisions."2022".verification_predicates]]
id = "roll-forward-balances:bin-stock-cierre-reconcilia-roll-forward"
predicate_id = "modelo-200-bin-stock-cierre-reconcilia-roll-forward"
expression = 'roll_forward_balances(["00671", "00670", "DP200013:00547", "DP200013:00552"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-26"]

# Cuota liquida minima gate (LIS art. 30 bis.2). The cuota liquida [00592] subtracts
# from the cuota integra ajustada positiva [00582] thirteen deductions "aplicadas por
# el contribuyente en el periodo impositivo" (Manual practico de Sociedades 2022, p. 365,
# L14633-14640), so the minimum [00619] is no floor on the box: it bounds the amounts
# consigned. Art. 30 bis.2 (corpus/normatives/html/ley-27-2014.html L873-877; manual
# pp. 350-351, L14116-14145) orders them: "En primer lugar, se minorara la cuota
# integra en el importe de las bonificaciones ... y en el importe de la deduccion
# prevista en el articulo 38 bis de esta Ley"; then the doble imposicion deductions of
# arts. 31, 32, 100 and DT 23a; then "se aplicaran las restantes deducciones que
# resulten procedentes, con los limites aplicables en cada caso, hasta el importe de
# dicha cuota liquida minima", while "Las deducciones cuyo importe se determine con
# arreglo a lo dispuesto en la Ley 20/1991 ... y en la Ley 19/1994 ... se aplicaran,
# respetando sus propios limites, aunque la cuota liquida resultante sea inferior a la
# mencionada cuota liquida minima". Bonificaciones and doble imposicion already sit
# inside [00582] (p. 328, L13155), so [00582] is the base. Each box of the [00592]
# formula, by what the same manual says it carries (aeat-dr-200-2022 DP200014 fields
# 48-60 for the captions):
#   pre-floor  [02315] art. 38 bis autoridades portuarias (L17706-17710), named by art.
#              30 bis.2.a; Ejemplo 2 subtracts it before the minimum (p. 358, L14406-14411).
#   limited    [00585] "deduccion por reinversion de beneficios extraordinarios" DT 24a.7
#              (L14853-14858); [00584] "deducciones por inversiones en activos fijos
#              materiales nuevos" DT 24a.1 (L14942-14946); [00588] Cap. IV Tit. VI, DT 24a.3,
#              art. 27.3 Ley 49/2002 (L17345-17352), held to the minimum in Ejemplos 1-3
#              (L14284, L14471, L14619); [01039] art. 36.2 producciones extranjeras
#              (L17487-17491); [00565] "deduccion por donaciones a entidades sin fines de
#              lucro" Ley 49/2002 (L17958-17963); [01040] DT 37a.1 and [01041] DT 37a.2
#              reversion de medidas temporales (L18300-18304, L18354-18358). None is a
#              bonificacion, art. 38 bis, doble imposicion or Canarias deduction, so each
#              is one of the "restantes deducciones".
#   exempt     [00590] "deducciones por inversiones realizadas en Canarias" (L18133-18137),
#              the percentages and limits of "el articulo 94 de la Ley 20/1991" (L18100-18106);
#              [02314] producciones extranjeras en Canarias, "Regulacion: Articulo 36.2 LIS y
#              94 Ley 20/1991 y DA 14a Ley 19/1994" (L25637), its percentages "se
#              incrementaran segun lo dispuesto en el articulo 94.1 a) de la Ley 20/1991"
#              (L25649-25650); [00082] art. 39.2 I+D+i, which "no se ve afectada por el
#              importe de la cuota liquida minima" (p. 359, L14440-14442).
#   unresolved [00583] "Apoyo fiscal a la inversion y otras deducciones" (DR field 48): the
#              manual names no deduction it carries, so no classification follows from it;
#              [00399] "deducciones ... que con arreglo a la respectiva norma foral hayan
#              aplicado ... exclusivamente las entidades declarantes sometidas a dicha
#              normativa" (L18142-18148): deductions of foral law, which art. 30 bis.2 does
#              not name. Under a positive [00619], when no limited breach is certain and
#              the two would take what is left below [00619] (so their classification
#              decides the outcome), the gate reports them as unresolved rather than
#              guessing; with room for them either way it holds.
# Holds when [00619] is zero. Otherwise [00582] - [02315] - limited must reach [00619]
# unless the limited total is zero: where [00582] - [02315] is already below [00619]
# (Ejemplo 2, p. 359, "no puede aplicarse sobre la cuota integra el resto de
# deducciones"), nothing limited may be consigned. The manual's con-tributacion-minima
# liquidaciones hold: Ejemplo 1 350.000 - 50.000 = 300.000 (p. 355), Ejemplo 2 [00588] 0
# (p. 360), Ejemplo 3 455.000 - 30.000 = 425.000 (p. 364). [00588] 80.000 against
# [00619] 300.000 and [00582] 350.000 does not.
[[revisions."2022".verification_predicates]]
id = "limited-subtractions-respect-floor:deducciones-limitadas-por-cuota-liquida-minima"
predicate_id = "modelo-200-deducciones-limitadas-por-cuota-liquida-minima"
expression = 'limited_subtractions_respect_floor(["DP200014:00619", "DP200014:00582"], ["DP200014:02315"], ["DP200014:00585", "DP200014:00584", "DP200014:00588", "DP200014:01039", "DP200014:00565", "DP200014:01040", "DP200014:01041"], ["DP200014:00583", "DP200014:00399"], ["DP200014:02314", "DP200014:00590", "DP200014:00082"])'
legal_refs = ["ley-27-2014:art-30-bis", "ley-27-2014:art-39"]

