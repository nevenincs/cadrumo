# Modelo 200 bindings, authored at the 2022 edition: each reads a profile fact or a
# prior filing that the Manual práctico de Sociedades 2022 describes in the same terms
# as the 2023 manual, and each bound box is printed by aeat-dr-200-2022 where the
# 2023 design prints it (00670, 01494, 01495, DP200026:00625). Later editions
# inherit them.

# The three Modelo 202 instalments of the ejercicio, one binding per instalment and modalidad.
# Manual práctico de Sociedades 2022 ("Pagos fraccionados", manuals/sociedades/2022
# source.pdf.extracted.md:18741-18749) puts the primer, segundo and tercer pago fraccionado
# in casillas 00601, 00603 and 00605; the Modelo 202 chapter (:28525-28526) names the amount
# paid as "la cantidad a ingresar (casilla 03 o casilla 34)": casilla 03 under modalidad
# cuota (art. 40.2 LIS), casilla 34 under modalidad base imponible (art. 40.3 LIS). A filing
# carries one modalidad, and the other casilla is 0. aeat-dr-200-2022 prints the three boxes on
# DP200014B (fields 26, 28 and 30), as every later design does, so later editions inherit them.

[[revisions."2022".bindings]]
id = "modelo-200-pago-fraccionado-primero-40-2"
provider = { kind = "relation_prefill", relation_kind = "cross_model_output", dependency_role = "instalment_to_final_settlement", source_modelo = "202", source_casilla_id = "03", temporal = { kind = "same_filing_year_periods", source_periods = ["1P"] } }
applicability = { kind = "target_periods", periods = ["0A"] }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-40", "ley-27-2014:art-41"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
