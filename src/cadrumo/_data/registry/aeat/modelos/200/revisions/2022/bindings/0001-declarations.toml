# Calculation-only enum binding: carries the taxpayer's recognised
# legal form (sociedad limitada / anonima / cooperativa / sociedad
# civil mercantil / sin fines lucrativos / other) so the cuota-integra
# rate dispatch (`modelo-200-tipo-gravamen-por-forma-juridica`) selects
# the LIS art. 29 tipo de gravamen by entity sub-form. Read from the
# string-valued enum channel by `lookup_parameter_by_entity_type`; it
# carries no xsd/dictionary addressing because it does not land on the
# fichero-BOE record.
[[revisions."2022".bindings]]
id = "modelo-200-profile-legal-entity-form"
provider = { kind = "profile", profile_model = "taxpayer", field = "legal_entity_form" }
value = { data_type = "enum", channel = "enum", typed_enum = "LegalEntityForm" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-29"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["tipo de gravamen"]

# The importe neto de la cifra de negocios of the twelve months before the tax
# period began (LIS DA 15ª): it selects the 50 % and 25 % limits on the
# compensation of bases imponibles negativas for a turnover of at least 20 and
# 60 million euros. The Manual práctico de Sociedades 2022 states those limits
# and the three INCN situations the filer indicates ("durante los doce meses
# anteriores a la fecha de inicio del período impositivo"), so the 2022 edition
# is the earliest that reads it. It is not the preceding period's turnover the
# rate reads (modelo-200-incn-periodo-impositivo-anterior). Sourced from the
# Decimal profile fact `incn_prior_12_months`; undeclared, the limit refuses.
[[revisions."2022".bindings]]
id = "modelo-200-profile-incn-prior-12-months"
provider = { kind = "profile", profile_model = "taxpayer", field = "incn_prior_12_months" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:da-15"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["disposición adicional decimoquinta", "doce meses anteriores a la fecha de inicio del período impositivo"]

# Calculation-only Decimal binding: carries the newly-created-entity
# 15 % rate eligibility (LIS Art. 29: first two profit-making tax
# periods). Sourced from the boolean profile fact
# `new_entity_first_two_profit_periods`, coerced 1 / 0 by the
# profile-binding resolver. Consumed as the predicate of the
# `modelo-200-cuota-integra` `if_then_else` so the override layers on
# top of the sub-form rate dispatch rather than replacing it.
[[revisions."2022".bindings]]
id = "modelo-200-profile-new-entity-flag"
provider = { kind = "profile", profile_model = "taxpayer", field = "new_entity_first_two_profit_periods" }
value = { data_type = "boolean", channel = "boolean" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-29"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["tipo de gravamen"]

# Decimal binding of casilla DP200026:00625, the porcentaje de tributación
# a la Administración del Estado (aeat-dr-200-2022 DP200026 field 17,
# offset 152, width 5, "3 enteros y 2 decimales"). The casilla is bound to
# this binding, so the percentage is itself the printed and exported box and
# `modelo-200-cuota-ejercicio-a-ingresar-devolver` reads it as
# [00599] = ([00625]/100) x ([00592] - [01766] - [01784]). Common-regime
# (régimen común) entities store 100; foral entities (Bizkaia, Gipuzkoa,
# Álava, Navarra) store the share negotiated under the Concierto /
# Convenio Económico. An absent profile value refuses the cuota as a
# missing input; it is never read as zero.
[[revisions."2022".bindings]]
id = "modelo-200-profile-tributacion-estado-porcentaje"
provider = { kind = "profile", profile_model = "taxpayer", field = "tributacion_estado_porcentaje" }
value = { data_type = "decimal", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-41", "ley-27-2014:art-29", "ley-27-2014:art-30"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["Casilla [00625] Administración del Estado"]

# Cross-year BIN STOCK carry (LIS art. 26 unlimited carry-forward): the prior
# ejercicio's "BIN pendiente de aplicación en períodos futuros" (casilla 00671)
# is this ejercicio's "pendiente de aplicación a principio del período"
# (casilla 00670). This binding carries the available BIN STOCK forward; the
# elective amount actually applied (00547, operator-elective) and its 70% / EUR
# 1M ceiling are layered as a computed cap-máxima + a BLOCKING <= check, never
# forcing 00547 to the cap (compensation is a right bounded by a ceiling, not a
# mandate — art. 26.1). Relies on the previous_filing observation-coverage
# validator semantics: the prior 00671 is the operator's historical filing, so
# the fyd=-1 source resolves present-or-zero-carry even where the prior
# ejercicio is not calculated by the app.
[[revisions."2022".bindings]]
id = "modelo-200-bin-pendiente-ejercicios-anteriores"
provider = { kind = "relation_prefill", relation_kind = "cross_model_output", dependency_role = "direct_calculation", source_modelo = "200", source_casilla_id = "00671", temporal = { kind = "filing_year_offset", years = -1, source_periods = ["0A"] } }
applicability = { kind = "target_periods", periods = ["0A"] }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-26", "ley-27-2014:art-25"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["bases imponibles negativas"]

# Art. 13 dotaciones por deterioro de créditos — cross-year STOCK carry.
# A dotación whose deductibility conditions (LIS art. 13.1: 6-month overdue /
# concurso / alzamiento / judicial claim) are not yet met stays pending and
# carries to future periods. The prior ejercicio's "dotaciones pendientes
# integración períodos futuros" (saldo final, casilla 01498 que NO han cumplido
# condiciones / 01499 que SÍ han cumplido) become this ejercicio's "dotaciones
# pendientes integración a principio del período" (saldo inicial 01494 / 01495),
# tracked SEPARATELY per condition-state because only the cumplido stock may be
# integrated this period. This carries the STOCK forward; the amount actually
# integrated (01496, operator-elective — art. 13 conditions are a per-credit
# factual judgement the engine cannot derive) and the saldo final (01498/01499,
# determined by the per-generation detalle) stay operator-input. Mirrors the
# BIN-stock previous_filing carry above; relies on the same observation-coverage
# validator (the prior saldo final is the operator's historical filing, so the
# fyd=-1 source resolves present-or-zero-carry even where the prior ejercicio is
# not calculated by the app).
[[revisions."2022".bindings]]
id = "modelo-200-dotaciones-deterioro-creditos-saldo-no-cumplido-anteriores"
provider = { kind = "relation_prefill", relation_kind = "cross_model_output", dependency_role = "direct_calculation", source_modelo = "200", source_casilla_id = "01498", temporal = { kind = "filing_year_offset", years = -1, source_periods = ["0A"] } }
applicability = { kind = "target_periods", periods = ["0A"] }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "copy" }
legal_refs = ["ley-27-2014:art-13"]

[[revisions."2022".bindings.source_citations]]
source_ref = "aeat-modelo-200-manual-2022"
required_text = ["deterioro"]

