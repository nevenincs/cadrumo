# Internal computed ceiling: the MAXIMUM bases imponibles negativas that may
# be compensated this period under LIS art. 26.1 — min(BIN stock held,
# max(EUR 1.000.000, 70% of base imponible previa)). This is NOT an AEAT form
# box (no export_refs): it is an app-internal derived ceiling consumed by the
# BLOCKING verification predicate that bounds the operator-elective applied
# amount (DP200014:00547). Compensation is a RIGHT bounded by this ceiling, not
# a mandate — 00547 stays operator-elective and the gate only refuses
# OVER-application (00547 > this máxima), never forcing 00547 to the ceiling
# (art. 26.1: las BIN "PODRÁN ser compensadas ... CON EL LÍMITE del 70 % ...
# En todo caso ... hasta el importe de 1 millón de euros").
[[revisions."2023".casillas]]
id = "DP200014:bin-aplicada-maxima"
continuidad_id = "is-liquidacion-iii-compensacion-bin-maxima"
continuidad_origin = "not_on_form"
continuidad_evidence = "No AEAT design prints this row: aeat-dr-200-2023 and aeat-dr-200-2022 carry no field numbered [DP200014:bin-aplicada-maxima]; it is a computation-only member of the edition, not a box of the form."
number = "DP200014:bin-aplicada-maxima"
segmento = "DP200014"
section = ["liquidacion_iii", "base_imponible"]
semantic_role = "is_liquidacion_iii_compensacion_bin_maxima"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "The art. 26.1 BIN compensation ceiling is the single internal cap bounding the elective applied amount (DP200014:00547) in the DP200014 segment."
input_kind = "computed"
formula = "modelo-200-bin-aplicada-maxima"
