# Modelo 200 ejercicio 2023 casillas, each declared where the 2023 record design
# aeat-dr-200-2023 prints it: the same box number, on the same record sheet for a
# sheet-scoped row, with a caption and field type identical to the field the
# 2024 edition's row stands for. The comment above each row cites the design line
# in 15-200-ejercicio-2023-actualizado-15-07-2024-10-4-mb-xls.xls.extracted.md.
#
# The exception is the Tributacion conjunta block of DP200026, declared at the end
# of this file: there the two captions differ only in the official name of the
# Basque territory (Alava, Guipuzcoa, Vizcaya against Araba/Alava, Gipuzkoa, Bizkaia).
#
# NOT DECLARED HERE, recorded as debt rather than guessed: 320 rows of the 2024
# edition -- 185 whose box the 2023 design prints with another caption,
# 67 whose 2023 caption is the year's unstarred row while the 2024 caption on the
# same box is the next year's (*) row, so the box carries another generation year,
# 40 whose box the 2023 design does not print,
# 19 whose own 2024 field is not identified among the fields printing their number,
# 5 citing a provision catalogued as effective only after 2023,
# 3 whose unsheeted number the 2023 design also prints as a reserve cohort box,
# 1 whose sheet-scoped box the 2023 design prints only on another sheet.
# Boxes the 2023 design prints that the 2024 edition does not declare are not
# declared either.
#
# Stored as differences from the 2022 edition, the storage baseline: the rows below
# are the ones the 2022 edition does not declare, each saying why on the row, and every
# other row is inherited from it.
#
# Rows carry the 2024 row's continuidad_id: the identical caption on the same box in
# both designs grounds the identity. So does a caption that differs only in the year
# it names, where that year rotates with the ejercicio and keeps its (*) marker, or
# only in the (*) marker of the same generation year; the second comment above each
# such row cites the 2024 line, and a rotating row the 2022 design already prints
# the same way is declared by the 2022 edition and inherited here. The cuota chain's DP200012:00501 and
# DP200014:01330 rows are declared by the 2022 edition, whose design prints them on the
# same records with the same captions, and are inherited here; the 2024 edition records
# each rewording as a label evolution. The rows of the base imponible and otras
# deducciones blocks are stated here because this design prints them one record later
# than the 2022 design, which the 2022 edition's rows follow. Labels resolve from the
# continuity tier, or from this edition's own keys where the 2024 label is
# edition-specific.


