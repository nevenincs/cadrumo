# Modelo 200 "60 aniversario del Festival Porta Ferrada (PF)" deduction row as the 2023 record
# design prints it, the earliest design that prints it. Each of its three boxes is page-qualified
# because the identification sheet DP200001 prints the same number as an unrelated flag: [00088]
# and [00089] from the 2023 design and [00090] from the 2024 design. Without the qualification one
# casilla would own both cells and the export would refuse a stated value before any byte.
#
# The 2024 and 2025 designs print the same deduction row, but on sheet DP200018 rather than on
# DP200018B: the deducciones block reflowed onto the preceding sheet, as it did for every event
# row. A page-qualified id names the sheet its own edition's design prints, so the 2024 edition
# removes these three members and declares DP200018:<n> instead, keeping each continuidad_id and
# recording the move as a section_evolved evolution. The concept continues; it is not retired.
#
# The caption's leading year is the edition's own filing year, not a cohort year: the 2023 design
# prints "2023:", the 2024 design "2024:" and the 2025 design "2025:" against the same boxes. The
# label is therefore authored without a year, as the rotating "N+1(****) Otras deducciones" row is.
#
# Each box is an input: it carries a value only when the declarant states one. The comment above
# each row cites its line in 15-200-ejercicio-2023-actualizado-15-07-2024-10-4-mb-xls.xls.extracted.md.

