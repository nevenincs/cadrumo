# Modelo 200 ejercicio 2023 casillas, each declared where the 2023 record design
# aeat-dr-200-2023 prints it: the same box number, on the same record sheet for a
# sheet-scoped row, with a caption and field type identical to the field the
# 2024 edition's row stands for. The comment above each row cites the design line
# in 15-200-ejercicio-2023-actualizado-15-07-2024-10-4-mb-xls.xls.extracted.md.
#
# NOT DECLARED HERE, recorded as debt rather than guessed: 665 rows of the 2024
# edition -- 361 whose 2023 caption names another year,
# 236 whose box the 2023 design prints with another caption,
# 40 whose box the 2023 design does not print,
# 19 whose own 2024 field is not identified among the fields printing their number,
# 5 citing a provision catalogued as effective only after 2023,
# 3 whose unsheeted number the 2023 design also prints as a reserve cohort box,
# 1 whose sheet-scoped box the 2023 design prints only on another sheet.
# Boxes the 2023 design prints that the 2024 edition does not declare are not
# declared either.
#
# Stored as differences from the 2022 edition, the storage baseline: the rows below
# are the ones the 2022 edition does not declare, each saying why on the row, and every
# other row is inherited from it.
#
# Rows carry the 2024 row's continuidad_id: the identical caption on the same box in
# both designs grounds the identity. No formula or binding is stated: this edition is
# applicability grade. Labels resolve from the continuity tier, or from this
# edition's own keys where the 2024 label is edition-specific.


