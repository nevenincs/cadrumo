# Cuota líquida [00592] = max(0, [00582] - ([00583] + [00585] + [00584] + [00588] + [01039]
# + [02314] + [02315] + [00565] + [00590] + [00399] + [00082] + [01040] + [01041])), the
# operation the Manual práctico de Sociedades 2022 states for the box (p. 365), "siempre ...
# positiva o cero". Every operand is a deducción "aplicada por el contribuyente en el período
# impositivo", so the cuota líquida mínima of art. 30 bis LIS [00619] is not a floor on the
# box: it bounds the amounts consigned. Art. 30 bis.2 lets the "restantes deducciones" reach
# the minimum and no further, while the Canarias deductions apply "aunque la cuota líquida
# resultante sea inferior a la mencionada cuota líquida mínima" (p. 351), and the art. 39.2
# LIS I+D+i deduction [00082] "no se ve afectada por el importe de la cuota líquida mínima"
# (p. 359). The manual's worked liquidaciones consign the limited amount in the deduction box
# and carry the rest as pendiente: Ejemplo 1 [00588] 50.000 with 30.000 pendiente and [00592]
# 300.000 = [00619] (p. 355); Ejemplo 2 [00588] 0 with 250.000 pendiente, [02315] 90.000 and
# [00082] 130.000, so [00592] is 0 under a cuota líquida mínima of 130.000 (pp. 358-360).
