# BIN compensation ceiling (LIS art. 26.1) = min(stock at period start [00670], max(1 millón
# de euros, 70 % of the base imponible previa [00550])). The Manual práctico de Sociedades
# 2022 states the 1 millón de euros floor ("en todo caso, se podrán compensar en el período
# impositivo bases imponibles negativas hasta el importe de 1 millón de euros"); it is read
# from its own parameter, not from an INCN threshold. aeat-dr-200-2022 prints [00550] on
# DP200013 field 92. The 2022 manual prints the 70 alone. A nueva creación that marks
# casilla 00070 does not apply the límite (art. 26.3 LIS, manuals/sociedades/2022 L2903), so
# its ceiling is the stock.
[[revisions."2022".formulas]]
id = "modelo-200-bin-aplicada-maxima"
target_casilla_id = "DP200013:bin-aplicada-maxima"
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [{ casilla_id = "00070" }, { literal = "0" }] },
    { casilla_id = "00670" },
    { op = "min", args = [
        { casilla_id = "00670" },
        { op = "max", args = [
            { parameter = "is.modelo-200.bin-compensacion-importe-minimo" },
            { op = "percent", args = [{ casilla_id = "DP200013:00550" }, { literal = "70" }] },
        ] },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-27-2014:art-26", "ley-27-2014:art-25"]
source_refs = ["aeat-dr-200-2022", "aeat-modelo-200-manual-2022"]

