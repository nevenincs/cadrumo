# Reduced-dimension lane of the tipo de gravamen. LIS art. 29.1 in the wording
# of Ley 7/2024 DF 8.3 (periods initiated from 2025, ley-27-2014.html.extracted.md
# L810-L816) taxes at 20 % "las entidades que cumplan las previsiones previstas
# en el artículo 101", unless another rate of the article applies; DT 44ª fixes
# the transitional rate for periods initiated in 2025 (24 %, DT 44ª.1.b), 2026
# (23 %, 2.b), 2027 (22 %, 3) and 2028 (21 %, 4)
# (ley-27-2014-dt-44.html.extracted.md L1-L22). The Manual práctico de
# Sociedades 2025 states the 2025 rate: "Entidades de Reducida Dimensión
# (art. 101 LIS) 24 por 100" (p. 373, source.pdf.extracted.md L14984). The
# 2023 and 2024 wording of art. 29.1 (Ley 31/2022 art. 39) and the rate tables
# of the 2023 and 2024 manuals state no reduced-dimension rate.
[[revisions."2025-y-siguientes".parameters]]
id = "is.modelo-200.tipo-gravamen-erd-art101"
data_type = "ratio"
unit = "percent"
legal_refs = ["ley-27-2014:art-29", "ley-27-2014:art-29-2025", "ley-27-2014:art-101", "ley-27-2014:dt-44"]
source_refs = ["aeat-modelo-200-manual-2025"]

