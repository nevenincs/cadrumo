# LIS DA 15ª.1 limits on the BIN compensation of a contribuyente whose INCN of the 12
# months before the period starts is at least 20 millones de euros: 50 per cent below 60
# millones and 25 per cent from 60 millones, in place of the 70 per cent of art. 26.1
# (manuals/sociedades/2024 L435-449, L14289-14300). Declared again here because the 2023
# edition removes the members its manual prints without them (the Tribunal Constitucional
# annulled DA 15ª, manuals/sociedades/2023 L575-592); Ley 7/2024 added DA 15ª back for periods
# starting from 2024-01-01 that had not concluded on 2024-12-22.

