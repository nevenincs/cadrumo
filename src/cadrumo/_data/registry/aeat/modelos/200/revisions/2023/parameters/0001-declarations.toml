# The micro-empresa rate is a bracket table, not a flat scalar, so a base
# amount resolves to its cuota directly. For periods initiated in 2023 and 2024
# it is one 23 % bracket. The two-tranche scales of LIS DT 44ª (21 % / 22 % in
# 2025, 19 % / 21 % in 2026) are first stated by Ley 7/2024 and are declared at
# the 2025 edition, not here. `lookup_parameter_by_entity_type` requires a
# scalar parameter and so cannot dispatch the micro-empresa bracket table; the
# cuota formula uses `lookup_bracket_by_entity_type`.
[[revisions."2023".parameters]]
id = "is.modelo-200.tipo-gravamen-pyme"
data_type = "bracket_table"
unit = "EUR"
bracket_axis = "filing_period"
legal_refs = ["ley-27-2014:art-29"]

[[revisions."2023".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2023"
required_text = ["tipo de gravamen"]

# Periods initiated in 2023 and 2024: 23 % flat rate (LIS Art. 29.1 as
# amended by Ley 31/2022 Art. 39 for INCN < 1M, in force for ejercicios
# iniciados a partir de 2023; the Manual practico de Sociedades 2023
# "Tipos de gravamen vigentes" table prints "Entidades INCN < 1 millon de
# euros ... 23 por 100" for contribuyentes 2023).
[[revisions."2023".parameters.brackets]]
lower_bound = "0"
fixed_addition = "0"
marginal_rate = "0.23"
valid_from = 2023-01-01
valid_to = 2024-12-31

[[revisions."2023".parameters]]
id = "is.modelo-200.tipo-gravamen-pyme-display"
data_type = "ratio"
unit = "percent"
legal_refs = ["ley-27-2014:art-29", "ley-31-2022:art-39"]

[[revisions."2023".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2023"
required_text = ["tipo de gravamen"]

# Scalar echo for casilla 00558 when the cuota path uses the micro-empresa
# bracket. It reports the first-tranche rate for the filing period; casilla
# 00562 remains the authority for tranche arithmetic. The first-tranche rates
# of the DT 44ª scales are declared at the 2025 edition.
[[revisions."2023".parameters.values]]
value = "23"
date_axis = "filing_period"
valid_from = 2023-01-01
valid_to = 2024-12-31

# INCN thresholds that SELECT the tipo de gravamen, authored as typed parameters
# because the rates they select already are. The figures previously existed only
# as inline `literal` strings inside the cuota-integra formula expression, which
# is legitimate registry data but carries no data_type, no unit, no dated
# validity and no legal_refs of its own, and is unreadable from the application
# layer. A reader could resolve which RATE applied but not which TURNOVER band
# selected it.
[[revisions."2023".parameters]]
id = "is.modelo-200.incn-umbral-microempresa"
data_type = "money"
unit = "EUR"
# DT 44a is NOT cited here: it enters with Ley 7/2024 and is outside this
# revision's effective window, which the registry refuses. The sibling
# tipo-gravamen parameters of this revision cite the same pair.
legal_refs = ["ley-27-2014:art-29", "ley-27-2014:art-101"]

[[revisions."2023".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2023"
required_text = ["tipo de gravamen"]

# In force from the first period the 23 % lane applies, periods initiated on or
# after 1 January 2023 (Ley 31/2022 art. 39); Ley 7/2024 keeps the same 1 millón
# in the wording of art. 29.1 for periods from 2025.
[[revisions."2023".parameters.values]]
value = "1000000"
date_axis = "filing_period"
valid_from = 2023-01-01
