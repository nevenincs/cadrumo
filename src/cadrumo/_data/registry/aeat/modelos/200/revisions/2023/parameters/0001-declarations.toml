# The micro-empresa rate is a TWO-BRACKET scale, not a flat scalar.
# For periods initiated in 2025, LIS DT 44ª sets the transitional
# 21 % / 22 % scale; for periods initiated in 2026, it sets 19 % / 21 %.
# The final LIS art. 29.1 17 % / 20 % scale is not the 2025 window.
# This is encoded as a `bracket_table` parameter so a base amount
# resolves to its cuota directly. `lookup_parameter_by_entity_type`
# requires a scalar parameter and so cannot dispatch the micro-empresa
# bracket table; the cuota formula uses `lookup_bracket_by_entity_type`.
[[revisions."2023".parameters]]
id = "is.modelo-200.tipo-gravamen-pyme"
data_type = "bracket_table"
unit = "EUR"
bracket_axis = "filing_period"
legal_refs = ["ley-27-2014:art-29"]

[[revisions."2023".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2023"
required_text = ["tipo de gravamen"]

# Periods initiated in 2023 and 2024: 23 % flat rate (LIS Art. 29.1 as
# amended by Ley 31/2022 Art. 39 for INCN < 1M, in force for ejercicios
# iniciados a partir de 2023; the Manual practico de Sociedades 2023
# "Tipos de gravamen vigentes" table prints "Entidades INCN < 1 millon de
# euros ... 23 por 100" for contribuyentes 2023). The two-tranche micro-empresa scale was
# introduced for periods initiated in 2025 by Ley 7/2024 (LIS art. 29.1)
# with the transitional schedule of LIS DT 44ª (21 %/22 % in 2025,
# 19 %/21 % in 2026).
[[revisions."2023".parameters.brackets]]
lower_bound = "0"
fixed_addition = "0"
marginal_rate = "0.23"
valid_from = 2023-01-01
valid_to = 2024-12-31

# Periods initiated in 2025: 21 % on 0-50.000 EUR, 22 % on the rest
# (LIS DT 44ª transitional micro-empresa scale, Ley 7/2024).
[[revisions."2023".parameters.brackets]]
lower_bound = "0"
upper_bound = "50000"
fixed_addition = "0"
marginal_rate = "0.21"
valid_from = 2025-01-01
valid_to = 2025-12-31

[[revisions."2023".parameters.brackets]]
