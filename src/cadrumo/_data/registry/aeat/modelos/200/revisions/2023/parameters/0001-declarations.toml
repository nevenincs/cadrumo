# INCN thresholds that SELECT the tipo de gravamen, authored as typed parameters
# because the rates they select already are. The figures previously existed only
# as inline `literal` strings inside the cuota-integra formula expression, which
# is legitimate registry data but carries no data_type, no unit, no dated
# validity and no legal_refs of its own, and is unreadable from the application
# layer. A reader could resolve which RATE applied but not which TURNOVER band
# selected it.
[[revisions."2023".parameters]]
id = "is.modelo-200.incn-umbral-microempresa"
data_type = "money"
unit = "EUR"
# DT 44a is NOT cited here: it enters with Ley 7/2024 and is outside this
# revision's effective window, which the registry refuses. The sibling
# tipo-gravamen parameters of this revision cite the same pair.
legal_refs = ["ley-27-2014:art-29", "ley-27-2014:art-101"]

[[revisions."2023".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2023"
required_text = ["tipo de gravamen"]

