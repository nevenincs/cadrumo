# Segment-qualified Liquidación III compensación de bases imponibles negativas
# de períodos anteriores (DP200014 segment, diseño 2024 pos 115; LIS Art. 26).
# This is the BIN amount ACTUALLY APPLIED against the base imponible previa this
# period. It stays operator-input here: the available BIN stock (00670/00671)
# and the 70% / EUR 1.000.000 floor cap of base previa (00550) that bound how
# much may be applied are a stateful multi-period sub-engine (the M200 BIN
# prior-year hook), layered on top separately. The base imponible formula
# consumes this casilla as the BIN subtrahend and clamps the result to be
# non-negative, so the base formula is stable whether 00547 stays manual or is
# later flipped to computed by the BIN cap.
#
# The bare number 00547 also occurs on an unrelated Estado de Cambios en el
# Patrimonio Neto record (reducciones de capital); the cuota chain MUST use this
# segment-qualified id, never the bare number.
[[revisions."2024-y-siguientes".casillas]]
id = "DP200014:00547"
number = "00547"
segmento = "DP200014"
section = ["liquidacion_iii", "base_imponible"]
data_type = "money"
semantic_role = "is_liquidacion_iii_compensacion_bin_aplicada"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "Liquidación III compensación de bases imponibles negativas aplicada en el período is the single cuota-chain applied-BIN subtrahend in the DP200014 segment; the BIN stock totals (is_bin_total_pendiente) are a distinct carryforward role."
