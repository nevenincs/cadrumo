# Cuota-integra bracket tables per LIS Art. 29 sub-form. Each is a
# single-row bracket whose marginal_rate equals the sub-form flat rate
# and whose fixed_addition is zero: applying the bracket to the post-
# nivelación base 01330 yields the cuota integra 00562 directly. This
# is the bracket counterpart of the scalar tipo-gravamen-* parameters
# above; the cuota formula `modelo-200-cuota-integra-by-form` reaches
# all sub-forms through a single `lookup_bracket_by_entity_type`
# dispatch (including the micro-empresa two-tranche scale, which the
# scalar dispatch op cannot route).
[[revisions."2022".parameters]]
id = "is.modelo-200.cuota-integra-bracket-general"
