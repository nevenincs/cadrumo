# Modelo 200 tipos de gravamen whose rate for periods initiated in 2022 is the rate the
# 2023 edition applies: the Manual práctico de Sociedades 2022 "Tipos de gravamen
# vigentes" table for 2022 prints tipo general 25 por 100, entidades de nueva creación
# 15 por 100, cooperativas fiscalmente protegidas 20 por 100 and entidades de la Ley
# 49/2002 10 por 100, as the 2023 table does. Each value therefore starts at 2022 and
# later editions inherit the member. The INCN-keyed rates and thresholds (23 % for INCN
# below 1 millón de euros from Ley 31/2022 art. 39, and the LIS art. 101 lane) enter at
# 2023 and are stated by the 2023 edition.

# Entity-type-dispatched tipo gravamen parameters per LIS art. 29.
# Each special-regime rate is a discoverable parameter cited to LIS
# art. 29. The `lookup_parameter_by_entity_type` op routes the scalar
# rates (general, new-entity, cooperative-protected, non-profit) via
# the `modelo-200-tipo-gravamen-por-forma-juridica` formula, keyed on
# the `modelo-200-profile-legal-entity-form` profile binding.

