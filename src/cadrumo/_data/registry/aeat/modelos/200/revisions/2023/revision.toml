# BIN compensation MÁXIMA (LIS art. 26.1): min(stock 00670, max(1 millón, 70 % of the
# base imponible previa 00550) plus the rentas of casillas 00545 and 01509), as in 2022;
# the 2023 manual prints the 70 alone, the DA 15ª limits having been annulled
# (manuals/sociedades/2023 L575-592, L13273-13277) and states the same rentas
# (L13386-13400, L13418) and the extinción casilla 00072 (L3053-3060, L13301-13308). A
# nueva creación that marks casilla 00070 does not apply the límite (art. 26.3 LIS,
# L2908), so its ceiling is the stock. The ceiling bounds the operator-elective applied
# amount 00547 through a BLOCKING cap_le_when_positive predicate; it never forces 00547
