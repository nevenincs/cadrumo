# Base imponible previa (casilla 00550, "B.I. antes de la compensación de bases
# imponibles negativas") = resultado contable (00501) + total correcciones de
# aumento (DP200013:00417) − total correcciones de disminución (DP200013:00418).
# The aumentos/disminuciones operands are the STORED column subtotals, not the
# per-row correccion leaves — summing the leaves here would double-count them
# against their own totals. This derivation is the durable fix for the silent
# zero-base under-declaration: a positive resultado contable now COMPUTES a
# non-zero base previa even with zero correcciones, so the verify gate can no
# longer grant verified_complete with finding_count = 0 on positive activity.
#
# Grounded against LIS Art. 10 (base = renta del período, corrected from the
# accounting result), LIS Art. 11 (devengo / imputación temporal), AEAT Manual
# práctico de Sociedades 2023 Cap. 5 (Liquidación I → III), and the diseño de
# registro 2023 (DP200012 field 9 pos 64, DP200013 pos 1526/1543, DP200014
# field 6 pos 13). The 2023 design prints these boxes on the same records as
# the 2024 design; only byte offsets moved.
[[revisions."2023".family_overrides]]
family = "formulas"
selector = {revision = "2022", id = "modelo-200-base-imponible-previa"}
fields = { target_casilla_id = "DP200014:00550" }
sequence_additions = {source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"], source_citations = [{source_ref = "aeat-modelo-200-manual-2023", required_text = ["correcciones al resultado de la cuenta de perdidas y ganancias", "base imponible antes de la compensacion"]}]}
sequence_removals = {source_refs = [0, 1], source_citations = [0]}

# Base imponible (casilla 00552) = 00550 - 01032 - 00547, the 2022 member read on the
# record this design prints it on (DP200014). The sign is kept, as in 2022: the 2023
# manual prints "[00552] = [00550] - [01032] - [00547]" and, for a zero or negative
# 00550, "la cuantía precedida del signo menos (-) tanto en dicha casilla [00550] como
# en la casilla [00552]" (manuals/sociedades/2023 L13026-13050). A negative base is
# a base imponible negativa the entity carries forward; the cuota íntegra of such a
# period is zero, which the cuota íntegra formula owns. The applied-BIN amount (00547)
# and the reserva (01032) stay operator-input.
[[revisions."2023".family_overrides]]
family = "formulas"
selector = {revision = "2022", id = "modelo-200-base-imponible"}
fields = { target_casilla_id = "DP200014:00552", expression = { args = [
    { op = "subtract", args = [{ casilla_id = "DP200014:00550" }, { casilla_id = "01032" }] },
    { casilla_id = "DP200014:00547" },
] } }
sequence_additions = {source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"], source_citations = [{source_ref = "aeat-modelo-200-manual-2023", required_text = ["el importe a consignar en la casilla [00552] «Base imponible» de la página 14 del modelo 200", "[00552] = [00550] - [01032] - [00547]"]}]}
sequence_removals = {source_refs = [0, 1], source_citations = [0]}

[[revisions."2023".family_overrides]]
family = "formulas"
selector = {revision = "2022", id = "modelo-200-base-imponible-despues-reserva-nivelacion"}
fields = { expression = { args = [
    { op = "add", args = [{ casilla_id = "DP200014:00552" }, { casilla_id = "DP200014:01033" }] },
    { casilla_id = "DP200014:01034" },
] } }
sequence_additions = {source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"], source_citations = [{source_ref = "aeat-modelo-200-manual-2023", required_text = ["base imponible despues de la reserva de nivelacion", "casilla [01330] = [00552] + [01033] - [01034]"]}]}
sequence_removals = {source_refs = [0, 1], source_citations = [0]}

# Tipo de gravamen (casilla 00558): "se hará constar el tipo de gravamen que
# corresponda de acuerdo con el régimen de tributación aplicable a la entidad
# declarante" (manuals/sociedades/2023 L13568-13570), read from the table of
# contribuyentes 2023 (L13572-13641) and the caracteres the declaration marks on its
# first page. The 2023 table is the one the 2024 manual prints: it adds to the 2022
# table the 23 of INCN < 1 millón (Ley 31/2022 art. 39, L13587-13588) and the 15 of
# empresas emergentes (L13589).
#
# Refused with a typed outcome (no value, never zero) when the declaration marks a
# régimen whose rate or cuota this registry does not author: entidad de crédito
# 00024 (L13591), hidrocarburos 00034, nueva creación of DT 22ª 00063 (15 / 20
# scale), empresa emergente 00083 (L13589), ZEC 00015 / 00079, the 1 per cent
# instituciones 00003 / 00004 / 00008, SOCIMI 00012 (L13630) and fondos de pensiones
# 00048 (L13634), entidades parcialmente exentas 00002 and uniones de cooperativas
# 00080.
#
#   1. Ley 49/2002 (casilla 00001 marked): 10 (L13615). A sin fines lucrativos
#      legal form that does not mark 00001 states no régimen, so it is refused, as
#      is a legal form outside the vocabulary's other forms.
#   2. Cooperativas (legal form cooperativa or casillas 00017 / 00018 / 00019): a
#      fiscalmente protegida (00017 / 00018) states the 20 of its resultados
#      cooperativos "a los únicos efectos de cumplimentar la casilla [00558]"
#      (nota (1), L13641); a no protegida (00019) takes the rates of any other
#      entity; a cooperativa marking neither is refused.
#   3. Entidad patrimonial (casilla 00066): the general 25, being excluded from the
#      15 of nueva creación and the 23 of INCN < 1 millón (L13580-13588).
#   4. Nueva creación (LIS art. 29.1): 15.
#   5. INCN < 1 millón: 23. The INCN read here is the one the table and LIS art.
#      29.1 name, that of the período impositivo inmediato anterior: casilla 00255
#      of the preceding Modelo 200, held or stated by the filer
#      (modelo-200-incn-periodo-impositivo-anterior). Art. 29.1 as Ley 31/2022 art. 39
#      words it determines that INCN "con arreglo a lo dispuesto en los apartados 2 y
#      3 del artículo 101" (corpus normatives ley-31-2022 L1797), so art. 101 stays
#      among this formula's legal refs for the comparison it makes here.
#   6. Otherwise the general 25 (L13575). The 2023 table prints no reducida
#      dimensión rate, so no art. 101 rate lane is read.
[[revisions."2023".family_overrides]]
family = "formulas"
selector = {revision = "2022", id = "modelo-200-tipo-gravamen-por-forma-juridica"}
fields = { expression = { args = [
    { op = "greater_than", args = [
        { op = "add", args = [
            { casilla_id = "00024" },
            { casilla_id = "00034" },
            { casilla_id = "00063" },
            { casilla_id = "DP200001:00083" },
            { casilla_id = "00015" },
            { casilla_id = "00079" },
            { casilla_id = "00003" },
            { casilla_id = "DP200001:00004" },
            { casilla_id = "00008" },
            { casilla_id = "00012" },
            { casilla_id = "00048" },
            { casilla_id = "00002" },
            { casilla_id = "00080" },
        ] },
        { literal = "0" },
    ] },
    { op = "unresolved_outcome", args = [{ text_literal = "m200-tax-regime-unsupported" }] },
    { op = "if_then_else", args = [
        { op = "greater_than", args = [{ casilla_id = "00001" }, { literal = "0" }] },
        { parameter = "is.modelo-200.tipo-gravamen-non-profit-special-regime" },
        { op = "if_then_else", args = [
            { op = "less_than", args = [
                { op = "add", args = [
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "sl" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "sa" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "sal" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "sll" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "cooperativa" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "sociedad_civil_mercantil" }] },
                    { op = "text_equal", args = [{ binding = "modelo-200-profile-legal-entity-form" }, { text_literal = "other" }] },
                ] },
                { literal = "1" },
            ] },
            { op = "unresolved_outcome", args = [{ text_literal = "m200-tax-regime-unsupported" }] },
            { op = "if_then_else", args = [
                { op = "greater_than", args = [
                    { op = "add", args = [
                        { op = "text_equal", args = [
                            { binding = "modelo-200-profile-legal-entity-form" },
                            { text_literal = "cooperativa" },
                        ] },
