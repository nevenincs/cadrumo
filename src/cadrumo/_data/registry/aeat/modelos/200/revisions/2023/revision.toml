# Soundness gate: the IS base imponible must be determined when the entity
# reports a positive accounting result. Without a derivation from resultado
# contable, casilla DP200014:00552 (base imponible) can be left silently zero
# while casilla 00501 (resultado de la cuenta de perdidas y ganancias antes de
# IS) is positive, yielding cuota integra cero -- a silent under-declaration the
# verify gate would otherwise grant. ADVISORY (non-blocking): a positive result
# with a legitimately zero base (BIN compensation, correcciones) is possible, so
# this surfaces an operator-facing advisory rather than refusing the draft, until
# the base imponible is derived directly from resultado contable.
[[revisions."2023".family_overrides]]
family = "verification_predicates"
selector = {revision = "2022", id = "implies-nonzero:base-imponible-determinada-cuando-resultado-positivo"}
fields = { expression = "implies_nonzero([\"DP200012:00501\", \"DP200014:00552\"])" }

# Elective-cap BLOCKING gate (LIS art. 26.1): the operator-elective applied BIN
# compensation (DP200014:00547) must NOT exceed the computed art.26.1 ceiling
# (DP200014:bin-aplicada-maxima = min(stock, max(1M, 70%·base previa))). When the
# ceiling is positive, an applied amount above it is an over-compensation the
# verify gate refuses; electing LESS than the ceiling is permitted (compensation
# is a right, not a mandate). cap_le_when_positive holds when the ceiling <= 0.
[[revisions."2023".family_overrides]]
family = "verification_predicates"
selector = {revision = "2022", id = "cap-le-when-positive:compensacion-bin-no-excede-limite-art-26"}
fields = { expression = "cap_le_when_positive([\"DP200014:00547\", \"DP200014:bin-aplicada-maxima\"])" }

# Stock BLOCKING gate (LIS art. 26): 00547 remains elective. This predicate
# does not require stock when the application is omitted or non-positive. A
# positive 00547 requires an actually present opening stock value in 00670
# and must not exceed it; a missing value is not treated as zero. The existing
# cross-period clean-source checks remain responsible for source provenance.
[[revisions."2023".family_overrides]]
family = "verification_predicates"
selector = {revision = "2022", id = "positive-application-le-present-stock:compensacion-bin-no-excede-stock-disponible"}
fields = { expression = "positive_application_le_present_stock([\"DP200014:00547\", \"00670\"])" }

# BIN closing-stock roll-forward continuity ADVISORY (LIS art. 26). casilla 00671
# (Detalle compensación BIN — TOTAL — pendiente de aplicación en periodos futuros)
# is the closing stock of negative tax bases carried to future years, entered as a
# manual TOTAL of the operator's per-year detail rows (00646…03404). The BIN area
# already BLOCKS over-application (00547 ≤ art-26 límite, 00547 ≤ opening stock
# 00670) but NOTHING reconciles the CLOSING balance, so a wrong 00671 silently
# mis-states future-year BIN stock — the cross-period-carry class, compounding
# across years. Reconcile (do NOT recompute — the per-year límite-column split a
# single total cannot capture stays operator-owned) to the AEAT roll-forward:
# closing total = opening total (00670, bound) − applied this period
# (DP200014:00547) + BIN generated this period (max(0, −DP200014:00552), the base
# imponible being negative when a new BIN is generated). ADVISORY: a
# legitimately-zero closing (all applied, none generated) stays permissible — the
# guard fires only on a genuine discontinuity, mirroring the M200 base/dotaciones
# advisories and no-silent-under-declaration.
[[revisions."2023".family_overrides]]
family = "verification_predicates"
selector = {revision = "2022", id = "roll-forward-balances:bin-stock-cierre-reconcilia-roll-forward"}
fields = { expression = "roll_forward_balances([\"00671\", \"00670\", \"DP200014:00547\", \"DP200014:00552\"])" }

# Calculation verification for Modelo 200 (Impuesto sobre Sociedades,
# Ley 27/2014). Enrolls the always-present liquidation-chain finals as the
# reconciliation contract: cuota integra (DP200014:00562, art. 29/30), cuota
# liquida (DP200014B:00592, art. 41), and cuota diferencial (DP200014B:00611,
# art. 124) are the formula-derived money finals reported in every filed
# declaration, so min_coverage = 1 holds without flipping a legitimate filing to
# NEEDS_REVIEW. Situational computed casillas (BIN compensation
# `bin-aplicada-maxima`, doble-imposicion `00582`) and the rate `00558` are
# deliberately NOT enrolled. Complements the existing base-determination
# soundness predicate (00501 -> 00552). Grounded in the modelo's own AEAT DR /
# manual source_refs.
[[revisions."2023".family_overrides]]
family = "verification_expectations"
selector = {revision = "2022", id = "modelo-200-cuota-chain-verification"}
sequence_additions = {computed_casilla_ids = ["DP200014B:00592"], source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"]}
sequence_removals = {computed_casilla_ids = [1], source_refs = [0, 1]}
sequence_order = {computed_casilla_ids = [0, 3, 1, 2]}

# Exhaustive reconcile-when-present verification for Modelo 200
# revision 2023: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-200-cuota-chain-verification).
[[revisions."2023".family_overrides]]
family = "verification_expectations"
selector = {revision = "2022", id = "modelo-200-reconcile-when-present"}
sequence_additions = {reconcile_when_present_casilla_ids = ["DP200014:00550", "DP200014:00552", "DP200014:bin-aplicada-maxima"], source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"]}
sequence_removals = {reconcile_when_present_casilla_ids = [0, 1, 5], source_refs = [0, 1]}
sequence_order = {reconcile_when_present_casilla_ids = [3, 4, 0, 1, 2, 5]}

