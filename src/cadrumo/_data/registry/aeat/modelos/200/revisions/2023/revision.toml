[revisions."2023"]
casilla_storage_baseline = "2022"
casilla_source_refs = ["aeat-dr-200-2023"]
application_link_source_refs = ["boe-modelo-200-2023-form", "aeat-dr-200-2023"]
filing_schedule_source_refs = ["boe-modelo-200-2023-form", "aeat-modelo-200-manual-2023"]
authority_grade = "applicability"
# Modelo 200, declaracion del Impuesto sobre Sociedades y del IRNR (establecimientos
# permanentes y entidades en regimen de atribucion de rentas constituidas en el
# extranjero con presencia en territorio espanol), for periodos impositivos
# iniciados en 2023.
#
# APPROVAL. Orden HAC/495/2024 (BOE-A-2024-10574, BOE de 27 de mayo de 2024) art. 1.1.a).1.o
# approves "Modelo 200: Declaracion del Impuesto sobre Sociedades y del Impuesto
# sobre la Renta de no Residentes (...), que figura en el anexo I" for the periodos
# impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2023; art. 1.2
# applies it with caracter general to every IS contribuyente. Art. 6.1 sets its
# plazo under LIS art. 124.1 and art. 3.2 the domiciliacion window.
#
# DESIGN. aeat-dr-200-2023 is AEAT's own diseno de registro for ejercicio 2023. Its sheets,
# boxes and captions differ from the 2024 design the edition after it carries, so
# this edition is authored from it rather than projected from 2024. The casillas
# are declared where this design prints them; the 2024 rows it does not print, or
# prints with another caption, stay undeclared and are recorded as debt in
# casillas/0001-declarations.toml.
#
# Grade: applicability. No formula, construct relation, binding or export layout
# computes, checks or files these casillas, so the modelo is not calculated or
# filed for this year; the 2024 edition's calculation authority does not reach it.
valid_from = 2023-01-01
valid_to = 2023-12-31
period_selector = { year_from = 2023, year_to = 2023, periods = ["0A"] }
orden_aplicabilidad = ["orden-hac-495-2024:modelo-200"]
legal_refs = [
    "orden-hac-495-2024:modelo-200",
    "orden-hac-495-2024:art-6-1",
    "orden-hac-495-2024:art-3",
    "ley-27-2014:art-124",
]
source_refs = [
    "boe-modelo-200-2023-form",
    "aeat-dr-200-2023",
    "aeat-modelo-200-manual-2023",
]
review_status = "pending_review"
# Storage: the 2022 edition, at the support floor, is the storage baseline; this
# edition keys only its differences from it. Storage reuse makes no continuity claim.
family_storage_baseline = "2022"
scoped_families = ["workbook_parity_refs"]

