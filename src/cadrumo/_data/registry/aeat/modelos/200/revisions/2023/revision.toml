# Cuota íntegra (casilla 00562): "[00562] = [01330] x [00558] / 100" (manuals/
# sociedades/2023 L24089, LIS art. 30 second paragraph); where 01033 and 01034 are
# empty "el importe de la casilla [01330] coincidirá con el de la casilla [00552]"
# (L23766-23767), which is the general "[00562] = [00552] x [00558]/100" of L13559.
# Always "una cantidad positiva o cero" (L13561), so a negative base gives zero. A cooperativa states its cuota íntegra from the cuota íntegra
# previa of its resultados cooperativos and extracooperativos (L25508), which this
# registry does not author, so it is refused; every other régimen the tipo de
# gravamen refuses leaves this box without a value through 00558.
[[revisions."2023".family_overrides]]
family = "formulas"
selector = {revision = "2022", id = "modelo-200-cuota-integra"}
fields = { expression = { args = [
    { op = "greater_than", args = [
        { op = "add", args = [
            { op = "text_equal", args = [
                { binding = "modelo-200-profile-legal-entity-form" },
                { text_literal = "cooperativa" },
            ] },
            { casilla_id = "00017" },
            { casilla_id = "00018" },
            { casilla_id = "00019" },
        ] },
        { literal = "0" },
    ] },
    { op = "unresolved_outcome", args = [{ text_literal = "m200-tax-regime-unsupported" }] },
    { op = "max", args = [
        { op = "percent", args = [{ casilla_id = "DP200014:01330" }, { casilla_id = "DP200014:00558" }] },
        { literal = "0" },
    ] },
] }}
sequence_additions = {legal_refs = ["ley-27-2014:art-101"], source_refs = ["aeat-dr-200-2023", "aeat-modelo-200-manual-2023"], source_citations = [{source_ref = "aeat-modelo-200-manual-2023", required_text = ["el tipo de gravamen de la casilla [00558]", "[00562] = [01330] x [00558] / 100", "el importe de la casilla [01330] coincidirá con el de la casilla [00552]", "El contenido de la casilla [00562] «Cuota íntegra» siempre deberá ser una cantidad positiva o cero"]}]}
