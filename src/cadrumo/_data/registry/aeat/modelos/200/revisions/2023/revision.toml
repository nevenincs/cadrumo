# Modelo 200, declaracion del Impuesto sobre Sociedades y del IRNR (establecimientos
# permanentes y entidades en regimen de atribucion de rentas constituidas en el
# extranjero con presencia en territorio espanol), for periodos impositivos
# iniciados en 2023.
#
# APPROVAL. Orden HAC/495/2024 (BOE-A-2024-10574, BOE de 27 de mayo de 2024) art. 1.1.a).1.o
# approves "Modelo 200: Declaracion del Impuesto sobre Sociedades y del Impuesto
# sobre la Renta de no Residentes (...), que figura en el anexo I" for the periodos
# impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2023; art. 1.2
# applies it with caracter general to every IS contribuyente. Art. 6.1 sets its
# plazo under LIS art. 124.1 and art. 3.2 the domiciliacion window.
#
# DESIGN. aeat-dr-200-2023 is AEAT's own diseno de registro for ejercicio 2023. Its sheets,
# boxes and captions differ from the 2024 design the edition after it carries, so
# this edition is authored from it rather than projected from 2024. The casillas
# are declared where this design prints them; the 2024 rows it does not print, or
# prints with another caption, stay undeclared and are recorded as debt in
# casillas/0001-declarations.toml.
#
# Grade: calculation. The Modelo 200 cuota chain (Liquidacion I-IV: base imponible
# previa [00550], base imponible [00552], base tras reserva de nivelacion [01330],
# tipo [00558], cuota integra [00562], cuota integra ajustada positiva [00582],
# cuota liquida [00592], cuota del ejercicio [00599], cuota diferencial [00611])
# is authored at the 2022 edition and inherited here, except where this design or
# the 2023 law differs: aeat-dr-200-2023 prints the base imponible block on DP200014
# and the otras deducciones block on DP200014B, one record later than the 2022 design,
# and adds the Illes Balears bonificacion [00815] to the cuota integra ajustada; Ley
# 31/2022 art. 39 adds the 23 % rate for INCN below 1 millon de euros. Those formulas,
# the rate and threshold parameters they read, and the verification members over the
# moved boxes are stated here. Every box they read or write is printed on the same
# record and with the same box number by aeat-dr-200-2023 as by the 2024 design, and
# the Manual practico de Sociedades 2023 states the same operations. The rates are
# those the manual's "Tipos de gravamen vigentes" table prints for contribuyentes 2023. This edition carries no export layout for the 2023 design,
# so it calculates but does not file: filing grade needs this year's own layout.
valid_from = 2023-01-01
