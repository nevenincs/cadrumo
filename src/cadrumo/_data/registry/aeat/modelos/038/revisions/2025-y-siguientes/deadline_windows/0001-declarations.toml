# Modelo 038 monthly deadline windows, grounded in orden-hac-66-2002 art 6: el plazo es el del mes natural siguiente a aquel al que la
# declaración está referida, con periodicidad mensual. Each window opens the
# 1st and closes the last natural day of the month following the reference month.
# THE 2026 WINDOWS WERE ADDED 2026-09-12. This revision is open-ended from 2025
# and the supported filing span runs to 2026, but only 2025 carried windows, so
# twelve months stood inside the span with no plazo. Same art 6 cadence quoted
# above: opens the 1st, closes the last natural day of the following month.

