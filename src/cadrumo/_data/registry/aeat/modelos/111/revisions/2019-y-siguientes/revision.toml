[revisions."2019-y-siguientes".family_dispositions.parameters]
reason = """
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. Modelo 111 applies none. Measured on the revision itself, both of its formulas are pure aggregation over already-withheld amounts: casilla 28 adds the nine per-block retencion casillas, and casilla 30 subtracts the prior-autoliquidacion result from it. Each block's retencion arrives as its own bound or manual casilla because the retenedor withheld it at payment time under the rate \
governing that payment, so the rate is spent before this modelo sees the figure. Contrast modelo 115, which DOES hold one: its casilla 03 is computed as percent(02, irpf.urban_rental_withholding_rate), so the rate is a value this registry must carry. Modelo 111 has no such value to hold, and the family is empty by the shape of its own calculation rather than by omission."""
legal_refs = [
    "ley-35-2006:art-99",
    "rd-439-2007:art-95",
    "rd-439-2007:art-80",
    "ley-35-2006:art-101",
]
source_refs = [
    "aeat-dr-111-2019-v18",
    "aeat-modelo-111-instructions",
]

[revisions."2019-y-siguientes".family_dispositions.dependency_classifications]
reason = """
A dependency classification declares which OTHER modelo's filing a value here derives from, and modelo 111 derives from none. It reports the retenciones the retenedor itself practised on rendimientos del trabajo, actividades economicas and the other satisfied percepciones of the period, aggregated from its own ledger rather than folded in from another return. The dependency in this family runs the OTHER way: modelo 190 is the annual resumen that summarises the 111 filings of the year, so it is \
190 that classifies a dependency on 111. Nothing upstream of 111 exists to classify, so the family is inapplicable by this modelo's position in the chain rather than merely unpopulated."""
