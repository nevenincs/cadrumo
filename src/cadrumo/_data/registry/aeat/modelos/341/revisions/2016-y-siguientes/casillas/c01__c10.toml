# Modelo 341 numbered casillas [01]-[10], transcribed from the bundled Diseno de
# Registro, source aeat-dr-341-2016, sha256
# 7bb06cb80b865993fa60fe6ecceae8d28da1126fae5174b56cbe2cf13b534600, sheet M34101.
# The record is 800 positions and its declared field lengths sum to exactly 800.
#
# AEAT repeats each concept across three rows and distinguishes them ONLY by box
# number: the design text for [01], [02] and [03] is byte-identical
# ("Compensacion: Importe de las operaciones"), as it is for [04]/[05]/[06] and
# for [07]/[08]/[09]. The compensation percentage is itself a DATA slot
# ([04]/[05]/[06]), not a label, so nothing in the design says which row carries
# which of the art. 130.Cinco LIVA percentages. No row is therefore named after a
# rate -- that identity is not stated by the source and is not invented here.
#
# [10] is left manual deliberately. AEAT's own text is
# "Importe total [07]+[08]+[09]... [10]" -- the trailing ellipsis is AEAT's, and
# it leaves the enumeration open, so declaring a closed add(07,08,09) formula
# would assert a summation the source does not close. Open question for tax
# review.

