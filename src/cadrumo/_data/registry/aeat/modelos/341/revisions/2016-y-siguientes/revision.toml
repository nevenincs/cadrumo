# Modelo 341 autoliquidación/solicitud del IVA, approved by orden-min-2000-12-15-m341 art
# 1 with its plazo grounded verbatim in orden-min-2000-12-15-m341 art 2.
# The numbered casillas [01]-[10] and the fichero-BOE export layout ARE now
# authored, transcribed position by position from the bundled diseño de registro
# aeat-dr-341-2016: 33 of 33 required positions across both of its records.
#
# The grade stays applicability, deliberately and conservatively: promoting it is
# an operator decision, and it is not made here on the strength of the layout
# landing.
#
# This revision is bounded to the exact source era of aeat-dr-341-2016. The
# materially different 619-position predecessor is authored separately. Filing
# years 2000-2004 resolve to no revision because no positional design is bundled.
