[revisions."2000-y-siguientes"]
authority_grade = "applicability"
# Modelo 341 autoliquidación/solicitud del IVA, approved by orden-min-2000-12-15-m341 art
# 1 with its plazo grounded verbatim in orden-min-2000-12-15-m341 art 2.
# The numbered casillas [01]-[10] and the fichero-BOE export layout ARE now
# authored, transcribed position by position from the bundled diseño de registro
# aeat-dr-341-2016: 33 of 33 required positions across both of its records.
#
# The grade stays applicability, deliberately and conservatively: promoting it is
# an operator decision, and it is not made here on the strength of the layout
# landing.
#
# ERA GAP, open for operator decision: this revision claims 2000 onwards, but the
# only diseño de registro AEAT publishes for Modelo 341 is titled "Ejercicio 2016
# y siguientes" and its source declares applies_from 2016-01-01. Filing years
# 2000-2015 are therefore governed by this revision while no record design covers
# them, and the authored layout is faithful only from 2016. AEAT publishes no
# earlier design, so there is nothing to transcribe for that span; closing the
# gap means either bounding this revision at 2016 or accepting that pre-2016
# years carry a layout whose fidelity is unverified.
valid_from = 2000-01-01
period_selector = { year_from = 2000, periods = ["1T", "2T", "3T", "4T"] }
orden_aplicabilidad = ["orden-min-2000-12-15-m341:art-1"]
legal_refs = [
    "orden-min-2000-12-15-m341:art-1",
    "orden-min-2000-12-15-m341:art-2",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-341-procedure",
    "enrolled-modelo-341-layout",
    "aeat-dr-341-2016",
]
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19

[revisions."2000-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2000-y-siguientes' of modelo 341 has no strictly-earlier sibling revision of this modelo (valid_from 2000-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
