# Modelo 341 fichero-BOE export layout, transcribed position by position from the
# bundled Diseno de Registro, source aeat-dr-341-2016, sha256
# 7bb06cb80b865993fa60fe6ecceae8d28da1126fae5174b56cbe2cf13b534600.
#
# Two records, matching the design's two sheets:
#   M34100 -- file envelope. Variable total length by design (its campo 14 is the
#             page payload and its campo 15 has no fixed position), so only the
#             fixed head positions 1-328 are addressable.
#   M34101 -- pagina 01. 800 positions; the design's declared field lengths sum to
#             exactly 800 (verified against its own "TOTAL 800 POSICIONES" row).
#
# Render shape follows the design's own notes on sheet M34101:
#   Nota 2  alphanumeric (An): left-aligned, right-filled with blanks.
#   Nota 3  numeric (Num): right-aligned, left-filled with zeros.
#   Nota 4/5 signed numeric (N) carries "N" in position 1 for negatives. Every
#           numbered slot on this record is declared "Num", not "N", so no field
#           here is signed.
# Nota 1 fixes the only admitted tipo de declaracion for batch presentation:
# "D (Devolucion)".
#
# COVERAGE: 30 of the 33 positions the official design requires. The three
# unwritten positions are named gaps, each marked KNOWN GAP below, and each is a
# slot for which this project holds no honest value:
#   @93+4   Version del Programa      (Nota 1, entidad desarrolladora)
#   @101+9  NIF Empresa Desarrollo    (Nota 1, entidad desarrolladora)
#   @277+11 SWIFT                     (no BIC producer key exists)
# None is filled with a filler. A filler at these coordinates would emit the
# identical bytes -- the renderer space-fills every record before writing fields
# -- while making the coverage gate count the position as written. The gate
# cannot see through that, so the honest figure is 30/33 with three gaps rather
# than 33/33 with three blanks.

