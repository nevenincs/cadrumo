# KNOWN GAP 1 of 3, deliberate and reported. Positions 93-96, "Version del
# Programa", are one of this design's two "Nota 1" slots; Nota 1 assigns both to
# the entidad desarrolladora del software ("Debe consignarse el identificador de
# la version del SW desarrollado por la ED"). No entidad-desarrolladora identity
# is declared anywhere in this project, so the slot is left UNWRITTEN rather than
# guessed -- the treatment Modelo 131 committed for the same two slots of the
# same AEAT envelope grammar.
#
# Unwritten rather than filler, deliberately. The record renderer pre-fills every
# record with spaces and writes fields at their offsets, so an omitted span and a
# right_space filler emit byte-identical output. The only thing a filler would
# change is that the coverage gate would count the position as WRITTEN. That is
# coverage no datum earned, so the position is omitted and reported as a gap.

[[revisions."2000-y-siguientes".export_layouts.records.fields]]
id = "modelo-341-envelope-reserved-2"
offset = 97
length = 4
kind = "filler"
data_type = "text"
required = false
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-min-2000-12-15-m341:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-341-2016"]

# KNOWN GAP 2 of 3, deliberate and reported. Positions 101-109, "NIF Empresa
# Desarrollo", are the second "Nota 1" slot: the NIF of the entidad
# desarrolladora del SW. The presenter is NOT the software developer, so writing
# presenter.tax_id here would put a wrong identity into a slot AEAT defines for
# someone else -- inventing an identity by misattribution rather than by making
# one up, but inventing it either way. Left UNWRITTEN, as Modelo 131 does.

[[revisions."2000-y-siguientes".export_layouts.records.fields]]
id = "modelo-341-envelope-reserved-3"
