# Modelo 341 REAGP quarterly windows, grounded in orden-min-2000-12-15-m341 art 2:
# los veinte primeros días naturales posteriores a cada trimestre natural (1T-3T),
# y los treinta primeros días naturales del mes de enero para el 4T.
# THE 2022, 2023 AND 2024 WINDOWS WERE ADDED 2026-09-12. This revision is
# open-ended from 2016 and the supported filing span opens at 2022, but only
# 2025 onward carried windows, leaving twelve quarters with no plazo. Same art 2
# cadence quoted above, including the 4T exception that closes 30 January rather
# than the 20th.

