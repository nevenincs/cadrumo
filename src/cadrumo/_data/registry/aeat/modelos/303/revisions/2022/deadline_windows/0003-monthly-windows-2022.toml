# NO payment_cutoff_on ON THIS ROW, AND THAT IS AUTHORED RATHER THAN MISSING.
# The 2022 calendar does not list December among its domiciliacion exceptions,
# so the literal rule ("1 al 25 de cada mes") yields 25 December 2022 -- Christmas
# Day, a Sunday. The calendar publishes no December domiciliacion coordinate
# anywhere to read instead. The 2023 sibling shows AEAT moving the equivalent
# date (2023-12-26), but inferring 2022 from that is deriving, not reading.
# A sweep for null cutoffs will land here: this is the one it should skip.
