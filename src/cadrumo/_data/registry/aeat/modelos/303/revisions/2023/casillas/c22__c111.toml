semantic_role = "dr303_60"
continuidad_id = "dr303-60"
required = false
input_kind = "bound"
binding = "modelo-303-casilla-60-exportaciones-base"
# Casilla 60 reports the base imponible of exempt exports and operations
# treated as exports. The substantive grounds are LIVA art. 21 (exenciones en
# las exportaciones de bienes) for the "Exportaciones" leg and art. 22
# (exenciones en las operaciones asimiladas a las exportaciones) for the
# "operaciones asimiladas" leg the label names. Both are exempt (zero cuota),
# so the repercusión/deducción articles 88/92 do not apply — base-only box.
legal_refs = ["ley-37-1992:art-21", "ley-37-1992:art-22", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2023"]
export_refs = ["m303-2023.dp30303.f006"]

[[revisions.2023.casillas]]
id = "120"
number = "120"
section = ["iva", "resultado"]
data_type = "money"
semantic_role = "dr303_120"
continuidad_id = "dr303-120"
required = false
input_kind = "bound"
binding = "modelo-303-casilla-120-no-sujetas-localizacion-base"
# Casilla 120 reports the base of operations Spain does not tax because the
# place-of-supply rules locate them elsewhere. The substantive ground is LIVA
# art. 69 (Uno.1), not the repercusión/deducción articles 88/92 that stood here
# as a generic default: a NO SUJETA operation never entered the hecho imponible,
# so nothing is repercutido and nothing is deducible. Same correction, and for
# the same reason, as casillas 59 and 122.
legal_refs = ["ley-37-1992:art-69", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2023"]
export_refs = ["m303-2023.dp30303.f007"]

[[revisions.2023.casillas]]
id = "122"
number = "122"
section = ["iva", "resultado"]
data_type = "money"
semantic_role = "dr303_122"
continuidad_id = "dr303-122"
required = false
input_kind = "bound"
binding = "modelo-303-casilla-122-inversion-sujeto-pasivo-base"
# Casilla 122 reports the base imponible of the SUPPLIER's side of a domestic
# reverse charge. The substantive ground is LIVA art. 84.Uno.2.º (the recipient
# is the sujeto pasivo), not the repercusión/deducción articles 88/92 that stood
# here as a generic default — this supplier repercutes nothing and deducts
# nothing, which is the entire point of the box. Same correction, and for the
# same reason, as the one already applied to casilla 59.
legal_refs = ["ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2023"]
export_refs = ["m303-2023.dp30303.f008"]

