# The 2022 design (aeat-dr-303-2022, DP30301 fields 40-42) already prints
# the base/rate/cuota rung [16]/[17]/[18], and field 51 adds [18] to [27].
# Its rate field is free rather than a design constant; LIVA art. 161.3 still
# governs the super-reduced population's 0.50 percent recargo. Leaving [18]
# manual dropped that population from a ledger-driven filing and its total.
[[revisions.2022.bindings]]
id = "modelo-303-recargo-equivalencia-super-reducido-cuota"
provider = { kind = "ledger_iva_aggregation", categories = ["domestic_super_reduced"], rate_kinds = ["super_reduced"], flow_direction = "repercutido", fact = "recargo_amount_sum", observation_roles = ["settlement"], cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"] }
value = { data_type = "money", channel = "decimal" }
legal_refs = ["ley-37-1992:art-161", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]

[[revisions.2022.bindings.source_citations]]
source_ref = "aeat-modelo-303-procedure"
required_text = ["modelo 303"]

[revisions.2022.bindings.aggregation]
op = "sum"
