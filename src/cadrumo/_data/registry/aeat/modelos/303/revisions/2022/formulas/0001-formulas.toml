# Casilla 27 = suma de [03]+[06]+[09]+[11]+[13]+[15]+[18]+[21]+[24]+[26] (Orden
# EHA/3786/2008, instrucciones casilla 27). The recargo de equivalencia cuota
# tiers (casillas 18/21/24, LIVA art. 161) are bound from the ledger
# (modelo-303-recargo-equivalencia-{super-reducido,reducido,general}-cuota) but
# were omitted from this aggregate on the 2022 revision (filing
# years 2022), so a supplier that charges recargo to a recargo-de-
# equivalencia customer had its recargo cuota silently excluded from "Total
# cuota devengada" (casilla 27) and therefore from the resultado chain —
# mirroring the identical defect fixed on the later explicit record-design revisions (see
# the comment on modelo-303-iva-cuota-devengada-total in that revision's
# formulas/0000-formulas.toml). Casillas 25/26 (modificacion bases y cuotas
# recargo) and casilla 158 (recargo super-reducido 0.5pct) have no ledger
# binding wired into this aggregate on either revision and remain out of scope
# of this fix, matching the later explicit record-design templates exactly.
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-161", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
