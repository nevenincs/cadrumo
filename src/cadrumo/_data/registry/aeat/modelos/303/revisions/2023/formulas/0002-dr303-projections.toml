# M303 official Diseño-de-Registros box projections (Stage 2).
#
# Each official numbered cuota box restates an already-computed semantic
# aggregate. The canonical mechanism is a single-source PROJECTION: a computed
# formula whose expression is the ONE semantic casilla-id leaf, evaluated by the
# existing _evaluate_leaf primitive after the semantic source is computed (the
# topological sorter orders the projection after a computed-target source; a
# bound-casilla source is already in the initial-values map). NO binding, NO
# ledger re-selection, NO relation, NO previous_filing carry — one value keeps
# exactly one aggregation path (aeat-calculation-aggregation,
# aeat-calculation-aggregation). Each projection carries the box's own
# legal_refs verbatim (aeat-calculation-grounding). Registered by id
# in revision.toml's formulas list; the directory-mode loader merges this
# fragment into revisions.formulas.

