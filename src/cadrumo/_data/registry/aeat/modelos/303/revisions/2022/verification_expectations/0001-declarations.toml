# Exhaustive reconcile-when-present verification for Modelo 303
# revision 2022: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-303-iva-chain-verification).
# The deducible boxes [28]-[41] are situational: a filer without that kind of
# purchase leaves them blank. [45] and [71] are printed on every return, but
# this revision's coverage-gated contract already reconciles what they are
# computed from ([45] restates iva.cuota-deducible-total, [71] is iva.resultado
# less [70]), so they are reconciled here without widening the 2022 coverage
# denominator. From 2023 the gated contract names [45] and [71] itself and the
# delta takes them out of this list.
[[revisions."2022".verification_expectations]]
id = "modelo-303-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "iva.prorrata-porcentaje",
    "28",
    "29",
    "30",
    "31",
    "33",
    "37",
    "40",
    "41",
    "45",
    "71",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2022", "aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]
