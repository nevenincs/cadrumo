# Casilla 27 = suma de [03]+[06]+[09]+[11]+[13]+[15]+[18]+[21]+[24]+[26] (Orden
# EHA/3786/2008, instrucciones casilla 27). The recargo de equivalencia cuota
# tiers (casillas 18/21/24, LIVA art. 161) are bound from the ledger
# (modelo-303-recargo-equivalencia-{super-reducido,reducido,general}-cuota) but
# were omitted from this aggregate, so a supplier that charges recargo to a
# recargo-de-equivalencia customer had its recargo cuota silently excluded from
# "Total cuota devengada" (casilla 27) and therefore from the resultado chain —
# grounded and cross-validated against four independent AEAT Manual practico
# IVA 2024 worked examples (Cap. 9 "La declaracion-resumen anual. Modelo 390"),
# each of which explicitly sums its own "Recargo de equivalencia" line into its
# printed "TOTAL CUOTA DEVENGADA" (1T: 17.430+1.248+4.410=23.088; 2T:
# 19.110+4.410+624-2.520=21.624; 3T: 19.782-1.260+1.248+2.520=22.290; 4T:
# 21.420-630+624=21.414). Casillas 25/26 (modificacion bases y cuotas recargo)
# have no ledger binding yet and are not summed here; they remain out of scope
# of this fix.
# The two RD-ley 4/2024 transitional rungs. The diseño's own printed sum for
# casilla 27 enumerates their cuota boxes ([155] and [167]) alongside the
# ordinary tiers, so splitting a transitional row out of its tier carrier and
# omitting it here would move the cuota off the return entirely.
# The recargo rungs the aggregate omitted. AEAT's own printed formula for [27]
# enumerates [158] and [26] in EVERY design this revision spans (2023 and 2025
# both), and [170] from the 2024-late design onward, so their absence here was a
# gap rather than a scoping choice.
#
# [158] is the one that costs money today. It is bound, so a super-reducido
# recargo cuota already reaches that box -- but the box never reached this total,
# so the amount was declared on the face of the return and omitted from the
# figure the resultado chain uses. That is an under-declaration for any recargo
# filer with super-reducido supplies, and it is independent of the separate
# defect that [158] is the wrong rung for that population (AEAT mandates it as
# 1,75 % tabaco; the 0,5 % box is [170]).
#
# [170] contributes nothing until something populates it, and is added now so the
# total stays correct on both sides of that box move rather than needing a second
# edit at the moment the cuota relocates.
# [15] modificacion de bases y cuotas (LIVA art. 80: impagados, devoluciones,
# alteraciones de precio). Operator-entered, exported to its own box, and printed
# by AEAT inside [27] in every design this revision spans -- but it was reaching
# no total, the same shape as [158]. It carries a SIGN, so omitting it does not
# fail in one direction: a negative art. 80 adjustment left out over-states the
# cuota owed, which is the direction little else here watches.
# [152] is the 0 % rung's cuota, arithmetically zero by construction. Summed
# anyway so this aggregate enumerates exactly what AEAT prints, rather than
# relying on a reader to know which omissions are harmless.
# NOT summed, deliberately: [11]. It projects
# iva.autorepercutido.intracomunitaria.devengado, an official-box PARITY casilla,
# while iva.autorepercutido.intracomunitaria already books that same cuota into
# this total. AEAT prints [11] in its formula because its boxes decompose the
# figure; adding it here would count the AIC cuota twice. The rationale is on the
# casilla definitions themselves.
# M303 official Diseño-de-Registros box projections (Stage 2).
#
# Each official numbered cuota box restates an already-computed semantic
# aggregate. The canonical mechanism is a single-source PROJECTION: a computed
# formula whose expression is the ONE semantic casilla-id leaf, evaluated by the
# existing _evaluate_leaf primitive after the semantic source is computed (the
# topological sorter orders the projection after a computed-target source; a
# bound-casilla source is already in the initial-values map). NO binding, NO
# ledger re-selection, NO relation, NO previous_filing carry — one value keeps
# exactly one aggregation path (aeat-calculation-aggregation,
# aeat-calculation-aggregation). Each projection carries the box's own
# legal_refs verbatim (aeat-calculation-grounding). Registered by id
# in revision.toml's formulas list; the directory-mode loader merges this
# fragment into revisions.formulas.
# Rate (Tipo %) formulas for the two transitional rungs. See
# parameters/0002-dr303-transitional-rate-percent.toml for the dated windows
# and the grounding chain (RDL 20/2022:art-72 opens the window from
# 2023-01-01, RDL 4/2024:art-1 grounds the 7,5 %/2 % follow-on step).

