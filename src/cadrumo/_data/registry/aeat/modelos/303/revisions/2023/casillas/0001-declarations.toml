semantic_role = "iva_base_autorepercutida_intracomunitaria_devengado"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "Sole base-imponible parity casilla for the AIC devengado box pair (10/11); no sibling rate or category split exists on this casilla."
