# Cuota carriers for the two RD-ley 4/2024 transitional rungs of the
# régimen-general devengado block. They are siblings of the three ordinary-tier
# carriers above, not replacements: each transitional rate coexists with its
# tier's ordinary rate, so the tier alone cannot separate them and AEAT gives
# each its own rung with its own mandated Tipo % constant.
[[revisions.2023.casillas]]
id = "iva.repercutido.reducido.transitorio"
continuidad_origin = "not_on_form"
continuidad_evidence = "aeat-dr-303-2023 publica el tramo de regimen general [153]-[155]. Esta fila es el acumulador de cuota transitoria que alimenta la casilla numerada mediante modelo-303-iva-repercutido-reducido-transitorio-cuota; no es otra casilla impresa ni una sustitucion de la cuota al tipo ordinario."
number = "iva.repercutido.reducido.transitorio"
section = ["iva", "regimen_general", "devengado"]
semantic_role = "iva_cuota_repercutida_reducido_transitorio"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "RD-ley 4/2024 transitional reducido rates (5pct, then 7,5pct from 10/4T 2024) coexist with the ordinary 10pct rate rather than replacing it, so this is a genuine second reducido carrier on its own AEAT rung, not a typo twin."
continuidad_id = "iva-cuota-repercutida-reducido-transitorio"
input_kind = "bound"
binding = "modelo-303-iva-repercutido-reducido-transitorio-cuota"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-91", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]

# Base-imponible parity casilla for official box 10, mirroring the cuota
# parity casilla above (box 11). Feeds box 10 via a projection formula only --
# never the resultado, which is cuota-denominated and already carries this
# quantity's tax through iva.autorepercutido.intracomunitaria.
[[revisions.2023.casillas]]
id = "iva.autorepercutido.intracomunitaria.devengado.base"
continuidad_origin = "not_on_form"
continuidad_evidence = "aeat-dr-303-2023, campos 40 y 41, distingue base [10] y cuota [11] de adquisiciones intracomunitarias. Esta fila es la entrada de agregacion que la formula proyecta en [10]; no constituye una segunda casilla impresa."
number = "iva.autorepercutido.intracomunitaria.devengado.base"
