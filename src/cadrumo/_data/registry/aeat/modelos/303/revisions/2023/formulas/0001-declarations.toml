# Orden HAC/819/2024 art. 1 (Modelo 303 2023+): casilla [64] = [46] + [58] + [76].
#   [46] = resultado régimen general (LIVA arts. 88, 92)
#   [58] = resultado régimen simplificado (LIVA arts. 122-124)
#   [76] = regularización cuotas art. 80.Cinco.5ª LIVA (rectificación)
