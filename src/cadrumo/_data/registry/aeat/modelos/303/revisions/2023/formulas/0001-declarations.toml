id = "modelo-303-iva-atribuible-estado"
target_casilla_id = "66"
rounding = "money-2"
# Orden HAC/819/2024 art. 1 (Modelo 303 2023+): casilla [66] = [64] × [65] / 100.
#   [64] = suma de resultados (total neto IVA antes de apportionment)
#   [65] = porcentaje atribuible a la Administración del Estado (operator-input ratio)
# The foral-territory apportionment is encoded by the operator entering [65].
# For taxpayers in territorio común, [65] = 100 and [66] = [64].
# Formula: [66] = [64] × ([65] / 100).
# Source: aeat-modelo-303-procedure (instrucciones casilla 66) and boe-modelo-303-2008-form.
legal_refs = ["rd-1624-1992:art-71"]
source_refs = ["aeat-dr-303-2023", "boe-modelo-303-2008-form", "aeat-modelo-303-procedure"]

