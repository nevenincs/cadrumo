# Third-country import IVA deducible (importación de bienes). IVA devengado on the
# import is settled at customs (DUA) and never reaches M303; only the deducible leg
# (official boxes 32 base / 33 cuota) appears here. NOT net-zero — a real deduction
# with no offsetting M303 devengado. Grounded in LIVA art. 17 (hecho imponible
# importaciones) + art. 92 (cuotas deducibles). An operator classifying a ledger
# transaction as IMPORT_THIRD_COUNTRY with an iva_amount projects a SOPORTADO
