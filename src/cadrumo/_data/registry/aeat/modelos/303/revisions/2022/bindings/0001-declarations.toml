# Bienes de inversión split of the deducible side (official boxes [30]/[31],
# [34]/[35] and [38]/[39]). Every diseño de registro from the 2022 one onwards
# gives the cuota soportada on bienes de inversión its own base/cuota pair beside
# the corrientes one, and box [45] adds [31] and [35] to [29] and [33]; the
# Manual práctico de IVA worked example (capítulo 9, Modelo 390) liquidates the
# interior bien de inversión on its own line for the same reason. The ledger
# row cannot be told apart by category, rate or flow -- an ordenador and a ream
# of paper are both domestic_general soportado -- so each pair is selected on the
# row's fact-0085 deduction kind, the reciprocal identity a bien de inversión
# (LIVA art. 108) carries to its bienes-inversion register record. The
# corrientes bindings above name the complementary kinds, so every deducible row
# still reaches exactly one box of each pair. Rectifications reach neither pair:
