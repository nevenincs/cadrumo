# Printed-total consistency for [27]. Restates the 2023 printed-total predicate
# with this design's addends. The 2024 design for periods from 09 and 3T
# (aeat-dr-303-2024-late, campo 60, posicion 617) defines "Total cuota devengada
# ( [152] + [167] + [03] + [155] + [06] + [09] + [11] + [13] + [15] + [158] +
# [170] + [18] + [21] + [24] + [26] ) [27]", adding [167] and [170] to the 2023
# list. The 2025 design (aeat-dr-303-2025, campo 60, posicion 617) and the 2026
# design (aeat-dr-303-2026, campo 67, posicion 696) print the same list, so 2025
# and 2026-y-siguientes inherit this declaration unchanged.
[[revisions.2024-desde-09-y-3t.verification_predicates]]
id = "equals-sum:dr303-27-equals-printed-summands"
predicate_id = "modelo-303-dr303-27-equals-printed-summands"
expression = 'equals_sum(["27", "152", "167", "03", "155", "06", "09", "11", "13", "15", "158", "170", "18", "21", "24", "26"])'
legal_refs = ["ley-37-1992:art-88", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
