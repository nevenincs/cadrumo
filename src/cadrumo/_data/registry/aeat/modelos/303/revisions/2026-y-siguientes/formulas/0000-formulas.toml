# Casilla 27 = suma de [03]+[06]+[09]+[11]+[13]+[15]+[18]+[21]+[24]+[26] (Orden
# EHA/3786/2008, instrucciones casilla 27). The recargo de equivalencia cuota
# tiers (casillas 18/21/24, LIVA art. 161) are bound from the ledger
# (modelo-303-recargo-equivalencia-{super-reducido,reducido,general}-cuota) but
# were omitted from this aggregate, so a supplier that charges recargo to a
# recargo-de-equivalencia customer had its recargo cuota silently excluded from
# "Total cuota devengada" (casilla 27) and therefore from the resultado chain —
# grounded and cross-validated against four independent AEAT Manual practico
# IVA 2024 worked examples (Cap. 9 "La declaracion-resumen anual. Modelo 390"),
# each of which explicitly sums its own "Recargo de equivalencia" line into its
# printed "TOTAL CUOTA DEVENGADA" (1T: 17.430+1.248+4.410=23.088; 2T:
# 19.110+4.410+624-2.520=21.624; 3T: 19.782-1.260+1.248+2.520=22.290; 4T:
# 21.420-630+624=21.414). Casillas 25/26 (modificacion bases y cuotas recargo)
# have no ledger binding yet and are not summed here; they remain out of scope
# of this fix.
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-161", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
