# Tipo % values for boxes [154] and [166]. This revision's own bundled
# diseño declares both constants as `Constante "00000"`: the RD-ley 4/2024
# transitional windows ended on 31 December 2024, so the 2025 design
# mandates zero and the rungs carry no rate this revision's filing periods
# can lawfully resolve to. The dated 2024-pinned windows belong to the two
# 2024-covering revisions and to no other.
# The universal statutory one-percent difficult-justification deduction.
# Annual module coefficients and cuota-minima percentages live only in the
# source-pinned M303 annual Orden projection.
# LIVA arts. 107 and 109 capital-goods regularisation figures, declared as
# registry parameters so the calculation resolves them from the authority
# rather than from a Python constant. Grounded in the same legal and source
# refs as this revision's own binding 'modelo-303-bienes-inversion-regularizacion-casilla-43', which consumes them.
#
# Declared on the FILING-PERIOD axis and bounded to this revision's window.
# These figures are fixed at ACQUISITION for a given good, not at filing, so a
# SECOND dated value here would silently apply new law to an old good. The
# single-value shape is gated; the day a figure moves, that gate fails and the
# work routes to a proper acquisition-axis declaration instead.
# LIVA art. 107.Uno regularisation window for a non-real-property capital good.
# Corpus wording: deberán regularizarse durante los cuatro años naturales siguientes
# LIVA art. 107.Tres regularisation window for terrenos o edificaciones.
# Corpus wording: deberán regularizarse durante los nueve años naturales siguientes
# LIVA art. 109.3a per-year divisor for a non-real-property capital good.
# Corpus wording: se dividirá por cinco o, tratándose de terrenos o edificaciones, por diez
# LIVA art. 109.3a per-year divisor for terrenos o edificaciones.
# Corpus wording: se dividirá por cinco o, tratándose de terrenos o edificaciones, por diez
# LIVA art. 107.Uno de-minimis: regularise only above this many points.
# Corpus wording: exista una diferencia superior a diez puntos
# art. 107 "superior a diez puntos"
# LIVA art. 103.Dos.2 mandatory prorrata especial margin, declared as registry
# data so neither the figure nor the COMPARISON DIRECTION lives in Python.
#
# The provision has had exactly two redactions and they differ on both axes:
# the original (in force to 31-12-2014) required the general-regime deduction
# to exceed the especial-regime one "en un 20 por 100", with no "o mas" and so
# EXCLUSIVE; Ley 28/2014 art. 1.26 (in force from 01-01-2015) replaced it with
# "en un 10 por ciento o mas", lowering the margin AND making it inclusive.
#
# Only the CURRENT redaction is declared. No revision of this modelo covers a
# pre-2015 filing year, and the bundled consolidated corpus carries only the
# text in force, so the repealed redaction has no citable authority here. The
# calculation refuses a pre-2015 ejercicio by name rather than resolving it
# from a figure nothing in this tree can ground.
#
# Corpus wording: exceda en un 10 por ciento o más del que resultaría por aplicación de la regla de prorrata especial
# art. 103.Dos.2 "o mas" reaches the margin

