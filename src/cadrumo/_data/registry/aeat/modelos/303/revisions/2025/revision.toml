# Quarterly periods for standard autoliquidacion; monthly periods for
# monthly IVA-liquidation taxpayers (REDEME or large-company status).
# RD 1624/1992 art. 71.3 gives this modelo a trimestral or mensual periodo only,
# and the PP field of the design admits 1T-4T and 01-12. The annual settlement is
# modelo 390, which carries the 0A period; 303 never files at 0A itself.
