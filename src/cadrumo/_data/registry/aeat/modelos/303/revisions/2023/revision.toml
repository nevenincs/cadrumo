[revisions.2023]
# Prepared and reviewed by an agent against the bundled diseño de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement:
#   - every casilla legal_ref and source_ref resolves to the legal catalogue, and
#     every cited source's corpus file is present on disk;
#   - every formula targets a casilla of this revision;
#   - every enrolled schema family resolves;
#   - every cited source's applicability window overlaps this revision's own life;
#   - and all 6 fixed-width record(s) of the DERIVED layout were paired to
#     their design sheet and cover it: no design DATA position is left
#     unaddressed, and none reaches past its declared record length.
#
# The coverage figure is measured on the layout AFTER binding derivation, which
# is what the renderer and the completeness gate consume; the raw export_layouts
# collection holds only inline fields and reading it understates coverage badly.
#
# This stamp claims no fresh-render reproduction evidence: that belongs to the
# revisions enrolled in the generated-tree drift gate, and this one is not.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
valid_from = 2023-01-01
valid_to = 2023-12-31
orden_aplicabilidad = ["orden-eha-3786-2008:art-1"]
legal_refs = ["rd-1624-1992:art-71", "orden-eha-3786-2008:art-1", "orden-eha-3786-2008:art-7"]
source_refs = [
    "aeat-dr-303-2023",
    "aeat-modelo-303-procedure",
    "boe-orden-hfp-1172-2022-iva-authority",
    "boe-modelo-303-2008-form",
]

