# The universal statutory one-percent difficult-justification deduction, for the
# filing periods this revision governs (2022 1T through 4T). Annual module
# coefficients and cuota-minima percentages live only in the source-pinned M303
# annual Orden projection, not here.
#
# GROUNDING: ley-37-1992:art-123 (LIVA art. 123) is the permanent statutory basis
# and is not year-scoped. The annual Orden that fixes the 2022 modules is Orden
# HFP/1335/2021, already declared among this revision's own source_refs, and its
# bundled consolidated text carries the clause verbatim -- verified by reading
# corpus/normatives/html/orden-hfp-1335-2021.html rather than by transcribing it
# from a sibling revision.
#
# The RD-ley 20/2022 transitional reducido rate is deliberately NOT declared
# here: it opens on 1 January 2023 and therefore governs no filing period of this
# revision. It belongs to the 2023 and 2024-covering revisions, which declare it.

