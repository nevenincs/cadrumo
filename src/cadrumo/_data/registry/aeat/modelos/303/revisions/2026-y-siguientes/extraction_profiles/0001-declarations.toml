[[revisions."2026-y-siguientes".extraction_profiles]]
id = "modelo-303-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaracion"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parser.parse_declaracion"
target_casillas = [
    # This profile targets only what the AEAT form PRINTS.
    #
    # The per-rate cuota primitives (iva.repercutido.*, iva.autorepercutido.*,
    # iva.soportado.interiores, iva.autoconsumo.promotor.base) are deliberately
    # ABSENT. The printed form carries the devengado section positionally, as
    # base/tipo/cuota rows, and never labels a per-rate cuota — the labels this
    # profile used to match existed only in this project's own fixture
    # generator, so the profile was satisfiable by the generated corpus and
    # refused by every real render. Verified against the four bundled AEAT
    # manual annex quarters: zero occurrences of any such label.
    #
    # The engine still computes iva.cuota-devengada-total and
    # iva.cuota-deducible-total FROM those primitives; it obtains them from
    # ledger aggregation on the calculate path, not from this document.
    # Printed boxes 27/45 are projections of those computed totals and cannot
    # be supplied as engine inputs.
    {casilla_id = "27", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Total\s+cuota\s+devengada'},
    {casilla_id = "29", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Por\s+cuotas\s+soportadas\s+en\s+operaciones\s+interiores\s+corrientes'},
    {casilla_id = "37", match_strategy = "named_label", value_kind = "amount", label_pattern = 'En\s+adquisiciones\s+intracomunitarias\s+de\s+bienes\s+y\s+servicios\s+corrientes'},
    {casilla_id = "45", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Total\s+a\s+deducir'},
    {casilla_id = "iva.resultado-regimen-general", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+r[eé]gimen\s+general\s+\(27\s*-\s*45\)'},
    {casilla_id = "64", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Suma\s+de\s+resultados'},
    {casilla_id = "66", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Atribuible\s+a\s+la\s+Administraci[oó]n\s+del\s+Estado'},
    {casilla_id = "iva.compensacion-pendiente-periodos-anteriores", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Cuotas\s+a\s+compensar\s+pendientes\s+de\s+periodos\s+anteriores'},
    {casilla_id = "iva.compensacion-aplicada-periodo", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Cuotas\s+a\s+compensar\s+de\s+periodos\s+anteriores\s+aplicadas\s+en\s+este\s+periodo'},
    {casilla_id = "iva.compensacion-pendiente-periodos-posteriores", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Cuotas\s+a\s+compensar\s+de\s+periodos\s+previos\s+pendientes\s+para\s+periodos\s+posteriores\s+\(110\s*-\s*78\)'},
    {casilla_id = "iva.resultado", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+de\s+la\s+autoliquidaci[oó]n\s+\(66[^\)]*\)'},
    {casilla_id = "71", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+\(69\s*-\s*70\s*\+\s*109\)'},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
# 10/12 — the highest floor all four bundled AEAT manual annex quarters satisfy.
# Measured against the 12 printed targets above: 1T 12/12, 2T 11/12, 3T 11/12,
# 4T 10/12. The shortfalls are legitimately blank optional boxes (78 in 2T-4T,
# 37 in 4T), so the floor must admit them. Anything above 10/12 refuses 4T;
# anything above 11/12 also refuses 2T and 3T.
#
# This is a REDUCTION IN WHAT THE PARSER CLAIMS, not a weakened gate: at "1"
# the profile demanded six values the document does not contain and refused
# every real render. Note the synthetic corpus scores 1.0 at ANY floor, so this
# number can only be validated against the annex quarters.
min_coverage = "0.8333"
failure_semantics = "fail_hard"
# Must equal exactly the union of the target casillas' own legal_refs. Dropping
# the primitive targets drops LIVA art. 9 and art. 79 (autoconsumo) and art. 84
# (inversión del sujeto pasivo) with them: the profile no longer claims to read
# an autoconsumo base or a reverse-charge cuota off the page.
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "ley-37-1992:art-94", "ley-37-1992:art-95", "ley-37-1992:art-99", "ley-37-1992:art-115", "ley-37-1992:art-116", "ley-37-1992:art-122", "ley-37-1992:art-123", "ley-37-1992:art-124", "rd-1624-1992:art-29", "rd-1624-1992:art-30", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2026", "aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]
