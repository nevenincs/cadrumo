# The 2024-late DP30302 design introduced temporary DANA and Lorca eligibility
# and reduction fields. The 2025 design replaces their complete position spans
# with fields f094, f121, and f148 marked reserved for the AEAT. No 2025 or 2026
# projection carries these meanings, so the twelve inherited endpoint
# identifiers retire at the 2025 boundary.

