# M303 régimen simplificado de IVA módulos coefficient tables (cuota
# devengada por operaciones corrientes + cuota mínima). Keyed-bracket-table
# parameters mapping "<epígrafe IAE>:<módulo>" to the "cuota devengada anual
# por unidad" (Orden HAC/1347/2024 Anexo I) and "<epígrafe IAE>" to the cuota
# mínima percentage (Orden HAC/1347/2024 Anexo II). Lookup is exact-match on
# the composite/single key; there is no interval-overlap semantics because
# the domain is a discrete (epígrafe, módulo) catalogue, not a
# numeric-continuous base.
#
# Only activities GROUNDED and cross-checked against the bundled corpus are
# tabled here; the ~80+-activity Orden Anexo I remains an incremental
# authoring backlog. An epígrafe absent from this table is NOT computed by
# the engine; casilla 48 stays reachable as a manual operator input and the
# "modelo-303-2023-modulos-iva-computed-diverges-de-c48" advisory fires
# instead of a silent zero.
#
# Currently tabled: transporte por autotaxis (721.2), transporte de
# mercancías por carretera, excepto residuos (722), peluquería (972.1) —
# highest-prevalence activities, cross-checked available for IVA in the same
# Orden.
#
# Cross-checked against the bundled consolidated Orden HAC/1347/2024 (IVA
# Anexo I module tables, corpus/normatives/html/orden-hac-1347-2024.html) —
# the "Cuota devengada anual por unidad" figures for 721.2/722/972.1 are
# distinct euro amounts from the IRPF "Rendimiento anual por unidad" figures
# for the SAME epígrafes (a different Orden annex; the IVA módulo set for
# 721.2 and 722 carries only 2 signos — personal empleado + the
# activity-specific unit — omitting the IRPF "personal no asalariado" slot,
# which the IVA cuota computation does not use per the Orden's own IVA
# Anexo I module rows).
[[revisions."2023-y-siguientes".parameters]]
id = "m303-modulos-iva-coeficientes-2025"
data_type = "keyed_bracket_table"
unit = "euro_per_unit"
legal_refs = ["orden-hac-1347-2024:anexo-i-iva-instrucciones"]
source_refs = ["boe-orden-hac-1347-2024-iva-authority"]

[[revisions."2023-y-siguientes".parameters.source_citations]]
source_ref = "boe-orden-hac-1347-2024-iva-authority"
required_text = [
    "La cuota devengada por operaciones corrientes será la suma de las cuantías correspondientes a los módulos previstos para la actividad",
]

