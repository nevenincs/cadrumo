# 1 por ciento de cuotas soportadas de dificil justificacion, deducible con
# caracter universal de la cuota devengada por operaciones corrientes (LIVA
# art. 123, Orden Anexo I apartado 2.2). Unconditional — unlike real cuotas
# soportadas por adquisiciones concretas (which depend on operator-declared
# purchase facts not yet captured), this forfait applies to every taxpayer
# under the régimen simplificado regardless of activity. The 1 por ciento
# figure is a stable LIVA art. 123 forfait republished verbatim by every
# annual Orden de módulos (2024, 2025, 2026 Anexo I apartado 2.2 all carry
# "será deducible el 1 por ciento"), not a per-year-varying coefficient like
# the módulo import tables above, so the dated value spans the full
# 2023-y-siguientes revision validity window (open-ended) rather than being
# pinned to the 2025 filing year the first-slice module coefficients cover.
[[revisions."2023-y-siguientes".parameters]]
id = "m303-modulos-iva-dificil-justificacion-forfait"
data_type = "ratio"
unit = "percent"
legal_refs = ["ley-37-1992:art-123", "orden-hac-1347-2024:anexo-i-iva-instrucciones"]
source_refs = ["boe-orden-hac-1347-2024-iva-authority"]

[[revisions."2023-y-siguientes".parameters.values]]
value = "1"
date_axis = "filing_period"
valid_from = 2023-01-01

[[revisions."2023-y-siguientes".parameters.source_citations]]
source_ref = "boe-orden-hac-1347-2024-iva-authority"
required_text = [
    "será deducible el 1 por ciento del importe de la cuota devengada por operaciones corrientes, en concepto de cuotas soportadas de difícil justificación",
]
