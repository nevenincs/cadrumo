# Tipo % (rate) for boxes [154] and [166] in this revision.
#
# AEAT neutralises both transitional Tipo % boxes to a zero constant from this
# design onward: the bundled diseno declares Constante "00000" at both slots, so
# the RD-ley 4/2024 transitional rungs (5,00 / 7,50 / 2,00) cannot legally occur
# in any period this revision covers. Those dated windows are therefore NOT
# carried here -- the sibling revisions covering 2023 and 2024 own them. Copying
# a window a revision cannot reach leaves a rung dormant at best and a vehicle
# for mis-declaration at worst.

[[revisions.2025.parameters]]
id = "m303-dr303-154-transitional-rate-percent"
data_type = "ratio"
unit = "percent"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-91", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "aeat-modelo-303-procedure"]

