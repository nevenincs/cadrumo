# Official DP30304 annual-summary endpoints for the population exonerated
# from Modelo 390. These fields apply only in the final period (12 / 4T)
# when the official DP30301 exoneration flag is set. They are canonical
# official-only casillas: no shadow semantic ids, bindings, relations,
# formulas, aggregation paths, export refs, or producer aliases exist.
#
# Atomic completeness remains deliberately open: the DP30301 exoneration
# flag and DP30304 nonnumbered activity-code, IAE-epigrafe, and Modelo 347
# marker fields have no typed producer. The M303 export is UNBUILT, not withdrawn:
# the registry refuses any revision that cannot emit, and these endpoints do not
# change that. Nothing excuses the absence; only building the export closes it.
