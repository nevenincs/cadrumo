# Tipo % value for the RD-ley 20/2022 transitional reducido rung of the
# régimen general devengado block, box [154]. This revision covers filing
# year 2023 only, and the bundled 2023 diseño declares the rung's mandated
# constant directly: `Constante "00500"` (5 %). The 7,5 % step, the 2 %
# super-reducido rung, and every dated window beyond 2024 belong to the two
# 2024-covering revisions and to no other.
#
# GROUNDING: n:art-72 (RD-ley 20/2022 art. 72) opens the 5 % window
# effective 1 January 2023, which is the one rate this revision's filing
# periods can carry.

