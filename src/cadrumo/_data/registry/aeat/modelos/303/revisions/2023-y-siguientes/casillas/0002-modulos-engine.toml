# M303 régimen simplificado de IVA módulos engine (cuota devengada por
# operaciones corrientes, tabled IAE activities). The four operator-
# declared inputs (epígrafe + up to three módulo unit counts — the highest
# signo count among the tabled activities, 972.1 peluquería) are calculation-
# support casillas absent from the AEAT-published Diseño de Registros (no
# export_refs); the two computed casillas (modulos-iva-cuota-devengada /
# modulos-iva-cuota-derivada) are internal_only. Together they feed a
# computed reference figure that the
# "modelo-303-2023-modulos-iva-computed-diverges-de-c48" advisory compares
# against the operator-declared official casilla 48 ("RS - 4T - Suma cuotas
# derivadas régimen simplificado conjunto actividades"), which remains the
# filed manual input — the cuota-devengada-only product would omit the
# taxpayer's real cuotas soportadas por operaciones corrientes if wired
# directly into casilla 48 without operator confirmation; this engine ships
# the computed reference and the guard, not a silent substitution over the
# operator's declared figure.
#
# Grounded in LIVA art. 123.Dos.1 (cuota devengada por operaciones
# corrientes) + Orden HAC/1347/2024 Anexo I "Instrucciones para la
# aplicación de los índices y módulos en el Impuesto sobre el Valor
# Añadido" apartado 2.1 (módulos × cuota devengada anual por unidad) for the
# cuota devengada, and apartado 2.3 (cuota derivada = mayor de cuota
# devengada neta de deducibles y forfait de difícil justificación, o cuota
# mínima) for the cuota derivada, mirroring the M131 estimación-objetiva
# módulos engine pattern.
