# Casilla 44 is `input_kind = "manual"` with NO formula BY DECISION, not by
# omission. LIVA art. 105.Cuatro settles the definitive prorrata in the year's
# last declaracion-liquidacion and regularises the provisional deductions; the
# regularisation amount therefore needs TWO operands that are not casillas of
# this revision. The provisional percentage is art. 105.Uno - "el porcentaje de
# deduccion provisionalmente aplicable cada ano natural sera el fijado como
# definitivo para el ano precedente" - i.e. the PRIOR ejercicio's definitive
# percentage, held in the profile-scoped encrypted prorrata register, and the
# cuotas soportadas base is art. 105.Seis - "la suma de las cuotas soportadas
# ... durante el ano natural correspondiente" - a sum ACROSS the regularised
# quarters. A registry formula evaluates within one period against this
# revision's own casillas, so neither operand is expressible as a formula
# argument; a formula could only be written by inventing a value when the
# cross-period carry is unresolvable, which would replace a visible advisory
# with a silent default in a fourth-quarter settlement box.
#
# The value is NOT left to the operator. It is produced by the
# `modelo-303-prorrata-regularizacion-casilla-44` binding
# (`source = "prorrata_regularizacion"`, `regularizacion_output =
# "modelo_303_casilla_44"`), whose resolver is enrolled on the live calculate
# path and feeds casilla 44 as a bound input; when the provisional carry or the
# current-year source casillas do not resolve it returns unresolved-binding
# diagnostics rather than a zero. That cross-period carry is the one canonical
# mechanism for this value, so adding a formula would model one fold-in twice.
#
# The remaining silent-under-declaration risk - a declared annual prorrata
# volume with casilla 44 left blank - is closed by the ADVISORY predicate
# authored in this revision's `verification_expectations/` fragments, mirroring
# the later explicit record-design revisions. Art. 105 has exactly one amendment
# (Ley 14/2000, in force 2001-01-01, touching apartado Tres only), so apartados
# Uno, Cuatro and Seis are textually identical across both revision windows -
# this revision opens in 2009, after that amendment - and the same reasoning
# binds each.
# Operator input. The design defines this box as a SUM over the per-activity
# regimen simplificado rows (A1..F3 / B1..M2), and those per-activity modulos
# rows are not modelled in this registry, so the engine cannot derive it.
# Operator input. The design defines this box as a SUM over the per-activity
# regimen simplificado rows (A1..F3 / B1..M2), and those per-activity modulos
# rows are not modelled in this registry, so the engine cannot derive it.
# Casilla 59 reports the base imponible of exempt intra-community supplies
# (entregas intracomunitarias exentas). The substantive ground is LIVA art. 25
# (exenciones en las entregas de bienes destinados a otro Estado miembro), not
# the repercusión/deducción articles 88/92 — an exempt entrega carries no cuota
# repercutida nor deducible, so this is an informativa base-only box.
# Casilla 60 reports the base imponible of exempt exports and operations
# treated as exports. The substantive grounds are LIVA art. 21 (exenciones en
# las exportaciones de bienes) for the "Exportaciones" leg and art. 22
# (exenciones en las operaciones asimiladas a las exportaciones) for the
# "operaciones asimiladas" leg the label names. Both are exempt (zero cuota),
# so the repercusión/deducción articles 88/92 do not apply — base-only box.
# Intra-community-acquisition official-box parity casillas. They expose the
# self-assessed AIC cuota in its official devengado (boxes 10/11) and deducible
# (boxes 36/37) positions for the export/workbook parity surface. They are NOT
# added to the resultado formula — the iva.autorepercutido.intracomunitaria
# semantic casilla already books that cuota into the resultado, and adding these
# would double-count. The devengado/deducible pair nets to zero (LIVA art. 84
# inversión + art. 92 deduction).
# Third-country import IVA deducible (official casilla 33). IVA devengado on the
# import is settled at customs (DUA) and never reaches M303; only the deducible
# leg appears here. This is a real deduction (not net-zero), so it feeds the
# cuota-deducible-total formula. Grounded in LIVA art. 17 (hecho imponible
# importaciones) + art. 92 (cuotas deducibles).

