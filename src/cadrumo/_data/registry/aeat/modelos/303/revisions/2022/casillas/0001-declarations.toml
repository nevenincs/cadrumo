[[revisions.2022.casillas]]
id = "iva.autoconsumo.promotor.base"
continuidad_origin = "not_on_form"
continuidad_evidence = "aeat-dr-303-2022 declara las bases y cuotas del regimen general por tipo, sin casilla separada para autoconsumo del promotor. Esta fila recibe del perfil la base total del autoconsumo, sin tipo; se contrasta con la suma de las bases que el promotor declara en la fila de su tipo y no representa una casilla impresa."
continuidad_id = "iva-autoconsumo-promotor-base"
number = "iva.autoconsumo.promotor.base"
section = ["iva", "regimen_general", "devengado"]
semantic_role = "iva_autoconsumo_promotor_base"
input_kind = "bound"
binding = "modelo-303-autoconsumo-promotor-base"
legal_refs = ["ley-37-1992:art-9", "ley-37-1992:art-79", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]

# The promotor's autoconsumo (Ley 37/1992 art. 9.1º, base at cost under art.
# 79.Tres) is an entrega de bienes of the period, so it is declared in the
# regimen general row of the rate its building bears, as every row of the
# design and the official instructions state the rows by rate: [01]-[03] at the
# super-reducido rate (art. 91.Dos.1.6º, viviendas de protección oficial de
# régimen especial o de promoción pública delivered by their promotor), [04]-[06]
# at the reducido rate (art. 91.Uno.1.7º, edificios aptos para vivienda) and
# [07]-[09] at the general rate (art. 90.Uno) for everything else. No design
# prints a separate autoconsumo box or adds it to [27] outside those rows. The
# operator states the base in the row of its rate; the row's cuota applies that
# row's rate, and the profile's rate-less total is reconciled against the sum.

[[revisions.2022.casillas]]
