# Base-imponible parity casilla for official box 10, mirroring the cuota
# parity casilla iva.autorepercutido.intracomunitaria.devengado (box 11).
# Feeds box 10 via a projection formula only -- never the resultado, which is
# cuota-denominated and already carries this quantity's tax through
# iva.autorepercutido.intracomunitaria.
[[revisions.2022.casillas]]
id = "iva.autorepercutido.intracomunitaria.devengado.base"
continuidad_origin = "not_on_form"
continuidad_evidence = "aeat-dr-303-2022, campos 34 y 35, distingue base [10] y cuota [11] de adquisiciones intracomunitarias. Esta fila es la entrada de agregacion que la formula proyecta en [10]; no constituye una segunda casilla impresa."
