# Intra-community-acquisition official-box parity (adquisición intracomunitaria,
# inversión del sujeto pasivo). The recipient self-assesses the cuota on BOTH the
# devengado side (official box 11, "Adquisiciones intracomunitarias de bienes y
# servicios - Cuota") and the deducible side (official box 37, "En adquisiciones
# intracomunitarias de bienes y servicios corrientes - Cuota"). Both official
# titles cover goods AND services, so each selector carries both categories and
# sums them onto the one line; box 12/13 is expressly "excepto adq. intracom".
# The goods leg is grounded in art. 13 (hecho imponible) + art. 15 (concepto);
# the services leg in art. 69.Uno.1 (localised in the TAI because the recipient
# is established here), read subject to art. 70's reglas especiales. Art.
# 84.Uno.2.a) makes the recipient the sujeto pasivo on both legs. These two
# bindings expose the same
# self-assessed cuota the existing modelo-303-iva-autorepercutido-intracomunitaria-cuota
# semantic binding already feeds into the resultado, so the parity casillas are
# NOT added to the resultado formula (they would double-count) — they are
# official-box exposure for the export/workbook parity, netting to zero
# (devengado box 11 - deducible box 37 = 0).
[[revisions.2024-hasta-08-y-2t.bindings]]
id = "modelo-303-iva-autorepercutido-intracomunitaria-devengado-cuota"
provider = { kind = "ledger_iva_aggregation", categories = ["intra_community_acquisition_reverse_charge", "intra_community_service_acquisition_reverse_charge"], rate_kinds = ["zero", "general", "reduced", "super_reduced"], flow_direction = "inversion_sujeto_pasivo", fact = "iva_amount_sum", observation_roles = ["settlement"], cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"] }
value = { data_type = "money", channel = "decimal" }
