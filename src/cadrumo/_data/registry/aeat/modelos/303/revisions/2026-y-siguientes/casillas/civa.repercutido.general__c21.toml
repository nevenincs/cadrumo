# Intra-community-acquisition official-box parity casillas. They expose the
# self-assessed AIC cuota in its official devengado (boxes 10/11) and deducible
# (boxes 36/37) positions for the export/workbook parity surface. They are NOT
# added to the resultado formula — the iva.autorepercutido.intracomunitaria
# semantic casilla already books that cuota into the resultado, and adding these
# would double-count. The devengado/deducible pair nets to zero (LIVA art. 84
# inversión + art. 92 deduction).
[[revisions.2026-y-siguientes.casillas]]
