continuidad_id = "iva-cuota-autorepercutida-intracomunitaria-devengado"
required = false
input_kind = "bound"
binding = "modelo-303-iva-autorepercutido-intracomunitaria-devengado-cuota"
legal_refs = ["ley-37-1992:art-13", "ley-37-1992:art-15", "ley-37-1992:art-69", "ley-37-1992:art-70", "ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2026"]

