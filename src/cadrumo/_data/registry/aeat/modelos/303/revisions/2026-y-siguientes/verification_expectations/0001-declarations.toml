# Grounded against the AEAT Manual practico IVA 2024, Cap. 9 "La declaracion-
# resumen anual. Modelo 390", 1T supuesto practico (a domestic-general-21
# ventas/servicios + recargo de equivalencia + adquisicion intracomunitaria +
# importacion + compensacion-pendiente-anteriores worked example): "TOTAL
# CUOTA DEVENGADA: 23.088 euros" (casilla 27), "TOTAL A DEDUCIR: 16.800 euros"
# (casilla 45), "Diferencia a ingresar: 3.288 euros" (casilla 71) and its own
# "Casilla 69" resultado line (iva.resultado). The same solucion also states
# "Diferencia: 6.288 euros" (iva.resultado-regimen-general, form_number 46 =
# [27]-[45]), graded here too. The five per-casilla leaves the solucion states
# verbatim (09/11/29/33/37) are grounded on the sibling
# modelo-303-2026-y-siguientes-reconcile-when-present expectation, which is the
# contract that enrolls them. See
# test_m303_2024_regimen_general_manual_worked_example.py and
# corpus/manual_oracles/modelo-303-2024-regimen-general-recargo-intracomunitaria-importacion.json.
# The worked example cited above is a 2024 filing and is therefore not an
# applicable external oracle for this 2026-and-later revision. Keep the
# reconciliation contract, but make no cross-year grounding claim here.
# Calculation verification for Modelo 303 (IVA autoliquidacion, Ley 37/1992):
# the always-present total cuota boxes. The M303 2023 revision projects the
# official Diseno-de-Registros numbered boxes as computed formulas; casilla 27
# (total cuota devengada, art. 88/90/91) and casilla 45 (total a deducir,
# art. 92/94/95) are the aggregate totals reported in every filed declaration,
# so min_coverage = 1 holds without flipping a legitimate filing to NEEDS_REVIEW.
# The per-rate constituent cuota boxes (03/06/09/11/13, 29/33/37) are situational
# (present per operations) and stay excluded, as does the rate prorrata-porcentaje
# and the situational autoconsumo-promotor cuota. Grounded in the AEAT DR
# source_refs.
# Exhaustive reconcile-when-present verification for Modelo 303
# revision 2026-y-siguientes: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-303-iva-chain-verification).
# Situational boxes, added to close the enrolment gate's exhaustive
# invariant. Each is export required=true, so the FICHERO always carries a
# zero for it; the printed declaracion leaves it BLANK when the activity is
# absent (measured: the annex quarters print box numbers "153 154 155" and
# "165 166 167" with no values). Reconcile-when-present is the class the
# enrolment gate names for exactly this shape -- "coverage-gated if it is an
# always-present final, reconcile-when-present otherwise".
#
# HONEST NOW, NOT COMPLETE. Reconcile-when-present never surfaces
# MISSING_IN_FILED. Today that costs nothing because no extraction profile
# targets these ids, so neither side ever carries them and nothing is
# checked either way. IF A PROFILE LATER TARGETS THEM, an omission INSIDE
# the transitional window -- where the box should carry a value -- will read
# as legitimately absent rather than under-declared. That is the silent
# direction, and whoever adds the extraction coverage owns the question.
# The 2024 manual cited below is historical corroboration for these reconciled
# leaves, not an applicable external oracle for this 2026-and-later revision.
# Its filing year is intentionally preserved in the bundled payload, so these
# leaves are not declared externally grounded here. The Manual practico IVA
# 2024, Cap. 9 "Liquidacion primer
# trimestre" solucion (pag. 293-294) prints each as its own euro figure - "Total
# IVA devengado en Ventas interiores y servicios prestados (83.000 x 21%):
# 17.430 euros" (09), "Adquisiciones intracomunitarias: [(18.000(2) +
# 3.000(4))] x 21%: 4.410 euros" (11), "Total cuotas soportadas en operaciones
# interiores: 9.870 euros" (29), "Por cuotas satisfechas en importaciones:
# (12.000(6) x 21%): 2.520 euros" (33) and "En adquisiciones intracomunitarias:
# [18.000(2) + 3.000(4)) x 21%]: 4.410 euros" (37). Grounding the leaves and not
# only the totals on the sibling chain contract closes the compensating-error
# gap: two offsetting mistakes inside the devengado or deducible sum leave both
# printed totals correct, so a totals-only oracle stays green while the
# individual boxes the operator files are wrong. See
# test_m303_2024_regimen_general_manual_worked_example.py and
# corpus/manual_oracles/modelo-303-2024-regimen-general-recargo-intracomunitaria-importacion.json.
#
# A sixth leaf, iva.prorrata-porcentaje, is grounded against a second bundled
# AEAT authority: the Manual practico IVA 2025, Cap. 5 "Deducciones y
# devoluciones", apartado "Prorrata general" (pag. 137-138), whose alquiler de
# viviendas y locales example states the definitive percentage outright — "(25.000
# / 45.000) x 100 = 55,5555%. Se redondea en exceso = 56%". The bundled payload
# corpus/manual_oracles/modelo-303-2025-prorrata-general-regularizacion.json
# carries that 56 as its only expected value, and the engine reproduces it from
# the manual's own annual volume givens. Until now the figure was evidence the
# honesty relation saw but no revision claimed, so nothing enforced it; declaring
# it here turns the manual's number into a checked independent oracle. The
# percentage is a deduction-rate leaf that multiplies into every cuota deducible,
# so a wrong rate silently rescales the whole deducible side while the totals it
# feeds stay internally consistent — the same compensating-error gap the five
# leaves above close for the devengado and deducible sums. No bundled oracle
# currently covers a filing year resolving to this revision, so it makes no
# external-grounding declaration.

