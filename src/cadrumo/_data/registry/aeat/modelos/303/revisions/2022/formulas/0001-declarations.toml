# Each regimen general rate row carries the promotor's autoconsumo declared at
# its rate (LIVA arts. 9.1º, 79.Tres, 90 and 91): the row's base box adds the
# autoconsumo base to the ledger's base at that rate, and the row's cuota
# carrier adds the autoconsumo base times the row's own rate, a parameter keyed
# by the row's Tipo % box, to the ledger's cuota at that rate. They cite the
# instructions and the approving orden rather than one year's design, so every
# later edition inherits them unchanged.

[[revisions.2022.formulas]]
id = "modelo-303-iva-devengado-super-reducido-base"
target_casilla_id = "01"
expression = { op = "add", args = [
    { casilla_id = "iva.repercutido.super-reducido.base" },
    { casilla_id = "iva.autoconsumo.promotor.super-reducido.base" },
] }
rounding = "money-2"
legal_refs = ["ley-37-1992:art-9", "ley-37-1992:art-79", "ley-37-1992:art-88", "ley-37-1992:art-91", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]

[[revisions.2022.formulas.source_citations]]
source_ref = "aeat-modelo-303-procedure"
required_text = ["modelo 303"]

