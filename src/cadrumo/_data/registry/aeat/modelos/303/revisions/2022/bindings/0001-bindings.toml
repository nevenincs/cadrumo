# Intra-community-acquisition official-box parity (adquisición intracomunitaria,
# inversión del sujeto pasivo). The recipient self-assesses the cuota on BOTH the
# devengado side (official box 11) and the deducible side (official box 37).
# Both official titles read "de bienes y servicios", so each selector carries the
# goods and the services category and sums them onto the one line; box 12/13 is
# expressly "excepto adq. intracom". The goods leg rests on art. 13 (hecho
# imponible) + art. 15 (concepto), the services leg on art. 69.Uno.1 read subject
# to art. 70; art. 84.Uno.2.a) makes the recipient sujeto pasivo on both.
# These two bindings expose the same self-assessed cuota the existing
# modelo-303-iva-autorepercutido-intracomunitaria-cuota semantic binding already
# feeds into the resultado, so the parity casillas are NOT added to the resultado
# formula (they would double-count) — they are official-box exposure for the
# export/workbook parity, netting to zero (devengado box 11 - deducible box 37 = 0).
