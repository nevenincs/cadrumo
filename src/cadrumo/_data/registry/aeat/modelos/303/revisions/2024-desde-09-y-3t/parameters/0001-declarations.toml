# Tipo % (rate) values for the two RD-ley 4/2024 transitional rungs of the
# régimen general devengado block, boxes [154] (reducido transitorio) and
# [166] (super-reducido transitorio). AEAT mandates each rung's rate as a
# design `Constante`, never an operator declaration (see
# bindings/0006-transitional-rate-rungs.part-001.toml for the full account of
# why these two rungs exist and why the split of this revision must not
# separate 5 % from 7,5 %).
#
# Nota 8 of the bundled diseño changes [154]'s mandated constant AT the
# 10/4T 2024 filing-period boundary (00500 -> 00750); Nota 10 gates [166] to
# periods from 10/4T 2024 (before that, and again from the 2025 design
# onward, both constants read 00000). date_axis "filing_period" resolves to
# `calculation_filing_date(period)` — the period's own END DATE for every
# ordinary quarter (Q3 2024 -> 2024-09-30, Q4 2024 -> 2024-12-31), confirmed
# by reading application/modelo/_calculation_preparation.py's production
# default (`filing_period_date or calculation_filing_date(work_unit.period)`)
# rather than assumed from the parameter mechanism alone -- a filing DEADLINE
# semantics here would have misclassified an October-filed Q3 return into
# the Q4 window and printed 7,5 % where the law states 5 %.
#
# GROUNDING, fully closed with two already-bundled citations spanning
# 2023-01-01 through 2024-12-31 end to end, no residual gap:
#
# real-decreto-ley-20-2022:art-72 opens the window effective 1 January 2023
# (5 % on aceites/pastas, recargo 0,62 %; 0 % on the enumerated basic foods,
# recargo 0 %). Its own consolidated operative text already reads "vigencia
# hasta el 30 de junio de 2024" -- the effect of three intermediate
# extensions (RDL 1/2023 disposición adicional 16, RDL 5/2023 art. 171, RDL
# 8/2023 art. 20; none separately bundled) is already baked into that
# consolidated wording, so this citation alone covers 2023-01-01 through
# 2024-06-30.
#
# real-decreto-ley-4-2024:art-1 (already bundled) picks up from there: its
# own preámbulo, read directly from the bundled corpus, states verbatim
# "se mantiene la rebaja del IVA de estos alimentos en los tipos del 5 por
# ciento ... y del 0 por ciento ... hasta el 30 de septiembre de 2024. A
# partir de dicha fecha ... se incrementarán los tipos impositivos al 7,5 y
# 2 por ciento, respectivamente, hasta el 31 de diciembre" -- i.e. RD-ley
# 4/2024 ITSELF (not merely restating an unbundled predecessor) extends the
# 5 %/0 % pair through 30 September 2024 before its own 7,5 %/2 % step from
# 1 October. So the 2024-07-01..2024-09-30 segment rests on this bundled
# citation directly, not on any unbundled instrument.
#
# The DESIGN authority for every window boundary and constant below is
# separately solid (aeat-dr-303-2024-late, the same bundled Diseño de Registros
# the four stable rungs already cite).

[[revisions.2024-desde-09-y-3t.parameters]]
