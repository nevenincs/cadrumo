[[revisions.2022.extraction_profiles]]
id = "modelo-303-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaracion"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    # This profile targets only what the AEAT form PRINTS.
    #
    # The per-rate cuota primitives are deliberately ABSENT, for the same reason
    # as the 2023 revision: the printed form carries the devengado section
    # positionally as base/tipo/cuota rows and never labels a per-rate cuota.
    # This revision declared five of them (it has no
    # iva.autoconsumo.promotor.* casillas at all, so there was never a sixth).
    #
    # The engine still computes the devengada and deducible totals from those
    # primitives, obtaining them from ledger aggregation on the calculate path.
    {casilla_id = "27", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Total\s+cuota\s+devengada'},
    {casilla_id = "29", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Por\s+cuotas\s+soportadas\s+en\s+operaciones\s+interiores\s+corrientes'},
    {casilla_id = "45", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Total\s+a\s+deducir'},
    {casilla_id = "iva.resultado-regimen-general", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+r[eé]gimen\s+general\s+\([\[\s]*27[\]\s]*-[\[\s]*45[\]\s]*\)'},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
# 3/4. INFERRED, NOT MEASURED — stated plainly because the distinction matters.
# The repository bundles no printed render for this revision's window (filing
# years 2022); the four AEAT manual annex quarters are 2024 renders and
# belong to the 2023 revision. So this floor cannot be measured the way the
# 2023 floor was.
#
# The four retained targets are 27, 29, 45 and the resultado. In the 2024 annex
# all four are populated in all four quarters, which is the closest available
# evidence that they are the form's always-printed core. One slot is left free
# because box 29 is legitimately blank for a filer with no domestic input VAT —
# the same optional-blank class that produced the 4T shortfalls in the annex.
min_coverage = "0.75"
failure_semantics = "fail_hard"
# Must equal exactly the union of the target casillas' own legal_refs. Dropping
# the primitive targets drops LIVA art. 84 (inversión del sujeto pasivo) with
# them: the profile no longer claims to read a reverse-charge cuota off the page.
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "ley-37-1992:art-92", "ley-37-1992:art-94", "ley-37-1992:art-95", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2022", "aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]
