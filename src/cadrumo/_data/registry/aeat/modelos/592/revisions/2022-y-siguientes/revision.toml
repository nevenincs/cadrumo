[revisions."2022-y-siguientes"]
authority_grade = "applicability"
# Modelo 592 autoliquidación del Impuesto especial sobre envases de plástico no
# reutilizables, approved by orden-hfp-1314-2022 art 1 with its plazo grounded
# verbatim in orden-hfp-1314-2022 art 2. Scheduling/applicability-grade:
# declaration-header casillas only; no bundled diseño de registro, so no numbered
# form casilla is fabricated.
# Deadline-shape note: art 2 sets the plazo at the "veinte primeros días
# naturales siguientes" al fin del periodo de liquidación, pero el periodo
# (trimestral o mensual) depende del periodo de liquidación del obligado en el
# IVA. This revision therefore carries NO fixed calendar deadline_windows and no
# deadline application link; a cadence-specific date is not fabricated. The
# approval and plazo articles are grounded verbatim.
valid_from = 2022-01-01
period_selector = { year_from = 2022, periods = ["0A"] }
orden_aplicabilidad = ["orden-hfp-1314-2022:art-1"]
legal_refs = [
    "orden-hfp-1314-2022:art-1",
    "orden-hfp-1314-2022:art-2",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-592-procedure",
    "enrolled-modelo-592-layout",
]


[revisions."2022-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2022-y-siguientes' of modelo 592 has no strictly-earlier sibling revision of this modelo (valid_from 2022-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
