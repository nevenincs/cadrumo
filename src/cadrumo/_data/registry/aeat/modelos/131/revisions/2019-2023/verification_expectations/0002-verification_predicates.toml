# AEAT M131 Casilla 11 cap rule: when C10 is strictly positive, C11
# (resultados negativos de trimestres anteriores) MUST NOT exceed C10
# (cuota positiva del trimestre). Source: AEAT M131 instructions
# "en ningún caso podrá figurar en la casilla 11 un importe superior a
# la cantidad positiva consignada en la casilla 10". Enforced via the
# cap_le_when_positive predicate DSL operator.
[[revisions."2019-2023".verification_predicates]]
predicate_id = "modelo-131-2019-2023-c11-cap-by-c10"
expression = 'cap_le_when_positive(["11", "10"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["rd-439-2007:art-110"]

# No-silent-under-declaration advisory. C01 ("Suma de rendimientos netos" —
# manual módulos sum for the datos-base activities) and C02 ("Pago fraccionado
# previo por datos-base" — manual) are both operator inputs because the módulos
# rendimiento is determined externally (the annual Orden de módulos tables, not
# modelled in the registry).
#
# Legal attribution:
# - RD 439/2007 art. 110.1.b establishes both the datos-base determination
#   rule and the objective-estimation 4 / 3 / 2 por ciento scale keyed on
#   personal asalariado at the datos-base reference date.
# - The official M131 instructions (aeat-modelo-131-instructions, Casilla 02)
#   mirror that statutory scale for the filing surface. The 2 por 100 is the
#   scale minimum.
# - RD 439/2007 art. 110.4 grants the right to apply higher percentages;
#   the instructions confirm "no se permiten porcentajes inferiores" to the
#   scale minimums.
#
# A strictly positive C01 therefore ALWAYS yields a strictly positive C02
# (the scale minimum is 2 por 100 > 0); C02 = 0 on a positive C01 is a silent
# under-declaration (the datos-base section contributes nothing to
# C07 = C02 + C04 + C06, so the resultado collapses to zero on positive módulos
# activity). ADVISORY (non-blocking): the implication holds trivially when C01
# is absent or zero, so a filer with no datos-base activity raises nothing.
# There is no legitimate positive-C01/zero-C02 case, so the advisory is
# false-positive-free. The durable fix is modelling the módulos determination
# itself (Orden de módulos signos × índices correctores) so C01 and C02 become
# computed; until then this advisory makes the under-declaration non-silent,
# mirroring the M200 base-imponible advisory.
[[revisions."2019-2023".verification_predicates]]
predicate_id = "modelo-131-2019-2023-pago-fraccionado-determinado-cuando-rendimientos-positivos"
expression = 'implies_nonzero(["01", "02"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-110"]

# Converse guard on the same datos-base pair, closing the direction the
# advisory above structurally cannot see. That one fires on positive C01 with
# zero C02, and is silent precisely when C01 is itself the omitted field,
# because a zero antecedent satisfies the implication trivially. C01 ("Suma de
# rendimientos netos") is manual, declares no formula, is not schema-required,
# and is read by no formula in this revision — C02 is an independent manual
# input and C07 = C02 + C04 + C06 never references C01 — so an omitted C01
# reaches the fichero with nothing downstream noticing, exporting zero
# rendimientos beside a positive pago fraccionado.
#
# Legal attribution. RD 439/2007 art. 110.1.b fixes the datos-base pago
# fraccionado at el 4 / 3 / 2 por ciento of the rendimientos netos determined
# by estimación objetiva on the datos-base, the scale minimum being 2 por 100,
# so a strictly positive C02 is reachable only from a strictly positive C01.
# The two situations that legitimately yield a pago fraccionado with no
# datos-base rendimiento are routed by that same article to other casillas and
# leave C02 at zero: "no pudiera determinarse ningún dato-base"
# (art. 110.1.b in fine) is declared through C03/C04, and actividades
# agrícolas, ganaderas y forestales (art. 110.1.c) through C05/C06.
#
# ADVISORY (non-blocking), and false-positive-free in both directions. It holds
# trivially whenever C02 is absent, zero or negative, so a no-activity filer, a
# loss filer, a pure-agrario filer and a sin-datos-base filer raise nothing; it
# fires only on a strictly positive C02 with C01 zero or absent, which
# art. 110.1.b makes unreachable for a legitimate filing.
[[revisions."2019-2023".verification_predicates]]
predicate_id = "modelo-131-2019-2023-rendimientos-declarados-cuando-pago-fraccionado-datos-base-positivo"
expression = 'implies_nonzero(["02", "01"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-110"]
