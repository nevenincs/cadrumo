# M131 estimación-objetiva módulos engine formulas — 2026 per-year roll-forward.
# Replicates the 2025 revision's four-fase formula chain unchanged (same rounding, same
# op wiring); only the parameter/legal_refs bindings are re-pointed at the
# 2026 revision's own coefficient table and the Orden HAC/1425/2025 legal
# catalogue entries (verified byte-identical against the 2025 Orden's figures
# — see 0002-modulos-coeficientes.toml for the numeric cross-check). No AEAT
# Manual práctico de Renta 2026 is bundled yet, so source_citations cite the
# year-agnostic AEAT M131 instructions (genuine mechanism-description prose
# — signos/módulos rendimientos anuales por unidad, minoraciones, índices
# correctores, reducciones de carácter general) rather than manual page text
# that would not exist for this filing year.
#
# Fase 1ª — rendimiento neto previo: dispatches the units×coefficient product
# through the m131_resolve_modulos_previo op, which reads the epígrafe (text)
# plus up to seven módulo unit-count casillas (the highest signo count among
# the tabled activities, 644.1/644.2/644.3) and the registry-declared
# keyed-bracket coefficient table (m131-modulos-coeficientes-2026). An
# untabled epígrafe or a blank epígrafe resolves to zero (see the op's
# docstring in _formula_runtime.py).
# Fase 2ª — rendimiento neto minorado: previo minus the sum of the minoración
# por incentivos al empleo (Orden HAC/1425/2025 Anexo II, instrucción 2.2.a)
# and the minoración por incentivos a la inversión (instrucción 2.2.b). The
# empleo minoración dispatches through the m131_resolve_modulos_minoracion_
# empleo op (epígrafe, current/prior módulo 1 unit counts, coefficient table,
# tramos bracket table, incremento constant). The inversión minoración is the
# operator-declared "modulos-minoracion-inversion" casilla (a euro amount) —
# this first slice does not model a per-element libro registro de bienes de
# inversión, so the amortization figure is supplied by the operator rather
# than derived from an asset register the engine does not have; a blank
# input simply omits this legitimate additional reduction (never over-states
# the minorado, since omission only under-claims a reduction, never
# fabricates one). Both minoraciones feed an internal advisory-support
# casilla that never substitutes for the operator's manual casilla 01.
# Fase 3ª — rendimiento neto de módulos: minorado adjusted by the full
# cascade of índices correctores generales (Orden HAC/1425/2025 Anexo II,
# instrucción 2.3, letra b): b.1 pequeña dimensión, b.2 temporada / b.4
# inicio de nuevas actividades (mutually exclusive), b.3 índice de exceso —
# applied sequentially in the Orden's own enumeration order, respecting its
# declared incompatibilidades (b.1 excludes b.3 outright; b.1 is itself
# excluded from the two tabled epígrafes carrying an índice especial;
# temporada excludes inicio de nuevas actividades). Dispatches through the
# m131_resolve_modulos_indices_generales op. The b.1/b.2/b.4 blocks of
# Orden HAC/1425/2025 are byte-identical to their Orden HAC/1347/2024
# predecessors except for b.4's rolling start date (1 de enero de 2025),
# so the 2025 cascade carries forward unchanged. The índices correctores
# especiales themselves (letra a) — autotaxis, transporte urbano, mercancías,
# quioscos de prensa) remain out of scope: they are conditional on taxpayer
# facts (población del municipio, número de vehículos) this engine does not
# model as inputs, and the b.1/a.2/a.4 incompatibility they trigger is
# already enforced structurally by the op via the epígrafe-especial
# frozenset. Omitting the letra a) índices keeps this an internal
# advisory-support figure, never a substitute for the operator's manual
# casilla 01.
# Advisory-support flag: the declared índice de pequeña dimensión (b.1) was
# ignored because the activity carries a documented índice especial
# (Orden HAC/1425/2025 Anexo II, instrucción 2.3). The incompatibility text
# itself is carried by the legal_refs entry, whose required_text quotes the
# Orden verbatim; the source citation grounds the fact that the índices
# correctores apply to the pago fraccionado at all.
# Advisory-support flag: both índice de temporada (b.2) and índice de inicio
# de nuevas actividades (b.4) were declared simultaneously (mutually
# exclusive per Orden HAC/1425/2025 Anexo II, instrucción 2.3).
# Fase 4ª — rendimiento neto de la actividad: módulos minus the 5 por 100
# reducción general (Orden HAC/1425/2025 DA-1, apartados 1 y 3).

