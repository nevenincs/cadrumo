[revisions."2024".family_dispositions.projection_endpoints]
reason = """
FilingProjectionRef (cadrumo.core) is a closed discriminated union of exactly seven projection_kind members, all prefixed m303_ and used exclusively by modelo 303's engine-computed IVA facts; ProjectionEndpointDeclaration.projection_ref accepts only that union, so no declaration naming modelo 131's own casillas can validate. Modelo 131 is not modelo 303, so the projection_endpoints family cannot be populated by construction. This revision's own export_layouts already demonstrate the mechanism \
that serves its repeating rows: at least one authored ExportRecordDefinition declares repeat == \"binding_rows\", materializing repeating rows from binding values rather than from a projection_endpoints declaration."""
legal_refs = [
    "rd-439-2007:art-110",
    "orden-eha-672-2007:art-3",
    "orden-hfp-1359-2023:art-4",
    "ley-35-2006:art-68.4",
    "orden-hfp-1359-2023:da-5",
    "orden-hfp-1359-2023:da-6",
    "real-decreto-ley-4-2024:art-3",
    "real-decreto-ley-7-2024:art-11",
    "rd-439-2007:art-95",
]
