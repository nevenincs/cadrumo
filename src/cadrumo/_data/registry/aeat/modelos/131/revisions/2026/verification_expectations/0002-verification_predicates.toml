# AEAT M131 Casilla 11 cap rule: when C10 is strictly positive, C11
# (resultados negativos de trimestres anteriores) MUST NOT exceed C10
# (cuota positiva del trimestre). Source: AEAT M131 instructions
# "en ningún caso podrá figurar en la casilla 11 un importe superior a
# la cantidad positiva consignada en la casilla 10". Enforced via the
# cap_le_when_positive predicate DSL operator.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-c11-cap-by-c10"
expression = 'cap_le_when_positive(["11", "10"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["rd-439-2007:art-110"]

# No-silent-under-declaration advisory. C01 ("Suma de rendimientos netos" —
# manual módulos sum for the datos-base activities) and C02 ("Pago fraccionado
# previo por datos-base" — manual) are both operator inputs because the módulos
# rendimiento is determined externally (the annual Orden de módulos tables, not
# modelled in the registry).
#
# Legal attribution:
# - RD 439/2007 art. 110.1.b establishes both the datos-base determination
#   rule and the objective-estimation 4 / 3 / 2 por ciento scale keyed on
#   personal asalariado at the datos-base reference date.
# - The official M131 instructions (aeat-modelo-131-instructions, Casilla 02)
#   mirror that statutory scale for the filing surface. The 2 por 100 is the
#   scale minimum.
# - RD 439/2007 art. 110.4 grants the right to apply higher percentages;
#   the instructions confirm "no se permiten porcentajes inferiores" to the
#   scale minimums.
#
# A strictly positive C01 therefore ALWAYS yields a strictly positive C02
# (the scale minimum is 2 por 100 > 0); C02 = 0 on a positive C01 is a silent
# under-declaration (the datos-base section contributes nothing to
# C07 = C02 + C04 + C06, so the resultado collapses to zero on positive módulos
# activity). ADVISORY (non-blocking): the implication holds trivially when C01
# is absent or zero, so a filer with no datos-base activity raises nothing.
# There is no legitimate positive-C01/zero-C02 case, so the advisory is
# false-positive-free. The durable fix is modelling the módulos determination
# itself (Orden de módulos signos × índices correctores) so C01 and C02 become
# computed; until it lands this advisory makes the under-declaration
# non-silent, mirroring the M200 base-imponible advisory.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-pago-fraccionado-determinado-cuando-rendimientos-positivos"
expression = 'implies_nonzero(["01", "02"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-110"]

# Table-driven-engine-vs-operator-declared discrepancy (M131 estimación-
# objetiva módulos engine, per-year roll-forward). Casilla 01 ("Suma de
# rendimientos netos") stays a manual operator input; for a tabled IAE
# activity (see 0002-modulos-coeficientes.toml for the current coverage) the
# units×coefficient engine now produces a computed reference figure
# (modulos-rendimiento-neto-actividad, Fase 1ª + Fase 4ª: previo − 5 por
# ciento reducción general). When the engine has coverage (computed casilla
# > 0) and the operator's declared casilla 01 differs from it by more than
# one cent, this ADVISORY prompts a review — it does not assume the engine is
# authoritative over the operator's declared figure (Fases 2ª/3ª correcting
# factors, which the taxpayer may legitimately claim, are intentionally not
# modelled yet), so it stays a prompt, never a BLOCKING_RULE.
#
# PRECONDITION BEFORE PROMOTING THIS, or before binding casilla 01 to the
# engine. The engine reads ONE activity's inputs — a single epígrafe and seven
# unit casillas — while Orden HFP/1359/2023 (Instrucciones, Rendimiento anual)
# defines the figure per activity and summed: "El rendimiento neto resultará de
# la suma de los rendimientos netos que correspondan a cada una de las
# actividades", and "el rendimiento neto correspondiente a cada actividad se
# obtendrá aplicando el procedimiento establecido a continuación". Casilla 01
# is itself named "Suma de rendimientos netos".
#
# So for a taxpayer with two módulos activities the computed reference covers
# one of them. That is harmless while this stays ADVISORY and casilla 01 stays
# operator-declared — the divergence is a prompt, and this predicate already
# expects divergence from unmodelled Fases. Making the engine authoritative
# would UNDER-DECLARE that taxpayer instead, silently, because the engine
# cannot see inputs that are not there to read: the profile stores a single
# flat set (irpf.objective_estimation_modulos_*, eight fields, one epígrafe).
# Per-activity módulos inputs have to exist first. This is deliberately a note
# and not a gate — refusing the binding outright would also refuse it once the
# inputs are per-activity, which is the state we want to reach.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-modulos-computed-diverges-de-c01"
expression = 'advisory_when_computed_diverges(["01", "modulos-rendimiento-neto-actividad"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1425-2025:art-4", "orden-hac-1425-2025:da-1"]

# Índice-exceso (b.3) / índices-especiales incompatibility ADVISORY (mirrors
# the 2025 revision's equivalent advisory). Orden HAC/1425/2025 Anexo II,
# instrucción 2.3 declares (see
# orden-hac-1425-2025:anexo-ii-instruccion-2-3-incompatibilidades):
#
#   "En ningún caso será aplicable el índice corrector para empresas de
#   pequeña dimensión (b.1) a las actividades para las que están previstos
#   los índices correctores especiales enumerados en las letras a.2), a.3),
#   a.4) y a.5)."
#   "Cuando resulte aplicable el índice corrector para empresas de pequeña
#   dimensión (b.1) no se aplicará el índice corrector de exceso (b.3)."
#
# The m131_resolve_modulos_indice_exceso op (Fase 3ª,
# 0003-modulos-engine.toml) applies the índice de exceso (b.3) unconditionally
# for every tabled epígrafe in m131-modulos-cuantia-exceso-2026, without
# cross-checking either the b.1/b.3 exclusivity above or the fact that two of
# the tabled epígrafes carry a documented índice corrector especial: "721.2"
# (transporte por autotaxis, letra a.2) and "722" (transporte de mercancías
# por carretera, letra a.4). The engine does not model b.1 (pequeña
# dimensión) or a.2/a.4 at all, so it cannot itself decide whether b.3 was
# the correct índice to apply for these two epígrafes — an operator whose
# actividad carries the especial índice should confirm the computed
# reference figure (Fase 3ª/4ª) is not overstated before relying on it.
# ADVISORY (non-blocking): the índice-exceso chain feeds only the
# internal-only "modulos-rendimiento-neto-actividad" reference casilla
# (never the filed casilla 01), so this is a prompt to verify a REFERENCE
# figure, not a filed-value gate.
#
# Fires iff the índice-exceso path activated (módulos differs from minorado
# by more than a cent — the índice 1,30 only applies when minorado exceeds
# the tabled cuantía) AND the declared epígrafe is one of the two tabled
# activities carrying a documented índice especial.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-modulos-indice-exceso-incompatible-autotaxi"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "721.2", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hac-1425-2025:anexo-ii-instruccion-2-3-incompatibilidades"]

[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-modulos-indice-exceso-incompatible-mercancias"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "722", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hac-1425-2025:anexo-ii-instruccion-2-3-incompatibilidades"]
