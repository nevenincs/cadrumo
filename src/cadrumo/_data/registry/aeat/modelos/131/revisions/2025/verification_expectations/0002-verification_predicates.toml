# AEAT M131 Casilla 11 cap rule: when C10 is strictly positive, C11
# (resultados negativos de trimestres anteriores) MUST NOT exceed C10
# (cuota positiva del trimestre). Source: AEAT M131 instructions
# "en ningún caso podrá figurar en la casilla 11 un importe superior a
# la cantidad positiva consignada en la casilla 10". Enforced via the
# cap_le_when_positive predicate DSL operator.
[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-c11-cap-by-c10"
expression = 'cap_le_when_positive(["11", "10"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["rd-439-2007:art-110"]

# No-silent-under-declaration advisory. C01 ("Suma de rendimientos netos" —
# manual módulos sum for the datos-base activities) and C02 ("Pago fraccionado
# previo por datos-base" — manual) are both operator inputs because the módulos
# rendimiento is determined externally (the annual Orden de módulos tables, not
# modelled in the registry).
#
# Legal attribution:
# - RD 439/2007 art. 110.1.b establishes both the datos-base determination
#   rule and the objective-estimation 4 / 3 / 2 por ciento scale keyed on
#   personal asalariado at the datos-base reference date.
# - The official M131 instructions (aeat-modelo-131-instructions, Casilla 02)
#   mirror that statutory scale for the filing surface. The 2 por 100 is the
#   scale minimum.
# - RD 439/2007 art. 110.4 grants the right to apply higher percentages;
#   the instructions confirm "no se permiten porcentajes inferiores" to the
#   scale minimums.
#
# A strictly positive C01 therefore ALWAYS yields a strictly positive C02
# (the scale minimum is 2 por 100 > 0); C02 = 0 on a positive C01 is a silent
# under-declaration (the datos-base section contributes nothing to
# C07 = C02 + C04 + C06, so the resultado collapses to zero on positive módulos
# activity). ADVISORY (non-blocking): the implication holds trivially when C01
# is absent or zero, so a filer with no datos-base activity raises nothing.
# There is no legitimate positive-C01/zero-C02 case, so the advisory is
# false-positive-free. The durable fix is modelling the módulos determination
# itself (Orden de módulos signos × índices correctores) so C01 and C02 become
# computed; until it lands this advisory makes the under-declaration
# non-silent, mirroring the M200 base-imponible advisory.
[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-pago-fraccionado-determinado-cuando-rendimientos-positivos"
expression = 'implies_nonzero(["01", "02"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-110"]

# Table-driven-engine-vs-operator-declared discrepancy (M131 estimación-
# objetiva módulos engine). Casilla 01 ("Suma de rendimientos netos") stays a
# manual operator input;
# for a tabled IAE activity (see 0002-modulos-coeficientes.toml for the
# current phased coverage) the units×coefficient engine now produces a
# computed reference figure (modulos-rendimiento-neto-actividad, Fase 1ª +
# Fase 4ª: previo − 5 por ciento reducción general). When the engine has
# coverage (computed casilla > 0) and the operator's declared casilla 01
# differs from it by more than one cent, this ADVISORY prompts a review — it
# does not assume the engine is authoritative over the operator's declared
# figure (Fases 2ª/3ª correcting factors, which the taxpayer may legitimately
# claim, are intentionally not modelled yet), so it stays a prompt, never a
# BLOCKING_RULE.
[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-modulos-computed-diverges-de-c01"
expression = 'advisory_when_computed_diverges(["01", "modulos-rendimiento-neto-actividad"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:art-4", "orden-hac-1347-2024:da-1"]

# Índice-exceso (b.3) / índices-especiales incompatibility ADVISORY (mirrors
# the M100 EO-agraria índice-incompatibility advisory). Orden
# HAC/1347/2024 Anexo II, instrucción 2.3 declares (see
# orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades):
#
#   "En ningún caso será aplicable el índice corrector para empresas de
#   pequeña dimensión (b.1) a las actividades para las que están previstos
#   los índices correctores especiales enumerados en las letras a.2), a.3),
#   a.4) y a.5)."
#   "Cuando resulte aplicable el índice corrector para empresas de pequeña
#   dimensión (b.1) no se aplicará el índice corrector de exceso (b.3)."
#
# The 2025 engine (Fase 3ª, m131_resolve_modulos_indices_generales,
# 0003-modulos-engine.toml) applies the full b.1 -> b.2 -> b.3 -> b.4 cascade
# in the Orden's own literal enumeration order and already MODELS both
# incompatibilities structurally: a declared índice de pequeña dimensión
# (b.1) is IGNORED (never applied) for the two tabled epígrafes carrying a
# documented índice especial ("721.2" transporte por autotaxis, letra a.2;
# "722" transporte de mercancías por carretera / servicios de mudanzas, letra
# a.4 — see the "modelo-131-2025-modulos-pequena-dimension-ignorado-especial"
# ADVISORY below), and when a (non-ignored) b.1 índice applies, b.3 is skipped
# outright for that activity. This pair of predicates is therefore
# defence-in-depth confirmation, not a gap-filler for an unmodelled
# incompatibility: they surface a residual divergence between the declared
# epígrafe (721.2 / 722) and the computed reference figure so an operator can
# confirm the engine's structural handling matches their own reading of the
# Orden, even though the engine already applies the correct índice.
#
# Fires iff the índice-exceso path activated (módulos differs from minorado
# by more than a cent — the índice 1,30 only applies when the rendimiento
# (rectificado by b.1/b.2, if declared) exceeds the tabled cuantía) AND the
# declared epígrafe is one of the two tabled activities carrying a documented
# índice especial. "757" (servicios de mudanzas, also letra a.4) is excluded:
# it has no cuantía row in m131-modulos-cuantia-exceso-2025, so the
# índice-exceso path can never activate for it (see
# 0002-modulos-coeficientes.toml) — a ["modulos-epigrafe", "757", ...]
# predicate would be silently dead, which no-silent-under-declaration itself
# forbids.
[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-modulos-indice-exceso-incompatible-autotaxi"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "721.2", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades"]

[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-modulos-indice-exceso-incompatible-mercancias"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "722", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades"]

# Índices correctores generales incompatibility ADVISORY guards
# (Fase 3ª, m131_resolve_modulos_indices_generales,
# 0003-modulos-engine.toml). Orden HAC/1347/2024 Anexo II, instrucción 2.3
# declares two further binding exclusivity rules the cascade formula
# structurally enforces (never silently applies both sides): the índice de
# pequeña dimensión (b.1) is IGNORED for the two tabled epígrafes carrying a
# documented índice especial (721.2, 722), and the índice de temporada (b.2)
# and el índice de inicio de nuevas actividades (b.4) are mutually exclusive
# (temporada wins per the Orden's own enumeration order). Both non-blocking
# ADVISORY findings surface the ignored declaration to the operator — the
# engine already applies the correct (non-ignored) índice, so these are
# review prompts confirming the operator's declaration was not silently
# dropped, per no-silent-under-declaration.
[[revisions."2025".verification_predicates]]
predicate_id = "modelo-131-2025-modulos-pequena-dimension-ignorado-especial"
expression = 'advisory_when_positive(["modulos-pequena-dimension-ignorado-flag"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades"]

