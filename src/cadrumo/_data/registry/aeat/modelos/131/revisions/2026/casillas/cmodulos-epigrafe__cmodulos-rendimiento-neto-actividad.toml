# M131 estimación-objetiva módulos engine — 2026 per-year roll-forward.
# Replicates the 2025 revision's module-engine casilla set for the 2026 revision: the
# bundled Orden HAC/1425/2025 Anexo II reproduces the same signos-índices-
# módulos mechanism and, for every tabled activity, the same euro figures as
# Orden HAC/1347/2024 (see 0002-modulos-coeficientes.toml for the numeric
# cross-check). The eight operator-declared unit-count inputs (epígrafe + up
# to seven módulo unit counts — the highest signo count among the tabled
# activities, 644.1/644.2/644.3 comercio menor de pan/pastelería) are
# calculation-support casillas absent from the AEAT-published Diseño de
# Registros (no export_refs); the two computed casillas
# (modulos-rendimiento-neto-previo / -actividad) are internal_only. Together
# they feed a computed reference figure that the
# "modelo-131-2026-modulos-computed-diverges-de-c01" advisory compares
# against the operator-declared official casilla 01 ("Suma de rendimientos
# netos"), which remains the filed manual input (Option B — the fase-1-only
# product would over-state the figure if wired directly into casilla 01
# without the correcting stages; the guard ships instead of a silent
# substitution).
#
# A ninth operator-declared input, "modulos-minoracion-inversion", carries
# the fase 2ª minoración por incentivos a la inversión (amortización del
# inmovilizado afecto, Orden HAC/1425/2025 Anexo II, instrucción 2.2.b) as a
# declared euro amount — this first slice does not model a per-element libro
# registro de bienes de inversión (acquisition value, amortization
# coefficient, elapsed period per asset), so the operator supplies the
# already-computed figure rather than the engine deriving it from an asset
# register it does not have. This is honest, not a fabrication: the engine
# never invents the figure, and a blank input simply omits a legitimate
# additional reduction the operator may or may not claim (never over-states
# the minorado).
#
# Grounded in LIRPF art. 31 (estimación objetiva) + Orden HAC/1425/2025 art. 4
# (Aprobación de los signos, índices o módulos) for fase 1ª, and Orden
# HAC/1425/2025 disposición adicional primera (5 por ciento reducción general,
# explicitly extended to the 2026 pagos fraccionados by apartado 3) for fase
# 4ª.
