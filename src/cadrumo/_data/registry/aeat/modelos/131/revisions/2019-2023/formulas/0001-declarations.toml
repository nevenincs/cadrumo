# Módulos engine phases for 2022 and 2023 (Orden HFP/1335/2021 and Orden
# HFP/1172/2022, Anexo II, instrucciones 2.1 to 2.4): fase 1ª rendimiento neto
# previo, fase 2ª minoraciones por incentivos al empleo y a la inversión, fase
# 3ª índices correctores generales in the Orden's order and incompatibilities,
# fase 4ª reducción general, whose dated rate the parameter carries per year.
