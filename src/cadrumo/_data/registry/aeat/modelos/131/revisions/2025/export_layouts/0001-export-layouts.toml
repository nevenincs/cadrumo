kind = "computed"
# DELIBERATE, DO NOT "FIX" THIS INTO A FILLER.
# The DPA design row 5 declares its contenido as
# 'Blanco (No complementaria) o "C" (Complementaria)' -- unlike Pag. 1 row 5,
# which declares 'En blanco' and is correctly a filler. This slot carries a
# real datum, and the admitted character is "C".
#
# A boolean export field renders the canonical "X", which AEAT refuses here,
# so this slot resolves the character through the computed carrier that
# reads amendment evidence and emits "C".
