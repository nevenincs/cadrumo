# Pag. 0 of the Diseno de Registros: the file envelope. Positions 1-328 carry
# the modelo/ejercicio/periodo identifier followed by the <AUX>...</AUX>
# administration block. Positions 93-96 (Version del Programa) and 101-109 (NIF
# Empresa Desarrollo) are the design's "Nota 1" slots, filled by the entidad
# desarrolladora del software; no such identity is declared anywhere in this
# project, so they are deliberately left unwritten rather than guessed.

