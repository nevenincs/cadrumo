# Continuity from revision 2019-2023 into 2024, one row per concept both
# revisions declare. Every one is "unchanged", and that is a MEASURED result
# rather than a default: for all 16 shared continuidad_ids the legal_refs
# tuples are identical between the two revisions and the Spanish labels are
# byte-identical in the locale catalogue. The nine module-unit concepts the
# 2024 revision introduces (irpf-pf-modulos-*) get no row: a concept with no
# prior revision has no transition to declare, and none was retired.

