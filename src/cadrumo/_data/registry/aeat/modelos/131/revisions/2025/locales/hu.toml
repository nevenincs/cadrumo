"modulos-epigrafe" = "A tevékenység IAE-tételszáma az objektív becslési (modulos) rendszerben. A 659.4 és 691.9 tételszámok, amelyek két különböző tevékenységet ugyanazon kód alatt csoportosítanak, esetén használja az \"a\" vagy \"b\" utótagot (pl. \"659.4a\", \"691.9b\") a tevékenységnek megfelelően — a pontos hozzárendeléshez tekintse meg az m131-modulos-coeficientes-2025 együttható paramétert."
"modulos-indice-inicio-actividad" = "Korrekciós index új tevékenységek indítására (b.4 pont, 2023-01-01 után kizárólagos helyiségben indított tevékenység). Az üzemeltető által megadott index (0,80/0,90; 0,60/0,70 ≥33%-os fogyatékosság esetén, HAC/1347/2024 rendelet II. melléklet, 2.3.b.4 utasítás); a motor nem modellezi az indítás évét vagy a fogyatékosságot. Összeegyeztethetetlen a szezonális indexszel (b.2): ha mindkettőt megadják, a szezonális index érvényesül."
"modulos-indice-pequena-dimension" = "Korrekciós index kisvállalkozások számára (b.1 pont — egy településen, egyetlen helyiségben, alkalmazott nélkül vagy legfeljebb 2 alkalmazottal). Az üzemeltető által megadott index (0,70/0,75/0,80/0,90, HAC/1347/2024 rendelet II. melléklet, 2.3.b.1 utasítás); a motor nem modellezi az adózó tényeit. Soha nem alkalmazandó a különleges indexszel rendelkező tevékenységekre (721.2, 722)."
"modulos-indice-temporada" = "Szezonális korrekciós index (b.2 pont — szezonális tevékenység, évi legfeljebb 180 nap). Az üzemeltető által megadott index (1,50/1,35/1,25 az időtartamtól függően, HAC/1347/2024 rendelet II. melléklet, 2.3.b.2 utasítás); a motor nem modellezi az időtartamot mint adózói tényt. Összeegyeztethetetlen az új tevékenység indítási indexével (b.4): ha mindkettőt megadják, ez érvényesül."
"modulos-minoracion-inversion" = "Csökkentés beruházási ösztönzők után (a használatban lévő tárgyi vagy immateriális eszközök amortizációja, a beruházási eszközök nyilvántartása szerint). Az üzemeltető által megadott összeg; a motor nem modellez tételenkénti eszköznyilvántartást — lásd a HAC/1347/2024 rendelet II. mellékletének 2.2.b) utasítását és a saját amortizációs táblázatát."
"modulos-pequena-dimension-ignorado-flag" = "Belső jelző (1/0): a bejelentett kisvállalkozási korrekciós index (b.1) figyelmen kívül maradt a tevékenység különleges korrekciós indexével való összeférhetetlenség miatt (HAC/1347/2024 rendelet II. melléklet, 2.3.a/b.1 utasítás)."
"modulos-rendimiento-neto-actividad" = "A tevékenység nettó jövedelme (4. szakasz: modulok − általános 5%-os csökkentés)"
"modulos-rendimiento-neto-minorado" = "Csökkentett nettó jövedelem (2. szakasz: előzetes − foglalkoztatási kedvezmény csökkentése − beruházási kedvezmény csökkentése)"
"modulos-rendimiento-neto-modulos" = "Modulok szerinti nettó jövedelem (3. szakasz: csökkentett összeg az általános korrekciós indexekkel kiigazítva — kisvállalkozás, szezonalitás/új tevékenység indítása, többlet — a HAC/1347/2024 rendelet II. mellékletének 2.3 utasításában meghatározott sorrendben és összeférhetetlenségekkel)"
"modulos-rendimiento-neto-previo" = "Előzetes nettó jövedelem (1. szakasz: Σ modulegységek × egységenkénti éves hozam)"
"modulos-temporada-inicio-actividad-conflicto-flag" = "Belső jelző (1/0): a szezonális korrekciós indexet (b.2) és az új tevékenység indítási korrekciós indexét (b.4) egyidejűleg jelentették be, amelyek kölcsönösen összeférhetetlenek (HAC/1347/2024 rendelet II. melléklet, 2.3 utasítás)."
"saldo-negativo-fin-periodo" = "Későbbi időszakokra átvihető negatív egyenleg (max. 0, -10. rovat)"

