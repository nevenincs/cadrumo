# Exhaustive reconcile-when-present verification for Modelo 131
# revision 2026: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-131-2026-calculation-verification).
[[revisions."2026".verification_expectations]]
id = "modelo-131-2026-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "modulos-rendimiento-neto-actividad",
    "modulos-rendimiento-neto-minorado",
    "modulos-rendimiento-neto-modulos",
    "modulos-rendimiento-neto-previo",
    "saldo-negativo-fin-periodo",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["rd-439-2007:art-110", "rd-439-2007:art-95"]
source_refs = ["aeat-modelo-131-instructions", "aeat-dr-131-2026"]
