[labels]
"01" = "Sum of net income"
"02" = "Preliminary instalment payment using base data (datos-base)"
"03" = "Turnover or income without base data"
"04" = "Preliminary instalment payment without base data"
"05" = "Agricultural income for the quarter"
"06" = "Preliminary agricultural instalment payment"
"07" = "Sum of preliminary instalment payments"
"08" = "Withholdings and payments on account"
"09" = "Reduction for net income from business/professional activities"
"10" = "Difference"
"11" = "Negative results from previous quarters"
"12" = "Payment of loans for the taxpayer's main home"
"13" = "Total"
"14" = "Result payable from previous self-assessments"
"15" = "Result of the return"
"modulos-1-unidades" = "Módulo 1 (Employed staff): number of units"
"modulos-1-unidades-anterior" = "Módulo 1 (Employed staff): number of units in the previous tax year (2024), for the employment-incentive reduction"
"modulos-2-unidades" = "Módulo 2 (Non-employed staff): number of units"
"modulos-3-unidades" = "Módulo 3 (activity-specific unit: floor area, distance travelled or load): number of units"
"modulos-4-unidades" = "Módulo 4 (activity-specific unit: electricity or other energy consumption): number of units"
"modulos-5-unidades" = "Módulo 5 (activity-specific unit, e.g. remaining floor area of an independent premises or tables): number of units"
"modulos-6-unidades" = "Módulo 6 (activity-specific unit, e.g. remaining floor area of a non-independent premises or type A machines): number of units"
"modulos-7-unidades" = "Módulo 7 (activity-specific unit, e.g. oven surface area or type B machines): number of units"
"modulos-epigrafe" = "IAE heading of the activity under the objective estimation (módulos) regime. For headings 659.4 and 691.9, which group two different activities under the same code, use the suffix \"a\" or \"b\" (e.g. \"659.4a\", \"691.9b\") according to the activity — see the coefficient parameter m131-modulos-coeficientes-2025 for the exact assignment."
"modulos-indice-inicio-actividad" = "Corrective index for the start of new activities (letter b.4, activity started on or after 1-1-2024 in an exclusive premises). Index declared by the operator (0.80/0.90; 0.60/0.70 with disability ≥33%, Order HAC/1347/2024 Annex II, instruction 2.3.b.4); the engine does not model the start year or the disability. Incompatible with the seasonal index (b.2): if both are declared, the seasonal index prevails."
"modulos-indice-pequena-dimension" = "Corrective index for small enterprises (letter b.1 — single municipality, single premises, no staff or up to 2 employees). Index declared by the operator (0.70/0.75/0.80/0.90, Order HAC/1347/2024 Annex II, instruction 2.3.b.1); the engine does not model taxpayer facts. Never applies to activities with a special index (721.2, 722)."
"modulos-indice-temporada" = "Seasonal corrective index (letter b.2 — seasonal activity, up to 180 days/year). Index declared by the operator (1.50/1.35/1.25 depending on duration, Order HAC/1347/2024 Annex II, instruction 2.3.b.2); the engine does not model duration as a taxpayer fact. Incompatible with the new-activity start-up index (b.4): if both are declared, this one prevails."
"modulos-minoracion-inversion" = "Reduction for investment incentives (depreciation of tangible or intangible fixed assets in use, per the investment-goods register). Amount declared by the operator; the engine does not model a per-item asset register — see Order HAC/1347/2024 Annex II, instruction 2.2.b) and your own depreciation schedule."
"modulos-pequena-dimension-ignorado-flag" = "Internal indicator (1/0): the declared small-enterprise corrective index (b.1) was ignored due to incompatibility with the activity's special corrective index (Order HAC/1347/2024 Annex II, instruction 2.3.a/b.1)."
"modulos-rendimiento-neto-actividad" = "Net income from the activity (Phase 4: módulos − general 5 percent reduction)"
"modulos-rendimiento-neto-minorado" = "Reduced net income (Phase 2: preliminary − employment-incentive reduction − investment-incentive reduction)"
"modulos-rendimiento-neto-modulos" = "Net income from módulos (Phase 3: reduced amount adjusted by the general corrective indices — small enterprise, seasonal/new-activity start-up, excess — in the order and with the incompatibilities of Order HAC/1347/2024 Annex II, instruction 2.3)"
"modulos-rendimiento-neto-previo" = "Preliminary net income (Phase 1: Σ módulo units × annual yield per unit)"
"modulos-temporada-inicio-actividad-conflicto-flag" = "Internal indicator (1/0): the seasonal corrective index (b.2) and the new-activity start-up corrective index (b.4) were declared simultaneously, which are mutually incompatible (Order HAC/1347/2024 Annex II, instruction 2.3)."
"saldo-negativo-fin-periodo" = "Negative balance carried forward to later periods (max. 0, -box 10)"

