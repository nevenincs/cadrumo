# Pag. 0 of the Diseno de Registros: the file envelope. Positions 1-328 carry
# the modelo/ejercicio/periodo identifier followed by the <AUX>...</AUX>
# administration block. Positions 93-96 (Version del Programa) and 101-109 (NIF
# Empresa Desarrollo) are the design's "Nota 1" slots: "A cumplimentar por las
# entidades desarrolladoras (EEDD)". No developer identity is declared in
# registry data -- AeatProductSoftwareIdentity is supplied at runtime with
# reviewed evidence and is reachable from a layout only through the M303-scoped
# filing-envelope declaration -- so they are left unwritten rather than guessed.
