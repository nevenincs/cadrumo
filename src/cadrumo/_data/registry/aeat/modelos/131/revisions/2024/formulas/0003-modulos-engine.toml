# ignored because the activity carries a documented índice especial
# (Orden HFP/1359/2023 Anexo II, instrucción 2.3).
[[revisions."2024".formulas]]
id = "modelo-131-2024-modulos-pequena-dimension-ignorado-flag"
target_casilla_id = "modulos-pequena-dimension-ignorado-flag"
expression = { op = "m131_resolve_modulos_pequena_dimension_ignorado_flag", args = [
    { casilla_id = "modulos-epigrafe" },
    { casilla_id = "modulos-indice-pequena-dimension" },
] }
legal_refs = ["orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]
source_refs = ["aeat-renta-2024-manual-parte1"]
[[revisions."2024".formulas.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = [
    "El índice corrector para empresas de pequeña dimensión no será aplicable a las",
]

# Advisory-support flag: both índice de temporada (b.2) and índice de inicio
# de nuevas actividades (b.4) were declared simultaneously (mutually
# exclusive per Orden HFP/1359/2023 Anexo II, instrucción 2.3).
[[revisions."2024".formulas]]
id = "modelo-131-2024-modulos-temporada-inicio-actividad-conflicto-flag"
target_casilla_id = "modulos-temporada-inicio-actividad-conflicto-flag"
expression = { op = "m131_resolve_modulos_temporada_inicio_conflicto_flag", args = [
    { casilla_id = "modulos-indice-temporada" },
    { casilla_id = "modulos-indice-inicio-actividad" },
] }
legal_refs = ["orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]
source_refs = ["aeat-renta-2024-manual-parte1"]
[[revisions."2024".formulas.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
