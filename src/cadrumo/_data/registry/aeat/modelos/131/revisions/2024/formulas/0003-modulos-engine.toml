# Fase 4ª — rendimiento neto de la actividad: módulos minus the 5 por 100
# reducción general (Orden HFP/1359/2023 DA-1, apartados 1 y 3).
[[revisions."2024".formulas]]
id = "modelo-131-2024-modulos-rendimiento-neto-actividad"
target_casilla_id = "modulos-rendimiento-neto-actividad"
expression = { op = "subtract", args = [
    { casilla_id = "modulos-rendimiento-neto-modulos" },
    { op = "percent", args = [
        { casilla_id = "modulos-rendimiento-neto-modulos" },
        { parameter = "m131-modulos-reduccion-general-2024" },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hfp-1359-2023:da-1"]
source_refs = ["aeat-renta-2024-manual-parte1"]
[[revisions."2024".formulas.source_citations]]
source_ref = "aeat-renta-2024-manual-parte1"
required_text = ["reducción general del 5 por 100"]
