legal_refs = ["orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]

# Índices correctores generales incompatibility ADVISORY guards
# (Fase 3ª, m131_resolve_modulos_indices_generales,
# 0003-modulos-engine.toml). Orden HFP/1359/2023 Anexo II, instrucción 2.3
# declares two further binding exclusivity rules the cascade formula
# structurally enforces (never silently applies both sides): the índice de
# pequeña dimensión (b.1) is IGNORED for the two tabled epígrafes carrying a
# documented índice especial (721.2, 722), and the índice de temporada (b.2)
# and el índice de inicio de nuevas actividades (b.4) are mutually exclusive
# (temporada wins per the Orden's own enumeration order). Both non-blocking
# ADVISORY findings surface the ignored declaration to the operator — the
# engine already applies the correct (non-ignored) índice, so these are
# review prompts confirming the operator's declaration was not silently
# dropped, per no-silent-under-declaration.
[[revisions."2024".verification_predicates]]
id = "advisory-when-positive:modulos-pequena-dimension-ignorado-especial"
predicate_id = "modelo-131-2024-modulos-pequena-dimension-ignorado-especial"
expression = 'advisory_when_positive(["modulos-pequena-dimension-ignorado-flag"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]

