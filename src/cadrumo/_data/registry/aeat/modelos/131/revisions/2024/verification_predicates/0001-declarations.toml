# AEAT M131 Casilla 11 cap rule: when C10 is strictly positive, C11
# (resultados negativos de trimestres anteriores) MUST NOT exceed C10
# (cuota positiva del trimestre). Source: AEAT M131 instructions
# "en ningún caso podrá figurar en la casilla 11 un importe superior a
# la cantidad positiva consignada en la casilla 10". Enforced via the
# cap_le_when_positive predicate DSL operator.
[[revisions."2024".verification_predicates]]
id = "advisory-when-computed-diverges:modulos-computed-diverges-de-c01"
predicate_id = "modelo-131-2024-modulos-computed-diverges-de-c01"
expression = 'advisory_when_computed_diverges(["01", "modulos-rendimiento-neto-actividad"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-31", "orden-hfp-1359-2023:art-4", "orden-hfp-1359-2023:da-1"]

# Índice-exceso (b.3) / índices-especiales incompatibility ADVISORY (mirrors
# the M100 EO-agraria índice-incompatibility advisory, and the 2025 M131
# engine's own pair of the same predicates). Orden HFP/1359/2023 Anexo II,
# instrucción 2.3 declares (see
# orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades):
#
#   "En ningún caso será aplicable el índice corrector para empresas de
#   pequeña dimensión (b.1) a las actividades para las que están previstos
#   los índices correctores especiales enumerados en las letras a.2), a.3),
#   a.4) y a.5)."
#   "Cuando resulte aplicable el índice corrector para empresas de pequeña
#   dimensión (b.1) no se aplicará el índice corrector de exceso (b.3)."
#
# The 2024 engine (Fase 3ª, m131_resolve_modulos_indices_generales,
# 0003-modulos-engine.toml) applies the full b.1 -> b.2 -> b.3 -> b.4 cascade
# in the Orden's own literal enumeration order and already MODELS both
# incompatibilities structurally: a declared índice de pequeña dimensión
# (b.1) is IGNORED (never applied) for the two tabled epígrafes carrying a
# documented índice especial ("721.2" transporte por autotaxis, letra a.2;
# "722" transporte de mercancías por carretera / servicios de mudanzas, letra
# a.4 — see the "modelo-131-2024-modulos-pequena-dimension-ignorado-especial"
# ADVISORY below), and when a (non-ignored) b.1 índice applies, b.3 is skipped
# outright for that activity. This pair of predicates is therefore
# defence-in-depth confirmation, not a gap-filler for an unmodelled
# incompatibility: they surface a residual divergence between the declared
# epígrafe (721.2 / 722) and the computed reference figure so an operator can
# confirm the engine's structural handling matches their own reading of the
# Orden, even though the engine already applies the correct índice.
#
# Fires iff the índice-exceso path activated (módulos differs from minorado
# by more than a cent — the índice 1,30 only applies when the rendimiento
# (rectificado by b.1/b.2, if declared) exceeds the tabled cuantía) AND the
# declared epígrafe is one of the two tabled activities carrying a documented
# índice especial. "757" (servicios de mudanzas, also letra a.4) is excluded:
# it has no cuantía row in m131-modulos-cuantia-exceso-2024, so the
# índice-exceso path can never activate for it (see
# 0002-modulos-coeficientes.toml) — a ["modulos-epigrafe", "757", ...]
# predicate would be silently dead, which no-silent-under-declaration itself
# forbids.
[[revisions."2024".verification_predicates]]
id = "casilla-equals-implies-diverges:modulos-indice-exceso-incompatible-autotaxi"
predicate_id = "modelo-131-2024-modulos-indice-exceso-incompatible-autotaxi"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "721.2", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
finding_kind = "ADVISORY"
legal_refs = ["orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]

[[revisions."2024".verification_predicates]]
id = "casilla-equals-implies-diverges:modulos-indice-exceso-incompatible-mercancias"
predicate_id = "modelo-131-2024-modulos-indice-exceso-incompatible-mercancias"
expression = 'casilla_equals_implies_diverges(["modulos-epigrafe", "722", "modulos-rendimiento-neto-minorado", "modulos-rendimiento-neto-modulos"])'
