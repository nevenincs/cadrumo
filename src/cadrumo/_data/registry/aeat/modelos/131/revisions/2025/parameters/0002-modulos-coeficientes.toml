    # ("<epígrafe>:<módulo>") with no schema-level third axis — resolving the
    # collision does not need a schema change, only a documented key-namespace
    # convention: each colliding activity is tabled under the IAE code plus a
    # lowercase disambiguating suffix ("a" for the first-listed Anexo II
    # activity, "b" for the second), and the operator types the suffixed form
    # into the "modulos-epigrafe" free-text casilla for that activity. The bare
    # unsuffixed code (e.g. "659.4") remains untabled (no coefficient row), so
    # an operator who has not yet been told which sub-activity applies gets the
    # "activity not yet table-driven" advisory rather than a silently
    # misattributed coefficient from the wrong sub-activity.
