# M131 estimación-objetiva módulos coefficient table (Fase 1ª: rendimiento neto
# previo). Keyed-bracket-table parameter mapping "<epígrafe IAE>:<módulo>" to
# the "rendimiento anual por unidad antes de amortización" (Anexo II, Orden
# HAC/1347/2024, art. 4). Lookup is exact-match on the composite key; there is
# no interval-overlap semantics because the domain is a discrete (epígrafe,
# módulo) catalogue, not a numeric-continuous base.
#
# Incrementally authored dataset: only activities grounded and cross-checked
# against the bundled corpus are tabled here; the ~80+-activity Orden Anexo II
# is authored over time. An epígrafe absent from this table is NOT computed
# by the engine; casilla 01 stays reachable as a manual operator input and the
# "modelo-131-2025-modulos-computed-diverges-de-c01" advisory fires instead of a
# silent zero.
#
# Tabled activities: transporte por autotaxis (721.2), transporte de
# mercancías por carretera (722), peluquería (972.1); café-bar / restaurante
# (671.4, 671.5, 672.1-2-3, 673.1, 673.2) and comercio al por menor de
# alimentación (642.1-2-3-4, 642.5, 642.6, 643.1-2, 644.1, 644.2, 644.3,
# 644.6, 647.1, 647.2-3); comercio al por menor de textil/calzado/mercería
# (651.1, 651.2, 651.3-y-5, 651.4, 651.6), droguería/perfumería (652.2-y-3),
# mueble/electrodoméstico/menaje/construcción (653.1, 653.2, 653.3, 653.4-y-5,
# 653.9), recambios/maquinaria/neumáticos (654.2, 654.5, 654.6), oficina/
# óptica/papelería/juguetería/semillas (659.2, 659.3, 659.6, 659.7), comercio
# mixto (662.2), comercio ambulante (663.1, 663.2, 663.3, 663.4, 663.9),
# hospedaje (681, 682, 683), reparaciones (691.1, 691.2, 692, 699), and
# transporte urbano colectivo (721.1-y-3); remaining reparaciones (691.9
# collision pair), engrase/lavado de vehículos (751.5), mudanzas (757),
# mensajería/recadería (849.5), enseñanza (933.1, 933.9, 967.2), servicios
# personales (971.1, 972.2, 973.3), remaining comercio/hostelería (641 frutas
# y verduras, 675 quioscos, 676 chocolaterías/heladerías/horchaterías), and the
# second 659.4 collision-pair activity. Two epígrafe collisions (659.4, 691.9
# — each names two distinct activities under one IAE code) are resolved via a
# documented key-namespace suffix convention ("659.4a"/"659.4b",
# "691.9a"/"691.9b") — see the note further below, immediately before the
# affected rows. This covers every non-agrarian Anexo II activity except the
# purely-industrial/manufacturing epígrafes (419.x panadería industrial,
# 423.9 patatas fritas industriales, etc.), which fall outside the tabled
# commerce, hostelería, transporte, reparaciones, enseñanza, and servicios
# personales groups. The Anexo I agrarian activities (índice de rendimiento
# neto × volumen de ingresos — a materially different mechanism, not units ×
# coefficient) remain a separate, distinct engine not yet implemented here.
#
# Cross-checked against the bundled consolidated Orden HAC/1347/2024 Anexo II
# (corpus/normatives/html/orden-hac-1347-2024.html) AND against the AEAT Manual
# práctico de Renta 2025, Parte 1, Capítulo 8 "Apéndice: Rendimientos anuales
# por unidad de módulo antes de amortización aplicables en el ejercicio 2025"
# — both sources state byte-identical euro figures for every row below. One
# noted anomaly: the bundled Orden HTML (corpus row at 651.3 y 5, key
# "651.3", not tabled here) carries a literal typo "11.998.85" (period
# instead of comma decimal separator) verbatim in the official BOE-published
# HTML; no row below is affected by this anomaly, flagged here for the next
# author who reaches that epígrafe.
#
# Row format note: rows are authored as a single `keyed_brackets = [ {...}, ... ]`
# array-literal (one inline table per row) rather than repeated
# `[[revisions."2025".parameters.keyed_brackets]]` array-of-tables headers, to
# keep this fragment under the committed-registry per-file line-count gate
# (`test_committed_registry_toml_files_stay_reviewable`) as the dataset grew.
# Both forms parse to an identical tuple of rows; this is a pure
# authoring-density change, not a schema or semantic change.
[[revisions."2025".parameters]]
id = "m131-modulos-coeficientes-2025"
data_type = "keyed_bracket_table"
unit = "euro_per_unit"
legal_refs = ["orden-hac-1347-2024:art-4"]
source_refs = ["aeat-renta-2025-manual-parte1"]

