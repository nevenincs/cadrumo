# M210 IRNR official tipo-de-renta code enrolment ledger.
#
# The official Modelo 210 form asks the operator for a two-digit
# "Tipo de renta" code (Orden EHA/3316/2010, "HOJA INFORMATIVA 210 -
# TIPOS DE RENTA"). This parameter declares the set of official codes the
# 2025 revision currently accepts, so the codes carry the canonical registry
# legal-grounding gate (legal_refs -> corpus). It is a presence ledger, not a
# rate table: the `value` column is a sentinel (1) marking the code as
# declared, and the RATE lives in `m210-tipo-gravamen-2025` keyed by the
# conceptual `tipo_renta` the code projects to.
#
# KNOWN ITEM (cleanliness, not correctness): the sentinel presence-value abuses
# the keyed_bracket_table (rate-table) shape with non-rate data. It is contained
# and documented; if code-review pushes on the type-shape, the clean resolution
# is a categorical / string-valued parameter type (representation C), and the
# grounding stays exactly here — registry-resident.
#
# The code -> `TipoRentaIrnr` projection lives in `aeat.core._irnr`
# (`OFFICIAL_M210_TIPO_RENTA_CODES`); the registry-build parity gate
# (`validate_m210_tipo_renta_code_projection_parity`) refuses at build time if
# this declared code set and that core projection diverge in either direction
# (a declared code with no projection, or a projected code not declared here).
#
# Only the RATE-CONCEPT-grounded codes are declared. The bundled TRLIRNR corpus
# is a partial extract carrying Art. 25 letters a) general 24%, b) pensiones,
# and f) 19% dividendos/intereses/ganancias only; the special-rate letters
# c/d/e/g/h are absent. The cánones codes 08/09/10/11/12/32 ARE enrolled: cánones
# has no specific letter in the consolidated Art. 25.1, so it is the general
# rendimiento rate under Art. 25.1.a (24%) — bundle-grounded, no fabrication. The
# codes whose rate is still not bundle-verifiable are NOT enrolled yet: asistencia
# técnica 13 (cánones-ADJACENT in the HOJA INFORMATIVA, a possible un-bundled
# special letter, NOT cánones proper), reaseguros 19 (Art. 25.1.e 1.5%),
# navegación 20 (Art. 25.1.d 4%), imposición complementaria 27 (Art. 19.2), and
# premios de loterías 31 (D.A. 5ª gravamen especial). They enrol code-by-code
# once the full consolidated Art. 25 is fetched. Force-mapping any to a rate
# would fabricate it.

[[revisions."2025".parameters]]
id = "m210-tipo-renta-code"
data_type = "keyed_bracket_table"
unit = "code"
legal_refs = [
    "trlirnr-rdleg-5-2004:art-13.1.h",
    "trlirnr-rdleg-5-2004:art-25.1.a",
    "trlirnr-rdleg-5-2004:art-25.1.b",
    "trlirnr-rdleg-5-2004:art-25.1.f",
]
source_refs = [
    "aeat-modelo-210-procedure",
    "boe-modelo-210-base-order",
]

# The code table lives in the AEAT instructions HOJA INFORMATIVA (an
# official_source_guidance source, the only tier a source_citation admits);
# the establishing Orden EHA/3316/2010 (boe-modelo-210-base-order,
# layout_authority tier) stays a source_ref reference above without a citation.
[[revisions."2025".parameters.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["HOJA INFORMATIVA 210", "TIPOS DE RENTA"]

