# M210 IRNR cuota-íntegra formula.
#
# `cuota_integra = base_imponible × tipo_gravamen` per TRLIRNR Art 24
# combined with the resolved rate from Art 25.1.a / 25.1.f / Convenio
# override, or the effective rate from the Art 25.1.b pension tariff
# (see formula `m210-tipo-gravamen-2025-resolve`).

[[revisions."2026-y-siguientes".formulas]]
id = "m210-cuota-integra-2025"
target_casilla_id = "cuota_integra"
expression = { op = "multiply", args = [
    { casilla_id = "base_imponible" },
    { casilla_id = "tipo_gravamen" },
] }
rounding = "money-2"
legal_refs = [
    "trlirnr-rdleg-5-2004:art-24",
    "trlirnr-rdleg-5-2004:art-25.1.a",
    "trlirnr-rdleg-5-2004:art-25.1.b",
]
source_refs = ["aeat-modelo-210-procedure"]

[[revisions."2026-y-siguientes".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["tipo de gravamen", "rendimientos"]
