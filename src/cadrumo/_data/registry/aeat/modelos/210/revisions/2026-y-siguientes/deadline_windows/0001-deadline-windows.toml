# Modelo 210 trimestral a-ingresar deadline windows, grounded in Orden
# EHA/3316/2010 art 5 (plazo de presentación del modelo 210) as consolidated in
# vigor 24/06/2026 — modified by Orden HAC/56/2024 art 4.2 (BOE-A-2024-1772) and
# Orden HAC/623/2026 art 1.2 (BOE-A-2026-13573). Art 5.c.1º, resto de rentas con
# resultado a ingresar (general): "el plazo de presentación e ingreso será los
# veinte primeros días naturales de los meses de abril, julio, octubre y enero, en
# relación con las rentas cuya fecha de devengo esté comprendida en el trimestre
# natural anterior." Each window opens on the 1st and closes on the 20th natural
# day of the month following the natural quarter of devengo (period token = the
# devengo quarter), so 4T closes on the 20 January of the following calendar year.
#
# SCOPE: only the GENERAL a-ingresar trimestral plazo is a clean (modelo, period)
# window. The resultado/tipo-dependent annual plazos of art 5 — arrendamiento
# a-ingresar (20 primeros días de ABRIL del año siguiente), cuota cero (1-20 enero),
# a devolver (desde el 1 de febrero, cuatro años), transmisiones de inmuebles
# (art 14.4 Reglamento) and rentas imputadas tipo 02 (presentación todo el año
# natural siguiente, 1 enero-31 diciembre; la domiciliación es 1 abril-23 diciembre) — depend
# on a computed RESULTADO and on the TIPO de renta, which a single period token
# cannot express; they are not yet modelled here. These windows are calendar-declared
# registry authority and resolve through `resolve_filing_closes_on`; operator M210
# work-unit creation for these periods (period_selector) is not yet modelled, alongside
# the agrupación grouped-rentas detail model.

