# Modelo 210 base / rate / cuota chain casillas.
#
# The base / rate / cuota chain for general, ue_residente, interest,
# ganancia_patrimonial, and the Art. 13.1.h inmobiliaria imputed-real-estate
# base branch. Pension is covered by the live Art. 25.1.b progressive tariff
# parameter. The diseño-de-registro pass renumbered the seven boxes that
# map onto official liquidación numbers (rendimientos_integros=[5],
# gastos_deducibles=[7], base_imponible=[8], tipo_gravamen=[21],
# cuota_integra=[22], retencion_practicada=[29], cuota_diferencial=[31]) and
# added the remaining official boxes in the companion
# 0002-casillas-diseno-registro.toml fragment; the inmobiliaria-support inputs
# (valor_catastral, coeficiente, días, valores) keep their engine-internal
# identifiers as they are not [4]-[31] numbered boxes.
#
# Current wiring:
#  - tipo_renta            manual text (operator-supplied enum key)
#  - rendimientos_integros manual money input for non-imputed branches
#  - valor_catastral / coeficiente_imputacion_inmobiliaria /
#    dias_imputacion / valor_adquisicion / valor_comprobado_administracion:
#                          manual facts for inmobiliaria Art. 13.1.h
#  - gastos_deducibles     manual money input applied on the Art. 24.6
#                          UE/EEE deduction path
#  - retencion_practicada  manual money input (pagos a cuenta)
#  - base_imponible        computed via `m210-base-imponible-2025`
#  - tipo_gravamen         computed via `m210-tipo-gravamen-2025-resolve`
#  - cuota_integra         computed via `m210-cuota-integra-2025`
#  - cuota_diferencial     computed via `m210-cuota-diferencial-2025`

