# Calculation verification for Modelo 210 (IRNR, no residentes - renta imputada
# de inmueble urbano, TRLIRNR RDLeg 5/2004). Enrolls the always-present monetary
# finals - base imponible, cuota integra, and cuota diferencial - as the
# reconciliation contract; each is a formula-derived money value present in every
# filed declaration, so min_coverage = 1 holds without breaking a legitimate
# filing. The fourth computed casilla, `tipo_gravamen`, is a tax RATE, not a
# money value reconcilable against the money-2 tolerance, so it is deliberately
# NOT enrolled. Grounded in the modelo's own AEAT procedure source_refs.
[[revisions."2026-y-siguientes".verification_expectations]]
id = "modelo-210-calculation-verification"
computed_casilla_ids = ["base_imponible", "cuota_integra", "cuota_diferencial"]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "1"
discrepancy_causes = [
    "extraction_unreliable",
    "unmodelled_rule",
    "rounding",
    "correctness_divergence",
]
legal_refs = ["trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.a"]
source_refs = ["aeat-modelo-210-procedure", "aeat-irnr-renta-imputada-inmueble-urbano"]
