[[revisions."2025".deadline_windows]]
# opens_on corrected 2026-01-01 -> 2026-04-01. Orden EHA/3316/2010 art 5.b
# fixes the rentas-imputadas plazo as "del 1 de abril al 31 de diciembre del
# ano natural siguiente a la fecha de devengo", and Orden HAC/623/2026 art 1.2
# re-enacts article 5 with that sentence unchanged -- so 1 April is the opening
# under both the original and the current redaction, and no version of the rule
# opens in January. The 2026-y-siguientes edition already states 2027-04-01 for
# the identical tipo_renta_scope, so this edition was the outlier. A window
# opening three months early tells a tipo-02 filer the plazo is open when AEAT
# will not accept the autoliquidacion.
#
# NOT changed: closes_on stays 2026-12-31. Orden HAC/623/2026 does shorten this
# to 23 December, but that is its DOMICILIACION schedule, and its own entry-into
# -force clause applies the new plazos "respecto de los devengos correspondientes
# a 2026" -- neither reaches 2025 devengos.
id = "modelo-210-2025-0a-renta-imputada"
filing_year = 2025
period = "2025 0A"
period_kind = "annual"
opens_on = 2026-04-01
closes_on = 2026-12-31
tipo_renta_scope = ["02"]
legal_refs = ["orden-eha-3316-2010:art-5"]
source_refs = ["aeat-modelo-210-procedure", "boe-modelo-210-base-order"]
