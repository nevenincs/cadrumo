# M210 IRNR tipo-de-gravamen resolution formula.
#
# Dispatches through the modelo-neutral `irnr_resolve_tipo_gravamen` formula op:
# - args[0]: text casilla `tipo_renta` (operator-supplied enum)
# - args[1]: computed `base_imponible`
# - args[2]: baseline TRLIRNR rate table `m210-tipo-gravamen-2025`
# - args[3]: TRLIRNR Art 25.1.b pension tariff table
# - args[4]: profile-bound `country_of_fiscal_residence`
#
# The Convenio doble imposicion treaty overrides are no longer a modelo-local
# parameter: the op consults the cross-cutting `irnr.convenio.override` fact
# projected onto the snapshot as the `ConvenioAuthority`, and branches on the
# typed override kind (flat / ceiling / allocation_domestic_tariff / exempt).
#
# Returns the resolved Decimal rate, or one of the M210 rate-
# sentinel constants when a deterministic rate cannot be produced
# (deferred baseline or missing treaty override row).
# For `tipo_renta="pension"` the returned Decimal is the effective
# rate for the progressive Art 25.1.b tariff, so the downstream
# `base_imponible * tipo_gravamen` formula lands on the statutory quota.
# The application-layer verification sweep rewrites the sentinels
# into BLOCKING findings post-engine.

[[revisions."2025".formulas]]
id = "m210-tipo-gravamen-resolve"
target_casilla_id = "tipo_gravamen"
expression = { op = "irnr_resolve_tipo_gravamen", args = [
    { casilla_id = "tipo_renta" },
    { casilla_id = "base_imponible" },
    { parameter = "m210-tipo-gravamen" },
    { parameter = "m210-pension-tarifa" },
    { binding = "m210-profile-country-of-fiscal-residence" },
] }
legal_refs = [
    "trlirnr-rdleg-5-2004:art-25.1.a",
    "trlirnr-rdleg-5-2004:art-25.1.b",
    "trlirnr-rdleg-5-2004:art-25.1.f",
]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["tipo de gravamen", "no residentes"]
# M210 IRNR cuota-íntegra formula.
#
# `cuota_integra = base_imponible × tipo_gravamen` per TRLIRNR Art 24
# combined with the resolved rate from Art 25.1.a / 25.1.f / Convenio
# override, or the effective rate from the Art 25.1.b pension tariff
# (see formula `m210-tipo-gravamen-2025-resolve`).

[[revisions."2025".formulas]]
id = "m210-cuota-integra"
target_casilla_id = "cuota_integra"
expression = { op = "multiply", args = [
    { casilla_id = "base_imponible" },
    { casilla_id = "tipo_gravamen" },
] }
rounding = "money-2"
legal_refs = [
    "trlirnr-rdleg-5-2004:art-24",
    "trlirnr-rdleg-5-2004:art-25.1.a",
    "trlirnr-rdleg-5-2004:art-25.1.b",
]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["tipo de gravamen", "rendimientos"]
# M210 IRNR resultado de la autoliquidación (official casilla [31]).
#
# Official diseño-de-registro rule (record T21001, field 117):
#   [31] Resultado de la autoliquidación = [28] - [29] ± [30]
# where [28] is the cuota íntegra reducida (post-convenio), [29] the
# retenciones/ingresos a cuenta, and [30] the ingreso/devolución anterior
# (signed, exclusively for autoliquidación complementaria). Grounded in
# TRLIRNR Art 24. When no convenio, no donativos and no complementaria
# prior-result apply, [28] collapses to [22] (cuota íntegra) and [30]=0, so
# this reduces to the pre-slice-C `cuota_integra - retencion_practicada`
# behaviour (see the completeness-preserving chain in casillas [24]/[27]/[28]).

[[revisions."2025".formulas]]
id = "m210-cuota-diferencial"
target_casilla_id = "cuota_diferencial"
expression = { op = "subtract", args = [
    { op = "subtract", args = [
        { casilla_id = "cuota_integra_reducida" },
        { casilla_id = "retencion_practicada" },
    ] },
    { casilla_id = "ingreso_devolucion_anterior" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["retención", "pagos a cuenta"]
# M210 IRNR ganancias-patrimoniales base (official casilla [17]).
#
# Official diseño-de-registro rule (record T21001, field 100):
#   [17] Base imponible (210 H) = [12] + [16]
# i.e. the ganancia from the adquisición chain ([12]) plus the ganancia from
# the mejora / 2ª adquisición chain ([16]). Grounded in TRLIRNR Art 24 (base)
# and Art 25.1.f (ganancias patrimoniales). A ganancia box may be negative
# (pérdida patrimonial), so no sign clamp is applied.

[[revisions."2025".formulas]]
id = "m210-base-ganancias-h"
target_casilla_id = "base_imponible_ganancias_h"
expression = { op = "add", args = [
    { casilla_id = "ganancia_importe" },
    { casilla_id = "mejora_ganancia" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.f"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["ganancias patrimoniales", "base imponible"]
# M210 IRNR cuota Ley IRNR (official casilla [24]).
#
# Official diseño-de-registro rule (record T21001, field 110):
#   [24] Cuota Ley IRNR = [22] - [23]
# i.e. the cuota íntegra ([22]) minus the deducción por donativos ([23]).
# Grounded in TRLIRNR Art 24. When no donativos are declared, [23]=0 and
# [24] collapses to [22].

[[revisions."2025".formulas]]
id = "m210-cuota-ley-irnr"
target_casilla_id = "cuota_ley_irnr"
expression = { op = "subtract", args = [
    { casilla_id = "cuota_integra" },
    { casilla_id = "deduccion_donativos" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["cuota", "donativos"]
# M210 IRNR cuota íntegra reducida (official casilla [28]).
#
# Official diseño-de-registro rule (record T21001, field 114):
#   [28] Cuota íntegra reducida = [24] - [27]   with   [27] = [24] - [26]
# so when a convenio limit [26] applies, [28] = [26] (the treaty-capped cuota).
# The registry models the convenio reduction conditionally on the presence of a
# declared límite convenio [26], clamped so the reduced cuota never exceeds the
# domestic cuota Ley IRNR [24]:
#   [28] = if [26] > 0 then min([24], [26]) else [24]
# This is faithful to the form's declared arithmetic in range ([26] <= [24] gives
# [27] = [24] - [26] and [28] = [26]) and correct at the edge (a límite above the
# cuota yields no reduction rather than a negative [27]). When no convenio limit
# is declared, [28] collapses to [24], preserving the no-convenio liquidación
# path. Grounded in TRLIRNR Art 24 (the convenio prevalence and cuota framework).

[[revisions."2025".formulas]]
id = "m210-cuota-integra-reducida"
target_casilla_id = "cuota_integra_reducida"
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [{ casilla_id = "limite_convenio" }, { literal = "0" }] },
    { op = "min", args = [{ casilla_id = "cuota_ley_irnr" }, { casilla_id = "limite_convenio" }] },
    { casilla_id = "cuota_ley_irnr" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["convenio", "cuota"]
# M210 IRNR reducción por convenio (official casilla [27]).
#
# Official diseño-de-registro rule (record T21001, field 113):
#   [27] Reducción por Convenio = [24] - [26]
# The registry derives it from the clamped reduced cuota so the identity
# [28] = [24] - [27] holds by construction:
#   [27] = [24] - [28]
# where [28] is the (clamped) cuota íntegra reducida. When a convenio limit
# [26] <= [24] applies, [28] = [26] and [27] = [24] - [26] (matching the form).
# When no convenio limit is declared, [28] = [24] and [27] = 0. Grounded in
# TRLIRNR Art 24.

[[revisions."2025".formulas]]
id = "m210-reduccion-convenio"
target_casilla_id = "reduccion_convenio"
expression = { op = "subtract", args = [
    { casilla_id = "cuota_ley_irnr" },
    { casilla_id = "cuota_integra_reducida" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["convenio"]
