# Modelo 210 application-link declarations that diverge from the 2025 edition.
#
# Every other consumer surface -- filing, calculation, review, approval,
# reconciliation, workflow, and deadline -- is inherited unchanged from the
# predecessor. Only these two change: both cite the 2026 record design
# `aeat-dr-210-2026` in place of the 2025 edition's `aeat-dr-210-2022`.

# Export consumer for the generated fichero-BOE layout. Required by the
# registry validator whenever a revision declares export layouts. Grounded on
# Orden EHA/3316/2010 art 1, which approves the modelo and its ingreso/devolucion
# document -- the two records the layout renders -- and cites the exact record
# design the layout was generated from.
[[revisions."2026-y-siguientes".application_links]]
id = "modelo-210-export"
surface = "export"
consumer = "cadrumo.application.filing.export_draft"
requires_snapshot = true
legal_refs = ["orden-eha-3316-2010:art-1"]
source_refs = ["aeat-dr-210-2026", "aeat-modelo-210-procedure"]

# Extractor consumer for the declaración-PDF profile. Required by the registry
# validator whenever a revision declares extraction profiles.
[[revisions."2026-y-siguientes".application_links]]
id = "modelo-210-extractor"
surface = "extractor"
consumer = "cadrumo.adapters.inbound.declaracion.parser.parse_declaracion"
requires_snapshot = true
legal_refs = ["orden-eha-3316-2010:art-1"]
source_refs = ["aeat-modelo-210-procedure", "aeat-dr-210-2026"]
