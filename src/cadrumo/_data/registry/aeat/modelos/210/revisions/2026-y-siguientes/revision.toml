[revisions."2026-y-siguientes".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This return credits withholding under the Impuesto sobre la Renta de no Residentes, not IRPF. A credit reconciliation entry names a Modelo 100 credit casilla and the IRPF income classes of payer records, so it cannot state a non-resident credit."""
legal_refs = ["orden-eha-3316-2010:art-1", "orden-eha-3316-2010:art-2", "trlirnr-rdleg-5-2004:art-13.1.h", "trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.a", "trlirnr-rdleg-5-2004:art-25.1.b", "trlirnr-rdleg-5-2004:art-25.1.f", "ley-35-2006:art-85"]
source_refs = ["boe-modelo-210-base-order", "aeat-modelo-210-procedure", "aeat-irnr-renta-imputada-inmueble-urbano", "boe-modelo-210-2024-form-layout", "boe-modelo-210-2026-deadline-update", "boe-modelo-210-2026-form-layout", "aeat-dr-210-2026"]

[revisions."2026-y-siguientes".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["orden-eha-3316-2010:art-1", "orden-eha-3316-2010:art-2", "trlirnr-rdleg-5-2004:art-13.1.h", "trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.a", "trlirnr-rdleg-5-2004:art-25.1.b", "trlirnr-rdleg-5-2004:art-25.1.f", "ley-35-2006:art-85"]
source_refs = ["boe-modelo-210-base-order", "aeat-modelo-210-procedure", "aeat-irnr-renta-imputada-inmueble-urbano", "boe-modelo-210-2024-form-layout", "boe-modelo-210-2026-deadline-update", "boe-modelo-210-2026-form-layout", "aeat-dr-210-2026"]

[revisions."2026-y-siguientes".family_dispositions.dependency_classifications]
reason = """
A dependency classification declares that this modelo's calculation depends on ANOTHER modelo the taxpayer files in an earlier or enclosing period, so the clean-state gate knows whether that source is present, suppressed or missing. Modelo 210 declares no such source. Its base and cuota are self-contained per renta (TRLIRNR arts. 24 and 25), and the one value arriving from outside -- casilla 29 retenciones e ingresos a cuenta -- is withholding SUFFERED by the non-resident and evidenced by the \
payer's certificate. The payer, not this taxpayer, files the corresponding Modelo 216, so it is not a source in this taxpayer's own filing chain and there is no cross-period dependency for the gate to reason about. Verified against the revision itself: no casilla, construct or verification expectation references another modelo. The bindings this revision declares resolve profile and ledger sources, never another modelo's filed casilla, so the same absence holds from the fold-in side."""
legal_refs = ["trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.a", "orden-eha-3316-2010:art-1"]
source_refs = ["aeat-modelo-210-procedure", "aeat-dr-210-2026"]

[revisions."2026-y-siguientes".family_dispositions.projection_endpoints]
reason = """
A projection endpoint declares a typed coordinate inside a REPEATED row, so the family is empty only where the official design declares no repetition. Measured, not assumed, against the hash-pinned design aeat-dr-210-2026: both records are fixed (Pagina 01 at 2700 declared positions, Pagina 02 at 1400), neither declares a variable envelope or an auxiliary envelope header, neither carries a repeat axis, and the reviewed semantic map binds all 167 anchors as 10 literal, 18 filler, 108 header, 2 \
draft and 29 casilla entries with zero projection entries. Modelo 210 declares one renta per autoliquidacion -- a taxpayer with several rentas files several 210s, and AEAT provides the agrupacion mechanism rather than repeated rows on one record -- so there is no repeated row for an endpoint to address."""
legal_refs = ["orden-eha-3316-2010:art-1", "orden-eha-3316-2010:art-2"]
source_refs = ["aeat-dr-210-2026", "aeat-modelo-210-procedure"]

