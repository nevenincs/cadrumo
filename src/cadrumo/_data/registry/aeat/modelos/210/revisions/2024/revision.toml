# than claiming the operator's own sign-off.
#
# What the review established, by measurement rather than assertion: every
# casilla legal_ref and source_ref resolves to the legal catalogue; every cited
# source's corpus file is present; every formula targets a casilla of this
# revision; every enrolled schema family resolves; and the committed export tree
# reproduces byte-for-byte from a fresh render off the hash-verified official
# design, then validates through the real registry authority. 
