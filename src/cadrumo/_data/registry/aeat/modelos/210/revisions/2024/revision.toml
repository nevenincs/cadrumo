# Original extraction_profiles fragment 0001-declarations.toml: #   src/cadrumo/_data/corpus/aeat_official/instructions/modelo_210/files/
# Original extraction_profiles fragment 0001-declarations.toml: #     modelo-210-instrucciones.html
# Original extraction_profiles fragment 0001-declarations.toml: # and NOT against the registry's own casilla labels, which would be a
# Original extraction_profiles fragment 0001-declarations.toml: # self-reference. AEAT prints each of these as the label followed by its casilla
# Original extraction_profiles fragment 0001-declarations.toml: # number in parentheses -- "Base imponible (8):", "Gastos deducibles (7):",
# Original extraction_profiles fragment 0001-declarations.toml: # "Cuota Ley IRNR (24):" -- so each pattern anchors on BOTH, which is what makes
# Original extraction_profiles fragment 0001-declarations.toml: # it discriminating: "Base imponible" alone appears seven times in the document
# Original extraction_profiles fragment 0001-declarations.toml: # (the 210 I, R, H and G determinations each have one), and only the parenthesised
# Original extraction_profiles fragment 0001-declarations.toml: # number distinguishes the liquidación box the registry means.
# Original extraction_profiles fragment 0001-declarations.toml: #
# Original extraction_profiles fragment 0001-declarations.toml: # The number printed in each AEAT label agrees with the casilla's own `number`
# Original extraction_profiles fragment 0001-declarations.toml: # field on this revision, independently confirming the join.
# Original extraction_profiles fragment 0001-declarations.toml: #
# Original extraction_profiles fragment 0001-declarations.toml: # Deliberately NOT strict, and deliberately not claiming a round trip: no filed
# Original extraction_profiles fragment 0001-declarations.toml: # or synthetic Modelo 210 specimen is bundled, so nothing has yet proved these
# Original extraction_profiles fragment 0001-declarations.toml: # patterns locate their value in a real document. `provisional_pending_specimen`
# Original extraction_profiles fragment 0001-declarations.toml: # records exactly that, and `confidence = "review_required"` keeps any extraction
# Original extraction_profiles fragment 0001-declarations.toml: # out of the strict path until a specimen exists. Raising either without adding
# Original extraction_profiles fragment 0001-declarations.toml: # the specimen would convert an open gap into a verified-looking claim.

# Original application_links modelo-210-deadline commentary: # Deadline consumer for the trimestral a-ingresar plazo windows grounded in
# Original application_links modelo-210-deadline commentary: # Orden EHA/3316/2010 art 5 (as amended by HAC/56/2024 + HAC/623/2026). Required
# Original application_links modelo-210-deadline commentary: # by the registry validator whenever a revision declares deadline windows.
# Original application_links modelo-210-export commentary: # Export consumer for the generated fichero-BOE layout. Required by the
# Original application_links modelo-210-export commentary: # registry validator whenever a revision declares export layouts. Grounded on
# Original application_links modelo-210-export commentary: # Orden EHA/3316/2010 art 1, which approves the modelo and its ingreso/devolucion
# Original application_links modelo-210-export commentary: # document -- the two records the layout renders -- and cites the exact record
# Original application_links modelo-210-export commentary: # design the layout was generated from.
# Original application_links modelo-210-extractor commentary: # Extractor consumer for the declaración-PDF profile. Required by the registry
# Original application_links modelo-210-extractor commentary: # validator whenever a revision declares extraction profiles.
# Original application_links fragment 0001-declarations.toml: # Modelo 210 application-link declaration.
# Original application_links fragment 0001-declarations.toml: #
# Original application_links fragment 0001-declarations.toml: # The validator requires at least one filing or communication surface
# Original application_links fragment 0001-declarations.toml: # to satisfy the casilla-routing contract. The 2025 revision declares
# Original application_links fragment 0001-declarations.toml: # the current filing, calculation, verification, review, approval,
# Original application_links fragment 0001-declarations.toml: # reconciliation, and workflow consumers.

# Original bindings m210-ledger-irnr-rendimientos-integros commentary: # Modelo 210 source-scoped gross-income binding.  Art. 13.1 is the territorial
# Original bindings m210-ledger-irnr-rendimientos-integros commentary: # gateway: only a persisted, explicit M210 classification on a Spanish-source
# Original bindings m210-ledger-irnr-rendimientos-integros commentary: # incoming ledger row may reach [5].  Art. 24 then governs the gross-income base
# Original bindings m210-ledger-irnr-rendimientos-integros commentary: # fact.  Rate provisions (including art. 25.1) are deliberately not used as the
# Original bindings m210-ledger-irnr-rendimientos-integros commentary: # source-scope authority.
# Original bindings fragment 0001-declarations.toml: # M210 IRNR profile-axis bindings.
# Original bindings fragment 0001-declarations.toml: #
# Original bindings fragment 0001-declarations.toml: # Exposes the operator profile's country_of_fiscal_residence field
# Original bindings fragment 0001-declarations.toml: # to the formula runtime so the m210_resolve_rate op (S400) can read
# Original bindings fragment 0001-declarations.toml: # the treaty country at evaluation time via ctx.enum_binding_values.
# Original bindings fragment 0001-declarations.toml: # Mirrors the M100 CCAA precedent at
# Original bindings fragment 0001-declarations.toml: # bindings/0008-renta-2025-profile-tax-residence-ccaa.toml.
# Original bindings fragment 0001-declarations.toml: #
# Original bindings fragment 0001-declarations.toml: # country_of_fiscal_residence is a free-form ISO 3166-1 alpha-2 string
# Original bindings fragment 0001-declarations.toml: # on TaxpayerProfile, not a closed enum class — typed_enum is omitted.
# Original bindings fragment 0001-declarations.toml: # The cross-cutting ConvenioAuthority projects the canonical treaty override fact and resolves the
# Original bindings fragment 0001-declarations.toml: # BOE treaty reference from this same field; the retired TaxpayerProfile
# Original bindings fragment 0001-declarations.toml: # convenio_aplicable static-lookup property has been deleted in favour of
# Original bindings fragment 0001-declarations.toml: # this resolution path.

