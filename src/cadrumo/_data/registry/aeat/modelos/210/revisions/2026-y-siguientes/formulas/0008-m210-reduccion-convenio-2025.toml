# M210 IRNR reducción por convenio (official casilla [27]).
#
# Official diseño-de-registro rule (record T21001, field 113):
#   [27] Reducción por Convenio = [24] - [26]
# The registry derives it from the clamped reduced cuota so the identity
# [28] = [24] - [27] holds by construction:
#   [27] = [24] - [28]
# where [28] is the (clamped) cuota íntegra reducida. When a convenio limit
# [26] <= [24] applies, [28] = [26] and [27] = [24] - [26] (matching the form).
# When no convenio limit is declared, [28] = [24] and [27] = 0. Grounded in
# TRLIRNR Art 24.

[[revisions."2026-y-siguientes".formulas]]
id = "m210-reduccion-convenio-2025"
target_casilla_id = "reduccion_convenio"
expression = { op = "subtract", args = [
    { casilla_id = "cuota_ley_irnr" },
    { casilla_id = "cuota_integra_reducida" },
] }
rounding = "money-2"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-210-procedure"]

[[revisions."2026-y-siguientes".formulas.source_citations]]
source_ref = "aeat-modelo-210-procedure"
required_text = ["convenio"]
