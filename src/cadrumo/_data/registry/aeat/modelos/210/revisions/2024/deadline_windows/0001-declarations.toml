# Modelo 210 presentation windows for 2024 devengos. EVENT-N owns per-devengo
# filings but denotes a set of concrete EVENT-<n> periods, not a Period itself.
# Fixed annual facts therefore use canonical 0A. No quarter or resultado-shaped
# period token is fabricated. Tipo 28 remains event-shaped without a numeric
# window because its event-relative offset authority is not bundled.
# Domiciliation cutoffs do not narrow these presentation windows.

[[revisions."2024".deadline_windows]]
# Orden HAC/56/2024 art. primero.Dos rewrote art. 5.c.1.o of Orden EHA/3316/2010:
# "En el caso de agrupacion anual, los veinte primeros dias naturales del mes de
# enero del ano siguiente al de devengo", first applicable to 2024 devengos. The
# April grouped window only arrives with Orden HAC/623/2026, for 2026 devengos.
id = "modelo-210-2024-0a-arrendamiento-ingreso"
filing_year = 2024
period = "2024 0A"
period_kind = "annual"
opens_on = 2025-01-01
closes_on = 2025-01-20
resultado_scope = "I"
tipo_renta_scope = ["01", "35"]
legal_refs = ["orden-eha-3316-2010:art-5", "orden-hac-56-2024:art-1"]
source_refs = ["aeat-modelo-210-procedure", "boe-modelo-210-base-order", "boe-modelo-210-2024-form-layout"]

