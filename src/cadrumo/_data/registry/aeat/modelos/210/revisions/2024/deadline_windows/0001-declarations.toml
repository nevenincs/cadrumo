# Orden EHA/3316/2010 art. 5.b, before Orden HAC/623/2026, gave rentas imputadas
# the whole natural year that follows the devengo (its preamble: "se mantiene el
# plazo de todo el ano natural siguiente al devengo"). The 1 April opening is the
# HAC/623/2026 redaction, which applies "respecto de los devengos correspondientes
# a 2026", so it does not reach this edition.
