data_type = "money"
semantic_role = "irnr_base_imponible_directa_i"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "Official 210 I direct-base slot with no sibling casilla; the branching base_imponible [8] serves the modelled rendimientos/inmobiliaria/ganancia paths."
required = false
input_kind = "manual"
legal_refs = ["trlirnr-rdleg-5-2004:art-24"]
source_refs = ["aeat-modelo-210-procedure", "aeat-dr-210-2022"]

