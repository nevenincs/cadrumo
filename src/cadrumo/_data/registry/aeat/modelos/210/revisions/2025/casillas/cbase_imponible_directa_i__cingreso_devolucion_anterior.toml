# Modelo 210 official diseño-de-registro numbered liquidación casillas [4]-[31].
#
# Grounded in the bundled AEAT layout authority `aeat-dr-210-2022`, the diseño
# governing devengos from 01/06/2022, section "Determinación de la base
# imponible" (210 I/R/H/G) and "Liquidación". These casillas were originally
# authored from the 2011 diseño (record identifier T21001, version 1.1,
# 15/02/2012), whose applicability window closed on 2017-12-31 -- nine years
# before this revision opens -- so citing it here made the revision cite a
# superseded source. Every one of the 21 casillas re-grounded is addressed by
# the export tree this revision renders from the 2022 diseño, which is what
# establishes that the later design carries them. The five existing base/rate/cuota casillas already carry their
# official numbers (rendimientos_integros=[5], gastos_deducibles=[7],
# base_imponible=[8], tipo_gravamen=[21], cuota_integra=[22],
# retencion_practicada=[29], cuota_diferencial=[31]); this fragment adds the
# remaining official boxes.
#
# Modelling notes (grounded, non-fabricating):
#  - The engine keeps ONE branching base_imponible ([8]) (one casilla schema,
#    code-keyed branches). The alternate type-I direct base [4] and type-G
#    direct base [18] are declared
#    as operator-input boxes for the paths the branching engine does not compute.
#  - Signed money boxes (ganancias, ingreso/devolución anterior) carry no
#    non_negative constraint: a ganancia patrimonial may be a loss, and the
#    complementaria prior-result [30] is signed (±) per the official [31] rule.
#  - The dividend-exención [6] is declared as the official field; wiring its
#    subtraction into the type-R base op is deferred (dividends currently route
#    through the Art. 25.1.f 19% branch, not the rendimientos-R deduction path).

# --- Determinación de la base imponible: 210 I (direct) ---

