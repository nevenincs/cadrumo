# Exhaustive reconcile-when-present verification for Modelo 210
# revision 2025: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-210-calculation-verification).
[[revisions."2026-y-siguientes".verification_expectations]]
id = "modelo-210-2025-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "base_imponible_ganancias_h",
    "cuota_integra_reducida",
    "cuota_ley_irnr",
    "reduccion_convenio",
    "tipo_gravamen",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["trlirnr-rdleg-5-2004:art-24", "trlirnr-rdleg-5-2004:art-25.1.a"]
source_refs = ["aeat-modelo-210-procedure", "aeat-irnr-renta-imputada-inmueble-urbano"]
