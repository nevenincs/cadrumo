reason = "Governed by Orden EHA/3316/2010, whose repeal clause shows Modelo 210 already approved by Orden HAC/3626/2003; filing years before 2023 existed in law and are not authored. 2022 is answered by projection from the 2023 edition: its devengos from 2022-06-01 fall inside aeat-dr-210-2022, the design that edition renders, and its devengos from 2022-01-01 to 2022-05-31 fall under aeat-dr-210-2022-hasta-05, which writes the same bytes, the two designs differing only in how record T21002 divides its reserved positions 1285-1391."
