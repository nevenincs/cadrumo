# Modelo 165 declaration-header casillas (scheduling/applicability-grade). Only
# the declaration header (ejercicio, tipo de declaración) is declared, grounded in
# orden-hap-2455-2013 art 1. No numbered form casilla is invented — no
# authoritative Modelo 165 diseño de registro is bundled.
# Modelo 165 -- the official record-design positions. Transcribed from the
# bundled Diseno de Registro (source aeat-dr-165-2026,
# corpus/aeat_official/disenos_registro/modelo_165/files/
# 01-165-diseno-de-registro-actualizado-en-2023.pdf, sha256
# bcc94b07d695703cfa66a3d8cbbb176841906ebf8cef57e2acd3e3fee452a263).
#
# Every casilla carries its canonical m165_<id> semantic_role.
# Campo 5. Positions 18-57, alfanumerico. "Se consignara la razon social
# completa, sin anagrama."
# Campo 7. Positions 59-107, alfanumerico de 49 posiciones. The design
# subdivides the slot (59-67 TELEFONO, 68-107 APELLIDOS Y NOMBRE) but declares
# ONE top-level campo of 49 bytes.
# Campo 8. Positions 108-120, numerico de 13 posiciones. "Un numero secuencial
# cuyos tres primeros digitos se corresponderan con el codigo 165."
# Campo 9. Positions 121-122, alfabetico: 121 declaracion complementaria ("C"),
# 122 declaracion sustitutiva ("S").
# Campo 10. Positions 123-135, numerico de 13 posiciones. "En cualquier otro
# caso debera rellenarse a CEROS."
# Campo 11. Positions 136-144, numerico de 9 posiciones: "el numero total de
# registros de socios o participes (Registro de tipo 2) declarados".
# Campo 12. Positions 145-159. IMPORTE TOTAL DE LAS SUSCRIPCIONES O
# ADQUISICIONES DE ACCIONES O PARTICIPACIONES. "Se consignara sin signo y sin
# coma decimal", subdivided 145-157 parte entera and 158-159 parte decimal --
# an unsigned amount with two implied decimals filling the whole 15-byte slot.
# Campo 13. Positions 160-167. FECHA DE CONSTITUCION de la empresa de nueva o
# reciente creacion, subdivided 160-163 ANO, 164-165 MES, 166-167 DIA.
# Campo 14. Positions 168-183, alfanumerica de 16 posiciones. IMPORTE FONDOS
# PROPIOS de la entidad al inicio del periodo impositivo en que el contribuyente
# adquiere las acciones. The only signed amount on this record: "168 SIGNO:
# campo alfabetico que se cumplimentara cuando la cuantia de los fondos propios
# ... sea menor que 0 (cero); en este caso se consignara una 'N'. En cualquier
# otro caso el contenido del campo sera un espacio", then "169-183 IMPORTE:
# campo numerico de 15 posiciones", itself 169-181 entera and 182-183 decimal.
# Campo 15. Position 184, alfabetico. "Se consignara 'X' cuando el declarante
# tenga la consideracion de empresa emergente, segun lo establecido en el
# apartado 1 del articulo 3 de la Ley 28/2022, de 21 de diciembre, de fomento
# del ecosistema de las empresas emergentes." In any other case it goes blank.
# Campo 5. Positions 18-26. N.I.F. DEL SOCIO O PARTICIPE de la entidad de nueva
# o reciente creacion.
# Campo 6. Positions 27-35. "Si el perceptor es menor de 14 anos se consignara
# en este campo el numero de identificacion fiscal de su representante legal
# (padre, madre o tutor). En cualquier otro caso ... se rellenara a espacios."
# Campo 7. Positions 36-75. APELLIDOS Y NOMBRE DEL SOCIO O PARTICIPE: "el primer
# apellido, un espacio, el segundo apellido, un espacio y el nombre completo".
# Campo 8. Positions 76-88. IMPORTE DE LA SUSCRIPCION O ADQUISICION, "sin signo
# y sin coma decimal", subdivided 76-86 parte entera and 87-88 parte decimal.
# Campo 9. Positions 89-96. FECHA DE ADQUISICION DE LAS ACCIONES/PARTICIPACIONES,
# subdivided 89-92 ANO, 93-94 MES, 95-96 DIA.
# Campo 10. Positions 97-101. PORCENTAJE DE PARTICIPACION en el capital social.
# "Dicho porcentaje, cuando no sea un numero entero, se expresara con dos
# decimales", subdivided 97-99 parte entera and 100-101 parte decimal.

