# It repeats every campo of the 2016 design and adds EMPRESA EMERGENTE at
# position 184, so this edition inherits the 2016-2022 casillas, links and
# construct and states the new campo, the 2023 design's export layout and its
# workbook pin. The storage baselines select payload, not legal continuity.
