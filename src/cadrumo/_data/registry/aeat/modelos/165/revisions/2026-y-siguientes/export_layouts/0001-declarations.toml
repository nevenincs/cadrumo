# Modelo 165 fichero -- transcribed from the bundled AEAT Diseno de Registro
# (source aeat-dr-165-2026, corpus/aeat_official/disenos_registro/modelo_165/
# files/01-165-diseno-de-registro-actualizado-en-2023.pdf, sha256
# bcc94b07d695703cfa66a3d8cbbb176841906ebf8cef57e2acd3e3fee452a263).
#
# The design declares exactly two records of 500 bytes each: registro de tipo 1
# (declarante) with 15 numbered campos plus a BLANCOS trailer, and registro de
# tipo 2 (socios o participes) with 10 numbered campos plus a BLANCOS trailer.
# All 27 positions are declared in the record files beside this one, and each
# record's declared field lengths sum to exactly 500 contiguously from 1.
#
# ---------------------------------------------------------------------------
# ERA NOTE -- read before filing an older ejercicio
# ---------------------------------------------------------------------------
# This layout starts in 2026 because its own heading is "Ejercicio 2026" and
# its source declares applies_from = 2026-01-01. It makes no geometry claim for
# the intervening 2023--2025 legal/applicability-only interval.
#
# Position 184, EMPRESA EMERGENTE, is defined by the
# design by reference to "el apartado 1 del articulo 3 de la Ley 28/2022, de 21
# de diciembre, de fomento del ecosistema de las empresas emergentes.
# Global rules the design states once, applied throughout:
#   "Todos los importes seran positivos."
#   "Los campos numericos que no tengan contenido se rellenaran a ceros."
#   "Los campos alfanumericos/alfabeticos que no tengan contenido se rellenaran
#    a blancos."
#   "Todos los campos numericos ajustados a la derecha y rellenos de ceros por
#    la izquierda."
#   "Todos los campos alfanumericos/alfabeticos ajustados a la izquierda y
#    rellenos de blancos por la derecha, en mayusculas."
# Registro de tipo 1: registro de declarante. 500 bytes, 15 numbered campos plus the BLANCOS trailer.
# 1+3+4+9+40+1+49+13+2+13+9+15+8+16+1+316 = 500.
# Posicion 1. TIPO DE REGISTRO. Constante '1'.
# Posiciones 2-4. MODELO DECLARACION. Constante '165'.
# Posiciones 5-8. EJERCICIO -- the draft's own filing year.
# Posiciones 9-17. NIF DEL DECLARANTE. The declarante is the entity obliged to
# certify, which is the taxpayer; a gestor presenting on its behalf is the
# presenter and must not appear here. A NIF exactly fills its 9-byte slot, so
# left-zero padding would strip real leading digits from a low-numbered DNI.
# Posiciones 18-57. DENOMINACION O RAZON SOCIAL DEL DECLARANTE.
# Posicion 58. TIPO DE SOPORTE. The design admits exactly one clave:
# "'T': Transmision telematica".
# Posiciones 59-107. PERSONA CON QUIEN RELACIONARSE.
# Posiciones 108-120. NUMERO IDENTIFICATIVO DE LA DECLARACION.
# Posiciones 121-122. DECLARACION COMPLEMENTARIA O SUSTITUTIVA.
# Posiciones 123-135. NUMERO IDENTIFICATIVO DE LA DECLARACION ANTERIOR.
# Posiciones 136-144. NUMERO TOTAL DE DECLARADOS.
# Posiciones 145-159. IMPORTE TOTAL DE LAS SUSCRIPCIONES O ADQUISICIONES.
# Unsigned, two implied decimals (145-157 entera, 158-159 decimal).
# Posiciones 160-167. FECHA DE CONSTITUCION (160-163 ANO, 164-165 MES,
# 166-167 DIA).
# Posiciones 168-183. IMPORTE FONDOS PROPIOS. Signed: position 168 carries 'N'
# when the fondos propios are below zero and a space otherwise, then 169-183
# carry the magnitude (169-181 entera, 182-183 decimal). The sign byte is
# reserved, so a non-negative amount never writes a digit at 168.
# Posicion 184. EMPRESA EMERGENTE: 'X' when the declarante qualifies under
# Ley 28/2022 art. 3.1, blank otherwise.
# Posiciones 185-500. BLANCOS.
# Registro de tipo 2: registro de socios o participes. 500 bytes, 10 numbered campos plus the BLANCOS trailer.
# 1+3+4+9+9+9+40+13+8+5+399 = 500.
# Posicion 1. TIPO DE REGISTRO. Constante '2'.
# Posiciones 2-4. MODELO DECLARACION. Constante '165'.
# Posiciones 5-8. EJERCICIO. "Consignar lo contenido en estas mismas posiciones
# del registro de tipo 1" -- same draft attribute as tipo 1.
# Posiciones 9-17. N.I.F. DEL DECLARANTE. "Consignar lo contenido en estas
# mismas posiciones del registro de tipo 1" -- same producer key as tipo 1.
# Posiciones 18-26. N.I.F. DEL SOCIO O PARTICIPE.
# Posiciones 27-35. NIF DEL REPRESENTANTE LEGAL. Only for socios under 14;
# blank otherwise.
# Posiciones 36-75. APELLIDOS Y NOMBRE DEL SOCIO O PARTICIPE.
# Posiciones 76-88. IMPORTE DE LA SUSCRIPCION O ADQUISICION. Unsigned, two
# implied decimals (76-86 entera, 87-88 decimal).
# Posiciones 89-96. FECHA DE ADQUISICION (89-92 ANO, 93-94 MES, 95-96 DIA).
# Posiciones 97-101. PORCENTAJE DE PARTICIPACION, two decimals (97-99 entera,
# 100-101 decimal).
# Posiciones 102-500. BLANCOS.

