# Modelo 165 fichero -- transcribed from the bundled AEAT Diseno de Registro
# (source aeat-dr-165-2026, corpus/aeat_official/disenos_registro/modelo_165/
# files/01-165-diseno-de-registro-actualizado-en-2023.pdf, sha256
# bcc94b07d695703cfa66a3d8cbbb176841906ebf8cef57e2acd3e3fee452a263).
#
# This is the only Modelo 165 record design AEAT publishes: one artefact, on the
# current Disenos de Registro index, with no earlier era offered anywhere. The
# layout mirrors it position for position.
#
# The design declares exactly two records of 500 bytes each: registro de tipo 1
# (declarante) with 15 numbered campos plus a BLANCOS trailer, and registro de
# tipo 2 (socios o participes) with 10 numbered campos plus a BLANCOS trailer.
# All 27 positions are declared in the record files beside this one, and each
# record's declared field lengths sum to exactly 500 contiguously from 1.
#
# ---------------------------------------------------------------------------
# ERA NOTE -- read before filing an older ejercicio
# ---------------------------------------------------------------------------
# The revision this layout is authored on, 2013-y-siguientes, declares
# year_from = 2013 with no year_to, while the design itself is footered
# "Ejercicio 2026" and its source declares applies_from 2026-01-01. AEAT
# publishes nothing for the intervening years, so this is the only design that
# can be mirrored and it is mirrored here rather than left unbuilt.
#
# One position dates itself and should be understood before this layout is used
# for an older ejercicio: position 184, EMPRESA EMERGENTE, is defined by the
# design by reference to "el apartado 1 del articulo 3 de la Ley 28/2022, de 21
# de diciembre, de fomento del ecosistema de las empresas emergentes". That
# concept did not exist before December 2022, so for an ejercicio earlier than
# 2022 the campo has no subject and goes blank, which is also what the design's
# own rule prescribes ("En el supuesto de que el declarante no tenga la
# consideracion de empresa emergente, este campo ira a blanco").
#
# Whether this revision should be split so an older ejercicio resolves a design
# of its own is a registry-structure question recorded in the campaign's
# structural-decisions audit; it is not answerable from the design, because AEAT
# publishes no other.
#
# Global rules the design states once, applied throughout:
#   "Todos los importes seran positivos."
#   "Los campos numericos que no tengan contenido se rellenaran a ceros."
#   "Los campos alfanumericos/alfabeticos que no tengan contenido se rellenaran
#    a blancos."
#   "Todos los campos numericos ajustados a la derecha y rellenos de ceros por
#    la izquierda."
#   "Todos los campos alfanumericos/alfabeticos ajustados a la izquierda y
#    rellenos de blancos por la derecha, en mayusculas."

[[revisions."2013-y-siguientes".export_layouts]]
