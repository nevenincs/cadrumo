# Modelo 165 fichero -- transcribed from the bundled AEAT Diseno de Registro
# (source aeat-dr-165-2026, corpus/aeat_official/disenos_registro/modelo_165/
# files/01-165-diseno-de-registro-actualizado-en-2023.pdf, sha256
# bcc94b07d695703cfa66a3d8cbbb176841906ebf8cef57e2acd3e3fee452a263).
#
# The design declares exactly two records of 500 bytes each: registro de tipo 1
# (declarante) with 15 numbered campos plus a BLANCOS trailer, and registro de
# tipo 2 (socios o participes) with 10 numbered campos plus a BLANCOS trailer.
# All 27 positions are declared in the record files beside this one, and each
# record's declared field lengths sum to exactly 500 contiguously from 1.
#
# ---------------------------------------------------------------------------
# ERA NOTE -- read before filing an older ejercicio
# ---------------------------------------------------------------------------
# This layout starts in 2026 because its own heading is "Ejercicio 2026" and
# its source declares applies_from = 2026-01-01. It makes no geometry claim for
# the intervening 2023--2025 legal/applicability-only interval.
#
# Position 184, EMPRESA EMERGENTE, is defined by the
# design by reference to "el apartado 1 del articulo 3 de la Ley 28/2022, de 21
# de diciembre, de fomento del ecosistema de las empresas emergentes.
# Global rules the design states once, applied throughout:
#   "Todos los importes seran positivos."
#   "Los campos numericos que no tengan contenido se rellenaran a ceros."
#   "Los campos alfanumericos/alfabeticos que no tengan contenido se rellenaran
#    a blancos."
#   "Todos los campos numericos ajustados a la derecha y rellenos de ceros por
#    la izquierda."
#   "Todos los campos alfanumericos/alfabeticos ajustados a la izquierda y
#    rellenos de blancos por la derecha, en mayusculas."

