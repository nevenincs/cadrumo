# The twenty-four fields of the modelo 136 form reproduced as anexo III of Orden
# HAC/763/2018, in force for autoliquidaciones from 3T 2018 onward and therefore
# across the whole of this edition's 2022-2025 span.
#
# Transcribed from the bundled boe-modelo-136-current-form-text, whose printed
# captions are quoted here as they appear:
#
#   01 "Importe del premio obtenido por el boleto, cupon o apuesta premiado
#      (o valor de mercado, si el premio es en especie)"
#   02 "Importe o valor del premio que corresponde individualmente al declarante"
#   03 "Cuantia exenta del gravamen especial"
#   04 "Base imponible ( 02 - 03 )"
#   05 "Cuota del gravamen especial (el 20% del importe de la casilla 04 )"
#   06 "Resultados a ingresar de anteriores autoliquidaciones por el mismo
#      concepto y correspondientes al mismo premio"
#   07 "Resultado a ingresar ( 05 - 06 )"
#   09 "Importe (casilla 09 )"
#
# The form prints NO box 08: the numbering runs 07 then 09. The absence of an 08
# casilla below is therefore the design's own shape, measured on the document,
# and not a row dropped in transcription.
#
# Casilla 03 is manual rather than computed on purpose. The form supplies only a
# proration rule for it -- "Si el precio unitario del boleto, cupon o apuesta es
# igual o superior a 0,50 EUR: 03 = Importe exento EUR x 02 / 01" -- and prints no
# exempt figure, so the 40.000 euro threshold that LIRPF DA 33 fixes from
# 2020-01-01 is never embedded here as a year-varying constant. The filer states
# the exempt amount and the engine derives the base from it.

