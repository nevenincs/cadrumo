# Sixteen quarterly windows, four per filing year across 2022-2025.
#
# Orden HAP/70/2013 art. 7 states them verbatim in the bundled corpus
# (corpus/normatives/html/orden-hap-70-2013.html.extracted.md):
#
#   "La presentacion del modelo 136, asi como el ingreso de su importe en el
#    Tesoro Publico, salvo cuando se domicilie el pago, se efectuara por los
#    sujetos pasivos en los veinte primeros dias naturales de los meses de abril,
#    julio, octubre y enero en relacion con los premios cobrados en el trimestre
#    natural inmediato anterior."
#
# Every window below reproduces that: days 1-20 of April, July, October and the
# following January, for the quarter immediately preceding. The 4T window of each
# year therefore opens in January of the next year, which is why the 4T 2025
# window falls outside this edition's valid_to -- the same shape the 2026 edition
# uses for its own 4T.
#
# Stored NOMINAL, with no weekend or holiday pre-shift applied. The very next
# sentence of art. 7 -- "Los vencimientos de plazo que coincidan con un sabado o
# dia inhabil se entenderan trasladados al primer dia habil inmediato siguiente"
# -- is precisely what shift_deadline applies at read time, so baking a shift in
# here would apply the rule twice.
#
# The AEAT procedure source the 2026 edition cites alongside the orden is absent
# here on purpose: aeat-modelo-136-procedure declares applies_from 2026-01-01 and
# cannot be cited by a window inside this span. boe-modelo-136-base-order is the
# founding Orden HAP/70/2013 itself (applies_from 2013-02-01) and carries art. 7
# verbatim.

