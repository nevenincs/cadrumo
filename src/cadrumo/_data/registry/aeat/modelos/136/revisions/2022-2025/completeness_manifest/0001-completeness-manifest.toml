# The graded closure claim for THIS edition, stated here rather than inherited:
# the completeness manifest is a per-edition assertion about the edition that
# states it, so it is deliberately excluded from the inheritable families and
# must be authored by every edition that claims one.
#
# The six liquidacion boxes below are the closure this edition claims: 02 and 03
# are the declared inputs, 04, 05 and 07 are computed from them by the three
# formulas the anexo III form prints, and 06 is the complementaria deduction
# those formulas consume. Box 01 is outside the claim because the form uses it
# only as the denominator of the exemption proration it leaves to the filer, and
# box 09 is outside it because it records the amount actually paid rather than a
# computed result.

