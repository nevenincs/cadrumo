# Historical edition of modelo 136 covering filing years 2022, 2023, 2024 and
# 2025 -- the gravamen especial sobre los premios de determinadas loterias y
# apuestas, autoliquidacion.
#
# WHY ONE EDITION AND NOT FOUR. The design era is single and its boundary is
# stated verbatim by the amending orden itself. Orden HAC/763/2018 disposicion
# final unica reads, in the bundled corpus
# (corpus/normatives/html/orden-hac-763-2018.html.extracted.md):
#
#   "El nuevo modelo 136 ... sera de aplicacion para las autoliquidaciones
#    correspondientes al tercer trimestre del ano 2018 y siguientes."
#
# "y siguientes" is an open end with no terminus, and the catalogue carries no
# later amending orden for this modelo. The four gap years therefore share one
# design rather than four, and splitting them into four editions would assert a
# per-year distinction no source states. The sibling 2026 edition grounds on
# this same 2018 design, which is positive evidence the era is still unbroken
# above this edition's ceiling.
#
# GEOMETRY, MEASURED NOT ASSUMED. The form reproduced as anexo III of Orden
# HAC/763/2018 is bundled as boe-modelo-136-current-form-text. Read field by
# field against the 2026 edition, the box set is IDENTICAL, position for
# position: 01 importe del premio, 02 importe individual del declarante, 03
# cuantia exenta, 04 base imponible, 05 cuota del gravamen especial, 06
# resultados a ingresar de anteriores autoliquidaciones, 07 resultado a
# ingresar, and the ingreso box printed as "Importe (casilla 09)". The numbering
# skips 08: the form goes 07 then 09, so the absence of an 08 casilla here is the
# design's own shape and not an omission. Twenty-four fields in total, the same
# twenty-four the 2026 edition declares. No field moved and none changed meaning
# between this edition and 2026, because it is one and the same document.
#
# WHY THE GRADE IS 'calculation' AND NOT 'filing'. Every source grounding the
# three formulas is in force across the whole span: LIRPF disposicion adicional
# 33 (boe-lirpf-lottery-prize-special-levy, applies_from 2020-01-01) fixes the
# 40.000 euro exemption and the 20 per cent tipo, and the anexo III form
# (boe-modelo-136-current-form-text, applies_from 2018-07-19) PRINTS the three
# arithmetic relations in its own captions -- "Base imponible ( 02 - 03 )",
# "Cuota del gravamen especial (el 20% del importe de la casilla 04 )" and
# "Resultado a ingresar ( 05 - 06 )". The calculation closure is transcribed
# from the in-force form, not inferred, so it is declared rather than withheld.
#
# Filing grade is NOT claimed, for two independent reasons. First, both AEAT
# procedure sources in the catalogue -- aeat-modelo-136-procedure and
# aeat-modelo-136-procedure-record -- declare applies_from 2026-01-01 and so
# cannot be cited by an edition ending 2025-12-31; every citation of them that
# the 2026 edition makes is replaced here by boe-modelo-136-base-order, the
# founding Orden HAP/70/2013 (applies_from 2013-02-01), whose articles 7, 10, 11
# and 12 are present verbatim in the bundled corpus. Second, AEAT publishes no
# positional record design for modelo 136 at all, so this edition declares no
# export layout, exactly as its 2026 sibling does not.
#
# ACQUIRABLE DEBT -- promotion of this edition from calculation to filing grade.
# The form geometry and the calculation closure are already grounded and would
# not change. What is missing is procedure authority inside the span. Needed:
#   - the AEAT modelo 136 procedure/instrucciones pages as they stood during
#     2022-2025, registered as their own source with an applies_from inside the
#     span (the bundled pair opens 2026-01-01);
#   - an AEAT diseno de registro for modelo 136, if one is ever published, to
#     support an export layout. None exists today for any year of this modelo,
#     so this is a standing absence rather than an unfetched file.
#
# NO PREDECESSOR IS DECLARED, DELIBERATELY. This edition sits BELOW the existing
# 2026 edition, and content inherits predecessor -> successor only, so a back
# year cannot inherit from a later one and must state every row itself; it does.
# The 2026 edition is likewise left untouched and declares no predecessor: were
# it pointed at this edition, every one of its twenty-four stated casillas would
# collide with the lineage-free row of the same id inherited from here, which
# the loader refuses outright. The two editions are therefore siblings on the
# timeline, contiguous at 2025-12-31 / 2026-01-01 and independent in content.

