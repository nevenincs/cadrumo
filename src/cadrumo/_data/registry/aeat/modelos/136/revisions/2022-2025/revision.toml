[revisions."2022-2025".family_dispositions.verification_predicates]
reason = """
A verification predicate guards a calculated result, and this edition does calculate one -- but both predicates its shape admits are unusable, for opposite reasons. implies_nonzero(04 base -> 05 cuota) is TAUTOLOGICAL: casilla 05 is percent(04, irpf.lottery_prize_special_levy_rate), so a positive base cannot produce a zero cuota and the engine could not violate the implication. implies_nonzero(01 premio -> 05 cuota) FALSE-FIRES on the lawful population: LIRPF DA 33 exempts the premio up to a threshold, the exempt amount is entered in casilla 03, and the base is subtract(02, 03), so a small premio legitimately yields a zero base and a zero cuota. Firing there would alert on precisely the filers the exemption is written for. The family is unavailable to this modelo rather than unwritten; the safeguard it exists to provide is already carried by the exempt-amount casilla being a declared input rather than an inferred one."""
