[revisions."2026".family_dispositions.relations]
reason = """
A relation folds a value from ANOTHER modelo's revision into this one's calculation, and this revision folds in nothing. Measured on it: all THREE formulas are closed over its own casillas -- base imponible is subtract(02, 03), the cuota is percent(04, irpf.lottery_prize_special_levy_rate), and the resultado is subtract(05, 06) -- and every relation slot on all three expression trees is empty. Casilla 06, resultados anteriores del mismo premio, is a within-modelo reference to earlier \
autoliquidaciones of this same premio, which is a formula over its own casillas and not a cross-modelo fold-in. The retencion the payer practised on the premio is declared by the PAYER on its own modelo, which this registry does not carry, so there is no sibling revision here for a relation to name."""
legal_refs = ["ley-35-2006:da-33", "orden-hap-70-2013:art-5"]
source_refs = ["boe-lirpf-lottery-prize-special-levy"]


