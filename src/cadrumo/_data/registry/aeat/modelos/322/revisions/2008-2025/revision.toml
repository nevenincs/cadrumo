[revisions."2008-2025"]
authority_grade = "filing"
# Closed at 2025 when this revision was split from the former single
# "2008-y-siguientes". AEAT publishes a distinct diseño de registro per era and
# the 2026 one changes the record byte extents (page 1: 1500 -> 1800, page 2:
# 2000 -> 2300, page 4: 2000 -> 2005), so 2026 onward cannot share a fixed-width
# layout with the years before it and now lives in its own sibling revision.
# The span is closed rather than left open so revision resolution stays unique.
#
# The id is the closed span, not "y siguientes": a revision id claiming an
# open-ended window while its own period_selector closes it is a declared
# contradiction the registry refuses.
#
# KNOWN GAP: AEAT published three designs inside this span (2022, 2023,
# 2024-2025) and none is authored as a layout here, so this revision still emits
# nothing. That is the state it was already in before the split -- the split did
# not remove a capability, it isolated the years that have one. Closing the
# remainder means further era revisions at the 2023 and 2024 boundaries, which
# the reviewed applies_from/applies_to on aeat-dr-322-2023 and
# aeat-dr-322-2024-2025 already ground.
valid_from = 2008-01-01
valid_to = 2025-12-31
period_selector = { year_from = 2008, year_to = 2025, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
orden_aplicabilidad = [
    "orden-eha-3434-2007:art-1",
]
source_refs = [
    "aeat-dr-322-2023",
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
    "boe-modelo-322-2007-form",
    "aeat-calendario-contribuyente-2026-hasta-2-marzo",
]


[revisions."2008-2025".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2008-2025' of modelo 322 has no strictly-earlier sibling revision of this modelo (valid_from 2008-01-01 precedes every other declared revision of this modelo; its sibling 2026-y-siguientes starts strictly later), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
