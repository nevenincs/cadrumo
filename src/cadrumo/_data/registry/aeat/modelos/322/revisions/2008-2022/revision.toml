[revisions."2008-2022".family_dispositions.projection_endpoints]
reason = "A projection endpoint names a FilingProjectionRef, and that type is a CLOSED union whose members are all m303_* -- the seven Modelo 303 endpoints the application projects into. No non-303 revision can populate this family at all: there is no member for it to name, so an entry here would not merely be unauthored, it would be unrepresentable. This is a type-level exclusion, not missing work. It changes only if the union gains a 322 member, which is a code change in core, not a registry one."
legal_refs = [
    "ley-37-1992:art-163-sexies",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
