[revisions."2008-2022".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo has no box crediting IRPF withholding suffered, so there is no credit casilla for an entry to name."""
legal_refs = ["orden-eha-3434-2007:art-1", "orden-eha-3434-2007:art-8", "rd-1624-1992:art-71"]
source_refs = ["aeat-dr-322-2022", "aeat-modelo-322-procedure", "boe-modelo-322-2007-form"]

[revisions."2008-2022".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["orden-eha-3434-2007:art-1", "orden-eha-3434-2007:art-8", "rd-1624-1992:art-71"]
source_refs = ["aeat-dr-322-2022", "aeat-modelo-322-procedure", "boe-modelo-322-2007-form"]

[revisions."2008-2022".family_dispositions.dependency_classifications]
reason = """
A dependency classification names another modelo whose filing this one depends on. 322 depends on none: it is the LEAF of the grupo de entidades chain, the member entity's own monthly liquidation of its own operations, and every value it reports originates in that member's ledger. The dependency runs the other way -- Modelo 353 declares 'modelo-353-dep-322' because the group aggregate reads these results -- and a classification is authored on the DEPENDENT revision, not the source. Empty by \
direction, not by omission."""
legal_refs = [
    "ley-37-1992:art-163-sexies",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-322-2022",
    "aeat-modelo-322-procedure",
]

[revisions."2008-2022".family_dispositions.parameters]
reason = """
A parameter is a regulatory value the engine applies -- a rate, a bracket tranche, a threshold, a reduction coefficient. This revision applies none. Every base and every cuota it carries is declared: the filer enters the base and the cuota AEAT prints side by side in each tipo's row, and the registry's own formulas only ADD those declared cuotas and subtract the deducible total. No formula on this revision multiplies a base by a rate, so there is no versioned regulatory number for it to hold. A \
future revision that derived a cuota from a base would author the rate here, and this declaration is what that change would replace."""
legal_refs = [
    "ley-37-1992:art-88",
    "ley-37-1992:art-90",
    "ley-37-1992:art-91",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
