# Modelo 322 ejercicio 2026 -- the identificacion, sin-actividad and actividad
# positions the fichero layout did not cover. Transcribed from the bundled
# Diseno de Registro (source aeat-dr-322-2026, sha256
# f014cec44d4906bc1e2ba96ee1b336f9b400254519df5b1ab0ce69d513631a76).
#
# These are authored as casillas rather than wired to the existing
# m303.*-named producer keys, and the reason is a value-encoding mismatch
# rather than a naming objection. This design admits NUMERIC codes -- "Si=1,
# No=2", "0, 1, 2 o 3" -- while every m303.* regime fact is a boolean whose
# renderer emits "X" or blank. Wiring them would emit "X" where AEAT admits
# only "1" or "2", producing a file AEAT rejects.

