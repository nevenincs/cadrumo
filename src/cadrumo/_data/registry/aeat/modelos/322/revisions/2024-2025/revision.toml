[revisions."2024-2025".family_dispositions.extraction_profiles]
reason = """
An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against the registry's own casilla labels, which would be self-reference. No such document is bundled for 322. Its artefacts are four diseños de registro, which describe the WIRE record and print no form labels, and the procedure page, which carries no box numbers at all: a search of it for a label followed by a bracketed \
box number returns nothing. Authoring patterns anyway would mean inventing the labels a real 322 declaración prints, which is exactly the fabrication the grounding rule forbids. Bundling a filed or AEAT-published 322 specimen is the change that makes this family authorable."""
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
]
source_refs = [
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
]

