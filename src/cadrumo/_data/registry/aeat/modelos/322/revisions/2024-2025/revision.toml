reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2024-2025' of modelo 322 has no strictly-earlier sibling revision of this modelo (valid_from 2008-01-01 precedes every other declared revision of this modelo; its sibling 2026-y-siguientes starts strictly later), so it \
cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
