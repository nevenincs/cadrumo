casilla_storage_baseline = "2023"
binding_source_refs = ["aeat-dr-322-2024-2025", "aeat-modelo-322-procedure", "boe-modelo-322-2007-form"]
formula_source_refs = ["aeat-dr-322-2024-2025", "aeat-modelo-322-procedure", "boe-modelo-322-2007-form"]
predecessor = { none = { reason = "Stated in full: this edition cannot be materialised exactly from the edition before it (predecessor row without lineage).", legal_refs = ["orden-eha-3434-2007:art-1"], source_refs = ["aeat-dr-322-2024-2025"] } }
casilla_source_refs = ["aeat-dr-322-2024-2025"]
live_cross_reference_source_refs = ["aeat-modelo-322-procedure"]
application_link_source_refs = ["aeat-modelo-322-procedure"]
# Prepared and reviewed by an agent against the bundled diseño de registros and
# the ordenes this revision cites; NO human operator has countersigned it, and
# 'agent_reviewed' plus this reviewer token record that state honestly rather
# than claiming the operator's own sign-off.
#
# What the review established, by measurement:
#   - every casilla legal_ref and source_ref resolves to the legal catalogue, and
#     every cited source's corpus file is present on disk;
#   - every formula targets a casilla of this revision;
#   - every enrolled schema family resolves;
#   - every cited source's applicability window overlaps this revision's own life;
#   - and all 4 fixed-width record(s) of the DERIVED layout were paired to
#     their design sheet and cover it: no design DATA position is left
#     unaddressed, and none reaches past its declared record length.
#
# The coverage figure is measured on the layout AFTER binding derivation, which
# is what the renderer and the completeness gate consume; the raw export_layouts
# collection holds only inline fields and reading it understates coverage badly.
#
# This stamp claims no fresh-render reproduction evidence: that belongs to the
# revisions enrolled in the generated-tree drift gate, and this one is not.
#
# What it does NOT establish: that the figures a filing produces are correct
# against AEAT. That is a tax review against official sources, and it is what an
# operator re-stamping this to 'operator_reviewed' would be attesting.
review_status = "agent_reviewed"
reviewed_by = "agent-prepared-pending-operator"
reviewed_at = 2026-08-19
authority_grade = "filing"
# Closed at 2025 when this revision was split from the former single
# "2008-y-siguientes". AEAT publishes a distinct diseño de registro per era and
# the 2026 one changes the record byte extents (page 1: 1500 -> 1800, page 2:
# 2000 -> 2300, page 4: 2000 -> 2005), so 2026 onward cannot share a fixed-width
# layout with the years before it and now lives in its own sibling revision.
# The span is closed rather than left open so revision resolution stays unique.
#
# The id is the closed span, not "y siguientes": a revision id claiming an
# open-ended window while its own period_selector closes it is a declared
# contradiction the registry refuses.
#
# KNOWN GAP: AEAT published three designs inside this span (2022, 2023,
# 2024-2025) and none is authored as a layout here, so this revision still emits
# nothing. That is the state it was already in before the split -- the split did
# not remove a capability, it isolated the years that have one. Closing the
# remainder means further era revisions at the 2023 and 2024 boundaries, which
# the reviewed applies_from/applies_to on aeat-dr-322-2023 and
# aeat-dr-322-2024-2025 already ground.
valid_from = 2024-01-01
valid_to = 2025-12-31
period_selector = { year_from = 2024, year_to = 2025, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
orden_aplicabilidad = [
    "orden-eha-3434-2007:art-1",
]
source_refs = [
        "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
    "boe-modelo-322-2007-form",
    "aeat-calendario-contribuyente-2024",
    "aeat-calendario-contribuyente-2025",
]
family_storage_baseline = "2023"
scoped_families = ["workbook_parity_refs", "verification_expectations", "completeness_manifest"]

[revisions."2024-2025".family_dispositions.dependency_classifications]
reason = """
A dependency classification names another modelo whose filing this one depends on. 322 depends on none: it is the LEAF of the grupo de entidades chain, the member entity's own monthly liquidation of its own operations, and every value it reports originates in that member's ledger. The dependency runs the other way -- Modelo 353 declares 'modelo-353-dep-322' because the group aggregate reads these results -- and a classification is authored on the DEPENDENT revision, not the source. Empty by \
direction, not by omission."""
legal_refs = [
    "ley-37-1992:art-163-sexies",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
]

[revisions."2024-2025".family_dispositions.parameters]
reason = """
A parameter is a regulatory value the engine applies -- a rate, a bracket tranche, a threshold, a reduction coefficient. This revision applies none. Every base and every cuota it carries is declared: the filer enters the base and the cuota AEAT prints side by side in each tipo's row, and the registry's own formulas only ADD those declared cuotas and subtract the deducible total. No formula on this revision multiplies a base by a rate, so there is no versioned regulatory number for it to hold. A \
future revision that derived a cuota from a base would author the rate here, and this declaration is what that change would replace."""
legal_refs = [
    "ley-37-1992:art-88",
    "ley-37-1992:art-90",
    "ley-37-1992:art-91",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
    "boe-modelo-322-2007-form",
]

[revisions."2024-2025".family_dispositions.extraction_profiles]
reason = """
An extraction profile matches printed labels in a filed artefact, and every label_pattern must be grounded against an AEAT-published document that PRINTS those labels -- never against the registry's own casilla labels, which would be self-reference. No such document is bundled for 322. Its artefacts are four diseños de registro, which describe the WIRE record and print no form labels, and the procedure page, which carries no box numbers at all: a search of it for a label followed by a bracketed \
box number returns nothing. Authoring patterns anyway would mean inventing the labels a real 322 declaración prints, which is exactly the fabrication the grounding rule forbids. Bundling a filed or AEAT-published 322 specimen is the change that makes this family authorable."""
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
]
source_refs = [
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
]

[revisions."2024-2025".family_dispositions.projection_endpoints]
reason = "A projection endpoint names a FilingProjectionRef, and that type is a CLOSED union whose members are all m303_* -- the seven Modelo 303 endpoints the application projects into. No non-303 revision can populate this family at all: there is no member for it to name, so an entry here would not merely be unauthored, it would be unrepresentable. This is a type-level exclusion, not missing work. It changes only if the union gains a 322 member, which is a code change in core, not a registry one."
legal_refs = [
    "ley-37-1992:art-163-sexies",
    "orden-eha-3434-2007:art-1",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-322-2024-2025",
    "aeat-modelo-322-procedure",
]

