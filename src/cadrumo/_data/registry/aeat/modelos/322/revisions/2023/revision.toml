predecessor = { none = { reason = "No legal predecessor is declared. The root was introduced on the converter's predecessor-row-without-lineage diagnostic against '2008-2022', a materialisation limit and not an official-structure claim: the 2023 record design (aeat-dr-322-2023) keeps every casilla of the 2008-2022 edition except the retired box [73] and adds boxes [150] to [164]. The payload is stored against the '2008-2022' edition through casilla_storage_baseline and family_storage_baseline, so this edition states only its differences: the fifteen new boxes and their positions, the removal of [73], each kept row's continuity claim, the 2023 deadline windows, its generated export layout, and overrides moving the inherited formula, binding, link, construct and verification references to the 2023 design. Storage reuse makes no continuity claim; naming '2008-2022' as legal predecessor is a separate continuity decision.", cause = "predecessor_row_without_lineage", legal_refs = ["orden-eha-3434-2007:art-1"], source_refs = ["aeat-dr-322-2023"] } }
casilla_source_refs = ["aeat-dr-322-2023"]
