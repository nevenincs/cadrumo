# The official line combines "bienes y servicios", so this selector carries the
# goods category (LIVA arts. 13/15) and the services one (art. 69.Uno.1, read
# subject to art. 70) and sums them; art. 84.Uno.2.a) makes the recipient the
# sujeto pasivo on both legs.

[[revisions.2024-2025.bindings]]
id = "modelo-322-iva-repercutido-general-cuota"
legal_refs = ["ley-37-1992:art-88", "orden-eha-3434-2007:art-1", "rd-1624-1992:art-71"]

[[revisions.2024-2025.bindings.source_citations]]
source_ref = "aeat-modelo-322-procedure"
required_text = ["modelo 322"]

[revisions.2024-2025.bindings.provider]
kind = "ledger_iva_aggregation"
flow_direction = "repercutido"
fact = "iva_amount_sum"
categories = ["domestic_general"]
rate_kinds = ["general"]
observation_roles = ["settlement"]
cash_accounting_treatments = ["none", "taxpayer_regime", "supplier_regime"]

[revisions.2024-2025.bindings.value]
data_type = "money"
channel = "decimal"

[revisions.2024-2025.bindings.aggregation]
op = "sum"

