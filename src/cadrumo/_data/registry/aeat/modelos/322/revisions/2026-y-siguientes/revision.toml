[revisions."2026-y-siguientes".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-322-2026-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through \
the same revision."""
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
