[revisions."2026-y-siguientes"]
authority_grade = "filing"
# Split from the former single "2008-y-siguientes" revision so the ejercicio-2026
# diseño de registro can be emitted as AEAT publishes it. That design changes the
# record byte extents against every earlier era (page 1: 1500 -> 1800, page 2:
# 2000 -> 2300, page 4: 2000 -> 2005), so it cannot share a fixed-width layout
# with them -- which is exactly why it gets its own revision rather than a
# compromise layout serving neither.
#
# The boundary is grounded in the reviewed source metadata the registry already
# carries: aeat-dr-322-2026 declares applies_from 2026-01-01 with no applies_to,
# and aeat-dr-322-2024-2025 closes at 2025-12-31. The establishing orden is
# unchanged across eras (EHA/3434/2007 art 1), matching how Modelo 303 grounds
# its six era revisions.
valid_from = 2026-01-01
period_selector = { year_from = 2026, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
orden_aplicabilidad = [
    "orden-eha-3434-2007:art-1",
]
source_refs = [
    "aeat-dr-322-2026",
    "aeat-modelo-322-procedure",
    "boe-modelo-322-2007-form",
    "aeat-calendario-contribuyente-2026-hasta-2-marzo",
]


[revisions."2026-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "This revision DOES have a strictly-earlier sibling (2008-2025), so unlike a first revision it could in principle be the landing point of a within-modelo continuity transition. It declares none because the split that created it changed no casilla identity: both revisions carry the same eight semantic-slug money casillas plus the two declaration-header casillas, with identical ids, numbers, data types and semantic roles. A CasillaContinuidadEvolutionDefinition records a casilla CHANGING across a revision boundary; nothing changed here, because the boundary was drawn for the record design's byte extents, not for a casilla renumbering. Should this revision later be re-authored onto the 2026 design's official numbered boxes, that WOULD be a renumbering and would require evolutions declared here."
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
source_refs = [
    "aeat-dr-322-2026",
    "aeat-modelo-322-procedure",
    "boe-modelo-322-2007-form",
    "aeat-calendario-contribuyente-2026-hasta-2-marzo",
]

[revisions."2026-y-siguientes".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-322-2026-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction rather than unbuilt: authoring a projection row into the layout is what would make this family apply, and that change reaches this declaration through the same revision."
legal_refs = [
    "orden-eha-3434-2007:art-1",
    "orden-eha-3434-2007:art-8",
    "rd-1624-1992:art-71",
]
source_refs = [
