# Modelo 322 casillas for the 2008-2025 revision.
#
# Mirrored from the 2026-y-siguientes sibling and scoped by THIS revision's own
# diseño de registro (aeat-dr-322-2024-2025): a casilla lands here only where
# that design prints a slot for it, or where a landed casilla's formula reads
# it. Box [112] is deliberately absent -- it is a 2026 addition and the earlier
# record has no anchor for it -- and so is anything else the sibling declares
# that this edition does not print.
# Box [73] is carried by the 2022 diseno and dropped by the 2023 one, so it
# belongs to this revision alone. AEAT prints it "Operaciones no sujetas o con
# inversion del sujeto pasivo que originan el derecho a deduccion (hasta 30 de
# junio, resto a 0)" -- a 17-byte money slot in the Informacion adicional block,
# grounded like its siblings [71] [72] [74] [75] on the orden establishing this modelo.
# NO constraints lifted here, deliberately, and this is the one field of the six
# that must stay bare. The 2026 edition declares enum ["0", "1", "2"], and its
# own continuidad_evidence says why that is not this edition's value: 2022, 2023
# and 2024-25 all read "Si=1/No=2", while "2026 reordena el campo y explicita 0,
# sin cambio de concepto, tipo ni ancho". The 0 clave is a 2026 addition.
# Copying it back would widen the values this edition accepts to include one AEAT
# did not publish until 2026 -- a filer could then submit a 0 for 2022 and pass.
# The residual semantic_role finding against the 2026 row is therefore CORRECT and
# is a real cross-edition divergence: the role check compares one signature across
# every edition and cannot express a design that legitimately widened. It needs a
# ruling on the check, not an edit to this row.
# The three ledger-fed aggregates below are internal calculation surface, not
# AEAT form boxes. This revision now carries its design's own numbered totals --
# [38] total cuota devengada, [62] total a deducir, [63] diferencia -- as
# casillas addressed by the generated export layout, exactly as the 2026 sibling
# does. These slugs feed those boxes rather than filing a slot of their own, so
# they are internal_only, mirroring the sibling's identical declaration.

