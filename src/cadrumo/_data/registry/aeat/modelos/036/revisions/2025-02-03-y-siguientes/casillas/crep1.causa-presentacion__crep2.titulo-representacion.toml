# Modelo 036 PAGINA 3 -- representantes. Two parallel blocks, 3.1 and 3.2, each
# carrying the same shape: a representante, a persona fisica designada, and the
# causa/tipo/titulo of the representation.
#
# Grounded in aeat-dr-036-2025, the bundled diseno. Pag. 3 tiles 1..1200 exactly
# once with no gap and no overlap, and every number and offset below was read from
# its own field description. Labels are a light rendering of those descriptions.
#
# FOUR DATES, EACH ONE CASILLA. [303], [313], [353] and [363] are each split by the
# diseno into dia, mes and ano component fields. A composite component is not a
# casilla of its own, so each is a single `date` -- the convention modelo 840
# settled for its [62] and [109].
#
# TWO POSITIONS CARRY A BRACKET WITH TWO NUMBERS IN IT, and that is an extractor
# limit worth naming. The causa-de-la-representacion fields at @480+1 and @956+1
# are labelled "[330 332]" and "[380 382]". The derived-casilla regex matches a
# SINGLE number inside a bracket, so none of 330, 332, 380 or 382 appears in the
# derived set -- confirmed by enumerating it. Declaring one of them as `number`
# would claim a box the coverage report cannot see, so both fields take slugs.
# They are still real filer-supplied facts and are still casillas. If the regex is
# ever widened to read multi-number brackets, these two are the first places to
# re-check.
#
# A DISENO LABELLING DEFECT, recorded not corrected: the field at @480 is described
# "3.2.- Causa de la representacion" although it sits inside block 3.1 -- block 3.2
# does not open until @487. Its neighbours at @481, @483 and @485 are correctly
# described "3.1.-". The offsets are unambiguous, so this file follows the offsets
# and assigns @480 to block 3.1.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @1191+10, the
# record-level "Tipo declaracion" position at @10+1, and the three "Reservado para
# la Agencia Tributaria" runs at @298+182, @774+182 and @963+228. None carries a box
# number and none is filer-supplied.

