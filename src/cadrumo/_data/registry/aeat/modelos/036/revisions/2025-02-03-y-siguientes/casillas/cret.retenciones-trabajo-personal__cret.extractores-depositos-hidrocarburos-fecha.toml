# Modelo 036 PAGINA 7 -- obligacion de retener o ingresar a cuenta, impuestos
# especiales, adquisiciones intracomunitarias, impuestos medioambientales, el
# impuesto sobre determinados servicios digitales, los servicios de
# telecomunicaciones prestados desde otros estados miembros, y el registro de
# extractores de depositos fiscales.
#
# 42 casillas over 84 design fields, 38 carrying an AEAT number and 4 slugs.
# Grounded in aeat-dr-036-2025. Pag. 7 tiles 1..400 exactly once with NO gap and NO
# PARTIAL OVERLAP -- both checked -- and every number, offset, length and type below
# was read from its own field description.
#
# AN EIGHTH NUMBER FORM: THE DOTTED SUFFIX. The extractores block prints [716.a],
# [717.a], [716.b] and [717.b] -- a number, a full stop, then a letter. Every pattern
# used on this modelo so far allowed a trailing letter attached directly (A4, 412bis)
# but never one behind a separator, so all four were invisible and none of their bare
# stems (716, 717) appears anywhere else in the design either. FOUR numbers added,
# taking the count to 674.
#
# EIGHT REPORTED DENOMINATORS NOW: 288, 348, 659, 667, 669, 672, 670, 674. Each of the
# last three corrections found a different KIND of error -- a missing form, a false
# positive, another missing form -- rather than more of the same. The count is a
# measurement with error in both directions, not a fact about the design, and it should
# be read as "what a stated pattern, less stated noise, finds".
#
# The dotted pair is semantically clear even though its form is new: 716 is the
# alta/baja flag and 717 its fecha, with ".a" for alcohol y bebidas derivadas and ".b"
# for hidrocarburos. The suffix distinguishes two product scopes of the SAME registro,
# which is why AEAT numbered them as variants rather than as separate boxes.
#
# FOUR FIELDS CARRY LIST BRACKETS and take slugs, as elsewhere on this modelo: the
# IVA sujecion/no-sujecion option, the intracomunitarias threshold, and the two
# telecom excede/no-excede selectors. Each is one byte behind two printed tick boxes.
#
# EIGHTEEN DATE TRIPLES collapse to one date casilla each, two of them under a dotted
# number.
#
# THE RETENCIONES AND IIEE BLOCKS ARE GENERATED from their repeated flag-plus-date
# shape, but every generated offset and number was cross-checked individually against
# its own design row rather than trusted to the repetition.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @391+10, the
# record-level "Tipo declaracion" at @10+1, and the three "Reservado para la Agencia
# Tributaria" runs at @119+82, @203+3 and @264+127. None is filer-supplied.

