# Modelo 036 PAGINA 4, continued -- locales indirectamente afectos a la actividad
# (dos bloques) y los indicadores de referencia catastral.
#
# Second half of Pag. 4, split from the first only to stay within the registry
# reviewability line budget. The two files share one design, one grounding and one set
# of caveats, recorded in full in the sibling fragment whose stem begins
# "cact.actividad-descripcion".
#
# THE CAVEATS THAT BEAR ON THIS HALF, restated because they govern casillas declared
# here rather than merely cross-referenced:
#
#   * A SEVENTH NUMBER FORM lives here. The indicators at @835 to @838 print "NNNbis"
#     -- [412bis], [433bis], [454bis], [4774bis] -- which every earlier pattern missed,
#     because all of them allowed at most one trailing letter.
#   * [4774bis] IS TRANSCRIBED AS PRINTED and is very likely AEAT's typo for "477bis":
#     the other three indicators pair with their own block's referencia catastral, and
#     this block's is [477]. That is an inference, not a transcription, and is NOT
#     adopted.
#
# Grounded in aeat-dr-036-2025. Pag. 4 tiles 1..900 exactly once with no gap and no
# partial overlap, and every number, offset, length and type was read from its own
# field description. The two indirect blocks share one 20-field shape, generated from
# it and then cross-checked row by row against the design.
#
# NOT MODELLED here: the "Codigo de Municipio. Reservado" fields at @590 and @764, the
# reservado run at @839+52, and the end-of-record identifier at @891+10.

