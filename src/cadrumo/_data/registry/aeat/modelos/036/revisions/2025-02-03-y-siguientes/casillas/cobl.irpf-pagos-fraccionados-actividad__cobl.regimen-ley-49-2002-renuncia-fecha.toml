# Modelo 036 PAGINA 6 -- obligaciones por IRPF, Impuesto sobre Sociedades e IRNR,
# y la opcion por el regimen fiscal especial del Titulo II de la Ley 49/2002.
#
# 47 casillas over 88 design fields, 25 carrying an AEAT number and 22 slugs.
# Grounded in aeat-dr-036-2025. Pag. 6 tiles 1..400 exactly once with NO gap and NO
# PARTIAL OVERLAP -- both checked -- and every number, offset, length and type below
# was read from its own field description.
#
# A SECOND FALSE-POSITIVE CLASS, larger than the first. Pag. 4 established that a
# token which merely LOOKS like a box number is not one: "(m2)" in "Superficie (m2)"
# was being counted as box "m2". This record carries a bigger instance of the same
# error. Twenty-four of its fields open "IRPF. (1) Si determinaba el rendimiento
# neto..." or "(2) Si determinaba...", where (1) and (2) are FOOTNOTE MARKERS keyed
# to notes printed below the form. Both matched a parenthesised-number pattern and
# were counted as boxes "1" and "2" in every denominator reported for this modelo.
#
# Removing m2, 1 and 2 and admitting the NNNbis form, the corrected count is 670.
# Seven reported denominators now: 288, 348, 659, 667, 669, 672, 670. The two most
# recent moved in OPPOSITE directions, which is the point -- a pattern over prose
# mis-measures both ways, and no count derived this way should be stated as the
# design's true box total.
#
# ONE NUMBER OVER A WHOLE REPEATING BLOCK. AEAT prints [613] over all twelve fields
# of the estimacion objetiva activity block and [614] over all twelve of the
# modalidad simplificada block. Each block is four activity rows of seccion I.A.E.,
# grupo o epigrafe and tipo de actividad. No single field owns either number, so all
# sixteen casillas take slugs and 613 and 614 join the numbers that are covered by a
# modelled FIELD without being individually addressable -- the same state as a list
# bracket. Splitting one number across four rows would assert four boxes AEAT does
# not print; collapsing four rows into one casilla would lose four distinct declared
# activities.
#
# Within each row, seccion (1 position) and grupo o epigrafe (4) become ONE casilla
# of five, and tipo de actividad (3) another -- the same split Pag. 4 uses for [402]
# and [403], which the design there declares explicitly.
#
# [640] IS A TWO-COMPONENT DATE, not a truncated triple. The design declares only
# @129+2 dia and @131+2 mes for "fecha de cierre del ejercicio economico", with NO
# ano field, an annual closing date being a day and a month. The casilla spans four
# positions rather than eight; this is read from the design, not an omission.
#
# SIX FIELDS CARRY LIST BRACKETS and take slugs, as elsewhere on this modelo: the
# three IRPF estimacion methods, the IS exencion and its fecha, and the IRNR
# modalidad. Each is one selecting byte behind several printed tick boxes.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @391+10, the
# record-level "Tipo declaracion" at @10+1, and the "Reservado para la Agencia
# Tributaria" run at @207+184. None is filer-supplied.

