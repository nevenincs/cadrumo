VERIFIED -- CAPTION MEANING, TRIAGED AGAINST THE OTHER DESIGN RATHER THAN THE OTHER \nEDITION. The generator reports 474 carried rows whose caption differs from the 2025 \nedition's comments, but that is the wrong comparison to judge meaning by: those comments \nare editorial paraphrase ("Bloque 13a. N.I.F. del sucesor") where this edition transcribes \nthe design ("13a Relacion de sucesores. Sucesor o beneficiario. N.I.F."), so nearly every \nrow differs by convention. Comparing the two DESIGNS directly, per number, over the 619 \nnumbers both print: 437 captions byte-identical, 171 differing only by the 037 asterisk or \nthe version year, and 11 substantively. ALL ELEVEN fall in the declined or deferred set and \nNONE is a number this edition emits, so no emitted casilla carries a caption whose meaning \nchanged between the designs. The eleven are mostly 2025 appending an INE clarifier ("Codigo \nvia INE", "Codigo Municipio INE") to a domicilio caption, plus the VERSION constant moving \n20230421 to 20250203. NOT CLAIMED -- the 037 asterisk: a trailing ' *' marks a field informable \
