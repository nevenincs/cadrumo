[revisions."2023-hasta-2025-02-02".family_dispositions.deadline_windows]
reason = """\
The censal declaration has no calendar plazo: its period_selector declares the EVENT kinds \
alta, modificacion and baja rather than calendar periods, and RD 1065/2007 anchors each to \
its triggering event rather than to a date in the year. Article 11.2 states this verbatim for \
the baja -- la declaracion de baja debera presentarse en el plazo de un mes desde que se \
cumplan las condiciones previstas en el apartado 1 de este articulo -- so a deadline window \
keyed to a calendar period would assert a plazo this modelo does not have."""
