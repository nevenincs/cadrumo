# Modelo 036 PAGINA 2B -- personas juridicas y entidades: identificacion,
# domicilio fiscal, domicilio en el Estado de residencia y datos de aviso.
#
# This is the third and last of the modelo's identity records: Pag. 2A is the
# persona fisica, Pag. 2C the establecimiento permanente of a non-resident entity,
# and this one the persona juridica or entidad. Like both of those, almost every
# number here is LETTERED -- [B4], [B25], [B91] -- and therefore invisible to a
# derived-casilla regex matching digits only. Unlike them, this record ALSO carries
# a run of plain-digit boxes (65, 68, 69, 70, 71, 73, 75, 77, 78, 79) in its
# personalidad juridica block, so it is the one identity record the derived set can
# partly see.
#
# Grounded in aeat-dr-036-2025. Pag. 2B tiles 1..2100 exactly once with NO gap and
# NO PARTIAL OVERLAP -- both checked, since a gap-only check passes over overlapping
# fields -- and every number, offset, length and type below was read from its own
# field description.
#
# AEAT PRINTS [B72], [B74] AND [B76] TWICE EACH IN THIS ONE RECORD. This is a real
# collision in the published spreadsheet, not a parsing artefact; the raw cell text
# was read directly to confirm it. The two homes are:
#   * the domicilio social block, where B71..B85 form a COMPLETE and coherent run
#     (B71 tipo de via, B72 nombre de la via, B73 tipo num., B74 num casa, B75
#     calif., B76 bloque, B77 portal ... B85 codigo de provincia); and
#   * the personalidad juridica block at @1734, @1737 and @1740, whose surrounding
#     numbers are PLAIN digits -- 70, 71, 73, 75, 77 -- so the three B-prefixed
#     entries interrupt an otherwise unbroken plain sequence.
#
# The domicilio social fields therefore KEEP B72, B74 and B76: their run is
# complete and unambiguous. The three personalidad juridica fields take descriptive
# slugs, following the modelo 604 precedent that a field naming ANOTHER box's number
# keeps a slug rather than duplicating it -- and (segmento, number) uniqueness is
# enforced revision-wide, so duplicating was never available anyway.
#
# WHAT IS DELIBERATELY *NOT* DONE HERE: the plain run strongly suggests AEAT meant
# [72], [74] and [76] at those three positions. That reading is an INFERENCE, not a
# transcription, so those numbers are NOT adopted. If AEAT's instructions or a later
# design confirm it, the slugs can be replaced with a recorded reason; until then the
# registry does not assert a box number AEAT did not print.
#
# ONE BYTE CARRIES A LIST BRACKET. @11+1 prints "[B1,B2]" -- a single selecting code
# byte behind two printed tick boxes (residente or constituida en Espana / no
# residente or constituida en el extranjero). No single number describes such a
# field, so it takes a slug, exactly as Pag. 3's causa flags do. B1 and B2 are
# therefore both unmodelled AS NUMBERS, which is correct rather than a gap: neither
# names the field on its own. The tell is field width against number count.
#
# FOUR NUMBERS COLLAPSE THREE COMPONENTS EACH -- B8 (fecha acuerdo de voluntades),
# B9 (fecha de constitucion), B10 (fecha de inscripcion registral) and B3B (fecha de
# efectos de residencia fiscal) are each printed on a dia, mes and ano triple. Each
# becomes ONE date casilla, matching A10/A3B on Pag. 2A and C70/C71 on Pag. 2C.
#
# NINETEEN FIELDS CARRY NO PRINTED NUMBER and take descriptive slugs: the twelve
# one-byte aviso alta/baja flags, the six INE via and municipio codes across the
# three domicilios, and the domicilio-en-el-extranjero indicator. Their slug numbers
# are prefixed "pj-", because Pag. 2A and 2C carry fields of the same name.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @2091+10, the
# record-level "Tipo declaracion" at @10+1, and the seven "Reservado para la Agencia
# Tributaria" runs. None is filer-supplied.
#
# NOT PRESENT IN THE DESIGN, so not invented: the B series skips B1, B56 to B58, B65
# to B67, B70, B86 to B89; the plain run skips 66 and 67.
#
# This file is the first half of the record, split from its sibling only to stay
# within the registry reviewability line budget.

