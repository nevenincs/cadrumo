# Modelo 036 PAGINA 2A, continued -- persona fisica: domicilio a efectos de
# notificaciones, domicilio de gestion administrativa y establecimientos
# permanentes.
#
# This is the second half of Pag. 2A, split from the first only to stay within the
# registry reviewability line budget; the two files share one design, one grounding
# and one set of caveats, recorded in full in the sibling fragment whose stem begins
# "cpf.identificacion-residencia-indicador".
#
# The caveats that bear on THIS half specifically: every box number here is LETTERED
# ([A41], [A71], [A91]) and therefore invisible to the derived-casilla regex, so
# authoring it moves derived coverage by zero; the six unnumbered fields (the INE
# via and municipio codes for both domicilios) take descriptive slugs because they
# carry no printed number; and A57, A58, A65 to A67, A86 to A89, A93, A95 and A97
# are absent from the design and are NOT invented here.
#
# A40 and A70 sit near the end of the record by offset, far from the domicilio
# blocks they belong to; they are placed in their owning section rather than by
# adjacency, which is why this file's last casilla is a gestion-administrativa flag.
#
# Grounded in aeat-dr-036-2025. Pag. 2A tiles 1..2000 exactly once with no gap and
# no overlap, and every number, offset, length and type below was read from its own
# field description.

