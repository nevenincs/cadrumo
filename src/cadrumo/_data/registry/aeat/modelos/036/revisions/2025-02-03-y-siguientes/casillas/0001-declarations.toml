# Modelo 036 PAGINA 9 -- relacion de sucesores. Six blocks, 13a to 13f, each
# carrying one sucesor o beneficiario. The record header notes a maximum of twelve
# sucesores across two pages, so this record is one page of six.
#
# Grounded in aeat-dr-036-2025. Pag. 9 tiles 1..1300 exactly once with no gap and
# no overlap, and every number and offset below was read from its own field
# description.
#
# THE NUMBERS 921 THROUGH 943 ARE READ FROM A MALFORMED BRACKET, and that is worth
# stating because it looks like invention and is not. AEAT prints a well-formed
# "[920]" on each block's N.I.F., and then "921]", "922]", "923]" on the three
# fields that follow -- a CLOSING bracket with no opening one. The derived-casilla
# regex matches "[NNN]" only, so it sees six numbers on this record where AEAT
# prints twenty-four. The run is contiguous and unambiguous: 920 to 943, four per
# block, in offset order, verified across all six blocks. These casillas therefore
# carry AEAT's real numbers rather than minted slugs.
#
# A consequence worth carrying: the derived set UNDERCOUNTS this modelo. Across the
# whole diseno 288 numbers are regex-visible while 348 distinct numbers are
# actually printed -- 58 behind a malformed bracket and 4 inside multi-number
# brackets. Coverage measured against 288 is measured against a floor, not the true
# box set.
#
# WHY THESE TAKE REAL NUMBERS WHILE PAGINA 3's CAUSA FLAGS TAKE SLUGS. The two look
# alike and are not. On Pag. 3 a single byte carries a bracket LISTING several
# numbers -- "[300,301,302]", "[311,312]", "[330 332]" -- because the printed form
# has three separate tick boxes and the fichero collapses them into one code byte
# that SELECTS among them. No single number describes that field, so it takes a
# slug. Here each malformed bracket holds exactly ONE number belonging to exactly
# one field; only the opening bracket is missing.
#
# The percentage and cuota types are grounded rather than inferred: the diseno
# states "(3 ent + 2 decim.)" and "(12 ent + 2 decim.)" explicitly, so they are
# `decimal` and `money` rather than integers.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @1291+10, the
# record-level "Tipo declaracion" position at @10+1, and the six "Reservado para la
# Agencia Tributaria" runs. None is filer-supplied.
