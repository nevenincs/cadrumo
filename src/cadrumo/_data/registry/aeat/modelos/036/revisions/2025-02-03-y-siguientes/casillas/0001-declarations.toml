id = "decl.event-kind"
number = "tipo-declaracion"
data_type = "text"
semantic_role = "tipo_evento_censal"
continuidad_origin = "predecessor_edition_silent"
continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. Every record of the predecessor design opens with the tipo-declaracion discriminant at byte 10, length 1: Pag. 1 row 2 reads Tipo declaracion with content blanco o C (compl.), and Pag. 9 row 2 reads Tipo declaracion (maximo 12 sucesores en total - 2 paginas). The successor design prints the identical field at the identical position on every record. The predecessor edition declares it nowhere and says so in its own casilla-shard header: NOT MODELLED: the identifier envelope, the reservado runs, the CRLF terminator and the tipo-declaracion discriminant. The absence is a declared modelling gap in the corpus, not a change to the form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
required = true
input_kind = "bound"
binding = "modelo-036-profile-censo-status"
section = ["declaracion", "censo"]
legal_refs = ["rd-1065-2007:art-9", "rd-1065-2007:art-10", "rd-1065-2007:art-11", "orden-eha-1274-2007:art-1", "orden-eha-1274-2007:art-2", "orden-hac-1526-2024:art-1"]

[[revisions.2025-02-03-y-siguientes.casillas]]
id = "decl.vigencia-2025"
number = "vigencia"
data_type = "text"
semantic_role = "vigencia_normativa"
continuidad_origin = "predecessor_edition_silent"
continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints the version constant at Pag. 1 @11+8 (Num): VERSION AAAMMDD (ANO MES DIA - FECHA ENTRADA EN VIGOR 036- 20230421 037- 20230421). The successor prints the same field at the same position: VERSION AAAMMDD (ANO MES DIA - FECHA ENTRADA EN VIGOR 036- 20250203). Only the constant differs; the printed field, its offset, its length and its type do not. The predecessor edition declines it deliberately: its revision note names the VERSION AAAMMDD constant as one of two slots declined on purpose among the 82 unnumbered. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
required = true
input_kind = "informational"
section = ["declaracion", "vigencia"]
legal_refs = ["rd-1065-2007:art-9", "rd-1065-2007:art-10", "rd-1065-2007:art-11", "orden-hac-1526-2024:art-1", "orden-hac-1526-2024:df-unica"]
