# Modelo 036 PAGINA 2A -- persona fisica: identificacion, domicilios y
# establecimientos permanentes. This is the natural-person identity record.
#
# WHY THIS RECORD LOOKED EMPTY AND WAS NOT. A previous stamp on this revision said
# "Pag. 0, 2A and 2C carry no box numbers at all, being repeating or structural
# records". That is true of Pag. 0 alone. Pag. 2A prints 86 distinct box numbers,
# and it read as zero because EVERY ONE OF THEM IS LETTERED -- [A4], [A25], [A91]
# -- while the derived-casilla regex matches digits only. A derived zero is not
# evidence of absence; it is evidence the deriver found nothing it recognises.
# Authoring these casillas therefore moves the derived coverage figure by ZERO,
# and that is the honest signal rather than a defect.
#
# Grounded in aeat-dr-036-2025. Pag. 2A tiles 1..2000 exactly once with no gap and
# no overlap, and every number, offset, length and type below was read from its own
# field description.
#
# THREE BRACKET FORMS ARE MALFORMED IN AEAT'S OWN SPREADSHEET and are transcribed
# here as printed rather than silently normalised: [A1) closes with a parenthesis,
# [ A38] carries a leading space, and (a28) is parenthesised and lowercase. Each
# holds exactly ONE number belonging to exactly one field, so each casilla carries
# AEAT's real number. Contrast Pag. 3, where a single byte carries a bracket LISTING
# several numbers and no single number describes the field, so those take slugs.
#
# TWO NUMBERS COLLAPSE THREE COMPONENTS EACH. A10 is printed on the ERL dia, mes and
# ano fields alike, and A3B on the residencia-fiscal dia, mes and ano. Each becomes
# ONE date casilla spanning the three, following the convention already used on this
# modelo's other date fields -- six integers would misrepresent two printed boxes.
#
# EIGHTEEN FIELDS CARRY NO PRINTED NUMBER and take descriptive slugs: the twelve
# one-byte aviso alta/baja flags, and the six INE via and municipio codes. They are
# filer-supplied and belong in the registry; they simply are not boxes, so they do
# not count toward the box coverage above.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @1991+10, the
# record-level "Tipo declaracion" at @10+1, and the seven "Reservado para la Agencia
# Tributaria" runs. None is filer-supplied.
#
# NOT PRESENT IN THE DESIGN, so not invented: A57, A58, A65 to A67, A86 to A89, A93,
# A95 and A97 are absent from this record. They may live on the printed form without
# a fichero position, or on another page. This fragment does not guess at them.
