data_type = "boolean"
continuidad_origin = "new_on_form"
continuidad_evidence = "CARVED OUT OF A RESERVED RUN. The successor design prints this tick box at Pag. 2B @873+1 'Persona juridica. Datos telefonos y direccione para recibir avisos. Tfno. Movil Alta/Modificacion'. The predecessor design prints no field there: the byte range falls inside a 'Reservado para la Agencia Tributaria' run, so the box did not exist on the predecessor form. The whole avisos alta/baja block (AEAT, TEA, DGT, e-mail, telefono movil, aplicacion movil AEAT) was taken from those reserved runs on Pag. 2A @471 and @809, Pag. 2B @535 and @873 and Pag. 2C @607 and @951. Sources: corpus/.../modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and corpus/.../modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
required = false
input_kind = "manual"
section = ["declaracion", "persona_juridica", "avisos"]
