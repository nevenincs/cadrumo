# Modelo 036 PAGINA 2C -- establecimiento permanente de una persona juridica o
# entidad NO RESIDENTE: identificacion, domicilios y datos de aviso.
#
# WHY THIS RECORD LOOKED EMPTY AND WAS NOT. A stamp on this revision once said
# "Pag. 0, 2A and 2C carry no box numbers at all, being repeating or structural
# records". That was true of Pag. 0 alone, and this fragment closes the second half
# of that retraction: Pag. 2C prints 57 distinct box numbers, every one of them
# LETTERED -- [C1], [C25], [C71] -- and therefore invisible to a derived-casilla
# regex that matches digits only. Authoring the whole record moves the derived
# coverage figure by ZERO. That is the honest signal, not a defect: a derived zero
# is evidence the deriver recognised nothing, not evidence of absence.
#
# Grounded in aeat-dr-036-2025. Pag. 2C tiles 1..1400 exactly once with no gap and
# no overlap, and every number, offset, length and type below was read from its own
# field description.
#
# TWO NUMBERS COLLAPSE THREE COMPONENTS EACH. C70 is printed on the registro
# mercantil dia, mes and ano fields alike, and C71 on the fecha de constitucion dia,
# mes and ano. Each becomes ONE date casilla spanning the three, matching the
# convention already used on Pag. 2A (A10, A3B) and Pag. 9. Six integers would
# misrepresent two printed boxes.
#
# C68 AND C69 CARRY THE WRONG ENTITY IN AEAT'S OWN TEXT. Both field descriptions
# open "Persona Fisica.", but they sit inside the establecimiento permanente record
# and are numbered in its C series. This is a copy-paste artefact in the published
# spreadsheet, not a real persona fisica field; the labels here describe the record
# the fields actually belong to, and the discrepancy is recorded rather than
# propagated. Their Pag. 2A counterparts are A68 and A69.
