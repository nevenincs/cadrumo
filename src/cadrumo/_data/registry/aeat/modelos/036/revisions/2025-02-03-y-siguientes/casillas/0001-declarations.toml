id = "rep1.causa-presentacion"
number = "rep1-causa-presentacion"
data_type = "text"
continuidad_origin = "predecessor_edition_silent"
continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this field at Pag. 3 @11+1 (line 419 of the extract): 3.1.- Causa de la presentacion. Alta, Baja o Modificacion del representante [300,301,302]. The successor design prints the same field at the same page and byte position: 3.1.- Causa de la presentacion. Alta, Baja o Modificacion del representante [300,301,302]. AEAT prints its number here as a list rather than a single box, and the predecessor edition revision note records 33 such comma-list groups declined at parity. The predecessor edition 2023-hasta-2025-02-02 emits no casilla for it, so this absence is a gap in the corpus declaration and not a change to the official form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
required = false
input_kind = "manual"
