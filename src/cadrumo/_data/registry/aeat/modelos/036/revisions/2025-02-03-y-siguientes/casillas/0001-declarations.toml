# Modelo 036 PAGINA 10 -- relacion de titulares reales, six blocks 14a to 14f.
#
# 54 casillas over 90 design fields, 6 carrying an AEAT number and 48 slugs. Grounded
# in aeat-dr-036-2025. Pag. 10 tiles 1..1750 exactly once with NO gap and NO PARTIAL
# OVERLAP -- both checked -- and every number, offset, length and type below was read
# from its own field description.
#
# THIS RECORD IS AUTHORED BLOCK BY BLOCK, unlike its sibling Pagina 8, and the reason
# is in the numbers rather than in the shape. Both records repeat a thirteen-field row
# several times. But Pag. 8's four blocks all print THE SAME numbers, so those numbers
# describe a row and the record is declared once; Pag. 10's six blocks print DISTINCT
# numbers -- 1000 to 1003 for 14a, 1004 to 1007 for 14b, and so on to 1020 to 1023 for
# 14f -- so each block is a distinct set of boxes and collapsing them would lose
# eighteen numbers. The number set, not the repetition, decides.
#
# ONLY THE CAUSA AND ITS FECHA ARE NUMBERED. Each block prints a LIST bracket on the
# causa de la presentacion byte and a single number on its fecha. The nine identity
# fields -- tipo de documento, N.I.F. or foreign identification code, apellidos y
# nombre, pais de expedicion, fecha de nacimiento, pais de residencia and
# nacionalidad -- carry NO printed number at all and take descriptive slugs. That is
# the design's own division, not a gap in the transcription.
#
# The record header notes a maximum of 40 titulares across 7 pages, with space for 42;
# this file declares the six blocks of ONE page, which is what the bundled design
# describes.
#
# TWO RECORD-LEVEL FIELDS SIT AFTER THE SIX BLOCKS and belong to no titular: the
# "declaracion de no variacion de datos" at @1715+1 and "entidad sin obligacion de
# identificar al titular real" at @1716+1. Neither carries a printed number, and both
# are filer-supplied, so both are declared here under slugs. They were found by
# asserting that every one of the record's 90 fields is either authored or explicitly
# excluded -- the block-shaped reading of this record would have missed them, which is
# exactly what that completeness check exists to catch.
#
