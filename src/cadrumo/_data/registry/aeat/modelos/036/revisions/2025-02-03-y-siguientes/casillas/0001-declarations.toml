# Modelo 036 PAGINA 2B, continued -- personas juridicas y entidades: domicilio a
# efectos de notificaciones, domicilio social, personalidad juridica y clase de
# entidad, y establecimientos permanentes.
#
# Second half of Pag. 2B, split from the first only to stay within the registry
# reviewability line budget. The two files share one design, one grounding and one
# set of caveats, recorded in full in the sibling fragment whose stem begins
# "cpj.identificacion-residencia-indicador".
#
# THE CAVEAT THAT BEARS MOST ON THIS HALF, restated rather than cross-referenced
# because it governs casillas declared here: AEAT PRINTS [B72], [B74] AND [B76]
# TWICE EACH IN THIS RECORD, and both homes are in this file. The domicilio social
# block holds a COMPLETE B71..B85 run and KEEPS those three numbers. The personalidad
# juridica fields at @1734, @1737 and @1740 print the same three, surrounded by an
# otherwise unbroken PLAIN sequence (70, 71, 73, 75, 77), and take descriptive slugs
# instead -- the modelo 604 precedent for a field naming another box's number. The
# plain run suggests AEAT meant [72], [74], [76]; that is an inference, not a
# transcription, and is deliberately NOT adopted.
#
# Grounded in aeat-dr-036-2025. Pag. 2B tiles 1..2100 exactly once with no gap and
# no partial overlap, and every number, offset, length and type below was read from
# its own field description.
#
# B3B collapses three date components at @1946+2 dia, @1948+2 mes and @1950+4 ano.
# @1943 prints its number lowercase and parenthesised, "(b40)", and is transcribed
# as printed rather than normalised.
#
# NOT MODELLED here: the "Reservado para la Agencia Tributaria" runs and the
# end-of-record identifier at @2091+10.

# @904+5. Domicilio a efectos de notificaciones. Domicilio 1. Codigo de via INE. Carries no printed box number.
