# Modelo 036 PAGINA 4 -- actividades y locales: the declared activity, its I.A.E.
# classification, activity carried on outside a fixed local, two locales directly
# affected by the activity and two indirectly affected.
#
# 92 casillas over 130 design fields. Grounded in aeat-dr-036-2025. Pag. 4 tiles
# 1..900 exactly once with NO gap and NO PARTIAL OVERLAP -- both checked -- and every
# number, offset, length and type below was read from its own field description.
#
# THIS RECORD CORRECTS THE BOX COUNT IN BOTH DIRECTIONS, which no earlier record did.
# Five previous corrections to this modelo's denominator all ADDED numbers a narrower
# pattern had missed. This one does both:
#
#   * A SEVENTH NUMBER FORM. The four indicators at @835 to @838 print "NNNbis" --
#     [412bis], [433bis], [454bis] and [4774bis]. Every pattern used so far allowed at
#     most ONE trailing letter, so all four were invisible: FOUR numbers added.
#   * A FALSE POSITIVE, the first found. The four "Superficie (m2)" fields print the
#     UNIT in parentheses, and "(m2)" matches a bracketed-number pattern exactly as a
#     real box number would. "m2" has been counted as a box number in every
#     denominator reported for this modelo: ONE number removed.
#
# So widening a pattern does not only reveal undercounting; it also admits noise, and
# a token that merely LOOKS like a box number is not one. The corrected count is
# 669 - 1 + 4 = 672.
#
# [4774bis] IS TRANSCRIBED AS PRINTED and is very likely AEAT's typo. The other three
# indicators pair with the referencia catastral of their own block -- 412bis with
# [412], 433bis with [433], 454bis with [454] -- and the second indirect block's
# referencia catastral is [477], so the pattern points at "477bis". That is an
# INFERENCE, not a transcription, and is NOT adopted, exactly as the [B72]/[B74]/[B76]
# collision on Pag. 2B was left as printed. The registry does not assert a box number
# AEAT did not print.
#
# ONE NUMBER SPANS TWO ADJACENT FIELDS. [402] is printed on BOTH @71+1 (seccion del
# I.A.E.) and @72+4 (grupo o epigrafe), which are contiguous and together form the one
# I.A.E. classification the box names. They become ONE casilla of five positions,
# following the same convention as this modelo's date triples.
#
# FOURTEEN DATE TRIPLES collapse to one date casilla each.
#
# THE FOUR LOCAL BLOCKS ARE GENERATED FROM A PROVEN SHAPE, not assumed. The two
# directly-affected blocks share one 19-field shape and the two indirectly-affected
# ones a 20-field shape (they add "uso o destino"). Each generated offset and number
# was cross-checked individually against its own design row rather than trusted to the
# repetition.
