id = "pj.dsoc-codigo-via-ine"
number = "pj-dsoc-codigo-via-ine"
data_type = "text"
continuidad_origin = "predecessor_edition_silent"
continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this field at Pag. 2B @1407+5 (line 264 of the extract): Pers.jcas. o entidades. Domicilio social en Espana(si distinto del fiscal).. The successor design prints the same field at the same page and byte position: Pers.jcas. o entidades. Domicilio social en Espana(si distinto del fiscal).. AEAT prints the slot with no box number at all; the predecessor edition revision note records 82 such unnumbered slots declined at parity. The predecessor edition 2023-hasta-2025-02-02 emits no casilla for it, so this absence is a gap in the corpus declaration and not a change to the official form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
required = false
