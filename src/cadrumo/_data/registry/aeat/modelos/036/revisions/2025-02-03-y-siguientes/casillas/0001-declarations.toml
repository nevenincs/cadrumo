# Modelo 036 PAGINA 5 -- IVA: obligaciones, comunicacion de inicio de actividad,
# regimenes, registros, prorrata y sectores diferenciados, ingreso del IVA a la
# importacion, llevanza de libros y facturacion por terceros.
#
# 68 casillas over 115 design fields. Grounded in aeat-dr-036-2025. Pag. 5 tiles
# 1..380 exactly once with NO gap and NO PARTIAL OVERLAP -- both checked, since a
# gap-only check passes over overlapping fields -- and every number, offset, length
# and type below was read from its own field description.
#
# THIS RECORD FOUND A SIXTH BRACKET FORM, and it is worth stating because four
# earlier stamps on this revision reported a box-count denominator that was wrong
# each time for exactly this reason. @273+1 prints its numbers as a PARENTHESISED
# list -- "(532,737)" -- where every other multi-number field on this modelo uses a
# SQUARE-bracketed list. The five patterns used until now could not see it, so 532
# and 737 were absent from every count taken so far. The measured denominator moves
# from 667 to 669.
#
# The lesson is not the two numbers. It is that each widening of the pattern has
# found more, and that the honest form of a coverage claim over this design is "a
# pattern admitting N forms finds X", never "the design has X boxes".
#
# LIST BRACKETS TAKE SLUGS, and this record has more of them than any other: 19
# fields carry a bracket listing several numbers, holding 53 numbers between them.
# The regimenes de agricultura, simplificado and criterio de caja each print FIVE
# numbers on one byte, because the printed form has five tick boxes -- one per
# alta/baja/renuncia/revocacion variant -- that the fichero collapses into a single
# selecting code byte. No single number describes such a field, so each takes a
# descriptive slug. The tell is field width against number count.
#
# The numbers behind those slugs are therefore NOT modelled individually and that is
# correct rather than a gap: 534, 538, 542, 546, 570 and their siblings do not each
# name a field. Do not "fix" this by splitting one byte into five casillas.
#
# EIGHTEEN SINGLE-NUMBER DATE TRIPLES collapse to one date casilla each, and three
# more collapse under a list bracket, matching the convention used across this
# modelo's other records.
#
# NOT MODELLED, deliberately: the envelope identifiers at @1+9 and @371+10, the
# record-level "Tipo declaracion" at @10+1, and the two "Reservado para la Agencia
# Tributaria" runs at @142+15 and @308+63. None is filer-supplied.
