continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this field on Pag. 8 under the list number [802,803,804], once per socio repetition (12a, 12b, 12c, 12d): 12a. Relacion de socios, miembros o participes. Causa de la presentacion. The successor design prints the same four rows, same positions, same list number, same caption. AEAT states the number as a list rather than a single box, and the predecessor edition revision note records 33 such comma-list groups declined at parity: neither the lists nor their parts are emitted. The absence is a corpus declaration gap, not a change to the form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804)."
