# Causa-de-presentación casillas, PÁGINA 1 of the Modelo 036.
#
# Numbers and labels are transcribed verbatim from the AEAT-published
# "Instrucciones Modelo 036", Anexo 3, PÁGINA 1, table columns
# TIPO / CASILLA / CAUSA DE PRESENTACIÓN, bundled in the corpus at
#   _data/corpus/aeat_official/instructions/modelo_036/files/
#     instrucciones-cumplimentacion-pagina-1.html
#
# Each is a tick box on the printed form and is therefore boolean and
# optional: a declaration ticks only the causas that motivate it, and the
# instructions are explicit that "se deberán rellenar exclusivamente las
# casillas que sufran alguna modificación". They are `manual` rather than
# `bound` because their value comes from the filed declaration itself
# (operator-entered, or lifted by the declaracion-pdf extraction profile),
# not from a profile fact.
#
# The TIPO column rides on each casilla's section path, mapping every causa
# onto the alta / modificación / baja lifecycle. That is what would let a
# filed 036 be classified from its ticked boxes rather than from prose.
# Nothing consumes that mapping today: the reader that did was deleted once
# a live authenticated walk proved the declarations register carries no 036
# rows at all. These casillas are kept as the transcribed AEAT form itself,
# grounded and ready for whichever surface reads a filed 036 next.

