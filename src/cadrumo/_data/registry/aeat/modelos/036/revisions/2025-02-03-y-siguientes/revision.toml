review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the censal alta/modificacion/baja declaration. \
DISCLOSURE -- self-review: the same agent authored the sixty-four new casillas across \
three units and re-grounded the pre-existing causa fragment. THIS STAMP RETRACTS TWO \
CLAIMS THE PREVIOUS ONES MADE. FIRST RETRACTION -- THE DENOMINATOR. Earlier stamps \
reported coverage \"of 288 derived casillas\", then corrected that to a true set of 348. \
Both are wrong. Measured with a pattern that reads every bracket form, this diseno prints \
659 DISTINCT BOX NUMBERS and the derived set sees 288 of them, or 44 percent. The \
invisible classes are: 223 LETTERED boxes ([A4], [B94]) that the derived-casilla regex \
misses because it matches digits only; 129 reachable only inside a LIST bracket \
([300,301,302], [B1,B2]); and 19 reachable only through a MALFORMED bracket (\"921]\", a \
closing bracket with no opening one). The 348 figure was itself an undercount because that \
scan looked for malformed and multi-number brackets but not for lettered ones, which are \
the largest class by far. Finding one invisibility class is not evidence there is only \
one. SECOND RETRACTION -- THE STRUCTURAL CLAIM. Earlier stamps said \"Pag. 0, 2A and 2C \
carry no box numbers at all, being repeating or structural records\". That is true of Pag. \
0 alone. Pag. 2A carries 83 real boxes and Pag. 2C carries 57: Pag. 2A is the persona \
fisica identity and domicilio record, [A4] N.I.F./N.I.E., [A5] Apellido 1, [A7] Nombre, \
[A11] Tipo de via. It looked structural for exactly the reason it is uncovered -- its \
boxes are lettered, so the derived set reports zero for it, and a derived zero reads as \
\"no boxes\" unless the field descriptions are checked. THE LESSON IS ABOUT THE \
INSTRUMENT, NOT THIS MODELO: a derived zero is not evidence of absence, only evidence that \
the deriver found nothing it recognises. VERIFIED -- COVERAGE 29 -> 65 of the 288 \
regex-visible numbers, which is 65 of 659 against the true set, with 95 casillas declared. \
PAGINAS 1, 3 and 9 are complete. Nothing authored is wrong: every casilla number was read \
from the design. What was wrong is every denominator previously reported here, and the \
error consistently flattered progress. VERIFIED -- TILING before any offset was trusted: \
Pag. 1 tiles 1..500, Pag. 3 tiles 1..1200, Pag. 9 tiles 1..1300, each exactly once, no \
gap, no overlap. All thirteen records tile clean and pass \
test_cited_design_field_bounds_are_self_consistent, the partial-overlap check -- a \
gap-only check would not suffice, because partial overlap leaves no holes. VERIFIED -- \
PAGINA 9's NUMBERS 921 TO 943 ARE READ, NOT MINTED: AEAT prints a well-formed [920] on \
each sucesor block's NIF then 921], 922], 923] on the three fields after it; the run is \
contiguous, four per block, in offset order, across all six blocks 13a to 13f. Those \
eighteen casillas move coverage by ZERO because the derived set cannot see them, which is \
the honest signal. VERIFIED -- THE OPPOSITE CASE, easy to invert: PAGINA 3's causa flags \
are ONE BYTE each carrying bracket LISTS ([300,301,302], [311,312], [330 332]) because the \
printed form has three separate tick boxes the fichero collapses into a single selecting \
code byte. No single number describes such a field, so each takes a slug. The tell is \
field width against number count. VERIFIED -- SIX DATES are each ONE casilla rather than \
eighteen integers (141, 152, 303, 313, 353, 363), and PAGINA 9's types are grounded in the \
diseno's own \"(3 ent + 2 decim.)\" and \"(12 ent + 2 decim.)\" statements. NOT CLAIMED -- \
THE CAUSA FRAGMENT'S LABELS remain underivable from any bundled source; its cited \
instructions file is a 5.4 KB navigation shell with no casilla table. The numbers and the \
alta/modificacion/baja section mapping ARE re-grounded on the diseno, whose descriptions \
open \"Alta.\", \"Modificacion.\" or \"Baja.\". One label was corrected on diseno evidence \
(137 had dropped \"y registros\"); four divergences are recorded unchanged pending the \
real Anexo 3 table. NOT CLAIMED -- 594 OF THE 659 REAL BOXES REMAIN UNMODELLED. By record: \
Pag. 5 has 107, Pag. 2B 96, Pag. 4 87, Pag. 2A 83, Pag. 2C 57, Pag. 6 50, Pag. 7 42, Pag. \
10 24, Pag. 8 16, Pag. 3 14. Pag. 0 has none and is genuinely the envelope. NOT CLAIMED -- \
NO CONSTRUCT MEMBERSHIP CHANGE, deliberately: this modelo's construct is a \
censo-foundation construct listing only profile-bound facts. NOT CLAIMED -- NO EXPORT \
LAYOUT: the application still cannot file this modelo, it stays on the filing-capability \
worklist, and model_law_authority_scope remains inspection_only. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- all 95 labels are \
populated and non-null across es/en/ca/hu, verified by counting VALUES rather than keys; \
the strings were not audited for accuracy."""
reviewed_at = 2026-08-22

[revisions."2025-02-03-y-siguientes".family_dispositions.deadline_windows]
reason = """\
The censal declaration has no calendar plazo: its period_selector declares the EVENT kinds \
alta, modificacion and baja rather than calendar periods, and RD 1065/2007 anchors each to \
its triggering event. Article 11.2 states this verbatim in the bundled corpus for the \
baja: la declaracion de baja debera presentarse en el plazo de un mes desde que se cumplan \
las condiciones previstas en el apartado 1 de este articulo. The bundled excerpts of \
articles 9 and 10 carry the substance of what alta and modificacion must declare but NOT \
their timing sentences, so the alta and modificacion periods are cited by article rather \
than reproduced and are not corpus-proven here. No recurring window exists for any of the \
three and none is fabricated."""
