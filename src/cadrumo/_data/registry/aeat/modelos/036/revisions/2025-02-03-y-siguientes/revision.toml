fields = { additional_source_refs = ["aeat-dr-036-2025"], continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this field at Pag. 2A @1033+100 (line 123 of the extract): Persona fisica. Identificacion. dominio o direccion de internet [ A38]. The successor design prints the same field at the same page and byte position: Persona fisica. Identificacion. dominio o direccion de internet [ A38]. AEAT prints a dedicated box number here, and the predecessor edition nonetheless emits no casilla for it. The predecessor edition 2023-hasta-2025-02-02 emits no casilla for it, so this absence is a gap in the corpus declaration and not a change to the official form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804).", continuidad_origin = "predecessor_edition_silent", legal_refs = ["rd-1065-2007:art-11", "orden-eha-1274-2007:art-1", "orden-hac-1526-2024:art-1"] }
