reviewed_by = """\
agent: applicability-grade review of the censal alta/modificacion/baja declaration, \
re-stamped after completing PAGINA 1 and authoring PAGINA 3. DISCLOSURE -- self-review: \
the same agent authored the forty new casillas across two units and re-grounded the \
pre-existing causa fragment. VERIFIED -- COVERAGE 29 -> 59 of 288 derived casillas, 71 \
casillas in total. PAGINA 1 is complete (every box number AEAT prints on it) and PAGINA 3, \
the two representante blocks, is complete. VERIFIED -- TILING before any offset was \
trusted: Pag. 1 tiles 1..500 and Pag. 3 tiles 1..1200, each exactly once, no gap, no \
overlap. All thirteen records of this design tile clean, and they also pass the \
partial-overlap check a peer shipped as test_cited_design_field_bounds_are_self_consistent \
-- a gap-only check would not have been sufficient, because partial overlap leaves no \
holes. VERIFIED -- SIX DATES ARE EACH ONE CASILLA, not eighteen integers: 141, 152, 303, \
313, 353 and 363 are each split by the diseno into dia, mes and ano component fields, and \
a composite component is not a casilla of its own. This is the convention modelo 840 \
settled, now applied six times across two modelos without adjustment. VERIFIED -- THE \
CAUSA FRAGMENT IS RE-GROUNDED. Its numbers and its alta/modificacion/baja section mapping \
are checkable against aeat-dr-036-2025: every description in the diseno opens \"Alta.\", \
\"Modificacion.\" or \"Baja.\", so the TIPO axis was grounded all along and merely \
mis-attributed. NOT CLAIMED -- ITS LABELS ARE NOT DERIVABLE FROM ANY BUNDLED SOURCE. The \
fragment cited the AEAT Instrucciones Anexo 3 PAGINA 1 table; that bundled file is a 5.4 \
KB navigation shell with no table, and across all six bundled modelo 036 instruction files \
the numbers 101, 103, 141, 151 and 152 appear in none. The capture dropped the table -- \
the file's own title names Anexo 3 -- so the source exists and is unbundled. The labels \
are NOT re-derived from the diseno on purpose: it carries AEAT's own typo at 130 \
(\"ata/baja\"), renders 142 and 143 unaccented and lowercase, and abbreviates throughout, \
so re-grounding labels on it would degrade them. ONE label was corrected on diseno \
evidence: 137 read \"otros Impuestos\", dropping the \"y registros\" the diseno states, \
which narrowed what the box covers. Four divergences are recorded and NOT changed -- 124 \
and 142 carry \"y baja\", 129 says \"alta/baja\" where the diseno says \
\"inscripcion/baja\", and 145 carries a page reference the diseno does not print. \
Adjudicating them needs the real Anexo 3 table bundled. NOT CLAIMED -- TWO DISENO DEFECTS \
ARE RECORDED, NOT CORRECTED. The causa-de-la-representacion fields at @480 and @956 are \
labelled \"[330 332]\" and \"[380 382]\" -- two box numbers in one bracket -- and the \
derived-casilla regex matches a single number, so none of 330, 332, 380 or 382 is in the \
derived set. Verified by enumerating that set. Both fields take slugs rather than claim a \
box the coverage report cannot see. Separately, the field at @480 is described \"3.2.\" \
while sitting inside block 3.1, whose neighbours read \"3.1.\"; the offsets are \
unambiguous so this file follows the offsets. NOT CLAIMED -- 229 OF 288 DERIVED CASILLAS \
REMAIN UNCOVERED across eleven records, and they are not 229 units of transcription. Pag. \
6 prints 613 and 614 on twelve positions each and Pag. 8 prints 805 on twelve, so those \
need the slug convention at scale; Pag. 0, 2A and 2C carry NO box numbers at all and are \
repeating or structural records rather than flat casilla sets. NOT CLAIMED -- NO CONSTRUCT \
MEMBERSHIP CHANGE, deliberately: this modelo's construct is a censo-foundation construct \
listing only profile-bound facts, and every transcribed form box sits outside it. NOT \
CLAIMED -- NO EXPORT LAYOUT: the application still cannot file this modelo, it stays on \
the filing-capability worklist, and model_law_authority_scope remains inspection_only. NOT \
CLAIMED -- independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- all 71 \
labels are populated and non-null across es/en/ca/hu, verified by counting VALUES rather \
than keys; the strings were not audited for accuracy."""
