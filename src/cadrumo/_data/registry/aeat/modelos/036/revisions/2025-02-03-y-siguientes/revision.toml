review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the censal alta/modificacion/baja declaration. \
DISCLOSURE -- self-review: the same agent authored the casillas being reviewed. VERIFIED \
-- PAGINA 5 IS AUTHORED, 68 casillas over its 115 design fields, 54 carrying an AEAT \
number and 14 slugs. Revision total 459 casillas. Pag. 5 is the IVA record: obligaciones, \
comunicacion de inicio de actividad, regimenes, registros, prorrata y sectores \
diferenciados, ingreso del IVA a la importacion, llevanza de libros y facturacion por \
terceros. Every offset, length and number was cross-checked back against the design row it \
came from -- zero missing, zero invented, zero length mismatches -- and every one of the \
115 fields is authored, a collapsed date component, or explicitly excluded with a stated \
reason, so nothing is unaccounted for. Pag. 5 tiles 1..380 exactly once with NO gap and NO \
PARTIAL OVERLAP, both checked. A SIXTH BRACKET FORM WAS FOUND, AND IT VINDICATES THE \
CAVEAT THE PREVIOUS STAMP CARRIED. That stamp said the 667 denominator was what a pattern \
admitting five bracket forms finds, and that nothing established a sixth did not exist. \
One does. @273+1 prints its numbers as a PARENTHESISED list, \"(532,737)\", where every \
other multi-number field on this modelo uses a SQUARE-bracketed one; none of the five \
earlier patterns could see it, so 532 and 737 were absent from every count taken. THE \
DENOMINATOR IS NOW 669. Five denominators have now been reported for this modelo -- 288, \
348, 659, 667, 669 -- and each correction came from widening the pattern rather than from \
reading the design differently. Two numbers is trivial in magnitude; the pattern is not, \
and the caveat stands unchanged for a seventh form. VERIFIED -- COVERAGE, AND IT IS \
REPORTED IN THREE PARTS BECAUSE A SINGLE \"REMAINING\" FIGURE WOULD OVERSTATE THE GAP. 376 \
of 669 numbers are DIRECTLY MODELLED, each on its own casilla. A further 57 sit BEHIND A \
SLUG CASILLA -- 55 on Pag. 5 and B1/B2 on Pag. 2B -- where the FIELD is modelled but the \
number is not individually addressable, because AEAT prints several numbers on one byte. \
Only 236 boxes have NO CASILLA AT ALL. Reporting \"293 remaining\" would conflate a \
modelled field with an unmodelled one. VERIFIED -- LIST BRACKETS TAKE SLUGS, and Pag. 5 \
carries more than any other record: 19 fields hold a bracket listing several numbers, 53 \
numbers between them. The regimenes de agricultura, simplificado and criterio de caja each \
print FIVE numbers on ONE byte, because the printed form has five tick boxes -- alta, \
baja, renuncia, revocacion, inclusion -- that the fichero collapses into a single \
selecting code byte. No single number describes such a field. Those numbers are \
deliberately NOT modelled individually and the fragment says so, so that a later reader \
does not split one byte into five casillas. The tell is field width against number count. \
VERIFIED -- TWENTY-ONE DATE TRIPLES on this record collapse to one date casilla each, \
three of them under a list bracket, matching the convention used across this modelo's \
other records. NOT CLAIMED -- 236 BOXES HAVE NO CASILLA AT ALL, exactly: Pag. 4 88, Pag. 6 \
52, Pag. 7 42, Pag. 10 24, Pag. 8 16, and 14 still open on Pag. 3. Pag. 0 is the envelope \
and has none. Authored so far: Pag. 1, 2A, 2B, 2C, 5, 9 and most of 3. NOT CLAIMED -- THE \
CAUSA FRAGMENT'S LABELS on Pag. 3 remain underivable from any bundled source; its cited \
instructions file is a 5.4 KB navigation shell with no casilla table. Numbers and section \
mapping ARE grounded on the diseno. NOT CLAIMED -- NO EXPORT LAYOUT AND NO CONSTRUCT \
MEMBERSHIP CHANGE. model_law_authority_scope remains inspection_only, so this stamp is \
made under the LOWER inspection bar and MUST be re-made if a layout lands and lifts the \
derived scope to filing. NOT CLAIMED -- the IVA casillas here record REGIME ELECTIONS on a \
censal declaration; nothing on this record computes or reports an IVA amount, and none of \
it supports a liquidacion. NOT CLAIMED -- LABELS ARE UNACCENTED ASCII across all four \
catalogues, matching the pre-existing modelo 036 labels; a known presentation limitation. \
All 459 label keys carry non-null values in es/en/ca/hu, verified by counting VALUES \
rather than keys; the translations were not audited by a second party. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-22

[revisions."2025-02-03-y-siguientes".family_dispositions.deadline_windows]
reason = """\
The censal declaration has no calendar plazo: its period_selector declares the EVENT kinds \
alta, modificacion and baja rather than calendar periods, and RD 1065/2007 anchors each to \
its triggering event. Article 11.2 states this verbatim in the bundled corpus for the \
baja: la declaracion de baja debera presentarse en el plazo de un mes desde que se cumplan \
las condiciones previstas en el apartado 1 de este articulo. The bundled excerpts of \
articles 9 and 10 carry the substance of what alta and modificacion must declare but NOT \
their timing sentences, so the alta and modificacion periods are cited by article rather \
than reproduced and are not corpus-proven here. No recurring window exists for any of the \
three and none is fabricated."""
