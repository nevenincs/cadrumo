review_status = "agent_reviewed"
reviewed_by = """\
agent: applicability-grade review of the censal alta/modificacion/baja declaration. \
DISCLOSURE -- self-review: the same agent authored the casillas being reviewed. VERIFIED \
-- PAGINA 2C IS AUTHORED, 73 casillas covering all 57 box numbers it prints, plus 16 slugs \
for fields carrying no printed number. Revision total 272 casillas. Pag. 2C is the \
establecimiento permanente record of a non-resident legal person or entity. Every offset, \
length and number was cross-checked back against the design row it came from: 57 design \
numbers, 57 authored, ZERO missing, ZERO invented, ZERO length mismatches. Pag. 2C tiles \
1..1400 exactly once with no gap and no overlap, checked for partial overlap and not \
merely for gaps. THIS COMPLETES A RETRACTION MADE IN TWO EARLIER STAMPS. Those stamps \
claimed \"Pag. 0, 2A and 2C carry no box numbers at all, being repeating or structural \
records\". That was true of Pag. 0 alone. Pag. 2A was corrected first, 86 boxes; Pag. 2C \
is corrected here, 57 boxes. Both read as zero for the same reason: every number on either \
record is LETTERED, [A4] and [C1] rather than [104], and the derived-casilla regex matches \
digits only. Authoring both records therefore moved the derived coverage report by EXACTLY \
ZERO, which is the honest signal rather than a defect -- a derived zero is evidence the \
deriver recognised nothing, not evidence of absence. VERIFIED -- COVERAGE 226 of 667 real \
boxes, 34 percent, up from 169. Against the digits-only derived set the figure is \
unchanged at 65 of 288. The 667 denominator carries the caveat recorded in the previous \
stamp and it still stands: it is what a pattern admitting five bracket forms finds, and \
nothing establishes a sixth form does not exist. Four denominators have now been reported \
for this modelo -- 288, 348, 659, 667 -- and every one was a floor presented as a total. \
VERIFIED -- C70 and C71 are each printed on a dia, mes and ano triple; each becomes ONE \
date casilla, matching A10 and A3B on Pag. 2A and the sucesor blocks on Pag. 9. Six \
integers would misrepresent two printed boxes. VERIFIED -- C68 AND C69 NAME THE WRONG \
ENTITY IN AEAT'S OWN TEXT: both descriptions open \"Persona Fisica.\" while sitting inside \
the establecimiento permanente record and numbered in its C series. Read as a copy-paste \
artefact in the published spreadsheet, recorded in the fragment, and NOT propagated into \
the labels, which describe the record the fields actually belong to. This is a judgement \
about AEAT's text, not a transcription, and is flagged as such. VERIFIED -- THE SIXTEEN \
SLUG NUMBERS ARE PREFIXED \"ep-\" because Pag. 2A's persona fisica record carries fields \
of the same name and (segmento, number) uniqueness is enforced revision-wide. The \
collision was surfaced by the loader refusing the first attempt, not anticipated. STATUS \
CHANGE WORTH RECORDING -- the filing-capability worklist now reports this revision as \
AUTHORABLE on era, citing aeat-dr-036-2025 with 272 casillas declared, where it previously \
lacked the casilla set entirely. What it now needs is a SEMANTIC MAP AND EXPORT LAYOUT, \
not more casillas. NOT CLAIMED -- 441 OF THE 667 REAL BOXES REMAIN UNMODELLED, and the \
remainder is now exactly known per record: Pag. 5 107, Pag. 2B 98, Pag. 4 88, Pag. 6 52, \
Pag. 7 42, Pag. 10 24, Pag. 8 16, and 14 still open on Pag. 3. Pag. 0 has none and is \
genuinely the envelope. Pag. 1, 2A, 2C, 9 and most of 3 are the authored records. NOT \
CLAIMED -- C31 to C38, C56 to C58 and C65 to C67 are absent from the Pag. 2C design and \
were NOT invented; likewise A57, A58, A65 to A67, A86 to A89, A93, A95 and A97 on Pag. 2A. \
NOT CLAIMED -- THE CAUSA FRAGMENT'S LABELS on Pag. 3 remain underivable from any bundled \
source; its cited instructions file is a 5.4 KB navigation shell with no casilla table. \
Numbers and section mapping ARE grounded on the diseno. NOT CLAIMED -- NO EXPORT LAYOUT \
AND NO CONSTRUCT MEMBERSHIP CHANGE: the application still cannot file this modelo and \
model_law_authority_scope remains inspection_only, so this stamp is made under the LOWER \
inspection bar and must be re-made if a layout ever lands and lifts the derived scope to \
filing. NOT CLAIMED -- LABELS ARE UNACCENTED ASCII across all four catalogues, matching \
the pre-existing modelo 036 labels rather than leaving the revision in a mixed-accenting \
state; a known presentation limitation, not a claim of typographic correctness. All 272 \
label keys carry non-null values in es/en/ca/hu, verified by counting VALUES rather than \
keys; the strings were not audited for translation accuracy. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-08-22

[revisions."2025-02-03-y-siguientes".family_dispositions.deadline_windows]
reason = """\
The censal declaration has no calendar plazo: its period_selector declares the EVENT kinds \
alta, modificacion and baja rather than calendar periods, and RD 1065/2007 anchors each to \
its triggering event. Article 11.2 states this verbatim in the bundled corpus for the \
baja: la declaracion de baja debera presentarse en el plazo de un mes desde que se cumplan \
las condiciones previstas en el apartado 1 de este articulo. The bundled excerpts of \
articles 9 and 10 carry the substance of what alta and modificacion must declare but NOT \
their timing sentences, so the alta and modificacion periods are cited by article rather \
than reproduced and are not corpus-proven here. No recurring window exists for any of the \
three and none is fabricated."""
legal_refs = [
    "rd-1065-2007:art-9",
    "rd-1065-2007:art-10",
    "rd-1065-2007:art-11",
]
source_refs = [
