CLAIMED -- A PROVENANCE GAP ON THE SIBLING FRAGMENT, recorded rather than repeated. The \
causa-110..150 fragment states its numbers and labels are transcribed verbatim from the \
AEAT Instrucciones Modelo 036, Anexo 3, PAGINA 1, table columns TIPO / CASILLA / CAUSA DE \
