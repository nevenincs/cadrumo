reviewed_by = """\
agent: applicability-grade review of the censal alta/modificacion/baja declaration, \
re-stamped after authoring PAGINA 9. DISCLOSURE -- self-review: the same agent authored \
the sixty-four new casillas across three units and re-grounded the pre-existing causa \
fragment. CORRECTION TO THE PREVIOUS STAMPS ON THIS REVISION -- THE DENOMINATOR THEY CITED \
IS A FLOOR. Earlier stamps reported coverage \"of 288 derived casillas\". The diseno \
actually prints 348 distinct box numbers. Sixty are invisible to the derived-casilla \
regex, which matches [NNN] only: 58 carry a MALFORMED bracket (a closing bracket with no \
opening one, \"921]\") and 4 sit inside multi-number brackets. Every \"of 288\" figure on \
this revision, including mine, is measured against a floor and the error flatters \
progress. Scoped by measurement rather than left as a worry: the same scan against \
aeat-dr-840 and aeat-dr-220-2024 shows ZERO undercount on both, so this defect belongs to \
the modelo 036 diseno alone -- the same corpus entry whose instructions capture also \
dropped its table. VERIFIED -- COVERAGE 29 -> 65 of the 288 regex-visible numbers, 95 \
casillas in total. PAGINAS 1, 3 and 9 are complete. VERIFIED -- TILING before any offset \
was trusted: Pag. 1 tiles 1..500, Pag. 3 tiles 1..1200 and Pag. 9 tiles 1..1300, each \
exactly once, no gap, no overlap. All thirteen records tile clean and pass the \
partial-overlap check test_cited_design_field_bounds_are_self_consistent -- a gap-only \
check would not suffice, since partial overlap leaves no holes. VERIFIED -- PAGINA 9's \
NUMBERS 921 TO 943 ARE READ, NOT MINTED. AEAT prints a well-formed [920] on each sucesor \
block's NIF and then 921], 922], 923] on the three fields following. The run is \
contiguous, four per block, in offset order, verified across all six blocks 13a to 13f. \
Those eighteen casillas carry AEAT's real numbers, and they move coverage by ZERO because \
the derived set cannot see them -- which is the honest signal, not an authoring defect. \
VERIFIED -- THE OPPOSITE CASE, and it is easy to get backwards. PAGINA 3's causa flags are \
ONE BYTE each and carry bracket LISTS: [300,301,302], [311,312], [330 332]. The printed \
form has three separate tick boxes and the fichero collapses them into a single code byte \
that SELECTS among them, so no single number describes the field and each takes a slug. \
The tell is field width against number count: one byte holding three numbers is a \
selector; a 125-byte name field holding one number is a box with a broken bracket. \
VERIFIED -- SIX DATES are each ONE casilla rather than eighteen integers: 141, 152, 303, \
313, 353 and 363 are each split by the diseno into dia, mes and ano components. VERIFIED \
-- TYPES on PAGINA 9 are grounded, not inferred: the diseno states \"(3 ent + 2 decim.)\" \
and \"(12 ent + 2 decim.)\" explicitly, so the porcentaje is decimal and the cuota is \
money. NOT CLAIMED -- THE CAUSA FRAGMENT'S LABELS remain underivable from any bundled \
source. Its cited instructions file is a 5.4 KB navigation shell with no casilla table; \
the numbers and the alta/modificacion/baja section mapping ARE re-grounded on the diseno, \
whose descriptions open \"Alta.\", \"Modificacion.\" or \"Baja.\". One label was corrected \
on diseno evidence (137 had dropped \"y registros\"); four divergences are recorded \
unchanged and need the real Anexo 3 table to adjudicate. NOT CLAIMED -- 223 OF THE 288 \
REGEX-VISIBLE NUMBERS REMAIN UNCOVERED, and more than that against the true 348. They are \
not that many units of transcription: Pag. 4 alone is 87 numbers, Pag. 6 prints 613 and \
614 on twelve positions each, Pag. 8 prints 805 on twelve, and Pag. 0, 2A and 2C carry no \
box numbers at all, being repeating or structural records. NOT CLAIMED -- NO CONSTRUCT \
MEMBERSHIP CHANGE, deliberately: this modelo's construct is a censo-foundation construct \
listing only profile-bound facts. NOT CLAIMED -- NO EXPORT LAYOUT: the application still \
cannot file this modelo, it stays on the filing-capability worklist, and \
model_law_authority_scope remains inspection_only. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero. NOT CLAIMED -- all 95 labels are \
populated and non-null across es/en/ca/hu, verified by counting VALUES rather than keys; \
the strings were not audited for accuracy."""
