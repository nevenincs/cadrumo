fields = { additional_source_refs = ["aeat-dr-036-2025"], continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM UNDER ITS OLD LABEL, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this date triple at Pag. 2B @1946+2 dia, @1948+2 mes and @1950+4 ano under number [B3A]: Pers.jcas. o entidades. Identificacion. Fecha de efectos residencia fiscal. The successor final design prints the identical triple at the identical offsets under [B3B]. The move is a RENUMBERING and not a replacement, proven from the corpus: the PROVISIONAL 2025 design (02-036-...-provisional) still prints [B3A] at @1946/@1948/@1950 with the same 2/2/4 lengths, the same Num type and byte-identical captions. The predecessor edition 2023-hasta-2025-02-02 nonetheless writes no casilla for it, so this absence is a corpus declaration gap, not a change to the form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb.xlsx.extracted.md (sha256 44f36e521804).", continuidad_origin = "predecessor_edition_silent", legal_refs = ["rd-1065-2007:art-11", "orden-eha-1274-2007:art-1", "orden-hac-1526-2024:art-1"], number = "B3B" }
