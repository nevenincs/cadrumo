fields = { additional_source_refs = ["aeat-dr-036-2025"], continuidad_evidence = "PRINTED ON THE PREDECESSOR FORM, NOT DECLARED BY THE PREDECESSOR EDITION. The predecessor design prints this field at Pag. 9 @1035+125 (line 1028 of the extract): 13f Relacion de sucesores. Sucesor o beneficiario. Apellidos y nombre, razo. The successor design prints the same field at the same page and byte position: 13f Relacion de sucesores. Sucesor o ben. The number is printed with a broken opening bracket in the predecessor extract (921] rather than [921]), which is why the predecessor edition number reader did not pick it up; the printed field itself is unchanged between the two designs. The predecessor edition 2023-hasta-2025-02-02 emits no casilla for it, so this absence is a gap in the corpus declaration and not a change to the official form. Sources: disenos_registro/modelo_036/files/03-036-...-ejercicio-2023-y-siguientes-107-kb-xlsx.xlsx.extracted.md (sha256 6c0660f7850f) and disenos_registro/modelo_036/files/01-036-...-03-02-2025-y-siguientes-124-kb-xlsx.xlsx.extracted.md (sha256 44f36e521804).", continuidad_origin = "predecessor_edition_silent", legal_refs = ["rd-1065-2007:art-11", "orden-eha-1274-2007:art-1", "orden-hac-1526-2024:art-1"] }
removed_fields = []
restate_provenance = true

