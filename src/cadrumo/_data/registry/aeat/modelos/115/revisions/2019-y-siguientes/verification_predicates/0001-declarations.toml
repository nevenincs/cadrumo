# Under-declaration advisory (no-silent-under-declaration). casilla 01 is the
# NUMBER OF PERCEPTORES the retenedor paid urban rent to in the period and
# casilla 02 is the BASE de retenciones those payments make up. Both are
# input_kind = "bound": they are aggregated from the ledger rather than typed by
# the operator, and a draft declaring perceptores while resolving a zero base is
# the shape this family exists to surface -- rent was paid to somebody, and the
# amount withheld on it went unreported.
#
# 01 and 02 are independently bound from the ledger, so their disagreement is a
# real observation about the filing.
#
# ADVISORY, not BLOCKING. implies_nonzero holds trivially when the antecedent is
# at or below zero, so a retenedor with no perceptores in the period never fires
# it -- 115 is filed quarterly even for a quarter with no arrendamiento activity.
# It stays advisory rather than blocking because the operator, not this
# application, files: an alert the operator can weigh is the safeguard here, and
# a blocking rule on a bound-value disagreement would refuse drafts whose ledger
# is merely incomplete at the moment of calculation.
[[revisions."2019-y-siguientes".verification_predicates]]
id = "implies-nonzero:base-retenciones-declarada-cuando-perceptores-positivos"
predicate_id = "modelo-115-base-retenciones-declarada-cuando-perceptores-positivos"
expression = 'implies_nonzero(["01", "02"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "ley-35-2006:art-101"]

# Casilla 02 and casilla 03 are bound separately, so a base with nothing withheld
# on it is an observation about the filing rather than the engine's arithmetic.
[[revisions."2019-y-siguientes".verification_predicates]]
id = "implies-nonzero:retenciones-declaradas-cuando-base-positiva"
predicate_id = "modelo-115-retenciones-declaradas-cuando-base-positiva"
expression = 'implies_nonzero(["02", "03"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "ley-35-2006:art-101"]
