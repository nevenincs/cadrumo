[[revisions."2019-y-siguientes".applicability]]
id = "m115-seed"
applicable_entity_types = ["attribution_entity", "legal_entity", "natural_person"]
required_payer_fact = "pays_rent_with_retencion"
applicable_reason = "Modelo 115 (retenciones por arrendamiento de inmuebles urbanos): el contribuyente paga alquiler de inmueble urbano sujeto a retención y autoliquida las retenciones practicadas."
not_applicable_reason = "Modelo 115 no aplica: la autoliquidación de retenciones por arrendamiento solo corresponde a quien paga alquileres sujetos a retención."
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "rd-439-2007:art-108"]

# RIRPF art. 76.1: "Con carácter general, estarán obligados a retener o ingresar a cuenta, en
# cuanto satisfagan rentas sometidas a esta obligación: ... b) Los contribuyentes que ejerzan
# actividades económicas, cuando satisfagan rentas en el ejercicio de sus actividades." A natural
# person is a retenedor only through letter b); one that declares no actividad económica income is
# not, whatever it pays.
[[revisions."2019-y-siguientes".applicability.exclusions]]
id = "m115-sin-actividad"
entity_types = ["natural_person"]
lacking_income_categories = ["actividad_economica"]
reason = "Modelo 115 no aplica: la persona física solo está obligada a retener o ingresar a cuenta cuando ejerce actividades económicas y satisface rentas en el ejercicio de sus actividades (artículo 76.1.b del Reglamento del IRPF), y el perfil no declara una actividad económica, de modo que no actúa como retenedor de los alquileres de inmuebles urbanos que satisface."
legal_refs = ["rd-439-2007:art-76"]
