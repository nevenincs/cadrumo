# Under-declaration advisory. 'decl.total-perceptores' is the COUNT of type-2
# records, bound from this application's own withholding store, while
# 'decl.base-total' is the MONEY total this revision's formula sums from the same
# records. The two reach the resumen by different routes, so a positive count
# against a zero base is a real disagreement rather than an arithmetic identity.
#
# ADVISORY, not BLOCKING: implies_nonzero holds trivially when the antecedent is
# at or below zero, so a retenedor with no perceptores never fires it.

