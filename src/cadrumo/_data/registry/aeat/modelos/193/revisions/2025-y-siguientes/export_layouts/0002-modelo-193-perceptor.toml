# The two Tipo-2 sub-shapes share every leading literal, so the record-type
# marker cannot tell them apart. AEAT separates them by what occupies the
# tail: the gastos sheet declares 208-500 as one BLANCOS run, while the
# perceptor sheet carries NATURALEZA DEL DECLARANTE, the prestamo fechas,
# COMPENSACIONES and GARANTIAS across it.
