# RET-1: distinct perceptor-NIF count from the dedicated per-perceptor retención
# store (aggregate_retenciones_193.total_perceptors), not the sum of quarterly
# Modelo 123 counts (which double-counts a perceptor paid in more than one quarter).
# -----------------------------------------------------------------------------
# Per-perceptor tipo-2 row-producer bindings (Orden EHA/3377/2011 Anexo II
# diseno de registro tipo 2 — capital mobiliario perceptors).
# -----------------------------------------------------------------------------
# Design positions 175-189: the sum of the perceptor-record 169-181 retentions for clave C rows and the A/B/D rows with pago 1 or 3, per the design's own declaration.
# Design 27-35: the minor perceptor's legal representative NIF; spaces elsewhere.
# Design 76: 'X' when the perceptor is itself a mediator entity (claves A/B/D).
# Design 77-78 codigo provincia.
# Design 79 clave codigo (1-4), always recorded for claves A/B/D.
# Design 80-91 codigo emisor.
# Design 93-94 naturaleza subclave, always recorded.
# Design 95 pago (1-5), always recorded for claves A/B/D.
# Design 96 tipo codigo (C/O/P), always recorded for claves A/B/D.
# Design 97-116 codigo cuenta valores / numero operacion prestamo.
# Design 117 pendiente 'X' flag.
# Design 118-121 ejercicio devengo for prior-year payments; zeros otherwise.
# Design 122 tipo de percepcion (1/2), always recorded.
# Design 139-151 importe reducciones (art. 26.2).
# Design 152-164 base retenciones e ingresos a cuenta.
# Design 165-168 porcentaje de retencion.
# Design 182-192 penalizaciones (claves B/D only).
# Design 208 naturaleza del declarante perceptor-row 'S'/blank.
# Design 209-216 fecha inicio del prestamo (tipo codigo P only).
# Design 217-224 fecha vencimiento del prestamo (tipo codigo P only).
# Design 225-236 compensaciones (tipo codigo P only).
# Design 237-248 garantias (tipo codigo P only).
# Design 249-261 foral Hacienda Estatal split.
# Design 262-274 foral Navarra split.
# Design 275-287 foral Araba/Alava split.
# Design 288-300 foral Gipuzkoa split.
# Design 301-313 foral Bizkaia split.
# Design 314 Ceuta/Melilla-La Palma clave.
# Design 315-321 numero de orden, derived from the row order.
# Design 322-330 NIF del pagador anterior.
# Design 331-338 fecha de devengo (clave A only).
# Design 339 clave de mercado, always recorded for claves A/B/D.
# The gastos-relationship contribuyente's NIF.
# Apellidos y nombre del contribuyente.
# The minor contribuyente's legal representative NIF.
# Design positions 195-207: the annual gastos de administracion y deposito.

