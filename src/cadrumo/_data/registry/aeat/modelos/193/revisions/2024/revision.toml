[revisions."2024".family_dispositions.parameters]
reason = """
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. Modelo 193 applies none: both of its formulas are op = 'copy', carrying the annual modelo 123 base and retenciones relations into the resumen casillas, and a copy applies nothing to what it copies. The retention rates reaching these figures were set by the retenedor at payment time under RD 439/2007 art. 90 and consumed by the quarterly modelo 123; this annual resumen receives the \
already-withheld amounts. Empty by the shape of this modelo's calculation rather than by omission."""
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1", "rd-439-2007:art-90"]
source_refs = ["aeat-modelo-193-procedure"]

[revisions."2024".family_dispositions.projection_endpoints]
reason = "A projection endpoint admits one typed filing endpoint that an export record REPEATS. Modelo 193's record design declares three fixed records -- declarante, perceptor and the gastos relationship, none of which repeats a projection -- and no field of kind 'projection' exists in any authored surface. The family has no repeated endpoint to admit and nothing an entry here could name; authoring a repeated projection row into the layout is what would make this family apply."
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1"]
source_refs = ["aeat-dr-193-2024", "aeat-dr-193-2024"]

