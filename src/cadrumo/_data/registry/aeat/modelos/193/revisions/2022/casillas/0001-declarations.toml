# Modelo 193 Tipo 1 (registro de declarante) resumen casillas: the
# declaration identity block and the resumen totals. This revision declares no
# bindings or formulas, so every total here is operator-supplied rather than
# row-derived.
# Design positions 59-67: the contact person's nine-digit telephone.
# Design positions 68-107: the contact person's apellidos y nombre.
# Design positions 108-120: the declaration's identifying number, a sequence whose first three digits are 193.
# Design position 121: 'C' for a complementary declaration including omitted percepciones.
# Design position 122: 'S' for a substitute declaration annulling one prior declaration.
# Design positions 123-135: the prior declaration's identifying number for a C/S declaration; the design's own ceros in every other case.
# Design positions 175-189: the sum of the perceptor-record retenciones e ingresos a cuenta for rows whose clave de percepcion is C, plus the A/B/D rows whose pago is 1 or 3, per the design's own declaration.
# Design positions 220-234: the sum of the gastos-relationship rows' importe de gastos.
# Design position 235: 'S' when the declarante is outside the design's four categories; blank otherwise.
# Modelo 193 Tipo 2 (relacion de gastos) detail-row casillas.
# The gastos-relationship contribuyente's NIF.
# Apellidos y nombre del contribuyente.
# The minor contribuyente's legal representative NIF.
# Design positions 195-207: the annual gastos de administracion y deposito.
# Modelo 193 Tipo 2 (registro de perceptor) detail-row casillas: one slot per
# row field, mirroring the modelo 190 contract. This epoch's perceptor record
# ENDS at position 248 -- its diseño states "249-500 -------- BLANCOS." -- so
# the foral retention split (249-313), the Ceuta/Melilla clave (314) and the
# 2024 additions at 315-339 have no position here. This revision declares no
# export layout; `number` records the design's coordinates only.
# The perceptor's NIF, right-justified with the control character last.
# The minor perceptor's legal representative NIF; the design's own spaces elsewhere.
# Apellidos y nombre o razon social del perceptor.
# Design position 76: 'X' when the perceptor is itself a mediator entity paying by proxy (claves A/B/D).
# Design positions 77-78: the perceptor's domicilio province code.
# Design position 79: what the codigo emisor/ISIN carry; clave 4 the general case.
# Design positions 80-91: the issuer's NIF (clave codigo 1/4), empty (2), ZXX country code (3).
# The clave de percepcion A-D of the capital-mobiliario rendimiento.
# Design positions 93-94: the two-digit naturaleza subclave of the clave de percepcion.
# Design position 95: who paid (1 emisor, 2/3/4 mediador, 5 other mediation).
# Design position 96: what the codigo cuenta field holds (C/O/P).
# Design positions 97-116: the codigo cuenta valores or numero de operacion del prestamo.
# Design position 117: 'X' for percepciones devengadas but not yet paid.
# Design positions 118-121: the devengo exercise for prior-year payments claimed this year.
# Design position 122: 1 dinerarias, 2 en especie.
# Design positions 123-135: the contraprestacion integra exigible o satisfecha.
# Design positions 139-151: the art. 26.2 reductions applied for IRPF contribuyente perceptores.
# Design positions 152-164: the base de la retencion o ingreso a cuenta.
# Design positions 165-168: the retention percentage applied (generally 19, with the design's per-clave rates).
# Design positions 169-181: the retenciones e ingresos a cuenta amount.
# Design positions 182-192: the negative capital-mobiliario rendimientos from commercial-promotion breaches (claves B/D).
# Design position 208: 'S' when the declarante is outside the design's categories; its cascade then zeroes the identification block.
# Design positions 209-216 (AAAAMMDD), only for prestamo de valores (tipo codigo P).
# Design positions 217-224 (AAAAMMDD), only for prestamo de valores.
# Design positions 225-236, only for prestamo de valores.
# Design positions 237-248, only for prestamo de valores.

