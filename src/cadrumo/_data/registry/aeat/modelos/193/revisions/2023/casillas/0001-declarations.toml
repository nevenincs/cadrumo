# Modelo 193 Tipo 2 (registro de perceptor) detail-row casillas: one slot per
# row field, mirroring the modelo 190 contract. This design ADDS the foral
# retention split (249-313) and the Ceuta/Melilla clave (314) over the 2019
# edition, and the record ENDS at position 314 -- its diseño states
# "315-500 -------- BLANCOS." -- so the 2024 additions at 315-339 have no
# position here. This revision declares no export layout; `number` records the
# design's coordinates only.

