# Row and resumen bindings for the modelo 193 ejercicio-2023 fichero BOE.
#
# One binding per type-2 perceptor row field and per Relacion de Gastos row
# field the export layout emits, plus the three declarante resumen values the
# aeat-dr-193-2023 design defines as sums over those records. Geometry is grounded on
# that design and the filing route on the AEAT modelo 193 procedure, which
# applies from 2020-01-01 and so covers this exercise.
#
# The modelo 123 relation prefills the 2024 edition routes its resumen through
# are deliberately NOT here: they are grounded by aeat-modelo-193-296-note-2025,
# which opens in 2024 and cannot be cited by this exercise. This edition totals
# its own records instead, which is what the design's Contenido text states for
# positions 145-159, 160-174 and 175-189.

