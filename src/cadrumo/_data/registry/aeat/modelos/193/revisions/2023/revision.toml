# Filing-grade historical epoch for modelo 193, filing year 2023.
#
# The gap this closes was authoring debt, not a legal absence: modelo 193 was
# approved by Orden EHA/3377/2011 and filed for 2023, and the record design
# governing that exercise is bundled and hash-pinned as aeat-dr-193-2023,
# whose own applicability window is exactly this exercise.
#
# What this revision establishes, by measurement against that bundled design:
#   - the complete Tipo 1, Tipo 2 and gastos casilla set with the design's own
#     positions, transcribed field by field;
#   - that this design ADDS the foral retention split (249-313) and the
#     Ceuta/Melilla clave (314) over the 2019 edition that governs 2022;
#   - that this epoch's perceptor record ENDS at position 314. The design
#     states "315-500 -------- BLANCOS.", so the numero de orden, NIF del
#     pagador anterior, fecha de devengo and clave de mercado that the 2024
#     edition carries at 315-339 are absent here rather than omitted;
#   - and that every legal_ref it cites is in force across the whole exercise.
#
# WHAT THE FILING GRADE CLAIMS HERE, and what it does not. The grade asserts
# that this revision can back a filing draft and its export for ejercicio 2023:
# the fichero BOE layout is transcribed position by position from
# aeat-dr-193-2023, and the row bindings that fill its type-2 and gastos records are
# grounded on that design for geometry and on aeat-modelo-193-procedure for the
# filing route. That procedure applies from 2020-01-01, so it covers the whole
# exercise.
#
# It does NOT claim the 2024-grounded calculation route. The modelo 123 relation
# prefills the 2024 sibling totals its resumen through are grounded in the
# corpus only by aeat-modelo-193-296-note-2025, which opens on 2024-01-01 and
# cannot be cited by a 2023 revision. This edition instead totals its own
# type-2 records, which is what the design's own Contenido text states for
# positions 136-144, 145-159 and 160-174, so the whole calculation closes inside
# this exercise's authority. The gastos total at 220-234 stays
# operator-supplied, exactly as the filing-grade 2024 sibling leaves it.
review_status = "agent_reviewed"
reviewed_by = "agent: authored from the bundled hash-pinned aeat-dr-193-2023 record design. Casilla positions were verified row by row against the design's own position table and against the 2024 revision, the export layout was derived from the same design record by record, and the additive deltas separating the epochs were confirmed in the design text. No human operator has countersigned it."
reviewed_at = 2026-09-25
authority_grade = "filing"
id = "2023"
valid_from = 2023-01-01
valid_to = 2023-12-31
