[revisions."2023".family_dispositions.dependency_classifications]
reason = """
A dependency classification records how another modelo's declarations reach this one. This edition's declarante resumen takes none: its totals are the sums the record design itself states over this declaration's own type-2 perceptor records, so the whole calculation closes inside the edition. The 2024 sibling classifies a modelo 123 dependency because it routes the same totals through annual relation prefills grounded on a 2024 nota informativa, and that opens after this exercise ends. Empty because no cross-modelo edge exists here, not because one is unbuilt."""
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-193-2023", "aeat-modelo-193-procedure"]

[revisions."2023".family_dispositions.extraction_profiles]
reason = """
An extraction profile reads values back out of a filed declaration PDF, and its label patterns must be authored against a specimen of the printed layout for the edition they claim. The corpus holds no modelo 193 justificante for this exercise. Authoring patterns for this edition from a later specimen would claim a reading capability against a layout nobody checked, so the family is declared empty rather than filled with unevidenced patterns."""
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-193-2023", "aeat-modelo-193-procedure"]

[revisions."2023".family_dispositions.parameters]
reason = """
A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. This edition applies none: both of its formulas are op = 'copy', carrying the per-record sums into the resumen casillas, and a copy applies nothing to what it copies. The retention rates that produced those amounts were set by the retenedor at payment time under RD 439/2007 art. 90 and are already recorded on each perceptor record. Empty by the shape of this modelo's calculation rather than by omission."""
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-193-2023", "aeat-modelo-193-procedure"]

[revisions."2023".family_dispositions.projection_endpoints]
reason = """
A projection endpoint admits one typed filing endpoint that an export record REPEATS. This revision's export layout (modelo-193-fichero-boe) declares no record with repeat = 'projection_rows' and no field of kind 'projection', so there is no repeated endpoint for the family to admit and nothing an entry here could name. Empty by construction: authoring a projection row into the layout is what would make this family apply."""
legal_refs = ["ley-35-2006:art-25", "orden-eha-3377-2011:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101", "ley-58-2003:art-93"]
