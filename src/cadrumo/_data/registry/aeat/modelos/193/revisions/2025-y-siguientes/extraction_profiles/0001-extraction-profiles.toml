# Patterns grounded against AEAT-published Orden HAC/56/2024 Diseño de Registro
# Modelo 193, Tipo de registro 1 (Registro de Declarante), positions 136-144,
# 145-159, and 160-174:
#   136-144: "NÚMERO TOTAL DE PERCEPTORES"
#   145-159: "BASE RETENCIONES E INGRESOS A CUENTA"
#   160-174: "RETENCIONES E INGRESOS A CUENTA"
# Source: src/cadrumo/_data/corpus/aeat_official/disenos_registro/modelo_193/files/
#   03-193-orden-hac-56-2024-ejercicios-2024-y-siguientes-556-kb-pdf.pdf pages 5-6.
# The '\s+total' suffix in the base and retenciones patterns is a fixture-level
# disambiguation convention (identical to M180 declaracion_pdf profile): the
# synthetic fixture appends " total" to the summary-row label so the named_label
# parser can distinguish the declarante-level aggregate from per-perceptor rows.
# The AEAT DR field names themselves do not carry "total"; the suffix lives only
# in the fixture rendering. Confirmed grounded.
[[revisions."2025-y-siguientes".extraction_profiles]]
id = "modelo-193-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.total-perceptores", match_strategy = "named_label", value_kind = "amount", label_pattern = 'N[uú]mero\s+total\s+de\s+perceptores'},
    {casilla_id = "decl.base-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Base\s+retenciones\s+e\s+ingresos\s+a\s+cuenta\s+total'},
    {casilla_id = "decl.retenciones-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Retenciones\s+e\s+ingresos\s+a\s+cuenta\s+total'},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["ley-35-2006:art-25", "ley-35-2006:art-99", "orden-eha-3377-2011:art-1", "rd-439-2007:art-108", "rd-439-2007:art-90", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-193-2025", "boe-modelo-193-2011-form"]
