[revisions."2003-y-siguientes"]
authority_grade = "applicability"
# Modelo 848 comunicación del importe neto de la cifra de negocios (INCN) a
# efectos del IAE, approved by orden-hac-85-2003 art 1 with its plazo grounded
# verbatim in orden-hac-85-2003 art 3. Scheduling/applicability-grade:
# declaration-header casillas only; no bundled diseño de registro, so no numbered
# form casilla is fabricated. The IAE autoliquidación (modelo 840) is a distinct,
# out-of-scope obligation; the 848 is only the INCN communication.
