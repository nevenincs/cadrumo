[revisions."2021-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2021-y-siguientes' of modelo 231 has no strictly-earlier sibling revision of this modelo (valid_from 2021-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "rd-634-2015:art-13",
    "orden-hfp-1978-2016:art-1",
    "orden-hfp-1978-2016:art-3",
    "orden-hfp-1978-2016:art-4",
    "orden-hac-1285-2020:art-primero-anexo",
]
source_refs = [
    "aeat-modelo-231-procedure",
    "boe-modelo-231-base-order",
    "boe-modelo-231-current-annex",
]

[revisions."2021-y-siguientes".family_dispositions.relations]
reason = "Modelo 231 declares calculation_class = \"informative\". validate_informative_class_invariant hard-refuses any revision of an informative-class modelo that declares a non-empty relations family -- cross-model relations feed a filing-grade calculation this modelo does not perform. The relations family cannot be populated for this modelo by registry construction."
legal_refs = [
