id = "rendimientos-trabajo-superiores-60000"
continuidad_origin = "new_on_form"
continuidad_evidence = "THE PREDICATE PRINTED AT POSITION 271 IS REPLACED, NOT RENAMED. The 2025 record design prints «RENDIMIENTOS ÍNTEGROS DEL TRABAJO SUPERIORES A 60.000 EUROS», filled «consignando una “S” cuando el trabajador obtenga rendimientos íntegros del trabajo superiores a 60.000 euros», at registro de tipo 2 position 271 (line 1126 of corpus/aeat_official/disenos_registro/modelo_345/files/01-345-ejercicio-2025.pdf.extracted.md, sha256 a8db0973dd7b). Predecessor edition 2024 prints at that same position the OPPOSITE predicate «RENDIMIENTOS ÍNTEGROS DEL TRABAJO NO SUPERIORES A 60.000 EUROS», filled with an «X» when the worker does NOT exceed 60.000 euros (line 1126 of corpus/.../modelo_345/files/04-345-diseno-de-registro-actualizado-en-2024.pdf.extracted.md, sha256 32d87b9da3fa), and prints the affirmative predicate nowhere. Orden HAC/1430/2025 inverted the byte for ejercicio 2025, so this box is new on this edition's form, not a continuation of the 2024 negative-predicate box."
number = "tipo2.271"
section = ["registro_declarado", "datos_adicionales"]
data_type = "text"
semantic_role = "m345_rendimientos_trabajo_superiores_60000"
semantic_role_cardinality = "intentional_singleton"
semantic_role_cardinality_reason = "AEAT inverted campo 271 for 2025: the 2023 and 2024 disenos print TRABAJO NO SUPERIORES A 60.000 EUROS flagged X; the 2025 diseno prints SUPERIORES A 60.000 EUROS flagged S/N. The inverted predicate is a distinct concept, not a twin of the negated role."
