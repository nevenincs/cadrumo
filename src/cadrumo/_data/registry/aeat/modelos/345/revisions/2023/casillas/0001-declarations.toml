# Modelo 345, ejercicio 2023 -- transcribed from the bundled AEAT Diseño de
# Registro (source aeat-dr-345-2023, corpus/aeat_official/disenos_registro/
# modelo_345/files/02-345-ejercicio-2023-y-siguientes.pdf, sha256
# 94800d433248ad6bd9baf1213fe2ae512732d21520b923cc0ce2c044edd247de).
#
# Every id, span and section below is the design's own. The edition default
# `casilla_source_refs = ["aeat-dr-345-2023"]` grounds every row, so no row
# restates it.
# Operator-supplied: no ejercicio-2023 instrucciones source is bundled, so no
# formula derives this total.
# Positions 145-159, subdivided 145-157 parte entera and 158-159 parte decimal.
# Operator-supplied for the same reason as above.
# Position 82, CLAVE, as amended for this ejercicio by Orden HFP/528/2023. The
# clave A / clave B reallocation of Orden HAC/1504/2024 applies to ejercicio 2024
# and is NOT reflected here.
# Positions 83-84, SUBCLAVE, as amended for this ejercicio by Orden HFP/528/2023
# and by Orden HFP/1397/2023 artículo sexto (subclave 03 of clave A, «planes de
# pensiones de empleo simplificados de trabajadores por cuenta propia o
# autónomos»).
# Positions 94-106, subdivided 94-104 parte entera and 105-106 parte decimal.
# Positions 178-189, subdivided 178-187 parte entera and 188-189 parte decimal.
# The 240.000 EUR ceiling is the design's own.
# CREATED FOR THIS EJERCICIO by Orden HFP/528/2023: positions 190-270, the PEPP
# (producto paneuropeo de pensiones individuales) block. Absent from the
# ejercicio-2022 record, which ends at 189.
# Position 271. THIS EPOCH'S FIELD IS THE NEGATIVE PREDICATE. The design names it
# «RENDIMIENTOS ÍNTEGROS DEL TRABAJO NO SUPERIORES A 60.000 EUROS» and fills it
# «consignando una "X", cuando el trabajador no obtenga en el ejercicio
# rendimientos íntegros del trabajo superiores a 60.000 euros procedentes de la
# empresa que realiza la contribución». Orden HAC/1430/2025 artículo séptimo
# inverts the byte for ejercicio 2025, where it becomes «SUPERIORES A 60.000
# EUROS» marked «S». The 2025 revision's `rendimientos-trabajo-superiores-60000`
# is therefore a DIFFERENT casilla, not a renamed one, and this id and semantic
# role are deliberately distinct from it.
# Position 321, the last data byte of this epoch's registro de tipo 2; the design
# closes the record immediately after it with «322-500 -------- BLANCOS.».
# Modelo 345, ejercicio 2023 -- the official record-design positions that carry
# no calculation. Transcribed from the bundled Diseño de Registro (source
# aeat-dr-345-2023, corpus/aeat_official/disenos_registro/modelo_345/files/
# 02-345-ejercicio-2023-y-siguientes.pdf, sha256
# 94800d433248ad6bd9baf1213fe2ae512732d21520b923cc0ce2c044edd247de).
# Registro de tipo 1, campo 7. Positions 59-107, alfanumérico de 49 posiciones.
# The design subdivides the slot (59-67 TELÉFONO, 68-107 APELLIDOS Y NOMBRE) but
# declares ONE top-level campo of 49 bytes, which is the extent declared here.
# Registro de tipo 1, campo 8. Positions 108-120, numérico de 13 posiciones.
# Registro de tipo 1, campo 9. Positions 121-122, alfabético de 2 posiciones:
# 121 declaración complementaria («C»), 122 declaración sustitutiva («S»).
# Registro de tipo 1, campo 10. Positions 123-135, numérico de 13 posiciones.
# Registro de tipo 2, campo 6. Positions 27-35, alfanumérico de 9 posiciones, the
# NIF of a declarado under 14's legal representative.
# Registro de tipo 2, campo 19. Positions 272-320, «DATOS IDENTIFICATIVOS DEL
# EMPLEADOR QUE SEA PROMOTOR O TOMADOR DEL SISTEMA DE PREVISIÓN SOCIAL». The
# design subdivides the slot (272-280 N.I.F., 281-320 APELLIDOS Y NOMBRE O RAZÓN
# SOCIAL) and declares ONE top-level campo of 49 bytes; this revision carries the
# two subdivisions separately as `empleador-nif` and `empleador-nombre`, and this
# casilla is the design's own parent span. Created for this ejercicio by Orden
# HFP/528/2023; absent from the ejercicio-2022 record.

