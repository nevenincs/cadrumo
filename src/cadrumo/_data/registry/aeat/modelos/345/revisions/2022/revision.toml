agent: authored from the bundled hash-pinned boe-modelo-345-base-order anexo. VERIFIED -- \
FIRST EJERCICIO: Orden HFP/823/2022 disposición final segunda names ejercicio 2022 verbatim in \
the bundled corpus. VERIFIED -- GEOMETRY: every position and sub-span transcribed below was \
read row by row off the anexo's own position table, and the tipo-2 record end was confirmed \
against the anexo's own «190‑500 – BLANCOS.» line and compared position for position with the \
2023, 2024 and 2025 AEAT designs, whose tipo-2 records end at 321. VERIFIED -- ABSENCE: the \
campos at 190-270, 271, 272-320 and 321 are absent from this epoch because Orden HFP/528/2023 \
created them for ejercicio 2023; they are not omitted here. NOT CLAIMED -- NO OPERATOR \
COUNTERSIGNATURE. NOT CLAIMED -- NO FILING GRADE: no ejercicio-2022 AEAT procedure or \
instrucciones source exists in the corpus, so no binding, formula, export layout or \
completeness claim is made."""
