# rendimientos íntegros del trabajo superiores a 60.000 euros procedentes de la
# empresa que realiza la contribución», and Orden HAC/1504/2024 adds the explicit
# alternative «En otro caso, se consignará "N".» Orden HAC/1430/2025 artículo
