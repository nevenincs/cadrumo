# Registro de tipo 2, campo 19. Positions 272-320, alfanumerico de 49 posiciones,
# "DATOS IDENTIFICATIVOS DEL EMPLEADOR QUE SEA PROMOTOR O TOMADOR DEL SISTEMA DE
# PREVISION SOCIAL". The design subdivides the slot (272-280 N.I.F. DEL EMPLEADOR,
# 281-320 APELLIDOS Y NOMBRE O RAZON SOCIAL DEL EMPLEADOR) and declares ONE
# top-level campo of 49 bytes. This revision already carries the two subdivisions
# as `empleador-nif` and `empleador-nombre`; this casilla is the design's own
# parent span, declared the same way this revision already declares the parent
# spans of campos 14, 16 and 17 (`datos-adicionales-claves-abc`,
# `datos-adicionales-clave-i`, `datos-adicionales-clave-m`), and it is the span
# the fichero record writes.
[[revisions."2025".casillas]]
id = "datos-identificativos-empleador"
number = "tipo2.272-320"
section = ["registro_declarado", "empleador"]
data_type = "text"
semantic_role = "m345_datos_identificativos_empleador"
required = false
input_kind = "manual"
export_refs = ["modelo-345-t2-datos-empleador"]
legal_refs = ["orden-hfp-528-2023:art-unico"]
source_refs = ["aeat-dr-345-2025", "boe-modelo-345-2023-amendment-hfp-528"]
