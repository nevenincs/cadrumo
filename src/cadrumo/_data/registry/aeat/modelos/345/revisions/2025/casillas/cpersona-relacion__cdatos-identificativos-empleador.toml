# Modelo 345, ejercicio 2025 -- the official record-design positions that had no
# casilla. Transcribed from the bundled Diseno de Registro
# (source aeat-dr-345-2025, corpus/aeat_official/disenos_registro/modelo_345/
# files/01-345-ejercicio-2025.pdf, sha256
# fb0faaf68f8b0de29316bdc65eaeb3ba0dcb8a441eea4d5415d0cb4517c287fd).
#
# Every id, span and label below is the design's own; nothing is inferred.

# Registro de tipo 1, campo 7. Positions 59-107, alfanumerico de 49 posiciones.
# The design subdivides the slot (59-67 TELEFONO, 68-107 APELLIDOS Y NOMBRE) but
# declares ONE top-level campo of 49 bytes, which is the extent declared here.
[[revisions."2025".casillas]]
id = "persona-relacion"
number = "tipo1.59-107"
section = ["registro_declarante", "identificacion"]
data_type = "text"
semantic_role = "m345_persona_relacion"
required = false
input_kind = "manual"
export_refs = ["modelo-345-t1-persona-relacion"]
legal_refs = ["orden-hfp-823-2022:art-1"]
source_refs = ["aeat-dr-345-2025", "boe-modelo-345-base-order"]

