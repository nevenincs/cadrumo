required = false
input_kind = "manual"
export_refs = ["modelo-345-t1-numero-identificativo"]
legal_refs = ["orden-hfp-823-2022:art-1"]
source_refs = ["aeat-dr-345-2025", "boe-modelo-345-base-order"]

# Registro de tipo 1, campo 9. Positions 121-122, alfabetico de 2 posiciones:
