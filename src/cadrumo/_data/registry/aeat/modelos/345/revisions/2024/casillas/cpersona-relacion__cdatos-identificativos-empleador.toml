# Registro de tipo 1, campo 7. Positions 59-107, alfanumérico de 49 posiciones.
# The design subdivides the slot (59-67 TELÉFONO, 68-107 APELLIDOS Y NOMBRE) but
# declares ONE top-level campo of 49 bytes, which is the extent declared here.
[[revisions."2024".casillas]]
id = "persona-relacion"
number = "tipo1.59-107"
section = ["registro_declarante", "identificacion"]
data_type = "text"
semantic_role = "m345_persona_relacion"
required = false
input_kind = "manual"
legal_refs = ["orden-hfp-823-2022:art-1"]

