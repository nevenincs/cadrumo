# Registro de tipo 2, campo 19. Positions 272-320, «DATOS IDENTIFICATIVOS DEL
# EMPLEADOR QUE SEA PROMOTOR O TOMADOR DEL SISTEMA DE PREVISIÓN SOCIAL». The
# design subdivides the slot (272-280 N.I.F., 281-320 APELLIDOS Y NOMBRE O RAZÓN
# SOCIAL) and declares ONE top-level campo of 49 bytes; this revision carries the
# two subdivisions separately as `empleador-nif` and `empleador-nombre`, and this
# casilla is the design's own parent span. Created by Orden HFP/528/2023 for
# ejercicio 2023 and unchanged here; absent from the ejercicio-2022 record.
