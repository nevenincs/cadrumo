# span. Deadline windows for February 2023, 2024 and 2025 are NOT authored: art. 4
# fixes the plazo «durante el mes de febrero de cada año», but the calendario
# evidence for those three Februaries was not opened, and inferring the closes
# from working-day arithmetic is not grounding.
