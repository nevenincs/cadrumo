# @121+2 Alfabético. DECLARACION COMPLEMENTARIA O SUSTITUTIVA | En el caso de segunda o ulterior presentación de declaraciones, deberá cumplimentarse obligatoriamente uno de los siguientes campos: 121 DECLARACIÓN COMPLEMENTARIA: Se consignará una "C" si la presentación de esta declaración tiene por objeto incluir registros de declarados que, debiendo haber figurado en otra declaración del mismo ejercicio presentada anteriormente, hubieran sido completamente omitidos en la misma. La modificación del contenido de datos declarados en otra declaración del mismo ejercicio presentada anteriormente, se realizará desde el servicio de consulta y modificación de declaraciones informativas en la Sede Electrónica de la Agencia Estatal de Administración Tributaria (www.agenciatributaria.gob.es). 122 DECLARACIÓN SUSTITUTIVA: Se consignará una "S" si la presentación tiene como objeto anular y sustituir completamente a otra declaración anterior, del mismo ejercicio, en la cual se hubieran consignado datos inexactos o erróneos. Una declaración sustitutiva sólo puede anular a una única declaración anterior.
