[revisions."2022-2024"]
casilla_source_refs = ["aeat-dr-280-2022", "boe-modelo-280-base-order"]
authority_grade = "applicability"
# Modelo 280, declaración informativa anual de Planes de Ahorro a Largo Plazo,
# filing years 2022, 2023 and 2024 as ONE span.
#
# ONE SPAN, AND WHAT THAT CLAIM ACTUALLY RESTS ON. The BOE consolidated text of
# BOE-A-2015-11074 lists exactly three modifications to the anexo of Orden
# HAP/2118/2015, where the diseños de registro live: Orden HFP/1822/2016, Orden
# HAC/1276/2019 and Orden HFP/1192/2022. Nothing after 2022. There is therefore
# no legal instrument by which the 2023 or 2024 design could differ from the 2022
# one, and three revisions would assert a distinction no source states.
#
# THE CLAIM IS "NO AMENDING ORDEN EXISTS", NEVER "THE DESIGNS ARE BYTE-IDENTICAL".
# Only ONE design is bundled -- aeat-dr-280-2022, whose window opens 2022-01-01
# and does not close. A byte-identity claim would need three artefacts and this
# tree holds one. Whether AEAT published a DR_280_2023 or DR_280_2024 that nobody
# fetched is a question this tree cannot answer: it carries no negative-result
# record for those URLs. ACQUISITION PENDING -- if either exists, this span
# splits, and that is a real possibility rather than a formality.
#
# THE LOWER BOUND IS LOAD-BEARING AND MUST NOT BE EXTENDED EARLIER. Position 137
# of the Tipo 2 record, «Extinción del Plan de Ahorro a Largo Plazo», was amended
# by Orden HFP/1192/2022 art. cuarto: clave 3, extinción por fallecimiento del
# tomador, was added, and clave 2 was rewritten to mean «en circunstancias
# distintas a las definidas en las claves 1 y 3». The position did not move and
# the caption did not change -- the entire change is in the Contenido cell.
# Folding 2021 or earlier into this span would carry clave 3 into an ejercicio
# where it did not exist.
#
# aeat-modelo-280-procedure IS DELIBERATELY NOT CITED. Its window opens
# 2025-01-01 and overlaps no year of this span, so citing it would ground this
# edition on a source that does not reach it. The 2025 sibling cites it
# legitimately; this edition cannot.
#
# NO PREDECESSOR KEY IS DECLARED, and neither does the 2025 edition. That leaves
# modelo 280 wholly undeclared, which the forest rule permits: it refuses a
# second keyless edition only once some edition has named a predecessor or
# declared a root. Declaring one here would require declaring the whole modelo in
# the same pass, and asserting that the 2025 edition is derivable from this one
# is a lineage claim no bundled source supports.
