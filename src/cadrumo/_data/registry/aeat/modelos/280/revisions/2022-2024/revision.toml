review_status = "agent_reviewed"
reviewed_by = """\
agent: authoring review of the modelo 280 2022-2024 span. VERIFIED -- ONE SPAN BY LAW: the \
consolidated text of BOE-A-2015-11074 lists three and only three amendments to the anexo \
(HFP/1822/2016, HAC/1276/2019, HFP/1192/2022), the last applying «por primera vez, para las \
declaraciones correspondientes al ejercicio 2022». No instrument exists by which 2023 or 2024 \
could differ. VERIFIED -- SOURCE WINDOWS: every cited source's window overlaps every year of \
this span, checked with source_window_applies_across rather than by eye; \
aeat-modelo-280-procedure fails that check for all three years and is excluded rather than \
carried over from the 2025 sibling. VERIFIED -- GEOMETRY: both records tile 1..500 exactly \
once with no gap and no overlap, asserted at generation. The casillas were emitted by \
generator from aeat-dr-280-2022 with its sha256 checked against the catalogue declaration, \
not transcribed; 27 casillas, matching the 2025 edition's 27 concept for concept. NOT CLAIMED \
-- BYTE-IDENTICAL DESIGNS: only one design is bundled, so the span is a legal claim about \
amending ordenes, not a comparison of three artefacts. ACQUISITION PENDING: a DR_280_2023 or \
DR_280_2024 may exist unfetched and would split this span. VERIFIED -- DEADLINE WINDOWS: three rows, one per filing year, each close READ from the \nbundled calendario rather than computed. Each calendario lists this modelo under a «Hasta el \nN de febrero» heading and the row takes N from it: 28 February 2023, 29 February 2024, 28 \nFebruary 2025. The 2024 close being the 29th is why the calendarios were opened -- February \n2024 is a leap February, and assuming «the 28th» would have shortened a real filing window by \na day while looking entirely plausible. Each row cites the calendario of the year of \nPRESENTATION, the year after its filing_year. NOT CLAIMED -- FILING: no export layout, no application \
links, no parity refs on this edition. NOT CLAIMED -- FORMULAS: declared not_applicable \
below, on this modelo's nature. NOT CLAIMED -- no operator countersignature. NOT CLAIMED -- \
independent_check_coverage is n/a: NO CLAIM, not zero."""
reviewed_at = 2026-09-12

