# @137+1 Numérico. EXTINCIÓN DEL PLAN DE AHORRO A LARGO PLAZO | En caso de extinción del Plan de Ahorro a Largo Plazo durante el ejercicio, deberá consignarse alguna de las siguientes claves: 1: Extinción del Plan de Ahorro a Largo Plazo por disposición de las cantidades integradas en el mismo antes de que hayan transcurrido 5 años desde su apertura o por incumplimiento del límite de aportaciones de la letra c) del apartado 1 de la Disposición adicional vigésima sexta de la Ley del IRPF. 2: Extinción del Plan de Ahorro a Largo Plazo en circunstancias distintas a las definidas a las definidas en las claves 1 y 3. 3: Extinción del Plan de Ahorro a Largo Plazo por fallecimiento del tomador. Si el Plan de Ahorro a Largo Plazo no se ha extinguido durante el ejercicio al que corresponda la declaración, este campo deberá dejarse vacío. No se entenderá producida la extinción del Plan de Ahorro a Largo Plazo en caso de movilización de los derechos económicos incorporados al mismo en los términos establecidos en la Disposición adicional octava del Reglamento del Impuesto sobre la Renta de las Personas Físicas, aprobado por Real Decreto 439/2007, de 30 de marzo. Por tanto, en caso de que en el campo “CLAVE DE ALTA”, que ocupa la posición 110 del registro de tipo 2, se hubiera consignado “B”, o “D”, este campo no tendrá contenido.
