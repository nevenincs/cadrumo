# Modelo 280 annual plazo for filing years 2022, 2023 and 2024. Orden
# HAP/2118/2015 art 4 is the whole rule and it is recurring rather than
# per-ejercicio: «durante el mes de febrero de cada año, en relación con la
# información correspondiente al año natural inmediato anterior». Each row below
# is that one article applied to one año natural.
#
# EVERY CLOSE IS AEAT'S PUBLISHED DATE, READ FROM THE BUNDLED CALENDARIO, not a
# statutory last-day-of-February computed here. Each calendario lists this
# modelo under a «Hasta el N de febrero» heading, and the row takes N from that
# heading:
#
#   calendario 2023 p13 «Hasta el 28 de febrero», p14 «Declaración informativa
#     anual de planes de ahorro a largo plazo · Año 2022: 280»
#   calendario 2024 p14 «Hasta el 29 de febrero», p15 «… · Año 2023: 280»
#   calendario 2025 p13 «Hasta el 28 de febrero», p14 «… · Año 2024: 280»
#
# The 2024 close being the 29th is the point of reading rather than computing.
# February 2024 is a leap February, and a row that assumed «the 28th» would have
# shortened a real filing window by a day while looking entirely plausible.
#
# THE CALENDARIO CITED IS THE ONE FOR THE YEAR OF PRESENTATION, which is the year
# AFTER the filing_year, because that is the calendar the plazo actually appears
# in. A source-window screen reads these as presentation-calendar citations and
# not as defects; that is the correct reading and the rows are deliberately
# shaped that way.
#
# aeat-modelo-280-procedure IS NOT CITED here, though the 2025 sibling's rows do
# cite it. Its window opens 2025-01-01 and overlaps no year of this revision.

[[revisions."2022-2024".deadline_windows]]
