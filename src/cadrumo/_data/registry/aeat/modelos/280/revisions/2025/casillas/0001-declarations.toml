# Modelo 280, ejercicio 2025 -- the official record-design positions that had no
# casilla. Transcribed from the bundled Diseno de Registro
# (source aeat-dr-280-2022, corpus/aeat_official/disenos_registro/modelo_280/
# files/DR_280_2022.pdf, sha256
# 45cab8f0880dfc4094d6cc8905ae37efba0c10a568d49e8648e1c9a20b2a5701).
#
# Every casilla carries its canonical m280_<id> semantic_role.
# --- REGISTRO DE TIPO 1: REGISTRO DE DECLARANTE ---
# Campo 5. Positions 18-57, alfanumerico. "Se consignara la denominacion
# completa de la entidad declarante, sin anagrama."
# Campo 7. Positions 59-107, alfanumerico de 49 posiciones. The design
# subdivides the slot (59-67 TELEFONO, 68-107 APELLIDOS Y NOMBRE) but declares
# ONE top-level campo of 49 bytes, which is the extent declared here.
# Campo 8. Positions 108-120, numerico de 13 posiciones. "Un numero secuencial
# cuyos tres primeros digitos se corresponderan con el codigo 280."
# Campo 9. Positions 121-122, alfabetico: 121 declaracion complementaria ("C"),
# 122 declaracion sustitutiva ("S").
# Campo 10. Positions 123-135, numerico de 13 posiciones. Carries content only
# when campo 9 declares "C" or "S"; "en cualquier otro caso debera rellenarse a
# ceros".
# Campo 11. Positions 136-144, numerico de 9 posiciones. "El numero total de
# registros de declarados, registros de detalle de tipo 2."
# Campo 12. Positions 145-164, numerico de 20 posiciones: the suma total of the
# tipo-2 APORTACIONES EFECTUADAS EN EL EJERCICIO. The design subdivides the slot
# (145-162 parte entera, 163-164 parte decimal) and states the importe "no ira
# precedido de signo alguno (+/-), ni incluira coma decimal" -- an unsigned
# amount with two implied decimals filling the whole 20-byte slot.
# Campo 13. Positions 165-184, numerico de 20 posiciones: the suma of the tipo-2
# BASE DE LA RETENCION PRACTICADA. Subdivided 165-182 entera, 183-184 decimal.
# --- REGISTRO DE TIPO 2: REGISTRO DE DECLARADO ---
# Campo 6. Positions 27-35, alfanumerico de 9 posiciones. "Si el declarado es
# menor de 14 anos ... el numero de identificacion fiscal de su representante
# legal (padre, madre o tutor). En cualquier otro caso el contenido de este
# campo se rellenara a espacios."
# Campo 8. Position 76, numerico. Claves: 1 SIALP (Seguro Individual de Ahorro a
# Largo Plazo), 2 CIALP (Cuenta Individual de Ahorro a Largo Plazo).
# Campo 9. Position 77, alfabetico. Claves: "I" si el Plan se identifica
# mediante un codigo IBAN, "O" si se aporta otro identificador.
# Campo 10. Positions 78-101, alfanumerico de 24 posiciones. "El codigo
# identificativo del CIALP o SIALP cuya titularidad corresponda al declarado."
# Campo 11. Positions 102-109, numerico. Subdivided 102-105 Ano, 106-107 Mes,
# 108-109 Dia. "En caso de movilizacion de los derechos economicos del Plan, se
# tomara la fecha original de su apertura."
# Campo 20. Positions 166-175, numerico de 10 posiciones. Subdivided 166-173
# entera, 174-175 decimal; unsigned per "no ira precedido de signo alguno".
# Campo 21. Positions 176-186, alfanumerico de 11 posiciones. Unlike every other
# amount on this record it carries an explicit sign byte: the design subdivides
# it as "176. SIGNO: Campo alfabetico: se consignara siempre una 'N'" plus
# "177-186: RENDIMIENTO NEGATIVO: Campo numerico de diez posiciones", itself
# subdivided 177-184 entera and 185-186 decimal. The value is the magnitude of
# the negative returns; the export writes the constant 'N' ahead of it, so the
# signo and the magnitude cannot be filled inconsistently.

