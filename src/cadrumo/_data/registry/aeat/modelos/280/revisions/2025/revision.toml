agent: TEMPORAL-SPAN review only. This stamp re-dates the revision because its selector \
changed -- years = [2025] became year_from = 2025 with no upper bound -- and a stamp must not \
attest a span the revision no longer has. VERIFIED -- THE APPROVING ORDEN IS OPEN-ENDED: \
Orden HAP/2118/2015 art 1 approves the modelo and its diseños de registro once, art 4 sets a \
recurring February plazo «de cada año» over «el año natural inmediato anterior», and the \
disposición final reaches «2015 y ejercicios siguientes». Read from the BOE consolidated text \
of BOE-A-2015-11074 on 2026-09-12. VERIFIED -- NO LATER AMENDMENT: that consolidated text \
lists exactly three amending ordenes (HFP/1822/2016, HAC/1276/2019, HFP/1192/2022) and none \
after 2022; AEAT's modelo 280 procedure page cites the same four ordenes and no other. Both \
were read on 2026-09-12. The bundled aeat-dr-280-2022 is therefore current, so the span opens \
over an unchanged design rather than over an unevidenced one. NOT RE-MADE -- THE CASILLA, \
EXPORT-LAYOUT AND BINDING REVIEW IS INHERITED, not re-performed: it is the agent-prepared \
2026-08-19 review of the two 500-byte records against aeat-dr-280-2022, and nothing in it was \
re-read for this change. NOT CLAIMED -- NO OPERATOR COUNTERSIGNATURE, on either the inherited \
review or this one. NOT CLAIMED -- FUTURE PLAZOS: only the two authored deadline windows are \
declared; the open selector asserts nothing about a calendar year whose window is unauthored. \
NOT CLAIMED -- authority grade is unchanged at applicability; opening a span promotes \
nothing."""
reviewed_at = 2026-09-12

