# Campo 12. Positions 145-164, numerico de 20 posiciones: the suma total of the
# tipo-2 APORTACIONES EFECTUADAS EN EL EJERCICIO. The design subdivides the slot
# (145-162 parte entera, 163-164 parte decimal) and states the importe "no ira
# precedido de signo alguno (+/-), ni incluira coma decimal" -- an unsigned
# amount with two implied decimals filling the whole 20-byte slot.
[[revisions."2025".casillas]]
id = "importe-total-aportaciones"
number = "tipo1.145-164"
section = ["identificacion_declaracion"]
data_type = "money"
semantic_role = "m280_importe_total_aportaciones"
required = false
input_kind = "manual"
constraints = { sign = "non_negative", legal_refs = ["orden-hfp-1822-2016:art-sexto"], source_refs = ["boe-modelo-280-2016-amendment-hfp-1822", "aeat-dr-280-2022"] }
export_refs = ["modelo-280-t1-importe-total-aportaciones"]
legal_refs = ["orden-hap-2118-2015:art-1", "orden-hfp-1822-2016:art-sexto"]
source_refs = ["boe-modelo-280-base-order", "boe-modelo-280-2016-amendment-hfp-1822", "aeat-dr-280-2022"]

# Campo 13. Positions 165-184, numerico de 20 posiciones: the suma of the tipo-2
