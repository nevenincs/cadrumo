# Campo 21. Positions 176-186, alfanumerico de 11 posiciones. Unlike every other
# amount on this record it carries an explicit sign byte: the design subdivides
# it as "176. SIGNO: Campo alfabetico: se consignara siempre una 'N'" plus
# "177-186: RENDIMIENTO NEGATIVO: Campo numerico de diez posiciones", itself
# subdivided 177-184 entera and 185-186 decimal. Declared as one signed money
# span so the signo and the magnitude cannot be filled inconsistently.
[[revisions."2025".casillas]]
id = "rendimientos-negativos-imputables"
number = "tipo2.176-186"
section = ["plan_ahorro_largo_plazo", "rendimientos"]
data_type = "money"
semantic_role = "m280_rendimientos_negativos_imputables"
required = false
input_kind = "manual"
export_refs = ["modelo-280-t2-rendimientos-negativos-imputables"]
legal_refs = ["orden-hap-2118-2015:art-1", "orden-hfp-1822-2016:art-sexto"]
source_refs = ["boe-modelo-280-base-order", "boe-modelo-280-2016-amendment-hfp-1822", "aeat-dr-280-2022"]
