#
# Every casilla carries its canonical m280_<id> semantic_role.

# --- REGISTRO DE TIPO 1: REGISTRO DE DECLARANTE ---

# Campo 5. Positions 18-57, alfanumerico. "Se consignara la denominacion
# completa de la entidad declarante, sin anagrama."
[[revisions."2025".casillas]]
id = "declarante-razon-social"
number = "tipo1.18-57"
section = ["identificacion_declaracion"]
data_type = "name"
semantic_role = "m280_declarante_razon_social"
required = false
input_kind = "manual"
export_refs = ["modelo-280-t1-razon-social"]
legal_refs = ["orden-hap-2118-2015:art-1", "orden-hap-2118-2015:art-2"]
source_refs = ["boe-modelo-280-base-order", "aeat-dr-280-2022"]

# Campo 7. Positions 59-107, alfanumerico de 49 posiciones. The design
# subdivides the slot (59-67 TELEFONO, 68-107 APELLIDOS Y NOMBRE) but declares
# ONE top-level campo of 49 bytes, which is the extent declared here.
[[revisions."2025".casillas]]
id = "persona-relacion"
number = "tipo1.59-107"
section = ["identificacion_declaracion"]
data_type = "text"
semantic_role = "m280_persona_relacion"
required = false
input_kind = "manual"
export_refs = ["modelo-280-t1-persona-relacion"]
legal_refs = ["orden-hap-2118-2015:art-1"]
source_refs = ["boe-modelo-280-base-order", "aeat-dr-280-2022"]

# Campo 8. Positions 108-120, numerico de 13 posiciones. "Un numero secuencial
