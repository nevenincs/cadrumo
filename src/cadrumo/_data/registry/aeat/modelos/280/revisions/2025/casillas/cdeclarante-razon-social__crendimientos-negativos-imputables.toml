[[revisions."2025".casillas]]
id = "base-retenciones"
number = "tipo1.165-184"
section = ["identificacion_declaracion"]
data_type = "money"
semantic_role = "m280_base_retenciones"
required = false
input_kind = "manual"
constraints = { sign = "non_negative", legal_refs = ["orden-hfp-1822-2016:art-sexto"], source_refs = ["boe-modelo-280-2016-amendment-hfp-1822", "aeat-dr-280-2022"] }
export_refs = ["modelo-280-t1-base-retenciones"]
legal_refs = ["orden-hap-2118-2015:art-1", "orden-hfp-1822-2016:art-sexto"]
source_refs = ["boe-modelo-280-base-order", "boe-modelo-280-2016-amendment-hfp-1822", "aeat-dr-280-2022"]

# --- REGISTRO DE TIPO 2: REGISTRO DE DECLARADO ---

