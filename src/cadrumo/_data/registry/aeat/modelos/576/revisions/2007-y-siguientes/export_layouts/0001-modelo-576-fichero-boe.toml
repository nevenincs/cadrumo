# Modelo 576 fichero BOE fixed-width layout, transcribed position-by-position
# from the bundled AEAT Diseno de Registro cited by enrolled-modelo-576-layout
# (dr576.xlsx, sha256 d1964b0c5b2c360b1a06e510ae3f7fce632cd3f7882be0365a8fdb3c26e0dbc7).
# The design declares a single record of exactly 1517 positions; the 60 fields
# below tile 1..1517 once each with no gap and no overlap, proven mechanically
# against the parsed design before authoring.
#
# Row 19 of the design is authored as its EIGHT declared sub-positions
# (19.1-19.8), not as the 40-byte parent span. AEAT states the parent only
# applies to ejercicio de devengo < 2008 and that "Ejercicio Devengo >= 2.008:
# Este campo se desglosa en los 8 campos siguientes"; sub-position 19.3
# (@520+8) is RESERVADO para AEAT, so writing the parent as one slot would put
# taxpayer data into space the Administracion reserves.

