legal_refs = ["orden-eha-3851-2007:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-576-procedure"]
# Modelo 576 form casillas, transcribed from the bundled AEAT Diseno de
# Registro cited by aeat-dr-576-2008. Each casilla's `number` is the
# design's own row ordinal from its "N" column, so the mapping back to the
# official source is direct; the design publishes no bracketed box numbers.
# Grounding is the modelo-approving orden (orden-eha-3851-2007 art 1) plus the
# general information duty (ley-58-2003 art 93), matching what the revision and
# its construct already declare. Ley 38/1992 (IIEE) is NOT cited: it is absent
# from this registry's legal catalogue and no article is invented here.

