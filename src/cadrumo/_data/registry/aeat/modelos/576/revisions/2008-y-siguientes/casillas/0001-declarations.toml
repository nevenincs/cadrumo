# Modelo 576 declaration-header casillas, grounded in orden-eha-3851-2007 art 1.
# The form casillas transcribed from the bundled diseño de registro live in the
# sibling fragment; decl.tipo-declaracion is the design's row 3 ("Tipo
# declaración", @12+1) and carries its export_ref here.
#
# decl.ejercicio deliberately carries NO export_ref: the design's "Ejercicio de
# Devengo" slot (row 5, @22+4) is written from the draft's own filing_year
# through a `draft` field, the established mechanism across this registry, so no
# export field addresses this casilla.

[[revisions."2008-y-siguientes".casillas]]
id = "decl.ejercicio"
continuidad_id = "filing-year"
continuidad_origin = "seeded"
number = "ejercicio"
section = ["declarante"]
data_type = "year"
semantic_role = "filing_year"
required = true
input_kind = "informational"
legal_refs = ["orden-eha-3851-2007:art-1", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-576-procedure"]

[[revisions."2008-y-siguientes".casillas]]
id = "decl.tipo-declaracion"
continuidad_origin = "not_on_form"
continuidad_evidence = "discriminador de fichero I (Ingreso) o N (Negativa), campo 3 del diseno, derivado de la clase de resultado; no es una casilla adicional del anexo grafico. El anexo I de Orden EHA/1981/2005 (BOE pagina 22798) y el anexo I de Orden EHA/3851/2007 muestran los conceptos de salida del discriminador. aeat-dr-576-2008 lo codifica como campo tecnico independiente; no se declara una nueva casilla del impreso."
