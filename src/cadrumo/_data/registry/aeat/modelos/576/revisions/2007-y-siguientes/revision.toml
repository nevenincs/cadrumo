# Modelo 576 autoliquidación del Impuesto Especial sobre Determinados Medios de
# Transporte (IEDMT) por matriculación, approved by orden-eha-3851-2007 art 1.
# Scheduling/applicability-grade: declaration-header casillas only. The
# authoritative Modelo 576 diseño de registro IS bundled
# (enrolled-modelo-576-layout, re-pointed 2026-08-15) but no casilla-to-
# position mapping has been authored from it yet, so no numbered form
# casilla is fabricated here.
# Deadline-shape note: art 1 delegates el lugar, plazo y forma to Orden
# EHA/1981/2005 — la autoliquidación se presenta con carácter PREVIO a la
# matriculación definitiva del medio de transporte, un plazo POR EVENTO, no una
# ventana natural fija. This revision therefore carries NO calendar
# deadline_windows and no deadline application link; a fixed date is not
# fabricated. The approval + delegation article is grounded verbatim.
valid_from = 2007-01-01
period_selector = { year_from = 2007, periods = ["0A"] }
orden_aplicabilidad = ["orden-eha-3851-2007:art-1"]
legal_refs = [
    "orden-eha-3851-2007:art-1",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-576-procedure",
    "enrolled-modelo-576-layout",
]


