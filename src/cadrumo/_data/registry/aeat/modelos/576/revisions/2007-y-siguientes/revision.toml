[revisions."2007-y-siguientes"]
authority_grade = "applicability"
# Modelo 576 autoliquidación del Impuesto Especial sobre Determinados Medios de
# Transporte (IEDMT) por matriculación, approved by orden-eha-3851-2007 art 1.
# The authoritative Modelo 576 diseño de registro is bundled
# (enrolled-modelo-576-layout, re-pointed 2026-08-15) and the full
# casilla-to-position mapping HAS now been transcribed from it: 40 form
# casillas plus the pre-existing declaration header, and a fixed-width export
# layout whose 60 fields tile the design's single 1517-position record exactly
# once with no gap and no overlap. authority_grade is deliberately left
# untouched here; regrading is an operator decision, not a consequence of the
# layout landing.
# Deadline-shape note: art 1 delegates el lugar, plazo y forma to Orden
# EHA/1981/2005 — la autoliquidación se presenta con carácter PREVIO a la
# matriculación definitiva del medio de transporte, un plazo POR EVENTO, no una
# ventana natural fija. This revision therefore carries NO calendar
# deadline_windows and no deadline application link; a fixed date is not
# fabricated. The approval + delegation article is grounded verbatim.
valid_from = 2007-01-01
period_selector = { year_from = 2007, periods = ["0A"] }
orden_aplicabilidad = ["orden-eha-3851-2007:art-1"]
legal_refs = [
    "orden-eha-3851-2007:art-1",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-576-procedure",
    "enrolled-modelo-576-layout",
]
review_status = "agent_reviewed"
reviewed_by = "agent: applicability-grade review; 60 export fields verified to tile positions 1-1517 exactly once with no gap or overlap; 42 casillas against the bundled diseno; deadline absence is now recorded as a family disposition rather than asserted only here: orden-eha-3851-2007 art. 1 DELEGATES timing in full to Orden EHA/1981/2005, and the IEDMT autoliquidacion is triggered by the matriculacion or first definitive use, so the plazo is event-anchored and no recurring window exists. CORRECTION to the earlier wording of this stamp, which called it the CITED event-relative plazo: the delegating article is cited, the DELEGATE Orden EHA/1981/2005 is neither enrolled nor bundled, so the concrete period is not corpus-proven here; design evidence begins 2008 and filing year 2007 is NOT evidenced NOT CLAIMED -- SPAN: test_every_modelo_revision_span_is_corpus_proven reports 0 comparable bundled design year(s) inside this revision's claimed span, so AEAT's published record designs do not evidence the record layout for the years this revision covers; closing that gap needs AEAT acquisition and is NOT something this review does. Stated because it is not a discriminator: 60 of the 80 revisions stamped before 2026-08-21 carry the same flag and none of them name it."
reviewed_at = 2026-08-21

[revisions."2007-y-siguientes".family_dispositions.deadline_windows]
reason = "Orden EHA/3851/2007 art. 1 approves the modelo and then delegates the timing in full: el lugar, plazo y forma de presentacion del modelo 576, asi como su ingreso, se regiran por lo dispuesto en la Orden EHA/1981/2005, de 21 de junio. The IEDMT autoliquidacion is triggered by the matriculacion or the first definitive use of the medio de transporte, so its plazo is anchored to that EVENT rather than to the calendar and no recurring window exists to declare. Orden EHA/1981/2005 is not bundled in this corpus, so the concrete period is cited by delegation through the bundled article rather than reproduced here; declaring windows would require inventing dates this registry cannot evidence."
legal_refs = [
    "orden-eha-3851-2007:art-1",
]
source_refs = [
    "enrolled-modelo-576-procedure",
    "enrolled-modelo-576-layout",
]

[revisions."2007-y-siguientes".family_dispositions.casilla_continuidad_evolutions]
reason = """
CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2007-y-siguientes' of modelo 576 has no strictly-earlier sibling revision of this modelo (valid_from 2007-01-01 precedes every other declared revision), so it cannot be the landing point of any within-modelo continuity \
transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."""
legal_refs = [
    "orden-eha-3851-2007:art-1",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-576-procedure",
    "enrolled-modelo-576-layout",
]
