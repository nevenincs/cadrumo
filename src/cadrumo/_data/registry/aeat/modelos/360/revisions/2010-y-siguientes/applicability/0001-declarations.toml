# The profile's entity type and IVA regime alone cannot establish whether a
# particular optional refund request qualifies. The exclusion preserves that
# uncertainty for all supported entity types without asserting a 303 bar.
[[revisions."2010-y-siguientes".applicability]]
id = "modelo-360-no-establecido"
applicable_entity_types = ["natural_person", "legal_entity", "attribution_entity"]
applicable_reason = "Modelo 360: solicitud de devolución de IVA soportado fuera del territorio de establecimiento del empresario o profesional."
not_applicable_reason = "Modelo 360: no se ha establecido que el solicitante cumpla las condiciones de esta solicitud de devolución."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]

[[revisions."2010-y-siguientes".applicability.exclusions]]
id = "modelo-360-solicitud-sin-determinar"
outcome = "incomplete"
entity_types = ["natural_person", "legal_entity", "attribution_entity"]
reason = "Modelo 360: el perfil no determina si existe una solicitud de devolución ni si cumple sus condiciones. Los empresarios establecidos en el territorio de aplicación del IVA pueden solicitar la devolución del IVA soportado en otros Estados miembros; los establecidos en Canarias, Ceuta o Melilla también pueden solicitar la devolución del IVA soportado en dicho territorio. Revisa las condiciones de la solicitud concreta. La ventana 0A corresponde al año completo; las solicitudes de períodos más cortos tienen su propio inicio de plazo y no están cubiertas por esa ventana."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
