# -----------------------------------------------------------------------------
# Refund operation row-producer bindings (Orden EHA/789/2010 Anexo tipo 2).
# Each row carries: member_state, operation_kind, operation_date, supplier
# tax id, refund amount.
# -----------------------------------------------------------------------------
# Modelo 360 repeated-slot bindings.
#
# Authored from the bundled diseno de registro: every id carries the exact
# byte range the design prints for that slot, so an export map claims each
# anchor by span rather than by name matching. AEAT itself declares the
# repetition, printing activity slots 2-10 as "Igual campo 44/45/46".
# Modelo 360 `Pag. 2` operation-block bindings.
#
# Two operation blocks, each with its invoice header, ten bienes-y-servicios
# triples and its supplier. Every id carries the exact byte range the design
# prints, so the export map claims each anchor by span. AEAT declares the
# repetition itself, printing slots 2-10 as "Igual campo 8/9/10".

