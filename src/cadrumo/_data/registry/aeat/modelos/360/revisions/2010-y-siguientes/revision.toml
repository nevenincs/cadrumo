[revisions."2010-y-siguientes".family_dispositions.credit_reconciliation]
reason = """
The credit reconciliation declares, for each Modelo 100 casilla that credits IRPF withholding suffered against the declarant's own cuota (LIRPF art. 99), which source supplies the credit and which sources cross-check it. This modelo has no box crediting IRPF withholding suffered, so there is no credit casilla for an entry to name."""
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure", "boe-modelo-360-2010-form"]

[revisions."2010-y-siguientes".family_dispositions.prevision_social_placements]
reason = """
The pension contribution placement declares, for each Modelo 345 clave and subclave a contribution certificate states, the Modelo 100 casilla of the reduction for contributions to social-welfare systems it reaches (LIRPF arts. 51 and 52). This modelo is not the annual Renta return and declares no casilla of that reduction, so there is no contribution for an entry to place."""
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure", "boe-modelo-360-2010-form"]

[revisions."2010-y-siguientes".family_dispositions.projection_endpoints]
reason = """
A projection endpoint's projection_ref accepts only FilingProjectionRef, which is a CLOSED discriminated union in cadrumo.core whose every member is an m303_ engine-computed IVA fact. No declaration naming this modelo's own rows can validate against it, so the family is empty by construction rather than by omission -- the same structural reading modelo 131 already records for its own repeating rows. Nor does this modelo repeat a record: the diseno lays the solicitud's operations out as fixed numbered \nslots on its second page record, and each slot position is an operator-entered manual casilla, so no repeated row needs a projection endpoint."""
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]
[revisions."2010-y-siguientes".family_dispositions.bindings]
reason = "A binding resolves a casilla's value from a declared source, and only a BOUND casilla requires one. This solicitud's values are entered for the specific refund request, including the claimant's activity, annexes and invoices. Each design position is a manual casilla, so no ledger, profile or earlier-filing source is declared for any of them."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]

[revisions."2010-y-siguientes".family_dispositions.dependency_classifications]
reason = """
Modelo 360 is a refund request. An empresario o profesional established in the Spanish VAT territory may request VAT incurred in other Member States; an applicant established in Canarias, Ceuta or Melilla may also request VAT incurred in that territory. Filing Modelo 303 does not by itself exclude this request. No earlier or enclosing source modelo dependency has been declared for this request, so there is no source modelo for the clean-state gate to reason about."""
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]


[revisions."2010-y-siguientes".family_dispositions.extraction_profiles]
reason = "The application's surface for modelo 360 is an operator-entered refund request, and no inbound parser for a 360 artefact exists to name. Empty by the application's surface rather than omitted."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]

[revisions."2010-y-siguientes".family_dispositions.formulas]
reason = "Modelo 360 computes nothing: every casilla is an operator-entered per-request value, and no casilla declares a formula or a computed input kind. The formula family is empty by the modelo's calculation shape rather than omitted."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]

[revisions."2010-y-siguientes".family_dispositions.verification_expectations]
reason = "A verification expectation reconciles a FILED return against this application's engine. Modelo 360's refund requests carry only the operator's own entered values with no engine-computed figures to reconcile, and the application holds no reconciliation surface for the refund justificante. The family is empty until such a surface is authored, not by omission."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]

[revisions."2010-y-siguientes".family_dispositions.verification_predicates]
reason = "A verification predicate guards a CALCULATED result. Modelo 360 calculates nothing: zero formulas, no computed casilla, and every figure is the operator's recorded value. The under-declaration risk these guard does not arise from an engine computation."
legal_refs = ["ley-37-1992:art-117-bis", "orden-eha-789-2010:art-1", "orden-eha-789-2010:art-4"]
source_refs = ["aeat-dr-360-2010", "aeat-modelo-360-procedure"]
