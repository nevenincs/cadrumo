# Per art 4 the plazo concludes on 30 September of the following year. The
# representative deadline window models that closure date for the 2024 and
# 2025 ejercicios; the opens_on captures the day after the period closes
# (Jan 1 of the year following the ejercicio).
# 2022, 2023 and 2026 added 2026-09-12: open-ended from 2010 with windows only
# for 2024 and 2025. Same art 4 closure quoted above -- 30 September of the
# following year, opening the day after the ejercicio closes.
