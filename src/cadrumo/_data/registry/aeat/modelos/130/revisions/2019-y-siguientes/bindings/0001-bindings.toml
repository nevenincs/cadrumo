# AEAT Modelo 130 instructions, casilla 15: same-ejercicio prior-quarter
# negative-result carry-forward under the RD 439/2007 art. 110 pago
# fraccionado framework. The selector declares
# `source_period_offset_from_target = -1` (prior period) with
# `max_year_delta = 0` (no cross-ejercicio reach): 2T pulls from
# 1T, 3T from 2T, 4T from 3T; 1T produces no anchor (absent-by-
# design) because AEAT's rule restricts carry-forward to prior
# trimestres within the same ejercicio. Casilla 15 at 1T is
# materialised as Decimal("0") through the absent-by-design path
# with provenance marker on the resulting CasillaObservation.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-resultados-negativos-anteriores"
source = "previous_filing"
selector = { source_modelo = "130", source_casilla_id = "saldo-negativo-fin-periodo", source_period_offset_from_target = -1, max_year_delta = 0 }
aggregation = { op = "copy" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-modelo-130-instructions"]

[[revisions."2019-y-siguientes".bindings.source_citations]]
source_ref = "aeat-modelo-130-instructions"
required_text = [
    "importe (sin signo) de los resultados negativos",
    "cualquiera de las autoliquidaciones anteriores",
    "no hubieran sido deducidos anteriormente",
    "en ningún caso podrá figurar en la casilla 15 un importe superior",
]

# AEAT Modelo 130 instrucciones, casilla 05 ("Pagos fraccionados
# anteriores"): the same-ejercicio carry of prior-quarter payments.
# Verbatim rule: "la suma de las cantidades positivas consignadas en la
# casilla 07 ... correspondientes a los trimestres anteriores del mismo
# ejercicio, minorada en el importe de la suma de las cantidades
# consignadas en la casilla 16 ... No se computaran las cantidades
# negativas consignadas en la casilla 07". The selector enumerates every
# same-ejercicio quarter strictly preceding the target
# (prior_quarter_expanding_span; 2T->{1T}, 3T->{1T,2T}, 4T->{1T,2T,3T},
# 1T->empty/absent-by-design), bounded by max_year_delta = 0. The
# prior_pagos_fraccionados aggregation computes
# SUM max(0, casilla 07_q) - SUM casilla 16_q over those quarters: the
# per-quarter positive-part (a negative prior 07 contributes 0) and any
# observed casilla-16 minoracion. The registry presence policy requires 07;
# an absent 16 is treated as zero and surfaced by the application advisory.
# Casilla 07 = 04 - 05 - 06 reads the populated casilla 05 unchanged.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-pagos-fraccionados-anteriores"
source = "previous_filing"
selector = { source_modelo = "130", source_casilla_ids = ["07", "16"], required_source_casilla_ids = ["07"], prior_quarter_expanding_span = true, max_year_delta = 0 }
aggregation = { op = "prior_pagos_fraccionados" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-modelo-130-instructions"]

[[revisions."2019-y-siguientes".bindings.source_citations]]
source_ref = "aeat-modelo-130-instructions"
required_text = [
    "suma de las cantidades positivas consignadas en la casilla 07",
    "minorada en el importe de la suma de las cantidades consignadas en la casilla 16",
    "No se computaran las cantidades negativas consignadas en la casilla 07",
]
