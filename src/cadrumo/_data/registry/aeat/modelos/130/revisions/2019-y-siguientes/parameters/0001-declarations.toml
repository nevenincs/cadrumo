# RIRPF art. 30.2.ª: the provisiones deducibles and gastos de difícil justificación of
# the simplified modality are "el porcentaje del 5 por ciento sobre el rendimiento
# neto, excluido este concepto". LIRPF disposición adicional quincuagésima sexta
# (Ley 31/2022, art. 60.2) sets that percentage "durante el período impositivo 2023,
# del 7 por ciento"; the article's 5 per cent governs every other year.
