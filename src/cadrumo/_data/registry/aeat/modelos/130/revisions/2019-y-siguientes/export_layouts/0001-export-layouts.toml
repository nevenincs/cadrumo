# Modelo 130 -- IRPF pago fraccionado, estimacion directa -- fichero BOE.
#
# Transcribed position by position from the bundled AEAT Diseno de Registros
# cited in source_refs. Every offset and length below is read from that file;
# none is derived, inferred or rounded.
#
# Six money positions are declared signed because AEAT types them 'N' rather
# than 'Num': [03], [07], [11], [14], [17] and [19], each of which is a
# subtraction that can legitimately go negative.
#
# Two positions of the file envelope are deliberately left unwritten: AEAT's
# 'Version del Programa' (ordinal 9) and 'NIF Empresa Desarrollo' (ordinal 11)
# are its Nota 1 slots, to be filled by the entidad desarrolladora del software.
# No such identity is declared anywhere in this project, so writing either one
# would be inventing it. Modelo 131 leaves the same two slots unwritten.

[[revisions."2019-y-siguientes".export_layouts]]
id = "modelo-130-fichero-boe"
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-dr-130-2019-v12"]

