# RIRPF art. 30.2.ª, for the simplified modality only: the percentage of the year-to-date
# net income "excluido este concepto" (box 01 less the other deductible expenses and
# amortizations), never below zero when that income is negative, and at most the
# 2.000 euros annual cap. The normal modality has no such provision.
[[revisions."2019-y-siguientes".formulas]]
id = "modelo-130-provisiones-gastos-dificil-justificacion"
target_casilla_id = "provisiones-gastos-dificil-justificacion"
expression = { op = "if_then_else", args = [
    { op = "text_equal", args = [
        { binding = "modelo-130-estimacion-directa-modalidad" },
        { text_literal = "directa_simplificada" },
    ] },
    { op = "min", args = [
        { op = "max", args = [
            { op = "percent", args = [
                { op = "subtract", args = [
                    { casilla_id = "01" },
                    { casilla_id = "gastos-deducibles-previos" },
                ] },
                { parameter = "irpf.art-30-2-provision-rate" },
            ] },
            { literal = "0" },
        ] },
        { parameter = "irpf.art-30-2-provision-annual-cap" },
    ] },
    { literal = "0" },
] }
rounding = "money-2"
legal_refs = ["rd-439-2007:art-30", "ley-35-2006:art-30", "ley-35-2006:da-56", "rd-439-2007:art-110"]
