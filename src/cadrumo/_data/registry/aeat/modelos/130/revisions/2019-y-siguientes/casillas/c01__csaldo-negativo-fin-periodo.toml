data_type = "money"
semantic_role = "irpf_pf_gastos"
required = true
input_kind = "bound"
binding = "modelo-130-actividad-economica-gastos-cumulative"
# Pago-fraccionado computation provision (art-110) plus the LIRPF articles that
# ESTABLISH deductible gastos in estimación directa: art-28 (reglas generales)
# and art-30 (estimación directa, gastos fiscalmente deducibles).
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95", "ley-35-2006:art-28", "ley-35-2006:art-30"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]
export_refs = ["modelo-130-casilla-02"]

[[revisions."2019-y-siguientes".casillas]]
id = "03"
number = "03"
section = ["actividades_economicas_estimacion_directa"]
data_type = "money"
semantic_role = "irpf_pf_rendimiento_neto"
required = false
# Per AEAT M130 Instrucciones, Casilla 03 = Casilla 01 - Casilla 02
# (ingresos - gastos = rendimiento neto). The binding
# `modelo-130-actividad-economica-rendimiento-neto-cumulative` populates
# casilla 01 (target_casilla_id = "01") from the renta-ledger; casilla 03
# is the simple subtraction of the two operator-visible casillas.
# Computed (not bound) so manual-filing operators who supply casillas
# 01 and 02 directly get casilla 03 without requiring an active
# renta-ledger aggregation source.
input_kind = "computed"
formula = "modelo-130-rendimiento-neto"
# Rendimiento neto = ingresos - gastos: art-110 (pago-fraccionado base) plus the
# LIRPF establishing articles art-28 (reglas generales) and art-30 (estimación
# directa).
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95", "ley-35-2006:art-28", "ley-35-2006:art-30"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]
export_refs = ["modelo-130-casilla-03"]

