# -----------------------------------------------------------------------------
# Prior-quarter negative-result carry-forward. AEAT Modelo 130 instructions
# define the casilla 15 same-ejercicio carry under the RD 439/2007 art. 110
# pago fraccionado framework. When a quarter's "Diferencia" (casilla 17) is
# negative, the absolute value is carried forward as a deductible casilla 15
# in the following quarter within the same ejercicio. The
# saldo-negativo-fin-periodo casilla exposes that carry-forward seed; casilla
# 15 picks it up via a previous_filing binding stamped by the resolver from
# the prior quarter.
# -----------------------------------------------------------------------------
export_refs = ["modelo-130-casilla-19"]

