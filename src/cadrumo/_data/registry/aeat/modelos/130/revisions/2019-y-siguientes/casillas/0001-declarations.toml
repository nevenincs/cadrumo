# The instructions put into box 02 the deductible expenses and amortizations of
# the year to date and, for the simplified modality, the provisiones deducibles
# and gastos de difícil justificación of RIRPF art. 30.2.ª for the same span.
input_kind = "computed"
formula = "modelo-130-gastos"
# Pago-fraccionado computation provision (art-110) plus the LIRPF articles that
# ESTABLISH deductible gastos in estimación directa: art-28 (reglas generales)
# and art-30 (estimación directa, gastos fiscalmente deducibles).
