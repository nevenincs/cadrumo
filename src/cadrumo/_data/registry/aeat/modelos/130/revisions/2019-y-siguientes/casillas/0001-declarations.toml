constraints = { sign = "non_negative", legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"] }
# Same-ejercicio carry of prior-quarter pagos fraccionados (AEAT
# instrucciones casilla 05): SUM max(0, prior casilla 07_q) - SUM prior
# casilla 16_q over the trimestres anteriores del mismo ejercicio. Bound
# via the prior_quarter_expanding_span previous_filing binding; at 1T the
# span is empty and casilla 05 materialises Decimal(0) absent-by-design.
input_kind = "bound"
binding = "modelo-130-pagos-fraccionados-anteriores"
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]

