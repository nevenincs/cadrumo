# -----------------------------------------------------------------------------
# Prior-quarter negative-result carry-forward. AEAT Modelo 130 instructions
# define the casilla 15 same-ejercicio carry under the RD 439/2007 art. 110
# pago fraccionado framework. A negative casilla 19 stays deductible in any
# later quarter of the same ejercicio until casilla 15 has used it; the
# previous_filing binding folds those boxes over every earlier quarter. The
# saldo-negativo-fin-periodo casilla reports the balance left at period end.
# -----------------------------------------------------------------------------

[[revisions."2019-y-siguientes".casillas]]
id = "saldo-negativo-fin-periodo"
number = "saldo-negativo-fin-periodo"
section = ["computed_carry_forward"]
semantic_role = "irpf_pf_saldo_negativo_fin_periodo"
input_kind = "computed"
formula = "modelo-130-saldo-negativo-fin-periodo"
constraints = { sign = "non_negative", legal_refs = ["rd-439-2007:art-110"], source_refs = ["aeat-modelo-130-instructions"] }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
