# Exhaustive reconcile-when-present verification for Modelo 130
# revision 2019-y-siguientes: every computed casilla not enrolled in the
# coverage-gated contract is value-reconciled against the engine WHEN
# the filing prints it (a filed-vs-computed divergence surfaces a
# discrepancy), but is EXCLUDED from the coverage denominator, so
# enrolling a situational casilla never lowers coverage or flips a
# legitimate filing's verdict (min_coverage = 0). Grounded in the
# revision's AEAT DR / framework-law refs (reused from modelo-130-calculation-verification).
[[revisions."2019-y-siguientes".verification_expectations]]
id = "modelo-130-2019-y-siguientes-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "15",
    "saldo-negativo-fin-periodo",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]
