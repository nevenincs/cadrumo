# M130 layout: each row prints the label text, then the box number at x0~464 (right column),
# then the monetary value at x0~533-545 on the same y-row.  Box numbers also appear inline
# in formula text at x0~109-200, so anchor_x_min/anchor_x_max constrain the search to the
# right-column zone only.  Casillas not filled in a given filing are absent (zero or
# not-applicable).  Every generated 2021-2024 quarterly corpus filing covers 2/19
# targets, so the floor preserves that shape while rejecting no hits.
