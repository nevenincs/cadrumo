# computables" (AEAT M130 instructions). IVA repercutido is collected on
# behalf of Hacienda and is NOT fiscally computable income, so a
# transaction that carries an explicit IVA tagging contributes its
# IVA-exclusive base imponible (taxable_base); only an untagged
# transaction (no declared base) falls back to its gross transfer
