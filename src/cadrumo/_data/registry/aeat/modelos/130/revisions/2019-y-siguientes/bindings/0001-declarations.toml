# AEAT Modelo 130 instrucciones, casilla 05 ("Pagos fraccionados
# anteriores"): the same-ejercicio carry of prior-quarter payments.
# Verbatim rule: "la suma de las cantidades positivas consignadas en la
# casilla 07 ... correspondientes a los trimestres anteriores del mismo
# ejercicio, minorada en el importe de la suma de las cantidades
# consignadas en la casilla 16 ... No se computaran las cantidades
# negativas consignadas en la casilla 07". The selector enumerates every
# same-ejercicio quarter strictly preceding the target
# (prior_quarter_expanding_span; 2T->{1T}, 3T->{1T,2T}, 4T->{1T,2T,3T},
# 1T->empty/absent-by-design), bounded by max_year_delta = 0. The
# prior_pagos_fraccionados aggregation computes
# SUM max(0, casilla 07_q) - SUM casilla 16_q over those quarters: the
# per-quarter positive-part (a negative prior 07 contributes 0) and any
# observed casilla-16 minoracion. The registry presence policy requires 07;
# an absent 16 is treated as zero and surfaced by the application advisory.
# Casilla 07 = 04 - 05 - 06 reads the populated casilla 05 unchanged.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-pagos-fraccionados-anteriores"
provider = { kind = "previous_filing", source_modelo = "130", source_casilla_ids = ["07", "16"], required_source_casilla_ids = ["07"], temporal = { kind = "prior_quarter_expanding_span" } }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "prior_pagos_fraccionados" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]

