# NOTE ON `target_casilla_id = "01"` BELOW — read this before "fixing" it to "06".
# This field is doing double duty and reads as a contradiction against the
# `required_text` two lines down (which cites "Casilla 06"). It is not a typo.
# `target_casilla_id` here is the OBSERVATION-MATCH KEY, not the output casilla:
# `_renta_income_build_matcher` (domain/calculations/registry/_ledger_bindings.py)
# selects observations by `observation.target_casilla_id == selector.target_casilla_id`,
# and every RentaIncomeObservation is constructed with target_casilla_id="01" (the
# income casilla) regardless of which fact a binding reads off it. Retargeting this
# selector to "06" does not redirect the aggregate to casilla 06 -- it empties the
# match entirely (no observation is ever built with target_casilla_id="06"),
# silently resolving this binding to 0. Retargeting to "06" also fails registry-build
# validation outright, since `_RENTA_130_INCOME_CASILLAS`
# (the allowed-target set for this whole binding family) is {"01", "03"} and does
# not include "06".
#
# The actual output casilla (06, per the required_text below) is set separately, in
# application code: `_m130_retenciones_backend_inputs` in
# application/aggregation/_modelo_bindings.py reads this binding's resolved value by
# id and writes it to casilla 06 directly, bypassing the registry's normal
# casilla-to-binding wiring. That function asserts casilla 06 is a real
# casilla on the M130 revision before writing to it (a snapshot cross-check) rather
# than trusting the hardcoded constant blindly. A schema field expressing "match on
# X's observations, output to Y's casilla" would reopen the cross-domain
# routing-table design, which needs a superseding decision, not an
# implementation-choice workaround.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-actividad-economica-retenciones-cumulative"
provider = { kind = "ledger_renta_income_aggregation", modelo = "130", target_casilla_id = "01", fact = "declared_withheld_amount_sum" }
applicability = { kind = "non_calculation", reason = "application_calculation_handoff", consumed_by = "governed fact m130-retenciones-output-routing, which writes this value to casilla 06" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95", "ley-35-2006:art-14", "rd-439-2007:art-7", "rd-439-2007:art-79"]
# Filing grade. Each row's retencion follows the income it was practised on into
# the period the declared RIRPF art. 7 criterion imputes that income to (LIRPF
# art. 14.1.b; RIRPF art. 79), and an unknown criterion or accrual date leaves the
# value unresolved. The window runs from the first day of the year to the last day
# of the quarter, and the deduction is of the retenciones "practicadas" (RIRPF art.
# 110.3.a), so a retencion paid after the quarter's last day waits for the quarter
# it was paid in and is reported, never credited early (TEAC 00/03187/2011). A
# rental activity's retencion is kept (RIRPF art. 110.3.a.2.o).
#
# The operator ruled this promotion on 2026-11-02, once the resolver held those
# properties and the Modelo 100 credit 0599 was cross-checked against this
# casilla of the fourth quarter.

[[revisions."2019-y-siguientes".bindings.source_citations]]
source_ref = "aeat-modelo-130-instructions"
required_text = [
    "Casilla 06.",
    "Suma de las retenciones e ingresos a cuenta soportados",
    "correspondientes al período comprendido entre el primer día del año y el último día del trimestre a que se refiere el pago fraccionado",
]
# Casilla 02 — "Gastos" (AEAT M130 instructions): the deductible business
# expenses (gastos fiscalmente deducibles) accumulated from the start of the
# fiscal year through the end of the declared quarter: the expense side of the
# estimación directa rendimiento neto (ingresos - gastos) per RD 439/2007
# art. 110.2. It feeds the working figure gastos-deducibles-previos, to which
# box 02 adds the simplified-modality provision of RIRPF art. 30.2.ª. IVA soportado is recovered through Modelo 303 and is NOT a Renta
# gasto, so each transaction contributes its IVA-exclusive base imponible
# (taxable_base); an untagged transaction is surfaced (MISSING_TAXABLE_BASE)
# rather than gross-folded. Resolved by the ledger_renta_gastos_pago_fraccionado_aggregation
# source — the OUTGOING sibling of modelo-130-actividad-economica-ingresos-
# cumulative — over the same cumulative year-to-date quarterly window.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-actividad-economica-gastos-cumulative"
provider = { kind = "ledger_renta_gastos_pago_fraccionado_aggregation", modelo = "130", target_casilla_id = "gastos-deducibles-previos", fact = "deductible_amount_sum" }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "sum" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95", "ley-35-2006:art-28", "ley-35-2006:art-30"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]

