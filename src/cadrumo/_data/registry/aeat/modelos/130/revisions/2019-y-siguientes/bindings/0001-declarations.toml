# AEAT Modelo 130 instructions, casilla 15: the negative results of casilla 19 "de
# cualquiera de las autoliquidaciones anteriores [...] del mismo ejercicio y que no
# hubieran sido deducidos anteriormente". The selector enumerates every same-ejercicio
# quarter strictly preceding the target, and the fold computes
# SUM max(0, -casilla 19_q) - SUM casilla 15_q over them. Both casillas are read from
# what each filing prints, and a quarter never observed leaves the carry unresolved
# rather than short. 1T has no earlier quarter (absent by design), which casilla 15
# materialises as zero with a provenance marker.
[[revisions."2019-y-siguientes".bindings]]
id = "modelo-130-resultados-negativos-anteriores"
provider = { kind = "previous_filing", source_modelo = "130", source_casilla_ids = ["19", "15"], required_source_casilla_ids = ["19"], temporal = { kind = "prior_quarter_expanding_span" } }
value = { data_type = "money", channel = "decimal" }
aggregation = { op = "prior_negative_results_undeducted" }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]

[[revisions."2019-y-siguientes".bindings.source_citations]]
