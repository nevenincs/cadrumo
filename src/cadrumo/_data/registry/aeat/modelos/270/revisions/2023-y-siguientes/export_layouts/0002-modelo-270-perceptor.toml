# Modelo 270 fichero BOE — registro de perceptor (tipo 2), 500 positions.
#
# Every field below is transcribed from the bundled AEAT Diseño de Registro
# aeat-dr-270-2023, record "Tipo 2 - Registro de Perceptor". The design
# declares 23 campos whose lengths sum to exactly 500 with no holes
# (1+3+4+9+9+9+40+40+1+1+2+8+8+15+15+15+1+251+20+8+37+2+1 = 500); all 23 are
# declared here, at the design's own (posición, longitud) coordinates.

