[[revisions."2023-2024".export_layouts.records.fields]]
id = "modelo-270-decl-nif"
offset = 9
length = 9
kind = "header"
producer_key = "presenter.tax_id"
# A NIF always exactly fills its 9-byte slot, so left_zero would never pad a
# present value while its parse side would strip leading "0" characters from a
# low-numbered DNI and corrupt the identifier. padding none + justification
# none renders identically for every full-width value.
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hap-2368-2013:art-1", "ley-35-2006:da-33", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-270-2023"]

[[revisions."2023-2024".export_layouts.records.fields]]
id = "modelo-270-decl-razon-social"
offset = 18
length = 40
kind = "header"
# The design names this slot "DENOMINACION O RAZON SOCIAL DEL DECLARANTE" and
# admits nothing else: "se consignara la denominacion o razon social completa,
# sin anagrama ... En ningun caso podra figurar en este campo un nombre
# comercial". taxpayer.legal_name is exactly that fact. taxpayer.full_name is
# NOT substitutable here: it composes surnames-first for a natural person,
# which this slot does not admit. Every Modelo 270 declarant is an entity
# obliged to withhold under LIRPF DA 33, so legal_name is the populated fact
# for the whole declarant population.
producer_key = "taxpayer.legal_name"
data_type = "text"
required = true
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-hap-2368-2013:art-1", "ley-35-2006:da-33", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-270-2023"]

[[revisions."2023-2024".export_layouts.records.fields]]
id = "modelo-270-decl-tipo-soporte"
offset = 58
length = 1
kind = "literal"
# The design admits exactly one clave: "Se cumplimentara: 'T': transmision
# telematica." Cadrumo emits a file for telematic presentation, so "T" is the
# only value this producer can correctly write.
literal = "T"
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hap-2368-2013:art-1", "ley-35-2006:da-33", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-270-2023"]

# Design campo 7 @59+49 is declared as the two data AEAT's own prose names
# inside it -- 59-67 TELEFONO and 68-107 APELLIDOS Y NOMBRE. The coverage gate
# measures byte extent rather than (offset, length) identity, so the design's
# grouping and the layout's do not have to agree; writing the two real facts
# beats writing one 49-byte blank.
