# Modelo 270 fichero BOE — registro de declarante (tipo 1), 500 positions.
#
# Every field below is transcribed from the bundled AEAT Diseño de Registro
# aeat-dr-270-2023, record "Tipo 1 - Registro de Declarante". The design
# declares 16 campos whose lengths sum to exactly 500 with no holes
# (1+3+4+9+40+1+49+13+2+13+2+9+17+17+17+303 = 500); all 16 are declared here,
# at the design's own (posición, longitud) coordinates.

[[revisions."2023-2024".export_layouts]]
id = "modelo-270-fichero-boe"

