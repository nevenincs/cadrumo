review_status = "agent_reviewed"
reviewed_by = """\
agent: BOE-A-2023-24414 art 2 (ocho/nueve) and its final provision govern the \
PERIODO addition, shifted Type 1 summary, and 2023--2024 applicability. The \
ordinary annual surface selects only 0A: its special SELAE/ONCE convention routes \
are not model-specific selectors and must not be inferred as supported monthly \
Modelo 270 filings. The era is OPEN-ENDED from 2023. Orden HAC/1431/2025 art 3 is the only later amendment and it \
rewrites ONLY four province ROTULOS (03 ALICANTE/ALACANT, 12 CASTELLON/CASTELLO, 20 \
GUIPUZCOA/GIPUZKOA, 48 VIZCAYA/BIZKAIA) inside CODIGO DE PROVINCIA; the article itself names \
the field's positions 118-119 of tipo de registro 2 WITHOUT altering them, so the \
record-design geometry is unchanged and nothing about this layout is extrapolated. This \
registry models that field as the two-digit numeric code (length 2), never the rotulo, so the \
amendment changes no modelled value. Corroborated against AEAT's diseno-de-registro pages \
captured 2026-08-26, which still publish the 2023 design as CURRENT -- AEAT reissued a design \
for modelo 347 under this same orden and did NOT for modelo 270. Its df unica applies the \
orden "por primera vez ... al ejercicio 2025 y siguientes", so 2025 is governed here."""
reviewed_at = 2026-08-30

