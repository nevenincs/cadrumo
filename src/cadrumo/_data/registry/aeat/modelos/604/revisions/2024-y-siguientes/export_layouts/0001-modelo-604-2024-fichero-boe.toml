# Modelo 604 fichero BOE fixed-width layout for the 2024 era, transcribed
# position-by-position from aeat-dr-604-2024 (03-604-ejercicio-2024.xlsx,
# sha256 98f7022a391e822ee2c57b6e2b1f873fd2bcc8db80a5b692fd7c6fae1e758f68).
# Three records, each tiling its declared extent exactly once with no gap and
# no overlap: Pag. 0 envelope 1..328, Pag. 1 1..1000, Pag. 2 1..700.
#
# The three "(**) A cumplimentar por las entidades desarrolladoras (EEDD)" slots
# in the Pag. 0 envelope -- @53+1 idioma, @93+4 version del programa, @101+9 NIF
# Empresa Desarrollo -- identify the SOFTWARE HOUSE that produced the file, not
# the presenter and not the taxpayer. Modelo 390 writes presenter.tax_id at
# @101+9; that is a known DEFECT, not a precedent, and is not copied here.
# @101+9 is left unwritten (see below) and @93+4 is filler pending a ruling on
# whether these slots can carry a real runtime-supplied identity at all.
