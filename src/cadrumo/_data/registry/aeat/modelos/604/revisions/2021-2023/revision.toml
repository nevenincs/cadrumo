[revisions."2021-2023"]
authority_grade = "applicability"
# Modelo 604 autoliquidacion del Impuesto sobre las Transacciones Financieras,
# approved by orden-hac-510-2021 art 1, plazo grounded in orden-hac-510-2021 art 3.
#
# ERA SPLIT (this revision covers 2021-2023 ONLY). AEAT binds two different
# record designs to two disjoint spans of what was previously a single
# '2021-y-siguientes' revision: aeat-dr-604-2021 (applies_to 2023-12-31) and
# aeat-dr-604-2024. They contradict each other at the same byte coordinates --
# @701+18 is "A deducir [06]" here and "Diferencia ([02]-[04]) [08]" in 2024,
# @719+18 is "Resultado de la autoliquidacion [07]" here and "Cuota atribuible
# a la Administracion del Estado [09]" in 2024 -- and the 2024 design adds an
# entire Pag. 2 this era does not have. One revision cannot carry both shapes,
# so the eras are separate revisions and each cites only its own design.
#
# NO export layout is declared here: the 2021-2023 record design has not been
# transcribed. That is an absent capability honestly reported by the
# export-layout gate, NOT an exemption. The design is bundled and verified
# (aeat-dr-604-2021, sha256 262e743d...), so the work is available to whoever
# takes it: 2 records, 67 rows, 61 required positions, Pag. 0 tiling 1..328 and
# Pag. 1 tiling 1..900.
#
# No deadline_windows and no deadline application link: the only windows this
# modelo ever declared were the twelve 2025 monthly windows, which belong to
# the 2024-y-siguientes revision. No window is fabricated for a past year.
id = "2021-2023"
valid_from = 2021-01-01
valid_to = 2023-12-31
period_selector = { year_from = 2021, year_to = 2023, periods = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
orden_aplicabilidad = ["orden-hac-510-2021:art-1"]
legal_refs = [
    "orden-hac-510-2021:art-1",
    "orden-hac-510-2021:art-3",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-604-procedure",
    "aeat-dr-604-2021",
]


[revisions."2021-2023".family_dispositions.casilla_continuidad_evolutions]
reason = "CasillaContinuidadEvolutionDefinition requires from_revision != to_revision -- it declares a transition between two revisions of the same modelo, and every evolution already declared anywhere in this registry is authored on the revision it lands on (its to_revision). Revision '2021-2023' of modelo 604 has no strictly-earlier sibling revision of this modelo (valid_from 2021-01-01 precedes every other declared revision of modelo 604), so it cannot be the landing point of any within-modelo continuity transition; the casilla_continuidad_evolutions family is empty by construction, not by omission."
legal_refs = [
    "orden-hac-510-2021:art-1",
    "orden-hac-510-2021:art-3",
    "ley-58-2003:art-93",
]
source_refs = [
    "enrolled-modelo-604-procedure",
    "aeat-dr-604-2021",
]
