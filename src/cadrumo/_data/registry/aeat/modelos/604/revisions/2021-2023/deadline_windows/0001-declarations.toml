# Modelo 604 monthly deadline windows for the 2021-2023 era.
#
# Two provisions govern this span, not one. The general rule is
# orden-hac-510-2021 art 3: the modelo "deberá presentarse e ingresarse ...
# entre los días diez y veinte del mes siguiente al correspondiente periodo de
# liquidación mensual", the period being the mes natural (Ley 5/2020 art 8.3).
#
# But the orden was published 27 May 2021, AFTER the first four liquidation
# periods of the tax had already closed, so art 3 cannot have governed them.
# Its disposición transitoria única supplies the rule that did: "la presentación
# de las autoliquidaciones correspondientes a los meses de enero, febrero, marzo
# y abril de 2021 ... se efectuará en el plazo para la presentación e ingreso de
# la autoliquidación correspondiente al mes de mayo de 2021". The plazo for the
# mayo-2021 autoliquidación is, by art 3, the 10th to the 20th of the following
# month. Periods 2021-01 through 2021-05 therefore share ONE window, 10-20 June
# 2021, and only 2021-06 onward follows the plain monthly cadence.
#
# Generating twelve ordinary windows for 2021 would have fabricated five
# deadlines AEAT never set. Every date below is NOMINAL per the storage rule;
# shift_deadline applies any weekend or holiday movement at read time.

[[revisions."2021-2023".deadline_windows]]
id = "modelo-604-2021-01"
filing_year = 2021
period = "2021 01"
period_kind = "monthly"
opens_on = 2021-06-10
closes_on = 2021-06-20
legal_refs = ["orden-hac-510-2021:art-3", "orden-hac-510-2021:dt-unica", "ley-58-2003:art-93"]
source_refs = ["enrolled-modelo-604-procedure"]

