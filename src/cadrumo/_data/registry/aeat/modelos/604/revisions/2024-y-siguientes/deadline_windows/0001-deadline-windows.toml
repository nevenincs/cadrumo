# Modelo 604 monthly deadline windows, grounded in orden-hac-510-2021 art 3: se
# presenta e ingresa "entre los días diez y veinte del mes siguiente al
# correspondiente periodo de liquidación mensual". Each window opens the 10th and
# closes the 20th of the month following the reference month.

# THE 2024 WINDOWS WERE ADDED 2026-09-12, CLOSING A HOLE THIS CORPUS HAD ALREADY
# NAMED. The sibling 2021-2023 revision records it in its own reviewer note: this
# modelo had NO windows for 2024 at all, because that revision's span ends at 2023
# and THIS revision, which claims valid_from 2024-01-01, enumerated only 2025. It
# was reported there as a real hole and left open as outside that span. It belongs
# here.
#
# Same provision as the rows below, orden-hac-510-2021 art 3, and the ordinary
# cadence rather than an inferred one: the 2021 transitional in the sibling
# revision applies only to enero-abril 2021, and 2023 already follows the plain
# pattern row for row (2023 01 opens 2023-02-10; 2023 12 opens 2024-01-10). Each
# window opens the 10th and closes the 20th of the month after its reference
# month, December rolling into January.
#
# Dates are NOMINAL; shift_deadline applies weekend and holiday movement at read
# time.
# THE 2026 WINDOWS WERE ADDED 2026-09-12 for the same reason as the 2024 block
# above: this revision is open-ended, the supported filing span runs to 2026, and
# only 2024 and 2025 carried windows. Same orden-hac-510-2021 art 3 cadence --
# opens the 10th, closes the 20th of the month after the reference month.
