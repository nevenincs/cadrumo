# Modelo 604 monthly deadline windows, grounded in orden-hac-510-2021 art 3: se
# presenta e ingresa "entre los días diez y veinte del mes siguiente al
# correspondiente periodo de liquidación mensual". Each window opens the 10th and
# closes the 20th of the month following the reference month.

