# Modelo 604 fichero BOE fixed-width layout for the 2021-2023 era, transcribed
# position-by-position from aeat-dr-604-2021 (04-604-ejercicios-2021-a-2023.xlsx,
# sha256 262e743deecf303fd344084bd56e9497da5a7cfd6eeab5286719513f788fd550).
#
# Two records, each tiling its declared extent exactly once with no gap and no
# overlap: Pag. 0 envelope 1..328, Pag. 1 1..900.
#
# This era is NOT the 2024 one and must never share its layout. At the same byte
# coordinates the two designs mean different things: @701+18 is "A deducir [06]"
# here and "Diferencia ([02]-[04]) [08]" in 2024; @719+18 is "Resultado de la
# autoliquidacion [07]" here and "Cuota atribuible a la Administracion del Estado
# [09]" in 2024; and 2024 adds an entire Pag. 2 this era does not have. That is
# what the era split exists to keep apart.
#
# AEAT's own 2021 sheet reuses row ordinals 41, 43 and 44 twice each. Offsets stay
# contiguous, so it is a labelling defect in the published spreadsheet rather than
# a layout ambiguity; this layout is keyed on offset, never on ordinal.
#
# @93+4 (Version del Programa) and @101+9 (NIF Empresa Desarrollo) are LEFT
# UNWRITTEN, as on the 2024 sibling: AEAT marks both for the entidad
# desarrolladora -- the software house, neither the presenter nor the taxpayer.
# Modelo 390 writes presenter.tax_id at @101+9; that is a known defect and is not
# copied here.

