id = "modelo-604-2024-fichero-boe"
format = "fixed_width"
legal_refs = ["orden-hac-510-2021:art-1", "orden-hac-510-2021:art-3", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-604-2024"]

