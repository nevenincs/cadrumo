[revisions."2019-2022".family_dispositions.parameters]
reason = "A parameter holds a regulatory value a formula of this revision applies -- a rate, a threshold, a coefficient. Modelo 180 applies none. Measured on the revision itself, both of its formulas are op = 'copy' over a relation: decl.base-total copies modelo-180-rel-115-base-anual and decl.retenciones-total copies modelo-180-rel-115-retenciones-anual. A copy applies nothing to what it carries. The retencion rate governing these figures was applied by the retenedor at payment time and consumed by the quarterly modelo 115, whose casilla 03 is computed as percent(02, irpf.urban_rental_withholding_rate) -- that is where this registry holds the rate, and modelo 180 receives the already-withheld annual totals. Empty by the shape of this modelo's calculation rather than by omission."
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-hap-1732-2014:art-2", "ley-35-2006:art-101"]
