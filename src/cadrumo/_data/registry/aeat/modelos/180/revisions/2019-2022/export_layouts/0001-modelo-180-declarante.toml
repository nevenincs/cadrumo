[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-nif"
offset = 9
length = 9
kind = "header"
producer_key = "presenter.tax_id"
# A NIF is a fixed-width alphanumeric identifier that always exactly
# fills its 9-byte slot, not a zero-filled numeric quantity -- LEFT_ZERO
# never actually pads a present value here, but its parse-side _unpad
# strips leading "0" characters from a low-numbered individual DNI
# (e.g. "00012345Z" -> "12345Z"), corrupting a real identifier. padding
# none + justification none renders identically for every full-width
# value (proven by direct render comparison) and its parse side only
# strips trailing spaces, never real digits.
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-apellidos-razon-social"
offset = 18
length = 40
kind = "header"
# One slot carries "apellidos y nombre" for a persona fisica and "razon
# social" for a persona juridica, so it must read the fact that is populated
# for BOTH: full_name. surnames/given_name are blank for an entity and
# legal_name is blank for a natural person, so either would blank the slot
# for half the declarant population. The design's "primer apellido, un
# espacio, el segundo apellido, un espacio y el nombre completo,
# necesariamente en este orden" is exactly the surnames-first join
# compose_legal_full_name already performs.
producer_key = "taxpayer.full_name"
data_type = "text"
required = true
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-tipo-soporte"
offset = 58
length = 1
kind = "literal"
# The design admits exactly two claves: "C" (cinta magnetica) and "T"
# (transmision telematica). Cadrumo emits a file for telematic presentation,
# and blank is not an admitted value, so "T" is the only clave this producer
# can correctly write.
literal = "T"
data_type = "text"
required = true
padding = "none"
justification = "none"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-persona-relacion"
offset = 59
length = 49
kind = "filler"
# Design campo 7, "PERSONA CON QUIEN RELACIONARSE", subdivided by AEAT into
# 59-67 TELEFONO and 68-107 APELLIDOS Y NOMBRE. Cadrumo holds no contact-person
# fact for the presenting declarant -- no producer key carries a contact
# telephone or a contact name -- so the slot is written as the design's own
# single alfanumerico campo and left blank, which the design's global rule
# admits: "los campos alfanumericos/alfabeticos que no tengan contenido se
# rellenaran a blancos". Writing a taxpayer identity here instead would name
# the wrong person.
data_type = "text"
required = false
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-numero-identificativo"
offset = 108
length = 13
kind = "filler"
# Design campo 8. The numero identificativo is a sequential number whose first
# three digits are the code 180; it is assigned at presentation, not derived
# from the draft, and no producer key carries it. Numerico with no content is
# written to ceros per the design's global numeric rule.
data_type = "text"
required = false
padding = "left_zero"
justification = "right"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-complementaria-sustitutiva"
offset = 121
length = 2
kind = "filler"
# Design campo 9, subdivided into 121 DECLARACION COMPLEMENTARIA ("C") and 122
# DECLARACION SUSTITUTIVA ("S"). Neither byte can be produced correctly today:
# the amendment_evidence.is_complementaria producer is a boolean, and a boolean
# export field renders the canonical "X", not the "C" this design admits; there
# is no sustitutiva producer at all. A first presentation leaves both bytes
# blank, which is the design's own default ("en el caso excepcional de segunda
# o posterior presentacion"), so blank is correct for every filing this
# application can currently build. Emitting "X" here would write a token AEAT
# does not admit.
data_type = "text"
required = false
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

