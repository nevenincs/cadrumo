[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-decl-sello-electronico"
offset = 238
length = 263
kind = "filler"
# Design campo 15 "SELLO ELECTRONICO": "Campo reservado para el sello
# electronico en presentaciones individuales, que sera cumplimentado
# EXCLUSIVAMENTE POR LOS PROGRAMAS OFICIALES DE LA A.E.A.T. En cualquier otro
# caso, y en presentaciones colectivas SE RELLENARA A BLANCOS." Cadrumo is not
# an official AEAT program, so blancos is the value AEAT prescribes here -- a
# filler is correct authoring, not a datum papered over.
#
# It is also the record's LENGTH ANCHOR. render_fixed_width_export_record_body
# derives the emitted length from max(offset + length - 1), so dropping this
# terminal slot truncates the declarante record from 500 bytes to 237.
data_type = "text"
required = false
padding = "right_space"
justification = "left"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
