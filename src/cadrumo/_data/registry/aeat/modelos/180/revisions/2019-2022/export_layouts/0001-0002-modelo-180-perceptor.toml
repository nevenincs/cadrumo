[[revisions.2019-2022.export_layouts.records.fields]]
id = "modelo-180-perc-porcentaje-retencion"
offset = 93
length = 4
kind = "casilla"
casilla_id = "perc.porcentaje-retencion"
# AEAT's diseño de registro declares 93-96 as ONE field, "Numérico %
# RETENCIÓN", explicitly subdivided ("este campo se subdivide en otros
# dos") into 93-94 ENTERO and 95-96 DECIMAL -- a parent field with two
# Numérico sub-parts, not two independent AEAT rows. That shape is a
# scaled numeric with two decimals, exactly what data_type "decimal" plus
# decimals 2 renders and parses (parte entera in the high digits, parte
# decimal in the low two, via the codec's existing scaled-numeric path
# shared with money fields). A prior fix on this field left it "text"
# with a digit-string value_policy, which only refused non-digit content
# without correcting the parsed type -- the field is a genuine percentage
# value, not an opaque digit string, and the codec already renders/parses
# money fields (perc.base) with this same left_zero/right shape.
data_type = "decimal"
decimals = 2
required = true
padding = "left_zero"
justification = "right"
signed = false
legal_refs = ["orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-180-2014"]

