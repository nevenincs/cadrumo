# AEAT's diseño de registro calls this position "Numérico" (claves "1"
# dinerario / "2" especie). data_type stays "text" (the export field enum
# has no province/enum-code type and the committed golden fixture expects
# a string), but value_policy "digit-string" enforces ASCII-digit-only
# content on render and parse without changing the value's Python type.
