id = "modelo-180-115-perceptores-anual"
# The design counts type-2 records, not distinct recipients: "Si un mismo
# perceptor figura en varios registros, se computará tantas veces como figure
# relacionado. (Número de registros de tipo 2)" (aeat-dr-180-2014, positions
# 136-144 of the type-1 record).  The count is read from the same canonical
# annual materialization that emits those rows, never from summed quarterly
# Modelo 115 counts.
provider = { kind = "retenciones_aggregation", target_casilla_id = "decl.total-perceptores", fact = "type2_record_count" }
value = { data_type = "integer", channel = "integer" }
