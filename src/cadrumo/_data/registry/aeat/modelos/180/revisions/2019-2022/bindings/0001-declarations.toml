# RET-1: distinct perceptor-NIF count from the dedicated per-perceptor retención
# store (aggregate_retenciones_180.total_perceptors), not the sum of quarterly
# Modelo 115 counts (which double-counts a perceptor paid in more than one quarter).

[[revisions.2019-2022.bindings]]
id = "modelo-180-115-perceptores-anual"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]

[[revisions.2019-2022.bindings.source_citations]]
source_ref = "aeat-modelo-180-ayuda-resumen-datos"
required_text = ["Casilla01 Número total de perceptores relacionados", "Consigne el número de los perceptores"]

[revisions.2019-2022.bindings.provider]
kind = "retenciones_aggregation"
target_casilla_id = "decl.total-perceptores"
fact = "perceptor_count_distinct"

[revisions.2019-2022.bindings.value]
data_type = "integer"
channel = "integer"

