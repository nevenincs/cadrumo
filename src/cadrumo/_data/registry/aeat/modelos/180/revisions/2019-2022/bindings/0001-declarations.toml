# Modelo 180 record type 2 fields are emitted from the one canonical annual
# property materialization: one repeated, provider-native type-2 row per
# recipient, modality, accrual year and property.  The selected design remains
# the authority for slot shape; these bindings only connect its existing
# template casillas to that row.  The 2014 design (aeat-dr-180-2014) lays out
# the same type-2 perceptor record that Orden HFP/1284/2023 art. 7 later amends
