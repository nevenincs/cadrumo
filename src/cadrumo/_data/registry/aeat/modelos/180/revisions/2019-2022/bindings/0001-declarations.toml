[[revisions.2019-2022.bindings]]
id = "modelo-180-115-perceptores-anual"
# The design counts type-2 records, not distinct recipients: "Si un mismo
# perceptor figura en varios registros, se computará tantas veces como figure
# relacionado. (Número de registros de tipo 2)" (aeat-dr-180-2014, positions
# 136-144 of the type-1 record).  The count is read from the same canonical
# annual materialization that emits those rows, never from summed quarterly
# Modelo 115 counts.
provider = { kind = "retenciones_aggregation", target_casilla_id = "decl.total-perceptores", fact = "type2_record_count" }
value = { data_type = "integer", channel = "integer" }
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]

[[revisions.2019-2022.bindings.source_citations]]
source_ref = "aeat-modelo-180-ayuda-resumen-datos"
required_text = ["Casilla01 Número total de perceptores relacionados", "Consigne el número de los perceptores"]
[[revisions.2019-2022.bindings]]
id = "modelo-180-115-base-anual"
provider = { kind = "relation_prefill", relation_kind = "annual_summary", dependency_role = "periodic_to_annual_summary", source_modelo = "115", source_casilla_id = "02", temporal = { kind = "same_filing_year_periods", source_periods = ["1T", "2T", "3T", "4T"] } }
applicability = { kind = "target_periods", periods = ["0A"] }
value = { data_type = "money", channel = "decimal" }
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-hap-1732-2014:art-2", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
aggregation = { op = "sum" }

