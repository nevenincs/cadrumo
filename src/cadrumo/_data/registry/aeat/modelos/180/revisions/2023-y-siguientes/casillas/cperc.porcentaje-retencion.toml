[[revisions.2023-y-siguientes.casillas]]
id = "perc.porcentaje-retencion"
number = "93-96"
section = ["perceptor", "renta"]
# "decimal", not "ratio": this codebase's "ratio" data_type carries an
# established 0-1 fractional convention elsewhere in the registry (e.g. a
# 50% reduction parameter stores 0.50), disambiguated for parameters by a
# separate "unit" field casillas do not carry. AEAT's own diseño encodes
# this field as a percentage NUMBER split into entero+decimal sub-parts
# (93-94 / 95-96), i.e. 15.00 for 15%, not 0.15 -- "ratio" would silently
# invite the wrong convention here with no field to catch it.
data_type = "decimal"
semantic_role = "porcentaje_retencion"
continuidad_id = "porcentaje-retencion"
required = true
input_kind = "manual"
export_refs = ["modelo-180-perc-porcentaje-retencion"]
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-hap-1732-2014:art-2", "orden-hfp-1284-2023:art-7", "rd-439-2007:art-108", "ley-35-2006:art-101", "ley-58-2003:art-93"]
