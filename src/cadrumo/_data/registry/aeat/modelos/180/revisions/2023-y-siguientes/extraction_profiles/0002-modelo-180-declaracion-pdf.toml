# M180 declaracion_pdf extraction profile.
#
# Label patterns grounded against the AEAT-published printed-form template:
#   src/cadrumo/_data/corpus/aeat_official/disenos_registro/modelo_180/files/
#     02-180-orden-de-20-de-noviembre-de-2000-12-kb-pdf.pdf
#   Page 1, REGISTRO DE TIPO 1 (REGISTRO DE DECLARANTE) printed layout.
#
# AEAT label text (verbatim from the printed-form bitmap, page 1):
#   "NUMERO TOTAL DE PERCEPTORES"           (positions 136-144)
#   "BASE DE RETENCIONES E INGRESOS A CUENTA"  (positions 145-160)
#   "RETENCIONES E INGRESOS A CUENTA"       (positions 161-175)
#
# The same label vocabulary appears in the Orden HAP/1732/2014 EDI spec
# (01-180-orden-hap-1732-2014-actualizado-por-orden-hfp-1284-2023…pdf):
#   p.4  "NÚMERO TOTAL DE PERCEPTORES"
#   p.5  "BASE RETENCIONES E INGRESOS A CUENTA"
#   p.6  "RETENCIONES E INGRESOS A CUENTA"
#
# These are the resumen-declarante summary totals on the M180 printed declaration.
# Synthetic round-trip fixture:
#   src/cadrumo/tests/fixtures/justificantes/180/2024-0A.pdf

[[revisions.2023-y-siguientes.extraction_profiles]]
id = "modelo-180-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "cadrumo.adapters.inbound.declaracion.parser.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.total-perceptores", match_strategy = "named_label", value_kind = "amount", label_pattern = 'N[uú]mero\s+total\s+de\s+perceptores'},
    {casilla_id = "decl.base-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Base\s+(?:de\s+)?retenciones\s+e\s+ingresos\s+a\s+cuenta\s+total'},
    {casilla_id = "decl.retenciones-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Retenciones\s+e\s+ingresos\s+a\s+cuenta\s+total'},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = [
    "ley-35-2006:art-99",
    "rd-439-2007:art-100",
    "orden-hap-1732-2014:art-2",
    "orden-hfp-1284-2023:art-7",
    "rd-439-2007:art-108",
    "ley-35-2006:art-101",
    "ley-58-2003:art-93",
]
