# Legal authority catalogue — IRPF régimen especial de impatriados (Art. 93 LIRPF)
#
# Art. 93 LIRPF establishes the optional special IRPF regime for workers
# displaced to Spain under employment contracts, allowing eligible impatriados
# to be taxed as non-residents (IRNR flat-rate) during the first 6 years of
# Spanish residence, subject to conditions. The corresponding declaración is
# Modelo 151 (Orden EHA/2887/2008). Colloquially known as "Ley Beckham"
# following its 2003 introduction, though the original regime was substantially
# modified by Ley 26/2014.

