# Modelo 151's obligados and plazo provisions, one pair per governing orden.
#
# Both were read out of the BUNDLED consolidated text before this entry was
# authored, not from a summary. Art. 2 of each orden grounds who files: RIRPF
# art. 114 obliges every IRPF contribuyente to whom the regimen especial applies
# to present and sign the model. Art. 3.1 of each grounds the window WITHOUT
# stating a date -- the plazo "sera el mismo que se apruebe cada ejercicio, con
# caracter general, para las declaraciones del Impuesto sobre la Renta de las
