# Ley 39/2015 (Procedimiento Administrativo Comun) legal-catalogue entries
# for the electronic-notification regime behind the DEHu notificaciones
# surface.
#
# Authoring scope: art. 43.2 only, under the consolidated text of Ley
# 39/2015 (BOE-A-2015-10565). The article governs when an electronic
# notification is deemed practicada and when it is deemed rechazada; the
# ten-natural-day rechazo tacito window is the value the DEHu service-state
# axis depends on.
#
# - art-30.2, 30.5, 30.6, 31.3 and DA 1.2: computo de plazos. Ground which
#   days are inhabiles, the extension of an inhabil last day, the calendar an
#   electronic registry counts on, and the supletory reach of this Ley into
#   tax procedures.
# - art-43.2: regimen de notificaciones por medios electronicos. Grounds
#   the diez-dias-naturales rechazo tacito window for a notification put
#   at the taxpayer's disposal (DEHu) but not accessed.

