# position-numbered header row verified directly) is bundled and was never
# cited. corpus_path/sha256/bytes/source_url/retrieved_at now point at it,
# sourced from the bundle's own manifest.json (real, observed provenance,
# not re-fetched). applies_from/record_design_epoch deliberately left
