# AEAT's design "038 - Orden HAC/66/2002, de 15 de enero (actualizado a
# 18/01/2012)", still listed as the modelo 038 design on the Sede page
# modelos-01-99_.html on 2026-10-01. It governs until Orden HAC/646/2024
# replaced it: that order's article 1 adds the IRUS field at positions 153-165
# of the tipo 2 record and moves Blancos to 166-250, and its disposicion final
# unica applies the change first to the June 2024 declaration. The PDF prints
# every field of the 2024 design except IRUS (its corpus text sidecar, and
# dev/registry/tests/test_modelo_038_pre_june_2024_edition.py, compare the two).
# applies_from is the update date the index title states; applies_to is the
# last month before the amendment's first declaration.
