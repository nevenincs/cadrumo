notes = "Articulo cuarto de la Orden HAC/1430/2025: modifica los disenos de registro del modelo 184 aprobados por la Orden HAP/2250/2015. El apartado Uno introduce el campo NUMERO TOTAL DE REGISTROS DE ENTIDAD en las posiciones 221-229 del tipo de registro 1 (registro del declarante) y desplaza BLANCOS a 230-487; el apartado Dos reescribe la relacion de subclaves del campo SUBCLAVE (posiciones 94-95) del tipo de registro 2. La propia orden fija la frontera temporal entre los dos disenos empaquetados: sera aplicable por primera vez a las declaraciones informativas correspondientes al ejercicio 2025 para el modelo 184."
required_text = [
    "Artículo cuarto.",
    "NÚMERO TOTAL DE REGISTROS DE ENTIDAD",
    "221‑229",
]
