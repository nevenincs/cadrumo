notes = "Articulo 4 de la Orden HAP/2250/2015: plazo de presentacion del Modelo 184. La presentacion se realizara en el mes de febrero de cada ano en relacion con las rentas obtenidas por la entidad y las rentas atribuibles a cada uno de sus miembros en el ano natural inmediato anterior."
