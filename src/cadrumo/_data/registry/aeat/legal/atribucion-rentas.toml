notes = "Articulo 3 de la Orden HAP/2250/2015: objeto de la informacion. Sera objeto de declaracion la informacion definida en el apartado 1 del articulo 70 del Reglamento del IRPF (RD 439/2007). Las entidades constituidas en el extranjero con presencia en territorio espanol unicamente declararan la parte de renta atribuible a los miembros residentes."
