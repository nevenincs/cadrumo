notes = "Articulo 2 de la Orden HAP/2250/2015: obligados a presentar el modelo 184. Entidades en regimen de atribucion de rentas (Seccion 2.a del titulo X de la Ley 35/2006 LIRPF y Capitulo V del TRLIRNR aprobado por RDLeg 5/2004). Excluidas las entidades sin actividad economica con rentas inferiores a 3.000 EUR anuales y las entidades en el extranjero sin miembros residentes en territorio espanol."
