# Secretaría de Estado de Función Pública resolutions fixing the calendar of días
# inhábiles of the Administración General del Estado for the cómputo de plazos
# (Ley 39/2015 art. 30.7). AEAT procedures follow this calendar, so it grounds the
# per-date non-working days that extend a filing deadline under art. 30.5 and 30.6.
#
# Each resolution is bundled as published (BOE holds no consolidated text for it);
# its ANEXO lists every weekday that is inhábil nationally or in each autonomous
# community and city, followed by notes on sub-territorial variations.

