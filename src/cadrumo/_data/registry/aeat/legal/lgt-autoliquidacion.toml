# Procedural articles of Ley 58/2003 (Ley General Tributaria) that
# govern what makes a Modelo declaration legally filed.
#
# - art-119: tax declaration regime (any document presented to AEAT
#   that acknowledges a tax-relevant fact). Frames the locked
#   semantics of ModeloRecord persistence.
# - art-120: autoliquidaciones (self-assessments). The substantive
#   regime that Modelos 100, 130, 131, 303, 390, 111, 115, 123 and
#   others operate under. Rectificación procedures live here.
# - art-122: complementarias / sustitutivas (amending self-assessments).
#   Grounds amend_modelo_revision behaviour and the ModeloRecord
#   SUPERSEDED state transition.

[legal."ley-58-2003:art-93"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-58-2003-art-93.html#a93"
document_id = "BOE-A-2003-23186"
article = "93"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2003-23186#a93"
published_at = 2003-12-18
effective_from = 2004-07-01
review_status = "operator_reviewed"
reviewed_at = 2026-05-15
reviewed_by = "operator"
notes = """\
LGT art 93: obligaciones de informacion. Base sustantiva de toda obligacion informativa frente a \
AEAT - personas fisicas y juridicas obligadas a proporcionar datos, informes, antecedentes y \
justificantes con trascendencia tributaria. Enumera obligados especificos (retenedores, sociedades \
de cobro de honorarios profesionales, entidades bancarias y de mediacion). Base sustantiva de las \
declaraciones informativas: M347 (operaciones con terceros), M180/M190/M193 (resumenes anuales de \
retenciones), M184 (atribucion de rentas), M232 (vinculadas y paraisos), M349 (intracomunitarias), \
M720 (bienes en el extranjero), M193 (capital mobiliario)."""
required_text = [
    "Obligaciones de información",
    "trascendencia tributaria",
    "retenedores",
]

[legal."ley-58-2003:art-27.2"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-58-2003-art-27.html#a27-2"
document_id = "BOE-A-2003-23186"
article = "27.2"
