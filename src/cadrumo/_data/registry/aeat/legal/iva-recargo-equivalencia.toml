notes = """RDL 20/2012 art. 23, apartado Seis: da nueva redacción al art. 161 LIVA, con efectos desde el 1 de septiembre de 2012, y fija los tipos del recargo de equivalencia que acompañan a los tipos de IVA del 21 y del 10 por ciento: 5,2 y 1,4 por ciento. Mantiene el 0,50 por ciento del tipo super-reducido y el 1,75 por ciento de las labores del tabaco. La nota de modificación del texto consolidado del art. 161 cita este apartado como "art. 23.5"; el texto empaquetado del real decreto-ley lo numera Seis, y es el que se cita aquí. Entrada preparada por agente y fundamentada en el texto empaquetado leído directamente; no la ha revisado un operador humano."""
