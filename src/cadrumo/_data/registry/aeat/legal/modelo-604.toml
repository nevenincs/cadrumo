notes = "Orden HAC/510/2021 disposición transitoria única, primeras autoliquidaciones del Impuesto: las autoliquidaciones de enero, febrero, marzo y abril de 2021 se presentan e ingresan en el plazo de la autoliquidación correspondiente al mes de mayo de 2021. La orden se publicó el 27 de mayo de 2021, después de esos cuatro periodos, por lo que el plazo general del art 3 no pudo regirlos. Combinada con el art 3, la ventana de los cinco primeros periodos de 2021 es del 10 al 20 de junio de 2021."
