# Re-pointed 2026-08-15: the previous corpus_path (orden-eha-1881-2011.html,
# 1114 bytes) carries no annex section and no record-layout vocabulary. The
# real Diseño de Registro (100952 bytes) is bundled and was never cited --
# verified directly: "N° | Posic. | Lon | Tipo | Comp | Descripción | Oblig.
# | Contenido", the canonical AEAT layout table header, starting with the
# "<T" model/page envelope-open literal at position 1. Fields now point at
# the bundled file, sourced from its manifest.json (real, observed
# provenance, not re-fetched). record_design_epoch left undeclared (only
# one design is bundled for this modelo, so no epoch ambiguity to resolve).
#
# Narrowed 2026-08-15: applies_from was 2018-01-01 while the artefact's own
# scope is the FOURTH quarter of 2018 onward -- AEAT indexes it as "763 -
# (Ejercicio 2018 4T y siguientes, actualizado 25-07-2023)" and the stored
# filename says "desde 2018 4T". The registry was therefore asserting three
# quarters (2018-1T, 2T and 3T) that this design never claims, and those
# three are covered by the separately bundled "Ejercicios 2015 a 2018 hasta
# 3T" design. Set to 2018-10-01, the first day of the 2018 fourth natural
# trimestre. review_status is left exactly as the operator set it; this
# narrows an over-claim rather than asserting any new review.
