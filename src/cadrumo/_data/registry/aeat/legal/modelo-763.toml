# hash-pin or resolver could see -- one of 49 such files the registration gate
# reports across the tree. Its era comes from AEAT's own index title as captured
# in the corpus manifest beside the file, "763 - Orden EHA/1881/2011 (Ejercicios
# 2T/3T 2012, 2013 y 2014)", recorded with its source_page and download url --
# not inferred from the stored filename. That is the sanctioned evidence for a
# design boundary here; modelo 490's revision prose sets the precedent explicitly
