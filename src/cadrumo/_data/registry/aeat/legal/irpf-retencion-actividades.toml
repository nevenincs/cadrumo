# Retencion rates on rendimientos de actividades economicas profesionales.
#
# The binding provision, RD 439/2007 (RIRPF) articulo 95, is already declared
# in irpf.toml as [legal."rd-439-2007:art-95"] and is NOT redeclared here (the
# loader refuses duplicate legal ids across the legal catalogue). This file
# carries only the rate parameters that article fixes, so the values stop being
# Python literals in feature modules.
#
# Cross-checked against the live BOE consolidated text of RD 439/2007 art. 95
# on 2026-08-05 via the BOE Legislacion Consolidada open-data API (bloque a95,
# full amendment history BOE-A-2007-6820 -> BOE-A-2014-12730 -> BOE-A-2015-7770
# -> BOE-A-2018-17601 -> BOE-A-2023-2023, vigente desde 2023-01-26):
# "se aplicara el tipo de retencion del 15 por ciento sobre los ingresos
# integros satisfechos" and "el tipo de retencion sera del 7 por ciento en el
# periodo impositivo de inicio de actividades y en los dos siguientes". Rates
# confirmed byte-identical across every tracked redaccion since 2007.
#
# CORPUS CORRECTED 2026-08-05 (independent re-verification superseded an
# earlier 2026-08-05 staleness note whose three claims did not survive an
# independent fetch): the bundled excerpt was rewritten to the current
# (2023-01-26-onward) redaccion. The earlier note claimed live text (a) names
# the "entidad publica empresarial Loterias y Apuestas del Estado", (b) omits
# letra d), and (c) adds a halving rule -- none of that held under direct
# retrieval. "Entidad publica empresarial" is the ORIGINAL 2007 wording only;
# every redaccion since 2015 (including current) reads "Sociedad Estatal
# Loterias y Apuestas del Estado", which the prior excerpt already had
# correctly. Letra d) is NOT omitted from current text -- it did not exist at
# all before RD 31/2023, which introduced it in one amendment together with an
# artistas/audiovisual extension (15.000-euro / 75%-of-total threshold) the
# prior excerpt's letra d) lacked. There is no "halving" rule in current text:
# every redaccion since 2007 has carried SOME art.-68.4 reduction clause (a
# halving through RD 633/2015, a 60% reduction from RD 1461/2018 onward) --
# the prior excerpt had NONE of it, in any form. Only the 15/7 rates are
# grounded here; the collectives list is not consumed by any parameter.

[parameters."rirpf-art-95:retencion-actividades-profesionales-general"]
evidence_tier = "legal_authority"
value = "0.15"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-05
reviewed_by = "agent-review"
notes = "RIRPF art 95.1 primer parrafo: tipo general del 15 por ciento aplicable cuando los rendimientos sean contraprestacion de una actividad profesional. La base de retencion son los ingresos integros satisfechos, no el total con IVA repercutido. Verificado contra el texto consolidado vivo del BOE el 2026-08-05."

[parameters."rirpf-art-95:retencion-actividades-profesionales-inicio"]
evidence_tier = "legal_authority"
value = "0.07"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-05
reviewed_by = "agent-review"
notes = "RIRPF art 95.1 segundo parrafo: tipo reducido del 7 por ciento en el periodo impositivo de inicio de actividades profesionales y en los dos siguientes, siempre que no se hubiera ejercido actividad profesional alguna en el ano anterior a la fecha de inicio. Requiere comunicacion firmada al pagador. Verificado contra el texto consolidado vivo del BOE el 2026-08-05."

[parameters."rirpf-art-95:retencion-actividades-profesionales-colectivos-especificos"]
evidence_tier = "legal_authority"
value = "0.07"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "RIRPF art 95.1 cuarto parrafo: tipo del 7 por ciento sobre los rendimientos satisfechos a colectivos especificos, arm INDEPENDIENTE del inicio de actividad del segundo parrafo. El texto enumera: a) recaudadores municipales; b) mediadores de seguros que utilicen los servicios de auxiliares externos; c) delegados comerciales de la Sociedad Estatal Loterias y Apuestas del Estado; d) contribuyentes que desarrollen actividades incluidas en los grupos 851, 852, 853, 861, 862, 864 y 869 de la seccion segunda y en las agrupaciones 01, 02, 03 y 05 de la seccion tercera de las Tarifas del IAE (RDLeg 1175/1990), o cuya contraprestacion derive de una prestacion de servicios que, por cuenta ajena, quedaria incluida en la relacion laboral especial de artistas de artes escenicas, audiovisuales y musicales y de quienes realizan actividades tecnicas o auxiliares necesarias. PRECISION: la letra d) -- y solo la letra d) -- lleva una prueba de ingresos de DOS partes acumulativas: el volumen de rendimientos integros del conjunto de esas actividades en el ejercicio inmediato anterior debe ser inferior a 15.000 euros Y representar mas del 75 por ciento de la suma de los rendimientos integros de actividades economicas y del trabajo. Las letras a), b) y c) no llevan prueba de ingresos alguna. Los grupos IAE NO son un rango 851-869: son la lista enumerada anterior, que excluye 854, 855, 856, 857, 858, 859, 860, 863, 865, 866, 867 y 868. Esta entrada existe porque el 0,07 no es exclusivo del arm de inicio: sin ella, una retencion del 7 por ciento soportada por un recaudador municipal solo podia citar el parametro del inicio, es decir la provision VECINA y no la que fija el valor, contra registry-calculation-legal-grounding. Contrastado verbatim contra el texto consolidado empaquetado rd-439-2007-art-95.html."

# Sectoral rates, apartados 4, 5 and 6.1 of the same article. Added 2026-08-07
# after the M130 retencion advisory showed that grounding only the art. 95.1
# pair made every genuine sectoral withholding look like a phantom credit.
#
# Derived from the live BOE Legislacion Consolidada open-data API (bloque a95,
# Accept: application/xml -- the JSON mime type is refused with HTTP 400) on
# 2026-08-07, reading the LAST of the five versions the payload carries. The
# payload is ordered oldest-first, so the first version is the 2007 redaccion
# and only the last (BOE-A-2023-2023, vigente desde 2023-01-26) is in force.
# The tracked amendment history for this article -- RD 1003/2014, RD 633/2015,
# RD 1461/2018, RD 31/2023 -- modifies apartado 1 ONLY, so these four
# percentages have stood unchanged since the original 2007 text.
#
# The bundled corpus excerpt previously stopped at apartado 1, so these rates
# could not be verified against it; the excerpt was extended to carry apartados
# 4, 5 and 6.1 verbatim in the same commit as these parameters.
#
# Apartado 4 is NOT a single flat figure: the general agricola/ganadera rate is
# 2 por ciento, but engorde de porcino y avicultura retains at 1 por ciento.
# Grounding only the general figure would under-declare that carve-out.

[parameters."rirpf-art-95:retencion-actividades-agricolas-ganaderas-general"]
evidence_tier = "legal_authority"
value = "0.02"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "RIRPF art 95.4.2: 'Restantes casos: 2 por ciento' -- tipo general de retencion sobre rendimientos de actividades agricolas o ganaderas, aplicado sobre los ingresos integros satisfechos con excepcion de las subvenciones corrientes y de capital y de las indemnizaciones. Verificado contra el texto consolidado vivo del BOE el 2026-08-07."

[parameters."rirpf-art-95:retencion-actividades-ganaderas-engorde-porcino-avicultura"]
evidence_tier = "legal_authority"
value = "0.01"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "RIRPF art 95.4.1: 'Actividades ganaderas de engorde de porcino y avicultura: 1 por ciento' -- carve-out expreso al tipo general del 2 por ciento del apartado 4. Misma base de calculo que el tipo general. Verificado contra el texto consolidado vivo del BOE el 2026-08-07."

[parameters."rirpf-art-95:retencion-actividades-forestales"]
evidence_tier = "legal_authority"
value = "0.02"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "RIRPF art 95.5: tipo de retencion del 2 por ciento cuando los rendimientos sean contraprestacion de una actividad forestal, sobre los ingresos integros satisfechos con excepcion de las subvenciones corrientes y de capital y de las indemnizaciones. Coincide en valor con el tipo agricola/ganadero general pero lo fija un apartado distinto, por lo que se declara como parametro propio. Verificado contra el texto consolidado vivo del BOE el 2026-08-07."

[parameters."rirpf-art-95:retencion-actividades-estimacion-objetiva"]
evidence_tier = "legal_authority"
value = "0.01"
unit = "fraction"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "RIRPF art 95.6.1: tipo de retencion del 1 por ciento cuando el rendimiento neto de la actividad se determine con arreglo al metodo de estimacion objetiva y la actividad figure en la relacion de grupos y epigrafes de la Seccion Primera de las Tarifas del IAE del apartado 6.2. Esa tabla de epigrafes no se consume como parametro. Verificado contra el texto consolidado vivo del BOE el 2026-08-07."

# Correspondence between the Modelo 036 tipo-de-actividad codes and the art. 95
# partitions above. Added 2026-08-07.
#
# The M036 diseno de registro names field 403 only as `Tabla` and enumerates
# nothing; the code table is published in the instrucciones, bundled at
# corpus/aeat_official/instructions/modelo_036/ (see its PROVENANCE.md) with
# the two AEAT sede captures that carry it and their sha256. Ten codes: A01
# Arrendadores de Bienes inmuebles, A02 Ganaderia independiente, A03 Resto
# empresariales, A04 Artisticas y Deportivas, A05 Profesionales; B01 Agricola,
# B02 Ganadera, B03 Forestal, B04 Produccion de mejillon, B05 Pesquera.
#
# These entries exist so the code-to-partition correspondence is registry data
# with its own legal_refs rather than an if-chain in a resolver. `value` is the
# comma-separated code set that selects the partition and `unit` marks it as a
# code set rather than a rate; the codes themselves are AEAT censo vocabulary
# fixed by the Orden EHA/1274/2007 instrucciones, so both provisions are cited.
#
# A01, A03, B04 and B05 select NO art. 95 partition and are deliberately absent
# from every entry below: arrendamiento de inmuebles retains under art. 100, and
# resto empresariales, produccion de mejillon and pesquera carry no art.-95 rate
# at all (an actividad empresarial only reaches art. 95 through apartado 6.1 by
# estimacion objetiva, which is a method axis rather than an activity code).

[parameters."rirpf-art-95:selector-m036-actividades-profesionales"]
evidence_tier = "legal_authority"
value = "A04,A05"
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "Selecciona el tipo profesional del art 95.1 (15 por ciento general, 7 por ciento inicio). El puente es el apartado 2.a): 'se consideraran comprendidos entre los rendimientos de actividades profesionales: a) En general, los derivados del ejercicio de las actividades incluidas en las Secciones Segunda y Tercera de las Tarifas del Impuesto sobre Actividades Economicas'. La Seccion Segunda es la de actividades profesionales, que el M036 codifica como A05 Profesionales, y la Seccion Tercera es la de actividades artisticas, que el M036 codifica como A04 Artisticas y Deportivas. Sin el apartado 2 la correspondencia A04 seria una inferencia; con el es texto. El excerpt empaquetado se extendio con los apartados 2 y 3 en el mismo commit que esta entrada, porque paraba en el apartado 1 y saltaba al 4."

[parameters."rirpf-art-95:selector-m036-actividades-agricolas-ganaderas"]
evidence_tier = "legal_authority"
value = "A02,B01,B02"
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "Selecciona el 2 por ciento general del art 95.4.2. B01 Agricola y B02 Ganadera son directos. A02 Ganaderia independiente no se infiere por analogia sino que lo dice el propio apartado 4: 'Se entenderan incluidas entre las actividades agricolas y ganaderas: a) La ganaderia independiente'. Que A02 este en la tabla de actividades SUJETAS a IAE y B02 en la de NO sujetas no separa la partida del art 95: el apartado 4 define la actividad por su naturaleza, no por su sujecion al IAE."

[parameters."rirpf-art-95:selector-m036-actividades-forestales"]
evidence_tier = "legal_authority"
value = "B03"
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "Selecciona el 2 por ciento forestal del art 95.5. Coincide en valor con el tipo agricola/ganadero general pero lo fija un apartado distinto, por lo que el selector se declara aparte igual que el parametro de tipo: una futura divergencia entre ambos apartados no debe requerir desdoblar el selector."

[parameters."rirpf-art-95:selector-m036-actividades-ganaderas-engorde-porcino-avicultura"]
evidence_tier = "legal_authority"
value = ""
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "HUECO DECLARADO, no un olvido: el conjunto esta vacio a proposito. El art 95.4.1 fija el 1 por ciento para las actividades ganaderas de engorde de porcino y avicultura especificamente, y la tabla del M036 no llega a ese grano: su codigo ganadero mas fino es B02 Ganadera, con A02 Ganaderia independiente al lado, y ninguno aisla porcino ni avicultura. Un contribuyente acogido al carve-out es indistinguible de cualquier otro ganadero sobre este eje. Se declara vacio en vez de omitirse para que la ausencia sea legible: omitirlo dejaria creer que el eje del M036 particiona el art 95 por completo, que es exactamente la lectura que llevaria a aplicar el 2 por ciento general a un engordador. El discriminante tendria que venir de otra autoridad; el epigrafe IAE es el candidato obvio y no sirve, porque la propia instruccion del M036 dice que el epigrafe solo se cumplimenta 'para las actividades comprendidas dentro de los codigos de actividad A01, A02, A03, A04 y A05', es decir nunca para un filer de la serie B."
