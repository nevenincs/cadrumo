notes = """\
Conceptos de ingreso que el art 110.1.c excluye del volumen de ingresos del trimestre: 'excluidas \
las subvenciones de capital y las indemnizaciones'. Las instrucciones AEAT del Modelo 131 lo \
enuncian ademas por el lado positivo para la casilla 05: 'incluidas las subvenciones corrientes y \
excluidas las subvenciones de capital y las indemnizaciones'. La distincion corre DENTRO de las \
subvenciones -- corriente entra, de capital no -- por lo que ninguna regla basada en la palabra \
subvencion acierta con las dos. Se declara como parametro para que el conjunto excluido sea dato del \
registro y no una lista repetida en el codigo."""

# BROADER than the art. 110.1.c) set above, deliberately: art. 110 keeps subvenciones
# corrientes IN the volumen de ingresos, art. 109.3/109.4 take them out.
[parameters."rd-439-2007-art-109:conceptos-ingreso-excluidos-base-agraria"]
