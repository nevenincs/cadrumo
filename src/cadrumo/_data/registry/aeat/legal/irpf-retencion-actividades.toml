# Correspondence between the Modelo 036 tipo-de-actividad codes and the art. 95
# partitions above. Added 2026-08-07.
#
# The M036 diseno de registro names field 403 only as `Tabla` and enumerates
# nothing; the code table is published in the instrucciones, bundled at
# corpus/aeat_official/instructions/modelo_036/ (see its PROVENANCE.md) with
# the two AEAT sede captures that carry it and their sha256. Ten codes: A01
# Arrendadores de Bienes inmuebles, A02 Ganaderia independiente, A03 Resto
# empresariales, A04 Artisticas y Deportivas, A05 Profesionales; B01 Agricola,
# B02 Ganadera, B03 Forestal, B04 Produccion de mejillon, B05 Pesquera.
#
# These entries exist so the code-to-partition correspondence is registry data
# with its own legal_refs rather than an if-chain in a resolver. `value` is the
# comma-separated code set that selects the partition and `unit` marks it as a
# code set rather than a rate; the codes themselves are AEAT censo vocabulary
# fixed by the Orden EHA/1274/2007 instrucciones, so both provisions are cited.
#
# A01, A03, B04 and B05 select NO art. 95 partition and are deliberately absent
# from every entry below: arrendamiento de inmuebles retains under art. 100, and
# resto empresariales, produccion de mejillon and pesquera carry no art.-95 rate
# at all (an actividad empresarial only reaches art. 95 through apartado 6.1 by
# estimacion objetiva, which is a method axis rather than an activity code).

[parameters."rirpf-art-95:selector-m036-actividades-profesionales"]
evidence_tier = "legal_authority"
value = "A04,A05"
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = """\
Selecciona el tipo profesional del art 95.1 (15 por ciento general, 7 por ciento inicio). El puente \
es el apartado 2.a): 'se consideraran comprendidos entre los rendimientos de actividades \
profesionales: a) En general, los derivados del ejercicio de las actividades incluidas en las \
Secciones Segunda y Tercera de las Tarifas del Impuesto sobre Actividades Economicas'. La Seccion \
Segunda es la de actividades profesionales, que el M036 codifica como A05 Profesionales, y la \
Seccion Tercera es la de actividades artisticas, que el M036 codifica como A04 Artisticas y \
Deportivas. Sin el apartado 2 la correspondencia A04 seria una inferencia; con el es texto. El \
excerpt empaquetado se extendio con los apartados 2 y 3 en el mismo commit que esta entrada, porque \
paraba en el apartado 1 y saltaba al 4."""

[parameters."rirpf-art-95:selector-m036-actividades-agricolas-ganaderas"]
evidence_tier = "legal_authority"
value = "A02,B01,B02"
unit = "m036-tipo-actividad-code-set"
applies_to = "irpf-retencion-actividades-economicas"
legal_refs = ["rd-439-2007:art-95", "orden-eha-1274-2007:art-1"]
review_status = "reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = "Selecciona el 2 por ciento general del art 95.4.2. B01 Agricola y B02 Ganadera son directos. A02 Ganaderia independiente no se infiere por analogia sino que lo dice el propio apartado 4: 'Se entenderan incluidas entre las actividades agricolas y ganaderas: a) La ganaderia independiente'. Que A02 este en la tabla de actividades SUJETAS a IAE y B02 en la de NO sujetas no separa la partida del art 95: el apartado 4 define la actividad por su naturaleza, no por su sujecion al IAE."

[parameters."rirpf-art-95:selector-m036-actividades-forestales"]
