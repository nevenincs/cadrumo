[legal."ley-37-1992:art-3.dos"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992.html#a3"
document_id = "BOE-A-1992-28740"
article = "3"
section = "Dos"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a3"
published_at = 1992-12-29
effective_from = 2020-02-06
consolidated_as_of = 2026-08-07
review_status = "agent_reviewed"
reviewed_at = 2026-08-07
reviewed_by = "agent-review"
notes = """LIVA art. 3: territorialidad. Apartado Dos, numero 1.o, letras a) y b) are the \
provision that puts Ceuta y Melilla and Canarias OUTSIDE the territorio de aplicacion del \
impuesto, and they are what the Spanish sub-national territory table rests on. \
The anchored unit is the WHOLE article, because #a3 is the finest anchor the consolidated \
document offers; apartado Dos cannot be sliced further. Read the two limbs separately: the \
EXCLUSIONS are in apartado Dos, while the inside-limb -- the ambito espacial as el territorio \
espanol "incluyendo en el las islas adyacentes" -- is apartado Uno. Neither apartado names the \
Balears; the islands are inside the TAI by adjacency plus non-exclusion, never by being listed, \
which is why the territory table pins them inside by province rather than by quoting this article. \
Current redaction: letters a) and b) of apartado Dos.1.o were last modified by art. 214.Uno of \
Real Decreto-ley 3/2020 (BOE-A-2020-1651). That apartado takes the general entry-into-force rule \
of disposicion final decimosexta.1 -- the day after publication, 2020-02-06 -- and NOT the \
2020-03-01 date of paragraph 3, which names only apartados dos a nueve of art. 214; art. 214 sits \
in libro tercero, so the twenty-day rule of paragraph 2 does not reach it either. \
The bundled #a3 unit was compared character-for-character against the live BOE consolidated text \
on 2026-08-07 and is identical."""
required_text = [
    "El ámbito espacial de aplicación del impuesto es el territorio español",
    "incluyendo en él las islas adyacentes",
    "en el Reino de España, Ceuta y Melilla y en la República Italiana, Livigno, en cuanto territorios no comprendidos en la Unión Aduanera",
    "En el Reino de España, Canarias",
]

[legal."ley-37-1992:art-3.tres"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992.html#a3"
document_id = "BOE-A-1992-28740"
article = "3"
section = "Tres"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a3"
published_at = 1992-12-29
effective_from = 2015-01-01
consolidated_as_of = 2026-08-08
review_status = "agent_reviewed"
reviewed_at = 2026-08-08
reviewed_by = "agent-review"
notes = """\
LIVA art. 3 apartado Tres: the ASSIMILATION limb, and a separate entry from apartado Dos because it \
rules the opposite way. Apartado Dos carves territories OUT of the interior del pais; apartado Tres \
brings three territories that lie outside every Member State IN, by declaring that operations with \
Monaco, the Isle of Man and the United Kingdom sovereign base areas of Akrotiri and Dhekelia have \
the same consideration as operations with France, the United Kingdom and Cyprus respectively. Citing \
apartado Dos for an assimilation would name the provision that does the reverse. The anchored unit \
is the WHOLE article, because #a3 is the finest anchor the consolidated document offers and apartado \
Tres cannot be sliced further; the required_text below is chosen to occur only inside this apartado, \
so a match cannot be satisfied by apartado Uno or Dos. Current redaction: apartados 2 and 3 were \
last modified by art. 1.Uno of Ley 28/2014 (BOE-A-2014-12329), in force from 2015-01-01. \
ASSIMILATION IS RELATIVE, NOT ABSOLUTE, and that is the whole reason it is modelled as a pointer \
rather than as a scope. The article fixes what each territory is assimilated TO, never what that \
parent establishes -- so the Isle of Man followed the United Kingdom into and then out of the \
Community without this article changing a word, and Monaco follows France for as long as France is a \
Member State. A row recording a fixed scope here would have been correct in 2015 and wrong from 2021 \
while still reading as grounded."""
required_text = [
    "las operaciones efectuadas con el Principado de Mónaco, con la Isla de Man y con las zonas de soberanía del Reino Unido en Akrotiri y Dhekelia",
    "tendrán la misma consideración que las efectuadas, respectivamente, con Francia, el Reino Unido y Chipre",
]

