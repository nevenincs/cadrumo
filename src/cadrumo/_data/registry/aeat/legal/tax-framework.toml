# establish the nature of the main taxes (IVA, IRPF), the tax administration,
# fiscal identification (censo and NIF), the declaration and self-assessment
# obligations, the review procedure, the recargo de equivalencia regime, and the
# electronic sede. Every entry is corpus-verified: its corpus_ref resolves to a
# bundled BOE excerpt and its required_text is checked by the strict corpus gate.

