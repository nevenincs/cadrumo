[legal."rd-1065-2007:art-25"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "real_decreto"
corpus_ref = "corpus/normatives/html/rd-1065-2007.html#a25"
document_id = "BOE-A-2007-15984"
article = "25"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2007-15984#a25"
published_at = 2007-09-05
effective_from = 2008-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-13
reviewed_by = "agent-review"
notes = """\
RGAT art 25: especialidades del NIF a efectos del IVA. Establece que para quienes realizan \
operaciones intracomunitarias el numero de identificacion es el del reglamento anteponiendole EL \
PREFIJO ES, conforme al estandar ISO-3166 alfa 2. Es la provision que fija el FORMATO IMPRESO del \
NIF-IVA espanol, y por tanto la base para admitir ES en el vocabulario de prefijos de IDENTIFICACION \
-- eje distinto del de establecimiento, que se resuelve por pais y codigo postal y para el que ES no \
resuelve nada por diseno. Se cita porque el resto de prefijos del vocabulario se reconocen validando \
el cuerpo contra el patron que su prefijo declara, mientras que los identificadores espanoles \
validan por la letra de control de la AEAT: ES no podia entrar como entraron sus hermanos, y la \
asimetria resultante dejaba la identificacion del propio declarante solo asertable. CAMBIO DE \
DOCUMENTO CITADO, 2026-08-13. La entrada citaba rd-1065-2007-art-25.html, una captura del endpoint \
de articulo que concatena DOS redacciones fechadas (fecha_vigencia 20080101 de BOE-A-2007-15984 y \
20100303 de BOE-A-2010-3370) en una sola unidad extraida de 8873 caracteres, de modo que la \
comprobacion de required_text se ejecutaba contra texto derogado y texto vigente fundidos. Se \
repunta al documento consolidado empaquetado rd-1065-2007.html, cuya unidad #a25 contiene el \
articulo vigente y solo el vigente (4619 caracteres, titulo 'Articulo 25. Especialidades del numero \
de identificacion fiscal de los empresarios...'). Las tres frases de required_text se han verificado \
presentes en esa unidad leyendo el fichero empaquetado. OBSERVACION NO RESUELTA AQUI: effective_from \
sigue declarando 2008-01-01, que corresponde a la redaccion original; el texto en vigor procede de \
BOE-A-2010-3370. Determinar la fecha citable exige leer la nota de la norma modificante y no el \
atributo fecha_vigencia, que no es la fecha de efectos, por lo que se deja constancia en lugar de \
cambiarla."""
required_text = [
    "Impuesto sobre el Valor Añadido",
    "al que se antepondrá el prefijo ES",
    "ISO-3166 alfa 2",
]
