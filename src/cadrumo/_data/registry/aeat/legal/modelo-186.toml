# The BOE consolidated text of Orden HAC/539/2003 embeds its Anexo I/II
# "diseños físicos y lógicos" position tables as scanned PNG images rather
# than extractable text (verified via BOE's own document viewer, 2026-08-15).
# This is Anexo I image 1 -- "MODELO 186 (NACIMIENTOS) B.- TIPO DE REGISTRO 1:
# REGISTRO DE DECLARANTE" -- fetched directly from BOE and read back byte-for-
# byte before hashing. It carries the real position table this modelo's
# export layout is grounded against: 1 TIPO DE REGISTRO (constante '1'),
# 2-4 MODELO DECLARACIÓN (constante 'NAC' for nacimientos), 5-13 N.I.F. DEL
# DECLARANTE, 14-53 RAZÓN SOCIAL, 54-57 EJERCICIO DE ENVÍO, 58-59 MES DE
# ENVÍO, 60-69 NÚMERO TOTAL DE REGISTROS, 70-320 BLANCOS. No "declaración
# complementaria/sustitutiva" field exists in this tipo-1 record (unlike the
# 100-199 informativa family's usual 121-122 pair), confirmed directly from
# this image -- not assumed by analogy.
# This points at the PNG exactly as BOE serves it. It carries no text layer,
# so the record-design reader cannot parse it and this source stays
# unreadable -- that refusal is the true state of the evidence, not a defect
# to route around. A derived PDF wrapper previously stood here solely so the
# reader (which addresses .pdf/.xls/.xlsx/.xlsm) could reach the image; it was
# a generated artefact, not an official source, and was removed. Do not
# re-create it: transcribing the position table below requires reading the
# image, and no file conversion turns an image into a machine-readable design.
#
# It is therefore registered as a form_spec, NOT a record_design. That axis
# states what the tooling can do with the artefact, and the record-design
# reader addresses only .pdf/.xls/.xlsx/.xlsm; declaring record_design over an
# image asserts a parseability this file does not have and hard-fails the
# registry load. The evidence_tier stays layout_authority because the image IS
# the layout authority -- it simply is not machine-readable.
[sources."boe-modelo-186-anexo-i-tipo1"]
