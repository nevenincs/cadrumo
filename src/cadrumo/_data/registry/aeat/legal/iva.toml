notes = """\
Articulo 104 LIVA: la prorrata general. Define el calculo del porcentaje de deduccion como cociente \
entre el importe total de las operaciones que originan el derecho a la deduccion (numerador) y el \
importe total de todas las operaciones realizadas en el ejercicio (denominador), redondeado por \
exceso a la unidad superior. El apartado Tres enumera las seis operaciones excluidas de ambos \
terminos de la relacion (art 104.Tres reglas 1a a 6a): (1) operaciones desde establecimientos \
permanentes fuera del TAI; (2) las cuotas de IVA que gravaron directamente esas operaciones; (3) \
entregas y exportaciones de bienes de inversion utilizados en la actividad; (4) operaciones \
inmobiliarias o financieras que no constituyan actividad habitual (arrendamiento siempre habitual; \
operaciones financieras del art 20.Uno.18); (5) operaciones no sujetas del art 7; (6) operaciones \
del art 9, numero 1.o, letra d) (autoconsumo del promotor). Las subvenciones no vinculadas al precio \
NO son una exclusion del art 104.Tres: fueron suprimidas del denominador de la prorrata por la Ley \
3/2006 (BOE-A-2006-5691), por lo que no se computan en absoluto en lugar de excluirse de un volumen \
computado."""
required_text = [
    "La prorrata de deducción resultante de la aplicación de los criterios anteriores se redondeará en la unidad superior.",
    "Tres. Para la determinación del porcentaje de deducción no se computarán en ninguno de los términos de la relación:",
    "Las operaciones realizadas desde establecimientos permanentes situados fuera del territorio de aplicación del Impuesto.",
    "Las cuotas del Impuesto sobre el Valor Añadido que hayan gravado directamente las operaciones a que se refiere el apartado anterior.",
    "El importe de las entregas y exportaciones de los bienes de inversión que el sujeto pasivo haya utilizado en su actividad empresarial o profesional.",
    "El importe de las operaciones inmobiliarias o financieras que no constituyan actividad empresarial o profesional habitual del sujeto pasivo.",
    "En todo caso se reputará actividad empresarial o profesional habitual del sujeto pasivo la de arrendamiento.",
    "Tendrán la consideración de operaciones financieras a estos efectos las descritas en el artículo 20, apartado uno, número 18.º de esta Ley, incluidas las que no gocen de exención.",
    "Las operaciones no sujetas al impuesto según lo dispuesto en el artículo 7 de esta Ley.",
    "Las operaciones a que se refiere el artículo 9, número 1.º, letra d) de esta Ley.",
]

