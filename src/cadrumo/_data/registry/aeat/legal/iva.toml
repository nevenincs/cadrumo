notes = """\
RDL 4/2024 art. 1: tipos impositivos temporales del IVA sobre determinados alimentos y los tipos del \
recargo de equivalencia correlativos. Dos ventanas. Del 1 de julio al 30 de septiembre de 2024: 5 % \
para aceites de semilla y pastas alimenticias, 0 % para alimentos de primera necesidad incluido el \
aceite de oliva; recargo 0,62 % y 0 % respectivamente. Del 1 de octubre al 31 de diciembre de 2024: \
7,5 % y 2 %; recargo 1 % y 0,26 %. ALCANCE. Esta entrada cubre solo lo que fija el articulo 1. El \
articulo 2 del mismo real decreto-ley modifica el art. 91 Dos.1.1 LIVA con efectos desde el 1 de \
enero de 2025 y es una provision distinta que necesita su propia entrada; el texto consolidado de la \
LIVA solo anota ese articulo 2, que es la razon por la que este instrumento parecia fijar unicamente \
una fecha de 2025. Las ventanas anteriores al 1 de julio de 2024 las fijan RDL 20/2022, RDL 18/2022, \
RDL 5/2023 y RDL 8/2023, ninguno de los cuales esta en el corpus. CONTRASTE INDEPENDIENTE. Las \
cuatro cifras del recargo (0,62 / 0 / 1 / 0,26) coinciden con los tipos que declara el diseno de \
registro del Modelo 390 en las casillas 665/666, 663/664, 693/694 y 691/692, y 0,62 es estable en \
las revisiones 2023, 2024 y 2025 del diseno. El preambulo del propio real decreto-ley redondea 0,62 \
a "0,6"; prevalece el texto operativo, y el diseno lo corrobora de forma independiente. PROVENANCIA \
DE LA REVISION. Entrada preparada por agente y fundamentada en el texto autoritativo empaquetado \
