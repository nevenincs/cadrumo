review_status = "reviewed"
reviewed_at = 2026-07-07
reviewed_by = "agent-authored from bundled ley-37-1992.html#a103 clases de prorrata; operator to re-stamp"
notes = "Articulo 103 LIVA: clases de prorrata y criterios de aplicacion. Apartado Uno: la regla de prorrata tiene dos modalidades, general y especial; la general se aplica cuando no concurren las circunstancias del apartado siguiente. Apartado Dos: la prorrata especial es aplicable (1) cuando el sujeto pasivo opta por ella en plazo y forma reglamentarios, o (2) cuando el montante total de las cuotas deducibles del ano natural por la regla general excede en un 10 por ciento o mas del que resultaria por la regla especial (obligacion de especial). Base legal del aviso +10% de prorrata especial obligatoria (PRORRATA_ESPECIAL_MANDATORY_MULTIPLE)."
required_text = [
    "La regla de prorrata tendrá dos modalidades de aplicación: general y especial.",
    "La regla de prorrata especial será aplicable en los siguientes supuestos:",
    "Cuando el montante total de las cuotas deducibles en un año natural por aplicación de la regla de prorrata general exceda en un 10 por ciento o más del que resultaría por aplicación de la regla de prorrata especial.",
]

[legal."ley-37-1992:art-106"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992.html#a106"
document_id = "BOE-A-1992-28740"
article = "106"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a106"
