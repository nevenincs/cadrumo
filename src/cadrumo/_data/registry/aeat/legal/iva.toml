[legal."ley-37-1992:art-104"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992-art-104.html#a104"
document_id = "BOE-A-1992-28740"
article = "104"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a104"
published_at = 1992-12-29
effective_from = 1993-01-01
review_status = "reviewed"
reviewed_at = 2026-07-07
reviewed_by = "art 104.Tres exclusion clauses 1a-6a added verbatim from bundled ley-37-1992-art-104.html#a104; subvenciones NON-exclusion recorded per Ley 3/2006; operator to re-stamp"
notes = "Articulo 104 LIVA: la prorrata general. Define el calculo del porcentaje de deduccion como cociente entre el importe total de las operaciones que originan el derecho a la deduccion (numerador) y el importe total de todas las operaciones realizadas en el ejercicio (denominador), redondeado por exceso a la unidad superior. El apartado Tres enumera las seis operaciones excluidas de ambos terminos de la relacion (art 104.Tres reglas 1a a 6a): (1) operaciones desde establecimientos permanentes fuera del TAI; (2) las cuotas de IVA que gravaron directamente esas operaciones; (3) entregas y exportaciones de bienes de inversion utilizados en la actividad; (4) operaciones inmobiliarias o financieras que no constituyan actividad habitual (arrendamiento siempre habitual; operaciones financieras del art 20.Uno.18); (5) operaciones no sujetas del art 7; (6) operaciones del art 9, numero 1.o, letra d) (autoconsumo del promotor). Las subvenciones no vinculadas al precio NO son una exclusion del art 104.Tres: fueron suprimidas del denominador de la prorrata por la Ley 3/2006 (BOE-A-2006-5691), por lo que no se computan en absoluto en lugar de excluirse de un volumen computado."
required_text = [
    "La prorrata de deducción resultante de la aplicación de los criterios anteriores se redondeará en la unidad superior.",
    "Tres. Para la determinación del porcentaje de deducción no se computarán en ninguno de los términos de la relación:",
    "Las operaciones realizadas desde establecimientos permanentes situados fuera del territorio de aplicación del Impuesto.",
    "Las cuotas del Impuesto sobre el Valor Añadido que hayan gravado directamente las operaciones a que se refiere el apartado anterior.",
    "El importe de las entregas y exportaciones de los bienes de inversión que el sujeto pasivo haya utilizado en su actividad empresarial o profesional.",
    "El importe de las operaciones inmobiliarias o financieras que no constituyan actividad empresarial o profesional habitual del sujeto pasivo.",
    "En todo caso se reputará actividad empresarial o profesional habitual del sujeto pasivo la de arrendamiento.",
    "Tendrán la consideración de operaciones financieras a estos efectos las descritas en el artículo 20, apartado uno, número 18.º de esta Ley, incluidas las que no gocen de exención.",
    "Las operaciones no sujetas al impuesto según lo dispuesto en el artículo 7 de esta Ley.",
    "Las operaciones a que se refiere el artículo 9, número 1.º, letra d) de esta Ley.",
]

[legal."ley-37-1992:art-105"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992.html#a105"
document_id = "BOE-A-1992-28740"
article = "105"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a105"
published_at = 1992-12-29
effective_from = 1993-01-01
review_status = "reviewed"
reviewed_at = 2026-07-07
reviewed_by = "agent-authored from bundled ley-37-1992.html#a105 arts. 105.Uno/.Cuatro/.Cinco procedimiento de la prorrata general; operator to re-stamp"
notes = "Articulo 105 LIVA: procedimiento de la prorrata general. Apartado Uno: el porcentaje de deduccion provisionalmente aplicable cada ano natural sera el fijado como definitivo para el ano precedente. Apartado Cuatro: en la ultima declaracion-liquidacion de cada ano natural el sujeto pasivo calcula la prorrata definitiva en funcion de las operaciones del ano y practica la consiguiente regularizacion de las deducciones provisionales - la cuota de esa regularizacion se consigna en la casilla 44 del Modelo 303 y en el campo de regularizacion anual del Modelo 390. Base legal de la regularizacion prorrata por porcentaje definitivo. Apartado Cinco: en los supuestos de interrupcion durante uno o mas anos naturales de la actividad (o de un sector diferenciado), el porcentaje definitivamente aplicable durante cada uno de esos anos es el que globalmente corresponda al conjunto de los tres ULTIMOS anos naturales en que se hubiesen realizado operaciones (porcentaje global sobre los volumenes agregados de los tres anos activos, saltando la interrupcion; no la media de los tres porcentajes ni los tres anos de calendario). Base legal de la siembra del ejercicio que reanuda tras una interrupcion."
required_text = [
    "el porcentaje de deducción provisionalmente aplicable cada año natural será el fijado como definitivo para el año precedente",
    "En la última declaración-liquidación del impuesto correspondiente a cada año natural el sujeto pasivo calculará la prorrata de deducción definitiva",
    "practicará la consiguiente regularización de las deducciones provisionales",
    "En los supuestos de interrupción durante uno o más años naturales de la actividad empresarial o profesional",
    "el que globalmente corresponda al conjunto de los tres últimos años naturales en que se hubiesen realizado operaciones",
]

[legal."ley-37-1992:art-103"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-37-1992.html#a103"
document_id = "BOE-A-1992-28740"
