# Modelo 303 regimen simplificado de IVA: modulos-based cuota devengada
# engine. The Orden HAC/1347/2024 Anexo I "Instrucciones para la aplicacion de los
# indices y modulos en el Impuesto sobre el Valor Anadido" fixes the LIVA
# art. 123 mechanism: cuota devengada por operaciones corrientes = suma de
# unidades de cada modulo x cuota devengada anual por unidad; cuota derivada
# del regimen simplificado = mayor de (cuota devengada - cuotas soportadas
# - 1% de dificil justificacion; cuota minima = porcentaje de la actividad x
# cuota devengada). Cross-checked byte-identical against the bundled Orden
# HTML (corpus/normatives/html/orden-hac-1347-2024.html) for the first-slice
# activities (721.2, 722, 972.1).
[legal."orden-hac-1347-2024:anexo-i-iva-instrucciones"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hac-1347-2024.html#anexo-i-instrucciones-iva"
document_id = "BOE-A-2024-24949"
section = "Anexo I. Instrucciones para la aplicación de los índices y módulos en el Impuesto sobre el Valor Añadido"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2024-24949"
published_at = 2024-11-30
effective_from = 2025-01-01
effective_to = 2025-12-31
review_status = "reviewed"
reviewed_at = 2026-07-02
reviewed_by = "agent-authored from bundled orden-hac-1347-2024.html; operator to re-stamp"
notes = "Mecanismo del regimen simplificado de IVA para 2025 (LIVA art. 123): cuota devengada por operaciones corrientes = suma de las cuantias de los modulos (cantidad asignada x numero de unidades); cuota derivada del regimen simplificado = la mayor de (cuota devengada - cuotas soportadas por operaciones corrientes - 1% de dificil justificacion) o la cuota minima (Anexo II, aplicada sobre la cuota devengada). Cuotas trimestrales 1T-3T: ingreso a cuenta = porcentaje de la actividad (Anexo II) x cuota devengada del trimestre."
required_text = [
    "La cuota devengada por operaciones corrientes será la suma de las cuantías correspondientes a los módulos previstos para la actividad",
    "La cuota derivada del régimen simplificado será la mayor de las dos cantidades siguientes",
    "será deducible el 1 por ciento del importe de la cuota devengada por operaciones corrientes, en concepto de cuotas soportadas de difícil justificación",
]

