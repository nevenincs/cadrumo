el 21 por ciento, con efectos desde el 1 de septiembre de 2012. Esta es la provision que ESTABLECE \
el valor; el art. 90 LIVA es el articulo marco que lo aloja, y citarlo solo no basta cuando una \
norma modificativa fija la cifra. El texto consolidado del art. 90 lo confirma en su nota de \
modificacion: 'Se modifica el apartado 1, con efectos desde el 1 de septiembre de 2012, por el art. \
23.2 del Real Decreto-ley 20/2012, de 13 de julio. Ref. BOE-A-2012-9364'. DOS TRAMPAS DE CITA, ambas \
verificadas sobre el fichero empaquetado. Primera: el documento contiene TRES cadenas 'Articulo 23' \
y la primera pertenece a otra ley -- el articulo 23 sobre el Servicio de Ayuda a Domicilio -- de \
modo que anclar por la cadena sola selecciona el articulo equivocado; el de IVA es la segunda \
aparicion. Segunda: los apartados difieren por tipo. El 21 por ciento lo fija el apartado Dos y el \
10 por ciento el apartado Tres, por lo que citar 23.2 para el tipo reducido seria erroneo en un \
apartado. El tipo super-reducido del 4 por ciento es ANTERIOR a esta norma y NO puede heredarla por \
proximidad: necesita su propia provision. PROVENANCIA. Documento adquirido mediante la herramienta \
de adquisicion del corpus consolidado oficial (API de legislacion consolidada del portal oficial), \
