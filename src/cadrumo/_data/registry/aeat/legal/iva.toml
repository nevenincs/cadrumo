notes = """\
Articulo 105 LIVA: procedimiento de la prorrata general. Apartado Uno: el porcentaje de deduccion \
provisionalmente aplicable cada ano natural sera el fijado como definitivo para el ano precedente. \
Apartado Cuatro: en la ultima declaracion-liquidacion de cada ano natural el sujeto pasivo calcula \
la prorrata definitiva en funcion de las operaciones del ano y practica la consiguiente \
regularizacion de las deducciones provisionales - la cuota de esa regularizacion se consigna en la \
casilla 44 del Modelo 303 y en el campo de regularizacion anual del Modelo 390. Base legal de la \
regularizacion prorrata por porcentaje definitivo. Apartado Cinco: en los supuestos de interrupcion \
durante uno o mas anos naturales de la actividad (o de un sector diferenciado), el porcentaje \
definitivamente aplicable durante cada uno de esos anos es el que globalmente corresponda al \
conjunto de los tres ULTIMOS anos naturales en que se hubiesen realizado operaciones (porcentaje \
global sobre los volumenes agregados de los tres anos activos, saltando la interrupcion; no la media \
de los tres porcentajes ni los tres anos de calendario). Base legal de la siembra del ejercicio que \
reanuda tras una interrupcion."""
required_text = [
    "el porcentaje de deducción provisionalmente aplicable cada año natural será el fijado como definitivo para el año precedente",
    "En la última declaración-liquidación del impuesto correspondiente a cada año natural el sujeto pasivo calculará la prorrata de deducción definitiva",
    "practicará la consiguiente regularización de las deducciones provisionales",
    "En los supuestos de interrupción durante uno o más años naturales de la actividad empresarial o profesional",
    "el que globalmente corresponda al conjunto de los tres últimos años naturales en que se hubiesen realizado operaciones",
]

