la ha revisado un operador humano; reviewed_by lo declara asi. El modelo tipa review_status como \
Literal["reviewed"], de modo que la honestidad de la provenance vive en reviewed_by hasta que un \
operador re-selle la entrada. NOTA PARA QUIEN EDITE required_text. Las cuatro frases operativas son \
identicas salvo la cifra, de modo que un required_text tomado del prefijo comun coincide con las \
cuatro y no discrimina nada. Cada entrada lleva su cifra. Ademas el documento separa "del" de la \
cifra con un espacio duro (U+00A0), pero la puerta lo normaliza a espacio normal antes de comparar, \
asi que required_text usa espacio normal: incrustar el espacio duro hace fallar todas las \
coincidencias."""
