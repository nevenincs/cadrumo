# Autonomic mínimo personal y familiar authorities (IRPF, gravamen autonómico).
#
# Ley 22/2009 art. 46.1.a cedes to each comunidad autónoma the power to set its
# own mínimo personal y familiar for the autonomic half of the tax. Each entry
# below cites the article in the comunidad's consolidated text as BOE publishes
# it, captured under corpus/normatives/html, and takes its effective date from
# the amending law's own entry-into-force and effects provisions, not from the
# AEAT manuals. Where a manual lists a comunidad for a year, the entry's notes
# record the provision that makes it apply.

[legal."andalucia-ley-5-2021:art-23-bis"]
evidence_tier = "legal_authority"
authority = "autonomous_community"
kind = "ley"
corpus_ref = "corpus/normatives/html/andalucia-ley-5-2021-art-23-bis.html#a2-12"
document_id = "BOE-A-2021-17915"
article = "23 bis"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2021-17915#a2-12"
published_at = 2021-11-03
effective_from = 2022-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-09-30
reviewed_by = "agent-review"
notes = "Ley 5/2021 art. 23 bis (Andalucía), added by art. 1.2 of Decreto-ley 7/2022, de 20 de septiembre (BOJA 21-09-2022, BOJA-b-2022-90287), in force 2022-09-22. Its disposición final segunda gives the IRPF provisions effect from 1 January 2022, which the consolidated text notes. Mínimo del contribuyente for the gravamen autonómico: 5.790 euros, plus 1.200 above 65 and a further 1.460 above 75. The consolidated text carries no later redaction."
required_text = [
    "Mínimo personal y familiar",
    "Con carácter general, 5.790 euros anuales",
    "el mínimo se aumentará en 1.200 euros anuales",
    "adicionalmente en 1.460 euros anuales",
    "surte efectos desde el 1 de enero de 2022",
]

