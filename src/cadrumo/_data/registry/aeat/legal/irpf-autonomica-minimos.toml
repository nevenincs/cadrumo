# Autonomic mínimo personal y familiar authorities (IRPF, gravamen autonómico).
#
# Ley 22/2009 art. 46.1.a cedes to each comunidad autónoma the power to set its
# own mínimo personal y familiar for the autonomic half of the tax. For 2025 the
# AEAT Manual práctico de Renta 2025 (parte 1, capítulo 14, "Importes del mínimo
# personal y familiar aprobados por las comunidades autónomas para el cálculo
# del gravamen autonómico") records that exactly eight comunidades exercised it:
# Andalucía, Principado de Asturias, Illes Balears, Canarias, Galicia, Madrid,
# La Rioja and Comunitat Valenciana. Every other comunidad uses the LIRPF
# amounts for both gravámenes -- the manual states this explicitly in its
# Cantabria worked example.
#
# Article attribution for Asturias is agent-prepared: the manual cites arts. 2
# bis, 2 ter, 2 quater and 2 quinquies collectively for the whole mínimo family
# without saying which article carries the mínimo del contribuyente. The
# load-bearing grounding is the required_text cross-check against the bundled
# manual, as in irpf-autonomica-madrid.toml. Operator to re-stamp.

