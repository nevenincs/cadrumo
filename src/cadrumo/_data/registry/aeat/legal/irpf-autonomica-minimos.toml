notes = "DL 1/2014 art. 2 (Illes Balears) in the redaction of art. 1 of Ley 11/2023, de 23 de noviembre (BOIB 25-11-2023, BOE-A-2023-24913), in force 2023-11-26: a 10 per cent increase of the mínimo of a contribuyente older than 65 and older than 75, the second and later descendants, ascendants and disability. The general mínimo below 65 stays the state amount. The earlier redaction of disposición final 2.3 of Ley 13/2014 (BOE-A-2015-1059), in force from 2015-01-01, raised the mínimo of a contribuyente older than 65 by the same 10 per cent; this entry grounds only the current redaction."
