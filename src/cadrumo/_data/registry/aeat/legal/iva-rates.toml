notes = "LIVA art 90: tipo impositivo general del IVA. Establece que el Impuesto se exigira al tipo del 21 por ciento, salvo lo dispuesto en el articulo 91 (tipos reducidos). El tipo aplicable a cada operacion sera el vigente en el momento del devengo (art 90 Dos)."
