# Aplazamiento y fraccionamiento del pago (Ley 58/2003 art-65) and the
# garantias that secure it (art-82).
#
# NEITHER ARTICLE FIXES A NUMBER. An exhaustive scan of both bundled units
# returns zero percentages, zero amounts and zero deadlines. That is a
# substantive property of these provisions, not a gap in the review: any euro
# threshold or rate stated in a consumer of these entries is grounded
# ELSEWHERE and must cite that norm instead.
#
# Two consequences, both load-bearing:
#
#   * art-65.4 sets a rate only BY REFERENCE -- "el interes legal que
#     corresponda" where the debt is fully secured by aval or seguro de
#     caucion. Interes legal and interes de demora are fixed annually by the
#     Ley de Presupuestos Generales del Estado. No year's rate is asserted
#     here, and none may be added to this entry.
#   * art-82.2.a dispenses the garantia below a threshold "que se fije en la
#     normativa tributaria" -- the article frames, an Orden fixes. The current
#     figure lives in Orden HFP/311/2023 (BOE-A-2023-8119), which superseded
#     Orden HAP/2178/2015. A consumer stating that threshold MUST cite the
#     Orden; citing art-82 alone for it is precisely the defect of grounding a
#     number on the general framework article that does not establish it.
#
# REVIEW PROVENANCE. Every numeric clause in this file was cross-checked against
# the live BOE consolidated text as well as the bundled corpus, per the standing
# rule that distrusts bundled text on a number: 45 numeric clauses across the
# four subjects, zero disagreements, every article complete rather than
# truncated. The live side was read from the BOE Open Data consolidated API
# taking the LAST version of each article, because that endpoint returns every
# historical version oldest-first and taking the first would bundle repealed
# law.
#
# TWO INDEPENDENT CHANNELS, and what that does and does not buy. The text of
# every entry here is confirmed on the BOE consolidated database AND on the
# original 2003 diario publication together with the original publications of
# each modifying norm (RDL 20/2011, Ley 7/2012, Ley 34/2015, RDL 3/2016,
# Ley 11/2021). Those are demonstrably different documents rather than one
# source re-served: the 2003 original lacks the apartados added to art-28 and
# art-170 in 2012, which the consolidated text carries. Thirteen of these
# articles have never been amended, so for them the 2003 original IS the
# current text and the confirmation is direct.
#
# RESIDUAL LIMITATION, which two channels did NOT close. The channels agree on
# what text was ENACTED. They do not independently agree that nothing later
# changed it: the claim that the amendment history is exhausted still rests on
# the consolidated database's own version list. For the unamended articles that
# gap is small -- a later amendment would have to be invisible to BOE's own
# consolidation -- but it is not zero.
#
# An AEAT restatement was sought as a third channel for the sanction bands and
# NOT obtained; the published recargos material covers art-27 only. Recorded as
# unobtained rather than filled with a search-engine paraphrase.

