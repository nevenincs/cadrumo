# (BOE-A-2022-14580).
effective_from = 2023-01-01
review_status = "operator_reviewed"
reviewed_at = 2026-08-12
reviewed_by = "operator"
notes = """\
Garantias para el aplazamiento y fraccionamiento de la deuda. The preferred security is an aval \
solidario de entidad de credito or sociedad de garantia reciproca, or a certificado de seguro de \
caucion. Where the obligado shows it cannot obtain one, hipoteca, prenda, fianza personal y \
solidaria or another sufficient security is accepted, and the Administracion may instead adopt \
medidas cautelares in substitution. Apartado 2 allows total or partial dispensation of the garantia, \
including where the debts fall below a threshold the article expressly leaves to the normativa \
tributaria to fix; the amount is therefore NOT established here and must be cited to the Orden that \
fixes it."""
required_text = [
    "aval solidario de entidad de crédito o sociedad de garantía recíproca o certificado de seguro de caución",
    "Podrá dispensarse total o parcialmente al obligado tributario de la constitución de las garantías",
    "Cuando las deudas tributarias sean de cuantía inferior a la que se fije en la normativa tributaria",
]
