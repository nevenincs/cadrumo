document_id = "BOE-A-1991-14392"
article = "30"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1991-14392#a30"
published_at = 1991-06-06
effective_from = 1991-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-06-02
reviewed_by = "agent-review"
notes = "Ley 19/1991 Art. 30 — cuota íntegra. Escala estatal por defecto de ocho tramos con tipos marginales del 0,2 % al 3,5 % (aplicable cuando la Comunidad Autónoma no apruebe escala propia). Base de la tarifa del Modelo 714."
required_text = [
    "0,2",
    "3,5",
    "Impuesto sobre el Patrimonio",
]

[legal."ley-19-1991:art-31"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-19-1991-art-31.html#art-31"
document_id = "BOE-A-1991-14392"
article = "31"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1991-14392#a31"
published_at = 1991-06-06
effective_from = 1991-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-06-02
reviewed_by = "agent-review"
notes = "Ley 19/1991 Art. 31 — límite de la cuota íntegra. La cuota del IP junto con las cuotas del IRPF no puede exceder del 60 % de la suma de las bases imponibles del IRPF; cuando se supera, la cuota del IP se reduce sin que la reducción exceda del 80 % (suelo del 20 %). La regla excluye determinadas ganancias/pérdidas patrimoniales de la base del ahorro y la parte correspondiente de cuotas IRPF, y excluye la parte del IP de elementos no susceptibles de producir rendimientos gravados por IRPF."
required_text = [
    "60 por 100",
    "bases imponibles",
    "más de un año",
    "no sean susceptibles de producir los rendimientos",
    "80 por 100",
]

