# Legal authority catalogue — Impuesto sobre el Patrimonio (Modelo 714)
#
# Ley 19/1991 establishes the annual Impuesto sobre el Patrimonio (IP), a
# tax on the net wealth of resident individuals and Spanish-sited wealth of
# non-residents. The declaration is Modelo 714, approved each year by the
# joint IRPF+Patrimonio orden published the following March (e.g. ejercicio
# 2021 by Orden HFP/207/2022).
# The obligation threshold is €700.000 net wealth nationally (Art. 28 Ley 19/1991),
# with autonomic-community variation: Comunitat Valenciana €600.000, some CCAAs
# €700.000 or €1.000.000. The 714 registry currently grounds the base, art. 30
# state scale, art. 31 joint-limit floor, and art. 4.Nueve habitual-home exemption.

[legal."ley-19-1991:art-28"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-19-1991-art-28.html#art-28"
document_id = "BOE-A-1991-14392"
article = "28"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1991-14392#a28"
published_at = 1991-06-06
effective_from = 1991-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-06-02
reviewed_by = "agent-review"
notes = "Ley 19/1991 Art. 28 — base liquidable y mínimo exento del Impuesto sobre el Patrimonio. El mínimo exento general es de 700.000 euros, con competencia autonómica para modificarlo (CV: 600.000 €). Declaración: Modelo 714 (Orden HAC/1023/2021). document_id corregido a BOE-A-1991-14392 (Ley 19/1991): el valor anterior BOE-A-1991-14461 era una resolución de la Universidad de Sevilla, no la Ley del Patrimonio."
required_text = [
    "base liquidable",
    "Impuesto sobre el Patrimonio",
]

