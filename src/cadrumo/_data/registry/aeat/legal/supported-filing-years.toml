# One registry-wide declaration, authored as bounds rather than a list of years.
#
# `filing_grade_years_before_horizon` places the floor relative to the horizon:
# the span of years the corpus grounds for filing. The floor is a hard gate on
# filing years. A request to file an earlier year is refused as outside what the
# product claims rather than recorded as a gap somebody should close, and a dated
# record older than it reads its facts as a backward projection, never as filing
# grade. Where a single modelo begins later than this floor, that is the modelo's
# own declaration to make, not this one's. Advancing the horizon moves the floor
# with it; widen the span in the same change if the oldest year stays grounded.
#
# `horizon` is the last year the corpus carries authored coverage for. It is not
# a gate: a year above it stays answerable by carrying the newest eligible
# authored revision forward.
#
# No ceiling is declared: the span stays open above the horizon.
#
# A year is admitted into this span only after the coverage audit enumerates its
# unresolved modelo/period prerequisites; the audit remains advisory until the
# separately authorised enforcement flip.
[supported_filing_years]
filing_grade_years_before_horizon = 4
horizon = 2026
