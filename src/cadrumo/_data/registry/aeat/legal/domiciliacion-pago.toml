# Orden EHA/1658/2009: procedure and periods for ordering the domiciliación (direct
# debit) of an autoliquidación's payment.
#
# Article 3.2 sets the rule: the domiciliación is ordered within the period its
# Anexo II gives each modelo, extended by the days the filing period is extended
# when its last day is inhábil. Orden HAC/241/2025 (BOE-A-2025-5048, in force
# 15/03/2025, no transitional regime) rewrote article 3.2 to add a minimum of three
# días hábiles or five naturales before the end of the voluntary period, and to
# define the inhábil days as those of the municipality where AEAT's Departamento
# de Informática sits.
#
# The consolidated text is bundled as served by act.php on its last update; the
# amending order is bundled as published, because BOE holds no consolidated text
# for it.

