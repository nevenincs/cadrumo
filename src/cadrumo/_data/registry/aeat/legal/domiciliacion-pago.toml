review_status = "pending_review"
notes = "Artículo 3.2 de la Orden EHA/1658/2009: la domiciliación se ordena en el plazo del anexo II, ampliado los mismos días que se amplíe el plazo de presentación cuando su último día sea inhábil. La redacción en vigor desde el 15/03/2025 (Orden HAC/241/2025) añade el margen mínimo de tres días hábiles o cinco naturales y la definición de días inhábiles del municipio del Departamento de Informática."
required_text = [
    "a) Con carácter general, en el plazo que a tal efecto se recoge en el anexo II, de la presente orden.",
    "el plazo de domiciliación establecido en el anexo II, se ampliará el mismo número de días que resulte ampliado el plazo de presentación de la autoliquidación correspondiente.",
    "deberá existir un mínimo de tres días hábiles o cinco naturales.",
    "se considerarán días inhábiles los sábados, los domingos, las festividades nacionales y las festividades autonómicas o locales que afecten al municipio en el que radique el Departamento de Informática de la Agencia Tributaria.",
]

