# AEAT publishes THREE Modelo 490 record designs, one per era, and all three are
# now bundled. Every span below is read off AEAT's own index title for that
# artefact -- never chosen to make a window check pass:
#
#   "Orden HAC/590/2021 (Ejercicio 2021 y 2022 hasta periodo 1T)"  -> 2021-1T .. 2022-1T
#   "Orden HAC/590/2021 (Ejercicio 2022 periodo 2T-4T)"            -> 2022-2T .. 2022-4T
#   "Ejercicio 2023 y siguientes"                                  -> 2023-1T ..
#
# The 2021 and 2022 designs sit on the ejercicios-anteriores page family, the
# 2023 one on the current page. Two of the three boundaries fall MID-YEAR, which
# is why the revisions that consume them narrow by period rather than by year
# alone.
