obtiene los rendimientos / a quien corresponde la imputación / titular' del Modelo 100 \
(toma de datos ampliada). AGENT-AUTHORED, grounded in the bundled authoritative \
ley-35-2006.html#a11; operator to confirm and re-stamp."""
