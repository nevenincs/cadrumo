notes = """\
LIRPF disposición adicional 48ª: deducción aplicable a las unidades familiares formadas \
por residentes fiscales en Estados miembros de la Unión Europea o del Espacio Económico \
Europeo, que equipara el tratamiento al de la tributación conjunta cuando uno de los \
miembros no es residente en España. Base legal de las casillas de la deducción por unidad \
familiar de residentes en la UE/EEE en Modelo 100. AGENT-AUTHORED, grounded in the bundled \
authoritative ley-35-2006.html (DA cuadragésima octava); operator to confirm and re-stamp."""
