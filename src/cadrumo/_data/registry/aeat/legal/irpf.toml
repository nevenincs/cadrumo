[legal."orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hac-1347-2024.html#anexo-ii-instruccion-2-3-incompatibilidades"
document_id = "BOE-A-2024-24949"
section = "Anexo II, instrucción 2.3 Fase 3: Rendimiento neto de módulos — Incompatibilidades entre los índices correctores"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2024-24949"
published_at = 2024-11-30
effective_from = 2025-01-01
effective_to = 2025-12-31
review_status = "agent_reviewed"
reviewed_at = 2026-07-03
reviewed_by = "agent-authored from bundled orden-hac-1347-2024.html; operator to re-stamp"
notes = """\
Fase 3a: incompatibilidades entre los indices correctores. El indice corrector para empresas de \
pequena dimension (b.1) nunca se aplica a las actividades que tienen asignados los indices \
correctores especiales (a.2 transporte por autotaxis, a.3 transporte urbano colectivo, a.4 \
transporte de mercancias por carretera y servicios de mudanzas, a.5), y cuando resulte aplicable el \
indice b.1 tampoco se aplica el indice corrector de exceso (b.3); el indice corrector de temporada \
(b.2) y el de inicio de nuevas actividades (b.4) son a su vez incompatibles entre si. El motor de \
modulos M131 (0003-cmodulos-epigrafe__cmodulos-rendimiento-neto-actividad.toml, \
m131_resolve_modulos_indices_generales) aplica ahora los cuatro indices generales (b.1, b.2, b.4, \
b.3) en el orden de la propia Orden y hace cumplir estructuralmente las tres incompatibilidades: el \
indice b.1 declarado se ignora para las dos actividades tabuladas con indice especial (721.2 \
transporte por autotaxis, 722 transporte de mercancias); cuando b.1 se aplica, b.3 se omite; cuando \
ambos b.2 y b.4 se declaran, prevalece la temporada (orden de enumeracion de la Orden) y se ignora \
el inicio de nuevas actividades. Dos indicadores internos (modulos-pequena-dimension-ignorado-flag, \
modulos-temporada-inicio-actividad-conflicto-flag) fundamentan los advisories no bloqueantes que \
senalan al operador cuando una de sus declaraciones fue ignorada, per no-silent-under-declaration. \
El motor M100 (0293-...-rendimiento-base.toml) sigue modelando unicamente su propio cascade agrario \
(indices 1-8, Anexo I instruccion 2.3), sin relacion con este Anexo II."""
required_text = [
    "Incompatibilidades entre los índices correctores:",
    "En ningún caso será aplicable el índice corrector para empresas de pequeña dimensión (b.1) a las actividades para las que están previstos los índices correctores especiales enumerados en las letras a.2), a.3), a.4) y a.5).",
    "Cuando resulte aplicable el índice corrector para empresas de pequeña dimensión (b.1) no se aplicará el índice corrector de exceso (b.3).",
]

