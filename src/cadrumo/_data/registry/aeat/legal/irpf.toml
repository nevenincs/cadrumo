]

[legal."ley-35-2006:art-58-1"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a58"
document_id = "BOE-A-2006-20764"
article = "58.1"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a58"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-04
reviewed_by = "agent-authored from bundled ley-35-2006.html#a58; operator to re-stamp"
notes = """\
LIRPF art 58.1: the rentas ceiling conditioning the minimo por descendientes. A descendant generates \
the minimo only when, besides being under 25 (or carrying any discapacidad) and cohabiting, the \
descendant does not hold rentas anuales, excluidas las exentas, superiores a 8.000 euros. This entry \
grounds the 8.000-euro CEILING specifically, which the parent ley-35-2006:art-58 entry does not pin \
(its required_text covers only the tranche amounts). The required_text ends at the ', de:' that \
introduces the tranche list, which is what separates this clause from art 61 norma 1a's \
grado-de-parentesco tie-break -- that clause carries the SAME 8.000-euro figure but applies it to \
the CLAIMANT rather than the descendant, and reads 'no tengan ... en cuyo caso'. Confirmed present \
in the art-58 unit and absent from the art-61 unit. AGENT-AUTHORED, grounded in the bundled \
authoritative consolidated ley-35-2006.html#a58 (redaccion Ley 26/2014, en vigor 01/01/2015, \
unamended since); operator to confirm and re-stamp."""
required_text = [
    "no tenga rentas anuales, excluidas las exentas, superiores a 8.000 euros, de:",
]

[legal."ley-35-2006:art-61-norma-2"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a61"
document_id = "BOE-A-2006-20764"
article = "61.2"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a61"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-04
reviewed_by = "agent-authored from bundled ley-35-2006.html#a61; operator to re-stamp"
notes = """\
LIRPF art 61 norma 2a: the own-return exclusion. The minimo does not apply at all when the \
ascendiente or descendiente who generates the entitlement files their own declaracion for this \
Impuesto with rentas superiores a 1.800 euros. This is an exclusion threshold on the DEPENDANT's own \
filing, distinct from art 58.1's 8.000-euro rentas ceiling, and distinct from norma 1a's prorrateo \
which the parent ley-35-2006:art-61 entry already pins. The 1.800-euro figure is pinned verbatim \
here because the parent entry's required_text covers only the norma 1a prorrateo clause. SCOPE, and \
read this before authoring anything adjacent: the clause governs THREE minimos in one sentence -- \
'No procedera la aplicacion del minimo por descendientes, ascendientes o discapacidad' -- so this \
entry is the single authority for all three, not a descendientes-only entry. Only the descendientes \
predicate consumes it today, and the per-year parameters are named \
'minimo-descendientes-declaracion-propia-rentas-limite' after that first consumer rather than after \
the clause's reach; ascendientes and discapacidad are currently bare manual inputs with no formula \
and no binding, so nothing is incomplete. Whoever builds an ascendientes or discapacidad predicate \
MUST cite this entry and reuse the existing 1.800 parameter rather than minting a second legal entry \
and a second parameter for the same clause and the same figure -- one clause, one authority, one \
figure. AGENT-AUTHORED, grounded in the bundled authoritative consolidated ley-35-2006.html#a61 \
(redaccion Ley 26/2014, en vigor 01/01/2015, unamended since); operator to confirm and re-stamp."""
required_text = [
    "presenten declaración por este Impuesto con rentas superiores a 1.800 euros",
]

[legal."ley-35-2006:art-61-norma-4"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a61"
document_id = "BOE-A-2006-20764"
article = "61.4"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a61"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-05
reviewed_by = "agent-authored from bundled ley-35-2006.html#a61; operator to re-stamp"
notes = """\
LIRPF art 61 norma 4a: the death-in-period flat cuantia. Displacing norma 3a's devengo-date rule, a \
descendiente or ascendiente who dies during the periodo impositivo and generates the entitlement \
takes a FLAT 2.400 euros (descendiente) or 1.150 euros (ascendiente) instead of the amount that \
would otherwise correspond. SCOPE, read this before authoring anything adjacent: one clause fixes \
BOTH figures, so this entry is the single authority for the descendientes AND the ascendientes death \
amount, not a descendientes-only entry. Only the descendientes figure is parameterised today \
(renta-{year}-minimo-descendientes-fallecimiento-{year}); whoever wires the ascendientes minimo MUST \
cite this same entry and mint a SIBLING parameter under an ascendientes stem for the 1.150 figure -- \
NOT a second value on the descendientes parameter, whose id is descendientes-specific -- rather than \
authoring a second legal entry for the same clause. One clause, one legal authority, two parameters. \
The 2.400 descendientes figure COINCIDES with art 58.1's first-child tranche but is a legally \
DISTINCT figure: it is fixed here, applies at any birth order, and would not move if a reform moved \
the tranche, so the two must never share a parameter. CAUTION, the clause is only half the rule as \
the AEAT Renta manual applies it: the manual's 'Minimo por descendientes / Cuantias aplicables' \
section restates this flat amount AND adds the ordering limb -- the number of orden is assigned by \
age 'sin computar a estos efectos aquellos descendientes que, en su caso, hubieran fallecido en el \
ejercicio con anterioridad a la fecha de devengo del impuesto' -- which has no counterpart in the \
statutory text of norma 4a and is grounded on the manual source instead. Omitting that second limb \
over-grants every younger sibling by leaving them at a rank the deceased should have vacated. \
AGENT-AUTHORED, grounded in the bundled authoritative consolidated ley-35-2006.html#a61 (redaccion \
Ley 26/2014, en vigor 01/01/2015, unamended since; norma 4a last modified by Ley 39/2010 art 61.5 \
with effect 01/01/2011 and then by Ley 26/2014); operator to confirm and re-stamp."""
required_text = [
    "en caso de fallecimiento de un descendiente o ascendiente que genere el derecho al mínimo",
    "la cuantía será de 2.400 euros anuales o 1.150 euros anuales",
]

