notes = """\
Fase 4a agraria: reduccion agricultores jovenes. Los agricultores jovenes o asalariados agrarios \
podran reducir el rendimiento neto de modulos correspondiente a su actividad agraria en un 25 por \
ciento durante los periodos impositivos cerrados durante los cinco anos siguientes a su primera \
instalacion como titulares de una explotacion prioritaria (capitulo IV, titulo I, Ley 19/1995), \
siempre que acrediten un plan de mejora de la explotacion. Desarrolla, para el ejercicio 2025, la \
disposicion adicional sexta de la Ley del IRPF (ley-35-2006:da-6). Base legal de la casilla 1551 del \
Modelo 100 2025 (motor: percent(1550, 25) cuando la casilla informativa AJ del Diseno de Registros \
AEAT declara la elegibilidad; en blanco/No no se fabrica ninguna reduccion)."""
required_text = [
    "Los agricultores jóvenes o asalariados agrarios podrán reducir el rendimiento neto de módulos correspondiente a su actividad agraria en un 25 por ciento",
    "primera instalación como titulares de una explotación prioritaria",
]

