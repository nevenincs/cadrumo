[legal."orden-hac-1347-2024:instruccion-2-2-b"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hac-1347-2024.html#anexo-ii-instruccion-2-2-b"
document_id = "BOE-A-2024-24949"
section = "Anexo II, instrucción 2.2.b) Minoración por incentivos a la inversión"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2024-24949"
published_at = 2024-11-30
