section = "Anexo I (actividades agrícolas, ganaderas y forestales), instrucción 2.2 Fase 2: Rendimiento neto minorado"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2024-24949"
published_at = 2024-11-30
