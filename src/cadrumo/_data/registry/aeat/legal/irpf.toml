notes = """\
Fase 1a agraria: rendimiento neto previo. Para cada actividad agricola, ganadera o forestal \
independiente, el rendimiento neto previo se obtiene multiplicando el volumen total de ingresos \
(incluidas subvenciones e indemnizaciones) del cultivo o explotacion por el indice de rendimiento \
neto que corresponda a ese producto o servicio, por el cuadro codigo-producto de indices aprobado en \
este mismo Anexo I. Cross-checked byte-identical against the AEAT Manual practico de Renta 2025, \
Parte 1, Capitulo 9, worked example "Determinacion del rendimiento neto previo de la actividad" \
(Dona M.J.I., manzanas / frutos no citricos, codigo 12: ingresos 18.030,00 euros x indice 0,37 = \
rendimiento neto previo 6.671,10 euros)."""
required_text = [
    "2.1 Fase 1: Rendimiento neto previo.",
    "se obtendrá multiplicando el volumen total de ingresos",
    "por el «índice de rendimiento neto» que corresponda a cada uno de ellos",
]

