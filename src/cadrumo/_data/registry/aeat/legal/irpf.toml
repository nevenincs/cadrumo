notes = """\
Fase 2a: minoracion por incentivos a la inversion. Son deducibles las cantidades que, en concepto de \
amortizacion del inmovilizado material o intangible afecto a la actividad, correspondan a la \
depreciacion efectiva, calculada segun la tabla de amortizacion de la propia orden (coeficiente \
lineal maximo, minimo derivado del periodo maximo, o cualquier coeficiente intermedio). El primer \
slice del motor no modela un registro de bienes de inversion por elemento; la minoracion se recoge \
como un importe declarado por el operador, grounded en esta instruccion, y se resta del rendimiento \
neto previo junto con la minoracion por incentivos al empleo."""
