[legal."orden-hfp-1359-2023:instruccion-2-2-b"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hfp-1359-2023.html#anexo-ii-instruccion-2-2-b"
document_id = "BOE-A-2023-25882"
section = "Anexo II, instrucción 2.2.b) Minoración por incentivos a la inversión"
