notes = """\
LIRPF art 61: normas comunes para la aplicacion del minimo del contribuyente y por descendientes, \
ascendientes y discapacidad. Norma 1a: cuando dos o mas contribuyentes tengan derecho al minimo por \
descendientes, ascendientes o discapacidad respecto de los mismos ascendientes o descendientes, su \
importe se prorrateara entre ellos por partes iguales -- the custodia-compartida 50% prorrata \
applied to Modelo 100 casillas 0513/0514. Norma 4a fixes a reduced amount on a mid-year death \
(unrelated to entry timing); norma 5a's half-period residency rule is scoped to ascendientes only. \
AGENT-AUTHORED, grounded in the bundled authoritative ley-35-2006.html#a61 (en vigor 01/01/2015); \
operator to confirm and re-stamp."""
