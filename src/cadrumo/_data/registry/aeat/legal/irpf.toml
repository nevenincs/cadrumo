[legal."orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hfp-1359-2023.html#anexo-ii-instruccion-2-3-incompatibilidades"
document_id = "BOE-A-2023-25882"
section = "Anexo II, instrucción 2.3 Fase 3: Rendimiento neto de módulos — Incompatibilidades entre los índices correctores"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2023-25882"
published_at = 2023-12-21
effective_from = 2024-01-01
effective_to = 2024-12-31
review_status = "agent_reviewed"
reviewed_at = 2026-07-15
reviewed_by = "agent-authored from bundled orden-hfp-1359-2023.html; operator to re-stamp"
notes = """\
Fase 3a: incompatibilidades entre los indices correctores. El indice corrector para empresas de \
pequena dimension (b.1) nunca se aplica a las actividades que tienen asignados los indices \
correctores especiales (a.2 transporte por autotaxis, a.3 transporte urbano colectivo, a.4 \
transporte de mercancias por carretera y servicios de mudanzas, a.5), y cuando resulte aplicable el \
indice b.1 tampoco se aplica el indice corrector de exceso (b.3); el indice corrector de temporada \
(b.2) y el de inicio de nuevas actividades (b.4) son a su vez incompatibles entre si. El motor de \
modulos M131 2024 (0003-cmodulos-epigrafe__cmodulos-rendimiento-neto-actividad.toml, \
m131_resolve_modulos_indices_generales) aplica los cuatro indices generales (b.1, b.2, b.4, b.3) en \
el orden de la propia Orden y hace cumplir estructuralmente las tres incompatibilidades, en paralelo \
al motor 2025 grounded en orden-hac-1347-2024:anexo-ii-instruccion-2-3-incompatibilidades."""
required_text = [
    "Incompatibilidades entre los índices correctores:",
