# LIRPF estimación-objetiva (módulos) magnitudes excluyentes.
#
# PROVENANCE: agent-authored (claude-opus, 2026-06-14). The módulos exclusion
# limits existed only in corpus reference text, never as enforceable registry
# values. The legal entry below is AGENT-AUTHORED but grounded in the
# AUTHORITATIVE bundled consolidated LIRPF corpus (ley-35-2006.html), not a
# secondary source: the corpus cross-check therefore validates against text the
# project already ships and trusts. The legal catalogue is a human-reviewed,
# filing-grade surface (review_status is Literal["reviewed"]); `reviewed_by`
# records the agent author and the operator should re-stamp after confirming.
#
# TEMPORAL SCOPE — IMPORTANT: the bundled BOE consolidation of LIRPF DT 32ª
# still carries required_text for ejercicios 2016 a 2024. The bundled AEAT Renta
# 2025 manual, retrieved after the 2026 derogation churn, states that the same
# quantitative exclusion limits apply to periods 2025 and 2026. The advisory
# gate therefore applies these parameters only to the settled official-source
# window 2016-2026. Do not project them beyond the authored revisions without a
# fresh official-source check.
#
# Binding provision: Ley 35/2006 DT 32ª — the 150.000/75.000 EUR rendimientos-
# íntegros limits (art. 31.1.3ª.b.a') become 250.000/125.000 EUR, and the 150.000
# EUR volumen-de-compras limit (art. 31.1.3ª.c) becomes 250.000 EUR. The
# agrícolas/ganaderas/forestales limit is a separate art. 31.1.3ª.b' magnitude,
# not a DT 32ª override; it is authored below as its own art. 31 parameter.

[legal."ley-35-2006:dt-32"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#dttrigesimasegunda"
document_id = "BOE-A-2006-20764"
article = "DT-32"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#dttrigesimasegunda"
published_at = 2006-11-29
effective_from = 2016-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-06-14
reviewed_by = "agent-authored; grounded in bundled authoritative corpus; operator to re-stamp"
notes = """\
LIRPF DT 32ª: límites para la aplicación del método de estimación objetiva en los ejercicios 2016 a \
2024. Para esos ejercicios, las magnitudes de 150.000 y 75.000 euros del art. 31.1.3ª.b.a' quedan \
fijadas en 250.000 y 125.000 euros, y la magnitud de 150.000 euros del art. 31.1.3ª.c (volumen de \
compras) queda fijada en 250.000 euros. La guía oficial AEAT Renta 2025 incluida en el corpus \
declara aplicables esos mismos límites cuantitativos excluyentes a 2025 y 2026; la puerta de aviso \
consume esta referencia sólo para la ventana 2016-2026. Grounded against the bundled authoritative \
ley-35-2006.html (#dttrigesimasegunda) and the bundled AEAT Renta 2025 manual; agent-authored entry \
pending operator re-stamp."""
required_text = [
    "método de estimación objetiva en los ejercicios 2016 a 2024",
    "quedan fijadas en 250.000 y 125.000 euros",
    "queda fijada en 250.000 euros",
]

