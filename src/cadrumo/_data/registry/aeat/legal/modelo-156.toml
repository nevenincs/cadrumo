# Re-pointed 2026-08-15: the previous corpus_path (orden-hac-3580-2003.html,
# 1112 bytes) carries no annex section and no record-layout vocabulary. The
# real Diseño de Registro (39458 bytes) is bundled and was never cited --
# verified directly: "ANEXO II DISEÑOS FÍSICOS Y LÓGICOS ... Registros de:
# 250 posiciones", the canonical AEAT layout vocabulary. Fields now point at
# the bundled file, sourced from its manifest.json (real, observed
# provenance, not re-fetched).
#
# applies_from and record_design_epoch are deliberately UNDECLARED, because
# AEAT states no ejercicio for this artefact. It is served as
# 156_HAC_3580_2003.pdf, indexed as "156 - Orden HAC/3580/2003, de 17
# diciembre" with no era qualifier, and headed "ANEXO II -- DISENOS FISICOS Y
# LOGICOS ... DEL MODELO 156": it is the anexo of the orden that approves this
# modelo. Two details inside the document corroborate that it is unchanged
# 2003-era content rather than a later redesign carrying an era of its own:
# TIPO DE SOPORTE still admits 'C' (cartucho magnetico IBM-3480) and 'D'
# (disquete de 3 1/2"), and the NIF composition rules cite Real Decreto
# 338/1990 where every later AEAT design cites Real Decreto 1065/2007. The
# "Ejercicio 2021" page footer is a re-issue stamp on the same anexo.
#
# A second source id, declaring applies_from 2021-01-01 and epoch "2021" over
# these identical bytes and this identical hash, was retired rather than
# reconciled: it asserted an ejercicio AEAT does not state and the document
# itself contradicts. Removing it deletes a false span; it does not create a
# true one, which is why nothing was transferred here.
# record_design_epoch: AEAT publishes this design as 156_HAC_3580_2003.pdf, the Orden HAC/3580/2003 edition; the revision it backs is 2003-y-siguientes.
