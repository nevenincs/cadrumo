notes = "Infraccion por determinar o acreditar improcedentemente partidas positivas o negativas o creditos tributarios aparentes. Always grave. The band depends on where the wrongly accredited item sits: 15 por ciento for partidas to be offset or deducted in the base imponible, and 50 por ciento for partidas in the cuota or for apparent tax credits. The sanction is deducted from any later sanction arising when the same amounts are actually offset."
required_text = [
    "La sanción consistirá en multa pecuniaria proporcional del 15 por ciento si se trata de partidas a compensar o deducir en la base imponible",
    "o del 50 por ciento si se trata de partidas a deducir en la cuota o de créditos tributarios aparentes",
]

