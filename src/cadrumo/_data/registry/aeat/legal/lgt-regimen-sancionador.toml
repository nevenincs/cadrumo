# Regimen sancionador: the pecuniaria proporcional bands of Ley 58/2003
# arts. 191-197. AEAT reports a sancion as an objeto tributario on its debts
# consulta, so these are the provisions a consumer would reach for when it
# stops displaying AEAT's reported figure and starts interpreting it.
#
# SEVEN ENTRIES, NOT ONE. A corpus_ref resolves exactly one anchored unit, so
# "arts. 191-197" is not representable as a single catalogue entry. Each
# article is anchored on its own.
#
# THE BANDS HERE ARE NOMINAL, NOT WHAT IS PAID. Two further articles move every
# figure below and neither is catalogued here:
#
#   * art-187 graduacion -- comision repetida and perjuicio economico add
#     percentage points to the base band. Arts. 191-193 delegate to it
#     expressly and state no increment themselves.
#   * art-188 reducciones -- 65 per cent for actas con acuerdo, 30 per cent for
#     conformidad, and a further 40 per cent for pronto pago, in the redaction
#     given by Ley 11/2021 (BOE-A-2021-11473) in force from 2021-07-11. The
#     bundled corpus was checked against the superseded figures and carries
#     none of them.
#
# A consumer stating an EFFECTIVE sanction percentage without citing arts. 187
# and 188 alongside these is ungrounded: it would be quoting a nominal band as
# though it were the amount demanded.
#
# REVIEW PROVENANCE. Every numeric clause in this file was cross-checked against
# the live BOE consolidated text as well as the bundled corpus, per the standing
# rule that distrusts bundled text on a number: 45 numeric clauses across the
# four subjects, zero disagreements, every article complete rather than
# truncated. The live side was read from the BOE Open Data consolidated API
# taking the LAST version of each article, because that endpoint returns every
# historical version oldest-first and taking the first would bundle repealed
# law.
#
# TWO INDEPENDENT CHANNELS, and what that does and does not buy. The text of
# every entry here is confirmed on the BOE consolidated database AND on the
# original 2003 diario publication together with the original publications of
# each modifying norm (RDL 20/2011, Ley 7/2012, Ley 34/2015, RDL 3/2016,
# Ley 11/2021). Those are demonstrably different documents rather than one
# source re-served: the 2003 original lacks the apartados added to art-28 and
# art-170 in 2012, which the consolidated text carries. Thirteen of these
# articles have never been amended, so for them the 2003 original IS the
# current text and the confirmation is direct.
#
# RESIDUAL LIMITATION, which two channels did NOT close. The channels agree on
# what text was ENACTED. They do not independently agree that nothing later
# changed it: the claim that the amendment history is exhausted still rests on
# the consolidated database's own version list. For the unamended articles that
# gap is small -- a later amendment would have to be invisible to BOE's own
# consolidation -- but it is not zero.
#
# An AEAT restatement was sought as a third channel for the sanction bands and
# NOT obtained; the published recargos material covers art-27 only. Recorded as
# unobtained rather than filled with a search-engine paraphrase.

[legal."ley-58-2003:art-191"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-58-2003.html#a191"
document_id = "BOE-A-2003-23186"
article = "191"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2003-23186#a191"
published_at = 2003-12-18
effective_from = 2004-07-01
review_status = "operator_reviewed"
reviewed_at = 2026-08-12
reviewed_by = "operator"
notes = """\
Infraccion por dejar de ingresar la deuda tributaria resultante de una autoliquidacion. The severity \
axis: leve where the base is 3.000 euros or less, or greater without ocultacion; grave where the \
base exceeds 3.000 euros and there is ocultacion; muy grave where medios fraudulentos were used. \
Incorrect books or registers push the infraction off leve above a 10 per cent incidence and make it \
grave between 10 and 50 per cent. Unremitted retenciones make it grave at 50 per cent or less of the \
base and muy grave above. Nominal bands: leve 50 por ciento, grave 50 al 100 por ciento, muy grave \
100 al 150 por ciento, each graduated under art-187 and reduced under art-188."""
required_text = [
    "La sanción por infracción leve consistirá en multa pecuniaria proporcional del 50 por ciento",
    "La sanción por infracción grave consistirá en multa pecuniaria proporcional del 50 al 100 por ciento",
    "La sanción por infracción muy grave consistirá en multa pecuniaria proporcional del 100 al 150 por ciento",
]

