reviewed_by = "operator"
notes = """\
Ley 31/2022 Art. 39: modifica el articulo 29 de la Ley 27/2014 LIS para introducir el tipo reducido \
del 23 por ciento para entidades cuya cifra de negocios del periodo impositivo inmediato anterior \
sea inferior a 1 millon de euros (entidades de reducida dimension). Aplicable a periodos impositivos \
iniciados a partir del 1 de enero de 2023. Las entidades sujetas al tipo general del 25 por ciento \
que cumplan el umbral de cifra de negocios inferior a 1 millon de euros aplican el tipo ERD del 23 \
por ciento; las cooperativas fiscalmente protegidas y entidades sin fines lucrativos conservan sus \
tipos especiales."""
required_text = [
    "23 por ciento",
    "cifra de negocios del período impositivo inmediato anterior",
    "1 millón de euros",
]

