[legal."orden-hac-529-2026:art-6-3"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "orden"
corpus_ref = "corpus/normatives/html/orden-hac-529-2026.html#a6"
document_id = "BOE-A-2026-11583"
article = "6.3"
permalink = "https://www.boe.es/buscar/doc.php?id=BOE-A-2026-11583"
published_at = 2026-05-13
