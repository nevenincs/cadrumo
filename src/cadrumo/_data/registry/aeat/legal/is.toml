reviewed_by = "agent-prepared (corpus-grounded against the bundled BOE-A-2026-11583 excerpt disposición final segunda, fetched from two BOE surfaces that agree verbatim; pending operator re-stamp)"
notes = """Orden HAC/529/2026 disposición final segunda: entrada en vigor el 1 de julio de 2026, aplicable a los modelos con períodos impositivos iniciados entre el 1 de enero y el 31 de diciembre de 2025. This is the provision that fixes the temporal boundary of the 2025 IS declaration layout, and so the authority for splitting modelo 220's open-ended revision at the 2024/2025 re-layout."""
