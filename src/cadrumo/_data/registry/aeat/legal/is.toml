LIS art 13: correcciones de valor - perdida por deterioro del valor de los elementos patrimoniales. \
Establece la deducibilidad del deterioro de creditos cuando concurra una de cuatro circunstancias (6 \
meses de vencimiento, concurso, alzamiento de bienes, reclamacion judicial / arbitral), las \
exclusiones (creditos publicos, vinculadas excepto liquidacion concursal, estimaciones globales), y \
la no-deducibilidad general del deterioro de inmovilizado material/intangible/inversiones \
inmobiliarias y participaciones. Base sustantiva de la dotaciones_deterioro_creditos_u_otros_activos \
section de M200."""
