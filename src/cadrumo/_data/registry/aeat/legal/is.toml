especial dotada con el diez por ciento del beneficio liquido de cada ejercicio hasta que alcance al \
menos una cifra superior al doble del capital social. El articulo tambien limita el destino de la \
reserva a compensar perdidas cuando no haya otras reservas disponibles suficientes y/o a adquirir \
acciones o participaciones propias para enajenarlas a trabajadores indefinidos conforme al art 12. \
