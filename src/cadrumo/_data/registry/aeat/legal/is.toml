reviewed_by = "operator"
notes = "Ley 44/2015 Art. 2: denominacion social. Las sociedades laborales deben incluir en su denominacion las palabras 'Sociedad Anonima Laboral' o 'Sociedad Limitada Laboral', o sus abreviaturas SAL o SLL respectivamente. Prohibicion de uso de estas denominaciones por entidades no calificadas."
required_text = [
    "Sociedad Anónima Laboral",
    "Sociedad Limitada Laboral",
    "S.A.L.",
]

