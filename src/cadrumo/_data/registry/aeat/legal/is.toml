published_at = 2015-10-22
effective_from = 2015-10-24
review_status = "agent_reviewed"
reviewed_at = 2026-06-30
reviewed_by = "verified against official BOE-A-2015-11071 consolidated art. 14; corpus excerpt currentized"
notes = """\
Ley 44/2015 Art. 14: reserva especial. Las sociedades laborales deben constituir una reserva \
especial dotada con el diez por ciento del beneficio liquido de cada ejercicio hasta que alcance al \
menos una cifra superior al doble del capital social. El articulo tambien limita el destino de la \
reserva a compensar perdidas cuando no haya otras reservas disponibles suficientes y/o a adquirir \
acciones o participaciones propias para enajenarlas a trabajadores indefinidos conforme al art 12. \
La reduccion de base imponible IS por dotaciones a la reserva especial se fundamenta separadamente \
en Ley 44/2015 art 13."""
required_text = [
    "reserva especial",
    "diez por ciento del beneficio líquido",
    "superior al doble del capital social",
    "compensación de pérdidas",
    "adquisición de sus propias acciones o participaciones sociales",
]

