# TRLIRNR (Impuesto sobre la Renta de no Residentes) legal-catalogue
# entries supporting the current M210 IRNR engine.
#
# Authoring scope: TRLIRNR Arts 2, 10, 13.1, 13.1.h, 24, 25.1.a, 25.1.b, 25.1.f under
# the consolidated text approved by Real Decreto Legislativo
# 5/2004 (BOE-A-2004-4527). Required_text patterns are populated
# from the bundled corpus so the M210 base, rate, treaty, and tariff rows
# are checked against the provisions that bind them.
#
# TRLIRNR Art 10 is the representante-fiscal authority for M210.

