notes = "TRLIRNR art 13.1: the statutory source-scope gateway. It defines the enumerated rentas obtained in Spanish territory, which the M210 ledger classifier uses before admitting an explicitly classified income observation to the IRNR gross-income target. Article 25 only determines the rate after this territorial classification."
required_text = ["Se consideran rentas obtenidas en territorio espanol las siguientes"]

