# Orden EHA/3316/2010 art 5: plazo de presentación del modelo 210, consolidated
# in vigor 24/06/2026 (modified by Orden HAC/56/2024 art 4.2 / BOE-A-2024-1772 and
# Orden HAC/623/2026 art 1.2 / BOE-A-2026-13573). Binding deadline provision. Only
# the "resto de rentas con resultado a ingresar" GENERAL trimestral plazo (20 primeros
# días de abril, julio, octubre y enero por el trimestre natural anterior) is
# period-keyable and grounds the M210 trimestral a-ingresar deadline windows. The
# arrendamiento-a-ingresar (abril del año siguiente), cuota-cero (1-20 enero),
# a-devolver (desde 1 febrero, 4 años), transmisiones (art 14.4 Reglamento) and
# rentas-imputadas (presentación todo el año natural siguiente, 1 enero-31 diciembre;
# la domiciliación es 1 abril-23 diciembre) plazos are RESULTADO/TIPO-dependent, not
# expressible as a single annual period token, and are deferred to a resultado/tipo
# keyed deadline-modelling decision.
