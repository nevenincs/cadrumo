notes = """RIVA art 69: plazos para las anotaciones registrales. Es la norma operativa a \
la que remite el art 35 del RD 1065/2007 para fijar el periodo de imputacion del Modelo \
347, de modo que citar el art 35 sin este articulo deja la referencia a un salto de \
distancia de la regla efectiva. Las operaciones deben estar asentadas en los libros \
registro en el momento de la liquidacion y pago del impuesto o, en todo caso, antes de \
que finalice el plazo de presentacion en periodo voluntario. Texto extraido de la API de \
datos abiertos del BOE el 2026-08-06 tomando la ultima version consolidada, redaccion \
BOE-A-2013-11216 en vigor desde 2013-10-27."""
