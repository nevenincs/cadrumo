RDL 7/2024 art. 11 apartado 2: reduccion del 25 por ciento de la cuota devengada por operaciones \
corrientes del regimen especial simplificado del IVA correspondiente al ano 2024. POR QUE UNA \
ENTRADA PROPIA. El articulo 11 ya esta citado en el catalogo del IRPF como \
real-decreto-ley-7-2024:art-11, y esa entrada fundamenta el APARTADO 1, que reduce el rendimiento \
neto de modulos del IRPF. Comparten el porcentaje pero no la magnitud ni el impuesto, asi que una \
sola entrada para ambos haria que una cita del IVA descansara sobre frases del IRPF. Esta entrada se \
identifica por el apartado, siguiendo la granularidad ya usada en el catalogo \
(trlirnr-rdleg-5-2004:art-13.1, ley-58-2003:art-27.2). ALCANCE. El apartado declara que la reduccion \
se tiene en cuenta para el calculo de la CUOTA ANUAL de 2024: no es una reduccion trimestral \
repetida cuatro veces, y required_text exige esa frase precisamente porque es la que distingue las \
dos lecturas. GEOGRAFIA. El apartado no enumera municipios: se remite al anexo del RDL 6/2024, que \
required_text exige literalmente, de modo que esta entrada no puede satisfacerse si la remision \
desapareciera del texto. APLICABILIDAD. Cuando la reduccion rige no lo dice este articulo sino la \
disposicion final decimocuarta de la misma norma; la entrada real-decreto-ley-7-2024:df-14 la cita, \
y effective_from se toma de alli en lugar de deducirse. PROVENANCIA DE LA REVISION. Entrada \
