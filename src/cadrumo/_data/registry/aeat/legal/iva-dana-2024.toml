# DANA 2024 relief authority: the affected geography and the 25 per cent
# reduction of the 2024 annual IVA regimen simplificado cuota devengada por
# operaciones corrientes.
#
# Kept in a dedicated file rather than appended to iva.toml, following the
# precedent stated in enrolled-forms-sources.toml: the shared per-tax
# catalogues are hot files, and a peer edit to iva.toml would sweep these
# entries.
#
# WHY THE GEOGRAPHY IS NEVER A LIST IN THIS REPOSITORY. RDL 7/2024 art. 11.2
# does not enumerate the municipalities it applies to; it applies to "los
# terminos municipales citados en el anexo del Real Decreto-ley 6/2024". That
# anexo is expressly MUTABLE: art. 1.4 of RDL 6/2024 empowers the Consejo de
# Ministros to amend it "en funcion de la evolucion de los danos producidos que
# se pudieran identificar con posterioridad". A municipal list transcribed into
# code or into a registry table would therefore be a snapshot masquerading as
# law. The geography lives here as a citation to the consolidated anexo bytes
# plus the date those bytes were consolidated, so the answer to "which
# municipalities" always carries "as of when".
#
# STATE OF THE ANEXO AT CONSOLIDATION. The BOE consolidated anexo carries 78
# entries and no amendment note, and a sweep of the BOE daily summaries from
# 2024-11-06 to 2025-04-30 found no publication amending it. The Consejo de
# Ministros power in art. 1.4 therefore appears unexercised over that window;
# that is an observation about the bundled bytes, not a guarantee about the
# future, which is exactly why consolidated_as_of is recorded.
#
# ON THE PINNED HASHES. The two consolidated documents were already bundled;
# these sources pin the committed bytes rather than re-acquiring them. A
# re-fetch of the same BOE document does NOT reproduce the same sha256: the
# consolidated page embeds a per-response cache-busting nonce in a script tag
# ("jquery.djRAE.js?rnd=NNN"), so two fetches minutes apart differ by three
# digits and nothing else. The pinned digest is therefore an identity for the
# committed artefact, and a drift investigation must diff the bytes rather than
# conclude from an unequal hash that the law changed.

