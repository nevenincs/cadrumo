bytes = 288829
retrieved_at = 2026-08-15
# The AEAT historical-index title is retained verbatim despite the PDF filename
# (DR194_2016.pdf); the document itself identifies its design as Ejercicio 2019.
# The AEAT index's "Orden de 18 de ENERO de 1999" is an index typo: BOE names the
# approving norm "Orden de 18 de NOVIEMBRE de 1999" throughout, and that orden is
# BOE-A-1999-22309 -- NOT "a different orden of the same date". Its long title
# enumerates modelos 123 and 193 first, but modelo 194 is approved by the same
# orden, in anexos VII/VIII, with its record designs in ANEXO X; Orden HFP/1284/2023
# says so verbatim ("los disenos de registro del modelo 194, contenidos en el anexo
# X de la Orden de 18 de noviembre de 1999").
#
# The design is successor-bounded at 2022 on BOE's own consolidated "Referencias
# posteriores" list for BOE-A-1999-22309, read 2026-08-30 -- the amendment list an
# earlier pass could not reach. Anexo X is modified in 2016 (HFP/1822/2016), 2019
# (HAC/1276/2019), 2023 (HFP/1284/2023) and 2024 (HAC/1504/2024), and by NOTHING
# between 2020 and 2022. So this edition governs 2019-2022: HAC/1276/2019 df unica
# applies it "por primera vez" to ejercicio 2019, which opens a continuing window,
# and HFP/1284/2023 is the first later amendment, closing it at 2022.
applies_from = 2019-01-01
applies_to = 2022-12-31
source_url = "https://sede.agenciatributaria.gob.es/static_files/Sede/Disenyo_registro/DR_100_199/archivos/DR194_2016.pdf"
review_status = "reviewed"

