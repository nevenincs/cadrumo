# OPEN-ENDED, and that is a positive finding rather than an absent successor. BOE's
# consolidated "Referencias posteriores" for BOE-A-1999-22309 (read 2026-08-30)
# records NO amendment to anexo X after HAC/1504/2024, whose df unica applies this
# edition "por primera vez" to ejercicio 2024 -- por primera vez opens a continuing
# window, it does not confine the design to its first ejercicio. AEAT agrees: this
# file is the artefact on the CURRENT disenos-de-registro page (captured 2026-08-15)
# while the 2023 and 2019 editions sit under "ejercicios anteriores". The page header
# reads "Ejercicio 2024", but positions 5-8 are a FILER-supplied EJERCICIO field, so
# the year is not baked into the record -- exactly as for "aeat-dr-188-2023", whose
# header reads "Ejercicio 2023" and which is correctly left open here.
source_url = "https://sede.agenciatributaria.gob.es/static_files/Sede/Disenyo_registro/DR_100_199/DR_Modelo_194_2024.pdf"
review_status = "reviewed"

