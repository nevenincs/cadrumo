# Comunidad de Madrid autonomic-deducción legal authorities.
#
# Texto Refundido de las disposiciones legales de la Comunidad de Madrid en
# materia de tributos cedidos por el Estado, aprobado por Decreto Legislativo
# 1/2010, de 21 de octubre. Grounds the "Por nacimiento o adopción de hijos"
# deducción autonómica (Modelo 100 casilla 1039) alongside the LIRPF framework
# article ley-35-2006:art-77 (cuota líquida autonómica).
#
# The corpus cross-check resolves against the bundled authoritative AEAT Renta
# 2025 manual (parte 2, deducciones autonómicas), which reproduces the DL 1/2010
# text and the current figures verbatim. The document_id / permalink identify
# the consolidated Madrid text and are agent-prepared pending operator
# re-stamp; the load-bearing grounding is the required_text cross-check against
# the bundled manual.

