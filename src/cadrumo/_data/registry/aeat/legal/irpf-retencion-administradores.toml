# Retencion rate on rendimientos del trabajo percibidos por administradores y
# miembros de consejos de administracion (Modelo 111 clave E / Modelo 190
# clave E), fixed by LIRPF art. 101.2.
#
# The binding provisions are already declared in irpf.toml as
# [legal."ley-35-2006:art-101"] and [legal."rd-439-2007:art-80"] and are NOT
# redeclared here (the loader refuses duplicate legal ids across the legal
# catalogue). This file carries only the rate parameters those articles fix,
# so the three figures stop being Python literals in core/aggregation.py.
#
# Grounded first against the bundled consolidated corpus
# (corpus/normatives/html/ley-35-2006.html#a101 and
# corpus/normatives/html/rd-439-2007.html#a80), then cross-checked against the
# LIVE BOE Legislacion Consolidada open-data API on 2026-08-13: bloque a101 of
# BOE-A-2006-20764 (redaccion en vigor desde 2023-01-01, fijada por el art. 65
# de la Ley 31/2022, Ref. BOE-A-2022-22128) and bloque a80 of BOE-A-2007-6820
# (redaccion en vigor desde 2023-12-07, fijada por el art. 1.4 del Real
# Decreto 1008/2023, Ref. BOE-A-2023-24841). Both articles state the same
# three figures byte-identically against the bundled corpus, no drift found:
#
# LIRPF art. 101.2: "El porcentaje de retención e ingreso a cuenta sobre los
# rendimientos del trabajo que se perciban por la condición de administradores
# y miembros de los consejos de administración, de las juntas que hagan sus
# veces, y demás miembros de otros órganos representativos, será del 35 por
# ciento. No obstante, en los términos que reglamentariamente se establezcan,
# cuando los rendimientos procedan de entidades con un importe neto de la
# cifra de negocios inferior a 100.000 euros, el porcentaje de retención e
# ingreso a cuenta será del 19 por ciento."
#
# RIRPF art. 80.1.3.º: "El 35 por ciento para las retribuciones que se
# perciban por la condición de administradores y miembros de los Consejos de
# Administración, de las Juntas que hagan sus veces y demás miembros de otros
# órganos representativos. No obstante, cuando los rendimientos procedan de
# entidades cuyo importe neto de la cifra de negocios del último período
# impositivo finalizado con anterioridad al pago de los rendimientos sea
# inferior a 100.000 euros, el porcentaje de retención e ingreso a cuenta será
# del 19 por ciento."
#
# Neither article's amendment history (tracked above from the live payload)
# touches these three figures: the Ley 31/2022 change to art. 101 modifies
# apartados 3 and 9 only, and the RD 1008/2023 change to RIRPF art. 80 modifies
# apartado 1.4º (obras literarias/artísticas/científicas) only. The
# administrador figures in apartado 1.3º have stood since the 2007 text.

[parameters."lirpf-art-101:retencion-administrador-general"]
evidence_tier = "legal_authority"
value = "0.35"
unit = "fraction"
applies_to = "irpf-retencion-trabajo-administrador-general"
legal_refs = ["ley-35-2006:art-101", "rd-439-2007:art-80"]
review_status = "reviewed"
reviewed_at = 2026-08-13
reviewed_by = "agent-authored from bundled ley-35-2006.html#a101 and rd-439-2007.html#a80, live BOE cross-checked 2026-08-13; operator to re-stamp"
notes = "LIRPF art 101.2 primer inciso / RIRPF art 80.1.3.º: tipo general del 35 por ciento sobre las retribuciones percibidas por administradores y miembros de consejos de administración, juntas que hagan sus veces y demás miembros de otros órganos representativos. Modelo 111 clave E, Modelo 190 clave E."

[parameters."lirpf-art-101:retencion-administrador-reducida"]
evidence_tier = "legal_authority"
value = "0.19"
unit = "fraction"
applies_to = "irpf-retencion-trabajo-administrador-reducida"
legal_refs = ["ley-35-2006:art-101", "rd-439-2007:art-80"]
review_status = "reviewed"
reviewed_at = 2026-08-13
reviewed_by = "agent-authored from bundled ley-35-2006.html#a101 and rd-439-2007.html#a80, live BOE cross-checked 2026-08-13; operator to re-stamp"
notes = "LIRPF art 101.2 segundo inciso / RIRPF art 80.1.3.º segundo párrafo: tipo reducido del 19 por ciento que sustituye al 35 por ciento cuando la entidad pagadora tiene un importe neto de la cifra de negocios inferior al umbral de este mismo bloque de parámetros (100.000 euros). RIRPF precisa que el período de referencia es el último período impositivo finalizado con anterioridad al pago, elevado al año si duró menos de doce meses."

[parameters."lirpf-art-101:retencion-administrador-incn-umbral-eur"]
evidence_tier = "legal_authority"
value = "100000"
unit = "EUR"
applies_to = "irpf-retencion-trabajo-administrador-incn-umbral"
legal_refs = ["ley-35-2006:art-101", "rd-439-2007:art-80"]
review_status = "reviewed"
reviewed_at = 2026-08-13
reviewed_by = "agent-authored from bundled ley-35-2006.html#a101 and rd-439-2007.html#a80, live BOE cross-checked 2026-08-13; operator to re-stamp"
notes = "LIRPF art 101.2 / RIRPF art 80.1.3.º: umbral de 100.000 euros de importe neto de la cifra de negocios de la entidad pagadora por debajo del cual se aplica el tipo reducido del 19 por ciento en lugar del general del 35 por ciento ('inferior a 100.000 euros')."
