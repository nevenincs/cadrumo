published_at = 2007-09-05
effective_from = 2014-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-06
reviewed_by = "agent-review"
notes = """RD 1065/2007 art 35: criterios de imputacion temporal del Modelo 347. Es la \
regla que decide a que periodo se imputa una operacion, distinta del art 31 (quien \
declara) y de los arts 33/34 (que importe se declara). La operacion se entiende \
producida en el periodo en que, conforme al art 69 del Reglamento del IVA, debe \
realizarse la anotacion registral de la factura -- NO en la fecha de devengo del art 75 \
LIVA. Las operaciones en regimen especial del criterio de caja son la excepcion y se \
imputan al devengo del art 163 terdecies LIVA. Texto extraido de la API de datos \
abiertos del BOE el 2026-08-06 tomando la ultima version consolidada, redaccion \
BOE-A-2013-11216 en vigor desde 2014-01-01."""
required_text = [
    "Criterios de imputación temporal",
    "se debe realizar la anotación registral de la factura",
]
