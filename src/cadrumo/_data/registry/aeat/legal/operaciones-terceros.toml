notes = """\
RGAT art 34: cumplimentacion de la declaracion anual de operaciones con terceras \
personas. Apartado 1 enumera los datos a consignar, incluido el NIF de cada \
contraparte (letra b) y el importe total anual de las operaciones (letra c). Letra i) \
exige declarar SEPARADAMENTE de otras operaciones las cantidades percibidas en \
contraprestacion por transmisiones de inmuebles sujetas a IVA -- la base legal del \
campo "IMPORTE PERCIBIDO POR TRANSMISIONES" del diseno de registro, pareado con cada \
importe trimestral. Apartado 2.a) fija que el importe declarado es el total de la \
contraprestacion, incluidas cuotas y recargos repercutidos o soportados. Texto \
verificado contra el consolidado bundled corpus/normatives/html/rd-1065-2007.html.\
"""
required_text = [
    "el número de identificación fiscal de cada una de las personas o entidades",
    "las cantidades que se perciban en contraprestación por transmisiones de inmuebles",
    "se declarará el importe total de las contraprestaciones, incluidas las cuotas y recargos",
]

