reviewed_by = "agent-review"
notes = """RD 1065/2007 art 35: criterios de imputacion temporal del Modelo 347. Es la \
regla que decide a que periodo se imputa una operacion, distinta del art 31 (quien \
declara) y de los arts 33/34 (que importe se declara). La operacion se entiende \
producida en el periodo en que, conforme al art 69 del Reglamento del IVA, debe \
realizarse la anotacion registral de la factura -- NO en la fecha de devengo del art 75 \
LIVA. Las operaciones en regimen especial del criterio de caja son la excepcion y se \
imputan al devengo del art 163 terdecies LIVA. Texto extraido de la API de datos \
abiertos del BOE el 2026-08-06 tomando la ultima version consolidada, redaccion \
BOE-A-2013-11216 en vigor desde 2014-01-01."""
required_text = [
    "Criterios de imputación temporal",
    "se debe realizar la anotación registral de la factura",
]

[legal."rd-1065-2007:art-33"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "real_decreto"
corpus_ref = "corpus/normatives/html/rd-1065-2007.html#a33"
document_id = "BOE-A-2007-15984"
article = "33"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2007-15984#a33"
published_at = 2007-09-05
effective_from = 2008-01-01
review_status = "agent_reviewed"
reviewed_at = 2026-08-27
reviewed_by = "agent-review"
notes = """\
RGAT art 33: contenido de la declaracion anual de operaciones con terceras personas. \
Fija el umbral general de 3.005,06 EUR por contraparte y ano natural (parrafo 1), \
excluye determinadas operaciones del deber de declarar (apartado 2), y establece un \
umbral separado de 300,51 EUR para los cobros por cuenta de terceros de honorarios \
profesionales o derechos de propiedad intelectual/industrial (apartado 4, remitiendo a \
los obligados del art 31.3). Es la base reglamentaria de las claves A/B (umbral general) \
y C (cobros por cuenta de terceros) del diseno de registro del Modelo 347. El parrafo \
segundo del apartado 1 computa por separado las entregas y las adquisiciones, de modo que el \
umbral se juzga por contraparte y sentido de la operacion; el apartado 3 relaciona las \
subvenciones satisfechas por las Administraciones Publicas cualquiera que sea su importe. Del \
apartado 2 se aplican la letra g), que excluye las importaciones y exportaciones de mercancias \
cualquiera que sea la residencia de la contraparte, y la letra i), que excluye las operaciones ya \
incluidas en otra declaracion periodica de contenido coincidente (Modelo 349, y el resumen anual de \
retenciones del art 108.2 RIRPF para quien practica la retencion). Texto verificado contra el \
consolidado bundled corpus/normatives/html/rd-1065-2007.html.\
"""
required_text = [
    "hayan superado la cifra de 3.005,06 euros durante el año natural",
    "se computarán de forma separada las entregas y las adquisiciones de bienes y servicios",
    "a quienes hayan satisfecho subvenciones, auxilios o ayudas, cualquiera que sea su importe",
    "haya superado la cifra de 300,51 euros",
    "Las importaciones y exportaciones de mercancías",
    "En general, todas aquellas operaciones respecto de las que exista una obligación periódica de suministro de información",
]

