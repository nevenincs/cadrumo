# The renter's parallel to amortizacion_vivienda_afecto / ibi_vivienda_afecto /
# comunidad_vivienda_afecto: the same partially-affected-dwelling cost, borne
# as rent instead of ownership. Deducts at the raw affectation ratio like
# those three siblings -- no statutory_multiplier -- grounded on the general
