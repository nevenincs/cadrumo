# LIRPF art. 30.2.1a caps this premium at "la cuota maxima por contingencias
# comunes que este establecida, EN CADA EJERCICIO ECONOMICO, en el citado
# regimen especial" -- the figure is re-fixed every year by the cotizacion
# orden, so it cannot be one constant. The registry previously carried a flat
# 15000, which is not the figure for ANY ejercicio; every year below is higher,
# so that constant under-stated the allowance and cost the taxpayer deduction.
#
# 2022-2025 are the amounts AEAT PRINTS in the Manual practico Renta for each
# ejercicio, together with their arithmetic. 2026 has no Manual yet (it is
# published in 2027) and is derived from Orden PJC/297/2026 art. 18.1 and
# 18.2.a using AEAT's own method, which reproduces all four published years to
# the cent.
[[profiles.proportionality.statutory_cap_schedule]]
# Manual practico Renta 2022: "14.057,40 euros [0,283 x (4.139,40 x 12)]"
value = "14057.40"
valid_from = 2022-01-01
valid_to = 2022-12-31

[[profiles.proportionality.statutory_cap_schedule]]
