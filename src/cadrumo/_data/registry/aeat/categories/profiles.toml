url = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764"
quote = "a) Las primas de seguro de enfermedad satisfechas por el contribuyente en la parte correspondiente a su propia cobertura y a la de su cónyuge e hijos menores de veinticinco años que convivan con él. El límite máximo de deducción será de 500 euros por cada una de las personas señaladas anteriormente o de 1.500 euros por cada una de ellas con discapacidad."
