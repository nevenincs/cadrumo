# Spending-category deductibility profiles for IRPF.
#
# THE FILE CARRIES NO YEAR. The proportionality rules -- kind, ratios, the
# statutory multiplier, the caps -- are framework values that do not vary by
# filing year, and versioning them by copying the whole file once cost 1013
# duplicated lines to vary 82 lines of citation metadata. What genuinely enters
# per year is the evidence, so the year lives on the evidence: every citation
# declares the closed span it is asserted over, and the years this corpus can be
# resolved for are DERIVED from those spans.
#
# A WINDOW IS A GROUNDING CLAIM. Widening one asserts that the cited document
# supports the rule across the wider span. Do not widen a window to admit a
# filing year; read that year's source and add its citation. A citation whose
# reference or url names a year may not reach outside it, and a gate enforces
# that -- it is the exact act that produced the retired 2024 mirror, whose 41
# year-dated citations were rewritten by string substitution from this file and
# are not carried forward.
#
# EVERY SPAN HERE IS 2025 BECAUSE 2025 IS WHAT WAS REVIEWED. The statutory
# citations are almost certainly stable across neighbouring years, but these
# citations carry free-text references rather than registry legal-reference ids,
# so no gate can check a wider span and an author's confidence is not evidence.
# Converting them to legal-reference ids is what would let the provision-window
# gate widen them honestly.

