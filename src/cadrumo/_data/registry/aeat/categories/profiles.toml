value = "16672.66"
valid_from = 2025-01-01
valid_to = 2025-12-31

[[profiles.proportionality.statutory_cap_schedule]]
# Derived from BOE Orden PJC/297/2026 art. 18.1 (base 5.101,20) and art. 18.2.a
