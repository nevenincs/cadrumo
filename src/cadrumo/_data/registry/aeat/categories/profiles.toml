# electricidad, telefonía e Internet" together as the one enumerated
# suministros list, so a fixed telephone line at the taxpayer's partially
# affected vivienda habitual carries the SAME 30 % statutory_multiplier on
# top of the home-area ratio -- never art. 28.1 alone, which is the general
# deductibility article and does not itself establish the 30 % carve-out.
