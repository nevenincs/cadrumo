display_label = "categories.registry.suministros_local_afecto.label"
iva_hint = "general"

# Full deductibility, and the grounding is deliberately NOT the home-office
# rule. The immovable property where the activity is carried on is an elemento
# patrimonial afecto under art. 29.1.a), so its supply costs are ordinary
# deductible expense under art. 28.1. The art. 30.2.5.a b) 30 % rule is a
# restrictive carve-out for a vivienda habitual only partly given over to the
# activity, and carries no statutory_multiplier here because it does not govern
# a local used for the activity.
[profiles.proportionality]
kind = "full_deductible"
notes = "categories.registry.suministros_local_afecto.notes"

