# Modelo 840 (IAE - declaracion censal). Enrolled by the IAE art.82
# cifra-de-negocios threshold-continuity test. Annual context 2024 records
# INCN 999,999.99 EUR (< 1,000,000, exempt) and annual context 2026 records
# INCN 1,000,000.00 EUR (not exempt because the threshold is strict). Both
# contexts are persisted via the real encrypted-SQLite
# CalculationObservationRepository with encrypted source metadata, loaded
# back, and asserted for strict pydantic equality + independent exemption
# status + ejercicio casilla correctness. Evidence class is
# threshold_continuity (ad_hoc cadence, no calculation engine; RDL 2/2004
# arts. 78/82/90 / Orden HAC/2572/2003).
[modelo]
modelo = "840"
renta_years = [2024, 2026]
evidence_class = "threshold_continuity"
enrolling_test = "src/cadrumo/application/calculations/tests/test_modelo_840_iae_continuity.py"
