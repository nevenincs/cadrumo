# Model-provider credential catalog.
#
# Read at runtime by cadrumo.domain.provider_settings.catalog, which validates
# every entry strictly. This is the one place that says which providers a
# profile can hold a credential for, what kind of credential each takes, and
# which Cadrumo consumers may use it. Listing a provider here does not make it
# eligible for the hosted assistant lane; cadrumo-agent's hosting contract owns
# that.
#
# auth_kind:
#   api_key                          one direct API key
#   api_key_with_base_url            a direct API key for an Anthropic-compatible
#                                    gateway; the effective URL is the stored one,
#                                    else default_base_url
#   oauth_token_or_provider_sign_in  a person-entered OAuth token, or the
#                                    provider's own CLI sign-in
#   provider_sign_in_only            the provider's own CLI sign-in; Cadrumo holds
#                                    no credential
#
# development_setting names the Cadrumo settings field read as the fallback for
# an unset record in development storage mode only. Installed builds never read
# it.
#
# agent_credential_id is the id cadrumo-agent keys this credential by in the
# hosted-agent standard-input frame. It is absent for a credential the agent
# never receives: an extraction-only key, and any provider-owned sign-in.

schema_version = 1

[[providers]]
id = "anthropic"
display_name = "Anthropic"
auth_kind = "api_key"
consumers = ["extraction", "assistant"]
development_setting = "cadrumo_llm_anthropic_api_key"
agent_credential_id = "claude"

