[language.es]
short_description = "Un formulario oficial de declaracion de la AEAT, identificado por un numero."
definition = "Formulario normalizado de declaracion que la AEAT prescribe para una obligacion tributaria y un periodo concretos, identificado de forma unica por su numero oficial de tres digitos (por ejemplo, Modelo 100, Modelo 303, Modelo 720). Cada modelo se publica mediante Orden Ministerial en el BOE y se cataloga en la Sede Electronica de la AEAT. El numero forma parte del nombre legal: el Modelo 303 y el Modelo 100 no son intercambiables. No designa informes ad hoc, hojas de calculo internas ni documentos censales."

[language.es.source]
citation = "AEAT, Sede Electronica - Todas las gestiones / Modelos y formularios; cada modelo se aprueba por Orden Ministerial publicada en el BOE."
authority = "aeat"

[[language.es.term]]
label = "modelo"
term_status = "preferred"
part_of_speech = "noun"
grammatical_gender = "masculine"

[language.en]
short_description = "An official AEAT declaration form, identified by a number (for example Modelo 303)."
definition = "Standardised declaration form that the AEAT prescribes for a specific tax obligation and period, uniquely identified by its official three-digit number (for example, Modelo 100, Modelo 303, Modelo 720). Each modelo is published by Ministerial Order in the BOE and catalogued on the AEAT Sede Electronica. The number is part of the legal name: Modelo 303 and Modelo 100 are not interchangeable. It does not refer to ad hoc reports, internal spreadsheets, or census documents."

[language.en.source]
citation = "AEAT, Sede Electronica - All procedures / Modelos y formularios; each modelo is approved by Ministerial Order published in the BOE."
authority = "aeat"

[[language.en.term]]
label = "tax form"
term_status = "admitted"
part_of_speech = "noun"

[language.ca]
short_description = "Un formulari oficial de declaració de l'AEAT, identificat per un número (per exemple Model 303)."
definition = "Formulari normalitzat de declaració que l'AEAT prescriu per a una obligació tributària i un període concrets, identificat de manera única pel seu número oficial de tres dígits (per exemple, Model 100, Model 303, Model 720). Cada model es publica mitjançant Ordre Ministerial al BOE i es cataloga a la Seu Electrònica de l'AEAT. El número forma part del nom legal: el Model 303 i el Model 100 no són intercanviables. No designa informes ad hoc, fulls de càlcul interns ni documents censals."

[language.ca.source]
citation = "AEAT, Sede Electronica - Todas las gestiones / Modelos y formularios; cada modelo se aprueba por Orden Ministerial publicada en el BOE."
authority = "aeat"

[language.hu]
short_description = "Az AEAT hivatalos bevallási űrlapja, amelyet egy szám azonosít (például Modelo 303)."
definition = "Szabványosított bevallási nyomtatvány, amelyet az AEAT egy konkrét adókötelezettségre és időszakra ír elő, egyedileg azonosítva hivatalos háromjegyű számával (például Modelo 100, Modelo 303, Modelo 720). Minden modellt miniszteri rendelettel tesznek közzé a BOE-ban, és az AEAT Elektronikus Ügyfélkapuján katalogizálják. A szám a jogi elnevezés része: a Modelo 303 és a Modelo 100 nem cserélhető fel egymással. Nem jelöl ad hoc jelentéseket, belső táblázatokat vagy censal dokumentumokat."

[language.hu.source]
citation = "AEAT, Elektronikus Ügyfélkapu - Minden ügyintézés / Modellek és nyomtatványok; minden modellt a BOE-ban közzétett miniszteri rendelettel hagynak jóvá."
authority = "aeat"
