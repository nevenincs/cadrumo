[concept]
concept_id = "prorrata-especial"
domain = "concepto"
lifecycle = "approved"
domain_refs = ["modelo:303"]
legal_refs = ["ley-37-1992:art-104"]
broader = ["prorrata"]
created_at = 2026-06-10
updated_at = 2026-07-22

[language.es]
short_description = "Modalidad de prorrata que deduce el IVA de cada sector de actividad por separado."
definition = "Modalidad de la regla de prorrata en la que las cuotas soportadas se deducen segun el destino real de cada bien o servicio, aplicando la prorrata general solo a las cuotas comunes a varios sectores. Es obligatoria cuando la prorrata general superaria en mas de un 10 por ciento la deduccion que resulta de la especial."

[language.es.source]
citation = "Articulo 103 de la Ley 37/1992 del IVA (LIVA)."
authority = "boe"

[[language.es.term]]
label = "prorrata especial"
term_status = "preferred"
part_of_speech = "noun"
grammatical_gender = "feminine"

[language.en]
short_description = "The prorrata variant that deducts input VAT per activity sector separately."
definition = "The variant of the pro rata rule under which input VAT is deducted according to the actual use of each good or service, applying the general pro rata only to inputs shared across sectors."

[language.en.source]
citation = "Article 103 of Law 37/1992 on VAT (LIVA)."
authority = "boe"

[[language.en.term]]
label = "special pro rata"
term_status = "preferred"
part_of_speech = "noun"

[language.ca]
short_description = "Modalitat de prorrata que dedueix l'IVA de cada sector d'activitat per separat."
definition = "Modalitat de la regla de prorrata en la qual les quotes suportades es dedueixen segons la destinació real de cada bé o servei, aplicant la prorrata general només a les quotes comunes a diversos sectors. És obligatòria quan la prorrata general superaria en més d'un 10 per cent la deducció que resulta de l'especial."

[language.ca.source]
citation = "Articulo 103 de la Ley 37/1992 del IVA (LIVA)."
authority = "boe"

[[language.ca.term]]
label = "prorrata especial"
term_status = "preferred"
part_of_speech = "noun"
grammatical_gender = "feminine"

[language.hu]
short_description = "A prorrata azon változata, amely tevékenységi szektoronként külön vonja le az előzetes áfát."
definition = "A prorrata-szabály olyan formája, amelyben a beszerzési adót az egyes termékek vagy szolgáltatások tényleges felhasználása szerint vonják le, az általános prorratát csak a több szektor közös adóira alkalmazva. Kötelező, ha az általános prorrata több mint 10 százalékkal meghaladná a különleges prorratából eredő levonást."

[language.hu.source]
citation = "A 37/1992. IVA-törvény (LIVA) 103. cikke."
authority = "boe"

[[language.hu.term]]
label = "különleges arányosítás"
term_status = "admitted"
