[language.es]
short_description = "El fichero de texto de ancho fijo que la AEAT admite para la presentacion de un modelo."
definition = "Formato de fichero de texto de ancho fijo que la AEAT acepta para la presentacion electronica de un modelo. La aplicacion genera este fichero al exportar una declaracion, para que la persona lo suba ella misma a la Sede Electronica. Toma su nombre del Boletin Oficial del Estado (BOE), donde se publica el diseno de registro de cada modelo."

[language.es.source]
citation = "AEAT, Disenos de registro publicados por Orden Ministerial en el BOE para cada modelo."
authority = "aeat"

[[language.es.term]]
label = "fichero-BOE"
term_status = "preferred"
part_of_speech = "noun"

[language.en]
short_description = "The fixed-width text file format the AEAT accepts for filing a modelo."
definition = "A fixed-width text file format the AEAT accepts for the electronic filing of a modelo. The application generates this file when exporting a return, so the person can upload it themselves to the Sede Electronica. It takes its name from the Boletin Oficial del Estado (BOE), where each modelo record layout is published."

[language.en.source]
citation = "AEAT, record layouts published by Ministerial Order in the BOE for each modelo."
authority = "aeat"

[language.ca]
short_description = "El fitxer de text d'amplada fixa que l'AEAT admet per a la presentació d'un model."
definition = "Format de fitxer de text d'amplada fixa que l'AEAT accepta per a la presentació electrònica d'un model. L'aplicació genera aquest fitxer en exportar una declaració, perquè la persona el pugi ella mateixa a la Seu Electrònica. Pren el seu nom del Butlletí Oficial de l'Estat (BOE), on es publica el disseny de registre de cada model."

[language.ca.source]
citation = "AEAT, Disenos de registro publicados por Orden Ministerial en el BOE para cada modelo."
authority = "aeat"

[language.hu]
short_description = "Az AEAT által egy modell benyújtásához elfogadott rögzített szélességű szövegfájl."
definition = "Rögzített szélességű szöveges fájlformátum, amelyet az AEAT elfogad egy modell elektronikus benyújtásához. Az alkalmazás egy bevallás exportálásakor hozza létre ezt a fájlt, hogy a személy maga töltse fel az Elektronikus Ügyfélkapun. Nevét a Boletín Oficial del Estado-tól (BOE) kapja, ahol minden modell nyilvántartási formátumát közzéteszik."

[language.hu.source]
citation = "AEAT, az egyes modellekhez miniszteri rendelettel a BOE-ban közzétett nyilvántartási formátumok (Diseños de Registro)."
authority = "aeat"
