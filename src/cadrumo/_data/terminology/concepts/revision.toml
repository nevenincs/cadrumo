created_at = 2026-06-11
updated_at = 2026-07-22

[language.es]
short_description = "La version de las reglas de un modelo que se aplica a un periodo, segun el registro."
definition = "La version de las reglas de un modelo que rige para un periodo de presentacion concreto, nombrada en el registro. Por ejemplo, una revision como 2019-y-siguientes cubre las presentaciones de 2019 en adelante. La AEAT publica una revision por cada (modelo, ano, periodo) mediante Orden Ministerial, de modo que la revision aplicable es un hecho derivado, no una eleccion."

[language.es.source]
citation = "AEAT, Ordenes Ministeriales que aprueban cada revision de modelo publicadas en el BOE."
authority = "aeat"

[[language.es.term]]
label = "revision"
term_status = "preferred"
part_of_speech = "noun"
grammatical_gender = "feminine"

[language.en]
short_description = "The version of a modelo's rules that applies to a given period, named in the registry."
definition = "The version of a modelo rules that applies to a specific filing period, named in the registry. For example, a revision such as 2019-y-siguientes covers filings from 2019 onward. The AEAT publishes one revision per (modelo, year, period) by Ministerial Order, so the applicable revision is a derived fact, not a choice."

[language.en.source]
citation = "AEAT, Ministerial Orders approving each modelo revision, published in the BOE."
authority = "aeat"

[language.ca]
short_description = "La versió de les regles d'un model que s'aplica a un període, segons el registre."
definition = "La versió de les regles d'un model que regeix per a un període de presentació concret, anomenada en el registre. Per exemple, una revisió com 2019-y-siguientes cobreix les presentacions de 2019 en endavant. L'AEAT publica una revisió per a cada (model, any, període) mitjançant Ordre Ministerial, de manera que la revisió aplicable és un fet derivat, no una elecció."

[language.ca.source]
citation = "AEAT, Ordenes Ministeriales que aprueban cada revision de modelo publicadas en el BOE."
authority = "aeat"

[language.hu]
short_description = "Egy modell szabályainak adott időszakra érvényes változata, a nyilvántartásban megnevezve."
definition = "Egy modell szabályainak azon változata, amely egy konkrét benyújtási időszakra érvényes, a nyilvántartásban megnevezve. Például egy 2019-y-siguientes elnevezésű revízió a 2019-től kezdődő benyújtásokra vonatkozik. Az AEAT minden (modell, év, időszak) kombinációhoz miniszteri rendelettel tesz közzé egy revíziót, így az alkalmazandó revízió levezetett tény, nem választás kérdése."

[language.hu.source]
citation = "AEAT, a BOE-ban közzétett miniszteri rendeletek, amelyek az egyes modell-revíziókat jóváhagyják."
authority = "aeat"
