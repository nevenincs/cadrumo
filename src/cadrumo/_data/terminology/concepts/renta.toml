[language.es]
short_description = "La base de renta del IRPF; coloquialmente, la declaracion anual del IRPF (Modelo 100)."
definition = "La renta gravada por el IRPF, que agrega los rendimientos del trabajo, del capital, de actividades economicas, las ganancias y perdidas patrimoniales y las imputaciones de renta. En lenguaje corriente designa tambien la declaracion anual de la Renta, presentada en el Modelo 100 a traves de la campana de Renta Web. No significa el alquiler en sentido ingles: una finca alquilada produce rendimientos del capital inmobiliario, no renta en ese sentido."

[language.es.source]
citation = "Ley 35/2006 del IRPF, Titulo I, Capitulo I (concepto y ambito de aplicacion) (BOE-A-2006-20764)."
authority = "boe"

[[language.es.term]]
label = "renta"
term_status = "preferred"
part_of_speech = "noun"
grammatical_gender = "feminine"

[language.en]
short_description = "The IRPF income base; colloquially, the annual IRPF return (Modelo 100)."
definition = "The income taxed by IRPF, aggregating employment income, capital income, income from economic activities, capital gains and losses, and imputed income. In everyday language it also refers to the annual Renta return, filed on Modelo 100 through the Renta Web campaign. It does not mean rent in the English sense: a leased property produces income from real-estate capital, not renta in this sense."

[language.en.source]
citation = "Ley 35/2006 del IRPF, Title I, Chapter I (concept and scope) (BOE-A-2006-20764)."
authority = "boe"

[language.ca]
short_description = "La base de renda de l'IRPF; col·loquialment, la declaració anual de l'IRPF (Model 100)."
definition = "La renda gravada per l'IRPF, que agrega els rendiments del treball, del capital, d'activitats econòmiques, els guanys i pèrdues patrimonials i les imputacions de renda. En llenguatge corrent designa també la declaració anual de la Renda, presentada en el Model 100 mitjançant la campanya de Renda Web. No significa el lloguer en sentit anglès: una finca llogada produeix rendiments del capital immobiliari, no renda en aquest sentit."

[language.ca.source]
citation = "Ley 35/2006 del IRPF, Titulo I, Capitulo I (concepto y ambito de aplicacion) (BOE-A-2006-20764)."
authority = "boe"

[language.hu]
short_description = "Az IRPF jövedelemalapja; köznyelvben az éves IRPF-bevallás (Modelo 100)."
definition = "Az IRPF által adóztatott jövedelem, amely összesíti a munkaviszonyból, a tőkéből, a gazdasági tevékenységekből származó jövedelmeket, a vagyoni nyereségeket és veszteségeket, valamint a jövedelem-hozzárendeléseket. A köznyelvben az éves Renta-bevallást is jelöli, amelyet a Modelo 100-on nyújtanak be a Renta Web kampányon keresztül. Nem jelent bérleti díjat az angol \"renta\" szó értelmében: egy bérbe adott ingatlan ingatlan-vagyoni tőkéből származó jövedelmet eredményez, nem ebben az értelemben vett rentát."

[language.hu.source]
citation = "A 35/2006. IRPF-törvény I. cím, I. fejezet (fogalom és alkalmazási kör) (BOE-A-2006-20764)."
authority = "boe"
