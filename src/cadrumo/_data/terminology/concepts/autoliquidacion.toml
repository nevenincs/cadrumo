[language.en]
short_description = "A self-assessment: the filer computes and pays the tax."
definition = "A tax declaration in which the taxpayer, in addition to reporting the underlying facts, self-assesses, quantifies, and, where applicable, pays the tax due."

[language.en.source]
citation = "Article 120 of Ley 58/2003, General Tributaria."
authority = "boe"

[[language.en.term]]
label = "self-assessment"
