definition = "Declaració tributària en la qual el mateix obligat tributari, a més de comunicar les dades, qualifica, quantifica i, si escau, ingressa el deute resultant del tribut."

[language.ca.source]
citation = "Articulo 120 de la Ley 58/2003, General Tributaria."
