[language.es]
short_description = "El sistema europeo de intercambio de informacion sobre el IVA para validar numeros de operador intracomunitario."
definition = "Sistema de Intercambio de Informacion sobre el IVA de la Union Europea (VAT Information Exchange System) que permite comprobar si un numero de identificacion a efectos del IVA esta registrado como operador intracomunitario en otro Estado miembro. La aplicacion puede consultarlo en modo de solo lectura para validar un numero de IVA antes de declarar una operacion intracomunitaria."

[language.es.source]
citation = "Reglamento (UE) n. 904/2010 del Consejo, sobre cooperacion administrativa y lucha contra el fraude en el ambito del IVA; Comision Europea, sistema VIES."
authority = "eu"

[[language.es.term]]
label = "VIES"
term_status = "preferred"
part_of_speech = "abbreviation"

[language.en]
short_description = "The EU VAT Information Exchange System for validating intra-Community VAT numbers."
definition = "VAT Information Exchange System of the European Union, which allows checking whether a VAT identification number is registered as an intra-Community operator in another Member State. The application can query it in read-only mode to validate a VAT number before declaring an intra-Community operation."

[language.en.source]
citation = "Council Regulation (EU) No 904/2010 on administrative cooperation and combating fraud in the field of VAT; European Commission VIES system."
authority = "eu"

[[language.en.term]]
label = "VAT Information Exchange System"
term_status = "admitted"
part_of_speech = "noun"

[language.ca]
short_description = "El sistema europeu d'intercanvi d'informació sobre l'IVA per validar números d'operador intracomunitari."
definition = "Sistema d'Intercanvi d'Informació sobre l'IVA de la Unió Europea (VAT Information Exchange System) que permet comprovar si un número d'identificació a efectes de l'IVA està registrat com a operador intracomunitari en un altre estat membre. L'aplicació pot consultar-lo en mode de només lectura per validar un número d'IVA abans de declarar una operació intracomunitària."

[language.ca.source]
citation = "Reglamento (UE) n. 904/2010 del Consejo, sobre cooperacion administrativa y lucha contra el fraude en el ambito del IVA; Comision Europea, sistema VIES."
authority = "eu"

[language.hu]
short_description = "Az EU hozzáadottérték-adó-információcsere-rendszere a közösségen belüli áfaszámok ellenőrzésére."
definition = "Az Európai Unió IVA-információcsere rendszere (VAT Information Exchange System), amely lehetővé teszi annak ellenőrzését, hogy egy IVA-azonosító szám egy másik tagállamban Közösségen belüli szereplőként van-e nyilvántartva. Az alkalmazás csak olvasható módban kérdezheti le, hogy egy IVA-számot egy Közösségen belüli ügylet bevallása előtt validáljon."

[language.hu.source]
citation = "A Tanács 904/2010/EU rendelete az IVA területén történő igazgatási együttműködésről és csalás elleni küzdelemről; az Európai Bizottság VIES-rendszere."
authority = "eu"
