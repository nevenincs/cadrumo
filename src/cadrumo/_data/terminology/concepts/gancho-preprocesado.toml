updated_at = 2026-07-22

[language.es]
short_description = "El contrato del proyecto de origen para transformar fuentes PDF, XLS, HTML u otras antes de indexarlas."
definition = "Interfaz genérica solicitada al servicio RAG de desarrollo para registrar preprocesadores por patrón de archivo, emitir una salida versionada con texto extraído o unidades ya fragmentadas, incluir la identidad del preprocesador en la clave de caché y declarar los fallos de forma explícita. Este contrato permite indexar los corpus del BOE y la AEAT sin codificar conocimiento de la AEAT en el indexador."
scope_note = "Mientras no exista el punto de extensión del proyecto de origen, este proyecto usa archivos auxiliares de extracción como solución provisional."

