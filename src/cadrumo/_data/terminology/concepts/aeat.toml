[language.es]
short_description = "Agencia Estatal de Administración Tributaria, la autoridad fiscal española."
definition = "Agencia Estatal de Administración Tributaria: el organismo público que gestiona y recauda los principales tributos del Estado español. El contribuyente presenta sus declaraciones ante la AEAT; esta aplicación nunca presenta nada en su nombre."

[language.es.source]
citation = "Sede Electrónica de la AEAT (agenciatributaria.gob.es) y Ley 58/2003, General Tributaria."
authority = "aeat"

[[language.es.term]]
label = "AEAT"
term_status = "preferred"

[[language.es.term]]
