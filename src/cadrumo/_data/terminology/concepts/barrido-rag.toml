# Terminology Handbook concept fragment.

[concept]
concept_id = "barrido-rag"
domain = "concepto"
lifecycle = "deprecated"
broader = ["manual-terminologia"]
related = ["mapa-relevancia", "gancho-preprocesado"]
created_at = 2026-06-12
updated_at = 2026-06-12

[language.es]
short_description = "Ejecución durante la compilación que consulta RAG para cada término cerrado y guarda los resultados depurados."
definition = "Proceso de compilación que enumera el vocabulario cerrado de conceptos, términos admitidos y formas ocultas, consulta el servicio RAG residente y transforma los resultados en una lista revisable de destinos documentales. El barrido realiza durante la compilación lo que un RAG haría durante la ejecución."
scope_note = "El barrido usa el servicio RAG como oráculo de compilación; CI consume solo los datos resultantes, no ejecuta representaciones vectoriales ni recuperación en directo."

[[language.es.term]]
label = "barrido RAG"
term_status = "preferred"
part_of_speech = "noun"

[[language.es.term]]
label = "sweep"
term_status = "admitted"
part_of_speech = "noun"

[language.en]
short_description = "The build-time RAG run over the closed terminology query vocabulary."
definition = "A build-time compilation process enumerates the closed vocabulary of concepts, admitted terms, and hidden forms, queries the resident RAG service, and turns its hits into a reviewable list of documentation targets. The sweep pre-executes at build time what a RAG would do at runtime."
scope_note = "The sweep uses the RAG service as a compilation oracle; CI consumes only the resulting data and does not run embeddings or live retrieval."


[[language.en.term]]
label = "RAG sweep"
term_status = "preferred"
part_of_speech = "noun"

[language.ca]
short_description = "L'execució build-time de RAG sobre el vocabulari terminològic tancat."
definition = "Procés de compilació que enumera el vocabulari tancat de conceptes, termes admesos i formes ocultes, consulta el servei RAG resident i transforma els resultats en una llista revisable de destinacions documentals. El rastreig executa per endavant en temps de compilació el que un RAG faria en temps d'execució."
scope_note = "El rastreig utilitza el servei RAG com a oracle de compilació; la CI només consumeix les dades resultants, no executa representacions vectorials ni recuperació en directe."


[language.hu]
short_description = "A zárt terminológiai lekérdezések fordítási időben futó RAG-futtatása."
definition = "Fordítási időben futó folyamat, amely felsorolja a fogalmak, elfogadott kifejezések és rejtett alakok zárt szókészletét, lekérdezi a rezidens RAG-szolgáltatást, és találatait áttekinthető dokumentációs célpontok listájává alakítja. A pásztázás fordításkor előre végrehajtja azt, amit a RAG futásidőben tenne."
scope_note = "A pásztázás a RAG-szolgáltatást fordítási orákulumként használja; a CI csak az eredményül kapott adatokat fogyasztja, beágyazásokat és élő visszakeresést nem futtat."

