[concept]
concept_id = "iva-recargo-equivalencia"
domain = "regimen"
lifecycle = "approved"
domain_refs = ["iva-category:recargo_equivalencia"]
legal_refs = ["ley-37-1992:art-148"]
created_at = 2026-06-10
updated_at = 2026-07-22

[language.es]
short_description = "Regimen especial de IVA para comerciantes minoristas."
definition = "Regimen especial obligatorio para comerciantes minoristas personas fisicas en el que el proveedor repercute un recargo ademas del IVA y el minorista queda exonerado de liquidar el impuesto por esas ventas."

[language.es.source]
citation = "Articulos 148 a 163 de la Ley 37/1992 del IVA."
authority = "boe"

[[language.es.term]]
label = "regimen del recargo de equivalencia"
term_status = "preferred"

[[language.es.term]]
label = "RE"
term_status = "admitted"

[language.en]
short_description = "A special VAT regime for retail traders (equivalence surcharge)."
definition = "Mandatory special VAT regime for individual retail traders in which the supplier charges a surcharge in addition to VAT, and the retailer is exempted from settling the tax on those sales."

[language.en.source]
citation = "Articles 148 to 163 of Ley 37/1992 del IVA."
authority = "boe"

[language.ca]
short_description = "Recàrrec d'equivalència: règim especial d'IVA per a comerciants minoristes."
definition = "Règim especial obligatori per a comerciants minoristes persones físiques en el qual el proveïdor repercuteix un recàrrec a més de l'IVA i el minorista queda exonerat de liquidar l'impost per aquestes vendes."

[language.ca.source]
citation = "Articulos 148 a 163 de la Ley 37/1992 del IVA."
authority = "boe"

[language.hu]
short_description = "Egyenértékűségi pótlék: különleges áfa-rendszer kiskereskedőknek."
definition = "Kötelező különleges szabályozás természetes személy kiskereskedők számára, amelyben a beszállító az IVA-n felül egy pótlékot (recargo) hárít át, és a kiskereskedő mentesül ezen értékesítések adójának elszámolása alól."

[language.hu.source]
citation = "A 37/1992. IVA-törvény 148-163. cikkei."
authority = "boe"
