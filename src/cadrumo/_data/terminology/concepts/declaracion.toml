[language.es]
short_description = "La presentacion de datos tributarios ante la AEAT."
definition = "Todo documento presentado ante la Administracion tributaria donde se reconozca o manifieste la realizacion de un hecho relevante para la aplicacion de los tributos. El modelo es el formulario; la declaracion es lo que se presenta en el."

[language.es.source]
citation = "Articulo 119 de la Ley 58/2003, General Tributaria."
authority = "boe"

[[language.es.term]]
