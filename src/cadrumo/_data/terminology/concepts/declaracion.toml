term_status = "preferred"

[[language.es.term]]
label = "declaracion tributaria"
term_status = "admitted"

[language.en]
short_description = "A tax return or declaration filed with the AEAT."
definition = "Any document filed with the Tax Administration in which the occurrence of a fact relevant to the application of taxes is acknowledged or stated. The modelo is the form; the declaracion is what is filed on it."

[language.en.source]
citation = "Article 119 of Ley 58/2003, General Tributaria."
authority = "boe"

[[language.en.term]]
label = "tax return"
term_status = "preferred"

[[language.en.term]]
label = "declaration"
term_status = "admitted"

[language.ca]
short_description = "La presentació de dades tributàries davant l'AEAT."
definition = "Tot document presentat davant l'Administració tributària on es reconegui o es manifesti la realització d'un fet rellevant per a l'aplicació dels tributs. El model és el formulari; la declaració és el que es presenta en aquest."

[language.ca.source]
citation = "Articulo 119 de la Ley 58/2003, General Tributaria."
authority = "boe"

[language.hu]
