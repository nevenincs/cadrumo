          create_vault_folder_no_id: A Google Drive nem adott vissza azonosítót a
            vault mappa létrehozásakor.
          folder_not_owned: A Drive mappa {folder_name} nincs az alkalmazás tulajdonaként
            jelölve; az operátori adatok védelmében az írás megtagadva.
          former_vault_folder: A Google Drive vault mappa {vault_folder_name} az előző
