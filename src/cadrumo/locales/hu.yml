          googleapiclient_import_failed: 'A google-api-python-client függőség nem
            importálható; futtassa: `uv sync`, majd próbálja újra.'
          media_non_bytes: A Google Drive medialetöltés {payload_type} típust adott
            vissza bytes helyett.
          namespace_blank: A Google Drive tárhely névtere nem lehet üres.
          namespace_forbidden_characters: A Google Drive névtér {namespace} tiltott
            útvonal-karaktereket tartalmaz.
          namespace_not_found: 'A Google Drive névtér nem található: {namespace}.'
