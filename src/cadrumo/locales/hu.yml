          object_not_found: 'A Google Drive objektum {object_key_hmac} nem található
            ebben a névtérben: {namespace}.'
          request_failed: A Google Drive {action} kérés {status} állapottal sikertelen.
          root_folder_id_blank: A Google Drive gyökérmappa azonosító nem lehet üres.
          vault_entry_not_folder: 'A beállított Drive gyökér tartalmazza ezt: {vault_folder_name},
            de ez nem mappa.'
          vault_folder_name_blank: A Google Drive vault mappa neve nem lehet üres.
          write_non_dict_response: A Google Drive {action} írási válasza váratlan
            alakú volt.
      local:
        errors:
          byte_length_invalid: 'A helyi sidecar byte_length mezőjének típusa érvénytelen:
            {actual_type}.'
          content_hash_blank: A helyi tartalom hash nem lehet üres.
          content_hash_mismatch: A helyi tartalom hash nem egyezik; a payload integritásellenőrzése
            sikertelen.
          namespace_blank: A helyi tárhely névtere nem lehet üres.
          namespace_create_path_too_long: 'A helyi tárhely nem tudta létrehozni a(z)
            {namespace} névteret: az elérési út meghaladja a Windows elérésiút-hossz
            korlátját. Helyezze át az CADRUMO_LOCAL_STORAGE_ROOT beállítást egy rövidebb
