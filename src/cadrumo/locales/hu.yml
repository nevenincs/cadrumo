            vagy engedélyezze a LongPathsEnabled beállítást (lásd `aeat config check`).'
          payload_write_permission: A helyi tárhely nem tudta írni az objektum payloadjat.
          sidecar_malformed: A helyi sidecar {sidecar_path} nem olvasható vagy hibás.
          sidecar_missing: A helyi objektum sidecarja hiányzik.
          sidecar_not_object: A helyi sidecar {sidecar_path} nem JSON objektum.
          sidecar_write_failed: A helyi tárhely nem tudta írni az objektum sidecarjat.
          sidecar_write_path_too_long: 'A helyi tárhely nem tudta kiírni az objektum
