adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: Az AEAT elutasította az új Cl@ve Móvil push kiadását,
          mert egy korábbi hitelesítési kérelem még szerver oldalon függőben van.
      suggestions:
        reject_pending_request: 'Nyissa meg a Cl@ve alkalmazást a telefonján, utasítson
          el minden függőben lévő kérelmet, majd futtassa: `aeat config auth test`
          (vagy várjon legfeljebb 5 percet, amíg az AEAT automatikusan lejáratja azokat).'
    sede:
      groi:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a GROI-űrlap szerkezetét.
      nif_iva:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a NIF-IVA-űrlap szerkezetét.
      renta_web_open:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a Renta WEB Open oldal szerkezetét.
  auth:
    authenticator:
      errors:
        already_active: Az AeatAuthenticator már rendelkezik aktív munkamenettel;
          hívja meg a close() vagy reauthenticate() metódust az újabb hitelesítés
          előtt.
        already_active_before_resume: Az AeatAuthenticator már aktív munkamenettel
          rendelkezik; folytatás előtt hívja meg a close() metódust.
        assertion_failed: Az AEAT hitelesítés nem hozott létre érvényes bejelentkezési
          állítást.
        capture_requires_active_session: A capture_storage_state() az aktuálisan aktív
          hitelesített munkamenetet igényli.
        capture_requires_certificate: A capture_storage_state() aktív tanúsítványalapú
          munkamenetet és védett erőforrás-metaadatokat igényel.
        metadata_parse_failed: A mentett metaadatok nem eredményeztek elemzett modellt.
        no_active_context: Nincs aktív böngészőkontextus; először hívja meg az authenticate()
          metódust.
        no_context_capture_storage: Nincs aktív böngészőkontextus; nem lehet rögzíteni
          a tárolási állapotot.
        persisted_session_verification_failed: A tárolt AEAT böngészőmunkamenet nem
          ment át az élő ellenőrzésen.
        resume_failed: A mentett AEAT munkamenet folytatása nem eredményezett használható
          környezetet.
        session_stale: Az AEAT munkamenet lejárt; az inaktivitási határidő eltelt.
    clave_movil:
      errors:
        already_active: A Cl@ve Móvil már aktív munkamenettel rendelkezik; hitelesítés
          előtt hívja meg a close() metódust.
        approval_timeout: A Cl@ve Móvil böngészős hitelesítés nem fejeződött be a
          beállított időkorláton belül.
        dni_nie_not_set: Az CADRUMO_CLAVE_MOVIL_DNI_NIE nincs beállítva; hitelesítés
          előtt adja meg DNI- vagy NIE-számát.
        initial_navigation_timeout: A Cl@ve Móvil kezdeti navigációja nem fejeződött
          be a beállított időkorláton belül.
        metadata_invalid: A Cl@ve Móvil munkamenet-metaadatai érvénytelenek vagy nem
          elemezhetők.
        no_persisted_session: Nem található Cl@ve Móvil munkamenet; futtassa először
          a `aeat config auth status` parancsot.
        session_expired: A Cl@ve Móvil munkamenet túllépte a tétlenségi határidőt.
        storage_state_hash_mismatch: A Cl@ve Móvil tárolási állapot hash nem egyezik;
          a munkamenet adatai sérülhetnek.
        verify_requires_active_context: A Cl@ve Móvil verify() aktív böngészőkontextust
          igényel; először hívja meg az authenticate() metódust.
  google:
    calc_sheets:
      errors:
        api_call_failed: A Google {action} hívás sikertelen.
        api_call_refused: A Google {action} hívást elutasították (HTTP {status}).
        api_target_not_found: A Google {action} célpontja nem található.
        conflicting_duplicate_metadata: A Google-táblázat ellentmondó, duplikált AEAT-metaadatokat
          tartalmaz.
        foreign_spreadsheet_not_owned: A Google-táblázat nincs ennek az AEAT-profilnak
          a tulajdonaként megjelölve.
        googleapiclient_not_importable: A googleapiclient nem importálható; a Google-adapter
          nem tud kapcsolódni az API-hoz.
        spreadsheet_id_blank: A Google-táblázat azonosítója nem lehet üres.
        workbook_snapshot_mismatch: A Google-táblázat metaadatai nem egyeznek a számítási
          pillanatképpel.
      suggestions:
        reexport_then_pull: Exportálja újra a munkafüzetet a `aeat config google sync
          calc export` paranccsal, majd húzza be újra.
        reexport_workbook: Exportálja újra a munkafüzetet a `aeat config google sync
          calc export` paranccsal, hogy az alkalmazás által kezelt metaadatok frissüljenek.
        verify_exported_workbook: Ellenőrizze, hogy a táblázatot eredetileg a `aeat
          config google sync calc export` hozta létre ehhez a profilhoz.
    oauth_flow:
      errors:
        browser_launcher_refused: Az operációs rendszer böngészőindítója megtagadta
          az OAuth-hozzájárulási URL megnyitását.
        client_config_refused: A Google OAuth ügyfélkonfigurációját elutasították.
        email_claim_missing: A Google id_token ellenőrzése sikeres volt, de nem tartalmaz
          e-mail-igényt.
        endpoint_unreachable: A Google OAuth-végpont nem érhető el.
        id_token_missing: A Google nem adott vissza id_token-t; az OAuth-hozzájárulás
          nem tartalmazta az openid+email hatókört.
        id_token_module_not_importable: A google-auth id_token modul nem importálható.
        id_token_verification_failed: A Google id_token ellenőrzése sikertelen.
        loopback_bind_failed: A helyi visszahurkos OAuth-vevő nem tudott portot foglalni.
        non_interactive: 'A Google OAuth elutasítva: az interaktív böngészős hozzájárulási
          folyamathoz vezérlő terminál szükséges, de ezt a parancsot nem interaktívan
          futtatták.'
        oauthlib_not_importable: A google-auth-oauthlib nem importálható; az OAuth-folyamat
          nem indítható el.
        profile_state_unresolved: A Google OAuth nem tudja feloldani a kiválasztott
          AEAT-profil állapotát.
        scope_missing: A Google hozzájárulási képernyő visszatért anélkül, hogy minden
          szükséges hatókört megadott volna.
        unsecured_mode_refused: A Google OAuth megtagadta a hozzáférést, mert a titkos
          tár nem biztonságos módban fut, és az aktív profil valódi spanyol adóazonosítót
          tartalmaz.
      suggestions:
        close_loopback_port: Zárja be a szabad visszahurkos portot foglaló alkalmazást,
          és próbálja újra.
        open_consent_url_manually: Nyissa meg manuálisan a megjelenített hozzájárulási
          URL-t a böngészőjében.
        repair_profile_state: Futtassa a `aeat config profile health` parancsot, majd
          javítsa ki vagy váltsa át az aktív profilt, mielőtt újrapróbálja a Google-parancsot.
        run_from_interactive_terminal: Futtassa a 'aeat config google login' parancsot
          interaktív terminálban, elérhető webböngészővel.
        use_keyring_or_synthetic: Állítsa be a cadrumo_secret_store_backend=keyring
          értéket, vagy váltson az aktív profilt szintetikus teszt-adóazonosítóra.
    profile_binding:
      errors:
        no_active_profile: Nincs aktív AEAT-profil kötve a Google OAuth-hoz.
      suggestions:
        create_profile: Futtassa a `aeat config profile create NAME --tax-id <NIF/CIF/DNI/NIE>`
          parancsot, majd próbálja újra a Google-parancsot.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'A(z) {profile} profilhoz tartozó bevallás-kinyerés sikertelen:
          {details}'
        modelo_conflict: A --modelo {modelo!r} ütközik az észlelt {detected!r} értékkel.
        period_unresolved: A bevallási időszak nem volt meghatározható a PDF szövegéből.
        profile_count_invalid: 'Pontosan egy bevallás-PDF-kinyerési profil szükséges
          a modelo={modelo} nyomtatványhoz; elérhető: {available}.'
        profile_unavailable: A(z) {profile!r} kinyerési profil nem érhető el a modelo={modelo}
          nyomtatványhoz.
        registry_snapshot_required: 'A bevallás-kinyeréshez érvényesített nyilvántartási
          pillanatkép szükséges: modelo={modelo} year={year} period={period}: {error}'
        snapshot_modelo_conflict: A nyilvántartási pillanatkép {snapshot_modelo!r}
          nyomtatványa ütközik az észlelt {detected!r} értékkel.
        tax_id_unresolved: Az adóazonosító nem volt meghatározható a PDF szövegéből.
        template_not_detected: A(z) {path} sablona nem észlelhető automatikusan; a
          felülbíráláshoz adja meg a --modelo és --año értékeket.
        year_conflict: A --año {year} ütközik az észlelt {detected} értékkel.
    financial:
      providers:
        pdf_n26:
          errors:
            parse_failed: Nem sikerült elemezni az N26 PDF-kivonatot. A forrás elérési
              útja ki lett takarva a diagnosztikából.
    justificante:
      errors:
        parse_failed: Nem sikerült elemezni az igazolás PDF-et. A forrás elérési útja
          ki lett takarva a diagnosztikából.
    pdf:
      errors:
        hash_failed: Nem sikerült kiszámítani a PDF ellenőrzőösszegét.
  outbound:
    storage:
      factory:
        errors:
          drive_root_missing: 'Nincs Google Drive gyökérmappa-azonosító beállítva
            az aktív profilhoz. Futtassa először: `aeat config google folder set <id>`.'
          google_auth_import_failed: 'A google-auth függőség nem importálható; futtassa:
            `uv sync`, majd próbálja újra.'
          google_client_missing: 'Nincs Google OAuth-kliens regisztrálva az aktív
            profilhoz. Futtassa először: `aeat config google register --client-json
            <path>`.'
          google_token_missing: 'Nincs Google OAuth-token mentve az aktív profilhoz.
            Futtassa először: `aeat config google login`.'
          kind_empty: Az CADRUMO_STORAGE_PROVIDER_KIND üres.
          kind_unhandled: A(z) {kind} tárhelyszolgáltató-típust a factory nem kezeli.
          kind_unknown: 'A(z) {value} tárhelyszolgáltató-típus nem ismert; várt értékek:
            {expected}.'
      google_drive:
        errors:
          content_hash_blank: A Google Drive tartalom hash nem lehet üres.
          content_hash_mismatch: A Google Drive tartalom hash nem egyezik; a letöltött
            payload integritásellenőrzése sikertelen.
          create_namespace_no_id: A Google Drive nem adott vissza azonosítót a névtér
