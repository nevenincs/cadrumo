        binding_help: Valor adicional para el origen de una casilla del Modelo 100,
          como KEY=VALUE. Repite la opción para indicar varios. Los orígenes de retenciones
          valen cero si no se indican.
        casilla_help: Valor de casilla con la sintaxis CASILLA_ID=DECIMAL (repetible).
        ccaa_help: Clave de la comunidad autónoma de residencia fiscal para la escala
          autonómica del Modelo 100 (p. ej. cataluna, comunidad-valenciana). Debe
          coincidir con un valor de las definiciones de los modelos.
        no_m130_revisions: No existen revisiones borrador trimestrales del Modelo
          130 para el ejercicio %{year}. Ejecuta antes `aeat app modelo work calculate
          --modelo 130 --year %{year} --period 1T`.
        no_m130_units: No existen declaraciones del Modelo 130 en borrador para el
          ejercicio %{year}. Crea antes una con `aeat app modelo work create --modelo
          130 --year %{year} --period 1T`.
        year_help: Ejercicio fiscal para la proyección.
      project_help: Ejecutar proyecciones agregadas de modelos (p. ej. agregación
        anual del Modelo 130).
      readiness:
        modelo_help: Código de modelo (p. ej. 303).
        period_help: 'Código de periodo para elegir la versión del modelo oficial:
          0A anual, 1T-4T trimestres, 01-12 meses; para modelos censales (036) usa
          alta, modificacion o baja.'
        revision_help: Identificador de la versión del modelo oficial (de las definiciones
          de los modelos).
        sources_still_missing: Tus registros han superado las comprobaciones de este
          periodo, pero a la declaración aún le faltan valores de algunas fuentes.
          Revisa los valores que faltan antes de calcular.
        year_help: Ejercicio de presentación.
      readiness_help: Informa de si el perfil activo está listo para presentar un
        modelo / ejercicio / periodo.
      reconcile:
        export_help: Exportar las diferencias de conciliación guardadas a un libro local de revisión.
        export_button: Exportar diferencias de la declaración (XLSX)
        export_work_unit_scope: Exporta todas las diferencias de conciliación guardadas de la declaración seleccionada.
        export_selector_required: "Selecciona exactamente una opción: --event-id, --work-unit-id o --all-history."
        export_work_unit_id_help: Identificador exacto de la declaración guardada (SHA-256 de 64 caracteres).
        export_event_id_help: Identificador exacto del evento de conciliación guardado.
        export_all_help: Exportar explícitamente todo el historial de conciliación guardado.
        app_help: 'Compara un cálculo local guardado con evidencia de la AEAT: pull
          descarga un justificante o una declaración presentada; import compara un
          PDF local; list muestra las comparaciones anteriores.'
        calculation_revision_help: ID de revisión de cálculo guardada que se comparará.
          Por defecto, presentada o verificada, después la última guardada.
        file_kind_help: 'Tipo de documento de evidencia: justificante (recibo AEAT,
          todos los modelos) o declaration (PDF de declaración presentada, conciliación
          a nivel de casilla, solo modelos habilitados). Por defecto justificante.'
        file_path_help: Ruta al PDF local de justificante o declaración con el que
          conciliar.
        import_help: Concilia una declaración con un PDF local de justificante o de
          declaración. Solo local; nunca contacta con la AEAT.
        list_empty: No hay conciliaciones registradas todavía.
        list_help: Lista las conciliaciones anteriores registradas en el perfil activo.
        list_work_unit_id_help: Filtra las conciliaciones por identificador de declaración
          (SHA-256 o prefijo inequívoco).
        pull_help: Descarga evidencia de la AEAT y compárala con el cálculo local
          guardado (solo lectura en la AEAT).
        source_help: 'Evidencia a comparar: justificante comprueba identidad e importes
          vinculados; declaration compara las casillas presentadas con el cálculo
          guardado.'
        work_unit_id_help: Identificador de la declaración (SHA-256 o prefijo inequívoco).
      requires:
        help: 'Muestra la lista de datos necesarios para un modelo y periodo: qué
          casillas hay que rellenar a mano, cuáles son opcionales, cuáles se rellenan
          automáticamente desde tus registros, y cuáles proceden del perfil activo.'
        missing_profile_coefficient: 'El perfil activo no tiene establecido el/los
          siguiente(s) coeficiente(s) necesario(s) para este modelo: %{missing}.'
        modelo_help: Código del modelo tributario (p.ej. 303, 130, 100).
        no_active_profile: No hay ningún perfil activo, por lo que no se pudo comprobar
          si faltan coeficientes dependientes del perfil (p.ej. el porcentaje de uso
          de la vivienda por actividad económica).
        period_help: 'Token de periodo usado para resolver la revisión del modelo:
          0A anual, 1T-4T trimestres, 01-12 meses; para modelos censales (036) usa
          alta, modificacion o baja.'
        section_ledger: derivadas_del_libro_de_movimientos
        section_optional: casillas_opcionales_manuales
        section_profile: derivadas_del_perfil
        section_required: casillas_obligatorias_manuales
        unbucketed_binding_source: Algunos orígenes de casillas declarados no pertenecen
          a ninguna categoría del inventario de datos de modelo.requires. Se muestran
          sin sugerir una reparación porque hay que revisar de dónde sale su valor.
      review_package:
        actor_help: Tu nombre o etiqueta, registrado en el descriptor del paquete
          y en el evento de exportación subyacente.
        bucket_id_help: Id del bucket sobre el que opera el paquete de revisión (por
          defecto el perfil activo).
        build_help: Ensambla un paquete de revisión compartible y verificable por
          checksum (borrador fichero-BOE, origen del cálculo guardado y justificantes
          de tus registros incluidos) para entregar al asesor. Solo local; nunca contacta
          con la AEAT.
        counter_sign_help: Contrafirma un paquete de revisión ya firmado por el declarante
          en nombre del asesor fiscal que lo recibe y escribe el sobre del recibo
          en --output. Solo local; nunca contacta con la AEAT.
        counter_sign_note_help: Nota o veredicto libre del contrafirmante (por ejemplo,
          'revisado, sin cambios').
        counter_sign_output_help: Ruta donde escribir el recibo contrafirmado en formato
          JSON.
        counter_signer_public_key_help: Clave pública del asesor fiscal (contrafirmante),
          en 64 caracteres hexadecimales en minúscula.
        decrypt_help: Abre un paquete de revisión cifrado para un destinatario con
          el par de claves X25519 de este bucket (generado en el primer uso) y escribe
          el paquete recuperado en --output. Solo local; nunca contacta con la AEAT.
        decrypt_output_help: Ruta donde escribir el ZIP del paquete de revisión recuperado.
        encrypt_feedback_help: Sella los comentarios de revisión de un destinatario
          (una nota y, opcionalmente, un recibo contrafirmado) de vuelta al originador
          para que solo la clave privada del originador pueda abrirlos, y escribe
          el sobre en --output. Solo local; nunca contacta con la AEAT.
        encrypt_for_recipient_help: Sella un paquete de revisión para que solo la
          clave privada de un destinatario registrado pueda abrirlo, y escribe el
          sobre cifrado en --output. Solo local; nunca contacta con la AEAT.
        encrypt_output_help: Ruta donde escribir el sobre cifrado para el destinatario
          en formato JSON.
        envelope_path_help: Ruta del sobre cifrado para el destinatario en formato
          JSON generado por `encrypt-for-recipient`.
        errors:
          envelope_not_found: No se encontró el sobre cifrado para el destinatario
            en {envelope_path}.
          feedback_envelope_not_found: No se encontró el sobre de comentarios en {envelope_path}.
          invalid_valid_for_days: --valid-for-days debe ser un entero estrictamente
            positivo.
          output_required: Indica --output RUTA para el ZIP del paquete de revisión.
          package_not_found: No se encontró el paquete de revisión en {package_path}.
          receipt_not_found: No se encontró el recibo en {receipt_path}.
          signature_not_found: No se encontró el sobre de firma en {signature_path}.
        feedback_counter_signer_public_key_help: La clave pública de firma Ed25519
          del revisor contra la que debe verificarse la contrafirma (obligatoria cuando
          los comentarios incluyen un recibo).
        feedback_envelope_path_help: Ruta al JSON del sobre de comentarios cifrado
          para el originador producido por `encrypt-feedback`.
        feedback_note_help: Veredicto o nota de texto libre (p. ej. `revisado, sin
          cambios`).
        feedback_operator_public_key_help: Tu propia clave pública de firma Ed25519
          contra la que debe verificarse la firma original.
        feedback_output_help: Ruta donde escribir el JSON del sobre de comentarios
          cifrado para el originador.
        feedback_package_help: Ruta a tu paquete de revisión original guardado localmente
          contra el que se verifica un recibo contrafirmado.
        feedback_receipt_help: Recibo contrafirmado opcional en JSON (de `counter-sign`)
          para incluir como aprobación formal.
        feedback_revision_id_help: Id de la revisión de cálculo a la que se refieren
          los comentarios (del descriptor del paquete revisado).
        feedback_submitted_by_help: Etiqueta del actor revisor (p. ej. el nombre para
          mostrar del asesor).
        feedback_work_unit_id_help: Id de la declaración a la que se refieren los
          comentarios (del descriptor del paquete revisado).
        group_help: Construye un paquete de revisión compartible y verifica su integridad.
        import_feedback_help: Abre un sobre de comentarios con el par de claves X25519
          de este bucket, verifica cualquier recibo contrafirmado contra tu paquete
          de revisión guardado localmente y adjunta la contrafirma verificada a tu
          registro de aprobación. Solo local; nunca contacta con la AEAT.
        notes_help: Nota de texto libre incluida en el descriptor del paquete (p.
          ej. el motivo del envío).
        operator_public_key_help: Clave pública del declarante (firmante original),
          en 64 caracteres hexadecimales en minúscula.
        originator_id_help: Id de originador registrado cuya clave pública sella los
          comentarios (véase `aeat config collab recipient add`).
        output_help: Ruta donde escribir el ZIP del paquete de revisión.
        package_path_help: Ruta del ZIP del paquete de revisión a verificar.
        public_key_help: Clave pública del firmante, en 64 caracteres hexadecimales
          en minúscula.
        receipt_path_help: Ruta del recibo contrafirmado en formato JSON generado
          por `counter-sign`.
        recipient_id_help: Id del destinatario registrado (véase `aeat config collab
          recipient add`).
        review_only_help: Marca el paquete sellado como carente de autoridad de presentación
          (el destinatario puede leerlo y verificarlo, pero no es prueba de que el
          cálculo guardado en que se basa haya sido o vaya a ser presentado).
        revision_help: Id del cálculo guardado a empaquetar; por defecto, el cálculo
          más reciente de la declaración que esté comprobado y completo o registrado
          como presentado.
        sign_help: Firma el manifiesto de comprobación de un paquete de revisión con
          el par de claves Ed25519 del bucket (generado en el primer uso) y escribe
          el sobre de firma en --output. Solo local; nunca contacta con la AEAT.
        sign_output_help: Ruta donde escribir el sobre de firma en formato JSON.
        signature_path_help: Ruta del sobre de firma JSON generado por `sign`.
        valid_for_days_help: Ventana de validez opcional en días; omitela para un
          paquete que nunca caduque.
        verify_help: Verifica el manifiesto de checksum de un paquete de revisión
          (solo integridad; no certifica quién lo construyó). Solo local; nunca contacta
          con la AEAT.
        verify_receipt_help: 'Verifica ambas capas de firma de un recibo contrafirmado
          de un paquete de revisión: la firma original del declarante y la contrafirma
          del asesor fiscal. Solo local; nunca contacta con la AEAT.'
        verify_signature_help: Verifica la firma Ed25519 de un paquete de revisión
          frente a la clave pública del firmante (comprobación de autenticidad; primero
          repite la comprobación de integridad del manifiesto). Solo local; nunca
          contacta con la AEAT.
        work_unit_id_help: Id de la declaración (SHA-256 o prefijo inequívoco).
      spreadsheet:
        app_help: Exporta hojas de cálculo. Las copias de Google son documentos de
          revisión de salida; no puedes importar cambios, calcular ni verificar desde
          Google. La exportación local a XLSX sigue disponible.
        calculate_help: Recupera las celdas que editaste en el libro de calc-sheets,
          ejecuta el motor Decimal local sobre ellas y emite los valores calculados
          de las casillas (no guarda nada)
        export:
          output_help: Ruta en la que escribir el libro .xlsx; un fichero existente
            se rechaza salvo que se indique --replace
        export_help: Exporta el cálculo de un modelo y periodo, tal como lo fijan
          las definiciones de los modelos, a un libro .xlsx local con fórmulas activas
          (la contrapartida sin conexión de push)
        modelo_help: Identificador del modelo a exportar (p. ej. 130, 303, 100)
        period_help: Código de período (p. ej. 1T, 2T, 0A)
        publish:
          accept_readable_export_help: Indica --accept-readable-export para autorizar
            la publicación del cálculo seleccionado y sus filas contables capturadas
            como hoja de Google legible por usuarios autorizados.
          calculation_revision_id_help: Identificador exacto de la revisión de cálculo
            guardada que se publicará.
          filing_record_id_help: Identificador exacto de la presentación histórica vinculada al cálculo guardado; opcional.
          publication_id_help: UUID de publicación; se genera si se omite.
        publish_button: Revisar en Google Sheets
        review_help: Exportar un cálculo guardado, borrador o completado, como libro local de revisión inmutable.
        publish_help: Publica un cálculo guardado como hoja nativa de Google legible
          en la carpeta del perfil.
        pull:
          assemble_observations_help: Tras recuperar, reensambla las celdas de filas
            de la pestaña Detalle en observaciones tipadas (perceptores, bienes en
            el extranjero, operaciones vinculadas, miembros de atribución, operaciones
            de devolución) y emítelas en el payload junto a los row_set_edits brutos
        pull_help: Lee las celdas que editaste en una hoja calc-sheets y las convierte
          en valores tipados (tras comprobar que la marca registry-SHA del libro coincide
          con las definiciones de los modelos actuales)
        push:
          capability_disabled: La exportación a Google está desactivada para este
            perfil; actívala con 'aeat config profile capabilities set google_export
            on'.
          dry_run_help: Previsualiza lo que esta exportación borraría y reescribiría
            en el libro, sin escribir nada
          prefill_relations_help: Prerrellenar valores de relaciones entre revisiones
            desde el almacén local de observaciones antes de exportar (resúmenes anuales,
            arrastre de trimestres anteriores, etc.)
          root_folder_required: No se ha creado ninguna carpeta de Drive para este
            perfil; ejecuta `aeat config google login` primero
          snapshot_failure: No se puede construir la instantánea de las definiciones
            de los modelos para el modelo {modelo} ({period} {year}).
        push_help: Exporta el cálculo de un modelo y periodo, tal como lo fijan las
          definiciones de los modelos, a una hoja de Google Sheets dentro de tu `cadrumo-vault/`
        spreadsheet_id_help: Identificador del fichero de Drive del libro del que
          leer tus ediciones (debe ser propiedad de la app y estar vinculado al snapshot
          indicado)
        verify:
          scenario_help: Ruta a un fichero JSON de escenario con los valores que introduces
            y, si está disponible, un mapa de salidas esperadas publicadas por la
            AEAT
        verify_help: Comprobación de paridad triple del modelo (oráculo AEAT vs motor
          Decimal local vs hoja de Sheets)
        year_help: Año de declaración (p. ej. 2025)
      support_matrix:
        help: 'Muestra la matriz de soporte por modelo para todas las definiciones
          de los modelos: grado de cálculo, manifiesto de completitud, formatos de
          exportación, cobertura de extractores, renombrados de casillas declarados
          y referencias cruzadas con el portal de la AEAT.'
      verification_report:
        app_help: Inspeccionar los informes de comprobación registrados
        list_help: Listar los informes de comprobación, opcionalmente filtrados por
          un cálculo guardado
        verification_report_id_help: Identificador estable (SHA-256 de 64 caracteres)
          de un informe de comprobación
        view_help: Mostrar un informe de comprobación por id
      work:
        actor_help: Actor responsable de la acción (etiqueta libre de hasta 64 caracteres)
        actor_too_long: La etiqueta --by debe tener como máximo {limit} caracteres;
          se recibieron {length}. Identifica al actor del evento de auditoría que
          registra este comando, así que indica un nombre corto para ti o para el
          agente.
        allow_not_applicable_help: Crear la declaración aunque el modelo no aplique
          al tipo de contribuyente del perfil activo.
        amend_help: Construir una corrección de una declaración presentada fuera de
          Cadrumo. Requiere un registro de presentación con evidencia de la AEAT importada
        amend_missing_options: 'Una rectificación requiere todas estas opciones: %{missing}.'
        amend_no_detail_rows_help: Indicar que esta corrección no tiene filas de detalle.
          En los modelos 184, 232, 347 y 349 las filas son la declaración, por lo
          que indicar que no hay ninguna no es lo mismo que no decir nada; si se omiten
          esta opción y --row, la corrección se rechaza en vez de suponerse.
        amend_rows_contradiction: Usa --row o --no-detail-rows, pero no ambos; --no-detail-rows
          indica que no hay filas de detalle.
        amend_set_required: --set es obligatorio al menos una vez para una complementaria.
        amend_wizard_export_next_action: Corrección guardada como borrador. Exporta
          el fichero BOE que la AEAT puede importar con `aeat app modelo export %{work_unit_id}
          --output PATH`.
        amend_wizard_help: 'Guía la corrección de una declaración ya presentada en
          lenguaje sencillo: qué casillas cambiaron, los valores corregidos y el tipo
          de declaración, y la registra'
        amend_wizard_kind_help: complementaria añade a la cuota previamente declarada;
          sustitutiva reemplaza por completo la declaración anterior; rectificativa
          es el mecanismo unificado de corrección para los modelos cuya orden lo implementa
          (p. ej. Modelo 303 desde el ejercicio 2023).
        amend_wizard_kind_prompt: Tipo de rectificación (%{choices})
        amend_wizard_m303_rectificativa_motive_prompt: Motivo de la rectificativa
          del modelo 303 (%{choices})
        amend_wizard_no_corrections: No se corrigió ninguna casilla; el asistente
          de rectificación necesita al menos un valor modificado.
        amend_wizard_no_current_filing: La declaración %{work_unit_id} no tiene ningún
          registro de presentación vigente que corregir. Importa primero la evidencia
          de la AEAT con `aeat app modelo filing-record import`, o regístrala como
          presentada.
        amend_wizard_reason_prompt: Motivo de esta corrección (se conserva en el registro
          de auditoría)
        amend_wizard_reason_required: Se requiere un motivo para el registro de auditoría
          de la corrección.
        amend_wizard_select_prompt: 'Registrada como presentada: %{modelo} %{year}
          %{period}, valores actuales:\n%{summary}\n¿Qué números de casilla cambiaron?
          (separados por comas o espacios, en blanco para ninguno)'
        amend_wizard_unknown_casilla: La casilla %{token} no forma parte de la declaración
          %{modelo} %{year} %{period} registrada como presentada; elige una de las
          casillas listadas.
        amend_wizard_value_prompt: Valor corregido para la casilla %{number} (%{label}),
          actualmente %{previous_value}
        amendment_kind_help: Clase legal de la modificación (complementaria, sustitutiva
          o rectificativa)
        amendment_reason_help: Motivo libre de la corrección (se conserva en el registro
          de auditoría)
        app_help: Gestionar el ciclo de vida de las declaraciones de un modelo
        attest_m303_exonerado_390_help: Registra en custodia cifrada tu confirmación
          de que la sección de exoneración del Modelo 390 no se aplica a esta autoliquidación
          del Modelo 303 del último periodo del año (código de periodo 12 o 4T), e
          imprime su identificador y SHA-256 para `work calculate`. Los demás periodos
          no lo preguntan.
        autoconsumo_promotor_base_help: 'Base imponible del autoconsumo del promotor
          inmobiliario (Art. 9.1.c + Art. 79.4 LISIVA): coste de construcción o rehabilitación
          de inmuebles afectados al patrimonio de arrendamiento. El asistente aplica
          automáticamente el 21% (Art. 90 LISIVA) para calcular la cuota devengada.
          Sólo aplicable a Modelo 303.'
        autoconsumo_promotor_base_not_decimal: '--autoconsumo-promotor-base debe ser
          un importe decimal; se recibió: {value}. Usa el punto como separador decimal
          y sin separador de miles, p. ej. 1234.56.'
        borrador_help: Id del snapshot del borrador del Modelo 100 (completo o prefijo
          no ambiguo). Sus valores solo rellenan las casillas cuyo origen está marcado
          como aeat_prefilled en las definiciones de los modelos; los valores que
          indicas con --binding siempre tienen prioridad.
        bucket_id_help: Perfil al que pertenece la declaración
        calculate_help: Guardar un nuevo cálculo en borrador para la declaración.
          Este comando calcula solo a partir de los valores que se le indican. Los
          valores introducidos antes en la interfaz de pantalla completa (aeat app
          tui) no se conservan salvo que se vuelvan a indicar aquí; la interfaz de
          pantalla completa sí los conserva.
        calculate_saved: 'Guardado como revisión de cálculo en borrador %{revision_id}
          (estado: %{state}). Está persistido y puede retomarse más tarde.'
        calculation_revision_id_help: Identificador estable (SHA-256 de 64 caracteres)
          de una revisión de cálculo
        casilla_help: Valor de casilla con sintaxis CASILLA_ID=DECIMAL (repetible).
          CASILLA_ID debe ser el casilla.id canónico mostrado por `aeat app modelo
          casillas`.
        casilla_not_decimal: 'El valor de --casilla para {key} no es un decimal: {value}.'
        causante_ccaa_help: CCAA de residencia habitual del causante (ISD Modelo 650/660)
          o CCAA donde se ubica el bien transmitido (ITPyAJD Modelo 600/620). Determina
          la Hacienda competente (Ley 22/2009 Art. 32). País Vasco y Navarra son regímenes
          forales; consulta la Hacienda autonómica correspondiente.
        compare_taxation_error: 'La comparación conjunta vs. individual no está disponible:
          {detail}'
        compare_taxation_help: 'Compara la cuota del IRPF en tributación conjunta
          (Art. 82-84 LIRPF) frente a tributación individual para una declaración
          del Modelo 100 existente. Cadrumo calcula dos veces, una con declaration_type=2
          (conjunta) y otra con declaration_type=1 (individual), con los mismos datos
          de perfil, y muestra la diferencia de cuota y una recomendación. No se guarda
          nada: no se almacena ningún cálculo.'
        compare_taxation_recommendation_line: 'RECOMENDACIÓN: {recommendation} - {reason}'
        compare_taxation_work_unit_not_found: Declaración {work_unit_id} no encontrada;
          consulta las declaraciones activas con 'aeat app modelo work list'.
        create_created: Nueva declaración creada.
        create_help: Crear o reutilizar una declaración para (modelo, ejercicio, periodo,
          versión del modelo oficial)
        create_not_applicable_refused: 'El Modelo %{modelo} no aplica al tipo de contribuyente
          del perfil activo: %{reason} Si tienes un motivo para crear la declaración
          de todas formas, repite el comando con --allow-not-applicable.'
        create_quiet_help: Omitir la salida de confirmación legible; el envoltorio
          --format json, los avisos y el código de salida no se ven afectados.
        create_reused: Se devolvió la declaración existente (hay una por modelo, ejercicio,
          periodo y versión del modelo oficial); no se creó nada nuevo.
        create_reused_name_match: Se devolvió la declaración existente (hay una por
          modelo, ejercicio, periodo y versión del modelo oficial); no se creó nada
          nuevo. El --name indicado coincide con el nombre guardado.
        create_reused_renamed: Se devolvió la declaración existente (hay una por modelo,
          ejercicio, periodo y versión del modelo oficial); no se creó nada nuevo.
