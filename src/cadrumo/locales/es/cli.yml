cli:
  app:
    ledger:
      bienes_inversion:
        acquisition_year_help: Año de adquisición del bien.
        art108_help: Si el bien tiene la consideración de bien de inversión según
          LIVA art. 108.
        asset_ref_help: Referencia cruzada opcional a un identificador de AssetRecord.
        cuota_soportada_help: IVA soportado total en la adquisición (positivo).
        declare_help: Declara un bien de inversión para su regularización de IVA.
        description_help: Descripción del bien.
        disposal_regime_help: Régimen de transmisión (sujeta_no_exenta o exenta_o_no_sujeta);
          obligatorio con --disposal-year.
        disposal_requires_both: --disposal-year y --disposal-regime deben indicarse
          conjuntamente.
        disposal_year_help: Año de transmisión opcional (art. 110).
        group_help: Registro de regularización de IVA por bienes de inversión (LIVA
          arts. 107-110).
        identifier_help: Identificador estable del registro.
        kind_help: 'Periodo de regularización: mueble (4 años) o inmueble (9 años).'
        list_help: Lista todos los bienes de inversión registrados en el perfil activo.
        prorrata_inicial_help: Porcentaje de deducción definitivo del año de adquisición
          (0-100).
        unknown_disposal_regime: 'Régimen de transmisión desconocido {regime!r}; aceptados:
          {accepted}'
      counterparty:
        actor_help: Identificador del operador que se registra como autor de la afirmación.
        confirm_help: Confirma dónde está establecida una contraparte y qué Estado
          la identifica a efectos de IVA.
        country_code_help: País bajo el que se declara el identificador, cuando no
          es español.
        evidenced_scope_help: Territorio en el que un documento en su poder sitúa
          a esta parte. Indíquelo para preguntar qué responderá la escalera para ese
          documento, que es la única forma de ver una discrepancia con lo que usted
          confirmó antes de que una confirmación la rechace.
        group_help: Confirma lo que se sabe de una contraparte, una sola vez, para
          todos los documentos posteriores.
        identification_state_help: 'Estado miembro que identifica a efectos de IVA
          a la contraparte. Es un dato distinto de --scope: el art. 25 exime por este,
          no por dónde esté establecida.'
        note_help: En qué se basa la respuesta, con sus propias palabras. Se registra,
          nunca se consulta.
        scope_help: El territorio a efectos de IVA en el que está establecida la contraparte.
        tax_identifier_help: El identificador fiscal de la contraparte tal y como
          aparece impreso en el documento.
        view_help: Muestra lo que la escalera de identificación de IVA respondería
          para esta contraparte con lo confirmado hasta ahora.
        withdraw_help: Retira lo confirmado sobre una contraparte, declarando que
          la respuesta anterior era incorrecta.
      evidence:
        add_help: Registra un justificante de factura de compra desde PDF o imagen
        attachment_id_help: Identificador del adjunto direccionado por contenido.
        attachment_queue_help: Listar adjuntos de Drive pendientes de revisión de
          factura.
        attachment_view_help: Inspeccionar los metadatos y la procedencia del adjunto
          almacenado.
        batch_directory_help: Directorio cuyos ficheros se ingresan. Combínalo con
          --file repetido o sustitúyelo por él.
        batch_file_help: Un documento a ingresar. Repite la opción una vez por documento;
          se combina con un directorio.
        batch_help: Ingresa cada documento de un directorio (o cada --file) como evidencia
          y borrador revisable, con una fila de resultado por documento.
        batch_items_refused_message: Se rechazaron algunos documentos. El resto de
          documentos de la ejecución se completaron igualmente; las filas rechazadas
          indican qué se encontró.
        batch_pending_review_message: Algunos borradores contienen un hallazgo que
          una persona debe resolver antes de crear una factura. Están retenidos, no
          fallidos.
        batch_progress_message: 'procesado %{source}: %{status}'
        batch_source_required: Indica un argumento de directorio, una o más opciones
          --file, o ambos.
        batch_work_deferred_message: Algunos documentos no se leyeron porque no se
          pudo ejecutar ningún modelo de lectura. No se adivinó ningún valor a partir
          de ellos y nada falló; vuelve a ejecutar cuando se resuelva la causa indicada.
        confirm_already_exists_message: Ya existe una factura con esta identidad;
          se devuelve sin cambios en lugar de crear un duplicado.
        confirm_category_contradicted_message: 'El régimen que declara este documento
          y el impuesto que aplica no pueden ser ciertos a la vez, así que no se ha
          podido tomar el tratamiento de IVA de ninguno de los dos lados y no se ha
          registrado ninguno. Vuelve a leer el documento: se ha leído mal uno de los
          dos, o el propio documento es incorrecto.'
        confirm_category_rate_inferred_message: El tratamiento de IVA de esta factura
          lo ha determinado el tipo impositivo que aplican sus líneas, porque la tabla
          de reglas no ha podido situar la operación, normalmente porque el territorio
          de IVA de una de las partes no está establecido. El tratamiento registrado
          es el interior ordinario para ese tipo. Compruébalo si esta entrega no era
          interior.
        confirm_category_unresolved_message: 'Nada ha establecido un tratamiento de
          IVA para esta factura: el documento no ha declarado ninguno y los hechos
          de la propia operación no han llegado a uno. La factura queda registrada
          y no se desglosará en una declaración hasta que se establezca un tratamiento.'
        confirm_category_unsupported_relief_message: El documento invoca una exención
          del IVA repercutido español que depende por completo de dónde está establecida
          la contraparte, y nada lo ha establecido. El tratamiento se retiene en lugar
          de dar el documento por erróneo, de modo que esta factura queda registrada
          sin tratamiento de IVA y no se desglosará en una declaración hasta que se
          resuelva el país o el establecimiento de la contraparte.
        confirm_counterparty_name_help: Nombre de la contraparte (sin heuristica de
          extracción todavía; normalmente obligatorio).
        confirm_counterparty_nif_help: Sobrescribe el NIF del proveedor extraido.
        confirm_currency_help: Código de moneda ISO-4217.
        confirm_help: Vuelve a extraer el justificante en el equipo local y confírmalo
          como una factura real del catálogo.
        confirm_invoice_class_help: Indique la clase de factura cuando el documento
          no la declare. Una rectificativa se lee del documento cuando este nombra
          la factura que rectifica, de modo que esta opción es la corrección para
          los documentos que no lo hacen.
        confirm_invoice_date_help: Sobrescribe la fecha de factura extraida (AAAA-MM-DD).
        confirm_invoice_number_help: Sobrescribe el número de factura extraido.
        confirm_iva_rate_help: Sobrescribe el tipo de IVA extraido (omitir para conservar
          el valor extraido).
        confirm_link_hint_message: La factura se registró sin un movimiento coincidente
          del libro.
        confirm_operation_type_help: 'Clave del modelo 349 para una entrega intracomunitaria.
          Obligatoria cuando el documento declara una entrega intracomunitaria: la
          categoría no permite saber si siguió a una importación exenta.'
        confirm_printed_total_mismatch_message: El total impreso en el documento no
          coincide con el total registrado. El total registrado se deriva de la base
          imponible y del tipo de IVA, por lo que una diferencia significa que el
          documento incluye un importe que este registro no recoge, como un recargo
          de equivalencia, o que se ha leido mal alguna cifra. Revise el documento.
        confirm_rectifies_help: Número de la factura que rectifica esta rectificativa.
          El RD 1619/2012 art. 6.1.a.2 lo exige junto con su propia serie, y se lee
          del documento cuando este lo indica.
        confirm_resolve_help: 'Responda a un hallazgo bloqueante: <finding-id>=<choose|supply|attest>:<valor-o-motivo>.
          Para choose, indique la lectura por su valor o por el resumen que mostró
          review. Repita una vez por hallazgo; no hay opción masiva.'
        confirm_review_contradicted_regime_message: Este documento se contradice a
          sí mismo sobre cómo tributa. El detalle siguiente nombra qué discrepaba
          con qué.
        confirm_review_undetermined_establishment_message: El documento, tal como
          se ha leído, ha dejado sin decidir dónde está establecida una de las partes
          de esta factura. El territorio de IVA determina el tratamiento y no se da
          por supuesto que sea la península. El detalle siguiente nombra la parte
          y lo que faltaba.
        confirm_series_help: Serie de numeración en la que se expidió la factura.
          El RD 1619/2012 art. 6.1.a.2 obliga a que una rectificativa vaya en su propia
          serie, de modo que declarar esa clase requiere indicarla; se lee del documento
          cuando este la indica.
        confirm_supply_nature_help: Indique si la operación es una entrega de bienes
          o una prestación de servicios. Las reglas de localización difieren, por
          lo que un documento que no lo indica deja el tratamiento sin resolver.
        confirm_taxable_base_help: Sobrescribe la base imponible extraida.
        consent:
          bytes_unrecallable: 'Retirar el consentimiento detiene los envíos futuros.
            No permite recuperar los bytes ya enviados: esta aplicación no puede recuperarlos
            ni borrarlos del proveedor. Volver a derivar en local elimina la lectura
            externa de sus registros actuales, pero no de los del proveedor.'
          content_address_help: Dirección de contenido SHA-256 de los bytes almacenados
            del documento.
          evidence_reference_help: Identificador de la evidencia o del adjunto que
            se va a volver a derivar.
          group_help: Revise qué se envió a un modelo externo y recupere los artefactos
            en este equipo.
          list_help: Muestre cada envío externo y los artefactos derivados de él.
          no_history: 'Ningún byte de evidencia ha salido de este equipo: este perfil
            no tiene ningún envío externo registrado.'
          rederive_help: Vuelva a leer un artefacto en este equipo desde su transcripción
            almacenada.
          rederive_refused: 'Nueva derivación rechazada: {detail}'
          rederived: Se ha vuelto a derivar {reference} en este equipo. Antes tenía
            {previous}; ahora tiene {current}. La lectura anterior queda sustituida,
            no borrada.
          transcriber_help: Clave de caché de la transcripción que se reutilizará.
        evidence_id_help: Identificador del justificante (coincidencia exacta)
        extract_acknowledge_off_host_help: Confirma, solo para esta lectura, que el
          documento sale de este equipo.
        extract_acknowledge_without_provider: --acknowledge-off-host confirma un envío
          que no llegaría a producirse. Indica también --off-host-provider, o retira
          la confirmación.
        extract_attachment_id_help: Identificador del adjunto vinculado del que extraer
          los datos (alternativa a --evidence-id).
        extract_evidence_id_help: Identificador del justificante de factura de compra
          del que extraer los datos.
        extract_help: Lee los campos de una factura en PDF en el propio equipo y genera
          un borrador para revisar.
        extract_off_host_needs_content_address: Este justificante no tiene huella
          de contenido, por lo que una lectura fuera del equipo no puede registrarse
          sobre los bytes que enviaría.
        extract_off_host_needs_evidence_id: 'Una lectura fuera del equipo debe indicar
          --evidence-id: el consentimiento se registra sobre la huella de contenido
          del documento, que un identificador de adjunto no aporta.'
        extract_off_host_provider_help: Envía este documento a un modelo alojado en
          lugar de leerlo en este equipo.
        extract_off_host_provider_is_local: --off-host-provider local es el valor
          por defecto y no envía nada fuera del equipo. Omite la opción o indica un
          proveedor alojado.
        extract_provider_without_acknowledge: Leer este documento fuera del equipo
          envía su contenido a un tercero. Añade --acknowledge-off-host para confirmarlo,
          solo para esta lectura.
        extract_reference_required: Indique exactamente uno de --evidence-id o --attachment-id.
        extract_review_hint_message: Esta extracción es un borrador aproximado y sus
          campos no están confirmados.
        field_ambiguous: '{field}: varias lecturas compitieron y no se pudo decidir
          entre ({candidates}). Elija una en lugar de aceptar el borrador tal cual.'
        field_anchor_not_found: '{field}: el lector señala ''{anchor}'', que no aparece
          en la transcripción del documento. Un valor normalizado puede fallar esta
          búsqueda legítimamente, así que revise el campo en lugar de suponer que
          fue corroborado. {detail}'
        field_anchor_self_reported: '{field}: el lector afirma haberlo leído de ''{anchor}'',
          pero esa afirmación proviene del mismo lector que produjo el valor, así
          que nada independiente lo ha confirmado.'
        field_anchor_uncorroborated: '{field}: el lector señala ''{anchor}'', y nada
          indicó que esa forma faltara en el documento. El valor sigue sin estar corroborado,
          así que lo que queda sin resolver es algo distinto de la forma impresa.
          {detail}'
        field_contradicted: '{field}: el documento indica ''{anchor}'', que no coincide
          con el valor registrado para este campo. {detail}'
        field_no_anchor: '{field}: el lector no ofreció nada en el documento a lo
          que señalar, así que no hay forma impresa con la que contrastar este valor.'
        group_help: Justificantes de facturas de compra en PDF o imagen
        invoice_date_help: Fecha de emisión de la factura en ISO 8601 (AAAA-MM-DD),
          p. ej. 2026-01-15.
        invoice_number_help: Número de factura del proveedor
        iva_amount_help: Importe de IVA de la factura
        iva_rate_help: Tipo de IVA aplicado como decimal
        list_help: Lista los justificantes de facturas de compra registrados
        notes_help: Notas internas sobre el justificante
        pull_actor_help: Etiqueta del operador.
        pull_all_errors:
          folder_id_unrecognised: La referencia de carpeta de Drive %{reference} no
            contiene un id de carpeta reconocible. Indica una URL de carpeta de Drive
            o su id.
        pull_all_folder_help: URL de la carpeta de Drive o su id para obtener en bloque
          las facturas PDF/imagen.
        pull_all_help: Obtiene en lote todas las facturas PDF o imagen de una carpeta
          de Drive y guarda cada una como evidencia cifrada, sin vincularla a ninguna
          transacción.
        pull_all_labels:
          fetched: obtenidos
          folder_id: id_carpeta
          refused: rechazados
          skipped: omitidos_no_documento
          total: total_documentos
        pull_all_note_help: Nota opcional registrada en cada archivo adjunto obtenido.
        pull_all_notices:
          files_refused: '%{refused_count} archivo(s) de esta carpeta no se pudieron
            obtener bajo el permiso drive.file; descárgalos manualmente y adjúntalos.'
        pull_help: Descarga un enlace de documento de Drive y guarda sus bytes como
          evidencia cifrada en una fila del libro.
        pull_id_help: Identificador de transacción del libro mayor.
        pull_note_help: Nota opcional.
        pull_reference_help: Referencia del enlace al documento.
        pull_source_help: 'Origen del enlace: gmail, google_drive o url.'
        remove_help: Elimina un justificante de factura de compra
        review:
          advised_pending_message: Algunos documentos pendientes llevan avisos. No
            bloquean nada y se confirmarán tal como están, así que nada más volverá
            a plantearlos. Acota la cola con `--advisory` y lee uno con `review show`.
          advisory_help: Muestra solo los borradores que llevan este aviso no bloqueante.
            No impiden nada, por lo que de otro modo solo se descubren abriendo cada
            documento.
          blocked_message: Este documento no puede confirmarse hasta responder individualmente
            cada hallazgo. Cada respuesta nombra un hallazgo por su identificador.
          blocked_pending_message: Algunos documentos pendientes tienen hallazgos
            que deben responderse antes de confirmarlos. Inspeccione uno con `review
            show`.
          blocking_help: Muestre solo los borradores que no pueden confirmarse hasta
            responder un hallazgo.
          country_code_unassigned_message: El código de país de una de las partes
            pertenece a los rangos que la norma ISO 3166-1 reserva para que nunca
            se asigne ningún país, así que el documento indica una cadena y no un
            país, y nada sitúa a esa parte. Corrija el código contrastándolo con el
            documento. Este borrador se puede confirmar igualmente; la parte simplemente
            queda sin establecer hasta entonces.
          country_code_uncatalogued_message: 'El código de país de una de las partes
            puede designar un país real que el vocabulario incorporado de este sistema
            todavía no recoge, así que no se puede decir nada sobre dónde está establecida
            esa parte. Volver a leer el documento no lo resolverá: hay que añadir
            el país. Este borrador se puede confirmar igualmente; la parte simplemente
            queda sin establecer hasta entonces.'
          finding_help: Muestre solo los borradores cuyo documento no supero esta
            comprobacion determinista.
          group_help: Revise los borradores de extraccion pendientes antes de confirmarlos
            como facturas.
          list_help: Liste los borradores de extraccion pendientes de revision humana.
          party_attribution_unverified_message: Nada verifica a qué parte pertenecen
            estos datos de dirección. Si se leyeran dos bloques de dirección al revés,
            ambas partes quedarían situadas en un territorio de IVA en el que ninguna
            está establecida y ninguna comprobación lo detectaría. Contraste cada
            valor con el documento antes de confirmar este borrador.
          reason_help: Muestre solo los borradores bloqueados por este motivo.
          reference_help: Referencia de evidencia o adjunto de la que se leyo el borrador
            pendiente.
          resolve_action: Accion de resolucion desconocida.
          resolve_shape: Cada --resolve es <finding-id>=<choose|supply|attest>:<valor-o-motivo>.
            Un choose indica la lectura por su valor o por el resumen que mostró review.
          unknown_reference: No hay ningun borrador pendiente para esa referencia.
          view_help: Muestra todos los campos revisables de un borrador pendiente,
            junto con sus hallazgos bloqueantes.
        source_path_help: Ruta al PDF o imagen de la factura
        supplier_help: Nombre del proveedor
        taxable_base_help: Base imponible de la factura
        update_help: Actualiza los datos de un justificante de factura de compra
        view_help: Muestra un justificante de factura de compra
        yes_help: Confirma la eliminación del justificante
        yes_required: Debes pasar --yes para eliminar un justificante
      inventory:
        acquisition_cost_invalid: 'JSON de coste de adquisición no válido leído de
          la entrada estándar: {details}'
        acquisition_cost_stdin_help: Lee de la entrada estándar el objeto JSON de
          coste de adquisición completo
        actividad_id_help: Identificador de la actividad económica
        authority_file_help: Leer el documento JSON completo de autoridad de cierre
          desde un archivo.
        authority_invalid: El objeto de autoridad de cierre no es válido para este
          libro de existencias.
        closing_authority_record_help: Registrar atómicamente la autoridad acreditada
          del cierre de existencias
        create_help: Crea un libro de existencias para una actividad y ejercicio
        group_help: Libros de existencias por actividad, movimientos y valoración
        list_help: Lista los libros de existencias del perfil activo
        movement_add_help: Añade un movimiento de compra, venta o ajuste al libro
        movement_date_help: Fecha del movimiento (AAAA-MM-DD)
        movement_group_help: Gestiona movimientos del libro de existencias
        movement_id_help: Identificador del movimiento dentro del libro
        movement_kind_help: Tipo de movimiento (opening, purchase, cogs o count)
        opening_stock_help: Valor inicial de existencias
        quantity_help: Cantidad del movimiento, positiva o negativa
        taxable_base_help: Base imponible asociada al movimiento
        unit_cost_help: Coste unitario en movimientos de compra
        valuation_group_help: Calcula y previsualiza la valoración de existencias
        valuation_method_help: Método de valoración (fifo o pmp)
        valuation_preview_help: Previsualiza existencias finales y coste de ventas
        year_help: Ejercicio fiscal
      invoice:
        add_help: Crea una factura de conciliación vinculable en el catálogo.
        country_code_help: Código de país ISO 3166-1 alfa-2 de la contraparte (por
          defecto ES).
        group_help: Registros de facturas de negocio (emitidas o recibidas)
        import_all_refused: 'importación masiva de facturas fallida: se rechazaron
          todas las filas; no se creó ninguna factura'
        import_column_role_not_applied: 'no se aplicó un rol de columna propuesto:
          {detail}'
        import_country_help: País de la contraparte (ISO 3166-1 alfa-2) para toda
          la importación. Solo es obligatorio cuando el fichero no tiene columna country_code;
          se ignora en las filas que indican el suyo. Declara ese país para TODAS
          esas filas, así que un libro que mezcle contrapartes nacionales y extranjeras
          necesita la columna.
        import_file_help: Ruta a un archivo CSV o XLSX con filas de facturas (counterparty_nif,
          counterparty_name, invoice_number, invoice_date, taxable_base, y opcionalmente
          iva_rate/currency/country_code/notes).
        import_file_not_found: 'Archivo no encontrado: {path}'
        import_help: Crea facturas del catálogo en lote desde un archivo CSV o XLSX.
        import_unmapped_columns: 'columnas no importadas porque ningún campo de factura
          coincidió con ellas: {columns}'
        invoice_class_help: Clase de factura. Una rectificativa exige además --rectifies-invoice-number
          indicando la factura que corrige.
        invoice_id_help: Identificador de factura del catálogo (o prefijo no ambiguo).
        iva_category_help: Tratamiento de IVA de la operación. Necesario para que
          un cálculo de renta pueda fundamentarla.
        kind_help: 'Tipo de factura: emitida (un cliente te debe) o recibida (debes
          a un proveedor)'
        list_help: Lista las facturas del catálogo de conciliación.
        operation_date_help: Fecha en que se realizo la entrega o prestacion (AAAA-MM-DD).
          Es la fecha de devengo del art. 75 LIVA que determina en que periodo se
          declara la cuota; sin ella se utiliza la fecha de factura.
        operation_type_help: 'Clave de operación M349: E entregas, M entregas posteriores
          a importación exenta, H las mismas por representante fiscal, A adquisiciones,
          T entregas triangulares, S servicios prestados, I servicios adquiridos,
          R transferencias de bienes en consigna, D devoluciones de bienes en consigna,
          C sustituciones del destinatario en consigna'
        recargo_help: Recargo de equivalencia repercutido sobre la cuota (LIVA art.
          161). Va incluido en el total de la factura, a diferencia de una retención.
        rectifies_help: Número de la factura que corrige esta rectificativa.
        remove_help: Elimina una factura del catálogo de conciliación.
        retention_amount_help: Importe de la retención de IRPF retenida por el pagador,
          en euros. Puede indicarse solo, o junto con --retention-rate.
        retention_rate_help: Fracción de retención del art. 95.1 RIRPF que retiene
          el pagador (0,15 para el 15% general, o 0,07 durante el periodo de inicio
          de actividad). Requiere --retention-amount; una fracción sola se rechaza.
        series_help: Serie de numeración de la factura, cuando el emisor utiliza una.
        simplificada_tax_id_expected_message: Esta factura simplificada no contiene
          el identificador fiscal de la contraparte, aunque el contexto legal registrado
          lo exige.
        update_help: Actualiza los datos de una factura de negocio
        view_help: Muestra una factura del catálogo de conciliación por identificador
          o prefijo no ambiguo.
        wizard_help: Entrada manual guiada y no interactiva cuando la extracción no
          está disponible.
        wizard_idempotent_noop: 'Sin operación idempotente: ya existe una factura
          con esta identidad (%{invoice_id}); no se creó nada.'
        yes_help: Confirma la eliminación de la factura
        yes_required: Debes pasar --yes para eliminar una factura
      prorrata:
        activity_code_help: Código de actividad CNAE / IAE agrupado en este sector
          (repetible, al menos uno).
        declare_sector_help: 'Declara un sector diferenciado (LIVA arts. 9.1.c / 101):
          la partición del art. 9.1.c que declara el operador, nunca inferida del
          libro.'
        ejercicio_help: Ejercicio (año) que cubre la elección.
        elect_especial_help: 'Elige prorrata especial para un ejercicio (LIVA art.
          103.Dos.1): la deducción por input se enruta con --input-classification
