    provision:
      browser:
        help: Descarga la versión del navegador que abre la automatización de la AEAT.
          No hace nada si ya está instalada.
      help: 'Gestiona lo que se ejecuta en este equipo: el navegador de la automatización
        de la AEAT y el lector local de documentos (estado del runtime, instalación,
        arranque, descarga, carga, verificación y eliminación de modelos, o prepáralo
        todo de una vez).'
      install:
        confirm_help: Acepta descargar y ejecutar la instalación del gestor de paquetes.
          Sin esta opción no se instala nada.
        help: Instala el runtime local con el gestor de paquetes de la plataforma
          (winget en Windows, Homebrew en macOS). No hace nada si ya está instalado;
          en Linux la instalación queda a tu cargo.
      load:
        help: Carga modelos en la memoria del runtime local para que la primera lectura
          no espere a un arranque en frío; el de cada función del lector salvo que
          --role o --model lo acoten. Se niega antes de cargar si falta memoria; un
          modelo ya cargado se deja como está.
        model_help: Identificador en el runtime del modelo que se cargará. Debe estar
          ya descargado. Por defecto, el modelo seleccionado para la función.
      probe:
        help: Comprueba ahora la aptitud del modelo de texto en lugar de leer el veredicto
          registrado por `aeat config provision verify` e informa del lector local
          con ese resultado. Carga el modelo; no registra nada.
      pull:
        help: Descarga modelos al runtime local, el de cada función del lector salvo
          que --role o --model lo acoten. Rechaza antes de descargar si un modelo
          no podría cargarse.
        model_help: Identificador del modelo que se descargará. Por defecto, el modelo
          seleccionado para la función.
      remove:
        help: Elimina del almacén del runtime local un modelo seleccionado por Cadrumo
          e informa del espacio recuperado.
        model_help: Identificador del modelo que se eliminará. Solo pueden eliminarse
          modelos seleccionados por Cadrumo.
      report:
        help: Informa del hardware medido, el modelo seleccionado por función y si
          puede cargarse ahora.
      role_help: Función del modelo sobre la que actuar (transcripción de imágenes,
        extracción de texto, mapeo tabular, propuesta de naturaleza del suministro).
        Por defecto, todas.
      setup:
        confirm_help: Acepta descargar y ejecutar la instalación con el gestor de
          paquetes si falta el runtime. Sin esta opción, la preparación se detiene
          en el paso de instalación en lugar de instalar.
        help: 'Prepara el lector local de una vez: instala el runtime (solo con --confirm),
          lo arranca, descarga el modelo de cada función, los carga y los verifica.
          Los pasos ya hechos se indican sin cambios; el primer paso que falla detiene
          la ejecución.'
      start:
        help: Arranca el runtime local instalado cuando el endpoint local configurado
          no responde. No hace nada si ya responde.
      status:
        help: Informa de si el runtime local está instalado y responde, y de si el
          modelo de cada función del lector está instalado. Solo lee.
      verify:
        help: Verifica que los modelos cargan y responden a una consulta trivial dentro
          de un límite de tiempo, el de cada función del lector salvo que --role o
          --model lo acoten.
        model_help: Identificador del modelo que se verificará. Por defecto, el modelo
          seleccionado para la función.
