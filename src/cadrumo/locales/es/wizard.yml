      Esto prepara el perfil local que la app usa para los libros registro y las comprobaciones
      de modelos.

      Hay %{section_total} pasos. Solo %{required_total} respuestas son obligatorias
      para empezar; puedes dejar en blanco lo que todavía no sepas.

      Ten a mano tu NIF/CIF/DNI/NIE, una descripción breve de la actividad, régimen
      de IVA/IRPF, residencia fiscal y datos familiares si aplican.

      Después de guardar, revisa el progreso con `aeat config profile status`.'
