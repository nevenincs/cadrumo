modelo:
  schema:
    '187':
      field:
        official_name: Modelo 187. Declaración informativa de acciones y participaciones
          representativas del capital o patrimonio de las instituciones de inversión
          colectiva y resumen anual de retenciones e ingresos a cuenta del IRPF, IS
          e IRNR en relación con las rentas o ganancias patrimoniales obtenidas.
        title: Acciones y participaciones de IIC - resumen anual
      revision:
        2019-y-siguientes:
          casilla:
            '01':
              help: Número total de operaciones declaradas, equivalente al número
                de registros de tipo 2 del diseño de registro.
              label: Número total de operaciones
            '02':
              help: Suma de los importes de las operaciones de adquisición o suscripción
                de acciones y participaciones.
              label: Importe total de las adquisiciones
            '03':
              help: Suma de los importes de las operaciones de enajenación o reembolso
                de acciones y participaciones.
              label: Importe total de las enajenaciones
            '04':
              help: Suma de las retenciones e ingresos a cuenta practicados sobre
                las operaciones declaradas.
              label: Importe total de las retenciones e ingresos a cuenta
          construct:
            modelo-187-calculation-construct:
              field:
                title: Modelo 187 calculation construct
          field:
            label: Orden HAP/1608/2014, ejercicios 2019 y siguientes
