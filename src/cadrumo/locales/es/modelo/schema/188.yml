modelo:
  schema:
    '188':
      casilla:
        continuidad:
          capitalizacion-seguros-declarante-complementaria:
            label: 'Complementaria: C para añadir percepciones omitidas'
          capitalizacion-seguros-declarante-contacto:
            label: Apellidos y nombre de la persona de contacto
          capitalizacion-seguros-declarante-ejercicio:
            label: Ejercicio
          capitalizacion-seguros-declarante-justificante-anterior:
            label: Justificante anterior (solo si es sustitutiva)
          capitalizacion-seguros-declarante-nif:
            label: NIF del declarante
          capitalizacion-seguros-declarante-nombre:
            label: Apellidos y nombre o razón social
          capitalizacion-seguros-declarante-numero-justificante:
            label: Número de justificante (13 dígitos; empieza por 188)
          capitalizacion-seguros-declarante-sustitutiva:
            label: 'Sustitutiva: S para reemplazar una declaración anterior'
          capitalizacion-seguros-declarante-telefono:
            label: Teléfono de contacto
          capitalizacion-seguros-perceptor-base-retenciones:
            help: En IRPF, rendimiento menos las reducciones aplicables. En IS e IRNR
              con establecimiento permanente, el mismo importe y signo del rendimiento.
              Valor declarado; todavía no se calcula automáticamente.
            label: Base de retenciones e ingresos a cuenta
          capitalizacion-seguros-perceptor-clave:
            label: 'Clave B: anticipación de un PIAS'
          capitalizacion-seguros-perceptor-ejercicio-devengo:
            help: Solo para cantidades devengadas en ejercicios anteriores. Cada ejercicio
              de devengo se declara en un registro distinto.
            label: Ejercicio de devengo anterior
          capitalizacion-seguros-perceptor-informacion-adicional:
            help: Renta exenta comunicada al constituir la renta vitalicia de un PIAS,
              declarada al anticipar total o parcialmente sus derechos económicos.
            label: Renta exenta comunicada por anticipación de un PIAS
          capitalizacion-seguros-perceptor-modalidad:
            label: 'Modalidad: 1 dineraria; 2 en especie'
          capitalizacion-seguros-perceptor-nif:
            label: NIF del perceptor
          capitalizacion-seguros-perceptor-nombre:
            label: Apellidos y nombre o razón social del perceptor
          capitalizacion-seguros-perceptor-porcentaje-retencion:
            help: 'Porcentaje expresado en puntos porcentuales: 19 significa 19 %.
              Si se aplicaron varios tipos durante el ejercicio, se declara únicamente
              el último.'
            label: Porcentaje de retención (%)
          capitalizacion-seguros-perceptor-prima:
            label: Prima aportada
          capitalizacion-seguros-perceptor-provincia:
            label: Código de provincia
          capitalizacion-seguros-perceptor-reducciones:
            help: Solo para IRPF. Se declara cero si el rendimiento es negativo; no
              se aplica a IS ni a IRNR con establecimiento permanente.
            label: Reducciones de la disposición transitoria cuarta
          capitalizacion-seguros-perceptor-rendimiento-acreedor-hipotecario:
            label: Rendimiento de seguro cuyo beneficiario es el acreedor hipotecario
          capitalizacion-seguros-perceptor-renta-vitalicia-clave:
            label: 'Operación: A constitución; B anticipación'
          capitalizacion-seguros-perceptor-renta-vitalicia-fecha:
            help: Si hubo constitución y anticipación durante el ejercicio, se informa
              cada operación en un registro distinto.
            label: Fecha de constitución o anticipación
          capitalizacion-seguros-perceptor-renta-vitalicia-identificacion:
            label: Identificación de la renta vitalicia asegurada
          capitalizacion-seguros-perceptor-rentas:
            help: Importe en euros con su signo. Los rendimientos de distinto signo
              se declaran en registros separados.
            label: Rentas o rendimientos del capital mobiliario
          capitalizacion-seguros-perceptor-representante-nif:
            label: NIF del representante legal
          capitalizacion-seguros-perceptor-retenciones:
            help: Importe declarado. Debe ser cero cuando la base sea negativa. La
              verificación entre campos y el cálculo automático siguen pendientes.
            label: Retenciones e ingresos a cuenta
          capitalizacion-seguros-resumen-base-negativa:
            help: Suma de las bases de retención e ingreso a cuenta reflejadas en
              los registros de perceptor con base negativa.
            label: Base de retenciones e ingresos a cuenta negativa
          capitalizacion-seguros-resumen-base-positiva:
            help: Suma de las bases de retención e ingreso a cuenta reflejadas en
              los registros de perceptor con base positiva.
            label: Base de retenciones e ingresos a cuenta
          capitalizacion-seguros-resumen-perceptores-base-negativa:
            help: Número de registros cuya base de retenciones e ingresos a cuenta
              es negativa o cero. Un perceptor que figure en varios registros se cuenta
              una vez por cada registro.
            label: Número total de perceptores con base negativa o cero
          capitalizacion-seguros-resumen-perceptores-base-positiva:
            help: Número de perceptores (registros) cuya base de retenciones e ingresos
              a cuenta es positiva.
            label: Número total de perceptores con base positiva
          capitalizacion-seguros-resumen-retenciones:
            help: Suma de las retenciones e ingresos a cuenta practicados sobre las
              rentas declaradas.
            label: Retenciones e ingresos a cuenta
      field:
        official_name: Modelo 188. Retenciones e ingresos a cuenta. Rentas del capital
