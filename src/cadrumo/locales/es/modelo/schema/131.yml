modelo:
  schema:
    '131':
      casilla:
        continuidad:
          irpf-pf-modulos-1-unidades:
            label: 'Módulo 1 (Personal asalariado): número de unidades'
          irpf-pf-modulos-1-unidades-anterior:
            label: 'Módulo 1 (Personal asalariado): número de unidades del ejercicio
              anterior (2023), a efectos de la minoración por incentivos al empleo'
          irpf-pf-modulos-2-unidades:
            label: 'Módulo 2 (Personal no asalariado): número de unidades'
          irpf-pf-modulos-3-unidades:
            label: 'Módulo 3 (unidad activity-específica: superficie, distancia recorrida
              o carga): número de unidades'
          irpf-pf-modulos-4-unidades:
            label: 'Módulo 4 (unidad activity-específica: consumo de energía eléctrica
              u otra): número de unidades'
          irpf-pf-modulos-5-unidades:
            label: 'Módulo 5 (unidad activity-específica, p.ej. resto de superficie
              del local independiente o mesas): número de unidades'
          irpf-pf-modulos-6-unidades:
            label: 'Módulo 6 (unidad activity-específica, p.ej. resto de superficie
              del local no independiente o máquinas tipo A): número de unidades'
          irpf-pf-modulos-7-unidades:
            label: 'Módulo 7 (unidad activity-específica, p.ej. superficie del horno
              o máquinas tipo B): número de unidades'
          irpf-pf-modulos-diferencia:
            label: Diferencia
          irpf-pf-modulos-epigrafe-iae:
            label: Epígrafe IAE de la actividad en estimación objetiva (módulos).
              Para los epígrafes 659.4 y 691.9, que agrupan dos actividades distintas
              bajo un mismo código, use el sufijo "a" o "b" (p.ej. "659.4a", "691.9b")
              según la actividad - consulte el parámetro de coeficientes m131-modulos-coeficientes
              para la asignación exacta.
          irpf-pf-modulos-indice-inicio-actividad:
            label: 'Índice corrector por inicio de nuevas actividades (letra b.4,
              actividad iniciada desde el 1-1-2025 en local exclusivo). Índice declarado
              por el operador (0,80/0,90; 0,60/0,70 con discapacidad ≥33%, Orden HAC/1425/2025
              Anexo II, instrucción 2.3.b.4); el motor no modela el ejercicio de inicio
              ni la discapacidad. Incompatible con el índice de temporada (b.2): si
              ambos se declaran, prevalece la temporada.'
          irpf-pf-modulos-indice-pequena-dimension:
            label: Índice corrector para empresas de pequeña dimensión (letra b.1
              - municipio, local único, sin personal o hasta 2 trabajadores). Índice
              declarado por el operador (0,70/0,75/0,80/0,90, Orden HAC/1425/2025
              Anexo II, instrucción 2.3.b.1); el motor no modela hechos del contribuyente.
              Nunca se aplica a las actividades con índice especial (721.2, 722).
          irpf-pf-modulos-indice-temporada:
            label: 'Índice corrector de temporada (letra b.2 - actividad de temporada,
              hasta 180 días/año). Índice declarado por el operador (1,50/1,35/1,25
              según duración, Orden HAC/1425/2025 Anexo II, instrucción 2.3.b.2);
              el motor no modela la duración como hecho del contribuyente. Incompatible
              con el índice de inicio de nuevas actividades (b.4): si ambos se declaran,
              prevalece este.'
          irpf-pf-modulos-pequena-dimension-ignorado-flag:
            label: Casilla— información fiscal
          irpf-pf-modulos-rendimiento-neto-actividad:
            label: 'Rendimiento neto de la actividad (Fase 4ª: módulos − reducción
              general 5 por 100)'
          irpf-pf-modulos-rendimiento-neto-minorado:
            label: 'Rendimiento neto minorado (Fase 2ª: previo − minoración por incentivos
              al empleo − minoración por incentivos a la inversión)'
          irpf-pf-modulos-rendimiento-neto-previo:
            label: 'Rendimiento neto previo (Fase 1ª: Σ unidades módulo × rendimiento
              anual por unidad)'
          irpf-pf-modulos-resultado-declaracion:
            label: Resultado de la declaración
          irpf-pf-modulos-resultados-negativos-anteriores:
            label: Resultados negativos de trimestres anteriores
          irpf-pf-modulos-suma-rendimientos:
            label: Suma de rendimientos netos
          irpf-pf-modulos-temporada-inicio-actividad-conflicto-flag:
            label: Casilla— información fiscal
          irpf-pf-modulos-total:
            label: Total
          irpf-pf-modulos-volumen-agrario:
            label: Volumen de ingresos agrarios del trimestre
          irpf-pf-modulos-volumen-sin-datos-base:
            label: Volumen de ventas o ingresos sin datos-base
          irpf-pf-saldo-negativo-fin-periodo:
            label: Saldo negativo trasladable a periodos posteriores (max 0, -casilla
              10)
          minoracion-rendimientos-actividades-economicas:
            label: Minoracion por rendimientos netos de actividades economicas
          pago-fraccionado-previo:
            label: Suma de pagos fraccionados previos
          pago-fraccionado-previo-agrario:
            label: Pago fraccionado previo agrario
          pago-fraccionado-previo-datos-base:
            label: Pago fraccionado previo por datos-base
          pago-fraccionado-previo-sin-datos-base:
            label: Pago fraccionado previo sin datos-base
          prestamo-vivienda-habitual:
            label: Pago de prestamos para vivienda habitual
          resultado-anteriores-autoliquidaciones:
            label: Resultado a ingresar de autoliquidaciones anteriores
          retenciones-ingresos-a-cuenta:
            label: Retenciones e ingresos a cuenta
      field:
        official_name: Modelo 131. IRPF. Empresarios y profesionales en Estimación
          Objetiva. Pago fraccionado.
        title: IRPF pago fraccionado estimación objetiva
      revision:
        2019-2023:
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: pago fraccionado en estimación objetiva (ejercicios
                  2019 a 2023)'
          field:
            label: Ejercicios 2019 a 2023
        '2024':
          casilla:
            modulos-indice-inicio-actividad:
              label: 'Índice corrector por inicio de nuevas actividades (letra b.4,
                actividad iniciada desde el 1-1-2023 en local exclusivo). Índice declarado
                por el operador (0,80/0,90; 0,60/0,70 con discapacidad ≥33%, Orden
                HFP/1359/2023 Anexo II, instrucción 2.3.b.4); el motor no modela el
                ejercicio de inicio ni la discapacidad. Incompatible con el índice
                de temporada (b.2): si ambos se declaran, prevalece la temporada.'
            modulos-indice-pequena-dimension:
              label: Índice corrector para empresas de pequeña dimensión (letra b.1
                - municipio, local único, sin personal o hasta 2 trabajadores). Índice
                declarado por el operador (0,70/0,75/0,80/0,90, Orden HFP/1359/2023
                Anexo II, instrucción 2.3.b.1); el motor no modela hechos del contribuyente.
                Nunca se aplica a las actividades con índice especial (721.2, 722).
            modulos-indice-temporada:
              label: 'Índice corrector de temporada (letra b.2 - actividad de temporada,
                hasta 180 días/año). Índice declarado por el operador (1,50/1,35/1,25
                según duración, Orden HFP/1359/2023 Anexo II, instrucción 2.3.b.2);
                el motor no modela la duración como hecho del contribuyente. Incompatible
                con el índice de inicio de nuevas actividades (b.4): si ambos se declaran,
                prevalece este.'
            modulos-minoracion-inversion:
              label: Minoración por incentivos a la inversión (amortización del inmovilizado
                material o intangible afecto, según su libro registro de bienes de
                inversión). Importe declarado por el operador; el motor no modela
                un registro de bienes por elemento - consulte la Orden HFP/1359/2023
                Anexo II, instrucción 2.2.b) y su propia tabla de amortización.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Indicador interno (1/0): el índice corrector para empresas de
                pequeña dimensión (b.1) declarado fue ignorado por incompatibilidad
                con el índice corrector especial de la actividad (Orden HFP/1359/2023
                Anexo II, instrucción 2.3.a/b.1).'
            modulos-rendimiento-neto-modulos:
              label: 'Rendimiento neto de módulos (Fase 3ª: minorado ajustado por
                los índices correctores generales - pequeña dimensión, temporada/inicio
                de nuevas actividades, exceso - en el orden y con las incompatibilidades
                de la Orden HFP/1359/2023 Anexo II, instrucción 2.3)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Indicador interno (1/0): se declararon simultáneamente el índice
                corrector de temporada (b.2) y el índice corrector por inicio de nuevas
                actividades (b.4), incompatibles entre sí (Orden HFP/1359/2023 Anexo
                II, instrucción 2.3).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: pago fraccionado en estimación objetiva (ejercicio
                  2024)'
          field:
            label: Ejercicio 2024
