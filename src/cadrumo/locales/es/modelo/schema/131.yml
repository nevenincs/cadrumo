      revision:
        2019-2023:
          casilla:
            modulos-indice-inicio-actividad:
              label: 'Índice corrector por inicio de nuevas actividades (letra b.4,
                actividad iniciada desde el 1-1-2021 para el ejercicio 2022 o desde
                el 1-1-2022 para el ejercicio 2023, en local exclusivo). Índice declarado
                por el operador (0,80/0,90; 0,60/0,70 con discapacidad ≥33%, Anexo
                II, instrucción 2.3.b.4 de la Orden HFP/1335/2021 para 2022 y de la
                Orden HFP/1172/2022 para 2023); el motor no modela el ejercicio de
                inicio ni la discapacidad. Incompatible con el índice de temporada
                (b.2): si ambos se declaran, prevalece la temporada.'
            modulos-indice-pequena-dimension:
              label: Índice corrector para empresas de pequeña dimensión (letra b.1
                - municipio, local único, sin personal o hasta 2 trabajadores). Índice
                declarado por el operador (0,70/0,75/0,80/0,90, Anexo II, instrucción
                2.3.b.1 de la Orden HFP/1335/2021 para 2022 y de la Orden HFP/1172/2022
                para 2023); el motor no modela hechos del contribuyente. Nunca se
                aplica a las actividades con índice especial (721.2, 722).
            modulos-indice-temporada:
              label: 'Índice corrector de temporada (letra b.2 - actividad de temporada,
                hasta 180 días/año). Índice declarado por el operador (1,50/1,35/1,25
                según duración, Anexo II, instrucción 2.3.b.2 de la Orden HFP/1335/2021
                para 2022 y de la Orden HFP/1172/2022 para 2023); el motor no modela
                la duración como hecho del contribuyente. Incompatible con el índice
                de inicio de nuevas actividades (b.4): si ambos se declaran, prevalece
                este.'
            modulos-minoracion-inversion:
              label: Minoración por incentivos a la inversión (amortización del inmovilizado
                material o intangible afecto, según su libro registro de bienes de
                inversión). Importe declarado por el operador; el motor no modela
                un registro de bienes por elemento - consulte el Anexo II, instrucción
                2.2.b) de la Orden HFP/1335/2021 para 2022 o de la Orden HFP/1172/2022
                para 2023, y su propia tabla de amortización.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Indicador interno (1/0): el índice corrector para empresas de
                pequeña dimensión (b.1) declarado fue ignorado por incompatibilidad
                con el índice corrector especial de la actividad (Anexo II, instrucción
                2.3.a/b.1 de la Orden HFP/1335/2021 para 2022 y de la Orden HFP/1172/2022
                para 2023).'
            modulos-rendimiento-neto-modulos:
              label: 'Rendimiento neto de módulos (Fase 3ª: minorado ajustado por
                los índices correctores generales - pequeña dimensión, temporada/inicio
                de nuevas actividades, exceso - en el orden y con las incompatibilidades
                del Anexo II, instrucción 2.3 de la Orden HFP/1335/2021 para 2022
                y de la Orden HFP/1172/2022 para 2023)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Indicador interno (1/0): se declararon simultáneamente el índice
                corrector de temporada (b.2) y el índice corrector por inicio de nuevas
                actividades (b.4), incompatibles entre sí (Anexo II, instrucción 2.3
                de la Orden HFP/1335/2021 para 2022 y de la Orden HFP/1172/2022 para
                2023).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: pago fraccionado en estimación objetiva (ejercicios
                  2019 a 2023)'
          field:
            label: Ejercicios 2019 a 2023
