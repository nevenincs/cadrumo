              659.4 y 691.9, que agrupan dos actividades distintas bajo un mismo código,
              use el sufijo "a" o "b" (p.ej. "659.4a", "691.9b") según la actividad
              - consulte el parámetro de coeficientes m131-modulos-coeficientes-2024
              para la asignación exacta.'
