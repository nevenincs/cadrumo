              label: 'Rendimiento neto de la actividad (Fase 4ª: módulos − reducción
                general 5 por 100)'
            modulos-rendimiento-neto-minorado:
              help: 'Consulte la información correspondiente a la casilla: Rendimiento
                neto minorado (Fase 2ª: previo − minoración por incentivos al empleo
                − minoración por incentivos a la inversión).'
              label: 'Rendimiento neto minorado (Fase 2ª: previo − minoración por
                incentivos al empleo − minoración por incentivos a la inversión)'
            modulos-rendimiento-neto-modulos:
              help: 'Consulte la información correspondiente a la casilla: Rendimiento
                neto de módulos (Fase 3ª: minorado ajustado por los índices correctores
                generales - pequeña dimensión, temporada/inicio de nuevas actividades,
                exceso - en el orden y con las incompatibilidades de la Orden HFP/1359/2023
                Anexo II, instrucción 2.3).'
              label: 'Rendimiento neto de módulos (Fase 3ª: minorado ajustado por
                los índices correctores generales - pequeña dimensión, temporada/inicio
                de nuevas actividades, exceso - en el orden y con las incompatibilidades
                de la Orden HFP/1359/2023 Anexo II, instrucción 2.3)'
            modulos-rendimiento-neto-previo:
              help: 'Consulte la información correspondiente a la casilla: Rendimiento
                neto previo (Fase 1ª: Σ unidades módulo × rendimiento anual por unidad).'
              label: 'Rendimiento neto previo (Fase 1ª: Σ unidades módulo × rendimiento
                anual por unidad)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              help: 'Consulte la información correspondiente a la casilla: Indicador
                interno (1/0): se declararon simultáneamente el índice corrector de
                temporada (b.2) y el índice corrector por inicio de nuevas actividades
                (b.4), incompatibles entre sí (Orden HFP/1359/2023 Anexo II, instrucción
                2.3).'
              label: 'Indicador interno (1/0): se declararon simultáneamente el índice
                corrector de temporada (b.2) y el índice corrector por inicio de nuevas
                actividades (b.4), incompatibles entre sí (Orden HFP/1359/2023 Anexo
                II, instrucción 2.3).'
            saldo-negativo-fin-periodo:
              help: Saldo negativo trasladable a periodos posteriores (max 0, -casilla
                10)
              label: Saldo negativo trasladable a periodos posteriores (max 0, -casilla
                10)
