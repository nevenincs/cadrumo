  cli:
    automation:
      exit_auth: Se requiere autenticación o las credenciales han caducado.
      exit_codes_heading: Códigos de salida
      exit_conflict: Conflicto o fallo de condición previa.
      exit_forbidden: Operación no permitida por la política.
      exit_general: Error general u operación rechazada.
      exit_internal: Error interno inesperado.
      exit_not_found: Recurso no encontrado.
      exit_partial: Éxito parcial (algunos elementos han funcionado y otros no).
      exit_success: Correcto.
      exit_unavailable: Servicio externo no disponible.
      exit_usage: Uso incorrecto de la CLI (indicador erróneo, argumento ausente).
      exit_validation: Error de validación en los datos proporcionados por el usuario.
      intro: 'Use esta página cuando programe invocaciones de ``aeat``: documenta
        los códigos de salida del proceso y el comportamiento de salida TTY/JSON que
        comparten todos los comandos.'
      output_contract_body: Cuando la salida va a un TTY, la CLI emite texto enriquecido
        legible por personas. Cuando se pasa ``--format json`` (o cuando la salida
        se redirige), la CLI emite un único documento JSON por invocación. Los comandos
        que han adoptado el ``SchemaEnvelope`` envuelven su resultado como ``{envelope}``.
        Los comandos aún no migrados emiten su carga directamente.
      output_contract_heading: Contrato de salida TTY y JSON
      table_code_header: Código
      table_meaning_header: Significado
      title: Códigos de salida y contrato de salida
    command:
      no_description: Sin descripción.
      parameters_heading: Parámetros
    env:
      default_empty: vacío
      default_unset: sin definir
      secrets_note: La aplicación nunca imprime los secretos y aparecen marcados como
        `(secret)` más arriba. Los valores predeterminados marcados como `(derived)`
        se calculan en tiempo de ejecución a partir de la raíz de almacenamiento o
        de la ubicación del proyecto.
    family:
      choose_group_heading: Elija un grupo de comandos
      direct_commands_heading: Comandos directos
      direct_commands_intro: Estos comandos están montados directamente en ``aeat
        {family}``, sin grupo de verbos intermedio.
      group_link_line: Abrir :doc:`{target}` para ``aeat {family} {group}``.
      index_link_line: Abrir :doc:`/cli/index` para la página principal de la referencia
        de la CLI.
      intro: '``aeat {family}`` está organizado por grupo de verbos principal. La
        página de cada grupo empieza con su salida real de ``--help``, seguida de
        todos los comandos finales que contiene.'
      title: '{command}: referencia de comandos'
    index:
      app_card: 'Comandos del flujo de trabajo operativo: libro de movimientos, modelos,
        calendarios de presentación, comprobaciones del registro, capturas en vivo
        y colas de revisión.'
      choose_family_heading: Elija una familia de comandos
      config_card: 'Comandos locales de configuración y mantenimiento: perfiles, autenticación,
        integración con Google, comprobaciones de reparación y superficies de reinicio.'
      english_help_note: Las cadenas de ayuda se muestran en inglés. En tiempo de
        ejecución la CLI respeta el idioma de salida activo (``--language`` / ``CADRUMO_OUTPUT_LANGUAGE``).
      flag_debug: Activa el registro de nivel de depuración.
      flag_detail: Muestra información de versión ampliada, incluido el resumen del
        registro.
      flag_format: Formato de salida (``text`` o ``json``).
      flag_help: Muestra el documento de ayuda curado y termina.
      flag_language: Sobrescribe el idioma de salida (``es``, ``en``, ``ca``, ``hu``).
      flag_profile: Activa un perfil con nombre para esta invocación.
      flag_quiet: Suprime la salida informativa.
      flag_verbose: Activa la salida detallada.
      flag_version: Muestra la versión del paquete y termina.
      global_flags_heading: Indicadores globales
      global_flags_intro: El comando raíz ``aeat`` acepta estos indicadores y se aplican
        a todas las invocaciones.
      intro: 'La CLI ``aeat`` expone dos familias de comandos de primer nivel: ``config``
        (configuración local, ciclo de vida del perfil, diagnósticos) y ``app`` (flujo
        de trabajo fiscal operativo). Esta referencia documenta los {count} comandos
        finales.'
      next_app: Abrir :doc:`app` para los comandos del flujo de trabajo operativo.
      next_automation: Abrir :doc:`automation` para los códigos de salida y el contrato
        de salida TTY/JSON.
      next_config: Abrir :doc:`config` para los comandos locales de configuración
        y mantenimiento.
      next_howto: Abrir :doc:`/how-to/index` para las guías de inicio y las guías
        de tareas.
      next_schemas: Abrir :doc:`schemas` para el registro de esquemas de salida JSON.
      open_family_link: Abrir la referencia de ``aeat {family}``
      start_here: Empiece por los enlaces de familia que aparecen abajo. Use las páginas
        generadas de cada familia de comandos para conocer los indicadores, argumentos,
        claves de registro y esquemas de salida exactos; use esta página para el comportamiento
        de nivel raíz que se aplica a todos los comandos.
      title: Referencia de la CLI
      where_next_heading: Por dónde seguir
    param:
      argument_optional: Argumento, opcional.
      argument_required: Argumento, obligatorio.
      option_optional: Opción, opcional.
      option_required: Opción, obligatoria.
    schemas:
      group_entries: '{count} entradas: {keys}'
      summary: Las siguientes {count} rutas de comando tienen un ``OutputSchema``
        registrado. Las superficies de retrollamada de grupo ({groups}) se listan
        aparte.
      title: Registro de esquemas de salida
      tooling_note: Esta página está pensada sobre todo para quienes crean herramientas.
        Si ejecuta los comandos a mano, las :doc:`páginas de familia <index>` suelen
        ser un mejor punto de entrada.
