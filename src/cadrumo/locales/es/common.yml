        a la AEAT está prohibido por diseño. Exporta en local; el contribuyente presenta
        por su cuenta.'
      no_channel: '''{command}'' necesita una confirmación humana y este cliente no
        admite solicitudes interactivas. Ejecútalo desde un cliente que pueda hacerte
