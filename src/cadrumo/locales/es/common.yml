        (art. 28.1). No se aplica la regla del 30 por ciento del art. 30.2.5.b, reservada
        a la vivienda habitual parcialmente afecta.'
    telefonia_fija:
      label: Telefonía fija
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (ratio por defecto 30%), cuando la vivienda está solo parcialmente afecta
        (Ley 35/2006 art. 30.2.5.b, regla 4ª).
