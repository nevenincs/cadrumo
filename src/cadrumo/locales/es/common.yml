      el régimen especial de impatriados del Art. 93 LIRPF dentro de su ventana de
      seis ejercicios. Fuera de esa ventana, o sin opción por el régimen, la persona
      física residente vuelve a la ruta ordinaria del IRPF y al Modelo 100 cuando
      proceda.'
