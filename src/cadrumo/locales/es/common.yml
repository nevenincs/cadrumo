      cifra con una lectura de cálculo o revisión antes de confiar en ella.'
  harness:
    off_host_consent: 'Aviso de privacidad: léelo antes de continuar. Esta consola
      la maneja un asistente de IA que se ejecuta en el proveedor de LLM que hayas
      elegido. Tus palabras y las cifras con las que trabaja el asistente (importes,
      valores de casilla, obligaciones) se envían a ese proveedor para operar la consola.
      Tus DOCUMENTOS DE ORIGEN (facturas, extractos bancarios y cualquier byte de
      evidencia) NUNCA salen de tu equipo: permanecen en almacenamiento local cifrado
      y no se transmiten nunca. Si actúas por cuenta de un tercero (un gestor o profesional),
      confirma que esto es aceptable antes de continuar.'
  identity_gate:
    elicitation_echo: 'Actuando como el perfil de contribuyente: %{label}.'
    first_mutation_refused: 'Rechazado: confirma el contribuyente activo antes del
      primer cambio de esta sesión. Una presentación o edición nunca debe ejecutarse
      con la identidad equivocada. Llama a whoami (o ''config profile status'' / ''overview
      status'') para ver qué contribuyente está activo y reinténtalo: una sola lectura
      de identidad libera esto durante la sesión hasta que cambies de perfil.'
  persona:
    handoff_denied: '''{command}'' es el límite irreversible de entrega para presentación,
      propiedad del rol ''{owner}''; al rol ''{persona}'' se le deniega estructuralmente.
