        summary: Lee un archivo o una carpeta de copia de seguridad y devuelve la
          huella de lo leído. No restaura nada.
      archive_inspect:
        label: Inspeccionar una copia de seguridad de perfil
        summary: Muestra lo que un archivo de copia de seguridad dice de sí mismo,
          sin descifrarlo.
      profile_create:
        label: Crear un perfil
        summary: Crea y selecciona un perfil con su primera contraseña. El perfil
          permanece sin sesión hasta que inicies sesión.
      profile_list:
        label: Listar los perfiles
        summary: Lista los perfiles de este equipo sin desbloquear ninguno.
      recovery_disable:
        label: Eliminar un código de recuperación
        summary: Elimina el código de recuperación de un perfil cuando demuestras
          su contraseña actual.
      recovery_enroll:
        label: Configurar un código de recuperación
        summary: Crea un código de recuperación para un perfil cuando demuestras su
          contraseña. El código se muestra una sola vez.
      repair_logs:
        label: Últimas líneas del registro
        summary: Muestra dónde está el archivo de registro y sus líneas más recientes.
      repair_profile:
        label: Reparar el perfil activo
        summary: Comprueba si se puede leer el registro de un perfil, o borra un ajuste
          de perfil activo que no apunta a nada utilizable.
      repair_report:
        label: Diagnosticar la instalación
        summary: Comprueba la configuración local, el perfil activo, el inicio de
          sesión y el registro de actividad.
      report_verify_document:
        label: Verificar un resumen de cálculo
        summary: Comprueba un archivo de resumen de cálculo por su propio contenido,
          sin vincularlo a ningún perfil.
      reset_resume:
        label: Reanudar un reinicio
        summary: Lleva hasta el final un reinicio que quedó a medias.
      reset_start:
        label: Reiniciar todos los perfiles
        summary: Inicia la eliminación irreversible de todos los perfiles guardados
          en este equipo.
      reset_status:
        label: Estado del reinicio
        summary: Muestra hasta dónde ha llegado un reinicio, sin continuarlo.
      review_package_verify:
        label: Verificar un paquete de revisión
        summary: Comprueba cada archivo de un paquete de revisión contra su lista
          de sumas de comprobación.
      review_package_verify_receipt:
        label: Verificar un recibo contrafirmado
        summary: Comprueba las dos firmas de un recibo contrafirmado de un paquete
          de revisión.
      review_package_verify_signature:
        label: Verificar la firma de un paquete
        summary: Comprueba la firma de un paquete de revisión con una clave pública
          en la que confías.
      storage_check:
        label: Comprobar el almacenamiento
        summary: Compara las carpetas de almacenamiento del disco con lo que deberían
          ser, sin reparar nada.
      storage_init:
        label: Crear las carpetas de almacenamiento
        summary: Crea todas las carpetas que falten y conserva todo lo que ya existe.
      storage_inventory:
        label: Inventario del almacenamiento
        summary: Muestra dónde está cada área de almacenamiento y qué contiene.
      storage_reclaim:
        label: Liberar un área de almacenamiento
        summary: Elimina el contenido de un área que se puede volver a generar.
