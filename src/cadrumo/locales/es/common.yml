aggregation:
  grouping:
    errors:
      unsupported_modelo: No hay contrato de agregación registrado para el modelo
        solicitado.
  invoice_retencion:
    errors:
      euro_figures_unavailable_after_defect_sweep: Las cifras en euros no están disponibles
        en una factura que superó el barrido de defectos.
      perceptor_tax_id_unavailable_after_defect_sweep: El identificador fiscal del
        perceptor no está disponible en una factura que superó el barrido de defectos.
      projection_defects_repeat: Una proyección de retención de factura repite el
        mismo defecto.
      projection_outcome_ambiguous: Una proyección de retención de factura debe portar
        o una observación o defectos, nunca ambos ni ninguno.
  irnr_income_ledger:
    diagnostics:
      foreign_source_out_of_scope: source_jurisdiction %{source_jurisdiction} queda
        fuera del ámbito de fuente que declara la revisión seleccionada del Modelo
        210; el art. 13 del TRLIRNR solo admite rentas obtenidas en territorio español.
      incomplete_m210_classification: La operación entrante de fuente española no
        tiene una clasificación expresa de renta del Modelo 210; la proyección del
        IRNR nunca infiere un código oficial de tipo de renta desde irpf_category.
      source_jurisdiction_unresolved: source_jurisdiction no está resuelta (None)
        en una candidata entrante al Modelo 210; el art. 13 del TRLIRNR solo admite
        rentas de fuente española en esta proyección del IRNR.
      tipo_renta_code_not_declared: El código oficial de tipo de renta %{tipo_renta_code}
        del Modelo 210 no está declarado para la revisión y el período de presentación
        %{period} seleccionados.
    errors:
      income_type_codes_missing: La revisión seleccionada del Modelo 210 no declara
        ningún código de tipo de renta válido para este periodo de presentación.
      income_type_namespace_missing: La revisión seleccionada del Modelo 210 no declara
        exactamente un espacio de códigos de tipo de renta con clave.
      registry_revision_mismatch: La revisión del Modelo 210 inyectada no coincide
        con la revisión que la autoridad fijada selecciona para este modelo, ejercicio
        y periodo.
      source_scope_missing: La revisión seleccionada del Modelo 210 no declara un
        único ámbito de jurisdicción de la fuente para esta casilla de rendimientos
        íntegros.
  iva_ledger:
    errors:
      bucket_mismatch: El bucket del repositorio de movimientos no coincide con el
        bucket de agregación solicitado.
      deduction_authority_on_non_deducible_row: Una fila de IVA que no soporta cuota
        deducible no puede llevar una clasificación de deducción; la categoría de
        IVA %{category} se liquida como %{flow_direction}. Elimine el tipo de deducción
        declarado o corrija la categoría.
      differentiated_sector_inactive_for_filing_year: Un sector diferenciado está
        inactivo para el ejercicio.
      differentiated_sector_without_filing_year_entry: Un sector diferenciado no tiene
        entrada de registro para el ejercicio.
      differentiated_sector_without_provisional_percentage: Un sector diferenciado
        no tiene porcentaje provisional resuelto.
      domestic_identification_on_intra_community_transaction: Una identificación a
        efectos del IVA española no es válida para una operación intracomunitaria.
      eu_member_state_on_export_transaction: Las operaciones de exportación o asimiladas
        no pueden llevar un Estado miembro de la UE; recibido %{member_state}.
      inadmissible_deduction_classification: 'El tipo de deducción de IVA declarado
        %{deduction_fact_kind} no es admisible en una fila de la categoría de IVA
        %{iva_category}: %{refusal}. Corrija el tipo de deducción declarado, la categoría
        de IVA o la evidencia vinculada.'
      investment_observations_missing_bienes_inversion_authority: Las observaciones
        de IVA de inversión requieren el registro explícito de bienes de inversión
        y una autoridad de perfil coincidente.
      missing_counterparty_establishment_on_export: Una exportación está exenta porque
        la operación sale de la Unión, por lo que depende de dónde esté ESTABLECIDA
        la contraparte. Registre el país de la contraparte; un código ausente o no
        asignado no establece nada, y su identificación a efectos del IVA no puede
        responder a esto.
      missing_counterparty_identification_state: Una operación intracomunitaria requiere
        el Estado miembro en el que la contraparte está identificada a efectos del
        IVA.
      rectification_consumed_more_than_once: Un hecho de IVA ya corregido solo puede
        rectificarse una vez.
      sectorized_apportionment_duplicate_sectors: El reparto sectorizado de IVA declara
        el mismo sector más de una vez.
      sectorized_especial_missing_input_classification: La prorrata especial sectorizada
        requiere una clasificación de entrada explícita.
      sectorized_input_inactive_sector: Una entrada de IVA sectorizada referencia
        un sector inactivo.
      sectorized_input_missing_sector_identity: Una entrada de IVA sectorizada no
        aporta identidad de sector explícita.
      sectorized_input_unknown_sector: Una entrada de IVA sectorizada referencia un
        sector desconocido.
  m303_arrivals:
    errors:
      prorrata_register_contradictory_transition_evidence: El registro de prorrata
        recoge a la vez una opción y una revocación para el mismo ejercicio.
      prorrata_register_incomplete_current_year_declaration: El registro de prorrata
        carece de una declaración explícita y completa para el ejercicio en curso.
      prorrata_revocacion_without_prior_year_especial: La revocación de prorrata especial
        no tiene estado de registro especial del ejercicio anterior para los sectores
        afectados.
      prorrata_transition_contradictory_evidence: Las entradas de transición de prorrata
        especial contradicen la transición declarada.
      prorrata_transition_declarations_unavailable: La revisión seleccionada del modelo
        303 no declara calendario de presentación ni vínculo de arrastre periódico,
        por lo que no puede determinarse el periodo de transición de prorrata.
      prorrata_transition_entry_without_evidence: Una entrada de transición de prorrata
        especial no aporta evidencia de transición.
      prorrata_transition_evidence_without_declared_transition: Se aportó evidencia
        de transición de prorrata especial sin una transición declarada.
      prorrata_transition_evidence_wrong_filing_year: La evidencia de registro de
        transición de prorrata especial pertenece a otro ejercicio.
      prorrata_transition_missing_register_evidence: La transición de prorrata especial
        declarada no tiene evidencia de registro que la respalde.
      prorrata_transition_not_applicable_for_period: La evidencia de transición de
        prorrata especial solo aplica en el último periodo del Modelo 303 del ejercicio.
      recipient_fact_disagrees_with_ledger_evidence: El dato de destinatario de operaciones
        en criterio de caja no concuerda con su evidencia de apuntes en régimen del
        proveedor.
      supplier_regime_aggregation_period_mismatch: El periodo de la agregación de
        IVA no coincide con el periodo de declaración solicitado.
      supplier_regime_blank_ledger_identity: La evidencia de llegada en régimen del
        proveedor contiene una identidad de apunte en blanco.
      supplier_regime_duplicate_ledger_evidence: La evidencia de llegada en régimen
        del proveedor repite el mismo apunte.
      supplier_regime_observations_outside_period: La agregación de IVA contiene observaciones
        fechadas fuera del periodo de declaración solicitado.
  modelo_bindings:
    errors:
      invoice_line_currency_unconverted: Una línea de factura está denominada en moneda
        extranjera sin tipo de cambio a euros resuelto, por lo que no puede declararse
        en este modelo.
      unsupported_period: Periodo de modelo no soportado para la agregación del libro.
  oss_ioss:
    errors:
      exterior_country_code_undeclared: El Estado miembro de consumo no tiene un código
        de país declarado para el modelo 369, por lo que sus servicios no se pueden
        declarar en este modelo.
      exterior_rate_kind_unsupported: El régimen exterior de la ventanilla única sólo
        admite servicios al tipo general o reducido del Estado miembro de consumo.
        La observación aportada declara otro tipo de gravamen, que no puede agregarse
        en este régimen.
      invoice_line_currency_unconverted: Una línea de factura OSS/IOSS está denominada
        en moneda extranjera sin tipo de cambio a euros resuelto, por lo que no puede
        declararse en este modelo.
      invoice_line_rate_kind_unclassifiable: Una línea de factura OSS/IOSS tiene un
        tipo de IVA que no puede clasificarse en ningún tramo, por lo que su cuota
        no puede declararse en este modelo.
      iva_amount_mismatches_destination_rate: El importe de IVA persistido no concuerda
        con el tipo del Estado miembro de destino más allá de la tolerancia de un
        céntimo.
  per_modelo:
    errors:
      unsupported_modelo: Modelo no soportado para la agregación por modelo
  renta_ledger:
    errors:
      annual_period_required: Se requiere un periodo anual para la agregación del
        libro de Renta.
      bucket_mismatch: El bucket del repositorio de movimientos no coincide con el
        bucket solicitado del libro de Renta.
      invoice_bucket_mismatch: El bucket del repositorio de facturas no coincide con
        el bucket solicitado del libro de Renta.
      modelo_mismatch: El modelo tributario no coincide con el modelo esperado del
        libro de Renta.
      period_mismatch: El periodo no coincide con el periodo esperado del libro de
        Renta.
      quarterly_period_required: Se requiere un periodo trimestral para la agregación
        de ingresos del Modelo 130 (por ejemplo --year 2024 --period 1T).
      unsupported_period: Se requiere un periodo anual para la agregación de ingresos
        del Modelo 100 (p.ej. 2024-0A).
  retenciones:
    errors:
      filing_year_out_of_range: El ejercicio %{filing_year} esta fuera del rango admitido
        %{min_year}-%{max_year}.
      m111_no_retenciones_attestation_missing: 'No existen observaciones de retención
        por perceptor para el modelo 111 %{filing_year} %{period}. No presentes un
        Modelo 111 en blanco: declara el trimestre como periodo sin retenciones con
        `aeat config profile edit --modelo-111-no-retenciones-periods %{attestation_period}`
        (la opción sustituye la lista guardada, así que incluye también, separados
        por comas, los periodos ya declarados), o registra las filas de perceptor
        con `aeat app modelo aggregate --retencion-observation`.'
      m193_phase_allocation_collision: 'Modelo %{modelo} %{filing_year}: la(s) asignación(es)
        %{source_allocations} figuran declaradas manualmente y también proceden de
        las retenciones de capital capturadas. Elimine la fila manual.'
      perceptor_nif_blank: El NIF del perceptor no puede estar vacío.
      perceptor_observations_missing: No existen observaciones de retenciones por
        perceptor para el modelo %{modelo} %{filing_year} %{period}; la fuente %{source_kind}
        no puede resolverse.
      withholding_annual_source_not_quarterly: 'No se puede elaborar el resumen anual:
        el calendario de presentación del declarante no asigna su modelo periódico
        de retenciones a todos los trimestres del año (lo presenta mensualmente),
        y sumar solo los periodos trimestrales dejaría fuera meses de retenciones.'
      withholding_filer_profile_absent: No se ha podido cargar el perfil del declarante
        para este ejercicio, por lo que no puede determinarse si las retenciones se
        presentan trimestral o mensualmente. Complete el perfil y vuelva a intentarlo.
      withholding_quarterly_window_not_scheduled: El calendario de presentación del
        declarante no asigna este trimestre al modelo de retenciones (una gran empresa
        lo presenta mensualmente) y los periodos mensuales de retenciones aún no se
        admiten. No se ha registrado nada.
  service:
    errors:
      currency_conversion_required: El importe en moneda extranjera requiere una conversión
        a euros antes de poder agregarse.
      envelope_modelo_mismatch: El modelo del envoltorio no coincide con el modelo
        esperado.
      envelope_period_mismatch: El periodo del envoltorio no coincide con el periodo
        esperado.
      envelope_provider_payload_mismatch: La carga del proveedor del envoltorio no
        coincide con la esperada.
      observations_mismatch: Las observaciones devueltas no coinciden con las esperadas.
      per_modelo_modelos_not_unique: Los modelos por modelo no son únicos.
      result_source_kinds_not_unique: Los tipos de fuente del resultado no son únicos.
  source_mesh:
    errors:
      annual_summary_handoff_duplicate: Más de un resolutor proporcionó el traspaso
        inmutable del resumen anual del modelo 303 (primero {first_resolver}; segundo
        {second_resolver}).
      binding_source_mismatch: source_kind y binding_source se refieren a familias
        de origen de binding distintas.
      duplicate_binding_owner: 'Error interno: propietario de vinculación duplicado
        en la malla de fuentes.'
      duplicate_bound_casilla_owner: 'Error interno: propietario de casilla vinculada
        duplicado en la malla de fuentes.'
      duplicate_relation_owner: 'Error interno: propietario de relación duplicado
        en la malla de fuentes.'
      duplicate_row_binding_owner: 'Error interno: propietario de vinculación de fila
        duplicado en la malla de fuentes.'
      duplicate_row_casilla_coordinate: 'Error interno: coordenada de casilla de fila
        duplicada.'
      duplicate_row_casilla_owner: 'Error interno: propietario de casilla de fila
        duplicado en la malla de fuentes.'
      out_of_window_summary_date_span_invalid: La fecha máxima de presentación de
        un resumen fuera de ventana no puede ser anterior a su fecha mínima.
      out_of_window_summary_incomplete: Un resumen fuera de ventana debe establecer
        conjuntamente el recuento, la fecha mínima de presentación y la fecha máxima
        de presentación.
      owned_sources_blank: Las fuentes propiedad del mallado de fuentes no pueden
        contener tipos de fuente en blanco.
      owned_sources_duplicate: Las fuentes propiedad del mallado de fuentes deben
        ser únicas.
      provenance_binding_source_mismatch: El tipo de origen declarado en la fila de
        procedencia no coincide con el origen del vínculo al que dice pertenecer.
        Los dos deben nombrar el mismo origen para que la trazabilidad sea comprobable.
      provenance_binding_source_missing: La fila de procedencia declara un tipo de
        origen de vínculo reconocido pero no indica a qué vínculo corresponde. Un
        origen reconocible sin vínculo declarado deja el valor sin trazabilidad.
      provenance_contributor_missing_parent: Una fila de procedencia contribuyente
        debe declarar la fila primaria de la que procede. Sin ella, la aportación
        queda desligada del valor al que contribuye.
      provenance_contributor_parent_missing: Una fila contribuyente señala como fila
        madre una referencia que no figura entre las filas primarias declaradas. La
        cadena de procedencia apunta a un origen inexistente.
      provenance_primary_has_parent: 'Una fila de procedencia primaria no puede declarar
        una fila madre: la fila primaria es el origen del que dependen las demás.'
      provenance_primary_ref_ambiguous: Dos filas de procedencia primarias comparten
        la misma referencia de origen, de modo que una fila contribuyente no puede
        determinar de cuál de ellas procede.
      provenance_resolver_mismatch: Alguna fila de procedencia nombra un resolutor
        distinto del que produjo la resolución. Todas las filas deben atribuirse al
        mismo resolutor que firma el resultado.
      relation_provenance_incomplete: La procedencia de la relación debe incluir modelo
        origen, ejercicio, periodos, casillas, referencias legales y referencias de
        origen.
      reserved_composite_resolver_id: El identificador de resolutor indicado está
        reservado para las resoluciones compuestas y no puede usarse en una resolución
        simple.
      row_binding_index_invalid: 'Error interno: el índice de fila de la vinculación
        debe ser mayor o igual que 1.'
      row_binding_value_invalid: 'Error interno: el valor decimal de la vinculación
        de fila no es válido.'
      row_casilla_index_invalid: 'Error interno: el índice de casilla de fila debe
        ser mayor o igual que 1.'
      row_casilla_provenance_coordinate_mismatch: Cada valor de casilla de fila debe
        tener exactamente una procedencia.
      row_casilla_row_index_mismatch: La casilla de fila y su vinculación de origen
        deben usar el mismo índice.
      row_casilla_source_coordinate_missing: Falta el valor o la identidad de la vinculación
        de origen de una casilla de fila.
      row_casilla_source_identity_mismatch: La identidad de procedencia de la casilla
        de fila difiere de su identidad de origen.
      row_casilla_source_value_mismatch: El valor de la casilla de fila difiere del
        valor de su vinculación de origen.
      row_casilla_value_invalid: 'Error interno: el valor decimal de la casilla de
        fila no es válido.'
      row_source_identity_coordinate_mismatch: Toda coordenada de identidad de fila
        debe corresponder a un valor de vínculo presente en la propia fila. Se ha
        declarado una coordenada que la fila no aporta.
      source_transaction_ids_blank: Los identificadores de transacción del mallado
        de fuentes no pueden contener blancos.
      source_transaction_ids_duplicate: Los identificadores de transacción del mallado
        de fuentes deben ser únicos.
      unresolved_binding_ids_blank: 'Error interno: los ids de vinculación sin resolver
        no pueden estar en blanco.'
      unresolved_binding_ids_duplicate: 'Error interno: los ids de vinculación sin
        resolver no pueden estar duplicados.'
      unresolved_relation_ids_blank: 'Error interno: los ids de relación sin resolver
        no pueden estar en blanco.'
      unresolved_relation_ids_duplicate: 'Error interno: los ids de relación sin resolver
        no pueden estar duplicados.'
auth:
  catalogue:
    certificate_description: Autenticación basada en un certificado X.509 (FNMT-RCM
      u otra autoridad reconocida). Compatible con todos los flujos de la sede electrónica.
    certificate_label: Certificado digital
    clave_movil_description: Autenticación con aprobación push en el móvil del titular
      registrado en Cl@ve. Requiere DNI/NIE, registro en Cl@ve, y el dispositivo emparejado.
    clave_movil_label: Cl@ve Móvil
    clave_permanente_description: Autenticación con DNI/NIE y contraseña a través
      del proveedor de identidad Cl@ve Permanente. Automatizable sin intervención
      para los flujos de lectura de la AEAT; requiere DNI/NIE y contraseña.
    clave_permanente_label: Cl@ve Permanente
categories:
  registry:
    amortizacion_vivienda_afecto:
      label: Amortización de la vivienda afecta
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (Ley 35/2006 art. 30.2.5.b, regla 4ª, amortización de la vivienda afecta).
    arrendamiento_local:
      label: Alquiler del local
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    arrendamiento_vivienda_afecta: Parte del alquiler de la vivienda afecta a la actividad
    arrendamiento_vivienda_afecto:
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (Ley 35/2006 art. 29.2 y art. 28.1, arrendamiento de la vivienda afecta).
    asesoria_contable:
      label: Honorarios de asesoría contable
      notes: Gasto totalmente deducible, como servicio de profesional independiente
        (Ley 35/2006 art. 28.1).
    asesoria_fiscal:
      label: Honorarios de asesoría fiscal
      notes: Gasto totalmente deducible, como servicio de profesional independiente
        (Ley 35/2006 art. 28.1).
    asesoria_juridica:
      label: Honorarios de asesoría jurídica
      notes: Gasto totalmente deducible, como servicio de profesional independiente
        (Ley 35/2006 art. 28.1).
    comunidad_vivienda_afecto:
      label: Gastos de comunidad de la vivienda afecta
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (Ley 35/2006 art. 30.2.5.b, regla 2ª, gastos de titularidad de la vivienda).
    cuotas_autonomos_ss:
      notes: Gasto totalmente deducible; las cuotas del RETA son una condición legal
        para el ejercicio de la actividad.
    cuotas_colegiales:
      label: Cuotas colegiales
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    cuotas_reta: Cuotas de autónomos a la Seguridad Social (RETA)
    formacion_profesional:
      label: Formación profesional
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1, otros servicios exteriores).
    gastos_bancarios:
      label: Gastos bancarios
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1, gastos financieros
        y bancarios).
    gastos_financieros:
      label: Gastos financieros
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1, gastos financieros
        y bancarios).
    hardware_amortizable:
      label: Hardware amortizable
      notes: Gasto totalmente deducible mediante amortización (Ley 35/2006 art. 28.1,
        amortización del inmovilizado).
    home_office_agua: Agua del despacho en casa
    home_office_gas: Gas del despacho en casa
    home_office_internet: Internet del despacho en casa
    home_office_luz: Electricidad del despacho en casa
    ibi_local_afecto:
      label: IBI del local afecto
      notes: Gasto totalmente deducible (Ley 35/2006 art. 14 LIS por remisión; tributos
        fiscalmente deducibles).
    ibi_vivienda_afecto:
      label: IBI de la vivienda afecta
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (Ley 35/2006 art. 30.2.5.b, regla 2ª, tributos no estatales de la vivienda).
    manutencion_dietas_extranjero:
      notes: 'Deducible hasta un límite diario legal: 48,08 EUR/día sin pernocta,
        91,35 EUR/día con pernocta (Ley 6/2017 / Ley IRPF art. 30.2.5.c, Reglamento
        IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: Con pernocta
        sin-pernocta:
          label: Sin pernocta
    manutencion_dietas_nacional:
      notes: 'Deducible hasta un límite diario legal: 26,67 EUR/día sin pernocta,
        53,34 EUR/día con pernocta (Ley 6/2017 / Ley IRPF art. 30.2.5.c, Reglamento
        IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: Con pernocta
        sin-pernocta:
          label: Sin pernocta
    manutencion_extranjero: Dietas de manutención en el extranjero
    manutencion_nacional: Dietas de manutención nacional
    material_oficina:
      label: Material de oficina
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    mobiliario_amortizable:
      label: Mobiliario amortizable
      notes: Gasto totalmente deducible mediante amortización (Ley 35/2006 art. 28.1,
        amortización del inmovilizado).
    mutualidad_alternativa:
      label: Mutualidad alternativa
      notes: Deducible hasta un límite legal de 15.000 EUR/año por contribuyente,
        para una mutualidad alternativa que sustituye al RETA (AEAT ayuda Renta, Cotizaciones
        al RETA).
    publicidad_marketing:
      label: Publicidad y marketing
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1, otros servicios exteriores).
    reparaciones_conservacion:
      label: Reparaciones y conservación
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    seguros_rc: Seguro de responsabilidad civil profesional
    seguros_responsabilidad_civil:
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    seguros_salud: Seguro de salud del autónomo
    seguros_salud_autonomo:
      notes: Deducible hasta un límite legal de 500 EUR/año por contribuyente (Ley
        35/2006 art. 30.2.5.c, regla 1ª, primas de seguro de enfermedad).
      statutory_cap_variants:
        discapacidad:
          label: Límite por persona asegurada con discapacidad
        general:
          label: Límite general por persona asegurada
    software_suscripcion:
      label: Suscripción de software
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    subcontratacion:
      label: Subcontratación
      notes: Gasto totalmente deducible, como servicio de profesional independiente
        (Ley 35/2006 art. 28.1).
    suministros_cliente_directos:
      label: Suministros directos del cliente
      notes: Gasto totalmente deducible (Ley 35/2006 art. 28.1).
    suministros_home_office_agua:
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (ratio por defecto 30%), cuando la vivienda está solo parcialmente afecta
        (Ley 35/2006 art. 30.2.5.b, regla 4ª).
    suministros_home_office_gas:
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (ratio por defecto 30%), cuando la vivienda está solo parcialmente afecta
        (Ley 35/2006 art. 30.2.5.b, regla 4ª).
    suministros_home_office_internet:
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (ratio por defecto 30%), cuando la vivienda está solo parcialmente afecta
        (Ley 35/2006 art. 30.2.5.b, regla 4ª).
    suministros_home_office_luz:
      notes: Deducible en proporción a la superficie de la vivienda afecta a la actividad
        (ratio por defecto 30%), cuando la vivienda está solo parcialmente afecta
        (Ley 35/2006 art. 30.2.5.b, regla 4ª).
    suministros_local_afecto:
      label: Suministros del local afecto
      notes: 'Gasto totalmente deducible: el inmueble donde se desarrolla la actividad
        esta afecto (Ley 35/2006 art. 29.1.a) y sus suministros son gasto deducible
        (art. 28.1). No se aplica la regla del 30 por ciento del art. 30.2.5.b, reservada
        a la vivienda habitual parcialmente afecta.'
    telefonia_fija:
