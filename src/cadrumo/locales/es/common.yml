mcp:
  call:
    timeout: '''{command}'' superó el límite de tiempo del nivel {tier} ({seconds}s)
      y se canceló. Reinténtalo o ejecuta el comando equivalente de Cadrumo directamente
      en un terminal si la operación es larga.'
    timeout_may_complete: '''{command}'' superó su límite de tiempo; la operación
