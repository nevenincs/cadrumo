      con la AEAT no es fiable. Vuelve a autenticarte.
    auth_auth_certificate: Se produjo un error en la autenticación con certificado.
    auth_auth_certificate_expired: El certificado digital ha caducado. Renueva el
      certificado para poder autenticarte.
    auth_auth_certificate_load: No se pudieron leer los datos del certificado PKCS#12.
      Comprueba que el archivo no esté dañado.
