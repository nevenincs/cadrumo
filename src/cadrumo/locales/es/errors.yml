    auth_google_client_revoked: Google ya no acepta el cliente OAuth de escritorio
      de esta instalación. Actualiza la aplicación a una versión actual.
    auth_google_scope_insufficient: Los permisos concedidos a Google no incluyen todos
      los necesarios para esta operación. Vuelve a autorizar concediendo todos los
      permisos solicitados.
    auth_outbound_storage_permission: Las credenciales activas no tienen el permiso
      necesario para esta operación de almacenamiento.
    auth_session_corrupt: Los metadatos de la sesión guardada no se pueden leer. Vuelve
      a autenticarte para crear una sesión nueva.
    auth_session_deserialization: Los datos de sesión de autenticación almacenados
      no se pudieron deserializar. Vuelve a autenticarte para crear una sesión nueva.
    auth_session_unavailable: No hay ninguna sesión activa verificada con la AEAT
      disponible. Autentícate antes de continuar.
    auth_storage_keyring_unavailable: El llavero del sistema operativo no está disponible.
      O no hay ningún almacén de credenciales registrado, o esta sesión de inicio
      no puede guardar credenciales, algo habitual en sesiones de red o de servicio.
      Inicia sesión de forma interactiva.
    auth_view_capture_identity_mismatch: La sesión de la AEAT pertenece a un contribuyente
      distinto del del perfil activo.
    clave_movil_identity_checksum: El identificador de Cl@ve Móvil tiene una forma
      válida pero su letra de control no coincide con los dígitos. Revisa la última
      letra del documento e inténtalo de nuevo.
