errors:
  auth:
    auth_aeat_login_assertion: No se pudo generar la verificación posterior al inicio
      de sesión con la AEAT.
    auth_aeat_session_expired: La sesión autenticada con la AEAT ha caducado. Vuelve
      a autenticarte para continuar.
    auth_auth: Se produjo un error de autenticación con la AEAT.
    auth_auth_authenticator_persisted_session_invalid: La sesión de navegador guardada
      con la AEAT no es fiable. Vuelve a autenticarte.
    auth_auth_certificate: Se produjo un error en la autenticación con certificado.
    auth_auth_certificate_expired: El certificado digital ha caducado. Renueva el
      certificado para poder autenticarte.
    auth_auth_certificate_load: No se pudieron leer los datos del certificado PKCS#12.
      Comprueba que el archivo no esté dañado.
    auth_auth_certificate_nif_parse: No se pudo extraer ningún NIF ni NIE del titular
      del certificado. Comprueba que el certificado sea de persona física.
    auth_auth_certificate_password: La contraseña del certificado falta o es incorrecta.
      Define la variable de entorno con la contraseña correcta.
    auth_auth_certificate_pre_expiry: El certificado digital está a punto de caducar.
      Renuévalo antes de que expire para evitar interrupciones.
    auth_auth_clave_movil_clave_movil_approval_timeout: La autenticación Cl@ve no
      se completó a tiempo. Aprueba la solicitud en tu dispositivo y vuelve a intentarlo.
    auth_auth_clave_movil_clave_movil_configuration: Faltan ajustes obligatorios de
      Cl@ve Móvil o son incorrectos. Revisa la configuración de Cl@ve.
    auth_auth_configuration: Faltan ajustes de autenticación obligatorios o son incorrectos.
      Revisa la configuración de autenticación.
    auth_auth_provider_cleanup: El proveedor de autenticación no pudo liberar todos
      los recursos del navegador. Reintenta el cierre antes de iniciar otra sesión.
    auth_auth_validation: Los parámetros de autenticación no superaron la validación.
      Corrige los valores indicados y vuelve a intentarlo.
    auth_former_product_session_state: Cadrumo detectó estado de sesión de un producto
      retirado y se niega a leerlo, moverlo, re-cifrarlo, eliminarlo o adoptarlo.
    auth_google: Se produjo un error en la autenticación con Google.
    auth_google_client_not_registered: No hay ningún cliente OAuth de escritorio de
      Google registrado para el perfil activo. Registra un cliente para usar funciones
      de Google.
    auth_google_client_revoked: El cliente OAuth de escritorio de Google registrado
      ha sido revocado. Registra un cliente nuevo.
    auth_google_expired: El token de actualización de Google ha caducado por el límite
      de 7 días de los proyectos en pruebas. Vuelve a autorizar el acceso a Google.
    auth_google_revoked: El token de actualización de Google ha sido revocado. Vuelve
      a autorizar el acceso a Google.
    auth_google_scope_insufficient: Los permisos concedidos a Google no incluyen todos
      los necesarios para esta operación. Vuelve a autorizar concediendo todos los
      permisos solicitados.
    auth_outbound_storage_permission: Las credenciales activas no tienen el permiso
      necesario para esta operación de almacenamiento.
    auth_session_corrupt: Los metadatos de la sesión guardada no se pueden leer. Vuelve
      a autenticarte para crear una sesión nueva.
    auth_session_deserialization: Los datos de sesión de autenticación almacenados
      no se pudieron deserializar. Vuelve a autenticarte para crear una sesión nueva.
    auth_session_unavailable: No hay ninguna sesión activa verificada con la AEAT
      disponible. Autentícate antes de continuar.
    auth_storage_bucket_recovery_verification: El código de recuperación introducido
      no es válido. Vuelve a escribir las 24 palabras exactamente como aparecen en
      la copia de seguridad.
    auth_storage_keyring_unavailable: El llavero del sistema operativo no está disponible.
      O no hay ningún almacén de credenciales registrado, o esta sesión de inicio
      no puede guardar credenciales, algo habitual en sesiones de red o de servicio.
      Inicia sesión de forma interactiva o comprueba que haya un almacén de credenciales
      instalado y activo.
    auth_storage_master_key_material_missing: No existe material de clave maestra.
      El almacenamiento seguro aún no está aprovisionado.
    auth_storage_master_key_unavailable: Esta sesión de perfil se reanudó y solo conserva
      su clave de datos; el material de cifrado de claves está ligado al inicio de
      sesión. Ejecuta `aeat config login` para volver a autenticarte.
    clave_movil_identity_checksum: El identificador de Cl@ve Móvil tiene una forma
      válida pero su letra de control no coincide con los dígitos. Revisa la última
      letra del documento e inténtalo de nuevo.
  calc:
