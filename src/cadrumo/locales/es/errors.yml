    date_binding_used_as_decimal_leaf: 'Error interno: vinculación de fecha utilizada
      como hoja decimal.'
    date_binding_value_missing: Falta el valor de la vinculación de fecha.
    dispatch_key_unknown: 'La clave de despacho {dispatch_key!r} no está en la tabla
