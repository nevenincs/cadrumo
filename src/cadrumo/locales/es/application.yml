application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: No se pudo adquirir el bloqueo de autenticación AEAT tras
          la recuperación del bloqueo obsoleto.
        lock_held: Ya hay otra operación de autenticación AEAT en curso para este
          perfil. No inicies una segunda petición de Cl@ve; espera a que termine el
          proceso en curso o deja expirar el bloqueo si ese proceso ha fallado.
    certificate:
      health:
        file_missing: El fichero de certificado configurado (%{path}) no existe. Recupera
          el fichero o ejecuta 'aeat config auth configure --provider certificate
          --file RUTA' con una ruta válida.
        path_unset: No se ha seleccionado un fichero de certificado. Ejecuta 'aeat
          config auth configure --provider certificate --file RUTA' para indicarlo.
        unavailable: El estado del certificado no está disponible; consulta los registros
          de depuración para los detalles de diagnóstico.
      load:
        password_unset: No hay contraseña de certificado configurada. Configura la
          contraseña del certificado antes de continuar.
        path_unset: No hay fichero de certificado configurado. Ejecuta 'aeat config
          auth configure --provider certificate --file RUTA' para indicarlo.
    clave_movil:
      health:
        identity_unset: No se ha configurado un DNI/NIE para Cl@ve Móvil. Configúralo
          antes de continuar.
        operator_completion_required: Preparado; tienes que completar tú el paso de
          Cl@ve.
    errors:
      session_field_not_datetime: El campo {field} de sesión persistida debe ser una
        fecha-hora o cadena ISO-8601.
    operator:
      alignment:
        both_missing_detail: No están configurados ni la identidad Cl@ve (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          ni el identificador fiscal del perfil activo. Configura ambos con el mismo
          DNI/NIE antes de la autenticación AEAT en directo.
        clave_identity_missing_detail: La identidad Cl@ve (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          no está configurada, por lo que no se puede comparar con el identificador
          fiscal del perfil activo. Configúrala con el DNI/NIE del perfil activo.
        mismatch_detail: El DNI/NIE de la identidad Cl@ve '%{clave_identity}' no coincide
          con el identificador fiscal del perfil activo '%{profile_tax_id}'. La autenticación
          AEAT en directo vincularía la sesión de un contribuyente a otro perfil.
          Cambia al perfil cuyo identificador fiscal coincida con el DNI/NIE de Cl@ve,
          o corrige el valor que sea erróneo.
        profile_tax_id_missing_detail: El perfil activo no tiene identificador fiscal,
          por lo que no se puede comparar con la identidad Cl@ve. Configura el identificador
          fiscal del perfil con el DNI/NIE usado para Cl@ve.
      errors:
        certificate_file_required: El proveedor de certificado requiere un fichero
          de certificado. Ejecuta `aeat config auth configure --provider certificate
          --file RUTA` con la ruta a tu paquete PKCS#12 (.p12/.pfx).
        certificate_file_unresolved: La ruta del certificado '%{certificate_path}'
          no resuelve a un fichero existente. Ejecuta `aeat config auth configure
          --provider certificate --file RUTA` con una ruta a tu paquete PKCS#12 (.p12/.pfx).
        certificate_secret_mutation_in_progress: Aún se está recuperando un cambio
          del secreto de certificado para este perfil. Reintenta el mismo comando
          de secreto antes de cambiar la configuración de autenticación.
        certificate_source_not_found: El origen de certificado '%{name}' no está registrado.
          Ejecuta `aeat config auth certificate list` para ver los orígenes registrados,
          o `aeat config auth certificate register --name %{name} --file RUTA` para
          registrarlo.
        cleanup_in_progress: Aún se está recuperando un cierre o reinicio de autenticación
          para este perfil. Reanuda esa operación antes de cambiar la configuración
          de autenticación.
        dangling_active_profile: El puntero de perfil activo '%{active_profile}' no
          resuelve a un bucket de perfil registrado. Ejecuta aeat config profile list
          para inspeccionar los perfiles registrados y después aeat config login NAME
          o aeat config profile create NAME.
        no_active_bucket: No hay un perfil activo; ejecuta `aeat config profile create
          NAME` antes de configurar la autenticación.
        provider_not_configured: No hay ningún proveedor de autenticación configurado;
          indica --provider o configura uno primero.
        requires_custody_session: La operación de autenticación apunta al perfil '%{bucket_id}'
          en %{storage_root}, pero ese perfil no tiene una sesión de custodia abierta.
          Ejecuta aeat config login para ese perfil y vuelve a intentarlo.
        revoke_requires_custody_session: La sesión de la AEAT del perfil '%{bucket_id}'
          NO se ha revocado y sigue activa. Está guardada cifrada dentro de ese perfil,
          por lo que solo desbloquear ese perfil, con aeat config login, la revoca.
        scope_conflict: Elige --provider o --all, pero no ambos.
        unreadable_active_profile: 'El perfil activo ''%{active_profile}'' tiene un
          manifiesto de bucket pero no tiene un registro de perfil legible (status=%{status}).
          Siguiente acción: %{next_action}.'
      login:
        refused_certificate_file_missing: 'No se puede iniciar sesión: el fichero
          de certificado configurado (%{path}) no existe. Recupera el fichero o vuelve
          a configurar la ruta antes de continuar.'
        refused_certificate_path_unset: 'No se puede iniciar sesión: aún no se ha
          seleccionado un fichero de certificado. Ejecuta ''aeat config auth configure
          --provider certificate --file RUTA'' antes de continuar.'
        refused_clave_movil_identity_unset: 'No se puede iniciar sesión con Cl@ve
          Móvil: aún no se ha configurado un DNI/NIE. Configúralo antes de continuar.'
        refused_live_tests_disabled: 'El inicio de sesión en directo está deshabilitado
          por seguridad: la herramienta sólo construye y comprueba localmente. Habilita
          la opción de pruebas en directo si realmente quieres conectarte a la AEAT,
          y vuelve a ejecutar este comando. Proveedor solicitado: %{provider}.'
      probe:
        certificate_corrupt: El fichero de certificado no es un PKCS#12 válido o falta
          la contraseña; no se puede analizar.
        certificate_corrupt_detail: 'El certificado no se puede interpretar: %{error}.'
        certificate_expired: El certificado ha caducado hace %{days} días. Renuévalo
          antes de la autenticación.
        certificate_expiring: El certificado caduca dentro de %{days} días. Programa
          la renovación.
        certificate_file_missing: El fichero de certificado configurado (%{path})
          no existe.
        certificate_ok: Certificado válido; caduca dentro de %{days} días.
        certificate_path_unset: No se ha seleccionado un fichero de certificado.
        certificate_unreadable: El fichero de certificado no se puede leer (%{error}).
        clave_movil_identity_invalid: 'El DNI/NIE configurado para Cl@ve Móvil no
          es válido: %{error}.'
        clave_movil_identity_ok: El DNI/NIE configurado para Cl@ve Móvil tiene una
          forma válida.
        clave_movil_identity_unset: No se ha configurado un DNI/NIE para Cl@ve Móvil.
        no_provider: No hay ningún proveedor de autenticación configurado; nada que
          comprobar localmente.
        no_session: No hay ningún token de sesión AEAT persistido en disco; ejecuta
          `aeat config auth login` para obtener uno.
        session_expired: Hay un token de sesión AEAT persistido en disco pero ha superado
          su límite de inactividad; ejecuta `aeat config auth login --fresh` para
          renovarlo.
        session_live: Hay un token de sesión AEAT persistido en disco y dentro de
          su límite de inactividad.
    provider_impact:
      certificate_ready: El acceso con certificado está listo. Mantienes el mismo
        flujo de comandos para las lecturas de la AEAT; todos los proveedores usan
        los mismos comandos.
      generic_ready: '%{label} está listo. Mantienes el mismo flujo de comandos mientras
        este proveedor usa el protocolo de acceso compartido.'
      unavailable: '%{label} está configurado pero aún no está listo. Todavía puedes
        preparar, comprobar y exportar declaraciones localmente, pero las lecturas
        de la AEAT seguirán sin estar disponibles hasta que se solucione el acceso.'
      unconfigured: Todavía puedes preparar, comprobar y exportar declaraciones localmente,
        pero las lecturas de la AEAT seguirán sin estar disponibles hasta que configures
        un proveedor de acceso.
    sessions:
      errors:
        clave_contraste_missing: La ruta Cl@ve Móvil sin QR necesita el contraste
          impreso en tu documento. Registra %{nie_field} en el perfil activo si es
          un NIE, o %{dni_field} si es un DNI, antes de usar cualquier sesión con
          la AEAT.
        clave_identity_malformed: La identidad de Cl@ve no es un NIF, NIE o CIF válido,
          por lo que no se puede confirmar que pertenezca a este perfil.
        clave_identity_missing: La autenticación en directo con Cl@ve exige un DNI/NIE.
          Regístralo en el perfil activo como %{identity_field}, o configúralo para
          el proveedor con `aeat config auth configure`, antes de usar cualquier sesión
          con la AEAT.
        clave_identity_profile_mismatch: La identidad de Cl@ve Móvil no coincide con
          la identidad fiscal del perfil activo; cambia al perfil que coincida o actualiza
          el perfil antes de la autenticación AEAT en directo.
        clave_route_missing: La autenticación en vivo con Cl@ve Móvil requiere %{route_field}.
          Abre Identificación en el gestor del perfil, elige Código QR o Solicitud
          en la aplicación, guarda y reintenta la sincronización.
        corrupt_session: La sesión de autenticación guardada está dañada y no se puede
          leer. Ejecuta `aeat config auth logout` y después `aeat config auth test`.
        no_session: No hay sesión AEAT activa; ejecuta `aeat config auth test` antes
          de leer datos AEAT.
        profile_identity_cleared: La autenticación en directo con la AEAT necesita
          el ID fiscal del perfil activo, y este perfil no lo tiene. Restaura %{requirements}
          en el perfil y vuelve a autenticarte.
        profile_identity_malformed: La identidad fiscal de este perfil no es un NIF,
          NIE o CIF válido, por lo que no se puede confirmar que la sesión Cl@ve le
          pertenezca.
        profile_tax_id_missing: La autenticación en directo con Cl@ve Móvil exige
          que el perfil activo incluya %{requirements}.
        provider_close_failed: No se pudo cerrar de forma segura la sesión del navegador
          AEAT; repite la autenticación antes de leer datos AEAT.
        session_identity_profile_mismatch: La identidad de la sesión AEAT no coincide
          con la identidad fiscal del perfil activo; borra las sesiones de autenticación
          y autentica el perfil que coincida antes de las lecturas AEAT en directo.
  calculations:
    bienes_inversion_regularizacion:
      register_advisory: '%{count} bien(es) de inversión en periodo de regularización
        (LIVA arts. 107-110) para %{year}: %{computed} computado(s), %{pending} pendiente(s)
        de prorrata definitiva. Regularización propuesta para casilla %{casilla}:
        %{value}. Confirma el valor antes de presentar.'
      transmision_advisory: '%{count} bien(es) de inversión transmitido(s) en %{year}
        requieren la regularización única de entregas (LIVA art. 110). Regularización
        propuesta para casilla %{casilla}: %{value}. Confirma el valor antes de presentar.'
    binding_prefill:
      errors:
        observation_merge_key_conflict: 'No se pueden fusionar observaciones con distinta
          clave de modelo, ejercicio o periodo: {primary_modelo} {primary_filing_year}
          {primary_period} frente a {overlay_modelo} {overlay_filing_year} {overlay_period}.'
    iva_compensation:
      errors:
        annual_partition_casilla_ids_noncanonical: Las observaciones de compensación
          del Modelo 303 deben usar los identificadores de casilla declarados por
          la revisión {revision_id}; {casilla_ids} no están declarados.
        correction_missing: No existe ningún registro de compensación sembrado para
          %{filing_year}/%{period}; la corrección sobrescribe una siembra existente,
          no la crea.
        history_casilla_undeclared: La casilla {casilla_id} no está declarada en el
          modelo {modelo} versión {revision_id}, por lo que no se le puede adjuntar
          ninguna referencia legal. Corrige la referencia de la casilla.
        history_operand_ref_value_arity: La casilla {casilla_id} aporta {operand_ref_count}
          referencias de operando y {operand_value_count} valores de operando, por
          lo que la trazabilidad de su fórmula quedaría incompleta.
        history_operand_refs_diverge_from_formula: La casilla {casilla_id} aporta
          las referencias de operando {supplied_operand_refs}, pero la fórmula {formula_id}
          proyecta {formula_operand_refs}.
        history_operand_refs_without_formula: La casilla {casilla_id} aporta referencias
          de operando, pero el modelo {modelo} revisión {revision_id} no declara ninguna
          fórmula para ella.
        local_recurrence_modelo_303_only: La recurrencia local de compensación de
          IVA solo se reconstruye para el Modelo 303; se ha indicado el modelo {modelo}.
        modelo_303_only: El historial de compensación de IVA solo acepta observaciones
          del Modelo 303.
        persistence: El almacenamiento del historial de compensación de IVA falló
          durante %{operation} (%{cause_type}).
        repository_backend_split: El almacén de observaciones del Modelo 303 y el
          del historial de compensación de IVA deben compartir un único backend cifrado
          para que ambas escrituras se confirmen a la vez.
        seed_conflict: Ya existe un estado de compensación de IVA para este periodo;
          la semilla sobrescribiría el historial almacenado.
    iva_wallet:
      errors:
        decision_blocks_calculation: La decisión de la cartera de IVA para {target_year}
          {target_period} está bloqueada por la divergencia {divergence}. Resuelve
          la divergencia antes de calcular.
        decision_no_selected_amount: La decisión de la cartera de IVA para {target_year}
          {target_period} no contiene ningún importe seleccionado, por lo que no se
          puede vincular ningún valor de compensación.
        decision_repository_backend_split: El almacén de decisiones de la cartera
          de IVA y el de observaciones de cálculo deben compartir un único backend
          cifrado cuando la decisión se persiste.
        decision_target_mismatch: La decisión almacenada de la cartera de IVA apunta
          a {decision_target_year} {decision_target_period}, pero la declaración es
          {context_filing_year} {context_period}.
        modelo_303_only: La conciliación de la cartera de compensación de IVA solo
          se aplica al Modelo 303; se ha indicado el modelo {modelo}.
    m303_carry:
      errors:
        available_compensation_amount_missing: El sobre de arrastre validado del Modelo
          303 no lleva ningún importe de compensación disponible en la casilla {casilla_id}.
        available_compensation_formula_missing: La revisión {revision_id} no declara
          ninguna fórmula para la casilla {target_casilla_id}, por lo que la compensación
          disponible con base en la generada no puede citar ninguna.
        carry_operands_disagree_with_formula: Los operandos de arrastre {derivation_operands}
          no coinciden con los operandos de la fórmula de la definición del modelo
          {registry_operands}. Solo una corrección de las definiciones de los modelos
          puede resolverlo; no hay recuperación automática segura.
        casilla_id_invalid: Las definiciones de los modelos declaran una casilla no
          válida para la clave de correspondencia {mapping_key} del arrastre del Modelo
          303.
        disposition_code_not_admitted: El código de destino del resultado {code} no
          está admitido para el arrastre del Modelo 303.
        disposition_code_undeclared: Las definiciones de los modelos no declaran ningún
          código para el destino del resultado {disposition}.
        disposition_result_sign_incompatible: La disposición declarada {disposition}
          no pudo haberse seleccionado para un resultado registrado de {resultado}.
          Solo el contribuyente puede decidir cuál es correcta; no hay recuperación
          automática segura.
        duplicate_header_facts: La evidencia de arrastre del Modelo 303 lleva {header_count}
          cabeceras de origen {header_key}; se requiere exactamente una.
        envelope_not_normalized: El historial de arrastre del Modelo 303 requiere
          un par disponible y generada ya normalizado y consciente de la disposición.
          Vuelve a importar los datos de la presentación registrada.
        formula_mapping_required: La revisión {revision_id} no declara la correspondencia
          de arrastre del Modelo 303 necesaria para citar la fórmula de la compensación
          disponible.
        generated_compensation_amount_missing: El sobre de arrastre validado del Modelo
          303 no lleva ningún importe de compensación generada en la casilla {casilla_id}.
        header_code_invalid: La cabecera de origen de tipo de declaración en {source_locator}
          lleva {value}, que no es un código de disposición de resultado.
        header_code_not_admitted: La cabecera de origen de tipo de declaración en
          {source_locator} lleva {value}, un código que el diseño de registros del
          Modelo 303 no admite.
        incomplete_supported_operands: 'La normalización del arrastre del Modelo 303
          no puede derivar la compensación disponible a partir de las casillas presentes:
          {casilla_ids}.'
        invalid_registry_observation: La entrada de arrastre del Modelo 303 requiere
          una observación leída de las definiciones del modelo; ha recibido {observed_type}.
        local_disposition_header_disagreement: La disposición de resultado registrada
          como presentada {typed_disposition} no coincide con la cabecera de tipo
          de declaración {header_disposition}. Solo el contribuyente puede decidir
          cuál se presentó; no hay recuperación automática segura.
        local_filing_disposition_required: La evidencia de arrastre de una presentación
          local del Modelo 303 debe llevar la disposición de resultado determinada
          en el momento de la presentación; la evidencia {source_kind} no lleva ninguna.
        local_filing_provenance_required: La disposición de un Modelo 303 registrado
          como presentado debe conservar su origen app_filing; lleva {provenance_kind}.
        non_target_modelo_envelope: El historial de arrastre del Modelo 303 solo admite
          observaciones del Modelo 303; se ha indicado el modelo {modelo}.
        official_disposition_header_disagreement: La disposición de resultado tipada
          {typed_disposition} no coincide con la cabecera de tipo de declaración de
          la AEAT {header_disposition}. Solo el contribuyente puede decidir cuál se
          presentó; no hay recuperación automática segura.
        official_header_required: La evidencia oficial de arrastre del Modelo 303
          debe llevar exactamente una cabecera de origen {header_key}; la evidencia
          {source_kind} no lleva ninguna.
        registry_resolution_unavailable: Las definiciones de los modelos no pudieron
          resolver la correspondencia de arrastre del Modelo {modelo} para el ejercicio
          {filing_year}, periodo {period}.
        registry_scope_invalid: El arrastre del Modelo 303 necesita un modelo y un
          periodo; se recibió el modelo {modelo}, ejercicio {filing_year}, periodo
          {period}.
        result_casilla_required: La normalización del arrastre del Modelo 303 requiere
          la casilla de resultado registrada {casilla_id}, que la observación no lleva.
        supplied_available_contradicts_derivation: La compensación disponible aportada
          {supplied_available} contradice la derivación {basis} {derived_available}.
          Solo el contribuyente puede decidir qué importe se presentó; no hay recuperación
          automática segura.
        supplied_disposition_not_admitted: El destino del resultado indicado, {disposition},
          no está admitido para el arrastre del Modelo 303.
        supplied_pair_contradicts_derivation: El par disponible y generada aportado
          {supplied_available} y {supplied_generated} contradice la derivación {basis}
          {derived_generated}. Solo el contribuyente puede decidir qué importes se
          presentaron; no hay recuperación automática segura.
        unsupported_provenance: La normalización del arrastre del Modelo 303 solo
          admite evidencia oficial de la AEAT o una presentación local de la aplicación;
          la evidencia lleva {source_kind}.
    maritime_exemption:
      errors:
        art_7p_inputs_required: Se aplica la exención del art. 7.p), por lo que se
          requieren tanto el salario anual como los días con derecho. Aporta los importes
          que faltan.
        rebeca_input_required: Se aplica la elegibilidad REBECA, por lo que se requiere
          el rendimiento bruto de navegación. Aporta el importe que falta.
    observations:
      errors:
        casilla_ids_noncanonical: Las observaciones de cálculo deben usar los identificadores
          de casilla declarados por el modelo {modelo} revisión {revision_id}; {casilla_ids}
          no están declarados.
        decision_taxpayer_nif_blank: El NIF del contribuyente en la decisión de conciliación
          no puede estar en blanco.
        filing_year_out_of_range: El ejercicio de presentación {filing_year} de la
          observación está fuera del rango admitido {minimum} a {maximum}.
        iva_wallet_target_year_out_of_range: El ejercicio objetivo {target_year} de
          la cartera de IVA está fuera del rango admitido {minimum} a {maximum}.
        member_nif_blank: El NIF del miembro del grupo no puede estar en blanco cuando
          amplía la clave de observación.
        period_type_invalid: La clave de observación requiere un valor de periodo;
          ha recibido {observed_type}.
        registry_snapshot_missing: No se pueden validar los identificadores de casilla
          porque no se resuelve ninguna versión de las definiciones del modelo {modelo},
          ejercicio {filing_year}, periodo {period}.
        taxpayer_nif_blank: El NIF del contribuyente no puede estar en blanco cuando
          forma la clave de decisión de la cartera de IVA.
    prorrata_regularizacion:
      advisory: 'Regularización de prorrata por porcentaje definitivo (LIVA arts.
        104-105) para %{year}: prorrata provisional %{provisional}% → definitiva %{definitiva}%
        (%{sentido}). Regularización propuesta para %{target}: %{value}. Confirma
        el valor antes de presentar.'
      sentido_deduccion: deducción complementaria
      sentido_ingreso: ingreso
      target_casilla: casilla %{number}
      target_declared: la casilla de regularización declarada
    row_set:
      errors:
        grouping_dispatch_fell_through: 'La agrupación de conjunto de filas {grouping}
          se resolvió a un ensamblador que no se ejecutó. Comuníquelo: la tabla de
          despacho es inconsistente.'
        grouping_has_no_assembler: La agrupación de conjunto de filas {grouping} no
          tiene ensamblador en esta aplicación; las agrupaciones sin uno son {unassemblable_groupings}.
        percepcion_clave_missing: La fila {row_index} no declara ninguna clave. Una
          percepción debe indicar su clave de la AEAT, según el diseño de registros
          de los Modelos 190 y 193, registro de tipo 2. Aporta la clave.
        percepcion_clave_unsupported: La fila {row_index} declara la clave de la AEAT
          {clave}, que esta aplicación no admite.
        row_assembly_failed: 'No se ha podido ensamblar la fila {row_index}: {validation_error_detail}.
          Corrige la fila y vuelve a hacer el pull.'
        row_index_not_positive: El índice de fila de la celda del conjunto de filas
          debe ser un número entero positivo; contiene {row_index}.
  filing:
    build_draft:
      errors:
        binding_data_type_unsupported: El origen del valor de esta casilla declara
          un tipo de dato que ninguna entrada admite.
        binding_family_has_no_input_channel: La familia de valores del origen de esta
          casilla no tiene entrada de datos.
        binding_provenance_missing: El origen del valor de esta casilla no declara
          su fundamento legal ni sus fuentes.
        binding_row_key_not_positive_integer: La clave de fila de un valor de entrada
          debe ser un entero positivo.
        binding_text_value_invalid: El valor de texto no corresponde al tipo de dato
          declarado para la casilla.
        binding_value_not_boolean: El valor de entrada no es un sí o no reconocido.
        binding_value_not_integer: El valor de entrada debe ser un número entero.
        date_binding_not_iso: El valor de fecha no es una fecha ISO 8601.
        findings_under_fail_on_warning: La validación del borrador produjo incidencias
          y los avisos se tratan como bloqueantes.
        input_key_noncanonical_casilla: Una clave de entrada usa una referencia de
          casilla no canónica.
        input_key_not_string: Las claves de entrada deben ser identificadores de texto
          de las definiciones del modelo.
        input_key_padded: Las claves de entrada no deben llevar espacios al principio
          ni al final.
        input_key_unknown: Una clave de entrada no está declarada por esta versión
          de las definiciones del modelo.
        input_not_decimal: El valor de entrada debe ser un importe decimal.
