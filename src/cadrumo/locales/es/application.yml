          certificate --file RUTA` con la ruta a tu paquete PKCS#12 (.p12/.pfx).
        certificate_file_unresolved: La ruta del certificado '%{certificate_path}'
          no resuelve a un fichero existente. Ejecuta `cadrumo-runtime config auth
          configure --provider certificate --file RUTA` con una ruta a tu paquete
          PKCS#12 (.p12/.pfx).
        certificate_secret_mutation_in_progress: Aún se está recuperando un cambio
          del secreto de certificado para este perfil. Reintenta el mismo comando
          de secreto antes de cambiar la configuración de autenticación.
        certificate_source_not_found: El origen de certificado '%{name}' no está registrado.
