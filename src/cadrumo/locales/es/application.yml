        snapshot_axis_mismatch: 'El snapshot de borrador no coincide con el eje del
          cálculo: año del snapshot=%{snapshot_year} periodo=%{snapshot_period}; año
          del calculo=%{filing_year} periodo=%{period}.'
        snapshot_bucket_mismatch: El snapshot de borrador no pertenece al bucket activo.
        snapshot_load_failed: No se puede cargar el snapshot de borrador seleccionado;
          lista los snapshots activos con aeat app live borrador 100 list.
        snapshot_not_active: El snapshot de borrador no está activo; lista los snapshots
          activos con `aeat app live borrador 100 list`.
        unsupported_modelo: Leer los valores del borrador no está soportado para el
          modelo %{modelo}; las definiciones del modelo deben declarar la capacidad
          de borrador.
    calc_diagnostic:
      activity_asset_accrual_unavailable:
        what: No se ha podido calcular la dotación de un bien, así que no se incluye.
        what_to_do: Completa o corrige el bien en el registro y vuelve a calcular.
      activity_asset_activity_undeclared:
        what: La compra de un bien no indica tipo de actividad, así que se cuenta
          como no agraria.
        what_to_do: Indica el tipo de actividad en ese movimiento y vuelve a calcular.
      activity_asset_agrarian_excluded:
        what: Un bien de una actividad agraria queda fuera de este pago fraccionado,
          que se calcula sobre los ingresos de esa actividad.
        what_to_do: No tienes que hacer nada. Su dotación se deduce en tu declaración
          anual.
      activity_asset_claim_gap:
        what: Un bien no tiene dotación registrada para parte del año, así que esa
          parte no se deduce.
        what_to_do: Registra la dotación de ese periodo si quieres deducirla y vuelve
          a calcular.
      activity_asset_disposal_finding:
        what: La baja de un elemento tiene un punto que debes revisar, aunque no detiene
          este modelo.
        what_to_do: Revisa lo que esta nota dice sobre la baja y regístralo o corrígelo
          si te afecta.
      activity_asset_foral_territory:
        what: En este periodo resides en un territorio foral, donde la amortización
          se rige por otras normas. Queda fuera de este cálculo y no se deduce ninguna
          cifra.
        what_to_do: Determina la amortización según las normas forales de tu territorio
          y declárala ante su Hacienda foral.
      activity_asset_residence_period_unknown:
        what: Tu perfil recoge una residencia fiscal, pero ninguna para este periodo,
          así que tus elementos se cuentan como si este modelo fuera aplicable.
        what_to_do: Indica en tu perfil dónde residías en este periodo y vuelve a
          calcular.
      activity_asset_residence_unresolved:
        what: No se ha podido leer la residencia fiscal registrada, así que la amortización
          de tus bienes registrados queda fuera de este cálculo y no se deduce ninguna
          cifra.
        what_to_do: Indica tu residencia fiscal en tu perfil y vuelve a calcular.
      administrador_retencion_rate_mismatch:
        what: El tipo de retención de un registro de administrador no coincide con
          el que corresponde.
        what_to_do: Compara ese tipo con las instrucciones oficiales y corrige el
          registro si hace falta.
      advisory_binding_value:
        what: 'Una cifra de una casilla se basa en una lectura que Cadrumo aún no
          puede confirmar: puedes verla y previsualizarla, pero no comprobar, exportar
          ni registrar la declaración con ella.'
        what_to_do: Compara la cifra con tus registros y con el certificado del pagador.
          Mientras esté en espera, Cadrumo no puede comprobar, exportar ni registrar
          esta declaración; una versión posterior que confirme el periodo la liberará.
      aggregation_activity_undeclared:
        what: La casilla {box} muestra cero, aunque tienes ingresos en este periodo
          sin tipo de actividad.
        what_to_do: Indica el tipo de actividad en esos registros de ingresos y vuelve
          a calcular.
      ascendant_disability_minimum_not_computed:
        what: Un ascendiente por el que aplicas el mínimo tiene discapacidad, y su
          mínimo por discapacidad aún no se calcula, así que la declaración no puede
          comprobarse, exportarse ni presentarse.
        what_to_do: Revisa en tu perfil los datos de discapacidad de ese ascendiente.
          Mientras tenga discapacidad, esta declaración no puede completarse aquí.
      autonomic_deducciones_not_enrolled:
        what: No se calcula ninguna deducción autonómica de tu comunidad de residencia
          en este ejercicio, así que el total de deducciones autonómicas solo incluye
          los importes que escribas tú.
        what_to_do: Si te corresponde alguna, escribe tú su importe en su casilla.
      calculation_screen_outdated:
        what: Este cálculo se hizo antes de las comprobaciones actuales de Cadrumo
          sobre sus cifras, así que no se puede comprobar, exportar ni registrar tal
          como está.
        what_to_do: Vuelve a calcular la declaración y compruébala después.
      credit_cross_check_absent:
        what: Una deducción por retenciones tiene una fuente con la que contrastarla
          que no contiene nada, así que la cifra se mantiene, pero sin contrastar.
        what_to_do: Si esa fuente debería contener esta retención, añádela y vuelve
          a calcular; si no, no tienes que hacer nada.
      credit_resolution_applied:
        what: Aceptaste el importe utilizado en una discrepancia entre fuentes, así
          que ya no retiene esta declaración. La aceptación no cambia ninguna cifra.
        what_to_do: 'No hay nada que hacer. Si más adelante se corrige una fuente,
          vuelve a calcular: una aceptación solo cubre los importes con los que se
          hizo.'
      credit_resolution_stale:
        what: Aceptaste una discrepancia anterior de esta cifra, pero sus fuentes
          ahora dan otros importes, así que esa aceptación ya no se aplica.
        what_to_do: Compara de nuevo los importes. Si el importe utilizado sigue siendo
          correcto, acepta esta discrepancia con su nuevo identificador.
      credit_source_disagreement:
        what: Dos fuentes dan importes distintos para la misma deducción por retenciones,
          así que Cadrumo no puede comprobar, exportar ni registrar la declaración
          con ella.
        what_to_do: 'Compara el importe con el certificado de cada pagador, corrige
          la fuente que esté mal y vuelve a calcular. Si has comprobado que el importe
          utilizado es correcto, acéptalo con su identificador: `aeat app modelo work
          accept-disagreement <identificador> --reason <motivo>`.'
      declared_party_name_unresolved:
        what: Una parte declarada no tiene un nombre de declaración que su registro
          pueda llevar, así que su campo de nombre queda sin contenido y la exportación
          se rechaza.
        what_to_do: 'Indica el nombre de declaración de la parte: apellidos y nombre,
          o su razón social, y una versión más corta donde el campo sea más estrecho.
          Después vuelve a calcular.'
      deferred_binding_source:
        what: Cadrumo todavía no rellena automáticamente una cifra de esta declaración.
        what_to_do: No tienes que hacer nada, salvo que esa cifra te afecte. Si te
          afecta, escríbela tú.
      devengo_date_proxy_attribution:
        what: Algunas facturas no tienen la fecha en que se hizo la operación, así
          que se ha usado la de emisión para elegir el periodo.
        what_to_do: Añade la fecha de la operación a las facturas de final de periodo
          y vuelve a calcular.
      dt12_parcial_rescate_guidance:
        what: Los cobros parciales del mismo plan de pensiones comparten un único
          plazo para la reducción de la casilla {box}, que se cuenta una sola vez.
        what_to_do: Comprueba que cada cobro cae dentro de ese plazo.
      dt12_regime_window_closed:
        what: La reducción del 40 % de la casilla {box} no se ha aplicado, porque
          el plazo para este cobro de una vez ya ha pasado.
        what_to_do: No tienes que hacer nada. Si el año del hecho no es correcto,
          corrígelo en tu perfil y vuelve a calcular.
      dt12_regime_window_unverified:
        what: La reducción del 40 % por una pensión cobrada de una vez se ha aplicado
          en la casilla {box}, pero no se ha comprobado su plazo.
        what_to_do: Indica a Cadrumo el año del hecho que originó la pensión y vuelve
          a calcular.
      duplicate_binding_owner:
        what: Cadrumo ha encontrado un fallo en cómo está montada esta declaración,
          no en tus datos.
        what_to_do: No tienes que cambiar nada en tus registros. Avísanos antes de
          fiarte de las cifras.
      duplicate_bound_casilla_owner:
        what: Cadrumo ha encontrado un fallo en cómo está montada esta declaración,
          no en tus datos.
        what_to_do: No tienes que cambiar nada en tus registros. Avísanos antes de
          fiarte de las cifras.
      duplicate_relation_owner:
        what: Cadrumo ha encontrado un fallo en cómo está montada esta declaración,
          no en tus datos.
        what_to_do: No tienes que cambiar nada en tus registros. Avísanos antes de
          fiarte de las cifras.
      filed_before_grade_cap:
        what: Registraste esta declaración antes de las comprobaciones actuales de
          sus cifras, y una de sus casillas tiene una cifra que esas comprobaciones
          retienen, así que no puedes exportarla tal como está.
        what_to_do: Vuelve a calcular la declaración, compruébala y regístrala otra
          vez; el nuevo registro sustituye a este.
      household_row_fact_unstated:
        what: Hay una persona de tu hogar registrada sin un dato que la declaración
          exige, así que no puede comprobarse, exportarse ni presentarse hasta que
          lo indiques.
        what_to_do: Indica en tu perfil el dato que falta de esa persona y vuelve
          a calcular.
      household_rows_incomplete:
        what: Tu perfil indica más personas en este grupo de las que registra, así
          que la declaración usa solo las personas registradas y no da el grupo por
          completo.
        what_to_do: Añade a tu perfil las personas que faltan o corrige el número,
          y vuelve a calcular.
      inferred_retencion_excluded_from_credit:
        what: Parte de la retención de tus facturas emitidas se ha calculado a partir
          de lo que pagó el cliente, así que se ha dejado fuera de tu deducción y
          podrías pagar más de lo necesario.
        what_to_do: Registra la retención que te aplicó tu cliente en cada factura
          emitida, o consigue su certificado, y vuelve a calcular.
      inferred_retencion_rate_unmatched:
        what: Cadrumo ha estimado una retención a partir de lo que faltaba en un cobro,
          y no coincide con ningún tipo oficial.
        what_to_do: Si la diferencia fue una comisión del banco o un descuento, corrige
          el registro para no reclamar retención.
      inferred_retencion_sectoral_rate_unconfirmed:
        what: Cadrumo ha estimado una retención del 1 % o del 2 % a partir de lo que
          faltaba en un cobro, y podría ser una comisión o un descuento.
        what_to_do: Revisa la retención con la factura o el certificado de tu cliente
          en tus registros, corrige el registro si es distinta y vuelve a calcular.
      inventory_book_claimed_purchase:
        what: Una compra de existencias se deja fuera de tus gastos, porque tu inventario
          la declara como compra de existencias.
        what_to_do: No tienes que hacer nada.
      invoice_category_counterparty_mismatch:
        what: El tratamiento de IVA de una factura no encaja con el país del cliente,
          así que se ha dejado fuera.
        what_to_do: Revisa la categoría de IVA o el país de esa factura en tus registros.
      invoice_recargo_departs_from_published_rate:
        what: El recargo de equivalencia anotado en una factura no coincide con el
          tipo oficial.
        what_to_do: Revisa el recargo de esa factura en tus registros.
      invoice_recargo_not_attributable_to_a_tier:
        what: Esta declaración se calculó sin el recargo de una factura que cubre
          varios tipos de IVA.
        what_to_do: 'Vuelve a calcular: el recargo se declarará en cada tipo, o se
          te indicará la factura que hay que corregir.'
      invoice_reverse_charge_cuota_not_derivable:
        what: Una factura recibida con inversión del sujeto pasivo no tiene tipo de
          IVA, así que no se ha calculado el IVA que debes por ella.
        what_to_do: Indica el tipo de IVA de esa factura en tus registros y vuelve
          a calcular.
      iva_compensation_annual_source_evidence_failure:
        what: El IVA anual a compensar o arrastrar se apoya en registros que no tienen
          justificante.
        what_to_do: Revisa los registros de IVA de todo el año, añade el justificante
          que falte y vuelve a calcular.
      iva_operation_date_after_movement:
        what: Algunas filas del libro tienen una fecha de la operación posterior a
          la bancaria. Si ese dinero era un anticipo, su IVA se devengó al cobrarlo.
        what_to_do: En un anticipo, pon como fecha de la operación la del cobro, registra
          el resto en su propia fila y vuelve a calcular.
      iva_row_placed_on_movement_date:
        what: Algunas filas del libro no tienen la fecha de la operación, así que
          su fecha bancaria ha elegido el periodo del IVA. El IVA se devenga cuando
          se realiza la operación, no cuando se mueve el dinero.
        what_to_do: Añade la fecha de la operación a las filas de final de periodo
          y vuelve a calcular.
      iva_selected_scope_evidence_failure:
        what: Los registros que sustentan el IVA de esta declaración no tienen justificante
          o no cuadran.
        what_to_do: Abre tus registros de este periodo, corrige los que estén marcados
          y vuelve a calcular.
      ledger_amortization_row_unregistered:
        what: Un movimiento registra una compra amortizable que no está en tu registro
          de bienes, así que no deduce nada.
        what_to_do: Da de alta el elemento indicando ese movimiento como su adquisición,
          o cambia la clasificación del movimiento, y vuelve a calcular.
      ledger_expense_may_be_durable:
        what: Un movimiento deducido como gasto corriente puede ser un bien que dura
          más de un año. ¿Lo es?
        what_to_do: Si lo es, da de alta el bien, porque se deduce mediante dotaciones,
          y vuelve a calcular. Si es un consumible, deja el movimiento como está.
      m193_settled_row_amounts_unresolved_authority:
        what: Algunos importes de un registro de un pago hecho en un año posterior
          no tienen una fuente oficial que los confirme.
        what_to_do: Comprueba esos importes con las instrucciones oficiales antes
          de presentar.
      m347_declarado_provincia_unrecorded:
        what: 'Falta {box} de este declarado: corresponde a su domicilio fiscal y
          tus facturas no lo indican.'
        what_to_do: Abre su factura e indica la provincia de su domicilio fiscal;
          vale para todas sus facturas al volver a calcular.
      m347_metalico_unrecorded:
        what: Tus facturas no indican cómo se cobraron, así que {box} queda sin importe
          en todos los registros.
        what_to_do: Si algún declarado te pagó en metálico por encima del importe
          que obliga a declararlo, consigna ese importe en su registro antes de presentar
          la declaración.
      m349_clave_inferred_from_category:
        what: Cadrumo ha elegido el tipo de operación de una línea del listado de
          operaciones con la UE según la categoría de IVA de la factura, y podría
          ser otro.
        what_to_do: Revisa el tipo de operación de esas facturas en tus registros
          y cámbialo si es distinto.
      m349_operation_unclassified:
        what: Una factura con una contraparte de otro país de la UE y sin IVA no indica
          qué operación intracomunitaria recoge, así que el listado de operaciones
          con la UE la deja fuera.
        what_to_do: Abre la factura e indica su tipo de operación; después vuelve
          a calcular.
      missing_transaction_evidence:
        what: Un apunte con IVA no tiene factura ni documento adjunto.
        what_to_do: Adjunta la factura o el justificante a ese apunte en tus registros.
      official_box_unpopulated:
        what: El total de la casilla {box} está calculado, pero las casillas oficiales
          que lo forman están todas vacías.
        what_to_do: Copia los importes a mano en las casillas oficiales y vuelve a
          comprobar la declaración.
      operator_override_diverges_from_computed:
        what: El valor de la casilla {box} es el que escribiste tú, no el que ha calculado
          Cadrumo.
        what_to_do: Mantenlo solo si estás seguro. Para usar el valor calculado, vuelve
          a calcular sin escribir un valor ahí.
      orphaned_override:
        what: Un valor que escribiste antes ya no corresponde a ninguna casilla de
          esta declaración, así que no se ha usado.
        what_to_do: Mira si todavía lo necesitas y, si es así, vuelve a escribirlo
          en la casilla correcta.
      oss_no_live_source:
        what: No se ha encontrado ninguna factura de ventanilla única (OSS) en este
          periodo, así que Cadrumo no ha calculado ese impuesto.
        what_to_do: No tienes que hacer nada si no hiciste ese tipo de ventas. Si
          las hiciste, escribe tú los importes.
      precedence_tier_divergence:
        what: Dos fuentes tienen valores distintos para una cifra que llega a la casilla
          {box}, y Cadrumo ha usado la que tiene prioridad.
        what_to_do: 'Compara las fuentes y corrige la que esté mal; después vuelve
          a calcular. La comprobación, la exportación y el registro esperan hasta
          que coincidan, o hasta que aceptes el valor utilizado con su identificador:
          `aeat app modelo work accept-disagreement <identificador> --reason <motivo>`.'
      precedence_tier_divergence_advisory:
        what: Dos fuentes tienen valores distintos para una cifra de trabajo, y Cadrumo
          ha usado la que tiene prioridad.
        what_to_do: Compara las fuentes y corrige la que esté mal. Ninguna casilla
          exportada depende de esta cifra.
      prior_payment_minoracion_not_captured:
        what: La minoración que viene de pagos anteriores no está anotada en la casilla
          {box}.
        what_to_do: Escribe esa minoración en la casilla {box} si te corresponde.
      prior_payment_not_deducted:
        what: Registraste un trimestre anterior como presentado, pero la casilla {box}
          no descuenta lo que pagaste entonces.
        what_to_do: Escribe en la casilla {box} lo que pagaste en los trimestres anteriores.
      prorrata_especial_check_unavailable:
        what: Cadrumo no ha podido comprobar si la prorrata especial de IVA es obligatoria
          para ti.
        what_to_do: Compruébalo tú con las reglas oficiales o con tu asesor.
      prorrata_especial_obligatoria:
        what: La prorrata especial de IVA puede ser obligatoria para ti, por tu mezcla
          de actividad exenta y sujeta.
        what_to_do: Consulta las reglas de la prorrata del IVA o a tu asesor, y aplica
          la prorrata especial si es obligatoria.
      prorrata_volume_check_unavailable:
        what: La comparación anual con el libro está incompleta.
        what_to_do: Clasifica las operaciones de salida y revisa las exclusiones de
          prorrata.
      prorrata_volume_declaration_missing:
        what: El libro contiene operaciones de salida para comparar con los volúmenes
          anuales de prorrata.
        what_to_do: Declara los volúmenes anuales; el libro no los sustituye.
      prorrata_volume_divergence:
        what: Los volúmenes anuales de prorrata declarados difieren del libro clasificado.
        what_to_do: Revisa los volúmenes y las exclusiones. Las cifras declaradas
          siguen siendo la autoridad.
      rate_boxes_underaccount_total:
        what: Una parte del total de IVA de la casilla {box} no está en ninguna casilla
          por tipo.
        what_to_do: Revisa el tipo de IVA de tus facturas y registros y vuelve a calcular.
          No se podrá exportar la declaración hasta corregirlo.
      register_acquisition_exceeds_ledger:
        what: Los movimientos de un bien de tu registro pagaron menos que el coste
          que indicas.
        what_to_do: Corrige el precio en tu registro de bienes o el movimiento y vuelve
          a calcular.
      register_acquisition_partly_accounted:
        what: Un bien de tu registro explica solo una parte de su movimiento, así
          que el resto no deduce nada.
        what_to_do: Da de alta lo demás que pagó ese movimiento, o corrige el precio
          del bien, y vuelve a calcular.
      register_acquisition_row_missing:
        what: Un bien de tu registro indica un movimiento que ya no está en tus movimientos.
        what_to_do: Vuelve a introducir ese movimiento, o corrige el bien en tu registro,
          y vuelve a calcular.
      register_owned_capital_acquisition:
        what: Una compra de equipamiento se deja fuera de tus gastos, porque se deduce
          mediante su dotación anual.
        what_to_do: No tienes que hacer nada.
      reopen_hint: Vuelve a calcular para ver las notas del cálculo.
      settlement_not_computed:
        what: La casilla {box} recoge la liquidación final y Cadrumo no la calcula.
        what_to_do: Escribe el importe en la casilla {box} y compáralo con las instrucciones
          oficiales.
      source_domain_not_ready:
        what: Los registros de los que depende esta cifra todavía no están listos
          para leerse.
        what_to_do: Termina de preparar o importar esos registros y vuelve a calcular.
      source_issue:
        what: Falta información de la que depende esta cifra, o no se ha podido usar.
        what_to_do: Revisa tus registros y tu perfil por si falta algo y vuelve a
          calcular.
      stale: Resultado del último cálculo. Vuelve a calcular para actualizarlo.
      storage_degraded:
        what: Cadrumo no ha podido leer una parte de tus registros guardados, así
          que algunas cifras pueden estar incompletas.
        what_to_do: Vuelve a calcular. Si sigue pasando, comprueba que tus datos están
          accesibles y avísanos.
      structurally_unroutable_base_category:
        what: Esta declaración no tiene casilla para los importes de una categoría
          de tus registros.
        what_to_do: Consulta en las instrucciones oficiales dónde se declaran esos
          importes; a menudo van en otro sitio.
      terminal_origin_mismatch:
        what: Una cifra ha llegado a la declaración por un camino del que Cadrumo
          no puede responder, así que no es fiable tal como está.
        what_to_do: Mira de dónde sale esa cifra en tus registros y vuelve a calcular.
          Avísanos si sigue igual.
      unclassified_declarant_role_fact:
        what: Una factura no dice si es ajena a tu actividad o si es una subvención,
          y eso decide cómo se declara.
        what_to_do: Responde a esa pregunta en la factura, en tus registros, y vuelve
          a calcular.
      unconverted_foreign_currency:
        what: Una factura en moneda extranjera no tiene tipo de cambio a euros, así
          que queda fuera del listado.
        what_to_do: Añade el tipo de cambio a esa factura en tus registros y vuelve
          a calcular.
      ungrounded_income_substrate:
        what: Algunos registros de ingresos no tienen factura con base imponible,
          así que se ha usado el importe del banco y se deja fuera su retención.
        what_to_do: Vincula una factura emitida a cada registro de ingresos, o indica
          su base imponible, y vuelve a calcular.
      unhandled_binding_source:
        what: Cadrumo todavía no sabe rellenar una cifra de esta declaración a partir
          de tus datos.
        what_to_do: No presentes esa cifra tal como está. Escríbela tú si la conoces
          y avísanos del hueco.
      unresolved_binding:
        what: Cadrumo no ha podido sacar una cifra de tus datos y habría mostrado
          un cero sin avisar.
        what_to_do: Añade los registros o los datos de perfil que falten, o escribe
          tú el valor, y vuelve a calcular.
      unresolved_derived_binding:
        what: No se ha podido calcular una cifra que Cadrumo saca a partir de otras.
        what_to_do: Comprueba que las cifras de las que depende están rellenas y vuelve
          a calcular.
      unresolved_retencion_substrate:
        what: En algunas facturas emitidas Cadrumo no puede saber cuánto se retuvo,
          así que a tu deducción por retenciones le puede faltar un importe desconocido
          y podrías pagar más de lo necesario.
        what_to_do: Indica en tus registros la base y la retención de cada una de
          esas facturas y vuelve a calcular.
      unrouted_declarable_quantity:
        what: Una parte de un registro, como una retención o una base imponible, no
          llega a ninguna casilla de esta declaración.
        what_to_do: Revisa la clasificación y los importes de ese registro y vuelve
          a calcular.
      unrouted_observation:
        what: Un importe de tus registros no se ha colocado en ninguna casilla de
          esta declaración.
        what_to_do: Revisa cómo está clasificado ese registro y vuelve a calcular.
      unsettled_legal_reading:
        what: Una cifra declarada sigue una lectura de una norma que no está resuelta
          para este ejercicio, y la AEAT podría leerla de otra forma.
        what_to_do: Revisa esas operaciones con los criterios actuales de la AEAT
          antes de presentar.
      unusable_sales_invoice_evidence:
        what: Un registro de ingresos está vinculado a una factura emitida que no
          es fiable, así que se declara el importe del banco y se pierde su retención.
        what_to_do: Arregla el vínculo con la factura en tus registros, o indica la
          base imponible directamente, y vuelve a calcular.
      withholding_detail_absent:
        what: No hay detalle de retenciones por perceptor en el año, así que se muestra
          un cero sin respaldo.
        what_to_do: Añade en tus registros el detalle del año y vuelve a calcular.
