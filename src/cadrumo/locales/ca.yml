        la casella %{reduccion_id} (reducció per previsió social) = %{reduccion_value}
        supera el límit individual de l''article 52 de %{sublimit} EUR, però no s''ha
        declarat cap aportació del treballador a un pla d''ocupació ni contribució
        empresarial. Confirmeu que la reducció està recolzada per una contribució
        vinculada a l''ocupador que doni dret a l''increment de 8500 EUR; en cas contrari,
        el límit aplicable és %{sublimit}.'
      attribution_received_uncaptured: 'la casella %{casilla_id} del règim d''atribució
        del M100 declara una base atribuïda (modelo=100 year=%{filing_year} value=%{casilla_value}
        EUR) però cap fet attribution_received no la fonamenta per a aquest exercici:
        la renda declarada no té procedència registrada.'
      attribution_received_uncaptured_next_action: Registreu els fets attribution_received
        (NIF de l'entitat, nom, percentatge de participació, base atribuïda, exercici)
        al perfil del contribuent perquè la renda declarada del règim d'atribució
        tingui la procedència del seu Model 184.
      attribution_received_unfolded: 'els fets attribution_received declaren una base
        atribuïda per a aquest exercici (modelo=100 year=%{filing_year} total=%{total_base}
        EUR) però la casella %{casilla_id} del règim d''atribució del M100 queda buida:
        la participació rebuda es va registrar al perfil però no es va incorporar
        a la declaració.'
      attribution_received_unfolded_next_action: Incorporeu la base atribuïda a la
        casella %{casilla_id} en el càlcul del M100, per exemple mitjançant `aeat
        app modelo work calculate ... --binding %{casilla_id}=%{total_base}`, perquè
        la renda del règim d'atribució quedi declarada.
      cross_casilla_invariant_next_action: Assegura't que totes les caselles requerides
        pel predicat %{predicate_id} són diferents de zero abans de verificar.
      cross_casilla_invariant_violated: 'invariant entre caselles %{predicate_id}
        incomplert: %{expression}'
      cross_period_dependency_unclean: 'la dependència entre períodes no està neta:
        model=%{modelo} exercici=%{year} període=%{period} origen=%{origin} ids_origen=%{origin_ids}
        bloquejos=%{blockers}'
      cross_period_dependency_unclean_evidence_next_action: Captureu o importeu evidència
        de l’AEAT per a la dependència d’origen. Executeu `%{target_capture}`, `%{source_justificante_capture}`,
        `%{import_official_record}` o `%{reconcile_file}`; torneu a executar la verificació.
      cross_period_modelo_not_applicable:
        message: 'Les dependències entre períodes de models origen que el contribuent
          no presenta s han exclos com a no aplicables: {modelos}. Per a retencions
          suportades, introdueix l import del certificat d ingressos amb --binding
          CLAU=VALOR, no amb --casilla. CLAU=VALOR vol dir que l id del binding va
          a l esquerra d un únic signe igual i el valor a la dreta. Per a pagaments
          fraccionats mútuament excloents, confirma el règim d estimació d activitat
          al perfil.'
        next_action: 'Usa `aeat app modelo bindings list --missing` per identificar
          el binding de retencions. Aporta l import del certificat amb --binding CLAU=VALOR
          quan correspongui: posa l id del binding a l esquerra d un únic signe igual
          i l import a la dreta. Confirma el règim d estimació d IRPF del perfil si
          s ha exclos un model de pagament fraccionat mútuament excloent.'
      cross_period_non_official_local_chain:
        message: 'l''arrossegament entre períodes va usar un període anterior presentat
          localment al mateix exercici sense evidència externa de l''AEAT: model=%{source_modelo}
          exercici=%{filing_year} període=%{period} origen=%{origin}. La cadena dins
          del mateix exercici s''admet per a l''exportació local, però el valor arrossegat
          està evidenciat localment (app_filing), no per l''AEAT; presenteu cada període
          a l''AEAT de manera externa.'
        next_action: Exporteu i presenteu cada període a l'AEAT de manera externa,
          després actualitzeu la cadena local amb evidència oficial; useu `aeat app
          live justificante pull` quan hi hagi accés en viu, o `aeat app modelo filing-record
          import WORK_UNIT_ID --evidence-kind aeat_justificante_pdf --evidence-id
          CSV --set CASILLA=VALUE` / `aeat app modelo reconcile file WORK_UNIT_ID
          --file PATH` per a evidència que ja tingueu.
      cross_period_operator_declared_suppression: 'dependència entre períodes exclosa
        perquè no hi ha obligació prèvia (abans de l’inici de l’activitat): model=%{modelo}
        exercici=%{year} període=%{period} origen=%{origin}. El període és estrictament
        anterior a la data d’inici de l’activitat declarada per l’operador, %{activity_start_date},
        que encara no s’ha contrastat amb una instantània del cens de l’AEAT.'
      cross_period_operator_declared_suppression_next_action: Confirmeu que la data
        d’inici de l’activitat registrada és correcta. Quan estigui disponible la
        lectura en viu del cens de l’AEAT, la data es contrastarà i aquest avís s’eliminarà.
      dt12a_reduccion_antiquity_next_action: Confirmeu que han transcorregut més de
        dos anys des de la primera aportació al pla de pensions, llevat que la prestació
        sigui per invalidesa (ley-35-2006:dt-12).
      dt12a_reduccion_antiquity_possible: 'DT_12A_REDUCCION_ANTIQUITY_POSSIBLE: la
        casella %{reduccion_id} (reducció treball) = %{reduccion_value} reflecteix
        una reducció aplicada. Si inclou un rescat en capital d''un pla de pensions
        DT 12a LIRPF, confirmeu que han transcorregut més de dos anys des de la primera
        aportació; el requisit d''antiguitat de dos anys només es dispensa en les
        prestacions per invalidesa.'
      dt12a_reduccion_next_action: Proporcioneu --rescate-plan-pensiones-capital IMPORT
        --rescate-plan-pensiones-aportaciones-pre-2007 IMPORT --rescate-plan-pensiones-aportaciones-totales
        IMPORT per injectar automàticament la reducció DT 12a a la casella corresponent
        (ley-35-2006:dt-12).
      dt12a_reduccion_possible: 'DT_12A_REDUCCION_POSSIBLE: casilla %{ingreso_id}
        = %{ingreso_value} but casilla %{reduccion_id} (reduccion trabajo) is zero.'
      iva_wallet_next_action: Revisa la decisió de conciliació de la cartera de compensació
        d'IVA abans de verificar o exportar aquest Model 303.
      m210_baseline_tipo_deferred:
        next_action: 'El tipus de gravamen b tipo_renta={tipo_renta} està ajornat
          a una Fase futura sota la task #229 (corpus BOE pendent). Establiu profile.country_of_fiscal_residence
          per reclamar la tarifa Convenio aplicable, o espereu que el corpus baseline
          incorpori aquesta fila.'
      m210_convenio_lob_advisory: 'M210_CONVENIO_LOB_ADVISORY: s''ha aplicat el tipus
        de Convenio Espanya-%{cc} (%{document_id}) per a tipo_renta=%{tipo_renta}.
        El benefici del conveni només està disponible per al beneficiari efectiu resident
        en aquest Estat que compleixi les condicions de limitació de beneficis del
        conveni; confirmi l''elegibilitat abans d''aplicar aquest tipus.'
      m210_convenio_lob_advisory_next_action: Confirmi que el contribuent compleix
        les condicions de beneficiari efectiu i de limitació de beneficis del Convenio
        Espanya-%{cc} (%{document_id}) abans d'aplicar el tipus del conveni; revisi
        l'article específic del conveni, no només el marc general del Model de Conveni
        de l'OCDE.
      m210_convenio_rate_missing:
        next_action: Autoritzeu una fila de Convenio España-{cc} per a tipo_renta={tipo_renta}
          a registry/aeat/treaties/, o desestableixi profile.country_of_fiscal_residence
          per usar el baseline TRLIRNR Art 25.
      madrid_nacimiento_adopcion_eligibility_advisory: 'MADRID_NACIMIENTO_ADOPCION_ELIGIBILITY_ADVISORY:
        la casella %{casilla_id} és zero però el contribuent té un descendent elegible
        (recompte %{weighted_count}) per a la deducció de Madrid. El disparador automàtic
        queda tancat per a unitats conjunta/casats perquè no es pot avaluar el límit
        de renda familiar; confirmeu l''elegibilitat manualment.'
      madrid_nacimiento_adopcion_eligibility_advisory_next_action: Confirmeu que la
        base imposable de la unitat familiar està dins del límit aplicable i, si escau,
        introduiu la casella 1039 manualment (madrid-dl-1-2010:art-4, art-18).
      missing_required_casilla: La casella obligatòria %{casilla_id} no és present
        a les dades d'entrada del càlcul.
      modelo_100_2024_cuota_resultante_determinada_cuando_base_liquidable_general_positiva: La
        base liquidable general (C500) és positiva però la quota resultant de l'autoliquidació
        (C595) és zero; confirmeu que és un zero legítim (base igual o inferior al
        mínim personal i familiar, o compensada per deduccions) i no una llacuna no
        modelada.
      modelo_100_2025_cuota_resultante_determinada_cuando_base_liquidable_general_positiva: La
        base liquidable general (C500) és positiva però la quota resultant de l'autoliquidació
        (C595) és zero; confirmeu que és un zero legítim (base igual o inferior al
        mínim personal i familiar, o compensada per deduccions) i no una llacuna no
        modelada.
      modelo_123_2024_base_total_implica_retenciones_total: La base total és positiva
        però les retencions totals són zero; reviseu la determinació de la retenció.
