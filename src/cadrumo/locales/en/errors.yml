    auth_google_client_not_registered: No Google Desktop OAuth client is registered
      for the active profile. Register a client to use Google features.
    auth_google_client_revoked: The registered Google Desktop OAuth client has been
      revoked. Register a new client.
    auth_google_expired: The Google refresh token has expired under the 7-day Testing-project
      cap. Re-authorize Google access.
    auth_google_revoked: The Google refresh token has been revoked. Re-authorize Google
      access.
    auth_google_scope_insufficient: The granted Google scopes do not include every
      scope this operation requires. Re-authorize, granting all requested scopes.
    auth_outbound_storage_permission: The active credentials lack the permission required
      for this storage operation.
    auth_session_corrupt: The persisted session metadata cannot be parsed. Authenticate
      again to create a fresh session.
    auth_session_deserialization: Stored authentication session data could not be
      deserialised. Re-authenticate to create a new session.
    auth_session_unavailable: No verified active AEAT session is available. Authenticate
      before continuing.
    auth_storage_bucket_recovery_verification: The recovery code entered is not valid.
      Re-type the 24 words exactly as they appear in the backup.
    auth_storage_keyring_unavailable: The operating-system keychain is unavailable.
      Either no credential store is registered, or this logon session cannot hold
      credentials, which is common on a network or service logon. Sign in interactively,
      or check that a credential store is installed and active.
    auth_storage_master_key_material_missing: No master-key material exists. The secure
      store has not been provisioned yet.
    auth_storage_master_key_unavailable: This profile session was resumed and carries
      only its data key; the key-encryption material is login-scoped. Run `aeat config
      login` to re-authenticate.
