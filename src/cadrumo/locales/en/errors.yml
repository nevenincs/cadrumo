      certificate subject. Check that the certificate belongs to an individual.
    auth_auth_certificate_password: The certificate password is missing or wrong.
      Set the environment variable to the correct password.
    auth_auth_certificate_pre_expiry: The digital certificate is about to expire.
      Renew it before it expires to avoid interruptions.
    auth_auth_clave_movil_clave_movil_approval_timeout: Cl@ve authentication did not
      complete in time. Approve the request on your device and try again.
    auth_auth_clave_movil_clave_movil_configuration: Required Cl@ve Móvil settings
      are missing or malformed. Review the Cl@ve configuration.
    auth_auth_configuration: Required authentication settings are missing or malformed.
      Review the authentication configuration.
    auth_auth_provider_cleanup: The authentication provider could not release all
      browser resources. Retry cleanup before starting another session.
    auth_auth_validation: The authentication parameters failed validation. Correct
      the values shown and try again.
    auth_former_product_session_state: Cadrumo detected retired-product AEAT session
      state and refuses to read, move, re-key, delete, or adopt it.
