  cli:
    automation:
      exit_auth: Authentication required or credentials expired.
      exit_codes_heading: Exit codes
      exit_conflict: Conflict or precondition failure.
      exit_forbidden: Operation not permitted by policy.
      exit_general: General error or refused operation.
      exit_internal: Unexpected internal error.
      exit_not_found: Resource not found.
      exit_partial: Partial success (some items succeeded, some failed).
      exit_success: Success.
      exit_unavailable: External service unavailable.
      exit_usage: Invalid CLI usage (bad flag, missing argument).
      exit_validation: Validation error in user-supplied data.
      intro: 'Use this page when scripting ``aeat`` invocations: it documents the
        process exit codes and the TTY/JSON output behavior shared by every command.'
      output_contract_body: When output is to a TTY the CLI emits human-readable rich
        text. When ``--format json`` is passed (or when output is redirected) the
        CLI emits a single JSON document per invocation. Commands that have adopted
        the ``SchemaEnvelope`` wrap their result as ``{envelope}``. Commands not yet
        migrated emit their payload directly.
      output_contract_heading: TTY and JSON output contract
      table_code_header: Code
      table_meaning_header: Meaning
      title: Exit codes and output contract
    command:
      no_description: No description.
      parameters_heading: Parameters
    env:
      default_empty: empty
      default_unset: unset
      secrets_note: Secrets are never printed by the application and are marked `(secret)`
        above. Defaults marked `(derived)` are computed from the storage root or project
        location at runtime.
    family:
      choose_group_heading: Choose a command group
      direct_commands_heading: Direct commands
      direct_commands_intro: These commands are mounted directly on ``aeat {family}``,
        with no intervening verb group.
      group_link_line: Open :doc:`{target}` for ``aeat {family} {group}``.
      index_link_line: Open :doc:`/cli/index` for the full CLI reference landing page.
      intro: '``aeat {family}`` is organised by major verb group. Each group''s own
        page leads with that group''s real ``--help`` output, followed by every leaf
        command it carries.'
      title: '{command}: command reference'
    index:
      app_card: 'Operational workflow commands: ledger work, modelos, filing calendars,
        registry checks, live captures, and review queues.'
      choose_family_heading: Choose a command family
      config_card: 'Local setup and maintenance commands: profiles, authentication,
        Google integration, repair checks, and reset surfaces.'
      english_help_note: Help strings are rendered in English. At runtime the CLI
        respects the active output-language setting (``--language`` / ``CADRUMO_OUTPUT_LANGUAGE``).
      flag_debug: Enable debug-level logging.
      flag_detail: Print extended version information including registry summary.
      flag_format: Output format (``text`` or ``json``).
      flag_help: Print the curated help document and exit.
      flag_language: Override the output language (``es``, ``en``, ``ca``, ``hu``).
      flag_profile: Activate a named profile for this invocation.
      flag_quiet: Suppress informational output.
      flag_verbose: Enable verbose output.
      flag_version: Print the package version and exit.
      global_flags_heading: Global flags
      global_flags_intro: These flags are accepted by the ``aeat`` root command and
        apply to every invocation.
      intro: 'The ``aeat`` CLI exposes two top-level command families: ``config``
        (local configuration, profile lifecycle, diagnostics) and ``app`` (operational
        tax workflow). This reference documents all {count} leaf commands.'
      next_app: Open :doc:`app` for the operational workflow commands.
      next_automation: Open :doc:`automation` for exit codes and the TTY/JSON output
        contract.
      next_config: Open :doc:`config` for the local setup and maintenance commands.
      next_howto: Open :doc:`/how-to/index` for the getting-started run-throughs and
        task guides.
      next_schemas: Open :doc:`schemas` for the JSON output-schema registry.
      open_family_link: Open the ``aeat {family}`` reference
      start_here: Start with the family links below. Use the generated command-family
        pages for exact flags, arguments, registry keys, and output schemas; use this
        page for root-level behavior that applies across commands.
      title: CLI reference
      where_next_heading: Where to go next
    param:
