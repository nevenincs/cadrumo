modelo:
  schema:
    '130':
      binding:
        modelo-130-resultados-negativos-anteriores:
          help: The amount, without sign, of the negative results of your earlier
            Form 130 returns for this year that you have not deducted before.
          label: Negative results of this year's earlier quarters not yet deducted
            · box 15
        x-d5p70phee1p6atj9dtqn6nrpclgn4nr5cdnmsrrdd5hluob3ehkncqbkf5fmspbkbtkmsorfdlig:
          help: Box 13 reduces the payment only when this income was 12,000 euros
            or less. Give the sum of these boxes of your return for the previous year.
          label: Net income from economic activities in last year's income tax return
            · Form 100, boxes 0224, 1479, 1553 and 1577
      construct:
        modelo-130-direct-estimation-instalment:
          field:
            title: 'Modelo 130: instalment payment under direct estimation'
      field:
        official_name: Personal Income Tax. Business activities under direct assessment.
          Instalment payment.
        title: IRPF instalment payment, direct assessment
      form:
        context:
          apellidos: Surname
          declaracion-complementaria: Supplementary self-assessment
          ejercicio: Tax year
          iban: IBAN
          justificante-anterior: Previous self-assessment receipt number
          nif: Tax identification number (NIF)
          nombre: Given name
          periodo: Period
        page:
          dr-13001:
            heading: Page 1 · Instalment payment
        section:
          complementaria:
            heading: Supplementary return (7)
          devengo:
            heading: Tax period (2)
          identificacion:
            heading: Declarant (1)
          ingreso:
            heading: Payment (4)
          liquidacion-3-i-actividades-econ-estim-directa:
            heading: I. Business activities under direct assessment
          liquidacion-3-ii-actividades-agricolas-ga-829910:
            heading: II. Farming, livestock, forestry and fishing activities
          liquidacion-3-iii-total-liquidacion:
            heading: III. Return total
      revision:
        2019-y-siguientes:
          casilla:
            '01':
              help: Total cumulative business income for the tax year.
              label: Income
            '02':
              help: Total cumulative business expenses for the tax year.
              label: Expenses
            '03':
              help: Net yield from direct-estimation economic activities, calculated
                as income minus expenses.
              label: Net yield
            '04':
              help: Fractional payment amount for direct-estimation activities before
                prior payments and withholdings.
              label: Fractional payment amount
            '05':
              help: Fractional payments already made earlier in the same tax year
                for direct-estimation activities.
              label: Prior fractional payments
            '06':
              help: Withholdings and payments on account borne during the period for
                direct-estimation activities.
              label: Withholdings and payments on account
            '07':
              help: Partial Section I result after subtracting prior payments and
                withholdings from the direct-estimation fractional payment.
              label: Partial result of Section I
            08:
              help: Income volume for the quarter from agricultural, livestock, forestry,
                or fishing activities.
              label: Quarterly income volume
            09:
              help: Fractional payment amount for agricultural, livestock, forestry,
                or fishing activities.
              label: Fractional payment amount
            '10':
              help: Withholdings and payments on account borne during the period for
                agricultural, livestock, forestry, or fishing activities.
              label: Withholdings and payments on account
            '11':
              help: Partial Section II result after subtracting withholdings from
                the agricultural, livestock, forestry, or fishing fractional payment.
              label: Partial result of Section II
            '12':
              help: Sum of the partial results from Sections I and II.
              label: Sum of partial results
            '13':
              help: Reduction applied when net yields fall within the regulatory threshold
                for Modelo 130.
              label: Reduction for net yields
            '14':
              help: Amount remaining after applying the net-yield reduction.
              label: Net amount after reduction
            '15':
              help: Deduction for negative results from previous quarters of the same
                tax year.
              label: Negative results from previous quarters
            '16':
              help: Deduction for investment in the taxpayer's main residence when
                the transitional regime applies.
              label: Deduction for investment in main residence
            '17':
              help: Difference after applying prior-quarter negative results and any
                main-residence deduction.
              label: Difference
            '18':
              help: Amount payable already reported in previous self-assessments for
                the same period and year.
              label: Amount payable from previous self-assessments
            '19':
              help: Final Modelo 130 amount payable after all deductions and prior
                self-assessments.
              label: Final result
            rendimiento-neto-reducible-art-32-1:
              help: The part of the cumulative net income generated over more than
                two years or notoriously irregular, imputed in a single period. Leave
                it out if your activity regularly obtains such income. Box 03 is calculated
                after reducing it by 30%, on at most 300,000 euros a year.
              label: Net income qualifying for the art. 32.1 reduction
            saldo-negativo-fin-periodo:
              help: Negative results of this return and earlier returns of the year
                still to deduct in box 15 of a later quarter.
              label: Negative balance transferable to later periods
          field:
            label: Order HAP/258/2015, tax years 2019 onwards
