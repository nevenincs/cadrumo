modelo:
  schema:
    '131':
      casilla:
        continuidad:
          irpf-pf-modulos-1-unidades:
            label: 'Módulo 1 (Employed staff): number of units'
          irpf-pf-modulos-1-unidades-anterior:
            label: 'Módulo 1 (Employed staff): number of units in the previous tax
              year (2023), for the employment-incentive reduction'
          irpf-pf-modulos-2-unidades:
            label: 'Módulo 2 (Non-employed staff): number of units'
          irpf-pf-modulos-3-unidades:
            label: 'Módulo 3 (activity-specific unit: floor area, distance travelled
              or load): number of units'
          irpf-pf-modulos-4-unidades:
            label: 'Módulo 4 (activity-specific unit: electricity or other energy
              consumption): number of units'
          irpf-pf-modulos-5-unidades:
            label: 'Módulo 5 (activity-specific unit, e.g. remaining floor area of
              an independent premises or tables): number of units'
          irpf-pf-modulos-6-unidades:
            label: 'Módulo 6 (activity-specific unit, e.g. remaining floor area of
              a non-independent premises or type A machines): number of units'
          irpf-pf-modulos-7-unidades:
            label: 'Módulo 7 (activity-specific unit, e.g. oven surface area or type
              B machines): number of units'
          irpf-pf-modulos-diferencia:
            label: Difference
          irpf-pf-modulos-epigrafe-iae:
            label: IAE heading of the activity under the objective estimation (módulos)
              regime. For headings 659.4 and 691.9, which group two different activities
              under the same code, use the suffix "a" or "b" (e.g. "659.4a", "691.9b")
              according to the activity - see the coefficient parameter m131-modulos-coeficientes
              for the exact assignment.
          irpf-pf-modulos-indice-inicio-actividad:
            label: 'Corrective index for the start of new activities (letter b.4,
              activity started on or after 1-1-2025 in an exclusive premises). Index
              declared by the operator (0.80/0.90; 0.60/0.70 with disability >=33%,
              Order HAC/1425/2025 Annex II, instruction 2.3.b.4); the engine does
              not model the start year or the disability. Incompatible with the seasonal
              index (b.2): if both are declared, the seasonal index prevails.'
          irpf-pf-modulos-indice-pequena-dimension:
            label: Corrective index for small enterprises (letter b.1 - single municipality,
              single premises, no staff or up to 2 employees). Index declared by the
              operator (0.70/0.75/0.80/0.90, Order HAC/1425/2025 Annex II, instruction
              2.3.b.1); the engine does not model taxpayer facts. Never applies to
              activities with a special index (721.2, 722).
          irpf-pf-modulos-indice-temporada:
            label: 'Seasonal corrective index (letter b.2 - seasonal activity, up
              to 180 days/year). Index declared by the operator (1.50/1.35/1.25 depending
              on duration, Order HAC/1425/2025 Annex II, instruction 2.3.b.2); the
              engine does not model duration as a taxpayer fact. Incompatible with
              the new-activity start-up index (b.4): if both are declared, this one
              prevails.'
          irpf-pf-modulos-pequena-dimension-ignorado-flag:
            label: 'Internal indicator (1/0): the declared small-enterprise corrective
              index (b.1) was ignored due to incompatibility with the activity''s
              special corrective index (Order HAC/1425/2025 Annex II, instruction
              2.3.a/b.1).'
          irpf-pf-modulos-rendimiento-neto-actividad:
            label: 'Net income from the activity (Phase 4: modules − general 5 percent
              reduction)'
          irpf-pf-modulos-rendimiento-neto-minorado:
            label: 'Reduced net income (Phase 2: preliminary − employment-incentive
              reduction − investment-incentive reduction)'
          irpf-pf-modulos-rendimiento-neto-previo:
            label: 'Preliminary net income (Phase 1: Σ module units × annual yield
              per unit)'
          irpf-pf-modulos-resultado-declaracion:
            label: Result of the return
          irpf-pf-modulos-resultados-negativos-anteriores:
            label: Negative results from previous quarters
          irpf-pf-modulos-suma-rendimientos:
            label: Sum of net income
          irpf-pf-modulos-temporada-inicio-actividad-conflicto-flag:
            label: 'Internal indicator (1/0): the seasonal corrective index (b.2)
              and the new-activity start-up corrective index (b.4) were declared simultaneously,
              which are mutually incompatible (Order HAC/1425/2025 Annex II, instruction
              2.3).'
          irpf-pf-modulos-volumen-agrario:
            label: Agricultural income for the quarter
          irpf-pf-modulos-volumen-sin-datos-base:
            label: Turnover or income without base data
          irpf-pf-saldo-negativo-fin-periodo:
            label: Negative balance carried forward to later periods (max. 0, -box
              10)
          minoracion-rendimientos-actividades-economicas:
            label: Reduction for net income from business/professional activities
          pago-fraccionado-previo:
            label: Sum of preliminary instalment payments
          pago-fraccionado-previo-agrario:
            label: Preliminary agricultural instalment payment
          pago-fraccionado-previo-datos-base:
            label: Preliminary instalment payment based on actual data
          pago-fraccionado-previo-sin-datos-base:
            label: Preliminary instalment payment without base data
          prestamo-vivienda-habitual:
            label: Payment of loans for the taxpayer's main home
          resultado-anteriores-autoliquidaciones:
            label: Result payable from previous self-assessments
          retenciones-ingresos-a-cuenta:
            label: Withholdings and payments on account
      field:
        official_name: Modelo 131. Personal Income Tax. Entrepreneurs and professionals
          under objective assessment. Instalment payment.
        title: IRPF instalment payment, objective assessment
      revision:
        2019-2023:
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: instalment payment under objective estimation
                  (tax years 2019 to 2023)'
          field:
            label: Tax years 2019 to 2023
        '2024':
          casilla:
            modulos-indice-inicio-actividad:
              label: 'Corrective index for the start of new activities (letter b.4,
                activity started on or after 1-1-2023 in an exclusive premises). Index
                declared by the operator (0.80/0.90; 0.60/0.70 with disability ≥33%,
                Order HFP/1359/2023 Annex II, instruction 2.3.b.4); the engine does
                not model the start year or the disability. Incompatible with the
                seasonal index (b.2): if both are declared, the seasonal index prevails.'
            modulos-indice-pequena-dimension:
              label: Corrective index for small enterprises (letter b.1 - single municipality,
                single premises, no staff or up to 2 employees). Index declared by
                the operator (0.70/0.75/0.80/0.90, Order HFP/1359/2023 Annex II, instruction
                2.3.b.1); the engine does not model taxpayer facts. Never applies
                to activities with a special index (721.2, 722).
            modulos-indice-temporada:
              label: 'Seasonal corrective index (letter b.2 - seasonal activity, up
                to 180 days/year). Index declared by the operator (1.50/1.35/1.25
                depending on duration, Order HFP/1359/2023 Annex II, instruction 2.3.b.2);
                the engine does not model duration as a taxpayer fact. Incompatible
                with the new-activity start-up index (b.4): if both are declared,
                this one prevails.'
            modulos-minoracion-inversion:
              label: Reduction for investment incentives (depreciation of tangible
                or intangible fixed assets in use, per the investment-goods register).
                Amount declared by the operator; the engine does not model a per-item
                asset register - see Order HFP/1359/2023 Annex II, instruction 2.2.b)
                and your own depreciation schedule.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Internal indicator (1/0): the declared small-enterprise corrective
                index (b.1) was ignored due to incompatibility with the activity''s
                special corrective index (Order HFP/1359/2023 Annex II, instruction
                2.3.a/b.1).'
            modulos-rendimiento-neto-modulos:
              label: 'Net income from modules (Phase 3: reduced amount adjusted by
                the general corrective indices - small enterprise, seasonal/new-activity
                start-up, excess - in the order and with the incompatibilities of
                Order HFP/1359/2023 Annex II, instruction 2.3)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Internal indicator (1/0): the seasonal corrective index (b.2)
                and the new-activity start-up corrective index (b.4) were declared
                simultaneously, which are mutually incompatible (Order HFP/1359/2023
                Annex II, instruction 2.3).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: instalment payment under objective estimation
                  (tax year 2024)'
          field:
            label: Tax year 2024
        '2025':
          casilla:
            modulos-1-unidades-anterior:
              help: 'Módulo 1 (Employed staff): number of units in the previous tax
                year (2023), for the employment-incentive reduction'
              label: 'Módulo 1 (Employed staff): number of units in the previous tax
                year (2024), for the employment-incentive reduction'
            modulos-indice-inicio-actividad:
              label: 'Corrective index for the start of new activities (letter b.4,
                activity started on or after 1-1-2024 in an exclusive premises). Index
                declared by the operator (0.80/0.90; 0.60/0.70 with disability ≥33%,
                Order HAC/1347/2024 Annex II, instruction 2.3.b.4); the engine does
                not model the start year or the disability. Incompatible with the
                seasonal index (b.2): if both are declared, the seasonal index prevails.'
            modulos-indice-pequena-dimension:
              label: Corrective index for small enterprises (letter b.1 - single municipality,
                single premises, no staff or up to 2 employees). Index declared by
                the operator (0.70/0.75/0.80/0.90, Order HAC/1347/2024 Annex II, instruction
                2.3.b.1); the engine does not model taxpayer facts. Never applies
                to activities with a special index (721.2, 722).
            modulos-indice-temporada:
              label: 'Seasonal corrective index (letter b.2 - seasonal activity, up
                to 180 days/year). Index declared by the operator (1.50/1.35/1.25
                depending on duration, Order HAC/1347/2024 Annex II, instruction 2.3.b.2);
                the engine does not model duration as a taxpayer fact. Incompatible
                with the new-activity start-up index (b.4): if both are declared,
                this one prevails.'
            modulos-minoracion-inversion:
              label: Reduction for investment incentives (depreciation of tangible
                or intangible fixed assets in use, per the investment-goods register).
                Amount declared by the operator; the engine does not model a per-item
                asset register - see Order HAC/1347/2024 Annex II, instruction 2.2.b)
                and your own depreciation schedule.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Internal indicator (1/0): the declared small-enterprise corrective
                index (b.1) was ignored due to incompatibility with the activity''s
                special corrective index (Order HAC/1347/2024 Annex II, instruction
                2.3.a/b.1).'
            modulos-rendimiento-neto-modulos:
              label: 'Net income from modules (Phase 3: reduced amount adjusted by
                the general corrective indices - small enterprise, seasonal/new-activity
                start-up, excess - in the order and with the incompatibilities of
                Order HAC/1347/2024 Annex II, instruction 2.3)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Internal indicator (1/0): the seasonal corrective index (b.2)
                and the new-activity start-up corrective index (b.4) were declared
                simultaneously, which are mutually incompatible (Order HAC/1347/2024
                Annex II, instruction 2.3).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: instalment payment under objective estimation
                  (tax year 2025)'
          field:
            label: Tax year 2025
        '2026':
          casilla:
            modulos-1-unidades-anterior:
              help: 'Módulo 1 (Employed staff): number of units in the previous tax
                year (2023), for the employment-incentive reduction'
              label: 'Módulo 1 (Employed staff): number of units in the previous tax
                year (2025), for the employment-incentive reduction'
            modulos-minoracion-inversion:
              label: Reduction for investment incentives (depreciation of tangible
                or intangible fixed assets in use, per the investment-goods register).
                Amount declared by the operator; the engine does not model a per-item
                asset register - see Order HAC/1425/2025 Annex II, instruction 2.2.b)
                and your own depreciation schedule.
            modulos-rendimiento-neto-modulos:
              label: 'Net income from modules (Phase 3: reduced amount adjusted by
                the excess corrective index)'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Modelo 131: instalment payment under objective estimation
                  (tax year 2026)'
          field:
            label: Tax year 2026
