            label: Modelo 296, tax year 2023
        2024-y-siguientes:
          construct:
            modelo-296-calculation-construct:
              field:
                title: 'Modelo 296: annual summary of IRNR withholdings'
          field:
            label: Order HAC/56/2024, tax years 2024 onwards
