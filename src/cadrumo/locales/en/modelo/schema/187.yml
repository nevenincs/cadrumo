modelo:
  schema:
    '187':
      field:
        official_name: Modelo 187. Informative return of shares and units representing
          the capital or assets of collective investment undertakings, and annual
          summary of withholdings and payments on account for Personal Income Tax,
          Corporate Income Tax and Non-Resident Income Tax in relation to the income
          or capital gains obtained.
        title: Shares and units in collective investment undertakings - annual summary
      revision:
        2022-y-siguientes:
          casilla:
            '01':
              help: Total number of declared transactions, equal to the number of
                type 2 records in the record design.
              label: Total number of transactions
            '02':
              help: Sum of the amounts of acquisition or subscription transactions
                in shares and holdings.
              label: Total amount of acquisitions
            '03':
              help: Sum of the amounts of disposal or redemption transactions in shares
                and holdings.
              label: Total amount of disposals
            '04':
              help: Sum of the withholdings and payments on account applied to the
                declared transactions.
              label: Total amount of withholdings and payments on account
          construct:
            modelo-187-calculation-construct:
              field:
                title: Modelo 187 calculation construct
          field:
            label: Casilla— tax information
