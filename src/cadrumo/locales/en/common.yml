    body: RD 1007/2023 requirements for invoicing software systems. The current milestone
      is 1 January 2027 for Corporate Income Tax taxpayers under art. 3.1.a and 1
      July 2027 for the other obligated taxpayers under art. 3.1.
    title: VERI*FACTU
