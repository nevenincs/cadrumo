aggregation:
  grouping:
    errors:
      unsupported_modelo: No aggregation contract is registered for the requested
        modelo.
  invoice_retencion:
    defects:
      fx_unresolved: The invoice is in a foreign currency and has no rate to convert
        it to euros.
      iva_treatment_undeclared: No IVA treatment is declared, so it is not possible
        to tell whether the withholding is owed or credited.
      missing_counterparty_tax_id: The invoice shows no tax ID (NIF) for the payee,
        which the withholding declaration requires.
      no_retencion_declared: The invoice shows no withheld amount.
      non_resident_supplier: The supplier is not resident in Spain; withholding on
        payments to non-residents is declared under non-resident income tax.
      not_a_retenedor_liability: With this IVA treatment and invoice type, the withholding
        is not something you owe as the payer who withholds (retenedor); withholding
        on an invoice you issued is a credit in your favour.
  irnr_income_ledger:
    diagnostics:
      foreign_source_out_of_scope: source_jurisdiction %{source_jurisdiction} is outside
        the source scope the selected Modelo 210 revision declares; TRLIRNR Art. 13
        admits only Spanish-source income.
      incomplete_m210_classification: Spanish-source incoming transaction has no explicit
        Modelo 210 income classification; the IRNR projection never infers an official
        tipo-renta code from irpf_category.
      source_jurisdiction_unresolved: source_jurisdiction is unresolved (None) on
        an incoming Modelo 210 candidate; TRLIRNR Art. 13 admits only Spanish-source
        income to this IRNR projection.
      tipo_renta_code_not_declared: Modelo 210 official tipo-renta code %{tipo_renta_code}
        is not declared for the selected revision and filing period %{period}.
    errors:
      income_type_codes_missing: The selected Modelo 210 revision declares no income-type
        codes valid for this filing period.
      income_type_namespace_missing: The selected Modelo 210 revision does not declare
        exactly one keyed income-type code namespace.
      registry_revision_mismatch: The injected Modelo 210 revision does not match
        the revision the pinned authority selects for this modelo, filing year and
        period.
      source_scope_missing: The selected Modelo 210 revision declares no single source-jurisdiction
        scope for this gross-income casilla.
  iva_ledger:
    errors:
      art_104_tres_exclusion_not_operator_declared: Art. 104.tres exclusion %{value}
        is derived by the tax registry and cannot be declared on a ledger entry. Remove
        it from the entry.
      bucket_mismatch: Transaction repository bucket does not match the requested
        aggregation bucket.
      cash_accounting_evidence_incoherent: 'The cash accounting timing on this IVA
        row is inconsistent: %{refusal}. Correct the operation date or the payment
        evidence on the ledger entry.'
      deduction_authority_on_non_deducible_row: An IVA row that bears no deductible
        cuota cannot carry a deduction classification; IVA category %{category} settles
        as %{flow_direction}. Remove the declared deduction kind, or correct the category.
      differentiated_sector_inactive_for_filing_year: A differentiated sector is inactive
        for the filing year.
      differentiated_sector_without_filing_year_entry: A differentiated sector has
        no register entry for the filing year.
      differentiated_sector_without_provisional_percentage: A differentiated sector
        has no resolved provisional percentage.
      domestic_identification_on_intra_community_transaction: A Spanish VAT identification
        is not valid for an intra-community transaction.
      eu_member_state_on_export_transaction: Export or export-assimilated operations
        must not carry an EU member state; got %{member_state}.
      exemption_article_outside_domestic_exempt: Exemption article %{value} applies
        only to a domestic exempt IVA row, but this row settles under IVA category
        %{category}. Correct the exemption article or the IVA category.
      inadmissible_deduction_classification: 'The declared IVA deduction kind %{deduction_fact_kind}
        is not admissible for a row in IVA category %{iva_category}: %{refusal}. Correct
        the declared deduction kind, the IVA category, or the linked evidence.'
      investment_observations_missing_bienes_inversion_authority: Investment IVA observations
        require the explicit bienes de inversión register and a matching profile authority.
      missing_counterparty_establishment_on_export: An export is exempt because the
        operation leaves the Union, so it turns on where the counterparty is ESTABLISHED.
        Record the counterparty's country; an absent or unassigned code establishes
        nothing, and its VAT identification cannot answer this.
      missing_counterparty_identification_state: An intra-community transaction requires
        the Member State in which the counterparty is VAT-identified.
      rectification_consumed_more_than_once: A corrected IVA entry may be rectified
        only once.
      sectorized_apportionment_duplicate_sectors: The sectorised IVA apportionment
        declares the same sector more than once.
      sectorized_especial_missing_input_classification: Sectorised prorrata especial
        requires an explicit input classification.
      sectorized_input_inactive_sector: A sectorised IVA input references an inactive
        sector.
      sectorized_input_missing_sector_identity: A sectorised IVA input carries no
        explicit sector identity.
      sectorized_input_unknown_sector: A sectorised IVA input references an unknown
        sector.
      unaccepted_registry_value: '%{field} is recorded as %{value}, which the pinned
        tax registry authority does not accept for %{effective_date}, so the row cannot
        feed the IVA calculation. Correct that value on the ledger entry.'
  m303_arrivals:
    errors:
      prorrata_register_contradictory_transition_evidence: The prorrata register records
        both an option and a revocation for the same year.
      prorrata_register_incomplete_current_year_declaration: The prorrata register
        lacks a complete explicit declaration for the current filing year.
      prorrata_revocacion_without_prior_year_especial: Prorrata especial revocation
        has no prior-year especial register state for the affected sectors.
      prorrata_transition_contradictory_evidence: Prorrata especial transition entries
        contradict the declared transition.
      prorrata_transition_declarations_unavailable: The selected Modelo 303 version
        declares no filing schedule or periodic carry source, so the prorrata transition
        period cannot be determined.
      prorrata_transition_entry_without_evidence: A prorrata especial transition entry
        carries no transition evidence.
      prorrata_transition_evidence_without_declared_transition: Prorrata especial
        transition evidence was supplied without a declared transition.
      prorrata_transition_evidence_wrong_filing_year: Prorrata especial transition
        register evidence belongs to another filing year.
      prorrata_transition_missing_register_evidence: The declared prorrata especial
        transition has no supporting register evidence.
      prorrata_transition_not_applicable_for_period: Prorrata especial transition
        evidence applies only in the final Modelo 303 period of the year.
      recipient_fact_disagrees_with_ledger_evidence: The recipient-of-cash-accounting
        fact does not agree with the supplier-regime entries in your records.
      supplier_regime_aggregation_period_mismatch: The IVA aggregation period does
        not match the requested filing period.
      supplier_regime_blank_ledger_identity: Supplier-regime arrival data contains
        an entry with a blank identity.
      supplier_regime_duplicate_ledger_evidence: Supplier-regime arrival data repeats
        the same entry.
      supplier_regime_observations_outside_period: The IVA aggregation carries observations
        dated outside the requested filing period.
  modelo_bindings:
    errors:
      invoice_line_currency_unconverted: An invoice line is denominated in a foreign
        currency with no resolved euro rate, so it cannot be declared on this modelo.
      unsupported_period: Unsupported modelo period for totals from your records.
  oss_ioss:
    errors:
      exterior_country_code_undeclared: The member state of consumption has no declared
        Modelo 369 country code, so its services cannot be declared on this modelo.
      exterior_detail_not_representable: The external-scheme layout cannot represent
        every row or all its fields. Review the detail before continuing.
      exterior_rate_kind_unsupported: The one-stop-shop external scheme only accepts
        services at the standard or reduced rate of the member state of consumption.
        The supplied observation declares another rate kind, which cannot be aggregated
        under this scheme.
      invoice_line_currency_unconverted: An OSS/IOSS invoice line is denominated in
        a foreign currency with no resolved euro rate, so it cannot be declared on
        this modelo.
      invoice_line_rate_kind_unclassifiable: An OSS/IOSS invoice line carries an IVA
        rate that cannot be classified into a rate tier, so its cuota cannot be declared
        on this modelo.
      iva_amount_mismatches_destination_rate: The persisted IVA amount disagrees with
        the destination member state rate beyond the one-cent tolerance.
  per_modelo:
    errors:
      unsupported_modelo: Unsupported modelo for per-modelo aggregation
  renta_ledger:
    errors:
      annual_period_required: An annual period is required for Renta totals from your
        records.
      bucket_mismatch: The transaction store bucket does not match the requested Renta
        bucket.
      invoice_bucket_mismatch: The invoice store bucket does not match the requested
        Renta bucket.
      modelo_mismatch: The modelo does not match the expected Renta modelo.
      period_mismatch: The period does not match the expected Renta period.
      quarterly_period_required: Quarterly period is required for M130 income aggregation
        (for example --year 2024 --period 1T).
      unsupported_period: Annual period is required for Modelo 100 income aggregation
        (e.g. 2024-0A).
  retenciones:
    errors:
      filing_year_out_of_range: Filing year %{filing_year} is outside the supported
        range %{min_year}-%{max_year}.
      m111_no_retenciones_attestation_missing: 'No withholding is recorded for any
        payee on Modelo 111 %{filing_year} %{period}. Do not file a blank Modelo 111:
        declare the quarter as a no-retenciones period with `aeat config profile edit
        --modelo-111-no-retenciones-periods %{attestation_period}` (the option replaces
        the saved list, so also list, comma-separated, any periods you already declared),
        or record the payments you withheld tax from with `aeat app modelo aggregate`,
        using --received-invoice-retencion for a received invoice or --ledger-payment-withholding
        for payroll.'
      m193_phase_allocation_collision: 'Modelo %{modelo} %{filing_year}: allocation(s)
        %{source_allocations} are declared manually and also come from captured capital
        withholding. Remove the manual row.'
      perceptor_nif_blank: Perceptor NIF must not be blank.
      perceptor_observations_missing: No per-perceptor retention observations exist
        for modelo %{modelo} %{filing_year} %{period}; source %{source_kind} cannot
        resolve.
      withholding_annual_source_not_quarterly: 'The annual summary cannot be built:
        the filer''s filing schedule does not assign its periodic withholding modelo
        every quarter of the year (it files monthly), and totalling only the quarterly
        windows would leave months of withholding out.'
      withholding_filer_profile_absent: Your profile could not be loaded for this
        filing year, so it cannot be established whether withholding is filed quarterly
        or monthly. Complete the profile and try again.
      withholding_quarterly_window_not_scheduled: The filer's filing schedule does
        not assign this quarter to the withholding modelo (a large company files it
        monthly), and monthly withholding periods are not supported yet. Nothing was
        recorded.
  service:
    errors:
      currency_conversion_required: Foreign-currency amount requires an EUR conversion
        before it can be aggregated.
      envelope_modelo_mismatch: Aggregation modelo does not match result modelo.
      envelope_period_mismatch: Aggregation period does not match result period.
      envelope_provider_payload_mismatch: Provider does not match aggregation payload
        type.
      observations_mismatch: Observations cannot be supplied for the requested modelo.
      per_modelo_modelos_not_unique: Per-modelo aggregation modelos must be owned
        by exactly one provider.
      result_source_kinds_not_unique: Result source kinds must be unique.
  source_mesh:
    errors:
      annual_summary_handoff_duplicate: More than one resolver supplied the immutable
        Modelo 303 annual-summary handoff (first {first_resolver}; second {second_resolver}).
      binding_source_mismatch: source_kind and binding_source refer to different families
        of value sources.
      closed_record_rows_conflict: Row membership and its values have incompatible
        sources.
      closed_record_rows_unadmitted: An incomplete or unadmitted source cannot establish
        a complete table.
      duplicate_binding_owner: 'Internal error: the same value source has two owners
        in the source mesh.'
      duplicate_bound_casilla_owner: 'Internal error: duplicate owner for a box with
        a value source in the source mesh.'
      duplicate_relation_owner: 'Internal error: duplicate relation owner in source
        mesh.'
      duplicate_row_binding_coordinate: 'Internal error: duplicate row value source
        coordinate.'
      duplicate_row_binding_owner: 'Internal error: the same row value source has
        two owners in the source mesh.'
      duplicate_row_casilla_coordinate: 'Internal error: duplicate row-casilla coordinate.'
      duplicate_row_casilla_owner: 'Internal error: duplicate row-casilla owner in
        the source mesh.'
      out_of_window_summary_date_span_invalid: An out-of-window summary's maximum
        filing date must not precede its minimum filing date.
      out_of_window_summary_incomplete: An out-of-window summary must set the count,
        minimum filing date, and maximum filing date together.
      owned_sources_blank: Source mesh owned sources must not contain blank source
        kinds.
      owned_sources_duplicate: Source mesh owned sources must be unique.
      provenance_binding_source_mismatch: The source kind declared on the origin row
        does not match the value source it claims to belong to. Both must name the
        same source for the trail to be checkable.
      provenance_binding_source_missing: The origin row declares a recognised value
        source kind but names no value source it belongs to. A recognisable source
        with no declared value source leaves the value untraceable.
      provenance_contributor_missing_parent: A contributing origin row must declare
        the primary row it derives from. Without it the contribution is detached from
        the value it feeds.
      provenance_contributor_parent_missing: A contributing row names a parent reference
        that is not among the declared primary rows. The origin chain points at a
        source that does not exist.
      provenance_primary_has_parent: 'A primary origin row may not declare a parent
        row: the primary row is the source the others depend on.'
      provenance_primary_ref_ambiguous: Two primary origin rows share the same source
        reference, so a contributing row cannot determine which of them it derives
        from.
      provenance_resolver_mismatch: An origin row names a resolver other than the
        one that produced the resolution. Every row must be attributed to the same
        resolver that signs the result.
      relation_provenance_incomplete: The origin of a related value must include the
        source modelo, filing year, periods, boxes, legal references and source references.
      reserved_composite_resolver_id: The given resolver identifier is reserved for
        composite resolutions and may not be used on a simple resolution.
      row_binding_index_invalid: 'Internal error: the row index of a row value source
        must be 1 or greater.'
      row_binding_value_invalid: 'Internal error: the decimal value of a row value
        source is not valid.'
      row_casilla_index_invalid: 'Internal error: the row-casilla row index must be
        1 or greater.'
      row_casilla_provenance_coordinate_mismatch: Every row box value must have exactly
        one origin row.
      row_casilla_row_index_mismatch: A row box and the source of its value must use
        the same row index.
      row_casilla_source_coordinate_missing: The value or identity of a row box's
        value source is missing.
      row_casilla_source_identity_mismatch: The origin identity of a row box differs
        from its source identity.
      row_casilla_source_value_mismatch: The value of a row box differs from the value
        of its source.
      row_casilla_value_invalid: 'Internal error: the row-casilla decimal value is
        not valid.'
      row_source_identity_coordinate_mismatch: Every row source identity coordinate
        must correspond to a source value present on the row itself. A coordinate
        was declared that the row does not carry.
      source_transaction_ids_blank: Source mesh transaction ids must not contain blanks.
      source_transaction_ids_duplicate: Source mesh transaction ids must be unique.
      unresolved_binding_ids_blank: 'Internal error: unresolved value source ids cannot
        be blank.'
      unresolved_binding_ids_duplicate: 'Internal error: unresolved value source ids
        cannot be duplicated.'
      unresolved_relation_ids_blank: 'Internal error: unresolved relation ids cannot
        be blank.'
      unresolved_relation_ids_duplicate: 'Internal error: unresolved relation ids
        cannot be duplicated.'
auth:
  catalogue:
    certificate_description: X.509 client certificate authentication (FNMT-RCM or
      any recognised authority). Supports every Sede flow.
    certificate_label: Digital certificate
    clave_movil_description: Push-approval authentication via the holder's phone registered
      with Cl@ve. Requires DNI/NIE, Cl@ve enrolment, and a paired device.
    clave_movil_label: Cl@ve Móvil
    clave_permanente_description: DNI/NIE and password authentication via the Cl@ve
      Permanente identity provider. Headless-automatable for AEAT read paths; requires
      DNI/NIE and password.
    clave_permanente_label: Cl@ve Permanente
  sync:
    requirement:
      auth_method_required: Choose an authentication method.
      certificate_file_required: Select an existing PKCS#12 certificate file.
      certificate_passphrase_required: Save the certificate passphrase.
      clave_identity_required: Enter a valid Cl@ve DNI/NIE.
      clave_password_required: Save the Cl@ve Permanente password.
      corrupt: The certificate cannot be opened. Check the file and passphrase.
      dni_validity_required: Enter the DNI validity date for the app request route.
      expired: The certificate has expired.
      expiring: The certificate expires soon.
      file_missing: The certificate file does not exist.
      nie_support_required: Enter the NIE support number for the app request route.
      ok: The local check passed.
      profile_identity_must_match: The Cl@ve DNI/NIE must match the taxpayer NIF/NIE.
      profile_tax_id_required: Enter the taxpayer NIF/NIE.
      unavailable: The required local check could not be completed.
      unreadable: The certificate file cannot be read.
categories:
  registry:
    amortizacion_vivienda_afecto:
      label: Depreciation of home used for business
      notes: Deductible in proportion to the home's business-use floor area (Ley 35/2006
        art. 30.2.5.b rule 4, depreciation of the home used for business).
    arrendamiento_local:
      label: Business premises rent
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    arrendamiento_vivienda_afecta: Business-use share of home rent
    arrendamiento_vivienda_afecto:
      notes: Deductible in proportion to the home's business-use floor area (Ley 35/2006
        art. 29.2 and art. 28.1, rent of the home used for business).
    asesoria_contable:
      label: Accounting advisory fees
      notes: Fully deductible expense, as an independent professional service (Ley
        35/2006 art. 28.1).
    asesoria_fiscal:
      label: Tax advisory fees
      notes: Fully deductible expense, as an independent professional service (Ley
        35/2006 art. 28.1).
    asesoria_juridica:
      label: Legal advisory fees
      notes: Fully deductible expense, as an independent professional service (Ley
        35/2006 art. 28.1).
    comunidad_vivienda_afecto:
      label: Community/condo fees on home used for business
      notes: Deductible in proportion to the home's business-use floor area (Ley 35/2006
        art. 30.2.5.b rule 2, home-ownership costs).
    cuotas_autonomos_ss:
      notes: Fully deductible expense; RETA contributions are a statutory condition
        of carrying on the activity.
    cuotas_colegiales:
      label: Professional association fees
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    cuotas_reta: Self-employed social security contributions (RETA)
    formacion_profesional:
      label: Professional training
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, other external services).
    gastos_bancarios:
      label: Bank charges
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, financial and banking
        expenses).
    gastos_financieros:
      label: Financial expenses
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, financial and banking
        expenses).
    hardware_amortizable:
      label: Depreciable computer hardware
      notes: Fully deductible through depreciation (Ley 35/2006 art. 28.1, depreciation
        of fixed assets).
    home_office_agua: Home-office water
    home_office_gas: Home-office gas
    home_office_internet: Home-office internet
    home_office_luz: Home-office electricity
    ibi_local_afecto:
      label: Property tax (IBI) on business premises
      notes: Fully deductible expense (Ley 35/2006 art. 14 LIS, by reference; fiscally
        deductible taxes).
    ibi_vivienda_afecto:
      label: Property tax (IBI) on home used for business
      notes: Deductible in proportion to the home's business-use floor area (Ley 35/2006
        art. 30.2.5.b rule 2, non-state taxes on the home).
    manutencion_dietas_extranjero:
      notes: 'Deductible up to a statutory daily cap: 48.08 EUR/day without an overnight
        stay, 91.35 EUR/day with an overnight stay (Ley 6/2017 / Ley IRPF art. 30.2.5.c,
        Reglamento IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: With overnight stay
        sin-pernocta:
          label: Without overnight stay
    manutencion_dietas_nacional:
      notes: 'Deductible up to a statutory daily cap: 26.67 EUR/day without an overnight
        stay, 53.34 EUR/day with an overnight stay (Ley 6/2017 / Ley IRPF art. 30.2.5.c,
        Reglamento IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: With overnight stay
        sin-pernocta:
          label: Without overnight stay
    manutencion_extranjero: Foreign subsistence allowance (meals and stay)
    manutencion_nacional: Domestic subsistence allowance (meals and stay)
    material_oficina:
      label: Office supplies
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    mobiliario_amortizable:
      label: Depreciable furniture
      notes: Fully deductible through depreciation (Ley 35/2006 art. 28.1, depreciation
        of fixed assets).
    mutualidad_alternativa:
      label: Alternative mutual-insurance contribution
      notes: Deductible up to a statutory cap of 15,000 EUR/year per taxpayer, for
        an alternative mutualidad replacing RETA (AEAT Renta guide, Cotizaciones al
        RETA).
    publicidad_marketing:
      label: Advertising and marketing
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, other external services).
    reparaciones_conservacion:
      label: Repairs and maintenance
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    seguros_rc: Professional civil-liability insurance
    seguros_responsabilidad_civil:
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    seguros_salud: Self-employed health insurance
    seguros_salud_autonomo:
      notes: Deductible up to a statutory cap of 500 EUR/year per taxpayer (Ley 35/2006
        art. 30.2.5.c rule 1, sickness-insurance premiums).
      statutory_cap_variants:
        discapacidad:
          label: Limit per insured person with a disability
        general:
          label: General limit per insured person
    software_suscripcion:
      label: Software subscriptions
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    subcontratacion:
      label: Subcontracting fees
      notes: Fully deductible expense, as an independent professional service (Ley
        35/2006 art. 28.1).
    suministros_cliente_directos:
      label: Supplies billed directly to the client
      notes: Fully deductible expense (Ley 35/2006 art. 28.1).
    suministros_home_office_agua:
      notes: Deductible in proportion to the home's business-use floor area (default
        ratio 30%), where the home is only partly used for the activity (Ley 35/2006
        art. 30.2.5.b rule 4).
    suministros_home_office_gas:
      notes: Deductible in proportion to the home's business-use floor area (default
        ratio 30%), where the home is only partly used for the activity (Ley 35/2006
        art. 30.2.5.b rule 4).
    suministros_home_office_internet:
      notes: Deductible in proportion to the home's business-use floor area (default
        ratio 30%), where the home is only partly used for the activity (Ley 35/2006
        art. 30.2.5.b rule 4).
    suministros_home_office_luz:
      notes: Deductible in proportion to the home's business-use floor area (default
        ratio 30%), where the home is only partly used for the activity (Ley 35/2006
        art. 30.2.5.b rule 4).
    suministros_local_afecto:
      label: Utilities for business premises
      notes: 'Fully deductible expense: the premises where the activity is carried
        on are business assets (Ley 35/2006 art. 29.1.a) and their utilities are deductible
        expense (art. 28.1). The 30 per cent rule of art. 30.2.5.b does not apply,
        as it covers only a home partly used for the activity.'
    telefonia_fija:
      label: Landline phone expense
      notes: Deductible in proportion to the home's business-use floor area (default
        ratio 30%), where the home is only partly used for the activity (Ley 35/2006
        art. 30.2.5.b rule 4).
    telefonia_movil:
      label: Mobile phone expense
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the asset).
    tributos_deducibles: Other fiscally deductible taxes and levies
    tributos_fiscalmente_deducibles:
      notes: Fully deductible expense (Ley 35/2006 art. 14 LIS, by reference).
    vehiculo_combustible:
      label: Vehicle fuel
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the vehicle).
    vehiculo_mantenimiento:
      label: Vehicle maintenance
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the vehicle).
    vehiculo_parking:
      label: Parking charges
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the vehicle).
    vehiculo_peaje:
      label: Toll charges
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the vehicle).
    vehiculo_seguro:
      label: Vehicle insurance
      notes: Deductible on proof of exclusive business use (Reglamento IRPF art. 22,
        exclusive affectation of the vehicle).
    viajes_alojamiento:
      label: Travel accommodation
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, other external services).
    viajes_transporte:
      label: Travel transport
      notes: Fully deductible expense (Ley 35/2006 art. 28.1, other external services).
common:
  manager:
    action_failed: The action could not be completed. Check the manager log.
    open_application: Open Cadrumo
    open_logs: Open logs
    quit: Quit
    quit_warning: Quit background services? Running work may be interrupted. Services
      stay stopped until you start them manually or sign in again.
    restart: Restart
