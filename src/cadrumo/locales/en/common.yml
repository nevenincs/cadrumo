        summary: Restores a profile from a backup file or folder once you prove its
          password.
      archive_import_prepare:
        label: Read a backup before restoring it
        summary: Reads a backup file or folder and returns the digest of what was
          read. It restores nothing.
      archive_inspect:
        label: Inspect a profile backup
        summary: Shows what a backup file says about itself, without decrypting it.
      profile_create:
        label: Create a profile
        summary: Creates and selects a profile with its first password. The profile
          stays signed out until you sign in.
      profile_list:
        label: List the profiles
        summary: Lists the profiles on this computer without unlocking any of them.
      recovery_disable:
        label: Remove a recovery code
        summary: Removes a profile's recovery code after you prove its current password.
      recovery_enroll:
        label: Set up a recovery code
        summary: Creates a recovery code for a profile once you prove its password.
          The code is shown once.
      repair_logs:
        label: Recent log lines
        summary: Shows where the log file is and its most recent lines.
      repair_profile:
        label: Repair the active profile
        summary: Checks whether one profile's record can be read, or clears an active-profile
          setting that points at nothing usable.
      repair_report:
        label: Diagnose the installation
        summary: Checks the local configuration, the active profile, sign-in and the
          log.
      report_verify_document:
        label: Verify a calculation summary
        summary: Checks a calculation summary file by its own contents, without tracing
          it to any profile.
      reset_resume:
        label: Resume a reset
        summary: Carries an unfinished reset through to its end.
      reset_start:
        label: Reset all profiles
        summary: Starts the irreversible removal of every profile stored on this computer.
      reset_status:
        label: Reset status
        summary: Shows how far a reset has got, without continuing it.
      review_package_verify:
        label: Verify a review package
        summary: Checks every file in a review package against its checksum list.
      review_package_verify_receipt:
        label: Verify a countersigned receipt
        summary: Checks both signatures on a countersigned receipt for a review package.
      review_package_verify_signature:
        label: Verify a package signature
        summary: Checks a review package's signature against a public key you trust.
      storage_check:
        label: Check the storage
        summary: Compares the storage folders on disk with what they should be, without
          repairing anything.
      storage_init:
        label: Create the storage folders
        summary: Creates every folder that is missing and keeps everything that is
          already there.
      storage_inventory:
        label: Storage inventory
        summary: Shows where each storage area is and what it holds.
      storage_reclaim:
        label: Free up a storage area
        summary: Deletes the contents of one area that can be created again.
