        label: Verify a countersigned receipt
        summary: Checks both signatures on a countersigned receipt for a review package.
      review_package_verify_signature:
        label: Verify a package signature
        summary: Checks a review package's signature against a public key you trust.
      storage_check:
        label: Check the storage
        summary: Compares the storage folders on disk with what they should be, without
          repairing anything.
      storage_init:
        label: Create the storage folders
        summary: Creates every folder that is missing and keeps everything that is
          already there.
