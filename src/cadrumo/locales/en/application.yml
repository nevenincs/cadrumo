application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: AEAT auth lock could not be acquired after stale-lock recovery.
        lock_held: Another AEAT auth operation is already in progress for this profile.
          Do not start a second Cl@ve request; wait for the running process to finish
          or let the lock expire if that process crashed.
    certificate:
      health:
        file_missing: The configured certificate file (%{path}) does not exist. Restore
          the file or run 'aeat config auth configure --provider certificate --file
          PATH' with a valid path.
        path_unset: No certificate file has been selected. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
        unavailable: Certificate health is unavailable; see debug logs for diagnostic
          details.
      load:
        password_unset: No certificate password is configured. Set the certificate
          password before continuing.
        path_unset: No certificate file is configured. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
    clave_movil:
      health:
        identity_unset: No DNI/NIE has been configured for Cl@ve Móvil. Configure
          one before continuing.
        operator_completion_required: Ready; requires operator-mediated Cl@ve completion.
    errors:
      provider_reserved: Authentication provider {provider} is reserved and not yet
        implemented.
      session_field_not_datetime: Persisted session field {field} must be a datetime
        or ISO-8601 string.
    operator:
      alignment:
        both_missing_detail: Neither the Cl@ve identity (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          nor the active profile tax id is set. Set both to the same DNI/NIE before
          live AEAT auth.
        clave_identity_missing_detail: The Cl@ve identity (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          is not set, so it cannot be compared with the active profile tax id. Set
          it to the DNI/NIE of the active profile.
        mismatch_detail: The Cl@ve identity DNI/NIE '%{clave_identity}' does not match
          the active profile tax id '%{profile_tax_id}'. Live AEAT auth would bind
          one taxpayer's session to another profile. Switch to the profile whose tax
          id matches the Cl@ve DNI/NIE, or correct whichever value is wrong.
        profile_tax_id_missing_detail: The active profile has no tax id, so it cannot
          be compared with the Cl@ve identity. Set the profile tax id to the DNI/NIE
          used for Cl@ve.
      errors:
        certificate_file_required: The certificate provider requires a certificate
          file. Run `aeat config auth configure --provider certificate --file PATH`
          with the path to your PKCS#12 (.p12/.pfx) bundle.
        certificate_file_unresolved: The certificate path '%{certificate_path}' does
          not resolve to an existing file. Run `aeat config auth configure --provider
          certificate --file PATH` with a path to your PKCS#12 (.p12/.pfx) bundle.
        certificate_secret_mutation_in_progress: A certificate secret change is still
          being recovered for this profile. Retry that same secret command before
          changing authentication configuration.
        certificate_source_not_found: Certificate source '%{name}' is not registered.
          Run `aeat config auth certificate list` to see registered sources, or `aeat
          config auth certificate register --name %{name} --file PATH` to register
          it.
        cleanup_in_progress: An authentication logout or reset is still being recovered
          for this profile. Resume that operation before changing authentication configuration.
        dangling_active_profile: Active profile pointer '%{active_profile}' does not
          resolve to a registered profile bucket. Run aeat config profile list to
          inspect registered profiles, then aeat config login NAME or aeat config
          profile create NAME.
        no_active_bucket: No active profile bucket; run `aeat config profile create
          NAME` before configuring auth.
        provider_not_configured: No authentication provider is configured; specify
          --provider or configure one first.
        requires_custody_session: Auth operation targets profile '%{bucket_id}' at
          %{storage_root}, but that profile has no open custody session. Run aeat
          config login for that profile, then retry.
        revoke_requires_custody_session: The AEAT session for profile '%{bucket_id}'
          was NOT revoked and remains usable. It is stored encrypted inside that profile,
          so only unlocking that profile - with aeat config login - revokes it.
        scope_conflict: Choose either --provider or --all, not both.
        unreadable_active_profile: Active profile '%{active_profile}' has a bucket
          manifest but no readable profile record (status=%{status}). Run `%{next_action}`
          before configuring authentication.
      login:
        refused_certificate_file_missing: 'Cannot log in: the configured certificate
          file (%{path}) does not exist. Restore the file or reconfigure the path
          before continuing.'
        refused_certificate_path_unset: 'Cannot log in: no certificate file has been
          selected yet. Run ''aeat config auth configure --provider certificate --file
          PATH'' before continuing.'
        refused_clave_movil_identity_unset: 'Cannot log in with Cl@ve Móvil: no DNI/NIE
          has been configured yet. Configure one before continuing.'
        refused_live_tests_disabled: 'Live login is disabled by the safety gate: the
          tool only builds and verifies locally. Enable live tests if you really intend
          to connect to AEAT, then re-run this command. Requested provider: %{provider}.'
      probe:
        certificate_corrupt: The certificate file is not a valid PKCS#12 envelope
          or the password is missing; it cannot be parsed.
        certificate_corrupt_detail: 'The certificate cannot be interpreted: %{error}.'
        certificate_expired: The certificate expired %{days} days ago. Renew it before
          authenticating.
        certificate_expiring: The certificate expires in %{days} days. Plan the renewal.
        certificate_file_missing: The configured certificate file (%{path}) does not
          exist.
        certificate_ok: Certificate valid; expires in %{days} days.
        certificate_path_unset: No certificate file has been selected.
        certificate_unreadable: The certificate file cannot be read (%{error}).
        clave_movil_identity_invalid: 'The DNI/NIE configured for Cl@ve Móvil is not
          valid: %{error}.'
        clave_movil_identity_ok: The DNI/NIE configured for Cl@ve Móvil has a valid
          shape.
        clave_movil_identity_unset: No DNI/NIE has been configured for Cl@ve Móvil.
        no_provider: No auth provider is configured; nothing to probe locally.
        no_session: No persisted AEAT session token on disk; run `aeat config auth
          login` to acquire one.
        session_expired: Session expired
        session_live: Session active
    provider_impact:
      certificate_ready: Certificate auth is ready. The operator keeps the same CLI
        filing flow for AEAT-backed reads; every provider uses the same command workflow.
      generic_ready: '%{label} is ready. The operator keeps the same CLI filing flow
        while this provider plugs into the shared auth protocol.'
      unavailable: '%{label} is configured but not ready yet. The operator can still
        produce, verify, and export filings locally, but AEAT-backed reads stay unavailable
        until auth is fixed.'
      unconfigured: The operator can still produce, verify, and export filings locally,
        but AEAT-backed reads stay unavailable until an auth provider is configured.
    sessions:
      errors:
        clave_contraste_missing: The non-QR Cl@ve Móvil route needs the contraste
          printed on your document. Record %{nie_field} on the active profile for
          a NIE, or %{dni_field} for a DNI, before any AEAT session can be used.
        clave_identity_malformed: The Cl@ve identity is not a valid Spanish tax identifier,
          so it cannot be confirmed to belong to this profile.
        clave_identity_missing: Cl@ve live auth requires a DNI/NIE. Record it on the
          active profile as %{identity_field}, or configure it for the provider with
          `aeat config auth configure`, before any AEAT session can be used.
        clave_identity_profile_mismatch: Cl@ve Móvil identity does not match the active
          profile tax identity; switch to the matching profile or update the profile
          before live AEAT auth.
        clave_route_missing: Cl@ve Móvil live authentication requires %{route_field}.
          Open Identification in the profile manager, choose QR code or Request in
          app, save it, and retry sync.
        corrupt_session: Your saved authentication session is damaged and cannot be
          read. Run `aeat config auth logout` and then `aeat config auth test`.
        no_session: No active AEAT session; run `aeat config auth test` before reading
          AEAT data.
        profile_identity_cleared: Live AEAT authentication needs the active profile's
          fiscal ID, and this profile has none. Restore %{requirements} on the profile,
          then authenticate again.
        profile_identity_malformed: This profile's fiscal identity is not a valid
          Spanish tax identifier, so a Cl@ve session cannot be confirmed to belong
          to it.
        profile_tax_id_missing: Cl@ve Móvil live auth requires the active profile
          to carry %{requirements}.
        provider_close_failed: AEAT browser session could not be closed safely; retry
          authentication before reading AEAT data.
        sede_rejected: AEAT session is not accepted by the AEAT Sede; run `aeat config
          auth test` before reading AEAT data.
        session_expired: AEAT session is expired; run `aeat config auth test` before
          reading AEAT data.
        session_identity_profile_mismatch: AEAT session identity does not match the
          active profile tax identity; clear auth sessions and authenticate the matching
          profile before live AEAT reads.
        state_missing: AEAT session state is missing; run `aeat config auth test`
          before reading AEAT data.
        verify_failed: AEAT session could not be verified; run `aeat config auth test`
          before reading AEAT data.
  calculations:
    binding_prefill:
      errors:
        observation_merge_key_conflict: 'Observations for different modelo, year or
          period keys cannot be merged: {primary_modelo} {primary_filing_year} {primary_period}
          against {overlay_modelo} {overlay_filing_year} {overlay_period}.'
        selector_filing_year_delta_type: The registry binding selector 'filing_year_delta'
          must be a whole number or a numeric string; it carries {observed_type}.
          Correct the binding selector in the registry.
        selector_source_periods_member_type: Every entry in the registry binding selector
          'source_periods' must be a period code. Correct the binding selector in
          the registry.
        selector_source_periods_type: The registry binding selector 'source_periods'
          must be a period code or a tuple of period codes; it carries {observed_type}.
          Correct the binding selector in the registry.
    errors:
      observation_displaces_official_evidence_app_filing: 'This modelo, year and period
        already holds evidence captured from AEAT ({existing_source_kind}), so a locally
        computed filing cannot be saved over it. A local recalculation is not the
        authority for what was filed: if it is correct, file the correction with AEAT
        and pull the result back. The captured evidence cannot be recovered through
        any path this application exposes.'
      observation_displaces_official_evidence_manual: This modelo, year and period
        already holds evidence captured from AEAT ({existing_source_kind}). Saving
        a manual figure here replaces it, and the replaced evidence cannot be recovered
        through any path this application exposes. Re-run with the replace-official-evidence
        option if displacing it is intended.
    iva_compensation:
      errors:
        annual_partition_casilla_ids_noncanonical: Modelo 303 compensation observations
          must use the casilla identifiers declared by revision {revision_id}; {casilla_ids}
          are not declared.
        correction_missing: No seeded compensation record exists for %{filing_year}/%{period};
          correction overwrites an existing seed, it does not create one.
        history_casilla_undeclared: Casilla {casilla_id} is not declared by modelo
          {modelo} revision {revision_id}, so no legal reference can be attached to
          it. Correct the casilla reference.
        history_operand_ref_value_arity: Casilla {casilla_id} supplies {operand_ref_count}
          operand references but {operand_value_count} operand values, so its formula
          provenance would be incomplete.
        history_operand_refs_diverge_from_formula: Casilla {casilla_id} supplies operand
          references {supplied_operand_refs} but formula {formula_id} projects {formula_operand_refs}.
        history_operand_refs_without_formula: Casilla {casilla_id} supplies operand
          references but modelo {modelo} revision {revision_id} declares no formula
          for it.
        local_recurrence_modelo_303_only: Local IVA compensation recurrence is reconstructed
          only for Modelo 303; modelo {modelo} was supplied.
        modelo_303_only: IVA compensation history only accepts Modelo 303 observations.
        modelo_390_only: IVA compensation annual summary only accepts Modelo 390 observations.
        observed_casilla_ids_noncanonical: IVA compensation observations must use
          the casilla identifiers declared by modelo {modelo} revision {revision};
          {casilla_ids} are not declared.
        repository_backend_split: The Modelo 303 observation store and the IVA compensation
          history store must share one encrypted backend so both writes settle together.
        seed_conflict: An IVA compensation state already exists for this period; seeding
          would overwrite stored history.
    iva_wallet:
      errors:
        decision_blocks_calculation: The IVA wallet decision for {target_year} {target_period}
          is blocked by the divergence {divergence}. Resolve the divergence before
          calculating.
        decision_no_selected_amount: The IVA wallet decision for {target_year} {target_period}
          carries no selected amount, so no compensation value can be bound.
        decision_repository_backend_split: The IVA wallet decision store and the calculation
          observation store must share one encrypted backend when the decision is
          persisted.
        decision_target_mismatch: The stored IVA wallet decision targets {decision_target_year}
          {decision_target_period} but the work unit is {context_filing_year} {context_period}.
        modelo_303_only: IVA compensation wallet reconciliation applies only to Modelo
          303; modelo {modelo} was supplied.
    m303_carry:
      errors:
        available_compensation_amount_missing: The validated Modelo 303 carry envelope
          carries no available compensation amount in casilla {casilla_id}.
        available_compensation_formula_missing: Revision {revision_id} declares no
          formula for casilla {target_casilla_id}, so the generated-basis available
          compensation cannot cite one.
        carry_operands_disagree_with_formula: The carry operands {derivation_operands}
          disagree with the registry formula operands {registry_operands}. Only a
          registry correction can resolve this; there is no safe automatic recovery.
        declaration_type_code_invalid: The declaration type source header at {source_locator}
          carries {value}, which is not a result disposition code.
        declaration_type_code_not_admitted: The declaration type source header at
          {source_locator} carries {value}, a code the Modelo 303 diseño de registros
          does not admit.
        disposition_resultado_sign_incompatible: The declared disposition {disposition}
          could not have been selected for a filed resultado of {resultado}. Only
          the taxpayer can decide which one is correct; there is no safe automatic
          recovery.
        duplicate_declaration_type_headers: Modelo 303 carry evidence carries {header_count}
          {header_key} source headers; exactly one is required.
        envelope_not_normalized: Modelo 303 carry history requires an already normalised
          disposition-aware available and generated pair. Re-ingest the filed observation.
        generated_compensation_amount_missing: The validated Modelo 303 carry envelope
          carries no generated compensation amount in casilla {casilla_id}.
        incomplete_supported_operands: 'Modelo 303 carry normalisation cannot derive
          the available compensation from the casillas present: {casilla_ids}.'
        invalid_registry_observation: Modelo 303 carry ingress requires a registry
          modelo observation; it received {observed_type}.
        local_disposition_header_disagreement: The locally filed result disposition
          {typed_disposition} disagrees with the declaration type header {header_disposition}.
          Only the taxpayer can decide which one was filed; there is no safe automatic
          recovery.
        local_filing_disposition_required: Local Modelo 303 filing carry evidence
          must carry the result disposition determined at the filing boundary; the
          {source_kind} evidence carries none.
        local_filing_provenance_required: A local Modelo 303 filing disposition must
          retain its app_filing provenance; it carries {provenance_kind}.
        non_m303_envelope: Modelo 303 carry history accepts only Modelo 303 observations;
          modelo {modelo} was supplied.
        official_declaration_type_header_required: Official Modelo 303 carry evidence
          must carry exactly one {header_key} source header; the {source_kind} evidence
          carries none.
        official_disposition_header_disagreement: The typed result disposition {typed_disposition}
          disagrees with the AEAT declaration type header {header_disposition}. Only
          the taxpayer can decide which one was filed; there is no safe automatic
          recovery.
        resultado_casilla_required: Modelo 303 carry normalisation requires the filed
          resultado casilla {casilla_id}, which the observation does not carry.
        supplied_available_contradicts_derivation: The supplied available compensation
          {supplied_available} contradicts the {basis} derivation {derived_available}.
          Only the taxpayer can decide which figure was filed; there is no safe automatic
          recovery.
        supplied_pair_contradicts_derivation: The supplied available and generated
          pair {supplied_available} and {supplied_generated} contradicts the {basis}
          derivation {derived_generated}. Only the taxpayer can decide which figures
          were filed; there is no safe automatic recovery.
        unsupported_provenance: Modelo 303 carry normalisation accepts only official
          AEAT evidence or a local app filing; the evidence carries {source_kind}.
    maritime_exemption:
      errors:
        art_7p_inputs_required: Art. 7.p) eligibility applies, so both the annual
          salary and the qualifying days are required. Supply the missing figures.
        rebeca_input_required: REBECA eligibility applies, so the gross navigation
          income is required. Supply the missing figure.
    observations:
      errors:
        casilla_ids_noncanonical: Calculation observations must use the casilla identifiers
          declared by modelo {modelo} revision {revision_id}; {casilla_ids} are not
          declared.
        decision_taxpayer_nif_blank: The taxpayer NIF on the reconciliation decision
          must not be blank.
        filing_year_out_of_range: The observation filing year {filing_year} is outside
          the supported range {minimum} to {maximum}.
        iva_wallet_target_year_out_of_range: The IVA wallet target year {target_year}
          is outside the supported range {minimum} to {maximum}.
        member_nif_blank: The grupo member NIF must not be blank when it widens the
          observation key.
        period_type_invalid: The observation key requires a period value; it received
          {observed_type}.
        registry_snapshot_missing: The casilla identifiers cannot be validated because
          no registry revision resolves for modelo {modelo}, year {filing_year}, period
          {period}.
        taxpayer_nif_blank: The taxpayer NIF must not be blank when it forms the IVA
          wallet decision key.
    row_set:
      errors:
        grouping_dispatch_fell_through: 'The row-set grouping {grouping} resolved
          to an assembler that did not run. Report this: the dispatch table is inconsistent.'
        grouping_has_no_assembler: The row-set grouping {grouping} has no assembler
          in this application; the groupings without one are {unassemblable_groupings}.
        percepcion_clave_missing: Row {row_index} declares no clave. A percepción
          must state its AEAT clave, per the Modelo 190 and 193 diseño de registros,
          registro de tipo 2. Supply the clave.
        percepcion_clave_unsupported: Row {row_index} declares the AEAT clave {clave},
          which this application does not support.
        row_assembly_failed: 'Row {row_index} could not be assembled: {validation_error_detail}.
          Correct the row and pull again.'
        row_index_not_positive: The row-set cell row index must be a positive whole
          number; it carries {row_index}.
  filing:
    build_draft:
      errors:
        binding_data_type_unsupported: The registry binding declares a data type no
          filing input channel supports.
        binding_family_has_no_input_channel: The registry binding's value family has
          no filing input channel.
        binding_provenance_missing: The registry binding is missing its legal and
          source grounding.
        binding_row_key_not_positive_integer: A binding input row key must be a positive
          whole number.
        binding_text_value_invalid: The binding text value does not match its declared
          registry data type.
        binding_value_not_boolean: The binding input value is not a recognised yes
          or no value.
        binding_value_not_integer: The binding input value must be a whole number.
        date_binding_not_iso: The date binding value is not an ISO 8601 date.
        findings_under_fail_on_warning: Draft validation produced findings while warnings
          are treated as blocking.
        input_key_noncanonical_casilla: A filing input key uses a non-canonical casilla
          reference.
        input_key_not_string: Filing input keys must be text registry identifiers.
        input_key_padded: Filing input keys must not carry leading or trailing spaces.
        input_key_unknown: A filing input key is not declared by the registry revision.
        input_not_decimal: The filing input value must be a decimal amount.
        period_type_invalid: The filing period must be a typed period value.
        registry_calculation_failed: The registry calculation failed for this draft.
        registry_snapshot_unavailable: No registry snapshot is available for this
          modelo and period.
        schema_version_snapshot_mismatch: The schema provider version does not match
          the registry snapshot.
        text_casilla_invalid: The casilla text value does not match its declared registry
          data type.
        text_casilla_not_string: The casilla text input must be a text value.
        unsupported_filing_year: Filing year {filing_year} is not declared supported.
          The registry declares {supported_filing_years}. Admit the year in {declaration}
          after grounding its prerequisites.
    complementaria:
      errors:
        justificante_csv_absent: The complementaria requires the original filing's
          justificante CSV.
        no_changed_casilla: The complementaria requires at least one changed casilla.
        original_draft_addressing_mismatch: The original filing and the stored draft
          declare a different modelo or period.
        original_draft_snapshot_stale: The original draft was not built from the active
          registry snapshot.
        original_submission_csv_blank: The original filing must carry an official
          justificante CSV.
        original_submission_fields_missing: The original filing is missing required
          fields.
        original_submission_shape_invalid: The original filing does not match the
          expected record shape.
    errors:
      amendment_not_persisted: no persisted amendment with id %{amendment_id}
      complementaria_taxpayer_identity_absent: 'complementaria requires a declared
        taxpayer identity: the submitted filing''s profile_tax_id is %{submitted_tax_id}
        while the original draft declares %{draft_tax_id}'
      complementaria_taxpayer_identity_malformed: 'complementaria cannot confirm one
        taxpayer: the submitted filing''s profile_tax_id %{submitted_tax_id} is not
        a valid NIF, NIE or CIF, and the original draft declares %{draft_tax_id}'
      complementaria_taxpayer_identity_mismatch: 'complementaria taxpayer identity
        diverges: the submitted filing declares profile_tax_id %{submitted_tax_id}
        and the original draft declares %{draft_tax_id}; both must name one taxpayer'
      import_failed: 'cannot import modelo %{modelo}: %{detail}'
      modelo_not_in_registry: modelo %{modelo} is not present in the calculation registry
      original_draft_not_persisted: original draft %{draft_id} is not persisted
      period_ejercicio_mismatch: 'modelo %{modelo}: cannot canonicalise period %{period}
        for ejercicio %{ejercicio}'
      unexpected_ejercicio: 'modelo %{modelo}: unexpected ejercicio %{ejercicio};
        want four-digit year'
      unknown_severity_threshold: The severity threshold is not a known severity level.
    export:
      errors:
        draft_not_approved: Export requires an approved draft.
        draft_snapshot_stale: Export requires a draft built from the active registry
          snapshot.
        layout_not_renderable: This modelo cannot produce a local declaration export
          file.
        post_write_verification_refused: Post-write verification refused the exported
          declaration file.
        receipt_artefact_unreadable: The export receipt names a file that cannot be
          read.
        receipt_byte_size_mismatch: The exported file's size does not match the export
          receipt.
        receipt_digest_mismatch: The exported file's digest does not match the export
          receipt.
        rendered_payload_empty: The export layout produced an empty declaration payload.
        verify_draft_snapshot_stale: Verification requires a draft built from the
          active registry snapshot.
    export_parity:
      errors:
        aux_block_undeclared: The export layout cannot write the declaration's mandatory
          Aux block.
        casilla_metadata_drift: Casilla numbering or segmento drifts from the registry
          record design.
        rate_boxes_understate_total: The rate boxes do not account for their own declared
          total.
        record_emit_order_drift: The export would emit records out of the registry-declared
          order.
        record_emit_order_duplicated: Export records share an emit order, so the record
          sequence is ambiguous.
        required_casillas_omitted: The export would omit required casillas the official
          record files.
    import:
      errors:
        period_token_undeclared: The period token is not declared by the active registry
          revision.
        period_token_unrepresentable: The period token cannot be represented as a
          filing period.
    m303_exonerado_390:
      errors:
        record_design_snapshot_mismatch: The exonerado-390 record design does not
          match the selected snapshot.
        record_design_source_not_snapshot_owned: The exonerado-390 record design source
          is not owned by the snapshot.
    m303_export_applicability:
      errors:
        filing_facts_absent: Modelo 303 export requires assembled filing facts.
        filing_facts_period_mismatch: The Modelo 303 filing facts do not match the
          export period.
        layout_not_snapshot_owned: The Modelo 303 export layout is not owned by the
          selected snapshot.
        producer_snapshot_incomplete: The Modelo 303 filing producer snapshot is incomplete.
        producer_snapshot_wrong_modelo: The producer snapshot does not belong to Modelo
          303.
        regularisation_result_not_canonical: The Modelo 303 regularisation result
          is not the canonical projection.
        snapshot_period_mismatch: The Modelo 303 registry snapshot does not match
          the export period.
    m303_prorrata_activity_rows:
      errors:
        activity_rows_incomplete: The Modelo 303 per-activity prorrata rows are incomplete.
    review:
      errors:
        approved_by_blank: The approver identifier must not be blank.
        draft_not_ready: Only drafts ready to submit may be approved.
        registry_review_mismatch: 'The draft does not match the registry review surface:
          %{codes}.'
      stale_reasons:
        approval_basis_version_changed: approval basis version changed
        category_profiles_changed: category profiles changed
        draft_payload_changed: draft payload changed
        draft_review_changed: draft validation surface changed
        invoice_catalogue_changed: invoice catalogue changed
        prior_filing_observations_changed: prior filing observations changed
        profile_activity_changed: taxpayer profile activity changed
        review_checksum_mismatch: The stored approval checksum does not match its
          approval basis
        schema_formula_changed: schema or formula provenance changed
        transaction_catalogue_changed: transaction catalogue changed
        unknown: '%{reason}'
    runtime:
      errors:
        active_profile_load_failed: 'The active filing profile could not be loaded:
          %{reason}.'
        ambiguous_casilla_schema: 'Internal error: the runtime casilla schema is ambiguous
          (duplicate casilla.id values or dangling formula references).'
        blank_modelo_selection: Requested modelo selection must not contain blank
          modelo ids.
        filing_year_period_mismatch: 'Internal error: filing year {filing_year} does
          not match the supplied period {period}.'
        filing_year_period_pair: filing_year and period must be supplied together.
        modelo_not_in_registry: Modelo %{modelo} is not present in the calculation
          registry.
        modelo_revision_missing: Modelo %{modelo} has no revisions.
        period_type: 'Internal error: the runtime schema provider requires a Period
          object; received {period_type}.'
        provider_year_missing: Modelo %{modelo} revision %{revision} has no provider
          year.
