          cannot_clear: 'This value can''t be cleared: the field has to hold a value.'
          draft_incomplete: A new movement needs a booked date, an amount, a currency,
            a direction and a description before it can be saved.
          mixed_needs_share: A Mixed movement needs a business share.
          needs_classification: This change needs the movement to be classified first.
          needs_withholding_category: The declared base and IVA add up to more than
            the money that moved. That gap is an IRPF withholding, and the movement
            declares no IRPF category.
          share_needs_mixed: A business share only applies to a Mixed movement.
          transfer_with_tax: A transfer between your own accounts carries no tax fields.
        fix:
          amount_signed: Write the amount without a sign, and let the direction say
            whether it came in or went out.
          cannot_clear: Keep the stored value.
          draft_incomplete: Fill in what the new movement is missing.
          mixed_needs_share: Enter the business share as a percentage, such as 50
            for 50%.
          needs_classification: Classify the movement as Business or Personal.
          needs_withholding_category: Name the IRPF category the withholding belongs
            to, or correct the base and the IVA so they add up to the amount.
          share_needs_mixed: Drop the share, or classify the movement as Mixed.
          transfer_with_tax: Take the tax fields off the transfer, or change its direction.
        share_refusal: 'That is not a share: write a percentage, such as 50 for 50%.'
  live:
    borrador:
      comparison:
        classification:
          agree: Agree
          differ: Differ
          not_comparable: Cannot be compared
          only_in_borrador: Only in the AEAT draft
          only_in_calculation: Only in your calculation
        evidence:
          borrador: Printed by the AEAT in its draft and imported here. It is an observation,
            not an authenticated filing.
          calculation: Worked out on this computer from your records. It is local,
            not a filing with the AEAT.
        reason:
          borrador_does_not_read_box: The draft import does not read this box, so
            a missing draft value says nothing about it.
          borrador_printed_no_value: Your calculation holds a value, but the AEAT
            draft prints none for this box.
          borrador_value_ambiguous: The AEAT draft holds more than one value for this
            box, so it cannot be compared.
          borrador_value_not_kept: The AEAT draft prints this box, but the import
            keeps no value for it, so it cannot be compared.
          calculation_blocked: Your calculation could not settle this box, so it cannot
            be compared.
          calculation_has_no_value: The AEAT draft prints a value, but your calculation
            holds none for this box.
          calculation_not_applicable: Your calculation shows this box does not apply
            to you, but the AEAT draft prints a value.
          not_applicable_zero: The AEAT draft prints zero, and your calculation shows
            this box does not apply to you.
          same_value: The AEAT draft and your calculation hold the same value.
          taken_from_borrador: Your calculation took this value from the AEAT draft,
            so the agreement does not confirm it independently.
          value_kinds_differ: One side holds an amount and the other a text, so they
            cannot be compared.
          values_differ: The AEAT draft and your calculation hold different values.
        stale:
          calculation_outdated: The rules changed after your calculation was saved,
            so it needs recalculating.
          calculation_used_other_capture: Your calculation was worked out from a different
            AEAT draft than the one compared here.
          newer_capture_refused: A draft you imported later is stored but cannot be
            read, so this comparison uses an earlier one.
        status:
          capture_refused: AEAT drafts are stored for this year, but none can be read
            under the current rules; import the draft again.
          compared: Your imported AEAT draft and your saved calculation were compared
            box by box.
          no_calculation: This declaration has no saved calculation yet, so the draft
            cannot be compared; calculate it first.
          no_capture: You have not imported an AEAT draft for this year, so there
            is nothing to compare.
          stale: Both were read, but they no longer describe each other, so recalculate
            or import the draft again before you rely on this comparison.
