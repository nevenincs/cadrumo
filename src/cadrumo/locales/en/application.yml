        (increase of the work expenses for an active worker with a disability) may
        apply to you. State the amount, or 0 if you are not an active worker.
      trabajo_expense_above_limit:
        colegio_profesional: Box [%{casilla_id}] (professional-body fees) states %{stated}
          EUR, above the legal limit of %{limit} EUR. Lower it to the limit or less.
        defensa_juridica: Box [%{casilla_id}] (legal-defence costs) states %{stated}
          EUR, above the legal limit of %{limit} EUR. Lower it to the limit or less.
      trabajo_income_unstated:
        decision_trabajador: Box [%{casilla_id}] (employer contributions made at your
          decision) is income from work that no payer certificate states. State the
          amount you received, or state that there is none.
        dependencia: Box [%{casilla_id}] (employer contributions to dependency insurance)
          is income from work that no payer certificate states. State the amount you
          received, or state that there is none.
        patrimonio_protegido: Box [%{casilla_id}] (contributions to the protected
          estate of a person with a disability) is income from work that no payer
          certificate states. State the amount you received, or state that there is
          none.
        prevision: Box [%{casilla_id}] (employer contributions to pension plans and
          welfare mutuals) is income from work that no payer certificate states. State
          the amount you received, or state that there is none.
      transaction_evidence_missing_deductible: An expense you deduct has no invoice
        or receipt attached. Attach it to the entry in your records.
      transaction_evidence_missing_output: An issued invoice on which you charge VAT
        has no supporting document. Attach it to the entry in your records.
      undetermined_mixed_use_contributor: The stored %{modelo} calculation for %{filing_year},
        period %{period}, counted %{rows} mixed-use expense(s) with no spending category
        at their stated share. Calculating now would hold them back until you assign
        the category. The stored values have not changed.
      withholding_count_exceeds_summary_perceptors: Modelo %{source_modelo} %{period}
        %{filing_year} counts %{declared_perceptors} payee(s) in box %{casilla_id},
        but modelo %{modelo} names only %{summary_perceptors} different payee(s) for
        the whole year. Everyone counted in that box must appear on the annual summary.
        Add the missing payees to this modelo's detail, or correct the count on modelo
        %{source_modelo}.
      withholding_count_not_cross_checked: 'Modelo %{modelo} %{filing_year} could
        not be compared with modelo %{source_modelo} for %{unchecked_periods}, because
        no declaration is recorded for those periods. Compared periods: %{checked_periods}.
        This does not mean nobody was paid in them.'
      withholding_detail_absent_against_ledger_evidence: 'Modelo %{modelo} %{filing_year}
        declares no payments to anyone, but your records show payments subject to
        withholding made that year: %{contradicting_invoice_count} received invoice(s)
        with withholding you must pay in as the payer, and %{contradicting_ledger_row_count}
        outgoing payment(s) in an IRPF withholding category. The withholding detail
        for modelo %{source_modelo} is empty, so nothing declares them. Enter them
        in this modelo''s per-payee detail before you check it.'
      withholding_detail_absent_attested: 'Modelo %{modelo} %{filing_year} declares
        no payments to anyone, and your profile records that you paid no income subject
        to withholding in the periods you confirmed. No annual summary is due for
        a year in which you paid none of the income it declares. Review the year if
        you paid exempt income, or income below the withholding threshold: those are
        declared even when nothing was withheld. This is a local preparation, not
        a submission to AEAT.'
      withholding_detail_absent_unproven: 'Modelo %{modelo} %{filing_year} declares
        no payments to anyone, and nothing confirms that: the withholdings detail
        for modelo %{source_modelo} is empty, and you have not confirmed for every
        period that nothing was withheld. Enter the payments for each payee in this
        modelo''s detail, or confirm each period in your profile.'
