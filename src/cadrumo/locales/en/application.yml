          so on a stored invoice it can be moved but not added or removed.
        operation_type_required: This IVA category needs a Modelo 349 operation key.
        other_invoice_rule: The ledger would refuse this invoice under another rule.
          Check its facts against the document.
        rectified_invoice_not_allowed: Only a factura rectificativa names an invoice
          it rectifies.
        rectified_invoice_required: A factura rectificativa must name the invoice
          it rectifies.
        series_required_for_rectificativa: A factura rectificativa must be issued
          in its own series.
        simplificada_not_for_intra_community: A factura simplificada cannot be issued
          for an exempt intra-community supply.
    lifecycle:
