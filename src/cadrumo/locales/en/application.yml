  iva_wallet:
    decision_reason:
      aeat_wallet_uncrosschecked: The latest valid AEAT wallet observation was selected;
        no local recurrence was available to cross-check it against.
      aeat_wallet_validated: The latest valid AEAT wallet observation matches the
        local recurrence for the previous Modelo 303 compensación.
      caller_zero_matches_local_authority: The caller-supplied zero matches the persisted
        local zero authority.
      filed_history_requires_override: There is no AEAT wallet evidence; the recurrence
        from your recorded filings needs an express override from you before the automatic
        result is produced.
      filed_history_zero: Your recorded filings for Modelo 303 establish a zero compensación
        to carry forward.
      first_period_zero_activity_start_uncontrasted: 'NOT CROSS-CHECKED: The first-period
        zero rests on the activity start date you entered; Cadrumo cannot check that
        date against current AEAT census information.'
      first_period_zero_aeat_wallet: The AEAT wallet confirms the previous compensación
        is zero in the first recorded IVA period.
      first_period_zero_local_recurrence: An initial local zero establishes that no
        previous compensación exists in the first recorded IVA period.
      local_calculation_calculation_grade: The previous Modelo 303 is only calculated
        here, not filed; its credit is carried at calculation grade until the AEAT
        wallet, the filed return or the amount you record for it confirms it.
      local_calculation_only: The credit carried from the previous Modelo 303 comes
        only from your own calculation of it. To check, file or export, record in
        the IVA balance the AEAT wallet, the filed return or the amount it declared.
      local_calculation_redeme_unstated: The previous Modelo 303 is calculated but
        not filed, and whether you are in the monthly refund register (REDEME) is
        not stated, so it is not known whether its credit carries forward. State your
        REDEME inscription or record in the IVA balance what that return declared.
      local_calculation_refund_undecided: The previous Modelo 303 is calculated but
        not filed, and its period lets you ask for a refund instead of carrying the
        credit forward (LIVA art. 115). Record in the IVA balance what that return
        declared.
      local_evidence_unreadable: A previous Modelo 303 record exists, but it cannot
        be read as evidence of credit carried forward and no AEAT wallet observation
        is available.
      local_recurrence_requires_override: The AEAT wallet is unavailable; the local
        recurrence requires an express taxpayer override before the automatic result
        is produced.
      local_recurrence_zero: The local Modelo 303 recurrence establishes a zero compensación
        to carry forward.
      no_usable_authority: There is no AEAT wallet observation and no usable local
        recurrence for the previous Modelo 303 compensación.
      stale_wallet_local_recurrence_requires_override: The AEAT wallet observation
        is stale; the local recurrence requires an express taxpayer override before
        the automatic result is produced.
      stale_wallet_no_local_recurrence: The AEAT wallet observation is stale and no
        alternative local recurrence is available.
      taxpayer_override: The express taxpayer override was selected; your separately
        recorded explanation states its basis.
      wallet_local_recurrence_divergence: The AEAT wallet and the local recurrence
        diverge; a review is required before the automatic result is produced.
  ledger:
    confirmation_block:
      served:
        ambiguous_identity: The counterparty's identity is not settled
        closure_discrepancy: The document's own figures do not add up
        contradicted_invoice_class: Its invoice class and corrective reference disagree
        contradicted_regime: The stated regime contradicts the tax charged
        undetermined_establishment: Where a party is established is not determined
        unmodelled_invoice_class: The invoice class it declares has no representation
          here
        unnumbered_invoice: The invoice number read is not a number
        unresolved_direction: It is not clear which party issued the document
    counterparty:
      findings:
        kind_contradicts_identifier_form: The filing name was stated for {declared},
          but the form of this Spanish tax identifier is that of {observed}. The name
          is stored as stated and nothing was changed; check which of the two is right.
      party_kinds:
        entity: an entity
        natural_person: a natural person
    draft_finding:
      breakdown_bases_disagree: The per-rate bases sum to {summed}, but the document
        states a taxable base of {base}. These are two readings of one document, and
        at least one is wrong.
      breakdown_cuotas_disagree: The per-rate cuotas sum to {summed}, but the document
        states a cuota of {cuota}. These are two readings of one document, and at
        least one is wrong.
      counterparty_territory_unknown: This document establishes no IVA territory for
        {tax_id}. The country and postal code settled nothing and no confirmed fact
        is on record, so the territory is unknown rather than the mainland.
      customer_postal_code_unreadable: The recipient's postal code field holds "{printed}",
        which is not a five-digit postal code, and the printed country does not settle
        where the recipient is established. Its Spanish IVA territory stays undetermined.
      document_issued_confirmed_received: This document shows you as the issuer, but
        it is being confirmed as a received invoice. The direction decides which informative
        return the record feeds and on which side, and the AEAT matches both parties'
        returns against each other.
      document_received_confirmed_issued: This document shows you as the recipient,
        but it is being confirmed as an issued invoice. The direction decides which
        informative return the record feeds and on which side, and the AEAT matches
        both parties' returns against each other.
      every_identifier_failed: Every identifier the document prints for the counterparty
        failed its check, so the counterparty cannot be identified from this document.
      every_identifier_failed_own_unavailable: Every identifier the document prints
        for the counterparty failed its check, so the counterparty cannot be identified
        from this document. Your own identifier was not available to exclude.
      facturae_corrective_without_reference: The Facturae invoice class "{code}" declares
        a corrective invoice, but the document names no invoice it corrects.
      facturae_reference_without_corrective: The document names an invoice it corrects,
        but its Facturae invoice class "{code}" is not corrective.
      facturae_summary_unmodelled: The Facturae invoice class "{code}" declares a
        summary invoice, which is not supported here.
      filer_profile_unresolvable: No taxpayer profile could be read, so your own IVA
        territory is unknown. It comes from your profile ({fact}) and is never read
        from an invoice.
      flat_cuota_not_rate_of_base: The stated cuota {cuota} is not {rate}% of the
        stated base {base} ({expected}). Either a figure was misread or the invoice
        charges more than one rate and the per-rate split is missing. Modelo 303 declares
        base and cuota per rate, so confirming this would file the whole base under
        the wrong one.
      identity_readings_compete: '{count} readings of {field} compete and none can
        be decided. Confirming would choose one real taxpayer''s identifier over another''s.'
      invoice_number_without_digit: The invoice number read, "{number}", contains
        no digit, so it cannot be the document's invoice number. It is likely a heading
        or label read in its place.
      lone_identifier_without_role: The identifier "{printed}" is valid, but nothing
        on the document ties it to the counterparty. Accepting it only because it
        is the one left could name an unrelated entity that happens to appear on the
        page.
      mention_expects_no_repercutido_line: The document prints the mention "{mention}"
        ({provision}), which expects no charged IVA, but a rate and cuota are printed.
        The document disagrees with itself, so the IVA category cannot be taken from
        either side.
      mention_expects_repercutido_line: The document prints the mention "{mention}"
        ({provision}), which expects a charged IVA rate and cuota, but none is printed.
        The document disagrees with itself, so the IVA category cannot be taken from
        either side.
      printed_breakdown_disagrees: The per-rate figures sum to {summed}, but the document
        prints {printed}.
      printed_iva_not_rate_of_base: The printed IVA {amount} is not {rate} of the
        printed base {base}. The figures were left empty rather than one of them chosen.
      printed_payable_not_closed: The printed amount payable {payable} is not the
        total less the retención ({expected}). The retención was left empty.
      printed_recargo_not_rate_of_base: The printed recargo {amount} is not {rate}
        of the printed base {base}. The figures were left empty rather than one of
        them chosen.
      printed_retention_not_rate_of_base: The printed retención {retention} is not
        {rate} of the taxable base ({expected}). The rate was left empty.
      printed_total_not_closed: The printed total {total} is not base plus cuota plus
        recargo plus suplidos ({computed}). The figures were left empty rather than
        one of them chosen.
      retention_not_rate_of_base: The stated retención {retention} is not {rate}%
        of the taxable base ({expected}). The cash actually paid cannot be derived
        from figures that disagree.
      several_identifiers_compete: '{count} identifiers could each be the counterparty.
        Choosing one by its position would be a guess.'
      supplier_postal_code_unreadable: The issuer's postal code field holds "{printed}",
        which is not a five-digit postal code, and the printed country does not settle
        where the issuer is established. Its Spanish IVA territory stays undetermined.
      tax_id_fails_check: The document prints "{printed}" as a tax identifier, but
        it fails its check character, so it was not accepted as a verified identity.
      tier_cuota_not_rate_of_base: The rate {rate}% states a cuota of {cuota} on a
        base of {base}, which should be {expected}. Modelo 303 declares cuota per
        rate, so this rate would declare the wrong figure.
      total_not_closed: The printed total {total} does not equal base plus cuota plus
        recargo plus suplidos ({computed}). A component was misread, or the document
        carries one this draft cannot represent.
      unidentified_counterparty_territory_unknown: This document establishes no IVA
        territory for the counterparty, and prints no identifier for it. The country
        and postal code settled nothing and no confirmed fact is on record, so the
        territory is unknown rather than the mainland.
      value_in_other_party_block: The value in {field} is printed inside the other
        party's block on this document, not inside the block it was assigned to. The
        address blocks may have been read the wrong way round, which would place both
        parties in the wrong IVA territory.
      withheld_named_tax: The document states {amount} withheld for the tax "{tax}",
        which its format does not identify as IRPF, so it was not read as a retención.
        State the retención if it is one.
      withheld_not_rate_of_base: The withheld {amount} is not {rate}% of its stated
        base {base} ({expected}).
      withheld_total_disagrees: The document totals {stated} withheld, but its withheld
        taxes sum to {summed}.
      withheld_unnamed_tax: The document states {amount} withheld without naming the
        tax, so it was not read as an IRPF retención. State the retención if it is
        one.
