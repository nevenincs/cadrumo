        sealed_invoice_refused: Invoice %{invoice_id} was read by the Modelo %{modelo}
          of %{filing_year} %{period} (%{revision_state}, revision %{calculation_revision_id}),
          so this change is refused to keep those figures true. If it has not been
          filed, discard that work with `aeat app modelo work discard` and calculate
          again. If it has, issue a corrective invoice and file an amendment.
    linking:
