application:
  actividad_asset:
    served:
      handoff:
        gap_accrued: 'Modelo 100: {name} has no depreciation charge recorded from
          {start} to {end}. The {amount} it accrued in that time is not in the amounts
          above.'
        gap_box_unbound: 'Modelo 100: this edition has no box for the depreciation
          of {name}, so nothing is declared for it from {start} to {end}.'
        gap_free: 'Modelo 100: {name} has no depreciation charge recorded from {start}
          to {end}. Its method leaves the amount to you, so none can be worked out.'
        gap_unavailable: 'Modelo 100: {name} has no depreciation charge recorded from
          {start} to {end}, and it could not be worked out.'
        left_out:
          agrarian_count: 'Left out of Modelo 130, because they belong to an agricultural
            activity, which pays a share of income: {count} elements.'
          agrarian_count_one: 'Left out of Modelo 130, because it belongs to an agricultural
            activity, which pays a share of income: 1 element.'
          agrarian_named: 'Left out of Modelo 130, because they belong to an agricultural
            activity, which pays a share of income: {names}.'
          free_count: 'Not counted in Modelo 130, because their method leaves the
            depreciation charge to you: {count} elements.'
          free_count_one: 'Not counted in Modelo 130, because its method leaves the
            depreciation charge to you: 1 element.'
          free_named: 'Not counted in Modelo 130, because their method leaves the
            depreciation charge to you: {names}.'
          unavailable_count: '{count} elements couldn''t be worked out, so they are
            left out.'
          unavailable_count_one: 1 element couldn't be worked out, so it is left out.
          unavailable_named: 'Couldn''t be worked out, so left out: {names}.'
        partial: 'Partial: {count} elements can''t be worked out and are left out
          of this amount.'
        partial_one: 'Partial: 1 element can''t be worked out and is left out of this
          amount.'
        unnamed_element: an element with no name
      opening_remedy: Fill in “{field}” to work this out.
  aggregation:
    retenciones:
      window_empty: 'There is no withholding to declare on Modelo %{modelo} for %{period}:
        no payment in the period that carried one is recorded. Record the received
        invoice and its payment. Nothing has been saved.'
      window_empty_lease: 'There is no withholding to declare on Modelo %{modelo}
        for %{period}: no rent payment in the period that carried one is recorded.
        If you paid rent on business premises with withholding, record the received
        invoice and its payment; if there were none, say in your profile that this
        period had no rent payments with withholding. Nothing has been saved.'
      window_empty_work: 'There is no withholding to declare on Modelo %{modelo} for
        %{period}: no payment in the period that carried one is recorded. If you paid
        professionals or employees with withholding, record the received invoice and
        its payment; if there were none, say in your profile that this period had
        no withholding. Nothing has been saved.'
  auth:
    acquisition_lock:
      errors:
        acquire_failed: AEAT auth lock could not be acquired after stale-lock recovery.
        lock_held: Another AEAT auth operation is already in progress for this profile.
          Do not start a second Cl@ve request; wait for the running process to finish
          or let the lock expire if that process crashed.
    certificate:
      health:
        file_missing: The configured certificate file (%{path}) does not exist. Restore
          the file or run 'cadrumo-runtime config auth configure --provider certificate
          --file PATH' with a valid path.
        path_unset: No certificate file has been selected. Run 'cadrumo-runtime config
          auth configure --provider certificate --file PATH' to set one.
        unavailable: Certificate health is unavailable; see debug logs for diagnostic
          details.
      load:
        password_unset: No certificate password is configured. Set the certificate
          password before continuing.
        path_unset: No certificate file is configured. Run 'cadrumo-runtime config
          auth configure --provider certificate --file PATH' to set one.
    clave_movil:
      health:
        identity_unset: No DNI/NIE has been configured for Cl@ve Móvil. Configure
          one before continuing.
        operator_completion_required: Ready; you need to complete the Cl@ve step yourself.
    errors:
      session_field_not_datetime: Persisted session field {field} must be a datetime
        or ISO-8601 string.
    operator:
      alignment:
        both_missing_detail: Neither the Cl@ve identity (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          nor the active profile tax id is set. Set both to the same DNI/NIE before
          live AEAT auth.
        clave_identity_missing_detail: The Cl@ve identity (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          is not set, so it cannot be compared with the active profile tax id. Set
          it to the DNI/NIE of the active profile.
        mismatch_detail: The Cl@ve identity DNI/NIE '%{clave_identity}' does not match
          the active profile tax id '%{profile_tax_id}'. Live AEAT auth would bind
          one taxpayer's session to another profile. Switch to the profile whose tax
          id matches the Cl@ve DNI/NIE, or correct whichever value is wrong.
        profile_tax_id_missing_detail: The active profile has no tax id, so it cannot
          be compared with the Cl@ve identity. Set the profile tax id to the DNI/NIE
          used for Cl@ve.
      errors:
        certificate_file_required: The certificate provider requires a certificate
          file. Run `cadrumo-runtime config auth configure --provider certificate
          --file PATH` with the path to your PKCS#12 (.p12/.pfx) bundle.
        certificate_file_unresolved: The certificate path '%{certificate_path}' does
          not resolve to an existing file. Run `cadrumo-runtime config auth configure
          --provider certificate --file PATH` with a path to your PKCS#12 (.p12/.pfx)
          bundle.
        certificate_secret_mutation_in_progress: A certificate secret change is still
          being recovered for this profile. Retry that same secret command before
          changing authentication configuration.
        certificate_source_not_found: Certificate source '%{name}' is not registered.
          Run `cadrumo-runtime config auth certificate list` to see registered sources,
          or `cadrumo-runtime config auth certificate register --name %{name} --file
          PATH` to register it.
        cleanup_in_progress: An authentication logout or reset is still being recovered
          for this profile. Resume that operation before changing authentication configuration.
        dangling_active_profile: Active profile pointer '%{active_profile}' does not
          resolve to a registered profile bucket. Run aeat config profile list to
          inspect registered profiles, then aeat config login NAME or aeat config
          profile create NAME.
        no_active_bucket: No active profile bucket; run `aeat config profile create
          NAME` before configuring auth.
        provider_not_configured: No authentication provider is configured; specify
          --provider or configure one first.
        requires_custody_session: Auth operation targets profile '%{bucket_id}' at
          %{storage_root}, but that profile has no open custody session. Run aeat
          config login for that profile, then retry.
        revoke_requires_custody_session: The AEAT session for profile '%{bucket_id}'
          was NOT revoked and remains usable. It is stored encrypted inside that profile,
          so only unlocking that profile - with aeat config login - revokes it.
        scope_conflict: Choose either --provider or --all, not both.
        unreadable_active_profile: Active profile '%{active_profile}' has a bucket
          manifest but no readable profile record (status=%{status}). Run `%{next_action}`
          before configuring authentication.
      login:
        refused_certificate_file_missing: 'Cannot log in: the configured certificate
          file (%{path}) does not exist. Restore the file or reconfigure the path
          before continuing.'
        refused_certificate_path_unset: 'Cannot log in: no certificate file has been
          selected yet. Run ''cadrumo-runtime config auth configure --provider certificate
          --file PATH'' before continuing.'
        refused_clave_movil_identity_unset: 'Cannot log in with Cl@ve Móvil: no DNI/NIE
          has been configured yet. Configure one before continuing.'
        refused_live_tests_disabled: 'Live login is disabled by the safety gate: the
          tool only builds and checks locally. Enable live tests if you really intend
          to connect to AEAT, then re-run this command. Requested provider: %{provider}.'
      probe:
        certificate_corrupt: The certificate file is not a valid PKCS#12 envelope
          or the password is missing; it cannot be parsed.
        certificate_corrupt_detail: 'The certificate cannot be interpreted: %{error}.'
        certificate_expired: The certificate expired %{days} days ago. Renew it before
          authenticating.
        certificate_expiring: The certificate expires in %{days} days. Plan the renewal.
        certificate_file_missing: The configured certificate file (%{path}) does not
          exist.
        certificate_ok: Certificate valid; expires in %{days} days.
        certificate_path_unset: No certificate file has been selected.
        certificate_unreadable: The certificate file cannot be read (%{error}).
        clave_movil_identity_invalid: 'The DNI/NIE configured for Cl@ve Móvil is not
          valid: %{error}.'
        clave_movil_identity_ok: The DNI/NIE configured for Cl@ve Móvil has a valid
          shape.
        clave_movil_identity_unset: No DNI/NIE has been configured for Cl@ve Móvil.
        no_provider: No auth provider is configured; nothing to probe locally.
        no_session: No persisted AEAT session token on disk; run `cadrumo-runtime
          config auth login` to acquire one.
        session_expired: Session expired
        session_live: Session active
    provider_impact:
      certificate_ready: Certificate sign-in is ready. You keep the same command flow
        for AEAT reads; every provider uses the same commands.
      generic_ready: '%{label} is ready. You keep the same command flow while this
        provider uses the shared sign-in protocol.'
      unavailable: '%{label} is configured but not ready yet. You can still prepare,
        check and export declarations locally, but AEAT reads stay unavailable until
        sign-in is fixed.'
      unconfigured: You can still prepare, check and export declarations locally,
        but AEAT reads stay unavailable until a sign-in provider is configured.
    sessions:
      errors:
        clave_contraste_missing: Cl@ve Móvil signs in by default with an approval
          request to the Cl@ve app, which needs the `contraste` printed on your document.
          Record %{nie_field} on the active profile for a NIE, or %{dni_field} for
          a DNI. To scan a QR code in a visible browser instead, run `cadrumo-runtime
          config auth configure --provider clave_movil --clave-movil-route qr`.
        clave_identity_malformed: The Cl@ve identity is not a valid Spanish tax identifier,
          so it cannot be confirmed to belong to this profile.
        clave_identity_missing: Cl@ve live auth requires a DNI/NIE. Record it on the
          active profile as %{identity_field}, or configure it for the provider with
          `cadrumo-runtime config auth configure`, before any AEAT session can be
          used.
        clave_identity_profile_mismatch: Cl@ve Móvil identity does not match the active
          profile tax identity; switch to the matching profile or update the profile
          before live AEAT auth.
        corrupt_session: Your saved authentication session is damaged and cannot be
          read. Run `cadrumo-runtime config auth logout` and then `cadrumo-runtime
          config auth test`.
        no_session: No active AEAT session; run `cadrumo-runtime config auth test`
          before reading AEAT data.
        profile_identity_cleared: Live AEAT authentication needs the active profile's
          fiscal ID, and this profile has none. Restore %{requirements} on the profile,
          then authenticate again.
        profile_identity_malformed: This profile's fiscal identity is not a valid
          Spanish tax identifier, so a Cl@ve session cannot be confirmed to belong
          to it.
        profile_tax_id_missing: Cl@ve Móvil live auth requires the active profile
          to carry %{requirements}.
        session_identity_profile_mismatch: AEAT session identity does not match the
          active profile tax identity; clear auth sessions and authenticate the matching
          profile before live AEAT reads.
    sync:
      errors:
        requirements_missing: 'AEAT synchronization requires: {required_fields}. Open
          authentication settings beside synchronization to complete or edit them.
          {reasons}'
  bienes_inversion:
    served:
      disposal_regime_missing: 'The register refused the declaration: a disposal needs
        its regime as well as its year.'
      disposal_year_missing: 'The register refused the declaration: a disposal needs
        its year as well as its regime.'
      duplicate_identifier: 'The register refused the declaration: a good with the
        identifier %{identifier} is already declared.'
      validation: 'The register refused the declaration: it does not pass the register''s
        validation.'
  calculations:
    bienes_inversion_regularizacion:
      register_advisory: '%{count} capital good(s) in the regularisation period (LIVA
        arts. 107-110) for %{year}: %{computed} computed, %{pending} awaiting the
        definitive prorrata. Regularisation proposed for box %{casilla}: %{value}.
        Confirm the value before filing.'
      transmision_advisory: '%{count} capital good(s) transferred in %{year} require
        the single transfer regularisation (LIVA art. 110). Regularisation proposed
        for box %{casilla}: %{value}. Confirm the value before filing.'
    binding_prefill:
      errors:
        observation_merge_key_conflict: 'Observations for different modelo, year or
          period keys cannot be merged: {primary_modelo} {primary_period} {primary_filing_year}
          against {overlay_modelo} {overlay_period} {overlay_filing_year}.'
    iva_compensation:
      errors:
        annual_partition_casilla_ids_noncanonical: Modelo 303 compensation observations
          must use the casilla identifiers declared by revision {revision_id}; {casilla_ids}
          are not declared.
        correction_missing: No seeded compensation record exists for %{period} %{filing_year};
          correction overwrites an existing seed, it does not create one.
        history_casilla_undeclared: Casilla {casilla_id} is not declared by modelo
          {modelo} version {revision_id}, so no legal reference can be attached to
          it. Correct the casilla reference.
        history_operand_ref_value_arity: Box {casilla_id} supplies {operand_ref_count}
          operand references but {operand_value_count} operand values, so the trail
          of its formula would be incomplete.
        history_operand_refs_diverge_from_formula: Casilla {casilla_id} supplies operand
          references {supplied_operand_refs} but formula {formula_id} projects {formula_operand_refs}.
        history_operand_refs_without_formula: Casilla {casilla_id} supplies operand
          references but modelo {modelo} revision {revision_id} declares no formula
          for it.
        local_recurrence_modelo_303_only: Local IVA compensation recurrence is reconstructed
          only for Modelo 303; modelo {modelo} was supplied.
        modelo_303_only: IVA compensation history only accepts Modelo 303 observations.
        persistence: IVA compensation history storage failed during %{operation} (%{cause_type}).
        repository_backend_split: The Modelo 303 observation store and the IVA compensation
          history store must share one encrypted backend so both writes settle together.
        seed_conflict: An IVA compensation state already exists for this period; seeding
          would overwrite stored history.
    iva_wallet:
      errors:
        decision_blocks_calculation: The IVA wallet decision for {target_period} {target_year}
          is blocked by the divergence {divergence}. Resolve the divergence before
          calculating.
        decision_no_selected_amount: The IVA wallet decision for {target_period} {target_year}
          carries no selected amount, so no compensation value can be bound.
        decision_repository_backend_split: The IVA wallet decision store and the calculation
          observation store must share one encrypted backend when the decision is
          persisted.
        decision_target_mismatch: The stored IVA wallet decision targets {decision_target_period}
          {decision_target_year} but the declaration is {context_period} {context_filing_year}.
        modelo_303_only: IVA compensation wallet reconciliation applies only to Modelo
          303; modelo {modelo} was supplied.
    m303_carry:
      errors:
        available_compensation_amount_missing: The validated Modelo 303 carry envelope
          carries no available compensation amount in casilla {casilla_id}.
        available_compensation_formula_missing: Revision {revision_id} declares no
          formula for casilla {target_casilla_id}, so the generated-basis available
          compensation cannot cite one.
        carry_operands_disagree_with_formula: The carry operands {derivation_operands}
          disagree with the operands of the modelo definition's formula {registry_operands}.
          Only a correction to the modelo definitions can resolve this; there is no
          safe automatic recovery.
        casilla_id_invalid: The modelo definitions declare an invalid box for the
          Modelo 303 carry mapping key {mapping_key}.
        disposition_code_not_admitted: The result disposition code {code} is not admitted
          for the Modelo 303 carry.
        disposition_code_undeclared: The modelo definitions declare no code for the
          result disposition {disposition}.
        disposition_result_sign_incompatible: The declared disposition {disposition}
          could not have been selected for a recorded result of {resultado}. Only
          the taxpayer can decide which one is correct; there is no safe automatic
          recovery.
        duplicate_header_facts: Modelo 303 carry evidence carries {header_count} {header_key}
          source headers; exactly one is required.
        envelope_not_normalized: Modelo 303 carry history requires an already normalised
          disposition-aware available and generated pair. Re-import the recorded submission
          data.
        formula_mapping_required: Revision {revision_id} declares no Modelo 303 carry
          mapping, so the available compensation cannot cite its formula.
        generated_compensation_amount_missing: The validated Modelo 303 carry envelope
          carries no generated compensation amount in casilla {casilla_id}.
        header_code_invalid: The declaration type source header at {source_locator}
          carries {value}, which is not a result disposition code.
        header_code_not_admitted: The declaration type source header at {source_locator}
          carries {value}, a code the Modelo 303 diseño de registros does not admit.
        incomplete_supported_operands: 'Modelo 303 carry normalisation cannot derive
          the available compensation from the casillas present: {casilla_ids}.'
        invalid_registry_observation: Modelo 303 carry input requires an observation
          read from the modelo definitions; it received {observed_type}.
        local_disposition_header_disagreement: The result disposition recorded as
          filed {typed_disposition} disagrees with the declaration type header {header_disposition}.
          Only the taxpayer can decide which one was filed; there is no safe automatic
          recovery.
        local_filing_disposition_required: Local Modelo 303 filing carry evidence
          must carry the result disposition determined at the filing boundary; the
          {source_kind} evidence carries none.
        local_filing_provenance_required: A Modelo 303 disposition recorded as filed
          must keep its app_filing origin; it carries {provenance_kind}.
        non_target_modelo_envelope: Modelo 303 carry history accepts only Modelo 303
          observations; modelo {modelo} was supplied.
        official_disposition_header_disagreement: The typed result disposition {typed_disposition}
          disagrees with the AEAT declaration type header {header_disposition}. Only
          the taxpayer can decide which one was filed; there is no safe automatic
          recovery.
        official_header_required: Official Modelo 303 carry evidence must carry exactly
          one {header_key} source header; the {source_kind} evidence carries none.
        registry_resolution_unavailable: The modelo definitions could not resolve
          the Modelo {modelo} carry mapping for tax year {filing_year}, period {period}.
        registry_scope_invalid: The Modelo 303 carry needs a modelo and a period;
          it received modelo {modelo}, tax year {filing_year}, period {period}.
        result_casilla_required: Modelo 303 carry normalisation requires the recorded
          result box {casilla_id}, which the observation does not carry.
        supplied_available_contradicts_derivation: The supplied available compensation
          {supplied_available} contradicts the {basis} derivation {derived_available}.
          Only the taxpayer can decide which figure was filed; there is no safe automatic
          recovery.
        supplied_disposition_not_admitted: The supplied result disposition {disposition}
          is not admitted for the Modelo 303 carry.
        supplied_pair_contradicts_derivation: The supplied available and generated
          pair {supplied_available} and {supplied_generated} contradicts the {basis}
          derivation {derived_generated}. Only the taxpayer can decide which figures
          were filed; there is no safe automatic recovery.
        unsupported_provenance: Modelo 303 carry normalisation accepts only official
          AEAT evidence or a local app filing; the evidence carries {source_kind}.
    maritime_exemption:
      errors:
        art_7p_inputs_required: Art. 7.p) eligibility applies, so both the annual
          salary and the qualifying days are required. Supply the missing figures.
        rebeca_input_required: REBECA eligibility applies, so the gross navigation
          income is required. Supply the missing figure.
    observations:
      errors:
        casilla_ids_noncanonical: Calculation observations must use the casilla identifiers
          declared by modelo {modelo} revision {revision_id}; {casilla_ids} are not
          declared.
        decision_taxpayer_nif_blank: The taxpayer NIF on the reconciliation decision
          must not be blank.
        filing_year_out_of_range: The observation filing year {filing_year} is outside
          the supported range {minimum} to {maximum}.
        iva_wallet_target_year_out_of_range: The IVA wallet target year {target_year}
          is outside the supported range {minimum} to {maximum}.
        member_nif_blank: The group member NIF must not be blank when it widens the
          observation key.
        period_type_invalid: The observation key requires a period value; it received
          {observed_type}.
        registry_snapshot_missing: The box identifiers cannot be validated because
          no version of the modelo definitions resolves for modelo {modelo}, year
          {filing_year}, period {period}.
        taxpayer_nif_blank: The taxpayer NIF must not be blank when it forms the IVA
          wallet decision key.
    prorrata_regularizacion:
      target_casilla: box %{number}
      target_declared: the declared regularisation box
      unresolved:
        current_year_inputs: 'The prorrata regularisation needs these current-year
          values before it can be calculated: %{casillas}.'
        gross_negative: The gross deductible input VAT of the earlier liquidations
          is negative (%{amount}) after rectifications. The law gives no regularisation
          on a negative base, so rectify the deductions in the liquidations concerned
          and calculate the box yourself.
        provisional_missing: The %{year} prorrata regularisation needs the provisional
          percentage, from your prorrata register or from the prior year's filed settlement
          liquidation.
        regime_not_derived: 'The %{year} regularisation of input VAT used in common
          across differentiated sectors is not derived automatically: its percentage
          counts only the operations of the sectors that share the use and treats
          agriculture and equivalence-surcharge operations as without the right to
          deduct, which the declared volumes do not show. Calculate the box yourself
          before filing.'
        register_regime_not_apportioning: Your prorrata register records no apportioning
          regime for %{year}, but the declared volumes show operations without the
          right to deduct; correct the register or the volumes before regularising.
        sector_definitive_missing: 'These differentiated sectors have no settled definitive
          percentage for %{year}: %{sectors}; settle each sector before regularising.'
        selector_unmapped: The prorrata regularisation binding does not map to a resolver
          output.
        settlement_observation_ambiguous: More than one Modelo 303 settlement liquidation
          is filed (%{periods}); keep only the cadence you actually filed.
        settlement_observation_missing: The annual prorrata regularisation restates
          the filed Modelo 303 settlement liquidation, and none is filed for %{periods}.
        settlement_observation_refused: The filed Modelo 303 settlement liquidation
          %{periods} carries a form revision that no longer matches the one the law
          selects; recalculate and file it again.
        settlement_observation_without_regularizacion: The filed Modelo 303 settlement
          liquidation %{periods} carries no prorrata regularisation value.
        sin_derecho_volume_absent: Your register applies prorrata in %{year}, but
          the declared volumes show no operations without the right to deduct; the
          regularisation for that case is not derived automatically. Check the volumes
          or calculate the box yourself.
        source_period_cuotas_missing: 'Liquidation %{period} was filed without the
          deductible boxes the regularisation needs: %{casillas}.'
        source_period_gross_disagreement: Liquidation %{period} has deductible input
          VAT in the ledger with a gross base of %{ledger}, but you declared a gross
          base of %{declared} for it; correct the ledger or replace the declaration
          before regularising.
        source_period_gross_unavailable: Liquidation %{period} declared deductible
          input VAT, but the ledger holds no deductible input for it, so its gross
          input VAT before prorrata is unknown; record that period's input VAT in
          the ledger, or declare its gross input VAT with 'aeat app ledger prorrata
          declare-gross', before regularising.
        source_period_ledger_divergence: Liquidation %{period} declared %{filed} in
          %{casilla}, but its ledger input VAT at your provisional prorrata percentages
          gives %{expected}; reconcile the ledger with the filed liquidation before
          regularising.
        source_period_ledger_refused: The ledger input VAT of liquidation %{period}
          cannot be apportioned under your prorrata register; resolve that ledger
          refusal before regularising.
        source_period_operator_divergence: Liquidation %{period} declared %{filed}
          of deductible input VAT, but the gross base you declared for it at your
          provisional prorrata percentages gives %{expected}; reconcile the declaration
          with the filed liquidation before regularising.
        source_period_sector_gross_disagreement: Liquidation %{period} has deductible
          input VAT in the ledger for sector %{sector} with a gross base of %{ledger},
          but you declared a gross base of %{declared} for that sector; correct the
          ledger or replace the declaration before regularising.
        source_periods_missing: 'The regularisation covers the year''s earlier liquidations,
          and these are not filed: %{periods}.'
        source_periods_refused: 'These earlier liquidations carry a form revision
          that no longer matches the one the law selects: %{periods}; recalculate
          and file them again.'
        volumes_undeclared: Prorrata applies in %{year}, but the annual operation
          volumes are not declared (%{casillas}); declare them so the definitive percentage
          can be calculated.
  filing:
    build_draft:
      errors:
        binding_data_type_unsupported: The source of this box's value declares a data
          type that no filing input supports.
        binding_family_has_no_input_channel: The value family of this box's source
          has no filing input.
        binding_provenance_missing: The source of this box's value is missing its
          legal and source grounding.
        binding_row_key_not_positive_integer: The row key of an input value must be
          a positive whole number.
        binding_text_value_invalid: The text value does not match the data type declared
          for the box.
        binding_value_not_boolean: The input value is not a recognised yes or no value.
        binding_value_not_integer: The input value must be a whole number.
        date_binding_not_iso: The date value is not an ISO 8601 date.
        findings_under_fail_on_warning: Draft validation produced issues while warnings
          are treated as blocking.
        input_key_noncanonical_casilla: A filing input key uses a non-canonical casilla
          reference.
        input_key_not_string: Filing input keys must be text identifiers from the
          modelo definitions.
        input_key_padded: Filing input keys must not carry leading or trailing spaces.
        input_key_unknown: A filing input key is not declared by this version of the
          modelo definitions.
        input_not_decimal: The filing input value must be a decimal amount.
        period_type_invalid: The filing period must be a typed period value.
        registry_calculation_failed: The calculation failed for this draft.
        registry_snapshot_unavailable: No modelo definitions are available for this
          modelo and period.
        schema_version_snapshot_mismatch: The schema provider version does not match
          the modelo definitions in use.
        text_casilla_invalid: The box text value does not match the data type declared
          for the box.
        text_casilla_not_string: The casilla text input must be a text value.
    errors:
      persistence: Filing history storage failed during %{operation} (%{adapter_error}).
    export:
      errors:
        block_anchor_unstated: 'Nothing was written: box %{field_casilla_id} has a
          value, but box %{casilla_id}, which opens its block, has none. Enter box
