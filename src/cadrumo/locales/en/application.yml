          pointer.
        state_discard_audit_required: A discarded snapshot requires both a discard
          timestamp and a discarding actor.
        state_discard_metadata_forbidden: Only a discarded snapshot can carry discard
          metadata.
        state_discarded_supersession_pointer: A discarded snapshot cannot carry a
          supersession pointer.
        state_supersession_pointer_required: A superseded snapshot must carry its
          superseding snapshot id.
    verify:
      errors:
        bucket_id_blank: The bucket id of the check must not be blank.
        observation_bucket_mismatch: The bucket of the observation being checked does
          not match the store's bucket.
        observation_id_blank: The id of the observation being checked must not be
          blank.
        observation_id_mismatch: The id of the observation being checked does not
          match the requested observation.
        observation_key_mismatch: The observation being checked is stored under a
          different observation's key.
        observation_not_found: No observation matches the requested id.
        observation_prefix_ambiguous: The observation id prefix matches multiple observations.
  modelo:
    borrador_binding:
      errors:
        decimal_value_invalid: The borrador value for numeric source %{binding_id}
          must be decimal-compatible.
        forbidden_bindings: 'The borrador contains values that the modelo definitions
          have not marked as prefilled by AEAT: %{bindings}.'
        registry_snapshot_axis_mismatch: 'The year and period of the modelo definitions
          do not match the command: definitions year=%{snapshot_year} period=%{snapshot_period};
          command year=%{filing_year} period=%{period}.'
        registry_snapshot_modelo_mismatch: 'The modelo in the definitions does not
          match the command: definitions modelo=%{snapshot_modelo}; command modelo=%{command_modelo}.'
        snapshot_axis_mismatch: 'The borrador snapshot does not match the calculation
          axis: snapshot year=%{snapshot_year} period=%{snapshot_period}; calculation
          year=%{filing_year} period=%{period}.'
        snapshot_bucket_mismatch: The borrador snapshot does not belong to the active
          bucket.
        snapshot_load_failed: Cannot load the selected borrador snapshot; list active
          snapshots with aeat app live borrador 100 list.
        snapshot_not_active: Borrador snapshot is not active; list active snapshots
          with `aeat app live borrador 100 list`.
        unsupported_modelo: Reading borrador values is not supported for modelo %{modelo};
          the modelo definitions must declare the borrador capability.
    calc_diagnostic:
      activity_asset_accrual_unavailable:
        what: The depreciation charge of an asset could not be worked out, so it is
          not included.
        what_to_do: Complete or correct the asset in the register, then calculate
          again.
      activity_asset_activity_undeclared:
        what: The purchase of an asset has no type of activity, so it is counted as
          non-agricultural.
        what_to_do: Set the type of activity on that entry, then calculate again.
      activity_asset_agrarian_excluded:
        what: An asset of an agricultural activity is left out of this instalment,
          which is based on that activity's income.
        what_to_do: You do not have to do anything. Its depreciation charge is deducted
          in your annual return.
      activity_asset_claim_gap:
        what: An asset has no recorded depreciation charge for part of the year, so
          that part is not deducted.
        what_to_do: Record the depreciation charge for that period if you want to
          deduct it, then calculate again.
      activity_asset_disposal_finding:
        what: The disposal of an asset has a point you should check, though it does
          not stop this form.
        what_to_do: Check what this note says about the disposal, and record or correct
          it if it applies to you.
      activity_asset_foral_territory:
        what: You live in the Basque Country or Navarre in this period, where other
          rules govern amortisation. It is outside this calculation and no figure
          is deducted.
        what_to_do: Work out the amortisation under the foral rules of your territory
          and declare it with its tax authority.
      activity_asset_residence_period_unknown:
        what: Your profile records a tax residence, but none for this period, so your
          assets are counted as if this form applies.
        what_to_do: State where you lived in this period in your profile, then calculate
          again.
      activity_asset_residence_unresolved:
        what: Your recorded tax residence could not be read, so the amortisation of
          your registered assets is outside this calculation and no figure is deducted.
        what_to_do: State your tax residence in your profile, then calculate again.
      administrador_retencion_rate_mismatch:
        what: The withholding rate on a record for a company director differs from
          the rate that applies.
        what_to_do: Check that rate against the official instructions and correct
          the record if needed.
      advisory_binding_value:
        what: A figure in a box rests on a reading Cadrumo cannot confirm yet, so
          you can see and preview it, but you cannot check, export or record the declaration
          with it.
        what_to_do: Compare the figure with your records and the payer's certificate.
          While it is held back, Cadrumo cannot check, export or record this declaration;
          a later version that confirms the period will release it.
      aggregation_activity_undeclared:
        what: Box {box} shows zero, although you have income this period with no type
          of activity.
        what_to_do: Set the type of activity on those income entries, then calculate
          again.
      ascendant_disability_minimum_not_computed:
        what: An ascendant you apply the minimum for has a disability, and the disability
          minimum for that ascendant is not calculated yet, so the declaration cannot
          be checked, exported or filed.
        what_to_do: Check the disability facts of that ascendant in your profile.
          While the ascendant has a disability, this declaration cannot be completed
          here.
      autonomic_deducciones_not_enrolled:
        what: None of the regional deductions of your comunidad of residence is worked
          out for this year, so the total of regional deductions includes only the
          amounts you enter yourself.
        what_to_do: If any applies to you, enter its amount yourself in its box.
      calculation_screen_outdated:
        what: This calculation was made before Cadrumo's current checks on its figures,
          so it cannot be checked, exported or recorded as it stands.
        what_to_do: Calculate the declaration again, then check it.
      credit_cross_check_absent:
        what: A withholding credit has a source to compare it with that holds nothing,
          so the figure stands but is not cross-checked.
        what_to_do: If that source should hold this withholding, add it and recalculate;
          otherwise there is nothing to do.
      credit_resolution_applied:
        what: You accepted the amount in use for a disagreement between sources, so
          it no longer holds this declaration. The acceptance changes no figure.
        what_to_do: 'Nothing to do. If a source is corrected later, calculate again:
          an acceptance covers only the amounts it was made against.'
      credit_resolution_stale:
        what: You accepted an earlier disagreement of this figure, but its sources
          now state other amounts, so that acceptance no longer applies.
        what_to_do: Compare the amounts again. If the amount in use is still right,
          accept this disagreement with its new finding id.
      credit_source_disagreement:
        what: Two sources state different amounts for the same withholding credit,
          so Cadrumo cannot check, export or record the declaration with it.
        what_to_do: 'Compare the amount with each payer''s certificate, correct the
          source that is wrong, and recalculate. If you have checked that the amount
          in use is right, accept it with its finding id: `aeat app modelo work accept-disagreement
          <finding id> --reason <why>`.'
      declared_party_name_unresolved:
        what: A declared party has no filing name its record can carry, so its name
          field is left without content and the export refuses.
        what_to_do: 'State the party''s filing name: surnames and given name, or its
          razón social, and a shorter rendering where the field is narrower. Then
          calculate again.'
      deferred_binding_source:
        what: Cadrumo does not fill in one figure of this declaration automatically
          yet.
        what_to_do: No action is needed unless that figure applies to you. If it does,
          enter it yourself.
      devengo_date_proxy_attribution:
        what: Some invoices have no date for when the operation took place, so their
          issue date chose the period.
        what_to_do: Add the operation date to invoices near the end of a period, then
          calculate again.
      dt12_parcial_rescate_guidance:
        what: Partial withdrawals from the same pension plan share one time limit
          for the reduction in box {box}, counted once.
        what_to_do: Check that each withdrawal falls inside that time limit.
      dt12_regime_window_closed:
        what: The 40 % reduction in box {box} was not applied, because the time limit
          for this lump sum has passed.
        what_to_do: No action is needed. If the year of the event is wrong, correct
          it in your profile and calculate again.
      dt12_regime_window_unverified:
        what: The 40 % reduction for a pension paid as a lump sum was applied in box
          {box}, but its time limit was not checked.
        what_to_do: Give Cadrumo the year of the event behind the pension, then calculate
          again.
      duplicate_binding_owner:
        what: Cadrumo found a fault in how this declaration is set up, not in your
          data.
        what_to_do: Nothing to change in your records. Report it before you rely on
          the figures.
      duplicate_bound_casilla_owner:
        what: Cadrumo found a fault in how this declaration is set up, not in your
          data.
        what_to_do: Nothing to change in your records. Report it before you rely on
          the figures.
      duplicate_relation_owner:
        what: Cadrumo found a fault in how this declaration is set up, not in your
          data.
        what_to_do: Nothing to change in your records. Report it before you rely on
          the figures.
      filed_before_grade_cap:
        what: This declaration was recorded before the current checks on its figures,
          and one of its boxes holds a figure those checks hold back, so you cannot
          export it as it stands.
        what_to_do: Calculate the declaration again, check it and record it again;
          the new record replaces this one.
      household_row_fact_unstated:
        what: A person in your household is recorded without a fact the declaration
          requires, so the declaration cannot be checked, exported or filed until
          you state it.
        what_to_do: State the missing fact for that person in your profile, then calculate
          again.
      household_rows_incomplete:
        what: Your profile states more people in this group than it records, so the
          declaration uses only the people recorded and does not treat the group as
          complete.
        what_to_do: Add the missing people to your profile or correct the count, then
          calculate again.
      inferred_retencion_excluded_from_credit:
        what: Some withholding on your issued invoices was worked out from what the
          client paid, so it was left out of your credit and you may pay more than
          needed.
        what_to_do: Record the withholding your client applied on each issued invoice,
          or get their certificate, then calculate again.
      inferred_retencion_rate_unmatched:
        what: Cadrumo estimated a withholding from a shortfall in a payment, and it
          matches no official rate.
        what_to_do: If the difference was a bank fee or a discount, correct the record
          so no withholding is claimed.
      inferred_retencion_sectoral_rate_unconfirmed:
        what: Cadrumo estimated a 1 % or 2 % withholding from a payment shortfall,
          and a bank fee or a discount could explain it.
        what_to_do: Check the withholding against your client's invoice or certificate
          in your records, correct the record if it differs, and calculate again.
      inventory_book_claimed_purchase:
        what: A purchase of stock is left out of your expenses, because your inventory
          declares it as a purchase of stock.
        what_to_do: No action is needed.
      invoice_category_counterparty_mismatch:
        what: The VAT treatment of an invoice does not fit its customer's country,
          so the invoice was left out.
        what_to_do: Check the VAT category or the country on that invoice in your
          records.
      invoice_recargo_departs_from_published_rate:
        what: The equivalence surcharge recorded on an invoice differs from the official
          rate.
        what_to_do: Check the surcharge on that invoice in your records.
      invoice_recargo_not_attributable_to_a_tier:
        what: This return was calculated without the surcharge of an invoice that
          covers several VAT rates.
        what_to_do: 'Calculate again: the surcharge will be declared under each rate,
          or you will be shown the invoice to correct.'
      invoice_reverse_charge_cuota_not_derivable:
        what: A received invoice with reverse charge has no VAT rate, so the VAT you
          owe on it was not worked out.
        what_to_do: Record the VAT rate on that invoice in your records, then calculate
          again.
      iva_compensation_annual_source_evidence_failure:
        what: The yearly VAT to carry forward or offset rests on records that are
          missing proof.
        what_to_do: Check the VAT records of the whole year, add the missing proof,
          then calculate again.
      iva_operation_date_after_movement:
        what: Some ledger rows have an operation date after their bank date. If that
          money was an advance, its IVA fell due when it was collected.
        what_to_do: For an advance, set the operation date to the collection date
          and record the balance as its own row, then calculate again.
      iva_row_placed_on_movement_date:
        what: Some ledger rows have no operation date, so their bank date chose the
          IVA period. IVA falls due when the operation takes place, not when the money
          moves.
        what_to_do: Add the operation date to rows near the end of a period, then
          calculate again.
      iva_selected_scope_evidence_failure:
        what: The records behind the VAT in this declaration are missing proof or
          do not add up.
        what_to_do: Open your records for this period, fix the ones that are marked,
          then calculate again.
      ledger_amortization_row_unregistered:
        what: A ledger entry records the purchase of a long-term asset that is not
          in your asset register, so it deducts nothing.
        what_to_do: Register the element, naming that entry as its acquisition, or
          reclassify the entry, then calculate again.
      ledger_expense_may_be_durable:
        what: A ledger entry deducted as a current expense may be an asset that lasts
          more than a year. Is it?
        what_to_do: If it is, register the asset, because its cost is deducted through
          depreciation, then calculate again. If it is a consumable, leave the entry
          as it is.
      m193_settled_row_amounts_unresolved_authority:
        what: Some amounts in a record of a payment made in a later year have no official
          source that confirms them.
        what_to_do: Check those amounts against the official instructions before filing.
      m347_declarado_provincia_unrecorded:
        what: '{box} is missing for this declared party: it belongs to its tax domicile,
          which your invoices do not state.'
        what_to_do: Open its invoice and state the province of its tax domicile; it
          applies to all its invoices when you calculate again.
      m347_metalico_unrecorded:
        what: Your invoices do not say how they were collected, so {box} holds no
          amount on any record.
        what_to_do: If any declared party paid you in cash above the amount that must
          be declared, enter that amount on its record before you file the declaration.
      m349_clave_inferred_from_category:
        what: Cadrumo chose the operation type of a line in the EU sales listing from
          the invoice's VAT category, and it may be another type.
        what_to_do: Check the operation type on those invoices in your records and
          set it if it differs.
      m349_operation_unclassified:
        what: An invoice with a party in another EU country and no VAT does not say
          which intra-community operation it records, so the EU sales listing leaves
          it out.
        what_to_do: Open the invoice and set its operation type, then calculate again.
      missing_transaction_evidence:
        what: A movement that carries VAT has no invoice or document attached.
        what_to_do: Attach the invoice or receipt to that movement in your records.
      official_box_unpopulated:
        what: The total for box {box} is worked out, but the official boxes that make
          it up are all empty.
        what_to_do: Copy the amounts into the official boxes by hand, then check the
          declaration again.
      operator_override_diverges_from_computed:
        what: The value in box {box} is the one you entered, not the one Cadrumo worked
          out.
        what_to_do: Keep it only if you are sure. To use the worked-out value, calculate
          again without entering a value there.
      orphaned_override:
        what: A value you entered earlier no longer matches any box of this declaration,
          so it was not used.
        what_to_do: Check whether you still need it, and enter it again in the right
          box if so.
      oss_no_live_source:
        what: No invoice for the one-stop shop (OSS) was found for this period, so
          Cadrumo did not work out that tax.
        what_to_do: No action is needed if you made no such sales. Otherwise enter
          the amounts yourself.
      precedence_tier_divergence:
        what: Two sources hold different values for a figure that reaches box {box},
          and Cadrumo used the one that takes precedence.
        what_to_do: 'Compare the sources and correct the one that is wrong, then calculate
          again. Checking, exporting and recording wait until they agree, or until
          you accept the value in use with its finding id: `aeat app modelo work accept-disagreement
          <finding id> --reason <why>`.'
      precedence_tier_divergence_advisory:
        what: Two sources hold different values for a working figure, and Cadrumo
          used the one that takes precedence.
        what_to_do: Compare the sources and correct the one that is wrong. No exported
          box depends on this figure.
      prior_payment_minoracion_not_captured:
        what: The reduction that comes from earlier payments is not recorded in box
          {box}.
        what_to_do: Enter that reduction in box {box} if it applies to you.
      prior_payment_not_deducted:
        what: You recorded an earlier quarter as filed, but box {box} does not deduct
          what you paid then.
        what_to_do: Enter what you paid in earlier quarters in box {box}.
      prorrata_especial_check_unavailable:
        what: Cadrumo could not check whether the special VAT prorrata is compulsory
          for you.
        what_to_do: Check it yourself with the official rules or with your advisor.
      prorrata_especial_obligatoria:
        what: The special VAT prorrata may be compulsory for you, because of your
          mix of exempt and taxable activity.
        what_to_do: Check the VAT prorrata rules or ask your advisor, and apply the
          special prorrata if it is compulsory.
      prorrata_volume_check_unavailable:
        what: The annual ledger comparison is incomplete.
        what_to_do: Classify the output operations and review the prorrata exclusions.
      prorrata_volume_declaration_missing:
        what: The ledger has output operations to compare with annual prorrata volumes.
        what_to_do: Declare the annual volumes; the ledger does not replace them.
      prorrata_volume_divergence:
        what: Declared annual prorrata volumes differ from the classified ledger.
        what_to_do: Review the volumes and exclusions. Declared figures remain authoritative.
      rate_boxes_underaccount_total:
        what: Part of the VAT total in box {box} is not placed in any rate box.
        what_to_do: Check the VAT rate on your invoices and records, then calculate
          again. The declaration cannot be exported until this is fixed.
      register_acquisition_exceeds_ledger:
        what: The ledger entries behind an asset in your register paid less than its
          stated cost.
        what_to_do: Correct the price in your asset register or the ledger entry,
          then calculate again.
      register_acquisition_partly_accounted:
        what: An asset in your register accounts for only part of its ledger entry,
          so the rest deducts nothing.
        what_to_do: Register what else that entry paid for, or correct the asset's
          price, then calculate again.
      register_acquisition_row_missing:
        what: An asset in your register names a ledger entry that is no longer in
          your ledger.
        what_to_do: Enter that ledger entry again, or correct the asset in your register,
          then calculate again.
      register_owned_capital_acquisition:
        what: A purchase of equipment is left out of your expenses, because it is
          deducted through its yearly depreciation charge.
        what_to_do: No action is needed.
      reopen_hint: Calculate again to see the calculation's notes.
      settlement_not_computed:
        what: Box {box} holds the final settlement, and Cadrumo does not work it out.
        what_to_do: Enter the amount in box {box} and check it against the official
          instructions.
      source_domain_not_ready:
        what: The records this figure depends on are not ready to be read yet.
        what_to_do: Finish setting up or importing those records, then calculate again.
      source_issue:
        what: Some information this figure depends on is missing or could not be used.
        what_to_do: Check your records and your profile for what is missing, then
          calculate again.
      stale: From the last calculation. Calculate again to refresh.
      storage_degraded:
        what: Cadrumo could not read part of your saved records, so some figures may
          be incomplete.
        what_to_do: Calculate again. If it keeps happening, check that your data is
          reachable and report it.
      structurally_unroutable_base_category:
        what: This declaration has no box for the amounts of one category in your
          records.
        what_to_do: Look in the official instructions for where those amounts are
          declared; they are often reported elsewhere.
      terminal_origin_mismatch:
        what: A figure reached the declaration by a route Cadrumo cannot vouch for,
          so it cannot be trusted as it stands.
        what_to_do: Check where that figure comes from in your records, then calculate
          again. Report it if it stays.
      unclassified_declarant_role_fact:
        what: An invoice does not say whether it is unrelated to your business or
          a subsidy, and that decides how it is reported.
        what_to_do: Answer that question on the invoice in your records, then calculate
          again.
      unconverted_foreign_currency:
        what: An invoice in a foreign currency has no euro exchange rate, so it is
          left out of the listing.
        what_to_do: Add the exchange rate to that invoice in your records, then calculate
          again.
      ungrounded_income_substrate:
        what: Some income entries have no invoice with a tax base, so the bank amount
          was used and their withholding is left out.
        what_to_do: Link an issued invoice to each income entry, or enter its tax
          base, then calculate again.
      unhandled_binding_source:
        what: Cadrumo has no way yet to fill in a figure of this declaration from
          your data.
        what_to_do: Do not file that figure as it stands. Enter it yourself if you
          know it, and report the gap.
      unresolved_binding:
        what: Cadrumo could not work out a figure from your data, so it would have
          shown a silent zero.
        what_to_do: Add the missing records or profile details, or enter the value
          yourself, then calculate again.
      unresolved_derived_binding:
        what: A figure that Cadrumo works out from other figures could not be worked
          out.
        what_to_do: Check that the figures it depends on are filled in, then calculate
          again.
      unresolved_retencion_substrate:
        what: For some issued invoices Cadrumo cannot tell how much was withheld,
          so your withholding credit may be missing an unknown amount and you may
          pay more than needed.
        what_to_do: Enter the invoice base and the withholding for each of those invoices
          in your records, then calculate again.
      unrouted_declarable_quantity:
        what: Part of a record, such as a withholding or a tax base, reaches no box
          of this declaration.
        what_to_do: Check the classification and amounts of that record in your records,
          then calculate again.
      unrouted_observation:
        what: An amount from your records is not placed in any box of this declaration.
        what_to_do: Check how that record is classified in your records, then calculate
          again.
      unsettled_legal_reading:
        what: A declared figure follows one reading of a rule that is not settled
          for this year, and AEAT may read it differently.
        what_to_do: Check those operations against current AEAT guidance before you
          file.
      unusable_sales_invoice_evidence:
        what: An income entry is linked to an issued invoice that cannot be trusted,
          so the bank amount is declared and its withholding is lost.
        what_to_do: Repair the invoice link in your records, or enter the tax base
          directly, then calculate again.
      withholding_detail_absent:
        what: No withholding detail per recipient is recorded for the year, so a zero
          is shown without support.
        what_to_do: Add the detail records for the year in your records, then calculate
          again.
    calc_diagnostic_fact:
      accrual_unavailable: '{element}: its depreciation charge could not be worked
        out, so it is not included.'
      activity_undeclared: '{element}: its purchase has no type of activity and another
        of your assets is agricultural, so it counts as non-agricultural.'
      advisory_imputation_period_ungrounded: 'Box {box}: {amount} is held back because
        the period it belongs to is not confirmed. Activity income and expenses count
        when they accrue, and a withholding counts with its income (RIRPF art. 79),
        while your records date each entry by when it reached the bank, which is right
        only if you chose to declare when you are paid or pay (RIRPF art. 7.2; LIRPF
        art. 14.1.b).'
      advisory_value_proven_zero: 'Box {box}: the zero stands, because nothing in
        the period carries a figure whose period could be in doubt.'
      agrarian_excluded: '{element}: it belongs to an agricultural activity, so it
        is left out of the instalment for the period ending {period_end}.'
      amortization_box_unbound: '{element}: this edition has no box for its depreciation
        charge, so it adds nothing to this calculation.'
      ascendant_disability_minimum_not_computed: '{group}: {count} with a disability
        whose disability minimum is not calculated.'
      book_claimed_purchase: The ledger entry of {row_date} for {row_amount} is a
        purchase in your inventory, so it is declared as a purchase of stock rather
        than as an expense.
      book_claimed_purchase_undated: A ledger entry is a purchase in your inventory,
        so it is declared as a purchase of stock rather than as an expense.
      claim_gap_accrued: '{element}: no depreciation charge is recorded from {start}
        to {end}. {amount} accrued, and box {box} declares only what is recorded.'
      claim_gap_free_method: '{element}: no depreciation charge is recorded from {start}
        to {end}. Its method leaves the amount to you, so none can be worked out,
        and box {box} declares only what is recorded.'
      credit_cross_check_absent: 'Box {box}: there is nothing in {cross_check} to
        compare, so this figure is not cross-checked.'
      credit_resolution_applied: 'Box {box}: you accepted {accepted}, the amount in
        use, although the sources state {sources}. Your reason: {reason}'
      credit_resolution_stale: 'Box {box}: you accepted an earlier disagreement of
        this figure, but its sources now state other amounts, so the acceptance no
        longer applies.'
      credit_source_disagreement: 'Box {box}: the declared source gives {amount};
        according to {cross_check}, it is {compared_amount}.'
      declared_party_name_missing: No filing name is stated for {party}.
      declared_party_name_single_surname: '{party} is stated with one surname, which
        the record design gives no rule for.'
      declared_party_name_too_wide: The filing name of {party} is wider than its {width}-character
        field and no rendering for that width is stated.
      disposal_claim_gap: '{element}: its disposal is on {date} and part of {year}
        has no recorded depreciation charge. Its minimum still reduces the cost.'
      disposal_exemption_not_computed: '{element}: any exemption or deferral on its
        disposal on {date} is not worked out here, so the full result stands.'
      disposal_figure_element_row: '{element}: {amount} from its sale on {date} enters
        box {box}. On its row, enter the dates and values: {transmission_value} at
        sale and a net value of {net_value}.'
      disposal_figure_in_box: '{element}: {amount} from its disposal on {date} enters
        box {box}.'
