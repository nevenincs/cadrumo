      column_casilla: Box
      column_concept: Concept
      fact_exported_at: Exported
      fact_filing: Filing
      fact_revision_state: Revision state
      fact_taxpayer: Taxpayer
      fact_verification: Check
      filing_none: Not recorded as filed
      filing_recorded: Filing recorded in Cadrumo; the official proof is the AEAT
        receipt
      footer_notice: 'Cadrumo local calculation: not official AEAT evidence'
      grade_development_mock: development (not presentable)
      grade_reviewed: reviewed
      identity_development_mock: 'Development software identity (program {program},
        developer NIF {developer_tax_id}): the filing file for this modelo cannot
        be presented at AEAT.'
      identity_none: This modelo's record design reserves no software identity.
      identity_reviewed: 'Reviewed software identity: the filing file for this modelo
