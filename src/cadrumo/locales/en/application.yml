      suffered_retencion_trabajo_uncredited: This declaration includes income from
        work (rendimientos del trabajo), but no withholding (retención) is credited
        against it. Enter the amount from your payer's certificado de retenciones
        e ingresos a cuenta. The modelo 111 that declares it was submitted by your
        payer, not by you, so this value cannot be filled in automatically.
      trabajo_deduction_not_computed: 'Your work income does not include the deductions
        only you can evidence: union dues (0014), professional-body fees (0015), legal-defence
        costs (0016) and the increase for geographic mobility (0020). If any applies,
        the return overstates your tax. State it in those boxes.'
