cli:
  app:
    ledger:
      bienes_inversion:
        acquisition_year_help: Year the good was acquired.
        art108_help: Whether the good qualifies as a bien de inversión under LIVA
          art. 108.
        asset_ref_help: Optional cross-reference to an AssetRecord identifier.
        cuota_soportada_help: Total input IVA borne on acquisition (positive).
        declare_help: Declare one capital good tracked for IVA regularización.
        description_help: Human description of the good.
        disposal_regime_help: Disposal regime (sujeta_no_exenta or exenta_o_no_sujeta);
          required with --disposal-year.
        disposal_requires_both: --disposal-year and --disposal-regime must be supplied
          together.
        disposal_year_help: Optional art-110 disposal year.
        group_help: Capital-goods IVA deduction regularización register (LIVA arts.
          107-110).
        identifier_help: Stable register identifier.
        kind_help: 'Regularisation window: mueble (4yr) or inmueble (9yr).'
        list_help: List every tracked capital good on the active profile register.
        prorrata_inicial_help: Definitive deduction percentage of the acquisition
          year (0-100).
        unknown_disposal_regime: 'Unknown disposal regime {regime!r}; accepted: {accepted}'
      counterparty:
        actor_help: Operator identifier recorded as having made the assertion.
        confirm_help: Confirm where a counterparty is established and which State
          VAT-identifies it.
        country_code_help: Country the identifier is stated under, when it is not
          Spanish.
        evidenced_scope_help: Territory a document in hand places this party in. Supply
          it to ask what the ladder will answer for that document, which is the only
          way to see a disagreement with what you confirmed before a confirm refuses
          on it.
        group_help: Confirm what is known about a counterparty, once, for every later
          document.
        identification_state_help: 'Member State that VAT-identifies the counterparty.
          A different fact from --scope: art. 25 exempts on this, not on where the
          party is established.'
        note_help: What the answer rests on, in your own words. Recorded, never consulted.
        scope_help: The IVA territory the counterparty is established in.
        show_help: Show the establishment confirmed for a counterparty, if any.
        tax_identifier_help: The counterparty's tax identifier as printed on the document.
        withdraw_help: Withdraw what was confirmed about a counterparty, stating the
          earlier answer was wrong.
      evidence:
        add_help: Register purchase invoice evidence from a PDF or image
        attachment_id_help: Content-addressed attachment identifier.
        attachment_queue_help: List Drive attachments awaiting invoice review.
        attachment_view_help: Inspect stored attachment metadata and provenance.
        batch_directory_help: Directory whose files are ingested. Combine with or
          replace by repeated --file.
        batch_file_help: One document to ingest. Repeat once per document; combines
          with a directory.
        batch_help: Ingest every document in a directory (or each --file) into evidence
          and a reviewable draft, one typed result row per document.
        batch_items_refused_message: Some documents were refused. Every other document
          in the run still completed; the refused rows name what was seen.
        batch_pending_review_message: Some drafts carry a finding a person must adjudicate
          before an invoice is minted. They are held, not failed.
        batch_progress_message: 'processed %{source}: %{status}'
        batch_source_required: Supply a directory argument, one or more --file options,
          or both.
        batch_work_deferred_message: Some documents were not read because no reading
          model could be run. Nothing was guessed from them and nothing failed; re-run
          once the cause below is cleared.
        confirm_already_exists_message: An invoice with this identity already exists;
          returning it unchanged rather than creating a duplicate.
        confirm_category_contradicted_message: 'The regime this document states and
          the tax it charged cannot both be true, so no IVA treatment could be taken
          from either side and none was recorded. Re-read the document: one of the
          two was misread, or the document itself is wrong.'
        confirm_category_rate_inferred_message: This invoice's IVA treatment was settled
          by the tax rate its lines charged, because the rule table could not place
          the operation -- usually because a party's IVA territory is unestablished.
          The treatment recorded is the ordinary domestic one for that rate. Check
          it if this supply was not a domestic one.
        confirm_category_unresolved_message: 'Nothing established an IVA treatment
          for this invoice: the document declared none and the operation''s own facts
          did not reach one. The invoice is on record and will not decompose into
          a declaration until a treatment is established.'
        confirm_category_unsupported_relief_message: The document claims a relief
          from Spanish output IVA that rests entirely on where the counterparty is
          established, and nothing established it. The treatment is withheld rather
          than the document called wrong, so this invoice is on record with no IVA
          treatment and will not decompose into a declaration until the counterparty's
          country or establishment is settled.
        confirm_counterparty_name_help: Counterparty display name (no extraction heuristic
          yet; normally required).
        confirm_counterparty_nif_help: Override the extracted supplier tax id.
        confirm_currency_help: ISO-4217 currency code.
        confirm_help: Re-extract evidence on-host and confirm it into a real catalogue
          Invoice.
        confirm_invoice_class_help: Declare the invoice class when the document does
          not state one. A rectificativa is read from the document where it names
          the invoice it corrects, so this is the override for documents that do not.
        confirm_invoice_date_help: Override the extracted invoice date (YYYY-MM-DD).
        confirm_invoice_number_help: Override the extracted invoice number.
        confirm_iva_rate_help: Override the extracted IVA rate (omit to keep the extracted
          value).
        confirm_link_hint_message: The invoice was recorded without a matching ledger
          transaction.
        confirm_operation_type_help: 'Modelo 349 clave for an entrega intracomunitaria.
          Required when the document states an intra-community supply: the category
          cannot say whether it followed an exempt importation.'
        confirm_printed_total_mismatch_message: The total printed on the document
          does not match the total recorded. The recorded total is derived from the
          taxable base and the IVA rate, so a difference means the document carries
          an amount this record does not, such as a recargo de equivalencia, or a
          figure was misread. Check the document.
        confirm_rectifies_help: Number of the invoice this rectificativa corrects.
          Required by RD 1619/2012 art. 6.1.a.2 alongside its own series, and read
          from the document where one is named.
        confirm_resolve_help: 'Answer one blocking finding: <finding-id>=<choose|supply|attest>:<value-or-reason>.
          For choose, name the reading by its value or by the digest review showed.
          Repeat once per finding; there is no bulk flag.'
        confirm_review_contradicted_regime_message: This document contradicts itself
          about how it is taxed. The detail below names what disagreed with what.
        confirm_review_undetermined_establishment_message: Where a party to this invoice
          is established was left undecided by the document as read. IVA territory
          decides the treatment, and it is not assumed to be the mainland. The detail
          below names the party and what was missing.
        confirm_series_help: Numbering series the invoice was issued in. RD 1619/2012
          art. 6.1.a.2 obliges a rectificativa into its own series, so declaring that
          class needs one; read from the document where it states one.
        confirm_supply_nature_help: State whether the operation is a supply of goods
          or of services. The place-of-supply rules differ, so a document that does
          not say leaves the treatment unresolved.
        confirm_taxable_base_help: Override the extracted taxable base.
        consent:
          bytes_unrecallable: 'Withdrawing consent stops future transmission. It cannot
            recall bytes already sent: this product has no way to retrieve or delete
            them from the provider. Re-deriving locally removes the cloud read from
            your current records, but not from the provider''s.'
          content_address_help: SHA-256 content address of the document's stored bytes.
          evidence_reference_help: Evidence or attachment id of the artefact to re-derive.
          group_help: Review what was sent to an off-host model, and bring artefacts
            back on-host.
          list_help: List every off-host dispatch and the artefacts derived from one.
          no_history: 'No evidence bytes have left this host: this profile has no
            recorded off-host dispatch.'
          rederive_help: Re-read one artefact on this host from its cached transcription.
          rederive_refused: 'Re-derivation refused: {detail}'
          rederived: Re-derived {reference} on this host. It previously carried {previous};
            it now carries {current}. The earlier reading is superseded, not erased.
          transcriber_help: Cache key of the transcription to reuse.
        evidence_id_help: Evidence id (exact match)
        extract_acknowledge_off_host_help: Acknowledge, for this one read, that the
          document leaves this machine.
        extract_acknowledge_without_provider: --acknowledge-off-host acknowledges
          a transmission that would not happen. Name --off-host-provider as well,
          or drop the acknowledgement.
        extract_attachment_id_help: Linked attachment id to extract from (alternative
          to --evidence-id).
        extract_evidence_id_help: Purchase invoice evidence record id to extract from.
        extract_help: Read an invoice PDF's fields on-host into a reviewable draft.
        extract_off_host_needs_content_address: This evidence record carries no content
          address, so an off-host read cannot be recorded against the bytes it would
          transmit.
        extract_off_host_needs_evidence_id: 'An off-host read must name --evidence-id:
          consent is recorded against the document''s content address, which an attachment
          id does not carry.'
        extract_off_host_provider_help: Send this document to a hosted model instead
          of reading it on-host.
        extract_off_host_provider_is_local: --off-host-provider local is the default
          and reads nothing off-host. Omit the flag, or name a hosted provider.
        extract_provider_without_acknowledge: Reading this document off-host sends
          its contents to a third party. Add --acknowledge-off-host to confirm that,
          for this one read.
        extract_reference_required: Supply exactly one of --evidence-id or --attachment-id.
        extract_review_hint_message: This extraction is a best-effort draft and its
          fields are not confirmed.
        field_ambiguous: '{field}: several readings competed and none could be decided
          between ({candidates}). Choose one rather than accepting the draft as read.'
        field_anchor_not_found: '{field}: the reader points at ''{anchor}'', which
          does not occur in the document''s transcription. A normalised value can
          fail this search legitimately, so check the field rather than assuming it
          was corroborated. {detail}'
        field_anchor_self_reported: '{field}: the reader reports having read this
          from ''{anchor}'', but that claim came from the same reader that produced
          the value, so nothing independent has confirmed it.'
        field_anchor_uncorroborated: '{field}: the reader points at ''{anchor}'',
          and nothing found that form missing from the document. The value is still
          not corroborated, so what is unsettled is something other than the printed
          form. {detail}'
        field_contradicted: '{field}: the document reads ''{anchor}'', which does
          not agree with the value recorded for this field. {detail}'
        field_no_anchor: '{field}: the reader offered nothing in the document to point
          at, so there is no printed form to check this value against.'
        group_help: Purchase invoice evidence in PDF or image form
        invoice_date_help: Invoice issue date in ISO 8601 (YYYY-MM-DD), e.g. 2026-01-15.
        invoice_number_help: Supplier invoice number
        iva_amount_help: Invoice IVA amount
        iva_rate_help: Applied IVA rate as a decimal
        list_help: List registered purchase invoice evidence
        notes_help: Internal notes about the evidence
        remove_help: Delete purchase invoice evidence
        review:
          advised_pending_message: Some pending documents carry advisories. These
            block nothing and will confirm as they are, so nothing else will raise
            them again. Narrow the queue with `--advisory` and read one with `review
            show`.
          advisory_help: Show only drafts carrying this non-blocking advisory. These
            stop nothing, so they are otherwise met only by opening each document.
          blocked_message: This document cannot be confirmed until every finding below
            is answered individually. Each answer names one finding by its id.
          blocked_pending_message: Some pending documents carry findings that must
            each be answered before they can be confirmed. Inspect one with `review
            show`.
          blocking_help: Show only drafts that cannot be confirmed until a finding
            is answered.
          country_code_unassigned_message: A party's country code is one ISO 3166-1
            reserves so that no country is ever allocated to it, so the document states
            a string rather than a country and nothing places that party. Correct
            the code against the document. This draft can still be confirmed; the
            party simply stays unestablished until it is.
          country_code_uncatalogued_message: 'A party''s country code may name a real
            country this system''s bundled vocabulary does not yet carry, so nothing
            can be said about where that party is established. Re-reading the document
            will not settle it: the country has to be added. This draft can still
            be confirmed; the party simply stays unestablished until it is.'
          finding_help: Show only drafts whose document failed this deterministic
            check.
          group_help: Review pending extraction drafts before confirming them into
            invoices.
          list_help: List pending extraction drafts awaiting human review.
          party_attribution_unverified_message: Nothing verifies which party these
            address values belong to. Were two address blocks read the wrong way round,
            both parties would be placed in an IVA territory neither is established
            in and no check would catch it. Confirm each value against the document
            before confirming this draft.
          reason_help: Show only drafts blocked for this reason.
          reference_help: Evidence or attachment reference the pending draft was read
            from.
          resolve_action: Unknown resolution action.
          resolve_shape: Each --resolve is <finding-id>=<choose|supply|attest>:<value-or-reason>.
            A choose names the reading by its value or by the digest review showed.
          show_help: Show one pending draft field by field, with its findings and
            blockers.
          unknown_reference: No pending draft for that reference.
        source_path_help: Path to the invoice PDF or image
        supplier_help: Supplier name
        taxable_base_help: Invoice taxable base
        update_help: Update purchase invoice evidence details
        view_help: Show purchase invoice evidence
        yes_help: Confirm deleting the evidence
        yes_required: Pass --yes to delete evidence
      inventory:
        authority_invalid: The closing-authority object is invalid for this inventory ledger.
        authority_channel_required: Select exactly one structured closing-authority input channel.
        authority_fd_help: Read the complete closing-authority JSON object from a one-shot file descriptor
        authority_stdin_help: Read the complete closing-authority JSON object from stdin
        closing_authority_record_help: Atomically record evidenced inventory closing authority
        acquisition_cost_invalid: 'Invalid acquisition-cost JSON from stdin: {details}'
        acquisition_cost_stdin_help: Read the complete acquisition-cost JSON object
          from stdin
        actividad_id_help: Economic activity identifier
        create_help: Create an inventory ledger for one activity and tax year
        group_help: Inventory ledgers by activity, movements, and valuation
        iva_rate_help: IVA rate as a percentage
        list_help: List inventory ledgers in the active profile
        movement_add_help: Add a purchase, sale, or adjustment movement to the ledger
        movement_date_help: Movement date (YYYY-MM-DD)
        movement_group_help: Manage inventory ledger movements
        movement_id_help: Movement id within the ledger
        movement_kind_help: Movement kind (opening, purchase, cogs or count)
        opening_stock_help: Opening stock value
        quantity_help: Movement quantity, positive or negative
        taxable_base_help: Taxable base linked to the movement
        unit_cost_help: Unit cost for purchase movements
        valuation_group_help: Calculate and preview inventory valuation
        valuation_method_help: Valuation method (fifo or pmp)
        valuation_preview_help: Preview closing stock and cost of sales
        year_help: Tax year
      invoice:
        add_help: Create a linkable reconciliation invoice in the catalogue.
        country_code_help: 'Counterparty ISO 3166-1 alpha-2 country code. Required:
          it routes both informativas, so it is never assumed.'
        group_help: Business invoice records (issued or received)
        import_all_refused: 'bulk invoice import failed: every row was refused; no
          invoices were created'
        import_column_role_not_applied: 'a proposed column role was not applied: {detail}'
        import_country_help: Counterparty country (ISO 3166-1 alpha-2) for the whole
          import. Required only when the file carries no country_code column; ignored
          for rows that state their own. It asserts this country for EVERY such row,
          so a book mixing domestic and foreign counterparties needs the column instead.
        import_file_help: Path to a CSV or XLSX file of invoice rows (counterparty_nif,
          counterparty_name, invoice_number, invoice_date, taxable_base, and optional
          iva_rate/currency/country_code/notes).
        import_file_not_found: 'File not found: {path}'
        import_help: Bulk-create catalogue invoices from a CSV or XLSX file.
        import_unmapped_columns: 'columns not imported because no invoice field matched
          them: {columns}'
        invoice_class_help: Invoice class. A rectificativa also requires --rectifies-invoice-number
          naming the invoice it corrects.
        invoice_date_help: Invoice issue date in ISO 8601 (YYYY-MM-DD), e.g. 2026-01-15.
        invoice_id_help: Catalogue invoice id (or unambiguous prefix).
        iva_category_help: IVA treatment of the operation. Required for a renta income
          calculation to ground it.
        kind_help: 'Invoice kind: issued (a customer owes you) or received (you owe
          a supplier)'
        list_help: List reconciliation catalogue invoices.
        operation_date_help: Date the entrega or prestacion took place (YYYY-MM-DD).
          This is the LIVA art. 75 devengo date that decides which period declares
          the cuota; without it the invoice date stands in for it.
        operation_type_help: 'M349 operation key: E supplies of goods, M supplies
          after an exempt import, H the same via a fiscal representative, A acquisitions
          of goods, T triangular supplies, S services supplied, I services acquired,
          R call-off-stock transfers, D call-off-stock returns, C call-off-stock substitutions'
        recargo_help: Recargo de equivalencia charged on top of the cuota (LIVA art.
          161). It rides inside the invoice total, unlike a retencion.
        rectifies_help: Number of the invoice this rectificativa corrects.
        remove_help: Delete one reconciliation catalogue invoice.
        retention_amount_help: Amount of IRPF retención withheld by the payer, in
          euros. May be supplied alone, or alongside --retention-rate.
        retention_rate_help: RIRPF art. 95.1 retención fraction withheld by the payer
          (0.15 for the general 15%, or 0.07 during the inicio-de-actividad window).
          Requires --retention-amount; a rate alone is refused.
        series_help: Invoice numbering series, when the issuer uses one.
        simplificada_tax_id_expected_message: This simplified invoice has no counterparty
          tax identifier even though the recorded legal context expects one.
        update_help: Update business invoice details
        view_help: Show one reconciliation catalogue invoice by id or unambiguous
          prefix.
        wizard_help: Guided, non-interactive manual entry when extraction is unavailable.
        wizard_idempotent_noop: 'Idempotent no-op: an invoice with this identity already
          exists (%{invoice_id}); nothing was created.'
        yes_help: Confirm deleting the invoice
        yes_required: Pass --yes to delete an invoice
      prorrata:
        activity_code_help: CNAE / IAE activity code grouped into this sector (repeatable,
          at least one).
        declare_sector_help: 'Declare one differentiated sector (LIVA arts. 9.1.c
          / 101): the operator''s art. 9.1.c partition, never inferred from the ledger.'
        ejercicio_help: Filing year the election covers.
        elect_especial_help: 'Elect prorrata especial for an ejercicio (LIVA art.
          103.Dos.1): per-input deduction routes by --input-classification on each
          ledger row.'
        elect_general_help: 'Elect prorrata general for an ejercicio (LIVA art. 104):
          one deduction percentage applies to every deducible cuota.'
        evidence_reference_help: Evidence reference for the current-period prorrata-especial
          option or revocation.
        general_percentage_help: Provisional deduction percentage 0-100 (LIVA art.
          104.Uno + 105.Uno).
        group_help: 'Cross-period IVA prorrata register: elect the regime (general
          / especial) and declare differentiated sectors (LIVA arts. 101 / 103 / 105
          / 106).'
        letra_help: LIVA art. 9.1.c letra (a/b/c/d) that makes this sector differentiated.
        list_help: List every register entry and declared differentiated sector on
          the active profile.
        optional_evidence_reference_help: Operator-held evidence for an option exercised
          in this ejercicio; omit to record an explicit continuation of the regime
          already in force.
        percentage_help: Common-use deduction percentage 0-100 (LIVA art. 106.Uno
          regla 3.a / art. 104.Dos).
        provenance_help: LIVA art. 105 source of the provisional percentage.
        provenance_not_electable: 'Provenance {provenance!r} is not operator-declarable;
          accepted: {accepted}. The art. 105.Cinco interrupted percentage is computed
          from the register.'
        reference_help: AEAT authorisation (art. 105.Dos) or inicio proposal (art.
          105.Tres) reference.
        reference_not_permitted: --reference is permitted only with an aeat_autorizada
          or inicio_actividad provenance.
        reference_required: Provenance {provenance!r} (LIVA art. 105.Dos / 105.Tres)
          requires --reference.
        revoke_especial_help: Revoke prorrata especial for an ejercicio after a prior-year
          especial state (LIVA art. 103.Dos.1).
        sector_help: Differentiated-sector id this entry covers; omit for the whole-entity
          entry.
        sector_id_help: Stable sector id the register entries and ledger rows reference.
      ratios:
        category_help: Spending category id (e.g. vehiculo_combustible)
        eligible_help: List categories that accept a specific ratio
        group_help: Business-use ratios by spending category
        list_help: List category ratios in the active profile
        no_override_error: No saved ratio for category {category!r} in bucket {bucket_id!r}
        ratio_help: Applicable ratio between 0 and 1
        set_help: Set or replace the ratio for a category
        unset_category_help: Category id whose ratio you want to clear
        unset_help: Remove the specific ratio for a category
        validate_help: Validate ratios against eligible categories and bounds
      rule:
        actor_help: Operator identifier recorded in the rule provenance.
        add_help: Add a classification rule that auto-classifies matching transactions.
        apply_dry_run_help: Show what would be classified without persisting changes.
        apply_dry_run_summary: 'dry-run: %{count} transaction(s) would be classified'
        apply_help: Apply stored classification rules to unclassified ACTIVE transactions.
        apply_reaffirm_help: Also re-classify transactions that were manually classified.
        apply_summary: 'rules: %{rules}, scanned: %{scanned}, matched: %{matched},
          skipped: %{skipped}, no_match: %{no_match}'
        category_id_help: Optional spending category to apply.
        classification_help: Target classification for matching transactions.
        description_pattern_help: Regex pattern matched (case-insensitive) against
          transaction description.
        empty_pattern: A rule needs a non-empty --description-pattern (a word or phrase,
          e.g. "software") to match transaction descriptions.
        group_help: Manage and apply ledger classification rules.
        list_empty: (no rules stored)
        list_header: "priority\tclassification\tpattern\trule_id"
        list_help: List stored classification rules ordered by priority.
        priority_help: Numeric priority; lower value is evaluated first (default 100).
    live:
      app_help: Read-only AEAT live observation commands
      borrador:
        app_help: Modelo 100 borrador snapshots
        filing_year_help: Filing year (e.g. 2024)
        latest_help: Show the most recent active snapshot for a filing year
        list_help: List persisted Modelo 100 borrador snapshots
        modelo_100_help: Modelo 100 borrador snapshot commands
        snapshot_id_help: Snapshot id (or unambiguous prefix)
        state_help: 'Snapshot state filter: active, superseded, discarded, or all'
        view_help: Show one Modelo 100 borrador snapshot
      deudas:
        app_help: Read-only AEAT deudas snapshots
        latest_help: Show the most recent deudas snapshot
        list_help: List saved deudas snapshots
        snapshot_id_help: Snapshot id (or unambiguous prefix)
        view_help: Show one deudas snapshot and every outstanding liability it holds
      expediente_help: AEAT expediente identifier
      expedientes:
        app_help: Read-only AEAT expediente snapshots
        latest_help: Show the most recent expediente snapshot
        list_help: List saved expediente snapshots
        pull_help: Pull the AEAT declaration register and persist a bucket-scoped
          snapshot.
        pull_modelo_help: Limit this pull to this modelo.
        snapshot_id_help: Snapshot id (or unambiguous prefix)
        view_help: Show an expediente snapshot
      filed:
        casillas_not_enrolled: '{count} casilla(s) in the captured filings hold values
          that are not amounts, so they were not enrolled as calculation evidence:
          {affected}. Everything numeric in those filings was enrolled normally.'
        discover_help: Show which modelo and ejercicio pairs a history pull would
          walk.
        discover_no_profile_denominator: 'This report carries no taxpayer-specific
          denominator: the profile or its activity start date is missing, so the pair
          count does not measure coverage. Complete the profile and re-run before
          reading this result as a complete history.'
        discover_register_scope_caveat: 'The register''s option list is what AEAT
          offers, not a confirmed filing history for this NIF. Whether that list is
          scoped to the authenticated NIF is unconfirmed, so it only widens the walk:
          a pair absent from it is no proof that nothing was filed.'
        limit_reached: The sweep stopped at the --limit of {limit} after reaching
          {reached} declaration(s); pairs beyond that point were not walked. A missing
          pair is not evidence that nothing was filed -- re-run with a higher --limit
          or none.
        list_help: List filed declaration rows without downloading artefacts
        pull_all_help: Pull this taxpayer's AEAT filed-declaration history in one
          sweep and report what it found.
        pull_all_limit_help: Maximum number of modelo and ejercicio pairs to walk
          in this sweep.
        pull_all_pairs_refused: '{count} modelo/ejercicio pair(s) could not be read
          and were NOT reported as empty: {pairs}. Re-run to retry; a refusal is not
          evidence that nothing was filed.'
        pull_dry_run_help: Report what a bulk pull would capture without writing anything.
          Bulk mode only.
        pull_dry_run_single_mode_error: --dry-run is only valid for a bulk pull with
          --from-year/--to-year; a single-modelo pull has no dry run.
        pull_help: Pull filed-declaration data from the authenticated AEAT register.
        pull_modelo_help: Limit this pull to this modelo.
        pull_sources_help: Pull the filed observations required by a target filing's
          dependencies.
      filed_app_help: Read-only filed declaration observations
      from_year_help: First filing year
      iva_wallet:
        acquisition:
          outcome:
            aeat_403: AEAT 403/auth gate
            authenticated: Authenticated
            certificate_required: certificate required
            dom_drift: AEAT page shape changed
            live_navigation_failed: live navigation failed
            no_clave_prompt: no Cl@ve prompt
            operator_timeout: operator approval timed out
            pending_clave_request: pending Cl@ve request
            qr_required: QR approval required
            unknown: Unknown
            wrong_identity: wrong identity
        app_help: AEAT IVA compensation wallet pull (read-only; allows only own-name
          representation and the guarded wallet read query).
        as_of_year_help: Year used to age IVA compensation carry-forward lots.
        history_help: List secure local IVA compensation history, carry-forward lots,
          and persisted wallet authority decisions derived from Modelo 303 captures.
        pull_evidence_help: Pull filed Modelo 303 history and attempt the AEAT IVA
          wallet/cartera read as one typed read-only acquisition.
