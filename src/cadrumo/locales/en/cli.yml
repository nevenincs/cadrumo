          a counter-signed receipt) back to the originator so only the originator's
          private key can open it, and write the envelope to --output. Local-only;
          never contacts AEAT.
        encrypt_for_recipient_help: Seal a review package so only a registered recipient's
          private key can open it, and write the encrypted envelope to --output. Local-only;
          never contacts AEAT.
