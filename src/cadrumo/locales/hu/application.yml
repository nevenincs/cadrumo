application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: Az AEAT hitelesítési zárat nem sikerült beszerezni az elavult
          zár helyreállítása után.
        lock_held: Egy másik AEAT hitelesítési műveletet már folyamatban van ehhez
          a profilhoz. Ne kezdjen el egy második Cl@ve kérést; várja meg az előző
          befejezését.
    certificate:
      health:
        file_missing: A konfigurált tanúsítványfájl (%{path}) nem létezik. Állítsa
          vissza a fájlt, vagy futtassa a `aeat config auth configure --provider certificate
          --file ÚTVONAL` parancsot.
        path_unset: Nem lett kiválasztva tanúsítványfájl. Futtassa a `aeat config
          auth configure --provider certificate --file ÚTVONAL` parancsot.
        unavailable: A tanúsítvány állapota nem érhető el; a diagnosztikai részletekért
          tekintse meg a hibakeresési naplókat.
      load:
        password_unset: Nincs konfigurálva tanúsítványjelszó. A folytatás előtt állítsa
          be a tanúsítványjelszót.
        path_unset: Nincs konfigurálva tanúsítványfájl. Futtassa a `aeat config auth
          configure --provider certificate --file ÚTVONAL` parancsot.
    clave_movil:
      health:
        identity_unset: Nincs konfigurálva DNI/NIE a Cl@ve Móvilhoz. A folytatás előtt
          konfiguráljon egyet.
        operator_completion_required: Kész; operátor által közvetített Cl@ve befejezés
          szükséges.
    errors:
      provider_reserved: A(z) {provider} hitelesítési szolgáltató foglalt és még nincs
        implementálva.
      session_field_not_datetime: A(z) {field} munkamenet-mező csak datetime vagy
        ISO-8601 karakterlánc lehet.
    operator:
      alignment:
        both_missing_detail: Sem a Cl@ve azonosító (CADRUMO_CLAVE_MOVIL_DNI_NIE),
          sem az aktív profil adóazonosítója nincs beállítva. Mindkettőt ugyanarra
          a DNI/NIE-re állítsa be.
        clave_identity_missing_detail: A Cl@ve azonosító (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          nincs beállítva, ezért nem hasonlítható össze az aktív profil adóazonosítójával.
          Állítsa be.
        mismatch_detail: A Cl@ve azonosító DNI/NIE (%{clave_identity}) nem egyezik
          az aktív profil adóazonosítójával (%{profile_tax_id}). Az élő AEAT hozzáférés
          blokkolva.
        profile_tax_id_missing_detail: Az aktív profilnak nincs adóazonosítója, ezért
          nem hasonlítható össze a Cl@ve azonosítóval. Állítsa be a profil adóazonosítóját.
      errors:
        certificate_file_required: A tanúsítvány-szolgáltató tanúsítványfájlt igényel.
          Futtassa a `aeat config auth configure --provider certificate --file ÚTVONAL`
          parancsot.
        certificate_file_unresolved: A(z) %{certificate_path} tanúsítványútvonal nem
          oldódik fel létező fájlra. Futtassa a `aeat config auth configure --provider
          certificate --file ÚTVONAL` parancsot.
        certificate_secret_mutation_in_progress: Ennél a profilnál még folyamatban
          van egy tanúsítványtitok-módosítás helyreállítása. A hitelesítési beállítások
          módosítása előtt próbálja újra ugyanazt a titokparancsot.
        certificate_source_not_found: A(z) '%{name}' tanúsítványforrás nincs regisztrálva.
          Futtassa a `aeat config auth certificate list` parancsot a regisztrált források
          megtekintéséhez, vagy a `aeat config auth certificate register --name %{name}
          --file ÚTVONAL` parancsot a regisztrálásához.
        cleanup_in_progress: Ennél a profilnál még folyamatban van egy hitelesítési
          kijelentkezés vagy visszaállítás helyreállítása. A hitelesítési beállítások
          módosítása előtt folytassa azt a műveletet.
        dangling_active_profile: A(z) %{active_profile} aktív profil mutató nem oldódik
          fel regisztrált profil-bucketre. Futtassa az aeat config profile list parancsot
          a regisztrált profilok megtekintéséhez, majd az aeat config login NÉV vagy
          az aeat config profile create NÉV parancsot.
        no_active_bucket: Nincs aktív profil bucket; az auth konfigurálása előtt futtassa
          a `aeat config profile create NÉV` parancsot.
        provider_not_configured: Nincs beállított hitelesítési szolgáltató; adja meg
          a --provider értékét, vagy előbb állítson be egyet.
        requires_custody_session: 'A hitelesítési művelet a(z) ''%{bucket_id}'' profilt
          célozza itt: %{storage_root}, de ehhez a profilhoz nincs nyitott letéti
          munkamenet. Futtassa az aeat config login parancsot erre a profilra, majd
          próbálja újra.'
        revoke_requires_custody_session: A(z) '%{bucket_id}' profil AEAT-munkamenete
          NEM lett visszavonva, és továbbra is használható. Titkosítva, a profilon
          belül tárolódik, ezért csak a profil feloldása - az aeat config login paranccsal
          - vonja vissza.
        scope_conflict: Válassza a --provider vagy a --all lehetőséget, de ne mindkettőt.
        unreadable_active_profile: 'Az aktív profil (%{active_profile}) rendelkezik
          bucket-manifeszttel, de nincs olvasható profil-rekorddal (állapot=%{status}).
          Futtassa: %{next_action}.'
      login:
        refused_certificate_file_missing: 'Nem lehet bejelentkezni: a konfigurált
          tanúsítványfájl (%{path}) nem létezik. Állítsa vissza a fájlt, vagy konfigurálja
          újra az útvonalat a bejelentkezés előtt.'
        refused_certificate_path_unset: 'Nem lehet bejelentkezni: még nem lett kiválasztva
          tanúsítványfájl. Futtassa a `aeat config auth configure --provider certificate
          --file ÚTVONAL` parancsot.'
        refused_clave_movil_identity_unset: 'Nem lehet bejelentkezni Cl@ve Móvillel:
          még nincs konfigurálva DNI/NIE. A folytatás előtt konfiguráljon egyet.'
        refused_live_tests_disabled: 'Az élő bejelentkezést a biztonsági kapu letiltja:
          az eszköz csak helyi bevallásokat épít és ellenőriz. Engedélyezze az élő
          teszteket, ha valóban szükséges. Kért szolgáltató: %{provider}.'
      probe:
        certificate_corrupt: A tanúsítványfájl nem érvényes PKCS#12 boríték, vagy
          a jelszó hiányzik; nem elemezhető.
        certificate_corrupt_detail: 'A tanúsítvány nem értelmezhető: %{error}.'
        certificate_expired: A tanúsítvány %{days} napja lejárt. Újítsa meg a hitelesítés
          előtt.
        certificate_expiring: A tanúsítvány %{days} nap múlva lejár. Tervezze meg
          a megújítást.
        certificate_file_missing: A konfigurált tanúsítványfájl (%{path}) nem létezik.
        certificate_ok: A tanúsítvány érvényes; %{days} nap múlva jár le.
        certificate_path_unset: Nem lett kiválasztva tanúsítványfájl.
        certificate_unreadable: A tanúsítványfájl nem olvasható (%{error}).
        clave_movil_identity_invalid: 'A Cl@ve Móvilhoz konfigurált DNI/NIE érvénytelen:
          %{error}.'
        clave_movil_identity_ok: A Cl@ve Móvilhoz konfigurált DNI/NIE érvényes formátumú.
        clave_movil_identity_unset: Nincs konfigurálva DNI/NIE a Cl@ve Móvilhoz.
        no_provider: Nincs konfigurálva hitelesítési szolgáltató; helyi vizsgálat
          nem lehetséges.
        no_session: Nincs tárolt AEAT munkamenet-token a lemezen; futtassa a `aeat
          config auth login` parancsot egy megszerzéséhez.
        session_expired: Munkamenet lejárt
        session_live: Munkamenet aktív
    provider_impact:
      certificate_ready: A tanúsítvány-hitelesítés kész. Az operátor az AEAT-alapú
        olvasásokhoz ugyanazt a CLI bevallási folyamatot használja; minden szolgáltató
        ugyanazt a megosztott auth protokollt használja.
      generic_ready: A %{label} kész. Az operátor az AEAT-alapú olvasásokhoz ugyanazt
        a CLI bevallási folyamatot tartja, miközben ez a szolgáltató a megosztott
        auth protokollba csatlakozik.
      unavailable: A %{label} konfigurálva van, de még nem kész. Az operátor helyi
        bevallásokat még mindig tud előállítani, ellenőrizni és exportálni, de az
        AEAT-alapú olvasások blokkolva vannak.
      unconfigured: Az operátor helyi bevallásokat még mindig tud előállítani, ellenőrizni
        és exportálni, de az AEAT-alapú olvasások mindaddig nem érhetők el, amíg hitelesítési
        szolgáltatót nem konfigurál.
    sessions:
      errors:
        clave_contraste_missing: 'A QR nélküli Cl@ve Móvil útvonalhoz a dokumentumodon
          szereplő contraste szükséges. NIE esetén rögzítsd az aktív profilon a következőt:
          %{nie_field}, DNI esetén pedig ezt: %{dni_field}, mielőtt bármely AEAT-munkamenetet
          használnád.'
        clave_identity_malformed: A Cl@ve azonosító nem érvényes spanyol NIF, NIE
          vagy CIF, ezért nem igazolható, hogy ehhez a profilhoz tartozik.
        clave_identity_missing: 'A Cl@ve élő hitelesítéshez DNI/NIE szükséges. Rögzítsd
          az aktív profilon a következőként: %{identity_field}, vagy állítsd be a
          szolgáltatóhoz az `aeat config auth configure` paranccsal, mielőtt bármely
          AEAT-munkamenetet használnád.'
        clave_identity_profile_mismatch: A Cl@ve Móvil azonossága nem egyezik az aktív
          profil adóazonosítójával; váltson az egyező profilra, vagy frissítse a profil
          adóazonosítóját.
        clave_route_missing: 'A Cl@ve Móvil élő hitelesítéséhez szükséges: %{route_field}.
          Nyissa meg a profilkezelő Azonosítás részét, válassza a QR-kód vagy a Kérés
          az alkalmazásban lehetőséget, mentse, majd próbálja újra a szinkronizálást.'
        corrupt_session: A mentett hitelesítési munkamenet sérült és nem olvasható.
          Futtassa az `aeat config auth logout`, majd az `aeat config auth test` parancsot.
        no_session: Nincs aktív AEAT munkamenet; futtassa a `aeat config auth test`
          parancsot az AEAT adatok olvasása előtt.
        profile_identity_cleared: 'Az élő AEAT-hitelesítéshez az aktív profil adószáma
          szükséges, de ez a profil nem tartalmazza. Állítsd vissza a profilon a következőt:
          %{requirements}, majd hitelesíts újra.'
        profile_identity_malformed: A profil adóazonosítója nem érvényes spanyol NIF,
          NIE vagy CIF, ezért nem igazolható, hogy a Cl@ve munkamenet hozzá tartozik.
        profile_tax_id_missing: 'A Cl@ve Móvil élő hitelesítéshez az aktív profilnak
          tartalmaznia kell a következőt: %{requirements}.'
        provider_close_failed: Az AEAT böngészőmunkamenetet nem sikerült biztonságosan
          bezárni; az AEAT adatok olvasása előtt hitelesítsen újra.
        sede_rejected: Az AEAT munkamenetet az AEAT Sede nem fogadja el; futtassa
          a `aeat config auth test` parancsot az AEAT adatok olvasása előtt.
        session_expired: Az AEAT munkamenet lejárt; futtassa a `aeat config auth test`
          parancsot az AEAT adatok olvasása előtt.
        session_identity_profile_mismatch: Az AEAT munkamenet azonossága nem egyezik
          az aktív profil adóazonosítójával; törölje a hitelesítési munkameneteket,
          és hitelesítse az egyező profilt.
        state_missing: Az AEAT munkamenet állapota hiányzik; futtassa a `aeat config
          auth test` parancsot az AEAT adatok olvasása előtt.
        verify_failed: Az AEAT munkamenetet nem sikerült ellenőrizni; futtassa a `aeat
          config auth test` parancsot az AEAT adatok olvasása előtt.
  calculations:
    binding_prefill:
      errors:
        observation_merge_key_conflict: 'Eltérő modelo-, év- vagy időszakkulcsú megfigyelések
          nem vonhatók össze: {primary_modelo} {primary_filing_year} {primary_period}
          szemben ezzel: {overlay_modelo} {overlay_filing_year} {overlay_period}.'
        selector_filing_year_delta_type: A nyilvántartás 'filing_year_delta' kötésválasztójának
          egész számnak vagy számot tartalmazó szövegnek kell lennie; jelenleg {observed_type}
          típusú. Javítsa a választót a nyilvántartásban.
        selector_source_periods_member_type: A nyilvántartás 'source_periods' kötésválasztójának
          minden eleme időszakkód kell legyen. Javítsa a választót a nyilvántartásban.
        selector_source_periods_type: A nyilvántartás 'source_periods' kötésválasztójának
          időszakkódnak vagy időszakkódok sorozatának kell lennie; jelenleg {observed_type}
          típusú. Javítsa a választót a nyilvántartásban.
    errors:
      observation_displaces_official_evidence_app_filing: 'Ez a modelo, ado ev es
        idoszak mar tartalmaz az AEAT-tol rogzitett bizonyitekot ({existing_source_kind}),
        ezert helyben szamitott bevallas nem menthato folebe. A helyi ujraszamitas
        nem hiteles forras a benyujtott adatokra: ha helyes, nyujtsa be a helyesbitest
        az AEAT-hoz, es toltse le az eredmenyt. A rogzitett bizonyitek ezen alkalmazas
        egyetlen utvonalan sem allithato helyre.'
      observation_displaces_official_evidence_manual: Ez a modelo, ado ev es idoszak
        mar tartalmaz az AEAT-tol rogzitett bizonyitekot ({existing_source_kind}).
        Egy kezi ertek mentese felulirja azt, es a felulirt bizonyitek ezen alkalmazas
        egyetlen utvonalan sem allithato helyre. Futtassa ujra a hivatalos bizonyitek
        felulirasat engedelyezo kapcsoloval, ha a felulirast szandekosan vegzi.
    iva_compensation:
      errors:
        annual_partition_casilla_ids_noncanonical: A Modelo 303 kompenzációs megfigyeléseinek
          a(z) {revision_id} változatban deklarált casilla-azonosítókat kell használniuk;
          a(z) {casilla_ids} nincs deklarálva.
        correction_missing: 'Nincs beállított kompenzációs rekord ehhez: %{filing_year}/%{period};
