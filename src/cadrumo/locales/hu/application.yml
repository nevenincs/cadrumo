        local_recurrence_modelo_303_only: 'A helyi IVA-kompenzációs ismétlődés csak
          a Modelo 303 esetén építhető újra; a megadott modelo: {modelo}.'
        modelo_303_only: Az IVA-kompenzációs előzmények csak Modelo 303 megfigyeléseket
