        observed_casilla_ids_noncanonical: Az IVA-kompenzációs megfigyeléseknek a(z)
          {modelo} modelo {revision} változatában deklarált casilla-azonosítókat kell
          használniuk; a(z) {casilla_ids} nincs deklarálva.
        repository_backend_split: A Modelo 303 megfigyelési tárnak és az IVA-kompenzációs
