        what_to_do: Ha rád vonatkozik, írd be ezt a csökkentést a(z) {box} rovatba.
      prior_payment_not_deducted:
        what: Egy korábbi negyedévet benyújtottként rögzített, de a(z) {box} rovat
          nem vonja le az akkor befizetett összeget.
        what_to_do: Írd be a(z) {box} rovatba a korábbi negyedévekben befizetett összeget.
      prorrata_especial_check_unavailable:
        what: A Cadrumo nem tudta ellenőrizni, hogy a különleges áfa-arányosítás kötelező-e
          neked.
        what_to_do: Ellenőrizd te magad a hivatalos szabályok alapján, vagy kérdezd
          meg a tanácsadódat.
      prorrata_especial_obligatoria:
        what: A különleges áfa-arányosítás kötelező lehet neked, mert mentes és adóköteles
          tevékenységed is van.
        what_to_do: Nézd meg az áfa-arányosítás szabályait, vagy kérdezd meg a tanácsadódat,
          és ha kötelező, alkalmazd a különleges arányosítást.
      rate_boxes_underaccount_total:
        what: A(z) {box} rovat áfa-összegének egy része egyetlen kulcsonkénti rovatban
          sem szerepel.
        what_to_do: Ellenőrizd a számláid és tételeid áfakulcsát, majd számolj újra.
          A nyilatkozat exportálására addig nem kerülhet sor, amíg ezt nem rendezik.
      register_owned_capital_acquisition:
        what: Egy eszközvásárlás kimarad a költségei közül, mert az éves értékcsökkenési
          leírásán keresztül vonható le.
        what_to_do: Nincs teendője.
      reopen_hint: Számolj újra, hogy lásd a számítás megjegyzéseit.
      settlement_not_computed:
        what: A(z) {box} rovat a végső elszámolást tartalmazza, amelyet a Cadrumo
          nem számol ki.
        what_to_do: Írd be az összeget a(z) {box} rovatba, és vesd össze a hivatalos
          útmutatóval.
      source_domain_not_ready:
        what: Az értékhez szükséges nyilvántartások még nem olvashatók.
        what_to_do: Fejezd be ezeknek a nyilvántartásoknak a beállítását vagy importálását,
          majd számolj újra.
      source_issue:
        what: Hiányzik egy információ, amelytől ez az érték függ, vagy nem lehetett
          felhasználni.
        what_to_do: Nézd át a nyilvántartásaidat és a profilodat, hátha hiányzik valami,
          majd számolj újra.
      stale: Az utolsó számításból származik. Számolj újra a frissítéshez.
      storage_degraded:
        what: A Cadrumo nem tudta beolvasni a mentett nyilvántartásaid egy részét,
          ezért néhány érték hiányos lehet.
        what_to_do: Számolj újra. Ha továbbra is előfordul, ellenőrizd, hogy az adataid
          elérhetők-e, és jelezd a hibát.
      structurally_unroutable_base_category:
        what: Ebben a nyilatkozatban nincs rovat a nyilvántartásaid egyik kategóriájának
          összegei számára.
        what_to_do: A hivatalos útmutatóban nézd meg, hol kell ezeket az összegeket
          bevallani; gyakran máshol szerepelnek.
      terminal_origin_mismatch:
        what: Egy érték olyan úton került a nyilatkozatba, amelyért a Cadrumo nem
          vállalhat felelősséget, ezért így nem megbízható.
        what_to_do: Nézd meg, honnan származik ez az érték a nyilvántartásodban, majd
          számolj újra. Ha nem változik, jelezd.
      unclassified_declarant_role_fact:
        what: Egy számláról nem derül ki, hogy nem a tevékenységedhez tartozik-e,
          vagy támogatás-e, pedig ez dönti el, hogyan kell bevallani.
        what_to_do: Válaszolj a nyilvántartásodban szereplő számlával kapcsolatos
          kérdésre, majd számolj újra.
      unconverted_foreign_currency:
        what: Egy devizás számlához nincs euróra váltási árfolyam, ezért kimarad a
          listából.
        what_to_do: Add meg az árfolyamot ahhoz a számlához a nyilvántartásodban,
          majd számolj újra.
      ungrounded_income_substrate:
        what: Egyes bevételi tételekhez nem tartozik adóalapot tartalmazó számla,
          ezért a banki összeg lett felhasználva, a levonásuk pedig kimaradt.
        what_to_do: Kapcsolj össze minden bevételi tételt egy kiállított számlával,
          vagy add meg az adóalapot, majd számolj újra.
      unhandled_binding_source:
        what: A Cadrumo még nem tud kitölteni egy értéket ebben a nyilatkozatban az
          adataidból.
        what_to_do: Ne nyújtsd be ezt az értéket úgy, ahogy van. Ha ismered, írd be
          te magad, és jelezd a hiányosságot.
      unresolved_binding:
        what: A Cadrumo nem tudott egy értéket kiszámolni az adataidból, és figyelmeztetés
          nélkül nullát mutatott volna.
        what_to_do: Pótold a hiányzó nyilvántartásokat vagy profiladatokat, vagy írd
          be te magad az értéket, majd számolj újra.
      unresolved_derived_binding:
        what: Egy olyan értéket, amelyet a Cadrumo más értékekből számol ki, nem sikerült
          kiszámolni.
        what_to_do: Ellenőrizd, hogy a hozzá szükséges értékek ki vannak-e töltve,
          majd számolj újra.
      unresolved_retencion_substrate:
        what: Néhány kiállított számlánál a Cadrumo nem tudja, mennyit vontak le,
          ezért a levonási jóváírásból ismeretlen összeg hiányozhat, és a szükségesnél
          többet fizethetsz.
        what_to_do: Add meg a nyilvántartásodban az érintett számlák alapját és a
          levonást, majd számolj újra.
      unrouted_declarable_quantity:
        what: Egy tétel egy része, például egy levonás vagy egy adóalap, egyetlen
          rovatba sem kerül be ebben a nyilatkozatban.
        what_to_do: Ellenőrizd a tétel besorolását és összegeit a nyilvántartásodban,
          majd számolj újra.
      unrouted_observation:
        what: A nyilvántartásaidban szereplő egyik összeg nem került be a nyilatkozat
          egyik rovatába sem.
        what_to_do: Nézd meg, hogyan van besorolva az a tétel a nyilvántartásodban,
          majd számolj újra.
      unsettled_legal_reading:
        what: Egy bevallott összeg egy olyan szabály egyik értelmezését követi, amely
          erre az évre nem tisztázott, és az AEAT másként is értelmezheti.
        what_to_do: Beadás előtt ellenőrizd ezeket az ügyleteket az AEAT aktuális
          iránymutatása alapján.
      unusable_sales_invoice_evidence:
        what: Egy bevételi tétel olyan kiállított számlához kapcsolódik, amely nem
          megbízható, ezért a banki összeg kerül bevallásra, a levonás pedig elvész.
        what_to_do: Javítsd a számlával való kapcsolatot a nyilvántartásodban, vagy
          add meg közvetlenül az adóalapot, majd számolj újra.
      withholding_detail_absent:
        what: Az évre nincs címzettenkénti levonási részletezés rögzítve, ezért a
          nulla érték alátámasztás nélkül jelenik meg.
        what_to_do: Pótold a részletező tételeket az évre a nyilvántartásodban, majd
          számolj újra.
