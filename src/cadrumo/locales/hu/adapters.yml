      playwright_combobox_open_failed: Hiba a Sede legördülő lista megnyitásakor.
      playwright_combobox_select_failed: Hiba a Sede legördülő lista opciójának kiválasztásakor.
      session_expired_nav_failed: Az AEAT nyilatkozatnyilvántartó nem töltött be;
