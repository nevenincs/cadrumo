      modelo_unavailable: Az AEAT nyilatkozatnyilvántartó nem kínálja a kért modellt.
      no_auth_session: Az AEAT hitelesítési munkamenet hiányzik vagy nincs perzisztálva;
        futtassa először a `aeat config auth status` parancsot.
      notification_content_requires_operator: 'Nem nyitható meg olvasatlan értesítés
        tartalma: ez a lépés maga a kézbesítés (comparecencia), amely jogilag kézbesítetté
        teszi és elindítja a határidőket, és az Ön aláírását igényli. Nyissa meg személyesen
        a Sede felületén.'
      notifications_bad_landing: Az AEAT értesítési oldala nem töltődött be megfelelően;
