categories:
  registry:
    amortizacion_vivienda_afecto:
      label: Üzleti célra használt lakás amortizációja
      notes: A lakás amortizációját a tevékenység eszköznyilvántartásán keresztül
        vonod le, a lakás üzleti célra használt részére és a tulajdoni hányadodra
        számítva (Ley 35/2006 art. 29.2, Reglamento IRPF art. 22.3). Az ebbe a kategóriába
        tartozó főkönyvi tétel önmagában semmit sem von le.
    arrendamiento_local:
      label: Üzlethelyiség bérleti díja
      notes: Teljes mértékben levonható költség (Ley 35/2006 art. 28.1).
    arrendamiento_vivienda_afecta: Lakás bérleti díjának üzleti hányada
    arrendamiento_vivienda_afecto:
      notes: A lakás üzleti célra használt alapterületének aránya szerint levonható
        (Ley 35/2006 art. 29.2 és art. 28.1, üzleti célra használt lakás bérleti díja).
    asesoria_contable:
      label: Könyvelési tanácsadási díj
      notes: Teljes mértékben levonható költség, független szakmai szolgáltatásként
        (Ley 35/2006 art. 28.1).
    asesoria_fiscal:
      label: Adótanácsadási díj
      notes: Teljes mértékben levonható költség, független szakmai szolgáltatásként
        (Ley 35/2006 art. 28.1).
    asesoria_juridica:
      label: Jogi tanácsadási díj
      notes: Teljes mértékben levonható költség, független szakmai szolgáltatásként
        (Ley 35/2006 art. 28.1).
    comunidad_vivienda_afecto:
      label: Üzleti célra használt lakás közös költsége
      notes: A lakás tevékenységhez használt alapterületének aránya és a tulajdoni
        hányadod szerint levonható; a közüzemi díjakra vonatkozó 30% itt nem alkalmazandó
        (Ley 35/2006 art. 29.2, Reglamento IRPF art. 22.3, üzleti célra használt lakás
        közös költsége).
    cuotas_autonomos_ss:
      notes: Teljes mértékben levonható költség; a RETA-járulék a tevékenység folytatásának
        törvényi feltétele.
    cuotas_colegiales:
      label: Szakmai kamarai tagdíjak
      notes: Teljes mértékben levonható költség (Ley 35/2006 art. 28.1).
    cuotas_reta: Önálló vállalkozói társadalombiztosítási járulék (RETA)
    formacion_profesional:
      label: Szakmai továbbképzés
      notes: Teljes mértékben levonható költség (Ley 35/2006 art. 28.1, egyéb külső
        szolgáltatások).
    gastos_bancarios:
      label: Banki költségek
      notes: Teljes mértékben levonható költség (Ley 35/2006 art. 28.1, pénzügyi és
        banki költségek).
    gastos_financieros:
      label: Pénzügyi költségek
      notes: Teljes mértékben levonható költség (Ley 35/2006 art. 28.1, pénzügyi és
        banki költségek).
    hardware_amortizable:
      label: Amortizálható informatikai eszközök
      notes: 'Az éves amortizációs összeget vonod le a tevékenység eszköznyilvántartásán
        keresztül. A legfeljebb 300 EUR értékű új eszköz szabadon amortizálható, évente
        legfeljebb 25 000 EUR összegig (Ley 27/2014 art. 12.3.e). IVA: vegyes használatnál
        a cuota csak akkor vonható le a használati arány szerint, ha az eszköz értéke
        legalább 3005,06 EUR (Ley 37/1992 art. 95.Tres.1.ª és 108.Dos.5.º).'
    home_office_agua: Otthoni iroda vízdíja
    home_office_gas: Otthoni iroda gázköltsége
    home_office_internet: Otthoni iroda internetköltsége
    home_office_luz: Otthoni iroda villamosenergia-költsége
    ibi_local_afecto:
      label: Üzlethelyiség ingatlanadója (IBI)
      notes: Teljes mértékben levonható a tevékenység nem állami adójaként (Ley 35/2006
        art. 28.1, a Ley 27/2014 art. 15 alapján).
    ibi_vivienda_afecto:
      label: Üzleti célra használt lakás ingatlanadója (IBI)
      notes: A lakás tevékenységhez használt alapterületének aránya és a tulajdoni
        hányadod szerint levonható; a közüzemi díjakra vonatkozó 30% itt nem alkalmazandó
        (Ley 35/2006 art. 29.2, Reglamento IRPF art. 22.3, üzleti célra használt lakás
        ingatlanadója).
