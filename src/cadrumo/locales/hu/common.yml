      - az idempotencia-védelem biztonságossá teszi az újrapróbálást, és soha nem
      ír kétszer.
  elicitation:
    confirm:
      consequence_handoff: Ez létrehozza a benyújtásra kész állományt, amelyet az
        adózó maga ad be az AEAT-nak. A jóváhagyás semmit nem küld el sehová.
      consequence_local: Ez az aktív adózói profil helyi adatait módosítja.
      declined: A felhasználó nem hagyta jóvá a(z) '{command}' műveletet ({outcome});
        semmi nem futott le.
      field_description: Futtatod most a(z) '{command}' műveletet?
      message: Hagyd jóvá a(z) '{command}' futtatását. {consequence} Válaszolj igennel
        a folytatáshoz vagy nemmel a leállításhoz.
    refusal:
      blocked: 'A(z) ''{command}'' véglegesen tiltott: az AEAT-hoz való élő benyújtás
        tervezetten nem engedélyezett. Exportálj helyben; az adózó maga adja be.'
      no_channel: A(z) '{command}' emberi jóváhagyást igényel, és ez a kliens nem
        támogatja az interaktív kérdéseket. Futtasd olyan kliensből, amely kérdezni
        tud, vagy futtasd a megfelelő Cadrumo CLI-parancsot közvetlenül a terminálban.
  faithfulness:
    advisory: 'HITELESSÉGI FIGYELMEZTETÉS: a hívás argumentumai olyan összeget idéznek
      [{values}], amelyet ebben a munkamenetben egyetlen eszközeredmény sem állított
      elő. Ellenőrizd az értéket egy számítás- vagy revízióolvasással, mielőtt támaszkodsz
      rá.'
  harness:
    off_host_consent: 'Adatvédelmi tájékoztató - olvasd el a folytatás előtt. Ezt
      a konzolt egy AI-asszisztens működteti az általad választott LLM-szolgáltatón.
      A szavaid és az asszisztens által használt számadatok (összegek, rovat-értékek,
      kötelezettségek) elküldésre kerülnek ehhez a szolgáltatóhoz a konzol működtetéséhez.
      A FORRÁSDOKUMENTUMAID - számlák, bankkivonatok és bármilyen bizonyítékbájt -
      SOHA nem hagyják el a gépedet: titkosított helyi tárolóban maradnak, és soha
      nem kerülnek átvitelre. Ha harmadik fél (könyvelő vagy szakember) nevében jársz
      el, a folytatás előtt győződj meg róla, hogy ez elfogadható.'
  identity_gate:
    elicitation_echo: 'A következő adózói profilként jársz el: %{label}.'
    first_mutation_refused: 'Elutasítva: a munkamenet első módosítása előtt igazold
      vissza az aktív adózót. Benyújtás vagy szerkesztés soha nem futhat téves identitással.
      Hívd meg a whoami-t (vagy a ''config profile status'' / ''overview status''
      parancsot), hogy lásd, melyik adózó aktív, majd próbáld újra - egyetlen identitásolvasás
      feloldja ezt a munkamenetre, amíg nem váltasz profilt.'
  persona:
    handoff_denied: A(z) '{command}' a visszafordíthatatlan benyújtási átadási határ,
      amely a(z) '{owner}' szerepkörhöz tartozik; a(z) '{persona}' szerepkör szerkezetileg
      el van tiltva tőle. Add át az ellenőrzött munkaegységet az ellenőrző munkamenetnek
