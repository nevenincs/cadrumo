    elicitation_echo: 'A következő adózói profilként jársz el: %{label}.'
    first_mutation_refused: 'Elutasítva: a munkamenet első módosítása előtt igazold
      vissza az aktív adózót. Benyújtás vagy szerkesztés soha nem futhat téves identitással.
