      notes: 'Csak a saját, a tevékenység során felmerült étkezési költségeid, vendéglátóhelyen,
        elektronikus fizetéssel. Napi felső határ: 48,08 EUR éjszakázás nélkül, 91,35
        EUR, ha a szokásos munkahelyedtől és a lakóhelyedtől eltérő településen éjszakázol
