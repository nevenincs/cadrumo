      Szerkessze a profilt nem interaktívan, megadva a módosítandó mezőt: aeat config
      profile edit %{profile_name} --quiet --<mező> ÉRTÉK

      Vagy futtassa újra az irányított szerkesztést interaktív terminál-munkamenetből:
      aeat config profile edit %{profile_name}'
