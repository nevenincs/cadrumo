        prompt: Ez az adat eltér a tanúsítványtól. Melyik értéket tartja meg?
      keep:
        label: A saját válaszom megtartása
        provenance: Az Ön beállítási válasza
      title: Összevetés a Certificado de Situación Censal tanúsítvánnyal
    descendientes:
      acogimiento-resolucion:
        help: 'Az első örökbefogadás előtti vagy tartós nevelésbe vételi határozat
          dátuma. Akkor is adja meg, ha a gyermeket később örökbefogadták: a hároméves
          kor alatti növekmény az első nevelésbe vételtől számít, összesen három időszakon
          át tart, és az örökbefogadás nem indítja újra.'
        prompt: Az első nevelésbe vételi határozat dátuma
      alta-posterior-nacimiento-mes:
        help: Adjon meg egy hónapot 1 és 12 között. Ennek egyeznie kell az első megadott
          munkahónappal; hagyja üresen, ha az anya már a születéskor teljesítette
          a feltételt.
        invalid_range: A hónapnak %{minimum} és %{maximum} között kell lennie.
        prompt: Az a hónap, amikor az anya a születés után teljesítette a 30 járulékfizetési
          napot
      birth-date:
        prompt: Születési dátum
      convivencia:
        prompt: Ez a leszármazó Önnel él?
      count:
        help: 'Számolja meg a gyermekeket, akik után igénybe veheti a leszármazók
          utáni minimumot (LIRPF 58. cikk): 25 év alattiak (vagy bármely életkorú
          fogyatékos), akik Önnel élnek.'
        prompt: Hány leszármazót (gyermeket) szeretne bevallani?
      custodia-compartida:
        prompt: A felügyeletet megosztja a másik szülővel?
      declaracion-propia:
        help: Ez csak akkor szünteti meg a kedvezményt, ha a jövedelme is meghaladja
          a törvényi határt.
        prompt: Benyújtja a leszármazott a saját jövedelemadó-bevallását?
      dependencia-economica:
        choices:
          'false':
            label: Nem járulok hozzá az eltartásához
          'true':
            label: Igen, hozzájárulok az eltartásához
        help: Csak akkor válaszoljon, ha a leszármazott nem él Önnel. Az a szülő,
          akinek nincs felügyeleti joga, még közös sem, és nem fizet bírósági határozaton
          alapuló tartásdíjat, de hozzájárul a gyermek eltartásához, jogosult a leszármazottak
          utáni adóalap-kedvezményre. Ha tartásdíjat vall be, ez a beszámítás egyetlen
          leszármazottra sem alkalmazható, amíg az alkalmazás nem tudja azt gyermekenként
          megosztani.
        prompt: Hozzájárul Ön ennek a leszármazottnak a gazdasági eltartásához?
      discapacidad:
        choices:
          '0':
            label: Nincs fogyatékosság
          '33':
            label: 33%–64%
          '65':
            label: 65% vagy több
        prompt: Fogyatékosság mértéke
      entry-event:
        before_birth: A belépés dátuma nem lehet korábbi a születési dátumnál.
        in_future: A belépés dátuma nem lehet jövőbeli.
        relacion_mismatch: Ez a dátum nem felel meg a megadott jogviszonynak. Az anyakönyvi
          bejegyzés csak örökbefogadott leszármazottra vonatkozik, a nevelésbe vételi
          határozat pedig csak örökbefogadás előtti vagy tartós nevelésbe vételre,
          illetve korábban nevelésbe vett örökbefogadottra. Javítsa a jogviszonyt,
          vagy törölje a dátumot.
      fallecimiento:
        help: Hagyja üresen, ha ez a leszármazott nem hunyt el.
        prompt: A halálozás dátuma
      gastos-guarderia:
        both_declared: Adja meg ennek a gyermeknek vagy az éves bölcsődei összeget,
          vagy a havi összegeket, de ne mindkettőt. A havi bontás az egyetlen, amely
          ki tudja fejezni azt az évet, amelyben a gyermek betölti a harmadik életévét,
          ezért törölje az éves összeget.
        help: Engedélyezett bölcsődének fizetett összegek (LIRPF 81.2. cikk), amelyek
          növelik az anyasági levonást; egész euró.
        invalid_negative: A bölcsődei költség nem lehet negatív; adjon meg 0-t vagy
          pozitív összeget euróban (LIRPF 81 bis cikk).
        prompt: Az adóévben fizetett bölcsődei költségek (euró)
      gastos-guarderia-mensuales:
        help: 'Az éves összeg helyett ezt használja, ha a gyermek az adóévben tölti
          be a harmadik életévét: csak a születésnap utáni hónapok számítanak, és
          egy éves összeg nem osztható fel közöttük. Írja be minden hónapot és összegét
          HH:ÖSSZEG formában, pontosvesszővel elválasztva, vagy egy időszakot HH-HH:ÖSSZEG
          formában, például 9-12:210;1:180. A jogosult hónapokat a bölcsőde igazolja.'
        invalid_grammar: Írja be minden hónapot és összegét HH:ÖSSZEG formában, pontosvesszővel
          elválasztva; egy időszak HH-HH:ÖSSZEG formában írható. Például 9-12:210;1:180.
          A hónapok 1-től 12-ig terjednek, az összegek egész eurók, és minden hónap
          csak egyszer szerepelhet.
        prompt: Ennek a gyermeknek a bölcsődei költségei, hónapról hónapra (nem kötelező)
      inscripcion-registro-civil:
        help: Az a dátum, amikor az örökbefogadást az anyakönyvbe bejegyezték. Ha
          a bejegyzés nem volt szükséges, adja meg a bírósági vagy hatósági határozat
          dátumát. A hároméves kor alatti növekmény ettől a dátumtól számít.
        prompt: Anyakönyvi bejegyzés dátuma
      meses-madre-trabajo:
        help: 'Az anyasági levonáshoz (LIRPF 81. cikk): MELY hónapokban fizetett az
          anya tb-járulékot, amíg ez a gyermek jogosultságot adott -- 3 év alatt,
          vagy (kortól függetlenül) az INSCRIPCION/ACOGIMIENTO alatt rögzített örökbefogadási/nevelésbe
          vételi belépési ablakon belül. Írja MM vagy MM-MM formában, '';'' jellel
          elválasztva (például 5-8 vagy 1;2;11;12). A hónapokat, nem a számukat, mert
          a bölcsődei növekmény azon hónapok alapján arányosul, amelyeket ezek és
          a bölcsődei hónapok megosztanak.'
        invalid_range: Adja meg a hónapokat MM vagy MM-MM formában, ';' jellel elválasztva
          (például 5-8 vagy 1;2;11;12), mindegyik %{minimum} és %{maximum} között.
        prompt: Mely hónapokban dolgozott az anya jogosultan -- 3 év alatti gyermek,
          vagy örökbefogadás/nevelésbe vétel a belépési dátum ablakán belül (bevallási
          év)
      nif:
        prompt: A leszármazó adószáma (NIF/NIE) (hagyja üresen, ha nincs)
      prorrata-minimo:
        choices:
          'false':
            label: Nem, egyedül érvényesítem
          'true':
            label: Igen, megosztva a kettő között
        help: Hagyd üresen, és a családi állapotodból, a rögzített házastársból és
          a bevallás típusából vezetjük le.
        prompt: Jogosult másik adózó is a kedvezményre ezen leszármazott után?
      relacion:
        choices:
          acogimiento_preadoptivo_o_permanente:
            label: Örökbefogadás előtti vagy tartós nevelésbe vétel
          acogimiento_temporal:
            label: Ideiglenes nevelésbe vétel
          adoptado:
            label: Örökbefogadott
          descendiente:
            label: Leszármazott (gyermek vagy unoka)
          guarda_y_custodia_judicial:
            label: Bírósági határozaton alapuló gyermekelhelyezés
          tutela:
            label: Gyámság vagy törvényes képviselet
        help: Válassza ki a jogviszonyt. Mindegyik jogosít a leszármazottak utáni
          adóalap-kedvezményre. Csak az örökbefogadás és az örökbefogadás előtti vagy
          tartós nevelésbe vétel jogosít ezenfelül a hároméves kor alatti növekményre,
          a gyermek életkorától függetlenül; az ideiglenes nevelésbe vétel és a gyámság
          nem.
        prompt: Kapcsolat ezzel a leszármazottal
      rentas-anuales:
        help: Hagyd üresen, ha nem tudod. A magas jövedelem megszüntetheti a kedvezményt.
        invalid_negative: A leszármazott jövedelme nem lehet negatív.
        prompt: A leszármazott éves jövedelme, az adómentes részt nem számítva (euró)
