      1. Futtassa újra a parancsot interaktív terminálból az irányított beállítás
      használatához: aeat config profile create NAME

      2. Vagy hozzon létre resident IRPF természetes személy profilt egyetlen lépéssel,
      a szükséges adatokat kapcsolókként megadva: aeat config profile create NAME
      --quiet --tax-id NIF/CIF/DNI/NIE --entity-type natural_person --irpf-income-categories
