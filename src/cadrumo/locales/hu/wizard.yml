        help: IBAN, amelyet az AEAT megterhelhet a 303-as modell valasztott beszedesehez.
      cloud-evidence-upload:
        help: Érzékeny bizonylatok feltöltésének engedélyezése felhő LLM-szolgáltatókhoz
