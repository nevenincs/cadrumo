modelo:
  schema:
    '188':
      casilla:
        continuidad:
          capitalizacion-seguros-declarante-complementaria:
            label: 'Kiegészítő: C a kihagyott jövedelemkifizetések hozzáadásához'
          capitalizacion-seguros-declarante-contacto:
            label: A kapcsolattartó vezetékneve és utóneve
          capitalizacion-seguros-declarante-ejercicio:
            label: Adóév
          capitalizacion-seguros-declarante-justificante-anterior:
            label: Korábbi igazolás (csak helyettesítő bevallás esetén)
          capitalizacion-seguros-declarante-nif:
            label: A bevalló NIF-azonosítója
          capitalizacion-seguros-declarante-nombre:
            label: Vezetéknév és utónév vagy cégnév
          capitalizacion-seguros-declarante-numero-justificante:
            label: Igazolásszám (13 számjegy; 188-cal kezdődik)
          capitalizacion-seguros-declarante-sustitutiva:
            label: 'Helyettesítő: S egy korábbi bevallás helyettesítéséhez'
          capitalizacion-seguros-declarante-telefono:
            label: Kapcsolattartási telefonszám
          capitalizacion-seguros-perceptor-base-retenciones:
            help: IRPF esetén a hozam az alkalmazandó csökkentésekkel csökkentve.
              IS és állandó telephellyel rendelkező IRNR esetén a hozaméval azonos
              összeg és előjel. Bevallott érték; automatikus számítás még nincs.
            label: A levonások és adóelőlegek alapja
          capitalizacion-seguros-perceptor-clave:
            label: 'B kód: PIAS korai visszaváltása'
          capitalizacion-seguros-perceptor-ejercicio-devengo:
            help: Csak a korábbi adóévekben keletkezett összegekre. Minden keletkezési
              adóévet külön rekordban kell bevallani.
            label: Korábbi keletkezési adóév
          capitalizacion-seguros-perceptor-informacion-adicional:
            help: A PIAS életjáradék létrehozásakor közölt adómentes jövedelem, amelyet
              gazdasági jogainak teljes vagy részleges korai visszaváltásakor kell
              bevallani.
            label: PIAS korai visszaváltása miatt közölt adómentes jövedelem
          capitalizacion-seguros-perceptor-modalidad:
            label: 'Forma: 1 pénzbeli; 2 természetbeni'
          capitalizacion-seguros-perceptor-nif:
            label: A jövedelemszerző NIF-azonosítója
          capitalizacion-seguros-perceptor-nombre:
            label: A jövedelemszerző vezetékneve és utóneve vagy cégneve
          capitalizacion-seguros-perceptor-porcentaje-retencion:
            help: 'Százalékpontban megadott mérték: 19 jelentése 19 %. Ha az adóév
              során több mértéket alkalmaztak, csak az utolsót kell bevallani.'
            label: Levonási mérték (%)
          capitalizacion-seguros-perceptor-prima:
            label: Befizetett biztosítási díj
          capitalizacion-seguros-perceptor-provincia:
            label: Tartománykód
          capitalizacion-seguros-perceptor-reducciones:
            help: Csak IRPF esetén. Negatív hozamnál nullát kell bevallani; IS és
              állandó telephellyel rendelkező IRNR esetén nem alkalmazandó.
            label: A negyedik átmeneti rendelkezés szerinti csökkentések
          capitalizacion-seguros-perceptor-rendimiento-acreedor-hipotecario:
            label: Olyan biztosítás hozama, amelynek kedvezményezettje a jelzáloghitelező
          capitalizacion-seguros-perceptor-renta-vitalicia-clave:
            label: 'Művelet: A létrehozás; B korai visszaváltás'
          capitalizacion-seguros-perceptor-renta-vitalicia-fecha:
            help: Ha az adóév során létrehozás és korai visszaváltás is történt, minden
              műveletet külön rekordban kell megadni.
            label: A létrehozás vagy a korai visszaváltás dátuma
          capitalizacion-seguros-perceptor-renta-vitalicia-identificacion:
            label: A biztosított életjáradék azonosítója
          capitalizacion-seguros-perceptor-rentas:
            help: Összeg euróban, előjellel. Az eltérő előjelű hozamokat külön rekordokban
              kell bevallani.
            label: Ingó tőkéből származó jövedelmek vagy hozamok
          capitalizacion-seguros-perceptor-representante-nif:
            label: A törvényes képviselő NIF-azonosítója
          capitalizacion-seguros-perceptor-retenciones:
            help: Bevallott összeg. Negatív alap esetén nullának kell lennie. A mezők
              közötti ellenőrzés és az automatikus számítás még nem készült el.
            label: Levonások és adóelőlegek
          capitalizacion-seguros-resumen-base-negativa:
            help: A negatív alapú jövedelemszerzői rekordokban szereplő levonási és
              adóelőleg-alapok összege.
            label: A levonások és adóelőlegek negatív alapja
          capitalizacion-seguros-resumen-base-positiva:
            help: A pozitív alapú jövedelemszerzői rekordokban szereplő levonási és
              adóelőleg-alapok összege.
            label: A levonások és adóelőlegek alapja
          capitalizacion-seguros-resumen-perceptores-base-negativa:
            help: Azon rekordok száma, amelyeknél a levonások és adóelőlegek alapja
              negatív vagy nulla. A több rekordban szereplő jövedelemszerzőt minden
              rekordnál egyszer kell számolni.
            label: Negatív vagy nulla alappal rendelkező jövedelemszerzők összesített
              száma
          capitalizacion-seguros-resumen-perceptores-base-positiva:
            help: Azon jövedelemszerzők (rekordok) száma, akiknek a levonások és adóelőlegek
              alapja pozitív.
            label: Pozitív alappal rendelkező jövedelemszerzők összesített száma
          capitalizacion-seguros-resumen-retenciones:
            help: A bevallott jövedelmekre alkalmazott levonások és adóelőlegek összege.
            label: Levonások és adóelőlegek
      field:
        official_name: Modelo 188. Adóelőleg-levonások és -befizetések. Tőkésítési
