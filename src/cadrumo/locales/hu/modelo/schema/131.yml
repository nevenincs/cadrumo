modelo:
  schema:
    '131':
      casilla:
        continuidad:
          irpf-pf-modulos-1-unidades:
            label: '1. modul (Alkalmazott személyzet): egységek száma'
          irpf-pf-modulos-1-unidades-anterior:
            label: '1. modul (Alkalmazott személyzet): egységek száma az előző adóévben
              (2023), a foglalkoztatási kedvezmény csökkentéséhez'
          irpf-pf-modulos-2-unidades:
            label: '2. modul (Nem alkalmazott személyzet): egységek száma'
          irpf-pf-modulos-3-unidades:
            label: '3. modul (tevékenységspecifikus egység: alapterület, megtett távolság
              vagy raksúly): egységek száma'
          irpf-pf-modulos-4-unidades:
            label: '4. modul (tevékenységspecifikus egység: villamosenergia- vagy
              egyéb energiafogyasztás): egységek száma'
          irpf-pf-modulos-5-unidades:
            label: '5. modul (tevékenységspecifikus egység, pl. a független helyiség
              fennmaradó alapterülete vagy asztalok): egységek száma'
          irpf-pf-modulos-6-unidades:
            label: '6. modul (tevékenységspecifikus egység, pl. a nem független helyiség
              fennmaradó alapterülete vagy A típusú gépek): egységek száma'
          irpf-pf-modulos-7-unidades:
            label: '7. modul (tevékenységspecifikus egység, pl. a kemence felülete
              vagy B típusú gépek): egységek száma'
          irpf-pf-modulos-diferencia:
            label: Különbözet
          irpf-pf-modulos-epigrafe-iae:
            label: A tevékenység IAE-tételszáma az objektív becslési (modulos) rendszerben.
              A 659.4 és 691.9 tételszámok, amelyek két különböző tevékenységet ugyanazon
              kód alatt csoportosítanak, esetén használja az "a" vagy "b" utótagot
              (pl. "659.4a", "691.9b") a tevékenységnek megfelelően - a pontos hozzárendeléshez
              tekintse meg az m131-modulos-coeficientes együttható paramétert.
          irpf-pf-modulos-indice-inicio-actividad:
            label: 'Korrekciós index új tevékenységek indítására (b.4 pont, 2025-01-01
              után kizárólagos helyiségben indított tevékenység). Az üzemeltető által
              megadott index (0,80/0,90; 0,60/0,70 ≥33%-os fogyatékosság esetén, HAC/1425/2025
              rendelet II. melléklet, 2.3.b.4 utasítás); a motor nem modellezi az
              indítás évét vagy a fogyatékosságot. Összeegyeztethetetlen a szezonális
              indexszel (b.2): ha mindkettőt megadják, a szezonális index érvényesül.'
          irpf-pf-modulos-indice-pequena-dimension:
            label: Korrekciós index kisvállalkozások számára (b.1 pont - egy településen,
              egyetlen helyiségben, alkalmazott nélkül vagy legfeljebb 2 alkalmazottal).
              Az üzemeltető által megadott index (0,70/0,75/0,80/0,90, HAC/1425/2025
              rendelet II. melléklet, 2.3.b.1 utasítás); a motor nem modellezi az
              adózó tényeit. Soha nem alkalmazandó a különleges indexszel rendelkező
              tevékenységekre (721.2, 722).
          irpf-pf-modulos-indice-temporada:
            label: 'Szezonális korrekciós index (b.2 pont - szezonális tevékenység,
              évi legfeljebb 180 nap). Az üzemeltető által megadott index (1,50/1,35/1,25
              az időtartamtól függően, HAC/1425/2025 rendelet II. melléklet, 2.3.b.2
              utasítás); a motor nem modellezi az időtartamot mint adózói tényt. Összeegyeztethetetlen
              az új tevékenység indítási indexével (b.4): ha mindkettőt megadják,
              ez érvényesül.'
          irpf-pf-modulos-pequena-dimension-ignorado-flag:
            label: 'Belső jelző (1/0): a bejelentett kisvállalkozási korrekciós index
              (b.1) figyelmen kívül maradt a tevékenység különleges korrekciós indexével
              való összeférhetetlenség miatt (HAC/1425/2025 rendelet II. melléklet,
              2.3.a/b.1 utasítás).'
          irpf-pf-modulos-rendimiento-neto-actividad:
            label: 'A tevékenység nettó jövedelme (4. szakasz: modulok − általános
              5%-os csökkentés)'
          irpf-pf-modulos-rendimiento-neto-minorado:
            label: 'Csökkentett nettó jövedelem (2. szakasz: előzetes − foglalkoztatási
              kedvezmény csökkentése − beruházási kedvezmény csökkentése)'
          irpf-pf-modulos-rendimiento-neto-previo:
            label: 'Előzetes nettó jövedelem (1. szakasz: Σ modulegységek × egységenkénti
              éves hozam)'
          irpf-pf-modulos-resultado-declaracion:
            label: A bevallás eredménye
          irpf-pf-modulos-resultados-negativos-anteriores:
            label: Korábbi negyedévek negatív eredményei
          irpf-pf-modulos-suma-rendimientos:
            label: Nettó jövedelmek összege
          irpf-pf-modulos-temporada-inicio-actividad-conflicto-flag:
            label: 'Belső jelző (1/0): a szezonális korrekciós indexet (b.2) és az
              új tevékenység indítási korrekciós indexét (b.4) egyidejűleg jelentették
              be, amelyek kölcsönösen összeférhetetlenek (HAC/1425/2025 rendelet II.
              melléklet, 2.3 utasítás).'
          irpf-pf-modulos-total:
            label: Összesen
          irpf-pf-modulos-volumen-agrario:
            label: A negyedév mezőgazdasági bevétele
          irpf-pf-modulos-volumen-sin-datos-base:
            label: Forgalom vagy bevétel alapadatok nélkül
          irpf-pf-saldo-negativo-fin-periodo:
            label: Későbbi időszakokra átvihető negatív egyenleg (max. 0, -10. rovat)
          minoracion-rendimientos-actividades-economicas:
            label: Csökkentés a gazdasági tevékenységből származó nettó jövedelem
              után
          pago-fraccionado-previo:
            label: Előzetes előlegfizetések összege
          pago-fraccionado-previo-agrario:
            label: Előzetes mezőgazdasági előlegfizetés
          pago-fraccionado-previo-datos-base:
            label: Előzetes előlegfizetés alapadatok szerint
          pago-fraccionado-previo-sin-datos-base:
            label: Előzetes előlegfizetés alapadatok nélkül
          prestamo-vivienda-habitual:
            label: Az állandó lakóhelyre felvett kölcsönök törlesztése
          resultado-anteriores-autoliquidaciones:
            label: Korábbi önadózásokból befizetendő eredmény
          retenciones-ingresos-a-cuenta:
            label: Forrásadó és részletfizetés
      field:
        official_name: Modelo 131. IRPF. Objektív megállapítás alá tartozó vállalkozók
          és szakemberek. Részletfizetés.
        title: IRPF részletfizetés, objektív megállapítás
      revision:
        2019-2023:
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: '131-es modelo: negyedéves előlegfizetés az objektív becslés
                  rendszerében (2019-2023 közötti adóévek)'
          field:
            label: 2019-2023. adóévek
        '2024':
          casilla:
            modulos-indice-inicio-actividad:
              label: 'Korrekciós index új tevékenységek indítására (b.4 pont, 2023-01-01
