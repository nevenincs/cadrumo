              label: 'Korrekciós index új tevékenységek indítására (b.4 pont, 2023-01-01
                után kizárólagos helyiségben indított tevékenység). Az üzemeltető
                által megadott index (0,80/0,90; 0,60/0,70 ≥33%-os fogyatékosság esetén,
                HFP/1359/2023 rendelet II. melléklet, 2.3.b.4 utasítás); a motor nem
                modellezi az indítás évét vagy a fogyatékosságot. Összeegyeztethetetlen
                a szezonális indexszel (b.2): ha mindkettőt megadják, a szezonális
                index érvényesül.'
            modulos-indice-pequena-dimension:
              label: Korrekciós index kisvállalkozások számára (b.1 pont - egy településen,
                egyetlen helyiségben, alkalmazott nélkül vagy legfeljebb 2 alkalmazottal).
                Az üzemeltető által megadott index (0,70/0,75/0,80/0,90, HFP/1359/2023
                rendelet II. melléklet, 2.3.b.1 utasítás); a motor nem modellezi az
                adózó tényeit. Soha nem alkalmazandó a különleges indexszel rendelkező
                tevékenységekre (721.2, 722).
            modulos-indice-temporada:
              label: 'Szezonális korrekciós index (b.2 pont - szezonális tevékenység,
                évi legfeljebb 180 nap). Az üzemeltető által megadott index (1,50/1,35/1,25
                az időtartamtól függően, HFP/1359/2023 rendelet II. melléklet, 2.3.b.2
                utasítás); a motor nem modellezi az időtartamot mint adózói tényt.
                Összeegyeztethetetlen az új tevékenység indítási indexével (b.4):
                ha mindkettőt megadják, ez érvényesül.'
            modulos-minoracion-inversion:
              label: Csökkentés beruházási ösztönzők után (a használatban lévő tárgyi
                vagy immateriális eszközök amortizációja, a beruházási eszközök nyilvántartása
                szerint). Az üzemeltető által megadott összeg; a motor nem modellez
                tételenkénti eszköznyilvántartást - lásd a HFP/1359/2023 rendelet
                II. mellékletének 2.2.b) utasítását és a saját amortizációs táblázatát.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Belső jelző (1/0): a bejelentett kisvállalkozási korrekciós
                index (b.1) figyelmen kívül maradt a tevékenység különleges korrekciós
                indexével való összeférhetetlenség miatt (HFP/1359/2023 rendelet II.
                melléklet, 2.3.a/b.1 utasítás).'
            modulos-rendimiento-neto-modulos:
              label: 'Modulok szerinti nettó jövedelem (3. szakasz: csökkentett összeg
                az általános korrekciós indexekkel kiigazítva - kisvállalkozás, szezonalitás/új
                tevékenység indítása, többlet - a HFP/1359/2023 rendelet II. mellékletének
                2.3 utasításában meghatározott sorrendben és összeférhetetlenségekkel)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Belső jelző (1/0): a szezonális korrekciós indexet (b.2) és
                az új tevékenység indítási korrekciós indexét (b.4) egyidejűleg jelentették
                be, amelyek kölcsönösen összeférhetetlenek (HFP/1359/2023 rendelet
                II. melléklet, 2.3 utasítás).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: '131-es nyomtatvány: negyedéves előlegfizetés az objektív becslés
                  rendszerében (2024. adóév)'
          field:
            label: Adóév 2024
