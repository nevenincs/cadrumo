                indexével való összeférhetetlenség miatt (HFP/1359/2023 rendelet II.
                melléklet, 2.3.a/b.1 utasítás).'
            modulos-rendimiento-neto-modulos:
              label: 'Modulok szerinti nettó jövedelem (3. szakasz: csökkentett összeg
                az általános korrekciós indexekkel kiigazítva - kisvállalkozás, szezonalitás/új
                tevékenység indítása, többlet - a HFP/1359/2023 rendelet II. mellékletének
