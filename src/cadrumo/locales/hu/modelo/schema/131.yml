                szerint). Az üzemeltető által megadott összeg; a motor nem modellez
                tételenkénti eszköznyilvántartást - lásd a HFP/1359/2023 rendelet
                II. mellékletének 2.2.b) utasítását és a saját amortizációs táblázatát.
            modulos-pequena-dimension-ignorado-flag:
