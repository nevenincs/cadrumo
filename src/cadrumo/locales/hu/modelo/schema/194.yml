      field:
        official_name: Modelo 194. A magánszemélyek jövedelemadója, a társasági adó
          és a külföldi illetőségűek jövedelemadója (állandó telephelyek). Tőkejövedelmekre,
          valamint idegen tőke bevonását és felhasználását megtestesítő bármely eszköz
          átruházásából, amortizációjából, visszaváltásából, cseréjéből vagy átalakításából
          származó jövedelmekre vonatkozó adóelőleg-levonások és -befizetések. Éves
          összesítő.
        title: Tőkejövedelmek és eszközátruházások adóelőleg-levonása - éves összesítő
