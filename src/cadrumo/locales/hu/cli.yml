          \ időszakhoz már van rekord.\n\nKét eset:\n\n  --amount 0   Nulla nyitóegyenleg:\
          \ azt deklarálja, hogy erre az időszakra nincs áthozandó függő kompenzáció.\
          \ Ez olyan adózónál is előfordulhat, aki korábban már adott be M303 bevallást,\
          \ ha az utolsó M303 nem hagyott függőben lévő kompenzációt.\n\n  --amount\
          \ X   Áthozott egyenleg: az adózó korábbi M303 bevallásokat nyújtott be\
          \ más eszközzel vagy közvetlenül az AEAT-nál. X az utolsó benyújtott M303\
          \ bevallásból származó, későbbi időszakokra függőben maradó kompenzáció.\n\
          \nAz automatikus first_period_zero eset független a seed parancstól: a számítás\
          \ és az egyeztetés során a tevékenységkezdési és nyilvántartási feltételek\
          \ bizonyítják, hogy ez az első IVA-időszak; ekkor az AEAT 110-es casilla\
          \ nulla a LIVA 99.5. cikke (37/1992. törvény) alapján, és nem blokkol."
