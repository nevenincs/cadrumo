cli:
  app:
    ledger:
      bienes_inversion:
        acquisition_year_help: A jószág beszerzésének éve.
        art108_help: A jószág a LIVA 108. cikk szerint beruházási jószágnak minősül-e.
        asset_ref_help: Opcionális kereszthivatkozás egy AssetRecord azonosítóra.
        cuota_soportada_help: A beszerzéskor viselt teljes előzetes áfa (pozitív).
        declare_help: Egy áfa-korrekcióhoz nyilvántartott beruházási jószág bejelentése.
        description_help: A jószág leírása.
        disposal_regime_help: Átruházási rezsim (sujeta_no_exenta vagy exenta_o_no_sujeta);
          a --disposal-year mellett kötelező.
        disposal_requires_both: A --disposal-year és a --disposal-regime csak együtt
          adható meg.
        disposal_year_help: Opcionális átruházási év (110. cikk).
        group_help: Beruházási javak áfa-levonás korrekciós nyilvántartása (LIVA 107-110.
          cikk).
        identifier_help: Stabil nyilvántartási azonosító.
        kind_help: 'Korrekciós időszak: ingó (4 év) vagy ingatlan (9 év).'
        list_help: Az aktív profil nyilvántartásában szereplő összes beruházási jószág
          listázása.
        prorrata_inicial_help: A beszerzés évének végleges levonási százaléka (0-100).
        unknown_disposal_regime: 'Ismeretlen átruházási rezsim {regime!r}; elfogadott:
          {accepted}'
      counterparty:
        actor_help: A kijelentést tevő kezelő azonosítója, amelyet rögzítünk.
        confirm_help: Erősítse meg, hol letelepedett az ügyfél, és melyik tagállam
          adja áfa-azonosítóját.
        country_code_help: Az ország, amely alatt az azonosítót megadták, ha nem spanyol.
        evidenced_scope_help: Az a terület, ahová a kezében lévő dokumentum ezt a
          felet helyezi. Adja meg, hogy megkérdezze, mit válaszol a létra erre a dokumentumra;
          csak így láthatja az eltérést attól, amit korábban megerősített, mielőtt
          egy megerősítés elutasítaná.
        group_help: Erősítse meg, mit tudunk az ügyfélről – egyszer, minden későbbi
          bizonylathoz.
        identification_state_help: 'Az a tagállam, amely a partnert ÁFA szempontjából
          azonosítja. Ez más adat, mint a --scope: a 25. cikk ez alapján mentesít,
          nem a letelepedés helye alapján.'
        note_help: Mire alapozza a választ, saját szavaival. Rögzítjük, de soha nem
          használjuk fel.
        scope_help: Az áfa szempontjából irányadó terület, ahol az ügyfél letelepedett.
        show_help: Mutassa meg az ügyfélhez megerősített letelepedést, ha van ilyen.
        tax_identifier_help: Az ügyfél adóazonosítója a bizonylaton nyomtatott formában.
        withdraw_help: Vonja vissza az ügyfélről rögzített megerősítést, kijelentve,
          hogy a korábbi válasz téves volt.
      evidence:
        add_help: Vásárlásiszámla-bizonyíték regisztrálása PDF-ből vagy képből.
        attachment_id_help: A tartalom alapján címzett melléklet azonosítója.
        attachment_queue_help: A számlaellenőrzésre váró Drive-mellékletek listázása.
        attachment_view_help: A tárolt melléklet metaadatainak és eredetének vizsgálata.
        batch_directory_help: A könyvtár, amelynek fájljait feldolgozza. Kombinálható
          az ismételt --file kapcsolóval, vagy helyettesíthető azzal.
        batch_file_help: Egy feldolgozandó dokumentum. Dokumentumonként ismételje
          meg; könyvtárral együtt is használható.
        batch_help: Egy könyvtár minden dokumentumát (vagy minden --file értéket)
          bizonylatként és átnézhető piszkozatként dolgozza fel, dokumentumonként
          egy eredménysorral.
        batch_items_refused_message: A rendszer néhány dokumentumot elutasított. A
          futtatás többi dokumentuma ettől függetlenül elkészült; az elutasított sorok
          megnevezik a tapasztaltakat.
        batch_pending_review_message: Néhány piszkozat olyan megállapítást hordoz,
          amelyet embernek kell rendeznie a számla létrehozása előtt. Ezek visszatartva
          vannak, nem hiúsultak meg.
        batch_progress_message: 'feldolgozva %{source}: %{status}'
        batch_source_required: Adjon meg egy könyvtár argumentumot, egy vagy több
          --file kapcsolót, vagy mindkettőt.
        batch_work_deferred_message: A rendszer néhány dokumentumot nem olvasott be,
          mert nem futtatható olvasómodell. Semmilyen értéket nem tippelt meg belőlük,
          és semmi nem hiúsult meg; futtassa újra, ha az alábbi ok megszűnt.
        confirm_already_exists_message: Már létezik számla ezzel az azonossággal;
          változatlanul visszaadva, nem pedig duplikációt létrehozva.
        confirm_category_contradicted_message: 'A dokumentumban megjelölt adózási
          mód és a felszámított adó nem lehet egyszerre igaz, ezért egyik oldalról
          sem volt átvehető áfakezelés, és nem került rögzítésre. Olvasd újra a dokumentumot:
          a kettő egyikét félreolvasták, vagy maga a dokumentum hibás.'
        confirm_category_rate_inferred_message: Ennek a számlának az áfakezelését
          a tételein felszámított adókulcs döntötte el, mert a szabálytábla nem tudta
          elhelyezni az ügyletet -- rendszerint azért, mert az egyik fél áfaterülete
          nincs megállapítva. A rögzített kezelés az adott kulcshoz tartozó szokásos
          belföldi kezelés. Ellenőrizd, ha ez a teljesítés nem belföldi volt.
        confirm_category_unresolved_message: 'Semmi sem állapított meg áfakezelést
          ehhez a számlához: a dokumentum nem jelölt meg egyet sem, és magának az
          ügyletnek a tényei sem vezettek egyre. A számla nyilvántartásba kerül, és
          nem bontható be bevallásba, amíg egy kezelés meg nem állapítható.'
        confirm_category_unsupported_relief_message: A dokumentum olyan spanyol fizetendő
          áfa alóli mentességre hivatkozik, amely teljes egészében azon múlik, hol
          telepedett le a partner, és ezt semmi sem állapította meg. A kezelés visszatartásra
          kerül ahelyett, hogy a dokumentumot hibásnak mondanánk, így ez a számla
          áfakezelés nélkül kerül nyilvántartásba, és nem bontható be bevallásba,
          amíg a partner országa vagy letelepedése nem tisztázódik.
        confirm_counterparty_name_help: A partner megjelenített neve (még nincs kinyerést
          segítő heurisztika; általában kötelező).
        confirm_counterparty_nif_help: Felülírja a kinyert szállítói adóazonosítót.
        confirm_currency_help: ISO-4217 pénznemkód.
        confirm_help: Újra kinyeri a bizonylatot helyben, és megerősíti valódi katalógus-számlaként.
        confirm_invoice_class_help: Adja meg a számla osztályát, ha a dokumentum nem
          jelöli. A helyesbítő számlát a dokumentumból olvassuk ki, ha megnevezi a
          javított számlát, ezért ez a beállítás azokra a dokumentumokra való, amelyek
          nem teszik.
        confirm_invoice_date_help: Felülírja a kinyert számla dátumát (ÉÉÉÉ-HH-NN).
        confirm_invoice_number_help: Felülírja a kinyert számlaszámot.
        confirm_iva_rate_help: Felülírja a kinyert ÁFA-kulcsot (hagyja ki a kinyert
          érték megtartásához).
        confirm_link_hint_message: A számla megfelelő főkönyvi tranzakció nélkül került
          rögzítésre.
        confirm_operation_type_help: 'A 349-es modell kulcsa kozossegen beluli termekertekesiteshez.
          Kotelezo, ha a dokumentum kozossegen beluli ertekesitest jelol: a kategoria
          nem mondja meg, hogy adomentes behozatalt kovetett-e.'
        confirm_printed_total_mismatch_message: A dokumentumon szereplő végösszeg
          nem egyezik a rögzített végösszeggel. A rögzített végösszeg az adóalapból
          és az áfakulcsból származik, ezért az eltérés azt jelenti, hogy a dokumentum
          olyan összeget tartalmaz, amelyet ez a nyilvántartás nem, például egyenértékűségi
          felárat (recargo de equivalencia), vagy valamelyik érték félreolvasásra
          került. Ellenőrizze a dokumentumot.
        confirm_rectifies_help: Annak a számlának a száma, amelyet ez a helyesbítő
          számla javít. Az RD 1619/2012 6.1.a.2 cikke a saját sorozattal együtt megköveteli,
          és a dokumentumból olvassuk ki, ha megadja.
        confirm_resolve_help: 'Válaszoljon egy blokkoló észrevételre: <finding-id>=<choose|supply|attest>:<érték-vagy-indok>.
          A choose esetén az olvasatot az értékével vagy a review által mutatott kivonattal
          nevezze meg. Észrevételenként egyszer ismételje; nincs tömeges kapcsoló.'
        confirm_review_contradicted_regime_message: Ez a dokumentum ellentmond önmagának
          abban, hogyan adózik. Az alábbi részlet megnevezi, mi mivel volt ellentmondásban.
        confirm_review_undetermined_establishment_message: A dokumentum a beolvasott
          formájában eldöntetlenül hagyta, hogy a számla egyik fele hol telepedett
          le. Az áfaterület dönti el a kezelést, és nem feltételezzük, hogy a félsziget.
          Az alábbi részlet megnevezi a felet és azt, ami hiányzott.
        confirm_series_help: A sorozat, amelyben a számlát kiállították. Az RD 1619/2012
          6.1.a.2 cikke előírja, hogy a helyesbítő számla saját sorozatba kerüljön,
          ezért ennek az osztálynak a megadásához sorozat is kell; a dokumentumból
          olvassuk ki, ha megadja.
        confirm_supply_nature_help: Adja meg, hogy az ügylet termékértékesítés vagy
          szolgáltatásnyújtás. A teljesítési hely szabályai eltérnek, ezért ha a dokumentum
          nem jelöli, a kezelés eldöntetlen marad.
        confirm_taxable_base_help: Felülírja a kinyert adóalapot.
        consent:
          bytes_unrecallable: 'A hozzájárulás visszavonása megállítja a további küldést.
            A már elküldött bájtokat nem hívja vissza: ez a program nem tudja azokat
            a szolgáltatótól visszaszerezni vagy törölni. A helyi újraszármaztatás
            a jelenlegi nyilvántartásából eltávolítja a gépen kívüli olvasást, a szolgáltatóéból
            nem.'
          content_address_help: A dokumentum tárolt bájtjainak SHA-256 tartalomcíme.
          evidence_reference_help: Az újraszármaztatandó bizonylat vagy melléklet
            azonosítója.
          group_help: Tekintse át, mi került gépen kívüli modellhez, és állítsa vissza
            az eredményeket helyben.
          list_help: Sorolja fel az összes gépen kívüli küldést és az azokból származó
            eredményeket.
          no_history: 'Egyetlen bizonyítékbájt sem hagyta el ezt a gépet: ehhez a
            profilhoz nincs rögzített gépen kívüli továbbítás.'
          rederive_help: Olvassa be újra az egyik eredményt ezen a gépen a tárolt
            átiratból.
          rederive_refused: 'Az újraszármaztatás elutasítva: {detail}'
          rederived: A(z) {reference} újraszármaztatva ezen a gépen. Korábban {previous}
            volt; most {current}. A korábbi olvasás felülírásra került, de nem törlődött.
          transcriber_help: Az újrafelhasználandó átirat gyorsítótárkulcsa.
        evidence_id_help: Bizonyíték azonosítója (pontos egyezés).
        extract_acknowledge_off_host_help: Megerősítés arról, hogy a dokumentum ennél
          az egy beolvasásnál elhagyja a gépet.
        extract_acknowledge_without_provider: Az --acknowledge-off-host olyan továbbítást
          erősít meg, amely nem történne meg. Adja meg az --off-host-provider kapcsolót
          is, vagy hagyja el a megerősítést.
        extract_attachment_id_help: A kapcsolt melléklet azonosítója, amelyből az
          adatokat ki kell nyerni (a --evidence-id alternatívája).
        extract_evidence_id_help: A beszerzési számla bizonylat azonosítója, amelyből
          az adatokat ki kell nyerni.
        extract_help: A számla PDF mezőinek helyi (on-host) beolvasása áttekinthető
          piszkozatba.
        extract_off_host_needs_content_address: Ennek a bizonylatnak nincs tartalmi
          lenyomata, ezért a gépen kívüli beolvasás nem rögzíthető az elküldendő bájtokhoz
          kötve.
        extract_off_host_needs_evidence_id: 'A gépen kívüli beolvasáshoz meg kell
          adni az --evidence-id értéket: a hozzájárulás a dokumentum tartalmi lenyomatához
          kötődik, amelyet a melléklet azonosítója nem hordoz.'
        extract_off_host_provider_help: A dokumentum elküldése távoli modellnek a
          helyi beolvasás helyett.
        extract_off_host_provider_is_local: Az --off-host-provider local az alapértelmezés,
          és semmit nem küld el a gépről. Hagyja el a kapcsolót, vagy adjon meg távoli
          szolgáltatót.
        extract_provider_without_acknowledge: A dokumentum gépen kívüli beolvasása
          a tartalmát harmadik félnek küldi el. Adja hozzá az --acknowledge-off-host
          kapcsolót ennek az egy beolvasásnak a megerősítéséhez.
        extract_reference_required: 'Adja meg pontosan az egyiket: --evidence-id vagy
          --attachment-id.'
        extract_review_hint_message: Ez a kinyerés hozzávetőleges piszkozat, és a
          mezői nincsenek megerősítve.
        field_ambiguous: '{field}: több olvasat versengett, és nem lehetett dönteni
          közülük ({candidates}). Válasszon egyet ahelyett, hogy a piszkozatot változatlanul
          elfogadná.'
        field_anchor_not_found: '{field}: az olvasó a(z) ''{anchor}'' elemre mutat,
          amely nem szerepel a dokumentum átiratában. Egy normalizált érték jogosan
          megbukhat ezen a keresésen, ezért ellenőrizze a mezőt ahelyett, hogy megerősítettnek
          tekintené. {detail}'
        field_anchor_self_reported: '{field}: az olvasó szerint ezt a(z) ''{anchor}''
          helyről olvasta, de ezt az állítást ugyanaz az olvasó tette, amely az értéket
          előállította, így semmi független nem erősítette meg.'
        field_anchor_uncorroborated: '{field}: az olvasó a(z) ''{anchor}'' elemre
          mutat, és semmi nem jelezte, hogy ez az alak hiányozna a dokumentumból.
          Az érték továbbra sincs megerősítve, tehát nem a nyomtatott alak az, ami
          tisztázatlan maradt. {detail}'
        field_contradicted: '{field}: a dokumentumban ''{anchor}'' szerepel, ami nem
          egyezik a mezőhöz rögzített értékkel. {detail}'
        field_no_anchor: '{field}: az olvasó semmit nem jelölt meg a dokumentumban,
          így nincs nyomtatott alak, amelyhez ez az érték ellenőrizhető lenne.'
        group_help: Vásárlásiszámla-bizonyíték PDF- vagy képformátumban.
        invoice_date_help: A számla kiállításának dátuma ISO 8601 szerint (ÉÉÉÉ-HH-NN),
          pl. 2026-01-15.
        invoice_number_help: Szállítói számlaszám.
        iva_amount_help: Számla IVA-összege.
        iva_rate_help: Alkalmazott IVA-kulcs tizedes törtként.
        list_help: Regisztrált vásárlásiszámla-bizonyítékok listázása.
        notes_help: Belső megjegyzések a bizonyítékról.
        remove_help: Vásárlásiszámla-bizonyíték törlése.
        review:
          advised_pending_message: Néhány függőben lévő dokumentum figyelmeztetéseket
            hordoz. Ezek semmit sem blokkolnak, és a jelenlegi állapotukban megerősítésre
            kerülnek, így semmi más nem veti fel őket újra. Szűkítsd a sort az `--advisory`
            kapcsolóval, és nyiss meg egyet a `review show` paranccsal.
          advisory_help: Csak azokat a piszkozatokat mutatja, amelyek ezt a nem blokkoló
            figyelmeztetést hordozzák. Semmit sem akadályoznak meg, ezért egyébként
            csak az egyes dokumentumok megnyitásával derülnek ki.
          blocked_message: Ez a dokumentum addig nem erositheto meg, amig minden alabbi
            eszrevetelt egyenkent meg nem valaszolja. Minden valasz egy eszrevetelt
            nevez meg az azonositojaval.
          blocked_pending_message: Nehany fuggo dokumentum olyan eszreveteleket hordoz,
            amelyeket a megerosites elott meg kell valaszolni. Vizsgaljon meg egyet
            a `review show` paranccsal.
          blocking_help: Csak azokat a piszkozatokat jelenitse meg, amelyek eszrevetel
            megvalaszolasaig nem erositehetok meg.
          country_code_unassigned_message: Az egyik fél országkódja az ISO 3166-1
            által fenntartott tartományba esik, amelyhez soha nem rendelnek országot,
            így a dokumentum ország helyett csak egy karakterláncot ad meg, és semmi
            sem helyezi el ezt a felet. Javítsa a kódot a dokumentum alapján. Ez a
            piszkozat ettől még megerősíthető; a fél egyszerűen letelepedés nélkül
            marad addig.
          country_code_uncatalogued_message: 'Az egyik fél országkódja valós országot
            jelölhet, amelyet a rendszer beépített szótára még nem tartalmaz, így
            semmit sem lehet mondani arról, hol telepedett le ez a fél. A dokumentum
            újraolvasása nem dönti el: az országot fel kell venni. Ez a piszkozat
            ettől még megerősíthető; a fél egyszerűen letelepedés nélkül marad addig.'
          finding_help: Csak azokat a piszkozatokat jelenitse meg, amelyek dokumentuma
            megbukott ezen a determinisztikus ellenorzesen.
          group_help: Tekintse at a fuggoben levo kivonatolasi piszkozatokat, mielott
            szamlava erositi oket.
          list_help: Listazza az emberi ellenorzesre varo kivonatolasi piszkozatokat.
          party_attribution_unverified_message: Semmi sem ellenőrzi, hogy ezek a címadatok
            melyik félhez tartoznak. Ha két címblokkot fordítva olvasnának be, mindkét
            fél olyan áfaterületre kerülne, ahol egyikük sem telepedett le, és ezt
            egyetlen ellenőrzés sem szűrné ki. Vesse össze minden értéket a dokumentummal,
            mielőtt jóváhagyja ezt a piszkozatot.
          reason_help: Csak az ezen okbol blokkolt piszkozatokat jelenitse meg.
          reference_help: A fuggo piszkozat forrasakent szolgalo bizonyitek- vagy
            mellekletazonosito.
          resolve_action: Ismeretlen feloldasi muvelet.
          resolve_shape: Minden --resolve alakja <finding-id>=<choose|supply|attest>:<érték-vagy-indok>.
            A choose az olvasatot az értékével vagy a review által mutatott kivonattal
            nevezi meg.
          show_help: Jelenitsen meg egy fuggo piszkozatot mezonkent, eszrevetelekkel
            es akadalyokkal.
          unknown_reference: Nincs fuggo piszkozat ehhez az azonositohoz.
        source_path_help: A számla PDF- vagy képfájljának elérési útja.
        supplier_help: Szállító neve.
        taxable_base_help: Számla adóköteles alapja.
        update_help: Vásárlásiszámla-bizonyíték adatainak frissítése.
        view_help: Vásárlásiszámla-bizonyíték megjelenítése.
        yes_help: Bizonyíték törlésének megerősítése.
        yes_required: Adja meg a --yes kapcsolót a bizonyíték törléséhez.
      inventory:
        acquisition_cost_invalid: 'Érvénytelen beszerzési költség JSON a szabványos
          bemenetről: {details}'
        acquisition_cost_stdin_help: A teljes beszerzési költség JSON-objektum beolvasása
          a szabványos bemenetről
        actividad_id_help: Gazdasági tevékenység azonosítója.
        authority_file_help: A teljes zárókészlet-hatósági JSON-dokumentum beolvasása
          fájlból.
        authority_invalid: A zárókészlet-hatósági objektum érvénytelen ehhez a készletfőkönyvhöz.
        closing_authority_record_help: A bizonyított zárókészlet-hatóság atomi rögzítése
        create_help: Készlet-főkönyv létrehozása egy tevékenységhez és adóévhez.
        group_help: Készlet-főkönyvek tevékenységek, mozgások és értékelés szerint.
        iva_rate_help: IVA-kulcs százalékban.
        list_help: Készlet-főkönyvek listázása az aktív profilban.
        movement_add_help: Vásárlási, értékesítési vagy helyesbítési mozgás hozzáadása
          a főkönyvhöz.
        movement_date_help: Mozgás dátuma (ÉÉÉÉ-HH-NN).
