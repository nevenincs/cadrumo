          olvas.
      verify:
        help: Ellenőrzi, hogy a modellek betöltődnek és időkorláton belül válaszolnak
          egy egyszerű kérésre, alapértelmezés szerint minden olvasószerepkör modelljére,
          hacsak a --role vagy a --model nem szűkíti.
        model_help: Az ellenőrizendő modell futtatókörnyezeti azonosítója. Alapértelmezés
          a szerepkörhöz választott modell.
    repair:
