    provision:
      browser:
        help: Letölti az AEAT-automatizálás által indított böngészőváltozatot. Ha
          már telepítve van, nem tesz semmit.
      help: 'Az ezen a gépen futó összetevők kezelése: az AEAT-automatizálás böngészője,
        valamint a helyi dokumentumolvasó (futtatókörnyezet állapota, telepítés, indítás,
        modellletöltés, -betöltés, -ellenőrzés és -eltávolítás, vagy az egész beállítása
        egy lépésben).'
      install:
        confirm_help: Hozzájárulás a csomagkezelős telepítés letöltéséhez és futtatásához.
          Enélkül semmi sem települ.
        help: A helyi futtatókörnyezet telepítése a platform csomagkezelőjével (Windowson
          winget, macOS-en Homebrew). Ha már telepítve van, nem tesz semmit; Linuxon
          neked kell telepítened.
      load:
        help: Modellek betöltése a helyi futtatókörnyezet memóriájába, hogy az első
          beolvasásnak ne kelljen hidegindításra várnia; minden olvasói szerepkör
          modelljét, hacsak a --role vagy a --model nem szűkíti. Betöltés előtt elutasítja,
          ha kevés a memória; a már betöltött modellt nem módosítja.
        model_help: A betöltendő modell azonosítója a futtatókörnyezetben. Már letöltöttnek
          kell lennie. Alapértelmezés szerint a szerepkörhöz kiválasztott modell.
      probe:
        help: Most ellenőrzi a szövegmodell alkalmasságát ahelyett, hogy az `aeat
          config provision verify` által rögzített ítéletet olvasná, és ezzel az eredménnyel
          jelenti a helyi olvasó állapotát. Betölti a modellt; semmit sem rögzít.
      pull:
        help: Modellek letöltése a helyi futtatókörnyezetbe, alapértelmezés szerint
          minden olvasószerepkör modelljéé, hacsak a --role vagy a --model nem szűkíti.
          Letöltés előtt elutasít, ha egy modell nem lenne betölthető.
        model_help: A letöltendő modell futtatókörnyezeti azonosítója. Alapértelmezés
          a szerepkörhöz választott modell.
      remove:
        help: Egy Cadrumo által kiválasztott modell törlése a helyi futtatókörnyezet
          tárolójából, a felszabadított hely jelentésével.
        model_help: A törlendő modell futtatókörnyezeti azonosítója. Csak a Cadrumo
          által kiválasztott modellek törölhetők.
      report:
        help: Jelentés a mért hardverről, a szerepkörhöz választott modellről és a
          betölthetőségről.
      role_help: 'A kezelendő modellszerepkör (képátírás, szövegkinyerés, táblázatos
        leképezés, teljesítés jellegére tett javaslat). Alapértelmezés: minden szerepkör.'
      setup:
        confirm_help: Hozzájárulás a csomagkezelős telepítés letöltéséhez és futtatásához,
          ha hiányzik a futtatókörnyezet. Enélkül a beállítás a telepítési lépésnél
          leáll, és nem telepít.
        help: 'A helyi olvasó beállítása egy lépésben: a futtatókörnyezet telepítése
          (csak --confirm esetén), indítása, minden szerepkör modelljének letöltése,
          betöltése és ellenőrzése. A már elvégzett lépéseket változatlanként jelzi;
          az első sikertelen lépés leállítja a futást.'
      start:
        help: Elindítja a telepített helyi futtatókörnyezetet, ha a beállított helyi
          végpont nem válaszol. Ha már válaszol, nem tesz semmit.
