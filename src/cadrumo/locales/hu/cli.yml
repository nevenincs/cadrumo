cli:
  app:
    ledger:
      actividad_asset:
        claim_help: Előrejelzés rögzítése értékcsökkenési elszámolásként; az azonos
          ismétlés a meglévő bejegyzést adja vissza.
        correct_help: Az eszköz aktuális változatát felváltó új változat hozzáfűzése
          (JSON).
        create_help: Eszköz létrehozása az első, megváltoztathatatlan változatából
          (JSON).
        filing_handoff_help: A rögzített elszámolások megjelenítése a Modelo 100-on
          és halmozottan a Modelo 130-on.
        forecast_help: A változat választása szerinti értékcsökkenés kiszámítása egy
          időszakra, rögzítés nélkül.
        group_help: 'IRPF gazdasági tevékenységi eszköznyilvántartás: megváltoztathatatlan
          változatok, értékcsökkenési előrejelzések és rögzített elszámolások (LIS
          12. cikk).'
        inspect_help: Egy eszköz teljes változatláncának megjelenítése.
      bienes_inversion:
        acquisition_year_help: A jószág beszerzésének éve.
        art108_help: A jószág a LIVA 108. cikk szerint beruházási jószágnak minősül-e.
        cuota_soportada_help: A beszerzéskor viselt teljes előzetes áfa (pozitív).
        declare_help: Egy áfa-korrekcióhoz nyilvántartott beruházási jószág bejelentése.
        description_help: A jószág leírása.
        disposal_regime_help: Átruházási rezsim (sujeta_no_exenta vagy exenta_o_no_sujeta);
          a --disposal-year mellett kötelező.
        disposal_requires_both: A --disposal-year és a --disposal-regime csak együtt
          adható meg.
        disposal_year_help: Opcionális átruházási év (110. cikk).
        group_help: Beruházási javak áfa-levonás korrekciós nyilvántartása (LIVA 107-110.
          cikk).
        identifier_help: Stabil nyilvántartási azonosító.
        kind_help: 'Korrekciós időszak: ingó (4 év) vagy ingatlan (9 év).'
        list_help: Az aktív profil nyilvántartásában szereplő összes beruházási jószág
          listázása.
        prorrata_inicial_help: A beszerzés évének végleges levonási százaléka (0-100).
      counterparty:
        actor_help: Az azonosítód, amelyet a kijelentés szerzőjeként rögzítünk.
        confirm_help: Erősítsd meg, hol telepedett le az ügyfél, és melyik tagállam
          adja áfa-azonosítóját.
        country_code_help: Az ország, amely alatt az azonosítót megadták, ha nem spanyol.
        evidenced_scope_help: Az a terület, ahová a kezedben lévő dokumentum ezt a
          felet helyezi. Add meg, hogy megkérdezd, mit válaszol a létra erre a dokumentumra;
          csak így láthatod az eltérést attól, amit korábban megerősítettél, mielőtt
          egy megerősítés elutasítaná.
        group_help: Erősítsd meg, mit tudunk az ügyfélről – egyszer, minden későbbi
          bizonylathoz.
        identification_state_help: 'Az a tagállam, amely a partnert ÁFA szempontjából
          azonosítja. Ez más adat, mint a --scope: a 25. cikk ez alapján mentesít,
          nem a letelepedés helye alapján.'
        note_help: Mire alapozza a választ, saját szavaival. Rögzítjük, de soha nem
          használjuk fel.
        scope_help: Az áfa szempontjából irányadó terület, ahol az ügyfél letelepedett.
        tax_identifier_help: Az ügyfél adóazonosítója a bizonylaton nyomtatott formában.
        view_help: Megmutatja, mit válaszolna az áfa-azonosítási létra erre az üzleti
          partnerre az eddig megerősített adatok alapján.
        withdraw_help: Vonja vissza az ügyfélről rögzített megerősítést, kijelentve,
          hogy a korábbi válasz téves volt.
      evidence:
        add_help: Vásárlásiszámla-bizonyíték regisztrálása PDF-ből vagy képből.
        attachment_id_help: A tartalom alapján címzett melléklet azonosítója.
        attachment_queue_help: A számlaellenőrzésre váró Drive-mellékletek listázása.
        attachment_view_help: A tárolt melléklet metaadatainak és eredetének vizsgálata.
        batch_directory_help: A könyvtár, amelynek fájljait feldolgozza. Kombinálható
          az ismételt --file kapcsolóval, vagy helyettesíthető azzal.
        batch_file_help: Egy feldolgozandó dokumentum. Dokumentumonként ismételd meg;
          könyvtárral együtt is használható.
        batch_help: Dolgozd fel egy könyvtár minden dokumentumát (vagy minden --file
          értéket) bizonylatként és átnézhető piszkozatként, dokumentumonként egy
          eredménysorral.
        batch_items_refused_message: A rendszer néhány dokumentumot elutasított. A
          futtatás többi dokumentuma ettől függetlenül elkészült; az elutasított sorok
          megnevezik a tapasztaltakat.
        batch_label_reading_degraded_message: '{count} tárolt piszkozatot csak a dokumentumok
          címkéi alapján olvastunk be, mert az automatikus olvasó nem futott le. A
          kitöltendő mezők ezekben a piszkozatokban üresek, mert még nem lettek beolvasva,
          nem pedig azért, mert a dokumentumokból hiányoznának; minden sor megnevezi
          az okot. A dokumentum megerősítése újra beolvassa azt, így ezek a mezők
          akkor kitöltődnek, ha az ok már megszűnt, vagy te magad is kitöltheted őket.'
        batch_pending_review_message: Néhány piszkozat olyan problémát hordoz, amelyet
          neked kell rendezned a számla létrehozása előtt. Ezek visszatartva vannak,
          nem hiúsultak meg.
        batch_progress_message: 'feldolgozva %{source}: %{status}'
        batch_source_required: Adj meg egy könyvtár argumentumot, egy vagy több --file
          kapcsolót, vagy mindkettőt.
        batch_work_deferred_message: A rendszer néhány dokumentumot nem olvasott be,
          mert nem futtatható olvasómodell. Semmilyen értéket nem tippelt meg belőlük,
          és semmi nem hiúsult meg; futtasd újra, ha az alábbi ok megszűnt.
        confirm_already_exists_message: Már létezik számla ezzel az azonossággal;
          változatlanul visszaadva, nem pedig duplikációt létrehozva.
        confirm_category_contradicted_message: 'A dokumentumban megjelölt adózási
          mód és a felszámított adó nem lehet egyszerre igaz, ezért egyik oldalról
          sem volt átvehető IVA-kezelés, és nem került rögzítésre. Olvasd újra a dokumentumot:
          a kettő egyikét félreolvasták, vagy maga a dokumentum hibás.'
        confirm_category_rate_inferred_message: Ennek a számlának az IVA-kezelését
          a tételein felszámított adókulcs döntötte el, mert a szabálytábla nem tudta
          elhelyezni az ügyletet, rendszerint azért, mert az egyik fél IVA-területe
          nincs megállapítva. A rögzített kezelés az adott kulcshoz tartozó szokásos
          belföldi kezelés. Ellenőrizd, ha ez a teljesítés nem belföldi volt.
        confirm_category_unresolved_message: 'Semmi sem állapított meg áfakezelést
          ehhez a számlához: a dokumentum nem jelölt meg egyet sem, és magának az
          ügyletnek a tényei sem vezettek egyre. A számla nyilvántartásba kerül, és
          nem bontható be bevallásba, amíg egy kezelés meg nem állapítható.'
        confirm_category_unsupported_relief_message: A dokumentum olyan spanyol fizetendő
          áfa alóli mentességre hivatkozik, amely teljes egészében azon múlik, hol
          telepedett le a partner, és ezt semmi sem állapította meg. A kezelés visszatartásra
          kerül ahelyett, hogy a dokumentumot hibásnak mondanánk, így ez a számla
          áfakezelés nélkül kerül nyilvántartásba, és nem bontható be bevallásba,
          amíg a partner országa vagy letelepedése nem tisztázódik.
        confirm_counterparty_name_help: A partner megjelenített neve (még nincs kinyerést
          segítő heurisztika; általában kötelező).
        confirm_counterparty_nif_help: Írd felül a kinyert szállítói adóazonosítót.
        confirm_currency_help: ISO-4217 pénznemkód.
        confirm_expected_draft_review_sha256_help: Az áttekintett pontos tervezet
          ellenőrzési lenyomata, amelyet a kinyerés adott vissza.
        confirm_expected_source_sha256_help: A bizonylatkinyerés során visszaadott
          SHA-256 lenyomat; ellenőrzi, hogy a bájtok változatlanok.
        confirm_help: Újra kinyeri a bizonylatot helyben, és megerősíti valódi katalógus-számlaként.
        confirm_invoice_class_help: Add meg a számla osztályát, ha a dokumentum nem
          jelöli. A helyesbítő számlát a dokumentumból olvassuk ki, ha megnevezi a
          javított számlát, ezért ez a beállítás azokra a dokumentumokra való, amelyek
          nem teszik.
        confirm_invoice_date_help: Írd felül a kinyert számla dátumát (ÉÉÉÉ-HH-NN).
        confirm_invoice_number_help: Írd felül a kinyert számlaszámot.
        confirm_iva_amount_help: Felülírja a kinyert áfaösszeget; elhagyásával megőrzi
          azt.
        confirm_iva_category_help: A számlához rögzítendő áfakategória azonosítója.
        confirm_iva_rate_help: Írd felül a kinyert ÁFA-kulcsot (hagyd ki a kinyert
          érték megtartásához).
        confirm_link_hint_message: A számla a nyilvántartásodban megfelelő tranzakció
          nélkül került rögzítésre.
        confirm_operation_date_help: Az adóköteles ügylet dátuma (ISO ÉÉÉÉ-HH-NN).
        confirm_operation_type_help: 'A Modelo 349 kulcsa kozossegen belüli termekertekesiteshez.
          Kötelező, ha a dokumentum kozossegen belüli ertekesitest jelöl: a kategória
          nem mondja meg, hogy adómentes behozatalt követett-e.'
        confirm_printed_total_mismatch_message: A dokumentumon szereplő végösszeg
          nem egyezik a rögzített végösszeggel. A rögzített végösszeg az adóalapból
          és az IVA-kulcsból származik, ezért az eltérés azt jelenti, hogy a dokumentum
          olyan összeget tartalmaz, amelyet ez a nyilvántartás nem, például egyenértékűségi
          felárat (recargo de equivalencia), vagy valamelyik érték félreolvasásra
          került. Ellenőrizd a dokumentumot.
        confirm_recargo_amount_help: A számlán szereplő egyenértékűségi pótdíj összege.
        confirm_rectifies_help: Annak a számlának a száma, amelyet ez a helyesbítő
          számla javít. Az RD 1619/2012 6.1.a.2 cikke a saját sorozattal együtt megköveteli,
          és a dokumentumból olvassuk ki, ha megadja.
        confirm_resolve_help: 'Válaszolj egy blokkoló problémára: <finding-id>=<choose|supply|attest>:<érték-vagy-indok>.
          A choose esetén az olvasatot az értékével vagy a review által mutatott kivonattal
          nevezd meg. Problémánként egyszer ismételd; nincs tömeges kapcsoló.'
        confirm_retention_amount_help: A számlán szereplő jövedelemadó-levonás összege.
        confirm_retention_rate_help: A számlán szereplő jövedelemadó-levonás százaléka.
        confirm_review_contradicted_regime_message: Ez a dokumentum ellentmond önmagának
          abban, hogyan adózik. Az alábbi részlet megnevezi, mi mivel volt ellentmondásban.
        confirm_review_undetermined_establishment_message: A dokumentum a beolvasott
          formájában eldöntetlenül hagyta, hogy a számla egyik fele hol telepedett
          le. Az áfaterület dönti el a kezelést, és nem feltételezzük, hogy a félsziget.
          Az alábbi részlet megnevezi a felet és azt, ami hiányzott.
        confirm_series_help: A sorozat, amelyben a számlát kiállították. Az RD 1619/2012
          6.1.a.2 cikke előírja, hogy a helyesbítő számla saját sorozatba kerüljön,
          ezért ennek az osztálynak a megadásához sorozat is kell; a dokumentumból
          olvassuk ki, ha megadja.
        confirm_supply_nature_help: Add meg, hogy az ügylet termékértékesítés vagy
          szolgáltatásnyújtás. A teljesítési hely szabályai eltérnek, ezért ha a dokumentum
          nem jelöli, a kezelés eldöntetlen marad.
        confirm_taxable_base_help: Írd felül a kinyert adóalapot.
        consent:
          bytes_unrecallable: 'A hozzájárulás visszavonása megállítja a további küldést.
            A már elküldött bájtokat nem hívja vissza: ez a program nem tudja azokat
            a szolgáltatótól visszaszerezni vagy törölni.'
          group_help: Tekintsd át, mi került gépen kívüli modellhez.
          list_help: Sorold fel az összes gépen kívüli küldést és az azokból származó
            fájlokat.
          no_history: 'Egyetlen bizonyítékbájt sem hagyta el ezt a gépet: ehhez a
            profilhoz nincs rögzített gépen kívüli továbbítás.'
        evidence_id_help: Bizonyíték azonosítója (pontos egyezés).
        extract_acknowledge_off_host_help: Megerősítés arról, hogy a dokumentum ennél
          az egy beolvasásnál elhagyja a gépet.
        extract_acknowledge_without_provider: Az --acknowledge-off-host olyan továbbítást
          erősít meg, amely nem történne meg. Add meg az --off-host-provider kapcsolót
          is, vagy hagyd el a megerősítést.
        extract_attachment_id_help: A kapcsolt melléklet azonosítója, amelyből az
          adatokat ki kell nyerni (a --evidence-id alternatívája).
        extract_evidence_id_help: A beszerzési számla bizonylat azonosítója, amelyből
          az adatokat ki kell nyerni.
        extract_help: A számla PDF-mezőinek helyi kinyerése áttekinthető piszkozatba.
        extract_off_host_needs_evidence_id: 'A gépen kívüli beolvasáshoz meg kell
          adni az --evidence-id értéket: a hozzájárulás a dokumentum tartalmi lenyomatához
          kötődik, amelyet a melléklet azonosítója nem hordoz.'
        extract_off_host_provider_help: A dokumentum elküldése távoli modellnek a
          helyi beolvasás helyett.
        extract_off_host_provider_is_local: Az --off-host-provider local az alapértelmezés,
          és semmit nem küld el a gépről. Hagyd el a kapcsolót, vagy adj meg távoli
          szolgáltatót.
        extract_off_host_unclassified: 'A gépen kívüli olvasás elutasítva: a hozzájárulási
          kapu {outcome} értéket adott vissza, amelyhez ennek a parancsnak nincs szövege.
          A fel nem ismert választ elutasításként kezeljük, hogy a bizonyítékok ne
          hagyhassák el a gépet olyan döntés alapján, amelyet senki sem mondott ki.'
        extract_provider_without_acknowledge: A dokumentum gépen kívüli beolvasása
          a tartalmát harmadik félnek küldi el. Add hozzá az --acknowledge-off-host
          kapcsolót ennek az egy beolvasásnak a megerősítéséhez.
        extract_reference_required: 'Add meg pontosan az egyiket: --evidence-id vagy
          --attachment-id.'
        extract_review_hint_message: Ez a kinyerés hozzávetőleges piszkozat, és a
          mezői nincsenek megerősítve.
        field_ambiguous: '{field}: több olvasat versengett, és nem lehetett dönteni
          közülük ({candidates}). Válassz egyet ahelyett, hogy a piszkozatot változatlanul
          elfogadnád.'
        field_anchor_not_found: '{field}: az olvasó a(z) ''{anchor}'' elemre mutat,
          amely nem szerepel a dokumentum átiratában. Egy normalizált érték jogosan
          megbukhat ezen a keresésen, ezért ellenőrizd a mezőt ahelyett, hogy megerősítettnek
          tekintenéd. {detail}'
        field_anchor_self_reported: '{field}: az olvasó szerint ezt a(z) ''{anchor}''
          helyről olvasta, de ezt az állítást ugyanaz az olvasó tette, amely az értéket
          előállította, így semmi független nem erősítette meg.'
        field_anchor_uncorroborated: '{field}: az olvasó a(z) ''{anchor}'' elemre
          mutat, és semmi nem jelezte, hogy ez az alak hiányozna a dokumentumból.
          Az érték továbbra sincs megerősítve, tehát nem a nyomtatott alak az, ami
          tisztázatlan maradt. {detail}'
        field_contradicted: '{field}: a dokumentumban ''{anchor}'' szerepel, ami nem
          egyezik a mezőhöz rögzített értékkel. {detail}'
        field_no_anchor: '{field}: az olvasó semmit nem jelölt meg a dokumentumban,
          így nincs nyomtatott alak, amelyhez ez az érték ellenőrizhető lenne.'
        group_help: Vásárlásiszámla-bizonyíték PDF- vagy képformátumban.
        idempotency_key_help: Saját kulcs ehhez a melléklethez. A parancs ugyanazzal
          a kulccsal megismételve a már létrehozott rekordot adja vissza új helyett,
          és elutasítja, ha a kulcshoz tartozó dokumentum megváltozott. Kulcs nélkül
          a parancs minden alkalommal új rekordot hoz létre, mert ugyanaz a fájl jogosan
          kétszer is csatolható.
        invoice_date_help: A számla kiállításának dátuma ISO 8601 szerint (ÉÉÉÉ-HH-NN),
          pl. 2026-01-15.
        invoice_number_help: Szállítói számlaszám.
        iva_amount_help: Számla IVA-összege.
        iva_rate_help: Alkalmazott IVA-kulcs százalékban, például 21.
        label_reading_busy_refused: 'Az automatikus olvasó nem futott le, mert egy
          másik olvasás már használta ezt a gépet. A címkék által nem lefedett {count}
          mező még nem lett beolvasva, ezért üres marad: {fields}. A dokumentumot
          csak a címkék alapján olvastuk be; futtasd újra a kinyerést, amint a másik
          olvasás befejeződött, vagy töltsd ki ezeket a mezőket te magad.'
        label_reading_headroom_refused: 'Az automatikus olvasó nem futott le, mert
          ezen a gépen nincs elég szabad memória hozzá. A címkék által nem lefedett
          {count} mező még nem lett beolvasva, ezért üres marad: {fields}. A dokumentumot
          csak a címkék alapján olvastuk be; szabadíts fel memóriát, és futtasd újra
          a kinyerést, vagy töltsd ki ezeket a mezőket te magad.'
        label_reading_reader_unavailable: 'Az automatikus olvasó nem indult el ({error_type}).
          A címkék által nem lefedett {count} mező még nem lett beolvasva, ezért üres
          marad: {fields}. A dokumentumot csak a címkék alapján olvastuk be; futtasd
          újra a kinyerést később, vagy töltsd ki ezeket a mezőket te magad.'
        list_help: Regisztrált vásárlásiszámla-bizonyítékok listázása.
        notes_help: Belső megjegyzések a bizonyítékról.
        pull_actor_help: A neved vagy címkéd.
        pull_all_errors:
          folder_id_unrecognised: A(z) %{reference} Google Drive mappahivatkozás nem
            tartalmaz felismerhető mappaazonosítót. Adj meg egy Drive mappa-URL-t
            vagy a puszta mappaazonosítót.
        pull_all_folder_help: Drive mappa-URL vagy puszta mappaazonosító a PDF-/kép-számlák
          tömeges letöltéséhez.
        pull_all_help: Kötegelten kérd le egy Drive-mappa összes PDF- vagy képszámláját,
          és tárold mindegyiket titkosított, tranzakcióhoz nem kapcsolt bizonyítékként.
        pull_all_labels:
          fetched: letöltött_db
          folder_id: mappa_azonosító
          refused: elutasított_db
          skipped: kihagyott_nem_dokumentum_db
          total: összes_dokumentum
        pull_all_note_help: Minden letöltött mellékleten rögzített opcionális megjegyzés.
        pull_all_notices:
          files_refused: Ebben a mappában %{refused_count} fájlt nem sikerült letölteni
            a drive.file hatókörben; töltsd le őket kézzel, és csatold őket.
        pull_help: Tölts le egy Drive dokumentumhivatkozást, és tárold a bájtjait
          titkosított bizonylatként a nyilvántartásod egyik tranzakcióján.
        pull_id_help: A nyilvántartás tranzakciójának azonosítója.
        pull_note_help: Opcionális megjegyzés.
        pull_reference_help: A dokumentumhivatkozás referenciája.
        pull_source_help: 'Hivatkozás forrása: gmail, google_drive vagy url.'
        remove_help: Vásárlásiszámla-bizonyíték törlése.
        review:
          advised_pending_message: Néhány függőben lévő dokumentum figyelmeztetéseket
            hordoz. Ezek semmit sem blokkolnak, és a jelenlegi állapotukban megerősítésre
            kerülnek, így semmi más nem veti fel őket újra. Szűkítsd a sort az `--advisory`
