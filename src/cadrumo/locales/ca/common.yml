  harness:
    off_host_consent: 'Avís de privadesa: llegeix-lo abans de continuar. Aquesta consola
      la maneja un assistent d''IA que s''executa en el proveïdor de LLM que hagis
      triat. Les teves paraules i les xifres amb què treballa l''assistent (imports,
      valors de casella, obligacions) s''envien a aquest proveïdor per operar la consola.
      Els teus DOCUMENTS D''ORIGEN (factures, extractes bancaris i qualsevol byte
      d''evidència) MAI no surten del teu equip: es queden en emmagatzematge local
      xifrat i no es transmeten mai. Si actues per compte d''un tercer (un gestor
      o professional), confirma que això és acceptable abans de continuar.'
  identity_gate:
    elicitation_echo: 'Actuant com el perfil de contribuent: %{label}.'
    first_mutation_refused: 'Rebutjat: confirma el contribuent actiu abans del primer
      canvi d''aquesta sessió. Una presentació o edició mai no s''ha d''executar amb
      la identitat equivocada. Crida whoami (o ''config profile status'' / ''overview
