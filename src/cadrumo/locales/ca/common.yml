      notes: Deduïble fins a 500 EUR l'any per cada persona assegurada (tu, el teu
        cònjuge i els teus fills menors de 25 anys que convisquin amb tu), o 1.500
        EUR per cada persona amb discapacitat (Ley 35/2006 art. 30.2, regla 5a, lletra
        a).
