aggregation:
  grouping:
    errors:
      unsupported_modelo: No hi ha cap contracte d'agregació registrat per al model
        sol·licitat.
  invoice_retencion:
    errors:
      euro_figures_unavailable_after_defect_sweep: Les xifres en euros no estan disponibles
        en una factura que ha superat l'escombrat de defectes.
      perceptor_tax_id_unavailable_after_defect_sweep: L'identificador fiscal del
        perceptor no està disponible en una factura que ha superat l'escombrat de
        defectes.
      projection_defects_repeat: Una projecció de retenció de factura repeteix el
        mateix defecte.
      projection_outcome_ambiguous: Una projecció de retenció de factura ha de portar
        o una observació o defectes, mai tots dos ni cap.
  irnr_income_ledger:
    diagnostics:
      foreign_source_out_of_scope: source_jurisdiction %{source_jurisdiction} queda
        fora de l'àmbit de font que declara la revisió seleccionada del Model 210;
        l'art. 13 del TRLIRNR només admet rendes obtingudes en territori espanyol.
      incomplete_m210_classification: L'operació entrant de font espanyola no té una
        classificació explícita de renda del Model 210; la projecció de l'IRNR mai
        no infereix un codi oficial de tipus de renda a partir de irpf_category.
      source_jurisdiction_unresolved: source_jurisdiction no està resolta (None) en
        una candidata entrant del Model 210; l'art. 13 del TRLIRNR només admet rendes
        de font espanyola en aquesta projecció de l'IRNR.
      tipo_renta_code_not_declared: El codi oficial de tipus de renda %{tipo_renta_code}
        del Model 210 no està declarat per a la revisió i el període de presentació
        %{period} seleccionats.
    errors:
      income_type_codes_missing: La revisió seleccionada del Model 210 no declara
        cap codi de tipus de renda vàlid per a aquest període de presentació.
      income_type_namespace_missing: La revisió seleccionada del Model 210 no declara
        exactament un espai de codis de tipus de renda amb clau.
      registry_revision_mismatch: La revisió del Model 210 injectada no coincideix
        amb la revisió que l'autoritat fixada selecciona per a aquest model, exercici
        i període.
      source_scope_missing: La revisió seleccionada del Model 210 no declara un únic
        àmbit de jurisdicció de la font per a aquesta casella de rendiments íntegres.
  iva_ledger:
    errors:
      bucket_mismatch: El bucket del repositori de moviments no coincideix amb el
        bucket d'agregació sol·licitat.
      deduction_authority_on_non_deducible_row: Una fila d'IVA que no suporta quota
        deduïble no pot portar una classificació de deducció; la categoria d'IVA %{category}
        es liquida com %{flow_direction}. Elimineu el tipus de deducció declarat o
        corregiu la categoria.
      differentiated_sector_inactive_for_filing_year: Un sector diferenciat està inactiu
        per a l'exercici.
      differentiated_sector_without_filing_year_entry: Un sector diferenciat no té
        entrada de registre per a l'exercici.
      differentiated_sector_without_provisional_percentage: Un sector diferenciat
        no té percentatge provisional resolt.
      domestic_identification_on_intra_community_transaction: Una identificació a
        efectes de l'IVA espanyola no és vàlida per a una operació intracomunitària.
      eu_member_state_on_export_transaction: Les operacions d'exportació o assimilades
        no poden portar un Estat membre de la UE; rebut %{member_state}.
      inadmissible_deduction_classification: 'El tipus de deducció d''IVA declarat
        %{deduction_fact_kind} no és admissible en una fila de la categoria d''IVA
        %{iva_category}: %{refusal}. Corregiu el tipus de deducció declarat, la categoria
        d''IVA o l''evidència vinculada.'
      investment_observations_missing_bienes_inversion_authority: Les observacions
        d'IVA d'inversió requereixen el registre explícit de béns d'inversió i una
        autoritat de perfil coincident.
      missing_counterparty_establishment_on_export: Una exportació està exempta perquè
        l'operació surt de la Unió, de manera que depèn d'on estigui ESTABLERTA la
        contrapart. Registreu el país de la contrapart; un codi absent o no assignat
        no estableix res, i la seva identificació a efectes d'IVA no pot respondre-hi.
      missing_counterparty_identification_state: Una operació intracomunitària requereix
        l'Estat membre en què la contrapart està identificada a efectes de l'IVA.
      rectification_consumed_more_than_once: Un fet d'IVA ja corregit només es pot
        rectificar una vegada.
      sectorized_apportionment_duplicate_sectors: El repartiment sectoritzat d'IVA
        declara el mateix sector més d'una vegada.
      sectorized_especial_missing_input_classification: La prorrata especial sectoritzada
        requereix una classificació d'entrada explícita.
      sectorized_input_inactive_sector: Una entrada d'IVA sectoritzada referencia
        un sector inactiu.
      sectorized_input_missing_sector_identity: Una entrada d'IVA sectoritzada no
        aporta identitat de sector explícita.
      sectorized_input_unknown_sector: Una entrada d'IVA sectoritzada referencia un
        sector desconegut.
  m303_arrivals:
    errors:
      prorrata_register_contradictory_transition_evidence: El registre de prorrata
        recull alhora una opció i una revocació per al mateix exercici.
      prorrata_register_incomplete_current_year_declaration: El registre de prorrata
        no té una declaració explícita i completa per a l'exercici en curs.
      prorrata_revocacion_without_prior_year_especial: La revocació de prorrata especial
        no té estat de registre especial de l'exercici anterior per als sectors afectats.
      prorrata_transition_contradictory_evidence: Les entrades de transició de prorrata
        especial contradiuen la transició declarada.
      prorrata_transition_declarations_unavailable: La revisió seleccionada del model
        303 no declara calendari de presentació ni vincle d'arrossegament periòdic,
        per la qual cosa no es pot determinar el període de transició de prorrata.
      prorrata_transition_entry_without_evidence: Una entrada de transició de prorrata
        especial no aporta evidència de transició.
      prorrata_transition_evidence_without_declared_transition: S'ha aportat evidència
        de transició de prorrata especial sense una transició declarada.
      prorrata_transition_evidence_wrong_filing_year: L'evidència de registre de transició
        de prorrata especial pertany a un altre exercici.
      prorrata_transition_missing_register_evidence: La transició de prorrata especial
        declarada no té evidència de registre que la fonamenti.
      prorrata_transition_not_applicable_for_period: L'evidència de transició de prorrata
        especial només s'aplica en l'últim període del Model 303 de l'exercici.
      recipient_fact_disagrees_with_ledger_evidence: La dada de destinatari d'operacions
        en criteri de caixa no concorda amb la seva evidència d'assentaments en règim
        del proveïdor.
      supplier_regime_aggregation_period_mismatch: El període de l'agregació d'IVA
        no coincideix amb el període de declaració sol·licitat.
      supplier_regime_blank_ledger_identity: L'evidència d'arribada en règim del proveïdor
        conté una identitat d'assentament en blanc.
      supplier_regime_duplicate_ledger_evidence: L'evidència d'arribada en règim del
        proveïdor repeteix el mateix assentament.
      supplier_regime_observations_outside_period: L'agregació d'IVA conté observacions
        datades fora del període de declaració sol·licitat.
  modelo_bindings:
    errors:
      invoice_line_currency_unconverted: Una línia de factura està denominada en moneda
        estrangera sense tipus de canvi a euros resolt, per la qual cosa no es pot
        declarar en aquest model.
      unsupported_period: Període de model no admès per a l'agregació del llibre.
  oss_ioss:
    errors:
      exterior_country_code_undeclared: L'Estat membre de consum no té cap codi de
        país declarat per al model 369, de manera que els seus serveis no es poden
        declarar en aquest model.
      exterior_rate_kind_unsupported: El règim exterior de la finestreta única només
        admet serveis al tipus general o reduït de l'Estat membre de consum. L'observació
        aportada declara un altre tipus de gravamen, que no es pot agregar en aquest
        règim.
      invoice_line_currency_unconverted: Una línia de factura OSS/IOSS està denominada
        en moneda estrangera sense tipus de canvi a euros resolt, per la qual cosa
        no es pot declarar en aquest model.
      invoice_line_rate_kind_unclassifiable: Una línia de factura OSS/IOSS té un tipus
        d'IVA que no es pot classificar en cap tram, per la qual cosa la seva quota
        no es pot declarar en aquest model.
      iva_amount_mismatches_destination_rate: L'import d'IVA persistit no concorda
        amb el tipus de l'Estat membre de destinació més enllà de la tolerància d'un
        cèntim.
  per_modelo:
    errors:
      unsupported_modelo: Model no admès per a l'agregació per model
  renta_ledger:
    errors:
      annual_period_required: Es requereix un període anual per a l'agregació del
        llibre de Renda.
      bucket_mismatch: El bucket del repositori de moviments no coincideix amb el
        bucket sol·licitat del llibre de Renda.
      invoice_bucket_mismatch: El bucket del repositori de factures no coincideix
        amb el bucket sol·licitat del llibre de Renda.
      modelo_mismatch: El model tributari no coincideix amb el model esperat del llibre
        de Renda.
      period_mismatch: El període no coincideix amb el període esperat del llibre
        de Renda.
      quarterly_period_required: Cal un període trimestral per a l'agregació d'ingressos
        del Model 130 (per exemple --year 2024 --period 1T).
      unsupported_period: Es requereix un període anual per a l'agregació d'ingressos
        del Model 100 (p.ex. 2024-0A).
  retenciones:
    errors:
      filing_year_out_of_range: El exercici %{filing_year} queda fora del rang admès
        %{min_year}-%{max_year}.
      m111_no_retenciones_attestation_missing: 'No hi ha observacions de retenció
        per perceptor per al model 111 %{filing_year} %{period}. No presentis un Model
        111 en blanc: declara el trimestre com a període sense retencions amb `aeat
        config profile edit --modelo-111-no-retenciones-periods %{attestation_period}`
        (l''opció substitueix la llista desada, així que inclou també, separats per
        comes, els períodes ja declarats), o registra les files de perceptor amb `aeat
        app modelo aggregate --retencion-observation`.'
      m193_phase_allocation_collision: 'Model %{modelo} %{filing_year}: les assignacions
        %{source_allocations} consten declarades manualment i també provenen de les
        retencions de capital capturades. Elimineu la fila manual.'
      perceptor_nif_blank: El NIF del perceptor no pot estar buit.
      perceptor_observations_missing: No hi ha observacions de retencions per perceptor
        per al model %{modelo} %{filing_year} %{period}; la font %{source_kind} no
        es pot resoldre.
      withholding_annual_source_not_quarterly: 'No es pot elaborar el resum anual:
        el calendari de presentació del declarant no assigna el seu model periòdic
        de retencions a tots els trimestres de l''any (el presenta mensualment), i
        sumar només els períodes trimestrals deixaria fora mesos de retencions.'
      withholding_filer_profile_absent: No s'ha pogut carregar el perfil del declarant
        per a aquest exercici, de manera que no es pot determinar si les retencions
        es presenten trimestralment o mensualment. Completeu el perfil i torneu-ho
        a provar.
      withholding_quarterly_window_not_scheduled: El calendari de presentació del
        declarant no assigna aquest trimestre al model de retencions (una gran empresa
        el presenta mensualment) i els períodes mensuals de retencions encara no s'admeten.
        No s'ha registrat res.
  service:
    errors:
      currency_conversion_required: L'import en moneda estrangera requereix una conversió
        a euros abans de poder-se agregar.
      envelope_modelo_mismatch: El model de l'embolcall no coincideix amb el model
        esperat.
      envelope_period_mismatch: El període de l'embolcall no coincideix amb el període
        esperat.
      envelope_provider_payload_mismatch: La càrrega del proveïdor de l'embolcall
        no coincideix amb l'esperada.
      observations_mismatch: Les observacions retornades no coincideixen amb les esperades.
      per_modelo_modelos_not_unique: Els models per model no són únics.
      result_source_kinds_not_unique: Els tipus de font del resultat no són únics.
  source_mesh:
    errors:
      annual_summary_handoff_duplicate: Més d'un resolutor ha proporcionat el traspàs
        immutable del resum anual del model 303 (primer {first_resolver}; segon {second_resolver}).
      binding_source_mismatch: source_kind i binding_source fan referència a families
        d'origen de binding diferents.
      duplicate_binding_owner: 'Error intern: propietari de vinculació duplicat a
        la malla de fonts.'
      duplicate_bound_casilla_owner: 'Error intern: propietari de casella vinculada
        duplicat a la malla de fonts.'
      duplicate_relation_owner: 'Error intern: propietari de relació duplicat a la
        malla de fonts.'
      duplicate_row_binding_owner: 'Error intern: propietari de vinculació de fila
        duplicat a la malla de fonts.'
      duplicate_row_casilla_coordinate: 'Error intern: coordenada de casella de fila
        duplicada.'
      duplicate_row_casilla_owner: 'Error intern: propietari de casella de fila duplicat
        a la malla de fonts.'
      out_of_window_summary_date_span_invalid: La data màxima de presentació d'un
        resum fora de finestra no pot ser anterior a la seva data mínima.
      out_of_window_summary_incomplete: Un resum fora de finestra ha d'establir conjuntament
        el recompte, la data mínima de presentació i la data màxima de presentació.
      owned_sources_blank: Les fonts propietat de la malla de fonts no poden contenir
        tipus de font en blanc.
      owned_sources_duplicate: Les fonts propietat de la malla de fonts han de ser
        úniques.
      provenance_binding_source_mismatch: El tipus d'origen declarat a la fila de
        procedència no coincideix amb l'origen del vincle al qual diu pertànyer. Tots
        dos han de nomenar el mateix origen perquè la traçabilitat sigui comprovable.
      provenance_binding_source_missing: La fila de procedència declara un tipus d'origen
        de vincle reconegut però no indica a quin vincle correspon. Un origen reconeixible
        sense vincle declarat deixa el valor sense traçabilitat.
      provenance_contributor_missing_parent: Una fila de procedència contribuent ha
        de declarar la fila primària de la qual procedeix. Sense ella, l'aportació
        queda deslligada del valor al qual contribueix.
      provenance_contributor_parent_missing: Una fila contribuent assenyala com a
        fila mare una referència que no figura entre les files primàries declarades.
        La cadena de procedència apunta a un origen inexistent.
      provenance_primary_has_parent: 'Una fila de procedència primària no pot declarar
        una fila mare: la fila primària és l''origen del qual depenen les altres.'
      provenance_primary_ref_ambiguous: Dues files de procedència primàries comparteixen
        la mateixa referència d'origen, de manera que una fila contribuent no pot
        determinar de quina procedeix.
      provenance_resolver_mismatch: Alguna fila de procedència nomena un resolutor
        diferent del que va produir la resolució. Totes les files s'han d'atribuir
        al mateix resolutor que signa el resultat.
      relation_provenance_incomplete: La procedència de la relació ha d'incloure model
        d'origen, exercici, períodes, caselles, referències legals i referències d'origen.
      reserved_composite_resolver_id: L'identificador de resolutor indicat està reservat
        per a les resolucions compostes i no es pot fer servir en una resolució simple.
      row_binding_index_invalid: 'Error intern: l''índex de fila de la vinculació
        ha de ser 1 o superior.'
      row_binding_value_invalid: 'Error intern: el valor decimal de la vinculació
        de fila no és vàlid.'
      row_casilla_index_invalid: 'Error intern: l''índex de casella de fila ha de
        ser 1 o superior.'
      row_casilla_provenance_coordinate_mismatch: Cada valor de casella de fila ha
        de tenir exactament una procedència.
      row_casilla_row_index_mismatch: La casella de fila i la vinculació d'origen
        han d'usar el mateix índex.
      row_casilla_source_coordinate_missing: Falta el valor o la identitat de la vinculació
        d'origen d'una casella de fila.
      row_casilla_source_identity_mismatch: La identitat de procedència de la casella
        de fila difereix de la identitat d'origen.
      row_casilla_source_value_mismatch: El valor de la casella de fila difereix del
        valor de la vinculació d'origen.
      row_casilla_value_invalid: 'Error intern: el valor decimal de la casella de
        fila no és vàlid.'
      row_source_identity_coordinate_mismatch: Tota coordenada d'identitat de fila
        ha de correspondre a un valor de vincle present a la mateixa fila. S'ha declarat
        una coordenada que la fila no aporta.
      source_transaction_ids_blank: Els identificadors de transacció de la malla de
        fonts no poden contenir blancs.
      source_transaction_ids_duplicate: Els identificadors de transacció de la malla
        de fonts han de ser únics.
      unresolved_binding_ids_blank: 'Error intern: els ids de vinculació sense resoldre
        no poden estar en blanc.'
      unresolved_binding_ids_duplicate: 'Error intern: els ids de vinculació sense
        resoldre no poden estar duplicats.'
      unresolved_relation_ids_blank: 'Error intern: els ids de relació sense resoldre
        no poden estar en blanc.'
      unresolved_relation_ids_duplicate: 'Error intern: els ids de relació sense resoldre
        no poden estar duplicats.'
auth:
  catalogue:
    certificate_description: Autenticació basada en certificat X.509 (FNMT-RCM o una
      altra autoritat reconeguda). Compatible amb tots els fluxos de la seu electrònica.
    certificate_label: Certificat digital
    clave_movil_description: Autenticació amb aprovació push al mòbil del titular
      registrat a Cl@ve. Requereix DNI/NIE, registre a Cl@ve i el dispositiu vinculat.
    clave_movil_label: Cl@ve Móvil
    clave_permanente_description: Autenticació amb DNI/NIE i contrasenya mitjançant
      el proveïdor d'identitat Cl@ve Permanente. Automatitzable sense intervenció
      per als fluxos de lectura de l'AEAT; requereix DNI/NIE i contrasenya.
    clave_permanente_label: Cl@ve Permanente
categories:
  registry:
    amortizacion_vivienda_afecto:
      label: Amortització de l'habitatge afecte a l'activitat
      notes: Deduïble en proporció a la superfície de l'habitatge afecta a l'activitat
        (Ley 35/2006 art. 30.2.5.b regla 4a, amortització de l'habitatge afecte).
    arrendamiento_local:
      label: Lloguer del local de negoci
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1).
    arrendamiento_vivienda_afecta: Part del lloguer de l'habitatge afecta a l'activitat
    arrendamiento_vivienda_afecto:
      notes: Deduïble en proporció a la superfície de l'habitatge afecta a l'activitat
        (Ley 35/2006 art. 29.2 i art. 28.1, lloguer de l'habitatge afecte).
    asesoria_contable:
      label: Honoraris d'assessoria comptable
      notes: Despesa íntegrament deduïble, com a servei professional independent (Ley
        35/2006 art. 28.1).
    asesoria_fiscal:
      label: Honoraris d'assessoria fiscal
      notes: Despesa íntegrament deduïble, com a servei professional independent (Ley
        35/2006 art. 28.1).
    asesoria_juridica:
      label: Honoraris d'assessoria jurídica
      notes: Despesa íntegrament deduïble, com a servei professional independent (Ley
        35/2006 art. 28.1).
    comunidad_vivienda_afecto:
      label: Despeses de comunitat de l'habitatge afecte a l'activitat
      notes: Deduïble en proporció a la superfície de l'habitatge afecta a l'activitat
        (Ley 35/2006 art. 30.2.5.b regla 2a, despeses de titularitat de l'habitatge).
    cuotas_autonomos_ss:
      notes: Despesa íntegrament deduïble; les quotes del RETA són una condició legal
        per exercir l'activitat.
    cuotas_colegiales:
      label: Quotes de col·legi professional
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1).
    cuotas_reta: Quotes d'autònoms a la Seguretat Social (RETA)
    formacion_profesional:
      label: Formació professional
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1, altres serveis exteriors).
    gastos_bancarios:
      label: Despeses bancàries
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1, despeses financeres
        i bancàries).
    gastos_financieros:
      label: Despeses financeres
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1, despeses financeres
        i bancàries).
    hardware_amortizable:
      label: Maquinari informàtic amortitzable
      notes: Íntegrament deduïble mitjançant amortització (Ley 35/2006 art. 28.1,
        amortització de l'immobilitzat).
    home_office_agua: Aigua de l'habitatge-oficina
    home_office_gas: Gas de l'habitatge-oficina
    home_office_internet: Internet de l'habitatge-oficina
    home_office_luz: Electricitat de l'habitatge-oficina
    ibi_local_afecto:
      label: IBI del local de negoci
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 14 LIS, per remissió;
        tributs fiscalment deduïbles).
    ibi_vivienda_afecto:
      label: IBI de l'habitatge afecte a l'activitat
      notes: Deduïble en proporció a la superfície de l'habitatge afecta a l'activitat
        (Ley 35/2006 art. 30.2.5.b regla 2a, tributs no estatals de l'habitatge).
    manutencion_dietas_extranjero:
      notes: 'Deduïble fins a un límit diari legal: 48,08 EUR/dia sense pernoctació,
        91,35 EUR/dia amb pernoctació (Ley 6/2017 / Ley IRPF art. 30.2.5.c, Reglamento
        IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: Amb pernoctació
        sin-pernocta:
          label: Sense pernoctació
    manutencion_dietas_nacional:
      notes: 'Deduïble fins a un límit diari legal: 26,67 EUR/dia sense pernoctació,
        53,34 EUR/dia amb pernoctació (Ley 6/2017 / Ley IRPF art. 30.2.5.c, Reglamento
        IRPF art. 9.A.3.a).'
      statutory_cap_variants:
        con-pernocta:
          label: Amb pernoctació
        sin-pernocta:
          label: Sense pernoctació
    manutencion_extranjero: Dietes de manutenció a l'estranger (menjar i estada)
    manutencion_nacional: Dietes de manutenció nacionals (menjar i estada)
    material_oficina:
      label: Material d'oficina
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1).
    mobiliario_amortizable:
      label: Mobiliari amortitzable
      notes: Íntegrament deduïble mitjançant amortització (Ley 35/2006 art. 28.1,
        amortització de l'immobilitzat).
    mutualidad_alternativa:
