        48,08 EUR sense pernoctar, 91,35 EUR si pernoctes en un municipi diferent
        del lloc de treball habitual i de la teva residència (Ley 35/2006 art. 30.2,
        regla 5a, lletra c; Reglamento IRPF art. 9.A.3.a).'
