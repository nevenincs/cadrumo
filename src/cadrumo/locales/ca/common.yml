filing:
  applicability:
    impatriado_m100_suppressed: 'El Model 100 no aplica: el contribuent té actiu el
      règim especial de treballadors, professionals, emprenedors i inversors desplaçats
      a territori espanyol (LIRPF Art. 93) dins la finestra de sis exercicis. Durant
      aquesta finestra tributa per les regles de l''IRNR mantenint la condició de
      contribuent de l''IRPF, i la declaració anual corresponent és el Model 151,
      no el Model 100.'
    impatriado_m151_applicable: 'El Model 151 aplica: el contribuent té actiu el règim
      especial d''impatriats de l''Art. 93 LIRPF dins la finestra de sis exercicis
      de l''any d''opció i els cinc següents; la declaració anual del règim es presenta
      pel Model 151.'
    impatriado_m151_not_applicable: 'El Model 151 no aplica: el perfil no té actiu
      el règim especial d''impatriats de l''Art. 93 LIRPF dins la seva finestra de
      sis exercicis. Fora d''aquesta finestra, o sense opció pel règim, la persona
      física resident torna a la ruta ordinària de l''IRPF i al Model 100 quan escaigui.'
    incomplete_no_rule: 'No es pot determinar l''aplicabilitat d''aquest model: encara
      no se n''ha derivat cap regla d''aplicabilitat. La cobertura de regles és deliberadament
      reduïda (el conjunt inicial de persones) i l''ampliació per entitat i règim
      està pendent. No és una afirmació sobre el teu perfil: el teu tipus de contribuent
      pot estar correctament declarat.'
    incomplete_undeclared_taxpayer: 'No es pot determinar l''aplicabilitat: el tipus
      de contribuent no està declarat. Falten el tipus d''entitat i, si escau, les
      categories de renda de l''IRPF.'
    incomplete_undetermined_fact: 'No es pot determinar l''aplicabilitat d''aquest
      model a partir del model de contribuent declarat: depèn d''un fet que el perfil
      no expressa amb certesa. El model només s''afirma aplicable quan aquest fet
      es declara positivament; altrament no es conjectura cap obligació.'
    incomplete_undetermined_fact_required: 'Fet requerit per a aquest model: %{fact}.'
    incomplete_undetermined_periods_missing: 'Períodes sense declarar: %{periods}.'
    ledger_derived_basis: 'És una derivació local a partir de les teves factures registrades,
      no una dada oficial de l''AEAT: per a aquest any mostren que el contribuent
      %{fact}.'
    ledger_profile_disagreement: La teva resposta al perfil i les teves factures registrades
