      label: Honoraris de subcontractació
      notes: Despesa íntegrament deduïble, com a servei professional independent (Ley
        35/2006 art. 28.1).
    suministros_cliente_directos:
      label: Subministraments facturats directament al client
      notes: Despesa íntegrament deduïble (Ley 35/2006 art. 28.1).
    suministros_home_office_agua:
      notes: 'IRPF: si afectes parcialment el teu habitatge habitual a l''activitat,
        dedueixes el 30 % de la proporció entre els metres quadrats destinats a l''activitat
        i la superfície total, llevat que provis un percentatge superior o inferior
        (Ley 35/2006 art. 30.2, regla 5a, lletra b). IVA: la quota suportada és deduïble
        en proporció al grau d''utilització en l''activitat, sense el factor del 30
        % (Ley 37/1992 art. 95; resolució del TEAC de 19 de juliol de 2023, RG 00/06654/2022).'
    suministros_home_office_gas:
      notes: 'IRPF: si afectes parcialment el teu habitatge habitual a l''activitat,
        dedueixes el 30 % de la proporció entre els metres quadrats destinats a l''activitat
        i la superfície total, llevat que provis un percentatge superior o inferior
        (Ley 35/2006 art. 30.2, regla 5a, lletra b). IVA: la quota suportada és deduïble
        en proporció al grau d''utilització en l''activitat, sense el factor del 30
        % (Ley 37/1992 art. 95; resolució del TEAC de 19 de juliol de 2023, RG 00/06654/2022).'
    suministros_home_office_internet:
      notes: 'IRPF: si afectes parcialment el teu habitatge habitual a l''activitat,
        dedueixes el 30 % de la proporció entre els metres quadrats destinats a l''activitat
        i la superfície total, llevat que provis un percentatge superior o inferior
        (Ley 35/2006 art. 30.2, regla 5a, lletra b). IVA: la quota suportada és deduïble
        en proporció al grau d''utilització en l''activitat, sense el factor del 30
        % (Ley 37/1992 art. 95; resolució del TEAC de 19 de juliol de 2023, RG 00/06654/2022).'
    suministros_home_office_luz:
      notes: 'IRPF: si afectes parcialment el teu habitatge habitual a l''activitat,
        dedueixes el 30 % de la proporció entre els metres quadrats destinats a l''activitat
        i la superfície total, llevat que provis un percentatge superior o inferior
        (Ley 35/2006 art. 30.2, regla 5a, lletra b). IVA: la quota suportada és deduïble
        en proporció al grau d''utilització en l''activitat, sense el factor del 30
        % (Ley 37/1992 art. 95; resolució del TEAC de 19 de juliol de 2023, RG 00/06654/2022).'
    suministros_local_afecto:
      label: Subministraments del local afecte
      notes: 'Despesa totalment deduïble: l''immoble on es desenvolupa l''activitat
        està afecte (Llei 35/2006 art. 29.1.a) i els seus subministraments son despesa
        deduïble (art. 28.1). No s''aplica la regla del 30 per cent de l''art. 30.2.5.b,
        reservada a l''habitatge habitual parcialment afecte.'
    telefonia_fija:
      label: Despesa de telefonia fixa
      notes: 'IRPF: si afectes parcialment el teu habitatge habitual a l''activitat,
        dedueixes el 30 % de la proporció entre els metres quadrats destinats a l''activitat
        i la superfície total, llevat que provis un percentatge superior o inferior
        (Ley 35/2006 art. 30.2, regla 5a, lletra b). IVA: la quota suportada és deduïble
        en proporció al grau d''utilització en l''activitat, sense el factor del 30
        % (Ley 37/1992 art. 95; resolució del TEAC de 19 de juliol de 2023, RG 00/06654/2022).'
    telefonia_movil:
      label: Despesa de telefonia mòbil
      notes: 'IRPF: la línia és deduïble només si la fas servir exclusivament per
        a l''activitat; el telèfon es dedueix per amortització (Reglamento IRPF art.
        22). IVA: si també la fas servir per a fins privats, la quota no és deduïble
        (Ley 37/1992 art. 95.Dos.2n).'
