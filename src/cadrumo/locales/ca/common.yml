        amb un màxim de 25.000 EUR l''any (Ley 27/2014 art. 12.3.e). IVA: amb ús mixt,
        la quota només és deduïble segons el grau d''ús si el bé val almenys 3.005,06
        EUR (Ley 37/1992 art. 95.Tres.1a i 108.Dos.5è).'
