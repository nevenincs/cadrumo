      lectura d''identitat allibera això durant la sessió fins que canviïs de perfil.'
  persona:
    handoff_denied: '''{command}'' és el límit irreversible de lliurament per a la
      presentació, propietat del rol ''{owner}''; al rol ''{persona}'' se li denega
      estructuralment. Lliura la unitat de treball verificada a la sessió verificadora
