cli:
  app:
    ledger:
      bienes_inversion:
        acquisition_year_help: Any d'adquisició del bé.
        art108_help: Si el bé té la consideració de bé d'inversió segons LIVA art.
          108.
        asset_ref_help: Referència creuada opcional a un identificador d'AssetRecord.
        cuota_soportada_help: IVA suportat total en l'adquisició (positiu).
        declare_help: Declara un bé d'inversió per a la seva regularització d'IVA.
        description_help: Descripció del bé.
        disposal_regime_help: Règim de transmissió (sujeta_no_exenta o exenta_o_no_sujeta);
          obligatori amb --disposal-year.
        disposal_requires_both: --disposal-year i --disposal-regime s'han d'indicar
          conjuntament.
        disposal_year_help: Any de transmissió opcional (art. 110).
        group_help: Registre de regularització d'IVA per béns d'inversió (LIVA arts.
          107-110).
        identifier_help: Identificador estable del registre.
        kind_help: 'Període de regularització: moble (4 anys) o immoble (9 anys).'
        list_help: Llista tots els béns d'inversió registrats en el perfil actiu.
        prorrata_inicial_help: Percentatge de deducció definitiu de l'any d'adquisició
          (0-100).
        unknown_disposal_regime: 'Règim de transmissió desconegut {regime!r}; acceptats:
          {accepted}'
      counterparty:
        actor_help: Identificador de l'operador que es registra com a autor de l'afirmació.
        confirm_help: Confirma on està establerta una contrapart i quin Estat la identifica
          a efectes d'IVA.
        country_code_help: País sota el qual es declara l'identificador, quan no és
          espanyol.
        evidenced_scope_help: Territori on un document que teniu situa aquesta part.
          Indiqueu-lo per preguntar què respondrà l'escala per a aquest document,
          que és l'única manera de veure una discrepància amb el que vau confirmar
          abans que una confirmació la rebutgi.
        group_help: Confirma el que se sap d'una contrapart, una sola vegada, per
          a tots els documents posteriors.
        identification_state_help: 'Estat membre que identifica a efectes d''IVA la
          contrapart. És una dada diferent de --scope: l''art. 25 exempta per aquesta,
          no per on estigui establerta.'
        note_help: En què es basa la resposta, amb les vostres paraules. Es registra,
          mai no es consulta.
        scope_help: El territori a efectes d'IVA on està establerta la contrapart.
        show_help: Mostra l'establiment confirmat per a una contrapart, si n'hi ha.
        tax_identifier_help: L'identificador fiscal de la contrapart tal com apareix
          imprès al document.
        withdraw_help: Retira el que es va confirmar sobre una contrapart, declarant
          que la resposta anterior era incorrecta.
      evidence:
        add_help: Registra un justificant de factura de compra des de PDF o imatge
        attachment_id_help: Identificador de l'adjunt adreçat pel contingut.
        attachment_queue_help: Llista els adjunts de Drive pendents de revisió de
          factura.
        attachment_view_help: Inspecciona les metadades i la procedència de l'adjunt
          emmagatzemat.
        batch_directory_help: Directori els fitxers del qual s'ingressen. Combina'l
          amb --file repetit o substitueix-lo per aquest.
        batch_file_help: Un document a ingressar. Repeteix l'opció una vegada per
          document; es combina amb un directori.
        batch_help: Ingressa cada document d'un directori (o cada --file) com a evidència
          i esborrany revisable, amb una fila de resultat per document.
        batch_items_refused_message: S'han rebutjat alguns documents. La resta de
          documents de l'execució s'han completat igualment; les files rebutjades
          indiquen què s'ha trobat.
        batch_pending_review_message: Alguns esborranys contenen una troballa que
          una persona ha de resoldre abans de crear una factura. Estan retinguts,
          no fallits.
        batch_progress_message: 'processat %{source}: %{status}'
        batch_source_required: Indica un argument de directori, una o més opcions
          --file, o tots dos.
        batch_work_deferred_message: Alguns documents no s'han llegit perquè no s'ha
          pogut executar cap model de lectura. No se n'ha endevinat cap valor i res
          no ha fallat; torna a executar quan es resolgui la causa indicada.
        confirm_already_exists_message: Ja existeix una factura amb aquesta identitat;
          es retorna sense canvis en lloc de crear-ne un duplicat.
        confirm_category_contradicted_message: 'El règim que declara aquest document
          i l''impost que aplica no poden ser certs alhora, de manera que no s''ha
          pogut prendre el tractament d''IVA de cap dels dos costats i no se n''ha
          registrat cap. Torna a llegir el document: se n''ha llegit malament un dels
          dos, o el document mateix és incorrecte.'
        confirm_category_rate_inferred_message: El tractament d'IVA d'aquesta factura
          l'ha determinat el tipus impositiu que apliquen les seves línies, perquè
          la taula de regles no ha pogut situar l'operació, normalment perquè el territori
          d'IVA d'una de les parts no està establert. El tractament registrat és l'interior
          ordinari per a aquest tipus. Comprova-ho si aquest lliurament no era interior.
        confirm_category_unresolved_message: 'Res no ha establert un tractament d''IVA
          per a aquesta factura: el document no n''ha declarat cap i els fets de la
          mateixa operació no n''han assolit cap. La factura queda registrada i no
          es desglossarà en una declaració fins que s''estableixi un tractament.'
        confirm_category_unsupported_relief_message: El document invoca una exempció
          de l'IVA repercutit espanyol que depèn completament d'on està establerta
          la contrapart, i res no ho ha establert. El tractament es reté en lloc de
          donar el document per erroni, de manera que aquesta factura queda registrada
          sense tractament d'IVA i no es desglossarà en una declaració fins que es
          resolgui el país o l'establiment de la contrapart.
        confirm_counterparty_name_help: Nom de la contrapart (sense heuristica d'extracció
          encara; normalment obligatori).
        confirm_counterparty_nif_help: Sobreescriu el NIF del proveïdor extret.
        confirm_currency_help: Codi de moneda ISO-4217.
        confirm_help: Torna a extreure el justificant en local i confirma'l com a
          factura real del catàleg.
        confirm_invoice_class_help: Indiqueu la classe de factura quan el document
          no la declari. Una rectificativa es llegeix del document quan aquest anomena
          la factura que rectifica, de manera que aquesta opció és la correcció per
          als documents que no ho fan.
        confirm_invoice_date_help: Sobreescriu la data de factura extreta (AAAA-MM-DD).
        confirm_invoice_number_help: Sobreescriu el número de factura extret.
        confirm_iva_rate_help: Sobreescriu el tipus d'IVA extret (ometre per mantenir
          el valor extret).
        confirm_link_hint_message: La factura es va registrar sense cap moviment coincident
          del llibre.
        confirm_operation_type_help: 'Clau del model 349 per a un lliurament intracomunitari.
          Obligatòria quan el document declara un lliurament intracomunitari: la categoria
          no permet saber si va seguir una importació exempta.'
        confirm_printed_total_mismatch_message: El total imprès al document no coincideix
          amb el total registrat. El total registrat es deriva de la base imposable
          i del tipus d'IVA, de manera que una diferència significa que el document
          inclou un import que aquest registre no recull, com ara un recàrrec d'equivalència,
          o que s'ha llegit malament alguna xifra. Reviseu el document.
        confirm_rectifies_help: Número de la factura que rectifica aquesta rectificativa.
          El RD 1619/2012 art. 6.1.a.2 l'exigeix juntament amb la seva pròpia sèrie,
          i es llegeix del document quan aquest l'indica.
        confirm_resolve_help: 'Respongui a una troballa bloquejant: <finding-id>=<choose|supply|attest>:<valor-o-motiu>.
          Per a choose, indiqui la lectura pel seu valor o pel resum que va mostrar
          review. Repeteixi un cop per troballa; no hi ha opció massiva.'
        confirm_review_contradicted_regime_message: Aquest document es contradiu a
          si mateix sobre com tributa. El detall següent anomena què discrepava amb
          què.
        confirm_review_undetermined_establishment_message: El document, tal com s'ha
          llegit, ha deixat sense decidir on està establerta una de les parts d'aquesta
          factura. El territori d'IVA determina el tractament i no es dona per suposat
          que sigui la península. El detall següent anomena la part i el que faltava.
        confirm_series_help: Sèrie de numeració en què es va expedir la factura. El
          RD 1619/2012 art. 6.1.a.2 obliga que una rectificativa vagi en la seva pròpia
          sèrie, de manera que declarar aquesta classe requereix indicar-la; es llegeix
          del document quan aquest la indica.
        confirm_supply_nature_help: Indiqueu si l'operació és un lliurament de béns
          o una prestació de serveis. Les regles de localització difereixen, de manera
          que un document que no ho indica deixa el tractament sense resoldre.
        confirm_taxable_base_help: Sobreescriu la base imposable extreta.
        consent:
          bytes_unrecallable: 'Retirar el consentiment atura els enviaments futurs.
            No permet recuperar els bytes ja enviats: aquesta aplicació no els pot
            recuperar ni esborrar del proveïdor. Tornar a derivar en local elimina
            la lectura externa dels vostres registres actuals, però no dels del proveïdor.'
          content_address_help: Adreça de contingut SHA-256 dels bytes desats del
            document.
          evidence_reference_help: Identificador de l'evidència o de l'adjunt que
            es tornarà a derivar.
          group_help: Reviseu què s'ha enviat a un model extern i recupereu els artefactes
            en aquest equip.
          list_help: Mostreu cada enviament extern i els artefactes que se'n deriven.
          no_history: 'Cap byte d''evidència no ha sortit d''aquest equip: aquest
            perfil no té cap enviament extern registrat.'
          rederive_help: Torneu a llegir un artefacte en aquest equip des de la seva
            transcripció desada.
          rederive_refused: 'Nova derivació rebutjada: {detail}'
          rederived: S'ha tornat a derivar {reference} en aquest equip. Abans tenia
            {previous}; ara té {current}. La lectura anterior queda substituïda, no
            esborrada.
          transcriber_help: Clau de memòria cau de la transcripció que es reutilitzarà.
        evidence_id_help: Identificador del justificant (coincidència exacta)
        extract_acknowledge_off_host_help: Confirma, només per a aquesta lectura,
          que el document surt d'aquest equip.
        extract_acknowledge_without_provider: --acknowledge-off-host confirma un enviament
          que no arribaria a produir-se. Indica també --off-host-provider, o retira
          la confirmació.
        extract_attachment_id_help: Identificador de l'adjunt vinculat del qual extreure
          les dades (alternativa a --evidence-id).
        extract_evidence_id_help: Identificador del justificant de factura de compra
          del qual extreure les dades.
        extract_help: Llegeix els camps d'una factura en PDF al mateix equip i genera
          un esborrany per revisar.
        extract_off_host_needs_content_address: Aquest justificant no té empremta
          de contingut, de manera que una lectura fora de l'equip no es pot registrar
          sobre els bytes que enviaria.
        extract_off_host_needs_evidence_id: 'Una lectura fora de l''equip ha d''indicar
          --evidence-id: el consentiment es registra sobre l''empremta de contingut
          del document, que un identificador d''adjunt no aporta.'
        extract_off_host_provider_help: Envia aquest document a un model allotjat
          en lloc de llegir-lo en aquest equip.
        extract_off_host_provider_is_local: --off-host-provider local és el valor
          per defecte i no envia res fora de l'equip. Omet l'opció o indica un proveïdor
          allotjat.
        extract_provider_without_acknowledge: Llegir aquest document fora de l'equip
          envia el seu contingut a un tercer. Afegeix --acknowledge-off-host per confirmar-ho,
          només per a aquesta lectura.
        extract_reference_required: Indiqueu exactament un de --evidence-id o --attachment-id.
        extract_review_hint_message: Aquesta extracció és un esborrany aproximat i
          els seus camps no estan confirmats.
        field_ambiguous: '{field}: diverses lectures van competir i no s''ha pogut
          decidir entre ({candidates}). Trieu-ne una en lloc d''acceptar l''esborrany
          tal com és.'
        field_anchor_not_found: '{field}: el lector assenyala ''{anchor}'', que no
          apareix en la transcripció del document. Un valor normalitzat pot fallar
          aquesta cerca legítimament, així que reviseu el camp en lloc de suposar
          que va ser corroborat. {detail}'
        field_anchor_self_reported: '{field}: el lector afirma haver-ho llegit de
          ''{anchor}'', però aquesta afirmació prové del mateix lector que va produir
          el valor, així que res independent no ho ha confirmat.'
        field_anchor_uncorroborated: '{field}: el lector assenyala ''{anchor}'', i
          res no va indicar que aquesta forma faltés en el document. El valor continua
          sense estar corroborat, així que el que queda sense resoldre és una cosa
          diferent de la forma impresa. {detail}'
        field_contradicted: '{field}: el document indica ''{anchor}'', que no coincideix
          amb el valor registrat per a aquest camp. {detail}'
        field_no_anchor: '{field}: el lector no va oferir res en el document a què
          assenyalar, així que no hi ha forma impresa amb què contrastar aquest valor.'
        group_help: Justificants de factures de compra en PDF o imatge
        invoice_date_help: Data d'emissió de la factura en ISO 8601 (AAAA-MM-DD),
          p. ex. 2026-01-15.
        invoice_number_help: Número de factura del proveïdor
        iva_amount_help: Import d'IVA de la factura
        iva_rate_help: Tipus d'IVA aplicat com a decimal
        list_help: Llista els justificants de factures de compra registrats
        notes_help: Notes internes sobre el justificant
        remove_help: Elimina un justificant de factura de compra
        review:
          advised_pending_message: Alguns documents pendents porten avisos. No bloquegen
            res i es confirmaran tal com estan, així que res més no els tornarà a
            plantejar. Acota la cua amb `--advisory` i llegeix-ne un amb `review show`.
          advisory_help: Mostra només els esborranys que porten aquest avís no bloquejant.
            No impedeixen res, de manera que altrament només es descobreixen obrint
            cada document.
          blocked_message: Aquest document no es pot confirmar fins que es respongui
            individualment cada troballa. Cada resposta anomena una troballa pel seu
            identificador.
          blocked_pending_message: Alguns documents pendents tenen troballes que cal
            respondre abans de confirmar-los. Inspeccioneu-ne un amb `review show`.
          blocking_help: Mostreu nomes els esborranys que no es poden confirmar fins
            que es respongui una troballa.
          country_code_unassigned_message: El codi de país d'una de les parts pertany
            als rangs que la norma ISO 3166-1 reserva perquè mai no s'hi assigni cap
            país, de manera que el document indica una cadena i no un país, i res
            no situa aquesta part. Corregiu el codi contrastant-lo amb el document.
            Aquest esborrany es pot confirmar igualment; la part simplement queda
            sense establir fins llavors.
          country_code_uncatalogued_message: 'El codi de país d''una de les parts
            pot designar un país real que el vocabulari incorporat d''aquest sistema
            encara no recull, de manera que no es pot dir res sobre on està establerta
            aquesta part. Tornar a llegir el document no ho resoldrà: cal afegir el
            país. Aquest esborrany es pot confirmar igualment; la part simplement
            queda sense establir fins llavors.'
          finding_help: Mostreu nomes els esborranys el document dels quals no ha
            superat aquesta comprovacio determinista.
          group_help: Reviseu els esborranys d'extraccio pendents abans de confirmar-los
            com a factures.
          list_help: Llisteu els esborranys d'extraccio pendents de revisio humana.
          party_attribution_unverified_message: Res no verifica a quina part pertanyen
            aquestes dades d'adreça. Si es llegissin dos blocs d'adreça a l'inrevés,
            ambdues parts quedarien situades en un territori d'IVA on cap no està
            establerta i cap comprovació no ho detectaria. Contrasteu cada valor amb
            el document abans de confirmar aquest esborrany.
          reason_help: Mostreu nomes els esborranys blocats per aquest motiu.
          reference_help: Referencia d'evidencia o adjunt de la qual s'ha llegit l'esborrany
            pendent.
          resolve_action: Accio de resolucio desconeguda.
          resolve_shape: Cada --resolve és <finding-id>=<choose|supply|attest>:<valor-o-motiu>.
            Un choose indica la lectura pel seu valor o pel resum que va mostrar review.
          show_help: Mostreu un esborrany pendent camp per camp, amb les seves troballes
            i blocatges.
          unknown_reference: No hi ha cap esborrany pendent per a aquesta referencia.
        source_path_help: Ruta al PDF o imatge de la factura
        supplier_help: Nom del proveïdor
        taxable_base_help: Base imposable de la factura
        update_help: Actualitza les dades d'un justificant de factura de compra
        view_help: Mostra un justificant de factura de compra
        yes_help: Confirma l'eliminació del justificant
        yes_required: Has de passar --yes per eliminar un justificant
      inventory:
        acquisition_cost_invalid: 'JSON de cost d''adquisició no vàlid llegit de l''entrada
          estàndard: {details}'
        acquisition_cost_stdin_help: Llegeix de l'entrada estàndard l'objecte JSON
          de cost d'adquisició complet
        actividad_id_help: Identificador de l'activitat econòmica
        authority_file_help: Llegiu el document JSON complet d'autoritat de tancament
          des d'un fitxer.
        authority_invalid: L'objecte d'autoritat de tancament no és vàlid per a aquest
          llibre d'existències.
        closing_authority_record_help: Registrar atòmicament l'autoritat acreditada
          del tancament d'existències
        create_help: Crea un llibre d'existències per a una activitat i exercici
        group_help: Llibres d'existències per activitat, moviments i valoració
        list_help: Llista els llibres d'existències del perfil actiu
        movement_add_help: Afegeix un moviment de compra, venda o ajust al llibre
        movement_date_help: Data del moviment (AAAA-MM-DD)
        movement_group_help: Gestiona moviments del llibre d'existències
        movement_id_help: Identificador del moviment dins del llibre
        movement_kind_help: Tipus de moviment (opening, purchase, cogs o count)
        opening_stock_help: Valor inicial d'existències
        quantity_help: Quantitat del moviment, positiva o negativa
        taxable_base_help: Base imposable associada al moviment
        unit_cost_help: Cost unitari en moviments de compra
        valuation_group_help: Calcula i previsualitza la valoració d'existències
        valuation_method_help: Mètode de valoració (fifo o pmp)
        valuation_preview_help: Previsualitza existències finals i cost de vendes
        year_help: Exercici fiscal
      invoice:
        add_help: Crea una factura de conciliació vinculable al catàleg.
        country_code_help: 'Codi de país ISO 3166-1 alfa-2 de la contrapart. Obligatori:
          determina l''encaminament de totes dues informatives, per això mai no es
          dóna per suposat.'
        group_help: Registres de factures de negoci (emeses o rebudes)
        import_all_refused: 'importació massiva de factures fallida: totes les files
          van ser rebutjades; no es va crear cap factura'
        import_column_role_not_applied: 'no s''ha aplicat un rol de columna proposat:
          {detail}'
        import_country_help: País de la contrapart (ISO 3166-1 alfa-2) per a tota
          la importació. Només és obligatori quan el fitxer no té columna country_code;
          s'ignora a les files que indiquen el seu. Declara aquest país per a TOTES
          aquestes files, així que un llibre que barregi contraparts nacionals i estrangeres
          necessita la columna.
        import_file_help: Camí a un fitxer CSV o XLSX amb files de factures (counterparty_nif,
          counterparty_name, invoice_number, invoice_date, taxable_base, i opcionalment
          iva_rate/currency/country_code/notes).
        import_file_not_found: 'Fitxer no trobat: {path}'
        import_help: Crea factures del catàleg en lot des d'un fitxer CSV o XLSX.
        import_unmapped_columns: 'columnes no importades perquè cap camp de factura
          hi va coincidir: {columns}'
        invoice_class_help: Classe de factura. Una rectificativa exigeix a més --rectifies-invoice-number
          indicant la factura que corregeix.
        invoice_id_help: Identificador de factura del catàleg (o prefix no ambigu).
        iva_category_help: Tractament d'IVA de l'operació. Necessari perquè un càlcul
          de renda la pugui fonamentar.
        kind_help: 'Tipus de factura: emesa (un client t''ha de pagar) o rebuda (deus
          a un proveïdor)'
        list_help: Llista les factures del catàleg de conciliació.
        operation_date_help: Data en que es va fer el lliurament o la prestacio (AAAA-MM-DD).
          Es la data de meritacio de l'art. 75 LIVA que determina en quin periode
          es declara la quota; sense aquesta s'utilitza la data de factura.
        operation_type_help: 'Clau d''operació M349: E lliuraments, M lliuraments
          posteriors a importació exempta, H les mateixes per representant fiscal,
          A adquisicions, T lliuraments triangulars, S serveis prestats, I serveis
          adquirits, R transferències de béns en consigna, D devolucions de béns en
          consigna, C substitucions del destinatari en consigna'
        recargo_help: Recàrrec d'equivalència repercutit sobre la quota (LIVA art.
          161). Va inclòs en el total de la factura, a diferència d'una retenció.
        rectifies_help: Número de la factura que corregeix aquesta rectificativa.
        remove_help: Elimina una factura del catàleg de conciliació.
        retention_amount_help: Import de la retenció d'IRPF retinguda pel pagador,
          en euros. Es pot indicar sol, o juntament amb --retention-rate.
        retention_rate_help: Fracció de retenció de l'art. 95.1 RIRPF que reté el
          pagador (0,15 per al 15% general, o 0,07 durant el període d'inici d'activitat).
          Requereix --retention-amount; una fracció sola es rebutja.
        series_help: Sèrie de numeració de la factura, quan l'emissor n'utilitza una.
        simplificada_tax_id_expected_message: Aquesta factura simplificada no conté
          l identificador fiscal de la contrapart, tot i que el context legal registrat
          l exigeix.
        update_help: Actualitza les dades d'una factura de negoci
        view_help: Mostra una factura del catàleg de conciliació per identificador
          o prefix no ambigu.
        wizard_help: Entrada manual guiada i no interactiva quan l'extracció no està
          disponible.
        wizard_idempotent_noop: 'Sense operació idempotent: ja existeix una factura
          amb aquesta identitat (%{invoice_id}); no s''ha creat res.'
        yes_help: Confirma l'eliminació de la factura
        yes_required: Has de passar --yes per eliminar una factura
      prorrata:
        activity_code_help: Codi d'activitat CNAE / IAE agrupat en aquest sector (repetible,
          com a mínim un).
        declare_sector_help: 'Declara un sector diferenciat (LIVA arts. 9.1.c / 101):
          la partició de l''art. 9.1.c que declara l''operador, mai inferida del llibre.'
        ejercicio_help: Exercici (any) que cobreix l'elecció.
        elect_especial_help: 'Tria prorrata especial per a un exercici (LIVA art.
