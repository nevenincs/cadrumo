wizard:
  choices:
    general: General
    irpf: IRPF
    iva: IVA
    simplificado: Simplificat
  commands:
    status:
      created: creat
      saved: desat
      updated: actualitzat
  demo:
    description: Una secció de demostració per provar la funcionalitat de l'assistent
    section:
      title: Secció de demostració
    title: Demostració
  errors:
    blank_integer: Cal un valor enter per a %{prompt_key}.
    blank_path: Cal un camí per a %{prompt_key}.
    blank_secret: Cal un valor secret per a %{prompt_key}.
    blank_text: Cal un valor per a %{prompt_key}.
    checkbox_required: Seleccioneu almenys una opció per a %{prompt_key}.
    checkbox_unknown: 'Valor no reconegut per a %{prompt_key}: %{raw}. Opcions vàlides:
      %{choices}.'
    checkbox_without_choices: La pregunta %{prompt_key} no declara opcions de casella.
    eu_eea_country_required: '%{flag} és obligatori quan %{condition_flag} indica
      residència a la UE o a l''EEE.'
    invalid_confirm: 'Resposta booleana no vàlida per a %{prompt_key}: %{raw}.'
    invalid_date: 'Data no vàlida per a %{flag}: %{got}. Fes servir el format ISO-8601
      (AAAA-MM-DD).'
    invalid_decimal: 'Nombre decimal no vàlid per a %{flag}: %{got}. Fes servir el
      punt com a separador decimal.'
    invalid_integer: 'Enter no vàlid per a %{prompt_key}: %{raw}.'
    invalid_postcode: 'Codi postal no vàlid per a %{prompt_key}: %{raw}. Un codi postal
      espanyol té 5 dígits (codi de província 01-52 seguit de tres dígits).'
    invalid_tax_id: 'NIF/NIE/CIF no vàlid per a %{prompt_key}: %{raw}. %{detail}'
    select_unknown: 'Valor no reconegut per a %{prompt_key}: %{raw}. Opcions vàlides:
      %{choices}.'
    select_without_choices: La pregunta %{prompt_key} no declara opcions de selecció.
    spouse_tax_id_required_joint: '%{flag} és obligatori quan %{condition_flag} és
      tributació conjunta.'
    unsupported_console: "L'assistent guiat necessita un terminal interactiu, i aquesta\
      \ execució no en té.\nEncara no s'ha desat res.\n\nPots acabar de crear aquest\
      \ perfil de dues maneres:\n\n1. Torna a executar l'ordre des d'un terminal interactiu\
      \ per fer servir l'assistent guiat:\n     aeat config profile create NAME\n\n\
      2. O crea un perfil de persona física resident IRPF en un sol pas indicant les\
      \ dades obligatòries com a flags:\n     aeat config profile create NAME --quiet\
      \ --tax-id NIF --entity-type natural_person --irpf-income-categories actividad_economica\
      \ --tax-residence-ccaa madrid --name NOM --surnames COGNOMS"
    unsupported_console_edit: "La configuració guiada no ha pogut obrir una pregunta\
      \ interactiva en aquesta execució.\nEncara no s'ha desat res.\n\nEdita aquest\
      \ perfil de manera no interactiva indicant el camp a canviar:\n  aeat config\
      \ profile edit %{profile_name} --quiet --<camp> VALOR\n\nO torna a executar\
      \ l'edició guiada des d'una sessió de terminal interactiva:\n  aeat config profile\
      \ edit %{profile_name}"
  other:
    description: Altres opcions de configuració
    section:
      title: Altres ajustos
    title: Altres
  progress:
    question_prefix: Pregunta %{q_n} de %{q_total}
    section_header: 'Pas %{section_n} de %{section_total}: %{title}'
  setup:
    actividad:
      title: Activitat econòmica i cens
    capabilities:
      cloud-evidence-upload:
        prompt: Voleu permetre pujar evidència sensible a proveïdors LLM al núvol?
          (desactivat per defecte)
      google-export:
        prompt: Voleu activar l'exportació a Google Sheets?
      llm-vision:
        prompt: Voleu activar la visió LLM local per llegir factures?
      title: Capacitats de serveis
    certificate:
      path:
        prompt: Introduiu el camí del certificat digital (.p12, .pfx)
    codes:
      disability-grade:
        choices:
          33-64:
            description: Discapacitat reconeguda del 33% al 64% - incrementa el mínim
              personal.
            label: Discapacitat del 33% al 64%
          65-plus:
            description: Discapacitat reconeguda del 65% o més - major increment del
              mínim personal.
            label: Discapacitat del 65% o superior
          assistance-or-mobility:
            description: Necessitat acreditada d'ajuda de tercers o mobilitat reduïda
              - afegeix l'increment per assistència.
            label: Ajuda de tercers o mobilitat reduïda
          judicial-incapacity:
            description: Incapacitat declarada judicialment - s'assimila al 65%+ amb
              independència del grau certificat.
            label: Incapacitat judicial o equivalent
      sex:
        choices:
          h:
            label: H - home
          m:
            label: M - dona
    cotejo:
      adopt:
        label: Adoptar el valor del certificat
        provenance: Certificat de Situació Censal (evidència no oficial)
      compare:
        help: Conserva la teva resposta, adopta el valor del certificat o ajorna-ho
          per decidir-ho més tard.
        prompt: Aquesta dada difereix del certificat. Quin valor conserves?
      keep:
        label: Conservar la meva resposta
        provenance: La teva resposta de l'assistent
      title: Comprovació amb el Certificat de Situació Censal
    descendientes:
      acogimiento-resolucion:
        help: 'Data de la primera resolució d''acolliment preadoptiu o permanent.
          Indiqueu-la també si el menor va ser adoptat després: l''augment per menor
          de tres anys es compta des del primer acolliment i dura tres períodes en
          total, i l''adopció no el torna a començar.'
        prompt: Data de la primera resolució d'acolliment
      alta-posterior-nacimiento-mes:
        help: Indiqueu un mes de l’1 al 12. Ha de coincidir amb el primer mes declarat
          als mesos de treball; deixeu-ho en blanc si la mare ja complia el requisit
          quan va néixer el fill.
        invalid_range: El mes ha d’estar entre %{minimum} i %{maximum}.
        prompt: Mes en què la mare va completar els 30 dies de cotització després
          del naixement
      birth-date:
        prompt: Data de naixement
      convivencia:
        prompt: Aquest descendent conviu amb vostè?
      count:
        help: 'Compti els fills que poden donar dret al mínim per descendents (art.
          58 LIRPF): menors de 25 anys (o qualsevol edat amb discapacitat) que convisquin
          amb vostè.'
        prompt: Quants descendents (fills) vol declarar?
      custodia-compartida:
        prompt: La custòdia és compartida amb l'altre progenitor?
      declaracion-propia:
        help: Només impedeix el mínim si a més les seves rendes superen el límit legal.
        prompt: El descendent presenta la seva pròpia declaració de la renda?
      dependencia-economica:
        choices:
          'false':
            label: No, no hi contribueixo
          'true':
            label: Sí, hi contribueixo
        help: Responeu només si el descendent no conviu amb vós. Un progenitor sense
          guarda i custòdia, ni tan sols compartida, que no paga anualitats per aliments
          per decisió judicial però contribueix al manteniment del fill, té dret al
          mínim per descendents. Si declareu anualitats per aliments, aquesta assimilació
          no s'aplica a cap descendent mentre l'aplicació no les pugui repartir per
          fill.
        prompt: Contribuïu al manteniment econòmic d'aquest descendent?
      discapacidad:
        choices:
          '0':
            label: Sense discapacitat
          '33':
            label: Del 33% al 64%
          '65':
            label: 65% o més
        prompt: Grau de discapacitat
      entry-event:
        before_birth: La data d'entrada no pot ser anterior a la data de naixement.
        in_future: La data d'entrada no pot ser futura.
        relacion_mismatch: Aquesta data no correspon a la relació indicada. La inscripció
          al Registre Civil només s'indica per a un descendent adoptat, i la resolució
          d'acolliment només per a un acolliment preadoptiu o permanent, o per a un
          adoptat que abans va estar acollit. Corregiu la relació o esborreu la data.
      fallecimiento:
        help: Deixeu-ho en blanc si aquest descendent no ha mort.
        prompt: Data de defunció
      gastos-guarderia:
        both_declared: Indiqueu el total anual de llar d'infants o els imports mes
          a mes d'aquest fill, però no tots dos. El detall mensual és l'únic que pot
          expressar l'any en què el fill compleix tres anys, així que esborreu el
          total anual.
        help: Imports pagats a una llar d'infants o centre d'educació infantil autoritzat
          (art. 81.2 LIRPF) que incrementen la deducció per maternitat; euros sencers.
        invalid_negative: Les despeses de llar d'infants no poden ser negatives; introduïu
          0 o un import positiu en euros (art. 81 bis LIRPF).
        prompt: Despeses de llar d'infants pagades en l'any de declaració (euros)
      gastos-guarderia-mensuales:
        help: 'Feu servir aquesta casella en lloc del total anual quan el fill compleixi
          tres anys durant l''exercici: només compten els mesos posteriors a l''aniversari
          i un import anual no es pot repartir entre ells. Escriviu cada mes i el
          seu import com a MM:IMPORT separats per punt i coma, o un període com a
          MM-MM:IMPORT, per exemple 9-12:210;1:180. Els mesos amb dret són els que
          certifica la vostra llar d''infants.'
        invalid_grammar: Escriviu cada mes i el seu import com a MM:IMPORT separats
          per punt i coma; un període es pot escriure MM-MM:IMPORT. Per exemple 9-12:210;1:180.
          Els mesos van de l'1 al 12, els imports són euros sencers i cada mes pot
          aparèixer una sola vegada.
        prompt: Despeses de llar d'infants d'aquest fill, mes a mes (opcional)
      inscripcion-registro-civil:
        help: Data en què l'adopció es va inscriure al Registre Civil. Si la inscripció
          no calia, indiqueu la data de la resolució judicial o administrativa. Des
          d'aquesta data es compta l'augment per menor de tres anys.
        prompt: Data d'inscripció al Registre Civil
      meses-madre-trabajo:
        help: 'Per a la deducció per maternitat (art. 81 LIRPF): QUINS mesos va cotitzar
          la mare a la Seguretat Social mentre aquest fill donava dret -- menor de
          3 anys, o (amb independència de l''edat) dins la finestra de data d''entrada
          d''adopció/acolliment registrada a INSCRIPCION/ACOGIMIENTO. Escriviu MM
          o MM-MM, separats per '';'' (per exemple 5-8 o 1;2;11;12). Els mesos i no
          el seu nombre, perquè l''increment per llar d''infants es prorrateja pels
          mesos que aquests i els de la llar d''infants comparteixen.'
        invalid_range: Indiqueu els mesos com a MM o MM-MM, separats per ';' (per
          exemple 5-8 o 1;2;11;12), cadascun entre %{minimum} i %{maximum}.
        prompt: Quins mesos va treballar la mare amb dret a la deducció -- fill menor
          de 3 anys, o adopció/acolliment dins la seva finestra de data d'entrada
          (exercici)
      nif:
        prompt: NIF/NIE del descendent (deixi en blanc si no en té)
      prorrata-minimo:
        choices:
          'false':
            label: No, l'aplico només jo
          'true':
            label: Sí, es reparteix entre tots dos
        help: Deixa-ho en blanc i es deduirà del teu estat civil, del cònjuge registrat
          i del tipus de declaració.
        prompt: Un altre contribuent també té dret al mínim per aquest descendent?
      relacion:
        choices:
          acogimiento_preadoptivo_o_permanente:
            label: Acolliment preadoptiu o permanent
          acogimiento_temporal:
            label: Acolliment temporal
          adoptado:
            label: Adoptat
          descendiente:
            label: Descendent (fill o nét)
          guarda_y_custodia_judicial:
            label: Guarda i custòdia per resolució judicial
          tutela:
            label: Tutela o representació legal
        help: Trieu la relació legal. Totes donen dret al mínim per descendents. Només
          l'adopció i l'acolliment preadoptiu o permanent donen a més dret a l'augment
          per menor de tres anys amb independència de l'edat; l'acolliment temporal
          i la tutela no.
        prompt: Relació amb aquest descendent
      rentas-anuales:
        help: Deixa-ho en blanc si no ho saps. Una renda alta pot impedir el mínim
          per descendents.
        invalid_negative: Les rendes del descendent no poden ser negatives.
        prompt: Rendes anuals del descendent, excloses les exemptes (euros)
      title: Descendents
    description: Auxiliar de configuració per preparar les declaracions
    enrollment:
      enrollment-large-company:
        prompt: Empresa de gran volum
      enrollment-public-administration-budget-gt-6000000:
        prompt: Pressupost administració pública superior a 6.000.000
      title: Inscripció
