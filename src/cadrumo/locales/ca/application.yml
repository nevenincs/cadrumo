        modelo_unknown: El model de la captura del justificant no és un model conegut
          de l'AEAT.
        no_filed_declaration: No hi ha cap declaració presentada per a aquest model
          i període, per la qual cosa no es pot resoldre l'expedient del justificant.
        pdf_base64_empty: El contingut PDF de la captura del justificant es descodifica
          a zero bytes.
        pdf_base64_invalid: El contingut PDF de la captura del justificant no és base64
          vàlid.
        pdf_sha256_mismatch: El resum del PDF de la captura del justificant no coincideix
          amb els bytes PDF descodificats.
        snapshot_bucket_mismatch: El snapshot de la captura del justificant no pertany
          al bucket del repositori.
        snapshot_id_blank: L'identificador del snapshot de la captura del justificant
          no pot estar buit.
        snapshot_not_found: Cap snapshot de captura del justificant coincideix amb
          l'identificador sol·licitat.
        snapshot_prefix_ambiguous: El prefix del snapshot de captura del justificant
          coincideix amb diversos snapshots.
    notifications:
      errors:
        bucket_id_blank: L'identificador del bucket de notificacions no pot estar
          buit.
        certificado_id_blank: L'identificador de certificat de la notificació no pot
          estar buit.
        certificado_not_in_any_snapshot: Cap llista de notificacions capturada esmenta
          aquest certificat. Descarrega abans la llista de notificacions.
        document_conflict: 'Ja hi ha desat un document diferent per a aquesta notificació;
          no s''ha sobreescrit res. Discrepen: {diverging_fields}.'
        document_not_found: Cap document desat correspon a aquesta notificació. Descarrega'l
          primer.
        document_prefix_ambiguous: Aquest prefix de certificat correspon a diversos
          documents desats. Indica l'identificador complet.
        document_row_mismatch: Aquest document pertany a una altra notificació i no
          s'ha desat.
        snapshot_id_blank: L'identificador de la instantània de notificacions no pot
          estar buit.
        snapshot_not_found: Cap instantània de notificacions no coincideix amb l'identificador
          sol·licitat.
        snapshot_prefix_ambiguous: El prefix de la instantània de notificacions coincideix
          amb diverses instantànies.
    profile_taxpayer_number:
      errors:
        unresolved: No s'ha pogut llegir el número de contribuent del perfil, així
          que no hi ha res a comprovar. Comprova que el perfil en tingui un de registrat.
    snapshot_base:
      errors:
        repository_bucket_mismatch: El repositori de snapshots ha informat d'un bucket
          diferent del sol·licitat.
        service_bucket_mismatch: El bucket del servei de snapshots no coincideix amb
          el bucket del seu repositori.
        snapshot_bucket_mismatch: El bucket de la càrrega de la instantània no coincideix
          amb el bucket del repositori.
        snapshot_key_mismatch: La instantània està emmagatzemada sota la clau d'una
          altra instantània.
        state_active_supersession_pointer: Un snapshot actiu no pot portar un punter
          de substitució.
        state_discard_audit_required: Un snapshot descartat requereix marca de temps
          de descart i actor que el descarta.
        state_discard_metadata_forbidden: Només un snapshot descartat pot portar metadades
          de descart.
        state_discarded_supersession_pointer: Un snapshot descartat no pot portar
          un punter de substitució.
        state_supersession_pointer_required: Un snapshot substituït ha de portar l'identificador
          del snapshot que el substitueix.
    verify:
      errors:
        bucket_id_blank: L'identificador del bucket de la comprovació no pot estar
          buit.
        observation_bucket_mismatch: El bucket de l'observació que es comprova no
          coincideix amb el bucket del magatzem.
        observation_id_blank: L'identificador de l'observació que es comprova no pot
          estar buit.
        observation_id_mismatch: L'identificador de l'observació que es comprova no
          coincideix amb l'observació sol·licitada.
        observation_key_mismatch: L'observació que es comprova està emmagatzemada
          sota la clau d'una altra observació.
        observation_not_found: No hi ha cap observació que coincideixi amb l'identificador
          sol·licitat.
        observation_prefix_ambiguous: El prefix de l'identificador d'observació coincideix
          amb diverses observacions.
  modelo:
    borrador_binding:
      errors:
        decimal_value_invalid: El valor d'esborrany per a l'origen numèric %{binding_id}
          ha de ser compatible amb decimal.
        forbidden_bindings: 'L''esborrany conté valors que les definicions del model
          no han marcat com a emplenats prèviament per l''AEAT: %{bindings}.'
        registry_snapshot_axis_mismatch: 'L''any i el període de les definicions del
          model no coincideixen amb l''ordre: any de les definicions=%{snapshot_year}
          període=%{snapshot_period}; any de l''ordre=%{filing_year} període=%{period}.'
        registry_snapshot_modelo_mismatch: 'El model de les definicions no coincideix
          amb l''ordre: model de les definicions=%{snapshot_modelo}; model de l''ordre=%{command_modelo}.'
        snapshot_axis_mismatch: 'L''snapshot d''esborrany no coincideix amb l''eix
          del càlcul: any de l''snapshot=%{snapshot_year} període=%{snapshot_period};
          any del càlcul=%{filing_year} període=%{period}.'
        snapshot_bucket_mismatch: L'snapshot d'esborrany no pertany al bucket actiu.
        snapshot_load_failed: No es pot carregar l'snapshot d'esborrany seleccionat;
          llista els snapshots actius amb aeat app live borrador 100 list.
        snapshot_not_active: L'snapshot d'esborrany no està actiu; llista els snapshots
          actius amb `aeat app live borrador 100 list`.
        unsupported_modelo: Llegir els valors de l'esborrany no està suportat per
          al model %{modelo}; les definicions del model han de declarar la capacitat
          d'esborrany.
    calc_diagnostic:
      activity_asset_accrual_unavailable:
        what: No s'ha pogut calcular la dotació d'un bé, de manera que no s'inclou.
        what_to_do: Completa o corregeix el bé al registre i torna a calcular.
      activity_asset_activity_undeclared:
        what: La compra d'un bé no indica el tipus d'activitat, de manera que es compta
          com a no agrària.
        what_to_do: Indica el tipus d'activitat en aquest moviment i torna a calcular.
      activity_asset_agrarian_excluded:
        what: Un bé d'una activitat agrària queda fora d'aquest pagament fraccionat,
          que es calcula sobre els ingressos d'aquesta activitat.
        what_to_do: No has de fer res. La seva dotació es dedueix a la teva declaració
          anual.
      activity_asset_claim_gap:
        what: Un bé no té dotació registrada per a part de l'any, de manera que aquesta
          part no es dedueix.
        what_to_do: Registra la dotació d'aquest període si la vols deduir i torna
          a calcular.
      activity_asset_disposal_finding:
        what: La baixa d'un element té un punt que has de revisar, encara que no atura
          aquest model.
        what_to_do: Revisa el que aquesta nota diu sobre la baixa i registra-ho o
          corregeix-ho si t'afecta.
      activity_asset_foral_territory:
        what: En aquest període resideixes en un territori foral, on l'amortització
          es regeix per altres normes. Queda fora d'aquest càlcul i no es dedueix
          cap xifra.
        what_to_do: Determina l'amortització segons les normes forals del teu territori
          i declara-la davant la seva hisenda foral.
      activity_asset_residence_period_unknown:
        what: El teu perfil recull una residència fiscal, però cap per a aquest període,
          així que els teus elements es compten com si aquest model fos aplicable.
        what_to_do: Indica al teu perfil on residies en aquest període i torna a calcular.
      activity_asset_residence_unresolved:
        what: No s'ha pogut llegir la residència fiscal registrada, de manera que
          l'amortització dels teus béns registrats queda fora d'aquest càlcul i no
          es dedueix cap xifra.
        what_to_do: Indica la teva residència fiscal al teu perfil i torna a calcular.
      administrador_retencion_rate_mismatch:
        what: El tipus de retenció d'un registre d'administrador no coincideix amb
          el que correspon.
        what_to_do: Compara aquest tipus amb les instruccions oficials i corregeix
          el registre si cal.
      advisory_binding_value:
        what: 'Una xifra d''una casella es basa en una lectura que Cadrumo encara
          no pot confirmar: pots veure-la i previsualitzar-la, però no comprovar,
          exportar ni registrar la declaració amb ella.'
        what_to_do: Compara la xifra amb els teus registres i amb el certificat del
          pagador. Mentre estigui en espera, Cadrumo no pot comprovar, exportar ni
          registrar aquesta declaració; una versió posterior que confirmi el període
          l'alliberarà.
      aggregation_activity_undeclared:
        what: La casella {box} mostra zero, tot i que tens ingressos en aquest període
          sense tipus d'activitat.
        what_to_do: Indica el tipus d'activitat en aquests registres d'ingressos i
          torna a calcular.
      autonomic_deducciones_not_enrolled:
        what: No es calcula cap deducció autonòmica de la teva comunitat de residència
          en aquest exercici, així que el total de deduccions autonòmiques només inclou
          els imports que escriguis tu.
        what_to_do: Si te'n correspon alguna, escriu tu el seu import a la seva casella.
      calculation_screen_outdated:
        what: Aquest càlcul es va fer abans de les comprovacions actuals de Cadrumo
          sobre les seves xifres, així que no es pot comprovar, exportar ni registrar
          tal com està.
        what_to_do: Torna a calcular la declaració i comprova-la després.
      credit_cross_check_absent:
        what: Una deducció per retencions té una font amb què contrastar-la que no
          conté res, així que la xifra es manté, però sense contrastar.
        what_to_do: Si aquesta font hauria de contenir aquesta retenció, afegeix-la
          i torna a calcular; si no, no cal que facis res.
      credit_resolution_applied:
        what: Vas acceptar l'import utilitzat en una discrepància entre fonts, així
          que ja no reté aquesta declaració. L'acceptació no canvia cap xifra.
        what_to_do: 'No hi ha res a fer. Si més endavant es corregeix una font, torna
          a calcular: una acceptació només cobreix els imports amb què es va fer.'
      credit_resolution_stale:
        what: Vas acceptar una discrepància anterior d'aquesta xifra, però les seves
          fonts ara donen altres imports, així que aquesta acceptació ja no s'aplica.
        what_to_do: Compara de nou els imports. Si l'import utilitzat continua sent
          correcte, accepta aquesta discrepància amb el seu nou identificador.
      credit_source_disagreement:
        what: Dues fonts donen imports diferents per a la mateixa deducció per retencions,
          així que Cadrumo no pot comprovar, exportar ni registrar la declaració amb
          aquesta xifra.
        what_to_do: 'Compara l''import amb el certificat de cada pagador, corregeix
          la font que estigui malament i torna a calcular. Si has comprovat que l''import
          utilitzat és correcte, accepta''l amb el seu identificador: `aeat app modelo
          work accept-disagreement <identificador> --reason <motiu>`.'
      declared_party_name_unresolved:
        what: Una part declarada no té un nom de declaració que el seu registre pugui
          portar, així que el seu camp de nom queda sense contingut i l'exportació
          es rebutja.
        what_to_do: 'Indica el nom de declaració de la part: cognoms i nom, o la seva
          raó social, i una versió més curta on el camp sigui més estret. Després
          torna a calcular.'
      deferred_binding_source:
        what: Cadrumo encara no emplena automàticament una xifra d'aquesta declaració.
        what_to_do: No has de fer res, tret que aquesta xifra t'afecti. Si t'afecta,
          escriu-la tu.
      devengo_date_proxy_attribution:
        what: Algunes factures no tenen la data en què es va fer l'operació, així
          que s'ha fet servir la d'emissió per triar el període.
        what_to_do: Afegeix la data de l'operació a les factures de final de període
          i torna a calcular.
      dt12_parcial_rescate_guidance:
        what: Els cobraments parcials del mateix pla de pensions comparteixen un únic
          termini per a la reducció de la casella {box}, que es compta una sola vegada.
        what_to_do: Comprova que cada cobrament cau dins d'aquest termini.
      dt12_regime_window_closed:
        what: La reducció del 40 % de la casella {box} no s'ha aplicat, perquè el
          termini per a aquest cobrament d'un sol cop ja ha passat.
        what_to_do: No has de fer res. Si l'any del fet no és correcte, corregeix-lo
          al teu perfil i torna a calcular.
      dt12_regime_window_unverified:
        what: La reducció del 40 % per una pensió cobrada d'un sol cop s'ha aplicat
          a la casella {box}, però no se n'ha comprovat el termini.
        what_to_do: Indica a Cadrumo l'any del fet que va originar la pensió i torna
          a calcular.
      duplicate_binding_owner:
        what: Cadrumo ha trobat una errada en com està muntada aquesta declaració,
          no en les teves dades.
        what_to_do: No has de canviar res als teus registres. Avisa'ns abans de refiar-te
          de les xifres.
      duplicate_bound_casilla_owner:
        what: Cadrumo ha trobat una errada en com està muntada aquesta declaració,
          no en les teves dades.
        what_to_do: No has de canviar res als teus registres. Avisa'ns abans de refiar-te
          de les xifres.
      duplicate_relation_owner:
        what: Cadrumo ha trobat una errada en com està muntada aquesta declaració,
          no en les teves dades.
        what_to_do: No has de canviar res als teus registres. Avisa'ns abans de refiar-te
          de les xifres.
      filed_before_grade_cap:
        what: Vas registrar aquesta declaració abans de les comprovacions actuals
          de les seves xifres, i una de les seves caselles té una xifra que aquestes
          comprovacions retenen, així que no pots exportar-la tal com està.
        what_to_do: Torna a calcular la declaració, comprova-la i registra-la una
          altra vegada; el nou registre substitueix aquest.
      household_row_fact_unstated:
        what: Hi ha una persona de la teva llar registrada sense una dada que la declaració
          exigeix, així que no es pot comprovar, exportar ni presentar fins que l'indiquis.
        what_to_do: Indica al teu perfil la dada que falta d'aquesta persona i torna
          a calcular.
      household_rows_incomplete:
        what: El teu perfil indica més persones en aquest grup de les que registra,
          així que la declaració només fa servir les persones registrades i no dona
          el grup per complet.
        what_to_do: Afegeix al teu perfil les persones que falten o corregeix el nombre,
          i torna a calcular.
      inferred_retencion_excluded_from_credit:
        what: Part de la retenció de les teves factures emeses s'ha calculat a partir
          del que va pagar el client, així que s'ha deixat fora de la teva deducció
          i podries pagar més del necessari.
        what_to_do: Registra la retenció que et va aplicar el client en cada factura
          emesa, o aconsegueix-ne el certificat, i torna a calcular.
      inferred_retencion_rate_unmatched:
        what: Cadrumo ha estimat una retenció a partir del que faltava en un cobrament,
          i no coincideix amb cap tipus oficial.
        what_to_do: Si la diferència va ser una comissió del banc o un descompte,
          corregeix el registre per no reclamar retenció.
      inferred_retencion_sectoral_rate_unconfirmed:
        what: Cadrumo ha estimat una retenció de l'1 % o del 2 % a partir del que
          faltava en un cobrament, i podria ser una comissió o un descompte.
        what_to_do: Revisa la retenció amb la factura o el certificat del teu client
          als teus registres, corregeix el registre si és diferent i torna a calcular.
      inventory_book_claimed_purchase:
        what: Una compra d'existències es deixa fora de les teves despeses, perquè
          el teu inventari la declara com a compra d'existències.
        what_to_do: No has de fer res.
      invoice_category_counterparty_mismatch:
        what: El tractament d'IVA d'una factura no encaixa amb el país del client,
          així que s'ha deixat fora.
        what_to_do: Revisa la categoria d'IVA o el país d'aquesta factura als teus
          registres.
      invoice_recargo_departs_from_published_rate:
        what: El recàrrec d'equivalència anotat en una factura no coincideix amb el
          tipus oficial.
        what_to_do: Revisa el recàrrec d'aquesta factura als teus registres.
      invoice_recargo_not_attributable_to_a_tier:
        what: Aquesta declaració es va calcular sense el recàrrec d'una factura que
          cobreix diversos tipus d'IVA.
        what_to_do: 'Torna a calcular: el recàrrec es declararà en cada tipus, o se
          t''indicarà la factura que cal corregir.'
      invoice_reverse_charge_cuota_not_derivable:
        what: Una factura rebuda amb inversió del subjecte passiu no té tipus d'IVA,
          així que no s'ha calculat l'IVA que en deus.
        what_to_do: Indica el tipus d'IVA d'aquesta factura als teus registres i torna
          a calcular.
      iva_compensation_annual_source_evidence_failure:
        what: L'IVA anual a compensar o arrossegar es basa en registres que no tenen
          justificant.
        what_to_do: Revisa els registres d'IVA de tot l'any, afegeix el justificant
          que falti i torna a calcular.
      iva_operation_date_after_movement:
        what: Algunes files del llibre tenen una data de l'operació posterior a la
          bancària. Si aquests diners eren una bestreta, el seu IVA es va meritar
          en cobrar-la.
        what_to_do: En una bestreta, posa com a data de l'operació la del cobrament,
          registra la resta en una fila pròpia i torna a calcular.
      iva_row_placed_on_movement_date:
        what: Algunes files del llibre no tenen la data de l'operació, així que la
          seva data bancària ha triat el període de l'IVA. L'IVA es merita quan es
          fa l'operació, no quan es mou el diner.
        what_to_do: Afegeix la data de l'operació a les files de final de període
          i torna a calcular.
      iva_selected_scope_evidence_failure:
        what: Els registres que sustenten l'IVA d'aquesta declaració no tenen justificant
          o no quadren.
        what_to_do: Obre els teus registres d'aquest període, corregeix els que estiguin
          marcats i torna a calcular.
      ledger_amortization_row_unregistered:
        what: Un moviment registra una compra amortitzable que no és al teu registre
          de béns, de manera que no dedueix res.
        what_to_do: Dona d'alta l'element indicant aquest moviment com a adquisició,
          o reclassifica el moviment, i torna a calcular.
      ledger_expense_may_be_durable:
        what: Un moviment deduït com a despesa corrent pot ser un bé que dura més
          d'un any. Ho és?
        what_to_do: Si ho és, dona d'alta el bé, perquè es dedueix mitjançant dotacions,
          i torna a calcular. Si és un consumible, deixa el moviment com està.
      m193_settled_row_amounts_unresolved_authority:
        what: Alguns imports d'un registre d'un pagament fet en un any posterior no
          tenen una font oficial que els confirmi.
        what_to_do: Comprova aquests imports amb les instruccions oficials abans de
          presentar.
      m347_declarado_provincia_unrecorded:
        what: 'Falta {box} d''aquest declarat: correspon al seu domicili fiscal i
          les teves factures no l''indiquen.'
        what_to_do: Obre la seva factura i indica la província del seu domicili fiscal;
          val per a totes les seves factures en tornar a calcular.
      m347_metalico_unrecorded:
        what: Les teves factures no indiquen com es van cobrar, així que {box} queda
          sense import en tots els registres.
        what_to_do: Si algun declarat et va pagar en metàl·lic per sobre de l'import
          que obliga a declarar-lo, consigna aquest import al seu registre abans de
          presentar la declaració.
      m349_clave_inferred_from_category:
        what: Cadrumo ha triat el tipus d'operació d'una línia del llistat d'operacions
          amb la UE segons la categoria d'IVA de la factura, i podria ser un altre.
        what_to_do: Revisa el tipus d'operació d'aquestes factures als teus registres
          i canvia'l si és diferent.
      m349_operation_unclassified:
        what: Una factura amb una contrapart d'un altre país de la UE i sense IVA
          no indica quina operació intracomunitària recull, així que el llistat d'operacions
          amb la UE la deixa fora.
        what_to_do: Obre la factura i indica'n el tipus d'operació; després torna
          a calcular.
      missing_transaction_evidence:
        what: Un apunt amb IVA no té factura ni document adjunt.
        what_to_do: Adjunta la factura o el justificant a aquest apunt als teus registres.
      official_box_unpopulated:
        what: El total de la casella {box} està calculat, però les caselles oficials
          que el formen estan totes buides.
        what_to_do: Copia els imports a mà a les caselles oficials i torna a comprovar
          la declaració.
      operator_override_diverges_from_computed:
        what: El valor de la casella {box} és el que vas escriure tu, no el que ha
          calculat Cadrumo.
        what_to_do: Mantén-lo només si n'estàs segur. Per fer servir el valor calculat,
          torna a calcular sense escriure-hi cap valor.
      orphaned_override:
        what: Un valor que vas escriure abans ja no correspon a cap casella d'aquesta
          declaració, així que no s'ha fet servir.
        what_to_do: Mira si encara el necessites i, si és així, torna a escriure'l
          a la casella correcta.
      oss_no_live_source:
        what: No s'ha trobat cap factura de finestreta única (OSS) en aquest període,
          així que Cadrumo no ha calculat aquest impost.
        what_to_do: No has de fer res si no vas fer aquest tipus de vendes. Si en
          vas fer, escriu tu els imports.
      precedence_tier_divergence:
        what: Dues fonts tenen valors diferents per a una xifra que arriba a la casella
          {box}, i Cadrumo ha fet servir la que té prioritat.
        what_to_do: 'Compara les fonts i corregeix la que sigui incorrecta; després
          torna a calcular. La comprovació, l''exportació i el registre esperen fins
          que coincideixin, o fins que acceptis el valor utilitzat amb el seu identificador:
          `aeat app modelo work accept-disagreement <identificador> --reason <motiu>`.'
      precedence_tier_divergence_advisory:
        what: Dues fonts tenen valors diferents per a una xifra de treball, i Cadrumo
          ha fet servir la que té prioritat.
        what_to_do: Compara les fonts i corregeix la que sigui incorrecta. Cap casella
          exportada no depèn d'aquesta xifra.
      prior_payment_minoracion_not_captured:
        what: La minoració que ve de pagaments anteriors no està anotada a la casella
          {box}.
        what_to_do: Escriu aquesta minoració a la casella {box} si et correspon.
      prior_payment_not_deducted:
        what: Vas registrar un trimestre anterior com a presentat, però la casella
          {box} no descompta el que vas pagar llavors.
        what_to_do: Escriu a la casella {box} el que vas pagar en els trimestres anteriors.
      prorrata_especial_check_unavailable:
        what: Cadrumo no ha pogut comprovar si la prorrata especial d'IVA és obligatòria
          per a tu.
        what_to_do: Comprova-ho tu amb les regles oficials o amb el teu assessor.
      prorrata_especial_obligatoria:
        what: La prorrata especial d'IVA pot ser obligatòria per a tu, per la teva
          barreja d'activitat exempta i subjecta.
        what_to_do: Consulta les regles de la prorrata de l'IVA o el teu assessor,
          i aplica la prorrata especial si és obligatòria.
      prorrata_volume_check_unavailable:
        what: La comparació anual amb el llibre és incompleta.
        what_to_do: Classifica les operacions de sortida i revisa les exclusions de
          prorrata.
      prorrata_volume_declaration_missing:
        what: El llibre conté operacions de sortida per comparar amb els volums anuals
          de prorrata.
        what_to_do: Declara els volums anuals; el llibre no els substitueix.
      prorrata_volume_divergence:
        what: Els volums anuals de prorrata declarats difereixen del llibre classificat.
        what_to_do: Revisa els volums i les exclusions. Les xifres declarades continuen
          sent l’autoritat.
      rate_boxes_underaccount_total:
        what: Una part del total d'IVA de la casella {box} no és a cap casella per
          tipus.
        what_to_do: Revisa el tipus d'IVA de les teves factures i registres i torna
          a calcular. No es podrà exportar la declaració fins que es corregeixi.
      register_acquisition_exceeds_ledger:
        what: Els moviments d'un bé del teu registre van pagar menys que el cost que
          indiques.
        what_to_do: Corregeix el preu al teu registre de béns o el moviment i torna
          a calcular.
      register_acquisition_partly_accounted:
        what: Un bé del teu registre explica només una part del seu moviment, així
          que la resta no dedueix res.
        what_to_do: Dona d'alta la resta del que va pagar aquell moviment, o corregeix
          el preu del bé, i torna a calcular.
      register_acquisition_row_missing:
        what: Un bé del teu registre indica un moviment que ja no és als teus moviments.
        what_to_do: Torna a introduir aquell moviment, o corregeix el bé al teu registre,
          i torna a calcular.
      register_owned_capital_acquisition:
        what: Una compra d'equipament es deixa fora de les teves despeses, perquè
          es dedueix mitjançant la seva dotació anual.
        what_to_do: No has de fer res.
      reopen_hint: Torna a calcular per veure les notes del càlcul.
      settlement_not_computed:
        what: La casella {box} recull la liquidació final i Cadrumo no la calcula.
        what_to_do: Escriu l'import a la casella {box} i compara'l amb les instruccions
          oficials.
      source_domain_not_ready:
        what: Els registres dels quals depèn aquesta xifra encara no estan llestos
          per llegir-se.
        what_to_do: Acaba de preparar o importar aquests registres i torna a calcular.
      source_issue:
        what: Falta informació de la qual depèn aquesta xifra, o no s'ha pogut fer
          servir.
        what_to_do: Revisa els teus registres i el teu perfil per si falta alguna
          cosa i torna a calcular.
      stale: De l'últim càlcul. Torna a calcular per actualitzar.
      storage_degraded:
        what: Cadrumo no ha pogut llegir una part dels teus registres desats, així
          que algunes xifres poden estar incompletes.
        what_to_do: Torna a calcular. Si continua passant, comprova que les teves
          dades són accessibles i avisa'ns.
      structurally_unroutable_base_category:
        what: Aquesta declaració no té casella per als imports d'una categoria dels
          teus registres.
        what_to_do: Consulta a les instruccions oficials on es declaren aquests imports;
          sovint van en un altre lloc.
      terminal_origin_mismatch:
        what: Una xifra ha arribat a la declaració per un camí del qual Cadrumo no
          pot respondre, així que no és fiable tal com està.
        what_to_do: Mira d'on surt aquesta xifra als teus registres i torna a calcular.
          Avisa'ns si continua igual.
      unclassified_declarant_role_fact:
        what: Una factura no diu si és aliena a la teva activitat o si és una subvenció,
          i això decideix com es declara.
        what_to_do: Respon aquesta pregunta a la factura, als teus registres, i torna
          a calcular.
      unconverted_foreign_currency:
        what: Una factura en moneda estrangera no té tipus de canvi a euros, així
          que queda fora del llistat.
        what_to_do: Afegeix el tipus de canvi a aquesta factura als teus registres
          i torna a calcular.
      ungrounded_income_substrate:
        what: Alguns registres d'ingressos no tenen factura amb base imposable, així
          que s'ha fet servir l'import del banc i es deixa fora la retenció.
        what_to_do: Vincula una factura emesa a cada registre d'ingressos, o indica'n
          la base imposable, i torna a calcular.
      unhandled_binding_source:
        what: Cadrumo encara no sap emplenar una xifra d'aquesta declaració a partir
          de les teves dades.
        what_to_do: No presentis aquesta xifra tal com està. Escriu-la tu si la coneixes
          i avisa'ns de la mancança.
      unresolved_binding:
        what: Cadrumo no ha pogut treure una xifra de les teves dades i hauria mostrat
          un zero sense avisar.
        what_to_do: Afegeix els registres o les dades de perfil que faltin, o escriu
          tu el valor, i torna a calcular.
      unresolved_derived_binding:
        what: No s'ha pogut calcular una xifra que Cadrumo treu a partir d'altres.
        what_to_do: Comprova que les xifres de les quals depèn estan emplenades i
          torna a calcular.
      unresolved_retencion_substrate:
        what: En algunes factures emeses Cadrumo no pot saber quant es va retenir,
          així que a la teva deducció per retencions li pot faltar un import desconegut
          i podries pagar més del necessari.
        what_to_do: Indica als teus registres la base i la retenció de cadascuna d'aquestes
          factures i torna a calcular.
      unrouted_declarable_quantity:
        what: Una part d'un registre, com una retenció o una base imposable, no arriba
          a cap casella d'aquesta declaració.
        what_to_do: Revisa la classificació i els imports d'aquest registre i torna
          a calcular.
      unrouted_observation:
        what: Un import dels teus registres no s'ha col·locat a cap casella d'aquesta
          declaració.
        what_to_do: Revisa com està classificat aquest registre i torna a calcular.
      unsettled_legal_reading:
        what: Una xifra declarada segueix una lectura d'una norma que no està resolta
          per a aquest exercici, i l'AEAT podria llegir-la d'una altra manera.
        what_to_do: Revisa aquestes operacions amb els criteris actuals de l'AEAT
          abans de presentar.
      unusable_sales_invoice_evidence:
        what: Un registre d'ingressos està vinculat a una factura emesa que no és
          fiable, així que es declara l'import del banc i es perd la retenció.
        what_to_do: Arregla el vincle amb la factura als teus registres, o indica
          directament la base imposable, i torna a calcular.
      withholding_detail_absent:
        what: No hi ha detall de retencions per perceptor durant l'any, així que es
          mostra un zero sense suport.
        what_to_do: Afegeix als teus registres el detall de l'any i torna a calcular.
