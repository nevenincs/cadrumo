application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: No s'ha pogut adquirir el bloqueig d'autenticació AEAT després
          de la recuperació del bloqueig obsolet.
        lock_held: Ja hi ha una altra operació d'autenticació AEAT en curs per a aquest
          perfil. No iniciïs una segona petició de Cl@ve; espera que acabi el procés
          en curs o deixa expirar el bloqueig si aquest procés ha fallat.
    certificate:
      health:
        file_missing: El fitxer de certificat configurat (%{path}) no existeix. Recupera
          el fitxer o executa 'aeat config auth configure --provider certificate --file
          Camí' amb un camí vàlid.
        path_unset: No s'ha seleccionat cap fitxer de certificat. Executa 'aeat config
          auth configure --provider certificate --file Camí' per indicar-lo.
        unavailable: L'estat del certificat no està disponible; consulta els registres
          de depuració per als detalls de diagnòstic.
      load:
        password_unset: No hi ha cap contrasenya de certificat configurada. Configura
          la contrasenya del certificat abans de continuar.
        path_unset: No hi ha cap fitxer de certificat configurat. Executa 'aeat config
          auth configure --provider certificate --file Camí' per indicar-lo.
    clave_movil:
      health:
        identity_unset: No s'ha configurat cap DNI/NIE per a Cl@ve Mòbil. Configura'n
          un abans de continuar.
        operator_completion_required: Preparat; has de completar tu el pas de Cl@ve.
    errors:
      session_field_not_datetime: El camp {field} de la sessió persistent ha de ser
        una data-hora o cadena ISO-8601.
    operator:
      alignment:
        both_missing_detail: No estan configurades ni la identitat Cl@ve (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          ni l'identificador fiscal del perfil actiu. Configura tots dos amb el mateix
          DNI/NIE abans de l'autenticació AEAT en directe.
        clave_identity_missing_detail: La identitat Cl@ve (CADRUMO_CLAVE_MOVIL_DNI_NIE)
          no està configurada, de manera que no es pot comparar amb l'identificador
          fiscal del perfil actiu. Configura-la amb el DNI/NIE del perfil actiu.
        mismatch_detail: El DNI/NIE de la identitat Cl@ve '%{clave_identity}' no coincideix
          amb l'identificador fiscal del perfil actiu '%{profile_tax_id}'. L'autenticació
          AEAT en directe vincularia la sessió d'un contribuent a un altre perfil.
          Canvia al perfil l'identificador fiscal del qual coincideixi amb el DNI/NIE
          de Cl@ve, o corregeix el valor que sigui erroni.
        profile_tax_id_missing_detail: El perfil actiu no té identificador fiscal,
          de manera que no es pot comparar amb la identitat Cl@ve. Configura l'identificador
          fiscal del perfil amb el DNI/NIE utilitzat per a Cl@ve.
      errors:
        certificate_file_required: El proveïdor de certificat requereix un fitxer
          de certificat. Executa `aeat config auth configure --provider certificate
          --file RUTA` amb la ruta al teu paquet PKCS#12 (.p12/.pfx).
        certificate_file_unresolved: La ruta del certificat '%{certificate_path}'
          no resol a un fitxer existent. Executa `aeat config auth configure --provider
          certificate --file RUTA` amb una ruta al teu paquet PKCS#12 (.p12/.pfx).
        certificate_secret_mutation_in_progress: Encara s'està recuperant un canvi
          del secret de certificat per a aquest perfil. Torna a provar la mateixa
          ordre de secret abans de canviar la configuració d'autenticació.
        certificate_source_not_found: L'origen de certificat '%{name}' no està registrat.
          Executa `aeat config auth certificate list` per veure els orígens registrats,
          o `aeat config auth certificate register --name %{name} --file RUTA` per
          registrar-lo.
        cleanup_in_progress: Encara s'està recuperant un tancament o reinici d'autenticació
          per a aquest perfil. Reprèn aquesta operació abans de canviar la configuració
          d'autenticació.
        dangling_active_profile: El punter de perfil actiu '%{active_profile}' no
          resol a un bucket de perfil registrat. Executa aeat config profile list
          per inspeccionar els perfils registrats i després aeat config login NAME
          o aeat config profile create NAME.
        no_active_bucket: No hi ha cap perfil actiu; executa `aeat config profile
          create NAME` abans de configurar l'autenticació.
        provider_not_configured: No hi ha cap proveïdor d'autenticació configurat;
          indica --provider o configura-ne un primer.
        requires_custody_session: L'operació d'autenticació apunta al perfil '%{bucket_id}'
          a %{storage_root}, però aquest perfil no té cap sessió de custòdia oberta.
          Executa aeat config login per a aquest perfil i torna-ho a provar.
        revoke_requires_custody_session: La sessió de l'AEAT del perfil '%{bucket_id}'
          NO s'ha revocat i continua activa. Està desada xifrada dins d'aquest perfil,
          de manera que només desbloquejar aquest perfil, amb aeat config login, la
          revoca.
        scope_conflict: Tria --provider o --all, però no tots dos.
        unreadable_active_profile: 'El perfil actiu ''%{active_profile}'' té un manifest
          de bucket però cap registre de perfil llegible (status=%{status}). Següent
          acció: %{next_action}.'
      login:
        refused_certificate_file_missing: 'No es pot iniciar la sessió: el fitxer
          de certificat configurat (%{path}) no existeix. Recupera el fitxer o torna
          a configurar el camí abans de continuar.'
        refused_certificate_path_unset: 'No es pot iniciar la sessió: encara no s''ha
          seleccionat cap fitxer de certificat. Executa ''aeat config auth configure
          --provider certificate --file Camí'' abans de continuar.'
        refused_clave_movil_identity_unset: 'No es pot iniciar la sessió amb Cl@ve
          Mòbil: encara no s''ha configurat cap DNI/NIE. Configura''n un abans de
          continuar.'
        refused_live_tests_disabled: 'L''inici de sessió en directe està desactivat
          per seguretat: l''eina només construeix i comprova localment. Activa les
          proves en directe si realment vols connectar amb l''AEAT i torna a executar
          aquesta ordre. Proveïdor sol·licitat: %{provider}.'
      probe:
        certificate_corrupt: El fitxer de certificat no és un PKCS#12 vàlid o falta
          la contrasenya; no es pot analitzar.
        certificate_corrupt_detail: 'El certificat no es pot interpretar: %{error}.'
        certificate_expired: El certificat ha caducat fa %{days} dies. Renova'l abans
          d'autenticar.
        certificate_expiring: El certificat caduca d'aquí a %{days} dies. Programa'n
          la renovació.
        certificate_file_missing: El fitxer de certificat configurat (%{path}) no
          existeix.
        certificate_ok: Certificat vàlid; caduca d'aquí a %{days} dies.
        certificate_path_unset: No s'ha seleccionat cap fitxer de certificat.
        certificate_unreadable: El fitxer de certificat no es pot llegir (%{error}).
        clave_movil_identity_invalid: 'El DNI/NIE configurat per a Cl@ve Mòbil no
          és vàlid: %{error}.'
        clave_movil_identity_ok: El DNI/NIE configurat per a Cl@ve Mòbil té una forma
          vàlida.
        clave_movil_identity_unset: No s'ha configurat cap DNI/NIE per a Cl@ve Mòbil.
        no_provider: No hi ha cap proveïdor d'autenticació configurat; res a comprovar
          localment.
        no_session: No hi ha cap testimoni de sessió AEAT persistit al disc; executa
          `aeat config auth login` per obtenir-ne un.
        session_expired: Hi ha un testimoni de sessió AEAT persistit al disc però
          ha superat el seu límit d'inactivitat; executa `aeat config auth login --fresh`
          per renovar-lo.
        session_live: Hi ha un testimoni de sessió AEAT persistit al disc i dins del
          seu límit d'inactivitat.
    provider_impact:
      certificate_ready: L'accés amb certificat està a punt. Mantens el mateix flux
        d'ordres per a les lectures de l'AEAT; tots els proveïdors fan servir les
        mateixes ordres.
      generic_ready: '%{label} està a punt. Mantens el mateix flux d''ordres mentre
        aquest proveïdor fa servir el protocol d''accés compartit.'
      unavailable: '%{label} està configurat però encara no està a punt. Encara pots
        preparar, comprovar i exportar declaracions localment, però les lectures de
        l''AEAT continuaran sense estar disponibles fins que se solucioni l''accés.'
      unconfigured: Encara pots preparar, comprovar i exportar declaracions localment,
        però les lectures de l'AEAT continuaran sense estar disponibles fins que configuris
        un proveïdor d'accés.
    sessions:
      errors:
        clave_contraste_missing: La ruta Cl@ve Móvil sense QR necessita el contrast
          imprès al teu document. Registra %{nie_field} al perfil actiu si és un NIE,
          o %{dni_field} si és un DNI, abans d'utilitzar cap sessió amb l'AEAT.
        clave_identity_malformed: La identitat de Cl@ve no és un NIF, NIE o CIF vàlid,
          per la qual cosa no es pot confirmar que pertanyi a aquest perfil.
        clave_identity_missing: L'autenticació en directe amb Cl@ve exigeix un DNI/NIE.
          Registra'l al perfil actiu com a %{identity_field}, o configura'l per al
          proveïdor amb `aeat config auth configure`, abans d'utilitzar cap sessió
          amb l'AEAT.
        clave_identity_profile_mismatch: La identitat de Cl@ve Móvil no coincideix
          amb la identitat fiscal del perfil actiu; canvia al perfil que coincideixi
          o actualitza el perfil abans de l'autenticació AEAT en directe.
        clave_route_missing: L'autenticació en directe amb Cl@ve Mòbil requereix %{route_field}.
          Obre Identificació al gestor del perfil, tria Codi QR o Sol·licitud a l'aplicació,
          desa-ho i torna a provar la sincronització.
        corrupt_session: La sessió d'autenticació desada està malmesa i no es pot
          llegir. Executa `aeat config auth logout` i després `aeat config auth test`.
        no_session: No hi ha sessió AEAT activa; executa `aeat config auth test` abans
          de llegir dades AEAT.
        profile_identity_cleared: L'autenticació en directe amb l'AEAT necessita l'ID
          fiscal del perfil actiu, i aquest perfil no en té. Restaura %{requirements}
          al perfil i torna a autenticar-te.
        profile_identity_malformed: La identitat fiscal d'aquest perfil no és un NIF,
          NIE o CIF vàlid, per la qual cosa no es pot confirmar que la sessió Cl@ve
          li pertanyi.
        profile_tax_id_missing: L'autenticació en directe amb Cl@ve Móvil exigeix
          que el perfil actiu inclogui %{requirements}.
        provider_close_failed: No s'ha pogut tancar de manera segura la sessió del
          navegador AEAT; repeteix l'autenticació abans de llegir dades AEAT.
        session_identity_profile_mismatch: La identitat de la sessió AEAT no coincideix
          amb la identitat fiscal del perfil actiu; esborra les sessions d'autenticació
          i autentica el perfil que coincideixi abans de les lectures AEAT en directe.
  calculations:
    bienes_inversion_regularizacion:
      register_advisory: '%{count} bé(ns) d''inversió en període de regularització
        (LIVA arts. 107-110) per a %{year}: %{computed} computat(s), %{pending} pendent(s)
        de prorrata definitiva. Regularització proposada per a la casella %{casilla}:
        %{value}. Confirma el valor abans de presentar.'
      transmision_advisory: '%{count} bé(ns) d''inversió transmès(os) el %{year} requereixen
        la regularització única d''entregues (LIVA art. 110). Regularització proposada
        per a la casella %{casilla}: %{value}. Confirma el valor abans de presentar.'
    binding_prefill:
      errors:
        observation_merge_key_conflict: 'No es poden fusionar observacions amb clau
          de model, exercici o període diferent: {primary_modelo} {primary_filing_year}
          {primary_period} davant de {overlay_modelo} {overlay_filing_year} {overlay_period}.'
    iva_compensation:
      errors:
        annual_partition_casilla_ids_noncanonical: Les observacions de compensació
          del Model 303 han d'usar els identificadors de casella declarats per la
          revisió {revision_id}; {casilla_ids} no estan declarats.
        correction_missing: No existeix cap registre de compensació sembrat per a
          %{filing_year}/%{period}; la correcció sobreescriu una sembra existent,
          no la crea.
        history_casilla_undeclared: La casella {casilla_id} no està declarada al model
          {modelo} versió {revision_id}, de manera que no s'hi pot adjuntar cap referència
          legal. Corregeix la referència de la casella.
        history_operand_ref_value_arity: La casella {casilla_id} aporta {operand_ref_count}
          referències d'operand i {operand_value_count} valors d'operand, de manera
          que la traçabilitat de la seva fórmula quedaria incompleta.
        history_operand_refs_diverge_from_formula: La casella {casilla_id} aporta
          les referències d'operand {supplied_operand_refs}, però la fórmula {formula_id}
          projecta {formula_operand_refs}.
        history_operand_refs_without_formula: La casella {casilla_id} aporta referències
          d'operand, però el model {modelo} revisió {revision_id} no declara cap fórmula
          per a ella.
        local_recurrence_modelo_303_only: La recurrència local de compensació d'IVA
          només es reconstrueix per al Model 303; s'ha indicat el model {modelo}.
        modelo_303_only: L'historial de compensació d'IVA només accepta observacions
          del Model 303.
        persistence: L'emmagatzematge de l'historial de compensació d'IVA ha fallat
          durant %{operation} (%{cause_type}).
        repository_backend_split: El magatzem d'observacions del Model 303 i el de
          l'historial de compensació d'IVA han de compartir un únic backend xifrat
          perquè totes dues escriptures es confirmin alhora.
        seed_conflict: Ja existeix un estat de compensació d'IVA per a aquest període;
          la llavor sobreescriuria l'historial emmagatzemat.
    iva_wallet:
      errors:
        decision_blocks_calculation: La decisió de la cartera d'IVA per a {target_year}
          {target_period} està bloquejada per la divergència {divergence}. Resol la
          divergència abans de calcular.
        decision_no_selected_amount: La decisió de la cartera d'IVA per a {target_year}
          {target_period} no conté cap import seleccionat, de manera que no es pot
          vincular cap valor de compensació.
        decision_repository_backend_split: El magatzem de decisions de la cartera
          d'IVA i el d'observacions de càlcul han de compartir un únic backend xifrat
          quan la decisió es persisteix.
        decision_target_mismatch: La decisió emmagatzemada de la cartera d'IVA apunta
          a {decision_target_year} {decision_target_period}, però la declaració és
          {context_filing_year} {context_period}.
        modelo_303_only: La conciliació de la cartera de compensació d'IVA només s'aplica
          al Model 303; s'ha indicat el model {modelo}.
    m303_carry:
      errors:
        available_compensation_amount_missing: El sobre d'arrossegament validat del
          Model 303 no porta cap import de compensació disponible a la casella {casilla_id}.
        available_compensation_formula_missing: La revisió {revision_id} no declara
          cap fórmula per a la casella {target_casilla_id}, de manera que la compensació
          disponible amb base en la generada no en pot citar cap.
        carry_operands_disagree_with_formula: Els operands d'arrossegament {derivation_operands}
          no coincideixen amb els operands de la fórmula de la definició del model
          {registry_operands}. Només una correcció de les definicions dels models
          pot resoldre-ho; no hi ha recuperació automàtica segura.
        casilla_id_invalid: Les definicions dels models declaren una casella no vàlida
          per a la clau de correspondència {mapping_key} del traspàs del Model 303.
        disposition_code_not_admitted: El codi de destinació del resultat {code} no
          és admès per al traspàs del Model 303.
        disposition_code_undeclared: Les definicions dels models no declaren cap codi
          per a la destinació del resultat {disposition}.
        disposition_result_sign_incompatible: La disposició declarada {disposition}
          no s'hauria pogut seleccionar per a un resultat registrat de {resultado}.
          Només el contribuent pot decidir quina és correcta; no hi ha recuperació
          automàtica segura.
        duplicate_header_facts: L'evidència d'arrossegament del Model 303 porta {header_count}
          capçaleres d'origen {header_key}; se'n requereix exactament una.
        envelope_not_normalized: L'historial d'arrossegament del Model 303 requereix
          un parell disponible i generada ja normalitzat i conscient de la disposició.
          Torna a importar les dades de la presentació registrada.
        formula_mapping_required: La revisió {revision_id} no declara la correspondència
          de traspàs del Model 303 necessària per citar la fórmula de la compensació
          disponible.
        generated_compensation_amount_missing: El sobre d'arrossegament validat del
          Model 303 no porta cap import de compensació generada a la casella {casilla_id}.
        header_code_invalid: La capçalera d'origen de tipus de declaració a {source_locator}
          porta {value}, que no és un codi de disposició de resultat.
        header_code_not_admitted: La capçalera d'origen de tipus de declaració a {source_locator}
          porta {value}, un codi que el disseny de registres del Model 303 no admet.
        incomplete_supported_operands: 'La normalització de l''arrossegament del Model
          303 no pot derivar la compensació disponible a partir de les caselles presents:
          {casilla_ids}.'
        invalid_registry_observation: L'entrada d'arrossegament del Model 303 requereix
          una observació llegida de les definicions del model; ha rebut {observed_type}.
        local_disposition_header_disagreement: La disposició de resultat registrada
          com a presentada {typed_disposition} no coincideix amb la capçalera de tipus
          de declaració {header_disposition}. Només el contribuent pot decidir quina
          es va presentar; no hi ha recuperació automàtica segura.
        local_filing_disposition_required: L'evidència d'arrossegament d'una presentació
          local del Model 303 ha de portar la disposició de resultat determinada en
          el moment de la presentació; l'evidència {source_kind} no en porta cap.
        local_filing_provenance_required: La disposició d'un Model 303 registrat com
          a presentat ha de conservar el seu origen app_filing; porta {provenance_kind}.
        non_target_modelo_envelope: L'historial d'arrossegament del Model 303 només
          admet observacions del Model 303; s'ha indicat el model {modelo}.
        official_disposition_header_disagreement: La disposició de resultat tipada
          {typed_disposition} no coincideix amb la capçalera de tipus de declaració
          de l'AEAT {header_disposition}. Només el contribuent pot decidir quina es
          va presentar; no hi ha recuperació automàtica segura.
        official_header_required: L'evidència oficial d'arrossegament del Model 303
          ha de portar exactament una capçalera d'origen {header_key}; l'evidència
          {source_kind} no en porta cap.
        registry_resolution_unavailable: Les definicions dels models no han pogut
          resoldre la correspondència de traspàs del Model {modelo} per a l'exercici
          {filing_year}, període {period}.
        registry_scope_invalid: El traspàs del Model 303 necessita un model i un període;
          s'ha rebut el model {modelo}, exercici {filing_year}, període {period}.
        result_casilla_required: La normalització de l'arrossegament del Model 303
          requereix la casella de resultat registrada {casilla_id}, que l'observació
          no porta.
        supplied_available_contradicts_derivation: La compensació disponible aportada
          {supplied_available} contradiu la derivació {basis} {derived_available}.
          Només el contribuent pot decidir quin import es va presentar; no hi ha recuperació
          automàtica segura.
        supplied_disposition_not_admitted: La destinació del resultat indicada, {disposition},
          no és admesa per al traspàs del Model 303.
        supplied_pair_contradicts_derivation: El parell disponible i generada aportat
          {supplied_available} i {supplied_generated} contradiu la derivació {basis}
          {derived_generated}. Només el contribuent pot decidir quins imports es van
          presentar; no hi ha recuperació automàtica segura.
        unsupported_provenance: La normalització de l'arrossegament del Model 303
          només admet evidència oficial de l'AEAT o una presentació local de l'aplicació;
          l'evidència porta {source_kind}.
    maritime_exemption:
      errors:
        art_7p_inputs_required: S'aplica l'exempció de l'art. 7.p), de manera que
          calen tant el salari anual com els dies amb dret. Aporta els imports que
          falten.
        rebeca_input_required: S'aplica l'elegibilitat REBECA, de manera que cal el
          rendiment brut de navegació. Aporta l'import que falta.
    observations:
      errors:
        casilla_ids_noncanonical: Les observacions de càlcul han d'usar els identificadors
          de casella declarats pel model {modelo} revisió {revision_id}; {casilla_ids}
          no estan declarats.
        decision_taxpayer_nif_blank: El NIF del contribuent a la decisió de conciliació
          no pot estar en blanc.
        filing_year_out_of_range: L'exercici de presentació {filing_year} de l'observació
          és fora del rang admès {minimum} a {maximum}.
        iva_wallet_target_year_out_of_range: L'exercici objectiu {target_year} de
          la cartera d'IVA és fora del rang admès {minimum} a {maximum}.
        member_nif_blank: El NIF del membre del grup no pot estar en blanc quan amplia
          la clau d'observació.
        period_type_invalid: La clau d'observació requereix un valor de període; ha
          rebut {observed_type}.
        registry_snapshot_missing: No es poden validar els identificadors de casella
          perquè no es resol cap versió de les definicions del model {modelo}, exercici
          {filing_year}, període {period}.
        taxpayer_nif_blank: El NIF del contribuent no pot estar en blanc quan forma
          la clau de decisió de la cartera d'IVA.
    prorrata_regularizacion:
      advisory: 'Regularització de prorrata per percentatge definitiu (LIVA arts.
        104-105) per a %{year}: prorrata provisional %{provisional}% → definitiva
        %{definitiva}% (%{sentido}). Regularització proposada per a %{target}: %{value}.
        Confirma el valor abans de presentar.'
      sentido_deduccion: deducció complementària
      sentido_ingreso: ingrés
      target_casilla: casella %{number}
      target_declared: la casella de regularització declarada
    row_set:
      errors:
        grouping_dispatch_fell_through: 'L''agrupació de conjunt de files {grouping}
          s''ha resolt a un assemblador que no s''ha executat. Comuniqueu-ho: la taula
          de despatx és inconsistent.'
        grouping_has_no_assembler: L'agrupació de conjunt de files {grouping} no té
          assemblador en aquesta aplicació; les agrupacions sense un són {unassemblable_groupings}.
        percepcion_clave_missing: La fila {row_index} no declara cap clave. Una percepción
          ha d'indicar la seva clave de l'AEAT, segons el disseny de registres dels
          Models 190 i 193, registre de tipus 2. Aporta la clave.
        percepcion_clave_unsupported: La fila {row_index} declara la clave de l'AEAT
          {clave}, que aquesta aplicació no admet.
        row_assembly_failed: 'No s''ha pogut assemblar la fila {row_index}: {validation_error_detail}.
          Corregeix la fila i torna a fer el pull.'
        row_index_not_positive: L'índex de fila de la cel·la del conjunt de files
          ha de ser un nombre enter positiu; conté {row_index}.
  filing:
    build_draft:
      errors:
        binding_data_type_unsupported: L'origen del valor d'aquesta casella declara
          un tipus de dada que cap entrada admet.
