modelo:
  schema:
    '188':
      casilla:
        continuidad:
          capitalizacion-seguros-declarante-complementaria:
            label: 'Complementària: C per afegir percepcions omeses'
          capitalizacion-seguros-declarante-contacto:
            label: Cognoms i nom de la persona de contacte
          capitalizacion-seguros-declarante-ejercicio:
            label: Exercici
          capitalizacion-seguros-declarante-justificante-anterior:
            label: Justificant anterior (només si és substitutiva)
          capitalizacion-seguros-declarante-nif:
            label: NIF del declarant
          capitalizacion-seguros-declarante-nombre:
            label: Cognoms i nom o raó social
          capitalizacion-seguros-declarante-numero-justificante:
            label: Número de justificant (13 dígits; comença per 188)
          capitalizacion-seguros-declarante-sustitutiva:
            label: 'Substitutiva: S per substituir una declaració anterior'
          capitalizacion-seguros-declarante-telefono:
            label: Telèfon de contacte
          capitalizacion-seguros-perceptor-base-retenciones:
            help: En IRPF, rendiment menys les reduccions aplicables. En IS i IRNR
              amb establiment permanent, el mateix import i signe del rendiment. Valor
              declarat; encara no es calcula automàticament.
            label: Base de retencions i ingressos a compte
          capitalizacion-seguros-perceptor-clave:
            label: 'Clau B: disposició anticipada d''un PIAS'
          capitalizacion-seguros-perceptor-ejercicio-devengo:
            help: Només per a quantitats meritades en exercicis anteriors. Cada exercici
              de meritació es declara en un registre diferent.
            label: Exercici de meritació anterior
          capitalizacion-seguros-perceptor-informacion-adicional:
            help: Renda exempta comunicada en constituir la renda vitalícia d'un PIAS,
              declarada en disposar anticipadament, totalment o parcialment, dels
              seus drets econòmics.
            label: Renda exempta comunicada per disposició anticipada d'un PIAS
          capitalizacion-seguros-perceptor-modalidad:
            label: 'Modalitat: 1 dinerària; 2 en espècie'
          capitalizacion-seguros-perceptor-nombre:
            label: Cognoms i nom o raó social del perceptor
          capitalizacion-seguros-perceptor-porcentaje-retencion:
            help: 'Percentatge expressat en punts percentuals: 19 significa 19 %.
              Si es van aplicar diversos tipus durant l''exercici, només es declara
              l''últim.'
            label: Percentatge de retenció (%)
          capitalizacion-seguros-perceptor-prima:
            label: Prima aportada al contracte
          capitalizacion-seguros-perceptor-provincia:
            label: Codi de província
          capitalizacion-seguros-perceptor-reducciones:
            help: Només per a IRPF. Es declara zero si el rendiment és negatiu; no
              s'aplica a IS ni a IRNR amb establiment permanent.
            label: Reduccions de la disposició transitòria quarta
          capitalizacion-seguros-perceptor-rendimiento-acreedor-hipotecario:
            label: Rendiment d'assegurança amb el creditor hipotecari com a beneficiari
          capitalizacion-seguros-perceptor-renta-vitalicia-clave:
            label: 'Operació: A constitució; B disposició anticipada'
          capitalizacion-seguros-perceptor-renta-vitalicia-fecha:
            help: Si durant l'exercici hi va haver constitució i disposició anticipada,
              cada operació s'informa en un registre diferent.
            label: Data de constitució o de disposició anticipada
          capitalizacion-seguros-perceptor-renta-vitalicia-identificacion:
            label: Identificació de la renda vitalícia assegurada
          capitalizacion-seguros-perceptor-rentas:
            help: Import en euros amb el seu signe. Els rendiments amb signes diferents
              es declaren en registres separats.
            label: Rendes o rendiments del capital mobiliari
          capitalizacion-seguros-perceptor-representante-nif:
            label: NIF del representant legal
          capitalizacion-seguros-perceptor-retenciones:
            help: Import declarat. Ha de ser zero quan la base sigui negativa. La
              verificació entre camps i el càlcul automàtic encara estan pendents.
            label: Retencions i ingressos a compte
          capitalizacion-seguros-resumen-base-negativa:
            help: Suma de les bases de retenció i ingrés a compte dels registres de
              perceptor amb base negativa.
            label: Base de retencions i ingressos a compte negativa
          capitalizacion-seguros-resumen-base-positiva:
            help: Suma de les bases de retenció i ingrés a compte dels registres de
              perceptor amb base positiva.
            label: Base de retencions i ingressos a compte
          capitalizacion-seguros-resumen-perceptores-base-negativa:
            help: Nombre de registres amb una base de retencions i ingressos a compte
              negativa o zero. Un perceptor que figuri en diversos registres es compta
              una vegada per cada registre.
            label: Nombre total de perceptors amb base negativa o zero
          capitalizacion-seguros-resumen-perceptores-base-positiva:
            help: Nombre de perceptors (registres) amb una base de retencions i ingressos
              a compte positiva.
            label: Nombre total de perceptors amb base positiva
          capitalizacion-seguros-resumen-retenciones:
            help: Suma de les retencions i ingressos a compte practicats sobre les
              rendes declarades.
            label: Retencions i ingressos a compte
      field:
        official_name: Modelo 188. Retencions i ingressos a compte. Rendes del capital
          mobiliari d'operacions de capitalització i contractes d'assegurança de vida
          o invalidesa. Resum anual.
        title: Retencions de capitalització i assegurances de vida - resum anual
      form:
        section:
          declaracion:
            heading: Dades de la declaració
          declarante:
            heading: Identificació i contacte
