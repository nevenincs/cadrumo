                per a l'assignació exacta.
            modulos-indice-inicio-actividad:
              help: null
              label: 'Índex corrector per inici de noves activitats (lletra b.4, activitat
                iniciada des de l''1-1-2023 en local exclusiu). Índex declarat per
                l''operador (0,80/0,90; 0,60/0,70 amb discapacitat ≥33%, Ordre HFP/1359/2023
                Annex II, instrucció 2.3.b.4); el motor no modela l''exercici d''inici
                ni la discapacitat. Incompatible amb l''índex de temporada (b.2):
                si tots dos es declaren, preval la temporada.'
            modulos-indice-pequena-dimension:
              help: null
              label: Índex corrector per a empreses de petita dimensió (lletra b.1
                - municipi, local únic, sense personal o fins a 2 treballadors). Índex
                declarat per l'operador (0,70/0,75/0,80/0,90, Ordre HFP/1359/2023
                Annex II, instrucció 2.3.b.1); el motor no modela fets del contribuent.
                Mai s'aplica a les activitats amb índex especial (721.2, 722).
            modulos-indice-temporada:
              help: null
              label: 'Índex corrector de temporada (lletra b.2 - activitat de temporada,
                fins a 180 dies/any). Índex declarat per l''operador (1,50/1,35/1,25
                segons durada, Ordre HFP/1359/2023 Annex II, instrucció 2.3.b.2);
                el motor no modela la durada com a fet del contribuent. Incompatible
                amb l''índex d''inici de noves activitats (b.4): si tots dos es declaren,
                preval aquest.'
            modulos-minoracion-inversion:
              help: null
              label: Minoració per incentius a l'inversió (amortització de l'immobilitzat
                material o intangible afecte, segons el seu llibre registre de béns
                d'inversió). Import declarat per l'operador; el motor no modela un
                registre de béns per element - consulteu l'Ordre HFP/1359/2023 Annex
                II, instrucció 2.2.b) i la vostra pròpia taula d'amortització.
            modulos-pequena-dimension-ignorado-flag:
              help: null
              label: 'Indicador intern (1/0): l''índex corrector per a empreses de
                petita dimensió (b.1) declarat va ser ignorat per incompatibilitat
                amb l''índex corrector especial de l''activitat (Ordre HFP/1359/2023
                Annex II, instrucció 2.3.a/b.1).'
            modulos-rendimiento-neto-actividad:
              help: null
              label: 'Rendiment net de l''activitat (Fase 4a: mòduls − reducció general
                5 per 100)'
            modulos-rendimiento-neto-minorado:
              help: null
              label: 'Rendiment net minorat (Fase 2a: previ − minoració per incentius
                a l''ocupació − minoració per incentius a l''inversió)'
            modulos-rendimiento-neto-modulos:
              help: null
              label: 'Rendiment net de mòduls (Fase 3a: minorat ajustat pels índexs
                correctors generals - petita dimensió, temporada/inici de noves activitats,
                excés - en l''ordre i amb les incompatibilitats de l''Ordre HFP/1359/2023
                Annex II, instrucció 2.3)'
            modulos-rendimiento-neto-previo:
              help: null
              label: 'Rendiment net previ (Fase 1a: Σ unitats mòdul × rendiment anual
                per unitat)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              help: null
              label: 'Indicador intern (1/0): es van declarar simultàniament l''índex
                corrector de temporada (b.2) i l''índex corrector per inici de noves
                activitats (b.4), incompatibles entre si (Ordre HFP/1359/2023 Annex
                II, instrucció 2.3).'
            saldo-negativo-fin-periodo:
              help: null
              label: Saldo negatiu trasladable a períodes posteriors (màx. 0, -casella
                10)
