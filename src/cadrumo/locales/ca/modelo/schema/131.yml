      revision:
        2019-2023:
          casilla:
            modulos-indice-inicio-actividad:
              label: 'Índex corrector per inici de noves activitats (lletra b.4, activitat
                iniciada des de l''1-1-2021 per a l''exercici 2022 o des de l''1-1-2022
                per a l''exercici 2023, en local exclusiu). Índex declarat per l''operador
                (0,80/0,90; 0,60/0,70 amb discapacitat ≥33%, Annex II, instrucció
                2.3.b.4 de l''Ordre HFP/1335/2021 per a 2022 i de l''Ordre HFP/1172/2022
                per a 2023); el motor no modela l''exercici d''inici ni la discapacitat.
                Incompatible amb l''índex de temporada (b.2): si tots dos es declaren,
                preval la temporada.'
            modulos-indice-pequena-dimension:
              label: Índex corrector per a empreses de petita dimensió (lletra b.1
                - municipi, local únic, sense personal o fins a 2 treballadors). Índex
                declarat per l'operador (0,70/0,75/0,80/0,90, Annex II, instrucció
                2.3.b.1 de l'Ordre HFP/1335/2021 per a 2022 i de l'Ordre HFP/1172/2022
                per a 2023); el motor no modela fets del contribuent. Mai s'aplica
                a les activitats amb índex especial (721.2, 722).
            modulos-indice-temporada:
              label: 'Índex corrector de temporada (lletra b.2 - activitat de temporada,
                fins a 180 dies/any). Índex declarat per l''operador (1,50/1,35/1,25
                segons durada, Annex II, instrucció 2.3.b.2 de l''Ordre HFP/1335/2021
                per a 2022 i de l''Ordre HFP/1172/2022 per a 2023); el motor no modela
                la durada com a fet del contribuent. Incompatible amb l''índex d''inici
                de noves activitats (b.4): si tots dos es declaren, preval aquest.'
            modulos-minoracion-inversion:
              label: Minoració per incentius a l'inversió (amortització de l'immobilitzat
                material o intangible afecte, segons el seu llibre registre de béns
                d'inversió). Import declarat per l'operador; el motor no modela un
                registre de béns per element - consulteu l'Annex II, instrucció 2.2.b)
                de l'Ordre HFP/1335/2021 per a 2022 o de l'Ordre HFP/1172/2022 per
                a 2023, i la vostra pròpia taula d'amortització.
            modulos-pequena-dimension-ignorado-flag:
              label: 'Indicador intern (1/0): l''índex corrector per a empreses de
                petita dimensió (b.1) declarat va ser ignorat per incompatibilitat
                amb l''índex corrector especial de l''activitat (Annex II, instrucció
                2.3.a/b.1 de l''Ordre HFP/1335/2021 per a 2022 i de l''Ordre HFP/1172/2022
                per a 2023).'
            modulos-rendimiento-neto-modulos:
              label: 'Rendiment net de mòduls (Fase 3a: minorat ajustat pels índexs
                correctors generals - petita dimensió, temporada/inici de noves activitats,
                excés - en l''ordre i amb les incompatibilitats de l''Annex II, instrucció
                2.3 de l''Ordre HFP/1335/2021 per a 2022 i de l''Ordre HFP/1172/2022
                per a 2023)'
            modulos-temporada-inicio-actividad-conflicto-flag:
              label: 'Indicador intern (1/0): es van declarar simultàniament l''índex
                corrector de temporada (b.2) i l''índex corrector per inici de noves
                activitats (b.4), incompatibles entre si (Annex II, instrucció 2.3
                de l''Ordre HFP/1335/2021 per a 2022 i de l''Ordre HFP/1172/2022 per
                a 2023).'
          construct:
            modelo-131-objective-estimation-instalment:
              field:
                title: 'Model 131: pagament fraccionat en estimació objectiva (exercicis
                  2019 a 2023)'
          field:
            label: Exercicis 2019 a 2023
