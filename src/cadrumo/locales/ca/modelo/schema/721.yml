      field:
        official_name: Modelo 721. Declaració informativa sobre monedes virtuals situades
          a l'estranger.
        title: Monedes virtuals situades a l'estranger (informativa anual)
      revision:
        '2023':
          field:
            label: Model 721, exercici 2023 (Ordre HFP/886/2023)
        '2024':
          field:
            label: Model 721, exercici 2024 (annex substituït per l'Ordre HAC/1504/2024)
