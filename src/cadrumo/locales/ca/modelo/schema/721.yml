              euros
          moneda-virtual-saldo-inicio:
            label: Saldo o valor de la moneda virtual a l'inici del període (per a
              variacions significatives)
          tipo-declaracion:
            label: Tipus de declaració (originària / complementària / substitutiva)
      construct:
        modelo-721-informative:
          field:
            title: 'Model 721: declaració informativa de monedes virtuals a l''estranger
