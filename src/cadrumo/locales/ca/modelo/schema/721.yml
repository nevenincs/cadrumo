      casilla:
        continuidad:
          custodio-nombre:
            label: Nom o raó social del custodi de la moneda virtual a l'estranger
          custodio-pais:
            label: Codi de país del custodi (ISO 3166-1 alfa-2)
          filing-year:
            label: Exercici a què es refereix la declaració de monedes virtuals a
