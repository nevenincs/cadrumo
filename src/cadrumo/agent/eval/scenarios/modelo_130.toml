# workflow and the provenance the result must carry. The runner asserts the
# trajectory resolves against the live CLI surface, follows the modelo lifecycle
# order, is consistent with the shipped `cadrumo-preparar-modelo-130` skill, and that the
# resolved revision's casillas carry their registry legal grounding, and the
