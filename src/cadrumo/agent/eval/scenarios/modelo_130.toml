# AEAT-corpus sourcing and is a tracked follow-up.
# `expected_computed_casillas` are casilla IDS (not values) drawn
# from the registry's AEAT-grounded `computed_casilla_ids`, so this is a grounded
# contract cross-check, not a tautological calculation test.

