[aeat.notifications_query]
# AEAT's notifications search defaults to a ONE-MONTH window (fecha desde =
# today minus one month). That default is the reason the reader reported a
# near-empty inbox against an account with older notifications: the surface was
# answering the question it was asked, over a month.
#
# The lookback is expressed in years and applied backwards from today. Four
# years is the LGT art-66 prescription period, so this deliberately reaches
# further: a notification older than prescription is still part of the record an
# operator needs to see, and the surface costs nothing to widen.
lookback_years = 10
# AEAT prints and accepts these filter dates as DD-MM-YYYY, not ISO.
date_format = "%d-%m-%Y"
# Empty selects the "Todos" option on both filters, so neither the
# notificada/no-notificada axis nor the read/unread axis narrows the result.
tipo_consulta_all = ""
leida_all = ""
# The detail page's "Ver notificación" action, which returns the notification
# PDF. For a notification ALREADY read this redisplays it and changes nothing.
# For an unread one the same action is the comparecencia -- the moment the
# notification is legally served -- and AEAT requires the taxpayer's signature
# for it. This application never drives that: the reader admits the action only
# for a row AEAT already reports as read. See the fail-closed predicate in the
# notifications adapter.
detail_view_action = "vernotif"

