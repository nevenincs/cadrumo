topic:
  authentication:
    body: 'Az AEAT hitelesítés Cl@ve Móvilt (push a regisztrált mobilra) vagy digitális
      tanúsítványt (FNMT / megfelelő) használ. Állíts be szolgáltatót az ''aeat config
      auth configure --provider certificate'' paranccsal és ellenőrizd: ''aeat config
      auth test''.'
    title: AEAT hitelesítés
  calendar:
    body: A naptár megjeleníti a benyújtási kötelezettségeket (modellek és időszakok)
      egy tartományon belül. Igényli, hogy a profil deklarálja az ÁFA rezsimet, hogy
      a motor ne alapértelmezett értékeket feltételezzen.
    title: Kötelezettségi naptár
  casilla:
    body: A casilla egy modell számozott mezője. A casillák lehetnek kézi, számított,
      vagy bindingekből származtatottak. 'aeat app modelo casillas <modelo>' listázza
      őket.
    title: Casillák
  formats:
    body: A CLI text, JSON, tábla vagy csv formátumban ad ki kimenetet a '--format'
      alapján. Automatizációhoz a JSON ajánlott; emberi vizsgálathoz a text.
    title: Kimeneti formátumok
  irpf-regime:
    body: Egy önfoglalkoztató IRPF rezsimje. Estimación directa (normál vagy egyszerűsített)
      vagy estimación objetiva (modulos). Meghatározza, mely pago fraccionado modellek
      alkalmazandók (130 vs 131).
    title: IRPF rezsim
  iva-regime:
    body: Az adózóra alkalmazandó ÁFA rezsim. General, simplificado, recargo de equivalencia,
      exento, REAGP vagy REBU. Meghatározza a negyedéves 303-as modellt és a 390-es
      éves összesítőt.
    title: ÁFA rezsim
  modelos:
    body: AEAT adóbevallási modellek katalógusa (303, 130, 100, 347, 349, 111, 115,
      184, stb.). Mindegyiknek saját naptára, casillái és alkalmazhatósági szabályai
      vannak. 'aeat app modelo list' felsorolja a rendelkezésre állókat.
    title: Adóbevallási modellek
  pago-fraccionado:
    body: Az önfoglalkoztató negyedévenkénti IRPF előleges befizetése. A 130-as modell
      az estimación directa-ra, a 131-es az estimación objetiva-ra vonatkozik. A számítás
      a negyedév adatait és néhány esetben az előző évet használja.
    title: IRPF előleges befizetés
  profile:
    body: 'A helyi profil tartalmazza az adóazonosítódat (NIF), fő tevékenységedet,
      ÁFA / IRPF rezsimedet és opcionális regisztrációkat (SII, Verifactu, intracomunitario).
      Szerkeszd: ''aeat config profile set <kulcs> <érték>''.'
    title: Adózói profil
  providers:
    body: Támogatott hitelesítési szolgáltatók; mindegyiknek eltérő követelményei
      vannak. 'aeat config auth --help' felsorolja őket a követelményekkel együtt.
    title: Hitelesítési szolgáltatók
  recargo-extemporaneo:
    body: Határidő utáni benyújtás az AEAT előzetes felszólítása nélkül havi 1%-os
      pótdíjat (legfeljebb 12%) gyűjt az első évben és 15%-ot plusz kamatot 12 hónap
      után. Jogi alap Ley 58/2003 art-27.
    title: Késedelmes benyújtás pótdíja
  regimens:
    body: Egy önfoglalkoztatóra alkalmazandó adózási rendszerek halmaza. A két fő
      tengely az ÁFA (general, simplificado, recargo de equivalencia, exento) és az
      IRPF (directa, objetiva).
    title: Adózási rendszerek
  sii-verifactu:
    body: Elektronikus számlatovábbítási rendszerek az AEAT-hoz. Az SII (Suministro
      Inmediato de Información) nagyvállalatokra kötelező; a Verifactu (RD 1007/2023)
      számlázási rendszerekre fokozatosan kötelező.
    title: SII és Verifactu
transactions:
