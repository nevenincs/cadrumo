        id_token_module_not_importable: A google-auth id_token modul nem importálható.
        id_token_verification_failed: A Google id_token ellenőrzése sikertelen.
        loopback_bind_failed: A helyi visszahurkos OAuth-vevő nem tudott portot foglalni.
        oauthlib_not_importable: A google-auth-oauthlib nem importálható; az OAuth-folyamat
          nem indítható el.
        scope_missing: A Google hozzájárulási képernyő visszatért anélkül, hogy minden
          szükséges hatókört megadott volna.
        unsecured_mode_refused: A Google OAuth megtagadta a hozzáférést, mert a titkos
          tár nem biztonságos módban fut, és az aktív profil valódi spanyol adóazonosítót
          tartalmaz.
      suggestions:
        close_loopback_port: Zárja be a szabad visszahurkos portot foglaló alkalmazást,
          és próbálja újra.
        open_consent_url_manually: Nyissa meg manuálisan a megjelenített hozzájárulási
          URL-t a böngészőjében.
        use_keyring_or_synthetic: Állítsa be az aeat_secret_store_backend=keyring
          értéket, vagy váltson az aktív profilt szintetikus teszt-adóazonosítóra.
    profile_binding:
      errors:
        no_active_profile: Nincs aktív AEAT-profil kötve a Google OAuth-hoz.
    refresh:
      errors:
        google_auth_not_importable: A google-auth könyvtár nem importálható; a Google
          OAuth-megújítás nem folytatható.
        reauth_required: A Google OAuth-hitelesítési adat újrahitelesítést igényel;
          az automatikus megújítási útvonal le van zárva.
        refresh_failed: A Google OAuth-megújítás sikertelen.
        refresh_refused: A Google OAuth elutasította a megújítási kérelmet; a megújítási
          token már nem érvényes.
        token_endpoint_unreachable: A Google OAuth-token-végpont nem érhető el.
      suggestions:
        check_network: Ellenőrizze a hálózati kapcsolatot a Google OAuth-végpontokhoz,
          majd próbálja újra.
      testing_project_cap_warning: 'A Google OAuth-megújítási token közeledik a 7
        napos tesztelési projekt korlátjához (kb. {hours_remaining} óra van hátra);
        futtassa újra: `aeat config google login` a hitelesítő adat élettartamának
        meghosszabbításához.'
  inbound:
    declaracion:
      errors:
        extraction_failed: 'A(z) {profile} profilhoz tartozó bevallás-kinyerés sikertelen:
          {details}'
        modelo_conflict: A --modelo {modelo!r} ütközik az észlelt {detected!r} értékkel.
        period_unresolved: A bevallási időszak nem volt meghatározható a PDF szövegéből.
        profile_count_invalid: 'Pontosan egy bevallás-PDF-kinyerési profil szükséges
