          nyomtatványa ütközik az észlelt {detected!r} értékkel.
        tax_id_unresolved: Az adóazonosító nem volt meghatározható a PDF szövegéből.
        template_not_detected: A(z) {path} sablona nem észlelhető automatikusan; a
          felülbíráláshoz adja meg a --modelo és --año értékeket.
        year_conflict: A --año {year} ütközik az észlelt {detected} értékkel.
  sede:
    errors:
      cotejo_nav_failed: Az AEAT cotejo oldalra való navigáció sikertelen volt; a
        munkamenet lejárhatott. Futtassa az 'aeat config auth test' parancsot és próbálja
        újra.
      ejercicio_unavailable: Az AEAT nyilatkozatnyilvántartó nem kínálja a kért adóévet
        ehhez a modellhez.
      empty_identity_nif: Az AEAT munkamenet azonosító NIF-je üres; nem lehet kötni
        az élő benyújtási megfigyelést.
      form_render_timeout: Az AEAT nyilatkozatnyilvántartó űrlapja nem renderelődött
