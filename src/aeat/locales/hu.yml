        refresh_failed: A Google OAuth frissítés meghiúsult.
        refresh_refused: A Google OAuth visszautasította a frissítési kérést; a refresh
          token már nem érvényes.
        token_endpoint_unreachable: A Google OAuth token végpont nem elérhető.
      suggestions:
        check_network: Ellenőrizd a hálózati kapcsolatot a Google OAuth végpontjaival,
          és próbáld újra.
      testing_project_cap_warning: A Google OAuth refresh token közelít a 7 napos
        Testing projekt limithez (körülbelül {hours_remaining} óra van hátra); futtasd
        újra az `aeat config google login` parancsot a hitelesítő adat élettartamának
        meghosszabbításához.
