errors:
  auth:
    auth_aeat_login_assertion: Az AEAT bejelentkezés utáni ellenőrzését nem sikerült
      létrehozni.
    auth_aeat_session_expired: Az AEAT hitelesített munkamenete lejárt. A folytatáshoz
      hitelesítsd magad újra.
    auth_auth: AEAT-hitelesítési hiba történt.
    auth_auth_authenticator_persisted_session_invalid: A mentett AEAT böngészőmunkamenet
      nem megbízható. Hitelesítsd magad újra.
    auth_auth_certificate: Tanúsítvány alapú hitelesítési hiba történt.
    auth_auth_certificate_expired: A digitális tanúsítvány lejárt. A hitelesítéshez
      újítsd meg a tanúsítványt.
    auth_auth_certificate_handshake: A TLS-kézfogás bemenete érvénytelen. Ellenőrizd
      a megadott URL-t.
    auth_auth_certificate_load: A PKCS#12 tanúsítvány adatait nem sikerült beolvasni.
      Ellenőrizd, hogy a fájl nem sérült-e.
    auth_auth_certificate_nif_parse: A tanúsítvány alanyából nem sikerült NIF vagy
      NIE azonosítót kinyerni. Ellenőrizd, hogy a tanúsítvány magánszemélyhez tartozik-e.
    auth_auth_certificate_password: A tanúsítvány jelszava hiányzik vagy helytelen.
      Állítsd be a környezeti változót a helyes jelszóra.
    auth_auth_certificate_pre_expiry: A digitális tanúsítvány hamarosan lejár. Újítsd
      meg a lejárat előtt a fennakadások elkerülése érdekében.
    auth_auth_clave_movil_clave_movil_approval_timeout: A Cl@ve hitelesítés nem fejeződött
      be időben. Hagyd jóvá a kérést az eszközödön, és próbáld újra.
    auth_auth_clave_movil_clave_movil_configuration: A kötelező Cl@ve Móvil beállítások
      hiányoznak vagy hibásak. Ellenőrizd a Cl@ve konfigurációt.
    auth_auth_configuration: A kötelező hitelesítési beállítások hiányoznak vagy hibásak.
      Ellenőrizd a hitelesítési konfigurációt.
    auth_auth_validation: A hitelesítési paraméterek nem feleltek meg az ellenőrzésnek.
      Javítsd a megjelölt értékeket, és próbáld újra.
    auth_google: Google-hitelesítési hiba történt.
    auth_google_client_not_registered: Az aktív profilhoz nincs regisztrálva Google
      asztali OAuth-kliens. Regisztrálj egy klienst a Google-funkciók használatához.
    auth_google_client_revoked: A regisztrált Google asztali OAuth-klienst visszavonták.
      Regisztrálj új klienst.
    auth_google_expired: A Google frissítési tokenje lejárt a tesztprojektek 7 napos
      korlátja miatt. Engedélyezd újra a Google-hozzáférést.
    auth_google_revoked: A Google frissítési tokenjét visszavonták. Engedélyezd újra
      a Google-hozzáférést.
    auth_google_scope_insufficient: A megadott Google-jogosultságok nem tartalmazzák
      a művelethez szükséges összes hatókört. Engedélyezd újra az összes kért jogosultság
      megadásával.
    auth_outbound_storage_permission: Az aktív hitelesítő adatok nem rendelkeznek
      a tárolóművelethez szükséges jogosultsággal.
    auth_session_corrupt: A mentett munkamenet metaadatait nem sikerült beolvasni.
      Hitelesítsd magad újra egy friss munkamenet létrehozásához.
    auth_session_unavailable: Nincs elérhető ellenőrzött aktív AEAT-munkamenet. A
      folytatás előtt hitelesítsd magad.
    auth_storage_bucket_recovery_verification: A megadott helyreállítási kód érvénytelen.
      Írd be újra a 24 szót pontosan úgy, ahogyan a biztonsági mentésben szerepelnek.
    auth_storage_keyring_unavailable: Az operációs rendszer kulcstartója nem érhető
      el. Ellenőrizd, hogy van-e telepített és aktív hitelesítőadat-tároló.
    auth_storage_master_key_kdf_version: A főkulcsfájl olyan kulcslevezetési verziót
      használ, amelyet ez a kiadás nem támogat. Frissítsd az alkalmazást.
    auth_storage_master_key_keychain_locked: Az operációs rendszer kulcstartója zárolva
      van. Oldd fel (Touch ID, Windows Hello vagy a hitelesítőadat-kezelő feloldása),
      és próbáld újra.
    auth_storage_master_key_material_missing: Nincs főkulcs-anyag. A biztonságos tároló
      még nincs előkészítve.
    auth_storage_master_key_passphrase_mismatch: A jelmondat nem nyitja meg a főkulcsot.
      Add meg újra; ha elfelejtetted, állítsd helyre a helyreállítási kulcsoddal.
    auth_storage_master_key_unavailable: A főkulcsot egyetlen szolgáltatótól sem sikerült
      megszerezni. Ellenőrizd a kulcstartót vagy a tartalék jelmondatot.
