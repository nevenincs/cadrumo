topic:
  authentication:
    body: 'Az AEAT-hitelesítés Cl@ve Móvil (push a regisztrált telefonra) vagy digitális
      tanúsítvány (FNMT / azzal egyenértékű) segítségével működik. Konfiguráljon egy
      szolgáltatót: `aeat config auth configure --provider certificate`, majd ellenőrizze:
      `aeat config auth test`.'
    title: Hitelesítés az AEAT-nál
  calendar:
    body: A naptár adott időtartományon belül mutatja a benyújtási kötelezettségeket
      (nyomtatványok és időszakok). Az IVA-rezsim beállított profil szükséges, különben
      a motor csendben alapértelmezésre vált.
    title: Kötelezettségek naptára
  casilla:
    body: A mező egy nyomtatvány számozott rovata. A mezők lehetnek manuálisak, számítottak
      vagy kötésből származtatottak. Az `aeat app modelo casillas <nyomtatvány>` parancs
      felsorolja azokat.
    title: Mezők (casillák)
  formats:
    body: A CLI szöveges, JSON-, táblázatos vagy CSV-formátumban adja ki a kimenetet
      a `--format` kapcsoló alapján. Automatizáláshoz a JSON ajánlott, emberi olvasáshoz
      a szöveges.
    title: Kimeneti formátumok
  irpf-regime:
    body: Önálló vállalkozó IRPF-rezsimje. Közvetlen becslés (normál vagy egyszerűsített)
      vagy objektív becslés (módszer). Meghatározza, hogy melyik előlegfizetési nyomtatvány
      alkalmazandó (130 vs. 131).
    title: IRPF-rezsim
  iva-regime:
    body: Az adóalanynál alkalmazandó ÁFA-rezsim. Általános, egyszerűsített, equivalencia-felár,
      mentes, REAGP vagy REBU. Meghatározza a negyedéves 303-as és az éves 390-es
      összesítő nyomtatványt.
    title: IVA-rezsim (ÁFA)
  modelos:
    body: Az AEAT adónyomtatványainak katalógusa (303, 130, 100, 347, 349, 111, 115,
      184 stb.). Mindegyiknek saját naptára, mezői és alkalmazhatósági szabályai vannak.
      Az `aeat app modelo list` parancs felsorolja az elérhető nyomtatványokat.
    title: Adónyomtatványok (modelók)
  pago-fraccionado:
    body: Önálló vállalkozók negyedéves IRPF-előleg-fizetése. Közvetlen becslésnél
      a 130-as nyomtatvány, objektív becslésnél a 131-es alkalmazandó. A számítás
      a negyedév adatait és bizonyos esetekben az előző évet veszi alapul.
    title: IRPF-előlegfizetés
  profile:
    body: 'A helyi profil tartalmazza az adóazonosítót (NIF), a fő tevékenységet,
      az IVA/IRPF-rezsimet és az opcionális regisztrációkat (SII, Verifactu, intrakomunitáris).
      Szerkessze: `aeat config profile edit NÉV`.'
    title: Adóalany profilja
  providers:
    body: Támogatott hitelesítési szolgáltatók; mindegyiknek eltérő előfeltételei
      vannak. Az `aeat config auth providers` parancs felsorolja azokat a követelményekkel
      együtt.
    title: Hitelesítési szolgáltatók
  recargo-extemporaneo:
    body: 'A határidő utáni benyújtás – előzetes AEAT-értesítés nélkül – az első évben
      havonta 1%-os pótdíjat von maga után (legfeljebb 12%-ot), 12 hónap elteltével
      15%-ot plusz kamatot. Jogalap: Ley 58/2003 27. cikk.'
    title: Késedelmi pótdíj
  regimens:
    body: 'Az önálló vállalkozóra vonatkozó adórezsimek összessége. A két fő tengely:
      ÁFA (általános, egyszerűsített, equivalencia-felár, mentes) és IRPF (közvetlen,
      objektív).'
    title: Adórezsimek
  sii-verifactu:
    body: Elektronikus számlaküldési rendszerek az AEAT-nak. A SII (Suministro Inmediato
      de Información) nagyvállalatoknak kötelező; a Verifactu (RD 1007/2023) a számlázó
      rendszerekre vonatkozó fokozatos követelmény.
    title: SII és Verifactu
transactions:
  import:
    message_053465: Ismétlődő tranzakció észlelve az importált fájlban.
    message_082074: Ismétlődő tranzakció már szerepel a főkönyvben.
