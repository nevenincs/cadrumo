adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: Az AEAT elutasította az új Cl@ve Móvil push kiadását,
          mert egy korábbi hitelesítési kérelem még szerver oldalon függőben van.
      suggestions:
        reject_pending_request: 'Nyissa meg a Cl@ve alkalmazást a telefonján, utasítson
          el minden függőben lévő kérelmet, majd futtassa: `aeat config auth test`
          (vagy várjon legfeljebb 5 percet, amíg az AEAT automatikusan lejáratja azokat).'
    sede:
      groi:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a GROI-űrlap szerkezetét.
      nif_iva:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a NIF-IVA-űrlap szerkezetét.
      renta_web_open:
        suggestions:
          shape_change: Futtassa újra az élő orákulumot, miután ellenőrizte, hogy
            az AEAT módosította-e a Renta WEB Open oldal szerkezetét.
  auth:
    authenticator:
      errors:
        already_active: Az AeatAuthenticator mar rendelkezik aktiv munkamenettel;
          hivja meg a close() vagy reauthenticate() metodust az ujabb hitelesites
          elott.
        already_active_before_resume: Az AeatAuthenticator már aktív munkamenettel
          rendelkezik; folytatás előtt hívja meg a close() metódust.
        assertion_failed: Az AEAT hitelesites nem hozott letre ervenyes bejelentkezesi
          allitast.
        capture_requires_active_session: A capture_storage_state() az aktuálisan aktív
          hitelesített munkamenetet igényli.
        capture_requires_certificate: A capture_storage_state() tanúsítványalapú munkamenetet
          és kézfogás-metaadatokat igényel.
        closing: A hitelesítő zárás alatt áll; új verify_login műveletek nem engedélyezettek.
        context_marker_missing: A böngészőkontextus nem tartalmazza a várt tanúsítványjelölőt.
        metadata_parse_failed: A mentett metaadatok nem eredmenyeztek elemzett modellt.
        no_active_context: Nincs aktív böngészőkontextus; először hívja meg az authenticate()
          metódust.
        no_context_capture_storage: Nincs aktív böngészőkontextus; nem lehet rögzíteni
          a tárolási állapotot.
        persisted_session_verification_failed: A tárolt AEAT böngészőmunkamenet nem
          ment át az élő ellenőrzésen.
        resume_failed: A mentett AEAT munkamenet folytatasa nem eredmenyezett hasznalhato
          kornyezetet.
        session_stale: Az AEAT munkamenet lejárt; az inaktivitási határidő eltelt.
    clave_movil:
      errors:
        already_active: A Cl@ve Móvil már aktív munkamenettel rendelkezik; hitelesítés
          előtt hívja meg a close() metódust.
        approval_timeout: A Cl@ve Móvil böngészős hitelesítés nem fejeződött be a
          beállított időkorláton belül.
        dni_nie_not_set: Az AEAT_CLAVE_MOVIL_DNI_NIE nincs beállítva; hitelesítés
          előtt adja meg DNI- vagy NIE-számát.
        initial_navigation_timeout: A Cl@ve Movil kezdeti navigacioja nem fejezodott
          be a beallitott idokorlaton belul.
        metadata_invalid: A Cl@ve Móvil munkamenet-metaadatai érvénytelenek vagy nem
          elemezhetők.
        no_persisted_session: Nem talalhato Cl@ve Movil munkamenet; futtassa eloszor
          az `aeat config auth status` parancsot.
        page_missing_click: A Playwright oldal nem teszi elerhetove a click() metodust;
          nem hajthat vegre Cl@ve Movil bejelentkezest.
        session_expired: A Cl@ve Movil munkamenet tullephte a tetlensegi hataridot.
        storage_state_hash_mismatch: A Cl@ve Movil tarolasi allapot hash nem egyezik;
          a munkamenet adatai serulhetnek.
        verify_requires_active_context: A Cl@ve Móvil verify() aktív böngészőkontextust
          igényel; először hívja meg az authenticate() metódust.
  google:
    calc_sheets:
      errors:
        api_call_failed: A Google {action} hívás sikertelen.
        api_call_refused: A Google {action} hívást elutasították (HTTP {status}).
        api_target_not_found: A Google {action} célpontja nem található.
        conflicting_duplicate_metadata: A Google-táblázat ellentmondó, duplikált AEAT-metaadatokat
          tartalmaz.
        foreign_spreadsheet_not_owned: A Google-táblázat nincs ennek az AEAT-profilnak
          a tulajdonaként megjelölve.
        googleapiclient_not_importable: A googleapiclient nem importálható; a Google-adapter
          nem tud kapcsolódni az API-hoz.
        spreadsheet_id_blank: A Google-táblázat azonosítója nem lehet üres.
        workbook_snapshot_mismatch: A Google-táblázat metaadatai nem egyeznek a számítási
          pillanatképpel.
      suggestions:
        reexport_then_pull: Exportálja újra a munkafüzetet az `aeat config google
          sync calc export` paranccsal, majd húzza be újra.
        reexport_workbook: Exportálja újra a munkafüzetet az `aeat config google sync
          calc export` paranccsal, hogy az alkalmazás által kezelt metaadatok frissüljenek.
        verify_exported_workbook: Ellenőrizze, hogy a táblázatot eredetileg az `aeat
          config google sync calc export` hozta létre ehhez a profilhoz.
    oauth_flow:
      errors:
        browser_launcher_refused: Az operációs rendszer böngészőindítója megtagadta
          az OAuth-hozzájárulási URL megnyitását.
        client_config_refused: A Google OAuth ügyfélkonfigurációját elutasították.
        email_claim_missing: A Google id_token ellenőrzése sikeres volt, de nem tartalmaz
          e-mail-igényt.
        endpoint_unreachable: A Google OAuth-végpont nem érhető el.
        id_token_missing: A Google nem adott vissza id_token-t; az OAuth-hozzájárulás
          nem tartalmazta az openid+email hatókört.
        id_token_module_not_importable: A google-auth id_token modul nem importálható.
        id_token_verification_failed: A Google id_token ellenőrzése sikertelen.
        loopback_bind_failed: A helyi visszahurkos OAuth-vevő nem tudott portot foglalni.
        oauthlib_not_importable: A google-auth-oauthlib nem importálható; az OAuth-folyamat
          nem indítható el.
        profile_state_unresolved: A Google OAuth nem tudja feloldani a kiválasztott
          AEAT-profil állapotát.
        scope_missing: A Google hozzájárulási képernyő visszatért anélkül, hogy minden
          szükséges hatókört megadott volna.
        unsecured_mode_refused: A Google OAuth megtagadta a hozzáférést, mert a titkos
          tár nem biztonságos módban fut, és az aktív profil valódi spanyol adóazonosítót
          tartalmaz.
      suggestions:
        close_loopback_port: Zárja be a szabad visszahurkos portot foglaló alkalmazást,
          és próbálja újra.
        open_consent_url_manually: Nyissa meg manuálisan a megjelenített hozzájárulási
          URL-t a böngészőjében.
        repair_profile_state: Futtassa az `aeat config profile health` parancsot,
          majd javítsa ki vagy váltsa át az aktív profilt, mielőtt újrapróbálja a
          Google-parancsot.
        use_keyring_or_synthetic: Állítsa be az aeat_secret_store_backend=keyring
          értéket, vagy váltson az aktív profilt szintetikus teszt-adóazonosítóra.
    profile_binding:
      errors:
        no_active_profile: Nincs aktív AEAT-profil kötve a Google OAuth-hoz.
      suggestions:
        create_profile: Futtassa az `aeat config profile create NAME --tax-id <NIF/CIF/DNI/NIE>`
          parancsot, majd próbálja újra a Google-parancsot.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'A(z) {profile} profilhoz tartozó bevallás-kinyerés sikertelen:
          {details}'
        modelo_conflict: A --modelo {modelo!r} ütközik az észlelt {detected!r} értékkel.
        period_unresolved: A bevallási időszak nem volt meghatározható a PDF szövegéből.
        profile_count_invalid: 'Pontosan egy bevallás-PDF-kinyerési profil szükséges
          a modelo={modelo} nyomtatványhoz; elérhető: {available}.'
        profile_unavailable: A(z) {profile!r} kinyerési profil nem érhető el a modelo={modelo}
          nyomtatványhoz.
        registry_snapshot_required: 'A bevallás-kinyeréshez érvényesített nyilvántartási
          pillanatkép szükséges: modelo={modelo} year={year} period={period}: {error}'
        snapshot_modelo_conflict: A nyilvántartási pillanatkép {snapshot_modelo!r}
          nyomtatványa ütközik az észlelt {detected!r} értékkel.
        tax_id_unresolved: Az adóazonosító nem volt meghatározható a PDF szövegéből.
        template_not_detected: A(z) {path} sablona nem észlelhető automatikusan; a
          felülbíráláshoz adja meg a --modelo és --año értékeket.
        year_conflict: A --año {year} ütközik az észlelt {detected} értékkel.
    financial:
      providers:
        pdf_n26:
          errors:
            parse_failed: Nem sikerült elemezni az N26 PDF-kivonatot. A forrás elérési
              útja ki lett takarva a diagnosztikából.
    justificante:
      errors:
        parse_failed: Nem sikerült elemezni az igazolás PDF-et. A forrás elérési útja
          ki lett takarva a diagnosztikából.
    pdf:
      errors:
        hash_failed: Nem sikerült kiszámítani a PDF ellenőrzőösszegét.
  outbound:
    storage:
      factory:
        errors:
          drive_root_missing: 'Nincs Google Drive gyokermappa-azonosito beallitva
            az aktiv profilhoz. Futtassa eloszor: `aeat config google folder set <id>`.'
          google_auth_import_failed: 'A google-auth fuggoseg nem importalhato; futtassa:
            `uv sync`, majd probalja ujra.'
          google_client_missing: 'Nincs Google OAuth-kliens regisztralva az aktiv
            profilhoz. Futtassa eloszor: `aeat config google register --client-json
            <path>`.'
          google_token_missing: 'Nincs Google OAuth-token mentve az aktiv profilhoz.
            Futtassa eloszor: `aeat config google login`.'
          kind_empty: Az AEAT_STORAGE_PROVIDER_KIND ures.
          kind_unhandled: A(z) {kind} tarhelyszolgaltato-tipust a factory nem kezeli.
          kind_unknown: 'A(z) {value} tarhelyszolgaltato-tipus nem ismert; vart ertekek:
            {expected}.'
      google_drive:
        errors:
          content_hash_blank: A Google Drive tartalom hash nem lehet ures.
          content_hash_mismatch: A Google Drive tartalom hash nem egyezik; a letoltott
            payload integritasellenorzese sikertelen.
          create_namespace_no_id: A Google Drive nem adott vissza azonositot a nevter
            mappa letrehozasakor.
          create_vault_folder_no_id: A Google Drive nem adott vissza azonositot a
            vault mappa letrehozasakor.
          folder_not_owned: A Drive mappa {folder_name} nincs az alkalmazas tulajdonakent
            jelolve; az operatori adatok vedelmeben az iras megtagadva.
          googleapiclient_import_failed: 'A google-api-python-client fuggoseg nem
            importalhato; futtassa: `uv sync`, majd probalja ujra.'
          media_non_bytes: A Google Drive medialetoltes {payload_type} tipust adott
            vissza bytes helyett.
          namespace_blank: A Google Drive tarhely nevtere nem lehet ures.
          namespace_forbidden_characters: A Google Drive nevter {namespace} tiltott
            utvonal-karaktereket tartalmaz.
          namespace_not_found: 'A Google Drive nevter nem talalhato: {namespace}.'
          object_key_hmac_blank: A Google Drive objektumkulcs HMAC nem lehet ures.
          object_not_found: 'A Google Drive objektum {object_key_hmac} nem talalhato
            ebben a nevterben: {namespace}.'
          request_failed: A Google Drive {action} keres {status} allapottal sikertelen.
          root_folder_id_blank: A Google Drive gyokermappa azonosito nem lehet ures.
          vault_entry_not_folder: 'A beallitott Drive gyoker tartalmazza ezt: {vault_folder_name},
            de ez nem mappa.'
          vault_folder_name_blank: A Google Drive vault mappa neve nem lehet ures.
          write_non_dict_response: A Google Drive {action} irasi valasza varatlan
            alaku volt.
      local:
        errors:
          byte_length_invalid: 'A helyi sidecar byte_length mezojenek tipusa ervenytelen:
            {actual_type}.'
          content_hash_blank: A helyi tartalom hash nem lehet ures.
          content_hash_mismatch: A helyi tartalom hash nem egyezik; a payload integritasellenorzese
            sikertelen.
          namespace_blank: A helyi tarhely nevtere nem lehet ures.
          namespace_create_permission: 'A helyi tarhely nem tudta letrehozni a nevteret:
            {namespace}.'
          namespace_forbidden_characters: A helyi tarhely nevtere {namespace} tiltott
            utvonal-karaktereket tartalmaz.
          namespace_not_found: 'A helyi nevter nem talalhato: {namespace}.'
          object_delete_permission: A helyi tarhely nem tudta torolni az objektum
            payloadjat.
          object_key_hmac_blank: A helyi tarhely objektumkulcs HMAC nem lehet ures.
          object_key_hmac_forbidden_characters: A helyi objektumkulcs HMAC {object_key_hmac}
            tiltott karaktereket tartalmaz.
          object_not_found: 'A helyi objektum {object_key_hmac} nem talalhato ebben
            a nevterben: {namespace}.'
          payload_commit_failed: A helyi tarhely nem tudta atomikusan veglegesiteni
            az objektum payloadjat.
          payload_read_permission: A helyi tarhely nem tudta olvasni az objektum payloadjat.
          payload_write_permission: A helyi tarhely nem tudta irni az objektum payloadjat.
          sidecar_malformed: A helyi sidecar {sidecar_path} nem olvashato vagy hibas.
          sidecar_missing: A helyi objektum sidecarja hianyzik.
          sidecar_not_object: A helyi sidecar {sidecar_path} nem JSON objektum.
          sidecar_write_failed: A helyi tarhely nem tudta irni az objektum sidecarjat.
  persistence:
    profile:
      assets:
        errors:
          asset_already_exists: Ez az eszköz már szerepel a titkosított eszköznyilvántartásban.
          load_amortizacion_ledger_failed: A titkosított amortizációs nyilvántartás
            nem tölthető be.
          load_asset_ledger_failed: A titkosított eszköznyilvántartás nem tölthető
            be.
      inventory:
        errors:
          inventory_ledger_already_exists: Ez a készletnyilvántartás már létezik.
          inventory_ledger_not_found: A kért készletnyilvántartás nem található.
          load_inventory_ledger_failed: A titkosított készletnyilvántartás nem tölthető
            be.
          movement_already_exists: Ez a készletmozgás már létezik.
  sede:
    errors:
      cotejo_nav_failed: Az AEAT cotejo oldalra való navigáció sikertelen volt; a
        munkamenet lejárhatott. Futtassa az 'aeat config auth test' parancsot és próbálja
        újra.
      ejercicio_unavailable: Az AEAT nyilatkozatnyilvántartó nem kínálja a kért adóévet
        ehhez a modellhez.
      empty_identity_nif: Az AEAT munkamenet azonosító NIF-je üres; nem lehet kötni
        az élő benyújtási megfigyelést.
      form_render_timeout: Az AEAT nyilatkozatnyilvántartó űrlapja nem renderelődött
        az időkorláton belül; a munkamenet lejárhatott, vagy az AEAT karbantartási
        oldalt szolgál ki.
      iva_wallet_empty_amount_cell: Az IVA kompenzációs tárca összeg cellája üres.
      iva_wallet_empty_period_cell: Az IVA kompenzációs tárca időszak cellája üres.
      justificante_column_missing: Az AEAT nyilatkozatválasz hiányzik a justificante
        oszlopból; a táblázat struktúrája megváltozhatott.
      listbox_missing: Az AEAT nyilatkozatválasz hiányzik a várt listázó tárolóból;
        az oldal struktúrája megváltozhatott.
      listing_nav_failed: Az AEAT nyilatkozatlista navigáció sikertelen volt. Ellenőrizze
        a hálózati kapcsolatot és próbálja újra.
      modelo_unavailable: Az AEAT nyilatkozatnyilvántartó nem kínálja a kért modellt.
      no_auth_session: Az AEAT hitelesítési munkamenet hiányzik vagy nincs perzisztálva;
        futtassa először az `aeat config auth status` parancsot.
      parse_failed: Nem sikerült elemezni az AEAT nyilatkozatválaszt; az oldal struktúrája
        megváltozhatott.
      playwright_alert_modal_failed: Hiba az AEAT riasztási modal folytatásakor.
      playwright_buscar_click_failed: Hiba a Buscar gombra való kattintáskor a Sede
        oldalon.
      playwright_combobox_open_failed: Hiba a Sede legördülő lista megnyitásakor.
      playwright_combobox_select_failed: Hiba a Sede legördülő lista opciójának kiválasztásakor.
      session_expired_nav_failed: Az AEAT nyilatkozatnyilvántartó nem töltött be;
        a munkamenet valószínűleg lejárt. Futtassa az 'aeat config auth test' parancsot
        és próbálja újra.
aggregation:
  grouping:
    errors:
      unsupported_modelo: Nincs regisztrált összesítési szerződés a kért modellhez.
  iva_ledger:
    errors:
      bucket_mismatch: A tranzakciós tár vödre nem egyezik a kért aggregálási vödörrel.
      candidate_outside_period: 'Belső hiba: az IVA-jelölt az aggregálási időszakon
        kívül esik.'
      unsupported_iva_category: 'Belső hiba: nem támogatott IVA-kategória az aggregáláshoz.'
  modelo_bindings:
    errors:
      unsupported_period: Nem támogatott nyomtatvány-időszak a főkönyvi aggregáláshoz.
  per_modelo:
    errors:
      unsupported_modelo: Nem támogatott nyomtatvány a nyomtatványonkénti aggregáláshoz.
    registry:
      errors:
        invalid_accrued_on: 'Érvénytelen elhatárolási dátum a(z) %{source_object_id}
          megfigyelésnél: %{accrued_on}'
        unsupported_provider: 'Nem támogatott aggregálási szolgáltató a(z) %{modelo}
          nyomtatványhoz: %{provider}'
  prorrata:
    errors:
      current_year_not_after_prior: A jelenlegi évnek szigorúan nagyobbnak kell lennie
        az előző évnél.
      invalid_provisional_period: Az ideiglenes időszaknak negyedéves (Qn) vagy havi
        (Mnn) tokennek kell lennie.
      year_out_of_range: A prorrata összesítési év kívül esik a támogatott 2000-2100
        tartományon.
  renta_ledger:
    errors:
      annual_period_required: A Renta főkönyvi aggregáláshoz éves időszak szükséges.
      bucket_mismatch: A tranzakciós tár vödre nem egyezik a kért Renta főkönyvi vödörrel.
      invoice_bucket_mismatch: A számlatár vödre nem egyezik a kért Renta főkönyvi
        vödörrel.
      modelo_mismatch: Az adónyomtatvány nem egyezik a várt Renta főkönyvi nyomtatvánnyal.
      period_mismatch: Az időszak nem egyezik a várt Renta főkönyvi időszakkal.
      quarterly_period_required: Az M130 jövedelemaggregáláshoz negyedéves időszak
        szükséges (pl. 2024Q1).
  service:
    errors:
      envelope_modelo_mismatch: aggregation.service.errors.envelope_modelo_mismatch
      envelope_period_mismatch: aggregation.service.errors.envelope_period_mismatch
      envelope_provider_payload_mismatch: aggregation.service.errors.envelope_provider_payload_mismatch
      observations_mismatch: aggregation.service.errors.observations_mismatch
      per_modelo_modelos_not_unique: aggregation.service.errors.per_modelo_modelos_not_unique
      per_modelo_providers_not_unique: aggregation.service.errors.per_modelo_providers_not_unique
      provider_modelos_not_unique: aggregation.service.errors.provider_modelos_not_unique
      result_source_kinds_not_unique: aggregation.service.errors.result_source_kinds_not_unique
      source_kinds_mismatch: aggregation.service.errors.source_kinds_mismatch
  source_mesh:
    errors:
      duplicate_binding_owner: 'Belső hiba: ismétlődő kötési tulajdonos a forráshálon.'
      duplicate_bound_casilla_owner: 'Belső hiba: ismétlődő mező-kötési tulajdonos
        a forráshálon.'
      duplicate_relation_owner: 'Belső hiba: ismétlődő kapcsolati tulajdonos a forráshálon.'
      owned_sources_blank: A forrásháló saját forrásai nem tartalmazhatnak üres forrástípusokat.
      owned_sources_duplicate: A forrásháló saját forrásainak egyedinek kell lenniük.
      source_transaction_ids_blank: A forrásháló tranzakcióazonosítói nem tartalmazhatnak
        üres értékeket.
      source_transaction_ids_duplicate: A forrásháló tranzakcióazonosítóinak egyedinek
        kell lenniük.
      unresolved_relation_ids_blank: aggregation.source_mesh.errors.unresolved_relation_ids_blank
      unresolved_relation_ids_duplicate: aggregation.source_mesh.errors.unresolved_relation_ids_duplicate
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: Az AEAT hitelesítési zárat nem sikerült beszerezni az elavult
          zár helyreállítása után.
        lock_held: Egy másik AEAT hitelesítési műveletet már folyamatban van ehhez
          a profilhoz. Ne kezdjen el egy második Cl@ve kérést; várja meg az előző
          befejezését.
        lock_held_suggestion: Futtassa az `aeat config auth status --format json`
          parancsot az aktív hitelesítési zár megvizsgálásához.
    certificate:
      health:
        file_missing: A konfigurált tanúsítványfájl (%{path}) nem létezik. Állítsa
          vissza a fájlt, vagy futtassa az `aeat config auth configure --provider
          certificate --file ÚTVONAL` parancsot.
