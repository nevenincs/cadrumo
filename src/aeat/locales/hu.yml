      Ez készíti elő azt a helyi profilt, amelyet az app a könyvelési munkához és
      a bevallási ellenőrzésekhez használ.

      %{section_total} lépés van. Csak %{required_total} válasz kötelező az induláshoz;
      amit még nem tudsz, üresen hagyhatod.

      Legyen kéznél a NIF/NIE/CIF, a tevékenység rövid leírása, az ÁFA/IRPF rendszer
      adatai, az adóügyi illetőség és szükség esetén a családi adatok.

      Mentés után a haladást itt ellenőrizheted: `aeat config profile status`.'
