access_gate:
  errors:
    default_translatable: live AEAT submission is permanently forbidden; use produce
      -> verify -> export and upload the file yourself in the AEAT portal
adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: AEAT refused to issue a new Cl@ve Móvil push because
          a prior authentication request is still pending server-side.
      suggestions:
        reject_pending_request: Open the Cl@ve app on your phone, reject every pending
          request, then run `aeat config auth test` (or wait up to 5 minutes for AEAT
          to time them out automatically).
    sede:
      groi:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the GROI form shape.
      nif_iva:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the NIF-IVA form shape.
      renta_web_open:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the Renta WEB Open page shape.
  google:
    calc_sheets:
      errors:
        api_call_failed: Google {action} call failed.
        api_call_refused: Google {action} call was refused (HTTP {status}).
        api_target_not_found: Google {action} target was not found.
        googleapiclient_not_importable: googleapiclient is not importable; the Google
          adapter cannot reach the API.
    oauth_flow:
      errors:
        browser_launcher_refused: The operating system browser launcher refused to
          open the OAuth consent URL.
        client_config_refused: The Google OAuth client configuration was refused.
        email_claim_missing: The Google id_token was verified but carries no email
          claim.
        endpoint_unreachable: The Google OAuth endpoint is unreachable.
        id_token_missing: Google did not return an id_token; the OAuth consent did
          not include the openid+email scopes.
        id_token_module_not_importable: The google-auth id_token module is not importable.
        id_token_verification_failed: Google id_token verification failed.
        loopback_bind_failed: The local loopback OAuth receiver failed to bind a port.
        oauthlib_not_importable: google-auth-oauthlib is not importable; the OAuth
          flow cannot start.
        scope_missing: The Google consent screen returned without granting every required
          scope.
        unsecured_mode_refused: Google OAuth refused because the secret store is running
          in unsecured mode and the active profile carries a real Spanish tax identifier.
      suggestions:
        close_loopback_port: Close the application holding a stray loopback port and
          retry.
        open_consent_url_manually: Open the printed consent URL manually in your browser.
        use_keyring_or_synthetic: Set aeat_secret_store_backend=keyring or switch
          the active profile to a synthetic test tax identifier.
    profile_binding:
      errors:
        no_active_profile: No active AEAT profile is bound for Google OAuth.
    refresh:
      errors:
        google_auth_not_importable: The google-auth library is not importable; Google
          OAuth refresh cannot proceed.
        reauth_required: The Google OAuth credential is marked as requiring reauthentication;
          the automatic refresh path is closed.
        refresh_failed: Google OAuth refresh failed.
        refresh_refused: Google OAuth refused the refresh request; the refresh token
          is no longer valid.
        token_endpoint_unreachable: The Google OAuth token endpoint is unreachable.
      suggestions:
        check_network: Check network connectivity to Google OAuth endpoints and retry.
      testing_project_cap_warning: The Google OAuth refresh token is approaching the
        7-day Testing-project cap (about {hours_remaining}h remaining); re-run `aeat
        config google login` to extend the credential lifetime.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'Declaration extraction failed for profile {profile}: {details}'
        modelo_conflict: --modelo {modelo!r} conflicts with detected {detected!r}.
        period_unresolved: Declaration period could not be resolved from the PDF text.
        profile_count_invalid: 'Expected exactly one declaration PDF extraction profile
          for modelo={modelo}; available: {available}.'
        profile_unavailable: Declaration extraction profile {profile!r} is not available
          for modelo={modelo}.
        registry_snapshot_required: 'Declaration extraction requires a validated registry
          snapshot for modelo={modelo} year={year} period={period}: {error}'
        snapshot_modelo_conflict: Registry snapshot modelo {snapshot_modelo!r} conflicts
          with detected {detected!r}.
        tax_id_unresolved: Declaration tax id could not be resolved from the PDF text.
        template_not_detected: Could not auto-detect template for {path}; pass --modelo
          and --año to override.
        year_conflict: --año {year} conflicts with detected {detected}.
aggregation:
  iva_ledger:
    errors:
      bucket_mismatch: Transaction repository bucket does not match the requested
        aggregation bucket.
      candidate_outside_period: aggregation.iva_ledger.errors.candidate_outside_period
      unsupported_iva_category: aggregation.iva_ledger.errors.unsupported_iva_category
  modelo_bindings:
    errors:
      unsupported_period: Unsupported modelo period for ledger aggregation.
  models:
    errors:
      annual_period_mixed: Period cannot mix annual and sub-annual (quarter/month)
        values.
      month_required: Monthly period type requires a month value.
      period_type_ambiguous: Period type is ambiguous; specify quarter or month explicitly.
      quarter_required: Quarterly period type requires a quarter value.
  per_modelo:
    errors:
      unsupported_modelo: Unsupported modelo for per-modelo aggregation
    registry:
      errors:
        invalid_accrued_on: 'Invalid accrual date for observation %{source_object_id}:
          %{accrued_on}'
        unsupported_provider: 'Unsupported aggregation provider for modelo %{modelo}:
          %{provider}'
  period:
    parse_error: Period format not recognised
  renta_ledger:
    errors:
      annual_period_required: Annual period is required for Renta ledger aggregation.
      bucket_mismatch: Transaction repository bucket does not match the requested
        Renta ledger bucket.
      modelo_mismatch: Tax model does not match the expected Renta ledger model.
      period_mismatch: Period does not match the expected Renta ledger period.
      quarterly_period_required: Quarterly period is required for M130 income aggregation
        (e.g. 2024Q1).
  source_mesh:
    errors:
      duplicate_binding_owner: aggregation.source_mesh.errors.duplicate_binding_owner
      duplicate_bound_casilla_owner: aggregation.source_mesh.errors.duplicate_bound_casilla_owner
      duplicate_relation_owner: aggregation.source_mesh.errors.duplicate_relation_owner
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: AEAT auth lock could not be acquired after stale-lock recovery.
        lock_held: Another AEAT auth operation is already in progress for this profile.
          Do not start a second Cl@ve request; wait for the running process to finish
          or let the lock expire if that process crashed.
        lock_held_suggestion: Run `aeat config auth status --format json` to inspect
          the active auth lock.
    certificate:
      health:
        file_missing: The configured certificate file (%{path}) does not exist. Restore
          the file or run 'aeat config auth configure --provider certificate --file
          PATH' with a valid path.
        path_unset: No certificate file has been selected. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
      load:
        password_unset: No certificate password is configured. Set the certificate
          password before continuing.
        path_unset: No certificate file is configured. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
    clave_movil:
      health:
        identity_unset: No DNI/NIE has been configured for Cl@ve Móvil. Configure
          one before continuing.
        operator_completion_required: Ready; requires operator-mediated Cl@ve completion.
    operator:
      alignment:
        both_missing_detail: Neither the Cl@ve identity (AEAT_CLAVE_MOVIL_DNI_NIE)
          nor the active profile tax id is set. Set both to the same DNI/NIE before
          live AEAT auth.
        both_missing_next_action: Edit the active profile with 'aeat config profile
          edit NAME --tax-id DNI/NIE' and set the same DNI/NIE for Cl@ve Móvil.
        clave_identity_missing_detail: The Cl@ve identity (AEAT_CLAVE_MOVIL_DNI_NIE)
          is not set, so it cannot be compared with the active profile tax id. Set
          it to the DNI/NIE of the active profile.
        clave_identity_missing_next_action: Configure the Cl@ve Móvil DNI/NIE to match
          the active profile's tax identifier.
        mismatch_detail: The Cl@ve identity DNI/NIE '%{clave_identity}' does not match
          the active profile tax id '%{profile_tax_id}'. Live AEAT auth would bind
          one taxpayer's session to another profile. Switch to the profile whose tax
          id matches the Cl@ve DNI/NIE, or correct whichever value is wrong.
        mismatch_next_action: Switch to the profile whose tax identifier matches the
          Cl@ve Móvil DNI/NIE, or correct whichever value is wrong.
        profile_tax_id_missing_detail: The active profile has no tax id, so it cannot
          be compared with the Cl@ve identity. Set the profile tax id to the DNI/NIE
          used for Cl@ve.
        profile_tax_id_missing_next_action: Edit the active profile with 'aeat config
          profile edit NAME --tax-id DNI/NIE' before authenticating.
      errors:
        certificate_file_required: The certificate provider requires a certificate
          file. Run `aeat config auth configure --provider certificate --file PATH`
          with the path to your PKCS#12 (.p12/.pfx) bundle.
        certificate_file_unresolved: The certificate path '%{certificate_path}' does
          not resolve to an existing file. Run `aeat config auth configure --provider
          certificate --file PATH` with a path to your PKCS#12 (.p12/.pfx) bundle.
        dangling_active_profile: Active profile pointer '%{active_profile}' does not
          resolve to a registered profile bucket. Run `aeat config profile list` to
          inspect registered profiles, then `aeat config profile switch NAME` or `aeat
          config profile create NAME`.
        no_active_bucket: No active profile bucket; run `aeat config profile create
          NAME` before configuring auth.
        unreadable_active_profile: Active profile '%{active_profile}' has a bucket
          manifest but no readable profile record (status=%{status}). Run `%{next_action}`
          before configuring authentication.
      login:
        refused_certificate_file_missing: 'Cannot log in: the configured certificate
          file (%{path}) does not exist. Restore the file or reconfigure the path
          before continuing.'
        refused_certificate_path_unset: 'Cannot log in: no certificate file has been
          selected yet. Run ''aeat config auth configure --provider certificate --file
          PATH'' before continuing.'
        refused_clave_movil_identity_unset: 'Cannot log in with Cl@ve Móvil: no DNI/NIE
          has been configured yet. Configure one before continuing.'
        refused_live_tests_disabled: 'Live login is disabled by the safety gate: the
          tool only builds and verifies locally. Enable live tests if you really intend
          to connect to AEAT, then re-run this command. Requested provider: %{provider}.'
      probe:
        certificate_corrupt: The certificate file is not a valid PKCS#12 envelope
          or the password is missing; it cannot be parsed.
        certificate_corrupt_detail: 'The certificate cannot be interpreted: %{error}.'
        certificate_expired: The certificate expired %{days} days ago. Renew it before
          authenticating.
        certificate_expiring: The certificate expires in %{days} days. Plan the renewal.
        certificate_file_missing: The configured certificate file (%{path}) does not
          exist.
        certificate_ok: Certificate valid; expires in %{days} days.
        certificate_path_unset: No certificate file has been selected.
        certificate_unreadable: The certificate file cannot be read (%{error}).
        clave_movil_identity_invalid: 'The DNI/NIE configured for Cl@ve Móvil is not
          valid: %{error}.'
        clave_movil_identity_ok: The DNI/NIE configured for Cl@ve Móvil has a valid
          shape.
        clave_movil_identity_unset: No DNI/NIE has been configured for Cl@ve Móvil.
        no_provider: No auth provider is configured; nothing to probe locally.
        no_session: No persisted AEAT session token on disk; run `aeat config auth
          login` to acquire one.
        session_expired: application.auth.operator.probe.session_expired
        session_live: application.auth.operator.probe.session_live
    provider_impact:
      certificate_ready: Certificate auth is ready. The operator keeps the same CLI
        filing flow for AEAT-backed reads; every provider uses the same command workflow.
      generic_ready: '%{label} is ready. The operator keeps the same CLI filing flow
        while this provider plugs into the shared auth protocol.'
      unavailable: '%{label} is configured but not ready yet. The operator can still
        produce, verify, and export filings locally, but AEAT-backed reads stay unavailable
        until auth is fixed.'
      unconfigured: The operator can still produce, verify, and export filings locally,
        but AEAT-backed reads stay unavailable until an auth provider is configured.
    sessions:
      errors:
        clave_identity_missing: Cl@ve Móvil live auth requires a configured DNI/NIE
          (AEAT_CLAVE_MOVIL_DNI_NIE) before any AEAT session can be used.
        clave_identity_profile_mismatch: Cl@ve Móvil identity does not match the active
          profile tax identity; switch to the matching profile or update the profile
          before live AEAT auth.
        corrupt_session: Your saved auth session is damaged and cannot be read. Run
          `aeat config auth clear --sessions` and then `aeat config auth test`.
        no_session: No active AEAT session; run `aeat config auth test` before reading
          AEAT data.
        profile_tax_id_missing: Cl@ve Móvil live auth requires the active profile
          to carry identity.tax_id.
        sede_rejected: AEAT session is not accepted by the AEAT Sede; run `aeat config
          auth test` before reading AEAT data.
        session_expired: AEAT session is expired; run `aeat config auth test` before
          reading AEAT data.
        session_identity_profile_mismatch: AEAT session identity does not match the
          active profile tax identity; clear auth sessions and authenticate the matching
          profile before live AEAT reads.
        state_missing: AEAT session state is missing; run `aeat config auth test`
          before reading AEAT data.
        verify_failed: AEAT session could not be verified; run `aeat config auth test`
          before reading AEAT data.
  modelo:
    borrador_binding:
      errors:
        caller_binding_keys_blank: Caller binding keys must not be blank.
        snapshot_id_required: Borrador-sourced values require a borrador_snapshot_id.
        snapshot_not_active: Borrador snapshot is not active; list active snapshots
          with `aeat app live borrador 100 list`.
        source_trace_mismatch: Borrador source trace must match resolved binding ids.
    errors:
      calculation_revision_not_found: No calculation revision found with id=%{calculation_revision_id}.
      computed_casilla_binding_conflict: 'Bucket-derived inputs target computed casillas
        and cannot be overridden by external binding. Affected casillas: %{computed}.'
      export_no_active_bucket: No active profile bucket; run `aeat config profile
        create NAME` before exporting a modelo revision.
      external_filing_evidence_reference_blank: External-filing import requires a
        non-empty evidence_reference_id.
      external_filing_no_casilla_values: External-filing import requires at least
        one casilla value; the supplied mapping is empty.
      filing_record_not_found: No filing record found with id=%{filing_record_id}.
      iva_wallet_not_seeded: 'Modelo 303 calculation requires a seeded IVA compensation
        history. For the first M303 filing of a fresh profile, seed the opening balance
        with zero: `aeat app modelo iva-wallet seed --filing-year YEAR --period PERIOD
        --amount 0 --confirm`.'
      reconcile_declaration_unsupported: Declaration-PDF reconcile source is not yet
        implemented; use --from-justificante PATH until the declaration parser lands.
      reconcile_no_active_bucket: No active profile bucket; run `aeat config profile
        create NAME` before reconciling a work unit.
      verification_report_not_found: No verification report found with id=%{verification_report_id}.
      work_unit_discarded_cannot_calculate: Work unit %{work_unit_id} is discarded
        and cannot be calculated. Create a fresh work unit on the same modelo, year,
        and period to continue.
      work_unit_discarded_cannot_import: Work unit %{work_unit_id} is discarded and
        cannot be imported. Create a fresh work unit on the same modelo, year, and
        period to continue.
      work_unit_not_found: No modelo work unit found with id=%{work_unit_id}.
  overview:
    explain:
      errors:
        modelo_blank: Modelo identifier must not be blank.
  user_profile:
    errors:
      duplicate_tax_id: Tax id '%{tax_id}' is already used by profile '%{profile}';
        one taxpayer must have one profile.
      no_active_profile_selected: No active profile selected.
      profile_already_exists: Profile '%{profile}' already exists; run `aeat config
        profile switch NAME` to activate it or `aeat config profile delete NAME` first.
      profile_create_route_mismatch: Profile create route '%{route}' does not match
        profile id '%{profile}'.
      profile_label_blank: Profile label must not be blank.
      profile_manifest_already_registered: Profile '%{profile}' already has a registered
        bucket manifest at %{bucket_dir}.
      profile_manifest_missing: Profile '%{profile}' has no registered bucket manifest
        at %{bucket_dir}.
      profile_not_registered: Profile '%{profile}' does not exist; run `aeat config
        profile create NAME` to create it.
      profile_tombstoned_not_selectable: Profile '%{profile}' is tombstoned and cannot
        be selected.
  wizard:
    errors:
      profile_flag_required: Wizard requires --profile NAME (no implicit 'default'
        fallback).
      quiet_missing_flags: 'This --quiet run is missing required details. Add these
        flags and run the command again: %{missing_flags}. Or run it without --quiet
        from an interactive terminal to use the guided setup.'
    status:
      errors:
        missing_tax_id: Active profile is missing tax.id.
        no_active_profile: No active profile configured.
        projection_failed: Active profile fails wizard projection.
        unexpected_projection_type: Setup flow answers did not project to SetupAnswers.
  workflow:
    errors:
      no_active_profile_bucket: No active profile bucket.
      state_unreadable: Local configuration state could not be read.
