    iva_treatment_236002: There is no taxable event; no VAT is charged or declared.
    label_799700: Domestic operation with reverse charge
    description_496471: 'Domestic supplies of goods or services where the recipient
      becomes the taxable person and self-assesses VAT (Art. 84.Uno.2º): construction
      works, waste / recovery materials, B2B supplies of mobile phones, video consoles,
      laptops and tablets.'
    triggers_when_019278: The transaction matches one of the Art. 84.Uno.2º sub-paragraphs
      (construction, waste, B2B consumer electronics, etc.).
    iva_treatment_632365: The issuer raises the invoice without output VAT and records
      'reverse charge'. The recipient self-assesses the output VAT and may simultaneously
      deduct it on the same Modelo 303.
    label_718631: Intra-community supply (exempt)
    description_746004: Supply of goods dispatched from Spain to another member state
      to a buyer holding a valid VAT-ID; exempt under Art. 25.
    triggers_when_621296: The buyer is VAT-registered in another member state and
      the goods leave the Spanish VAT territory.
    iva_treatment_977632: Invoice without VAT with the 'exenta Art. 25 Ley 37/1992'
      mention; declare on Modelo 303 and Modelo 349.
    label_196484: Intra-community acquisition (reverse charge)
    description_609600: Purchase of goods from another member state by a Spanish business;
      the buyer self-assesses and deducts the VAT in the same return.
    triggers_when_030936: The buyer is a Spanish business and the supplier acts with
      its intra-community VAT-ID.
    iva_treatment_124024: Self-assess VAT on Modelo 303 (both output and input) and
      declare on Modelo 349.
    label_772607: Intra-community triangulation
    description_869664: Chain transaction between three businesses in three member
      states where the intermediary does not tax in destination.
    triggers_when_430467: The simplified triangulation conditions of Art. 26.tres
      are met.
    iva_treatment_816317: Declared as an intra-community operation with key T on Modelo
      349.
    label_486415: Export to a third country (zero rated)
    description_233971: Supply of goods dispatched outside the Community, exempt with
      input-VAT deduction right under Art. 21.
    triggers_when_283979: The goods leave the Union customs territory with an export
      declaration.
    iva_treatment_781772: Invoice without VAT with the 'exenta Art. 21 Ley 37/1992'
      mention; keep the DUA as evidence; declare on Modelo 303.
    label_362155: Import from a third country
    description_847172: Entry of goods from non-member countries into the Spanish
      VAT territory; accrual at customs per Arts. 17 and 18.
    triggers_when_791426: A DUA is filed and import VAT is assessed at customs.
    iva_treatment_861572: VAT is assessed at customs (or deferred via Modelo 303 under
      the deferred import-VAT regime).
    label_014211: Equivalence surcharge regime
    description_763220: Mandatory special regime for retail sole traders charging
      an additional surcharge on top of the supplier's VAT (5.2 / 1.4 / 0.5).
    triggers_when_309904: The recipient is a natural-person retail trader subject
      to the equivalence-surcharge regime.
    iva_treatment_535387: The supplier charges VAT plus the surcharge; the retailer
      does not file Modelo 303 or 390 for that activity.
    label_089574: Simplified VAT regime (módulos)
    description_187074: Special regime computing VAT via indices and modules for activities
      listed in the yearly Ministerial Order.
    triggers_when_519525: The self-employed activity is listed in the current Ministerial
      Order and the taxpayer has not opted out.
    iva_treatment_958350: Quarterly Modelo 303 settlements computed via yearly indices.
    label_097134: Out-of-scope operation (place of supply outside Spain)
    description_904421: Operations whose place of supply is outside the Spanish VAT
      territory per Arts. 68-74 place-of-supply rules.
    triggers_when_667229: Place-of-supply rules place the operation outside the Spanish
      VAT territory and Law 37/1992 does not tax it.
    iva_treatment_483772: No Spanish VAT is charged; the operation is reported but
      may require VAT registration in the destination country.
    label_377629: Erroneous invoice (rectifiable)
    description_194881: Received or issued invoice with incorrect data (base, VAT
      amount, recipient, rate) that must be rectified before being declared.
