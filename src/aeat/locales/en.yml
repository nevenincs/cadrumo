access_gate:
  errors:
    default_translatable: live AEAT submission is permanently forbidden; use produce
      -> verify -> export and upload the file yourself in the AEAT portal
adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: AEAT refused to issue a new Cl@ve Móvil push because
          a prior authentication request is still pending server-side.
      suggestions:
        reject_pending_request: Open the Cl@ve app on your phone, reject every pending
          request, then run `aeat config auth test` (or wait up to 5 minutes for AEAT
          to time them out automatically).
    sede:
      groi:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the GROI form shape.
      nif_iva:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the NIF-IVA form shape.
      renta_web_open:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the Renta WEB Open page shape.
  google:
    calc_sheets:
      errors:
        api_call_failed: Google {action} call failed.
        api_call_refused: Google {action} call was refused (HTTP {status}).
        api_target_not_found: Google {action} target was not found.
        googleapiclient_not_importable: googleapiclient is not importable; the Google
          adapter cannot reach the API.
    oauth_flow:
      errors:
        browser_launcher_refused: The operating system browser launcher refused to
          open the OAuth consent URL.
        client_config_refused: The Google OAuth client configuration was refused.
        email_claim_missing: The Google id_token was verified but carries no email
          claim.
        endpoint_unreachable: The Google OAuth endpoint is unreachable.
        id_token_missing: Google did not return an id_token; the OAuth consent did
          not include the openid+email scopes.
        id_token_module_not_importable: The google-auth id_token module is not importable.
        id_token_verification_failed: Google id_token verification failed.
        loopback_bind_failed: The local loopback OAuth receiver failed to bind a port.
        oauthlib_not_importable: google-auth-oauthlib is not importable; the OAuth
          flow cannot start.
        scope_missing: The Google consent screen returned without granting every required
          scope.
        unsecured_mode_refused: Google OAuth refused because the secret store is running
          in unsecured mode and the active profile carries a real Spanish tax identifier.
      suggestions:
        close_loopback_port: Close the application holding a stray loopback port and
          retry.
        open_consent_url_manually: Open the printed consent URL manually in your browser.
        use_keyring_or_synthetic: Set aeat_secret_store_backend=keyring or switch
          the active profile to a synthetic test tax identifier.
    profile_binding:
      errors:
        no_active_profile: No active AEAT profile is bound for Google OAuth.
    refresh:
      errors:
        google_auth_not_importable: The google-auth library is not importable; Google
          OAuth refresh cannot proceed.
        reauth_required: The Google OAuth credential is marked as requiring reauthentication;
          the automatic refresh path is closed.
        refresh_failed: Google OAuth refresh failed.
        refresh_refused: Google OAuth refused the refresh request; the refresh token
          is no longer valid.
        token_endpoint_unreachable: The Google OAuth token endpoint is unreachable.
      suggestions:
        check_network: Check network connectivity to Google OAuth endpoints and retry.
      testing_project_cap_warning: The Google OAuth refresh token is approaching the
        7-day Testing-project cap (about {hours_remaining}h remaining); re-run `aeat
        config google login` to extend the credential lifetime.
aggregation:
  iva_ledger:
    errors:
      bucket_mismatch: Transaction repository bucket does not match the requested
        aggregation bucket.
  modelo_bindings:
    errors:
      unsupported_period: Unsupported modelo period for ledger aggregation.
  models:
    errors:
      annual_period_mixed: Period cannot mix annual and sub-annual (quarter/month)
        values.
      month_required: Monthly period type requires a month value.
      period_type_ambiguous: Period type is ambiguous; specify quarter or month explicitly.
      quarter_required: Quarterly period type requires a quarter value.
  per_modelo:
    errors:
      unsupported_modelo: Unsupported modelo for per-modelo aggregation
    registry:
      errors:
        invalid_accrued_on: 'Invalid accrual date for observation %{source_object_id}:
          %{accrued_on}'
        unsupported_provider: 'Unsupported aggregation provider for modelo %{modelo}:
          %{provider}'
  period:
    parse_error: Period format not recognised
  renta_ledger:
    errors:
      annual_period_required: Annual period is required for Renta ledger aggregation.
      bucket_mismatch: Transaction repository bucket does not match the requested
        Renta ledger bucket.
      modelo_mismatch: Tax model does not match the expected Renta ledger model.
      period_mismatch: Period does not match the expected Renta ledger period.
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: AEAT auth lock could not be acquired after stale-lock recovery.
        lock_held: Another AEAT auth operation is already in progress for this profile.
          Do not start a second Cl@ve request; wait for the running process to finish
          or let the lock expire if that process crashed.
        lock_held_suggestion: Run `aeat config auth status --format json` to inspect
          the active auth lock.
    clave_movil:
      health:
        operator_completion_required: Ready; requires operator-mediated Cl@ve completion.
    operator:
      errors:
        dangling_active_profile: Active profile pointer '%{active_profile}' does not
          resolve to a registered profile bucket. Run `aeat config profile list` to
          inspect registered profiles, then `aeat config profile switch NAME` or `aeat
          config profile create NAME`.
        no_active_bucket: No active profile bucket; run `aeat config profile create
          NAME` before configuring auth.
        unreadable_active_profile: Active profile '%{active_profile}' has a bucket
          manifest but no readable profile record (status=%{status}). Run `%{next_action}`
          before configuring authentication.
    provider_impact:
      certificate_ready: Certificate auth is ready. The operator keeps the same CLI
        filing flow for AEAT-backed reads; every provider uses the same command workflow.
      generic_ready: '%{label} is ready. The operator keeps the same CLI filing flow
        while this provider plugs into the shared auth protocol.'
      unavailable: '%{label} is configured but not ready yet. The operator can still
        produce, verify, and export filings locally, but AEAT-backed reads stay unavailable
        until auth is fixed.'
      unconfigured: The operator can still produce, verify, and export filings locally,
        but AEAT-backed reads stay unavailable until an auth provider is configured.
    sessions:
      errors:
        corrupt_session: Your saved auth session is damaged and cannot be read. Run
          `aeat config auth clear --sessions` and then `aeat config auth test`.
        no_session: No active AEAT session; run `aeat config auth test` before reading
          AEAT data.
        sede_rejected: AEAT session is not accepted by the AEAT Sede; run `aeat config
          auth test` before reading AEAT data.
        session_expired: AEAT session is expired; run `aeat config auth test` before
          reading AEAT data.
        state_missing: AEAT session state is missing; run `aeat config auth test`
          before reading AEAT data.
        verify_failed: AEAT session could not be verified; run `aeat config auth test`
          before reading AEAT data.
  modelo:
    borrador_binding:
      errors:
        caller_binding_keys_blank: Caller binding keys must not be blank.
        snapshot_id_required: Borrador-sourced values require a borrador_snapshot_id.
        snapshot_not_active: Borrador snapshot is not active; list active snapshots
          with `aeat app live borrador 100 list`.
        source_trace_mismatch: Borrador source trace must match resolved binding ids.
    errors:
      export_no_active_bucket: No active profile bucket; run `aeat config profile
        create NAME` before exporting a modelo revision.
      external_filing_evidence_reference_blank: External-filing import requires a
        non-empty evidence_reference_id.
      external_filing_no_casilla_values: External-filing import requires at least
        one casilla value; the supplied mapping is empty.
      reconcile_declaration_unsupported: Declaration-PDF reconcile source is not yet
        implemented; use --from-justificante PATH until the declaration parser lands.
      reconcile_no_active_bucket: No active profile bucket; run `aeat config profile
        create NAME` before reconciling a work unit.
  overview:
    explain:
      errors:
        modelo_blank: Modelo identifier must not be blank.
  user_profile:
    errors:
      no_active_profile_selected: No active profile selected.
      profile_already_exists: Profile '%{profile}' already exists; run `aeat config
        profile switch NAME` to activate it or `aeat config profile delete NAME` first.
      profile_not_registered: Profile '%{profile}' does not exist; run `aeat config
        profile create NAME` to create it.
  wizard:
    errors:
      profile_flag_required: Wizard requires --profile NAME (no implicit 'default'
        fallback).
      quiet_missing_flags: Required flags are missing for a --quiet wizard run.
    status:
      errors:
        missing_tax_id: Active profile is missing tax.id.
        no_active_profile: No active profile configured.
        projection_failed: Active profile fails wizard projection.
        unexpected_projection_type: Setup flow answers did not project to SetupAnswers.
  workflow:
    errors:
      no_active_profile_bucket: No active profile bucket.
      state_unreadable: Local configuration state could not be read.
