adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: AEAT refused to issue a new Cl@ve Móvil push because
          a prior authentication request is still pending server-side.
      suggestions:
        reject_pending_request: Open the Cl@ve app on your phone, reject every pending
          request, then run `aeat config auth test` (or wait up to 5 minutes for AEAT
          to time them out automatically).
    sede:
      groi:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the GROI form shape.
      nif_iva:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the NIF-IVA form shape.
      renta_web_open:
        suggestions:
          shape_change: Re-run the live oracle after checking whether AEAT changed
            the Renta WEB Open page shape.
  auth:
    authenticator:
      errors:
        already_active: AeatAuthenticator already has an active session; call close()
          or reauthenticate() before authenticating again.
        already_active_before_resume: AeatAuthenticator already has an active session;
          call close() before resuming.
        assertion_failed: Fresh AEAT authentication did not produce a valid login
          assertion.
        capture_requires_active_session: capture_storage_state() requires the currently
          active authenticated session.
        capture_requires_certificate: capture_storage_state() requires a certificate-backed
          session with handshake metadata.
        closing: The authenticator is closing; no new verify_login operations are
          allowed.
        context_marker_missing: Browser context was not tagged with the expected certificate
          marker.
        metadata_parse_failed: Persisted metadata did not produce a parsed model.
        no_active_context: No active browser context; call authenticate() first.
        no_context_capture_storage: No active browser context; cannot capture storage
          state.
        persisted_session_verification_failed: Persisted AEAT browser session failed
          live verification.
        resume_failed: Persisted AEAT session resume did not produce a usable context.
        session_stale: The AEAT session is stale; the idle deadline has elapsed.
    clave_movil:
      errors:
        already_active: Cl@ve Móvil already has an active session; call close() before
          authenticating again.
        approval_timeout: Cl@ve Móvil browser authentication did not complete within
          the configured timeout.
        dni_nie_not_set: AEAT_CLAVE_MOVIL_DNI_NIE is not set; configure your DNI or
          NIE before authenticating.
        initial_navigation_timeout: Initial navigation to Cl@ve Movil did not complete
          within the configured timeout.
        metadata_invalid: Cl@ve Móvil session metadata is invalid or could not be
          parsed.
        no_persisted_session: No persisted Cl@ve Movil session found; run `aeat config
          auth status` first.
        page_missing_click: Playwright page does not expose click(); cannot drive
          Cl@ve Movil entry.
        session_expired: Cl@ve Movil session has passed its idle deadline.
        storage_state_hash_mismatch: Cl@ve Movil storage-state hash mismatch; session
          data may be corrupt.
        verify_requires_active_context: Cl@ve Móvil verify() requires an active browser
          context; call authenticate() first.
  google:
    calc_sheets:
      errors:
        api_call_failed: Google {action} call failed.
        api_call_refused: Google {action} call was refused (HTTP {status}).
        api_target_not_found: Google {action} target was not found.
        conflicting_duplicate_metadata: The Google Sheet carries conflicting duplicate
          AEAT metadata.
        foreign_spreadsheet_not_owned: The Google Sheet is not marked as owned by
          this AEAT profile.
        googleapiclient_not_importable: googleapiclient is not importable; the Google
          adapter cannot reach the API.
        spreadsheet_id_blank: Google spreadsheet id must not be blank.
        workbook_snapshot_mismatch: The Google Sheet metadata does not match the calculation
          snapshot.
      suggestions:
        reexport_then_pull: Re-export the workbook with `aeat config google sync calc
          export`, then pull it again.
        reexport_workbook: Re-export the workbook with `aeat config google sync calc
          export` so app-managed metadata is refreshed.
        verify_exported_workbook: Verify the spreadsheet was originally created by
          `aeat config google sync calc export` against this profile.
    oauth_flow:
      errors:
        browser_launcher_refused: The operating system browser launcher refused to
          open the OAuth consent URL.
        client_config_refused: The Google OAuth client configuration was refused.
        email_claim_missing: The Google id_token was verified but carries no email
          claim.
        endpoint_unreachable: The Google OAuth endpoint is unreachable.
        id_token_missing: Google did not return an id_token; the OAuth consent did
          not include the openid+email scopes.
        id_token_module_not_importable: The google-auth id_token module is not importable.
        id_token_verification_failed: Google id_token verification failed.
        loopback_bind_failed: The local loopback OAuth receiver failed to bind a port.
        oauthlib_not_importable: google-auth-oauthlib is not importable; the OAuth
          flow cannot start.
        profile_state_unresolved: Google OAuth cannot resolve the selected AEAT profile
          state.
        scope_missing: The Google consent screen returned without granting every required
          scope.
        unsecured_mode_refused: Google OAuth refused because the secret store is running
          in unsecured mode and the active profile carries a real Spanish tax identifier.
      suggestions:
        close_loopback_port: Close the application holding a stray loopback port and
          retry.
        open_consent_url_manually: Open the printed consent URL manually in your browser.
        repair_profile_state: Run `aeat config profile health` and repair or switch
          the active profile before retrying the Google command.
        use_keyring_or_synthetic: Set aeat_secret_store_backend=keyring or switch
          the active profile to a synthetic test tax identifier.
    profile_binding:
      errors:
        no_active_profile: No active AEAT profile is bound for Google OAuth.
      suggestions:
        create_profile: Run `aeat config profile create NAME --tax-id <NIF/CIF/DNI/NIE>`
          and then retry the Google command.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'Declaration extraction failed for profile {profile}: {details}'
        modelo_conflict: --modelo {modelo!r} conflicts with detected {detected!r}.
        period_unresolved: Declaration period could not be resolved from the PDF text.
        profile_count_invalid: 'Expected exactly one declaration PDF extraction profile
          for modelo={modelo}; available: {available}.'
        profile_unavailable: Declaration extraction profile {profile!r} is not available
          for modelo={modelo}.
        registry_snapshot_required: 'Declaration extraction requires a validated registry
          snapshot for modelo={modelo} year={year} period={period}: {error}'
        snapshot_modelo_conflict: Registry snapshot modelo {snapshot_modelo!r} conflicts
          with detected {detected!r}.
        tax_id_unresolved: Declaration tax id could not be resolved from the PDF text.
        template_not_detected: Could not auto-detect template for {path}; pass --modelo
          and --año to override.
        year_conflict: --año {year} conflicts with detected {detected}.
    financial:
      providers:
        pdf_n26:
          errors:
            parse_failed: Could not parse the N26 PDF statement. The source path has
              been redacted from diagnostics.
    justificante:
      errors:
        parse_failed: Could not parse the justificante PDF. The source path has been
          redacted from diagnostics.
    pdf:
      errors:
        hash_failed: PDF file could not be hashed.
  outbound:
    storage:
      factory:
        errors:
          drive_root_missing: No Google Drive root folder id is configured for the
            active profile. Run `aeat config google folder set <id>` first.
          google_auth_import_failed: The google-auth dependency is not importable;
            run `uv sync` and retry.
          google_client_missing: No Google OAuth client is registered for the active
            profile. Run `aeat config google register --client-json <path>` first.
          google_token_missing: No Google OAuth token is persisted for the active
            profile. Run `aeat config google login` first.
          kind_empty: AEAT_STORAGE_PROVIDER_KIND is empty.
          kind_unhandled: Storage provider kind {kind} is not handled by the factory.
          kind_unknown: Storage provider kind {value} is not recognized; expected
            one of {expected}.
      google_drive:
        errors:
          content_hash_blank: Google Drive content hash must not be blank.
          content_hash_mismatch: Google Drive content hash mismatch; downloaded payload
            integrity check failed.
          create_namespace_no_id: Google Drive did not return an id when creating
            a namespace folder.
          create_vault_folder_no_id: Google Drive did not return an id when creating
            the vault folder.
          folder_not_owned: Drive folder {folder_name} is not marked as owned by this
            app; refusing to write to protect operator data.
          googleapiclient_import_failed: The google-api-python-client dependency is
            not importable; run `uv sync` and retry.
          media_non_bytes: Google Drive media download returned {payload_type} instead
            of bytes.
          namespace_blank: Google Drive storage namespace must not be blank.
          namespace_forbidden_characters: Google Drive storage namespace {namespace}
            contains forbidden path characters.
          namespace_not_found: Google Drive namespace {namespace} was not found.
          object_key_hmac_blank: Google Drive object key HMAC must not be blank.
          object_not_found: Google Drive object {object_key_hmac} was not found in
            namespace {namespace}.
          request_failed: Google Drive request {action} failed with status {status}.
          root_folder_id_blank: Google Drive root folder id must not be blank.
          vault_entry_not_folder: The configured Drive root contains {vault_folder_name},
            but that entry is not a folder.
          vault_folder_name_blank: Google Drive vault folder name must not be blank.
          write_non_dict_response: Google Drive write response for {action} had an
            unexpected shape.
      local:
        errors:
          byte_length_invalid: Local storage sidecar byte_length has invalid type
            {actual_type}.
          content_hash_blank: Local storage content hash must not be blank.
          content_hash_mismatch: Local storage content hash mismatch; payload integrity
            check failed.
          namespace_blank: Local storage namespace must not be blank.
          namespace_create_permission: Local storage could not create namespace {namespace}.
          namespace_forbidden_characters: Local storage namespace {namespace} contains
            forbidden path characters.
          namespace_not_found: Local storage namespace {namespace} was not found.
          object_delete_permission: Local storage could not delete object payload.
          object_key_hmac_blank: Local storage object key HMAC must not be blank.
          object_key_hmac_forbidden_characters: Local storage object key HMAC {object_key_hmac}
            contains forbidden characters.
          object_not_found: Local storage object {object_key_hmac} was not found in
            namespace {namespace}.
          payload_commit_failed: Local storage could not commit object payload atomically.
          payload_read_permission: Local storage could not read object payload.
          payload_write_permission: Local storage could not write object payload.
          sidecar_malformed: Local storage sidecar {sidecar_path} is unreadable or
            malformed.
          sidecar_missing: Local storage object sidecar is missing.
          sidecar_not_object: Local storage sidecar {sidecar_path} is not a JSON object.
          sidecar_write_failed: Local storage could not write the object sidecar.
  persistence:
    profile:
      assets:
        errors:
          asset_already_exists: That asset already exists in the encrypted asset ledger.
          load_amortizacion_ledger_failed: Unable to load the encrypted amortization
            ledger.
          load_asset_ledger_failed: Unable to load the encrypted asset ledger.
      inventory:
        errors:
          inventory_ledger_already_exists: That inventory ledger already exists.
          inventory_ledger_not_found: The requested inventory ledger was not found.
          load_inventory_ledger_failed: Unable to load the encrypted inventory ledger.
          movement_already_exists: That inventory movement already exists.
  sede:
    errors:
      cotejo_nav_failed: Navigation to the AEAT cotejo page failed; session may have
        expired mid-walk. Run 'aeat config auth test' and retry.
      ejercicio_unavailable: The AEAT declarations register does not offer the requested
        tax year for this modelo.
      empty_identity_nif: AEAT session identity NIF is empty; cannot bind live filing
        observation.
      form_render_timeout: The AEAT declarations register form did not render within
        the timeout; session may have expired or AEAT is serving a maintenance page.
      iva_wallet_empty_amount_cell: IVA compensation wallet amount cell is empty.
      iva_wallet_empty_period_cell: IVA compensation wallet period cell is empty.
      justificante_column_missing: The AEAT declarations response is missing the justificante
        column; the table structure may have changed.
      listbox_missing: The AEAT declarations response is missing the expected listing
        container; the page structure may have changed.
      listing_nav_failed: Navigation to the AEAT declarations listing failed. Check
        network connectivity and retry.
      modelo_unavailable: The AEAT declarations register does not offer the requested
        modelo.
      no_auth_session: AEAT auth session is missing or not persisted; run `aeat config
        auth status` first.
      parse_failed: Failed to parse the AEAT declarations response; the page structure
        may have changed.
      playwright_alert_modal_failed: Continuing the AEAT alert modal failed.
      playwright_buscar_click_failed: Clicking the Buscar button on the Sede page
        failed.
      playwright_combobox_open_failed: Opening the Sede combobox failed.
      playwright_combobox_select_failed: Selecting a combobox option on the Sede page
        failed.
      session_expired_nav_failed: The AEAT declarations register did not load; your
        session has likely expired. Run 'aeat config auth test' and retry.
aggregation:
  grouping:
    errors:
      unsupported_modelo: No aggregation contract is registered for the requested
        modelo.
  iva_ledger:
    errors:
      bucket_mismatch: Transaction repository bucket does not match the requested
        aggregation bucket.
      candidate_outside_period: 'Internal error: IVA candidate falls outside the aggregation
        period.'
      unsupported_iva_category: 'Internal error: unsupported IVA category for aggregation.'
  modelo_bindings:
    errors:
      unsupported_period: Unsupported modelo period for ledger aggregation.
  models:
    errors:
      annual_period_mixed: Period cannot mix annual and sub-annual (quarter/month)
        values.
      month_required: Monthly period type requires a month value.
      period_type_ambiguous: Period type is ambiguous; specify quarter or month explicitly.
      quarter_required: Quarterly period type requires a quarter value.
  per_modelo:
    errors:
      unsupported_modelo: Unsupported modelo for per-modelo aggregation
    registry:
      errors:
        invalid_accrued_on: 'Invalid accrual date for observation %{source_object_id}:
          %{accrued_on}'
        unsupported_provider: 'Unsupported aggregation provider for modelo %{modelo}:
          %{provider}'
  period:
    parse_error: Period format not recognised
  prorrata:
    errors:
      current_year_not_after_prior: current_year must be strictly greater than prior_year.
      invalid_provisional_period: Provisional period must be a quarterly (Qn) or monthly
        (Mnn) token.
      year_out_of_range: Prorrata aggregation year is outside the supported range
        2000-2100.
  renta_ledger:
    errors:
      annual_period_required: Annual period is required for Renta ledger aggregation.
      bucket_mismatch: Transaction repository bucket does not match the requested
        Renta ledger bucket.
      invoice_bucket_mismatch: Invoice repository bucket does not match the requested
        Renta ledger bucket.
      modelo_mismatch: Tax model does not match the expected Renta ledger model.
      period_mismatch: Period does not match the expected Renta ledger period.
      quarterly_period_required: Quarterly period is required for M130 income aggregation
        (e.g. 2024Q1).
  service:
    errors:
      envelope_modelo_mismatch: Aggregation modelo does not match result modelo.
      envelope_period_mismatch: Aggregation period does not match result period.
      envelope_provider_payload_mismatch: Provider does not match aggregation payload
        type.
      observations_mismatch: Observations cannot be supplied for the requested modelo.
      per_modelo_modelos_not_unique: Per-modelo aggregation modelos must be owned
        by exactly one provider.
      per_modelo_providers_not_unique: Per-modelo aggregation providers must be unique.
      provider_modelos_not_unique: Provider modelos must be unique.
      result_source_kinds_not_unique: Result source kinds must be unique.
      source_kinds_mismatch: Source kinds must match the accepted four-kind taxonomy.
  source_mesh:
    errors:
      duplicate_binding_owner: 'Internal error: duplicate binding owner in source
        mesh.'
      duplicate_bound_casilla_owner: 'Internal error: duplicate bound-casilla owner
        in source mesh.'
      duplicate_relation_owner: 'Internal error: duplicate relation owner in source
        mesh.'
      owned_sources_blank: Source mesh owned sources must not contain blank source
        kinds.
      owned_sources_duplicate: Source mesh owned sources must be unique.
      source_transaction_ids_blank: Source mesh transaction ids must not contain blanks.
      source_transaction_ids_duplicate: Source mesh transaction ids must be unique.
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: AEAT auth lock could not be acquired after stale-lock recovery.
        lock_held: Another AEAT auth operation is already in progress for this profile.
          Do not start a second Cl@ve request; wait for the running process to finish
          or let the lock expire if that process crashed.
        lock_held_suggestion: Run `aeat config auth status --format json` to inspect
          the active auth lock.
    certificate:
      health:
        file_missing: The configured certificate file (%{path}) does not exist. Restore
          the file or run 'aeat config auth configure --provider certificate --file
          PATH' with a valid path.
        path_unset: No certificate file has been selected. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
        unavailable: Certificate health is unavailable; see debug logs for diagnostic
          details.
      load:
        password_unset: No certificate password is configured. Set the certificate
          password before continuing.
        path_unset: No certificate file is configured. Run 'aeat config auth configure
          --provider certificate --file PATH' to set one.
    clave_movil:
      health:
        identity_unset: No DNI/NIE has been configured for Cl@ve Móvil. Configure
          one before continuing.
        operator_completion_required: Ready; requires operator-mediated Cl@ve completion.
    errors:
      provider_reserved: Authentication provider {provider} is reserved and not yet
        implemented.
      session_field_not_datetime: Persisted session field {field} must be a datetime
        or ISO-8601 string.
    operator:
      alignment:
        both_missing_detail: Neither the Cl@ve identity (AEAT_CLAVE_MOVIL_DNI_NIE)
          nor the active profile tax id is set. Set both to the same DNI/NIE before
          live AEAT auth.
        both_missing_next_action: Edit the active profile with 'aeat config profile
          edit NAME --tax-id DNI/NIE' and set the same DNI/NIE for Cl@ve Móvil.
        clave_identity_missing_detail: The Cl@ve identity (AEAT_CLAVE_MOVIL_DNI_NIE)
          is not set, so it cannot be compared with the active profile tax id. Set
          it to the DNI/NIE of the active profile.
        clave_identity_missing_next_action: Configure the Cl@ve Móvil DNI/NIE to match
          the active profile's tax identifier.
        mismatch_detail: The Cl@ve identity DNI/NIE '%{clave_identity}' does not match
          the active profile tax id '%{profile_tax_id}'. Live AEAT auth would bind
          one taxpayer's session to another profile. Switch to the profile whose tax
          id matches the Cl@ve DNI/NIE, or correct whichever value is wrong.
        mismatch_next_action: Switch to the profile whose tax identifier matches the
          Cl@ve Móvil DNI/NIE, or correct whichever value is wrong.
        profile_tax_id_missing_detail: The active profile has no tax id, so it cannot
          be compared with the Cl@ve identity. Set the profile tax id to the DNI/NIE
          used for Cl@ve.
        profile_tax_id_missing_next_action: Edit the active profile with 'aeat config
          profile edit NAME --tax-id DNI/NIE' before authenticating.
      errors:
        certificate_file_required: The certificate provider requires a certificate
          file. Run `aeat config auth configure --provider certificate --file PATH`
          with the path to your PKCS#12 (.p12/.pfx) bundle.
        certificate_file_unresolved: The certificate path '%{certificate_path}' does
          not resolve to an existing file. Run `aeat config auth configure --provider
          certificate --file PATH` with a path to your PKCS#12 (.p12/.pfx) bundle.
        dangling_active_profile: Active profile pointer '%{active_profile}' does not
          resolve to a registered profile bucket. Run aeat config profile list to
          inspect registered profiles, then aeat config unlock NAME or aeat config
          profile create NAME.
        no_active_bucket: No active profile bucket; run `aeat config profile create
          NAME` before configuring auth.
        unreadable_active_profile: Active profile '%{active_profile}' has a bucket
          manifest but no readable profile record (status=%{status}). Run `%{next_action}`
          before configuring authentication.
      login:
        refused_certificate_file_missing: 'Cannot log in: the configured certificate
          file (%{path}) does not exist. Restore the file or reconfigure the path
          before continuing.'
        refused_certificate_path_unset: 'Cannot log in: no certificate file has been
          selected yet. Run ''aeat config auth configure --provider certificate --file
          PATH'' before continuing.'
        refused_clave_movil_identity_unset: 'Cannot log in with Cl@ve Móvil: no DNI/NIE
          has been configured yet. Configure one before continuing.'
        refused_live_tests_disabled: 'Live login is disabled by the safety gate: the
          tool only builds and verifies locally. Enable live tests if you really intend
          to connect to AEAT, then re-run this command. Requested provider: %{provider}.'
      probe:
        certificate_corrupt: The certificate file is not a valid PKCS#12 envelope
          or the password is missing; it cannot be parsed.
        certificate_corrupt_detail: 'The certificate cannot be interpreted: %{error}.'
        certificate_expired: The certificate expired %{days} days ago. Renew it before
          authenticating.
        certificate_expiring: The certificate expires in %{days} days. Plan the renewal.
        certificate_file_missing: The configured certificate file (%{path}) does not
          exist.
        certificate_ok: Certificate valid; expires in %{days} days.
        certificate_path_unset: No certificate file has been selected.
        certificate_unreadable: The certificate file cannot be read (%{error}).
        clave_movil_identity_invalid: 'The DNI/NIE configured for Cl@ve Móvil is not
          valid: %{error}.'
        clave_movil_identity_ok: The DNI/NIE configured for Cl@ve Móvil has a valid
          shape.
        clave_movil_identity_unset: No DNI/NIE has been configured for Cl@ve Móvil.
        no_provider: No auth provider is configured; nothing to probe locally.
        no_session: No persisted AEAT session token on disk; run `aeat config auth
          login` to acquire one.
        session_expired: Session expired
        session_live: Session active
    provider_impact:
      certificate_ready: Certificate auth is ready. The operator keeps the same CLI
        filing flow for AEAT-backed reads; every provider uses the same command workflow.
      generic_ready: '%{label} is ready. The operator keeps the same CLI filing flow
        while this provider plugs into the shared auth protocol.'
      unavailable: '%{label} is configured but not ready yet. The operator can still
        produce, verify, and export filings locally, but AEAT-backed reads stay unavailable
        until auth is fixed.'
      unconfigured: The operator can still produce, verify, and export filings locally,
        but AEAT-backed reads stay unavailable until an auth provider is configured.
    sessions:
      errors:
        clave_identity_missing: Cl@ve Móvil live auth requires a configured DNI/NIE
          (AEAT_CLAVE_MOVIL_DNI_NIE) before any AEAT session can be used.
        clave_identity_profile_mismatch: Cl@ve Móvil identity does not match the active
          profile tax identity; switch to the matching profile or update the profile
          before live AEAT auth.
        corrupt_session: Your saved auth session is damaged and cannot be read. Run
          `aeat config auth clear --sessions` and then `aeat config auth test`.
        no_session: No active AEAT session; run `aeat config auth test` before reading
          AEAT data.
        profile_tax_id_missing: Cl@ve Móvil live auth requires the active profile
          to carry identity.tax_id.
        sede_rejected: AEAT session is not accepted by the AEAT Sede; run `aeat config
          auth test` before reading AEAT data.
        session_expired: AEAT session is expired; run `aeat config auth test` before
          reading AEAT data.
        session_identity_profile_mismatch: AEAT session identity does not match the
          active profile tax identity; clear auth sessions and authenticate the matching
          profile before live AEAT reads.
        state_missing: AEAT session state is missing; run `aeat config auth test`
          before reading AEAT data.
        verify_failed: AEAT session could not be verified; run `aeat config auth test`
          before reading AEAT data.
  bucket_maintenance:
    errors:
      delete_active_bucket: application.bucket_maintenance.errors.delete_active_bucket
      delete_not_confirmed: application.bucket_maintenance.errors.delete_not_confirmed
  calculations:
    iva_compensation:
      errors:
        modelo_303_only: IVA compensation history only accepts Modelo 303 observations.
        modelo_390_only: IVA compensation annual summary only accepts Modelo 390 observations.
        seed_conflict: An IVA compensation state already exists for this period; seeding
          would overwrite stored history.
  filing:
    review:
      errors:
        approved_by_blank: The approver identifier must not be blank.
        draft_not_ready: Only drafts ready to submit may be approved.
        registry_review_mismatch: 'The draft does not match the registry review surface:
          %{codes}.'
      stale_reasons:
        approval_basis_version_changed: approval basis version changed
        category_profiles_changed: category profiles changed
        draft_payload_changed: draft payload changed
        draft_review_changed: draft validation surface changed
        schema_formula_changed: schema or formula provenance changed
        transaction_catalogue_changed: transaction catalogue changed
        unknown: '%{reason}'
    runtime:
      errors:
        active_profile_load_failed: 'The active filing profile could not be loaded:
          %{reason}.'
        blank_modelo_selection: Requested modelo selection must not contain blank
          modelo ids.
        filing_year_period_pair: filing_year and period must be supplied together.
        modelo_not_in_registry: Modelo %{modelo} is not present in the calculation
          registry.
        modelo_revision_missing: Modelo %{modelo} has no revisions.
        provider_year_missing: Modelo %{modelo} revision %{revision} has no provider
          year.
        registry_empty: The registry root %{registry_root_name} has no modelo definitions.
        registry_empty_for_period: The registry root has no modelo definitions for
          year %{filing_year} period %{period}.
        registry_missing_requested_modelos: 'The registry root is missing requested
          modelo definitions: %{modelos}.'
        unsupported_casilla_data_type: 'Unsupported registry casilla data type: %{data_type}.'
  inventory:
    service:
      errors:
        actividad_conflict: An inventory ledger already exists for activity %{actividad_id}
          and year %{year}.
        actividad_not_found: No inventory ledger exists for activity %{actividad_id}
          and year %{year}.
        duplicate_movement_id: The inventory ledger already contains movement %{movement_id}.
        invalid_valuation_method: 'The inventory valuation method is not supported:
          %{valuation_method}.'
  invoices:
    importing:
