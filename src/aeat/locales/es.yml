  source_mesh:
    errors:
      duplicate_binding_owner: aggregation.source_mesh.errors.duplicate_binding_owner
      duplicate_bound_casilla_owner: aggregation.source_mesh.errors.duplicate_bound_casilla_owner
      duplicate_relation_owner: aggregation.source_mesh.errors.duplicate_relation_owner
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: No se pudo adquirir el bloqueo de autenticación AEAT tras
          la recuperación del bloqueo obsoleto.
        lock_held: Ya hay otra operación de autenticación AEAT en curso para este
          perfil. No inicies una segunda petición de Cl@ve; espera a que termine el
          proceso en curso o deja expirar el bloqueo si ese proceso ha fallado.
        lock_held_suggestion: Ejecuta `aeat config auth status --format json` para
          inspeccionar el bloqueo de autenticación activo.
    certificate:
      health:
        file_missing: El archivo de certificado configurado (%{path}) no existe. Recupera
          el archivo o ejecuta 'aeat config auth configure --provider certificate
          --file RUTA' con una ruta válida.
        path_unset: No se ha seleccionado un archivo de certificado. Ejecuta 'aeat
          config auth configure --provider certificate --file RUTA' para indicarlo.
      load:
        password_unset: No hay contraseña de certificado configurada. Configura
          la contraseña del certificado antes de continuar.
        path_unset: No hay archivo de certificado configurado. Ejecuta 'aeat config
          auth configure --provider certificate --file RUTA' para indicarlo.
    clave_movil:
      health:
        identity_unset: No se ha configurado un DNI/NIE para Cl@ve Móvil. Configúralo
          antes de continuar.
        operator_completion_required: Preparado; requiere finalización de Cl@ve mediada
          por el operador.
    operator:
      alignment:
        both_missing_detail: No están configurados ni la identidad Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          ni el identificador fiscal del perfil activo. Configura ambos con el mismo
          DNI/NIE antes de la autenticación AEAT en directo.
        both_missing_next_action: Edita el perfil activo con 'aeat config profile
          edit NOMBRE --tax-id DNI/NIE' y configura el mismo DNI/NIE para Cl@ve Móvil.
        clave_identity_missing_detail: La identidad Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          no está configurada, por lo que no se puede comparar con el identificador
          fiscal del perfil activo. Configúrala con el DNI/NIE del perfil activo.
        clave_identity_missing_next_action: Configura el DNI/NIE de Cl@ve Móvil con
          el mismo identificador fiscal que el perfil activo.
        mismatch_detail: El DNI/NIE de la identidad Cl@ve '%{clave_identity}' no coincide
          con el identificador fiscal del perfil activo '%{profile_tax_id}'. La autenticación
          AEAT en directo vincularía la sesión de un contribuyente a otro perfil.
          Cambia al perfil cuyo identificador fiscal coincida con el DNI/NIE de Cl@ve,
          o corrige el valor que sea erróneo.
        mismatch_next_action: Cambia al perfil cuyo identificador fiscal coincida
          con el DNI/NIE de Cl@ve Móvil, o corrige el valor que sea erróneo.
        profile_tax_id_missing_detail: El perfil activo no tiene identificador fiscal,
          por lo que no se puede comparar con la identidad Cl@ve. Configura el identificador
          fiscal del perfil con el DNI/NIE usado para Cl@ve.
        profile_tax_id_missing_next_action: Edita el perfil activo con 'aeat config
          profile edit NOMBRE --tax-id DNI/NIE' antes de la autenticación.
      errors:
        certificate_file_required: El proveedor de certificado requiere un archivo
          de certificado. Ejecuta `aeat config auth configure --provider certificate
          --file RUTA` con la ruta a tu paquete PKCS#12 (.p12/.pfx).
        certificate_file_unresolved: La ruta del certificado '%{certificate_path}'
          no resuelve a un archivo existente. Ejecuta `aeat config auth configure
          --provider certificate --file RUTA` con una ruta a tu paquete PKCS#12 (.p12/.pfx).
        dangling_active_profile: El puntero de perfil activo '%{active_profile}' no
          resuelve a un bucket de perfil registrado. Ejecuta `aeat config profile
          list` para inspeccionar los perfiles registrados y después `aeat config
          profile switch NAME` o `aeat config profile create NAME`.
        no_active_bucket: No hay un perfil activo; ejecuta `aeat config profile create
          NAME` antes de configurar la autenticación.
        unreadable_active_profile: El perfil activo '%{active_profile}' tiene un manifiesto
          de bucket pero no tiene un registro de perfil legible (status=%{status}).
          Ejecuta `aeat config repair profile --clear-active --yes` y después cambia
          a un perfil válido o créalo antes de configurar autenticación.
      login:
        refused_certificate_file_missing: 'No se puede iniciar sesión: el archivo
          de certificado configurado (%{path}) no existe. Recupera el archivo o vuelve
          a configurar la ruta antes de continuar.'
        refused_certificate_path_unset: 'No se puede iniciar sesión: aún no se ha
          seleccionado un archivo de certificado. Ejecuta ''aeat config auth configure
          --provider certificate --file RUTA'' antes de continuar.'
        refused_clave_movil_identity_unset: 'No se puede iniciar sesión con Cl@ve
          Móvil: aún no se ha configurado un DNI/NIE. Configúralo antes de continuar.'
        refused_live_tests_disabled: 'El inicio de sesión en directo está deshabilitado
          por seguridad: la herramienta sólo construye y verifica localmente. Habilita
          la opción de pruebas en directo si realmente quieres conectarte a la AEAT,
          y vuelve a ejecutar este comando. Proveedor solicitado: %{provider}.'
      probe:
        certificate_corrupt: El archivo de certificado no es un PKCS#12 válido o falta
          la contraseña; no se puede analizar.
        certificate_corrupt_detail: 'El certificado no se puede interpretar: %{error}.'
        certificate_expired: El certificado ha caducado hace %{days} días. Renuévalo
          antes de la autenticación.
        certificate_expiring: El certificado caduca dentro de %{days} días. Programa
          la renovación.
        certificate_file_missing: El archivo de certificado configurado (%{path})
          no existe.
        certificate_ok: Certificado válido; caduca dentro de %{days} días.
        certificate_path_unset: No se ha seleccionado un archivo de certificado.
        certificate_unreadable: El archivo de certificado no se puede leer (%{error}).
        clave_movil_identity_invalid: 'El DNI/NIE configurado para Cl@ve Móvil no
          es válido: %{error}.'
        clave_movil_identity_ok: El DNI/NIE configurado para Cl@ve Móvil tiene una
          forma válida.
        clave_movil_identity_unset: No se ha configurado un DNI/NIE para Cl@ve Móvil.
        no_provider: No hay ningún proveedor de autenticación configurado; nada que
          comprobar localmente.
        no_session: No hay ningún token de sesión AEAT persistido en disco; ejecuta
          `aeat config auth login` para obtener uno.
        session_expired: Hay un token de sesión AEAT persistido en disco pero ha superado
          su límite de inactividad; ejecuta `aeat config auth login --fresh` para
          renovarlo.
        session_live: Hay un token de sesión AEAT persistido en disco y dentro de
          su límite de inactividad.
    provider_impact:
      certificate_ready: La autenticación con certificado está lista. El operador
        mantiene el mismo flujo de presentación en la CLI para lecturas respaldadas
        por la AEAT; todos los proveedores utilizan el mismo flujo de comandos.
      generic_ready: '%{label} está listo. El operador mantiene el mismo flujo de
        presentación en la CLI mientras este proveedor se conecta al protocolo de
        autenticación compartido.'
      unavailable: '%{label} está configurado pero aún no está listo. El operador
        todavía puede generar, verificar y exportar presentaciones localmente, pero
        las lecturas respaldadas por la AEAT permanecerán no disponibles hasta que
        se solucione la autenticación.'
      unconfigured: El operador todavía puede generar, verificar y exportar presentaciones
        localmente, pero las lecturas respaldadas por la AEAT permanecerán no disponibles
        hasta que se configure un proveedor de autenticación.
    sessions:
      errors:
        clave_identity_missing: La autenticación Cl@ve Móvil en directo requiere un
          DNI/NIE configurado (AEAT_CLAVE_MOVIL_DNI_NIE) antes de usar cualquier sesión
          AEAT.
        clave_identity_profile_mismatch: La identidad de Cl@ve Móvil no coincide con
          la identidad fiscal del perfil activo; cambia al perfil que coincida o actualiza
          el perfil antes de la autenticación AEAT en directo.
        corrupt_session: La sesión de autenticación guardada está dañada y no se puede
          leer. Ejecuta `aeat config auth clear --sessions` y después `aeat config
          auth test`.
        no_session: No hay sesión AEAT activa; ejecuta `aeat config auth test` antes
          de leer datos AEAT.
        profile_tax_id_missing: La autenticación Cl@ve Móvil en directo requiere que
          el perfil activo tenga identity.tax_id.
        sede_rejected: La sesión AEAT no es aceptada por la Sede; ejecuta `aeat config
          auth test` antes de leer datos AEAT.
        session_expired: La sesión AEAT ha caducado; ejecuta `aeat config auth test`
          antes de leer datos AEAT.
        session_identity_profile_mismatch: La identidad de la sesión AEAT no coincide
          con la identidad fiscal del perfil activo; borra las sesiones de autenticación
          y autentica el perfil que coincida antes de las lecturas AEAT en directo.
        state_missing: Falta el estado de la sesión AEAT; ejecuta `aeat config auth
          test` antes de leer datos AEAT.
        verify_failed: No se ha podido verificar la sesión AEAT; ejecuta `aeat config
          auth test` antes de leer datos AEAT.
