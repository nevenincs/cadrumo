    auth_google_client_not_registered: No hay ningún cliente OAuth de escritorio de
      Google registrado para el perfil activo. Registra un cliente para usar funciones
      de Google.
    auth_google_client_revoked: El cliente OAuth de escritorio de Google registrado
      ha sido revocado. Registra un cliente nuevo.
