adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: La AEAT rechazó emitir una nueva solicitud push
          de Cl@ve Móvil porque una petición de autenticación anterior aún está pendiente
          en el servidor.
      suggestions:
        reject_pending_request: Abre la app Cl@ve en tu móvil, rechaza todas las peticiones
          pendientes y vuelve a ejecutar `aeat config auth test` (o espera hasta 5
          minutos a que la AEAT las cancele automáticamente).
    sede:
      groi:
        suggestions:
          shape_change: Vuelve a ejecutar el oráculo en vivo después de comprobar
            si la AEAT ha cambiado el formulario GROI.
      nif_iva:
        suggestions:
          shape_change: Vuelve a ejecutar el oráculo en vivo después de comprobar
            si la AEAT ha cambiado el formulario NIF-IVA.
      renta_web_open:
        suggestions:
          shape_change: Vuelve a ejecutar el oráculo en vivo después de comprobar
            si la AEAT ha cambiado la página Renta WEB Open.
  auth:
    authenticator:
      errors:
        already_active: AeatAuthenticator ya tiene una sesion activa; llame a close()
          o reauthenticate() antes de autenticar de nuevo.
        already_active_before_resume: AeatAuthenticator ya tiene una sesión activa;
          llame a close() antes de reanudar.
        assertion_failed: La autenticacion AEAT no produjo una asercion de inicio
          de sesion valida.
        capture_requires_active_session: capture_storage_state() requiere la sesión
          autenticada actualmente activa.
        capture_requires_certificate: capture_storage_state() requiere una sesión
          respaldada por certificado con metadatos de handshake.
        closing: El autenticador está cerrando; no se permiten nuevas operaciones
          verify_login.
        context_marker_missing: El contexto del navegador no está etiquetado con el
          marcador de certificado esperado.
        metadata_parse_failed: Los metadatos persistidos no produjeron un modelo analizado.
        no_active_context: No hay contexto de navegador activo; llame a authenticate()
          primero.
        no_context_capture_storage: No hay contexto de navegador activo; no se puede
          capturar el estado de almacenamiento.
        persisted_session_verification_failed: La sesión persistida del navegador
          AEAT falló la verificación en vivo.
        resume_failed: La reanudacion de la sesion AEAT persistida no produjo un contexto
          utilizable.
        session_stale: La sesión AEAT ha caducado; el plazo de inactividad ha expirado.
    clave_movil:
      errors:
        already_active: Cl@ve Móvil ya tiene una sesión activa; llame a close() antes
          de autenticarse de nuevo.
        approval_timeout: La autenticación por navegador Cl@ve Móvil no se completó
          en el tiempo configurado.
        dni_nie_not_set: AEAT_CLAVE_MOVIL_DNI_NIE no está configurado; configure su
          DNI o NIE antes de autenticarse.
        initial_navigation_timeout: La navegacion inicial a Cl@ve Movil no se completo
          dentro del tiempo configurado.
        metadata_invalid: Los metadatos de sesión de Cl@ve Móvil son inválidos o no
          pueden analizarse.
        no_persisted_session: No se encontro sesion de Cl@ve Movil; ejecute `aeat
          config auth status` primero.
        page_missing_click: La pagina de Playwright no expone click(); no se puede
          operar la entrada de Cl@ve Movil.
        session_expired: La sesion de Cl@ve Movil ha superado su plazo de inactividad.
        storage_state_hash_mismatch: El hash del estado de almacenamiento de Cl@ve
          Movil no coincide; los datos de sesion pueden estar corruptos.
        verify_requires_active_context: Cl@ve Móvil verify() requiere un contexto
          de navegador activo; llame a authenticate() primero.
  google:
    calc_sheets:
      errors:
        api_call_failed: La llamada a Google {action} ha fallado.
        api_call_refused: La llamada a Google {action} fue rechazada (HTTP {status}).
        api_target_not_found: El destino de Google {action} no se encontró.
        conflicting_duplicate_metadata: La hoja de Google contiene metadatos AEAT
          duplicados y contradictorios.
        foreign_spreadsheet_not_owned: La hoja de Google no está marcada como propiedad
          de este perfil AEAT.
        googleapiclient_not_importable: googleapiclient no se puede importar; el adaptador
          de Google no puede acceder a la API.
        spreadsheet_id_blank: El id de la hoja de cálculo de Google no puede estar
          vacío.
        workbook_snapshot_mismatch: Los metadatos de la hoja de Google no coinciden
          con la instantánea de cálculo.
      suggestions:
        reexport_then_pull: Vuelve a exportar el libro con `aeat config google sync
          calc export` y después vuelve a importarlo.
        reexport_workbook: Vuelve a exportar el libro con `aeat config google sync
          calc export` para renovar los metadatos gestionados por la aplicación.
        verify_exported_workbook: Comprueba que la hoja se creó originalmente con
          `aeat config google sync calc export` para este perfil.
    oauth_flow:
      errors:
        browser_launcher_refused: El sistema operativo rechazó abrir la URL de consentimiento
          OAuth en el navegador.
        client_config_refused: La configuración del cliente Google OAuth fue rechazada.
        email_claim_missing: El id_token de Google se verificó pero no incluye la
          reclamación email.
        endpoint_unreachable: El endpoint OAuth de Google no es accesible.
        id_token_missing: Google no devolvió un id_token; el consentimiento OAuth
          no incluyó los ámbitos openid+email.
        id_token_module_not_importable: El módulo id_token de google-auth no se puede
          importar.
        id_token_verification_failed: La verificación del id_token de Google ha fallado.
        loopback_bind_failed: El receptor OAuth loopback local no pudo asignar un
          puerto.
        non_interactive: 'Google OAuth rechazado: el flujo interactivo de consentimiento
          en el navegador necesita un terminal interactivo, pero este comando se ejecutó
          de forma no interactiva.'
        oauthlib_not_importable: google-auth-oauthlib no se puede importar; el flujo
          OAuth no puede iniciarse.
        profile_state_unresolved: Google OAuth no puede resolver el estado del perfil
          AEAT seleccionado.
        scope_missing: La pantalla de consentimiento de Google se cerró sin conceder
          todos los ámbitos requeridos.
        unsecured_mode_refused: Google OAuth se rechazó porque el almacén de secretos
          está en modo inseguro y el perfil activo lleva un identificador fiscal español
          real.
      suggestions:
        close_loopback_port: Cierra la aplicación que esté ocupando un puerto loopback
          huérfano y vuelve a intentarlo.
        open_consent_url_manually: Abre manualmente en tu navegador la URL de consentimiento
          impresa.
        repair_profile_state: Ejecuta `aeat config profile health` y repara o cambia
          el perfil activo antes de reintentar el comando de Google.
        run_from_interactive_terminal: Ejecuta 'aeat config google login' desde un
          terminal interactivo con un navegador web disponible.
        use_keyring_or_synthetic: Configura aeat_secret_store_backend=keyring o cambia
          el perfil activo a un identificador fiscal sintético de prueba.
    profile_binding:
      errors:
        no_active_profile: No hay ningún perfil AEAT activo enlazado para Google OAuth.
      suggestions:
        create_profile: Ejecuta `aeat config profile create NAME --tax-id <NIF/CIF/DNI/NIE>`
          y vuelve a intentar el comando de Google.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'Falló la extracción de la declaración con el perfil {profile}:
          {details}'
        modelo_conflict: --modelo {modelo!r} entra en conflicto con el modelo detectado
          {detected!r}.
        period_unresolved: No se pudo resolver el periodo de la declaración a partir
          del texto del PDF.
        profile_count_invalid: 'Se esperaba exactamente un perfil de extracción de
          PDF de declaración para modelo={modelo}; disponibles: {available}.'
        profile_unavailable: El perfil de extracción de declaración {profile!r} no
          está disponible para modelo={modelo}.
        registry_snapshot_required: 'La extracción de declaración requiere un snapshot
          validado del registro para modelo={modelo} año={year} periodo={period}:
          {error}'
        snapshot_modelo_conflict: El modelo del snapshot del registro {snapshot_modelo!r}
          entra en conflicto con el detectado {detected!r}.
        tax_id_unresolved: No se pudo resolver el identificador fiscal de la declaración
          a partir del texto del PDF.
        template_not_detected: No se pudo detectar automáticamente la plantilla de
          {path}; indica --modelo y --año para forzarla.
        year_conflict: --año {year} entra en conflicto con el año detectado {detected}.
    financial:
      providers:
        pdf_n26:
          errors:
            parse_failed: No se pudo analizar el extracto PDF de N26. La ruta de origen
              se ha ocultado en los diagnósticos.
    justificante:
      errors:
        parse_failed: No se pudo analizar el PDF del justificante. La ruta de origen
          se ha ocultado en los diagnósticos.
    pdf:
      errors:
        hash_failed: No se pudo calcular la huella del PDF.
  outbound:
    storage:
      factory:
        errors:
          drive_root_missing: No hay ningun id de carpeta raiz de Google Drive configurado
            para el perfil activo. Ejecuta `aeat config google folder set <id>` primero.
          google_auth_import_failed: La dependencia google-auth no se puede importar;
            ejecuta `uv sync` y reintentalo.
          google_client_missing: No hay ningun cliente OAuth de Google registrado
            para el perfil activo. Ejecuta `aeat config google register --client-json
            <path>` primero.
          google_token_missing: No hay ningun token OAuth de Google persistido para
            el perfil activo. Ejecuta `aeat config google login` primero.
          kind_empty: AEAT_STORAGE_PROVIDER_KIND esta vacio.
          kind_unhandled: El tipo de proveedor de almacenamiento {kind} no esta gestionado
            por la factoria.
          kind_unknown: El tipo de proveedor de almacenamiento {value} no se reconoce;
            se esperaba uno de {expected}.
      google_drive:
        errors:
          content_hash_blank: El hash de contenido de Google Drive no puede estar
            vacio.
          content_hash_mismatch: El hash de contenido de Google Drive no coincide;
            fallo la comprobacion de integridad.
          create_namespace_no_id: Google Drive no devolvio un id al crear la carpeta
            de espacio de nombres.
          create_vault_folder_no_id: Google Drive no devolvio un id al crear la carpeta
            vault.
          folder_not_owned: La carpeta de Drive {folder_name} no esta marcada como
            propiedad de esta app; se rechaza la escritura para proteger datos del
            operador.
          googleapiclient_import_failed: La dependencia google-api-python-client no
            se puede importar; ejecuta `uv sync` y reintentalo.
          media_non_bytes: La descarga de medios de Google Drive devolvio {payload_type}
            en vez de bytes.
          namespace_blank: El espacio de nombres de almacenamiento de Google Drive
            no puede estar vacio.
          namespace_forbidden_characters: El espacio de nombres de Google Drive {namespace}
            contiene caracteres de ruta prohibidos.
          namespace_not_found: No se encontro el espacio de nombres de Google Drive
            {namespace}.
          object_key_hmac_blank: El HMAC de clave de objeto de Google Drive no puede
            estar vacio.
          object_not_found: No se encontro el objeto de Google Drive {object_key_hmac}
            en el espacio {namespace}.
          request_failed: La peticion de Google Drive {action} fallo con estado {status}.
          root_folder_id_blank: El id de carpeta raiz de Google Drive no puede estar
            vacio.
          vault_entry_not_folder: La raiz configurada de Drive contiene {vault_folder_name},
            pero esa entrada no es una carpeta.
          vault_folder_name_blank: El nombre de carpeta vault de Google Drive no puede
            estar vacio.
          write_non_dict_response: La respuesta de escritura de Google Drive para
            {action} tuvo una forma inesperada.
      local:
        errors:
          byte_length_invalid: El byte_length del sidecar local tiene tipo invalido
            {actual_type}.
          content_hash_blank: El hash de contenido local no puede estar vacio.
          content_hash_mismatch: El hash de contenido local no coincide; fallo la
            comprobacion de integridad.
          namespace_blank: El espacio de nombres de almacenamiento local no puede
            estar vacio.
          namespace_create_permission: El almacenamiento local no pudo crear el espacio
            de nombres {namespace}.
          namespace_forbidden_characters: El espacio de nombres local {namespace}
            contiene caracteres de ruta prohibidos.
          namespace_not_found: No se encontro el espacio de nombres local {namespace}.
          object_delete_permission: El almacenamiento local no pudo borrar el payload
            del objeto.
          object_key_hmac_blank: El HMAC de clave de objeto local no puede estar vacio.
          object_key_hmac_forbidden_characters: El HMAC de clave de objeto local {object_key_hmac}
            contiene caracteres prohibidos.
          object_not_found: No se encontro el objeto local {object_key_hmac} en el
            espacio {namespace}.
          payload_commit_failed: El almacenamiento local no pudo confirmar atomicamente
            el payload del objeto.
          payload_read_permission: El almacenamiento local no pudo leer el payload
            del objeto.
          payload_write_permission: El almacenamiento local no pudo escribir el payload
            del objeto.
          sidecar_malformed: El sidecar local {sidecar_path} no se puede leer o esta
            mal formado.
          sidecar_missing: Falta el sidecar del objeto local.
          sidecar_not_object: El sidecar local {sidecar_path} no es un objeto JSON.
          sidecar_write_failed: El almacenamiento local no pudo escribir el sidecar
            del objeto.
  persistence:
    profile:
      assets:
        errors:
          asset_already_exists: Ese activo ya existe en el libro cifrado de activos.
          load_amortizacion_ledger_failed: No se pudo cargar el libro cifrado de amortización.
          load_asset_ledger_failed: No se pudo cargar el libro cifrado de activos.
      inventory:
        errors:
          inventory_ledger_already_exists: Ese libro de inventario ya existe.
          inventory_ledger_not_found: No se encontró el libro de inventario solicitado.
          load_inventory_ledger_failed: No se pudo cargar el libro cifrado de inventario.
          movement_already_exists: Ese movimiento de inventario ya existe.
  sede:
    errors:
      cotejo_nav_failed: La navegación a la página de cotejo de AEAT falló; la sesión
        puede haber expirado. Ejecute 'aeat config auth test' y vuelva a intentarlo.
      ejercicio_unavailable: El registro de declaraciones de AEAT no ofrece el ejercicio
        solicitado para este modelo.
      empty_identity_nif: El NIF de identidad de la sesión AEAT está vacío; no se
        puede vincular la observación de presentación.
      form_render_timeout: El formulario del registro de declaraciones de AEAT no
        se renderizó en el tiempo establecido; la sesión puede haber expirado o AEAT
        está en mantenimiento.
      iva_wallet_empty_amount_cell: La celda de importe de la cartera de compensación
        de IVA está vacía.
      iva_wallet_empty_period_cell: La celda de periodo de la cartera de compensación
        de IVA está vacía.
      justificante_column_missing: La respuesta de declaraciones de AEAT no contiene
        la columna de justificante; la estructura de la tabla puede haber cambiado.
      listbox_missing: La respuesta de declaraciones de AEAT no contiene el contenedor
        de listado esperado; la estructura de la página puede haber cambiado.
      listing_nav_failed: La navegación al listado de declaraciones de AEAT falló.
        Compruebe la conectividad de red y vuelva a intentarlo.
      modelo_unavailable: El registro de declaraciones de la AEAT no ofrece el modelo
        solicitado.
      no_auth_session: La sesión de autenticación de AEAT no existe o no está persistida;
        ejecute primero `aeat config auth status`.
      parse_failed: No se pudo analizar la respuesta de declaraciones de AEAT; la
        estructura de la página puede haber cambiado.
      playwright_alert_modal_failed: Error al continuar el modal de alerta de AEAT.
      playwright_buscar_click_failed: Error al hacer clic en el botón Buscar de la
        Sede.
      playwright_combobox_open_failed: Error al abrir el cuadro combinado de la Sede.
      playwright_combobox_select_failed: Error al seleccionar una opción del cuadro
        combinado en la Sede.
      session_expired_nav_failed: El registro de declaraciones de AEAT no se cargó;
        la sesión probablemente ha expirado. Ejecute 'aeat config auth test' y vuelva
        a intentarlo.
aggregation:
  grouping:
    errors:
      unsupported_modelo: No hay contrato de agregación registrado para el modelo
        solicitado.
  iva_ledger:
    errors:
      bucket_mismatch: El bucket del repositorio de movimientos no coincide con el
        bucket de agregación solicitado.
      candidate_outside_period: 'Error interno: el candidato IVA cae fuera del periodo
        de agregacion.'
      unsupported_iva_category: 'Error interno: categoria IVA no admitida para la
        agregacion.'
  modelo_bindings:
    errors:
      unsupported_period: Periodo de modelo no soportado para la agregación del libro.
  per_modelo:
    errors:
      unsupported_modelo: Modelo no soportado para la agregación por modelo
  prorrata:
    errors:
      current_year_not_after_prior: El año actual debe ser estrictamente mayor que
        el año anterior.
      invalid_provisional_period: El período provisional debe ser un token trimestral
        (Qn) o mensual (Mnn).
      year_out_of_range: El año de agregación de prorrata está fuera del rango admitido
        2000-2100.
  renta_ledger:
    errors:
      annual_period_required: Se requiere un periodo anual para la agregación del
        libro de Renta.
      bucket_mismatch: El bucket del repositorio de movimientos no coincide con el
        bucket solicitado del libro de Renta.
      invoice_bucket_mismatch: El bucket del repositorio de facturas no coincide con
        el bucket solicitado del libro de Renta.
      modelo_mismatch: El modelo tributario no coincide con el modelo esperado del
        libro de Renta.
      period_mismatch: El periodo no coincide con el periodo esperado del libro de
        Renta.
      quarterly_period_required: Se requiere un periodo trimestral para la agregación
        de ingresos del Modelo 130 (p.ej. 2024Q1).
      unsupported_period: Se requiere un periodo anual para la agregación de ingresos
        del Modelo 100 (p.ej. 2024-0A).
  retenciones:
    errors:
      filing_year_out_of_range: El ejercicio %{filing_year} esta fuera del rango admitido
        %{min_year}-%{max_year}.
      perceptor_nif_blank: El NIF del perceptor no puede estar vacio.
      perceptor_observations_missing: No existen observaciones de retenciones por
        perceptor para el modelo %{modelo} %{filing_year} %{period}; la fuente %{source_kind}
        no puede resolverse.
  service:
    errors:
      envelope_modelo_mismatch: El modelo del envoltorio no coincide con el modelo
        esperado.
      envelope_period_mismatch: El periodo del envoltorio no coincide con el periodo
        esperado.
      envelope_provider_payload_mismatch: La carga del proveedor del envoltorio no
        coincide con la esperada.
      observations_mismatch: Las observaciones devueltas no coinciden con las esperadas.
      per_modelo_modelos_not_unique: Los modelos por modelo no son unicos.
      per_modelo_providers_not_unique: Los proveedores por modelo no son unicos.
      provider_modelos_not_unique: Los modelos del proveedor no son unicos.
      result_source_kinds_not_unique: Los tipos de fuente del resultado no son unicos.
      source_kinds_mismatch: Los tipos de fuente no coinciden con la taxonomia aceptada.
  source_mesh:
    errors:
      ambiguous_source_disposition: aggregation.source_mesh.errors.ambiguous_source_disposition
      duplicate_binding_owner: 'Error interno: propietario de vinculacion duplicado
        en la malla de fuentes.'
      duplicate_bound_casilla_owner: 'Error interno: propietario de casilla vinculada
        duplicado en la malla de fuentes.'
      duplicate_relation_owner: 'Error interno: propietario de relacion duplicado
        en la malla de fuentes.'
      owned_sources_blank: Las fuentes propiedad del mallado de fuentes no pueden
        contener tipos de fuente en blanco.
      owned_sources_duplicate: Las fuentes propiedad del mallado de fuentes deben
        ser únicas.
      source_transaction_ids_blank: Los identificadores de transacción del mallado
        de fuentes no pueden contener blancos.
      source_transaction_ids_duplicate: Los identificadores de transacción del mallado
        de fuentes deben ser únicos.
      unresolved_binding_ids_blank: aggregation.source_mesh.errors.unresolved_binding_ids_blank
      unresolved_binding_ids_duplicate: aggregation.source_mesh.errors.unresolved_binding_ids_duplicate
      unresolved_relation_ids_blank: aggregation.source_mesh.errors.unresolved_relation_ids_blank
      unresolved_relation_ids_duplicate: aggregation.source_mesh.errors.unresolved_relation_ids_duplicate
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: No se pudo adquirir el bloqueo de autenticación AEAT tras
          la recuperación del bloqueo obsoleto.
        lock_held: Ya hay otra operación de autenticación AEAT en curso para este
          perfil. No inicies una segunda petición de Cl@ve; espera a que termine el
          proceso en curso o deja expirar el bloqueo si ese proceso ha fallado.
        lock_held_suggestion: Ejecuta `aeat config auth status --format json` para
          inspeccionar el bloqueo de autenticación activo.
    certificate:
      health:
        file_missing: El archivo de certificado configurado (%{path}) no existe. Recupera
          el archivo o ejecuta 'aeat config auth configure --provider certificate
          --file RUTA' con una ruta válida.
        path_unset: No se ha seleccionado un archivo de certificado. Ejecuta 'aeat
          config auth configure --provider certificate --file RUTA' para indicarlo.
        unavailable: El estado del certificado no está disponible; consulta los registros
          de depuración para los detalles de diagnóstico.
      load:
        password_unset: No hay contraseña de certificado configurada. Configura la
          contraseña del certificado antes de continuar.
        path_unset: No hay archivo de certificado configurado. Ejecuta 'aeat config
          auth configure --provider certificate --file RUTA' para indicarlo.
    clave_movil:
      health:
        identity_unset: No se ha configurado un DNI/NIE para Cl@ve Móvil. Configúralo
          antes de continuar.
        operator_completion_required: Preparado; requiere finalización de Cl@ve mediada
          por el operador.
    errors:
      provider_reserved: El proveedor de autenticación {provider} está reservado y
        no está implementado.
      session_field_not_datetime: El campo {field} de sesión persistida debe ser una
        fecha-hora o cadena ISO-8601.
    operator:
      alignment:
        both_missing_detail: No están configurados ni la identidad Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          ni el identificador fiscal del perfil activo. Configura ambos con el mismo
          DNI/NIE antes de la autenticación AEAT en directo.
        both_missing_next_action: Edita el perfil activo con 'aeat config profile
          edit NOMBRE --tax-id DNI/NIE' y configura el mismo DNI/NIE para Cl@ve Móvil.
        clave_identity_missing_detail: La identidad Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          no está configurada, por lo que no se puede comparar con el identificador
          fiscal del perfil activo. Configúrala con el DNI/NIE del perfil activo.
        clave_identity_missing_next_action: Configura el DNI/NIE de Cl@ve Móvil con
          el mismo identificador fiscal que el perfil activo.
        mismatch_detail: El DNI/NIE de la identidad Cl@ve '%{clave_identity}' no coincide
          con el identificador fiscal del perfil activo '%{profile_tax_id}'. La autenticación
          AEAT en directo vincularía la sesión de un contribuyente a otro perfil.
          Cambia al perfil cuyo identificador fiscal coincida con el DNI/NIE de Cl@ve,
          o corrige el valor que sea erróneo.
        mismatch_next_action: Cambia al perfil cuyo identificador fiscal coincida
          con el DNI/NIE de Cl@ve Móvil, o corrige el valor que sea erróneo.
        profile_tax_id_missing_detail: El perfil activo no tiene identificador fiscal,
          por lo que no se puede comparar con la identidad Cl@ve. Configura el identificador
          fiscal del perfil con el DNI/NIE usado para Cl@ve.
        profile_tax_id_missing_next_action: Edita el perfil activo con 'aeat config
          profile edit NOMBRE --tax-id DNI/NIE' antes de la autenticación.
      errors:
        certificate_file_required: El proveedor de certificado requiere un archivo
          de certificado. Ejecuta `aeat config auth configure --provider certificate
