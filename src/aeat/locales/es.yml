  catalogue:
    label_587258: Operación interior al tipo general (21 %)
    description_811453: Entregas de bienes y prestaciones de servicios realizadas
      en el territorio de aplicación del impuesto al tipo general del 21 %.
    triggers_when_652065: El bien o servicio no está incluido en los listados del
      Art. 91 ni en las exenciones del Art. 20.
    iva_treatment_375461: Se repercute el 21 % en la factura y se declara en Modelo
      303.
    label_247329: Operación interior al tipo reducido (10 %)
    description_140564: 'Entregas de bienes y prestaciones de servicios a los que
      el Art. 91.Uno aplica el tipo reducido del 10 %: alimentación general, hostelería,
      transporte de viajeros, vivienda nueva.'
    triggers_when_135246: El bien o servicio figura en el listado del Art. 91.Uno.
    iva_treatment_180667: Se repercute el 10 % en la factura y se declara en Modelo
      303.
    label_152655: Operación interior al tipo súper-reducido (4 %)
    description_669130: 'Bienes y servicios de primera necesidad a los que el Art.
      91.Dos aplica el tipo súper-reducido del 4 %: pan común, leche, huevos, frutas,
      libros, medicamentos, prótesis, VPO de régimen especial.'
    triggers_when_337687: El bien o servicio figura en el listado del Art. 91.Dos.
    iva_treatment_850584: Se repercute el 4 % en la factura y se declara en Modelo
      303.
    label_335037: Operación interior al tipo cero
    description_650743: Entregas a las que se aplica un tipo cero transitorio o estructural
      (exenciones plenas con derecho a deducción).
    triggers_when_900269: Una norma transitoria o la exención del Art. 24 habilita
      el tipo cero.
    iva_treatment_801453: Se factura al 0 % y se declara en Modelo 303 conservando
      el derecho a deducir.
    label_251820: Operación interior exenta
    description_279007: 'Entregas de bienes y prestaciones de servicios interiores
      expresamente exentas conforme al Art. 20: sanidad, enseñanza, financieras, seguros,
      inmobiliarias sin renuncia.'
    triggers_when_752126: La actividad o bien figura en el listado del Art. 20.Uno.
    iva_treatment_461076: No se repercute IVA; la exención es limitada (sin derecho
      a deducir el IVA soportado) y se declara en casillas específicas del Modelo
      303.
    label_721417: Operación no sujeta al IVA
    description_795493: 'Operaciones que caen fuera del hecho imponible del IVA conforme
      al Art. 7: transmisión de unidades económicas autónomas, servicios prestados
      por empleados, muestras gratuitas.'
    triggers_when_890848: El supuesto está enumerado en el Art. 7 como no sujeto.
    iva_treatment_236002: No hay hecho imponible; no se factura IVA ni se declara
      como operación IVA.
    label_799700: Operación interior con inversión del sujeto pasivo
    description_496471: 'Entregas de bienes o prestaciones de servicios interiores
      en las que el adquirente o destinatario asume la condición de sujeto pasivo
      y autoliquida la cuota (Art. 84.Uno.2º): ejecuciones de obra de construcción,
      entregas de desechos y materiales de recuperación, entregas de teléfonos móviles,
      consolas, ordenadores portátiles y tabletas digitales entre empresarios.'
    triggers_when_019278: El supuesto encaja en alguno de los apartados del Art. 84.Uno.2º
      (construcción, residuos, electrónica de consumo entre empresarios, etc.).
    iva_treatment_632365: El emisor expide la factura sin IVA repercutido y hace constar
      'inversión del sujeto pasivo'. El destinatario autoliquida la cuota devengada
      y, en su caso, la deduce en el mismo modelo 303.
    label_718631: Entrega intracomunitaria exenta
    description_746004: Entrega de bienes expedidos desde España a otro Estado miembro
      cuyo destinatario tiene NIF-VAT válido, exenta por el Art. 25.
    triggers_when_621296: El adquirente es empresario o profesional identificado a
      efectos del IVA en otro Estado miembro y los bienes salen del TAI.
    iva_treatment_977632: Se factura sin IVA con mención 'exenta Art. 25 Ley 37/1992'
      y se declara en Modelo 303 y Modelo 349.
    label_196484: Adquisición intracomunitaria con inversión del sujeto pasivo
    description_609600: Compra de bienes procedentes de otro Estado miembro por un
      empresario o profesional español; se autorrepercute el IVA y se deduce en la
      misma declaración.
    triggers_when_030936: El adquirente es empresario o profesional español y el proveedor
      actúa con su NIF-VAT intracomunitario.
    iva_treatment_124024: Se autorrepercute el IVA en Modelo 303 (IVA devengado y
      soportado al mismo tiempo) y se declara en Modelo 349.
    label_772607: Operación triangular intracomunitaria
    description_869664: Operación en cadena entre tres empresarios de tres Estados
      miembros en la que el intermediario no tributa en destino.
    triggers_when_430467: Se cumplen los requisitos del Art. 26.tres para la triangulación
      simplificada.
    iva_treatment_816317: Se declara como operación intracomunitaria con clave T en
      Modelo 349.
    label_486415: Exportación a país tercero exenta
    description_233971: Entrega de bienes expedidos con destino fuera de la Comunidad,
      exenta con derecho a deducción conforme al Art. 21.
    triggers_when_283979: Los bienes abandonan el territorio aduanero de la Unión
      con despacho de exportación.
    iva_treatment_781772: Se factura sin IVA con mención 'exenta Art. 21 Ley 37/1992'
      y se conserva el DUA como justificante; se declara en Modelo 303.
    label_362155: Importación de país tercero
    description_847172: Entrada en el territorio de aplicación del impuesto de bienes
      procedentes de países no miembros; devengo en Aduana conforme al Art. 17 y 18.
    triggers_when_791426: Se formaliza el DUA y se liquida el IVA a la importación.
    iva_treatment_861572: El IVA lo liquida la Aduana (o se difiere con el modelo
      303 mediante inversión del sujeto pasivo si el importador está acogido al régimen
      de diferimiento).
    label_014211: Recargo de equivalencia
    description_763220: Régimen especial obligatorio para comerciantes minoristas
      personas físicas que grava las compras del minorista con un recargo adicional
      sobre el IVA (5.2 / 1.4 / 0.5).
    triggers_when_309904: El destinatario es un comerciante minorista persona física
      acogido al régimen especial del recargo de equivalencia.
    iva_treatment_535387: El proveedor repercute el IVA más el recargo; el minorista
      no presenta Modelo 303 ni Modelo 390 por su actividad.
    label_089574: Régimen simplificado del IVA
    description_187074: Régimen especial de determinación de cuotas mediante índices
      y módulos para actividades recogidas en la Orden Ministerial anual.
    triggers_when_519525: La actividad del autónomo está recogida en la Orden HFP
      vigente y no ha renunciado al régimen.
    iva_treatment_958350: Se liquidan cuotas mediante Modelo 303 trimestral con índices
      anuales.
    label_097134: Operación no sujeta (localización fuera del TAI)
    description_904421: Operaciones cuyo lugar de realización se sitúa fuera del territorio
      de aplicación del impuesto conforme a las reglas de localización de los Arts.
      68 a 74.
    triggers_when_667229: Las reglas de localización sitúan la operación fuera del
      TAI y Ley 37/1992 no la considera sujeta.
    iva_treatment_483772: No se repercute IVA español; se informa en la declaración
      y puede requerir identificación VAT en el país de destino.
    label_377629: Factura errónea (rectificable)
    description_194881: Factura recibida o emitida con datos incorrectos (base, cuota,
      destinatario, tipo) que debe rectificarse antes de ser declarada.
    triggers_when_429116: Se detecta un error en la factura antes o después de la
      declaración.
    iva_treatment_872751: Se emite factura rectificativa conforme al Art. 89 y se
      ajusta la declaración del período correspondiente.
    label_313422: Régimen IVA desconocido
    description_635057: Sentinela para transacciones cuya categoría IVA no ha podido
      determinarse automáticamente y requieren revisión humana.
    triggers_when_617948: El clasificador no encuentra ninguna regla aplicable con
      suficiente confianza.
    iva_treatment_366559: Se marca la transacción para revisión humana antes de declarar.
