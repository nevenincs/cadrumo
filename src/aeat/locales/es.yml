      a autenticarte para crear una sesión nueva.
    auth_session_deserialization: Los datos de sesion de autenticacion almacenados
      no se pudieron deserializar. Vuelve a autenticarte para crear una sesion nueva.
    auth_session_unavailable: No hay ninguna sesión activa verificada con la AEAT
      disponible. Autentícate antes de continuar.
    auth_storage_bucket_recovery_verification: El código de recuperación introducido
      no es válido. Vuelve a escribir las 24 palabras exactamente como aparecen en
      la copia de seguridad.
    auth_storage_keyring_unavailable: El llavero del sistema operativo no está disponible.
      Comprueba que haya un almacén de credenciales instalado y activo.
    auth_storage_master_key_kdf_version: El archivo de clave maestra usa una versión
      de derivación de clave que esta versión de la aplicación no admite. Actualiza
      la aplicación.
    auth_storage_master_key_material_missing: No existe material de clave maestra.
      El almacenamiento seguro aún no está aprovisionado.
    auth_storage_master_key_passphrase_mismatch: La frase de contrasena no abre la
      clave maestra. Vuelve a introducirla; si la has olvidado, ejecuta aeat config
      recover --recovery-key <WORDS>.
    auth_storage_master_key_unavailable: No se pudo obtener la clave maestra de ningún
      proveedor. Comprueba el llavero o la frase de contraseña de la copia de seguridad.
