      errors:
        dangling_active_profile: El punter de perfil actiu '%{active_profile}' no
          resol a un bucket de perfil registrat. Executa `aeat config profile list`
          per inspeccionar els perfils registrats i després `aeat config profile switch
          NAME` o `aeat config profile create NAME`.
        no_active_bucket: No hi ha cap perfil actiu; executa `aeat config profile
          create NAME` abans de configurar l'autenticació.
        unreadable_active_profile: El perfil actiu '%{active_profile}' té un manifest
          de bucket però no té cap registre de perfil llegible (status=%{status}).
          Executa `aeat config repair profile --clear-active --yes` i després canvia
          a un perfil vàlid o crea'l abans de configurar l'autenticació.
