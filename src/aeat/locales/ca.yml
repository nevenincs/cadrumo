    intro: 'Configuració guiada del perfil tributari


      Això prepara el perfil local que l''app usa per als llibres registre i les comprovacions
      de models.

      Hi ha %{section_total} passos. Només %{required_total} respostes són obligatòries
      per començar; pots deixar en blanc el que encara no sàpigues.

      Tingues a mà el NIF/NIE/CIF, una descripció breu de l''activitat, règim d''IVA/IRPF,
      residència fiscal i dades familiars si apliquen.

      Després de desar, revisa el progrés amb `aeat config profile status`.'
