errors:
  auth:
    auth_aeat_login_assertion: No s'ha pogut generar la verificació posterior a l'inici
      de sessió amb l'AEAT.
    auth_aeat_session_expired: La sessió autenticada amb l'AEAT ha caducat. Torna
      a autenticar-te per continuar.
    auth_auth: S'ha produït un error d'autenticació amb l'AEAT.
    auth_auth_authenticator_persisted_session_invalid: La sessió de navegador desada
      amb l'AEAT no és fiable. Torna a autenticar-te.
    auth_auth_certificate: S'ha produït un error en l'autenticació amb certificat.
    auth_auth_certificate_expired: El certificat digital ha caducat. Renova el certificat
      per poder autenticar-te.
    auth_auth_certificate_handshake: L'entrada de la negociació TLS no és vàlida.
      Revisa l'URL indicat.
    auth_auth_certificate_load: No s'han pogut llegir les dades del certificat PKCS#12.
      Comprova que el fitxer no estigui malmès.
    auth_auth_certificate_nif_parse: No s'ha pogut extreure cap NIF ni NIE del titular
      del certificat. Comprova que el certificat sigui de persona física.
    auth_auth_certificate_password: La contrasenya del certificat falta o és incorrecta.
      Defineix la variable d'entorn amb la contrasenya correcta.
    auth_auth_certificate_pre_expiry: El certificat digital està a punt de caducar.
      Renova'l abans que expiri per evitar interrupcions.
    auth_auth_clave_movil_clave_movil_approval_timeout: L'autenticació Cl@ve no s'ha
      completat a temps. Aprova la sol·licitud al teu dispositiu i torna-ho a provar.
    auth_auth_clave_movil_clave_movil_configuration: Falten ajustos obligatoris de
      Cl@ve Móvil o són incorrectes. Revisa la configuració de Cl@ve.
    auth_auth_configuration: Falten ajustos d'autenticació obligatoris o són incorrectes.
      Revisa la configuració d'autenticació.
    auth_auth_validation: Els paràmetres d'autenticació no han superat la validació.
      Corregeix els valors indicats i torna-ho a provar.
    auth_google: S'ha produït un error en l'autenticació amb Google.
    auth_google_client_not_registered: No hi ha cap client OAuth d'escriptori de Google
      registrat per al perfil actiu. Registra un client per fer servir les funcions
      de Google.
    auth_google_client_revoked: El client OAuth d'escriptori de Google registrat ha
      estat revocat. Registra un client nou.
    auth_google_expired: El testimoni d'actualització de Google ha caducat pel límit
      de 7 dies dels projectes en proves. Torna a autoritzar l'accés a Google.
    auth_google_revoked: El testimoni d'actualització de Google ha estat revocat.
      Torna a autoritzar l'accés a Google.
    auth_google_scope_insufficient: Els permisos concedits a Google no inclouen tots
      els necessaris per a aquesta operació. Torna a autoritzar concedint tots els
      permisos sol·licitats.
    auth_outbound_storage_permission: Les credencials actives no tenen el permís necessari
      per a aquesta operació d'emmagatzematge.
    auth_session_corrupt: Les metadades de la sessió desada no es poden llegir. Torna
      a autenticar-te per crear una sessió nova.
    auth_session_unavailable: No hi ha cap sessió activa verificada amb l'AEAT disponible.
      Autentica't abans de continuar.
    auth_storage_bucket_recovery_verification: El codi de recuperació introduït no
      és vàlid. Torna a escriure les 24 paraules exactament com apareixen a la còpia
      de seguretat.
    auth_storage_keyring_unavailable: L'anell de claus del sistema operatiu no està
      disponible. Comprova que hi hagi un magatzem de credencials instal·lat i actiu.
    auth_storage_master_key_kdf_version: El fitxer de clau mestra fa servir una versió
      de derivació de clau que aquesta versió de l'aplicació no admet. Actualitza
      l'aplicació.
    auth_storage_master_key_keychain_locked: L'anell de claus del sistema operatiu
      està bloquejat. Desbloqueja'l (Touch ID, Windows Hello o el desbloqueig del
      gestor de credencials) i torna-ho a provar.
    auth_storage_master_key_material_missing: No existeix material de clau mestra.
      L'emmagatzematge segur encara no està aprovisionat.
    auth_storage_master_key_passphrase_mismatch: La frase de contrasenya no obre la
      clau mestra. Torna-la a introduir; si l'has oblidat, recupera-la amb la teva
      clau de recuperació.
    auth_storage_master_key_unavailable: No s'ha pogut obtenir la clau mestra de cap
      proveïdor. Comprova l'anell de claus o la frase de contrasenya de la còpia de
      seguretat.
