adapters:
  aeat:
    clave_movil:
      errors:
        pending_petition_blocked: L'AEAT s'ha negat a emetre una nova petició push
          de Cl@ve Móvil perquè una sol·licitud d'autenticació anterior encara està
          pendent al servidor.
      suggestions:
        reject_pending_request: Obre l'app Cl@ve al teu mòbil, rebutja totes les sol·licituds
          pendents i torna a executar `aeat config auth test` (o espera fins a 5 minuts
          que l'AEAT les caduqui automàticament).
    sede:
      groi:
        suggestions:
          shape_change: Torna a executar l'oracle en viu després de comprovar si l'AEAT
            ha canviat el formulari GROI.
      nif_iva:
        suggestions:
          shape_change: Torna a executar l'oracle en viu després de comprovar si l'AEAT
            ha canviat el formulari NIF-IVA.
      renta_web_open:
        suggestions:
          shape_change: Torna a executar l'oracle en viu després de comprovar si l'AEAT
            ha canviat la pàgina Renta WEB Open.
  auth:
    authenticator:
      errors:
        already_active: AeatAuthenticator ja te una sessio activa; crideu close()
          o reauthenticate() abans d'autenticar de nou.
        already_active_before_resume: AeatAuthenticator ja té una sessió activa; crideu
          close() abans de reprendre.
        assertion_failed: L'autenticacio AEAT no ha produit una assercio d'inici de
          sessio valida.
        capture_requires_active_session: capture_storage_state() requereix la sessió
          autenticada activa.
        capture_requires_certificate: capture_storage_state() requereix una sessió
          amb certificat i metadades de handshake.
        closing: L'autenticador s'està tancant; no es permeten noves operacions verify_login.
        context_marker_missing: El context del navegador no està etiquetat amb el
          marcador de certificat esperat.
        metadata_parse_failed: Les metadades persistides no han produit un model analitzat.
        no_active_context: No hi ha context de navegador actiu; crideu authenticate()
          primer.
        no_context_capture_storage: No hi ha context de navegador actiu; no es pot
          capturar l'estat d'emmagatzematge.
        persisted_session_verification_failed: La sessió persistida del navegador
          AEAT ha fallat la verificació en directe.
        resume_failed: La represa de la sessio AEAT persistida no ha produit un context
          utilitzable.
        session_stale: La sessió AEAT ha caducat; el termini d'inactivitat ha expirat.
    clave_movil:
      errors:
        already_active: Cl@ve Móvil ja té una sessió activa; crideu close() abans
          de tornar a autenticar-vos.
        approval_timeout: L'autenticació per navegador de Cl@ve Móvil no s'ha completat
          dins del temps configurat.
        dni_nie_not_set: AEAT_CLAVE_MOVIL_DNI_NIE no està configurat; configureu el
          vostre DNI o NIE abans d'autenticar-vos.
        initial_navigation_timeout: La navegacio inicial a Cl@ve Movil no s'ha completat
          dins del temps configurat.
        metadata_invalid: Les metadades de sessió de Cl@ve Móvil no són vàlides o
          no es poden analitzar.
        no_persisted_session: No s'ha trobat cap sessio de Cl@ve Movil; executeu `aeat
          config auth status` primer.
        page_missing_click: La pagina de Playwright no exposa click(); no es pot operar
          l'entrada de Cl@ve Movil.
        session_expired: La sessio de Cl@ve Movil ha superat el seu termini d'inactivitat.
        storage_state_hash_mismatch: El hash de l'estat d'emmagatzematge de Cl@ve
          Movil no coincideix; les dades de sessio poden estar corrompudes.
        verify_requires_active_context: Cl@ve Móvil verify() requereix un context
          de navegador actiu; crideu authenticate() primer.
  google:
    calc_sheets:
      errors:
        api_call_failed: La crida a Google {action} ha fallat.
        api_call_refused: La crida a Google {action} ha estat rebutjada (HTTP {status}).
        api_target_not_found: El destí de Google {action} no s'ha trobat.
        conflicting_duplicate_metadata: El full de Google conté metadades AEAT duplicades
          i contradictòries.
        foreign_spreadsheet_not_owned: El full de Google no està marcat com a propietat
          d'aquest perfil AEAT.
        googleapiclient_not_importable: googleapiclient no es pot importar; l'adaptador
          de Google no pot accedir a l'API.
        spreadsheet_id_blank: L'id del full de càlcul de Google no pot estar buit.
        workbook_snapshot_mismatch: Les metadades del full de Google no coincideixen
          amb la instantània de càlcul.
      suggestions:
        reexport_then_pull: Torneu a exportar el llibre amb `aeat config google sync
          calc export` i després torneu-lo a importar.
        reexport_workbook: Torneu a exportar el llibre amb `aeat config google sync
          calc export` perquè es renovin les metadades gestionades per l'aplicació.
        verify_exported_workbook: Comproveu que el full es va crear originalment amb
          `aeat config google sync calc export` per a aquest perfil.
    oauth_flow:
      errors:
        browser_launcher_refused: El sistema operatiu ha rebutjat obrir l'URL de consentiment
          OAuth al navegador.
        client_config_refused: La configuració del client Google OAuth ha estat rebutjada.
        email_claim_missing: L'id_token de Google s'ha verificat però no inclou la
          reclamació email.
        endpoint_unreachable: L'endpoint OAuth de Google no és accessible.
        id_token_missing: Google no ha retornat un id_token; el consentiment OAuth
          no incloïa els àmbits openid+email.
        id_token_module_not_importable: El mòdul id_token de google-auth no es pot
          importar.
        id_token_verification_failed: La verificació de l'id_token de Google ha fallat.
        loopback_bind_failed: El receptor OAuth loopback local no ha pogut assignar
          cap port.
        non_interactive: 'Google OAuth rebutjat: el flux interactiu de consentiment
          al navegador necessita un terminal interactiu, però aquesta ordre s''ha
          executat de manera no interactiva.'
        oauthlib_not_importable: google-auth-oauthlib no es pot importar; el flux
          OAuth no es pot iniciar.
        profile_state_unresolved: Google OAuth no pot resoldre l'estat del perfil
          AEAT seleccionat.
        scope_missing: La pantalla de consentiment de Google s'ha tancat sense concedir
          tots els àmbits requerits.
        unsecured_mode_refused: Google OAuth s'ha rebutjat perquè el magatzem de secrets
          està en mode insegur i el perfil actiu porta un identificador fiscal espanyol
          real.
      suggestions:
        close_loopback_port: Tanca l'aplicació que estigui ocupant un port loopback
          orfe i torna-ho a intentar.
        open_consent_url_manually: Obre manualment al navegador l'URL de consentiment
          impresa.
        repair_profile_state: Executeu `aeat config profile health` i repareu o canvieu
          el perfil actiu abans de tornar a provar l'ordre de Google.
        run_from_interactive_terminal: Executa 'aeat config google login' des d'un
          terminal interactiu amb un navegador web disponible.
        use_keyring_or_synthetic: Configura aeat_secret_store_backend=keyring o canvia
          el perfil actiu a un identificador fiscal sintètic de prova.
    profile_binding:
      errors:
        no_active_profile: No hi ha cap perfil AEAT actiu enllaçat per a Google OAuth.
      suggestions:
        create_profile: Executeu `aeat config profile create NAME --tax-id <NIF>`
          i torneu a provar l'ordre de Google.
  inbound:
    declaracion:
      errors:
        extraction_failed: 'Ha fallat l''extracció de la declaració amb el perfil
          {profile}: {details}'
        modelo_conflict: --modelo {modelo!r} entra en conflicte amb el model detectat
          {detected!r}.
        period_unresolved: No s'ha pogut resoldre el període de la declaració a partir
          del text del PDF.
        profile_count_invalid: 'S''esperava exactament un perfil d''extracció de PDF
          de declaració per a modelo={modelo}; disponibles: {available}.'
        profile_unavailable: El perfil d'extracció de declaració {profile!r} no està
          disponible per a modelo={modelo}.
        registry_snapshot_required: 'L''extracció de declaració requereix un snapshot
          validat del registre per a modelo={modelo} any={year} període={period}:
          {error}'
        snapshot_modelo_conflict: El model del snapshot del registre {snapshot_modelo!r}
          entra en conflicte amb el detectat {detected!r}.
        tax_id_unresolved: No s'ha pogut resoldre l'identificador fiscal de la declaració
          a partir del text del PDF.
        template_not_detected: No s'ha pogut detectar automàticament la plantilla
          de {path}; indica --modelo i --año per forçar-la.
        year_conflict: --año {year} entra en conflicte amb l'any detectat {detected}.
    financial:
      providers:
        pdf_n26:
          errors:
            parse_failed: No s'ha pogut analitzar l'extracte PDF de N26. La ruta d'origen
              s'ha ocultat als diagnòstics.
    justificante:
      errors:
        parse_failed: No s'ha pogut analitzar el PDF del justificant. La ruta d'origen
          s'ha ocultat als diagnòstics.
    pdf:
      errors:
        hash_failed: No s'ha pogut calcular l'empremta del PDF.
  outbound:
    storage:
      factory:
        errors:
          drive_root_missing: No hi ha cap id de carpeta arrel de Google Drive configurat
            per al perfil actiu. Executa `aeat config google folder set <id>` primer.
          google_auth_import_failed: La dependencia google-auth no es pot importar;
            executa `uv sync` i torna-ho a provar.
          google_client_missing: No hi ha cap client OAuth de Google registrat per
            al perfil actiu. Executa `aeat config google register --client-json <path>`
            primer.
          google_token_missing: No hi ha cap token OAuth de Google persistit per al
            perfil actiu. Executa `aeat config google login` primer.
          kind_empty: AEAT_STORAGE_PROVIDER_KIND esta buit.
          kind_unhandled: El tipus de proveidor d emmagatzematge {kind} no esta gestionat
            per la factoria.
          kind_unknown: El tipus de proveidor d emmagatzematge {value} no es reconeix;
            s esperava un de {expected}.
      google_drive:
        errors:
          content_hash_blank: El hash de contingut de Google Drive no pot estar buit.
          content_hash_mismatch: El hash de contingut de Google Drive no coincideix;
            ha fallat la comprovacio d integritat.
          create_namespace_no_id: Google Drive no ha retornat cap id en crear la carpeta
            d espai de noms.
          create_vault_folder_no_id: Google Drive no ha retornat cap id en crear la
            carpeta vault.
          folder_not_owned: La carpeta de Drive {folder_name} no esta marcada com
            a propietat d aquesta app; es rebutja l escriptura per protegir dades
            de l operador.
          googleapiclient_import_failed: La dependencia google-api-python-client no
            es pot importar; executa `uv sync` i torna-ho a provar.
          media_non_bytes: La descarrega de mitjans de Google Drive ha retornat {payload_type}
            en lloc de bytes.
          namespace_blank: L espai de noms d emmagatzematge de Google Drive no pot
            estar buit.
          namespace_forbidden_characters: L espai de noms de Google Drive {namespace}
            conte caracters de ruta prohibits.
          namespace_not_found: No s ha trobat l espai de noms de Google Drive {namespace}.
          object_key_hmac_blank: L HMAC de clau d objecte de Google Drive no pot estar
            buit.
          object_not_found: No s ha trobat l objecte de Google Drive {object_key_hmac}
            a l espai {namespace}.
          request_failed: La peticio de Google Drive {action} ha fallat amb estat
            {status}.
          root_folder_id_blank: L id de carpeta arrel de Google Drive no pot estar
            buit.
          vault_entry_not_folder: L arrel configurada de Drive conte {vault_folder_name},
            pero aquesta entrada no es una carpeta.
          vault_folder_name_blank: El nom de carpeta vault de Google Drive no pot
            estar buit.
          write_non_dict_response: La resposta d escriptura de Google Drive per a
            {action} tenia una forma inesperada.
      local:
        errors:
          byte_length_invalid: El byte_length del sidecar local te tipus invalid {actual_type}.
          content_hash_blank: El hash de contingut local no pot estar buit.
          content_hash_mismatch: El hash de contingut local no coincideix; ha fallat
            la comprovacio d integritat.
          namespace_blank: L espai de noms d emmagatzematge local no pot estar buit.
          namespace_create_permission: L emmagatzematge local no ha pogut crear l
            espai de noms {namespace}.
          namespace_forbidden_characters: L espai de noms local {namespace} conte
            caracters de ruta prohibits.
          namespace_not_found: No s ha trobat l espai de noms local {namespace}.
          object_delete_permission: L emmagatzematge local no ha pogut esborrar el
            payload de l objecte.
          object_key_hmac_blank: L HMAC de clau d objecte local no pot estar buit.
          object_key_hmac_forbidden_characters: L HMAC de clau d objecte local {object_key_hmac}
            conte caracters prohibits.
          object_not_found: No s ha trobat l objecte local {object_key_hmac} a l espai
            {namespace}.
          payload_commit_failed: L emmagatzematge local no ha pogut confirmar atomicament
            el payload de l objecte.
          payload_read_permission: L emmagatzematge local no ha pogut llegir el payload
            de l objecte.
          payload_write_permission: L emmagatzematge local no ha pogut escriure el
            payload de l objecte.
          sidecar_malformed: El sidecar local {sidecar_path} no es pot llegir o esta
            mal format.
          sidecar_missing: Falta el sidecar de l objecte local.
          sidecar_not_object: El sidecar local {sidecar_path} no es un objecte JSON.
          sidecar_write_failed: L emmagatzematge local no ha pogut escriure el sidecar
            de l objecte.
  persistence:
    profile:
      assets:
        errors:
          asset_already_exists: Aquest actiu ja existeix al llibre xifrat d'actius.
          load_amortizacion_ledger_failed: No s'ha pogut carregar el llibre xifrat
            d'amortització.
          load_asset_ledger_failed: No s'ha pogut carregar el llibre xifrat d'actius.
      inventory:
        errors:
          inventory_ledger_already_exists: Aquest llibre d'inventari ja existeix.
          inventory_ledger_not_found: No s'ha trobat el llibre d'inventari sol·licitat.
          load_inventory_ledger_failed: No s'ha pogut carregar el llibre xifrat d'inventari.
          movement_already_exists: Aquest moviment d'inventari ja existeix.
  sede:
    errors:
      cotejo_nav_failed: La navegació a la pàgina de cotejo d'AEAT ha fallat; la sessió
        pot haver caducat. Executeu 'aeat config auth test' i torneu-ho a intentar.
      ejercicio_unavailable: El registre de declaracions d'AEAT no ofereix l'exercici
        sol·licitat per a aquest model.
      empty_identity_nif: El NIF d'identitat de la sessió AEAT és buit; no es pot
        vincular l'observació de presentació.
      form_render_timeout: El formulari del registre de declaracions d'AEAT no s'ha
        renderitzat en el temps establert; la sessió pot haver caducat o l'AEAT està
        en manteniment.
      iva_wallet_empty_amount_cell: La cel·la d'import de la cartera de compensació
        d'IVA és buida.
      iva_wallet_empty_period_cell: La cel·la de període de la cartera de compensació
        d'IVA és buida.
      justificante_column_missing: La resposta de declaracions d'AEAT no conté la
        columna de justificant; l'estructura de la taula pot haver canviat.
      listbox_missing: La resposta de declaracions d'AEAT no conté el contenidor de
        llista esperat; l'estructura de la pàgina pot haver canviat.
      listing_nav_failed: La navegació al llistat de declaracions d'AEAT ha fallat.
        Comproveu la connectivitat de xarxa i torneu-ho a intentar.
      modelo_unavailable: El registre de declaracions de l'AEAT no ofereix el model
        sol·licitat.
      no_auth_session: La sessió d'autenticació d'AEAT no existeix o no està persistida;
        executeu primer `aeat config auth status`.
      parse_failed: No s'ha pogut analitzar la resposta de declaracions d'AEAT; l'estructura
        de la pàgina pot haver canviat.
      playwright_alert_modal_failed: Error en continuar el modal d'alerta de l'AEAT.
      playwright_buscar_click_failed: Error en fer clic al botó Buscar de la Seu electrònica.
      playwright_combobox_open_failed: Error en obrir el quadre combinat de la Seu
        electrònica.
      playwright_combobox_select_failed: Error en seleccionar una opció del quadre
        combinat de la Seu electrònica.
      session_expired_nav_failed: El registre de declaracions d'AEAT no s'ha carregat;
        la sessió probablement ha caducat. Executeu 'aeat config auth test' i torneu-ho
        a intentar.
aggregation:
  grouping:
    errors:
      unsupported_modelo: No hi ha cap contracte d'agregació registrat per al model
        sol·licitat.
  iva_ledger:
    errors:
      bucket_mismatch: El bucket del repositori de moviments no coincideix amb el
        bucket d'agregació sol·licitat.
      candidate_outside_period: La candidatura queda fora del periode.
      unsupported_iva_category: 'Error intern: categoria d''IVA no admesa per a l''agregacio.'
  modelo_bindings:
    errors:
      unsupported_period: Període de model no admès per a l'agregació del llibre.
  per_modelo:
    errors:
      unsupported_modelo: Model no admès per a l'agregació per model
  renta_ledger:
    errors:
      annual_period_required: Es requereix un període anual per a l'agregació del
        llibre de Renda.
      bucket_mismatch: El bucket del repositori de moviments no coincideix amb el
        bucket sol·licitat del llibre de Renda.
      invoice_bucket_mismatch: El bucket del repositori de factures no coincideix
        amb el bucket sol·licitat del llibre de Renda.
      modelo_mismatch: El model tributari no coincideix amb el model esperat del llibre
        de Renda.
      period_mismatch: El període no coincideix amb el període esperat del llibre
        de Renda.
      quarterly_period_required: Es requereix un període trimestral per a l'agregació
        d'ingressos del Model 130 (p.ex. 2024Q1).
      unsupported_period: Es requereix un període anual per a l'agregació d'ingressos
        del Model 100 (p.ex. 2024-0A).
  retenciones:
    errors:
      filing_year_out_of_range: El exercici %{filing_year} queda fora del rang admes
        %{min_year}-%{max_year}.
      perceptor_nif_blank: El NIF del perceptor no pot estar buit.
      perceptor_observations_missing: No hi ha observacions de retencions per perceptor
        per al model %{modelo} %{filing_year} %{period}; la font %{source_kind} no
        es pot resoldre.
  service:
    errors:
      envelope_modelo_mismatch: El model de l'embolcall no coincideix amb el model
        esperat.
      envelope_period_mismatch: El periode de l'embolcall no coincideix amb el periode
        esperat.
      envelope_provider_payload_mismatch: La carrega del proveidor de l'embolcall
        no coincideix amb l'esperada.
      observations_mismatch: Les observacions retornades no coincideixen amb les esperades.
      per_modelo_modelos_not_unique: Els models per model no son unics.
      per_modelo_providers_not_unique: Els proveidors per model no son unics.
      provider_modelos_not_unique: Els models del proveidor no son unics.
      result_source_kinds_not_unique: Els tipus de font del resultat no son unics.
      source_kinds_mismatch: Els tipus de font no coincideixen amb la taxonomia acceptada.
  source_mesh:
    errors:
      ambiguous_source_disposition: aggregation.source_mesh.errors.ambiguous_source_disposition
      duplicate_binding_owner: 'Error intern: propietari de vinculacio duplicat a
        la malla de fonts.'
      duplicate_bound_casilla_owner: 'Error intern: propietari de casella vinculada
        duplicat a la malla de fonts.'
      duplicate_relation_owner: 'Error intern: propietari de relacio duplicat a la
        malla de fonts.'
      owned_sources_blank: Les fonts propietat de la malla de fonts no poden contenir
        tipus de font en blanc.
      owned_sources_duplicate: Les fonts propietat de la malla de fonts han de ser
        úniques.
      source_transaction_ids_blank: Els identificadors de transacció de la malla de
        fonts no poden contenir blancs.
      source_transaction_ids_duplicate: Els identificadors de transacció de la malla
        de fonts han de ser únics.
      unresolved_binding_ids_blank: aggregation.source_mesh.errors.unresolved_binding_ids_blank
      unresolved_binding_ids_duplicate: aggregation.source_mesh.errors.unresolved_binding_ids_duplicate
      unresolved_relation_ids_blank: aggregation.source_mesh.errors.unresolved_relation_ids_blank
      unresolved_relation_ids_duplicate: aggregation.source_mesh.errors.unresolved_relation_ids_duplicate
application:
  auth:
    acquisition_lock:
      errors:
        acquire_failed: No s'ha pogut adquirir el bloqueig d'autenticació AEAT després
          de la recuperació del bloqueig obsolet.
        lock_held: Ja hi ha una altra operació d'autenticació AEAT en curs per a aquest
          perfil. No iniciïs una segona petició de Cl@ve; espera que acabi el procés
          en curs o deixa expirar el bloqueig si aquest procés ha fallat.
        lock_held_suggestion: Executa `aeat config auth status --format json` per
          inspeccionar el bloqueig d'autenticació actiu.
    certificate:
      health:
        file_missing: El fitxer de certificat configurat (%{path}) no existeix. Recupera
          el fitxer o executa 'aeat config auth configure --provider certificate --file
          CAMI' amb un camí vàlid.
        path_unset: No s'ha seleccionat cap fitxer de certificat. Executa 'aeat config
          auth configure --provider certificate --file CAMI' per indicar-lo.
        unavailable: L'estat del certificat no està disponible; consulta els registres
          de depuració per als detalls de diagnòstic.
      load:
        password_unset: No hi ha cap contrasenya de certificat configurada. Configura
          la contrasenya del certificat abans de continuar.
        path_unset: No hi ha cap fitxer de certificat configurat. Executa 'aeat config
          auth configure --provider certificate --file CAMI' per indicar-lo.
    clave_movil:
      health:
        identity_unset: No s'ha configurat cap DNI/NIE per a Cl@ve Mòbil. Configura'n
          un abans de continuar.
        operator_completion_required: Preparat; requereix finalització de Cl@ve mediada
          per l'operador.
    errors:
      provider_reserved: El proveïdor d'autenticació {provider} està reservat i no
        està implementat.
      session_field_not_datetime: El camp {field} de la sessió persistent ha de ser
        una data-hora o cadena ISO-8601.
    operator:
      alignment:
        both_missing_detail: No estan configurades ni la identitat Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          ni l'identificador fiscal del perfil actiu. Configura tots dos amb el mateix
          DNI/NIE abans de l'autenticació AEAT en directe.
        both_missing_next_action: Edita el perfil actiu amb 'aeat config profile edit
          NOM --tax-id DNI/NIE' i configura el mateix DNI/NIE per a Cl@ve Mòbil.
        clave_identity_missing_detail: La identitat Cl@ve (AEAT_CLAVE_MOVIL_DNI_NIE)
          no està configurada, de manera que no es pot comparar amb l'identificador
          fiscal del perfil actiu. Configura-la amb el DNI/NIE del perfil actiu.
        clave_identity_missing_next_action: Configura el DNI/NIE de Cl@ve Mòbil perquè
          coincideixi amb l'identificador fiscal del perfil actiu.
        mismatch_detail: El DNI/NIE de la identitat Cl@ve '%{clave_identity}' no coincideix
          amb l'identificador fiscal del perfil actiu '%{profile_tax_id}'. L'autenticació
          AEAT en directe vincularia la sessió d'un contribuent a un altre perfil.
          Canvia al perfil l'identificador fiscal del qual coincideixi amb el DNI/NIE
          de Cl@ve, o corregeix el valor que sigui erroni.
        mismatch_next_action: Canvia al perfil l'identificador fiscal del qual coincideixi
