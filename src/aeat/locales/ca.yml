    borrador_binding:
      errors:
        caller_binding_keys_blank: Les claus de binding aportades no poden estar en
          blanc.
        snapshot_id_required: Els valors procedents de l'esborrany requereixen un
          borrador_snapshot_id.
        snapshot_not_active: L'snapshot d'esborrany no està actiu; llista els snapshots
          actius amb `aeat app live borrador 100 list`.
        source_trace_mismatch: La traça d'origen de l'esborrany ha de coincidir amb
          els identificadors de binding resolts.
    errors:
      export_no_active_bucket: No hi ha cap perfil actiu; executa `aeat config profile
        create NAME` abans d'exportar una revisió de modelo.
      external_filing_evidence_reference_blank: La importació de declaració externa
