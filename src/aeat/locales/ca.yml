      duplicate_tax_id: El NIF '%{tax_id}' ja l'utilitza el perfil '%{profile}'; un
        contribuent ha de tenir un sol perfil.
      no_active_profile_selected: No hi ha cap perfil actiu seleccionat.
      profile_already_exists: El perfil '%{profile}' ja existeix; executa `aeat config
        profile switch NAME` per activar-lo o `aeat config profile delete NAME` primer.
      profile_not_registered: El perfil '%{profile}' no existeix; executa `aeat config
        profile create NAME` per crear-lo.
  wizard:
    errors:
      profile_flag_required: L'assistent requereix --profile NAME (sense valor per
        defecte 'default' implícit).
      quiet_missing_flags: Falten flags obligatoris per a una execució de l'assistent
        amb --quiet.
    status:
