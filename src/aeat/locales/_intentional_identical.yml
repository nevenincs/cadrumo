# Allowlist mapping translation keys to an "intentionally identical to
# English" justification for locales whose value matches en.yml.
#
# Used by `test_locale_translation_honesty.py` to enforce that ca and hu
# locale values either differ from `en.yml` (i.e. are real translations)
# OR appear here with an explicit reason. The honest signal: an operator
# selecting `AEAT_OUTPUT_LANGUAGE=ca` should know up-front that some
# strings still surface in English while the catalogue catches up.
#
# Format:
#
#   <locale>:
#     <key>: <reason>
#
# Reasons are short prose strings the audit prints when the entry is
# walked. The "untranslated: ca/hu coverage pending" reason captures
# every string this slice transferred wholesale; later slices replace
# entries with real translations and remove them from this allowlist.
ca:
  untranslated_pending: |
    The ca locale still mirrors en for keys captured in this slice. A
    follow-up translation pass replaces the English strings with real
    Catalan translations and removes entries from this allowlist.
hu:
  untranslated_pending: |
    The hu locale still mirrors en for keys captured in this slice. A
    follow-up translation pass replaces the English strings with real
    Hungarian translations and removes entries from this allowlist.
