<h5 class="articulo">Artículo 4. Plazo de presentación.</h5>
        <p class="parrafo">La presentación de la declaración informativa, modelo 184, se realizará en el mes de febrero de cada año, en relación con las rentas obtenidas por la entidad y las rentas atribuibles a cada uno de sus miembros en el año natural inmediato anterior.</p>
