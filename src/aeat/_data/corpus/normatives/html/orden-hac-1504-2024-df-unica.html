<h5 class="articulo">Disposición final única. Entrada en vigor.</h5>
<p class="parrafo">La presente orden entrará en vigor el día siguiente al de su publicación en el «Boletín Oficial del Estado», y será aplicable, por primera vez, a las declaraciones informativas correspondientes al ejercicio 2024, que se presentarán en el ejercicio 2025.</p>
