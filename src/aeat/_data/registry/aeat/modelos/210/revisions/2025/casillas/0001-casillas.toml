# Modelo 210 Phase 1 casilla skeleton (W04.P19.S387).
#
# Six casillas implementing the base / rate / cuota chain for the
# general (Art 25.1.a, 24%) and ue_residente (Art 25.1.f, 19%) tipos
# de renta. The remaining tipos (pension, inmobiliaria,
# ganancia_patrimonial) are out of Phase 1 scope and are handled by
# Phase 2 per the m210-irnr-full-engine ADR §D2.3.
#
# Phase 1 ships every casilla as input_kind = "manual" because the
# formula registry is not authored yet — S388 lands the formula
# TOMLs (base = rendimientos_integros for Art 25.1.a; tipo_gravamen
# = bracket-table lookup; cuota_integra = base × rate;
# cuota_diferencial = cuota_integra - pagos a cuenta). When S388
# ships, every casilla currently marked manual flips back to
# input_kind = "computed" with its formula id wired through.
# Until then the engine produces no values and the Path-B refusal
# stub on the M210 work-create surface stays active per ADR §D5.

[[revisions."2025".casillas]]
