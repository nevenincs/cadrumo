# Modelo 210 Phase 1 casilla skeleton.
#
# Eight casillas implementing the base / rate / cuota chain for the
# general (Art 25.1.a, 24%) and ue_residente (Art 25.1.f, 19%) tipos
# de renta plus the Convenio-override dispatch. The remaining tipos
# (pension, inmobiliaria, ganancia_patrimonial) are out of Phase 1
# scope and handled by Phase 2 per the m210-irnr-full-engine ADR
# §D2.3.
#
# Phase 1 wiring:
#  - tipo_renta            manual text (operator-supplied enum key)
#  - rendimientos_integros manual money input
#  - gastos_deducibles     manual money input (placeholder; Art 24.5
#                          / 24.6 deduction routing is Phase 2)
#  - retencion_practicada  manual money input (pagos a cuenta)
#  - base_imponible        computed via `m210-base-imponible-2025`
#  - tipo_gravamen         computed via `m210-tipo-gravamen-2025-resolve`
#  - cuota_integra         computed via `m210-cuota-integra-2025`
#  - cuota_diferencial     computed via `m210-cuota-diferencial-2025`

