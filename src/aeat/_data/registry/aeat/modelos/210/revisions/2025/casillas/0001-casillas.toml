# Modelo 210 Phase 1 casilla skeleton (W04.P19.S387).
#
# Six casillas implementing the base / rate / cuota chain for the
# general (Art 25.1.a, 24%) and ue_residente (Art 25.1.f, 19%) tipos
# de renta. The remaining tipos (pension, inmobiliaria,
# ganancia_patrimonial) are declared on the tipo_renta enum so the
# engine can refuse them with NOT_YET_AUTHORED Path-B messaging until
# Phase 2 wires the rest of the bracket table.
#
# Engine wiring lands in S389; formula bindings in S388. Until those
# Steps ship, this revision is a registry skeleton — the casillas
# resolve against the loader but the engine produces no computed
# values yet. The Path-B refusal stub on the M210 work-create surface
# remains active per the m210-irnr-full-engine ADR §D5.

