# Per-third-party annual-operations threshold per Orden EHA/3012/2008
# art. 1: only declare third parties with annual turnover exceeding
# €3005.06. Encoded as a static parameter so any future detail-record
# validation (T4.1/T4.2) can consult the legally-cited amount instead
# of hard-coding it inline. No formula consumes this parameter today;
# the threshold lives here as discoverable legal grounding ahead of
# the row-set support that will enforce it on per-tercero records.
