[[revisions."2019-y-siguientes".formulas]]
id = "modelo-130-diferencia"
target_casilla_id = "17"
# Art. 109 RIRPF: when retenciones acumuladas (c06) / ingresos (c01) >= 70%
# the autónomo is exempt and casilla 17 is zero. The zero branch only activates
# when c01 > 0 (denominator guard); otherwise the standard subtraction applies.
expression = { op = "if_then_else", args = [
    { op = "greater_than", args = [{ casilla_id = "01" }, { literal = "0" }] },
    { op = "if_then_else", args = [
        { op = "greater_equal", args = [
            { op = "divide", args = [{ casilla_id = "06" }, { casilla_id = "01" }] },
            { literal = "0.70" },
        ] },
        { literal = "0" },
        { op = "subtract", args = [
            { op = "subtract", args = [{ casilla_id = "14" }, { casilla_id = "15" }] },
            { casilla_id = "16" },
        ] },
    ] },
    { op = "subtract", args = [
        { op = "subtract", args = [{ casilla_id = "14" }, { casilla_id = "15" }] },
        { casilla_id = "16" },
    ] },
] }
rounding = "money-2"
legal_refs = ["rd-439-2007:art-110", "rd-439-2007:art-109", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]

