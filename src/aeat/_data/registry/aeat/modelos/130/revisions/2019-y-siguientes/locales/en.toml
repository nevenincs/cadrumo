[labels]
"01" = "Income"
"02" = "Expenses"
"03" = "Net yield"
"04" = "Fractional payment amount"
"05" = "Prior fractional payments"
"06" = "Withholdings and payments on account"
"07" = "Partial result of Section I"
"08" = "Quarterly income volume"
"09" = "Fractional payment amount"
"10" = "Withholdings and payments on account"
"11" = "Partial result of Section II"
"12" = "Sum of partial results"
"13" = "Reduction for net yields"
"14" = "Net amount after reduction"
"15" = "Negative results from previous quarters"
"16" = "Deduction for investment in main residence"
"17" = "Difference"
"18" = "Amount payable from previous self-assessments"
"19" = "Final result"
"saldo-negativo-fin-periodo" = "Negative balance transferable to later periods (max 0, -casilla 17)"

[help]
"01" = "Total cumulative business income for the tax year."
"02" = "Total cumulative business expenses for the tax year."
"03" = "Net yield from direct-estimation economic activities, calculated as income minus expenses."
"04" = "Fractional payment amount for direct-estimation activities before prior payments and withholdings."
"05" = "Fractional payments already made earlier in the same tax year for direct-estimation activities."
"06" = "Withholdings and payments on account borne during the period for direct-estimation activities."
"07" = "Partial Section I result after subtracting prior payments and withholdings from the direct-estimation fractional payment."
"08" = "Income volume for the quarter from agricultural, livestock, forestry, or fishing activities."
"09" = "Fractional payment amount for agricultural, livestock, forestry, or fishing activities."
"10" = "Withholdings and payments on account borne during the period for agricultural, livestock, forestry, or fishing activities."
"11" = "Partial Section II result after subtracting withholdings from the agricultural, livestock, forestry, or fishing fractional payment."
"12" = "Sum of the partial results from Sections I and II."
"13" = "Reduction applied when net yields fall within the regulatory threshold for Modelo 130."
"14" = "Amount remaining after applying the net-yield reduction."
"15" = "Deduction for negative results from previous quarters of the same tax year."
"16" = "Deduction for investment in the taxpayer's main residence when the transitional regime applies."
"17" = "Difference after applying prior-quarter negative results and any main-residence deduction."
"18" = "Amount payable already reported in previous self-assessments for the same period and year."
"19" = "Final Modelo 130 amount payable after all deductions and prior self-assessments."
"saldo-negativo-fin-periodo" = "Computed carry-forward seed when casilla 17 is negative, used as deductible casilla 15 in a later quarter."
