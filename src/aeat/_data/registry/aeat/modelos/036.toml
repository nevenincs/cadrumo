# PROVISIONAL: label_pattern values in this profile were derived from registry
# casilla LABEL fields (aeat-dr-036-2025 diseño de registro), NOT verified
# against a real AEAT printed-declaración-form PDF specimen. The diseño de
# registro is an EDI record-layout spec; it cannot ground named_label patterns.
# Verification is pending a W05 round-trip parse test against a real M036
# printed-form PDF. Until that test passes, these patterns are unconfirmed guesses.
[[revisions."2025-02-03-y-siguientes".extraction_profiles]]
id = "modelo-036-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaration_pdf"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "aeat.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    {casilla_id = "decl.event-kind", match_strategy = "named_label", value_kind = "enum", label_pattern = 'Tipo\s+de\s+declaraci[oó]n\s+censal'},
    {casilla_id = "decl.vigencia-2025", match_strategy = "named_label", value_kind = "text", label_pattern = 'Vigencia\s+normativa\s+desde'},
]
