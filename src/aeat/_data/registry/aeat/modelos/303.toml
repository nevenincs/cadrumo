# -----------------------------------------------------------------------------
# Prorrata general (LIVA arts. 102-105).
# When the operator performs operations both with and without right to
# deduction, only a percentage of soportado IVA is deductible. The
# percentage is volumen_op_con_derecho / volumen_total_operaciones (per
# art. 104.2), rounded UP to the nearest integer per art. 104.4. The
# operator declares the two volume casillas manually; the prorrata
# percentage and the post-prorrata deducible-effective amount are
# computed.
#
# Regularización de bienes de inversión (LIVA arts. 107-110). For
# capital goods acquired in prior years, the operator declares the
# regularización amount manually for the period. The current period's
# cuota-deducible-total formula does NOT auto-include this — it is
# carried separately for AEAT reconciliation per AEAT modelo 303
# instructions section on "Regularización de bienes de inversión".
# -----------------------------------------------------------------------------

[[revisions."2009-y-siguientes".casillas]]
id = "iva.prorrata-volumen-con-derecho"
