# --- Per-direction invoice-source bindings ---
#
# Modelo 349 reports declarant-side intracomunitario operations across
# 10 claves. Each binding is keyed by the canonical source kind that
# matches the direction of the underlying operation:
#   - `collectible_invoice` for outbound claves where the declarant
#     issued the invoice: E entregas, M modificaciones a entregas,
#     T triangulares (Spanish supplier as intermediary), S servicios
#     prestados, R referidos por residentes en otros Estados
#   - `payable_invoice` for inbound claves where the declarant
#     received the invoice: A adquisiciones, I servicios recibidos,
#     D devoluciones de adquisiciones, H hidden triangular receipts
# Clave C (correcciones) can correct prior declarations of either
# direction and therefore appears in both bindings; the calculation
# runtime de-duplicates by operation id when unioning per-binding
# results behind a single casilla.

[[revisions."2020-y-siguientes".bindings]]
id = "vat-349-declarante-numero-operadores"
source = "collectible_invoice"
selector = { fact = "operator_count", claves = ["E", "M", "H", "A", "T", "S", "I", "R", "D", "C"], rectification_scope = "exclude_rectifications" }
aggregation = { op = "count_distinct" }
legal_refs = ["orden-eha-769-2010:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-349-2020-current", "aeat-modelo-349-procedure", "boe-modelo-349-form-2010"]

[[revisions."2020-y-siguientes".bindings.source_citations]]
source_ref = "boe-modelo-349-form-2010"
required_text = ["NÚMERO TOTAL DE OPERADORES INTRACOMUNITARIOS"]

[[revisions."2020-y-siguientes".bindings]]
id = "vat-349-declarante-importe-operaciones"
source = "collectible_invoice"
