# Spanish-counterparty ROI verification via the AEAT GROI servlet at
# www2.agenciatributaria.gob.es/wlpl/GROI-JDIT/ConsultaOperadorSedeGroiServlet.
# Per the authenticated-synthetic-surface-taxonomy ADR (2026-05-07), the
# surface category is `authenticated_simulator`: cl@ve-movil required,
# arbitrary Spanish NIFs accepted as input, form-submit POST is the
# AEAT-prescribed query mechanism. The remote-state guard's
# HTTP-method check stays strict for `kind="http"` operations; only
# the cross-reference's allowed_methods declaration includes POST so
# the surface contract is honest. The forbidden_actions include the
# canonical AEAT_WRITE_FORBIDDEN_ACTIONS set so any write-class
# action label is rejected before any submit click runs.
[[revisions."2020-y-siguientes".live_cross_references]]
id = "modelo-349-groi-spanish-counterparty-check"
evidence_tier = "executable_parity_evidence"
surface = "authenticated_simulator"
guard_policy_id = "modelo-349-groi-spanish-roi-check"
allowed_hosts = ["www2.agenciatributaria.gob.es"]
allowed_methods = ["GET", "POST"]
forbidden_actions = [
    "server-side-save",
    "signing",
    "presentation",
    "payment",
    "amendment",
    "cancellation",
    "document-submission",
    "declaration-submission",
]
synthetic_data_allowed = true
requires_authentication = true
requires_aeat_authorization = false
oracle_id = "aeat-groi-spanish-roi-checker"
legal_refs = ["orden-eha-769-2010:art-1", "orden-hac-174-2020:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-vies-gestiones-procedure"]

# Applicability gate: the GROI Spanish-ROI consult is only relevant
# to a taxpayer who actually conducts intracommunity operations.
# Subjects with does_intracomunitario=false do not file Modelo 349
# at all and therefore have no business invoking the GROI counterparty
# check. The all-mode aggregation is the default; if a future predicate
# is added (e.g. iva.roi_enrolled), it AND-composes with this one.
[[revisions."2020-y-siguientes".live_cross_references.applicability_predicates]]
field = "does_intracomunitario"
op = "equals"
value = true
explanation = "GROI Spanish-ROI counterparty check applies only when the taxpayer conducts declarable intracommunity operations."
legal_refs = ["orden-eha-769-2010:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-modelo-349-procedure"]

# IXVI foreign-EU NIF-IVA verifier. AEAT publishes the IXVI servlet
# (www1.agenciatributaria.gob.es/wlpl/IXVI-JDIT/ConsultaIntracomunitarios)
# alongside GROI on the sede gestiones page. IXVI verifies counterparty
# NIF-IVA identifiers issued by other EU member states (the foreign-EU
# half of the same Modelo 349 declarant context where GROI handles
# Spanish counterparties). Empirically gated above cl@ve-movil so
# declared as authenticated_simulator with synthetic data accepted
# (the user supplies arbitrary EU VAT IDs of counterparties to
# verify, not their own filing data). Live reachability is gated on
# certificate provisioning — the binding declares the conceptual
# contract and the live test will exercise it once auth is in place.
[[revisions."2020-y-siguientes".live_cross_references]]
id = "modelo-349-ixvi-foreign-counterparty-check"
evidence_tier = "executable_parity_evidence"
surface = "authenticated_simulator"
guard_policy_id = "modelo-349-ixvi-foreign-counterparty-check"
allowed_hosts = ["sede.agenciatributaria.gob.es", "www1.agenciatributaria.gob.es"]
allowed_methods = ["GET", "POST"]
forbidden_actions = [
    "server-side-save",
    "signing",
    "presentation",
    "payment",
    "amendment",
    "cancellation",
    "document-submission",
    "declaration-submission",
]
synthetic_data_allowed = true
requires_authentication = true
requires_aeat_authorization = false
oracle_id = "aeat-nif-iva-checker"
legal_refs = ["orden-eha-769-2010:art-1", "orden-hac-174-2020:art-1", "ley-58-2003:art-93"]
source_refs = ["aeat-vies-gestiones-procedure"]

