rounding = "money-2"
# Orden HAC/819/2024 art. 1 (Modelo 303 2023+): casilla [71] = [69] - [70] + [109].
#   [69] = resultado de la autoliquidación
#   [70] = resultados a ingresar de anteriores autoliquidaciones del ejercicio y período
#          (autoliquidaciones complementarias: importes ya ingresados)
#   [109] = devoluciones acordadas por la AEAT en anteriores autoliquidaciones del ejercicio
#           y período (importes devueltos)
# For standard first filings of the period: [70]=0 and [109]=0, so [71] = [69].
# Source: aeat-modelo-303-procedure (instrucciones casilla 71) and boe-modelo-303-2008-form.
