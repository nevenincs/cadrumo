# Modelo 303 calculation-completeness manifest.
#
# Enumerates the casillas in this revision's calculation closure -- every formula
# target, every casilla referenced inside a formula expression, every
# formula/binding endpoint casilla, and every verification-expectation operand.
# Cross-modelo binding source casillas belong to foreign modelos and are
# excluded. Derived off-load-path from the calculation surface; re-derived by the
# record-design gate (test_record_design) and asserted to match this manifest.
# Moved out of revision.toml into this fragment (directory-mode loader merges it)
# to keep revision.toml under the reviewability baseline after the Stage-2 box
# projections joined the closure. The ten official Diseño box numbers
# (03/06/09/11/13/27/29/33/37/45) are now computed projection targets and part of
# the closure.

