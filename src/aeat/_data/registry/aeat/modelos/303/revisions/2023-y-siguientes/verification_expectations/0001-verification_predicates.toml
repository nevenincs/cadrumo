# Modelo 303 official-Diseño under-declaration advisories (no-silent-under-declaration).
#
# The M303 2023-y-siguientes revision carries TWO casilla layers: the semantic
# aggregate cuota casillas (iva.repercutido.general, iva.soportado.interiores,
# iva.autorepercutido.intracomunitaria, ...) which carry ledger bindings and
# feed the resultado chain, AND the official Diseño-de-Registros numbered boxes
# (ids "01".."77", semantic_role "dr303_NN") which carry the official export_refs
# the operator transcribes to the AEAT sede and are input_kind = "manual" with no
# binding. A ledger-driven calculate therefore folds real cuota into the semantic
# layer (so iva.cuota-devengada-total is positive) while EVERY official numbered
# box (03/06/09 cuotas + 11/13 inversion + 29/33/37 deducible) stays zero — a
# silent under-declaration the verify gate would otherwise grant with zero
# findings, even though the human files the numbered boxes (all zero) outside the
# application.
#
# These ADVISORY predicates surface the total-vs-constituents contradiction. They
# are ADVISORY rather than BLOCKING because the official numbered layer is an
# operator-entered layer the calculate path does not auto-populate (stage 1 of the
# modelo-303 official-casilla wiring), so the contradiction is an alert the
# operator must resolve (transcribe the official boxes) before filing, not a
# refusal. legal_refs ground the devengado advisory in LIVA art. 88 (cuota
# devengada) and the deducible advisory in LIVA art. 92 (cuotas deducibles),
# matching the totals casillas' own grounding.

# Devengado: cuota-devengada-total positive but every official devengado cuota box
# (03 = 4pct, 06 = 10pct, 09 = 21pct, 11 = AIB, 13 = otras inversion sujeto pasivo)
# is zero. LIVA art. 88 (repercusion del impuesto / cuota devengada).
[[revisions.2023-y-siguientes.verification_predicates]]
predicate_id = "modelo-303-official-devengado-boxes-unpopulated-cuando-cuota-devengada-positiva"
expression = 'implies_any_nonzero(["iva.cuota-devengada-total", "03", "06", "09", "11", "13"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-37-1992:art-88", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]

# Deducible: cuota-deducible-total positive but every official deducible cuota box
# (29 = interiores corrientes, 33 = importaciones, 37 = AIB corrientes) is zero.
# LIVA art. 92 (cuotas deducibles).
[[revisions.2023-y-siguientes.verification_predicates]]
predicate_id = "modelo-303-official-deducible-boxes-unpopulated-cuando-cuota-deducible-positiva"
expression = 'implies_any_nonzero(["iva.cuota-deducible-total", "29", "33", "37"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-37-1992:art-92", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
