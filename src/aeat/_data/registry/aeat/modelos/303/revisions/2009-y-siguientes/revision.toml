# Domestic régimen-general base-imponible aggregation bindings (casillas 07/04/01
# repercutido base, casilla 28 soportado base). The cuota of these rows is already
# ledger-aggregated (the *-cuota bindings above, fact = iva_amount_sum); the base
# imponible casillas were input_kind = "manual" with no binding, so a ledger-driven
# M303 left the base at 0 while the cuota resolved correctly — a structurally
# inconsistent "cuota without base" (#15 IVA-3). These bindings close that gap by
# summing the base_amount of the matching domestic observations, mirroring the 2023
# revision's domestic-base bindings exactly (same selectors / fact / aggregation).
# legal_refs are a subset of each target casilla's refs so the bound-casilla
