# Third-country import IVA deducible (importación de bienes). IVA devengado on the
# import is settled at customs (DUA) and never reaches M303; only the deducible leg
# (official boxes 32 base / 33 cuota) appears here. NOT net-zero — a real deduction
# with no offsetting M303 devengado. Grounded in LIVA art. 17 (hecho imponible
# importaciones) + art. 92 (cuotas deducibles). An operator classifying a ledger
# transaction as IMPORT_THIRD_COUNTRY with an iva_amount projects a SOPORTADO
# observation this binding consumes, so the #64 advisory no longer flags it.
[[revisions.2009-y-siguientes.bindings]]
id = "modelo-303-iva-soportado-importaciones-cuota"
source = "ledger_iva_aggregation"
legal_refs = ["ley-37-1992:art-17", "ley-37-1992:art-92", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]

[[revisions.2009-y-siguientes.bindings.source_citations]]
source_ref = "boe-modelo-303-2008-form"
required_text = ["modelo 303"]

[revisions.2009-y-siguientes.bindings.selector]
categories = ["import_third_country"]
rate_kinds = ["general", "reduced", "super_reduced"]
flow_direction = "soportado"
fact = "iva_amount_sum"

[revisions.2009-y-siguientes.bindings.aggregation]
op = "sum"

# Domestic reverse-charge (inversion del sujeto pasivo, LIVA art. 84.Uno.2).
# The recipient self-assesses BOTH an IVA devengado entry (official box 13,
# "IVA devengado otras ops inversion sujeto pasivo excl intracom - Cuota") and a
# matching IVA deducible entry (official box 37, deducible inversion sujeto pasivo
# interior corriente). The two cancel arithmetically in the M303 resultado
# (devengada - deducible = 0 for the line) but both must be booked. Both bindings
# select the same domestic_reverse_charge / inversion_sujeto_pasivo observations,
# so they resolve to the same cuota (net-zero), mirroring the autorepercutido
# intracomunitaria pair.
[[revisions.2009-y-siguientes.bindings]]
id = "modelo-303-iva-autorepercutido-interior-devengado-cuota"
source = "ledger_iva_aggregation"
legal_refs = ["ley-37-1992:art-84", "rd-1624-1992:art-71", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "aeat-modelo-303-procedure", "boe-modelo-303-2008-form"]

