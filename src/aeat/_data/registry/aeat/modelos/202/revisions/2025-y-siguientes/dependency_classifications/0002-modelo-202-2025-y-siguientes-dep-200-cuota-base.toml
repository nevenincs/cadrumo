# Modelo 202 modalidad 40.2 depends on the prior Modelo 200 cuota líquida as
# factual evidence for the instalment base (casilla 01). This classifies the
# cross-model 202 -> 200 dependency introduced by the cuota-base relation.
#
# Per-period vencimiento note: 2P (October) and 3P (December) bind the prior
# year's M200 (filing_year_delta = -1; modelled here). 1P (April) binds two
# years back (filing_year_delta = -2) because the prior-year M200's July
# deadline has not yet elapsed in April; that hook is deferred because Modelo
# 200 is only modelled from 2024 (year_from = 2024), so a 1P delta of -2 has no
# 2023 source revision to resolve against. Until Modelo 200 gains pre-2024
# coverage, 1P's base stays operator-entered (not silently bound to the wrong
# ejercicio). See the parked relation under .vault-scratch/coder-opus-is/.
