# Modelo 222 declaration-header casillas. This revision is scheduling/
# applicability-grade: it declares only the declaration header (ejercicio, tipo
# de declaración) grounded in the Orden HFP/227/2017 art 2 approval and the
# art. 40 LIS pago-fraccionado framework. The numbered money-closure casillas of
# the Anexo II record design are NOT declared here — no authoritative Modelo 222
# diseño de registro is bundled — so no casilla number is invented.

