# First reconcile-when-present verification for Modelo 604 revision
# 2019-y-siguientes: the sole computed casilla (02, "Total del resumen") is
# value-reconciled against the engine WHEN the filing prints it (a
# filed-vs-computed divergence surfaces a discrepancy), but is EXCLUDED from
# the coverage denominator (min_coverage = 0), so enrollment can never lower
# coverage or flip a legitimate filing's verdict. Grounded in the revision's
# own declared legal_refs/source_refs (Orden HAC/510/2021 arts. 1 and 3).
[[revisions."2019-y-siguientes".verification_expectations]]
id = "modelo-604-2019-y-siguientes-reconcile-when-present"
computed_casilla_ids = []
reconcile_when_present_casilla_ids = [
    "02",
]
tolerance = "0.01"
rounding = "money-2"
min_coverage = "0"
discrepancy_causes = ["extraction_unreliable", "unmodelled_rule", "rounding", "correctness_divergence"]
legal_refs = ["orden-hac-510-2021:art-3", "orden-hac-510-2021:art-1"]
source_refs = ["enrolled-modelo-604-procedure", "enrolled-modelo-604-layout"]
