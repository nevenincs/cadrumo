# Ley 35/2006 art. 48 — ejercicio-2024-origin negative general base
# compensation, this period.
#
# Cap (internal ceiling): the maximum compensable this period =
#   min(1388 opening pending, max(0, 25%·0432 − 0433)).
# Art. 48: the carried negative saldo is compensated "con el saldo positivo
# de las rentas previstas en el párrafo a) ... con el límite del 25 por
# ciento de dicho saldo positivo", in the same order. Casilla 0432 is the
# positive saldo (a); the in-year G/P negative (0433) already consumes part
# of that 25% allowance, so the residual headroom is max(0, 25%·0432 − 0433).
[[revisions."2025".formulas]]
id = "renta-2025-base-liquidable-negativa-general-2024-aplicada-maxima"
target = "base-liq-neg-general-2024-aplicada-maxima"
expression = { op = "min", args = [
    { casilla = "1388" },
    { op = "max", args = [
        { literal = "0" },
        { op = "subtract", args = [
            { op = "percent", args = [{ casilla = "0432" }, { literal = "25" }] },
            { casilla = "0433" },
        ] },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-48", "ley-35-2006:art-49", "ley-35-2006:art-50"]
source_refs = ["aeat-renta-2025-manual-parte1", "boe-modelo-100-2025-form"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["Base liquidable general negativa", "Pendiente de aplicación"]

# Remainder rolled forward (casilla 1390) = opening pending (1388) minus the
# amount applied this period (1389). Clamped non-negative: the elective
# applied amount cannot exceed the stock (BLOCKING predicate), so the
# subtraction is non-negative, and the clamp is defence-in-depth.
[[revisions."2025".formulas]]
id = "renta-2025-base-liquidable-negativa-general-2024-pendiente-fin"
target = "1390"
expression = { op = "max", args = [
    { literal = "0" },
    { op = "subtract", args = [{ casilla = "1388" }, { casilla = "1389" }] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-48", "ley-35-2006:art-50"]
source_refs = ["aeat-renta-2025-manual-parte1", "boe-modelo-100-2025-form"]

[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
