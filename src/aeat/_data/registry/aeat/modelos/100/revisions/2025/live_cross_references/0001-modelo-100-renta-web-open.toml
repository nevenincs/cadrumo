[[revisions."2025".live_cross_references]]
id = "modelo-100-renta-web-open"
evidence_tier = "executable_parity_evidence"
surface = "open_simulator"
guard_policy_id = "modelo-100-renta-web-open-read-only"
allowed_hosts = ["sede.agenciatributaria.gob.es", "www2.agenciatributaria.gob.es"]
allowed_methods = ["GET", "POST"]
forbidden_actions = [
    "authenticated-renta-web",
    "fiscal-data-read",
    "borrador-read",
    "filed-declaration-read",
    "server-side-save",
    "signing",
    "presentation",
    "payment",
    "amendment",
    "cancellation",
    "document-submission",
]
# Per the 2026-05-26 no-synthetic-sede-live-surfaces ADR, no AEAT-hosted
# live cross-reference may advertise synthetic_data_allowed = true.
# Renta WEB Open remains an open_simulator surface; only the input policy
# changes — synthetic taxpayer or form data must not be sent to Sede.
synthetic_data_allowed = false
requires_authentication = false
requires_aeat_authorization = false
legal_refs = ["orden-hac-277-2026:art-3"]
source_refs = ["aeat-renta-web-open"]
