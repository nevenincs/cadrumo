# Ley 35/2006 art. 48 — base imponible general negativa carry-forward,
# ejercicio 2024 origin: the amount of the carried negative general base
# (opening pending casilla 1388) the taxpayer ELECTS to compensate this
# period. Operator-elective manual input: compensation is a RIGHT, not a
# mandate ("su importe se compensará en los cuatro años siguientes ... La
# compensación deberá efectuarse en la cuantía máxima que permita cada uno
# de los ejercicios siguientes"), so applying LESS than the available
# pending / the 25% headroom is permitted. OVER-application is refused by
# the BLOCKING verification predicates
# modelo-100-2025-compensacion-base-neg-general-no-excede-stock (1389 <=
# 1388) and modelo-100-2025-compensacion-base-neg-general-no-excede-limite
# (1389 <= cap 1388-aplicada-maxima). The applied amount is consumed by the
# base imponible general formula (casilla 0435) as the art. 48 subtrahend,
# clamped non-negative; the remainder rolls to casilla 1390.
