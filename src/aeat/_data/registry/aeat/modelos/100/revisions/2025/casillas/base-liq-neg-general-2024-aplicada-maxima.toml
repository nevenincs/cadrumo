# Internal computed ceiling (Ley 35/2006 art. 48): the MAXIMUM ejercicio-2024
# negative general base compensable this period. Art. 48 compensates the
# carried negative saldo "con el saldo positivo de las rentas previstas en
# el párrafo a) ... con el límite del 25 por ciento de dicho saldo
# positivo", "en el mismo orden establecido". The positive saldo (a) is
# casilla 0432; the in-year G/P negative integration (casilla 0433 =
# min(0421, 25%·0432)) already consumes part of that 25% allowance, so the
# remaining headroom for the carried negative base is
# max(0, 25%·0432 − 0433). The ceiling is therefore
# min(1388 opening pending, max(0, 25%·0432 − 0433)).
#
# This is NOT an AEAT form box (no export_refs, internal_only): it is the
# app-internal ceiling consumed by the BLOCKING verification predicate that
# bounds the operator-elective applied amount (casilla 1389). Compensation
# is a RIGHT bounded by this ceiling, not a mandate — 1389 stays
# operator-elective and the gate only refuses OVER-application
# (1389 > this máxima), never forcing 1389 to the ceiling.
