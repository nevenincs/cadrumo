[help]
"0001" = "Selector for the taxpayer obtaining the business yield."
"0002" = "Box 0002: use this when electing to allocate advances from copyright exploitation income as the rights accrue."
"0003" = "Box 0003: gross amount of cash remuneration, including non-exempt compensatory pensions and maintenance annuities."
"0004" = "Box 0004: valuation of the employment income in kind."
"0005" = "Box 0005: payments on account corresponding to the employment income in kind."
"0006" = "Box 0006: payments on account passed on to the taxpayer."
"0007" = "Box 0007: gross amount calculated as box 0004 plus box 0005 minus box 0006."
"0008" = "Box 0008: employer contributions to pension plans, corporate social welfare plans, and mutual social welfare schemes, except collective dependency insurance, attributed to the taxpayer."
"0009" = "Box 0009: employer contributions to collective dependency insurance attributed to the taxpayer, including amounts derived from an employee decision."
"0010" = "Box 0010: computable amount of contributions to protected assets of persons with disabilities owned by the taxpayer."
"0011" = "Box 0011: reductions under article 18.2 and 18.3 and transitional provisions 11, 12, and 25 of the Income Tax Law."
"0012" = "Box 0012: total computable gross income from employment income using the stated box formula."
"0013" = "Box 0013: Social Security contributions, mandatory civil-servant mutual society contributions, passive-rights deductions, and orphan-school or similar contributions."
"0014" = "Box 0014: dues paid to trade unions."
"0015" = "Box 0015: professional association dues, when membership is mandatory and subject to the annual maximum."
"0016" = "Box 0016: legal defense expenses directly arising from disputes with the employer, subject to the annual maximum."
"0017" = "Box 0017: preliminary net employment income calculated from boxes 0012 through 0016."
"0018" = "Box 0018: sum of preliminary net income amounts reported in box 0017."
"0019" = "Box 0019: other deductible expenses for employment income."
"0020" = "Box 0020: increase for unemployed taxpayers who accept a job requiring a move to a new municipality."
"0021" = "Box 0021: increase for active workers who are persons with disabilities."
"0022" = "Box 0022: net employment income."
"0023" = "Box 0023: generally applicable amount for the employment-income reduction."
"0024" = "Box 0024: employer contributions to pension plans, corporate social welfare plans, and mutual social welfare schemes, except collective dependency insurance, derived from an employee decision."
"0025" = "Box 0025: reduced net employment income calculated as box 0022 minus box 0057 minus box 0023."
"0026" = "Box 0026: taxpayer who obtains the employment income."
"0027" = "Box 0027: interest from accounts, deposits, and financial assets in general."
"0028" = "Box 0028: interest from financial assets with the bonus provided in transitional provision 6 of the Corporate Income Tax Law."
