# Art. 58 LIRPF mínimo por descendientes aggregate. The derived-fact injector
# (`_inject_derived_minimo_descendientes_facts`) ranks every Art. 58.1-eligible
# descendant by birth_date, sums the birth-order tranche (Art. 58.1: 2.400 /
# 2.700 / 4.000 / 4.500 €) plus the Art. 58.2 menor-3 supplement (2.800 €), and
# applies the Art. 61.1ª custodia-compartida prorrata (0.5) per descendant,
# projecting the result onto the Decimal fact
# `renta_family.descendientes_minimos_aggregate_2021`. Feeds both casillas 0513
# (estatal) and 0514 (autonómico) — the autonómico half mirrors the estatal
# base absent a published per-CCAA figure.
[[revisions."2021".bindings]]
id = "renta-2021-profile-minimo-descendientes-estatal"
source = "profile"
selector = { profile_key = "renta_family.descendientes_minimos_aggregate_2021" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61"]
source_refs = ["aeat-dr-100-2021-dictionary", "aeat-renta-2021-manual-parte1"]

