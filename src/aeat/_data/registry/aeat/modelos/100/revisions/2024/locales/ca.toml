[help]
"0001" = "Selector del contribuent que obté els rendiments econòmics de l'activitat."
"0002" = "Casella 0002: utilitzeu-la quan s'opti per imputar les bestretes de rendiments per cessió de drets d'autor a mesura que es meritin els drets."
"0003" = "Casella 0003: import íntegre de les retribucions dineràries, incloses les pensions compensatòries i les anualitats per aliments no exemptes."
"0004" = "Casella 0004: valoració del rendiment del treball en espècie."
"0005" = "Casella 0005: ingressos a compte corresponents al rendiment del treball en espècie."
"0006" = "Casella 0006: ingressos a compte repercutits al contribuent."
"0007" = "Casella 0007: import íntegre calculat com la casella 0004 més la casella 0005 menys la casella 0006."
"0008" = "Casella 0008: contribucions empresarials a plans de pensions, plans de previsió social empresarial i mutualitats de previsió social, excepte assegurances col·lectives de dependència, imputades al contribuent."
"0009" = "Casella 0009: contribucions empresarials a assegurances col·lectives de dependència imputades al contribuent, incloses les quantitats derivades d'una decisió del treballador."
"0010" = "Casella 0010: import computable de les aportacions al patrimoni protegit de persones amb discapacitat del qual és titular el contribuent."
"0011" = "Casella 0011: reduccions segons l'article 18.2 i 18.3 i les disposicions transitòries 11a, 12a i 25a de la Llei de l'impost."
"0012" = "Casella 0012: total d'ingressos íntegres computables dels rendiments del treball segons la fórmula indicada."
"0013" = "Casella 0013: cotitzacions a la Seguretat Social, mutualitats generals obligatòries de funcionaris, detraccions per drets passius i cotitzacions a col·legis d'orfes o entitats similars."
"0014" = "Casella 0014: quotes satisfetes a sindicats."
"0015" = "Casella 0015: quotes satisfetes a col·legis professionals quan la col·legiació és obligatòria i amb el límit anual aplicable."
"0016" = "Casella 0016: despeses de defensa jurídica derivades directament de litigis amb l'ocupador, amb el límit anual aplicable."
"0017" = "Casella 0017: rendiment net previ del treball calculat amb les caselles 0012 a 0016."
"0018" = "Casella 0018: suma dels rendiments nets previs declarats a la casella 0017."
"0019" = "Casella 0019: altres despeses deduïbles dels rendiments del treball."
"0020" = "Casella 0020: increment per a contribuents desocupats que accepten un lloc de treball que exigeix traslladar la residència a un nou municipi."
"0021" = "Casella 0021: increment per a treballadors actius que són persones amb discapacitat."
"0022" = "Casella 0022: rendiment net del treball."
"0023" = "Casella 0023: quantia aplicable amb caràcter general per a la reducció dels rendiments del treball."
"0024" = "Casella 0024: aportacions de l'empresa a plans de pensions, plans de previsió social empresarial i mutualitats de previsió social, excepte assegurances col·lectives de dependència, derivades d'una decisió del treballador."
"0025" = "Casella 0025: rendiment net reduït del treball calculat com la casella 0022 menys la casella 0057 menys la casella 0023."
"0026" = "Casella 0026: contribuent que obté els rendiments del treball."
"0027" = "Casella 0027: interessos de comptes, dipòsits i actius financers en general."
"0028" = "Casella 0028: interessos d'actius financers amb dret a la bonificació prevista en la disposició transitòria 6a de la Llei de l'impost sobre societats."
"0029" = "Casella 0029: dividends i altres rendiments per la participació en fons propis d'entitats."
"0030" = "Casella 0030: rendiments procedents de la transmissió o amortització de Lletres del Tresor."
"0031" = "Casella 0031: rendiments procedents de la transmissió, amortització o reemborsament d'altres actius financers, excepte si s'han de consignar a la casella 0034."
"0032" = "Casella 0032: rendiments procedents de contractes d'assegurança de vida o invalidesa i d'operacions de capitalització."
"0033" = "Casella 0033: rendiments procedents de rendes causades per la imposició de capitals i altres rendiments del capital mobiliari integrables a la base imposable de l'estalvi."
"0034" = "Casella 0034: rendiments del capital mobiliari derivats de valors de deute subordinat o de participacions preferents."
"0035" = "Casella 0035: rendiments procedents d'assegurances de vida, dipòsits i contractes financers que instrumenten plans d'estalvi a llarg termini."
"0036" = "Casella 0036: total d'ingressos íntegres de l'apartat de rendiments del capital mobiliari de l'estalvi."
"0037" = "Casella 0037: despeses fiscalment deduïbles d'administració i dipòsit de valors negociables, exclusivament."
"0038" = "Casella 0038: rendiment net de l'apartat de rendiments del capital mobiliari de l'estalvi."
"0039" = "Casella 0039: reducció aplicable als rendiments derivats de determinats contractes d'assegurança segons la disposició transitòria 4a de la Llei de l'impost."
"0040" = "Casella 0040: rendiment net reduït després d'aplicar la reducció corresponent."
"0041" = "Casella 0041: suma dels rendiments reduïts del capital mobiliari que s'han d'integrar a la base imposable de l'estalvi."
"0042" = "Casella 0042: contribuent a qui correspon el rendiment del capital mobiliari."
"0043" = "Casella 0043: import total acumulat del capital diferit percebut el 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2023 i 2024 al rendiment del qual es va aplicar la disposició transitòria 4a."
"0044" = "Casella 0044: import total dels capitals diferits corresponents a assegurances de vida percebuts el 2024 al rendiment dels quals s'aplica la disposició transitòria 4a."
"0045" = "Casella 0045: contribuent que obté els rendiments del capital mobiliari."
"0046" = "Casella 0046: rendiments procedents del lloguer de béns mobles, negocis o mines, o de subarrendaments."
"0047" = "Casella 0047: rendiments procedents de la prestació d'assistència tècnica, excepte quan es realitza dins d'una activitat econòmica."
"0048" = "Casella 0048: rendiments procedents de la propietat intel·lectual quan el contribuent no és l'autor."
"0049" = "Casella 0049: utilitzeu-la quan s'opti per imputar les bestretes de rendiments per cessió de drets d'autor a mesura que es meritin els drets."
"0050" = "Casella 0050: rendiments procedents de la propietat industrial que no està afecta a una activitat econòmica."
"0051" = "Casella 0051: altres rendiments del capital mobiliari que s'han d'integrar a la base imposable general."
"0052" = "Casella 0052: total d'ingressos íntegres de l'apartat de rendiments del capital mobiliari de la base general."
"0053" = "Casella 0053: despeses fiscalment deduïbles de l'apartat de rendiments del capital mobiliari de la base general."
"0054" = "Casella 0054: rendiment net de l'apartat de rendiments del capital mobiliari de la base general."
"0055" = "Casella 0055: reduccions per rendiments generats en més de dos anys o obtinguts de manera notòriament irregular segons l'article 26.2 i la disposició transitòria 25a de la Llei de l'impost."
"0056" = "Casella 0056: rendiment net reduït de l'apartat de rendiments del capital mobiliari de la base general."
"0057" = "Casella 0057: reducció per rendiments acollits al règim fiscal de l'esdeveniment XXXVII Copa Amèrica Barcelona."
"0058" = "Casella 0058: import íntegre rebut de la Seguretat Social per prestacions INSS de maternitat o paternitat exemptes segons l'article 7.h de la Llei de l'IRPF."
"0060" = "Casella 0060: suma dels rendiments reduïts del capital mobiliari que s'han d'integrar a la base imposable general, procedent de la casella 0056."
"0062" = "Casella 0062: contribuent titular del bé immoble o del dret."
"0063" = "Casella 0063: percentatge de propietat que correspon al contribuent."
"0064" = "Casella 0064: percentatge d'usdefruit que correspon al contribuent."
"0065" = "Casella 0065: clau de situació del bé immoble."
"0066" = "Casella 0066: referència cadastral del bé immoble."
"0067" = "Casella 0067: indica que el bé immoble és urbà."
"0068" = "Casella 0068: indica que el bé immoble és rústic."
