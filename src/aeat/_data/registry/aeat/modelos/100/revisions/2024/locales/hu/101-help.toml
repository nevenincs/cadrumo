"0853" = "Adja meg a szokásos lakóhely bérlésére fordított összegek utáni levonást; ez az összeg a B.9 melléklet [1130] rovatába kerül át."
"0854" = "Adja meg a kereskedelmi társaságok alapításáról vagy tőkeemeléséről szóló megállapodásokból eredő részvény- és üzletrészszerzési befektetés utáni levonást."
"0855" = "Adja meg a gyermekek nemzetközi örökbefogadása utáni levonást."
"0856" = "Adja meg a fogyatékossággal élő adózók után járó levonást."
