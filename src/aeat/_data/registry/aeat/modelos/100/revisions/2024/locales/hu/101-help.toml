"0845" = "Adja meg az ebben a bevallásban alkalmazott, vállalkozási beruházást ösztönző kedvezmények és levonások teljes összegét a sémában megadott rovatszámítás szerint."
"0846" = "Adja meg a Murcia Régió Autonóm Közösségének kulturális örökségi jegyzékében szereplő javak adományozása utáni levonást."
"0847" = "Adja meg a nagycsaládok új szokásos lakóingatlanának megszerzése vagy a jelenlegi szokásos lakóingatlan bővítése utáni levonást."
"0848" = "Adja meg a 2024-ben keletkezett, még alkalmazásra váró összeget."
"0849" = "Adja meg az oktatási kiadások utáni levonást."
"0850" = "Adja meg a gyermekek születése vagy örökbefogadása, illetve kiskorúak családi nevelőszülői ellátása utáni levonást."
"0851" = "Adja meg az ökológiai célú adományok utáni levonást."
