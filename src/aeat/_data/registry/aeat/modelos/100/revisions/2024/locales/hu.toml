[help]
"0001" = "A vállalkozási jövedelmet megszerző adózó kiválasztója."
"0002" = "0002. mező: akkor használja, ha a szerzői jogok hasznosításából származó jövedelem előlegeit a jogok keletkezésével arányosan kívánja elszámolni."
"0003" = "0003. mező: pénzbeli juttatások bruttó összege, beleértve a nem mentes kompenzációs nyugdíjakat és tartásdíjakat."
"0004" = "0004. mező: természetbeni munkajövedelem értékelése."
"0005" = "0005. mező: a természetbeni munkajövedelemhez kapcsolódó adóelőleg-befizetések."
"0006" = "0006. mező: az adózóra továbbterhelt adóelőleg-befizetések."
"0007" = "0007. mező: bruttó összeg, a 0004. mező plusz a 0005. mező mínusz a 0006. mező."
"0008" = "0008. mező: munkáltatói hozzájárulások nyugdíjtervekhez, vállalati szociális előtakarékossági tervekhez és kölcsönös biztosító pénztárakhoz, a kollektív függőségi biztosítások kivételével, az adózóra imputált összegben."
"0009" = "0009. mező: az adózóra imputált munkáltatói hozzájárulások kollektív függőségi biztosításokhoz, beleértve a munkavállaló döntéséből eredő összegeket."
"0010" = "0010. mező: az adózó tulajdonában álló, fogyatékossággal élő személyek védett vagyonához tett hozzájárulások beszámítható összege."
"0011" = "0011. mező: csökkentések az adótörvény 18. cikkének 2. és 3. bekezdése, valamint 11., 12. és 25. átmeneti rendelkezése alapján."
"0012" = "0012. mező: munkajövedelemből származó összes beszámítható bruttó jövedelem a megadott képlet szerint."
"0013" = "0013. mező: társadalombiztosítási járulékok, köztisztviselői kötelező kölcsönös biztosítói hozzájárulások, passzív jogosultsági levonások és árvakollégiumi vagy hasonló hozzájárulások."
"0014" = "0014. mező: szakszervezeteknek fizetett tagdíjak."
"0015" = "0015. mező: szakmai kamaráknak fizetett tagdíjak, ha a tagság kötelező, az éves felső határ figyelembevételével."
"0016" = "0016. mező: a munkáltatóval folytatott jogvitákból közvetlenül eredő jogi védekezési költségek, az éves felső határig."
"0017" = "0017. mező: előzetes nettó munkajövedelem a 0012-0016. mezők alapján."
"0018" = "0018. mező: a 0017. mezőben szereplő előzetes nettó jövedelmek összege."
"0019" = "0019. mező: munkajövedelemhez kapcsolódó egyéb levonható költségek."
"0020" = "0020. mező: növelés munkanélküli adózóknak, akik olyan állást fogadnak el, amely új településre költözést igényel."
"0021" = "0021. mező: növelés fogyatékossággal élő aktív munkavállalók számára."
"0022" = "0022. mező: nettó munkajövedelem."
"0023" = "0023. mező: a munkajövedelem-csökkentéshez általánosan alkalmazandó összeg."
"0024" = "0024. mező: munkáltatói hozzájárulások nyugdíjtervekhez, vállalati szociális előtakarékossági tervekhez és kölcsönös biztosító pénztárakhoz, a kollektív függőségi biztosítások kivételével, a munkavállaló döntése alapján."
"0025" = "0025. mező: csökkentett nettó munkajövedelem, a 0022. mező mínusz a 0057. mező mínusz a 0023. mező."
"0026" = "0026. mező: a munkajövedelmet megszerző adózó."
"0027" = "0027. mező: számlák, betétek és pénzügyi eszközök kamatai általában."
"0028" = "0028. mező: olyan pénzügyi eszközök kamatai, amelyekre a társasági adóról szóló törvény 6. átmeneti rendelkezése szerinti kedvezmény vonatkozik."
