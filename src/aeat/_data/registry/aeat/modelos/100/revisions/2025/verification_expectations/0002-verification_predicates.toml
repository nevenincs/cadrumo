# gates on the operator-elective applied amount (casilla 1389), ejercicio-2024
# origin. Compensation is a RIGHT bounded by these ceilings, not a mandate:
# applying LESS than the maximum is permitted (cap_le_when_positive holds when
# the ceiling <= 0 and when the applied amount <= the ceiling); only
# OVER-application is refused.

# Stock BLOCKING gate (art. 48): the applied compensation (1389) cannot exceed
