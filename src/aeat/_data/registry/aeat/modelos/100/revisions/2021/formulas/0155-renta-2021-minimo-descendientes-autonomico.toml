# Art. 58/73 LIRPF mínimo por descendientes, parte autonómica. Feeds from the
# profile-derived autonómico aggregate, which resolves each birth-order tranche
# against the filer's declared tax-residence CCAA (Ley 22/2009 art. 46.1.a);
# Comunidad de Madrid publishes its own tercer/cuarto-y-siguientes tranche
# amounts for 2021 (Decreto Legislativo 1/2010 art. 2), every other CCAA
# mirrors the estatal aggregate exactly.
