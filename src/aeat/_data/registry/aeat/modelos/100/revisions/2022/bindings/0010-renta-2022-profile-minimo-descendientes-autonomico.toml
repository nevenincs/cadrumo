# Art. 58/61 LIRPF mínimo por descendientes aggregate, parte autonómica. The
# derived-fact injector (`_inject_derived_minimo_descendientes_facts`) computes
# this aggregate using the SAME Art. 58.1/58.2 birth-order-tranche method as
# the estatal half, but resolves each tranche amount against the filer's
# declared tax-residence CCAA first (Ley 22/2009 art. 46.1.a cedes normative
# competence over this figure to each comunidad). Comunidad de Madrid publishes
# its own full mínimo por descendientes table for 2022 (Ley 8/2022, efectos
# 1-1-2022, modifying Decreto Legislativo 1/2010 art. 2: 2.498,40 € / 2.810,70
# € / 4.400 € / 4.950 € + 2.914,80 € menor-3, vs the general LIRPF Art. 58
# 2.400 € / 2.700 € / 4.000 € / 4.500 € + 2.800 €); every other CCAA mirrors
# the estatal aggregate exactly. Feeds casilla 0514 (autonómico).
[[revisions."2022".bindings]]
id = "renta-2022-profile-minimo-descendientes-autonomico"
source = "profile"
selector = { profile_key = "renta_family.descendientes_minimos_aggregate_autonomico_2022" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-58", "ley-35-2006:art-61", "madrid-dl-1-2010:art-2"]
source_refs = ["aeat-dr-100-2022-dictionary", "aeat-renta-2022-manual-parte1"]

[[revisions."2022".bindings.source_citations]]
