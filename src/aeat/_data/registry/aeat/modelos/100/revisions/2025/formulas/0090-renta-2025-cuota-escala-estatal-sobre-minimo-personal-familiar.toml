                { parameter = "renta-2025-escala-estatal-base-general" },
            ] },
            { op = "lookup_bracket", args = [
                { casilla_id = "0521" },
                { parameter = "renta-2025-escala-estatal-base-general" },
            ] },
        ] },
        { op = "lookup_bracket", args = [
            { casilla_id = "0521" },
