[[revisions."2022".bindings]]
id = "renta-2022-modelo-100-estimacion-directa-es-normal"
# Intentionally manual_input: profile irpf.estimation_regime selects
# obligation families, while Modelo 100 casilla 0168 is a
# per-declaration modality flag consumed by formulas as a Decimal
# boolean operand. Operators supply this binding for the calculation.
source = "manual_input"
selector = { casilla = "0168", data_type = "boolean", true_value = "N", false_value = "S" }
aggregation = { op = "copy" }
typed_enum = "EstimacionDirectaModalidad"
legal_refs = ["ley-35-2006:art-30"]
source_refs = ["aeat-dr-100-2022-dictionary", "lirpf-cuota-chain-authority"]

[[revisions."2022".bindings.source_citations]]
source_ref = "lirpf-cuota-chain-authority"
required_text = ["estimación directa", "rendimiento neto"]
