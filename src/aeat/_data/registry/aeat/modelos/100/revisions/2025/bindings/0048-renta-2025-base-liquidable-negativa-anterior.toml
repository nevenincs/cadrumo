# Ley 35/2006 art. 49 — base liquidable general negativa carry-forward.
# The base liquidable general negativa generated in a year and left
# unapplied may be compensated in the four following ejercicios (art.
# 49.1.b: "la compensacion ... en los cuatro anios siguientes"). The
# prior year's end-of-year pending balance (the generated saldo casilla
# 1391, semantic_role irpf_anexo_c_base_liq_neg_generado) becomes the
# current year's opening pending balance for that origin ejercicio
# (casilla 1388, "Ejercicio 2024: Pendiente de aplicacion al principio
# del periodo"). This previous_filing copy auto-resolves casilla 1388
# from the prior filing so the operator does not re-key the carried
# saldo. The four-year expiry window is modelled as a chain of single-
# year copies; the year-tagged expiry guard and the integracion subtract
# that consumes the opening pending are deferred follow-ons.
[[revisions."2025".bindings]]
id = "renta-2025-base-liquidable-negativa-general-anterior"
source = "previous_filing"
selector = { source_modelo = "100", source_output = "1391", filing_year_delta = -1, period = "0A" }
aggregation = { op = "copy" }
legal_refs = ["ley-35-2006:art-49", "ley-35-2006:art-99", "rd-439-2007:art-109", "orden-hac-277-2026:art-3"]
source_refs = ["aeat-renta-2025-manual-parte1", "boe-modelo-100-2025-form", "aeat-dr-100-2025-dictionary"]

