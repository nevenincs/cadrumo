[[revisions."2010-y-siguientes".extraction_profiles]]
id = "modelo-390-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaracion"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "aeat.adapters.inbound.declaracion.parse_declaracion"
# M390 layout: box numbers sit in the right cuota column at x0≈413–414 (page 3) and
# x0≈412–413 (page 4).  Values appear to the right on the same y-row.  The leaf
# sub-total casillas (boxes 02/04/06/26/49) are often blank — a zero/not-applicable
# rate is a legitimate filing; min_coverage is 0 so partial coverage is accepted.
# The three summary-total targets (boxes 47/64/65) are always present in a valid
# M390 filing; the verification chain test asserts their presence independently.
target_casillas = [
    # Leaf bound casillas — supplied as inputs to the calculation engine.
    # Régimen ordinario sub-totals by IVA rate: box 02 (4%), 04 (10%), 06 (21%).
    {casilla_id = "iva.anual.repercutido.super-reducido", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^02$", value_offset = "right_of_number", anchor_x_min = 407.0, anchor_x_max = 425.0}},
    {casilla_id = "iva.anual.repercutido.reducido", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^04$", value_offset = "right_of_number", anchor_x_min = 407.0, anchor_x_max = 425.0}},
    {casilla_id = "iva.anual.repercutido.general", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^06$", value_offset = "right_of_number", anchor_x_min = 407.0, anchor_x_max = 425.0}},
    # Adquisiciones intracomunitarias de bienes 21%: box 26 feeds autorepercutido.intracomunitaria.
    {casilla_id = "iva.anual.autorepercutido.intracomunitaria", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^26$", value_offset = "right_of_number", anchor_x_min = 407.0, anchor_x_max = 425.0}},
    # Total cuotas deducibles operaciones interiores corrientes: box 49 (deducible section, page 4).
    {casilla_id = "iva.anual.soportado.interiores", match_strategy = "bbox_anchored", value_kind = "amount", bbox_anchor = {box_number_pattern = "^49$", value_offset = "right_of_number", anchor_x_min = 407.0, anchor_x_max = 425.0}},
    # Computed summary totals — extracted for corpus ground-truth comparison.
    # These are NOT supplied as engine inputs (input_kind = "computed").
    {casilla_id = "iva.anual.cuota-devengada-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Total\s+cuotas\s+IVA\s+y\s+recargo\s+de\s+equivalencia'},
    {casilla_id = "iva.anual.cuota-deducible-total", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Suma\s+de\s+deducciones'},
    {casilla_id = "iva.anual.resultado-regimen-general", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+r[eé]gimen\s+general\s+\(47\s*-\s*64\)'},
    {casilla_id = "iva.anual.compensacion-ultimo-periodo-97", match_strategy = "named_label", value_kind = "amount", label_pattern = '\{?\s*A\s+compensar'},
    {casilla_id = "iva.anual.compensacion-generada-ejercicio-no-97", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Cuotas\s+pendientes\s+de\s+compensaci[oó]n\s+generadas\s+en\s+el\s+ejercicio'},
]
confidence = "strict"
corpus_round_trip_verified = true
