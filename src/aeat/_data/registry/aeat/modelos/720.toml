# Per-asset / per-account / per-real-estate declaration threshold per
# RD 1065/2007 art. 42 bis–quater: only foreign accounts, securities,
# and real estate exceeding €50,000 (sum of opening/closing/4Q balances
# or year-end valuation) trigger the declaration obligation. Encoded
# as a static parameter for downstream detail-record validation.
