# Modelo 714 (patrimonio) construct.
#
# Phase-A landed the manual-casilla surface and official source grounding.
# Phase-B computes the cuota íntegra (casilla 29) from the Ley 19/1991 art. 30
# escala estatal and the art. 31 80%-floor reference (casilla 39). Both formulas
# are implemented from official evidence in the bundled authoritative corpus.
# The remaining downstream chain (límite conjunto, cuota minorada, cuota a
# ingresar) stays manual pending its own official formula evidence.

