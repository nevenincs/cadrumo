# Modelo 714 casilla 39 = 80 % de la cuota íntegra del Impuesto sobre el
# Patrimonio (suelo de la reducción por el límite conjunto IP+IRPF, Ley 19/1991
# art. 31). The límite conjunto (art. 31) caps the combined IP+IRPF cuota at 60 %
# of the IRPF base liquidable, but the IP-cuota reduction may not exceed 80 % of
# the IP cuota íntegra (so the IP cuota cannot fall below 20 % of its íntegra).
# Casilla 39 is that 80 %-reference value, computed unconditionally from the
# cuota íntegra (casilla 29). The "80 por 100" figure is verified against the
# bundled authoritative corpus `ley-19-1991-art-31.html`. The límite-conjunto
# step itself (casilla 33/40) needs the cross-modelo IRPF cuota and stays manual.

[[revisions."2021-y-siguientes".formulas]]
id = "patrimonio-reduccion-limite-80-suelo"
target_casilla_id = "patrimonio.reduccion-limite-80"
expression = { op = "percent", args = [
    { casilla_id = "patrimonio.cuota-integra" },
    { literal = "80" },
] }
rounding = "money-2"
legal_refs = ["ley-19-1991:art-31"]
source_refs = ["aeat-modelo-714-procedure", "boe-modelo-714-layout"]

