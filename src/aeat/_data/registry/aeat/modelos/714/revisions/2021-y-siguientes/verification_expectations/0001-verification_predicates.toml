# Modelo 714 (Impuesto sobre el Patrimonio) verification predicates.
#
# Soundness gate: casilla 40 (total cuota integra) must be determined when
# casilla 29 (cuota integra, art. 30 escala, formula-computed from base
# liquidable) resolves to a positive amount. Casilla 40 is a manual
# transcription of the official Diseno de Registro total -- there is no
# formula linkage from 29 to 40 in this revision, so a positive cuota
# integra with a silently-zero total cuota integra is an operator-skippable
# silent under-declaration the verify gate would otherwise grant with zero
# findings (no-silent-under-declaration). ADVISORY (non-blocking): this is
# the SAFE edge of the three M714 candidates -- the base-imponible to
# base-liquidable edge (minimo exento, Ley 19/1991 art. 28, can legitimately
# floor the base liquidable at zero for filers near the threshold) and the
# total-cuota-integra to cuota-a-ingresar edge (limite conjunto art. 31,
# Ceuta/Melilla bonificacion art. 33, foreign-tax-credit deduction art. 32)
# carry meaningful, confirmed false-positive risk and are a deliberate,
# documented non-guard rather than guessed at here; see the
# modelo-verify-nonzero-guards ADR and the modelo-verify-nonzero-guards audit
# (2026-06-30) for the full Wave-W02 investigation, the legal grounding, and
# the prerequisite registry-modelling work that would make either edge
# guardable.
[[revisions."2021-y-siguientes".verification_predicates]]
predicate_id = "modelo-714-cuota-integra-implica-total-cuota-integra"
expression = 'implies_nonzero(["patrimonio.cuota-integra", "patrimonio.total-cuota-integra"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-19-1991:art-30"]
