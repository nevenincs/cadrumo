# M115 declaracion_pdf extraction profile.
#
# Layout verdict: CONVERTED from numeric_casilla to named_label.
#
# M115 printed form (AEAT predeclaracion/quarterly retenciones-arrendamientos) uses
# the same two-column table layout as M111: box numbers appear at LINE-END inside
# bordered table cells, not at LINE-START.  The numeric_casilla match strategy
# (regex: ^\s*<N>\b...<amount>$) cannot match any casilla from a real AEAT M115 PDF.
#
# Label patterns grounded against the AEAT-published Diseno de Registro (DR) XLS:
#   src/aeat/_data/corpus/aeat_official/disenos_registro/modelo_115/files/
#     01-115-orden-eha-3435-2007-ejercicios-2019-y-siguientes-actualizado-febrero-2019-172-kb-xls.xls
#   Sheet "DR 11501", rows 16-20 (field descriptions, Windows-1252 decoded):
#     row 16: "Retenciones e ingresos a cuenta. Numero perceptores [01]"
#     row 17: "Retenciones e ingresos a cuenta. Base retenciones e ingresos a cuenta [02]"
#     row 18: "Retenciones e ingresos a cuenta. Retenciones e ingresos a cuenta [03]"
#     row 19: "Retenciones e ingresos a cuenta. Resultado anteriores declaraciones [04]"
#     row 20: "Retenciones e ingresos a cuenta. Resultado a ingresar [03] - [04]"
#
# The sub-label portions after "Retenciones e ingresos a cuenta. " map to the printed
# form row labels.  All 5 casilla labels are unique within the form.
#
# The named_label strategy anchors at LINE-START so casilla 02 ("Base de retenciones
# e ingresos a cuenta") and casilla 03 ("Retenciones e ingresos a cuenta") cannot
# collide: the regex ^\s*Retenciones... does not match a line beginning with "Base".
#
# Synthetic round-trip fixture:
#   src/aeat/tests/fixtures/justificantes/115/2024-1T.pdf

[[revisions."2019-y-siguientes".extraction_profiles]]
id = "modelo-115-declaracion-pdf"
surface = "declaracion_pdf"
artefact_kind = "declaracion"
accepted_artefact_kinds = ["declaration_pdf"]
parser = "aeat.adapters.inbound.declaracion.parse_declaracion"
target_casillas = [
    {casilla_id = "01", match_strategy = "named_label", value_kind = "amount", label_pattern = 'N[uú]mero\s+(?:de\s+)?perceptores'},
    {casilla_id = "02", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Base\s+(?:de\s+)?retenciones\s+e\s+ingresos\s+a\s+cuenta'},
    {casilla_id = "03", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Retenciones\s+e\s+ingresos\s+a\s+cuenta(?!\s+Base)'},
    {casilla_id = "04", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+(?:de\s+)?anteriores\s+(?:declaraciones|autoliquidaciones)'},
    {casilla_id = "05", match_strategy = "named_label", value_kind = "amount", label_pattern = 'Resultado\s+a\s+ingresar'},
]
confidence = "strict"
corpus_round_trip_verified = true
verification_source = "synthetic_from_aeat_published_text"
min_coverage = "1.0"
failure_semantics = "fail_hard"
legal_refs = ["ley-35-2006:art-99", "rd-439-2007:art-100", "orden-2000-11-20:apartado-primero", "rd-439-2007:art-108", "ley-35-2006:art-101"]
source_refs = ["aeat-dr-115-2019-v13", "aeat-modelo-115-guia-censal"]
