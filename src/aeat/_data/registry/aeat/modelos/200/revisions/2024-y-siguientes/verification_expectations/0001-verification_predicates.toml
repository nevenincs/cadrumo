# Soundness gate: the IS base imponible must be determined when the entity
# reports a positive accounting result. Without a derivation from resultado
# contable, casilla DP200014:00552 (base imponible) can be left silently zero
# while casilla 00501 (resultado de la cuenta de perdidas y ganancias antes de
# IS) is positive, yielding cuota integra cero -- a silent under-declaration the
# verify gate would otherwise grant. ADVISORY (non-blocking): a positive result
# with a legitimately zero base (BIN compensation, correcciones) is possible, so
# this surfaces an operator-facing advisory rather than refusing the draft, while
# the modelo-200-base-determination ADR tracks the durable derivation (Phase 2).
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-200-base-imponible-determinada-cuando-resultado-positivo"
expression = 'implies_nonzero(["00501", "DP200014:00552"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-30"]

# Elective-cap BLOCKING gate (LIS art. 26.1): the operator-elective applied BIN
# compensation (DP200014:00547) must NOT exceed the computed art.26.1 ceiling
# (DP200014:bin-aplicada-maxima = min(stock, max(1M, 70%·base previa))). When the
# ceiling is positive, an applied amount above it is an over-compensation the
# verify gate refuses; electing LESS than the ceiling is permitted (compensation
# is a right, not a mandate). cap_le_when_positive holds when the ceiling <= 0.
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-200-compensacion-bin-no-excede-limite-art-26"
expression = 'cap_le_when_positive(["DP200014:00547", "DP200014:bin-aplicada-maxima"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["ley-27-2014:art-26"]

# Stock BLOCKING gate (LIS art. 26): the applied BIN compensation cannot exceed
# the BIN stock available at the start of the period (casilla 00670). You cannot
# compensate more negative bases than you hold.
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-200-compensacion-bin-no-excede-stock-disponible"
expression = 'cap_le_when_positive(["DP200014:00547", "00670"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["ley-27-2014:art-26"]

# Art. 13 dotaciones-deterioro carry-integration advisory. The dotaciones por
# deterioro de créditos pending at the start of the period that HAVE met their
# deducibility conditions (casilla 01495, carried from the prior ejercicio's
# saldo final cumplido 01499 by the cross-year carry binding) are deductible
# THIS period — they integrate into the base imponible. When that cumplido stock
# is positive but the amount integrated this period (casilla 01496) is zero, the
# operator is carrying a now-deductible dotación without integrating it: a likely
# silent under-integration. ADVISORY (non-blocking): integrating is the
# operator's right, not a mandate — a taxpayer may legitimately defer (the stock
# carries forward via 01499→next-year 01495) — but the silent case is surfaced so
# the operator confirms rather than overlooks the deductible carry. Mirrors the
# no-silent-under-declaration advisory stance (positive input, zero dependent).
[[revisions."2024-y-siguientes".verification_predicates]]
predicate_id = "modelo-200-dotaciones-deterioro-cumplido-disponible-integrar"
expression = 'implies_nonzero(["01495", "01496"])'
finding_kind = "ADVISORY"
legal_refs = ["ley-27-2014:art-13"]
