            { key = "other", parameter = "is.modelo-200.cuota-integra-bracket-new-entity" },
            { key = "cooperativa", parameter = "is.modelo-200.cuota-integra-bracket-new-entity" },
            { key = "sin_fines_lucrativos", parameter = "is.modelo-200.cuota-integra-bracket-new-entity" },
        ] },
    ] },
    { op = "if_then_else", args = [
        { op = "less_than", args = [
            { binding = "modelo-200-2024-profile-incn-prior-12-months" },
            { literal = "1000000" },
        ] },
        { op = "lookup_bracket_by_entity_type", args = [
