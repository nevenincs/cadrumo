# Entity-type rate dispatch: the LIS art. 29 tipo de gravamen (casilla
# 00558) is selected through a three-lane priority hierarchy:
#
#   1. New-entity override (LIS Art. 29 par. 4, Ley 27/2014): if the
#      period state flag `new_entity_first_two_profit_periods` is set,
#      casilla 00558 = 15 % regardless of sub-form.
#   2. ERD lane (Ley 31/2022 Art. 39, periods from 2023): if the
#      prior-period INCN is below 1.000.000 EUR, sl/sa/sal/sll/
#      sociedad_civil_mercantil/other entities take the ERD 23 % rate;
#      cooperativas and entidades sin fines lucrativos retain their
#      special rates (20 % and 10 %) even when the INCN threshold is
#      met.
#   3. General sub-form lane: sl/sa/sal/sll/scm/other → 25 %;
#      cooperativas fiscalmente protegidas → 20 %; entidades sin fines
#      lucrativos → 10 %.
