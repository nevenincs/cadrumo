# Base imponible previa (casilla 00550, "B.I. antes de la compensación de bases
# imponibles negativas") = resultado contable (00501) + total correcciones de
# aumento (DP200013:00417) − total correcciones de disminución (DP200013:00418).
# The aumentos/disminuciones operands are the STORED column subtotals, not the
# per-row correccion leaves — summing the leaves here would double-count them
# against their own totals. This derivation is the durable fix for the silent
# zero-base under-declaration: a positive resultado contable now COMPUTES a
# non-zero base previa even with zero correcciones, so the verify gate can no
# longer grant verified_complete with finding_count = 0 on positive activity.
#
# Grounded against AEAT Manual práctico de Sociedades 2024 Cap. 5 (Liquidación
# I → III) and the diseño de registro 2024 (DP200012 pos 81, DP200013 pos
# 1560/1577, DP200014 pos 13). The LIS Art. 10 (base = renta del período) and
# Art. 11 (imputación temporal) definitional refs are not yet in the in-repo
# legal corpus — tracked for BOE ingest — so this formula cites the grounded
# determination-chain refs available today.
[[revisions."2024-y-siguientes".formulas]]
id = "modelo-200-base-imponible-previa"
target = "DP200014:00550"
expression = { op = "subtract", args = [
    { op = "add", args = [
        { casilla = "00501" },
        { casilla = "DP200013:00417" },
    ] },
    { casilla = "DP200013:00418" },
] }
rounding = "money-2"
legal_refs = ["ley-27-2014:art-15", "ley-27-2014:art-25", "ley-27-2014:art-26", "ley-27-2014:art-105"]
source_refs = ["aeat-dr-200-2025", "aeat-modelo-200-manual-2024"]

