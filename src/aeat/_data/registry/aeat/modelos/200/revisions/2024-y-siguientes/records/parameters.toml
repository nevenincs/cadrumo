# Entity-type-dispatched tipo gravamen parameters per LIS art. 29.
# Encode each special-regime rate as a discoverable parameter cited
# to the relevant LIS article. The new `lookup_parameter_by_entity_type`
# op (T1.3) consumes these via a dispatch_table keyed on a profile
# binding (entity_type ∈ {general, pyme, new_2y, cooperative,
# non_profit}). No formula consumes them today — the parameters
# carry the legal grounding ahead of the cuota-íntegra chain landing
# in a follow-on slice.

