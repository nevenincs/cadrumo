# Entity-type-dispatched tipo gravamen parameters per LIS art. 29.
# Each special-regime rate is a discoverable parameter cited to LIS
# art. 29. The `lookup_parameter_by_entity_type` op routes the scalar
# rates (general, new-entity, cooperative-protected, non-profit) via
# the `modelo-200-tipo-gravamen-por-forma-juridica` formula, keyed on
# the `modelo-200-2024-profile-legal-entity-form` profile binding.
#
# The micro-empresa rate is a TWO-BRACKET scale, not a flat scalar:
# LIS art. 29.1 charges 17 % on the 0-50.000 EUR base tranche and
# 20 % on the rest for periods initiated in 2025, and 19 % / 21 %
# for periods initiated in 2026 (AEAT Manual de Sociedades "Tipos de
# gravamen vigentes"; AEAT folleto actividades economicas 4.3). It is
# encoded as a `bracket_table` parameter so a base amount resolves to
# its cuota directly. `lookup_parameter_by_entity_type` requires a
# scalar parameter and so cannot dispatch the micro-empresa bracket
# table; routing a `pyme` profile through the cuota formula needs a
# `lookup_bracket_by_entity_type` runtime op, deferred to a follow-on
# slice. The corrected bracket data lands here regardless so no
# consumer can read the previous (wrong) flat 23 % value.

[[revisions."2024-y-siguientes".parameters]]
id = "is.modelo-200.tipo-gravamen-pyme"
data_type = "bracket_table"
unit = "EUR"
bracket_axis = "filing_period"
legal_refs = ["ley-27-2014:art-29"]
source_refs = ["aeat-modelo-200-manual-2024"]

[[revisions."2024-y-siguientes".parameters.source_citations]]
source_ref = "aeat-modelo-200-manual-2024"
required_text = ["tipo de gravamen"]

# Periods initiated in 2025: 17 % on 0-50.000 EUR, 20 % on the rest.
[[revisions."2024-y-siguientes".parameters.brackets]]
lower_bound = "0"
upper_bound = "50000"
fixed_addition = "0"
marginal_rate = "0.17"
valid_from = 2025-01-01
valid_to = 2025-12-31

[[revisions."2024-y-siguientes".parameters.brackets]]
lower_bound = "50000"
fixed_addition = "8500"
marginal_rate = "0.20"
valid_from = 2025-01-01
valid_to = 2025-12-31

# Periods initiated in 2026: 19 % on 0-50.000 EUR, 21 % on the rest.
[[revisions."2024-y-siguientes".parameters.brackets]]
