# -----------------------------------------------------------------------------
# Prior-quarter negative-result carry-forward (RD 439/2007 art. 110.5).
# When a quarter's "Diferencia" (casilla 17) is negative, the absolute value
# is carried forward as a deductible casilla 15 in the following quarter
# within the same ejercicio. The saldo-negativo-fin-periodo casilla exposes
# that carry-forward seed; casilla 15 picks it up via a previous_filing
# binding stamped by the resolver from the prior quarter.
# -----------------------------------------------------------------------------

[[revisions."2019-y-siguientes".casillas]]
id = "saldo-negativo-fin-periodo"
number = "saldo-negativo-fin-periodo"
label = "Saldo negativo trasladable a periodos posteriores (max 0, -casilla 17)"
section = ["computed_carry_forward"]
data_type = "money"
required = false
input_kind = "computed"
formula = "modelo-130-saldo-negativo-fin-periodo"
constraints = { sign = "non_negative", legal_refs = ["rd-439-2007:art-110"], source_refs = ["aeat-modelo-130-instructions"] }
legal_refs = ["rd-439-2007:art-110", "orden-eha-672-2007:art-1", "ley-35-2006:art-99", "rd-439-2007:art-95"]
source_refs = ["aeat-dr-130-2019-v12", "aeat-modelo-130-instructions"]

