# M131 estimación-objetiva módulos engine (Phase 1/Phase 2: fase 1ª
# "rendimiento neto previo" + fase 4ª "reducción general", tabled IAE
# activities). The eight operator-declared inputs (epígrafe + up to seven
# módulo unit counts — the highest signo count among the tabled activities,
# 644.1/644.2/644.3 comercio menor de pan/pastelería) are calculation-support
# casillas absent from the AEAT-published Diseño de Registros (no
# export_refs); the two computed casillas
# (modulos-rendimiento-neto-previo / -actividad) are internal_only. Together
# they feed a computed reference figure that the
# "modelo-131-2025-modulos-computed-diverges-de-c01" advisory compares
# against the operator-declared official casilla 01 ("Suma de rendimientos
# netos"), which remains the filed manual input
# (2026-07-01-modelo-131-eo-modulos-engine-adr, Option B — the fase-1-only
# product would over-state the figure if wired directly into casilla 01
# without the correcting stages; Phase 1 ships the guard, not a silent
# substitution).
#
# Grounded in LIRPF art. 31 (estimación objetiva) + Orden HAC/1347/2024 art. 4
# (Aprobación de los signos, índices o módulos) for fase 1ª, and Orden
# HAC/1347/2024 disposición adicional primera (5 por ciento reducción general,
# explicitly extended to the 2025 pagos fraccionados by apartado 3) for fase
# 4ª.
