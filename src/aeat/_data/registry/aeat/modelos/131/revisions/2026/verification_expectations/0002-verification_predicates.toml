# AEAT M131 Casilla 11 cap rule: when C10 is strictly positive, C11
# (resultados negativos de trimestres anteriores) MUST NOT exceed C10
# (cuota positiva del trimestre). Source: AEAT M131 instructions
# "en ningún caso podrá figurar en la casilla 11 un importe superior a
# la cantidad positiva consignada en la casilla 10". P08.S47 enforces
# this via the cap_le_when_positive predicate DSL operator.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-c11-cap-by-c10"
expression = 'cap_le_when_positive(["11", "10"])'
finding_kind = "BLOCKING_RULE"
legal_refs = ["rd-439-2007:art-110"]

# No-silent-under-declaration advisory. C01 ("Suma de rendimientos netos" —
# manual módulos sum for the datos-base activities) and C02 ("Pago fraccionado
# previo por datos-base" — manual) are both operator inputs because the módulos
# rendimiento is determined externally (the annual Orden de módulos tables, not
# modelled in the registry).
#
# Legal attribution:
# - RD 439/2007 art. 110.1.b establishes the datos-base determination
#   obligation: "el 4 por ciento de los rendimientos netos resultantes de la
#   aplicación de dicho método en función de los datos-base del primer día del
#   año". This is the reglamentary basis for C02 being determined from C01.
# - The official M131 instructions (aeat-modelo-131-instructions, Casilla 02)
#   establish the C02 percentage scale for estimación objetiva datos-base
#   activities: 4 / 3 / 2 por 100 keyed on personal asalariado at the
#   datos-base reference date. The 2 por 100 is the scale minimum.
# - RD 439/2007 art. 110.4 grants the right to apply higher percentages;
#   the instructions confirm "no se permiten porcentajes inferiores" to the
#   scale minimums.
#
# A strictly positive C01 therefore ALWAYS yields a strictly positive C02
# (the scale minimum is 2 por 100 > 0); C02 = 0 on a positive C01 is a silent
# under-declaration (the datos-base section contributes nothing to
# C07 = C02 + C04 + C06, so the resultado collapses to zero on positive módulos
# activity). ADVISORY (non-blocking): the implication holds trivially when C01
# is absent or zero, so a filer with no datos-base activity raises nothing.
# There is no legitimate positive-C01/zero-C02 case, so the advisory is
# false-positive-free. The durable fix is modelling the módulos determination
# itself (Orden de módulos signos × índices correctores) so C01 and C02 become
# computed — a campaign-sized follow-up; until it lands this advisory makes the
# under-declaration non-silent, mirroring the M200 base-imponible advisory.
[[revisions."2026".verification_predicates]]
predicate_id = "modelo-131-2026-pago-fraccionado-determinado-cuando-rendimientos-positivos"
expression = 'implies_nonzero(["01", "02"])'
finding_kind = "ADVISORY"
legal_refs = ["rd-439-2007:art-110"]
