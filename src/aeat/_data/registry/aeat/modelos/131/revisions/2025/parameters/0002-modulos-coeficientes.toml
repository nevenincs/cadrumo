# Phase 3 (2026-07-02, #516): comercio al por menor de textil/calzado (651.x),
# droguería/perfumería (652.2 y 3), mueble/electrodomésticos/menaje (653.x,
# 654.x, 659.x, 662.2), comercio ambulante (663.x), hospedaje (681-683),
# reparaciones (691.x, 692, 699), and transporte urbano colectivo (721.1 y 3).
# Cross-checked byte-identical between the bundled consolidated Orden
# HAC/1347/2024 Anexo II (corpus/normatives/html/orden-hac-1347-2024.html) AND
# the AEAT Manual práctico de Renta 2025, Parte 1, Capítulo 8 "Apéndice:
# Rendimientos anuales por unidad de módulo antes de amortización aplicables
# en el ejercicio 2025" (legal-grounding-verifies-bundled-authoritative-corpus).
#
# Corpus-typo correction: the bundled Orden HTML módulo 2 figure for 651.3 y 5
# reads "11.998.85" (a literal period-for-comma decimal-separator typo,
# verbatim in the official BOE-published HTML — flagged by the Phase 2
# author). The AEAT Manual Renta 2025 states the same row as "11.998,85"
# (comma decimal separator, i.e. eleven thousand nine hundred ninety-eight
# euros and eighty-five cents) with no ambiguity. The manual's figure is used
# below; both sources otherwise agree on this row's other three módulos.
#
# Two epígrafe collisions deliberately deferred (NOT tabled here): 659.4
# (two distinct activities share the same IAE code — "Comercio al por menor
# de libros, periódicos, artículos de papelería..." vs "...de prensa,
# revistas y libros en quioscos...") and 691.9 ("Reparación de calzado" vs
# "Reparación de otros bienes de consumo n.c.o.p."). The keyed_bracket_table
# key is "<epígrafe>:<módulo>" with no third axis to disambiguate two
# same-code activities, so tabling either would silently misattribute the
# other's coefficients. Flagged here for the next author who reaches these
# epígrafes — resolving them needs either a registry key-shape extension
# (a third disambiguating axis) or an explicit epígrafe-suffix convention
# agreed with the operator before authoring.

