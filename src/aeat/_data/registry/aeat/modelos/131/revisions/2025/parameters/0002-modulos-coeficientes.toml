# M131 estimación-objetiva módulos coefficient table (Fase 1ª: rendimiento neto
# previo). Keyed-bracket-table parameter mapping "<epígrafe IAE>:<módulo>" to
# the "rendimiento anual por unidad antes de amortización" (Anexo II, Orden
# HAC/1347/2024, art. 4). Lookup is exact-match on the composite key; there is
# no interval-overlap semantics because the domain is a discrete (epígrafe,
# módulo) catalogue, not a numeric-continuous base.
#
# Phased dataset (2026-07-01-modelo-131-eo-modulos-engine-adr, Option B): only
# activities GROUNDED and cross-checked against the bundled corpus are tabled
# here; the ~80+-activity Orden Anexo II remains a phased, incremental
# authoring backlog (#516). An epígrafe absent from this table is NOT computed
# by the engine; casilla 01 stays reachable as a manual operator input and the
# "modelo-131-2025-modulos-computed-diverges-de-c01" advisory fires instead of a
# silent zero (no-silent-under-declaration).
#
# Phase 1 (2026-07-01): transporte por autotaxis (721.2), transporte de
# mercancías por carretera (722), peluquería (972.1).
# Phase 2 (2026-07-02): café-bar / restaurante (671.4, 671.5, 672.1-2-3, 673.1,
# 673.2) and comercio al por menor de alimentación (642.1-2-3-4, 642.5, 642.6,
# 643.1-2, 644.1, 644.2, 644.3, 644.6, 647.1, 647.2-3) — the ADR's named
# next-priority groups.
#
# Cross-checked against the bundled consolidated Orden HAC/1347/2024 Anexo II
# (corpus/normatives/html/orden-hac-1347-2024.html) AND against the AEAT Manual
# práctico de Renta 2025, Parte 1, Capítulo 8 "Apéndice: Rendimientos anuales
# por unidad de módulo antes de amortización aplicables en el ejercicio 2025"
# — both sources state byte-identical euro figures for every row below
# (legal-grounding-verifies-bundled-authoritative-corpus). One noted anomaly:
# the bundled Orden HTML (corpus row at 651.3 y 5, key "651.3", not tabled
# here) carries a literal typo "11.998.85" (period instead of comma decimal
# separator) verbatim in the official BOE-published HTML; no row below is
# affected by this anomaly, flagged here for the next author who reaches that
# epígrafe.
[[revisions."2025".parameters]]
id = "m131-modulos-coeficientes-2025"
data_type = "keyed_bracket_table"
unit = "euro_per_unit"
legal_refs = ["orden-hac-1347-2024:art-4"]
source_refs = ["aeat-renta-2025-manual-parte1"]

[[revisions."2025".parameters.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = [
    "Rendimientos anuales por unidad de módulo antes de amortización aplicables en el ejercicio 2025",
]

