# M131 estimación-objetiva módulos engine formulas (Phase 1/Phase 2 tabled
# activities).
#
# Fase 1ª — rendimiento neto previo: dispatches the units×coefficient product
# through the m131_resolve_modulos_previo op, which reads the epígrafe (text)
# plus up to seven módulo unit-count casillas (the highest signo count among
# the tabled activities, 644.1/644.2/644.3) and the registry-declared
# keyed-bracket coefficient table (m131-modulos-coeficientes-2025). An
# untabled epígrafe or a blank epígrafe resolves to zero (see the op's
# docstring in _formula_runtime.py).
[[revisions."2025".formulas]]
id = "modelo-131-2025-modulos-rendimiento-neto-previo"
target_casilla_id = "modulos-rendimiento-neto-previo"
expression = { op = "m131_resolve_modulos_previo", args = [
    { casilla_id = "modulos-epigrafe" },
    { casilla_id = "modulos-1-unidades" },
    { casilla_id = "modulos-2-unidades" },
    { casilla_id = "modulos-3-unidades" },
    { casilla_id = "modulos-4-unidades" },
    { casilla_id = "modulos-5-unidades" },
    { casilla_id = "modulos-6-unidades" },
    { casilla_id = "modulos-7-unidades" },
    { parameter = "m131-modulos-coeficientes-2025" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:art-4"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = [
    "Rendimientos anuales por unidad de módulo antes de amortización aplicables en el ejercicio 2025",
]

# Fase 2ª — rendimiento neto minorado: previo minus the sum of the minoración
# por incentivos al empleo (Orden HAC/1347/2024 Anexo II, instrucción 2.2.a)
# and the minoración por incentivos a la inversión (instrucción 2.2.b). The
# empleo minoración dispatches through the m131_resolve_modulos_minoracion_
# empleo op (epígrafe, current/prior módulo 1 unit counts, coefficient table,
# tramos bracket table, incremento constant). The inversión minoración is the
# operator-declared "modulos-minoracion-inversion" casilla (a euro amount) —
# this first slice does not model a per-element libro registro de bienes de
# inversión, so the amortization figure is supplied by the operator rather
# than derived from an asset register the engine does not have; a blank
# input simply omits this legitimate additional reduction (never over-states
# the minorado, per the ADR's Option D concern about over-statement, which
# does not apply here since omission only under-claims a reduction, never
# fabricates one). Both minoraciones feed an internal advisory-support
# casilla that never substitutes for the operator's manual casilla 01.
[[revisions."2025".formulas]]
id = "modelo-131-2025-modulos-rendimiento-neto-minorado"
target_casilla_id = "modulos-rendimiento-neto-minorado"
expression = { op = "subtract", args = [
    { casilla_id = "modulos-rendimiento-neto-previo" },
    { op = "add", args = [
        { op = "m131_resolve_modulos_minoracion_empleo", args = [
            { casilla_id = "modulos-epigrafe" },
            { casilla_id = "modulos-1-unidades" },
            { casilla_id = "modulos-1-unidades-anterior" },
            { parameter = "m131-modulos-coeficientes-2025" },
            { parameter = "m131-modulos-coeficiente-tramos-asalariados-2025" },
            { parameter = "m131-modulos-coeficiente-incremento-asalariados-2025" },
        ] },
        { casilla_id = "modulos-minoracion-inversion" },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:instruccion-2-2-a", "orden-hac-1347-2024:instruccion-2-2-b"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["Fase 2ª: Determinación del rendimiento neto minorado"]

# Fase 3ª — rendimiento neto de módulos: minorado adjusted by the índice
# corrector de exceso (Orden HAC/1347/2024 Anexo II, instrucción 2.3.b.3).
# Dispatches through the m131_resolve_modulos_indice_exceso op. Only the
# índice de exceso is modelled in this first slice — the other índices
# correctores (especiales por actividad, pequeña dimensión, temporada,
# inicio de nuevas actividades) are conditional on taxpayer facts
# (población del municipio, número de vehículos, ejercicio de inicio) not
# yet modelled, and are legitimate reductions/increases the taxpayer may or
# may not qualify for; omitting them keeps this an internal advisory-support
# figure, never a substitute for the operator's manual casilla 01.
[[revisions."2025".formulas]]
id = "modelo-131-2025-modulos-rendimiento-neto-modulos"
target_casilla_id = "modulos-rendimiento-neto-modulos"
expression = { op = "m131_resolve_modulos_indice_exceso", args = [
    { casilla_id = "modulos-epigrafe" },
    { casilla_id = "modulos-rendimiento-neto-minorado" },
    { parameter = "m131-modulos-cuantia-exceso-2025" },
    { parameter = "m131-modulos-indice-exceso-2025" },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:instruccion-2-3-b-3"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["Fase 3ª: Determinación del rendimiento neto de módulos"]

# Fase 4ª — rendimiento neto de la actividad: módulos minus the 5 por 100
# reducción general (Orden HAC/1347/2024 DA-1, apartados 1 y 3).
[[revisions."2025".formulas]]
id = "modelo-131-2025-modulos-rendimiento-neto-actividad"
target_casilla_id = "modulos-rendimiento-neto-actividad"
expression = { op = "subtract", args = [
    { casilla_id = "modulos-rendimiento-neto-modulos" },
    { op = "percent", args = [
        { casilla_id = "modulos-rendimiento-neto-modulos" },
        { parameter = "m131-modulos-reduccion-general-2025" },
    ] },
] }
rounding = "money-2"
legal_refs = ["ley-35-2006:art-31", "orden-hac-1347-2024:da-1"]
source_refs = ["aeat-renta-2025-manual-parte1"]
[[revisions."2025".formulas.source_citations]]
source_ref = "aeat-renta-2025-manual-parte1"
required_text = ["reducción general del 5 por 100"]
