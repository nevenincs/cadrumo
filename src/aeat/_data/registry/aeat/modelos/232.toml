# Per-related-party transaction-volume threshold per RD 634/2015
# art. 13.4: declaration of operaciones vinculadas is mandatory when
# the aggregate transactions per related party exceed €100,000 in
# the tax year (some categories have lower €250,000 thresholds for
# specific transaction types; this is the primary general threshold).
# Encoded as a static parameter for downstream detail-record
# validation.
[[revisions."2018-y-siguientes".parameters]]
id = "modelo-232-related-party-threshold-eur"
data_type = "money"
unit = "EUR"
legal_refs = ["rd-634-2015:art-13"]
source_refs = ["aeat-modelo-232-procedure"]

