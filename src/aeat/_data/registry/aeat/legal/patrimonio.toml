notes = "Ley 19/1991 Art. 31 — límite de la cuota íntegra. La cuota del IP junto con las cuotas del IRPF no puede exceder del 60 % de la suma de las bases imponibles del IRPF; cuando se supera, la cuota del IP se reduce sin que la reducción exceda del 80 % (suelo del 20 %)."
