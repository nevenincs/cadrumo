# Legal authority catalogue — Impuesto sobre el Patrimonio (Modelo 714)
#
# Ley 19/1991 establishes the annual Impuesto sobre el Patrimonio (IP), a
# tax on the net wealth of resident individuals and Spanish-sited wealth of
# non-residents. The declaration is Modelo 714 (Orden HAC/1023/2021).
# The obligation threshold is €700.000 net wealth nationally (Art. 28 Ley 19/1991),
# with autonomic-community variation: Comunitat Valenciana €600.000, some CCAAs
# €700.000 or €1.000.000. Full casilla authoring is pending.

