# PROVENANCE: agent-authored (claude-opus, 2026-06-14) under the
# aeat-grounding-completion campaign, grounding audit finding V3 (the módulos
# exclusion limits existed only in corpus reference text, never as enforceable
# registry values). The legal entry below is AGENT-AUTHORED but grounded in the
# AUTHORITATIVE bundled consolidated LIRPF corpus (ley-35-2006.html), not a
# secondary source: the corpus cross-check therefore validates against text the
# project already ships and trusts. The legal catalogue is a human-reviewed,
# filing-grade surface (review_status is Literal["reviewed"]); `reviewed_by`
# records the agent author and the operator should re-stamp after confirming.
#
# TEMPORAL SCOPE — IMPORTANT: per the authoritative bundled corpus, LIRPF DT 32ª
# fixes the art. 31.1.3ª magnitudes ONLY for the ejercicios 2016 a 2024. The
# attempted extensions to 2025/2026 (RD-ley 9/2024, RD-ley 16/2025, RD-ley
# 2/2026) were each DEROGATED by Congreso resolutions (latest BOE-A-2026-4667,
# 26-feb-2026), so for 2025+ the DT 32ª override is repealed and the exclusion
# magnitudes are legally UNRESOLVED in the bundled source (they do not simply
# carry forward). These parameters are the settled 2016-2024 values; a consumer
# (the future W01.P02 advisory gate) MUST gate on filing year and treat 2025+ as
# unresolved rather than applying 250.000/125.000 universally.
#
# Binding provision: Ley 35/2006 DT 32ª — the 150.000/75.000 EUR rendimientos-
# íntegros limits (art. 31.1.3ª.b.a') become 250.000/125.000 EUR, and the 150.000
# EUR volumen-de-compras limit (art. 31.1.3ª.c) becomes 250.000 EUR. The
# agrícolas/ganaderas/forestales limit (art. 31.1.3ª.b, not a DT 32ª override) is
# deferred until art. 31 itself is grounded.

