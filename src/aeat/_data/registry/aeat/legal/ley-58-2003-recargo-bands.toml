# Recargo schedule per Ley 58/2003 art-27.2 (Ley General Tributaria) for
# self-assessments filed after the deadline without prior AEAT notice.
#
# Post-Ley 11/2021 regime (Art. 27.2): the recargo is 1% plus a further 1%
# for each COMPLETED month of delay, with NO intereses de demora while the
# filing is inside the first 12 months. A fractional (incomplete) month does
# NOT count — the law says "por cada mes completo de retraso" — so the graduated
# schedule is keyed on COMPLETED months, not on a day-bracket approximation. The
# graduated scale therefore runs 1% (0 completed months) up to 13% at exactly 12
# completed months (the twelve-month anniversary of the plazo).
#
# The 15% + intereses de demora tail applies only when the filing is presented
# "una vez transcurridos 12 meses" — i.e. STRICTLY AFTER the twelve-month
# anniversary. The statute pins this boundary explicitly: intereses de demora run
# "desde el día siguiente al término de los 12 meses posteriores a la finalización
# del plazo", so the anniversary date itself still belongs to the graduated band
# and the 15% tail begins the following day. Band resolution for this tail is
# date-gated in build_recovery_for_overdue (strictly-beyond-12-months), because a
# completed-months count alone cannot distinguish the anniversary (13%) from the
# day after (15%): both report 12 completed months.
#
# Reference: ley-58-2003:art-27.2

[[band]]
id = "completed_months_0"
min_completed_months = 0
max_completed_months = 0
surcharge_pct = "1.00"
interest_applies = false
legal_ref = "ley-58-2003:art-27.2"

