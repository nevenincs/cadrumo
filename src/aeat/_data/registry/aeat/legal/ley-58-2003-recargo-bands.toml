# Recargo schedule per Ley 58/2003 art-27.2 (Ley General Tributaria) for
# self-assessments filed after the deadline without prior AEAT notice.
#
# Post-Ley 11/2021 regime (Art. 27.2): the recargo is 1% plus a further 1%
# for each COMPLETED month of delay, with NO intereses de demora for the first
# 12 months; once 12 completed months have elapsed the recargo is 15% plus
# intereses de demora. A fractional (incomplete) month does NOT count — the law
# says "por cada mes completo de retraso" — so the schedule is keyed on
# COMPLETED months, not on a day-bracket approximation.
#
# Reference: ley-58-2003:art-27.2

