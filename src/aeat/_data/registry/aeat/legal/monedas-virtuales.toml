# Legal registry for monedas virtuales (criptomonedas) obligations.
#
# CORRECTION APPLIED 2026-06-02 (per ADR 2026-06-02-modelo-721-cripto-data-fidelity):
# The original file (reviewed 2026-05-27) registered Modelo 721 under
# Orden HFP/887/2023 = BOE-A-2023-18679, which is the order that approves the
# CUSTODIAN-SIDE models 172/173. Modelo 721 is approved by a DISTINCT order:
#   Orden HFP/886/2023 = BOE-A-2023-17429
# The statutory obligation (DA-10 of Ley 11/2021) amended DA-18 of Ley 58/2003
# (letter d) — the SAME DA-18 that grounds Modelo 720. First ejercicio is 2023
# (filed Jan–Mar 2024), NOT 2022. All three errors are corrected below.
# The ley-11-2021:da-10 entry is retained (it is the enabling statute) but the
# obligation anchor is fixed to ley-58-2003:da-18 (the operative provision).


