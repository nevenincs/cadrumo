notes = "Spain-United Kingdom double-taxation treaty art 6: immovable-property income may be taxed in the state where the immovable property is situated. Row-level authority for the GB/general M210 convenio allocation seed; the 24 percent figure remains grounded by TRLIRNR art 25.1.a."
required_text = ["Rentas inmobiliarias", "pueden someterse a imposicion en ese otro Estado", "arrendamiento"]

