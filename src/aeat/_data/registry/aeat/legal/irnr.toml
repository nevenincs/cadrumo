review_status = "reviewed"
reviewed_at = 2026-05-27
reviewed_by = "wgergely"
notes = "TRLIRNR art 25.1.f: tipo de gravamen reducido 19 por ciento aplicable a ganancias patrimoniales, transmisiones y rendimientos similares obtenidos por contribuyentes residentes en otro Estado miembro de la UE o del EEE con efectivo intercambio de informacion. Soporte legal de la fila tipo_renta=ganancia_patrimonial del parametro registry m210-tipo-gravamen-2025 (Phase 1) y precursor de las filas inmobiliaria/pension de Phase 2."

