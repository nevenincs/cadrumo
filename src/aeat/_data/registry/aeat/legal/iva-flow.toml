published_at = 1992-12-31
effective_from = 1993-01-01
review_status = "reviewed"
reviewed_at = 2026-05-15
reviewed_by = "wgergely"
notes = "Reglamento del IVA art 71: liquidacion del Impuesto, normas generales. Establece la obligacion de autoliquidacion de los sujetos pasivos, las periodicidades trimestral y mensual, la declaracion resumen anual y las exoneraciones. Base reglamentaria comun de los Modelos 303 (autoliquidacion), 309 (no periodica), 322 (REGE individual), 353 (REGE agregada) y 390 (resumen anual)."
required_text = [
    "Liquidación del Impuesto. Normas generales",
    "los sujetos pasivos deberán realizar por sí mismos la determinación de la deuda tributaria",
    "El período de liquidación coincidirá con el trimestre natural",
]

