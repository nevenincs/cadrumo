published_at = 1992-12-29
effective_from = 1993-01-01
review_status = "reviewed"
reviewed_at = 2026-05-15
reviewed_by = "wgergely"
notes = "LIVA art 21: exenciones en las exportaciones de bienes. Cubre entregas a fuera de la Comunidad por el transmitente o por el adquirente no establecido, regimen de viajeros (residentes fuera de la UE), tiendas libres de impuestos, trabajos sobre bienes muebles para exportacion y entregas a Organismos reconocidos. Es la base sustantiva del Modelo 308 cuando este lo invoca."
required_text = [
    "Exenciones en las exportaciones de bienes",
    "expedidos o transportados fuera de la Comunidad",
    "entregas de bienes a viajeros",
]

