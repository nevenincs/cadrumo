notes = "RIRPF art 80: importe de las retenciones sobre rendimientos del trabajo. Establece el regimen de tipos de retencion: regla general personalizada via tablas del art 86; 35 por ciento para retribuciones de administradores y consejeros (reducido al 19 por ciento si la cifra de negocios de la entidad es inferior a 100.000 euros); 15 por ciento para rendimientos por cursos, conferencias, seminarios y obras literarias, artisticas o cientificas. Base reglamentaria de la retencion sobre rendimientos del trabajo en Modelo 111 (trimestral) y Modelo 190 (resumen anual)."
