notes = "LIRPF art 8 defines IRPF taxpayers as natural persons with habitual residence in Spain or the foreign-residence circumstances in art 10, and excludes non-IS civil societies, herencias yacentes, comunidades de bienes, and LGT art 35.4 entities from direct IRPF taxpayer status. Grounds the natural_person and attribution_entity split on the profile entity-type axis."
required_text = [
    "Son contribuyentes por este impuesto",
    "Las personas físicas",
    "No tendrán la consideración de contribuyente las sociedades civiles no sujetas al Impuesto sobre Sociedades",
    "Sección 2.ª del Título X",
]

[legal."ley-35-2006:art-9"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a9"
document_id = "BOE-A-2006-20764"
article = "9"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a9"
published_at = 2006-11-29
effective_from = 2007-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex (agent-authored from bundled ley-35-2006.html#a9; operator to re-stamp)"
notes = "LIRPF art 9 defines habitual residence in Spanish territory for IRPF taxpayers using the 183-day permanence test, the main centre/base of activities or economic interests, and the family presumption. Grounds the resident_irpf branch of taxpayer fiscal-residency profile selection."
required_text = [
    "residencia habitual en territorio español",
    "más de 183 días",
    "núcleo principal o la base de sus actividades",
]

[legal."ley-35-2006:art-11"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a11"
document_id = "BOE-A-2006-20764"
article = "11"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a11"
published_at = 2006-11-29
effective_from = 2007-01-01
review_status = "reviewed"
reviewed_at = 2026-06-15
reviewed_by = "claude-opus (agent-authored from bundled ley-35-2006.html#a11; operator to re-stamp)"
notes = "LIRPF art 11: individualización de rentas — la renta se entiende obtenida por los contribuyentes en función del origen o fuente (rendimientos del trabajo por quien genera el derecho, del capital por los titulares de los elementos, de actividades por quien las realiza, ganancias por los titulares). Base legal de las casillas 'Contribuyente que obtiene los rendimientos / a quien corresponde la imputación / titular' del Modelo 100 (toma de datos ampliada). AGENT-AUTHORED, grounded in the bundled authoritative ley-35-2006.html#a11; operator to confirm and re-stamp."
required_text = [
    "Individualización de rentas",
]

[legal."ley-35-2006:art-17"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a17"
document_id = "BOE-A-2006-20764"
article = "17"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a17"
published_at = 2006-11-29
effective_from = 2020-02-06
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 17: defines rendimientos integros del trabajo from employment, statutory, pension and similar sources, while excluding items that qualify as economic-activity income. Current consolidated redaction was published 2020-02-05 and is in force from 2020-02-06."
required_text = [
    "Rendimientos íntegros del trabajo.",
    "contraprestaciones o utilidades",
    "trabajo personal o de la relación laboral o estatutaria",
    "Las pensiones y haberes pasivos percibidos",
    "se calificarán como rendimientos de actividades económicas",
]

[legal."ley-35-2006:art-18"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a18"
document_id = "BOE-A-2006-20764"
article = "18"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a18"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 18: governs reduction percentages for certain work income, including the 30 percent reduction for qualifying irregular or multi-year work income and the 300,000 EUR annual base cap. Current consolidated redaction was published 2014-11-28 and is in force from 2015-01-01."
required_text = [
    "Porcentajes de reducción aplicables a determinados rendimientos del trabajo.",
    "El 30 por ciento de reducción",
    "período de generación superior a dos años",
    "300.000 euros anuales",
]

[legal."ley-35-2006:art-19"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a19"
document_id = "BOE-A-2006-20764"
article = "19"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a19"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 19: defines rendimiento neto del trabajo as gross work income reduced by deductible expenses, including Social Security or mutualidad contributions, passive-rights deductions, union/professional fees, legal-defence expenses and the general 2,000 EUR other-expenses deduction."
required_text = [
    "Rendimiento neto del trabajo.",
    "disminuir el rendimiento íntegro en el importe de los gastos deducibles",
    "cotizaciones a la Seguridad Social",
    "gastos de defensa jurídica",
    "2.000 euros anuales",
]

[legal."ley-35-2006:art-20"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a20"
document_id = "BOE-A-2006-20764"
article = "20"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a20"
published_at = 2006-11-29
effective_from = 2024-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 20: current reduction for obtaining work income, modified by RDL 4/2024 art 3.1 with effects from 2024-01-01. The BOE selector redaction was published 2024-06-27 and is in force from 2024-06-28. Grounds M100 art-20 casillas, the reduced work-income formula, and the application advisory threshold."
required_text = [
    "Reducción por obtención de rendimientos del trabajo.",
    "rendimientos netos del trabajo inferiores a 19.747,5 euros",
    "no tengan rentas, excluidas las exentas, distintas de las del trabajo superiores a 6.500 euros",
    "iguales o inferiores a 14.852 euros: 7.302 euros anuales",
    "multiplicar por 1,75 la diferencia",
    "multiplicar por 1,14 la diferencia",
    "el saldo resultante no podrá ser negativo",
]

[legal."ley-35-2006:art-22"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a22"
document_id = "BOE-A-2006-20764"
article = "22"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a22"
published_at = 2006-11-29
effective_from = 2007-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 22: defines gross real-estate capital income from ownership of rural or urban immovable property or real rights over it, including lease income and consideration for use or enjoyment rights."
required_text = [
    "Rendimientos íntegros del capital inmobiliario.",
    "bienes inmuebles rústicos y urbanos",
    "se deriven del arrendamiento",
    "importe que por todos los conceptos deba satisfacer",
]

[legal."ley-35-2006:art-23"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a23"
document_id = "BOE-A-2006-20764"
article = "23"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a23"
published_at = 2006-11-29
effective_from = 2024-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 23: governs deductible expenses and reductions for real-estate capital income. Current consolidated redaction, published 2023-05-25 and effective for housing lease contracts from 2024-01-01, replaces the prior flat housing-rental reduction with 90/70/60/50 percent tiers and keeps the 3 percent amortization effectiveness rule."
required_text = [
    "Gastos deducibles y reducciones.",
    "gastos necesarios para la obtención de los rendimientos",
    "el 3 por ciento sobre el mayor",
    "el coste de adquisición satisfecho o el valor catastral",
    "En un 90 por ciento",
    "En un 70 por ciento",
    "En un 60 por ciento",
    "En un 50 por ciento",
]

[legal."ley-35-2006:art-24"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a24"
document_id = "BOE-A-2006-20764"
article = "24"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a24"
published_at = 2006-11-29
effective_from = 2007-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 24: sets the minimum computable real-estate capital income when the tenant, assignee, lessee or sublessee is the taxpayer's spouse or a relative up to the third degree, tying the minimum to the art 85 imputed-rent rules."
required_text = [
    "Rendimiento en caso de parentesco.",
    "sea el cónyuge o un pariente",
    "hasta el tercer grado inclusive",
    "no podrá ser inferior al que resulte de las reglas del artículo 85",
]

[legal."ley-35-2006:art-25"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a25"
document_id = "BOE-A-2006-20764"
article = "25"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a25"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 25: defines gross movable-capital income: participation in entity own funds, third-party lending/interest, capitalization and life/disability insurance operations, and other movable-capital yields such as intellectual-property, assistance, movable-rental and image-right income."
required_text = [
    "Rendimientos íntegros del capital mobiliario.",
    "Rendimientos obtenidos por la participación en los fondos propios",
    "Los dividendos",
    "Rendimientos obtenidos por la cesión a terceros de capitales propios",
    "intereses y cualquier otra forma de retribución",
    "Otros rendimientos del capital mobiliario",
]

[legal."ley-35-2006:art-26"]
evidence_tier = "legal_authority"
authority = "boe"
kind = "ley"
corpus_ref = "corpus/normatives/html/ley-35-2006.html#a26"
document_id = "BOE-A-2006-20764"
article = "26"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a26"
published_at = 2006-11-29
effective_from = 2015-01-01
review_status = "reviewed"
reviewed_at = 2026-06-28
reviewed_by = "codex"
notes = "LIRPF art 26: governs deductible expenses and reductions for movable-capital income, including administration/deposit expenses for negotiable securities, necessary expenses for art 25.4-type income, and the 30 percent reduction for qualifying irregular or multi-year net income capped at 300,000 EUR."
required_text = [
    "Gastos deducibles y reducciones.",
    "gastos de administración y depósito de valores negociables",
    "arrendamiento de bienes muebles, negocios o minas",
    "se reducirán en un 30 por ciento",
    "300.000 euros anuales",
]

