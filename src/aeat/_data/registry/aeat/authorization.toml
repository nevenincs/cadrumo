# Multi-year-renta modelo authorization manifest.
#
# This file is the SINGLE SOURCE OF TRUTH for which modelo calculation
# backends are authorized as functional. It is governed by the
# `modelo-multiyear-renta` ADR.
#
# DEFAULT-DENY-BY-ABSENCE. A modelo is UNAUTHORIZED unless it appears
# below. This file currently authorizes ZERO modelos: every entry is
# added only by the enrolling end-to-end persona test that proves the
# modelo's backend across at least two distinct renta (annual) years.
# The per-revision capability the runtime consults is DERIVED from this
# manifest at the registry boundary -- never authored independently --
# so the two cannot drift.
#
# To enroll a modelo, append one array-of-tables entry:
#
#   [[modelo]]
#   modelo = "130"                         # the modelo id
#   renta_years = [2025, 2026]             # >= 2 DISTINCT renta years (enforced)
#   evidence_class = "calculation"         # calculation | reconciliation
#                                          #   | data_fidelity | threshold_continuity
#   enrolling_test = "src/aeat/application/calculations/test_modelo_130_carry_forward_continuity.py"
#
# The CI meta-test (`test_modelo_authorization_gate.py`) cross-checks
# every entry: the enrolling test must exist, and the year-set its
# recorder observes must equal `renta_years` and span >= 2 distinct
# years. A fake, single-year, or stub enrollment turns the gate RED.
#
# Do NOT enroll a modelo here by hand without its enrolling test landing
# in the same commit; the manifest is a claim the test must verify.

# Modelo 303 (IVA autoliquidación). Enrolled by the cross-renta
# compensación-pendiente carry: a credit-making 4T of year N produces a
# saldo a compensar (LIVA arts. 99, 115-116) that wraps into 1T of year
# N+1's casilla 110 via the self-relation
# modelo-303-rel-self-compensacion-anteriores. Both years are driven
# through the real registry calculation engine.
[[modelo]]
modelo = "303"
renta_years = [2025, 2026]
evidence_class = "calculation"
enrolling_test = "src/aeat/application/calculations/test_modelo_303_compensacion_carry_forward_continuity.py"

# Modelo 347 (Operaciones con terceras personas). Enrolled by the
# year-over-year counterparty identity continuity fidelity test. The
# €3,000-per-counterparty reporting threshold (Orden EHA/3012/2008 art. 3.1)
# is exercised across two distinct renta ejercicios: the same counterparty
# NIF and quarterly importes are persisted for year N (2024) and year N+1
# (2025), loaded back via the real encrypted-SQLite CalculationObservationRepository,
# and asserted for strict pydantic equality + data-separation + NIF identity
# continuity. Evidence class is data_fidelity (no calculation engine).
[[modelo]]
modelo = "347"
renta_years = [2024, 2025]
evidence_class = "data_fidelity"
enrolling_test = "src/aeat/application/calculations/test_modelo_347_informativa_fidelity.py"

# Modelo 184 (Entidades en régimen de atribución de rentas). Enrolled by the
# year-over-year member attribution fidelity test. The member NIF and
# renta-atribuible-importe (casillas 178-190, completeness-manifest pivot) are
# persisted for two distinct renta ejercicios (2024, 2025), loaded back via the
# real encrypted-SQLite CalculationObservationRepository, and asserted for
# strict pydantic equality + NIF identity continuity + attribution-amount
# isolation between exercises. Evidence class is data_fidelity (no calculation
# engine; Orden HAP/2250/2015 / LIRPF arts. 87-89).
[[modelo]]
modelo = "184"
renta_years = [2024, 2025]
evidence_class = "data_fidelity"
enrolling_test = "src/aeat/application/calculations/test_modelo_184_informativa_fidelity.py"

# Modelo 180 (Retenciones arrendamientos — resumen anual de 115). Enrolled by
# the cross-renta periodic→annual reconciliation: four quarterly 115 filings
# (1T–4T) of each renta year are aggregated via the annual_summary relations
# (modelo-180-rel-115-perceptores-anual, base-anual, retenciones-anual,
# op=sum) into the 180 resumen. The wiring invariant — each 180 output casilla
# equals the arithmetic sum of the four 115 quarterly values — is asserted for
# two distinct renta years (2025, 2026) with year-isolation verified
# (Orden HFP/1284/2023 art. 7, RD 439/2007 art. 108).
[[modelo]]
modelo = "180"
renta_years = [2025, 2026]
evidence_class = "reconciliation"
enrolling_test = "src/aeat/application/calculations/test_modelo_180_115_reconciliation_continuity.py"

# Modelo 190 (Retenciones trabajo/actividades — resumen anual de 111). Enrolled
# by the cross-renta periodic→annual reconciliation: four quarterly 111 filings
# (1T–4T, quarterly mode) of each renta year are aggregated via 19 annual_summary
# relations (9 perception-count + 9 importe + 1 retenciones, op=sum) into the
# 190 resumen. The wiring invariant — the three 190 output casillas equal the
# aggregate of the corresponding 111 quarterly casillas — is asserted for two
# distinct renta years (2025, 2026) with year-isolation verified
# (RD 439/2007 art. 109, Orden EHA/3127/2009 art. 1, Orden HAC/1431/2025 art. 2).
[[modelo]]
modelo = "190"
renta_years = [2025, 2026]
evidence_class = "reconciliation"
enrolling_test = "src/aeat/application/calculations/test_modelo_190_111_reconciliation_continuity.py"

# Modelo 193 (Retenciones capital mobiliario — resumen anual de 123). Enrolled
# by the cross-renta periodic→annual reconciliation: four quarterly 123 filings
# (1T–4T) of each renta year are aggregated via three annual_summary relations
# (perceptores/casilla 03, base/casilla 06, retenciones/casilla 09, op=sum)
# into the 193 resumen. The wiring invariant — each 193 output casilla equals
# the sum of the four 123 quarterly computed values — is asserted for two
# distinct renta years (2025, 2026) with year-isolation verified
# (RD 439/2007 art. 108, Orden EHA/3377/2011 art. 1, Ley 35/2006 art. 25).
[[modelo]]
modelo = "193"
renta_years = [2025, 2026]
evidence_class = "reconciliation"
enrolling_test = "src/aeat/application/calculations/test_modelo_193_123_reconciliation_continuity.py"
