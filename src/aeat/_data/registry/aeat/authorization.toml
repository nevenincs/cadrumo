# DEPRECATED — superseded by the directory-mode manifest `authorization.d/`.
#
# The multi-year-renta authorization manifest was converted from this
# single file to one fragment per enrolled modelo under
# `authorization.d/<modelo>.toml`. The loader NO LONGER READS this file;
# it merges every `authorization.d/*.toml` fragment instead. Per-modelo
# fragments let the enrollment swarm write disjoint files with zero
# cross-coder contention on a single manifest.
#
# To enroll a modelo, do NOT edit this file. Create
# `authorization.d/<modelo>.toml` with a single [modelo] table and land it
# in the SAME commit as its enrolling end-to-end test. See
# `src/aeat/core/access_gate/_authorization.py` and the meta-test
# `src/aeat/tests/test_modelo_authorization_gate.py` for the schema and the
# un-fakeable enrollment cross-check.
#
# This stub is retained (rather than removed) so the deprecation is
# discoverable; it carries no [[modelo]] entries and authorizes nothing.
