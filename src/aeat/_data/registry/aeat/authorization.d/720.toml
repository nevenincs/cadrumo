# Modelo 720 (Bienes y derechos en el extranjero). Enrolled by the prior-year
# per-asset-class baseline fidelity test + fichero-BOE golden-SHA roundtrip.
# The fidelity test drives two distinct renta annual cycles (2023, 2024) through
# the real encrypted-SQLite CalculationObservationRepository: year-N declares
# cuentas €60,000 + valores €55,000 (both > €50,000 initial threshold per
# RD 1065/2007 art. 2.1); year-N+1 declares cuentas €85,000 (+€25,000 > €20,000
# re-declaration delta per art. 42-bis.5) + valores €65,000 (+€10,000 ≤ €20,000).
# Asset identifiers survive the roundtrip unchanged across both cycles. The
# golden-SHA test pins the type_1 + type_2 fichero-BOE byte format (1146 bytes
# for a 2-asset declaration) against the Orden HAP/72/2013 Anexo DR. The A3
# cross-year-delta advisory predicate will be added in a follow-up commit.
[modelo]
modelo = "720"
renta_years = [2023, 2024]
evidence_class = "threshold_continuity"
enrolling_test = "src/aeat/application/calculations/tests/test_modelo_720_prior_year_baseline_fidelity.py"
