# Modelo 714 (Impuesto sobre el Patrimonio). Enrollment is still the prior-year
# wealth-base data-fidelity test: two distinct renta ejercicios (2023, 2024) of
# patrimonio-neto / base-liquidable / cuota observations are persisted through
# the real encrypted-SQLite CalculationObservationRepository and reloaded with
# strict pydantic equality, with per-ejercicio isolation and the €2.000.000
# filing-obligation threshold (Orden HAC/1023/2021) asserted.
# The current registry computes the Ley 19/1991 art. 30 cuota íntegra scale
# (casilla 29) and the art. 31 80%-floor reference (casilla 39). The
# evidence_class remains data_fidelity because this enrollment proof is the
# two-year persistence/fidelity evidence, not a full art. 31 same-year M100
# joint-limit calculation. The remaining M714 downstream chain
# (límite-conjunto / total-cuota / cuota-minorada / cuota-a-ingresar) stays
# manual until the M100 cross-model evidence and art. 31 exclusions are grounded.
[modelo]
modelo = "714"
renta_years = [2023, 2024]
evidence_class = "data_fidelity"
enrolling_test = "src/aeat/application/calculations/tests/test_modelo_714_patrimonio_baseline_fidelity.py"
