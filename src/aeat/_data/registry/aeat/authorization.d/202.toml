# Modelo 202 (IS pago fraccionado) — modalidad art. 40.2 prior-year cuota
# base. Enrolled by the cross-renta 2P carry: the October instalment's base
# (casilla 01) is copied from the immediately prior year's Modelo 200 cuota
# líquida (DP200014B:00592) via the cross_model_output relation
# modelo-202-2025-y-siguientes-rel-cuota-base-2p-3p (filing_year_delta = -1),
# and casilla 03 recomputes as 18% of that base (LIS art. 40.2). The enrolling
# test drives the real M200 + M202 engines across two distinct target renta
# years (2026, 2027), each sourcing the prior M200 (2025, 2026).
#
# Note: the 1P (April) instalment binds two years back (filing_year_delta = -2)
# and is deferred until Modelo 200 is modelled before 2024 (see the parked
# relation under .vault-scratch/coder-opus-is/ and the M202 1P follow-up).
[modelo]
modelo = "202"
renta_years = [2026, 2027]
evidence_class = "calculation"
enrolling_test = "src/aeat/application/calculations/test_modelo_202_cuota_base_ejercicio_anterior_continuity.py"
