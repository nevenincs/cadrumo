# Spanish national + autonomous-community holidays for the 2025 tax year.
#
# Source: Resolución de 23 de octubre de 2024, de la Dirección General de
# Trabajo, por la que se publica la relación de fiestas laborales para el
# año 2025 (BOE núm. 261, 28 de octubre de 2024).
# https://www.boe.es/diario_boe/txt.php?id=BOE-A-2024-22011
#
# AEAT considers a deadline that falls on a sábado, domingo, fiesta nacional
# or fiesta autonómica of the taxpayer's domicilio fiscal as a día inhábil
# and shifts the deadline to the next business day, with documented modelo
# exceptions (e.g. Modelo 369 - OSS/IOSS does not shift).

year = 2025
boe_ref = "boe-resolucion-festivos-2025"
boe_url = "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2024-22011"

