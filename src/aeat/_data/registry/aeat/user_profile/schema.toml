[schema]
id = "aeat.user_profile"
version = 2
title = "AEAT user profile schema"
snapshot_policy = "immutable_secure_snapshot_hash"
remove_policy = "live_profile_tombstone_retain_snapshots"

[[sections]]
key = "identity"
title = "Identity"
sensitivity = "identity"
effective_dated = false

[[sections.fields]]
key = "tax_id"
type = "string"
required = true
sensitivity = "identity"
description = "NIF/NIE/CIF used as filing identity."
model_selectors = ["tax.id"]
export_headers = ["profile_tax_id"]

[[sections.fields]]
key = "name"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant given name or display name."
model_selectors = ["name"]
export_headers = ["name", "first_name"]

[[sections.fields]]
key = "surnames"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant surnames for person filings."
model_selectors = ["surnames"]
export_headers = ["surnames"]

[[sections.fields]]
key = "legal_name"
type = "string"
required = false
sensitivity = "identity"
description = "Legal or company name for entity-style export headers."
export_headers = ["legal_name"]

[[sections.fields]]
key = "email"
type = "email"
required = false
sensitivity = "identity"
description = "Operator contact email used by configuration surfaces."

[[sections.fields]]
key = "notes"
type = "string"
required = false
sensitivity = "identity"
description = "Operator free-form notes attached to the profile."

[[sections]]
key = "preferences"
title = "Operator preferences"
sensitivity = "operational"
effective_dated = false

[[sections.fields]]
key = "output_language"
type = "enum"
required = false
sensitivity = "operational"
description = "Output language used by CLI rendering and notification copy."
enum_values = ["es", "en", "ca", "eu", "gl"]

[[sections]]
key = "contact"
title = "Contact and fiscal address"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "fiscal_address"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal address declared for taxpayer/census purposes."

[[sections.fields]]
key = "postcode"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal-address postcode."
model_selectors = ["address.postcode"]

[[sections.fields]]
key = "fiscal_address_cadastral_reference"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Catastral reference of the operator's fiscal address. Carried by the 036 census so AEAT can locate the address in the Catastro."
model_selectors = ["address.cadastral_reference"]
legal_refs = ["RDLeg 1/2004 TR Ley Catastro (BOE-A-2004-4163)"]

[[sections.fields]]
key = "fiscal_address_is_habitual_vivienda"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the fiscal address is also the operator's habitual residence. Gates the home-office afectacion-parcial regime per LIRPF Art. 30.2 rule 5."
model_selectors = ["address.is_habitual_vivienda"]
legal_refs = ["LIRPF Art. 68.1.3 (BOE-A-2006-20764)", "LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections]]
key = "tax_residence"
title = "Tax residence and jurisdiction"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "ccaa"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Common-regime autonomous community for Modelo 100 jurisdiction (collected later by the wizard)."
enum_values = [
  "andalucia",
  "aragon",
  "asturias",
  "baleares",
  "canarias",
  "cantabria",
  "castilla_la_mancha",
  "castilla_y_leon",
  "cataluna",
  "comunidad_valenciana",
  "extremadura",
  "galicia",
  "la_rioja",
  "madrid",
  "murcia",
]
model_selectors = ["TaxResidenceProfile.ccaa"]

[[sections.fields]]
key = "jurisdiction_scope"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Common-regime or explicit unsupported foral state. Defaults to common_regime when no wizard answer is recorded."
enum_values = ["common_regime", "foral_unsupported"]

[[sections]]
key = "census"
title = "Census and enrollment"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "status"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Modelo 036 census state."
enum_values = ["alta", "modificacion", "baja"]

[[sections.fields]]
key = "large_company"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Large-company enrollment fact used by filing cadence."
model_selectors = ["enrollment.large_company"]
schedule_predicates = ["enrollment.large_company"]

[[sections.fields]]
key = "public_administration_budget_gt_6000000"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Public-administration budget threshold used by filing cadence."
model_selectors = ["enrollment.public_administration_budget_gt_6000000"]
schedule_predicates = ["enrollment.public_administration_budget_gt_6000000"]

[[sections.fields]]
key = "activity_start_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT census alta date for the economic activity. Drives obligation start year and pago-fraccionado eligibility."
model_selectors = ["census.activity_start_date"]
legal_refs = ["RGAT Art. 9 (BOE-A-2007-15984)", "RGAT Art. 11 (BOE-A-2007-15984)"]

[[sections.fields]]
key = "activity_end_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT census baja date for the economic activity. Caps obligation calendar after baja."
model_selectors = ["census.activity_end_date"]
legal_refs = ["RGAT Art. 9 (BOE-A-2007-15984)", "RGAT Art. 11 (BOE-A-2007-15984)"]

[[sections.fields]]
key = "establecimiento_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Form of business establishment declared on the 036 census. Gates deductibility treatment of rent / amortizacion / suministros under LIRPF estimacion directa."
enum_values = ["propio", "arrendado", "cedido_gratuitamente"]
model_selectors = ["census.establecimiento_type"]
legal_refs = ["LIRPF Art. 28 (BOE-A-2006-20764)", "LIRPF Art. 29 (BOE-A-2006-20764)", "LIRPF Art. 30 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "elected_withholding_pct"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Elected IRPF withholding rate on professional invoices, declared on the 036 census. 15 percent is the standard; 7 percent is the nuevos-profesionales rate (year of alta plus the two following calendar years); 1 percent is the modulos transport carve-out per the annual Orden de Modulos."
enum_values = ["15", "7", "1"]
model_selectors = ["census.elected_withholding_pct"]
legal_refs = ["LIRPF Art. 101.5 (BOE-A-2006-20764)", "RIRPF Art. 95.1 (BOE-A-2007-6820)", "RIRPF Art. 95.2 (BOE-A-2007-6820)", "Orden HAC/1425/2025 (BOE-A-2025-25272)"]

[[sections]]
key = "taxpayer_type"
title = "Taxpayer entity type and income categories"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "entity_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer entity type. natural_person is an IRPF contribuyente; legal_entity is an Impuesto sobre Sociedades contribuyente; attribution_entity is an entity without legal personality under the regimen de atribucion de rentas. The entity type selects the tax and therefore the modelos, calendar, and rate schedule."
enum_values = ["natural_person", "legal_entity", "attribution_entity"]
model_selectors = ["taxpayer.entity_type"]
schedule_predicates = ["taxpayer.entity_type"]
legal_refs = ["LIRPF Ley 35/2006 (BOE-A-2006-20764)", "LIS Ley 27/2014 (BOE-A-2014-12328)", "LIRPF Titulo X Seccion 2 atribucion de rentas (BOE-A-2006-20764)"]

[[sections.fields]]
key = "legal_entity_form"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Recognised legal form when entity_type is legal_entity. Drives the Impuesto sobre Sociedades rate schedule per LIS Art. 29."
enum_values = ["sl", "sa", "cooperativa", "sociedad_civil_mercantil", "sin_fines_lucrativos", "other"]
model_selectors = ["taxpayer.legal_entity_form"]
legal_refs = ["LIS Art. 29 (BOE-A-2014-12328)"]

[[sections.fields]]
key = "incn_prior_12_months"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Importe neto de la cifra de negocios (INCN) of the prior 12 months. Gates the Modelo 202 pago-fraccionado modality split at the 6.000.000 EUR threshold (LIS Art. 40.3): above the threshold Art. 40.3 is mandatory, below it both Art. 40.2 and Art. 40.3 are reachable. An undeclared value means the engine cannot decide modality and returns INCOMPLETE rather than guessing."
model_selectors = ["taxpayer.incn_prior_12_months"]
legal_refs = ["LIS Art. 40.3 (BOE-A-2014-12328)"]

[[sections.fields]]
key = "new_entity_first_two_profit_periods"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether a newly-created legal entity is in one of its first two profit-making tax periods. Opts the entity into the LIS Art. 29 15 percent micro-empresa-style rate override. The override is opt-in: an undeclared value leaves the entity on the otherwise-applicable sub-form rate."
model_selectors = ["taxpayer.new_entity_first_two_profit_periods"]
legal_refs = ["LIS Art. 29 (BOE-A-2014-12328)"]

[[sections.fields]]
key = "irpf_income_categories"
type = "string"
required = false
sensitivity = "financial"
effective_dated = true
description = "Comma-separated set of IRPF income categories a natural person declares: actividad_economica, trabajo, capital_inmobiliario, capital_mobiliario, ganancias_patrimoniales, pension. Only actividad_economica triggers the Modelo 130/131 pago fraccionado. The closed-set validation is enforced by the wizard checkbox widget."
model_selectors = ["taxpayer.irpf_income_categories"]
schedule_predicates = ["taxpayer.irpf_income_categories"]
legal_refs = ["LIRPF Arts. 17-39 (BOE-A-2006-20764)"]

[[sections]]
key = "vivienda_office"
title = "Vivienda habitual office afectacion"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "total_m2"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Total square meters of the operator's habitual residence. Numerator base for the office-afectacion ratio under LIRPF Art. 30.2 rule 5."
model_selectors = ["vivienda_office.total_m2"]
legal_refs = ["LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections.fields]]
key = "office_m2"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Square meters of the habitual residence dedicated to the economic activity. Numerator of the office-afectacion ratio (office_m2 / total_m2) applied directly to ownership costs and multiplied by 0.30 for suministros per LIRPF Art. 30.2 rule 5."
model_selectors = ["vivienda_office.office_m2"]
legal_refs = ["LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections]]
key = "activities"
title = "Business activities"
sensitivity = "identity"
effective_dated = true
repeatable = true

[[sections.fields]]
key = "description"
type = "string"
required = true
sensitivity = "identity"
effective_dated = true
description = "Census activity description."

[[sections.fields]]
key = "cnae"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "CNAE activity code where applicable."
export_headers = ["cnae"]

[[sections.fields]]
key = "iae_epigraph"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "IAE section/group/epigraph where applicable."
model_selectors = ["activities.iae_epigraph"]
legal_refs = ["RDLeg 1175/1990 IAE (BOE-A-1990-23930)"]

[[sections]]
key = "irpf"
title = "IRPF and withholding"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "professional_income_withholding_ge_70pct"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether professional income withholding reaches the 70 percent threshold."
model_selectors = ["professional_income_withholding_ge_70pct"]
schedule_predicates = ["professional_income_withholding_ge_70pct"]

[[sections.fields]]
key = "uses_objective_estimation"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the profile uses objective estimation for IRPF. Derived from estimation_regime: objetiva implies true. Retained as a registry-condition predicate until the applicability engine reads estimation_regime directly."
model_selectors = ["uses_objective_estimation_irpf"]
schedule_predicates = ["uses_objective_estimation_irpf"]

[[sections.fields]]
key = "estimation_regime"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "IRPF estimation regime for economic-activity income: directa_normal (estimacion directa normal), directa_simplificada (estimacion directa simplificada), objetiva (estimacion objetiva / modulos). The regime selects Modelo 130 vs Modelo 131 and the deductible-expense computation."
enum_values = ["directa_normal", "directa_simplificada", "objetiva"]
model_selectors = ["irpf.estimation_regime"]
schedule_predicates = ["irpf.estimation_regime"]
legal_refs = ["LIRPF Arts. 16, 28-31 (BOE-A-2006-20764)", "RIRPF RD 439/2007 Arts. 30-31 (BOE-A-2007-6820)"]

[[sections]]
key = "withholding"
title = "Withholding payer obligations"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "has_employees"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays employees with withholding."
model_selectors = ["has_employees"]
schedule_predicates = ["has_employees"]

[[sections.fields]]
key = "pays_professionals_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays professionals with withholding."
model_selectors = ["pays_professionals_with_retencion"]
schedule_predicates = ["pays_professionals_with_retencion"]

[[sections.fields]]
key = "pays_rent_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays rent with withholding."
model_selectors = ["pays_rent_with_retencion"]
schedule_predicates = ["pays_rent_with_retencion"]

[[sections.fields]]
key = "pays_capital_income_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays capital income with withholding."
model_selectors = ["pays_capital_income_with_retencion"]
schedule_predicates = ["pays_capital_income_with_retencion"]

[[sections]]
key = "iva"
title = "IVA profile"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "regime"
type = "enum"
required = true
sensitivity = "financial"
effective_dated = true
description = "IVA regime used by obligation and classification projections. REAGP is the regimen especial de la agricultura, ganaderia y pesca."
enum_values = ["GENERAL", "SIMPLIFICADO", "RECARGO_EQUIVALENCIA", "REAGP", "EXENTO"]
model_selectors = ["iva.regime"]
schedule_predicates = ["iva.regime"]
legal_refs = ["LIVA Ley 37/1992 Art. 120 (BOE-A-1992-28740)"]

[[sections.fields]]
key = "does_intracomunitario"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer conducts intracommunity operations."
model_selectors = ["does_intracomunitario"]
schedule_predicates = ["does_intracomunitario"]

[[sections.fields]]
key = "intracommunity_operations_exceed_50000_eur"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Modelo 349 cadence threshold."
model_selectors = ["iva.intracommunity_operations_exceed_50000_eur"]
schedule_predicates = ["iva.intracommunity_operations_exceed_50000_eur"]

[[sections.fields]]
key = "roi_enrolled"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer is registered on AEAT's Registro de Operadores Intracomunitarios (ROI / VIES). Distinct from does_intracomunitario: ROI enrollment is the legal census state, opted into via Modelo 036/037 checkbox 582. Live cross-references that consult ROI-only AEAT surfaces (GROI, IXVI) gate applicability on this field."
model_selectors = ["iva.roi_enrolled"]
schedule_predicates = ["iva.roi_enrolled"]

[[sections.fields]]
key = "oss_enrolled"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer is enrolled in the OSS / IOSS one-stop-shop regime for declaring intra-EU B2C sales (Modelo 369). Live cross-references that consult OSS-only AEAT surfaces (e.g. modelo-369-exterior-filed-declarations-read) gate applicability on this field."
model_selectors = ["iva.oss_enrolled"]
schedule_predicates = ["iva.oss_enrolled"]

[[sections.fields]]
key = "sii_enrolled"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer is enrolled in the SII (Suministro Inmediato de Informacion), the near-real-time IVA Libros registro submission system. Mandatory for the monthly IVA collective (grandes empresas, REDEME, grupos de IVA); voluntary opt-in via Modelo 036 for everyone else."
model_selectors = ["iva.sii_enrolled"]
schedule_predicates = ["iva.sii_enrolled"]
legal_refs = ["RD 596/2016 (BOE-A-2016-11575)", "Orden HFP/417/2017 (BOE-A-2017-5312)"]

[[sections.fields]]
key = "redeme_enrolled"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer is registered in REDEME (Registro de Devolucion Mensual del IVA). REDEME registration switches the IVA self-assessment period to monthly and is one of the mandatory-SII triggers."
model_selectors = ["iva.redeme_enrolled"]
schedule_predicates = ["iva.redeme_enrolled"]
legal_refs = ["RIVA RD 1624/1992 Art. 30 (BOE-A-1992-28925)"]

[[sections]]
key = "obligations"
title = "Filing obligation thresholds"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "third_party_transactions_above_347_threshold"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Modelo 347 eligibility: declared yearly transactions with a single counterpart exceed the legal threshold."
model_selectors = ["third_party_transactions_above_347_threshold"]
schedule_predicates = ["third_party_transactions_above_347_threshold"]

[[sections.fields]]
key = "bienes_extranjero_above_threshold"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Modelo 720 eligibility: foreign assets/rights declared above the legal threshold."
schedule_predicates = ["bienes_extranjero_above_threshold"]

[[sections]]
key = "filing_export"
title = "Filing and export context"
sensitivity = "financial"
effective_dated = false

[[sections.fields]]
key = "declaration_type"
type = "string"
required = false
sensitivity = "financial"
description = "Declaration type used by export layouts and Modelo 100."
model_selectors = ["declaration.type"]
export_headers = ["declaration_type", "complementaria", "complementaria_page", "page_complementaria"]

[[sections.fields]]
key = "previous_receipt"
type = "string"
required = false
sensitivity = "financial"
description = "Previous receipt or justificante reference for complementary filings."
export_headers = ["previous_receipt", "previous_justificante", "justificante_anterior"]

[[sections.fields]]
key = "period_start_date"
type = "date"
required = false
sensitivity = "financial"
description = "Filing period start date where export layouts require a header value."
export_headers = ["fecha_inicio_periodo", "devengo_start_date"]

[[sections.fields]]
key = "period_end_date"
type = "date"
required = false
sensitivity = "financial"
description = "Filing period end date where export layouts require a header value."
export_headers = ["fecha_fin_periodo"]

[[sections.fields]]
key = "program_version"
type = "string"
required = false
sensitivity = "audit"
description = "Program version header supplied by export context."
export_headers = ["program_version"]

[[sections.fields]]
key = "presenter_tax_id"
type = "string"
required = false
sensitivity = "audit"
description = "Developer NIF/CIF header supplied by export context."
export_headers = ["presenter_nif", "presenter_tax_id"]

[[sections.fields]]
key = "iban"
type = "string"
required = false
sensitivity = "financial"
description = "Payment account when required by filing context."
export_headers = ["iban"]

[[sections.fields]]
key = "aeat_seal"
type = "string"
required = false
sensitivity = "audit"
description = "AEAT seal header when an export layout requires it."
export_headers = ["aeat_seal"]

[[sections]]
key = "renta_taxpayer"
title = "Renta taxpayer"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "sex"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer sex for Modelo 100."
enum_values = ["1", "2"]
model_selectors = ["taxpayer.sex"]

[[sections.fields]]
key = "marital_status"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer marital status valid for Modelo 100."
model_selectors = ["taxpayer.marital_status"]

[[sections.fields]]
key = "birth_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = false
description = "Taxpayer birth date."
model_selectors = ["taxpayer.birth_date"]

[[sections.fields]]
key = "disability_grade"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer disability grade code for Modelo 100."
model_selectors = ["taxpayer.disability_grade"]

[[sections.fields]]
key = "death_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = false
nullable = true
description = "Taxpayer death date when Modelo 100 requires it."
model_selectors = ["taxpayer.death_date"]

[[sections]]
key = "renta_spouse"
title = "Renta spouse"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "tax_id"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Spouse NIF/NIE for joint filing."
model_selectors = ["spouse.tax.id"]

[[sections.fields]]
key = "name"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Spouse given name."
model_selectors = ["spouse.name"]

[[sections.fields]]
key = "surnames"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Spouse surnames."
model_selectors = ["spouse.surnames"]

[[sections.fields]]
key = "birth_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = false
description = "Spouse birth date."
model_selectors = ["spouse.birth_date"]

[[sections.fields]]
key = "sex"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Spouse sex for Modelo 100."
enum_values = ["1", "2"]
model_selectors = ["spouse.sex"]

[[sections.fields]]
key = "disability_grade"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Spouse disability grade code for Modelo 100."
model_selectors = ["spouse.disability_grade"]

[[sections.fields]]
key = "non_resident_irpf"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the spouse is non-resident and not an IRPF taxpayer."
model_selectors = ["spouse.non_resident_irpf"]

[[sections.fields]]
key = "eu_eea_resident"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the non-resident spouse is resident in the EU or EEA."
model_selectors = ["spouse.eu_eea_resident"]

[[sections.fields]]
key = "eu_eea_country"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
