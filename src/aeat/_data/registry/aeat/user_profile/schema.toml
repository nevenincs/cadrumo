effective_dated = true
description = "Whether the taxpayer is registered on AEAT's Registro de Operadores Intracomunitarios (ROI / VIES). Distinct from does_intracomunitario: ROI enrollment is the legal censo state, opted into via Modelo 036/037 checkbox 582. Live cross-references that consult ROI-only AEAT surfaces (GROI, IXVI) gate applicability on this field."
