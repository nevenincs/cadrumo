[schema]
id = "aeat.user_profile"
version = 2
title = "AEAT user profile schema"
snapshot_policy = "immutable_secure_snapshot_hash"
remove_policy = "live_profile_tombstone_retain_snapshots"

[[sections]]
key = "identity"
title = "Identity"
sensitivity = "identity"
effective_dated = false

[[sections.fields]]
key = "tax_id"
type = "string"
required = true
sensitivity = "identity"
description = "NIF/NIE/CIF used as filing identity."
model_selectors = ["tax.id"]
export_headers = ["profile_tax_id"]

[[sections.fields]]
key = "name"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant given name or display name."
model_selectors = ["name"]
export_headers = ["name", "first_name"]

[[sections.fields]]
key = "surnames"
type = "string"
required = false
sensitivity = "identity"
description = "Declarant surnames for person filings."
model_selectors = ["surnames"]
export_headers = ["surnames"]

[[sections.fields]]
key = "legal_name"
type = "string"
required = false
sensitivity = "identity"
description = "Legal or company name for entity-style export headers."
export_headers = ["legal_name"]

[[sections.fields]]
key = "email"
type = "email"
required = false
sensitivity = "identity"
description = "Operator contact email used by configuration surfaces."

[[sections.fields]]
key = "notes"
type = "string"
required = false
sensitivity = "identity"
description = "Operator free-form notes attached to the profile."

[[sections]]
key = "preferences"
title = "Operator preferences"
sensitivity = "operational"
effective_dated = false

[[sections.fields]]
key = "output_language"
type = "enum"
required = false
sensitivity = "operational"
description = "Output language used by CLI rendering and notification copy."
enum_values = ["es", "en", "ca", "hu"]

[[sections]]
key = "capabilities"
title = "Service capabilities"
sensitivity = "operational"
effective_dated = false

[[sections.fields]]
key = "cloud_evidence_upload"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile permits sending sensitive financial evidence (a text-layer invoice) to a cloud CLI provider for classification. Default off; gestor mode bars it absolutely regardless. Opt-in only narrows, never widens, the global safety floor."

[[sections.fields]]
key = "llm_vision"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile may read scanned or image evidence on-host with the local vision model, so no byte leaves the machine. Default on; opting out disables the on-host vision read."

[[sections.fields]]
key = "google_export"
type = "boolean"
required = false
sensitivity = "operational"
description = "Whether this profile may export modelo workbooks to Google Sheets or Drive. Default on; opting out keeps exports offline-only."

[[sections]]
key = "contact"
title = "Contact and fiscal address"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "fiscal_address"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal address declared for taxpayer/censo purposes."

[[sections.fields]]
key = "postcode"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Fiscal-address postcode."
model_selectors = ["address.postcode"]

[[sections.fields]]
key = "fiscal_address_cadastral_reference"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Catastral reference of the operator's fiscal address. Carried by the 036 censo so AEAT can locate the address in the Catastro."
model_selectors = ["address.cadastral_reference"]
legal_refs = ["RDLeg 1/2004 TR Ley Catastro (BOE-A-2004-4163)"]

[[sections.fields]]
key = "fiscal_address_is_habitual_vivienda"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the fiscal address is also the operator's habitual residence. Gates the home-office afectacion-parcial regime per LIRPF Art. 30.2 rule 5."
model_selectors = ["address.is_habitual_vivienda"]
legal_refs = ["LIRPF Art. 68.1.3 (BOE-A-2006-20764)", "LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections]]
key = "tax_residence"
title = "Tax residence and jurisdiction"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "ccaa"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Common-regime autonomous community for Modelo 100 jurisdiction (collected later by the wizard)."
enum_values = [
  "andalucia",
  "aragon",
  "asturias",
  "baleares",
  "canarias",
  "cantabria",
  "castilla_la_mancha",
  "castilla_y_leon",
  "cataluna",
  "comunidad_valenciana",
  "extremadura",
  "galicia",
  "la_rioja",
  "madrid",
  "murcia",
]
model_selectors = ["TaxResidenceProfile.ccaa"]

[[sections.fields]]
key = "jurisdiction_scope"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Common-regime or explicit unsupported foral state. Defaults to common_regime when no wizard answer is recorded."
enum_values = ["common_regime", "foral_unsupported"]

[[sections.fields]]
key = "state_attribution_ratio"
type = "decimal"
required = false
sensitivity = "identity"
effective_dated = true
description = "Modelo 303 casilla 65 — porcentaje atribuible Administracion del Estado (Art. 29 Concierto Economico, Ley 12/2002). Resolver-side derived from jurisdiction_scope by _inject_derived_state_attribution_facts in src/aeat/application/modelo/_profile_binding.py: common_regime -> 100, foral_unsupported -> 0. Not operator-settable through the wizard; the field declaration exists here so the registry's profile-binding selector for modelo-303-profile-state-attribution-ratio resolves against a schema-declared key."

[[sections]]
key = "censo"
title = "Censo and enrollment"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "status"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Modelo 036 censo state."
enum_values = ["alta", "modificacion", "baja"]

[[sections.fields]]
key = "large_company"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Large-company enrollment fact used by filing cadence."
model_selectors = ["enrollment.large_company"]
schedule_predicates = ["enrollment.large_company"]

[[sections.fields]]
key = "public_administration_budget_gt_6000000"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Public-administration budget threshold used by filing cadence."
model_selectors = ["enrollment.public_administration_budget_gt_6000000"]
schedule_predicates = ["enrollment.public_administration_budget_gt_6000000"]

[[sections.fields]]
key = "activity_start_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT censo alta date for the economic activity. Drives obligation start year and pago-fraccionado eligibility."
model_selectors = ["censo.activity_start_date"]
legal_refs = ["RGAT Art. 9 (BOE-A-2007-15984)", "RGAT Art. 11 (BOE-A-2007-15984)"]

[[sections.fields]]
key = "activity_end_date"
type = "date"
required = false
sensitivity = "identity"
effective_dated = true
description = "AEAT censo baja date for the economic activity. Caps obligation calendar after baja."
model_selectors = ["censo.activity_end_date"]
legal_refs = ["RGAT Art. 9 (BOE-A-2007-15984)", "RGAT Art. 11 (BOE-A-2007-15984)"]

[[sections.fields]]
key = "establecimiento_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Form of business establishment declared on the 036 censo. Gates deductibility treatment of rent / amortizacion / suministros under LIRPF estimacion directa."
enum_values = ["propio", "arrendado", "cedido_gratuitamente"]
model_selectors = ["censo.establecimiento_type"]
legal_refs = ["LIRPF Art. 28 (BOE-A-2006-20764)", "LIRPF Art. 29 (BOE-A-2006-20764)", "LIRPF Art. 30 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "elected_withholding_pct"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "Elected IRPF withholding rate on professional invoices, declared on the 036 censo. 15 percent is the standard; 7 percent is the nuevos-profesionales rate (year of alta plus the two following calendar years); 1 percent is the modulos transport carve-out per the annual Orden de Modulos."
enum_values = ["15", "7", "1"]
model_selectors = ["censo.elected_withholding_pct"]
legal_refs = ["LIRPF Art. 101.5 (BOE-A-2006-20764)", "RIRPF Art. 95.1 (BOE-A-2007-6820)", "RIRPF Art. 95.2 (BOE-A-2007-6820)", "Orden HAC/1425/2025 (BOE-A-2025-25272)"]

[[sections]]
key = "taxpayer_type"
title = "Taxpayer entity type and income categories"
sensitivity = "identity"
effective_dated = true

[[sections.fields]]
key = "entity_type"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Taxpayer entity type. natural_person is an IRPF contribuyente; legal_entity is an Impuesto sobre Sociedades contribuyente; attribution_entity is an entity without legal personality under the regimen de atribucion de rentas. The entity type selects the tax and therefore the modelos, calendar, and rate schedule."
enum_values = ["natural_person", "legal_entity", "attribution_entity"]
model_selectors = ["taxpayer.entity_type"]
schedule_predicates = ["taxpayer.entity_type"]
legal_refs = ["LIRPF Ley 35/2006 (BOE-A-2006-20764)", "LIS Ley 27/2014 (BOE-A-2014-12328)", "LIRPF Titulo X Seccion 2 atribucion de rentas (BOE-A-2006-20764)"]

[[sections.fields]]
key = "legal_entity_form"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Recognised legal form when entity_type is legal_entity. Drives the Impuesto sobre Sociedades rate schedule per LIS Art. 29."
enum_values = ["sl", "sa", "sal", "sll", "cooperativa", "sociedad_civil_mercantil", "sin_fines_lucrativos", "other"]
model_selectors = ["taxpayer.legal_entity_form"]
legal_refs = ["LIS Art. 29 (BOE-A-2014-12328)", "Ley 44/2015 Art. 1 (BOE-A-2015-11071)"]

[[sections.fields]]
key = "incn_prior_12_months"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Importe neto de la cifra de negocios (INCN) of the prior 12 months. Gates the Modelo 202 pago-fraccionado modality split at the 6.000.000 EUR threshold (LIS Art. 40.3): above the threshold Art. 40.3 is mandatory, below it both Art. 40.2 and Art. 40.3 are reachable. An undeclared value means the engine cannot decide modality and returns INCOMPLETE rather than guessing."
model_selectors = ["taxpayer.incn_prior_12_months"]
legal_refs = ["LIS Art. 40.3 (BOE-A-2014-12328)"]

[[sections.fields]]
key = "new_entity_first_two_profit_periods"
type = "boolean"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether a newly-created legal entity is in one of its first two profit-making tax periods. Opts the entity into the LIS Art. 29 15 percent micro-empresa-style rate override. The override is opt-in: an undeclared value leaves the entity on the otherwise-applicable sub-form rate."
model_selectors = ["taxpayer.new_entity_first_two_profit_periods"]
legal_refs = ["LIS Art. 29 (BOE-A-2014-12328)"]

[[sections.fields]]
key = "tributacion_estado_porcentaje"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Porcentaje de tributación al Estado for Modelo 200 casilla DP200026:00625. Standard (régimen común) entities are 100. Foral entities (Bizkaia, Gipuzkoa, Álava, Navarra) declare a partial percentage. An undeclared value is treated as 100 by the engine binding default so common-regime SLs file without configuring this field."
model_selectors = ["taxpayer.tributacion_estado_porcentaje"]
legal_refs = ["LIS Art. 29 (BOE-A-2014-12328)", "Ley Orgánica 8/1980 LOFCA Art. 3 (BOE-A-1980-22492)"]

[[sections.fields]]
key = "sal_socios_trabajadores_count"
type = "integer"
required = false
sensitivity = "identity"
effective_dated = true
description = "Number of worker-shareholders (socios trabajadores) in a Sociedad Laboral (SAL/SLL). Must constitute a majority of the share capital under Ley 44/2015 Art. 1. Used together with sal_reserva_especial_dotada and sal_capital_social to gate the reserva especial dotacion."
model_selectors = ["taxpayer.sal_socios_trabajadores_count"]
legal_refs = ["Ley 44/2015 Art. 1 (BOE-A-2015-11071)", "Ley 44/2015 Art. 2 (BOE-A-2015-11071)"]

[[sections.fields]]
key = "sal_reserva_especial_dotada"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Accumulated reserva especial balance already dotada in prior periods (Ley 44/2015 Art. 14). Used to test the 50 percent capital social cap: dotacion = 0 once reserva_dotada >= 0.50 * capital_social."
model_selectors = ["taxpayer.sal_reserva_especial_dotada"]
legal_refs = ["Ley 44/2015 Art. 14 (BOE-A-2015-11071)"]

[[sections.fields]]
key = "sal_capital_social"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Capital social of the Sociedad Laboral. Denominator of the 50 percent cap test under Ley 44/2015 Art. 14. Dotacion is capped such that accumulated reserva does not exceed 50 percent of capital social."
model_selectors = ["taxpayer.sal_capital_social"]
legal_refs = ["Ley 44/2015 Art. 14 (BOE-A-2015-11071)"]

[[sections.fields]]
key = "irpf_income_categories"
type = "string"
required = false
sensitivity = "financial"
effective_dated = true
description = "Comma-separated set of IRPF income categories a natural person declares: actividad_economica, trabajo, capital_inmobiliario, capital_mobiliario, ganancias_patrimoniales, pension. Only actividad_economica triggers the Modelo 130/131 pago fraccionado. The closed-set validation is enforced by the wizard checkbox widget."
model_selectors = ["taxpayer.irpf_income_categories"]
schedule_predicates = ["taxpayer.irpf_income_categories"]
legal_refs = ["LIRPF Arts. 17-39 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "fiscal_residency"
type = "enum"
required = false
sensitivity = "identity"
effective_dated = true
description = "Whether the taxpayer has habitual residence in Spain (resident_irpf, subject to IRPF) or not (non_resident_irnr, subject to IRNR under TRLIRNR). Drives which tax and therefore which calendar/modelos apply."
enum_values = ["resident_irpf", "non_resident_irnr"]
model_selectors = ["taxpayer.fiscal_residency"]
schedule_predicates = ["taxpayer.fiscal_residency"]
legal_refs = ["LIRPF Art. 9 (BOE-A-2006-20764)", "TRLIRNR RDLeg 5/2004 (BOE-A-2004-4527)"]

[[sections.fields]]
key = "country_of_fiscal_residence"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "ISO 3166-1 alpha-2 country code of the taxpayer's fiscal residence when fiscal_residency is non_resident_irnr. Drives the UE/EEE classification for the IRNR rate split (Art. 25.1.a vs Art. 25.1.f TRLIRNR)."
model_selectors = ["taxpayer.country_of_fiscal_residence"]
legal_refs = ["TRLIRNR Art. 25 (BOE-A-2004-4527)"]

[[sections.fields]]
key = "representante_fiscal_nif"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "NIF of the representante fiscal designated in Spain when fiscal_residency is non_resident_irnr. Required by TRLIRNR Art. 10 for non-EU/EEE residents and recommended for EU/EEE residents."
model_selectors = ["taxpayer.representante_fiscal_nif"]
legal_refs = ["TRLIRNR Art. 10 (BOE-A-2004-4527)"]

[[sections.fields]]
key = "representante_fiscal_nombre"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "Full name of the representante fiscal designated in Spain when fiscal_residency is non_resident_irnr. Required together with representante_fiscal_nif by TRLIRNR Art. 10 for non-EU/EEE residents."
model_selectors = ["taxpayer.representante_fiscal_nombre"]
legal_refs = ["TRLIRNR Art. 10 (BOE-A-2004-4527)"]

[[sections]]
key = "vivienda_office"
title = "Vivienda habitual office afectacion"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "total_m2"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Total square meters of the operator's habitual residence. Numerator base for the office-afectacion ratio under LIRPF Art. 30.2 rule 5."
model_selectors = ["vivienda_office.total_m2"]
legal_refs = ["LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections.fields]]
key = "office_m2"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Square meters of the habitual residence dedicated to the economic activity. Numerator of the office-afectacion ratio (office_m2 / total_m2) applied directly to ownership costs and multiplied by 0.30 for suministros per LIRPF Art. 30.2 rule 5."
model_selectors = ["vivienda_office.office_m2"]
legal_refs = ["LIRPF Art. 30.2 rule 5 (Ley 6/2017 BOE-A-2017-12544)"]

[[sections]]
key = "activities"
title = "Business activities"
sensitivity = "identity"
effective_dated = true
repeatable = true

[[sections.fields]]
key = "description"
type = "string"
required = true
sensitivity = "identity"
effective_dated = true
description = "Censo activity description."

[[sections.fields]]
key = "cnae"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "CNAE activity code where applicable."
export_headers = ["cnae"]

[[sections.fields]]
key = "iae_epigraph"
type = "string"
required = false
sensitivity = "identity"
effective_dated = true
description = "IAE section/group/epigraph where applicable."
model_selectors = ["activities.iae_epigraph"]
legal_refs = ["RDLeg 1175/1990 IAE (BOE-A-1990-23930)"]

[[sections]]
key = "irpf"
title = "IRPF and withholding"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "professional_income_withholding_ge_70pct"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether professional income withholding reaches the 70 percent threshold."
model_selectors = ["professional_income_withholding_ge_70pct"]
schedule_predicates = ["professional_income_withholding_ge_70pct"]

[[sections.fields]]
key = "uses_objective_estimation"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the profile uses objective estimation for IRPF. Derived from estimation_regime: objetiva implies true. Retained as a registry-condition predicate until the applicability engine reads estimation_regime directly."
model_selectors = ["uses_objective_estimation_irpf"]
schedule_predicates = ["uses_objective_estimation_irpf"]

[[sections.fields]]
key = "estimation_regime"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "IRPF estimation regime for economic-activity income: directa_normal (estimacion directa normal), directa_simplificada (estimacion directa simplificada), objetiva (estimacion objetiva / modulos). The regime selects Modelo 130 vs Modelo 131 and the deductible-expense computation."
enum_values = ["directa_normal", "directa_simplificada", "objetiva"]
model_selectors = ["irpf.estimation_regime"]
schedule_predicates = ["irpf.estimation_regime"]
legal_refs = ["LIRPF Arts. 16, 28-31 (BOE-A-2006-20764)", "RIRPF RD 439/2007 Arts. 30-31 (BOE-A-2007-6820)"]

[[sections.fields]]
key = "objective_estimation_prior_year_gross_income_eur"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Prior-year gross income volume for all economic activities except agricultural, livestock, and forestry activities. Used to advise when a declared objective-estimation profile exceeds the settled DT 32 exclusion magnitude."
model_selectors = ["irpf.objective_estimation_prior_year_gross_income_eur"]
legal_refs = ["LIRPF DT 32 Ley 35/2006 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "objective_estimation_prior_year_invoice_gross_income_eur"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Prior-year gross income volume from operations requiring an invoice to a business or professional recipient. Used to advise when a declared objective-estimation profile exceeds the settled DT 32 exclusion magnitude."
model_selectors = ["irpf.objective_estimation_prior_year_invoice_gross_income_eur"]
legal_refs = ["LIRPF DT 32 Ley 35/2006 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "objective_estimation_prior_year_purchases_eur"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Prior-year purchase volume for goods and services, excluding fixed-asset acquisitions. Used to advise when a declared objective-estimation profile exceeds the settled DT 32 exclusion magnitude."
model_selectors = ["irpf.objective_estimation_prior_year_purchases_eur"]
legal_refs = ["LIRPF DT 32 Ley 35/2006 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "special_regime"
type = "enum"
required = false
sensitivity = "financial"
effective_dated = true
description = "IRPF special regime. general is the standard tarifa progressive IRPF (Modelo 100). impatriado is the regimen especial aplicable a los trabajadores desplazados a territorio espanol (Ley Beckham, LIRPF Art. 93): the taxpayer files Modelo 151 at the flat IRNR rate and the obligation engine suppresses Modelo 100 deadlines. The regime window is six fiscal years from the opt-in election (RIRPF Art. 116); record the election date in special_regime_start_date."
enum_values = ["general", "impatriado"]
model_selectors = ["irpf.special_regime"]
schedule_predicates = ["irpf.special_regime"]
legal_refs = ["LIRPF Art. 93 Ley 35/2006 (BOE-A-2006-20764)", "RIRPF RD 439/2007 Arts. 113-120 (BOE-A-2007-6820)"]

[[sections.fields]]
key = "special_regime_start_date"
type = "date"
required = false
sensitivity = "financial"
effective_dated = true
description = "Opt-in election date for the IRPF special regime (RIRPF Art. 116). Required to compute the six-year impatriado window. Blank when no special regime is in effect."
model_selectors = ["irpf.special_regime_start_date"]
legal_refs = ["RIRPF RD 439/2007 Art. 116 (BOE-A-2007-6820)"]

[[sections.fields]]
key = "pagadores_count"
type = "integer"
required = false
sensitivity = "financial"
effective_dated = true
description = "Number of pagadores (income payers) the taxpayer received income from. When >= 2 and irpf_pagadores_secondary_income > 1500, filing Modelo 100 is mandatory under Art. 96.3 LIRPF regardless of the total income threshold."
model_selectors = ["irpf.pagadores_count"]
legal_refs = ["LIRPF Art. 96.3 (BOE-A-2006-20764)"]

[[sections.fields]]
key = "pagadores_secondary_income"
type = "decimal"
required = false
sensitivity = "financial"
effective_dated = true
description = "Sum of income received from the 2nd and subsequent pagadores. Art. 96.3 LIRPF: declaración obligatoria when this value exceeds €1,500. Only meaningful when pagadores_count >= 2."
model_selectors = ["irpf.pagadores_secondary_income"]
legal_refs = ["LIRPF Art. 96.3 (BOE-A-2006-20764)"]

[[sections]]
key = "withholding"
title = "Withholding payer obligations"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "has_employees"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays employees with withholding."
model_selectors = ["has_employees"]
schedule_predicates = ["has_employees"]

[[sections.fields]]
key = "pays_professionals_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays professionals with withholding."
model_selectors = ["pays_professionals_with_retencion"]
schedule_predicates = ["pays_professionals_with_retencion"]

[[sections.fields]]
key = "pays_rent_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays rent with withholding."
model_selectors = ["pays_rent_with_retencion"]
schedule_predicates = ["pays_rent_with_retencion"]

[[sections.fields]]
key = "pays_capital_income_with_retencion"
type = "boolean"
required = false
sensitivity = "financial"
effective_dated = true
description = "Whether the taxpayer pays capital income with withholding."
model_selectors = ["pays_capital_income_with_retencion"]
schedule_predicates = ["pays_capital_income_with_retencion"]

[[sections]]
key = "iva"
title = "IVA profile"
sensitivity = "financial"
effective_dated = true

[[sections.fields]]
key = "regime"
type = "enum"
required = true
