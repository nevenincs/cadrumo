# Convenio doble imposición España — Estados Unidos (CDI 1990, Protocolo 2013
# en vigor 2019).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Subsequent convenio tranche. Grounded against the BOE consolidated text
# BOE-A-1990-30940 in its redacción VIGENTE tras el Protocolo de 2013 (en vigor
# 27-11-2019, última actualización BOE 23/10/2019). The two-regime split is
# resolved by grounding the CURRENTLY-in-force rates and stamping valid_from at
# the protocol's effective date. Both rows are grounded verbatim.

[treaty]
country_code = "US"
document_id = "BOE-A-1990-30940"
notes = "Convenio España-Estados Unidos, redacción vigente tras el Protocolo de 2013 (en vigor 27-11-2019). Art 10.2.b dividendos: el impuesto en fuente no podrá exceder del 15 por ciento en los demás casos. Art 11.1 intereses: sólo pueden someterse a imposición en el Estado de residencia (exención en la fuente). Los tramos reducidos de dividendos y las excepciones de intereses (11.2) no se modelan."

[[treaty.overrides]]
tipo_renta = "dividend"
kind = "ceiling"
rate = "0.15"
legal_ref_anchor = "convenio-es-us-1990:art-10"
legal_refs = ["convenio-es-us-1990:art-10"]
notes = "Art 10.2.b (redacción vigente, Protocolo 2019): el impuesto exigido en el Estado de la fuente no podrá exceder del 15 por ciento del importe bruto de los dividendos en los demás casos. Ceiling frente al 19% doméstico (TRLIRNR art 25.1.f); min(0.19, 0.15) = 0.15. Los tramos del 5 por ciento (participación >= 10%) y del 0 por ciento (participación >= 80%) no se modelan."
valid_from = 2019-11-27

[[treaty.overrides]]
tipo_renta = "interest"
kind = "exempt"
legal_ref_anchor = "convenio-es-us-1990:art-11"
legal_refs = ["convenio-es-us-1990:art-11"]
notes = "Art 11.1 (redacción vigente, Protocolo 2019): los intereses cuyo beneficiario efectivo sea un residente del otro Estado sólo pueden someterse a imposición en ese otro Estado — exención de tributación en la fuente (España). Frente al 19% doméstico TRLIRNR art 25.1.f, el CDI reduce el tipo en fuente a 0%. Las excepciones del art 11.2 (intereses contingentes limitados al 10%, REMIC) no se modelan."
valid_from = 2019-11-27
