# Convenio doble imposición España — Argentina (CDI 1992, en vigor 1994).
#
# Cross-cutting treaty-override authoring surface consumed by the IRNR
# tipo-de-gravamen resolution op via the ConvenioAuthority snapshot projection.
# Migrated unchanged from m210-convenio-rates (AR/pension). Issue #558 enrolls the
# Spain-Argentina treaty under the convenio framework. The pension override is an
# allocation to Spain whose amount is delegated to the domestic progressive
# tariff (TRLIRNR art 25.1.b), so it carries no fixed rate.

[treaty]
country_code = "AR"
document_id = "BOE-A-1994-20084"
notes = "Convenio España-Argentina. Art 19 funciones públicas: las pensiones pagadas por un Estado por servicios prestados a ese Estado sólo pueden someterse a imposición en ese Estado (salvo residente y nacional del otro)."

[[treaty.overrides]]
tipo_renta = "pension"
kind = "allocation_domestic_tariff"
legal_ref_anchor = "convenio-es-ar-1992:art-19"
legal_refs = ["convenio-es-ar-1992:art-19", "trlirnr-rdleg-5-2004:art-25.1.b"]
notes = "Art 19 funciones públicas fundamenta la asignación a España de las pensiones públicas; la cuota se delega a la tarifa progresiva TRLIRNR art 25.1.b (allocation_domestic_tariff, sin tipo fijo)."
valid_from = 2025-01-01
