# Maritime worker IRPF exemption binding registry.
#
# Groups the three legally distinct exemption pathways available to
# trabajadores del mar. The worker_class profile fact selects which
# binding(s) apply at filing time. DA 41 is modelled as an inactive
# future variant; it must not be activated until EU state-aid clearance
# is granted (AEAT 2024 official guidance confirms non-applicability).
#
# Each binding entry carries:
#   id              - stable identifier used by the calculation engine
#   pathway         - human-readable exemption pathway name
#   status          - active | inactive_pending_eu_clearance
#   exempt_fraction - fraction of qualifying income exempt (REBECA / DA 41)
#   annual_cap_eur  - annual EUR cap (Art. 7.p) only)
#   formula         - narrative formula description (Art. 7.p) only)
#   selector        - profile predicate tuple that gates this binding
#   legal_refs      - BOE-grounded legal authority references
#   source_refs     - source identifiers for provenance tracing

[[exemption_bindings]]
id = "art-7p-foreign-work"
pathway = "art_7p_foreign_work_exemption"
status = "active"
annual_cap_eur = "60100"
formula = "min(annual_salary / 365 * qualifying_days, 60100)"

[exemption_bindings.selector]
worker_class = "trabajador_del_mar"
vessel_flag = "foreign"
waters_type = "international"

[[exemption_bindings.legal_refs]]
reference = "Ley 35/2006 Art. 7.p)"
document_id = "BOE-A-2006-20764"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a7"
notes = "Primary foreign-work exemption. Conditions: work effectively performed outside Spanish territory; foreign entity receiving the services is non-resident in Spain or has a permanent establishment abroad; the territory has an equivalent income tax or CDI with Spain. Annual cap 60,100 EUR. Confirmed for Galician fishing crew by TEAR Galicia December 2024; extended April 2025 by Supreme Court doctrine to military Navy in NATO/UN sea operations."

[[exemption_bindings]]
id = "rebeca-50pct"
pathway = "rebeca_50pct_exemption"
status = "active"
exempt_fraction = "0.50"

[exemption_bindings.selector]
worker_class = "trabajador_del_mar"
vessel_registry = ["REBECA", "rebeca_eu_eea", "scheduled_canary_route"]

[[exemption_bindings.legal_refs]]
reference = "Ley 19/1994 Art. 73.2"
document_id = "BOE-A-1994-15794"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1994-15794"
notes = "REBECA regime: 50% exemption on gross employment income from navigation for crew of vessels enrolled in the Registro Especial de Buques y Empresas Navieras de Canarias or on scheduled routes between the Canary Islands and mainland Spain."

[[exemption_bindings.legal_refs]]
reference = "Ley 19/1994 Art. 73.3"
document_id = "BOE-A-1994-15794"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1994-15794"
notes = "REBECA conditions: vessel enrolled in REBECA register; crew employment contract governed by the vessel operator; navigation income taxed at source via withholding on 50% of gross pay by employer (Modelo 111 withholding base adjustment)."

[[exemption_bindings.legal_refs]]
reference = "Ley 19/1994 Art. 75.1"
document_id = "BOE-A-1994-15794"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1994-15794"
notes = "REBECA extension scope: since 1 January 2021 applies to crews of vessels of REBECA-registered companies enrolled in other EU/EEA member state registries."

[[exemption_bindings.legal_refs]]
reference = "Ley 19/1994 Art. 75.3"
document_id = "BOE-A-1994-15794"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-1994-15794"
notes = "REBECA withholding: exempt 50% is excluded from the Modelo 111 withholding base by the employer. The 50% fraction is statutory and not variable by election."

[[exemption_bindings]]
id = "da41-tuna-fleet-inactive"
pathway = "da41_tuna_fleet_exemption"
status = "inactive_pending_eu_clearance"
exempt_fraction = "0.50"

[exemption_bindings.selector]
worker_class = "trabajador_del_mar"
tuna_fleet = true
pending_eu_clearance = true

[[exemption_bindings.legal_refs]]
reference = "Ley 35/2006 DA 41"
document_id = "BOE-A-2006-20764"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764"
notes = "DA 41 LIRPF: 50% exemption for tuna fleet crew on Spanish-flagged fishing vessels registered in the community fishing fleet register, fishing exclusively tuna or related species outside EU waters and at least 200 nautical miles from member state baselines, in companies in the Special Register of Spanish Fishing Vessel Companies. INACTIVE: requires prior EU state-aid clearance. Not granted as of 2024/2025. AEAT confirms non-applicability in official 2024 guidance. Must not be activated until EU clearance is granted."

[[exemption_bindings.legal_refs]]
reference = "Ley 6/2018 (enabling amendment)"
document_id = "BOE-A-2018-9268"
permalink = "https://www.boe.es/buscar/act.php?id=BOE-A-2018-9268"
notes = "Ley 6/2018 de Presupuestos Generales del Estado: introduced DA 41 into Ley 35/2006 LIRPF. The exemption is conditioned on prior EU state-aid clearance under TFEU state-aid rules, which has not been granted as of 2024."
