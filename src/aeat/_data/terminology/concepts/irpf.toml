[language.es]
short_description = "El Impuesto sobre la Renta de las Personas Fisicas, el impuesto espanol sobre la renta de los particulares."
definition = "Impuesto directo y personal que grava la renta de las personas fisicas residentes en territorio espanol, incluyendo los rendimientos del trabajo, del capital mobiliario e inmobiliario, de actividades economicas, las ganancias y perdidas patrimoniales y las imputaciones de renta. Se declara en el Modelo 100 anual, con pagos fraccionados y retenciones en los Modelos 111, 115, 130, 131, 180 y 190. No abarca el Impuesto sobre la Renta de no Residentes ni el Impuesto sobre Sociedades."

[language.es.source]
