definition = "Proceso de compilacion que enumera el vocabulario cerrado de conceptos, terminos admitidos y formas ocultas, consulta el servicio RAG residente y transforma los hits en una lista revisable de destinos de documentacion. En ADR D6, este barrido pre-ejecuta en build-time lo que un RAG haria en runtime."
scope_note = "El barrido usa el servicio RAG como oraculo de compilacion; CI consume solo los datos resultantes, no ejecuta embeddings ni recuperacion live."

