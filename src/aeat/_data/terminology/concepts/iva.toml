[language.es]
short_description = "El Impuesto sobre el Valor Anadido, el impuesto espanol sobre el consumo."
definition = "Impuesto indirecto que recae sobre el consumo y grava las entregas de bienes y prestaciones de servicios efectuadas por empresarios o profesionales, las adquisiciones intracomunitarias y las importaciones de bienes. Se declara mediante los Modelos 303, 322, 349 y el resumen anual 390, e incluye regimenes especiales como el recargo de equivalencia, el simplificado o el criterio de caja. No abarca el IGIC de Canarias ni el IPSI de Ceuta y Melilla."

[language.es.source]
