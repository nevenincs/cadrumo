definition = "Superficie de autoria comprometida que contiene un fragmento TOML por concepto, compila esos fragmentos en registros estrictos y alimenta el glosario generado y la busqueda terminologica. En la arquitectura ADR D1-D3 y D7-D8, es la capa intermedia entre las fuentes de enrolment y los artefactos de documentacion generados."
scope_note = "No es el indice Pagefind ni una pagina escrita a mano; es la fuente unica de los conceptos que luego se proyectan a la busqueda y al glosario."

