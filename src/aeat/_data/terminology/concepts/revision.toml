definition = "La version de las reglas de un modelo que rige para un periodo de presentacion concreto, nombrada en el registro. Por ejemplo, una revision como 2019-y-siguientes cubre las presentaciones de 2019 en adelante. La AEAT publica una revision por cada (modelo, ano, periodo) mediante Orden Ministerial, de modo que la revision aplicable es un hecho derivado, no una eleccion."

