[language.en]
short_description = "A numbered box on a modelo where one figure or identifying value of the return is recorded."
definition = "A numbered box on an AEAT tax form (modelo) that holds an amount, a base, a tax due figure, or an identifying value of the return. Each box has a number, an official label, and where applicable a formula linking it to other boxes."

