# Terminology Handbook concept fragment for the structural concept
# "casilla". This is a domain-vocabulary concept (the numbered box on a
# modelo), not a casilla projection: the 18,885 individual casillas are
# machine-projected from registry snapshots at compile time, never
# enrolled as Handbook fragments. This concept defines the WORD.

[concept]
concept_id = "casilla"
domain = "casilla-namespace"
lifecycle = "approved"
related = ["modelo", "revision"]
created_at = 2026-06-10
updated_at = 2026-06-10

[language.es]
short_description = "Cada uno de los recuadros numerados de un modelo en los que se anota un dato de la declaracion."
definition = "Recuadro numerado de un modelo tributario en el que se consigna un importe, una base, una cuota o un dato identificativo de la declaracion. Cada casilla tiene un numero, una etiqueta oficial y, cuando procede, una formula que la relaciona con otras casillas."
scope_note = "El termino designa el recuadro en abstracto. Las casillas concretas de cada modelo y revision se proyectan desde el registro y se buscan por modelo mas numero."

[language.es.source]
citation = "Disenos de Registro y manuales practicos publicados por la AEAT."
authority = "aeat"

