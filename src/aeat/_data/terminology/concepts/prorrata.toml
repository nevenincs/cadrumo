[language.en]
short_description = "The deductible proportion of input VAT when a taxpayer makes both deductible and non-deductible supplies."
definition = "The rule that fixes the share of input VAT a taxable person may deduct when their activity combines supplies that grant the right to deduct with supplies that do not. The percentage is the ratio of deductible-right turnover to total turnover, rounded up to the next whole unit."

[language.en.source]
citation = "Articles 102 and 104 of Law 37/1992 on VAT (LIVA)."
authority = "boe"

[[language.en.term]]
label = "pro rata"
term_status = "preferred"
part_of_speech = "noun"

[[language.en.term]]
label = "deductible proportion"
term_status = "admitted"
part_of_speech = "noun"

