definition = "Archivo de datos laundered que materializa los resultados del barrido RAG como mapeos de termino a destino: identificadores de registro, tipo de superficie, destino y peso normalizado. En ADR D6 y D8, este mapa es comprometido porque CI y el build offline no ejecutan RAG, y sus targets deben resolver contra la documentacion actual."
scope_note = "El mapa no contiene vectores, pesos sparse, snippets ni rutas de hits crudos."

