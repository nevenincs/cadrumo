# The navigation register: every element a `cadrumo://view/{id}` link or a
# palette can name, for the window (`gui`) and the terminal workbench (`tui`).
#
# An element's `id` is also its link path: one to four lowercase segments
# joined by `/`. A child names its `parent`, which is the id without its last
# segment; a root has none. `label` is the one locale key every palette shows,
# `keywords` are extra search words, and `surfaces` lists which interfaces
# implement the element. How a surface implements an element is that surface's
# own table, never this file.
#
# An element may declare link parameters in `params`, a map from parameter
# name to value kind, such as `params = { select = "invoice" }` for a link
# ending `?select={invoice id}`. `prefer` is reserved on every element.
# Parameters only show, select or focus; none edits or confirms anything.
# Each `[[kind]]` declares the exact shape of its values: opaque canonical
# record ids only, never natural keys such as an invoice number or a tax id.
#
# `retired` is append-only: an id that stops naming an element moves here and
# is never declared again, so an old link cannot open something new.

schema = 1
retired = ["setup"]

# A bank or manual ledger movement: its content-derived SHA-256 transaction id.
[[kind]]
name = "transaction"
alphabet = "0123456789abcdef"
length = 64

# An invoice: its content-derived SHA-256 invoice id.
[[kind]]
name = "invoice"
alphabet = "0123456789abcdef"
length = 64

[[element]]
id = "home"
label = "navigation.view.home.label"
keywords = "overview start summary inicio"
surfaces = ["tui"]

