[package]
name = "cadrumo-application"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
