[package]
name = "cadrumo-application"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
live-python-tests = []
live-package-tests = ["platform"]
live-release-tests = ["live-package-tests"]
platform = ["dep:cadrumo-platform"]

[dependencies]
cadrumo-platform = { path = "../platform", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
