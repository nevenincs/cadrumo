# The application package's declaration of every packaged image's process environment.
#
# The packaging generator validates this file and compiles it into contract.json,
# contract.rs and contract.h. Each image the package builds defines its own process
# environment from its compiled launch profile before Python starts: a name this
# file does not declare for a profile never reaches that profile's process.
#
# Name kinds: text, language, boolean, integer, number, directory, file,
# directory_list, port, executable, descriptor.
# Name roles: location (a storage root or member an operator may relocate),
# operator (an operator setting with no custody, location, authority or secret
# effect), package (a package-owned override), pin (set by the host from its
# resolution), fixed (a package fact), slot (a launch parameter a parent supplies).

schema = 1

# ---------------------------------------------------------------------------
# Environment names the package sets, passes or lets operators override.
# ---------------------------------------------------------------------------

[names]
CADRUMO_LOCAL_STORAGE_ROOT = { kind = "directory", role = "location" }
CADRUMO_ATTACHMENTS_DIR = { kind = "directory", role = "location" }
CADRUMO_BLOB_STORE_DIR = { kind = "directory", role = "location" }
