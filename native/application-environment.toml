CADRUMO_CLI_REVEAL_IDENTIFIERS = { kind = "boolean", role = "package" }
CADRUMO_EXTERNAL_BIN_DIRS = { kind = "directory_list", role = "package" }

TEMP = { kind = "directory", role = "pin" }
TMP = { kind = "directory", role = "pin" }
TMPDIR = { kind = "directory", role = "pin" }
CADRUMO_AUTHORITY_ROOT = { kind = "directory", role = "fixed" }

# ---------------------------------------------------------------------------
