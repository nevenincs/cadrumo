CADRUMO_INVOICES_DIR = { kind = "directory", role = "location" }
CADRUMO_IVA_COMPENSATION_HISTORY_DIR = { kind = "directory", role = "location" }
CADRUMO_IVA_READ_EVIDENCE_DIR = { kind = "directory", role = "location" }
