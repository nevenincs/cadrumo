# ---------------------------------------------------------------------------
# Operating-system names a profile's base takes from its caller's environment.
# Windows compares names without case; each platform lists its own spelling.
# ---------------------------------------------------------------------------

[base.windows]
system = [
  "SYSTEMROOT",
  "SYSTEMDRIVE",
  "WINDIR",
  "PATHEXT",
  "NUMBER_OF_PROCESSORS",
  "PROCESSOR_ARCHITECTURE",
  "OS",
  "USERPROFILE",
  "HOMEDRIVE",
  "HOMEPATH",
  "LOCALAPPDATA",
  "APPDATA",
  "PROGRAMDATA",
  "PROGRAMFILES",
  "PROGRAMFILES(X86)",
  "COMMONPROGRAMFILES",
  "USERNAME",
  "USERDOMAIN",
]
session = [
  "COMSPEC",
  "COMPUTERNAME",
  "PUBLIC",
  "ALLUSERSPROFILE",
  "PROGRAMW6432",
  "COMMONPROGRAMFILES(X86)",
  "COMMONPROGRAMW6432",
  "PROCESSOR_IDENTIFIER",
  "PROCESSOR_LEVEL",
  "PROCESSOR_REVISION",
  "LOGONSERVER",
  "SESSIONNAME",
  "USERDOMAIN_ROAMINGPROFILE",
]
terminal = ["TERM", "COLORTERM", "COLUMNS", "LINES", "WT_SESSION", "WT_PROFILE_ID", "TERM_PROGRAM", "TERM_PROGRAM_VERSION"]
display = []
network = ["HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY", "ALL_PROXY", "SSL_CERT_FILE", "SSL_CERT_DIR", "REQUESTS_CA_BUNDLE"]

[base.posix]
system = ["HOME", "USER", "LOGNAME", "LANG", "LC_ALL", "LC_CTYPE", "TZ"]
session = [
  "SHELL",
  "LC_COLLATE",
  "LC_MESSAGES",
  "LC_MONETARY",
  "LC_NUMERIC",
  "LC_TIME",
  "XDG_RUNTIME_DIR",
  "XDG_DATA_HOME",
  "XDG_CONFIG_HOME",
  "XDG_CACHE_HOME",
  "XDG_STATE_HOME",
  "DBUS_SESSION_BUS_ADDRESS",
]
terminal = ["TERM", "COLORTERM", "COLUMNS", "LINES", "TERM_PROGRAM", "TERM_PROGRAM_VERSION"]
display = ["DISPLAY", "WAYLAND_DISPLAY", "XAUTHORITY", "XDG_SESSION_TYPE", "XDG_CURRENT_DESKTOP"]
network = [
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY",
  "ALL_PROXY",
  "http_proxy",
  "https_proxy",
  "no_proxy",
  "all_proxy",
  "SSL_CERT_FILE",
  "SSL_CERT_DIR",
  "REQUESTS_CA_BUNDLE",
]

# ---------------------------------------------------------------------------
# Host pins: values the host resolves and sets. A profile with pins = true
# resolves and pins the storage root by the package rule, pins the temporary
# variables to the temporary-files member and sets the authority root.
# ---------------------------------------------------------------------------

[pins]
temporary = ["TEMP", "TMP", "TMPDIR"]
temporary_member = { name = "CADRUMO_TEMP_DIR", default = "tmp", create_explicit = true }
authority = { name = "CADRUMO_AUTHORITY_ROOT", layout_path = "authority" }

# ---------------------------------------------------------------------------
# Name classes a filtering host clears from an environment it passes on.
# ---------------------------------------------------------------------------

[host_classes]
cleared_prefixes = ["PYTHON", "LD_", "DYLD_", "AEAT_", "FINANCIAL_", "SITE_HEALTH_"]
cleared_names = ["VIRTUAL_ENV", "CONDA_PREFIX", "CONDA_DEFAULT_ENV", "__PYVENV_LAUNCHER__"]
namespace_prefix = "CADRUMO_"

# ---------------------------------------------------------------------------
# The native interpreter host's reserved exit statuses. The host exits with
# launch_profile_refused after writing one refusal line, before Python starts.
# ---------------------------------------------------------------------------

[native_host]
owner = "native_host"
first = 120
last = 125
launch_profile_refused = 125
refusals = ["launch_value_missing", "launch_value_malformed", "invocation_undeclared"]

# ---------------------------------------------------------------------------
# Locations of package components under the storage root, and the defaults the
# desktop and manager use without asking Python. The Python log location,
# format and limits mirror the command line's own; a package-side test keeps
# them equal.
# ---------------------------------------------------------------------------

[components]
console_workspace = "workspace"
webview = "webview"
manager_log_file = "logs/cadrumo-manager.log"
manager_preferences = "manager-preferences.json"
manager_failed_versions = ".runtime/manager-failed-versions.json"
logs = "logs"
log_variable = "CADRUMO_LOG_DIR"
log_file = "logs/cadrumo.log"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s | %(diagnostic_context)s"
log_max_bytes = 10485760
log_backups = 5
language_variable = "CADRUMO_OUTPUT_LANGUAGE"
language_default = "es"

# ---------------------------------------------------------------------------
# The storage root: its variable, the per-platform installed default under the
# build channel's directory, and the conformance vectors every resolver replays.
# Development rules apply only to a host built inside a source checkout.
# ---------------------------------------------------------------------------

[root]
variable = "CADRUMO_LOCAL_STORAGE_ROOT"
development_variable = "CADRUMO_STORAGE_ROOT"
checkout_marker = "pyproject.toml"
development_default = "var/storage"
precedence = { development = ["CADRUMO_LOCAL_STORAGE_ROOT", "CADRUMO_STORAGE_ROOT"], installed = ["CADRUMO_LOCAL_STORAGE_ROOT"] }
relative_override = { development = "anchor_at_checkout", installed = "refuse" }
posix_directory_mode = 0o700
refusals = [
  "relative_override_installed",
  "installed_base_unavailable",
  "home_unavailable",
  "checkout_unavailable",
  "unsupported_platform",
  "non_absolute_pin",
  "invalid_path_input",
  "filesystem_path_refused",
]
path_rules = { unicode_required = true, normalize_absolute = true, refuse_links = true, enforce_existing_permissions = false }
channel = { product_directory = "cadrumo", stable = "stable", separator = "-" }

[[root.installed_defaults]]
platform = "windows"
candidates = [{ variable = "LOCALAPPDATA", subpath = [] }]
home_variable = "USERPROFILE"

[[root.installed_defaults]]
platform = "linux"
candidates = [{ variable = "XDG_DATA_HOME", subpath = [] }, { variable = "HOME", subpath = [".local", "share"] }]
home_variable = "HOME"

[[root.installed_defaults]]
platform = "macos"
candidates = [{ variable = "HOME", subpath = ["Library", "Application Support"] }]
home_variable = "HOME"

# ---------------------------------------------------------------------------
# PATH: composed from the package's binary directories, an admitted
# CADRUMO_EXTERNAL_BIN_DIRS, and the platform's system directories.
# ---------------------------------------------------------------------------

[path]
entries = ["executable", "external", "native", "system"]
external = "CADRUMO_EXTERNAL_BIN_DIRS"
windows_system = { variable = "SYSTEMROOT", subpaths = ["System32"] }
posix_system = ["/usr/bin", "/bin"]

# ---------------------------------------------------------------------------
# Launch profiles. Each names the image it is compiled into. A profile with an
# invocation is selected by its exact argument pattern; the image's profile
# without one serves every other invocation. An image with no such default
# refuses an undeclared invocation before Python starts.
#
# base: "groups" takes the listed base groups, "inherit" passes the caller's
# whole environment unchanged. path: "package" sets the composed PATH,
# "inherit" leaves the caller's.
# ---------------------------------------------------------------------------

[profiles.python]
image = "python"
base = "groups"
base_groups = ["system", "session", "terminal", "display", "network"]
pins = true
operator = ["locations", "presentation", "remote", "package"]
path = "package"

[profiles.kdf-child]
image = "python"
base = "inherit"
pins = false
path = "inherit"

[profiles.aeat]
image = "aeat"
base = "groups"
base_groups = ["system", "session", "terminal", "display", "network"]
pins = true
operator = ["locations", "presentation", "remote", "package"]
path = "package"

[profiles.cadrumo-mcp]
image = "cadrumo-mcp"
base = "groups"
base_groups = ["system", "session", "terminal", "display", "network"]
pins = true
operator = ["locations", "presentation", "remote", "package"]
path = "package"

[profiles.cadrumo-runtime]
image = "cadrumo-runtime"
base = "groups"
base_groups = ["system", "session", "display", "network"]
pins = true
path = "package"

# ---------------------------------------------------------------------------
# Invocation tables. Arguments follow the image's own path. A literal must
# match exactly; a typed argument is validated by its kind before Python starts.
# ---------------------------------------------------------------------------

[[invocations]]
profile = "kdf-child"
platform = "windows"
arguments = [
  { literal = "-m" },
  { literal = "cadrumo.adapters.persistence.storage.custody._kdf_worker" },
  { literal = "--request-handle" },
  { slot = "request", kind = "handle" },
  { literal = "--result-handle" },
  { slot = "result", kind = "handle" },
]
distinct = [["request", "result"]]

[[invocations]]
profile = "kdf-child"
platform = "posix"
arguments = [
  { literal = "-m" },
  { literal = "cadrumo.adapters.persistence.storage.custody._kdf_worker" },
  { literal = "--request-fd" },
  { slot = "request", kind = "descriptor", minimum = 3 },
  { literal = "--result-fd" },
  { slot = "result", kind = "descriptor", minimum = 3 },
  { literal = "--descriptor-bound" },
  { slot = "bound", kind = "descriptor", minimum = 1 },
]
distinct = [["request", "result"]]
greater = [["bound", "request"], ["bound", "result"]]

# ---------------------------------------------------------------------------
# Launch-profile conformance vectors, authored by hand: an image, its arguments
# and its caller's environment in; the selected profile and the exact defined
# environment, or a refusal, out. A replay places the image in package
# C:\launch-vector\package (/launch-vector/package on POSIX) and resolves the
# storage root to C:\launch-vector\state (/launch-vector/state).
# ---------------------------------------------------------------------------

[[launch_vectors]]
name = "windows-python-defines-a-closed-environment"
platform = "windows"
image = "python"
arguments = ["-c", "pass"]
ambient = { SystemRoot = "C:\\Windows", USERPROFILE = "C:\\Users\\ada", TERM = "xterm", CADRUMO_LOG_LEVEL = "DEBUG", CADRUMO_AGENT_PORT = "0", CADRUMO_AGENT_HOSTED_ROOT = "C:\\agent", CADRUMO_SECRET_PASSPHRASE = "must-not-cross", AEAT_BASE_URL = "https://example.invalid", PYTHONPATH = "C:\\elsewhere", ANTHROPIC_API_KEY = "must-not-cross", CADRUMO_AUTHORITY_ROOT = "C:\\elsewhere", TEMP = "C:\\elsewhere", PATH = "C:\\elsewhere" }
profile = "python"
environment = { SYSTEMROOT = "C:\\Windows", USERPROFILE = "C:\\Users\\ada", TERM = "xterm", CADRUMO_LOG_LEVEL = "DEBUG", CADRUMO_LOCAL_STORAGE_ROOT = "C:\\launch-vector\\state", TEMP = "C:\\launch-vector\\state\\tmp", TMP = "C:\\launch-vector\\state\\tmp", TMPDIR = "C:\\launch-vector\\state\\tmp", CADRUMO_AUTHORITY_ROOT = "C:\\launch-vector\\package\\data\\authority" }
path = ["C:\\launch-vector\\package", "C:\\launch-vector\\package\\bin", "C:\\Windows\\System32"]

[[launch_vectors]]
name = "windows-python-honours-an-admitted-temporary-member"
platform = "windows"
image = "python"
arguments = []
ambient = { SYSTEMROOT = "C:\\Windows", CADRUMO_TEMP_DIR = "scratch", CADRUMO_CLI_REVEAL_IDENTIFIERS = "1" }
profile = "python"
environment = { SYSTEMROOT = "C:\\Windows", CADRUMO_TEMP_DIR = "scratch", CADRUMO_CLI_REVEAL_IDENTIFIERS = "1", CADRUMO_LOCAL_STORAGE_ROOT = "C:\\launch-vector\\state", TEMP = "C:\\launch-vector\\state\\scratch", TMP = "C:\\launch-vector\\state\\scratch", TMPDIR = "C:\\launch-vector\\state\\scratch", CADRUMO_AUTHORITY_ROOT = "C:\\launch-vector\\package\\data\\authority" }
path = ["C:\\launch-vector\\package", "C:\\launch-vector\\package\\bin", "C:\\Windows\\System32"]

[[launch_vectors]]
name = "windows-runtime-keeps-no-operator-setting"
platform = "windows"
image = "cadrumo-runtime"
arguments = []
ambient = { SYSTEMROOT = "C:\\Windows", TERM = "xterm", CADRUMO_LOG_LEVEL = "DEBUG", CADRUMO_TEMP_DIR = "scratch", CADRUMO_CLI_REVEAL_IDENTIFIERS = "1", CADRUMO_AGENT_PORT = "0" }
profile = "cadrumo-runtime"
environment = { SYSTEMROOT = "C:\\Windows", CADRUMO_LOCAL_STORAGE_ROOT = "C:\\launch-vector\\state", TEMP = "C:\\launch-vector\\state\\tmp", TMP = "C:\\launch-vector\\state\\tmp", TMPDIR = "C:\\launch-vector\\state\\tmp", CADRUMO_AUTHORITY_ROOT = "C:\\launch-vector\\package\\data\\authority" }
path = ["C:\\launch-vector\\package", "C:\\launch-vector\\package\\bin", "C:\\Windows\\System32"]

[[launch_vectors]]
name = "windows-kdf-child-keeps-its-parent-environment"
platform = "windows"
image = "python"
arguments = ["-m", "cadrumo.adapters.persistence.storage.custody._kdf_worker", "--request-handle", "540", "--result-handle", "548"]
ambient = { SYSTEMROOT = "C:\\Windows", NEUTRAL = "kept", CADRUMO_AGENT_PORT = "0", PATH = "C:\\parent" }
profile = "kdf-child"
environment = { SYSTEMROOT = "C:\\Windows", NEUTRAL = "kept", CADRUMO_AGENT_PORT = "0", PATH = "C:\\parent" }

[[launch_vectors]]
name = "windows-kdf-near-miss-takes-the-interpreter-profile"
platform = "windows"
image = "python"
arguments = ["-m", "cadrumo.adapters.persistence.storage.custody._kdf_worker", "--request-handle", "540", "--result-handle", "540"]
ambient = { SYSTEMROOT = "C:\\Windows", NEUTRAL = "dropped" }
profile = "python"
environment = { SYSTEMROOT = "C:\\Windows", CADRUMO_LOCAL_STORAGE_ROOT = "C:\\launch-vector\\state", TEMP = "C:\\launch-vector\\state\\tmp", TMP = "C:\\launch-vector\\state\\tmp", TMPDIR = "C:\\launch-vector\\state\\tmp", CADRUMO_AUTHORITY_ROOT = "C:\\launch-vector\\package\\data\\authority" }
path = ["C:\\launch-vector\\package", "C:\\launch-vector\\package\\bin", "C:\\Windows\\System32"]

[[launch_vectors]]
name = "posix-python-defines-a-closed-environment"
platform = "posix"
