[package]
name = "cadrumo-launch-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "cadrumo_launch_guard"
crate-type = ["staticlib", "rlib"]

[dependencies]
cadrumo-application = { path = "../application" }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
