[package]
name = "cadrumo-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
# CMake selects staticlib/cdylib explicitly; binary and Rust consumers need only the rlib.
crate-type = ["rlib"]

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "platform-consumer"
path = "src/consumer.rs"

# WebView2 interface probes and settings for the desktop host. The C host
# builds without this feature and links none of it.
[features]
webview2 = ["dep:webview2-com", "dep:windows-core"]
# Fixture hooks that place a transport namespace where the caller chooses. Release builds
# refuse the feature.
test-support = []
# The desktop's AppKit calls. Only the desktop enables it, so no other host links AppKit.
appkit = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
webview2-com = { version = "0.39.1", optional = true }
windows-core = { version = "0.62", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSData"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
