[package]
name = "cadrumo-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cadrumo-application = { path = "../application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
