[package]
name = "cadrumo-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
# Lets the supervision core launch a fixture image and builds the fixture runtime and its
# tests. Release builds refuse the feature; the release CMake build never sets it.
fixture-test-mode = []
# Explicit opt-in: consumes a previously assembled package; never rebuilds it.
live-package-tests = []

[dependencies]
cadrumo-application = { path = "../application" }
cadrumo-platform = { path = "../platform" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
base64 = "0.23"
tokio = { version = "1", features = ["rt", "time", "process"] }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative, no-follow calls for the custody primitives.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSNotification", "NSString", "NSRunLoop", "NSTimer"] }
tokio = { version = "1", features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[[bin]]
name = "cadrumo-manager"
path = "src/main.rs"

# A protocol-speaking stand-in for the runtime, launched by the supervision tests in
# isolated synthetic roots, and a detached harness that runs the core without a console.
[[bin]]
name = "cadrumo-manager-fixture"
path = "tests/fixture/runtime.rs"
required-features = ["fixture-test-mode"]

[[test]]
name = "supervision"
path = "tests/supervision.rs"
required-features = ["fixture-test-mode"]

[lints.rust]
# Only the modules that call the operating system allow unsafe code, each block with
# its invariants stated.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
