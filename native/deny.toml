# One policy for every Cargo crate under native/ (there is no Cargo workspace). CTest runs
# `cargo deny --locked check advisories bans licenses sources --config native/deny.toml` per
# crate through native/cmake/RustQuality.cmake; the lockfiles stay authoritative.

[graph]
# Every target and feature, as the lockfile and the repository's OSV scan see it: the Linux-only
# gtk stack and the fixture and live-test features are part of what a lockfile can pull in.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only advisories with no fix available to this repository. Both come from tauri's Linux gtk3
# stack (cadrumo-desktop -> tauri, tauri-runtime-wry, wry, tao, muda -> gtk 0.18 -> glib 0.18),
# which no Windows build compiles. Each also sits in dependency-audit-allowlist.toml, where it
# expires on 2027-01-21 and must be re-triaged; remove both entries once tauri moves off gtk3.
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 VariantStrIter unsoundness: patched only in glib 0.20, which the gtk 0.18 bindings pinned by tauri's wry/tao/muda cannot use; Linux-only, and cadrumo calls no glib API" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained (no patched release exists): a compile-time dependency of glib-macros and gtk3-macros in the same Linux-only gtk3 stack" },
]

[licenses]
version = 2
# Permissive licenses only, taken from `cargo deny list` over all seven lockfiles. A dependency
# offering an OR choice (r-efi: MIT OR Apache-2.0 OR LGPL-2.1-or-later) is satisfied by its
# permissive alternative, so no copyleft identifier is allowed here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# One policy serves seven graphs, so an allowance a given crate does not use is expected.
unused-allowed-license = "allow"

# Weak (file-level) copyleft and a data license, allowed per crate rather than globally so a
# new dependency under either still fails the gate. The MPL-2.0 crates come from the desktop's
# tauri stack (HTML/CSS selectors, directory lookup); webpki-roots is the TLS client's CA bundle.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# The crates under native/ are first-party and carry no license field; they are exempt only
# while their manifests say `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `*` path dependencies are how the first-party crates reference each other; the wildcard
# ban applies to registry requirements only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
