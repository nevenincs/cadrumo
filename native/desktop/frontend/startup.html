<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cadrumo</title>
  </head>
  <body>
    <main aria-busy="true">
      <h1>
        <img id="logo" alt="" draggable="false" />
        <span id="name">Cadrumo</span>
      </h1>
      <div class="activity" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status" class="sr-only"></span>
      </div>
      <p id="failure" role="alert" tabindex="0" hidden></p>
    </main>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
