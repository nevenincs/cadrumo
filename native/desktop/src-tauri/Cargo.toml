[package]
name = "cadrumo-desktop"
version = "0.0.0"
edition = "2024"
publish = false

[features]
live-package-tests = []
# Only for the packaged end-to-end test build: admits a single
# --remote-debugging-port argument in WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS.
# Never enabled for a distributed build.
webview2-remote-debugging = ["agent-direct-start"]
# Development only, and implied by the packaged test host: with
# CADRUMO_AGENT_ANTHROPIC_API_KEY and CADRUMO_AGENT_SOURCE_DIR in its own
# environment the agent host starts cadrumo-agent's gateway directly instead of
# through the launcher. Never enabled for a distributed build.
agent-direct-start = []

[[bin]]
name = "cadrumo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cadrumo-application = { path = "../../application" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
getrandom = "0.3"
zeroize = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
# Rust APIs only: the shell reaches them through token-checked app commands
# and grants the webview no plugin command.
tauri-plugin-clipboard-manager = "2.4.1"
opener = "0.9"
# The agent host's loopback gateway client; already in the graph through
# cadrumo-application.
ureq = { version = "3", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
cadrumo-manager = { path = "../../manager" }
cadrumo-platform = { path = "../../platform", features = ["webview2"] }
cadrumo-installer = { path = "../../installer" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
