[package]
name = "cadrumo-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
live-package-tests = []
# Only for the packaged end-to-end test build: admits a single
# --remote-debugging-port argument in WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS.
# Never enabled for a distributed build.
webview2-remote-debugging = []

[[bin]]
name = "cadrumo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cadrumo-application = { path = "../../application", features = ["platform"] }
cadrumo-platform = { path = "../../platform" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
ctrlc = "3"
getrandom = "0.4"
zeroize = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
# Rust APIs only: the shell reaches them through token-checked app commands
# and grants the webview no plugin command.
tauri-plugin-clipboard-manager = "2.5"
# The agent column's file picker, opened by the host for the files it uploads.
tauri-plugin-dialog = "2"
# The digest an upload is sent with; already in the graph.
sha2 = "0.11"
opener = "0.9"
# The agent host's loopback gateway client; already in the graph through
# cadrumo-application.
ureq = { version = "3", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# The setup host's tests drive a real engine against the local servers the engine's own
# tests use, and every test that reads the diagnostic log waits for its writer through the
# helper the same feature exposes.
cadrumo-application = { path = "../../application", features = ["platform", "test-support"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
cadrumo-manager = { path = "../../manager" }
cadrumo-platform = { path = "../../platform", features = ["webview2"] }
cadrumo-installer = { path = "../../installer" }

[target.'cfg(unix)'.dependencies]
# A termination request ends the window through the same close as a quit.
tokio = { version = "1", features = ["signal"] }

[target.'cfg(any(windows, unix))'.dependencies]
# Every role the binary runs is hosted by the platform's linked interpreter host.
cadrumo-interpreter-host = { path = "../../interpreter_host" }

[target.'cfg(target_os = "macos")'.dependencies]
# The graphical login session the window and its instance lock belong to,
# admitted as the manager admits its own process.
cadrumo-manager = { path = "../../manager" }
# The alert a launch that ends before any window shows, as a native modal panel.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSButton", "NSControl", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
