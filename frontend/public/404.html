<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Casilla not found - Cadrumo</title>
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <style>
      :root {
        --page: #faf8f4;
        --surface: #f1eee7;
        --border: #e4ded4;
        --text: #1c1a17;
        --text-secondary: #6b655c;
        --rust: #c4553b;
        --sage: #55876b;
        --steel: #4a6b8a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2rem 1.25rem;
        max-width: 34rem;
      }

      .kicker {
        margin: 0;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
      }

      h1 {
        margin: 0;
        font-family: 'Instrument Serif', ui-serif, Georgia, serif;
        font-weight: 400;
        font-size: clamp(5rem, 4rem + 8vw, 9rem);
        line-height: 1;
        letter-spacing: -0.125rem;
      }

      h1 .zero {
        display: inline-block;
        color: var(--rust);
        animation: spin-slow 14s linear infinite;
      }

      h2 {
        margin: 0;
        font-family: 'Instrument Serif', ui-serif, Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2rem);
        line-height: 1.2;
      }

      p.lead {
        margin: 0;
        font-size: 1.0625rem;
        line-height: 1.65rem;
        color: var(--text-secondary);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.5rem;
        padding: 0.5rem 1.5rem;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition:
          background-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.15s ease;
      }

      .button:active {
        transform: scale(0.97);
      }

      .button:focus-visible {
        outline: 3px solid var(--rust);
        outline-offset: 3px;
      }

      .button-primary {
        background: var(--rust);
        color: #fff;
      }

      .button-secondary {
        background: var(--page);
        border: 1px solid var(--border);
        color: var(--text);
      }

      @media (hover: hover) {
        .button-primary:hover {
          background: #a94931;
          box-shadow: 0 6px 16px rgb(196 85 59 / 0.28);
          transform: translateY(-1px);
        }

        .button-secondary:hover {
          background: var(--surface);
        }
      }

      /* Floating shapes, echoing the landing artwork */
      .shape {
        position: fixed;
        z-index: 0;
        opacity: 0.55;
        animation: bob 7s ease-in-out infinite;
        pointer-events: none;
      }

      .shape.star {
        width: 9rem;
        height: 9rem;
        background: var(--sage);
        clip-path: polygon(
          50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
          50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
        );
        top: 12%;
        left: 8%;
        animation-delay: 0s;
        animation-duration: 9s;
      }

      .shape.blob {
        width: 11rem;
        height: 11rem;
        background: var(--rust);
        border-radius: 62% 38% 55% 45% / 48% 60% 40% 52%;
        bottom: 10%;
        right: 6%;
        animation-delay: -3s;
        animation-duration: 11s;
        opacity: 0.4;
      }

      .shape.pill {
        width: 7rem;
        height: 3.25rem;
        background: var(--steel);
        border-radius: 999px;
        top: 20%;
        right: 14%;
        rotate: -18deg;
        animation-delay: -5s;
        opacity: 0.45;
      }

      .shape.flower {
        width: 6.5rem;
        height: 6.5rem;
        bottom: 16%;
        left: 12%;
        background:
          radial-gradient(circle at 50% 22%, var(--border) 26%, transparent 27%),
          radial-gradient(circle at 78% 50%, var(--border) 26%, transparent 27%),
          radial-gradient(circle at 50% 78%, var(--border) 26%, transparent 27%),
          radial-gradient(circle at 22% 50%, var(--border) 26%, transparent 27%),
          radial-gradient(circle at 50% 50%, var(--rust) 18%, transparent 19%);
        animation-delay: -1.5s;
        animation-duration: 8s;
      }

      .shape.dot {
        width: 1.25rem;
        height: 1.25rem;
        border-radius: 50%;
        background: var(--sage);
        top: 64%;
        left: 24%;
        animation-delay: -6s;
        animation-duration: 6s;
      }

      .shape.dot-2 {
        width: 0.875rem;
        height: 0.875rem;
        border-radius: 50%;
        background: var(--rust);
        top: 30%;
        left: 30%;
        animation-delay: -2s;
        animation-duration: 10s;
        opacity: 0.5;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-1.5rem) rotate(6deg);
        }
      }

      @keyframes spin-slow {
        to {
          rotate: 360deg;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          translate: 0 1.25rem;
        }

        to {
          opacity: 1;
          translate: 0 0;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        main > * {
          animation: rise 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        main > :nth-child(2) {
          animation-delay: 0.08s;
        }

        main > :nth-child(3) {
          animation-delay: 0.16s;
        }

        main > :nth-child(4) {
          animation-delay: 0.24s;
        }

        main > :nth-child(5) {
          animation-delay: 0.32s;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .shape,
        h1 .zero {
          animation: none;
        }

        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shape star" aria-hidden="true"></div>
    <div class="shape blob" aria-hidden="true"></div>
    <div class="shape pill" aria-hidden="true"></div>
    <div class="shape flower" aria-hidden="true"></div>
    <div class="shape dot" aria-hidden="true"></div>
    <div class="shape dot-2" aria-hidden="true"></div>
    <main>
      <p class="kicker" data-i18n="kicker">ERROR / CASILLA NOT FOUND</p>
      <h1>4<span class="zero">0</span>4</h1>
      <h2 data-i18n="heading">This <span lang="es">casilla</span> doesn&rsquo;t exist.</h2>
      <p class="lead" data-i18n="lead">
        The page you&rsquo;re looking for was never declared, or it has been reconciled away.
        Either way, there&rsquo;s nothing to file here.
      </p>
      <div class="actions">
        <a class="button button-primary" href="/" data-i18n="home">Back to Cadrumo</a>
        <a class="button button-secondary" href="/docs/" data-i18n="docs">Open the docs</a>
      </div>
    </main>
    <script>
      ;(function () {
        var copy = {
          es: {
            title: 'Casilla no encontrada - Cadrumo',
            kicker: 'ERROR / CASILLA NO ENCONTRADA',
            heading: 'Esta casilla no existe.',
            lead:
              'La página que buscas nunca se declaró, o ya se ha conciliado. En cualquier caso, aquí no hay nada que presentar.',
            home: 'Volver a Cadrumo',
            docs: 'Abrir la documentación',
          },
          ca: {
            title: 'Casella no trobada - Cadrumo',
            kicker: 'ERROR / CASELLA NO TROBADA',
            heading: 'Aquesta casella no existeix.',
            lead:
              "La pàgina que busques mai no es va declarar, o ja s'ha conciliat. En qualsevol cas, aquí no hi ha res a presentar.",
            home: 'Torna a Cadrumo',
            docs: 'Obre la documentació',
          },
        }
        var lang = null
        var match = document.cookie.match(/(?:^|;\s*)cadrumo_lang=(en|es|ca)/)
        if (match) {
          lang = match[1]
        } else {
          var candidates = navigator.languages || [navigator.language]
          for (var i = 0; i < candidates.length; i++) {
            var base = (candidates[i] || '').slice(0, 2).toLowerCase()
            if (base === 'en' || base === 'es' || base === 'ca') {
              lang = base
              break
            }
          }
        }
        var strings = copy[lang]
        if (!strings) return
        document.documentElement.lang = lang
        document.title = strings.title
        var nodes = document.querySelectorAll('[data-i18n]')
        for (var j = 0; j < nodes.length; j++) {
          var key = nodes[j].getAttribute('data-i18n')
          if (strings[key]) nodes[j].textContent = strings[key]
        }
      })()
    </script>
  </body>
</html>
