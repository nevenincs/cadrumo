rules:
  - id: no-dict-str-any-in-domain-application
    message: |
      `dict[str, Any]` / `Mapping[str, Any]` forbidden in src/aeat/domain/ and
      src/aeat/application/. Define a typed pydantic model or `TypedDict` for
      the structured shape, or narrow at the consumption boundary
      (e.g. `Model.model_validate(parsed)` and use the model thereafter).
      See defect-class T-01 in the linkage-design-audit reference document.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "src/aeat/domain/"
        - "src/aeat/application/"
    pattern-either:
      - pattern: dict[str, Any]
      - pattern: Dict[str, Any]
      - pattern: Mapping[str, Any]
      - pattern: MutableMapping[str, Any]
