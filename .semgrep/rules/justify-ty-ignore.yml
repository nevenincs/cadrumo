rules:
  - id: justify-ty-ignore-suppression
    message: |
      Type-checker suppression (`# ty: ignore`, `# type: ignore`,
      `# pyright: ignore`, `# mypy: ignore`) must include an inline
      justification comment naming the rule and the rationale. Format:
      `<code>  # ty: ignore[rule-name]  # reason: <why>`.
      Unjustified suppressions are forbidden per defect-class T-11 in
      the linkage-design-audit reference document.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "src/aeat/"
      exclude:
        - "src/aeat/**/test_*.py"
        - "src/aeat/**/_test_*.py"
        - "src/aeat/tests/**/*.py"
    pattern-regex: '#\s*(?:ty|type|pyright|mypy):\s*ignore(?:\[[^\]]+\])?\s*$'
