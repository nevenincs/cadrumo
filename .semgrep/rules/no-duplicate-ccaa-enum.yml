rules:
  - id: no-duplicate-ccaa-enum
    message: |
      A new enum class outside `cadrumo.domain.contribuyente._ccaa` appears to declare
      Spanish autonomous-community members (`ANDALUCIA`, `ARAGON`, `MADRID`, …).
      The canonical geographic identity type is `cadrumo.domain.contribuyente.CCAA`.
      Import it instead of declaring a parallel geographic enum. `CalendarCCAA` is
      deliberately distinct: it carries the holiday-calendar ISO code contract
      ratified by the core-authority ADR.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "src/cadrumo/**"
      exclude:
        - "src/cadrumo/domain/contribuyente/_ccaa.py"
        - "src/cadrumo/**/tests/**"
        - "src/cadrumo/**/test_*.py"
        - "src/cadrumo/**/_test_*.py"
    patterns:
      - pattern-either:
          - pattern: |
              class $ENUM(StrEnum):
                  ANDALUCIA = ...
          - pattern: |
              class $ENUM(StrEnum):
                  ARAGON = ...
          - pattern: |
              class $ENUM(StrEnum):
                  MADRID = ...
          - pattern: |
              class $ENUM(enum.StrEnum):
                  ANDALUCIA = ...
          - pattern: |
              class $ENUM(enum.StrEnum):
                  MADRID = ...
      - metavariable-regex:
          metavariable: $ENUM
          regex: "^(?!CalendarCCAA$).+"
