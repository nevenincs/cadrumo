rules:
  - id: no-any-annotation-in-domain-application
    message: |
      `Any` annotation forbidden in src/cadrumo/domain/ and src/cadrumo/application/.
      Replace with a typed alternative: pydantic model, TypedDict, Union, or
      `object` if the value is truly polymorphic. Type-system escapes in the
      core domain and application layers undermine the strictness contract
      enforced elsewhere.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "src/cadrumo/domain/**"
        - "src/cadrumo/application/**"
      exclude:
        - "src/cadrumo/**/tests/**"
        - "src/cadrumo/**/test_*.py"
        - "src/cadrumo/**/_test_*.py"
    pattern-either:
      - pattern: |
          $X: Any
      - pattern: |
          $X: Any = $Y
      - pattern: |
          def $F(...) -> Any:
              ...
      - patterns:
          - pattern: |
              def $F(..., $PARAM: Any, ...) -> $R:
                  ...
          - pattern-not: |
              def $F(..., **$KW: Any) -> $R:
                  ...
      - patterns:
          - pattern: |
              def $F(..., **$KW: Any) -> $R:
                  ...
          - pattern-not-inside: |
              def reconfigure(self, ...) -> None:
                  ...
