# Duplication dispositions
#
# ===========================================================================
# READ THIS BEFORE QUOTING THE PERCENTAGE
#
# jscpd matches TOKEN SEQUENCES. It cannot see one concept implemented twice
# in different syntax, and that is the duplication this project's rules treat
# as a BLOCKER ("semantic overlap of one concept across different modules").
# So `duplicated_pct` below measures textual similarity, not duplication.
#
# This is measured, not theoretical. Five ledger projections carried the same
# casilla fold -- same algorithm, same output type, differing only in an
# accumulator loop versus a comprehension. jscpd reported NONE of the five,
# and instead flagged the import preambles those same files share. Most
# entries in this file are preamble matches. The real cluster was found by
# reading the concept and was consolidated into
# `application/aggregation/_grouping.py::fold_casilla_observations`.
#
# Therefore: a low percentage here is evidence that little COPY-PASTE
# survives. It is not evidence that little duplication survives, and it never
# has been. Semantic duplication needs a reader; this file is the residue of
# what token matching could reach.
# ===========================================================================
#
# One recorded disposition per clone group jscpd currently observes in the
# production tree (`src/cadrumo`). The clone COUNT is advisory debt, not an
# elimination mandate: jscpd output identifies candidates for semantic
# inspection, never a consolidation verdict. This file records the honest
# disposition of each candidate.
#
# This file is reconciled against a live `just audit-duplication` run, not
# hand-maintained prose: entries for groups a later consolidation resolved are
# removed rather than left stale, because "one disposition per OBSERVED group"
# means observed NOW. Removing a resolved entry records no loss of reasoning
# -- the clone it described no longer exists, so there is nothing left to have
# an opinion about.
#
# Every `[[group]]` carries exactly one `classification`:
#   * cluster-owned     - the group belongs to a named actionable
#                         consolidation cluster already in flight; `owner`
#                         names that cluster.
#   * intentional       - a recorded intentional non-consolidation: either an
#                         ADR "Intentional non-consolidations" entry or a
#                         constraint-divergent pair the substitutability
#                         pre-filter excludes; `rationale` cites why.
#   * advisory-residue  - low-value structural duplication left as VISIBLE
#                         advisory debt. NOT an elimination mandate; recorded so
#                         the count is honest rather than hidden.
#   * actionable        - a real substitutable redeclaration resolved in this
#                         commit; `rationale` names the fix.
#
# `where` uses paths relative to `src/cadrumo/` with jscpd line spans.

[meta]
generated_from = "just audit-duplication (jscpd@4.2.0)"
observed_groups = 4
duplicated_pct = "0.02"
files_analyzed = 1589
source_root = "src/cadrumo"
count_is_advisory = true

