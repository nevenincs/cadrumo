# The three groups below are one finding, not three: jscpd is matching the
# PEP 562 lazy-facade hook that several package `__init__.py` files carry.
# The matched span is always the same body -- the `_LAZY_EXPORTS` lookup, the
# missing-loader guard, the `globals()` write-back, and the `__dir__` that
# reports the unresolved surface alongside `__all__`.
#
# It is not consolidatable, and the reason is structural rather than a
# preference. `__getattr__` is resolved by the interpreter on the MODULE
# object that defines it, and its body writes into that module's own
# `globals()`. A shared helper would either have to be handed each caller's
# `globals()` mapping -- which replaces a legible seventeen-line idiom with an
# indirection that hides which namespace is being mutated -- or close over the
# wrong module entirely. The substitutability pre-filter excludes it on the
# same grounds: the "shared" implementation would need a per-caller namespace
# argument the current sites do not have, so the candidate replacement carries
# a constraint the originals do not.
#
# Recorded rather than eliminated, per this file's own contract: the count is
# advisory debt made visible, never a consolidation mandate.

[[group]]
classification = "intentional"
rationale = "PEP 562 lazy-facade `__getattr__`/`__dir__` hook; not consolidatable because the hook must resolve on, and write into, its own module namespace."
where = [
  "- adapters/persistence/storage/crypto/__init__.py [99:5 - 116:19]",
  "  adapters/persistence/storage/custody/__init__.py [354:5 - 371:27]",
]

