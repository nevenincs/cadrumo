# Duplication dispositions
#
# ===========================================================================
# READ THIS BEFORE QUOTING THE PERCENTAGE
#
# jscpd matches TOKEN SEQUENCES. It cannot see one concept implemented twice
# in different syntax, and that is the duplication this project's rules treat
# as a BLOCKER ("semantic overlap of one concept across different modules").
# So `duplicated_pct` below measures textual similarity, not duplication.
#
# This is measured, not theoretical. Five ledger projections carried the same
# casilla fold -- same algorithm, same output type, differing only in an
# accumulator loop versus a comprehension. jscpd reported NONE of the five,
# and instead flagged the import preambles those same files share.
#
# Therefore: a low percentage here is evidence that little COPY-PASTE
# survives. It is not evidence that little duplication survives, and it never
# has been. Semantic duplication needs a reader; this file is the residue of
# what token matching could reach.
# ===========================================================================
#
# THIS FILE IS AN ADJUDICATION LEDGER, NOT A MUTE.
#
# The governing decision is explicit: a disposition records what a reviewer
# found and why a transformation is safe, and it NEVER excuses a positive
# detector result at closure. Closure requires a literal observed-zero scan.
# No entry here alters detector visibility, verdict semantics, or the count.
# Nothing in this file is a threshold, exclusion, baseline, or allowlist.
#
# One recorded disposition per clone group jscpd currently observes in the
# production tree (`src/cadrumo`). The file is reconciled against a live
# `just audit-duplication` run, not hand-maintained: entries for groups a
# later consolidation resolved are REMOVED rather than left stale, because
# "one disposition per OBSERVED group" means observed NOW. Removing a resolved
# entry loses no reasoning -- the clone it described no longer exists.
#
# Every `[[group]]` carries exactly one `classification`:
#   * cluster-owned     - the group belongs to a named consolidation cluster
#                         already in flight; `owner` names that cluster.
#   * intentional       - a recorded intentional non-consolidation, for a pair
#                         the substitutability pre-filter excludes; `rationale`
#                         cites why. NOTE: while this campaign requires a
#                         literal observed-zero close, this classification
#                         cannot close a group -- it would leave the detector
#                         positive. It stays defined for the rolling ratchet.
#   * advisory-residue  - low-value structural duplication left as VISIBLE
#                         advisory debt, recorded so the count stays honest.
#   * actionable        - a real substitutable redeclaration resolved in the
#                         same commit; `rationale` names the fix.
#
# Every group below is `cluster-owned`. That is the honest reading of the
# current tree: each observed clone maps to a consolidation cluster this
# campaign is actively working, and none has been adjudicated as permanently
# non-consolidatable. `reconciled_groups` equals `observed_groups` because
# every observed group now carries exactly one disposition -- a statement
# about COVERAGE of this ledger, never a claim that the tree is clean. The
# tree is not clean; it carries the clones enumerated below.
#
# `where` uses paths relative to `src/cadrumo/` with jscpd line spans. Spans
# drift on unrelated edits, so the coverage gate keys on file-sets, not spans.
#
# What this record does NOT cover, stated so its silence is not read as
# evidence of absence:
#
#   * `dev/` is outside `source_root`. The standing runner scans the product
#     tree only, because the governing audit scopes every instrument to the
#     intended production scope. `dev/` stays scannable on demand by passing a
#     different `source_root`.
#
#   * Semantic duplication, per the banner at the top of this file.

