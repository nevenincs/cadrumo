# ---------------------------------------------------------------------------
# Orphaned test modules
#
# A test is reported orphaned when every shipped subject it exercises is itself
# a finding. Measured against the live audit, the whole non-TUI population is
# DERIVATIVE: each of the nineteen follows either a module finding already
# classified above, or an unused symbol in a module that is otherwise reachable.
# None is an independent problem, and none carries its own remedy.
#
# That is why these entries record `follows` rather than a class. A test whose
# subject is a `staged-capability` module is not dead -- it is the proof that
# capability still works, and deleting it would leave the staged module
# unguarded. A test following a symbol finding resolves when that symbol does,
# which is the symbol wave's work rather than this one's.
#
# `follows` is `module` or `symbol`; `anchor` names the finding it depends on.
# ---------------------------------------------------------------------------

