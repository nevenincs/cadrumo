]
evidence = "The Art. 108.Dos.5 LIVA exclusion figure, 3005.06 EUR, the euro equivalent of the 500.000 pesetas the consolidated corpus still states: a good acquired below it is NOT a bien de inversion. Re-tested and CONFIRMED. The bienes-de-inversion register does not compute art-108 eligibility -- src/cadrumo/domain/bienes_inversion/register.py carries art108_elegible as an operator-supplied boolean and stores cuota_soportada, the input IVA borne, with no acquisition-value field to compare against the threshold at all. So applying the figure means adding that field and deriving eligibility rather than trusting the flag, which is a schema change and a decision about whether the product judges art. 108 or the operator does; that decision stays open. What did not have to wait on it is the silence: the constant sat in src/cadrumo/core/external_constants.py among enforced thresholds with nothing saying it is not one, and a legally grounded figure in that file reads as applied. Its comment now states that it is declared and not yet applied, and why. Corrected 2026-09-09."
