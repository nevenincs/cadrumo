# ---------------------------------------------------------------------------
# Exported-but-unconsumed published surface
#
# Measured 2026-09-04 across the shipped package: of 8524 names declared in a
# module `__all__`, 367 are reported unused by the audit AND are from-imported
# by no other module. That is 4.3 per cent of the published surface promising
# something nothing collects.
#
# This is a distinct class from ordinary dead code and it dominates what remains
# of the symbol backlog. A name in `__all__` cannot be deleted as an internal
# cleanup: removal changes what the package publishes, and `no-legacy-compatibility`
# makes that a decision about a released surface rather than a tidy-up. Equally
# it cannot be left unremarked, because an exported name reads as supported.
#
# Concentrations: domain/calculations 53, entrypoints/cli 43, application/modelo
# 38, adapters/persistence 27, entrypoints/tui 20 (deferred), application/
# user_profile 18, domain/iva 16, application/filing 15.
#
# The remedy for the class is an owner decision per area: publish it deliberately
# (and cover it), or unpublish it. Nothing here is actioned without that.
# ---------------------------------------------------------------------------

[exported_unused]
measured = "2026-09-04"
declared_exports = 8534
exported_and_unconsumed = 368
method = "a name counts as consumed only when another module from-imports it FROM the declaring module; bare-name matching would count same-named symbols in unrelated packages"
remedy_requires_decision = true
note = """
The population is 4.3% of the declared surface and is CONCENTRATED, not
scattered: three areas hold 135 of the 368. That shape is what makes a
per-area ruling tractable, and it is why no blanket disposition is proposed
here - the reason a name went unconsumed differs by area, and the areas have
different owners.

Every count below is names / modules. Ordered by size.
"""

[[exported_unused_shape]]
shape = "pass-through over its own argument"
names = 1
of_total = 368
measured = "a single-return body delegating to a public attribute or method of one of the function's own parameters -- the `find_invoice` shape exactly, where the caller must already hold the object to make the call, so the export names something it could always reach"
note = """
This is the sharpest triage available and it comes back essentially empty,
which is the useful part: the exported-unused population contains no further
illusions of the kind that made `find_invoice` cheap to retire after weeks of
being treated as a capability decision.

The single hit is not one either. `describe_impersonation_target` returns
`config.target_principal` verbatim, and says why in its own docstring: it
exists as a named accessor so a future CLI show/status verb can surface the
exact service-account identity before an operator approves an IAM role grant,
without a live token exchange first. That is a staged accessor with a stated
reason, not a wrapper nobody chose.

So the 368 are genuinely decisions rather than deferred work. The 72 one-call
-deep names remain a cheaper starting point for a reviewer, but none of them is
resolvable by the reasoning that resolved `find_invoice`.
"""

[[exported_unused_shape]]
shape = "single-return pass-through"
names = 72
of_total = 368
measured = "a function whose whole body, docstring aside, is one `return` of a single call or attribute access; anything with a branch, a loop, a local or a second statement is counted as substantive whatever its length"
note = """
This does not say "delete these". It says the published surface is one call
deep, which makes each a cheaper decision than the other 296 because a reader
can see what is behind it without tracing.

The discriminating question is what the call reaches. `find_invoice` was
`return catalogue.get(invoice_id)` -- a pass-through over an accessor its own
argument already exposed, so the export published an illusion and retiring it
cost nothing. `command_spec_for_path` is `return COMMAND_GRAPH.resolve_path(path)`,
the same shape over an equally public method. But `run_login_tui` takes four
keyword arguments and returns a typed outcome: its single `return` is a
deliberate façade giving a name and a signature to an operation, which is a
surface worth having.

So the split is a triage aid for whoever rules on the 368, not a verdict.
"""

