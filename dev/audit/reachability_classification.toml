# Reachability classification
#
# One recorded class per module the reachability audit reports outside the
# deferred `cadrumo.entrypoints.tui` prefix. The audit establishes that a
# module is not reached from a declared console script. It cannot establish
# WHY, and the remedies differ completely: relocating harness code, deleting an
# orphan, and waiting on a staged capability are three different actions, and
# applying the wrong one either deletes shipped capability or wires code to
# nothing.
#
# THIS FILE IS A CLASSIFICATION LEDGER, NOT A MUTE. Nothing here changes what
# the audit reports, what it counts, or whether the ratchet passes. It records
# what a reviewer found and the evidence that established it.
#
# `class` is one of the closed taxonomy:
#
#   harness-code          reached only by `dev/`; belongs beside the dev
#                         consumer that drives it.
#   test-support          reached only by tests and written to serve them;
#                         belongs under the wheel-excluded test tree.
#   superseded            a reachable module already discharges the
#                         responsibility; delete with its tests. Requires a
#                         named live module found by MEANING, not by name.
#   staged-capability     built ahead of a dependency, with an accepted
#                         decision recording what it waits on. Never delete.
#   orphaned              nothing reaches it and no decision explains it;
#                         delete with its tests.
#   should-be-live        a product command needs it and the wiring is the
#                         defect.
#   deferred-by-ownership inside, or an exclusive supplier of, a frozen prefix
#                         owned by another in-flight campaign.
#
# `evidence` names what established the class: the consuming module, or the
# accepted decision. A class asserted without evidence is relabelling.

