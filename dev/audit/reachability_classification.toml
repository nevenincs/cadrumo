# Exact-confidence symbol partition
#
# 602 of the 1408 symbol findings are `exact` -- resolved through the import
# graph rather than by attribute-name matching -- and the audit's own guidance
# is to start a cleanup there. The `name-match` and `name-match-data` tiers are
# members reached by attribute access the scan cannot bind to a type, so they
# are candidates for review rather than findings to act on.
#
# The exact tier contains only functions, constants and classes. Every
# enum-member, attribute and method finding sits in the lower tiers, which is
# why this campaign's symbol work is bounded by the counts below rather than by
# the headline 1408.
#
# The population splits by OUTSIDE USE, exactly as the modules did, and the
# split is what determines the remedy:
#
#   test-only     a symbol only its tests reach. Either the behaviour has no
#                 production caller and retires with its test, or the test is
#                 exercising a seam that should be reached and the missing call
#                 is the defect.
#   unreferenced  nothing reaches it at all. The sharpest population, and where
#                 supersession concentrates.
#   dev-reached   reached from `dev/`; follows its module's harness-code remedy.
#
# SUPERSESSION IS DETECTABLE, NOT GUESSED. For a constant, the test is whether
# its literal VALUE still appears in production outside its defining module: the
# value moved to a declaration and the name was left behind. Applied to the
# sixteen unreferenced constants carrying an inspectable string literal, eleven
# proved superseded, with the live holder named in each case -- the error-code
# registry, the namespace registry, and the CommandSpec declarations. A name
# search cannot produce that evidence, which is why the governing decision
# requires it for this class.
# ---------------------------------------------------------------------------

