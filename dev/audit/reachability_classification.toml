# The earlier triage resolved a reference by searching file text, so a name
# mentioned in an inert namespace docstring counted as a production consumer.
# Those docstrings are navigational maps naming every contract in the package,
# so the error was systematic and one-directional: it inflated the bucket that
# looks healthiest. Counting only AST reference nodes -- Name loads, attribute
# access, import aliases, and string constants that bind a name in a spec table
# -- moves "referenced by live production code" from 66 to 17, and the residue
# is 83% test-only rather than 69%.
