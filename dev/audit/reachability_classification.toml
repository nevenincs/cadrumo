# ---------------------------------------------------------------------------
# A declared legal threshold with no application
#
# `core/external_constants.py` declares IVA_BIEN_ESCASO_VALOR_UMBRAL_EUR as
# Decimal("3005.06") and nothing reads it. That is not dead code in the ordinary
# sense: an AEAT threshold present in the constants but applied nowhere means the
# rule it encodes is not enforced anywhere in the engine.
#
# Under no-silent-under-declaration that is the interesting direction. A missing
# threshold check does not fail loudly; it produces a total that silently omits
# the rule. Recorded for its owner rather than deleted, because deleting it would
# remove the evidence that the rule was ever intended.
# ---------------------------------------------------------------------------

