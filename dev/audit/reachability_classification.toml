# design-time-authority -- declarations whose only reader is a conformance gate
#
# Corrected from `harness-code` after attempting the relocation remedy. The
# distinction is what the code IS, not who reads it: harness code is written to
# serve the harness, while each of these is a product declaration that
# constrains other declarations. `cadrumo.core.address_components` already
# carried exactly this shape in the module ratchet as an [[intentional]]
# `design_time_authority`, so the class existed before this campaign named it.
# ---------------------------------------------------------------------------

