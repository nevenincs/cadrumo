# ---------------------------------------------------------------------------
# Legal figures in external_constants are documented defaults, not dead values
#
# Nine constants in core/external_constants.py have no production reader, and
# the first reading -- that AEAT rules were declared but never enforced -- was
# WRONG. `domain/contribuyente/deduccion_maternidad.py` states the contract
# outright: "The registry is the causal authority: a missing revision or
# parameter is a grounding defect and raises RegistryValidationError rather than
# falling back to the module constant, which is a documented default the
# arithmetic must not silently prefer."
#
# So the arithmetic reads the dated Modelo 100 registry parameter and the
# constant records the legal figure for a reader. Being unread is the design
# holding, exactly as it is for the operator-surface CRUD catalogue: a
# declaration whose only consumers are a reader and a test is not waiting for a
# caller.
#
# This also explains the shape of the tests that touch them. The
# `external_constants_centralisation` tests assert WHERE a figure lives, not that
# a calculation applies it, so a constant can pass its test while no arithmetic
# reads it -- which is correct here, and would be a defect anywhere the registry
# was not the causal authority.
# ---------------------------------------------------------------------------

