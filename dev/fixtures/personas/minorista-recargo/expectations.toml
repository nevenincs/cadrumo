[[values]]
modelo = "130"
period = "1T"
year = "horizon-1"
casillas = { "01" = "14300.00", "02" = "10554.82", "03" = "3745.18", "04" = "749.04", "05" = "0.00", "06" = "0.00", "07" = "749.04" }
parameters = { provision_rate = "0.05", provision_cap = "2000.00", pago_rate = "0.20" }
derivation = """
Under recargo de equivalencia the IVA charged to customers is not liquidated, so sales enter income at the till amount and IVA plus recargo paid enter cost.
01 = MIN-TPV-01..03 4850.00 + 4120.00 + 5330.00 = 14300.00.
Gastos = MIN-COM-1 8581.60 (6800.00 + IVA 1428.00 + recargo 353.60) + RETA 3 x 294.00 + MIN-LUZ-1 254.10 + MIN-IBI-1 640.00 = 10357.70.
MIN-IBI-1 640.00 is the IBI of the shop, a deductible tributo of the activity; under the devengo criterion the persona
elects it is imputed on its accrual date, the first day of its período impositivo, the calendar year (TRLRHL art. 75,
BOE-A-2004-4214; LIRPF art. 14.1.b), so it enters the cumulative gastos from the first quarter, not on its 15 September payment.
Assumes opening and closing stock are equal, so purchases are the cost of goods sold.
Provisión = 5 % of 3942.30 = 197.12 (half-up from 197.115); 02 = 10554.82; 03 = 3745.18; 04 = 749.04 (half-up from 749.036); 05 = 0.00; 07 = 749.04.
"""
legal_ref = ["ley-35-2006:art-14", "ley-37-1992:art-154", "rd-439-2007:art-30", "rd-439-2007:art-110"]
grounding = "cited"

