year = "horizon-1"
casillas = { "01" = "14300.00", "02" = "9946.82", "03" = "4353.18", "04" = "870.64", "05" = "0.00", "06" = "0.00", "07" = "870.64" }
parameters = { provision_rate = "0.05", provision_cap = "2000.00", pago_rate = "0.20" }
derivation = """
Under recargo de equivalencia the IVA charged to customers is not liquidated, so sales enter income at the till amount and IVA plus recargo paid enter cost.
01 = MIN-TPV-01..03 4850.00 + 4120.00 + 5330.00 = 14300.00.
Gastos = MIN-COM-1 8581.60 (6800.00 + IVA 1428.00 + recargo 353.60) + RETA 3 x 294.00 + MIN-LUZ-1 254.10 = 9717.70.
Assumes opening and closing stock are equal, so purchases are the cost of goods sold.
Provisión = 5 % of 4582.30 = 229.12 (half-up from 229.115); 02 = 9946.82; 03 = 4353.18; 04 = 870.64; 07 = 870.64.
"""
legal_ref = ["ley-37-1992:art-154", "rd-439-2007:art-30", "rd-439-2007:art-110"]
grounding = "cited"

