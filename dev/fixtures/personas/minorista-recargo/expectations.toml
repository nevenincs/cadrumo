casillas = { "0599" = "0.00", "0177" = "0.00", "0181" = "31171.40", "0182" = "0.00", "0183" = "0.00", "0218" = "35715.80" }
not_sourced = { "0604" = "4112.40" }
concepts = { ingresos_actividad = "58000.00", gastos_actividad = "36355.80", provision_dificil_justificacion = "1082.21", rendimiento_neto_actividad = "20561.99", minimo_personal = "5550.00" }
derivation = """
Rendimiento neto = 58000.00 - 36355.80 - 1082.21 = 20561.99. 0604 = 870.64 + 1202.53 + 668.81 + 1370.42 = 4112.40.
0181 (compras de existencias) = MIN-COM-1..4 at acquisition cost: 8581.60 + 6814.80 + 6183.80 + 9591.20 = 31171.40.
Under recargo de equivalencia she deducts no IVA soportado (LIVA art. 154.Dos), so the IVA and the recargo
are part of the price (Manual Renta parte 1, compras de existencias: 2025 line 17591, 2024 line 17348,
2023 line 16728, 2022 line 14543; IVA soportado no deducible as mayor coste: 2025 lines 17601-17604,
2024 lines 17360-17361, 2023 lines 16735-16736, 2022 lines 14550-14551).
Each purchase claims the ledger row that pays it, so the rows leave the ledger expenses: 0183 = 0.00.
The closing equals the opening (7400.00), so 0177 = 0182 = 0.00, and 0218 keeps every gasto once: 35715.80.
"""
legal_ref = ["ley-35-2006:art-28", "ley-35-2006:art-57", "rd-439-2007:art-30", "ley-37-1992:art-154"]
grounding = "cited"
reason = "Casilla 0604 sums the pagos fraccionados of this year's Modelo 130 returns as filed (LIRPF art. 99, RIRPF art. 110), and none is filed: the first quarter cannot be, because its casilla 13 rests on a prior-year Renta the persona holds at most as its own copy, never as AEAT-captured evidence. The calculation leaves 0604 unresolved for that missing input; the figure is what the filed quarters would give."
