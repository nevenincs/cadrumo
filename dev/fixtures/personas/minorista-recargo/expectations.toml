parameters = { provision_rate = "0.07", provision_cap = "2000.00", pago_rate = "0.20" }
derivation = """
The same income and gastos as the value above; only the provision differs. LIRPF disposición adicional quincuagésima sexta (Ley 31/2022, art. 60.2) raises the RIRPF art. 30.2.4.ª percentage
to 7 % for the one período impositivo it names, so in a year that provision governs:
provisión = 7 % of (14300.00 - 10357.70) = 7 % of 3942.30 = 275.96 (half-up from 275.961);
02 = 10633.66; 03 = 3666.34; 04 = 733.27 (half-up from 733.268); 05 = 0.00 (first quarter); 06 = 0.00; 07 = 733.27.
"""
legal_ref = ["ley-35-2006:art-14", "ley-35-2006:da-56", "rd-439-2007:art-30", "rd-439-2007:art-110"]
