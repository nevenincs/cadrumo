format = 1

[persona]
id = "minorista-recargo"
title = "Comerciante minorista en recargo de equivalencia"
summary = """
Rosa Gil vende ropa al por menor en una tienda de Zaragoza. Como comerciante
minorista persona física está en el régimen especial del recargo de
equivalencia: su mayorista le repercute IVA y recargo, ella no liquida IVA ni
presenta los Modelos 303 y 390, y el IVA soportado es coste. Tributa en
estimación directa simplificada y presenta pagos fraccionados.
"""
taxpayer = "minorista.titular"
fiscal_year = "horizon-1"
modelos = ["130", "347", "100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "natural_person"
"tax-id" = { identity = "minorista.titular" }
"name" = { identity = "minorista.titular", field = "name" }
"surnames" = { identity = "minorista.titular", field = "surnames" }
"fiscal-residency" = "resident_irpf"
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "aragon"
"address-postcode" = "50004"
"irpf-income-categories" = ["actividad_economica"]
"activity-start-date" = { year = "horizon-12", month = 4, day = 1 }
"iva-regime" = "RECARGO_EQUIVALENCIA"
"iva-roi-enrolled" = false
"iva-oss-enrolled" = false
"iva-group-member-enrolled" = false
"iva-group-dominant-entity-enrolled" = false
"iva-sii-enrolled" = false
"iva-redeme-enrolled" = false
"iva-cash-accounting-regime-enrolled" = false
"iva-voluntary-sii-enrolled" = false
"iva-hydrocarbon-deposit-advance-payment-deduction-entitled" = false
"iva-intracommunity-operations-exceed-50000-eur" = false
"enrollment-large-company" = false
"taxation-type" = "1"
"taxpayer-sex" = "M"
"taxpayer-marital-status" = "1"
"situacion-familiar" = "soltero"
"taxpayer-birth-date" = { year = "horizon-47", month = 2, day = 9 }
"has-employees" = false
"pays-professionals-with-retencion" = false
"pays-rent-with-retencion" = false
"pays-capital-income-with-retencion" = false
"art109-activity-income-withholding-ge-70pct" = false
"irpf-estimation-regime" = "directa_simplificada"
"irpf-codigo-comercio-accounting" = false
"does-intracomunitario" = false
"third-party-transactions-above-347-threshold" = true

# The censal tipo de actividad (Modelo 036 casillas 403 and 404, AEAT guide
# "aeat-m036-activity-code-table-2026-03-26"), which Modelo 100 casilla 0166 states:
# IAE sección primera, epígrafe 651.2: actividad empresarial, so A03.
[[activities]]
description = "Comercio al por menor de prendas de vestir"
iae_epigraph = "651.2"
tipo_actividad = "A03"

# The shop holds clothing for sale at every closing. Her count at the end of
# the year, valued at acquisition price, equals the previous closing, so the
# book opens and closes at the same stock and records no movement. The Modelo
# 100 rows of the stock variation (casillas 0177 and 0182) read no variation on
# her statement, never by default.
[[inventory]]
activity = "comercio-prendas-vestir"
year = "horizon-1"
valuation_method = "fifo"
opening_stock = "7400.00"
closing_stock = "7400.00"
statement = "Las existencias de prendas de vestir de la tienda, valoradas a precio de adquisición, sumaban 7400,00 euros al cierre del ejercicio anterior y 7400,00 euros al cierre de este."

[[elections]]
question = "irpf-activity-income-imputation-criterion"
value = "devengo"
year = "horizon-1"

# The previous year's Renta as the AEAT holds it: her justificante and the filed
# declaration, which the product admits through its receipt checks, so a later
# return's cross-period check can rely on it: no negative general base was left
# pending to offset, so the four-year carry of casilla 1380 starts from zero, and
# the net income of the activity in estimación directa (casilla 0224) was 19000.00,
# above the 12000.00 up to which RIRPF art. 110.3.c lets casilla 13 of Modelo 130
# lower the quarterly payment.
[[aeat_filings]]
modelo = "100"
year = "horizon-2"
period = "0A"
presented = { year = "horizon-1", month = 6, day = 2 }
csv = "M8XD4QH7W2KP9FZC"
justificante = "1004348706139"
casillas = { "0224" = "19000.00", "1384" = "0.00", "1387" = "0.00", "1390" = "0.00", "1391" = "0.00" }
reason = "Rendimiento neto de la actividad y bases liquidables generales negativas pendientes en la declaración de la renta del ejercicio anterior"
