# Identity catalogue for the canonical test personas.
#
# Every tax identifier used by a persona file is declared here exactly once and
# bound to exactly one role. Persona files never spell an identifier; they name
# the role (`<persona-prefix>.<role>`) and the reader resolves it here.
#
# "Synthetic" is a repository convention, not an authority guarantee: no
# official reserved range of NIF, NIE or CIF values exists. The convention is
# that every value below is pattern-evident (a zero counter) and
# checksum-valid, so a reader can verify each one by rule (pattern + checksum)
# without an allowlist of values. Tests that need no persona draw from the
# generic pool declared under [convention.generic_pool]; persona roles never
# share a value with the pool.

format = 1

[convention]
statement = "Synthetic identifiers are a repository convention: pattern-evident, checksum-valid, role-bound values. No official reserved range exists, so the convention does not guarantee that no real taxpayer holds a value."
natural_person_pattern = "an eight-digit zero counter 00000001, 00000002, ... below 00001000 followed by the NIF control letter (counter mod 23 indexed into TRWAGMYFPDXBNJZSQVHLCKE); 12345678Z and 00000000T belong to the generic pool, not to a role"
nie_pattern = "X, Y or Z followed by a seven-digit counter below 0001000 and the NIF control letter computed after replacing X/Y/Z by 0/1/2; Y uses counter zero and X starts at counter one because X0000000T is the registry development mock developer identity"
legal_entity_pattern = "<letter><seven-digit counter below 0001000><control>, counter starting at 0000001; control digit for A, B, E, H; control letter for P, Q, R, S, N, W; C, D, F, G, J, U, V accept either, and this catalogue uses the digit"
eu_vat_pattern = "<country prefix> followed by zeros and a final counter digit, shaped to the member state's structure; the French key is the formula (12 + 3 * (SIREN mod 97)) mod 97; never validated against VIES"
uniqueness = "Each value is bound to one role; each role names one value."
generic_use = "A persona role value appears only in its persona's own files and in the generated projections; a test with no persona takes a generic pool value or a refusal."

# Values for tests that need any checksum-valid identifier and no persona. The
# gate (dev.identity) accepts a pool member anywhere in tests and fixtures and
# refuses a pool member bound to a role. 12345678Z and 00000000T stay in the
# pool because they are in wide generic use; each range is a bounded block of one thousand counters, 1000 to 1999, above every
# persona counter and below any value a real issuer is likely to hold; a value
# outside the block is refused even when its check character is valid.

[convention.generic_pool]
values = ["12345678Z", "00000000T"]

[[convention.generic_pool.ranges]]
kind = "nif"
first = 1000
last = 1999

[[convention.generic_pool.ranges]]
kind = "nie"
letters = ["X", "Y", "Z"]
first = 1000
last = 1999

[[convention.generic_pool.ranges]]
kind = "prefixed_nif"
letters = ["K", "L", "M"]
first = 1000
last = 1999

[[convention.generic_pool.ranges]]
kind = "cif"
letters = ["A", "B", "C", "D", "E", "F", "G", "H", "J", "N", "P", "Q", "R", "S", "U", "V", "W"]
first = 1000
last = 1999

# Generated projections derive from the personas, so they may state any role
# value. Each entry is a path prefix.

[convention.generated_projections]
paths = ["native/desktop/frontend/src/dev/fixtures/", "docs/_sequences/"]

