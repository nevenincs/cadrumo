# Identity catalogue for the canonical test personas.
#
# Every tax identifier used by a persona file is declared here exactly once and
# bound to exactly one role. Persona files never spell an identifier; they name
# the role (`<persona-prefix>.<role>`) and the reader resolves it here.
#
# "Synthetic" is a repository convention, not an authority guarantee: no
# official reserved range of NIF, NIE or CIF values exists. The convention is
# that every value below is pattern-evident (a zero counter, or the single
# primary value 12345678Z) and checksum-valid, so a reader can verify each one
# by rule (pattern + checksum) without an allowlist of values.

format = 1

[convention]
statement = "Synthetic identifiers are a repository convention: pattern-evident, checksum-valid, role-bound values. No official reserved range exists, so the convention does not guarantee that no real taxpayer holds a value."
primary_natural_person = "12345678Z"
natural_person_pattern = "an eight-digit zero counter 00000000, 00000001, ... followed by the NIF control letter (counter mod 23 indexed into TRWAGMYFPDXBNJZSQVHLCKE); 12345678Z is the only other natural-person value"
nie_pattern = "X, Y or Z followed by a seven-digit zero counter and the NIF control letter computed after replacing X/Y/Z by 0/1/2; Y and Z use counter zero, X starts at counter one because X0000000T is the registry development mock developer identity"
legal_entity_pattern = "<letter><seven-digit zero counter><control>, counter starting at 0000001; control digit for A, B, E, H; control letter for P, Q, R, S, N, W; C, D, F, G, J, U, V accept either, and this catalogue uses the digit"
eu_vat_pattern = "<country prefix> followed by zeros and a final counter digit, shaped to the member state's structure; never validated against VIES"
uniqueness = "Each value is bound to one role; each role names one value."

