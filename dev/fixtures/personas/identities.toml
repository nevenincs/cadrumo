# Refusal-test values. Checksum-invalid on purpose; never bound to a role and
# never used by a persona. Tests that prove identifier refusal take them from
# here.

[[refusals]]
value = "B00000001"
kind = "cif"
reason = "CIF kind B control digit mismatch: the counter 0000000 requires control digit 0."

[[refusals]]
value = "B12345678"
kind = "cif"
reason = "CIF kind B control digit mismatch: the counter 1234567 requires control digit 4."

[[refusals]]
value = "12345678A"
kind = "nif"
reason = "NIF control letter mismatch: 12345678 requires control letter Z."
