format = 1

[persona]
id = "intracomunitario-desarrollador"
title = "Desarrollador residente con clientes y proveedor en otros Estados miembros"
summary = """
Mikkel Holm, nacional danés con NIE y residencia fiscal en Barcelona, desarrolla
software como profesional. Factura a clientes empresarios de Alemania y Francia
sin IVA español (servicios localizados en destino, inversión del sujeto pasivo),
a una empresa española con IVA y retención del 15 %, y compra alojamiento en la
nube a un proveedor irlandés, por el que autoliquida el IVA. Está dado de alta en
el ROI y presenta el Modelo 349 trimestral.
"""
taxpayer = "intracom.titular"
fiscal_year = "horizon-1"
modelos = ["303", "349", "390", "130", "100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "natural_person"
"tax-id" = { identity = "intracom.titular" }
"name" = { identity = "intracom.titular", field = "name" }
"surnames" = { identity = "intracom.titular", field = "surnames" }
"fiscal-residency" = "resident_irpf"
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "cataluna"
"address-postcode" = "08012"
"irpf-income-categories" = ["actividad_economica"]
"activity-start-date" = { year = "horizon-4", month = 2, day = 1 }
"iva-regime" = "GENERAL"
"iva-m303-regime-composition" = "general"
"iva-roi-enrolled" = true
"iva-oss-enrolled" = false
"iva-group-member-enrolled" = false
"iva-group-dominant-entity-enrolled" = false
"iva-sii-enrolled" = false
"iva-redeme-enrolled" = false
"iva-intracommunity-operations-exceed-50000-eur" = false
"iva-cash-accounting-regime-enrolled" = false
"iva-voluntary-sii-enrolled" = false
"iva-hydrocarbon-deposit-advance-payment-deduction-entitled" = false
"enrollment-large-company" = false
"taxation-type" = "1"
"taxpayer-sex" = "H"
"taxpayer-marital-status" = "1"
"situacion-familiar" = "soltero"
"taxpayer-birth-date" = { year = "horizon-33", month = 7, day = 23 }
"has-employees" = false
"pays-professionals-with-retencion" = false
"pays-rent-with-retencion" = false
"pays-capital-income-with-retencion" = false
"art109-activity-income-withholding-ge-70pct" = false
"irpf-estimation-regime" = "directa_simplificada"
"irpf-codigo-comercio-accounting" = false
"does-intracomunitario" = true
"third-party-transactions-above-347-threshold" = false

[fields]
"irpf.activity_kind" = "profesional"

# The censal tipo de actividad (Modelo 036 casillas 403 and 404, AEAT guide
# "aeat-m036-activity-code-table-2026-03-26"), which Modelo 100 casilla 0166 states:
# IAE sección segunda, grupo 763 "Programadores y Analistas de Informática": actividad profesional, so A05.
[[activities]]
description = "Programación y análisis informático"
iae_epigraph = "763"
tipo_actividad = "A05"

# He sells his own programming and analysis work and holds no mercaderías or
# materias primas, so his activity holds no existencias: the book opens at
# zero, records no movement and closes on its movements at zero. The Modelo
# 100 rows of the stock variation and the purchases of existencias (casillas
# 0177, 0181 and 0182) read it as zero on his statement, never by default.
[[inventory]]
activity = "programacion-informatica"
year = "horizon-1"
valuation_method = "fifo"
opening_stock = "0.00"
closing_stock = "0.00"
statement = "La actividad de programación y análisis informático no mantuvo existencias en ningún momento del ejercicio ni al cierre del anterior."

[[elections]]
question = "irpf-activity-income-imputation-criterion"
value = "devengo"
year = "horizon-1"

# The previous year's Renta as the AEAT holds it: his justificante and the filed
# declaration, which the product admits through its receipt checks, so a later
# return's cross-period check can rely on it: no negative general base was left
# pending to offset, so the four-year carry of casilla 1380 starts from zero, and
# the net income of the activity in estimación directa (casilla 0224) was 33000.00,
# above the 12000.00 up to which RIRPF art. 110.3.c lets casilla 13 of Modelo 130
# lower the quarterly payment.
[[aeat_filings]]
modelo = "100"
year = "horizon-2"
period = "0A"
presented = { year = "horizon-1", month = 5, day = 19 }
csv = "R3VN8B6YJ2CF5TQA"
justificante = "1004237695028"
casillas = { "0224" = "33000.00", "1263" = "0.00", "1266" = "0.00", "1269" = "0.00", "1270" = "0.00", "1276" = "0.00", "1279" = "0.00", "1282" = "0.00", "1283" = "0.00", "1384" = "0.00", "1387" = "0.00", "1390" = "0.00", "1391" = "0.00" }
reason = "Rendimiento neto de la actividad y bases liquidables generales negativas y saldos negativos de la base del ahorro pendientes en la declaración de la renta del ejercicio anterior"

# The first-quarter Modelo 130 reads the previous ejercicio's net activity income
# from his Modelo 100 of the year before. When that year lies below the support
# floor the application holds no such return, so he states the figure himself;
# where the application holds the return, it governs and this statement is not
# submitted.
[[attested_prior_values]]
modelo = "130"
period = "1T"
year = "horizon-1"
binding = "irpf.previous_year_economic_activity_net_income"
value = "33000.00"
source = { modelo = "100", year = "horizon-2", period = "0A" }
derivation = "Suma de las casillas 0224, 1479, 1553 y 1577 de su declaración de la renta del ejercicio anterior (RIRPF art. 110.3.c). Solo declaró la casilla 0224, rendimiento neto de su única actividad económica (33000.00); no tuvo rendimientos de las clases de las casillas 1479, 1553 y 1577."
legal_ref = ["rd-439-2007:art-110"]

[[attested_prior_values]]
modelo = "130"
period = "2T"
year = "horizon-1"
binding = "irpf.previous_year_economic_activity_net_income"
value = "33000.00"
source = { modelo = "100", year = "horizon-2", period = "0A" }
derivation = "Suma de las casillas 0224, 1479, 1553 y 1577 de su declaración de la renta del ejercicio anterior (RIRPF art. 110.3.c). Solo declaró la casilla 0224, rendimiento neto de su única actividad económica (33000.00); no tuvo rendimientos de las clases de las casillas 1479, 1553 y 1577."
legal_ref = ["rd-439-2007:art-110"]

[[attested_prior_values]]
modelo = "130"
period = "3T"
year = "horizon-1"
binding = "irpf.previous_year_economic_activity_net_income"
value = "33000.00"
source = { modelo = "100", year = "horizon-2", period = "0A" }
derivation = "Suma de las casillas 0224, 1479, 1553 y 1577 de su declaración de la renta del ejercicio anterior (RIRPF art. 110.3.c). Solo declaró la casilla 0224, rendimiento neto de su única actividad económica (33000.00); no tuvo rendimientos de las clases de las casillas 1479, 1553 y 1577."
legal_ref = ["rd-439-2007:art-110"]

[[attested_prior_values]]
modelo = "130"
period = "4T"
year = "horizon-1"
binding = "irpf.previous_year_economic_activity_net_income"
value = "33000.00"
source = { modelo = "100", year = "horizon-2", period = "0A" }
derivation = "Suma de las casillas 0224, 1479, 1553 y 1577 de su declaración de la renta del ejercicio anterior (RIRPF art. 110.3.c). Solo declaró la casilla 0224, rendimiento neto de su única actividad económica (33000.00); no tuvo rendimientos de las clases de las casillas 1479, 1553 y 1577."
legal_ref = ["rd-439-2007:art-110"]

# At the clock every quarterly IVA return of the fiscal year is past its window,
# so he has filed each one. Every quarter was to pay, so no compensation was
# pending before the first quarter.
[[filed_returns]]
modelo = "303"
year = "horizon-1"
periods = ["1T", "2T", "3T", "4T"]
iva_compensation_carried_in = "0.00"

# A synthetic titular account (checksum-valid, not a real bank) designated for a
# Modelo 100 refund: AEAT pays a refund by transfer to the account the taxpayer
# states as held in the return (Manual Renta, devolución; art. 132.1 RGAT).
[[own_accounts]]
label = "Cuenta principal"
holding = "titular"
iban = "ES1700000000000000000006"
designations = [{ role = "refund", modelo = "100" }]

# No negative general base of an earlier ejercicio is pending: this synthetic
# taxpayer has had no year with a negative base. Where the profile holds no
# earlier return, as for the return of the support floor, the Modelo 100 cannot
# read the four pending carries (casillas 1380, 1382, 1385 and 1388) and never
# takes them as zero, so the taxpayer states that none is pending.
[[prior_carries]]
year = "horizon-1"
family = "renta_negative_general_bases_pending"
nothing_pending = true

# No interest, dividends or other capital mobiliario in this year or the four before it, so no negative balance of it is pending.
[[prior_carries]]
year = "horizon-1"
family = "renta_negative_savings_capital_income_pending"
nothing_pending = true

# No sale of shares, funds or other asset in this year or the four before it, so no negative savings balance of gains and losses is pending.
[[prior_carries]]
year = "horizon-1"
family = "renta_negative_savings_gains_losses_pending"
nothing_pending = true
