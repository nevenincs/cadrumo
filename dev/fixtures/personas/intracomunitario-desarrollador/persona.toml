format = 1

[persona]
id = "intracomunitario-desarrollador"
title = "Desarrollador residente con clientes y proveedor en otros Estados miembros"
summary = """
Mikkel Holm, nacional danés con NIE y residencia fiscal en Barcelona, desarrolla
software como profesional. Factura a clientes empresarios de Alemania y Francia
sin IVA español (servicios localizados en destino, inversión del sujeto pasivo),
a una empresa española con IVA y retención del 15 %, y compra alojamiento en la
nube a un proveedor irlandés, por el que autoliquida el IVA. Está dado de alta en
el ROI y presenta el Modelo 349 trimestral.
"""
taxpayer = "intracom.titular"
fiscal_year = "horizon-1"
modelos = ["303", "349", "390", "130", "100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "natural_person"
"tax-id" = { identity = "intracom.titular" }
"name" = { identity = "intracom.titular", field = "name" }
"surnames" = { identity = "intracom.titular", field = "surnames" }
"fiscal-residency" = "resident_irpf"
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "cataluna"
"address-postcode" = "08012"
"irpf-income-categories" = ["actividad_economica"]
"activity-start-date" = { year = "horizon-4", month = 2, day = 1 }
"iva-regime" = "GENERAL"
"iva-m303-regime-composition" = "general"
"iva-roi-enrolled" = true
"iva-oss-enrolled" = false
"iva-group-member-enrolled" = false
"iva-group-dominant-entity-enrolled" = false
"iva-sii-enrolled" = false
"iva-redeme-enrolled" = false
"iva-intracommunity-operations-exceed-50000-eur" = false
"iva-cash-accounting-regime-enrolled" = false
"iva-voluntary-sii-enrolled" = false
"iva-hydrocarbon-deposit-advance-payment-deduction-entitled" = false
"enrollment-large-company" = false
"taxation-type" = "1"
"taxpayer-sex" = "H"
"taxpayer-marital-status" = "1"
"situacion-familiar" = "soltero"
"taxpayer-birth-date" = { year = "horizon-33", month = 7, day = 23 }
"has-employees" = false
"pays-professionals-with-retencion" = false
"pays-rent-with-retencion" = false
"pays-capital-income-with-retencion" = false
"art109-activity-income-withholding-ge-70pct" = false
"irpf-estimation-regime" = "directa_simplificada"
"irpf-codigo-comercio-accounting" = false
"does-intracomunitario" = true
"third-party-transactions-above-347-threshold" = false

[fields]
"irpf.activity_kind" = "profesional"

[[activities]]
description = "Programación y análisis informático"
iae_epigraph = "763"

[[elections]]
question = "irpf-activity-income-imputation-criterion"
value = "devengo"
year = "horizon-1"

# His own copy of the previous year's Renta: no negative general base was left
# pending to offset, so the four-year carry of casilla 1380 starts from zero, and
# the net income of the activity in estimación directa (casilla 0224) was 33000.00,
# above the 12000.00 up to which RIRPF art. 110.3.c lets casilla 13 of Modelo 130
# lower the quarterly payment.
[[local_observations]]
modelo = "100"
year = "horizon-2"
period = "0A"
casillas = { "0224" = "33000.00", "1384" = "0.00", "1387" = "0.00", "1390" = "0.00", "1391" = "0.00" }
reason = "Rendimiento neto de la actividad y bases liquidables generales negativas pendientes en la declaración de la renta del ejercicio anterior"

# At the clock every quarterly IVA return of the fiscal year is past its window,
# so he has filed each one. Every quarter was to pay, so no compensation was
# pending before the first quarter.
[[filed_returns]]
modelo = "303"
year = "horizon-1"
periods = ["1T", "2T", "3T", "4T"]
iva_compensation_carried_in = "0.00"
