# Values. Amounts are euro strings with two decimals. `derivation` names the
# ledger rows (by ref) and the arithmetic; rounding is half-up to cents.

[[values]]
modelo = "303"
period = "1T"
year = "horizon"
casillas = { "07" = "1000.00", "09" = "210.00", "27" = "210.00", "28" = "500.00", "29" = "105.00", "45" = "105.00", "64" = "105.00", "66" = "105.00", "71" = "105.00" }
roles = { "iva-resultado-regimen-general" = "105.00" }
derivation = """
07 = ALT-VTA-01 1000.00 (servicio de limpieza a una empresa, tipo general); 09 = 21 % of 07 = 210.00. 27 = 09.
28 = ALT-MAT-01 500.00 (material de oficina afecto, factura recibida); 29 = 21 % of 28 = 105.00. 45 = 29.
Resultado del régimen general = 27 - 45 = 105.00; 64 = 66 (100 % atribuible al Estado) = 71: first period of a new activity, so no cuotas a compensar from earlier periods exist.
role iva-resultado-regimen-general is the DR303 box [46] "Resultado régimen general (27 - 45)" printed by the aeat-dr-303 design of every supported edition; the registry resolves it to that casilla in each edition.
"""
legal_ref = ["ley-37-1992:art-90", "ley-37-1992:art-92"]
grounding = "verified"

[[values]]
modelo = "130"
period = "1T"
year = "horizon"
casillas = { "01" = "1000.00", "02" = "525.00", "03" = "475.00", "04" = "95.00", "05" = "0.00", "06" = "0.00", "07" = "95.00" }
parameters = { provision_rate = "0.05", provision_cap = "2000.00", pago_rate = "0.20" }
derivation = """
Cumulative from 1 January, imputed by cobros y pagos: ALT-VTA-01 is collected and ALT-MAT-01 paid inside the quarter.
01 = ALT-VTA-01 base 1000.00 (IVA repercutido excluded). Gastos = ALT-MAT-01 base 500.00 (IVA soportado deducible excluded).
Provisión gastos de difícil justificación = 5 % of (1000.00 - 500.00) = 25.00, under the 2000.00 cap. 02 = 500.00 + 25.00 = 525.00.
03 = 01 - 02 = 475.00; 04 = 20 % of 03 = 95.00; 05 = 0 (first quarter); 06 = 0 (no withheld income); 07 = 04 - 05 - 06.
The art. 110.3.c minoración (casilla 13) depends on the prior-year return and is not asserted.
"""
legal_ref = ["rd-439-2007:art-7", "rd-439-2007:art-30", "rd-439-2007:art-110"]
grounding = "verified"

[[values]]
modelo = "130"
period = "1T"
year = "horizon"
governed_by = "ley-35-2006:da-56"
casillas = { "01" = "1000.00", "02" = "535.00", "03" = "465.00", "04" = "93.00", "05" = "0.00", "06" = "0.00", "07" = "93.00" }
parameters = { provision_rate = "0.07", provision_cap = "2000.00", pago_rate = "0.20" }
derivation = """
The same income and gastos as the value above; only the provision differs. LIRPF disposición adicional
quincuagésima sexta (Ley 31/2022, art. 60.2) raises the RIRPF art. 30.2.4.ª percentage to 7 % "durante el
período impositivo 2023", so in a year that provision governs: provisión = 7 % of (1000.00 - 500.00) = 35.00, under the 2000.00 cap.
02 = 500.00 + 35.00 = 535.00; 03 = 465.00; 04 = 20 % of 03 = 93.00; 05 = 0 (first quarter); 06 = 0.00; 07 = 04 - 05 - 06 = 93.00.
"""
legal_ref = ["rd-439-2007:art-7", "rd-439-2007:art-30", "ley-35-2006:da-56", "rd-439-2007:art-110"]
grounding = "verified"
