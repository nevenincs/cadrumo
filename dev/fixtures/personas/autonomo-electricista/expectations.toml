concepts = { resultado_regimen_general = "1377.60" }
derivation = """
07 = ELE-VTA-01 6200.00 + ELE-VTA-02 3400.00 = 9600.00; 09 = 21 % of 07 = 2016.00; 27 = 09 (no other rate).
28 = ELE-MAT-1 2800.00 + ELE-GES-1 240.00 = 3040.00; 29 = 588.00 + 50.40 = 638.40; 45 = 29.
Resultado del régimen general = 27 - 45 = 1377.60; 64 = 66 (100 % atribuible al Estado) = 71 (sin cuotas a compensar ni resultado de declaraciones anteriores).
The RETA rows are no IVA operation and enter neither 28 nor 29.
"""
legal_ref = ["ley-37-1992:art-90", "ley-37-1992:art-92", "ley-37-1992:art-164"]
grounding = "verified"

