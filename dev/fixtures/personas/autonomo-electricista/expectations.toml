# Modelo 130 under estimación directa normal: casilla 02 is the deductible
# expenses alone. The 5 % provision for gastos de difícil justificación is a
# rule of the simplified modality only (RIRPF art. 30.2.ª) and is absent here.

[[values]]
modelo = "130"
period = "1T"
year = "horizon-1"
casillas = { "01" = "9600.00", "02" = "4000.00", "03" = "5600.00", "04" = "1120.00", "05" = "0.00", "06" = "0.00", "07" = "1120.00" }
parameters = { pago_rate = "0.20" }
derivation = """
Cumulative from 1 January. 01 = issued bases ELE-VTA-01 6200.00 + ELE-VTA-02 3400.00 = 9600.00.
02 = material 2800.00 + contabilidad 240.00 + RETA 3 x 320.00 = 4000.00 (IVA soportado deducible excluded; no provision).
03 = 01 - 02 = 5600.00; 04 = 20 % of 03 = 1120.00; 05 = 0 (first quarter); 06 = 0 (no withheld income); 07 = 04 - 05 - 06.
The art. 110.3.c minoración (casilla 13) depends on the prior-year return and is not asserted.
"""
legal_ref = ["ley-35-2006:art-28", "rd-439-2007:art-30", "rd-439-2007:art-110"]
grounding = "verified"

