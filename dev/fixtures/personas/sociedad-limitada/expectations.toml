Cuota íntegra, LIS art. 29.1 as worded before Ley 31/2022 (periodos before 2023): tipo general 25 %, there being no reduced rate for an
INCN below 1 millón de euros (Ley 31/2022 art. 39 introduced it from 2023); 9100.00 x 25 % = 2275.00. This plain value holds in a year
neither the 2023 redaction nor DT 44 governs.
Base imponible previa 00550 = 25400.00: the resultado contable the company enters (persona.toml [[work_inputs]], 00501), with no ajuste
(no amortización, no retribución de administradores, no periodificación, as that source states). The company compensates its whole pending
base imponible negativa, 16300.00 (casilla 00671 of the prior return, persona.toml [[attested_prior_values]]), within LIS art. 26.1
(70 % x 25400.00 = 17780.00, and in any case 1000000.00); 00547 is its elective work input and is not asserted back. No reserva de
capitalización (01032, LIS art. 25) or de nivelación (LIS art. 105) is applied: the persona dota neither. So
00552 = 00550 - 01032 - 00547 = 25400.00 - 0 - 16300.00 = 9100.00 (manual Sociedades 2024 source.pdf.extracted.md:14021; 2025 :14097),
and the base after the reserva de nivelación 01330 = 00552 = 9100.00 (manual 2024 :14609), on which 00562 = 01330 x 00558 / 100
(manual 2024 :14654; 2025 :14952).
Pagos fraccionados 00601/00603/00605 are 0.00: under art. 40.2 each is 18 % of a prior cuota of 0.00, and art. 40.3 was never elected
(persona.toml [[attested_prior_values]]). No deducciones or bonificaciones, so cuota líquida 00592 = cuota íntegra. No retenciones or
ingresos a cuenta (01766, 01784) and the State levies 100 % (00625), so 00599 = (00625 / 100) x (00592 - 01766 - 01784) = 00592
(manual 2024 :20345; 2025 :20653). 00611 is "Cuota diferencial (Estado)" in both designs, the State share before retenciones are
netted elsewhere: 00611 = 00599 - (00601 + 00603 + 00605) = cuota íntegra (manual 2024 :20582; 2025 :20895).
