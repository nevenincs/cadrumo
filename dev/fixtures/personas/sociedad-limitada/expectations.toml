rest (manual práctico de Sociedades 2025 source.pdf.extracted.md:14980-14983). The whole base 9100.00 lies in the first band:
9100.00 x 21 % = 1911.00. The manual's own worked example applies the same scale (2025 :14492 and :14532-14534: base 142410,
"Tipo impositivo 21% (BI hasta 50.000) 22% (Resto BI)", cuota íntegra 30830 = 50000 x 21 % + 92410 x 22 %).
00558 is a double rate in the 2025 design, encoded "2122" (2025 design :1530-1534, Nota 1: "En caso de tipo de gravamen doble se
