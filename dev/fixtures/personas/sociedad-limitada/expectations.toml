(:1480; :1479), 00558 "Tipo de gravamen" (:1496; :1495), 00562 "Cuota íntegra" (:1509; :1508), 00592 "Cuota líquida" (:1557; :1561),
00599 "Cuota del ejercicio a ingresar o a devolver - Estado" (:1577; :1581), 00601/00603/00605 pagos fraccionados - Estado
(:1579-1583; :1583-1587), 00611 "Cuota diferencial - Estado" (:1585; :1589), 00625 "Admón.del Estado" (:4445; :4560).
