format = 1

[persona]
id = "sociedad-limitada"
title = "Sociedad limitada de desarrollo web"
summary = """
Talleres Digitales Olmo, S.L., con domicilio en Valladolid, desarrolla y mantiene
plataformas web para un cliente hostelero y alquila equipos y licencias a un
proveedor. Su administradora no cobra retribución. Presenta IVA trimestral y el
resumen anual, la declaración de operaciones con terceros y el Impuesto sobre
Sociedades.
"""
taxpayer = "sociedad.titular"
fiscal_year = "horizon-1"
modelos = ["303", "390", "347", "200", "202"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "legal_entity"
"fiscal-residency" = "resident_irpf"
"legal-entity-form" = "sl"
"tax-id" = { identity = "sociedad.titular" }
"legal-name" = { identity = "sociedad.titular", field = "legal_name" }
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "castilla_y_leon"
"address-postcode" = "47002"
"activity-start-date" = { year = "horizon-6", month = 1, day = 15 }
"incn-prior-12-months" = "28500.00"
"new-entity-first-two-profit-periods" = false
"iva-regime" = "GENERAL"
"iva-m303-regime-composition" = "general"
"iva-roi-enrolled" = false
"iva-oss-enrolled" = false
"iva-group-member-enrolled" = false
"iva-group-dominant-entity-enrolled" = false
"iva-sii-enrolled" = false
"iva-redeme-enrolled" = false
"iva-cash-accounting-regime-enrolled" = false
"iva-voluntary-sii-enrolled" = false
"iva-hydrocarbon-deposit-advance-payment-deduction-entitled" = false
"iva-intracommunity-operations-exceed-50000-eur" = false
"enrollment-large-company" = false
"has-employees" = false
"pays-professionals-with-retencion" = false
"pays-rent-with-retencion" = false
"pays-capital-income-with-retencion" = false
"does-intracomunitario" = false
"third-party-transactions-above-347-threshold" = true

# Domiciled in Valladolid with a turnover far below 12 million euros, the
# company falls under neither the Concierto Económico (Ley 12/2002 art. 15) nor
# the Convenio Económico (Ley 28/1990 art. 19): the State levies its whole
# Impuesto sobre Sociedades.
[fields]
"taxpayer_type.tributacion_estado_porcentaje" = "100"

[[activities]]
description = "Desarrollo y mantenimiento de aplicaciones y plataformas web"
iae_epigraph = "845"

[[officers]]
identity = "sociedad.administrador"
role = "administrador_unico"
remunerated = false

# The company's earlier Modelo 200 returns, which the application does not hold (synthetic history).
# It began on horizon-6-01-15 and lost money while it built its first platforms: bases imponibles
# negativas of 34000.00 (horizon-6), 20000.00 (horizon-5) and 6000.00 (horizon-4), 60000.00 in all.
# It then compensated every pending base it could (LIS art. 26.1: up to 70 % of the base previa, and
# in any case up to 1000000.00, which covers all of it): horizon-3 base previa 20600.00, compensated in
# full; horizon-2 base previa 23100.00 (its INCN of 28500.00, the profile's incn-prior-12-months, less
# the same 5400.00 of equipment and licence rent it pays every year), compensated in full. Both returns
# therefore had a base imponible and a cuota íntegra of 0.00, and 16300.00 stayed pending at the close of
# horizon-2 (casilla 00671). It never recorded a deterioro de créditos (its one client has paid every
# invoice), and it had no deducciones, bonificaciones, retenciones or ingresos a cuenta in any year.
[[attested_prior_values]]
modelo = "200"
period = "0A"
year = "horizon-1"
binding = "modelo-200-bin-pendiente-ejercicios-anteriores"
value = "16300.00"
sources = [{ modelo = "200", year = "horizon-2", period = "0A" }]
derivation = "Casilla 00671 (bases imponibles negativas pendientes de aplicación en períodos futuros) de su Modelo 200 del ejercicio anterior. Pérdidas de los tres primeros ejercicios 34000.00 + 20000.00 + 6000.00 = 60000.00; compensadas 20600.00 en horizon-3 y 23100.00 en horizon-2, toda la base previa de cada año, dentro del límite de 1000000.00 del art. 26.1 LIS; quedan 60000.00 - 20600.00 - 23100.00 = 16300.00."
legal_ref = ["ley-27-2014:art-26"]

[[attested_prior_values]]
modelo = "200"
period = "0A"
year = "horizon-1"
binding = "modelo-200-dotaciones-deterioro-creditos-saldo-no-cumplido-anteriores"
value = "0.00"
sources = [{ modelo = "200", year = "horizon-2", period = "0A" }]
derivation = "Casilla 01498 del Modelo 200 del ejercicio anterior: la sociedad nunca dotó un deterioro de créditos, porque su único cliente ha pagado todas sus facturas; no queda saldo pendiente que no cumpla las condiciones del art. 13.1 LIS."
legal_ref = ["ley-27-2014:art-13"]

[[attested_prior_values]]
modelo = "200"
period = "0A"
year = "horizon-1"
binding = "modelo-200-dotaciones-deterioro-creditos-saldo-cumplido-anteriores"
value = "0.00"
sources = [{ modelo = "200", year = "horizon-2", period = "0A" }]
derivation = "Casilla 01499 del Modelo 200 del ejercicio anterior: sin dotación por deterioro de créditos en ningún ejercicio, no queda saldo pendiente que cumpla las condiciones del art. 13.1 LIS."
legal_ref = ["ley-27-2014:art-13"]

# Each art. 40.2 instalment (casilla 03 of the 202) is 18 % of the cuota íntegra, less deducciones,
# bonificaciones, retenciones e ingresos a cuenta, of the last return whose deadline had passed on the
# first day of the payment month: horizon-3 for April, horizon-2 for October and December. Both were 0.00,
# so no instalment was due and, the INCN being below 6000000.00, no 202 was to be filed. The application
# records one figure for the binding, standing for the three instalments.
[[attested_prior_values]]
modelo = "200"
period = "0A"
year = "horizon-1"
binding = "modelo-200-pagos-fraccionados-anuales-40-2"
value = "0.00"
sources = [
  { modelo = "202", year = "horizon-1", period = "1P" },
  { modelo = "202", year = "horizon-1", period = "2P" },
  { modelo = "202", year = "horizon-1", period = "3P" },
]
derivation = "Pagos fraccionados del art. 40.2 LIS: abril, 18 % de la cuota del Modelo 200 de horizon-3 (último con plazo vencido el 1 de abril); octubre y diciembre, 18 % de la cuota del Modelo 200 de horizon-2 (vencido el 25 de julio). Ambas cuotas fueron 0.00 por compensar toda su base con bases imponibles negativas: 0.00 + 0.00 + 0.00 = 0.00; no hubo ingreso ni obligación de presentar el 202."
legal_ref = ["ley-27-2014:art-40"]

# The art. 40.3 modality (casilla 34 of the 202) was never elected in a censal declaration, and an INCN
# below 6000000.00 does not impose it, so it yields nothing in any period.
[[attested_prior_values]]
modelo = "200"
period = "0A"
year = "horizon-1"
binding = "modelo-200-pagos-fraccionados-anuales"
value = "0.00"
sources = [
  { modelo = "202", year = "horizon-1", period = "1P" },
  { modelo = "202", year = "horizon-1", period = "2P" },
  { modelo = "202", year = "horizon-1", period = "3P" },
]
derivation = "Modalidad de base imponible del art. 40.3 LIS: la sociedad nunca la eligió en declaración censal y su INCN no supera 6000000.00, así que no aplica; ningún pago por esta modalidad en abril, octubre ni diciembre: 0.00."
legal_ref = ["ley-27-2014:art-40-3"]

# At the clock every quarterly IVA return of the fiscal year is past its window,
# so the company has filed each one. Every quarter was to pay, so no compensation was
# pending before the first quarter.
[[filed_returns]]
modelo = "303"
year = "horizon-1"
periods = ["1T", "2T", "3T", "4T"]
iva_compensation_carried_in = "0.00"

# The Modelo 200 starts from the accounting result before the Impuesto sobre
# Sociedades, casilla 00501 of page DP200012 (Manual práctico de Sociedades 2023,
# corpus manuals/sociedades/2023 source.pdf.extracted.md:91-92: "Resultado de la
# cuenta de pérdidas y ganancias antes del Impuesto sobre Sociedades (casilla
# 00501)"). No record the application holds produces it, so the company enters it
# as the closed accounts give it. No closing entry is authored here: each one the
# accounts could carry is stated below as absent, with the persona fact behind it.
[[work_inputs]]
modelo = "200"
year = "horizon-1"
period = "0A"
roles = { "is-liquidacion-i-importe" = "25400.00", "is-liquidacion-iii-compensacion-bin-aplicada" = "16300.00" }
reason = "El resultado contable antes del Impuesto sobre Sociedades sale de las cuentas cerradas del ejercicio, que ningún registro de la aplicación produce; la sociedad lo consigna en la casilla 00501."
[work_inputs.sources]
"is-liquidacion-i-importe" = """
Cuenta de pérdidas y ganancias del ejercicio con las filas del extracto (ledger.csv, base imponible sin IVA, \
deducible en su totalidad). Ingresos: SOC-VTA-1 5200.00 + SOC-VTA-2 1800.00 + SOC-VTA-3 6400.00 + \
SOC-VTA-4 1800.00 + SOC-VTA-5 4700.00 + SOC-VTA-6 1800.00 + SOC-VTA-7 7300.00 + SOC-VTA-8 1800.00 = 30800.00. \
Gastos: SOC-ALQ-1 1350.00 + SOC-ALQ-2 1350.00 + SOC-ALQ-3 1350.00 + SOC-ALQ-4 1350.00 = 5400.00. \
No hay otra fila de pérdidas y ganancias en el extracto. Resultado: 30800.00 - 5400.00 = 25400.00. \
Asientos de cierre: amortización ausente, la sociedad no posee inmovilizado y alquila los equipos y licencias \
(persona.toml línea 8; filas SOC-ALQ-1..4); retribución de administradores ausente, la administradora única no \
cobra retribución (persona.toml línea 9 y [[officers]] remunerated = false, línea 67); periodificaciones \
ausentes, todas las filas se devengan dentro del ejercicio: cada alquiler trimestral pagado el 15 de enero, \
abril, julio y octubre (SOC-ALQ-1..4) cubre su propio trimestre, y cada venta (SOC-VTA-1..8, del 30 de enero al \
19 de diciembre) factura un desarrollo o un mantenimiento prestado en el ejercicio."""
"is-liquidacion-iii-compensacion-bin-aplicada" = """
La sociedad compensa todo el saldo pendiente de bases imponibles negativas, 16300.00 (casilla 00671 de su declaración del ejercicio anterior, consignada en [[attested_prior_values]]). La compensación es una opción de la sociedad (LIS art. 26.1, "podrán ser compensadas"). Límite del art. 26.1 LIS: 70 por ciento de la base imponible previa 25400.00 = 17780.00, y en todo caso 1000000.00; 16300.00 cabe en ambos."""
