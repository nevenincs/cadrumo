derivation = """
From the payer's certificate for the ejercicio, as the taxpayer declares it (persona.toml withholding_certificates, ejercicio horizon-1):
importe_integro 21840.00, retencion 2180.00; the certificate states no Seguridad Social contribution, so none is deducted under LIRPF art. 19.2.a.
The ledger holds 14 net pension payments (13 x 1404.29 + 1404.23 = 19660.00).
Pensions are rendimientos del trabajo (LIRPF art. 17.2.a). Íntegro dinerario 21840.00; no irregular income, so no art. 18 reduction.
Rendimiento neto previo = 21840.00 - 0.00 = 21840.00 (LIRPF art. 19.1). Otros gastos 2000.00 (LIRPF art. 19.2.f; no unemployed-job-seeker,
geographic-mobility or disability increase is stated); rendimiento neto = 21840.00 - 2000.00 = 19840.00.
The art. 20 reduction is zero in every supported edition because the rendimiento neto del trabajo it reads (RNT = íntegro less the art. 19.2 expenses
of letters a) to e), here 21840.00) exceeds the top of its band, and 19840.00 after letter f) does as well:
ejercicio 2022, no reduction above 16825.00 (Manual práctico de Renta 2022, parte 1: "13.115 euros o menos 5.565 euros", "Entre 13.115,1 y 16.825 euros");
ejercicio 2023, none above 19747.50 (Manual práctico de Renta 2023, parte 1: "14.047,5 euros o menos 6.498 euros", "Entre 14.047,5 y 19.747,5 euros");
ejercicio 2024 onwards, none above 19747.50 (Manual práctico de Renta 2024, parte 1: "14.852 euros o menos 7.302 euros", "Entre 17.673,52 y 19.747,5 euros";
LIRPF art. 20 as worded by Real Decreto-ley 4/2024 art. 3.1). Neto reducido = 19840.00 - 0.00 = 19840.00.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary;
Manual práctico de Renta): importe_integro_dinerario 0003 (art. 17); rendimiento_neto_previo 0017 (art. 19); gasto_otros 0019 (art. 19.2.f);
rendimiento_neto 0022 (art. 19); reduccion_gastos_generales 0023 (art. 20); rendimiento_neto_reducido 0025 (arts. 18-20).
"""
legal_ref = ["ley-35-2006:art-17", "ley-35-2006:art-18", "ley-35-2006:art-19", "ley-35-2006:art-20"]
grounding = "verified"

