roles = { "irpf_rendimiento_capital_inmobiliario_ingresos_integros" = "11400.00", "irpf_inmueble_gastos_reparacion_conservacion" = "240.00", "irpf_rendimiento_capital_inmobiliario_gasto_intereses_reparacion" = "240.00", "irpf_rendimiento_capital_inmobiliario_gasto_comunidad" = "540.00", "irpf_rendimiento_capital_inmobiliario_gasto_primas_seguro" = "186.00", "irpf_rendimiento_capital_inmobiliario_gasto_tributos" = "412.00", "irpf_rendimiento_capital_inmobiliario_amortizacion_inmueble" = "3240.00", "irpf_rendimiento_capital_inmobiliario_rendimiento_neto" = "6782.00", "irpf_rendimiento_capital_inmobiliario_reduccion_arrendamiento_vivienda" = "3391.00", "irpf_rendimiento_capital_inmobiliario_rendimiento_neto_reducido" = "3391.00", "irpf_rendimiento_capital_inmobiliario_suma_rendimientos_netos_reducidos" = "3391.00" }
derivation = """
Ingresos íntegros (LIRPF art. 22.1; Manual práctico de Renta, cap. 4) = rent ARR-REN-01..12, 12 x 950.00 = 11400.00; the lease runs the whole ejercicio (days_let full_year).
Gastos deducibles (LIRPF art. 23.1.a y b; RIRPF arts. 13 and 14; Manual práctico de Renta, cap. 4, "Normativa: Arts. 23.1 a) 1º Ley IRPF y 13 a) Reglamento IRPF",
"Arts. 23.1 a) 2º a 4º Ley IRPF y 13 b) a g) Reglamento IRPF", "Arts. 23.1 b) Ley IRPF y 13 h) y 14 Reglamento IRPF"):
reparación y conservación ARR-REP-1 240.00, which does not exceed the ingresos 11400.00 (limit of LIRPF art. 23.1.a.1º), so the whole 240.00 is applied (casilla 0107)
and nothing is left pending; tributos (IBI) ARR-IBI-1 412.00 (art. 23.1.a.2º); comunidad de propietarios ARR-COM-1..4, 4 x 135.00 = 540.00
(the Manual places the community quotas among the amounts accrued by third parties for personal services, art. 23.1.a.4º, which the registry prints at the comunidad casilla);
primas de seguro ARR-SEG-1 186.00 (RIRPF art. 13); amortización del inmueble 3 % x 108000.00 = 3240.00 (RIRPF art. 14.1 and 14.2: 3 % of the greater of the acquisition cost
of the construction and the valor catastral of the construction; the base is the persona's rental_properties.piso-arrendado
amortization_base 108000.00 (persona.toml:73), which persona.toml:75 states is the construction share of the acquisition value by inheritance and exceeds the
construction share of the valor catastral, so it is the greater of the two that RIRPF art. 14.2 takes).
Total gastos deducibles = 240.00 + 412.00 + 540.00 + 186.00 + 3240.00 = 4618.00 (no casilla prints the total, so it is not stated as a value).
Absences: the ledger holds no suministros, gasto de servicios personales, formalización, defensa jurídica, saldo de dudoso cobro, financing interest or
earlier pending expense, so each of those casillas is blank by the persona's facts (LIRPF art. 23.1.a lists them as deductible only when incurred).
Rendimiento neto = 11400.00 - 4618.00 = 6782.00 (LIRPF art. 22.2).
Reducción 50 % (LIRPF art. 23.2 as worded by Ley 12/2023, applicable from 1 January 2024 to contracts concluded after 26 May 2023: Manual práctico de Renta 2024 and 2025, parte 1, cap. 4,
"A. Contratos de arrendamiento de vivienda celebrados a partir del 26 de mayo de 2023 - Con carácter general, se fija una reducción del 50 por 100"; none of the 60, 70 or 90 % tiers applies:
no zona de mercado residencial tensionado, no tenant aged 18 to 35, no rehabilitation).
The contract date decides the rate: the persona's lease starts on 1 June of horizon-2 (persona.toml:70, contract_start). This plain value covers the
ejercicios 2024 and 2025, whose horizon-2 is 2023 and 2024, so the lease is concluded on 1 June 2023 or 1 June 2024, after 26 May 2023, and the
Ley 12/2023 wording governs; a contract concluded before 26 May 2023 would keep 60 % in those years. Reducción = 6782.00 x 50 % = 3391.00; neto reducido = 6782.00 - 3391.00 = 3391.00 (LIRPF art. 23.2),
which is also the sum of the netos reducidos of all properties (one property).
Roles are Modelo 100 registry semantic_roles of the Inmueble section, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary):
ingresos_integros 0102; gastos reparación y conservación 0106; intereses y reparación aplicados 0107; comunidad 0109; primas de seguro 0114; tributos 0115; amortización del inmueble 0131;
rendimiento neto 0149; reducción por arrendamiento de vivienda 0150; rendimiento neto reducido 0154; suma de rendimientos netos reducidos 0156.
"""
legal_ref = ["ley-35-2006:art-22", "ley-35-2006:art-23", "rd-439-2007:art-13", "rd-439-2007:art-14"]
grounding = "verified"

