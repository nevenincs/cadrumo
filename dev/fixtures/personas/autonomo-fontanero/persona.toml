format = 1

[persona]
id = "autonomo-fontanero"
title = "Fontanero autónomo en estimación directa simplificada"
summary = """
Javier Montero instala y repara fontanería y calefacción en Madrid. Factura a
empresas al 21 % y repara instalaciones de viviendas de una comunidad de
propietarios al 10 %. Alquila un taller a un particular, que le factura con IVA
y sobre cuyo alquiler practica la retención del 19 %. No tiene empleados ni paga
a profesionales sujetos a retención.
"""
taxpayer = "fontanero.titular"
fiscal_year = "horizon-1"
modelos = ["303", "130", "115", "180", "390", "347", "100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

