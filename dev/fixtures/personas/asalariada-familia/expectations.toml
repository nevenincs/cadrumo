right): 1197.15 + 1457.40 = 2654.55, role irpf_minimo_ascendientes_autonomico, casilla 0516.
"""
legal_ref = ["ley-35-2006:art-56", "ley-35-2006:art-59", "ley-35-2006:art-61", "madrid-dl-1-2010:art-2-2022"]
