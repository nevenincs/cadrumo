grounding = "verified"
reason = "The application does not source the ascendant minimum: casilla 0515 carries no binding and no formula in any Modelo 100 edition, whereas the descendant minimum of casilla 0513 has its profile aggregate binding; the ascendant's annual income that art. 59 tests is also no profile leaf. Casilla 0519 totals the minimums including 0515, so it cannot carry 12050.00 either. An application gap."

[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
casillas = { "0613" = "916.67" }
roles = { "irpf_deduccion_maternidad" = "1200.00" }
derivation = """
Art. 81: the daughter is under three for all twelve months and the mother is in alta all year: 12 x 100.00 = 1200.00.
Guardería increment: up to 83.33 euros (1000.00 / 12) for each month in which the art. 81.1 and 81.2 requirements hold
together, and only the months whose fee is paid for the whole month count (Manual práctico de Renta 2022 lines 62659 and
62678, 2023 lines 71891 and 71907, 2024 lines 58878 and 58899, 2025 lines 54858 and 54874; the worked cases at 2023 line 72029,
2024 line 59021 and 2025 line 54996 count whole months only). The fees are paid in 11 months (August is not paid),
so 1000.00 / 12 x 11 = 916.67, below the 2420.00 spent (11 x 220.00) and the annual cap of 1000.00.
Total 1200.00 + 916.67 = 2116.67.
Until ejercicio 2022 the increment is also limited, for each child, by the cotizaciones devengadas after the birth (2022 manual
lines 62690 to 62700, a) and b)); the daughter's row states 2332.80, which is above 916.67, so 0613 is 916.67 in 2022 too.
Casilla 0613 is asserted as a casilla, so the row checks the product rather than a named concept.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary; Manual práctico de Renta): deduccion_maternidad = irpf_deduccion_maternidad (LIRPF art. 81). The total maternity deduction, 1200.00 + 916.67 = 2116.67, is not stated as a value: no casilla prints the sum, and both of its parts are compared above. incremento_guarderia is carried by the casilla asserted above (0613), so its concept is not repeated.
"""
legal_ref = ["ley-35-2006:art-81"]
grounding = "verified"

# The daughter's birth year: she is born on 21 March of horizon-2, so the deduction runs from the month of birth.
[[values]]
modelo = "100"
period = "0A"
year = "horizon-2"
casillas = { "0613" = "750.00" }
roles = { "irpf_deduccion_maternidad" = "1000.00" }
derivation = """
Art. 81: the deduction is proportional to the months after the requirements are met, the children being determined by their
situation on the last day of each month, so the month of birth counts in full (Manual práctico de Renta 2024 lines 58715 to
58723 and 58747 to 58750; 2025 lines 54684 to 54692 and 54712 to 54715). Born on 21 March, the daughter gives March to December: 10 x 100.00
= 1000.00. The additional 150.00 of the month the mother completes 30 days of cotización (2024 line 58740, 2025 line 54705) does not arise:
she is in alta all year, before the birth.
Guardería increment: the month in which the requirements are met counts, and only months whose fee is paid for the whole
month (2024 lines 58882 to 58899, 2025 lines 54862 to 54874). The fees of January and February precede the birth and do not
count; March to December less August gives 9 months: 1000.00 / 12 x 9 = 750.00, below the 1980.00 spent in those months
and the cap of 1000.00.
Total 1000.00 + 750.00 = 1750.00. Until ejercicio 2022 the deduction and increment were also limited, for each child, by the
cotizaciones devengadas after the birth (2022 manual lines 62690 to 62700); the mother's 194.40 a month from March to
December give 1944.00, above 1750.00, so the limit does not bind in that year either.
Roles are Modelo 100 registry semantic_roles (LIRPF art. 81): irpf_deduccion_maternidad, casilla 0611; the increment is
casilla 0613, asserted as a casilla.
"""
legal_ref = ["ley-35-2006:art-81"]
grounding = "verified"

