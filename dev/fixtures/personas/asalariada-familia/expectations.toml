[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
casillas = { "0596" = "5412.00" }
not_sourced = { "0003" = "36000.00", "0013" = "2332.80" }
roles = { "irpf_rendimiento_trabajo_rendimiento_neto_previo" = "33667.20", "irpf_rendimiento_trabajo_gasto_otros" = "2000.00", "irpf_rendimiento_trabajo_reduccion_gastos_generales" = "0.00", "irpf_rendimiento_trabajo_rendimiento_neto_reducido" = "31667.20" }
derivation = """
From the employer's certificate, as the taxpayer declares it (withholding_certificates): íntegro 36000.00, Seguridad Social 2332.80 (6.48 %), retención 5412.00.
The bank ledger carries the net payroll: 14 payments totalling 36000.00 - 2332.80 - 5412.00 = 28255.20.
Rendimiento neto previo = 36000.00 - 2332.80 = 33667.20; otros gastos art. 19.2.f 2000.00; neto = 31667.20.
The art. 20 reduction is zero because the net exceeds the top of its band.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary; Manual práctico de Renta): rendimiento_neto_previo_trabajo = irpf_rendimiento_trabajo_rendimiento_neto_previo (LIRPF art. 19); otros_gastos_trabajo = irpf_rendimiento_trabajo_gasto_otros (LIRPF art. 19.2.f); reduccion_rendimientos_trabajo = irpf_rendimiento_trabajo_reduccion_gastos_generales (LIRPF art. 20); rendimiento_neto_reducido_trabajo = irpf_rendimiento_trabajo_rendimiento_neto_reducido (LIRPF arts. 18-20).
"""
legal_ref = ["ley-35-2006:art-17", "ley-35-2006:art-19", "ley-35-2006:art-20"]
grounding = "verified"
reason = "The application sources neither figure from the employer's certificate: the recorded withholding feeds casilla 0596, but no binding reads the certificate's íntegro into 0003 (LIRPF art. 17), and nothing records the employee's Seguridad Social contributions or binds them to 0013 (LIRPF art. 19.2.a). An application gap pending a decision on how the certificate's income and contribution quantities are recorded."

[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
roles = { "irpf_minimo_contribuyente_estatal" = "5550.00", "irpf_minimo_descendientes_estatal" = "3950.00", "irpf_minimo_ascendientes_estatal" = "2550.00", "irpf_minimo_personal_familiar_estatal" = "12050.00" }
derivation = """
Contribuyente under 65: 5550.00 (art. 57).
Descendientes (art. 58): first 2400.00 + second 2700.00 + 2800.00 for the second being under three = 7900.00; both parents live with
them, so each applies half: 3950.00.
Ascendiente (art. 59): mother aged 78 at year end, living with the taxpayer all year, annual income 7200.00 (pension, below 8000.00;
not a profile leaf, stated here as a scenario fact), sole descendant with right: 1150.00 + 1400.00 (over 75) = 2550.00.
Total 12050.00. These are the state amounts; the autonomic amounts Madrid may set under art. 56.3 and the cuota are not asserted.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary; Manual práctico de Renta): minimo_contribuyente = irpf_minimo_contribuyente_estatal (LIRPF art. 57); minimo_descendientes = irpf_minimo_descendientes_estatal (LIRPF art. 58); minimo_ascendientes = irpf_minimo_ascendientes_estatal (LIRPF art. 59); minimo_personal_familiar = irpf_minimo_personal_familiar_estatal (LIRPF art. 56).
"""
legal_ref = ["ley-35-2006:art-56", "ley-35-2006:art-57", "ley-35-2006:art-58", "ley-35-2006:art-59", "ley-35-2006:art-61"]
grounding = "verified"

[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
casillas = { "0613" = "916.67" }
roles = { "irpf_deduccion_maternidad" = "1200.00" }
derivation = """
Art. 81: the daughter is under three for all twelve months and the mother is in alta all year: 12 x 100.00 = 1200.00.
Guardería increment: up to 83.33 euros (1000.00 / 12) for each month in which the art. 81.1 and 81.2 requirements hold
together, and only the months whose fee is paid for the whole month count (Manual práctico de Renta 2022 lines 62659 and
62678, 2023 lines 71891 and 71907, 2024 lines 58878 and 58899, 2025 lines 54858 and 54874; the worked cases at 2023 line 72029,
2024 line 59021 and 2025 line 54996 count whole months only). The fees are paid in 11 months (August is not paid),
so 1000.00 / 12 x 11 = 916.67, below the 2420.00 spent (11 x 220.00) and the annual cap of 1000.00.
Total 1200.00 + 916.67 = 2116.67.
Until ejercicio 2022 the increment is also limited, for each child, by the cotizaciones devengadas after the birth (2022 manual
lines 62690 to 62700, a) and b)); the daughter's row states 2332.80, which is above 916.67, so 0613 is 916.67 in 2022 too.
Casilla 0613 is asserted as a casilla, so the row checks the product rather than a named concept.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary; Manual práctico de Renta): deduccion_maternidad = irpf_deduccion_maternidad (LIRPF art. 81). The total maternity deduction, 1200.00 + 916.67 = 2116.67, is not stated as a value: no casilla prints the sum, and both of its parts are compared above. incremento_guarderia is carried by the casilla asserted above (0613), so its concept is not repeated.
"""
legal_ref = ["ley-35-2006:art-81"]
grounding = "verified"

# The Madrid scale and mínimos and the Madrid deductions this return takes are identical in the 2023, 2024
# and 2025 editions (Ley 13/2023, with effect 1 January 2023), and the state side is the same in every year
# from the floor. The 2022 return differs: Ley 8/2022 set a lower Madrid scale and mínimos and the art. 7 bis
# deduction did not exist, giving -2525.66. It is not stated here because the legal register holds no
# provision limited to that wording to govern it.
[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
roles = { "resultado-ingresar-o-devolver-irpf" = "-3095.05" }
parameters = { madrid_minimo_contribuyente = "5956.65", madrid_minimo_descendiente_primero = "2575.85", madrid_minimo_descendiente_segundo = "2897.83", madrid_minimo_descendiente_menor_tres = "3005.16", madrid_minimo_ascendiente = "1234.26", madrid_minimo_ascendiente_mayor_75 = "1502.58", madrid_deduccion_cuidado_ascendientes = "515.50", madrid_limite_base_nacimiento_individual = "30930.00" }
derivation = """
Base liquidable general = 31667.20 (the work-income value above; no other income, no reduction of the base).
Cuota íntegra estatal (art. 63, scale unchanged since 2021): 2112.75 + (31667.20 - 20200.00) x 15 % = 3832.83, less the
scale on the state mínimo 12050.00 (value above) at 9.5 % = 1144.75: 2688.08.
Madrid mínimo (DL 1/2010 arts. 2 to 2 quater; Manual práctico de Renta 2023 lines 42678 to 42695, 2024 lines 47061 to 47078,
2025 lines 42898 to 42915): 5956.65 + (2575.85 + 2897.83 + 3005.16) / 2 + (1234.26 + 1502.58) = 12932.91.
Cuota íntegra autonómica (art. 74; Madrid scale, DL 1/2010 art. 1, 2023 manual lines 44081 to 44089, 2024 lines 48473 to 48481,
2025 lines 44324 to 44330): 1739.53 + (31667.20 - 19004.63) x 12.80 % = 3360.34, less 12932.91 x 8.50 % = 1099.30: 2261.04.
Madrid deductions (art. 77): por cuidado de ascendientes, DL 1/2010 art. 7 bis, 515.50 for the mother, over 65 and giving the
mínimo por ascendientes to the taxpayer alone, with no base limit (2023 manual lines 64096 to 64104, 2024 parte 2 page 370,
2025 parte 2 lines 15955 to 15964). Por nacimiento (arts. 4 and 18.1) is barred: the base imponible 31667.20 exceeds
30930.00 (2023 line 63963, 2024 parte 2 page 367, 2025 parte 2 line 15801); para familias con dos o más descendientes
(art. 14) likewise, above 24744.00 (2025 parte 2 line 16980). Por gastos educativos (art. 11) is not taken: for the primer
ciclo de Educación Infantil its base excludes fees paid as public or administration-authorised prices and its limit counts
the spouse's base (2025 parte 2 lines 16486 and 16510); the persona states neither fact.
Cuota líquida = 2688.08 + 2261.04 - 515.50 = 4433.62. Cuota diferencial (art. 79) = 4433.62 - 5412.00 = -978.38.
Deducción por maternidad (art. 81, value above) 1200.00 + 916.67 = 2116.67 reduces it: -3095.05, a devolver. No advance
payment of the maternity deduction, spouse compensation or refund waiver is stated, so casilla 0700 equals 0670.
Role: continuidad_id resultado-ingresar-o-devolver-irpf, casilla 0700 RESINGDEV of the 2024 edition (LIRPF art. 97).
"""
legal_ref = ["ley-35-2006:art-56", "ley-35-2006:art-63", "ley-35-2006:art-74", "ley-35-2006:art-77", "ley-35-2006:art-79", "ley-35-2006:art-81", "ley-35-2006:art-97", "madrid-dl-1-2010:art-2", "madrid-dl-1-2010:art-18"]
grounding = "verified"

