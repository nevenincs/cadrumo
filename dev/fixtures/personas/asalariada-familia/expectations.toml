# Madrid sets its own art. 59 amounts, and DL 1/2010 arts. 2 to 2 quater have two redactions in the envelope: Ley 8/2022
# for ejercicio 2022 and Ley 13/2023 from ejercicio 2023. A provision-limited value replaces every plain value of the same
# return in the years it governs, so each redaction states the whole return's values. The deducción por cuidado de
# ascendientes, which the manuals carry from ejercicio 2023, is stated with the later redaction.

[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
governed_by = "madrid-dl-1-2010:art-2-2022"
casillas = { "0596" = "5412.00" }
not_sourced = { "0003" = "36000.00", "0013" = "2332.80" }
concepts = { rendimiento_neto_previo_trabajo = "33667.20", otros_gastos_trabajo = "2000.00", reduccion_rendimientos_trabajo = "0.00", rendimiento_neto_reducido_trabajo = "31667.20" }
derivation = """
From the employer's certificate, as the taxpayer declares it (withholding_certificates): íntegro 36000.00, Seguridad Social 2332.80 (6.48 %), retención 5412.00.
The bank ledger carries the net payroll: 14 payments totalling 36000.00 - 2332.80 - 5412.00 = 28255.20.
Rendimiento neto previo = 36000.00 - 2332.80 = 33667.20; otros gastos art. 19.2.f 2000.00; neto = 31667.20.
The art. 20 reduction is zero because the net exceeds the top of its band.
"""
legal_ref = ["ley-35-2006:art-17", "ley-35-2006:art-19", "ley-35-2006:art-20", "madrid-dl-1-2010:art-2-2022"]
grounding = "verified"
reason = "The application sources neither figure from the employer's certificate: the recorded withholding feeds casilla 0596, but no binding reads the certificate's íntegro into 0003 (LIRPF art. 17), and nothing records the employee's Seguridad Social contributions or binds them to 0013 (LIRPF art. 19.2.a). An application gap pending a decision on how the certificate's income and contribution quantities are recorded."

[[values]]
modelo = "100"
period = "0A"
year = "horizon-1"
governed_by = "madrid-dl-1-2010:art-2-2022"
roles = { "irpf_minimo_contribuyente_estatal" = "5550.00", "irpf_minimo_descendientes_estatal" = "3950.00", "irpf_minimo_ascendientes_estatal" = "2550.00", "irpf_minimo_personal_familiar_estatal" = "12050.00" }
derivation = """
Contribuyente under 65: 5550.00 (art. 57), role irpf_minimo_contribuyente_estatal, casilla 0511.
Descendientes (art. 58): first 2400.00 + second 2700.00 + 2800.00 for the second being under three = 7900.00; both parents live with
them, so each applies half: 3950.00, role irpf_minimo_descendientes_estatal, casilla 0513.
Ascendiente (art. 59): mother aged 78 at year end, living with the taxpayer all year, annual income 7200.00 (pension, below 8000.00;
stated on the row as household.ascendants.rentas_anuales), no return of her own (art. 61 norma 2ª), sole descendant with right:
1150.00 + 1400.00 (over 75) = 2550.00, role irpf_minimo_ascendientes_estatal, casilla 0515.
Total 12050.00, role irpf_minimo_personal_familiar_estatal, casilla 0519. These are the state amounts; the autonomic amounts Madrid may set under art. 56.3 and the cuota are not asserted.
"""
legal_ref = ["ley-35-2006:art-56", "ley-35-2006:art-57", "ley-35-2006:art-58", "ley-35-2006:art-59", "ley-35-2006:art-61", "madrid-dl-1-2010:art-2-2022"]
grounding = "verified"

