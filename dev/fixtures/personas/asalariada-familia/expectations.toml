roles = { "irpf_rendimiento_trabajo_reduccion_gastos_generales" = "0.00" }
derivation = """
From the employer's certificate, as the taxpayer declares it (withholding_certificates): íntegro 36000.00, Seguridad Social 2332.80 (6.48 %), retención 5412.00.
The bank ledger carries the net payroll: 14 payments totalling 36000.00 - 2332.80 - 5412.00 = 28255.20.
Rendimiento neto previo = 36000.00 - 2332.80 = 33667.20; otros gastos art. 19.2.f 2000.00; neto = 31667.20.
The art. 20 reduction is zero because the net exceeds the top of its band.
Roles are Modelo 100 registry semantic_roles, resolved to each edition's casilla (AEAT diseño de registro Modelo 100, casilla dictionary; Manual práctico de Renta): rendimiento_neto_previo_trabajo = irpf_rendimiento_trabajo_rendimiento_neto_previo (LIRPF art. 19); otros_gastos_trabajo = irpf_rendimiento_trabajo_gasto_otros (LIRPF art. 19.2.f); reduccion_rendimientos_trabajo = irpf_rendimiento_trabajo_reduccion_gastos_generales (LIRPF art. 20); rendimiento_neto_reducido_trabajo = irpf_rendimiento_trabajo_rendimiento_neto_reducido (LIRPF arts. 18-20).
"""
legal_ref = ["ley-35-2006:art-17", "ley-35-2006:art-19", "ley-35-2006:art-20", "madrid-dl-1-2010:art-2-2022"]
grounding = "verified"
reason = "The application sources neither figure from the employer's certificate: the recorded withholding feeds casilla 0596, but no binding reads the certificate's íntegro into 0003 (LIRPF art. 17), and nothing records the employee's Seguridad Social contributions or binds them to 0013 (LIRPF art. 19.2.a). An application gap pending a decision on how the certificate's income and contribution quantities are recorded. The suffered-withholding binding family admits no income casilla for any class (RETENCION_SOPORTADA_NON_CREDIT_ROLES is empty in src/cadrumo/domain/calculations/registry/retencion_soportada_bindings.py), and casilla 0003 carries no binding in any Modelo 100 edition, although the record stores the certificate's importe_integro_dinerario. Casillas 0017, 0019 and 0025 follow from 0003 and 0013 through the registry formulas, so they cannot carry the law's figures either. The art. 20 reduction (role irpf_rendimiento_trabajo_reduccion_gastos_generales) stays compared: the law gives 0.00 here, and with no work income the calculation also gives 0.00."

