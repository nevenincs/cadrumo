derivation = """
Contribuyente under 65: 5550.00 (art. 57).
Descendientes (art. 58): first 2400.00 + second 2700.00 + 2800.00 for the second being under three = 7900.00; both parents live with
them, so each applies half: 3950.00.
Ascendiente (art. 59): mother aged 78 at year end, living with the taxpayer all year, annual income 7200.00 (pension, below 8000.00;
not a profile leaf, stated here as a scenario fact), sole descendant with right: 1150.00 + 1400.00 (over 75) = 2550.00.
Total 12050.00. These are the state amounts; the autonomic amounts Madrid may set under art. 56.3 and the cuota are not asserted.
"""
legal_ref = ["ley-35-2006:art-56", "ley-35-2006:art-57", "ley-35-2006:art-58", "ley-35-2006:art-59", "ley-35-2006:art-61"]
grounding = "verified"

