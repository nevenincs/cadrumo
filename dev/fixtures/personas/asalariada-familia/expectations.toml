# for ejercicio 2022 and Ley 13/2023 from ejercicio 2023. A provision-limited value replaces every plain value of the same
# return in the years it governs, so each redaction states the whole return's values. The deducción por cuidado de
# ascendientes, which the manuals carry from ejercicio 2023, is stated with the later redaction.

