derivation = """
Deducción autonómica de la Comunidad de Madrid por cuidado de ascendientes (DL 1/2010 art. 7 bis; LIRPF art. 77):
515,50 euros por cada ascendiente mayor de 65 años o con discapacidad igual o superior al 33 por 100 por el que pueda
aplicarse el mínimo por ascendientes, prorrateado por partes iguales entre los contribuyentes con derecho que tributen
individualmente (Manual práctico de Renta 2023, parte 1, lines 64096 to 64104; 2024, parte 2, page 370; 2025, parte 2,
lines 15955 to 15964). The 2022 manual's Madrid deducciones do not include it, so it is stated from ejercicio 2023, the
years this value's provision governs. The mother is 78 and the taxpayer applies the mínimo por ascendientes for her alone
(casilla 0515), so 1 x 515.50 = 515.50, role irpf_deduccion_madrid_cuidado_ascendientes, casilla 1115. The article sets no
income limit.
"""
legal_ref = ["ley-35-2006:art-59", "ley-35-2006:art-61", "ley-35-2006:art-77", "madrid-dl-1-2010:art-7-bis", "madrid-dl-1-2010:art-2-2023"]
