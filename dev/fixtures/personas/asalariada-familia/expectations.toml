# and 2025 editions (Ley 13/2023, with effect 1 January 2023), and the state side is the same in every year
# from the floor. The 2022 return differs: Ley 8/2022 set a lower Madrid scale and mínimos and the art. 7 bis
# deduction did not exist, giving -2525.66. It is not stated here because the legal register holds no
# provision limited to that wording to govern it.
[[values]]
modelo = "100"
period = "0A"
