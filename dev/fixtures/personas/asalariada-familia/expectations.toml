derivation = """
Art. 81: the deduction is proportional to the months after the requirements are met, the children being determined by their
situation on the last day of each month, so the month of birth counts in full (Manual práctico de Renta 2024 lines 58715 to
58723 and 58747 to 58750; 2025 lines 54684 to 54692 and 54712 to 54715). Born on 21 March, the daughter gives March to December: 10 x 100.00
= 1000.00. The additional 150.00 of the month the mother completes 30 days of cotización (2024 line 58740, 2025 line 54705) does not arise:
she is in alta all year, before the birth.
Guardería increment: the month in which the requirements are met counts, and only months whose fee is paid for the whole
month (2024 lines 58882 to 58899, 2025 lines 54862 to 54874). The fees of January and February precede the birth and do not
count; March to December less August gives 9 months: 1000.00 / 12 x 9 = 750.00, below the 1980.00 spent in those months
and the cap of 1000.00.
Total 1000.00 + 750.00 = 1750.00. Until ejercicio 2022 the deduction and increment were also limited, for each child, by the
cotizaciones devengadas after the birth (2022 manual lines 62690 to 62700); the mother's 194.40 a month from March to
December give 1944.00, above 1750.00, so the limit does not bind in that year either.
Roles are Modelo 100 registry semantic_roles (LIRPF art. 81): irpf_deduccion_maternidad, casilla 0611; the increment is
casilla 0613, asserted as a casilla.
