format = 1

[persona]
id = "asalariada-familia"
title = "Asalariada casada con dos hijos y su madre a cargo"
summary = """
Lucía Navarro trabaja por cuenta ajena en Madrid todo el año. Está casada y
declara individualmente; su marido declara por su cuenta. Conviven con sus dos
hijos, el menor de ellos de menos de tres años y matriculado en una escuela
infantil, y con la madre de Lucía, pensionista de 78 años con rentas inferiores a
8000 euros. Solo presenta el Modelo 100.
"""
taxpayer = "asalariada.titular"
fiscal_year = "horizon-1"
modelos = ["100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "natural_person"
"tax-id" = { identity = "asalariada.titular" }
"name" = { identity = "asalariada.titular", field = "name" }
"surnames" = { identity = "asalariada.titular", field = "surnames" }
"fiscal-residency" = "resident_irpf"
"enrollment-large-company" = false
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "madrid"
"address-postcode" = "28039"
"irpf-income-categories" = ["trabajo"]
"taxation-type" = "1"
"taxpayer-sex" = "M"
"taxpayer-marital-status" = "2"
"situacion-familiar" = "casado"
"taxpayer-marriage-date" = { year = "horizon-12", month = 9, day = 15 }
"taxpayer-birth-date" = { year = "horizon-39", month = 6, day = 14 }
"spouse-tax-id" = { identity = "asalariada.conyuge" }
"spouse-name" = { identity = "asalariada.conyuge", field = "name" }
"spouse-surnames" = { identity = "asalariada.conyuge", field = "surnames" }
"spouse-birth-date" = { year = "horizon-41", month = 1, day = 30 }
"spouse-sex" = "H"
"spouse-non-resident-irpf" = false
"family-minor-children-in-unit" = true
"family-convive-con-otro-progenitor" = true

[fields]
"identity.email" = "lucia.navarro@example.test"
"contact.fiscal_address" = "Calle de la Ficción 12, 3.º B, 28039 Madrid"
"contact.contact_person_phone" = "910000001"

[[own_accounts]]
label = "Cuenta nómina"
holding = "titular"
iban = "ES5500000000000000000001"
designations = [{ role = "refund", modelo = "100" }]

[[household.descendants]]
identity = "asalariada.hijo"
birth_date = { year = "horizon-9", month = 5, day = 11 }
convivencia = "true"
prorrata_minimo = "true"

[[household.descendants]]
identity = "asalariada.hija"
birth_date = { year = "horizon-2", month = 3, day = 21 }
convivencia = "true"
prorrata_minimo = "true"
meses_madre_trabajo = "01;02;03;04;05;06;07;08;09;10;11;12"
gastos_guarderia_mensuales = "01:220;02:220;03:220;04:220;05:220;06:220;07:220;09:220;10:220;11:220;12:220"
# Until the Ley 31/2022 reform art. 81.2 LIRPF limited each child's guardería increment by the mother's
# cotizaciones devengadas after the birth (Manual práctico de Renta 2022, cap. 18, "Límites de la
# deducción"). The daughter was born the year before, so all of the year follows her birth; the figure is the
# one the employer's certificate below records.
cotizaciones_ss_madre = "2332.80"

[[household.ascendants]]
identity = "asalariada.madre"
birth_date = { year = "horizon-79", month = 1, day = 8 }
convivientes = "1"

# The taxpayer transcribes the payer's certificate: the catalogue holds no
# certificate document, so the figures are recorded as her own declaration.
[[withholding_certificates]]
payer = "asalariada.empleador"
ejercicio = "horizon-1"
income_class = "trabajo"
origin = "operator_declaration"
importe_integro = "36000.00"
retencion = "5412.00"
cotizaciones_seguridad_social = "2332.80"
# Her Social Security contributions are the certificate's deductible expense
# (LIRPF art. 19.2.a); her derivation names no irregular income, so no
# reducción applies (LIRPF art. 18).
gastos_deducibles = "2332.80"
reducciones_aplicables = "0.00"

# Neither derivation names an employer contribution, patrimonio protegido or other
# imputed work income, so she states none of it for the ejercicio.
[[work_income_none_statements]]
ejercicio = "horizon-1"

# The same employer and the same certificate figures for the next ejercicio:
# every fact of this persona is stated relative to the horizon.
[[withholding_certificates]]
payer = "asalariada.empleador"
ejercicio = "horizon-2"
income_class = "trabajo"
origin = "operator_declaration"
importe_integro = "36000.00"
retencion = "5412.00"
cotizaciones_seguridad_social = "2332.80"
# Her Social Security contributions are the certificate's deductible expense
# (LIRPF art. 19.2.a); her derivation names no irregular income, so no
# reducción applies (LIRPF art. 18).
gastos_deducibles = "2332.80"
reducciones_aplicables = "0.00"

# Neither derivation names an employer contribution, patrimonio protegido or other
# imputed work income, so she states none of it for the ejercicio.
[[work_income_none_statements]]
ejercicio = "horizon-2"

# Her own copy of the previous year's Renta: no negative general base was left
# pending to offset, so the four-year carry of casilla 1380 starts from zero,
# and no negative savings balance either (Anexo C.3 boxes 1263, 1266, 1269, 1270, 1276, 1279, 1282 and 1283).
[[local_observations]]
modelo = "100"
year = "horizon-2"
period = "0A"
casillas = { "1263" = "0.00", "1266" = "0.00", "1269" = "0.00", "1270" = "0.00", "1276" = "0.00", "1279" = "0.00", "1282" = "0.00", "1283" = "0.00", "1384" = "0.00", "1387" = "0.00", "1390" = "0.00", "1391" = "0.00" }
reason = "Bases liquidables generales negativas y saldos negativos de la base del ahorro pendientes en la declaración de la renta del ejercicio anterior"

# No negative general base of an earlier ejercicio is pending: this synthetic
# taxpayer has had no year with a negative base. Where the profile holds no
# earlier return, as for the return of the support floor, the Modelo 100 cannot
# read the four pending carries (casillas 1380, 1382, 1385 and 1388) and never
# takes them as zero, so the taxpayer states that none is pending, once for each
# Modelo 100 year whose earlier return the profile does not hold.
[[prior_carries]]
year = "horizon-2"
family = "renta_negative_general_bases_pending"
nothing_pending = true

# No interest, dividends or other capital mobiliario in this year or the four before it, so no negative balance of it is pending.
[[prior_carries]]
year = "horizon-2"
family = "renta_negative_savings_capital_income_pending"
nothing_pending = true

# No sale of shares, funds or other asset in this year or the four before it, so no negative savings balance of gains and losses is pending.
[[prior_carries]]
year = "horizon-2"
family = "renta_negative_savings_gains_losses_pending"
nothing_pending = true

[[prior_carries]]
year = "horizon-1"
family = "renta_negative_general_bases_pending"
nothing_pending = true

# No interest, dividends or other capital mobiliario in this year or the four before it, so no negative balance of it is pending.
[[prior_carries]]
year = "horizon-1"
family = "renta_negative_savings_capital_income_pending"
nothing_pending = true

# No sale of shares, funds or other asset in this year or the four before it, so no negative savings balance of gains and losses is pending.
[[prior_carries]]
year = "horizon-1"
family = "renta_negative_savings_gains_losses_pending"
nothing_pending = true
