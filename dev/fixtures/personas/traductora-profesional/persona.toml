format = 1

[persona]
id = "traductora-profesional"
title = "Traductora profesional con ingresos sujetos a retención"
summary = """
Elena Robles traduce desde Valencia para una editorial y una agencia, que le
retienen el 15 %, y hace traducciones juradas para particulares. Más del 70 %
de sus ingresos profesionales soporta retención, de modo que no presenta pagos
fraccionados. Encarga su asesoría fiscal a un profesional persona física al
que retiene el 15 %, lo que la obliga a los Modelos 111 y 190.
"""
taxpayer = "traductora.titular"
fiscal_year = "horizon-1"
modelos = ["303", "390", "111", "190", "100"]

[clock]
as_of = { year = "horizon", month = 2, day = 16 }

[profile]
"output-language" = "es"
"entity-type" = "natural_person"
"tax-id" = { identity = "traductora.titular" }
"name" = { identity = "traductora.titular", field = "name" }
"surnames" = { identity = "traductora.titular", field = "surnames" }
"fiscal-residency" = "resident_irpf"
"tax-residence-jurisdiction-scope" = "common_regime"
"tax-residence-ccaa" = "comunidad_valenciana"
"address-postcode" = "46005"
"irpf-income-categories" = ["actividad_economica"]
"activity-start-date" = { year = "horizon-6", month = 9, day = 1 }
"iva-regime" = "GENERAL"
"iva-m303-regime-composition" = "general"
"iva-roi-enrolled" = false
"iva-oss-enrolled" = false
"iva-group-member-enrolled" = false
"iva-group-dominant-entity-enrolled" = false
"iva-sii-enrolled" = false
"iva-redeme-enrolled" = false
"iva-cash-accounting-regime-enrolled" = false
"iva-voluntary-sii-enrolled" = false
"iva-hydrocarbon-deposit-advance-payment-deduction-entitled" = false
"iva-intracommunity-operations-exceed-50000-eur" = false
"enrollment-large-company" = false
"taxation-type" = "1"
"taxpayer-sex" = "M"
"taxpayer-marital-status" = "1"
"situacion-familiar" = "soltero"
"taxpayer-birth-date" = { year = "horizon-36", month = 11, day = 2 }
"has-employees" = false
"pays-professionals-with-retencion" = true
"pays-rent-with-retencion" = false
"pays-capital-income-with-retencion" = false
"art109-activity-income-withholding-ge-70pct" = true
"irpf-estimation-regime" = "directa_simplificada"
"irpf-codigo-comercio-accounting" = false
"does-intracomunitario" = false
"third-party-transactions-above-347-threshold" = false

[fields]
"irpf.activity_kind" = "profesional"
# She withholds on her tax adviser's fees, so she files Modelo 111, whose header
# asks whether the withholder is a colegio concertado; a translator is not one.
"withholding.colegio_concertado" = "false"

# The censal tipo de actividad (Modelo 036 casillas 403 and 404, AEAT guide
# "aeat-m036-activity-code-table-2026-03-26"), which Modelo 100 casilla 0166 states:
# IAE sección segunda, grupo 774 "Traductores e Intérpretes": actividad profesional, so A05.
[[activities]]
description = "Traducción e interpretación"
iae_epigraph = "774"
tipo_actividad = "A05"

# She sells her own translation work and holds no mercaderías or materias
# primas, so her activity holds no existencias: the book opens at zero, records
# no movement and closes on its movements at zero. The Modelo 100 rows of the
# stock variation and the purchases of existencias (casillas 0177, 0181 and
# 0182) read it as zero on her statement, never by default.
[[inventory]]
activity = "traduccion-interpretacion"
year = "horizon-1"
valuation_method = "fifo"
opening_stock = "0.00"
closing_stock = "0.00"
statement = "La actividad de traducción e interpretación no mantuvo existencias en ningún momento del ejercicio ni al cierre del anterior."

[[elections]]
question = "irpf-activity-income-imputation-criterion"
value = "devengo"
year = "horizon-1"

# Her own copy of the previous year's Renta: no negative general base was left
# pending to offset, so the four-year carry of casilla 1380 starts from zero.
[[local_observations]]
modelo = "100"
year = "horizon-2"
period = "0A"
casillas = { "1384" = "0.00", "1387" = "0.00", "1390" = "0.00", "1391" = "0.00" }
reason = "Bases liquidables generales negativas pendientes en la declaración de la renta del ejercicio anterior"

# At the clock every quarterly IVA return of the fiscal year is past its window,
# so she has filed each one. Every quarter was to pay, so no compensation was
# pending before the first quarter.
[[filed_returns]]
modelo = "303"
year = "horizon-1"
periods = ["1T", "2T", "3T", "4T"]
iva_compensation_carried_in = "0.00"

# A synthetic titular account (checksum-valid, not a real bank) designated for a
# Modelo 100 refund: AEAT pays a refund by transfer to the account the taxpayer
# states as held in the return (Manual Renta, devolución; art. 132.1 RGAT).
[[own_accounts]]
label = "Cuenta principal"
holding = "titular"
iban = "ES9800000000000000000003"
designations = [{ role = "refund", modelo = "100" }]

# No negative general base of an earlier ejercicio is pending: this synthetic
# taxpayer has had no year with a negative base. Where the profile holds no
# earlier return, as for the return of the support floor, the Modelo 100 cannot
# read the four pending carries (casillas 1380, 1382, 1385 and 1388) and never
# takes them as zero, so the taxpayer states that none is pending.
[[prior_carries]]
year = "horizon-1"
nothing_pending = true
