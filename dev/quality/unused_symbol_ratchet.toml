# Unused-symbol ratchet baseline.
#
# Per module, how many `exact`-confidence unused-symbol findings it carries, and
# the orphaned test modules the tree reports. The gate in
# dev/quality/unused_symbol_ratchet.py fails in BOTH directions: a module
# carrying more than it records (or absent from this file) means new unused code
# entered a reachable module, and a module carrying fewer (or none) means debt
# was paid and this file must shrink to record it.
#
# So the correct response to a failure is never to raise a number. Resolve the
# symbol -- delete it with its test, wire it to the caller that needs it, or
# record its class in dev/audit/reachability_classification.toml -- and lower the
# entry.
#
# Only the `exact` tier is here. `name-match` and `name-match-data` findings are
# members reached by attribute access the scan cannot bind to a type; gating
# those would ratchet guesses rather than facts.
#
# The `cadrumo.entrypoints.tui` prefix is out of scope while its own campaign is
# in flight, exactly as in the module ratchet.
#
# This is a backlog, not an endorsement.

