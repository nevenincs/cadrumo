##
## Adjudication ledger for the repo-wide regulatory-drift census.
##
## The FINDINGS are derived mechanically by ``dev.quality.regulatory_drift_census``
## from the source tree; only the decisions and their prose are authored here. A
## finding the census yields and this ledger does not cover is a reconciliation
## failure, so drift introduced later cannot ship unadjudicated. A row that
## matches no live finding, and a group no row references, are equally failures,
## so a decision cannot outlive the code it was about.
##
## Every decision names ONE FILE. The two dev data directories are the only
## exception, because they are directories by nature. That is what gives the gate
## teeth: a new file carrying regulatory data is unadjudicated the moment it is
## written, where a directory-scoped decision would have swallowed it in silence.
##
## disposition = "enrolled"
##     Regulatory data in the wrong home, with a plan row that moves it. ``row``
##     names that row.
## disposition = "deferred"
##     Regulatory data in the wrong home with no row that moves it yet.
##     ``reference`` names the record carrying the recommendation. A deferral is
##     a decision to leave it, taken in the open, never a way of not deciding.
## disposition = "not_regulatory"
##     Not regulatory data at all. This is the allowlist, and it is where the
##     judgement moves, so a row must name a concrete file AND a concrete
##     enclosing symbol and state its reason.
##
## A shared reasoning is authored once as a [[group]] and referenced by id, so
## one judgement reads as one judgement rather than as two hundred copies of the
## same paragraph. No row is keyed by a line number.
##

[meta]
schema_version = 1

# ── Shared reasonings ───────────────────────────────────────────────────────

[[group]]
id = "python-resident-filing-years"
disposition = "enrolled"
row = "W02.P05.S24"
rationale = """
Python-resident filing-year values: the 2000-to-2099 and 2000-to-2100 validation
bounds repeated across pydantic fields, CLI options and repository filters, and
the concrete transitional years individual surfaces pin. The supported-filing-
years row replaces every Python-resident year set with one registry declaration,
which is exactly this population.
"""

[[group]]
id = "registry-modelo-specific"
disposition = "enrolled"
row = "W01.P03.S22"
rationale = """
Modelo branches and modelo-keyed mappings inside the registry package. The embed
classifier derives the modelo-specific module set from exactly these signals and
forces one classification per module, so each site is already answered there as
regulatory data embed, machinery, or dead. Recorded as enrolled rather than
re-decided, because two ledgers adjudicating one site drift apart.
"""

[[group]]
id = "dev-resident-epoch-data"
disposition = "enrolled"
row = "W01.P09.S32"
rationale = """
Per-epoch mapping TOMLs and render profiles carrying filing wire facts under dev
rather than the registry authoring tree. The collapse row owns the pattern; the
census counts the epoch directories so the row has a denominator.
"""

[[group]]
id = "modelo-conditional-behaviour"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Behaviour outside the registry package conditioned on a concrete modelo member:
which modelo folds into which, which export shape applies, which reconciliation
runs, how an operator surface is shaped. The coverage decision rules that no
modelo may carry its own SCHEMA divergence, and the structural gate it installs
is scoped to generic registry schema types and generic authority construction,
so none of these branches is covered by a row today. They are the same class of
fact -- per-modelo treatment decided in Python rather than declared as registry
data -- and the census recommends a row that separates orchestration routing,
which is legitimate application logic, from regulatory treatment, which is not.
"""

[[group]]
id = "named-regulatory-constants"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Constants whose names carry AEAT tax vocabulary and whose values are numeric.
The population is mixed: some are regulatory values in the wrong home, some are
identifier length bounds and schema versions that read as tax vocabulary only
because their subject is an AEAT artefact. Deferring the group is honest about
nobody having split them yet; allowlisting them would assert a judgement not
made, and the census recommends the row that makes it.
"""

[[group]]
id = "decimal-regulatory-literals"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Decimal literals that are not scale or rounding quanta. Same mixed population and
same recommendation as the named constants: rates and coefficients sit beside day
counts and confidence thresholds, and only reading each one separates them.
"""

[[group]]
id = "production-aeat-text-parsers"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Production regular expressions that parse Spanish AEAT text: the ejercicio and
importe extractors over justificante and borrador documents, the sede declaration
option parser, and the export dictionary line parser. These read external AEAT
output, which the no-legacy rule protects as external-world variability rather
than legacy -- but the facts they derive are registry-shaped, so the census
records them instead of excusing them.
"""

[[group]]
id = "registry-tooling-years"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Filing years pinned in the registry dev tooling: the conformance stamp, the
parity tapes, the auxiliary envelope generators, the field matrix and the embed
classifier. Each generates or verifies a registry artefact for a named year, so
the year is an input to a one-shot tool rather than a value production reads --
but it is still a year outside the declaration, and the collapse row meets them.
"""

# -- File-specific decisions -------------------------------------------------

[[decision]]
path = "src/cadrumo/domain/calculations/registry/_applicability.py"
disposition = "enrolled"
row = "W01.P03.S09"
rationale = """
The obligation rule table: one entry per modelo, each carrying the entity types,
income categories and reason prose that decide whether a taxpayer must file it.
Registry data by every reading of the authority-flow rule, and the migration row
transcribes it into authoring-tree fragments and deletes the literals. The census
yields 27 entries across 27 modelos; the plan's Description says 28, which counts
the ModeloApplicabilityRule class definition that a grep for the constructor also
matches.
"""

[[decision]]
path = "src/cadrumo/domain/calculations/registry/_m303_orden_constants.py"
disposition = "enrolled"
row = "W01.P03.S23"
rationale = """
Orden content encoded as Python literals: the supported ejercicio set, the
seasonal index coefficients 1.25, 1.35 and 1.50, and the Lorca 2022 reduction.
The plan's deletion inventory already names this module's data as a confirmed
regulatory embed, and the embed-migration row moves it into the authoring tree
and deletes it.
"""

[[decision]]
path = "dev/registry/pipeline/_export_tree.py"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
Five regular expressions that read Spanish AEAT design prose and derive filing
wire facts from it: field width and decimal places from a "N enteros y M
decimales" clause, a fixed wire value from a Constante clause, and the trailing
Nota N reference that decides whether a slot is a closed wire fact at all. The
interpretation of official text is regulatory semantics, and it lives here as a
Python grammar rather than as registry data. No row moves it; the census
recommends one and this deferral is the record of that.
"""

[[decision]]
path = "src/cadrumo/core/_modelo.py"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
rationale = """
The out-of-scope and unmodeled obligation tables: Spanish operator-facing prose
explaining, per modelo, why the application does not model that obligation. Two
facts are fused -- the scope decision, which is registry data, and the
explanation, which is a locale string -- and no row separates them. The Modelo
enum is the sanctioned core home for the identifier; the prose beside it is not.
"""

[[decision]]
path = "src/cadrumo/core/_amendment_kind_regime.py"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
