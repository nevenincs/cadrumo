a comment beside it. The citations are the tell: these are dates the law fixes,
held as Python date literals with their grounding in prose rather than in the
registry's typed legal references.
"""

[[decision]]
path = "src/cadrumo/core/_result_disposition.py"
disposition = "deferred"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
