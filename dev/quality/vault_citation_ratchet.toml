# Vault rule-slug citations in shipped code, by file.
#
# The reference direction is one-way: a vault document cites code by locator,
# and code never cites the vault. These 297 citations across 206 files are the
# migration debt the governing rule names. Retiring them needs an explicit
# repository-wide migration; what this file enforces is the other half of that
# rule -- that no shipped module gains a NEW one.
#
# Shrink-only. Lower an entry when a citation is removed, and delete the entry
# when a file carries none. Never add a line to make the gate pass: the fix is
# to say the thing in the code''s own terms, not to cite the rule that says it.

