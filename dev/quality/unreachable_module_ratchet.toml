# Baseline for the unreachable-module ratchet.
#
# Every entry names a module under src/cadrumo that no declared console script
# can reach. The gate in dev/quality/unreachable_module_ratchet.py compares this
# list against the live tree as a set, in both directions:
#
#   * a module the tree reports that is not listed here fails the gate --
#     new unreachable code entered the shipped package;
#   * an entry here that the tree no longer reports also fails -- the debt was
#     paid and this file must shrink to record it.
#
# So the correct response to a failure is never to add a line. Adding one is
# how a boundary erodes. Resolve the module instead:
#
#   * harness code -> move it beside the dev/ consumer that drives it;
#   * shared test support -> move it into src/cadrumo/tests/, which is
#     wheel-excluded (see the exclude globs in pyproject.toml);
#   * capability that lost its last caller -> delete it, with its tests;
#   * capability that should be live -> wire it to the entrypoint that needs it.
#
# Regenerate the current set for comparison with:
#   just audit-unreachable-code
#
# What is listed below is a backlog, not an endorsement. Two clusters dominate
# it and are tracked as their own work: the orphaned-domain cluster (product
# capability whose caller is gone -- borrador ingestion, the fincas domain, the
# wizard flow surfaces, the filing sub-steps) and the sede/renta-web-open
# cluster (a live browser driver and its oracle, which stand or fall together).

frozen_prefixes = [
  # The TUI is in-flight work owned elsewhere; its modules churn in both
  # directions and this gate does not adjudicate them. The audit still reports
  # everything under this prefix -- freezing it sets scope, not permission.
  "cadrumo.entrypoints.tui",
]

