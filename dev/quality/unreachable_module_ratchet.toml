# Baseline for the unreachable-module ratchet.
#
# Every entry names a module under src/cadrumo that no declared CONSOLE SCRIPT
# reaches. All three of the audit's reach categories are in scope, and the
# trailing comment on each line records which one applies:
#
#   unreachable       nothing reaches it at all
#   module-exec-only  only a `python -m` surface reaches it, so an installed
#                     user can run it but no product command leads there
#   type-only         only an `if TYPE_CHECKING:` import names it, which
#                     never executes
#
# The category names the remedy, not an exemption. None of the three is a
# product command reaching the module, so all three are findings; scoping the
# gate to `unreachable` alone would let a module leave the backlog by gaining
# a __main__.py sibling instead of by being resolved.
#
# The gate in dev/quality/unreachable_module_ratchet.py compares this list
# against the live tree as a set, in both directions:
#
#   * a module the tree reports that is not listed here fails the gate --
#     new unreachable code entered the shipped package;
#   * an entry here the tree no longer reports as actionable also fails --
#     either the debt was paid or only a deferred cluster still leads there,
#     and this file must shrink to record it.
#
# So the correct response to a failure is never to add a line. Adding one is
# how a boundary erodes. Resolve the module instead:
#
#   * harness code -> move it beside the dev/ consumer that drives it;
#   * shared test support -> move it into src/cadrumo/tests/, which is
#     wheel-excluded (see the exclude globs in pyproject.toml);
#   * capability that lost its last caller -> delete it, with its tests;
#   * capability that should be live -> wire it to the entrypoint that needs it.
#
# Regenerate the current set for comparison with:
#   just audit-unreachable-code
#
# What is listed below is a backlog, not an endorsement. Two clusters dominate
# it and are tracked as their own work: the orphaned-domain cluster (product
# capability whose caller is gone -- the fincas domain, the wizard flow
# surfaces, the filing sub-steps) and the sede/renta-web-open
# cluster (a live browser driver and its oracle, which stand or fall together).

# A frozen prefix defers by LOCATION, and the deferral is transitive over
# EXCLUSIVE SUPPLIERS: a module every one of whose shipped importers is frozen,
# or is itself deferred that way, is deferred too. That closure is not
# configured here -- the gate reads it from the live import graph and names the
# deferring importers in its report, so it cannot go stale or state a reason
# that stopped being true. A module nothing imports at all, or one with even a
# single importer outside the deferred set, stays actionable and belongs below.
#
# So an entry does NOT belong here merely because a frozen cluster consumes it.
# The list below is for modules this gate still adjudicates.

frozen_prefixes = [
  # The TUI is in-flight work owned elsewhere. Its modules churn in both
  # directions and its reach categories move as its __main__ surfaces change,
  # so this gate does not adjudicate them and must not depend on their
  # classification holding still. The audit still reports everything under
  # this prefix -- freezing it sets scope, not permission.
  #
  # The cluster's application-layer projections live outside this prefix
  # because the dependency direction requires it, so they are deferred by the
  # exclusive-supplier closure described above rather than by being listed.
  "cadrumo.entrypoints.tui",
]

allowed = [
  "cadrumo.adapters.outbound.aeat.sede._renta_web_open_safety",  # unreachable
  "cadrumo.adapters.outbound.aeat.sede.renta_web_open",  # unreachable
  "cadrumo.adapters.persistence.profile.filing_export_replay",  # unreachable
  "cadrumo.adapters.persistence.profile.fincas",  # unreachable
  "cadrumo.application.modelo._edit_facade",  # unreachable
  "cadrumo.application.wizard._registered_values",  # unreachable
  "cadrumo.application.wizard.legal_zone",  # unreachable
  "cadrumo.core.compatibility_lifecycle",  # unreachable
  "cadrumo.domain.fincas",  # unreachable
  "cadrumo.domain.portals.drift",  # type-only
]

