##
## Adjudication ledger for the modelo-conditional branches outside the registry
## package.
##
## The SITES are derived by ``dev.quality.regulatory_drift_census`` and read here
## through ``dev.quality.modelo_branch_classification``; only the classification
## and its prose are authored. A branch the derivation yields and this ledger
## does not name is a reconciliation failure, so a branch added later cannot ship
## unclassified. A row matching no live branch, and a group no row references,
## are equally failures.
##
## classification = "orchestration_routing"
##     The branch selects which code runs. It MUST cite, in ``selects``, a token
##     that appears inside the guarded branch at HEAD -- the function it guards,
##     the symbol it routes to, the refusal it raises. The gate verifies the
##     citation, so a rename breaks the claim instead of silently outliving it,
##     and an author who cannot point at anything has not shown the branch
##     selects anything.
##
## classification = "regulatory_treatment"
##     The branch decides a regulatory outcome the registry should declare. It
##     carries no citation -- it is not the claim being doubted -- and must name
##     the plan row or record that answers it.
##
## The test applied throughout: does the branch encode a fact about TAX LAW, or a
## fact about how THIS CODEBASE is organised? A branch choosing which casilla
## receives a value encodes tax law, because the registry owns casilla targets. A
## branch refusing to run a function named for one modelo encodes code
## organisation. Every row below was read before it was classified.
##

[meta]
schema_version = 1

# -- Shared reasonings -------------------------------------------------------

[[group]]
id = "modelo-scope-guard"
classification = "orchestration_routing"
justification = """
A scope guard on a surface that exists for one modelo: the branch refuses,
returns empty, or no-ops when the subject is a different modelo, and the
function it guards is named for the modelo it serves. What the branch decides is
which code is allowed to run, not what the law says. The citation names the
guarded function, so a rename to something modelo-neutral breaks the claim and
forces it to be made again -- which is the point, because a guard whose function
stops being modelo-specific has stopped being a scope guard.
"""

[[group]]
id = "modelo-path-routing"
classification = "orchestration_routing"
justification = """
The branch routes to a different implementation per modelo: an aggregation, a
projection plan, an observation shape, a producer profile, a repository write.
The selected implementation is named for the modelo it serves and owns whatever
regulatory content it carries; the branch itself only chooses between them. The
citation names the selected symbol rather than the guarded function, because
here there is something concrete to point at.
"""

[[group]]
id = "casilla-target-selection"
classification = "regulatory_treatment"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
justification = """
The branch decides WHICH CASILLA a value lands in, per modelo. That mapping is
registry data: a binding declares its ``target_casilla_id``, and the
authority-flow rule places registry-shaped data in the authoring tree rather
than at the call site. One of these sites says so in its own docstring -- it
describes itself as the OUTPUT half of a fact the registry already declares --
which is the clearest possible evidence that the branch is re-implementing a
declaration rather than orchestrating around it.
"""

[[group]]
id = "obligation-condition"
classification = "regulatory_treatment"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
justification = """
The branch decides whether an obligation applies, or what it resolves to, on a
condition the law fixes: which counterpart verifications a modelo requires, a
first-year modalidad-cuota suppression under LIS art. 40.2, a carry-forward
upgraded to a refund under Ley 37/1992 art. 116. Several of these sites cite
their governing article in a comment beside the branch, which is the tell: the
article is doing the deciding and the registry is not carrying it.
"""

[[group]]
id = "official-design-convention"
classification = "regulatory_treatment"
reference = "2026-08-14-registry-temporal-coverage-drift-census-audit"
justification = """
The branch encodes a convention of the official design that differs by modelo: a
sign rule applied when rendering a value, the ordering of filing periods, which
detail-row section satisfies a required casilla. A design convention is a
property of the modelo's published design and belongs beside the revision that
describes it, not in a branch at the surface that happens to render it.
"""

[[group]]
id = "unbuilt-coordinate-refusal"
classification = "orchestration_routing"
justification = """
The branch refuses a coordinate this codebase has not built, rather than one the
law excludes. It is distinct from ``modelo-scope-guard``: that group requires the
guarded function to be NAMED for the modelo it serves, and these sites sit in
generically-named entry points that serve every modelo and decline the ones no
implementation covers yet. The tell is the vocabulary of the refusal itself --
"supported", "unsupported coordinate", "unhandled" -- which is a statement about
what exists here, not about what the law requires. The citation names a token
from the refusal the branch raises or returns, because that refusal IS the thing
selected.

A branch of this shape can still hide a separate defect: a coordinate narrowed by
a bare literal (a hardcoded filing year) is registry-shaped data at a call site
under ``aeat-registry-authority-flow``, and is recorded as its own finding rather
than adjudicated away here.
"""

