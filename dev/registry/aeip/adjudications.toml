# Adjudications for the Modelo 100 anexo-A AEIP continuity chains.
#
# The planner derives chain ids from the programme titles AEAT publishes. This
# file is where an operator records the identity judgments the planner refuses
# to make on its own. Every entry needs a `reason`: the reason is the audit
# trail for the identity claim, so an ungrounded entry is rejected on load.
#
# Run `python -m dev.registry.aeip check` for the live open list. As measured
# against the 2020-2025 revisions, six cases are open and each is described
# below with what it needs. None is resolved here: each is a legal judgment
# against the official AEAT form dictionaries and the designating norms, and
# the planner is deliberately blocked until they are made.
#
#   1. gapped_span -- "Barcelona Mobile World Capital" is declared in
#      2020-2023, absent from 2024, and declared again in 2025 at id 1629. If
#      the 2025 appearance is a fresh AEIP designation (a new window under a
#      new norm), record a [[splits]] entry giving the later window its own
#      chain. If instead the 2024 absence is a transcription gap, the fix is
#      to the 2024 revision, not to this file.
#
#   2. intra_revision_duplicate -- "175 Aniversario de la construcción del
#      Gran Teatre del Liceu" occupies BOTH id 0757 and id 0765 in revision
#      2020, with byte-identical records apart from the id. From 2021 onward
#      0765 carries the Liceu programme and 0757 carries "Gran Premio de
#      España de Fórmula 1", which makes the 2020 id-0757 record the suspected
#      transcription error. Confirm against the official 2020 form dictionary,
#      then either record an [[exclusions]] entry for the spurious occurrence
#      or correct the registry fragment.
#
#   3. oversize_chain_id (x2) -- two titles exceed the 128-character
#      continuidad_id budget once prefixed and suffixed:
#        "20 Aniversario de la Reapertura del Gran Teatro del Liceo de
#         Barcelona y el bicentenario de la creación de la Societat
#         d'Accionistes"                                        -> 151 chars
#        "XXV Aniversario de la declaración por la UNESCO del Real Monasterio
#         de Santa María de Guadalupe como Patrimonio de la Humanidad"
#                                                               -> 146 chars
#      Record a [[chain_ids]] entry giving each a shortened but still
#      recognisable chain id.
#
#   4. title_variant (x2) -- two groups differ only by an embedded year, and
#      the two groups resolve OPPOSITE ways, which is exactly why this cannot
#      be a text rule:
#        "España País Invitado de Honor en la Feria del Libro de Fráncfort en
#         2021" (2020, 2021) vs "... en 2022" (2022) -- almost certainly ONE
#         programme whose label AEAT restated; if confirmed, record an
#         [[aliases]] entry folding both titles onto one slug.
#        "Año Santo Jacobeo 2021" (2020-2022) vs "Año Santo Jacobeo 2027"
#         (2025) -- distinct holy years under distinct designations; if
#         confirmed, record a [[distinct_variants]] entry keeping them apart.

# One occurrence withheld from the family.
#   revision, casilla, reason
exclusions = []

# Several published titles adjudicated as one programme.
#   slug, titles (list), reason
aliases = []

# An explicit chain id where the derived slug cannot be used as-is.
#   slug, chain_id, reason
chain_ids = []

# A re-designated programme: a second chain starts at from_revision.
#   slug, from_revision, chain_id, reason
splits = []

# Year-variant titles adjudicated as genuinely separate programmes.
#   slugs (list), reason
distinct_variants = []
