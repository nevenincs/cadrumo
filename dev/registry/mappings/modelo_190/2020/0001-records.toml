aeat_type = "Numérico"
statement = "256-268 PERCEPCIÓN ÍNTEGRA (Dineraria) DERIVADA DE INCAPACIDAD LABORAL: Campo numérico de 13 posiciones. Se hará constar, sin signo y sin coma decimal, el importe íntegro anual de las percepciones dinerarias en concepto de incapacidad laboral abonadas directamente por el pagador al trabajador. Rendimientos del trabajo y de actividades económicas, premios y Ejercicio 2021 (Versión sept-2021) 40 Cuando la prestación dineraria por incapacidad laboral sea satisfecha por el empleador en virtud del respectivo acuerdo de colaboración con la Seguridad Social (ya sea esta colaboración de carácter voluntario u obligatorio), se hará constar en el campo “Clave de percepción” la clave “A”. En otro caso, estas percepciones se reflejarán en la Clave “B”, subclave 01. Los importes deben consignarse en euros. Este campo se subdivide en dos: 256-266 Parte entera del importe de la percepción íntegra. Si no tiene contenido se consignará a ceros. 267-268 Parte decimal del importe de la percepción íntegra. Si no tiene contenido se consignará a ceros."

