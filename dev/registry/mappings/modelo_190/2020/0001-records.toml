aeat_type = "Numérico"
statement = "109-121 VALORACIÓN (De la percepción en especie): Campo numérico de 13 posiciones. Se hará constar sin signo y sin coma decimal, la suma de las valoraciones correspondientes a las percepciones en especie efectivamente satisfechas en el ejercicio al perceptor de que se trate, determinadas con arreglo a lo establecido en el artículo 43 de la Ley del Impuesto y sin incluir en ningún caso el importe del ingreso a cuenta. No se incluirán en este campo las percepciones en especie que deban incluirse, en su caso, en el campo “Valoración de la prestación en especie derivada de incapacidad laboral”. Los importes deben consignarse en euros. Este campo se subdivide en dos: 109-119 Parte entera del importe de la valoración, si no tiene contenido se consignará a ceros. 120-121 Parte decimal del importe de la valoración, si no tiene contenido se consignará a ceros."

