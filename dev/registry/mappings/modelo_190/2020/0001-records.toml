statement = "122-134 INGRESOS A CUENTA EFECTUADOS: Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe anual efectivamente ingresado a cuenta por el pagador en relación con las percepciones en especie consignadas en el campo anterior. No se incluirán en este campo los ingresos a cuenta efectuados que correspondan a percepciones en especie Rendimientos del trabajo y de actividades económicas, premios y Ejercicio 2021 (Versión sept-2021) 26 derivadas de incapacidad laboral que deban incluirse, en su caso, en el campo “Ingresos a cuenta efectuados por prestaciones en especie derivadas de incapacidad laboral”. POSICION NATURALEZA DESCRIPCIÓN DE LOS CAMPOS Los importes deben consignarse en euros. Este campo se subdivide en dos: 122-132 Parte entera del importe de los ingresos a cuenta efectuados, si no tiene contenido se consignará a ceros. 133-134 Parte decimal del importe de los ingresos a cuenta efectuados, si no tiene contenido se consignará a ceros."

