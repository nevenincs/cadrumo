length = 13
aeat_type = "Numérico"
statement = "95-107 RETENCIONES PRACTICADAS: Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe anual efectivamente retenido a cuenta del IRPF en relación con las percepciones dinerarias consignadas en el campo anterior, sin incluir las que deban consignarse en el campo “Retenciones practicadas sobre prestaciones derivadas de incapacidad laboral” practicadas por el mismo pagador. Si algún perceptor no ha sufrido retención este campo se consignará relleno a ceros. Los importes deben consignarse en euros. Este campo se subdivide en dos: 95-105 Parte entera del importe de las retenciones practicadas, si no tiene contenido se consignará a ceros. Rendimientos del trabajo y de actividades económicas, premios y Ejercicio 2021 (Versión sept-2021) 25 106-107 Parte decimal del importe de las retenciones practicadas, si no tiene contenido se consignará a ceros. POSICION NATURALEZA DESCRIPCIÓN DE LOS CAMPOS"

