aeat_type = "Numérico"
statement = "223 «< 3 años. N.º Total»: Número de descendientes del perceptor que, dando derecho a éste al mínimo por descendientes, sean menores de 3 años de edad el 31 de diciembre del ejercicio al que corresponda la declaración. Los hijos adoptados y los acogidos se computarán en este campo siempre que la adopción o el acogimiento haya tenido lugar en el ejercicio al que corresponda la declaración o en los dos ejercicios anteriores. En cualquier otro caso este campo se rellenará a ceros (0)."

