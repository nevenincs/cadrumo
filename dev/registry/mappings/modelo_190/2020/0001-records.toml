aeat_type = "Numérico"
statement = "269-281 RETENCIONES PRACTICADAS SOBRE PRESTACIONES DERIVADAS DE INCAPACIDAD LABORAL: Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe anual efectivamente retenido a cuenta del Impuesto sobre la Renta de las Personas Físicas en relación con las percepciones dinerarias derivadas de incapacidad laboral consignadas en el campo anterior. Si algún perceptor no ha sufrido retención, este campo se consignará relleno a ceros. Los importes deben consignarse en euros. Este campo se subdivide en dos: 269-279 Parte entera del importe de las retenciones practicadas. Si no tiene contenido se consignará a ceros. 280-281 Parte decimal del importe de las retenciones practicadas. Si no tiene contenido se consignará a ceros. POSICION NATURALEZA DESCRIPCIÓN DE LOS CAMPOS"

