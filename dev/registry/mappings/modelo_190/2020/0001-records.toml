statement = "255 SIGNO DE LA PERCEPCIÓN ÍNTEGRA DERIVADA DE INCAPACIDAD LABORAL: Se cumplimentará este campo cuando las percepciones correspondan a cantidades reintegradas por el perceptor en el ejercicio, como consecuencia de haber sido indebida o excesivamente percibidas en ejercicios anteriores. En este caso se consignará una «N», en cualquier otro caso el contenido de este campo será un espacio."

