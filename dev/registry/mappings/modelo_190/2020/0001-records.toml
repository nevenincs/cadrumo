[entries.part]
offset = 82
length = 13
aeat_type = "Numérico"
statement = "82-94 PERCEPCIÓN ÍNTEGRA (Dineraria): Campo numérico de 13 posiciones. Se hará constar, sin signo y sin coma decimal, el importe íntegro anual de las percepciones dinerarias efectivamente satisfechas a cada perceptor, salvo las que deban consignarse en el campo “Percepción íntegra derivada de incapacidad laboral” satisfechas por el mismo pagador. Los importes deben consignarse en euros. Este campo se subdivide en dos: 82-92 Parte entera del importe de la percepción íntegra, si no tiene contenido se consignará a ceros. 93-94 Parte decimal del importe de la percepción íntegra, si no tiene contenido se consignará a ceros."

