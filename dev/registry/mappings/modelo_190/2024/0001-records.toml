statement = "309-321 INGRESOS A CUENTA REPERCUTIDOS POR PRESTACIONES EN ESPECIE DERIVADAS DE INCAPACIDAD LABORAL: Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe anual de los ingresos a cuenta efectuados que, en su caso, el pagador de las retribuciones en especie derivadas de incapacidad laboral hubiera repercutido al perceptor. Los importes deben consignarse en euros. Este campo se subdivide en dos: 309-319 Parte entera del importe de los ingresos a cuenta repercutidos; si no tiene contenido se consignará a ceros. 320-321 Parte decimal del importe de los ingresos a cuenta repercutidos; si no tiene contenido se consignará a ceros."

