aeat_type = "Numérico"
statement = "283-295 VALORACIÓN DE LA PERCEPCIÓN EN ESPECIE DERIVADA DE INCAPACIDAD LABORAL: Campo numérico de 13 posiciones. Cuando, en virtud del respectivo acuerdo de colaboración con la Seguridad Social (ya sea esta colaboración de carácter voluntario u obligatorio), el empleador satisfaga prestaciones por incapacidad laboral en forma excepcional de prestaciones en especie, se harán constar en este campo, sin signo y sin coma decimal, la suma de las valoraciones correspondientes a dichas percepciones en especie derivadas de incapacidad laboral efectivamente satisfechas en el ejercicio al perceptor de que se trate, determinadas con arreglo a lo establecido en el artículo 43 de la Ley del Impuesto y sin incluir en ningún caso el importe del ingreso a cuenta, haciendo constar en el campo “Clave de percepción” la clave “A”. Los importes deben consignarse en euros. Este campo se subdivide en dos: 283-293 Parte entera del importe de la valoración; si no tiene contenido, se consignará a ceros. 294-295 Parte decimal del importe de la valoración; si no tiene contenido, se consignará a ceros."

