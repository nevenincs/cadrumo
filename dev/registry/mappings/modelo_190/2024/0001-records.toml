aeat_type = "Alfabético"
statement = "121 DECLARACIÓN COMPLEMENTARIA: Se consignará una «C» si la presentación de esta declaración tiene por objeto incluir percepciones que, debiendo haber figurado en otra declaración del mismo ejercicio presentada anteriormente, hubieran sido completamente omitidas en la misma. La presentación de una declaración complementaria que tenga por objeto la modificación del contenido de datos declarados en otra declaración del mismo ejercicio presentada anteriormente se realizará desde el trámite de “consulta y modificación de declaraciones” del procedimiento del modelo 190, en la Sede electrónica de la Agencia Tributaria (https://sede.agenciatriburia.gob.es)."

