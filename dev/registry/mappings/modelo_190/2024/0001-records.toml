aeat_type = "Numérico"
statement = "323-335 HACIENDA ESTATAL. Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe anual de las retenciones e ingresos a cuenta, correspondientes a los rendimientos a que se refieren el artículo 10.1.f) segundo párrafo, del Convenio Económico entre el Rendimientos del trabajo y de actividades económicas, premios y Ejercicio 2024 (Versión 5 – 18.12.2024) 48 Estado y la Comunidad Foral de Navarra, aprobado por la Ley 28/1990, de 26 de diciembre, y el artículo 7.Uno.c) segundo párrafo, del Concierto Económico con la Comunidad Autónoma del País Vasco, aprobado por la Ley 12/2002, de 23 de mayo, efectivamente ingresados en la Hacienda Pública Estatal. No obstante, cuando las retenciones e ingresos a cuenta correspondientes a los rendimientos a que se refiere el párrafo anterior se hayan ingresado exclusivamente a la Hacienda Estatal, únicamente se cumplimentará este subcampo, consignando aquí el sumatorio de las casillas «Retenciones practicadas» (posiciones 95-107) e «Ingresos a cuenta efectuados» (posiciones 122- 134), previamente cumplimentadas, correspondientes a las prestaciones de la Clave E satisfechas a ese perceptor. Los importes deben consignarse en euros. Este campo se subdivide en dos: POSICION NATURALEZA DESCRIPCIÓN DE LOS CAMPOS 323-333 Parte entera del importe de las retenciones practicadas e ingresos a cuenta efectuados; si no tiene contenido, se consignará a ceros. 334-335 Parte decimal del importe de las retenciones practicadas e ingresos a cuenta efectuados; si no tiene contenido, se consignará a ceros."

