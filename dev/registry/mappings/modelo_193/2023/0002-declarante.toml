statement = "121 DECLARACIÓN COMPLEMENTARIA.: Se consignará una “C” si la presentación de esta declaración tiene por objeto incluir percepciones que, debiendo haber figurado en otra declaración del mismo ejercicio presentada anteriormente, hubieran sido completamente omitidas en la misma."

