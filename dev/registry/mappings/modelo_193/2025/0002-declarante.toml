statement = "122 DECLARACIÓN SUSTITUTIVA: Se consignará una “S” si la presentación tiene como objeto anular y sustituir a cuenta del IS e IRNR (establecimientos permanentes) sobre completamente a otra declaración anterior, del mismo ejercicio. Una declaración sustitutiva sólo puede anular a una única declaración anterior."

