[entries.part]
offset = 249
length = 13
aeat_type = "Numérico"
statement = "(249-261) HACIENDA ESTATAL. Campo numérico de 13 posiciones. Se consignará, sin signo y sin coma decimal, el importe de las retenciones e ingresos a cuenta relativos a rendimientos del capital mobiliario o rentas sujetas a retención que deban ser ingresados en proporción al volumen de operaciones según lo previsto en el artículo 12.1 segundo párrafo y en a cuenta del IS e IRNR (establecimientos permanentes) sobre el artículo 10.1.f) segundo párrafo del Convenio Económico entre el Estado y la Comunidad Foral de Navarra y en el artículo 9.Uno.Primera. a) segundo párrafo y en el artículo 7.Uno.c) segundo párrafo del Concierto Económico con la Comunidad Autónoma del País Vasco, efectivamente ingresados en la Hacienda Pública Estatal. Cuando las retenciones e ingresos a cuenta mencionados en el párrafo anterior se hayan ingresado exclusivamente a la Hacienda Estatal, únicamente se cumplimentará este subcampo, consignando aquí el importe del campo “Retenciones e ingresos a cuenta” (posiciones 169-181 del registro de tipo 2), correspondiente a los mismos. Los importes deben consignarse en euros. Este campo se subdivide en dos: 249-259 Parte entera del importe de las retenciones practicadas e ingresos a cuenta efectuados; si no tiene contenido, se consignará a ceros. 260-261 Parte decimal del importe de las retenciones practicadas e ingresos a cuenta efectuados; si no tiene contenido, se consignará a ceros."

