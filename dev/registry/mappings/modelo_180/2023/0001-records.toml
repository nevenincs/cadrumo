[entries.part]
offset = 321
length = 2
aeat_type = 'Numérico'
statement = '321-322 CÓDIGO PROVINCIA Se consignará el código de la provincia. Se consignarán los dos dígitos numéricos que correspondan a la provincia o, en su caso, ciudad autónoma o Isla de La Palma, que corresponda al inmueble arrendado, según la siguiente relación: PROVINCIAS CP PROVINCIAS CP ARABA/ÁLAVA 01 LEÓN 24 ALBACETE 02 LLEIDA 25 ALICANTE/ALACANT 03 LUGO 27 ALMERIA 04 MADRID 28 ASTURIAS 33 MÁLAGA 29 ÁVILA 05 MELILLA 52 BADAJOZ 06 MURCIA 30 BARCELONA 08 NAVARRA 31 BURGOS 09 OURENSE 32 CÁCERES 10 PALENCIA 34 CÁDIZ 11 PALMAS, LAS 35 CANTABRIA 39 PONTEVEDRA 36 CASTELLÓN/CASTELLÓ 12 RIOJA, LA 26 CEUTA 51 SALAMANCA 37 CIUDAD REAL 13 S.C.TENERIFE (a excepción de Isla de La Palma). CÓRDOBA 14 SEGOVIA 40 CORUÑA, A 15 SEVILLA 41 CUENCA 16 SORIA 42 GIRONA 17 TARRAGONA 43 GRANADA 18 TERUEL 44 GUADALAJARA 19 TOLEDO 45 GIPUZKOA 20 VALENCIA/VALÉNCIA 46 HUELVA 21 VALLADOLID 47 HUESCA 22 BIZKAIA 48 ILLES BALEARS 07 ZAMORA 49'

