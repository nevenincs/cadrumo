aeat_type = "Alfabético"
statement = "79-80 CÓDIGO PAÍS Campo alfabético de 2 posiciones. En el caso de no residentes sin establecimiento permanente se consignará XX, siendo XX el Código del país de residencia del declarado, de acuerdo con los códigos alfabéticos de países y territorios que figuran en la Orden EHA/3496/2011, de 15 de diciembre, en su Anexo II (BOE 26/12/2011)."

