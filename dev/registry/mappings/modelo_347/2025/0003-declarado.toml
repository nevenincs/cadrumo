# The design divides this four-byte cell in its own text: 77-78 CODIGO PROVINCIA
# (numerico) and 79-80 CODIGO PAIS (alfabetico). Each half is its own field.
[[entries]]
export_field_id = "m347-2025.declarado.f009a"
kind = "casilla"
casilla_id = "contraparte.provincia-codigo"
legal_refs = ["orden-eha-3012-2008:art-1", "orden-eha-3012-2008:art-10", "orden-hac-1431-2025:art-1", "rd-1065-2007:art-31", "ley-58-2003:art-93"]
source_refs = ["aeat-dr-347-2025"]
[entries.anchor]
