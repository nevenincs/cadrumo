source_row = 267
ordinal = "9"
record_identity = "Tipo 2 - Registro De Declarado"
[entries.part]
offset = 77
length = 2
aeat_type = "Numérico"
statement = "Campo numérico de dos posiciones. En el caso de residentes o de no residentes que operen en territorio español mediante establecimiento permanente, se consignará el correspondiente al domicilio fiscal del declarado. Se consignarán los dos dígitos que corresponden a la provincia o ciudad autónoma, del domicilio del declarado, según la siguiente relación: ALBACETE 02 JAÉN 23 ALICANTE/ALACANT 03 LEÓN 24 ALMERIA 04 LLEIDA 25 ARABA/ÁLAVA 01 LUGO 27 ASTURIAS 33 MADRID 28 ÁVILA 05 MÁLAGA 29 BADAJOZ 06 MELILLA 52 BARCELONA 08 MURCIA 30 BIZKAIA 48 NAVARRA 31 BURGOS 09 OURENSE 32 CÁCERES 10 PALENCIA 34 CÁDIZ 11 PALMAS, LAS 35 CANTABRIA 39 PONTEVEDRA 36 CASTELLÓN/CASTELLÓ 12 RIOJA, LA 26 CEUTA 51 SALAMANCA 37 CIUDAD REAL 13 S.C.TENERIFE 38 CÓRDOBA 14 SEGOVIA 40 CORUÑA, A 15 SEVILLA 41 CUENCA 16 SORIA 42 GIPUZKOA 20 TARRAGONA 43 GIRONA 17 TERUEL 44 GRANADA 18 TOLEDO 45 GUADALAJARA 19 VALENCIA/VALÉNCIA 46 HUELVA 21 VALLADOLID 47 HUESCA 22 ZAMORA 49 ILLES BALEARES 07 ZARAGOZA 50 En el caso de no residentes sin establecimiento permanente se consignará 99."

