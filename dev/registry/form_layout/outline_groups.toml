# Navigation outlines a reviewer declared over a revision's generated layout, grouping its sections by subject.
#
# Each outline names one revision and lists its groups in the order a filer meets them; each group lists the
# sections it gathers as `page/section`, by the layout's own ids. The layout validator refuses an outline that
# names a section the layout does not have, names one twice, or leaves one out. A group's heading is the
# catalogue entry `modelo.schema.<modelo>.form.outline.<group>.heading`, shared by every revision that declares
# a group of that id, so a group id keeps one subject. Edit this file, then run
# `python -m dev.registry.form_layout generate`.
#
# Modelo 100 2025: Renta's dictionaries split the return into a results container (Resultados), a data-entry
# container (TomaDatosAmpliada) and a container of income holders (DatosEconomicos). The groups follow the
# subjects of the return: each income source with its summary, the bases, the personal and family minimum, the
# tax calculation, the annexes of deductions and other information, and the result. Section subjects were read
# from the 2025 declaration and input dictionaries: each section's XML container paths and its boxes' official
# descriptions. The identification group gathers the declarant, spouse and declaration containers
# (DatosIdentificativos, @codigoCADeclaracion, @TIPOTRIBUTACION); the household group gathers the Hijos and
# Ascendientes containers.

[[outlines]]
modelo = "100"
revision = "2025"
groups = [
    { id = "identification", sections = [
        "declaracion/general",
        "datosidentificativos-declarante/general",
        "datosidentificativos-conyuge/general",
        "datosidentificativos/general",
    ] },
    { id = "household", sections = [
        "datosidentificativos-hijos/hijo",
        "datosidentificativos-hijos/general",
        "datosidentificativos-ascendientes/ascendiente",
