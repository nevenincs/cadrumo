[singleton_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m151-2015-descripcion-mistyped-alphanumeric"
decision_statement = "The descripcion slot carries alphanumeric prose and renders blank-filled and left-justified, despite the design typing it Num."
justification = "AEAT's own Nota 1 defines the naturaleza column as A (Alfabetico), An (Alfanumerico), Num (Numerico sin signo) or N (Numerico con signo), so Num on a 100-position free-text descripcion is a publication error rather than a convention: the whole block of rows below the page identifier is typed Num uniformly, money and prose alike. There is no numeric reading of a descripcion to recover, and zero-filling one would corrupt the value rather than pad it."

