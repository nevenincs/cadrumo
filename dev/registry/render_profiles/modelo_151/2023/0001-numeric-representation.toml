[width_17_rules.evidence]
authority_kind = "official_source"
source_sheet = "M15102000"
source_cell = "G13"
expected_normalized_statement = "[15 enteros + 2 decimales]"
justification = "The governed anchors print no Contenido of their own, which is why they need a reviewed rule at all. This design states the width-17 representation explicitly on its own transmision and ganancia rows -- same workbook, same naturaleza, same 17 positions -- and every width-17 amount in a fixed-width AEAT design carries one representation, so that printed cell governs these anchors too. The locator is found by reading the sheet's own Contenido header back rather than assumed, and the cell text is re-read out of the hash-verified binary at validation time."

