decision_id = "m232-2016-devengo-ejercicio-year-yyyy"
decision_statement = "The Devengo ejercicio renders as the four-digit filing year, unsigned, with no decimal component."
justification = "The official design leaves this field's Contenido cell blank while its own header names it Ejercicio. At four Num characters the only reading available is the four-digit year the export codec already owns; no narrower or wider policy fits the slot."

