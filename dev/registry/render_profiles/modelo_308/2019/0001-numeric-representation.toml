decision_statement = "Maximum take-off weight as an unsigned integer in ten positions."
justification = "The design names the field 'MTN - Aeronaves - Peso maximo despegue' over a ten-position Num slot and states no decimal subdivision, unlike the eslora row beside it which prints its three-plus-two split explicitly."

