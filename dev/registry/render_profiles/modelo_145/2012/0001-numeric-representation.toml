decision_id = 'm145-2012-width17-num-euro-money-15-2'
decision_statement = 'The two 17-position Num euro-amount fields use an unsigned 15-integer/2-decimal representation.'
justification = 'The hash-verified PDF identifies the fields as the annual compensatory pension and child-support annuity amounts and assigns each 17 Num positions. It does not print the decimal split; the reviewed 15+2 euro scale preserves two cents digits without claiming the split is official wording.'

