# PROVISIONAL -- do not trust these rules until the PDF extractor reads this
# design's Contenido column.
#
# A render profile governs the anchors whose Contenido cell the design leaves
# BLANK, because those are the slots no source statement fixes. For this design
# the extractor populates content on 5 of 262 fields (1 per cent), against 96 per
# cent for Modelo 184's PDF and roughly half for the workbook designs. So the
# 28 anchors below are "unstated" as far as the parser reports, and an unknown
# number of them are in fact STATED by a Contenido cell that was not read.
#
# Every rule here is therefore a decision that may be redundant or, worse,
# contradict what the design says. Regenerate this profile once the extractor
# reads the column, and re-review each surviving rule against the content it
# then reports.

