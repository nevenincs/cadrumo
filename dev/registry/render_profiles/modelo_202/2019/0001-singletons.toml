decision_id = "m202-2019-cnae-actividad-principal-identifier-digits"
decision_statement = "The C.N.A.E. principal-activity code renders as unsigned identifier digits with no decimal component."
justification = "A CNAE code classifies an activity; it is never summed or scaled, and its leading zeros are significant (0111 is a real division), so it must not pass through a policy that would strip them."

