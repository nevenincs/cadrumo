[singleton_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m210-2022-representante-numero-casa-identifier-digits"
decision_statement = "The representante domicilio house number renders as unsigned identifier digits with no decimal component."
justification = "A house number identifies a doorway; it is never summed or scaled, and AEAT's own five-character extent admits no separator, so the identifier-digits policy is the only reading the export codec offers that preserves leading zeros."

