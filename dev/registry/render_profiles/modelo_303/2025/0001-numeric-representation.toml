decision_id = "m303-2025-devengo-ejercicio-year-yyyy"
decision_statement = "The Devengo ejercicio field is rendered as the four-digit filing year, unsigned, with no decimal component."
justification = "The official design leaves this field's Contenido cell blank while marking it Obligatorio, so no source statement fixes its representation. Its four-character extent and its Devengo ejercicio meaning admit only the four-digit year policy, which the export codec already owns; no narrower or wider reading is available at four digits."

