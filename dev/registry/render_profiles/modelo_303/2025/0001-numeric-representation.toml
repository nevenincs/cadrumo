[singleton_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m303-2025-rs-agricola-actividad-1-codigo-identifier-digits"
decision_statement = "The agricultural simplified-regime activity code in slot 1 is rendered as a two-digit identifier, unsigned, with no decimal component and no closed value domain asserted."
justification = "The official design leaves this field's Contenido cell blank and states no validation, so no source statement fixes its representation. It is an activity code rather than a quantity, so an integer or decimal reading would assert arithmetic the field does not carry. An enumeration reading is deliberately refused because it would require canonical allowed values, and the annual Orden publishes its activity identities as slugs rather than in this two-digit form, so any enumerated domain would have to be invented here."

