[literal_numeric_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m303-2024-early-box-02-printed-percent-scale"
decision_statement = "The exact numeric literal of Tipo % [02] has two implied decimal places in percentage units."
justification = "The pinned record design states the exact five-digit constant in a Tipo % slot. Reading its digits at two decimal places agrees with the official Modelo 303 instructions for the corresponding printed row: 00400 means4%, 01000 means10%, 02100 means21%, 00175 means1.75%, 00140 means1.4%, and00520 means5.2%. See https://sede.agenciatributaria.gob.es/Sede/todas-gestiones/impuestos-tasas/iva/modelo-303-iva-autoliquidacion_/instrucciones-2025.html, IVA devengado. This declares the constant presentation scale and does not impose that rate on the calculation or remove Note7 for exclusively foral filing."

