[width_17_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m122-2016-width17-num-money-15-2"
decision_statement = "The eleven 17-position Num amount and result fields use 15 integer digits and 2 implied decimal digits, unsigned."
justification = "The hash-verified design labels each governed field Num and names it as a deduction, advance payment, or amount payable; the official type note defines Num as unsigned, but does not state a decimal split. This reviewed policy assigns the 15+2 money representation to the 17-position amount fields and does not present that split as official wording."
