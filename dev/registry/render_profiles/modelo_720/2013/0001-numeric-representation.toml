justification = "Reviewed exact source anchor. Printed meaning: FECHA DE INCORPORACIÓN. Printed source prose: Se hará constar las siguientes fechas según el valor del campo “CLAVE TIPO DE DE BIEN O DERECHO” (posición 102) declarada: ‐ Cuando la “CLAVE TIPO DE BIEN O DERECHO” (posición 102) tome el valor “C” se consignará la fecha de apertura de la cuenta, de la concesión de la autorización o del poder de disposición, o de cualquier otra forma de titularidad real. ‐ Cuando la “CLAVE TIPO DE BIEN O DERECHO” (posición 102) tome el valor “V” se consignará la fecha de adquisición de la titularidad o titularidad real de los valores. ‐ Cuando la “CLAVE TIPO DE BIEN O DERECHO” (posición 102) tome el valor “I” se consignará la fecha de adquisición de la titularidad o titularidad real sobre las acciones o participaciones en la IIC. ‐ Cuando la “CLAVE TIPO DE BIEN O DERECHO” (posición 102) tome el valor “S” se consignará la fecha de contratación con la entidad aseguradora o con la entidad receptora de los bienes y derechos constitutivos de las rentas vitalicias o temporales. ‐ Cuando la “CLAVE TIPO DE BIEN O DERECHO” (posición 102) tome el valor “B” se consignará la fecha de adquisición de la titularidad o titularidad real sobre el bien inmueble o del derecho real sobre el mismo. ‐ Cuando existan diferentes fechas de incorporación respecto del tipo de bien o derecho declarado deberán consignarse las mismas en diferentes registros. De este modo cuando la “CLAVE TIPO DE BIEN O DERECHO” tome el valor “V” o “I” se deberán declarar tanto registros como fechas de adquisición diferentes existan. Se indicarán los cuatro dígitos del año, los dos del mes (de 01 a 12) y los dos del día (de 01 a 31) con el formato AAAAMMDD."

