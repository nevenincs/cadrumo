[singleton_rules.evidence]
authority_kind = "official_source"
source_sheet = "DP200001"
source_cell = "G106"
expected_normalized_statement = "\"0\" o \"1\""
justification = "Sibling-cell analogy, not own-cell text: the DR200e25 design states no value in the own cells of field DP200001 row 65. Its sibling cell DP200001!G106, the SOCIMIS régimen fiscal de entrada-salida indicator of the same design, states \"0\" o \"1\" for a one-position Num indicator of the same field kind. BOE-A-2026-11583 (Orden HAC/529/2026) anexo I, PDF page 15, BOE Pág. 73136 prints this field as the checkbox '00049 Regímenes especiales de normativa foral', so 1 writes a marked box and 0 an unmarked one."

