# The six art. 11.12 LIS grid positions whose Contenido cell reads "No
# cumplimentar". AEAT's instruction governs the VALUE -- the filer leaves them
# empty -- not the wire SHAPE, which the design fixes at 17 characters of Num
# exactly like every sibling amount in this grid, all already declared 15,2
# unsigned by the fragments covering DP200026C. The governing evidence is the
# same official workbook note, so this rule cites it rather than asserting a
# second authority for the same fact.
#
# They are NOT filler. The completeness check counts all six as required
# positions of the official design, so emitting them as filler would leave six
# positions AEAT expects unwritten while the digest still validated -- a thin
# file behind a valid digest, which is the exact failure that gate exists to
# catch.

[[width_17_rules]]
rule_kind = "width_17_membership"
aeat_type = "Num"
integer_digits = 15
decimal_digits = 2
sign_policy = "unsigned"

