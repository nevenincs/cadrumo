decision_id = "m347-decl-persona-relacion-telefono"
decision_statement = "Nine digits of a telephone number, never an arithmetic quantity."
justification = "AEAT prints this row as a subdivision of 'PERSONA CON QUIEN RELACIONARSE' and leaves its naturaleza cell EMPTY, so the wire fact has to come from a reviewed rule. The design's own prose supplies it: 'TELEFONO : Campo numerico de 9 posiciones.' A telephone number is a digit string: it is never signed, never scaled, and its leading zeros are significant."

