[singleton_rules.evidence]
authority_kind = "reviewed_policy"
decision_id = "m222-2023-cnae-actividad-principal-identifier-digits"
decision_statement = "The C.N.A.E. principal-activity code renders as unsigned identifier digits with no decimal component."
justification = "A CNAE code classifies an activity; it is never summed or scaled, and its leading zeros are significant (0111 is a real division), so it must not pass through a policy that would strip them. Modelo 202's 2023 epoch of this same design family rules the same field the same way; the 2025 epoch of modelo 222 does not, because there the Contenido cell reads 'Nota 16' and the field is outside profile authority."

