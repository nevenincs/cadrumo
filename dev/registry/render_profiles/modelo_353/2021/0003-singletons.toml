decision_id = "m353-2026-identificacion-ejercicio-year-yyyy"
decision_statement = "The Identificación ejercicio renders as the four-digit filing year, unsigned, with no decimal component."
justification = "The design leaves this field's Contenido cell blank while its own Descripción names it Ejercicio. At four Num positions the only reading available is the four-digit year the export codec already owns."

