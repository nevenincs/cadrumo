# Modelo 115 -- IRPF retenciones sobre rendimientos de arrendamiento de inmuebles
# urbanos -- fichero BOE.
#
# Transcribed position by position from the bundled AEAT Diseno de Registros
# cited in source_refs. Every offset and length below is read from that file;
# none is derived, inferred or rounded.
#
# The file envelope's 'Version del Programa' (@93+4) and 'NIF Empresa Desarrollo'
# (@101+9) are the design's Nota 1 slots for the entidad desarrolladora. Cadrumo
# holds no AEAT developer registration, so both take the all-zero development
# mock identity from the governed fact aeat-eedd:development-mock-software-identity,
# and an export carrying it is graded as not presentable at AEAT.

