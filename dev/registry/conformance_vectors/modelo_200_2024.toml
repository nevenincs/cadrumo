[inputs.decimal]
# Casilla 00501 is the resultado de la cuenta de perdidas y ganancias: a
# required manual input and the base-determination starting point. It carries
# a synthetic NON-ZERO magnitude deliberately, so the cuota chain is actually
# exercised; a zero here would render a degenerate base and prove far less.
"DP200012:00501" = "100000"
# INCN of the preceding período impositivo (LIS art. 29.1 and art. 101), read
# from the preceding Modelo 200. NOT a neutral zero: this value selects the
# tipo de gravamen branch outright. For 2024, below the microempresa threshold
# of one million euros (is.modelo-200.incn-umbral-microempresa) LIS art. 29.1
# as worded by Ley 31/2022 art. 39 gives the reduced 23% rate
# (is.modelo-200.tipo-gravamen-pyme-display); at or above it the GENERAL
# art. 29 rate of 25% applies. This value clears that threshold, so the general
# branch is the one exercised, and it is coherent with the declared 00501
# result.
"modelo-200-incn-periodo-impositivo-anterior" = "12000000"
# INCN of the twelve months before the period (LIS DA 15a): below 20 million
# euros the BIN compensation keeps the 70% limit. The same figure, since that
# preceding período lasted twelve months.
"modelo-200-profile-incn-prior-12-months" = "12000000"
