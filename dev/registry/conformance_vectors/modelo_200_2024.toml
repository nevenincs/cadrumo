# Pinned public conformance-vector declaration for Modelo 200 revision 2024.
#
# Only the generation MANIFEST digest is pinned, not the output digests it
# already contains. The manifest enumerates every generated output with its own
# sha256, so any change to any output changes the manifest and therefore this
# digest: one pin carries the identical fail-closed property. The pin stays
# committed data rather than being re-derived beside the enrollment, which is
# what keeps the canonical_builder_conflict check from being tautological.
# A regenerated export tree must refresh this digest under review.

authority_id = "dev.registry.filing-export-conformance"
mechanism_source_ref = "generated-provenance/200/2024"
generation_manifest_sha256 = "dc1695b50fb78687a25c79a246e149efec4ad182d3356358c456efa5678f8b30"
