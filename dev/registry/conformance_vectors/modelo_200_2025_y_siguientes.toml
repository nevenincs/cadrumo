# gives the ERD art. 101 rate that DT 44a phases down (24% for 2025, parameter
# is.modelo-200.tipo-gravamen-erd-art101). Only above the art. 101 ceiling does
# the GENERAL art. 29 rate of 25% apply. This value clears that ceiling, so the
# general branch is the one exercised, and it is coherent with the declared
# 00501 result.
