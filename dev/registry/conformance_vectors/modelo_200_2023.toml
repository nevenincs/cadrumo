# Pinned public conformance-vector declaration for Modelo 200 revision 2023.
#
# Only the generation MANIFEST digest is pinned, not the output digests it
# already contains. The manifest enumerates every generated output with its own
# sha256, so any change to any output changes the manifest and therefore this
# digest: one pin carries the identical fail-closed property. The pin stays
# committed data rather than being re-derived beside the enrollment, which is
# what keeps the canonical_builder_conflict check from being tautological.
# A regenerated export tree must refresh this digest under review.

authority_id = "dev.registry.filing-export-conformance"
mechanism_source_ref = "generated-provenance/200/2023"
generation_manifest_sha256 = "e2aec07f307d74f7e604c7a36fedc8ebcd070b99734ceca5b1a0bb51fd00305d"
filing_year = 2023
period_code = "0A"

[coordinate]
modelo = "200"
revision = "2023"
layout_ids = ["generated-modelo-200-2023-fichero"]

# The vector carries the sociedad-limitada persona's return for this exercise
# (dev/fixtures/personas/sociedad-limitada), so the mechanism run exercises the
# branch the 2023 law adds: the flat 23 % rate of LIS art. 29.1 as worded by
# Ley 31/2022 art. 39 (BOE-A-2022-22128) for INCN of the preceding period
# below 1 millon de euros. The 2024 and 2025 vectors exercise the general 25 %.
[inputs.decimal]
# Casilla 00501, resultado de la cuenta de perdidas y ganancias antes del IS
# (aeat-dr-200-2023 DP200012 row 9, position 64, length 17, type N). Non-zero so
# the cuota chain is exercised.
"DP200012:00501" = "25400.00"
# Casilla 00547, compensacion de BIN de periodos anteriores (DP200014 row 12,
# position 115). The whole pending 16300.00: LIS art. 26.1 limit is
# max(1000000.00, 70 % x 25400.00) = 1000000.00 (manual Sociedades 2023 L13273-13277, L13287-13288).
"DP200014:00547" = "16300.00"
# Casilla 00619, cuota liquida minima (DP200014B row 19). Art. 30 bis LIS reaches
# only INCN >= 20 millones or consolidacion fiscal (manual 2023 L14611-14626): 0.
"DP200014B:00619" = "0.00"
# Casilla 00255 of the preceding Modelo 200 (LIS art. 29.1, art. 101.2-3): 28500.00,
# below 1000000, so the 23 % rate (manual 2023 L13587-13588, L2895-2900).
"modelo-200-incn-periodo-impositivo-anterior" = "28500.00"
# INCN of the twelve months before the period (LIS art. 30 bis.1): below 20
# millones de euros and no consolidacion fiscal, so the minimum does not apply.
# The same figure, since that preceding periodo lasted twelve months.
"modelo-200-profile-incn-prior-12-months" = "28500.00"
"modelo-200-profile-tributacion-estado-porcentaje" = "100"
"modelo-200-bin-pendiente-ejercicios-anteriores" = "16300.00"
"modelo-200-dotaciones-deterioro-creditos-saldo-no-cumplido-anteriores" = "0"
"modelo-200-dotaciones-deterioro-creditos-saldo-cumplido-anteriores" = "0"
# First instalment, LIS art. 40.2: 18 % x 300.00 (cuota of the last return due).
"modelo-200-pago-fraccionado-primero-40-2" = "54.00"
"modelo-200-pago-fraccionado-primero-40-3" = "0"
"modelo-200-pago-fraccionado-segundo-40-2" = "0"
"modelo-200-pago-fraccionado-segundo-40-3" = "0"
"modelo-200-pago-fraccionado-tercero-40-2" = "0"
"modelo-200-pago-fraccionado-tercero-40-3" = "0"

[inputs.enum]
"modelo-200-profile-legal-entity-form" = "sl"

[boolean_inputs]
# Third period with a positive base: the nueva creacion 15 % no longer applies.
"modelo-200-profile-new-entity-flag" = false

