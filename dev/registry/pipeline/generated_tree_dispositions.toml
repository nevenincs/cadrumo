[["347/2011-2024"]]
class = "record_drift"
reason = """
The shipped declarado record repeats over binding rows and carries nine
binding-kind fields, so one authored row becomes one emitted record. A fresh
render of the current inputs produces neither the repeat nor the binding
fields, which would emit a single declarado record however many counterparties
the declaration has. The official design requires as many type-two records as
the declaration has declarados and inmuebles, so the shipped bytes are correct
and the current inputs are not. This tree must not be republished until the
inputs reproduce the repeat.

The pipeline already refuses a regeneration that would drop this repeat, in
`_tree_check._refuse_repeat_the_candidate_would_drop`, and that refusal names
the three things to author on the map: the record repeat, the binding record,
and the per-row casilla identities. Read it before attempting the repair; it is
the authoritative statement of the remedy and it predates this disposition.
"""

