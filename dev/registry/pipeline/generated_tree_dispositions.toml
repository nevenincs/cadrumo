[[dispositions]]
kind = "record_drift"
modelo = "222"
revision = "2025-y-siguientes"
source_ref = "aeat-dr-222-2025"
source_sha256 = "0a44cd6bcae3b6ecbdb7bba1e54ddfad519506b91545b655c8da8454a3a63f51"
remedy = "republish"
differing_records = 2
reason = """
The shipped records declare these amounts unsigned while the official type
column declares them signed, so a fresh render no longer reproduces the
committed bytes. The difference is the defect being corrected, not drift away
from a correct tree.

The representation is now grounded. AEAT states the convention for every design:
numeric fields are zero-filled and carried sin signos, and only negative amounts
are preceded by the character N, which displaces the leading digit rather than
claiming a byte. The generator therefore derives the sign from the type column
instead of writing a constant.

The tree must not be republished on the strength of that alone. Publication
checks through the real authority and demands a filing-complete, reviewed
revision, and rewriting shipped filing data is a per-revision decision rather
than a consequence of a code fix.

That per-revision review has now been done and it passed. A fresh render was
diffed field by field against the shipped tree and every field it changes is
one the official type column marks N, with no field changing anything outside
the sign family: 7 fields in 202/2019-2022, 7 in 202/2023-2024, 11 in
202/2025-y-siguientes and 18 in 222/2025-y-siguientes. Zero unexplained changes.

Publication is nevertheless still refused, by something unrelated to the sign,
and for modelo 202 the refusal is an artefact of the publication path rather
than a defect in the declarations.

Republication refuses modelo 202 with twenty-odd semantic-role findings of the
form "appears on exactly one casilla ... likely typo or missing role
declarations on sibling casillas". Those roles are NOT singletons. Each appears
once per revision and three times across the modelo, and the full registry
validates clean. The findings appear because publication stages ONE revision -
`_stage_published_modelo` copies the modelo and deletes every sibling revision -
so a role that repeats across revisions is a singleton in everything the gate
can see. Modelo 202 trips it where others do not because its roles come in
near-twin pairs (aumentos/disminuciones, base_tipo_1/base_tipo_2,
porcentaje_1/porcentaje_2) that the typo heuristic is built to notice.

A singleton-cardinality gate cannot draw a conclusion from a deliberately
partial corpus, and declaring these roles intentional singletons to quiet it
would write a falsehood into the declarations to satisfy a check that is asking
the wrong corpus.

Modelo 222 is refused for a different reason, and it is NOT a defect. The
revision declares 'applicability' authority grade deliberately - its own
declaration records an applicability-grade review of the IS consolidacion
fiscal pago fraccionado - and publication demands a 'calculation' snapshot. So
the refusal is the coverage ladder working: the revision honestly states that
it has not been grounded to calculation grade, and publication declines to
treat it as though it had.

Nothing here should be "fixed" by raising the grade. Promoting an advisory
revision to filing grade to satisfy a downstream consumer is the precise move
that no-silent-under-declaration forbids, and the refusal message names the
grade in a way that makes raising it look like the obvious remedy. It is not.
This tree stays unpublished until the revision is actually grounded to
calculation grade on its own evidence, and if that never happens the tree stays
where it is.
"""
reconsideration_condition = "The sign review is complete and passed; remove this pin once the revision's own blocking declaration defect is resolved - the single-casilla semantic role for modelo 202, the applicability authority grade for modelo 222 - and the tree is republished."

