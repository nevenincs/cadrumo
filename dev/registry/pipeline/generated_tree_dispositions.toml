[[dispositions]]
kind = "type_column_contradiction"
modelo = "390"
revision = "2025"
source_ref = "aeat-dr-390-2025"
source_sha256 = "6d33d8a4245976e55dc31ff85065b420f76d1588110dc1eb541a8039c5e3f252"
derivation_code = "numeric-note-governed-amount-v1"
field_count = 80
reason = """
This tree reproduces. Its shipped bytes are exactly what its current inputs
produce, so there is no drift to correct and republishing changes nothing. The
contradiction is in the inputs: eighty fields are declared unsigned while the
design's type column declares them N.

All eighty render through one note-governed declaration per sheet, and the note
those declarations cite is "Nota 2: estas casillas deben estar rellenas a 0".
That note mandates the VALUE zero. It states nothing about sign, so `unsigned`
is a representation claim the document does not make, exactly as writing a sign
constant was before the generator began reading the type column.

Correcting it to signed is not available today. A signed amount renders through
the `money` wire type, which declares no scale and carries no value domain, so
declaring these fields signed would silently discard the mandated zero the note
does state - trading a wrong sign for a lost constraint. The export schema
cannot carry a closed value domain and a sign on the same field, and neither
reading is fully derivable until it can.

The emitted bytes coincide either way: AEAT writes a non-negative amount with no
sign character, and a mandated zero is non-negative, so the wire form is the
same under both readings. That is why this is a declaration defect rather than a
filing defect, and why it is explained here rather than refused.
"""
reconsideration_condition = """
Remove this row when the export schema can carry a mandated value domain on a
signed field, at which point these eighty fields take the sign their design
states and keep the zero their note mandates. A change in field_count means the
population moved and the row must be re-derived rather than re-dated.
"""
