# Why a published generated export tree does not reproduce from its authored
# inputs today. Every non-reproducing tree carries a row here, and every row
# must name a tree that genuinely does not reproduce: the gate refuses in both
# directions, so a state nobody explained fails, and an explanation that has
# been repaired fails too rather than lingering.
#
# This is not a ratchet. It stores no counts and no ceilings, and shrinking it
# is not the measure of progress; the requirement is that no tree sits in an
# unexplained state. A seventh non-reproducing tree fails the gate whatever the
# other six are doing.
#
# `class` is one of:
#   provenance_only - the record bytes are correct and only the generation
#                     manifest is stale. Safe to republish.
#   record_drift    - the shipped record bytes are not what the current inputs
#                     produce. Republishing ships whatever the inputs now say,
#                     which may be worse than what is there. NOT safe.

