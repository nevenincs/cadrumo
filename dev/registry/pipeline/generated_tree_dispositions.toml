# Why a published generated export tree is UNSAFE to republish today. This
# ledger carries the `record_drift` class only: trees whose shipped record bytes
# are not what the current inputs produce, so regenerating them would ship
# whatever the inputs now say - which may be worse than what is there.
#
# The gate refuses in both directions. A record-drifting tree with no row here
# fails, because an unexplained difference in filing data is exactly what nobody
# notices. A row whose tree has been repaired fails too, so an explanation
# cannot outlive its cause.
#
# Manifest-only staleness is deliberately NOT ledgered. A tree whose records
# reproduce byte-for-byte and differs only in its generation manifest is safe to
# republish, and that state arrives in bulk: any refactor of the generator
# invalidates every manifest at once, twenty-one of them in one sweep on
# 2026-09-03. Twenty-one rows saying "a refactor moved the generator" would be
# churn, not explanation. The gate instead asserts the property that makes the
# class safe - that every such tree really does reproduce its records - and the
# screen reports the population.
#
# This is not a ratchet. It stores no counts and no ceilings, and shrinking it
# is not the measure of progress.

schema_version = 3

[[dispositions]]
kind = "record_drift"
modelo = "347"
revision = "2011-2024"
source_ref = "aeat-dr-347-2011"
source_sha256 = "4cdfb401624e26abe3da3758ddcdcfc85b6b05ffa74e724b2d3f5eeb0c58e809"
reason = """
The shipped declarado record repeats over binding rows and carries nine
binding-kind fields, so one authored row becomes one emitted record. A fresh
render of the current inputs produces neither the repeat nor the binding
fields, which would emit a single declarado record however many counterparties
the declaration has. The official design requires as many type-two records as
the declaration has declarados and inmuebles, so the shipped bytes are correct
and the current inputs are not. This tree must not be republished until the
inputs reproduce the repeat.

The pipeline already refuses a regeneration that would drop this repeat, in
`_tree_check._refuse_repeat_the_candidate_would_drop`, and that refusal names
the three things to author on the map: the record repeat, the binding record,
and the per-row casilla identities. Read it before attempting the repair; it is
the authoritative statement of the remedy and it predates this disposition.
"""
reconsideration_condition = "Remove this pin when the current semantic map reproduces the published binding_rows repeat and all per-row casilla identities."

