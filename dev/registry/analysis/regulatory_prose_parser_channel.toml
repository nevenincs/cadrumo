##
## Declared channel for parsers of official regulatory prose.
##
## The SET is derived mechanically by
## ``dev.registry.analysis.regulatory_prose_parser_channel``; only the corpus and
## the reason are authored here. A module the derivation yields and this ledger
## does not name is a reconciliation failure, so a new grammar over AEAT or BOE
## text cannot ship undeclared.
##
## RULING (registry-temporal-coverage W01.P03.S38): design-prose grammars are
## RETAINED, not migrated into the authoring tree, and the channel is declared
## here instead. Two facts settle it. First, the prose is the outside world's
## and keeps changing: ``no-legacy-compatibility`` explicitly keeps resilience
## for "AEAT portal variations, BOE corpus formats, PDF producer quirks", and a
## one-shot import would delete the ability to onboard the next AEAT design at
## all. Second, the grammar is not where the regulatory value lives: a value a
## grammar derives still lands in the registry authoring tree with its
## establishing provision, under ``aeat-calculation-grounding``. Enrolment here
## authorises READING prose. It authorises no value.
##
## The measured inventory also corrected the row's premise. The objection named
## one generator-side grammar in ``dev/``; the derivation found fifteen modules,
## eleven of them shipped under ``src/`` -- including a 4,600-line record-design
## parser that is the registry's own layout authority. Migrating "the" grammar
## was never the smaller change.
##

[[parser]]
module = "src/cadrumo/domain/calculations/registry/record_design.py"
corpus = "AEAT diseños de registro (PDF and XLSX)"
reason = """\
The registry's own record-design authority. Turns published diseño tables into \
typed position/width/nature facts, absorbing the PDF extraction damage those \
documents arrive with -- reversed rows, stuttered rows, glued ordinals, orphan \
measures. This is the canonical reader; a second one would fork the layout \
authority."""

