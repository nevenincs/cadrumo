[[classification]]
path = "src/cadrumo/domain/calculations/registry/binding_selector_utils.py"
classification = "regulatory_data_embed"
justification = """
Overwhelmingly shared selector-normalisation machinery, but it defines two AEAT
clave vocabularies as Python frozensets: `M349_OPERATION_CLAVES` (E, M, H, A, T,
S, I, R, D, C) and `M347_OPERATION_CLAVES` (A, B, C, D, E, F, G). Each is a
closed code set the law fixes -- the module's own comment grounds them in RD
1065/2007 arts. 31 and 33 and RD 1619/2012 disposicion adicional cuarta, and
records that they are disjoint, the letter A meaning a different thing in each.

That is registry-shaped data: a clave vocabulary is versioned by modelo and
revision exactly as a rate or threshold is, and a new AEAT clave would today be
a source edit. The detector reports no evidence for this module because a
frozenset of single letters matches none of its literal kinds -- decimal,
filing-year, prose -- which is why the embed went unnoticed until the module was
newly derived. The selector normalisation, field validators and export-selector
builders around them are machinery and survive the migration.
"""
destination = "Modelo 347 and Modelo 349 revision clave vocabularies in the registry authoring tree"
tree_ownership = "unowned"
