##
## Adjudication ledger for the derived modelo-specific registry module set.
##
## The SET is derived mechanically by ``dev.registry.modelo_embed_classification``
## from three signals keyed on the core Modelo enum; only the classification and
## its prose are authored here. A module the derivation yields and this ledger
## does not name is a reconciliation failure, so a modelo-specific module added
## later cannot ship unclassified.
##
## classification = "regulatory_data_embed"
##     The module encodes a value the law fixes -- a rate, coefficient,
##     threshold, ejercicio set, applicability condition, or operator-facing
##     prose -- as a Python literal. ``justification`` names EXACTLY which
##     content is the embed, because a module may be part embed and part
##     machinery: the embed content migrates and is deleted, and what remains
##     re-derives as machinery on the next run.
## classification = "machinery"
##     Parsing, projection, dispatch or validation code carrying no regulatory
##     value. Every detected regulatory-literal occurrence must be answered by
##     an ``evidence_disposition`` row, keyed by enclosing symbol, evidence kind
##     and assigned name rather than by line number, so the reader can see why
##     the literal is not regulatory data.
## classification = "dead"
##     Nothing under ``src/cadrumo`` imports the module. No derived module is
##     dead at the time of writing.
##

[meta]
schema_version = 1

[[classification]]
path = "src/cadrumo/domain/calculations/registry/applicability.py"
classification = "regulatory_data_embed"
justification = """
The embed is the _MODELO_APPLICABILITY_RULES table and the reason strings it
draws on (_ATTRIBUTION_PASS_THROUGH_REASON, the four _IMPATRIADO_* strings and
the three _INCOMPLETE_* strings): one ModeloApplicabilityRule literal per
modelo, each encoding who is obliged to file, on what condition, and the
Spanish operator-facing sentence explaining the verdict. Both halves are
registry-shaped data versioned by filing year -- the conditions belong in the
applicability fragment family in the authoring tree, the Spanish sentences in
the locale catalogues. What is NOT the embed, and survives: the rule model, the
evaluation and routing functions, and the dispatch that turns a profile into a
verdict. The 303 and 390 rows queue for the campaign-owned sweep; the rest
migrate first, so the literal-carrying mechanism itself can only be removed
once both halves have landed.
"""
destination = "registry applicability fragment family; Spanish verdict prose to the locale catalogues"
tree_ownership = "mixed"

[[classification]]
path = "src/cadrumo/domain/calculations/registry/applicability_modelo202.py"
classification = "regulatory_data_embed"
justification = """
The whole module is the Modelo 202 modalidad rule: which pago-fraccionado
modality applies is fixed by LIS art. 40.2 and art. 40.3, and the four reason
constants carry the Spanish operator-facing sentences that cite them. Both the
condition and its prose are the applicability data the registry authoring tree
owns. Nothing here is generic machinery -- the module exists only to state this
one modelo's rule -- so it migrates whole and is then deleted.
"""
destination = "registry applicability fragment family; Spanish modality prose to the locale catalogues"
tree_ownership = "unowned"

