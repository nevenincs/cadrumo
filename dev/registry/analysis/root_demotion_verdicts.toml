# Root-demotion verdicts, keyed by (modelo, predecessor, successor).
#
# Written by the session that ran the harness, from its machine-readable results. Each entry
# records what a PER-FAMILY materialisation comparison found when the edition's none-root was
# replaced by predecessor = <prior edition> IN A THROWAWAY COPY. Nothing here was written to the
# registry; every copy was first proved to load to a digest identical to the real tree.
#
# A DISCHARGED ROOT REASON IS NOT A SAFE DEMOTION. The reason being false says the root is no
# longer JUSTIFIED; this file says whether the edition can be MATERIALISED from its predecessor.
# Those are separate facts and the second decides. Five editions whose reason was equally false
# were given official_structure_differs instead of being demoted, on exactly this evidence.
#
# verdict: proven_free    = every family byte-identical AND no reviewed_against wall
#          needs_attestation = every family byte-identical, but the successor is agent_reviewed
#                              without reviewed_against, which is a HUMAN attestation
#          proven_drifts  = at least one family differs; first differing key recorded
#          refused        = the demoted tree does not load; the validator message is recorded
#
# measured_at is load-bearing: a verdict is true of the corpus AT THAT INSTANT. Re-run before
# acting on one older than the edition's own mtime.

