# ---------------------------------------------------------------------------
# Coordinate-level cells, grounded against the periodo de liquidacion rules in
# the norm that governs each modelo and the hash-verified AEAT record designs.
#
# Two opposite outcomes sit below and the grounds differ by classification. The
# 'unauthored' cells name a period the governing norm demonstrably admits in
# that year, so a positive source settles them: the design AEAT published for
# that exact coordinate, or the orden fixing the first period a replacement
# design applies to, which proves the period before it was filed under the
# design it replaced. The 'inception' cells assert a negative -- that the
# coordinate never legally existed -- so only a norm is cited: RD 1624/1992
# art. 71 apartado 3 defines modelo 303's periodo de liquidacion exhaustively
# as the trimestre natural, or the mes natural for the taxpayers it lists, and
# Orden EHA/3786/2008 art. 7 sets a plazo for those two regimes and no other.
# Modelo 303 therefore has no annual periodo de liquidacion in any year; the
# annual instrument of art. 71 apartado 7 is the declaracion-resumen anual,
# which is modelo 390 and a different modelo entirely.
# ---------------------------------------------------------------------------

[[disposition]]
modelo = "303"
filing_year = 2022
period = "01"
kind = "promised_coordinate_unserved"
classification = "unauthored"
reason = "Monthly periodo de liquidacion existed for modelo 303 in 2022 under RD 1624/1992 art. 71 apartado 3, and the hash-verified AEAT design for this ejercicio admits it: its Periodo (PP) field takes 01 through 12 or 1T through 4T, and its Nota 4 states the design must be used for the presentations of every periodo of 2022. The revision declares only the quarterly tokens, so the monthly cell is authoring debt, not a legal absence."
authority = "aeat-dr-303-2022 (sha256 6648f6b3..., Periodo (PP) field and Nota 4); rd-1624-1992:art-71; orden-eha-3786-2008:art-7"

