[[disposition]]
modelo = "038"
filing_year = 2024
period = "01"
kind = "promised_coordinate_unserved"
classification = "unauthored"
reason = "Modelo 038 has been a monthly informative declaration since 2002: Orden HAC/66/2002 art. 6 requires it during each mes natural for the inscripciones authorised in the immediately preceding month, and supplies no exception for the early months of a year. The reason the corpus opens at periodo 06 of 2024 is Orden HAC/646/2024, whose disposicion final unica applies the new design for the first time to the declaration for June 2024, filed in July 2024. That proves January to May 2024 were filed under the design it replaced, which the corpus deliberately holds as an inspection receipt rather than selectable authority. The coordinate exists and no revision was authored for it."
authority = "orden-hac-66-2002:art-6 (BOE-A-2002-1041); orden-hac-646-2024:df-unica (BOE-A-2024-13049)"

