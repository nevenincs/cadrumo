reason = "Monthly periodo de liquidacion existed for modelo 303 in 2022 under RD 1624/1992 art. 71 apartado 3, and the hash-verified AEAT design for this ejercicio admits it: its Periodo (PP) field takes 01 through 12 or 1T through 4T, and its Nota 4 states the design must be used for the presentations of every periodo of 2022. The revision declares only the quarterly tokens, so the monthly cell is authoring debt, not a legal absence."
authority = "aeat-dr-303-2022 (sha256 6648f6b3..., Periodo (PP) field and Nota 4); rd-1624-1992:art-71; orden-eha-3786-2008:art-7"

[[disposition]]
modelo = "303"
filing_year = 2022
period = "0A"
kind = "promised_coordinate_unserved"
classification = "inception"
reason = "Modelo 303 has no annual periodo de liquidacion. RD 1624/1992 art. 71 apartado 3 defines it exhaustively as the trimestre natural, or the mes natural for the taxpayers it lists, and Orden EHA/3786/2008 art. 7 fixes a plazo for those two regimes only. The annual instrument of art. 71 apartado 7 is the declaracion-resumen anual, a separate modelo. The AEAT record designs agree: the Periodo (PP) field admits 01 through 12 or 1T through 4T in the 2022, 2025 and 2026 designs alike, and the last periodo is named throughout as 12 y 4T. The 0A token is real AEAT vocabulary for annual modelos, but it is not a modelo 303 periodo in any year; it reaches this denominator only because the 2025 revision period_selector states it, unbacked by any filing_schedule, deadline window or casilla of that same revision."
authority = "rd-1624-1992:art-71 (apartado 3); orden-eha-3786-2008:art-7 (BOE-A-2008-20953)"

