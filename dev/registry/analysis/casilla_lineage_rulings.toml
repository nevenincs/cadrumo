[[ruling]]
modelo = "220"
predecessor = "2024"
successor = "2025"
rationale = "Both editions are emitted from AEAT's own diseno de registro for their ejercicio, aeat-dr-220-2024 and aeat-dr-220-2025, and every pair below shares its casilla identifier, its printed box number AND its record segmento across the boundary. The 2025 edition models six settlement records of the design's 141; the 1,702 predecessor rows absent from it are records that edition does not model, NOT boxes AEAT retired, so nothing is declared discontinued. The 45 successor rows with no predecessor are left for the oracle: 36 are the liquidacion (III) record the 2024 edition withheld because boxes 02796 and 02797 carry byte-identical descriptions, and 9 are the tramo slots of liquidacion (I), which grew 71 bytes inside its own run so that three unnumbered ids whose number IS a position range moved and six slots are new. The two declaration-header casillas already carry a continuidad_id on both editions and are deliberately not named here."
