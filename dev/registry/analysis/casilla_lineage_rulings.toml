successor = "2024-y-siguientes"
rationale = "Orden HAC/56/2024 split each measure into dividendos, resto and totales columns, inserting six boxes ahead of the liquidacion tail; the same official sentence names boxes 06 and 08 in the predecessor formulas and 12 and 14 in the successor formulas."
