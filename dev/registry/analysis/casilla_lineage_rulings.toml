# Adjudicated casilla-lineage rulings, applied by casilla_lineage_seed.py.
#
# Each ruling settles a boundary the mechanical predicate cannot: an identifier
# space reassigned under insertion, a redesign that renumbered boxes, or an
# identifier derived from label text. The seeder applies a ruling verbatim and
# derives the evidence it writes from the pinned official record designs, so a
# ruling names WHAT the correspondence is and the design shows WHERE.
#
# Pairs are written `predecessor>successor`. `grounded` pairs are proven
# continuations; `new_on_form` rows had no predecessor on the form;
# `not_on_form` rows are product concepts no official form prints. `held`,
# `withheld` and `merged` pairs are recorded in the ledger and never written.

