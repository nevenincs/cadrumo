[[ruling]]
modelo = "036"
predecessor = "2023-hasta-2025-02-02"
successor = "2025-02-03-y-siguientes"
rationale = "Both editions are emitted from AEAT's own diseno de registro for their era and print the same box number for the same concept: aeat-dr-036-2023 governs 2023-01-01 to 2025-02-02 and aeat-dr-036-2025 opens 2025-02-03, the day Orden HAC/1526/2024 suppressed the modelo 037. Every pair below shares BOTH its casilla identifier and its printed number across the boundary, with no renumbering and no box retired: 508 of the predecessor's 508 rows continue, and none is discontinued. The successor's 198 further rows are left for the seeder to classify from the designs rather than asserted here, because the predecessor edition collapses AEAT's repeated blocks to one casilla per printed number -- the design prints 800, 801, 818 and 859 four times each, once per repetition of the socio block -- so part of that delta is the predecessor edition declaring once what the design prints four times, which is not the same fact as a box being new on the form. The eighteen suc-a..suc-f nombre/porcentaje/cuota pairs were added after the predecessor edition was found short of them: the bundled 2023 extract prints boxes 921-943 with the opening bracket missing -- 921] where the sheet prints [921] -- so the wave's number grammar derived no number, the rows fell to positional slot ids, and they were swept into the declined set where they read as a scope decision rather than the extraction artefact they are. Both designs print all twenty-four of 920-943 at identical offsets, lengths and captions, and the successor declares all twenty-four, so these are grounded on design parity exactly as the other 508 are. Two further pairs, A1 and A38 on Pag. 2A, were added for the same reason by a different malformation: A1 at @11 is printed [A1), opened and closed with a parenthesis, and A38 at @1033 is printed [ A38] with a leading space inside an otherwise intact bracket. Both print identically in the 2023 and 2025 designs and both are declared by the successor, so they carry at design parity like the rest. The grammar was deliberately not loosened to admit them: every loosening that reads A1 or A38 also reads the tail of [330 332] on Pag. 3, where one byte carries several numbers and must keep a positional slug. The last two pairs are the renumbering itself: this design prints [A3A] and [B3A] where the successor declares A3B and B3B, and the rows are emitted under their own design's number while carrying the successor's attributes. The renumbering is proven from the corpus holding TWO files for the 2025 edition -- a provisional that still prints A3A and B3A, and a final that prints A3B and B3B at the same offsets, lengths, type and captions. The label changes inside one edition's own publication cycle, which a replacement cannot do."
