[[legal."ley-37-1992:art-163-octiesdecies"]]
language = "es"
text = "ámbito del régimen exterior para empresarios o profesionales no establecidos en la Comunidad."

[[legal."ley-37-1992:art-163-quinvicies"]]
language = "es"
text = "ámbito del régimen de importación para ventas a distancia de bienes importados de paises o territorios terceros."

[[legal."ley-37-1992:art-163-quaterdecies"]]
language = "es"
text = "efectos de renuncia o exclusion del régimen especial del criterio de caja sobre operaciones efectuadas durante su vigencia."

[[legal."ley-37-1992:art-79"]]
language = "es"
text = "reglas especiales de base imponible para las operaciones asimiladas a entregas de bienes (autoconsumo). La base imponible del autoconsumo es el coste de los bienes o servicios utilizados, incluidos los gastos de personal, con exclusion del beneficio industrial."

[[legal."ley-37-1992:art-88"]]
language = "es"
text = "repercusion del impuesto. Establece la obligación del sujeto pasivo de repercutir integramente el importe del IVA sobre el destinatario de la operación gravada, quedando este obligado a soportarlo."

[[legal."ley-37-1992:art-9"]]
language = "es"
text = "operaciones asimiladas a las entregas de bienes (autoconsumo). El apartado 1.c establece el autoconsumo del promotor cuando afecta a su patrimonio empresarial o profesional bienes inmuebles de su propia construcción o rehabilitacion. La base imponible se determina conforme al art 79 apartado 4."

[[legal."ley-37-1992:art-90"]]
language = "es"
text = "tipo impositivo general del IVA. Establece que el Impuesto se exigira al tipo del 21 por ciento, salvo lo dispuesto en el articulo 91 (tipos reducidos). El tipo aplicable a cada operación sera el vigente en el momento del devengo (art 90 Dos)."

[[legal."ley-37-1992:art-91"]]
language = "es"
text = "tipos impositivos reducidos. Apartado Uno establece el tipo reducido del 10 por ciento aplicable a determinadas operaciones (productos para la nutricion humana, agua, medicamentos, viviendas, transporte de viajeros, hosteleria, etc.). Apartado Dos establece el tipo super-reducido del 4 por ciento para productos basicos (pan, leche, frutas, libros, medicamentos especificos, etc.) y operaciones para colectivos en riesgo de exclusion."

[[legal."ley-37-1992:art-122"]]
language = "es"
text = "régimen simplificado del IVA. Seran de aplicación a los sujetos pasivos que reglamentariamente se determinen en atencion al volumen de operaciones u otras circunstancias."

[[legal."ley-37-1992:art-123"]]
language = "es"
text = "contenido del régimen simplificado. Determinación de las cuotas tributarias para las actividades acogidas al régimen simplificado mediante el método de indices, módulos o signos."

[[legal."ley-27-2014:art-21"]]
language = "es"
text = "exención sobre dividendos y rentas derivadas de la transmisión de valores representativos de los fondos propios de entidades residentes y no residentes en territorio espanol."

[[legal."ley-27-2014:art-22"]]
language = "es"
text = "exención de las rentas obtenidas en el extranjero a traves de un establecimiento permanente. Establece la exención para rentas positivas obtenidas por EPs no residentes cuando el EP haya estado sujeto al impuesto extranjero a un tipo nominal de al menos el 10 por ciento, junto con la exención en transmisión o cese del EP. Las rentas negativas no se integran salvo en caso de cese (con minorizacion por rentas positivas previamente exentas o deducidas). Base sustantiva de las correcciones por rentas-EP-no-residente en M200."

[[legal."ley-27-2014:art-26"]]
language = "es"
text = "compensación de bases imponibles negativas. Establece el limite del 70 por ciento de la base imponible previa para la compensación de BINs con rentas positivas de ejercicios siguientes, con suelo absoluto de 1 millon de euros y plazo de prescripción de 10 anios para la facultad de comprobación."

[[legal."ley-27-2014:art-29"]]
language = "es"
text = "el tipo de gravamen. Establece los tipos del Impuesto sobre Sociedades: 25 por ciento general; escala micro-empresa 17 por ciento (0-50.000) / 20 por ciento (resto); cooperativas fiscalmente protegidas -3 pp; entidades sin fines lucrativos 10 por ciento; nuevas creación 15 por ciento (primeros dos ejercicios); entidades de crédito y exploracion de hidrocarburos 30 por ciento."

[[legal."ley-27-2014:art-30"]]
language = "es"
text = "cuota integra. Define la cuota integra como la cantidad resultante de aplicar a la base imponible el tipo de gravamen del articulo 29, con regla de proporcionalidad para periodos impositivos de duración inferior al anio. La definición sustantiva del Impuesto sobre Sociedades reside en este articulo."

[[legal."ley-27-2014:art-32"]]
language = "es"
text = "deducción para evitar la doble imposición económica internacional - dividendos y participaciones en beneficios. Permite deducir el impuesto efectivamente pagado por la entidad no residente sobre los beneficios distribuidos como dividendos, condicionado a participación minima del 5 por ciento mantenida ininterrumpidamente durante un anio y a la inclusion de la cuantía en la base imponible."

[[legal."ley-27-2014:art-36"]]
language = "es"
text = "deducción por inversiones en producciones cinematograficas, series audiovisuales y espectaculos en vivo de artes escenicas y musicales. Establece las tasas de deducción (30 por ciento primer millon de base, 25 por ciento exceso), los limites por producción y episodio (20M / 10M EUR), el requisito de gasto territorial espanol (50 por ciento de la base) y el sub-regimen de productor/financiacion (la letra que M200 cita como art-36.1 y 36.3 para entidades cofinanciadoras)."

[[legal."ley-27-2014:art-45"]]
language = "es"
text = "uniones temporales de empresas. Las UTE reguladas en la Ley 18/1982 e inscritas en el registro especial tributan con arreglo al art. 43 (agrupaciones de interes economico espanolas), salvo la regla de valoración del segundo parrafo del apartado 4 de ese articulo. Funda la seccion del Modelo 200 cuyo tag nombra el art. 45.1."

[[legal."ley-27-2014:art-102"]]
language = "es"
text = "libertad de amortización de las entidades de reducida dimension. Los elementos nuevos del inmovilizado material y de las inversiones inmobiliarias afectos a actividades económicas pueden amortizarse libremente siempre que, durante los periodos que la norma fija, la plantilla media total se incremente respecto de la de los doce meses anteriores y ese incremento se mantenga. Funda la seccion empresas_de_reducida_dimension_libertad_de_amortizacion del Modelo 200."

[[legal."ley-27-2014:dt-44"]]
language = "es"
text = "régimen transitorio del tipo de gravamen de las microempresas cuyo INCN del período inmediato anterior es inferior a 1 millón de euros, sobre la escala del art. 29.1 LIS; ejercicios iniciados en 2025 (21% / 22%) y 2026 (19% / 21%). También fija el tránsito de entidades de reducida dimensión que cumplen el art. 101 LIS: 24% en 2025, 23% en 2026, 22% en 2027 y 21% en 2028, salvo tipo especial distinto del general."

[[legal."ley-27-2014:art-105"]]
language = "es"
text = "reserva de nivelacion de bases imponibles. Permite a las entidades que cumplen las condiciones del articulo 101 (cifra de negocios inferior a 10 millones de euros) y aplican el tipo general minorar su base imponible positiva hasta el 10 por ciento de su importe, con tope de 1 millon de euros, computada también a efectos de pagos fraccionados (art 40.3) e incompatible con la reserva de capitalización del articulo 25."

[[legal."ley-27-2014:art-15"]]
language = "es"
text = "gastos no deducibles. Enumera los gastos que la LIS expresamente excluye de la deducibilidad fiscal: retribucion de fondos propios (incluidos prestamos participativos intra-grupo), IS contabilizado, multas y sanciones, recargos del periodo ejecutivo y extemporaneos, perdidas del juego, donativos y liberalidades (con excepción de atenciones a clientes limitadas al 1 por ciento del INCN), actuaciones contrarias al ordenamiento juridico, gastos con paraisos fiscales. Base sustantiva de las correcciones positivas al resultado contable en M200."

[[legal."ley-27-2014:art-16"]]
language = "es"
text = "limitacion en la deducibilidad de gastos financieros. Establece el limite del 30 por ciento del beneficio operativo del ejercicio para los gastos financieros netos deducibles, con un suelo absoluto de 1 millon de euros y traslado a los cinco anios siguientes del exceso no aplicado del limite."

[[legal."ley-27-2014:art-100"]]
language = "es"
text = "Transparencia Fiscal Internacional. Imputación de rentas positivas obtenidas por entidades no residentes y establecimientos permanentes cuando el contribuyente tenga (solo o con vinculadas art-18) participación igual o superior al 50 por ciento Y el gravamen extranjero sea inferior al 75 por ciento del que hubiera correspondido en Espana. Base sustantiva de la imputacion-rentas-positivas-art-100-LIS section de M200."

[[legal."ley-35-2006:art-35"]]
language = "es"
text = "transmisiones a título oneroso — el valor de adquisición (importe real + inversiones/mejoras + gastos y tributos inherentes, menos amortizaciones) y el valor de transmisión (importe real menos gastos y tributos inherentes a cargo del transmitente). Base legal del cálculo de ganancia/pérdida por transmisión onerosa en Modelo 100."

[[legal."ley-35-2006:art-36"]]
language = "es"
text = "LIRPF art 36: transmisiones a título lucrativo — se aplican las reglas del art. 35 tomando por importe real los valores del Impuesto sobre Sucesiones y Donaciones (sin exceder el valor de mercado)."

[[legal."ley-35-2006:art-64"]]
language = "es"
text = "especialidades aplicables en los supuestos de anualidades por alimentos a favor de los hijos satisfechas por decisión judicial — la escala se aplica separadamente al importe de las anualidades y al resto de la base liquidable general. Base legal de las casillas de anualidades por alimentos en Modelo 100 (junto con el art. 75 para la parte autonómica)."

[[legal."ley-35-2006:art-68.3"]]
language = "es"
text = "Deducciones por donativos y otras aportaciones."

[[legal."ley-35-2006:art-80"]]
language = "es"
text = "deducción por doble imposición internacional para rendimientos o ganancias patrimoniales obtenidos y gravados en el extranjero."

[[legal."ley-35-2006:art-93-ahorro"]]
language = "es"
text = "LIRPF Art. 93.2.e).2.º — escala del ahorro del régimen especial de impatriados (Modelo 151): a la parte de la base liquidable correspondiente a las rentas del art. 25.1.f) TRLIRNR (dividendos, intereses, ganancias patrimoniales del ahorro) se le aplica la escala progresiva del ahorro."

[[legal."ley-35-2006:art-95"]]
language = "es"
text = "tributación de los socios o partícipes de las instituciones de inversión colectiva constituidas en países o territorios considerados como paraísos fiscales. Base legal de las casillas del régimen especial de imputación por IIC en paraísos fiscales en Modelo 100."
