[[legal."orden-eha-3290-2008:art-1"]]
language = "es"
text = "Orden EHA/3290/2008 art 1: aprobación del modelo 216, Impuesto sobre la Renta de no Residentes, rentas obtenidas sin mediación de establecimiento permanente, retenciones e ingresos a cuenta, declaracion-documento de ingreso."

[[legal."orden-eha-3290-2008:art-11"]]
language = "es"
text = "sera el comprendido entre el 1 de enero y el 31 de enero del ano siguiente al que corresponde la declaración anual."

[[legal."orden-eha-3290-2008:art-4"]]
language = "es"
text = "Orden EHA/3290/2008 art 4: plazo de presentación del modelo 216. Con caracter general (trimestral), la presentación e ingreso se efectua en los veinte primeros días naturales de los meses de abril, julio, octubre y enero por el trimestre natural inmediato anterior. Para grandes empresas, mensual, en los veinte primeros días naturales de cada mes."

