[[legal."orden-hfp-886-2023:art-2"]]
language = "es"
text = "Orden HFP/886/2023 art 2: obligados a presentar el Modelo 721. Personas físicas y jurídicas, y entidades del art 35.4 LGT, residentes en territorio español que posean monedas virtuales en el extranjero a través de custodio extranjero cuyo valor agregado supere 50.000 EUR a 31 de diciembre."

[[legal."orden-hfp-886-2023:art-3"]]
language = "es"
text = "Orden HFP/886/2023 art 3: contenido del Modelo 721. Remite al anexo de la orden y al art. 42 quater RGAT para la información sobre monedas virtuales situadas en el extranjero."

[[legal."orden-hfp-886-2023:art-4"]]
language = "es"
text = "Orden HFP/886/2023 art 4: plazo de presentación del Modelo 721, entre el 1 de enero y el 31 de marzo del año siguiente al ejercicio al que se refiera la información."

[[legal."rd-1065-2007:art-10"]]
language = "es"
text = "RGAT art 10: declaración de modificación en el Censo. Base reglamentaria del flujo de modificación del Modelo 036 (cambio de domicilio fiscal, variación de datos censales, inicio de actividad)."

[[legal."rd-1065-2007:art-11"]]
