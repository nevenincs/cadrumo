[[legal."rd-1619-2012:art-6.1.i"]]
language = "es"
text = "RD 1619/2012 art 6.1.i: fecha de operación y de pago anticipado cuando difieren de la de expedición. Fundamenta los roles OPERATION_PERFORMED y ADVANCE_PAYMENT_RECEIVED."

[[legal."rd-1624-1992:art-29"]]
language = "es"
text = "Reglamento del IVA art 29: forma de las devoluciones de oficio vinculadas al artículo 115 LIVA."

[[legal."rd-1624-1992:art-30"]]
