[[legal."orden-hfp-1351-2021:art-quinto"]]
language = "es"
text = "Articulo quinto de la Orden HFP/1351/2021: modifica el anexo III de la Orden EHA/3290/2008 (registro de tipo 2 del modelo 296: subclave, ingresos a cuenta repercutidos en 389-401, blancos en 402-432). Aplicable por primera vez a las declaraciones de 2021; es la redacción vigente para el ejercicio 2022."

[[legal."trlirnr-rdleg-5-2004:art-2"]]
language = "es"
text = "TRLIRNR art 2: ámbito de aplicación territorial del impuesto. Incluye salvedad de los regimenes forales (Pais Vasco, Navarra) y especialidades de Canarias, Ceuta y Melilla. Fundamento territorial para la atribución de obligación IRNR a contribuyentes no residentes que obtienen rentas con fuente en territorio espanol."

[[legal."trlirnr-rdleg-5-2004:art-24"]]
language = "es"
text = "TRLIRNR art 24: base imponible para contribuyentes que obtienen rentas sin mediación de establecimiento permanente. Apartado 1 fija la regla general (importe integro según LIRPF, sin porcentajes multiplicadores ni reducciones). Apartado 2 establece la base por diferencia para prestaciones de servicios y actividades económicas en Espana. Apartado 6 permite a residentes UE/EEE deducir gastos vinculados directamente a la renta obtenida en Espana. Fundamento de la base imponible M210 casillas rendimiento_integro y gastos_deducibles."

[[legal."trlirnr-rdleg-5-2004:art-25.1.a"]]
language = "es"
text = "TRLIRNR art 25.1.a: tipo de gravamen general 24 por ciento para rentas obtenidas sin mediación de establecimiento permanente."

[[legal."trlirnr-rdleg-5-2004:art-25.1.a"]]
language = "es"
text = "El mismo apartado fija un tipo reducido del 19 por ciento cuando el contribuyente es residente en otro Estado miembro de la UE o del EEE con efectivo intercambio de información tributaria, lo que motiva la fila tipo_renta=ue_residente del parametro "

[[legal."trlirnr-rdleg-5-2004:art-25.1.a"]]
language = "es"
text = "Los valores numericos vigentes son consolidados a partir de varias reformas posteriores al RDLeg 5/2004 original."

[[legal."trlirnr-rdleg-5-2004:art-25.1.b"]]
language = "es"
text = "TRLIRNR art 25.1.b: escala especial para pensiones y prestaciones similares percibidas por personas fisicas no residentes."

[[legal."trlirnr-rdleg-5-2004:art-25.1.f"]]
language = "es"
text = "TRLIRNR art 25.1.f: tipo de gravamen del 19 por ciento aplicable por clase de renta a dividendos, intereses y otros rendimientos de capitales propios, y ganancias patrimoniales por transmisión de elementos patrimoniales."

[[legal."trlirnr-rdleg-5-2004:art-25.1.f"]]
language = "es"
text = "No contiene condicion de residencia UE/EEE; esa condicion pertenece al tipo general reducido de art 25.1.a."

[[legal."trlirnr-rdleg-5-2004:art-25.1.f"]]
language = "es"
text = "Soporte legal de las filas tipo_renta=dividend, tipo_renta=interest y tipo_renta=ganancia_patrimonial del parametro "

