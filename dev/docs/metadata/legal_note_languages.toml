# Documentation-only reviewed language annotations; exact note substrings.
version = 1

[[legal."ley-11-2021:da-10"]]
language = "es"
text = "Disposición adicional décima de la Ley 11/2021: introduce la obligación informativa de monedas virtuales en el extranjero como letra d de la DA-18 de la LGT. Habilita el desarrollo reglamentario que desemboca en el Modelo 721. Es el HABILITANTE; la obligación operativa es ley-58-2003:da-18 letra d."

[[legal."ley-35-2006:art-1"]]
language = "es"
text = "LIRPF art. 1: naturaleza del IRPF (tributo personal y directo sobre la renta)."

[[legal."ley-35-2006:art-101"]]
language = "es"
text = "LIRPF art 101: importe de los pagos a cuenta. Base sustantiva del régimen de tipos de retención para rendimientos del trabajo (escala personalizada 19/24/30/37/45/47 por ciento), administradores y consejeros (35 por ciento, 19 por ciento para entidades de cifra de negocios inferior a 100.000 euros), atrasos imputados a ejercicios anteriores (15 por ciento), y reducción del 60 por ciento para rendimientos de Ceuta o Melilla amparados en la deducción del art 68.4. Espejo legal del artículo 80 RIRPF que desarrolla el procedimiento."

[[legal."ley-35-2006:art-103"]]
language = "es"
text = "LIRPF art 103: devolución derivada de la normativa del tributo. Establece que cuando la suma de retenciones, ingresos a cuenta, pagos fraccionados y deducciones art 81 / 81 bis supera la cuota resultante de la autoliquidación, la Administración práctica liquidación provisional en seis meses y devuelve de oficio el exceso. Base sustantiva del Modelo 100 casilla 0670 (resultado de la declaración) cuando es a devolver."

[[legal."ley-35-2006:art-14.2.m"]]
language = "es"
text = "LIRPF art 14.2.m: imputación temporal de rendimientos del trabajo en especie por entrega de acciones o participaciones de empresa emergente que cumplen art 42.3.f pero no están exentos por superar la cuantía prevista. Se imputan al admitirse a negociación, salir del patrimonio del contribuyente, o cumplirse el plazo de diez años."

[[legal."ley-35-2006:art-16"]]
language = "es"
text = "LIRPF art 16: métodos de determinación de la base imponible. Nombra la estimación directa como método general y declara sus dos modalidades, normal y simplificada, que es exactamente lo que irpf-regime-vocabulary cita para directa_normal y directa_simplificada. El artículo remite al 28 para el cálculo del rendimiento, de ahí que ambos se citen juntos."

[[legal."ley-35-2006:art-27"]]
language = "es"
text = "LIRPF art 27: define los rendimientos íntegros de actividades económicas por la ordenación por cuenta propia de medios de producción o recursos humanos y concreta el arrendamiento de inmuebles como actividad económica cuando existe al menos una persona empleada a jornada completa."

[[legal."ley-35-2006:art-28"]]
language = "es"
text = "LIRPF art 28: fija las reglas generales de cálculo del rendimiento neto de actividades económicas, remitiendo a las normas del Impuesto sobre Sociedades y separando las ganancias o pérdidas de elementos patrimoniales afectos."

[[legal."ley-35-2006:art-30"]]
language = "es"
text = "LIRPF art 30: regula la determinación del rendimiento neto de actividades económicas por estimación directa, sus modalidades normal y simplificada, y reglas especiales de gastos deducibles."

[[legal."ley-35-2006:art-31"]]
language = "es"
text = "LIRPF art 31: regula la determinación del rendimiento neto en estimación objetiva, su renuncia o exclusión, sus límites reglamentarios y el uso de signos, índices o módulos."

[[legal."ley-35-2006:art-32"]]
language = "es"
text = "LIRPF art 32: regula las reducciones aplicables a determinados rendimientos netos de actividades económicas, incluidos rendimientos irregulares, reducciones por requisitos reglamentarios y reducción por inicio de actividad en estimación directa."

[[legal."ley-35-2006:art-33"]]
language = "es"
text = "LIRPF art 33: define el concepto de ganancias y pérdidas patrimoniales, identifica supuestos sin alteración patrimonial, exenciones y pérdidas no computables. Base legal de la fundación de ganancias y pérdidas patrimoniales en Modelo 100."

[[legal."ley-35-2006:art-34"]]
language = "es"
text = "LIRPF art 34: fija la norma general para calcular el importe de ganancias o pérdidas patrimoniales por diferencia entre valores de adquisición y transmisión, o por valor de mercado en otros supuestos."

[[legal."ley-35-2006:art-37"]]
language = "es"
text = "LIRPF art 37: fija normas especificas de valoración de ganancias y pérdidas patrimoniales para valores cotizados/no cotizados, instituciones de inversión colectiva, aportaciones no dinerarias, permutas y otros supuestos."

[[legal."ley-35-2006:art-42.3.f"]]
language = "es"
text = "LIRPF art 42.3.f: exención de rendimientos del trabajo en especie por entrega gratuita o bajo precio de acciones o participaciones a trabajadores en activo, con límite general de 12.000 euros anuales y límite de 50.000 euros anuales para empresas emergentes."

[[legal."ley-35-2006:art-57"]]
language = "es"
text = "LIRPF art 57: mínimo del contribuyente. Establece el mínimo personal del contribuyente con caracter general (5.550 euros anuales), con incrementos por edad: +1.150 euros anuales para contribuyentes mayores de 65 años, y +1.400 euros adicionales para mayores de 75 años. Base sustantiva de las casillas del mínimo-del-contribuyente de Modelo 100 (0511 y similares)."

[[legal."ley-35-2006:art-58"]]
language = "es"
text = "LIRPF art 58: mínimo por descendientes. 2.400 euros por el primero, 2.700 por el segundo, 4.000 por el tercero, 4.500 por el cuarto y siguientes. Incremento de 2.800 euros por descendiente menor de 3 años."

[[legal."ley-35-2006:art-59"]]
language = "es"
text = "LIRPF art 59: mínimo por ascendientes. 1.150 euros por ascendiente mayor de 65 años o con discapacidad, 1.400 euros adicionales por ascendiente mayor de 75 años."

[[legal."ley-35-2006:art-7-h"]]
language = "es"
text = "LIRPF art 7.h: rentas exentas — prestaciones públicas por maternidad y paternidad reconocidas por la Seguridad Social (INSS) y por las Comunidades Autonomas. Las prestaciones de la Seguridad Social por baja de maternidad y paternidad son integras del IRPF (art 7.h ley 35/2006, en vigor tras la STC 207/2013 que declaro inconstitucional la exención para funcionarios). Desde 2018 la exención vuelve para todos los contribuyentes. El importe de estas prestaciones NO debe incluirse en la casilla 0003 (Retribuciones dinerarias) ya que no constituye rendimiento de trabajo tributable conforme al art 17."

[[legal."ley-35-2006:art-79"]]
language = "es"
text = "LIRPF art 79: cuota diferencial. Define el resultado de minorar la suma estatal + autonomica por las deducciones siguientes: doble imposición internacional (art 80), deducciones art 91.10 y 92.4, retenciones art 99.11 y 99.8, cuotas IRNR por cambio de residencia, retenciones y pagos fraccionados. Base sustantiva del Modelo 100 casilla 0610 (cuota diferencial) y 0595 (cuota resultante de la autoliquidación)."

[[legal."ley-35-2006:art-81"]]
language = "es"
text = "LIRPF art 81: deducción por maternidad. Establece la deducción de hasta 1.200 euros anuales por cada hijo menor de tres años para madres trabajadoras, con incremento de hasta 1.000 euros por gastos en guarderias. Base sustantiva del Modelo 100 casillas 0611 (deducción), 0612 (abono anticipado), 0613 (incremento guarderias)."

[[legal."ley-35-2006:art-81-bis"]]
language = "es"
text = "LIRPF art 81 bis: deducciones por familia numerosa o personas con discapacidad a cargo. Establece deducciones de hasta 1.200 euros anuales por: descendiente con discapacidad (a), ascendiente con discapacidad (b), familia numerosa o ascendiente separado legalmente con dos hijos (c), conyuge con discapacidad (d). Base sustantiva del Modelo 100 casillas 0623/0624 (descendiente), 0636/0637 (ascendiente), 0248/0249 (conyuge), 0660/0661 (familia numerosa), 0662/0663 (ascendiente separado), 0664/0666 (regularización)."

[[legal."ley-35-2006:art-85"]]
language = "es"
text = "LIRPF art 85: imputación de rentas inmobiliarias. Tipo general 2 por ciento del valor catastral; tipo reducido 1,1 por ciento cuando los valores catastrales hayan sido revisados en el período impositivo o en los diez períodos impositivos anteriores."

[[legal."ley-35-2006:art-93"]]
language = "es"
text = "LIRPF Art. 93 — régimen especial aplicable a los trabajadores desplazados a territorio español. Permite optar por tributar por IRNR durante el período impositivo del desplazamiento y los cinco siguientes. Desarrollado por RD 439/2007 (RIRPF) Art. 113-120 y presentado mediante Modelo 151 (Orden EHA/2887/2008)."

[[legal."ley-35-2006:art-93-2015"]]
language = "es"
text = "LIRPF Art. 93 en la redacción del art. 1.59 de la Ley 26/2014, de 27 de noviembre (BOE-A-2014-12327), en vigor desde el 1-1-2015 hasta que el art. 61 de la Ley 11/2020 modifica las letras e) y f) del apartado 2 con efectos 1-1-2021 (ley-35-2006:art-93-ahorro-2021). Escala del número 1.º de la letra e): 24% hasta 600.000 euros y 45% desde 600.000,01 en adelante. Escala del número 2.º: 19% hasta 6.000 (cuota 0), 21% hasta 50.000 (cuota 1.140) y 23% en adelante (cuota 10.380). Para el período impositivo 2015 ambas escalas las sustituye la disposición adicional trigésima primera (ley-35-2006:da-31), de modo que esta redacción rige las escalas de los ejercicios 2016 a 2020. Capturada del texto consolidado en la versión que el selector de BOE marca para 2014-11-28 (act.php?p=20141128); el API de legislación consolidada (texto/bloque/a93) sirve esa misma redacción con fecha_vigencia 20150101 y la siguiente con 20210101."

[[legal."ley-35-2006:art-93-ahorro-2021"]]
language = "es"
text = "LIRPF Art. 93.2.e).2.º — escala del ahorro del régimen especial de impatriados, redacción en vigor del 1-1-2021 al 31-12-2022: la fija el art. 61 de la Ley 11/2020, de 30 de diciembre (BOE-A-2020-17339), que modifica las letras e) y f) del apartado 2 con efectos desde 1 de enero de 2021, y la sustituye la redacción de la Ley 31/2022 con efectos 1-1-2023 (ley-35-2006:art-93-ahorro-2023). Es la redacción que rige el ejercicio 2022. Cuatro tramos: 19% hasta 6.000, 21% hasta 50.000 (cuota 1.140), 23% hasta 200.000 (10.380), 26% en adelante (44.880). Capturada del texto consolidado en la versión que el selector de BOE marca para 2020-12-31 (act.php?p=20201231); el API de legislación consolidada (texto/bloque/a93) sirve esa misma redacción con fecha_vigencia 20210101 y la siguiente con 20230101."

[[legal."ley-35-2006:art-96"]]
language = "es"
text = "LIRPF art. 96: obligación de declarar (M100)."

[[legal."ley-35-2006:art-98"]]
language = "es"
text = "LIRPF art. 98: borrador de declaración."

[[legal."ley-35-2006:art-99"]]
language = "es"
text = "LIRPF art 99: obligación general de practicar pagos a cuenta del IRPF. Define los pagos a cuenta como retenciones, ingresos a cuenta y pagos fraccionados; obliga a retenedores/pagadores a practicar retención e ingreso a cuenta; y obliga a contribuyentes con actividades económicas a efectuar pagos fraccionados."

[[legal."ley-35-2006:da-31"]]
language = "es"
text = "LIRPF disposición adicional trigésima primera, escalas aplicables en 2015 (añadida por la Ley 26/2014 y modificada con efectos 1-1-2015 por el art. 1.4 del Real Decreto-ley 9/2015). Su apartado 1.f) fija para el período impositivo 2015 la escala del número 1.º de la letra e) del apartado 2 del art. 93 en 24% hasta 600.000 euros y 47% desde 600.000,01; su apartado 1.g) fija la del número 2.º en 19,5% hasta 6.000 (cuota 0), 21,5% hasta 50.000 (cuota 1.170) y 23,5% en adelante (cuota 10.630). Desde 2016 rige la redacción del art. 93 de la Ley 26/2014 (ley-35-2006:art-93-2015). Verificada contra el texto consolidado incluido (ley-35-2006.html#datrigesimaprimera)."

[[legal."ley-35-2006:da-56"]]
language = "es"
text = "LIRPF disposición adicional 56ª: eleva exclusivamente para el período impositivo 2023 al 7 por ciento el porcentaje de deducción para el conjunto de provisiones deducibles y gastos de difícil justificación de la estimación directa simplificada, manteniendo el límite anual de 2.000 EUR fijado por el art. 30 LIRPF/RIRPF."

[[legal."ley-35-2006:da-59"]]
language = "es"
text = "LIRPF disposición adicional 59a: extiende a los contribuyentes del IRPF que desarrollen la actividad económica a la que se afecten los vehículos e instalaciones de recarga, cualquiera que sea el método de determinación de su rendimiento neto, la libertad de amortización de la disposición adicional decimoctava LIS; el exceso amortizado se íntegra como rendimiento de la actividad al transmitir el elemento. Anadida por el art. 3.4 del Real Decreto-ley 4/2024 (BOE-A-2024-12944), texto publicado el 27/06/2024 y en vigor desde el 28/06/2024, con efectos desde 1 de enero de 2024; la DA 18 LIS a la que remite, redactada por el art. 4.Uno del mismo real decreto-ley (real-decreto-ley-4-2024:art-4), solo alcanza a los períodos impositivos no concluidos a su entrada en vigor, por lo que no se declara alcance retroactivo de devengo."

[[legal."ley-37-1992:art-1"]]
language = "es"
text = "LIVA art. 1: naturaleza del IVA (impuesto indirecto sobre el consumo)."

[[legal."ley-37-1992:art-102"]]
language = "es"
text = "Artículo 102 LIVA: regla de prorrata. Define cuándo será de aplicación la regla de prorrata - cuando el sujeto pasivo realice conjuntamente entregas de bienes o prestaciones de servicios que originen el derecho a la deducción y otras operaciones de análoga naturaleza que no habiliten para el ejercicio del citado derecho."

[[legal."ley-37-1992:art-104"]]
language = "es"
text = "Artículo 104 LIVA: la prorrata general. Define el cálculo del porcentaje de deducción como cociente entre el importe total de las operaciones que originan el derecho a la deducción (numerador) y el importe total de todas las operaciones realizadas en el ejercicio (denominador), redondeado por exceso a la unidad superior. El apartado Tres enumera las seis operaciones excluidas de ambos términos de la relación (art 104.Tres reglas 1a a 6a): (1) operaciones desde establecimientos permanentes fuera del TAI; (2) las cuotas de IVA que gravaron directamente esas operaciones; (3) entregas y exportaciones de bienes de inversión utilizados en la actividad; (4) operaciones inmobiliarias o financieras que no constituyan actividad habitual (arrendamiento siempre habitual; operaciones financieras del art 20.Uno.18); (5) operaciones no sujetas del art 7; (6) operaciones del art 9, número 1.o, letra d) (autoconsumo del promotor). Las subvenciones no vinculadas al precio NO son una exclusión del art 104.Tres: fueron suprimidas del denominador de la prorrata por la Ley 3/2006 (BOE-A-2006-5691), por lo que no se computan en absoluto en lugar de excluirse de un volumen computado."

[[legal."ley-37-1992:art-105"]]
language = "es"
text = "Artículo 105 LIVA: procedimiento de la prorrata general. Apartado Uno: el porcentaje de deducción provisionalmente aplicable cada año natural será el fijado como definitivo para el año precedente. Apartado Cuatro: en la última declaración-liquidación de cada año natural el sujeto pasivo calcula la prorrata definitiva en función de las operaciones del año y practica la consiguiente regularización de las deducciones provisionales - la cuota de esa regularización se consigna en la casilla 44 del Modelo 303 y en el campo de regularización anual del Modelo 390. Base legal de la regularización prorrata por porcentaje definitivo. Apartado Cinco: en los supuestos de interrupción durante uno o más años naturales de la actividad (o de un sector diferenciado), el porcentaje definitivamente aplicable durante cada uno de esos años es el que globalmente corresponda al conjunto de los tres ÚLTIMOS años naturales en que se hubiesen realizado operaciones (porcentaje global sobre los volúmenes agregados de los tres años activos, saltando la interrupción; no la media de los tres porcentajes ni los tres años de calendario). Base legal de la siembra del ejercicio que reanuda tras una interrupción."

[[legal."ley-37-1992:art-107"]]
language = "es"
text = "Artículo 107 LIVA: regularización de deducciones por bienes de inversión. Las cuotas deducibles por la adquisición o importación de bienes de inversión se regularizan durante los cuatro años naturales siguientes a aquel en que los sujetos pasivos inicien su utilización (o nueve años si son terrenos o edificaciones)."

[[legal."ley-37-1992:art-108"]]
language = "es"
text = "Artículo 108 LIVA: concepto de bienes de inversión. Son bienes de inversión los bienes corporales, muebles, semovientes o inmuebles que, por su naturaleza y función, estén normalmente destinados a ser utilizados por un período de tiempo superior a un año como instrumentos de trabajo o medios de explotación, con umbrales de exclusión para bienes de escaso valor."

[[legal."ley-37-1992:art-109"]]
language = "es"
text = "Artículo 109 LIVA: procedimiento para practicar la regularización de deducciones por bienes de inversión. Establece la fórmula de regularización comparando el porcentaje de deducción del año de adquisición con el del año de la regularización, dividiendo la diferencia entre cinco (o diez para terrenos y edificaciones)."

[[legal."ley-37-1992:art-110"]]
language = "es"
text = "Artículo 110 LIVA: entregas de bienes de inversión durante el período de regularización. Si los bienes de inversión se entregan antes de la finalización del período de regularización, se efectuará una regularización única por el tiempo que reste, considerando si la entrega está sujeta y no exenta o exenta/no sujeta."

[[legal."ley-37-1992:art-115"]]
language = "es"
text = "Artículo 115 LIVA: supuestos generales de devolución. Conecta el saldo a favor no hecho efectivo por compensación del artículo 99 con la solicitud de devolución al cierre del último período de liquidación del año natural."

[[legal."ley-37-1992:art-116"]]
language = "es"
text = "Artículo 116 LIVA: solicitud de devoluciones al fin de cada período de liquidación. Base legal de la devolución periódica para sujetos pasivos que optan por el procedimiento reglamentario."

[[legal."ley-37-1992:art-117-bis"]]
language = "es"
text = "LIVA art 117 bis: solicitudes de devolución de empresarios o profesionales establecidos en el territorio de aplicación del Impuesto, Islas Canarias, Ceuta y Melilla, correspondientes a cuotas soportadas por operaciones efectuadas en la Comunidad con excepción de las realizadas en el territorio de aplicación del Impuesto. Base sustantiva del Modelo 360 (devolución 8a Directiva)."

[[legal."ley-37-1992:art-124"]]
language = "es"
text = "Artículo 124 LIVA: obligaciones formales del régimen simplificado. Los sujetos pasivos acogidos al régimen simplificado estarán obligados a llevar un libro registro de facturas recibidas y un libro registro específico del régimen simplificado."

[[legal."ley-37-1992:art-130"]]
language = "es"
text = "Artículo 130 LIVA: régimen de deducciones y compensaciones del régimen especial de la agricultura, ganadería y pesca. Reconoce el derecho a percibir una compensación a tanto alzado por el IVA soportado o satisfecho en las actividades acogidas al régimen."

[[legal."ley-37-1992:art-131"]]
language = "es"
text = "Artículo 131 LIVA: obligados al reintegro de las compensaciones. Reparte quien paga la compensación entre la Hacienda Pública (exportaciones y entregas a otro Estado miembro) y el adquirente o destinatario establecido en el territorio de aplicación del impuesto."

[[legal."ley-37-1992:art-134"]]
language = "es"
text = "Artículo 134 LIVA: deducción de las compensaciones del régimen especial de la agricultura, ganadería y pesca. Quien satisface la compensación deduce su importe como cuota soportada deducible, salvo los sujetos en recargo de equivalencia respecto de los productos destinados a su comercialización, y debe poseer el documento que el mismo expide."

[[legal."ley-37-1992:art-148"]]
language = "es"
text = "LIVA art. 148: régimen especial del recargo de equivalencia."

[[legal."ley-37-1992:art-163-decies"]]
language = "es"
text = "Artículo 163 decies LIVA: requisitos subjetivos para aplicar el régimen especial del criterio de caja."

[[legal."ley-37-1992:art-163-duodecies"]]
language = "es"
text = "Artículo 163 duodecies LIVA: ámbito objetivo y operaciones excluidas del régimen especial del criterio de caja, incluidas exportaciones, entregas intracomunitarias, adquisiciones intracomunitarias, inversión del sujeto pasivo e importaciones."

[[legal."ley-37-1992:art-163-noniesdecies"]]
language = "es"
text = "Ley 37/1992, artículo 163 noniesdecies: obligaciones formales del régimen exterior OSS cuando España es Estado miembro de identificación."

[[legal."ley-37-1992:art-163-octovicies"]]
language = "es"
text = "Artículo 163 octovicies LIVA: obligaciones formales del régimen especial IOSS - declaración de inicio, modificación y cese, presentación de declaraciones por trimestre natural, pagos, llevanza de un registro, conservación de la documentación durante diez años."

[[legal."ley-37-1992:art-163-quatervicies"]]
language = "es"
text = "Ley 37/1992, artículo 163 quatervicies: exclusión del régimen de la Unión para prestaciones realizadas en el territorio de aplicación del impuesto por establecidos en el mismo."

[[legal."ley-37-1992:art-163-quinquiesdecies"]]
language = "es"
text = "Artículo 163 quinquiesdecies LIVA: nacimiento del derecho a la deducción por pago total o parcial para destinatarios no acogidos que reciben operaciones afectadas por el régimen especial del criterio de caja."

[[legal."ley-37-1992:art-163-septiesdecies"]]
language = "es"
text = "Artículo 163 septiesdecies LIVA: ámbito objetivo del régimen especial aplicable a los servicios prestados por vía electrónica, de telecomunicaciones, de radiodifusión y de televisión (MOSS exterior). Define las prestaciones acogibles y los servicios excluidos del régimen."

[[legal."ley-37-1992:art-163-septvicies"]]
language = "es"
text = "Artículo 163 septvicies LIVA: definiciones aplicables al régimen especial IOSS - empresario o profesional no establecido, Estado miembro de identificación, Estado miembro de consumo, intermediario."

[[legal."ley-37-1992:art-163-unvicies"]]
language = "es"
text = "Ley 37/1992, artículo 163 unvicies: ámbito del régimen de la Unión para servicios, ventas intracomunitarias a distancia y determinadas entregas interiores."

[[legal."ley-37-1992:art-164"]]
language = "es"
text = "LIVA art. 164: obligaciones de los sujetos pasivos (autoliquidación, M303/M390)."

[[legal."ley-37-1992:art-75"]]
language = "es"
text = "Artículo 75 LIVA: regla general de devengo del impuesto para entregas de bienes y prestaciones de servicios. Es la proyección informativa que Modelo 303 casillas 62/63 declaran para operaciones afectadas por el criterio de caja."

[[legal."ley-37-1992:art-84"]]
language = "es"
text = "LIVA art 84: sujetos pasivos. Establece la regla general (apartado uno 1o) y la inversión del sujeto pasivo (apartado uno 2o), donde el destinatario de la operación asume la condición de sujeto pasivo y debe autorepercutirse el IVA."

[[legal."ley-37-1992:art-95"]]
language = "es"
text = "Artículo 95 LIVA: limitaciones del derecho a deducir. Los empresarios o profesionales no podrán deducir las cuotas soportadas o satisfechas por las adquisiciones o importaciones de bienes o servicios que no se afecten a su actividad empresarial o profesional."

[[legal."ley-37-1992:art-99"]]
language = "es"
text = "Artículo 99 LIVA: ejercicio del derecho a la deducción. Regula la deducción de cuotas soportadas, el período en que se ejerce el derecho, la compensación del exceso de cuotas a deducir cuando sobrepasa el de las devengadas en periodos sucesivos hasta cuatro años, y la caducidad del derecho."

[[legal."ley-49-2002:art-20"]]
language = "es"
text = "Ley 49/2002 art. 20: deducción de la cuota del Impuesto sobre Sociedades por donativos, donaciones y aportaciones. Los sujetos pasivos del IS deducen de la cuota íntegra, minorada en las deducciones y bonificaciones de los capítulos correspondientes, un porcentaje de la base de deducción determinada según el art. 18. Es la contrapartida en el IS del art. 19, que es la deducción en el IRPF. Funda la sección de donativos a entidades sin fines lucrativos del Modelo 200."

[[legal."ley-49-2002:art-22"]]
language = "es"
text = "Ley 49/2002 art. 22: actividades prioritarias de mecenazgo. Habilita a la Ley de Presupuestos Generales del Estado para establecer una relación de actividades prioritarias de mecenazgo dentro de los fines de interés general de la Ley, y para elevar en su caso los porcentajes y límites de deducción aplicables a esas actividades. Funda la subsección de donaciones para actividades prioritarias de mecenazgo del Modelo 200, que es exactamente la población cuyo porcentaje esa habilitación eleva."

[[legal."ley-49-2002:art-7"]]
language = "es"
text = "Ley 49/2002 art 7: explotaciones económicas exentas del Impuesto sobre Sociedades cuando se desarrollan en cumplimiento del objeto o finalidad específica de la entidad sin fines lucrativos (acción/asistencia social, hospitalización y asistencia sanitaria, I+D+i del art. 35 LIS, bienes de interés cultural y museos, artes escénicas, espacios naturales protegidos, enseñanza y formación, exposiciones y seminarios, edición, deporte, auxiliares/complementarias hasta el 20%, y escasa relevancia con INCN ≤ 20.000 EUR). Su renta es la renta exenta del art. 6.4.º excluida de la base imponible del Modelo 200."

[[legal."ley-58-2003:art-5"]]
language = "es"
text = "LGT art. 5: la Administración tributaria; competencias de la AEAT."

[[legal."ley-58-2003:art-98"]]
language = "es"
text = "LGT art. 98: iniciación de los procedimientos tributarios (declaraciones, modelos, casillas)."

[[legal."ley-58-2003:da-18"]]
language = "es"
text = "Disposición adicional decimoctava de la Ley General Tributaria: obligación de información sobre bienes y derechos situados en el extranjero (origen del Modelo 720)."

[[legal."ley-7-2012:da-1"]]
language = "es"
text = "Ley 7/2012 DA 1ª — introduce la disposición adicional decimoctava de la Ley 58/2003 LGT que establece la obligación de información sobre bienes y derechos situados en el extranjero (origen normativo del Modelo 720)."

[[legal."madrid-dl-1-2010:art-18"]]
language = "es"
text = "DL 1/2010 art. 18.1 (Comunidad de Madrid): doble límite de la suma de las bases imponibles general y del ahorro (casillas 0435 + 0460) para aplicar las deducciones autonómicas. Límite del contribuyente: 30.930 euros en tributación individual, 37.322,20 euros en tributación conjunta. Límite de la unidad familiar: 61.860 euros (agregado de las bases imponibles de todos los miembros de la unidad familiar)."

[[legal."madrid-dl-1-2010:art-2"]]
language = "es"
text = "DL 1/2010 art. 2 (Comunidad de Madrid): importes propios del mínimo por descendientes para el cálculo del gravamen autonómico (Ley 22/2009 art. 46.1.a). Para 2020-2021 solo divergen el tercer descendiente (4.400 €) y el cuarto y siguientes (4.950 €); el primero, segundo y el suplemento por descendiente menor de tres años coinciden con los importes generales del art. 58 LIRPF. Desde 2022 (Ley 8/2022, con efectos 1-1-2022) Madrid regula también el primero, segundo y el suplemento menor-de-tres-años con cuantías propias, que se han revisado en ejercicios posteriores (Ley 13/2023, con efectos 1-1-2023)."

[[legal."madrid-dl-1-2010:art-4"]]
language = "es"
text = "DL 1/2010 art. 4 (Comunidad de Madrid): deducción por nacimiento o adopción de hijos. Cuantía 721,70 euros por cada hijo nacido o adoptado en la regulación vigente desde el 1 de enero de 2023 (600 euros para nacimientos/adopciones anteriores a esa fecha). La deducción se aplica en el período de nacimiento/adopción y en cada uno de los dos períodos siguientes; sólo para padres que convivan con los hijos; se prorratea por partes iguales cuando el hijo convive con ambos padres y estos tributan de forma individual."

[[legal."orden-eha-1274-2007:art-1"]]
language = "es"
text = "Artículo 1 de la Orden EHA/1274/2007: aprobación del Modelo 036 de declaración censal de alta, modificación y baja."

[[legal."orden-eha-1274-2007:art-2"]]
language = "es"
text = "Artículo 2 de la Orden EHA/1274/2007: obligados a presentar declaración censal y declaración de baja mediante Modelo 036."

[[legal."orden-hac-1276-2019:art-septimo"]]
language = "es"
text = "Orden HAC/1276/2019 artículo séptimo: modifica los anexos I y II de la Orden HAP/1695/2016 aplicables al Modelo 289."

[[legal."orden-hac-1417-2018:art-sexto"]]
language = "es"
text = "Orden HAC/1417/2018 artículo sexto: modifica los anexos I y II de la Orden HAP/1695/2016 aplicables al Modelo 289."

[[legal."orden-hac-1430-2025:art-sexto"]]
language = "es"
text = "Orden HAC/1430/2025 artículo sexto: modifica los anexos I y II de la Orden HAP/1695/2016 para el Modelo 289 aplicable a 2025 y siguientes."

[[legal."orden-hac-1504-2024:art-9"]]
language = "es"
text = "Orden HAC/1504/2024 art 9: modifica la Orden HFP/886/2023 y sustituye su anexo por el anexo I de la nueva orden, actualizando el diseño del Modelo 721."

[[legal."orden-hac-1504-2024:art-septimo"]]
language = "es"
text = "Orden HAC/1504/2024 artículo séptimo: modifica los anexos I y II de la Orden HAP/1695/2016 aplicables al Modelo 289."

[[legal."orden-hac-1504-2024:df-unica"]]
language = "es"
text = "Orden HAC/1504/2024 disposición final única: entrada en vigor al día siguiente de la publicación y primera aplicación a declaraciones informativas del ejercicio 2024 presentadas en 2025."

[[legal."orden-hac-1526-2024:art-1"]]
language = "es"
text = "Artículo primero de la Orden HAC/1526/2024: modifica la Orden EHA/1274/2007 para mantener Modelo 036 y suprimir las superficies activas del Modelo 037."

[[legal."orden-hac-1526-2024:df-unica"]]
language = "es"
text = "Disposición final única de la Orden HAC/1526/2024: entrada en vigor el 3 de febrero de 2025 para los Modelos 030 y 036."

[[legal."orden-hac-646-2024:art-1"]]
language = "es"
text = "Orden HAC/646/2024 artículo primero: introduce el campo Identificador registral único de la sociedad (IRUS) en las posiciones 153-165 del registro de tipo 2 del modelo 038 y desplaza Blancos a las posiciones 166-250."

[[legal."orden-hac-646-2024:df-unica"]]
language = "es"
text = "Orden HAC/646/2024 disposición final única: fija la primera aplicación del artículo primero en la declaración informativa del modelo 038 correspondiente a junio de 2024, presentada en julio de 2024."

[[legal."orden-hap-72-2013:art-2"]]
language = "es"
text = "Obligados a presentar el modelo 720: personas físicas y jurídicas residentes en territorio español con cuentas, valores, o inmuebles en el extranjero por encima de los umbrales de 50.000 EUR por categoría, así como entidades en régimen de atribución de rentas y otros sujetos previstos."

[[legal."orden-hap-72-2013:art-7"]]
language = "es"
text = "Plazo de presentación del Modelo 720: entre el 1 de enero y el 31 de marzo del año siguiente al ejercicio al que se refiera la información."

[[legal."orden-hfp-1172-2022:anexo-i-instruccion-2-1"]]
language = "es"
text = "Fase 1a agraria: rendimiento neto previo. Para cada cultivo o explotación el rendimiento neto previo es el volumen total de ingresos (incluidas subvenciones e indemnizaciones) multiplicado por el índice de rendimiento neto que le corresponda; la ayuda directa desacoplada de la PAC se acumula a los ingresos de los cultivos y explotaciones en proporción a sus importes. Base de las casillas de rendimiento base producto y del rendimiento neto previo (casilla 1537) del Modelo 100 del ejercicio 2023."

[[legal."orden-hfp-1172-2022:anexo-i-instruccion-2-2"]]
language = "es"
text = "Fase 2a agraria: rendimiento neto minorado. Se obtiene deduciendo del rendimiento neto previo la amortización del inmovilizado material e intangible por su depreciación efectiva, con la tabla de amortización de este Anexo I para los grupos que tabula; en las actividades forestales no se deducen amortizaciones. Base de la casilla 1539 del Modelo 100 del ejercicio 2023, que resta la amortización declarada (casilla 1538)."

[[legal."orden-hfp-1172-2022:anexo-i-instruccion-2-3"]]
language = "es"
text = "Fase 3a agraria: rendimiento neto de módulos. Sobre el rendimiento neto minorado se aplican en secuencia, cuando correspondan, los índices correctores de las letras a) a h), cada uno sobre el rendimiento ya rectificado por los anteriores, con sus incompatibilidades: el índice por personal asalariado no se aplica cuando procede el de medios de producción ajenos, y a las actividades forestales solo les es aplicable el índice de la letra h). Base de la casilla 1548 del Modelo 100 del ejercicio 2023 (índices declarados en las casillas 1540 a 1547)."

[[legal."orden-hfp-1172-2022:anexo-i-instruccion-3"]]
language = "es"
text = "Fase 4a agraria: reducción agricultores jóvenes. Los agricultores jóvenes o asalariados agrarios pueden reducir en un 25 por ciento el rendimiento neto de módulos de su actividad agraria durante los períodos impositivos cerrados en los cinco años siguientes a su primera instalación como titulares de una explotación prioritaria, acreditando un plan de mejora. Desarrolla para el ejercicio 2023 la disposición adicional sexta de la Ley del IRPF; base de la casilla 1551 del Modelo 100 del ejercicio 2023."

[[legal."orden-hfp-1172-2022:anexo-ii-instruccion-2-3-b-1"]]
language = "es"
text = "Fase 3a: índice corrector para empresas de pequeña dimensión. Se aplica el índice que corresponda (0,70/0,75/0,80 según la población del municipio, o 0,90 si además hay personal asalariado hasta 2 trabajadores) cuando concurren todas las circunstancias: titular persona física, un solo local, no más de un vehículo afecto de hasta 1.000 kg, y sin personal asalariado (salvo el supuesto de hasta 2 trabajadores del índice 0,90)."

[[legal."orden-hfp-1172-2022:anexo-ii-instruccion-2-3-b-2"]]
language = "es"
text = "Fase 3a: índice corrector de temporada. Cuando la actividad tenga la consideración de actividad de temporada (se desarrolla habitualmente solo ciertos días del año, continuos o alternos, sin exceder de 180 días por año) se aplica el índice que corresponda a la duración de la temporada. Incompatible con el índice corrector por inicio de nuevas actividades (b.4)."

[[legal."orden-hfp-1172-2022:anexo-ii-instruccion-2-3-b-4"]]
language = "es"
text = "Fase 3a: índice corrector por inicio de nuevas actividades. Aplica al contribuyente que inicie una nueva actividad a partir del 1 de enero de 2022, que no sea de temporada, no ejercida previamente bajo otra titularidad, y realizada en local exclusivo. Incompatible con el índice corrector de temporada (b.2)."

[[legal."orden-hfp-1172-2022:anexo-ii-instruccion-2-3-incompatibilidades"]]
language = "es"
text = "Fase 3a: incompatibilidades entre los índices correctores. El índice corrector para empresas de pequeña dimensión (b.1) nunca se aplica a las actividades que tienen asignados los índices correctores especiales (a.2 a a.5), y cuando resulte aplicable el índice b.1 tampoco se aplica el índice corrector de exceso (b.3); el índice corrector de temporada (b.2) y el de inicio de nuevas actividades (b.4) son a su vez incompatibles entre sí."

[[legal."orden-hfp-1172-2022:art-4"]]
language = "es"
text = "Aprobación de signos, índices o módulos de estimación objetiva aplicables durante 2023."

[[legal."orden-hfp-1172-2022:da-1"]]
language = "es"
text = "Reducción general del 10 por ciento del rendimiento neto de módulos para 2023, aplicable también para cuantificar el rendimiento neto a efectos de los pagos fraccionados (M131) de 2023 (apartado 3). El texto consolidado anota que la reducción será del 15 por ciento para las actividades del anexo I según el art. 2 de la Orden HAC/348/2024 (BOE-A-2024-7804), no catalogado."

[[legal."orden-hfp-1172-2022:da-3"]]
language = "es"
text = "Medida excepcional para 2023: el rendimiento neto previo de las actividades agrícolas y ganaderas en estimación objetiva, calculado según la instrucción 2.1 del anexo I de esta orden, puede reducirse en el 35 por ciento del precio de adquisición del gasóleo agrícola y en el 15 por ciento del de los fertilizantes adquiridos y facturados en 2023. Base de las casillas 0158 y 0159 que minoran el rendimiento neto previo al obtener el rendimiento neto minorado (casilla 1539) del Modelo 100 del ejercicio 2023."

[[legal."orden-hfp-1172-2022:da-7"]]
language = "es"
text = "Medida excepcional para 2022 (Orden HFP/1172/2022, en vigor el día siguiente a su publicación; rige el período impositivo 2022, cuyo devengo es posterior): el rendimiento neto previo de las actividades agrícolas y ganaderas en estimación objetiva, calculado según la instrucción 2.1 del anexo I de la Orden HFP/1335/2021, puede reducirse en el 35 por ciento del precio de adquisición del gasóleo agrícola y en el 15 por ciento del de los fertilizantes adquiridos y facturados en 2022. Apartado 2: los índices correctores por piensos adquiridos a terceros y por regadío con energía eléctrica de la Orden HFP/1172/2022 sustituyen en 2022 a los de la Orden HFP/1335/2021. Base de las casillas 0158 y 0159 que minoran el rendimiento neto previo al obtener el rendimiento neto minorado (casilla 1539) del Modelo 100 del ejercicio 2022."

[[legal."orden-hfp-1172-2022:da-8"]]
language = "es"
text = "Eleva al 15 por ciento la reducción general de 2022 del rendimiento neto de módulos de la disposición adicional primera de la Orden HFP/1335/2021 (orden-hfp-1335-2021:da-1, 5 por ciento), en todas las actividades económicas, y la hace computable en el pago fraccionado del cuarto trimestre de 2022. En vigor el día siguiente a su publicación (2 de diciembre de 2022, disposición final única); rige el período impositivo 2022, cuyo devengo es posterior a esa fecha."

[[legal."orden-hfp-1172-2022:instruccion-2-2-a"]]
language = "es"
text = "Fase 2a: minoración por incentivos al empleo. El rendimiento neto previo se minora en el coeficiente de minoración (incremento del módulo personal asalariado x 0,40, más el coeficiente por tramos del número de unidades restante) multiplicado por el rendimiento anual por unidad del módulo personal asalariado."

[[legal."orden-hfp-1172-2022:instruccion-2-2-b"]]
language = "es"
text = "Fase 2a: minoración por incentivos a la inversión. Son deducibles las cantidades que, en concepto de amortización del inmovilizado material o intangible afecto a la actividad, correspondan a la depreciación efectiva, calculada según la tabla de amortización de la propia orden (coeficiente lineal máximo, mínimo derivado del período máximo, o cualquier coeficiente intermedio)."

[[legal."orden-hfp-1172-2022:instruccion-2-3-b-3"]]
language = "es"
text = "Fase 3a: índice corrector de exceso. Cuando el rendimiento neto minorado supera la cuantía tabulada para la actividad, al exceso sobre dicha cuantía se le aplica el índice 1,30."

[[legal."orden-hfp-1284-2023:art-11"]]
language = "es"
text = "Orden HFP/1284/2023 artículo 11: modifica los campos código país, número de valores y nominal unitario de los valores en el registro de declarado del Modelo 189."

[[legal."orden-hfp-1284-2023:art-15"]]
language = "es"
text = "Orden HFP/1284/2023 artículo 15: modifica los anexos I y II de la Orden HAP/1695/2016 aplicables al Modelo 289."

[[legal."orden-hfp-1284-2023:art-9"]]
language = "es"
text = "Artículo 9 de la Orden HFP/1284/2023: crea en el registro de tipo 2 del modelo 296 el campo IDENTIFICADOR DE REGISTRO O NUMERO DE ORDEN (posiciones 77-84) y el Anexo de desglose (tipo de hoja F). Aplicable por primera vez al ejercicio 2023 según su disposición final única; antes, las posiciones 77-90 eran blancos y no existia el anexo."

