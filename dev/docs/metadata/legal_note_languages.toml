text = "Reglamento del IVA art 30: registro de devolución mensual y límites para solicitar devolución en períodos distintos del último periodo anual."

[[legal."rd-1624-1992:art-69"]]
language = "es"
text = "RIVA art 69: plazos para las anotaciones registrales. Es la norma operativa a la que remite el art 35 del RD 1065/2007 para fijar el periodo de imputación del Modelo 347, de modo que citar el art 35 sin este artículo deja la referencia a un salto de distancia de la regla efectiva. Las operaciones deben estar asentadas en los libros registro en el momento de la liquidación y pago del impuesto o, en todo caso, antes de que finalice el plazo de presentación en periodo voluntario. Texto extraído de la API de datos abiertos del BOE el 2026-08-06 tomando la última versión consolidada, redacción BOE-A-2013-11216 en vigor desde 2013-10-27."

[[legal."rd-1624-1992:art-71"]]
language = "es"
text = "Reglamento del IVA art 71: liquidación del Impuesto, normas generales. Establece la obligación de autoliquidación de los sujetos pasivos, las periodicidades trimestral y mensual, la declaración resumen anual y las exoneraciones. Base reglamentaria común de los Modelos 303 (autoliquidación), 309 (no periódica), 322 (REGE individual), 353 (REGE agregada) y 390 (resumen anual)."

