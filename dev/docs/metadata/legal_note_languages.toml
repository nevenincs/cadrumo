text = "minimo personal y familiar"

[[legal."ley-12-2002:art-29"]]
language = "es"
text = "Gestión e inspección del Impuesto"
[[legal."ley-27-2014:art-25"]]
language = "es"
text = "reserva de capitalización. Establece la reducción en la base imponible del 15 por ciento del incremento de los fondos propios (23 por ciento si la plantilla media aumenta), condicionada al mantenimiento durante 3 anios y a la dotacion de una reserva indisponible."

[[legal."ley-27-2014:art-31"]]
language = "es"
text = "deducción para evitar la doble imposición juridica - impuesto soportado por el contribuyente. Permite deducir de la cuota integra la menor de dos cantidades: el impuesto efectivamente satisfecho en el extranjero (con tope del convenio CDI si aplica), o la cuota integra que en Espana correspondería pagar por las mismas rentas. Las cantidades no deducidas se trasladan a periodos siguientes; comprobación prescribe a los 10 anios. Base sustantiva de la deducción por doble imposición juridica internacional en M200."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "El articulo 11 ya esta citado en el catalogo del IRPF como real-decreto-ley-7-2024:art-11, y esa entrada fundamenta el APARTADO 1, que reduce el rendimiento neto de módulos del IRPF."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "Comparten el porcentaje pero no la magnitud ni el impuesto, asi que una sola entrada para ambos haria que una cita del IVA descansara sobre frases del IRPF."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "Esta entrada se identifica por el apartado, siguiendo la granularidad ya usada en el catalogo (trlirnr-rdleg-5-2004:art-13.1, ley-58-2003:art-27.2)."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "El apartado declara que la reducción se tiene en cuenta para el calculo de la CUOTA ANUAL de 2024: no es una reducción trimestral repetida cuatro veces, y required_text exige esa frase precisamente porque es la que distingue las dos lecturas."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "El apartado no enumera municipios: se remite al anexo del RDL 6/2024, que required_text exige literalmente, de modo que esta entrada no puede satisfacerse si la remisión desapareciera del texto."

[[legal."real-decreto-ley-7-2024:art-11.2"]]
language = "es"
text = "Cuando la reducción rige no lo dice este articulo sino la disposición final decimocuarta de la misma norma; la entrada real-decreto-ley-7-2024:df-14 la cita, y effective_from se toma de alli en lugar de deducirse."

[[legal."real-decreto-ley-7-2024:art-11"]]
language = "es"
text = "Reducción DANA 2024 para actividades económicas en estimación objetiva en municipios afectados; fundamenta el APARTADO 1 del articulo, que opera sobre el rendimiento neto de módulos del IRPF."

[[legal."real-decreto-ley-7-2024:art-11"]]
language = "es"
text = "El apartado 2 del mismo articulo reduce la cuota devengada por operaciones corrientes del régimen simplificado del IVA y tiene su propia entrada, real-decreto-ley-7-2024:art-11.2."

[[legal."real-decreto-ley-7-2024:art-11"]]
language = "es"
text = "Ninguna de las tres frases de required_text cambia de resultado: se verificaron contra el bloque nuevo antes del cambio."

[[legal."rd-1065-2007:art-33"]]
language = "es"
text = "RGAT art 33: contenido de la declaración anual de operaciones con terceras personas."

[[legal."rd-1065-2007:art-33"]]
language = "es"
text = "Fija el umbral general de 3.005,06 EUR por contraparte y ano natural (parrafo 1), excluye determinadas operaciones del deber de declarar (apartado 2), y establece un umbral separado de 300,51 EUR para los cobros por cuenta de terceros de honorarios profesionales o derechos de propiedad intelectual/industrial (apartado 4, remitiendo a los obligados del art 31.3)."

[[legal."rd-1065-2007:art-33"]]
language = "es"
text = "Es la base reglamentaria de las claves A/B (umbral general) y C (cobros por cuenta de terceros) del diseno de registro del Modelo 347."

[[legal."rd-1065-2007:art-33"]]
language = "es"
text = "El parrafo segundo del apartado 1 computa por separado las entregas y las adquisiciones, de modo que el umbral se juzga por contraparte y sentido de la operacion; el apartado 3 relaciona las subvenciones satisfechas por las Administraciones Publicas cualquiera que sea su importe."

[[legal."rd-1065-2007:art-33"]]
language = "es"
text = "Del apartado 2 se aplican la letra g), que excluye las importaciones y exportaciones de mercancias cualquiera que sea la residencia de la contraparte, y la letra i), que excluye las operaciones ya incluidas en otra declaración periodica de contenido coincidente (Modelo 349, y el resumen anual de retenciones del art 108.2 RIRPF para quien practica la retencion)."

[[legal."correccion-errores-rdl-6-2024"]]
language = "es"
text = "Correccion de errores del RDL 6/2024 (BOE num."

[[legal."correccion-errores-rdl-6-2024"]]
language = "es"
text = "Rectifica la parte expositiva y los articulos 1.4, 8.1, 24.1, 25.1, 46.1 y 47; NO toca el anexo, de modo que la geografia publicada el 6 de noviembre sigue siendo la corregida."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-2-2"]]
language = "es"
text = "Fase 2a agraria: rendimiento neto minorado."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-2-2"]]
language = "es"
text = "El rendimiento neto minorado se obtiene deduciendo del rendimiento neto previo (fase 1a) las cantidades que, en concepto de amortización del inmovilizado material e intangible (excluidas las actividades forestales), correspondan a la depreciación efectiva que sufran los distintos elementos afectos por funcionamiento, uso, disfrute u obsolescencia, calculada elemento por elemento conforme a la tabla de amortización de este mismo Anexo I (para grupos no tabulados en el Anexo I, la orden remite a la letra b) del punto 2.2 del Anexo II)."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-2-2"]]
language = "es"
text = "Mismo patron honesto-escalar que la minoración por incentivos a la inversion del motor de módulos del Anexo II (instrucción 2.2.b), ver orden-hac-1347-2024:instruccion-2-2-b."

[[legal."rd-439-2007:art-95"]]
language = "es"
text = "RIRPF art 95: importe de las retenciones sobre rendimientos de actividades económicas."

[[legal."rd-439-2007:art-95"]]
language = "es"
text = "El apartado 1 establece el tipo del 15 por ciento general para actividades profesionales, el tipo reducido del 7 por ciento para nuevos profesionales (inicio + dos siguientes) y para colectivos especificos (recaudadores municipales, mediadores de seguros con auxiliares, delegados comerciales SELAE, actividades artisticas de los grupos IAE 851, 852, 853, 861, 862, 864 y 869 de la seccion segunda y agrupaciones 01, 02, 03 y 05 de la seccion tercera, sujetas a una prueba de ingresos de dos partes: menos de 15.000 euros el ejercicio anterior Y mas del 75 por ciento de los rendimientos integros de actividades económicas y trabajo)."

[[legal."rd-439-2007:art-95"]]
language = "es"
text = "Los apartados 4, 5 y 6.1 fijan los tipos sectoriales: 2 por ciento agricola/ganadero general con carve-out del 1 por ciento para engorde de porcino y avicultura (apartado 4), 2 por ciento forestal (apartado 5) y 1 por ciento en estimación objetiva (apartado 6.1)."

[[legal."rd-439-2007:art-95"]]
language = "es"
text = "Base reglamentaria de la retención sobre rendimientos de actividades económicas en Modelo 111 y del crédito de pagos a cuenta en Modelo 130."

[[legal."rdl-16-2025:art-17"]]
language = "es"
text = "RDL 16/2025 art."

[[legal."rdl-16-2025:art-17"]]
language = "es"
text = "En vigor desde el 25 de diciembre de 2025 (entrada en vigor que publica el BOE)."

[[legal."rdl-16-2025:art-17"]]
language = "es"
text = "Derogado: la Resolución de 27 de enero de 2026 (BOE-A-2026-2024, catalogada como resolucion-congreso-2026-01-27-derogacion-rdl-16-2025:acuerdo) publica que el Congreso, en su sesion de 27 de enero de 2026, acordo derogarlo; fecha de publicación 28 de enero de 2026."

[[legal."rdl-16-2025:art-17"]]
language = "es"
text = "La resolución no fija otra fecha de efectos, y la derogación de un real decreto-ley no convalidado surte efecto con la publicación del acuerdo, de modo que su ultimo dia de vigencia es el 27 de enero de 2026."

[[legal."rdl-16-2025:art-17"]]
language = "es"
text = "Que la letra c) siga rigiendo el periodo impositivo 2025 no descansa en esta entrada sino en la posicion de la AEAT (Manual de Renta 2025), citada por separado en los parametros que la aplican."

[[legal."real-decreto-ley-6-2024:anexo"]]
language = "es"
text = "RDL 6/2024 anexo: listado de terminos municipales afectados por la DANA."

[[legal."real-decreto-ley-6-2024:anexo"]]
language = "es"
text = "Es la UNICA autoridad de la geografia; RDL 7/2024 art."

[[legal."real-decreto-ley-6-2024:anexo"]]
language = "es"
text = "El listado consolidado carga 78 entradas."

[[legal."real-decreto-ley-6-2024:anexo"]]
language = "es"
text = "Una lista recortada o ampliada por la cola deja de satisfacer la tercera frase."

[[legal."real-decreto-ley-6-2024:anexo"]]
language = "es"
text = "Benicull de Xuquer rompe el orden alfabetico del resto del anexo; se conserva tal cual porque asi lo publica el BOE, y no se reordena."

[[legal."real-decreto-ley-6-2024:art-1"]]
language = "es"
text = "RDL 6/2024 art."

[[legal."real-decreto-ley-6-2024:art-1"]]
language = "es"
text = "Apartado 1 fija el ámbito por remisión al anexo de la propia norma y a la ventana del 28 de octubre al 4 de noviembre de 2024."

[[legal."real-decreto-ley-6-2024:art-1"]]
language = "es"
text = "Apartado 4 declara el anexo MUTABLE: puede modificarse mediante Acuerdo de Consejo de Ministros."

[[legal."real-decreto-ley-6-2024:art-1"]]
language = "es"
text = "Esa mutabilidad es la razon de que la geografia se cite siempre con consolidated_as_of y nunca se transcriba como lista fija."

[[legal."orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]]
language = "es"
text = "Fase 3a: incompatibilidades entre los índices correctores."

[[legal."orden-hfp-1359-2023:anexo-ii-instruccion-2-3-incompatibilidades"]]
language = "es"
text = "El índice corrector para empresas de pequeña dimensión (b.1) nunca se aplica a las actividades que tienen asignados los índices correctores especiales (a.2 transporte por autotaxis, a.3 transporte urbano colectivo, a.4 transporte de mercancias por carretera y servicios de mudanzas, a.5), y cuando resulte aplicable el índice b.1 tampoco se aplica el índice corrector de exceso (b.3); el índice corrector de temporada (b.2) y el de inicio de nuevas actividades (b.4) son a su vez incompatibles entre sí."

[[legal."rd-1065-2007:art-32"]]
language = "es"
text = "RGAT art 32: personas o entidades excluidas de la obligacion de presentar la declaración anual de operaciones con terceras personas (Modelo 347)."

[[legal."rd-1065-2007:art-32"]]
language = "es"
text = "Letra b) excluye las actividades en estimacion objetiva del IRPF que tributan simultaneamente en los regimenes especiales simplificado, agricultura o recargo de equivalencia del IVA, salvo por las operaciones por las que emitan factura, y su segundo parrafo hace que los acogidos al regimen simplificado incluyan ademas las adquisiciones anotadas en el libro registro de facturas recibidas del art 40.1 RIVA (redacción del RD 828/2013); letra c) a quienes no superen 3.005,06 EUR por contraparte y ano natural, o 300,51 EUR en el cobro por cuenta de terceros; letra e) a los obligados del art 62.6 RIVA (llevanza de libros registro por el SII)."

[[legal."ley-27-2014:art-130"]]
language = "es"
text = "LIS art."

[[legal."ley-27-2014:art-130"]]
language = "es"
text = "Los AID correspondientes a dotaciones por deterioro de creditos por insolvencias de deudores no vinculados y no adeudados con entidades de derecho publico cuya deducibilidad no se produce por el art."

[[legal."ley-27-2014:art-130"]]
language = "es"
text = "Funda la seccion activos_impuesto_diferido_aid_art_130_lis del Modelo 200, que hasta ahora citaba unicamente la lista generica de 18 articulos comun a toda la revision y no el articulo que establece el derecho."

[[legal."real-decreto-ley-4-2024:art-4"]]
language = "es"
text = "RDL 4/2024 art."

[[legal."real-decreto-ley-4-2024:art-4"]]
language = "es"
text = "Un periodo impositivo concluido antes del 28 de junio de 2024 (en el IRPF, el del contribuyente fallecido antes de esa fecha) queda fuera de esta redacción y conserva la amortización acelerada, como recoge el Manual practico de Renta 2024."

[[legal."real-decreto-ley-4-2024:art-4"]]
language = "es"
text = "Los apartados Dos y Tres del articulo (reserva de capitalización) no se citan desde esta entrada."

[[legal."ley-35-2006:da-6"]]
language = "es"
text = "LIRPF disposición adicional sexta: beneficios fiscales especiales aplicables en actividades agrarias — los agricultores jóvenes o asalariados agrarios que determinen el rendimiento neto de su actividad agraria mediante estimación objetiva podrán reducir el correspondiente a dicha actividad en un 25 por ciento durante los períodos impositivos cerrados durante los cinco años siguientes a su primera instalación como titulares de una explotación prioritaria (Ley 19/1995, capítulo IV, título I), siempre que acrediten la realización de un plan de mejora de la explotación; la reducción se tiene en cuenta también para los pagos fraccionados."

[[legal."ley-35-2006:da-6"]]
language = "es"
text = "Base legal de la reducción agricultores jóvenes (casilla 1551 del Modelo 100 2025, Anexo I Orden HAC/1347/2024, instrucción 3)."

[[legal."real-decreto-ley-20-2012:art-23-tres"]]
language = "es"
text = "RDL 20/2012 art."

[[legal."real-decreto-ley-20-2012:art-23-tres"]]
language = "es"
text = "Entrada SEPARADA de la del apartado Dos deliberadamente: el mismo articulo fija dos tipos en dos apartados distintos, y una sola entrada obligaria a cada tipo a citar una provision que no es exactamente la suya."

[[legal."real-decreto-ley-20-2012:art-23-tres"]]
language = "es"
text = "La nota de modificación del art."

[[legal."real-decreto-ley-20-2012:art-23-tres"]]
language = "es"
text = "El tipo super-reducido del 4 por ciento es anterior a esta norma y necesita su propia provision."

[[legal."orden-hac-1347-2024:instruccion-2-2-b"]]
language = "es"
text = "Fase 2a: minoración por incentivos a la inversion."

[[legal."orden-hac-1347-2024:instruccion-2-2-b"]]
language = "es"
text = "Son deducibles las cantidades que, en concepto de amortización del inmovilizado material o intangible afecto a la actividad, correspondan a la depreciación efectiva, calculada según la tabla de amortización de la propia orden (coeficiente lineal maximo, minimo derivado del periodo maximo, o cualquier coeficiente intermedio)."

[[legal."orden-hac-1347-2024:instruccion-2-2-b"]]
language = "es"
text = "El primer slice del motor no modela un registro de bienes de inversion por elemento; la minoración se recoge como un importe declarado por el operador, grounded en esta instrucción, y se resta del rendimiento neto previo junto con la minoración por incentivos al empleo."

[[legal."rd-1619-2012:disp-adicional-4.7"]]
language = "es"
text = "RD 1619/2012 disposición adicional cuarta, apartado 7: las agencias de viajes que expidan las facturas de esta disposición consignan en la declaración anual de operaciones con terceras personas (Modelo 347), letra a) en concepto de ventas los servicios documentados mediante esas facturas, y letra b) en concepto de compras las prestaciones en que intervienen como mediadoras."

[[legal."rd-1619-2012:disp-adicional-4.7"]]
language = "es"
text = "Es la base de que las claves F (ventas agencia viaje) y G (compras agencia viaje) se sumen con las entregas y con las adquisiciones, respectivamente, al juzgar el umbral del art 33.1 RGAT."

[[legal."rd-1619-2012:disp-adicional-4.7"]]
language = "es"
text = "El apartado 7 esta en la redacción del RD 1075/2017 (BOE-A-2017-15843), en vigor desde el 1 de enero de 2018 según las notas de vigencia del mismo real decreto en el consolidado; por eso se fecha en 2018."

[[legal."real-decreto-ley-7-2024:df-14"]]
language = "es"
text = "La norma entra en vigor el dia siguiente al de su publicación en el BOE; publicada el 12 de noviembre de 2024, rige desde el 13 de noviembre de 2024, que es el effective_from de esta entrada y el que toma prestado la entrada del articulo 11 apartado 2."

[[legal."real-decreto-ley-7-2024:df-14"]]
language = "es"
text = "La misma disposición acota hasta el 31 de diciembre de 2024 unicamente las medidas del articulo 42.1.e) y 4, materia laboral ajena al IVA, de modo que no cierra la vigencia de la reducción del articulo 11.2."

[[legal."real-decreto-ley-7-2024:df-14"]]
language = "es"
text = "Esta entrada existe para que la aplicabilidad de la reducción se lea de la norma y no se infiera del articulo que la establece."

[[legal."rd-1624-1992:art-62"]]
language = "es"
text = "El apartado 6 obliga a llevar los libros registro a traves de la Sede electronica de la AEAT, mediante el suministro electronico de los registros de facturación (SII), a quienes tengan un periodo de liquidación mensual conforme al art 71.3, y permite optar por el mismo sistema al resto de sujetos pasivos en los terminos del art 68 bis."

[[legal."rd-1624-1992:art-62"]]
language = "es"
text = "Es el supuesto al que remite el art 32.e del RD 1065/2007 para excluir de la declaración anual de operaciones con terceras personas (Modelo 347) tanto a los obligados como a los acogidos voluntariamente."

[[legal."rd-1624-1992:art-62"]]
language = "es"
text = "Apartado 6 anadido con efectos desde el 1 de enero de 2017 por el RD 596/2016 (BOE-A-2016-11575); texto verificado contra el consolidado bundled corpus/normatives/html/rd-1624-1992.html."

[[legal."rd-1065-2007:art-31"]]
language = "es"
text = "Apartado 1 obliga a quienes desarrollen actividades empresariales o profesionales a presentar la declaración anual (base reglamentaria del Modelo 347); apartado 2 extiende la obligacion a las adquisiciones al margen de la actividad de las entidades del art 94.1 y 2 LGT; apartado 3 alcanza a las entidades que cobran honorarios o derechos por cuenta de sus socios, asociados o colegiados."

[[legal."rd-1065-2007:art-31"]]
language = "es"
text = "El articulo no fija ningun importe: el umbral por contraparte lo establece el art 33 y la exclusion de quienes no lo superan el art 32.c."

[[legal."rd-1065-2007:art-31"]]
language = "es"
text = "Texto verificado contra el consolidado bundled corpus/normatives/html/rd-1065-2007.html (redacción del apartado 1 por RD 828/2013, BOE-A-2013-11216)."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-3"]]
language = "es"
text = "Los agricultores jovenes o asalariados agrarios podran reducir el rendimiento neto de módulos correspondiente a su actividad agraria en un 25 por ciento durante los periodos impositivos cerrados durante los cinco anos siguientes a su primera instalación como titulares de una explotación prioritaria (capitulo IV, titulo I, Ley 19/1995), siempre que acrediten un plan de mejora de la explotación."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-3"]]
language = "es"
text = "Desarrolla, para el ejercicio 2025, la disposición adicional sexta de la Ley del IRPF (ley-35-2006:da-6)."

[[legal."orden-hac-1347-2024:anexo-i-instruccion-3"]]
language = "es"
text = "Base legal de la casilla 1551 del Modelo 100 2025 (motor: percent(1550, 25) cuando la casilla informativa AJ del Diseno de Registros AEAT declara la elegibilidad; en blanco/No no se fabrica ninguna reducción)."

[[legal."real-decreto-ley-11-2022:art-18"]]
language = "es"
text = "Ultima actualizacion, publicada el 28/12/2022, en vigor a partir del 28/12/2022"

[[legal."real-decreto-ley-11-2022:art-18"]]
language = "es"
text = "Texto original, publicado el 26/06/2022"

[[legal."ley-37-1992:art-70"]]
language = "es"
text = "inmuebles, transporte, acceso a manifestaciones, servicios electronicos, restauracion, mediación, trabajos sobre bienes muebles, arrendamiento de medios de transporte"

[[legal."orden-hac-510-2021:dt-unica"]]
language = "es"
text = "Orden HAC/510/2021 disposición transitoria única, primeras autoliquidaciones del Impuesto: las autoliquidaciones de enero, febrero, marzo y abril de 2021 se presentan e ingresan en el plazo de la autoliquidación correspondiente al mes de mayo de 2021."

[[legal."orden-hac-510-2021:dt-unica"]]
language = "es"
text = "La orden se publicó el 27 de mayo de 2021, después de esos cuatro periodos, por lo que el plazo general del art 3 no pudo regirlos."

[[legal."orden-hac-510-2021:dt-unica"]]
language = "es"
text = "Combinada con el art 3, la ventana de los cinco primeros periodos de 2021 es del 10 al 20 de junio de 2021."

[[legal."rd-439-2007:art-75"]]
language = "es"
text = "rentas sujetas a retención o ingreso a cuenta (apartados 1-2) y rentas exceptuadas de la obligación de retener o ingresar a cuenta por razón de su naturaleza (apartado 3)"

[[legal."ley-58-2003:art-82"]]
language = "es"
text = "Garantias para el aplazamiento y fraccionamiento de la deuda."

[[legal."ley-58-2003:art-191"]]
language = "es"
text = "Infraccion por dejar de ingresar la deuda tributaria resultante de una autoliquidación."

[[legal."ley-27-2014:da-17"]]
language = "es"
text = "LIS disposición adicional decimoseptima"

[[legal."ley-27-2014:da-17"]]
language = "es"
text = "libertad de amortización en instalaciones de autoconsumo electrico y de uso termico de consumo propio con energia renovable que sustituyan instalaciones fosiles, condicionada a mantener la plantilla media total de los 24 meses siguientes al inicio del periodo impositivo respecto de la de los doce meses anteriores. Excluye edificios; inversion maxima 500.000 euros."

[[legal."ley-35-2006:art-38"]]
language = "es"
text = "LIRPF art 38: ganancias excluidas de gravamen en supuestos de reinversión — exención de la ganancia por transmisión de la vivienda habitual reinvertida en otra vivienda habitual, y de acciones/participaciones de entidades de nueva o reciente creación. Base legal de las casillas de exención por reinversión en Modelo 100."

[[legal."ley-35-2006:art-39"]]
language = "es"
text = "LIRPF art 39: ganancias patrimoniales no justificadas — bienes o derechos cuya tenencia/declaración/adquisición no se corresponde con la renta o patrimonio declarados, integradas en la base liquidable general del periodo."

[[legal."ley-35-2006:art-51"]]
language = "es"
text = "LIRPF art 51: reducciones de la base imponible general por aportaciones y contribuciones a sistemas de previsión social (planes de pensiones, mutualidades de previsión social, planes de previsión asegurados, planes de previsión social empresarial, seguros de dependencia, y sistemas a favor de personas con discapacidad). Base legal de las casillas de reducción/exceso por previsión social en Modelo 100; el límite conjunto lo fija el art. 52."

[[legal."ley-35-2006:art-53"]]
language = "es"
text = "LIRPF art 53: reducciones de la base imponible general por aportaciones y contribuciones a sistemas de previsión social constituidos a favor de personas con discapacidad. Base legal de las casillas de reducción/exceso por previsión social de personas con discapacidad en Modelo 100 (distinto del patrimonio protegido del art. 54)."

[[legal."ley-35-2006:art-54"]]
language = "es"
text = "LIRPF art 54: reducciones de la base imponible general por aportaciones a patrimonios protegidos de las personas con discapacidad (límite 10.000 € por aportante, 24.250 € conjunto). Base legal de las casillas de reducción/exceso por patrimonio protegido en Modelo 100."

[[legal."ley-35-2006:art-55"]]
language = "es"
text = "LIRPF art 55: reducciones de la base imponible por pensiones compensatorias satisfechas al cónyuge y anualidades por alimentos (salvo las fijadas a favor de los hijos) por decisión judicial. Base legal de las casillas de reducción por pensiones compensatorias y anualidades por alimentos en Modelo 100."

[[legal."ley-35-2006:art-7"]]
language = "es"
text = "Base legal de las casillas informativas de rentas exentas (importes que no se integran en la base imponible) del Modelo 100"

[[legal."ley-35-2006:art-92"]]
language = "es"
text = "LIRPF art 92: imputación de rentas por la cesión de derechos de imagen. Base legal de las casillas del régimen especial de imputación por cesión de derechos de imagen en Modelo 100."

[[legal."ley-35-2006:art-97"]]
language = "es"
text = "LIRPF art 97: autoliquidación. Incluye en su apartado 6 la compensación entre cónyuges cuando, en tributación individual, el resultado de una declaración es a ingresar y el de la otra a devolver. Base legal de las casillas de resultado de la autoliquidación, compensación entre cónyuges (datos de la cuenta SEPA) y autoliquidación rectificativa en Modelo 100."

[[legal."ley-35-2006:da-11"]]
language = "es"
text = "LIRPF disposición adicional 11ª: mutualidad de previsión social de deportistas profesionales y de alto nivel — aportaciones reducibles de la base imponible general con su propio límite (la menor de 24.250 € o la suma de rendimientos netos de trabajo y actividades económicas). Base legal de las casillas de reducción/exceso por mutualidad de deportistas en Modelo 100."

[[legal."ley-35-2006:da-45"]]
language = "es"
text = "LIRPF disposición adicional 45ª: tratamiento fiscal de la devolución de cláusulas suelo. Cuando las cantidades devueltas formaron parte de la base de deducciones previas, se pierde el derecho a esas deducciones y deben sumarse las cantidades indebidamente deducidas a la cuota líquida estatal y autonómica, sin intereses de demora. Base legal específica de las casillas Modelo 100 que marcan la regularización motivada por DA 45ª.2.a) o DA 45ª.3."

[[legal."ley-35-2006:da-48"]]
language = "es"
text = "LIRPF disposición adicional 48ª: deducción aplicable a las unidades familiares formadas por residentes fiscales en Estados miembros de la Unión Europea o del Espacio Económico Europeo, que equipara el tratamiento al de la tributación conjunta cuando uno de los miembros no es residente en España. Base legal de las casillas de la deducción por unidad familiar de residentes en la UE/EEE en Modelo 100."

[[legal."ley-35-2006:da-50"]]
language = "es"
text = "LIRPF disposición adicional 50ª: deducción por obras de mejora de la eficiencia energética de viviendas (20%/40%/60% según el tipo de obra y la reducción de demanda/consumo acreditada por certificado energético). Base legal de las casillas de deducción y exceso por mejoras energéticas de vivienda en Modelo 100."

[[legal."ley-35-2006:da-58"]]
language = "es"
text = "LIRPF disposición adicional 58ª: deducción por la adquisición de vehículos eléctricos enchufables y de pila de combustible y por la instalación de puntos de recarga (15% sobre el valor de adquisición, con límites). Base legal de las casillas de deducción por vehículos eléctricos y puntos de recarga en Modelo 100."

[[legal."ley-35-2006:da-60"]]
language = "es"
text = "LIRPF disposición adicional 60ª: reducción del 30% sobre rendimientos de actividades artísticas obtenidos de manera excepcional, con base máxima anual de 150.000 euros, para rendimientos del trabajo artísticos y rendimientos netos de actividades económicas artísticas que excedan del 130% de la media de los tres periodos impositivos anteriores. Base legal de las casillas Modelo 100 2025 de reducción por rendimientos artísticos excepcionales."

[[legal."ley-35-2006:dt-15"]]
language = "es"
text = "LIRPF disposición transitoria 15ª: régimen transitorio de la deducción por alquiler de la vivienda habitual — aplicable a contribuyentes con contrato de arrendamiento anterior al 01-01-2015 que venían deduciéndose (10,05% con base máxima según base imponible). Base legal de las casillas informativas y de cálculo de la deducción por alquiler en Modelo 100."

[[legal."ley-35-2006:dt-18"]]
language = "es"
text = "LIRPF disposición transitoria 18ª: régimen transitorio de la deducción por inversión en vivienda habitual — aplicable a contribuyentes que adquirieron su vivienda habitual (o satisficieron cantidades para su construcción) antes del 01-01-2013 y venían deduciéndose. Base legal de las casillas de deducción por vivienda habitual en Modelo 100."

[[legal."ley-35-2006:dt-9"]]
language = "es"
text = "LIRPF disposición transitoria 9ª: régimen transitorio (coeficientes de abatimiento) de las ganancias patrimoniales derivadas de elementos patrimoniales adquiridos antes del 31-12-1994, con el límite acumulado de 400.000 € de valor de transmisión. Base legal de la reducción DT-9ª en las casillas de ganancia patrimonial por transmisión de inmuebles en Modelo 100."

