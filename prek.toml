default_language_version.python = "3.13"

# ── General file checks ─────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

# ── Ruff (lint + format) ────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.9"
hooks = [
  { id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" },
]

# ── ty (type checking) ──────────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty type check"
language = "system"
entry = "uv run ty check src/"
pass_filenames = false
types = ["python"]

# ── #162 relative-imports mandate ───────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "relative-imports-mandate"
name = "enforce relative imports inside src/aeat/ (#162)"
language = "system"
entry = "uv run python scripts/check_relative_imports.py"
pass_filenames = false
types = ["python"]
