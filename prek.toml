default_language_version.python = "3.13"

# ── General file checks ─────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

# ── Ruff (lint + format) ────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.9"
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" },
]

# ── ty (type checking) ──────────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty type check"
language = "system"
entry = "uv run ty check src/"
pass_filenames = false
types = ["python"]

# ── #162 relative-imports mandate ───────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "relative-imports-mandate"
name = "enforce relative imports inside src/aeat/ (#162)"
language = "system"
entry = "uv run python scripts/check_relative_imports.py"
# Per-file scan keeps prek fast on big repos; the script silently drops
# paths outside src/aeat/ (tests/, scripts/, etc.) by design.
pass_filenames = true
files = "^src/aeat/.*\\.py$"
types = ["python"]

# ── Vault hygiene (vaultspec-core, manual stage) ────────────────────────────
# `vault-fix` rewrites files in place (unsafe mid-commit) and `spec-check`
# reports local-dev framework health that is not meaningful inside CI.
# Parked on the manual stage — run explicitly with
# `uv run prek run --hook-stage manual <hook-id>`.
#
# Provider-artifact leaks are already prevented by the vaultspec-managed
# .gitignore block (`.vaultspec/`, `providers.json`, `.mcp.json` etc.), so
# no commit-stage hook is needed for that.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "vault-fix"
name = "vault check (auto-fix, manual stage)"
language = "system"
entry = "uv run --no-sync vaultspec-core vault check all --fix"
pass_filenames = false
stages = ["manual"]

[[repos.hooks]]
id = "spec-check"
name = "vaultspec doctor (manual stage)"
language = "system"
entry = "uv run --no-sync vaultspec-core spec doctor"
pass_filenames = false
stages = ["manual"]
