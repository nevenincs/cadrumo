default_language_version.python = "3.13"

# ── prek policy ─────────────────────────────────────────────────────────────
# Every hook is VERIFY-ONLY. No autofixers run at commit time.
# Rationale: prek's stash-pop step has lost work in this repo when an
# autofixing hook modifies the staged tree mid-commit and the rollback
# conflicts with concurrently-edited files in the worktree. Verify-only
# hooks never stash unstaged changes and never rewrite files.
#
# The pre-commit hook script is intentionally NOT installed by the project
# (`prek install` is a no-op here). Run prek as a manual gate before
# committing:
#
#     uv run --no-sync prek run --all-files
#
# Bring autofixers back IN A SEPARATE STEP only — e.g. `uv run --no-sync
# ruff check --fix src/` followed by `uv run --no-sync ruff format src/`
# before staging — never as a commit-time auto-mutation.

# ── General file checks (read-only) ─────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  # --fix=no is REQUIRED, not decorative: this hook's default is "auto", which
  # rewrites files in place and would violate the verify-only policy above.
  # Measured behaviour at v5.0.0 with --fix=no: a file carrying BOTH terminators
  # is flagged; pure-LF, pure-CRLF and pure-CR files all pass, and no file is
  # mutated. That is why this is safe here -- the repo's large pure-CRLF
  # working-tree population is untouched and only genuinely mixed files red.
  #
  # The exclude mirrors .gitattributes. `_data/corpus/aeat_official/**` is
  # declared `-text` because it is byte-exact official AEAT evidence whose
  # stored digests are computed over the exact bytes; 27 of those captures
  # legitimately carry mixed terminators and must never be "fixed". PDFs are
  # binary too, but this hook's text heuristic misclassifies six of them.
  # Without this exclude the hook reds permanently on committed evidence.
  { id = "mixed-line-ending", args = ["--fix=no"], exclude = '^src/cadrumo/_data/corpus/aeat_official/|\.pdf$' },
]
# NOTE: trailing-whitespace and end-of-file-fixer are autofixers and are
# excluded from this config. Run `ruff format` manually if whitespace
# drift matters before a release.

# ── Ruff (verify-only) ──────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.12"
hooks = [
  # ruff-check: no --fix, no auto-mutation. Just fail on remaining errors.
  { id = "ruff-check" },
  # ruff-format: --check mode verifies without rewriting; rewrite is a
  # manual step (`uv run --no-sync ruff format src/`) outside the hook.
  { id = "ruff-format", args = ["--check"] },
]

# ── ty (type checking, verify-only) ─────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty type check"
language = "system"
entry = "uv run --no-sync python -m dev.quality.types"
pass_filenames = false
types = ["python"]

# ── Locale co-landing (verify-only) ─────────────────────────────────────────
# The only locale gate here that compares a CHANGE rather than a state. Every
# other one -- `dev.locales audit`, the parity suites -- asks whether the tree is
# currently consistent, which can only turn red after a commit has already
# separated a catalogue key from the code that consumes it. This one asks
# whether THIS change kept them together, which is the last moment the answer is
# still actionable.
#
# Verify-only and stash-free by construction: it reads `git show` blobs and
# writes nothing, so it is compatible with the policy at the top of this file.
#
# Cost is bounded by the change, not the tree. A commit touching no Python exits
# after one `git diff --name-only`; the whole-tree confirmation behind the orphan
# invariant runs only when a change actually removed a call site.
#
# With an empty index (`prek run --all-files`, or any CI invocation) the verb
# compares HEAD~1..HEAD instead of reporting a vacuous pass. Pass an explicit
# `--change BASE..HEAD` to check a whole branch.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "locale-co-landing"
name = "locale key co-lands with its call site"
language = "system"
entry = "uv run --no-sync python -m dev.locales co-landing"
pass_filenames = false

# ── Vault hygiene (manual stage only) ───────────────────────────────────────
# Both hooks below are autofixers / advisory diagnostics; they remain on the
# manual stage so they never trigger at commit time. Run via
# `uv run --no-sync prek run --hook-stage manual <hook-id>`.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "vault-fix"
name = "vault check (auto-fix, manual stage)"
language = "system"
entry = "uv run --no-sync vaultspec-core vault check all --fix"
pass_filenames = false
stages = ["manual"]

[[repos.hooks]]
id = "spec-check"
name = "vaultspec doctor (manual stage)"
language = "system"
# Inline shell wrapper remaps warning-only exits (1) to success; hard
# errors (>=2) still fail. `.claude/` carries intentional foreign files
# (`settings.local.json`, `worktrees/`) that produce a non-fixable
# `dir: mixed` advisory, so warning-on-fail over-triggers here.
entry = "bash -c 'uv run --no-sync vaultspec-core spec doctor; rc=$?; [ $rc -le 1 ]'"
pass_filenames = false
stages = ["manual"]
