default_language_version.python = "3.13"

# ── General file checks ─────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

# ── Ruff (lint + format) ────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.9"
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" },
]

# ── ty (type checking) ──────────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty type check"
language = "system"
entry = "uv run ty check src/"
pass_filenames = false
types = ["python"]

# ── Vault hygiene (vaultspec-core, manual stage) ────────────────────────────
# `vault-fix` rewrites files in place (unsafe mid-commit) and `spec-check`
# reports local-dev framework health that is not meaningful inside CI.
# Parked on the manual stage — run explicitly with
# `uv run prek run --hook-stage manual <hook-id>`.
#
# Provider-artifact leaks are already prevented by the vaultspec-managed
# .gitignore block (`.vaultspec/`, `providers.json`, `.mcp.json` etc.), so
# no commit-stage hook is needed for that.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "vault-fix"
name = "vault check (auto-fix, manual stage)"
language = "system"
entry = "uv run --no-sync vaultspec-core vault check all --fix"
pass_filenames = false
stages = ["manual"]

[[repos.hooks]]
id = "spec-check"
name = "vaultspec doctor (manual stage)"
language = "system"
# Inline shell wrapper remaps warning-only exits (1) to success; hard
# errors (>=2) still fail. `.claude/` carries intentional foreign files
# (`settings.local.json`, `worktrees/`) that produce a non-fixable
# `dir: mixed` advisory, so warning-on-fail over-triggers here.
entry = "bash -c 'uv run --no-sync vaultspec-core spec doctor; rc=$?; [ $rc -le 1 ]'"
pass_filenames = false
stages = ["manual"]
