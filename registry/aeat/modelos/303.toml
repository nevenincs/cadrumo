# -----------------------------------------------------------------------------
# Formulas backing the three computed result casillas.
# -----------------------------------------------------------------------------

[[revisions."2009-y-siguientes".formulas]]
id = "modelo-303-iva-cuota-devengada-total"
target = "iva.cuota-devengada-total"
expression = { op = "add", args = [
    { casilla = "iva.repercutido.general" },
    { casilla = "iva.repercutido.reducido" },
    { casilla = "iva.repercutido.super-reducido" },
    { casilla = "iva.autorepercutido.intracomunitaria" },
] }
rounding = "money-2"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-90", "ley-37-1992:art-91", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "boe-modelo-303-2008-form"]

[[revisions."2009-y-siguientes".formulas.source_citations]]
source_ref = "boe-modelo-303-2008-form"
required_text = ["modelo 303"]

[[revisions."2009-y-siguientes".formulas]]
id = "modelo-303-iva-cuota-deducible-total"
target = "iva.cuota-deducible-total"
expression = { op = "add", args = [
    { casilla = "iva.soportado.interiores" },
    { casilla = "iva.autorepercutido.intracomunitaria" },
] }
rounding = "money-2"
legal_refs = ["ley-37-1992:art-92", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "boe-modelo-303-2008-form"]

[[revisions."2009-y-siguientes".formulas.source_citations]]
source_ref = "boe-modelo-303-2008-form"
required_text = ["modelo 303"]

[[revisions."2009-y-siguientes".formulas]]
id = "modelo-303-iva-resultado-regimen-general"
target = "iva.resultado-regimen-general"
expression = { op = "subtract", args = [
    { casilla = "iva.cuota-devengada-total" },
    { casilla = "iva.cuota-deducible-total" },
] }
rounding = "money-2"
legal_refs = ["ley-37-1992:art-88", "ley-37-1992:art-92", "orden-eha-3786-2008:art-1"]
source_refs = ["aeat-dr-303-2025", "boe-modelo-303-2008-form"]

[[revisions."2009-y-siguientes".formulas.source_citations]]
source_ref = "boe-modelo-303-2008-form"
required_text = ["modelo 303"]

