# -----------------------------------------------------------------------------
# Demonstrator ledger_iva_aggregation bindings — same pattern as Modelo 303
# applied to Modelo 322 (IVA grupos individual mensual). Each binding selects
# substrate-classified ledger lines for the IVA flow (repercutido / soportado /
# autorepercutido) for the individual group member's cuota.
# -----------------------------------------------------------------------------

