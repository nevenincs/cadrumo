# Demonstrator ledger_iva_aggregation bindings for the non-periodic IVA
# triggers covered by Modelo 309. The autorepercutido binding covers
# intra-community acquisitions of medios de transporte nuevos and similar
# triggers; the soportado binding covers recargo-de-equivalencia retailers
# claiming devolución on traveler exports.

[[revisions."2004-y-siguientes".bindings]]
id = "modelo-309-iva-autorepercutido-intracomunitaria-cuota"
source = "ledger_iva_aggregation"
selector = { categories = ["intra_community_acquisition_reverse_charge"], rate_kinds = ["general", "reduced", "super_reduced"], flow_direction = "autorepercutido", fact = "iva_amount_sum" }
aggregation = { op = "sum" }
legal_refs = ["ley-37-1992:art-84", "orden-hac-3625-2003:apartado-1"]
source_refs = ["aeat-dr-309-2023", "aeat-modelo-309-procedure", "boe-modelo-309-2003-form"]

