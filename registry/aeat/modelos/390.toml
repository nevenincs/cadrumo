# Demonstrator ledger_iva_aggregation bindings — annual resumen aggregating
# the same flow categories as Modelo 303 over the full ejercicio. The
# substrate's IVA classification triple lets 390 recompute from the ledger
# directly; a complementary previous_filing dependency on 303 follows in
# a subsequent slice once 303 declares result-casillas.

[[revisions."2010-y-siguientes".bindings]]
id = "modelo-390-iva-repercutido-general-cuota"
source = "ledger_iva_aggregation"
selector = { categories = ["domestic_general_21"], rate_kinds = ["general"], flow_direction = "repercutido", fact = "iva_amount_sum" }
aggregation = { op = "sum" }
legal_refs = ["ley-37-1992:art-88", "orden-eha-3111-2009:art-1"]
source_refs = ["aeat-dr-390-2025", "aeat-modelo-390-procedure", "boe-modelo-390-2009-form"]

