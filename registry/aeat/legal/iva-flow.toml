notes = "LIVA art 88: repercusion del impuesto. Establece la obligacion del sujeto pasivo de repercutir integramente el importe del IVA sobre el destinatario de la operacion gravada, quedando este obligado a soportarlo. Es la base legal del flujo IVA repercutido."
required_text = [
    "Repercusión del impuesto",
    "deberán repercutir íntegramente el importe del impuesto",
    "obligado a soportarlo",
]

