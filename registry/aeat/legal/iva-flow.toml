notes = "LIVA art 92: cuotas tributarias deducibles. Establece el derecho del sujeto pasivo a deducir las cuotas del IVA devengadas por las operaciones que ha soportado por repercusion directa o por las operaciones equivalentes (importaciones, adquisiciones intracomunitarias, autorepercusion). Es la base legal del flujo IVA soportado y deducible."
required_text = [
    "Cuotas tributarias deducibles",
    "podrán deducir",
    "soportado por repercusión directa",
]
